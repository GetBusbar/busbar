# cargo-deny policy for busbar. Run locally with `cargo deny check`; in CI ModernCI runs it on every
# move into predev (the `deny` check of .ci/default.yaml). This file mechanically enforces the
# supply-chain discipline that Cargo.toml already applies by hand (single TLS/HTTP
# stack, no unmaintained/unsafe deps, license hygiene) so a future PR cannot
# silently regress it.

[advisories]
# RustSec advisory DB: fail on any crate in Cargo.lock with a known vulnerability.
# `yanked` deps are also flagged. Add specific advisory IDs to `ignore` ONLY with a
# written justification and a tracking link — never blanket-ignore.
version = 2
ignore = [
    # Empty. RUSTSEC-2024-0436 (`paste`, via tikv-jemalloc-ctl) and RUSTSEC-2024-0449
    # (`unsafe-libyaml`, via serde_yaml_ng) were accepted here until both crates left the graph:
    # busbar-kernel's `mallctl` calls jemalloc directly, and YAML is busbar-yaml. The bans below keep
    # them out.
]

[licenses]
# busbar is Apache-2.0; only allow licenses compatible with redistributing
# under that. SPDX identifiers. A dependency under anything not listed fails the
# build, forcing a conscious decision rather than an accidental license violation.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",                # Boost Software License (permissive); appears dual w/ Apache
    "CDLA-Permissive-2.0",    # Community Data License Agreement (permissive); single-licensed dep in tree
    "Unlicense",              # public-domain equivalent; appears dual w/ MIT
]
confidence-threshold = 0.9

[[licenses.exceptions]]
# busbar's own crate: pin the workspace member to its exact license so a future edit to
# Cargo.toml's `license` field fails the gate loudly instead of sliding through the general
# allow-list. Must be the EXACT SPDX string in Cargo.toml (`Apache-2.0`), or the exception is
# silently skipped.
name = "busbar"
allow = ["Apache-2.0"]

[bans]
# Enforce the "single stack" goal documented throughout Cargo.toml: a second version of a crate
# (two reqwest majors, two RustCrypto lines, two base64s) bloats the binary and doubles the audit
# surface, so a NEW duplicate fails. The ones that cannot collapse today are listed in `skip`,
# each with the parent that forces it.
multiple-versions = "deny"
# A crate pulled in via wildcard (`*`) version is unpinnable and a supply-chain risk.
wildcards = "deny"
# ...but the workspace's OWN member crates (busbar-kernel, busbar-contract, …) are
# path dependencies with no version — that isn't a supply-chain wildcard, it's the workspace
# referencing itself. Allow those; external wildcards are still denied.
allow-wildcard-paths = true
# ONE protocol = ONE library, ONE crypto backend = ring (BUSBAR-1.6.0.md, Libraries): the stacks
# busbar does NOT use, named so a dependency that drags one in fails here instead of landing.
deny = [
    { crate = "openssl", reason = "TLS is rustls; no OpenSSL" },
    { crate = "openssl-sys", reason = "TLS is rustls; no OpenSSL (C)" },
    { crate = "native-tls", reason = "TLS is rustls; no platform TLS" },
    { crate = "aws-lc-rs", reason = "ONE crypto backend = ring" },
    # cargo-deny matches `name@version` as an exact or PARTIAL version (`0` = every 0.x), not a
    # range, so the older lines are listed one by one.
    { crate = "hyper@0", reason = "HTTP is hyper 1" },
    { crate = "rustls@0.20", reason = "TLS is rustls 0.23" },
    { crate = "rustls@0.21", reason = "TLS is rustls 0.23" },
    { crate = "rustls@0.22", reason = "TLS is rustls 0.23" },
    { crate = "ring@0.16", reason = "the crypto backend is ring 0.17" },
    { crate = "serde_yaml", reason = "unmaintained; YAML is busbar-yaml" },
    { crate = "serde_yaml_ng", reason = "rests on unsafe-libyaml; YAML is busbar-yaml" },
    { crate = "unsafe-libyaml", reason = "unmaintained C translation (RUSTSEC-2024-0449); YAML is busbar-yaml's safe port of libyaml" },
    { crate = "tikv-jemalloc-ctl", reason = "pulls unmaintained `paste`; jemalloc control is busbar-kernel's `mallctl`" },
    { crate = "paste", reason = "unmaintained (RUSTSEC-2024-0436)" },
    # ONE Ed25519 = ed25519-dalek 3 (ARCHITECT ruling 2026-10-02, DEPS-AUDIT cut #9 REFUSED; moved
    # from 2 to 3 so der 0.7 and pkcs8 0.10 leave the graph). Plugin signatures, the audit-chain
    # seal, token and card signing and the operator signature verify through dalek's
    # `verify_strict`, which refuses small-order keys and signatures. ring has no such check, and
    # ring plus a hand-written weak-key blocklist would be home-made crypto in a security-critical
    # verifier; five crates do not pay for that, nor for churning the
    # plugin-facing `busbar_plugin_loader::sign::{SigningKey, VerifyingKey}`. So dalek stays, at ONE
    # version (3.x; `multiple-versions = "deny"` refuses a second), busbar code never calls
    # ring's Ed25519, and no other Ed25519 crate may enter.
    { crate = "ed25519-dalek@2", reason = "ONE Ed25519: ed25519-dalek 3" },
    { crate = "ed25519-dalek@1", reason = "ONE Ed25519: ed25519-dalek 3" },
    { crate = "ed25519-dalek@0", reason = "ONE Ed25519: ed25519-dalek 3" },
    { crate = "ed25519-compact", reason = "ONE Ed25519: ed25519-dalek 3" },
    { crate = "ed25519-zebra", reason = "ONE Ed25519: ed25519-dalek 3" },
    { crate = "ed25519-consensus", reason = "ONE Ed25519: ed25519-dalek 3" },
]
# THE ACCEPTED DUPLICATES: each version here is one a parent forces and busbar cannot collapse.
skip = [
    { crate = "getrandom@0.2", reason = "ring 0.17 pins getrandom 0.2" },
    { crate = "getrandom@0.4", reason = "rand, quinn-proto and tempfile (build) are on getrandom 0.4" },
    { crate = "r-efi@5", reason = "follows getrandom 0.3; UEFI only, never built on linux/macOS" },
    { crate = "windows-sys@0.52", reason = "follows ring's getrandom 0.2; windows only" },
    { crate = "syn@2", reason = "compile time only; the ecosystem is mid-migration to syn 3" },
    { crate = "hashbrown@0.15", reason = "petgraph (prost-build), build time only" },
    { crate = "hashbrown@0.16", reason = "metrics-util (metrics-exporter-prometheus)" },
    { crate = "foldhash@0.1", reason = "follows hashbrown 0.15 (petgraph, build time only)" },
    { crate = "rand_core@0.10", reason = "rand 0.10 via chacha20, forced by busbar-store-postgres's postgres-protocol; dist/default only" },
    # The RustCrypto 0.11 hash line. ed25519-dalek 3 (and, in dist/default, postgres-types) hash on
    # sha2 0.11, while oauth-as 1.0.1, the busbar-auth-oauth plugin and the workspace's own sha2
    # rows are still on 0.10, so neither line can collapse until those move.
    { crate = "sha2@0.11", reason = "ed25519-dalek 3 (and postgres-types, dist/default) on sha2 0.11; oauth-as 1.0.1 and busbar-auth-oauth pin 0.10" },
    { crate = "digest@0.11", reason = "follows sha2 0.11 (ed25519-dalek 3, postgres-types)" },
    { crate = "block-buffer@0.12", reason = "follows digest 0.11 (ed25519-dalek 3, postgres-types)" },
    { crate = "crypto-common@0.2", reason = "follows digest 0.11 (ed25519-dalek 3, postgres-types)" },
    { crate = "cpufeatures@0.3", reason = "sha2 0.11 and curve25519-dalek 5 (ed25519-dalek 3), chacha20 0.10 in dist/default" },
    { crate = "base64@0.23", reason = "pem 4 via rcgen's `pem` feature, which only the tests enable" },
]

[sources]
# Only allow crates from crates.io. A dependency sourced from an arbitrary git repo
# or a private registry bypasses crates.io's (limited) protections and the advisory
# DB — block it so any such addition is an explicit, reviewed allow-list entry.
unknown-registry = "deny"
unknown-git = "deny"
# All authorized Git dependencies must still name an immutable revision.
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The default plugins busbar pulls from their own repos at a PINNED rev (owner ruling, 1.6.0: one
# repo per plugin). Each is a reviewed entry, one URL per plugin repo.
allow-git = [
    "https://github.com/MattJackson/aws-lc-sys",
    "https://github.com/GetBusbar/busbar-plane-llm",
    "https://github.com/GetBusbar/busbar-export-file",
    "https://github.com/GetBusbar/busbar-export-otlp",
    "https://github.com/GetBusbar/busbar-export-prometheus",
    "https://github.com/GetBusbar/busbar-export-webhook",
    "https://github.com/GetBusbar/busbar-auth-oidc",
    "https://github.com/GetBusbar/busbar-auth-admin-tokens",
    "https://github.com/GetBusbar/busbar-transport-ws",
    "https://github.com/GetBusbar/busbar-secret-env",
    "https://github.com/GetBusbar/busbar-secret-file",
    "https://github.com/GetBusbar/busbar-transport-tcp",
    "https://github.com/GetBusbar/busbar-transport-stdio",
    "https://github.com/GetBusbar/busbar-transport-webrtc",
    "https://github.com/GetBusbar/busbar-transport-http",
    "https://github.com/GetBusbar/busbar-hook-ranking",
    "https://github.com/GetBusbar/busbar-hook-complexity",
    "https://github.com/GetBusbar/busbar-store-memory",
    "https://github.com/GetBusbar/busbar-plane-mcp",
    "https://github.com/GetBusbar/busbar-plane-decisions",
    "https://github.com/GetBusbar/busbar-plane-a2a",
    "https://github.com/GetBusbar/busbar-plane-streaming",
    "https://github.com/GetBusbar/busbar-auth-header",
    "https://github.com/GetBusbar/busbar-auth-oauth",
    "https://github.com/GetBusbar/busbar-auth-sigv4",
    "https://github.com/GetBusbar/busbar-auth-webhook-signature",
    "https://github.com/GetBusbar/busbar-transport-grpc",
    "https://github.com/GetBusbar/busbar-hook-webrequest",
    "https://github.com/GetBusbar/busbar-store-sqlite",
    "https://github.com/GetBusbar/busbar-store-postgres",
    # Authorized release-line fixes; exact revisions remain in root/dist manifests and locks.
    # h2 d6146a5c425e55653cdfebc5660e52d87430c588 (upstream hyperium/h2#996).
    "https://github.com/MattJackson/h2",
    # tungstenite 893a21f1f98011a2665840231330c473836c9a0a (1014 fix plus streaming diagnostic formatting).
    "https://github.com/MattJackson/tungstenite-rs",
    "https://github.com/MattJackson/jobserver-rs",
    "https://github.com/MattJackson/rust-stringprep",
    "https://github.com/MattJackson/dunce",
    "https://github.com/MattJackson/fs_extra",
]
