# cargo-deny policy for busbar. Run locally with `cargo deny check`; in CI ModernCI runs it on every
# move into predev (the `deny` check of .ci/default.yaml). This file mechanically enforces the
# supply-chain discipline that Cargo.toml already applies by hand (single TLS/HTTP
# stack, no unmaintained/unsafe deps, license hygiene) so a future PR cannot
# silently regress it.

[advisories]
# RustSec advisory DB: fail on any crate in Cargo.lock with a known vulnerability.
# `yanked` deps are also flagged. Add specific advisory IDs to `ignore` ONLY with a
# written justification and a tracking link — never blanket-ignore.
version = 2
ignore = [
    # Empty. RUSTSEC-2024-0436 (`paste`, via tikv-jemalloc-ctl) and RUSTSEC-2024-0449
    # (`unsafe-libyaml`, via serde_yaml_ng) were accepted here until both crates left the graph:
    # busbar-kernel's `mallctl` calls jemalloc directly, and YAML is serde-saphyr (forbid(unsafe_code),
    # no advisory). The bans below keep them out.
]

[licenses]
# busbar is Apache-2.0; only allow licenses compatible with redistributing
# under that. SPDX identifiers. A dependency under anything not listed fails the
# build, forcing a conscious decision rather than an accidental license violation.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",                # Boost Software License (permissive); appears dual w/ Apache
    "CDLA-Permissive-2.0",    # Community Data License Agreement (permissive); single-licensed dep in tree
    "Unlicense",              # public-domain equivalent; appears dual w/ MIT
]
confidence-threshold = 0.9

[[licenses.exceptions]]
# busbar's own crate: pin the workspace member to its exact license so a future edit to
# Cargo.toml's `license` field fails the gate loudly instead of sliding through the general
# allow-list. Must be the EXACT SPDX string in Cargo.toml (`Apache-2.0`), or the exception is
# silently skipped.
name = "busbar"
allow = ["Apache-2.0"]

[bans]
# Enforce the "single stack" goal documented throughout Cargo.toml: a second version of a crate
# (two reqwest majors, two RustCrypto lines, two base64s) bloats the binary and doubles the audit
# surface, so a NEW duplicate fails. The ones that cannot collapse today are listed in `skip`,
# each with the parent that forces it.
multiple-versions = "deny"
# A crate pulled in via wildcard (`*`) version is unpinnable and a supply-chain risk.
wildcards = "deny"
# ...but the workspace's OWN member crates (busbar-kernel, busbar-contract, …) are
# path dependencies with no version — that isn't a supply-chain wildcard, it's the workspace
# referencing itself. Allow those; external wildcards are still denied.
allow-wildcard-paths = true
# ONE protocol = ONE library, ONE crypto provider = AWS-LC (BUSBAR-1.6.0.md, Libraries; 229): the stacks
# busbar does NOT use, named so a dependency that drags one in fails here instead of landing.
deny = [
    # Stacks busbar does not use (kept from before the crypto seam; cargo-deny matches `name@version`
    # as an exact or PARTIAL version, so older lines are listed one by one).
    # THE ONE LOAD CHOKEPOINT (LINT-RULES R23, ABI-DECISION §3.1): a dynamic library is loaded only
    # by busbar-plugin-loader's `stage` (memfd staging, the native load guard), so libloading is the
    # loader's alone, and no other dlopen crate may enter the graph.
    { crate = "libloading", wrappers = ["busbar-plugin-loader"], reason = "dynamic libraries load only through busbar-plugin-loader's stage" },
    { crate = "dlopen", reason = "dynamic libraries load only through busbar-plugin-loader's stage" },
    { crate = "dlopen2", reason = "dynamic libraries load only through busbar-plugin-loader's stage" },
    { crate = "sharedlib", reason = "dynamic libraries load only through busbar-plugin-loader's stage" },
    { crate = "shared_library", reason = "dynamic libraries load only through busbar-plugin-loader's stage" },
    { crate = "hyper@0", reason = "HTTP is hyper 1" },
    { crate = "rustls@0.20", reason = "TLS is rustls 0.23" },
    { crate = "rustls@0.21", reason = "TLS is rustls 0.23" },
    { crate = "rustls@0.22", reason = "TLS is rustls 0.23" },
    { crate = "ring@0.16", reason = "the crypto backend is ring 0.17" },
    { crate = "serde_yaml", reason = "unmaintained; YAML is serde-saphyr through busbar_contract::yaml" },
    { crate = "serde_yaml_ng", reason = "rests on unsafe-libyaml; YAML is serde-saphyr through busbar_contract::yaml" },
    { crate = "unsafe-libyaml", reason = "unmaintained C translation (RUSTSEC-2024-0449); YAML is serde-saphyr through busbar_contract::yaml" },
    { crate = "yaml_serde", reason = "rests on libyaml-rs, a c2rust translation; YAML is serde-saphyr through busbar_contract::yaml" },
    { crate = "libyaml-rs", reason = "c2rust translation of libyaml (renamed unsafe-libyaml); YAML is serde-saphyr through busbar_contract::yaml" },
    { crate = "tikv-jemalloc-ctl", reason = "pulls unmaintained `paste`; jemalloc control is busbar-kernel's `mallctl`" },
    { crate = "paste", reason = "unmaintained (RUSTSEC-2024-0436)" },
    # THE CRYPTO SEAM (CRYPTO-SEAM r15 §2.7, decisions 210, 224, 229): one backend, reached only through
    # the facade; AWS-LC (aws-lc-rs) is the one provider. Wrappers are the third-party parents allowed
    # to carry a banned crate. Not yet on: `ring` (busbar-auth-oauth, -oidc, -sigv4 and
    # -transport-webrtc still name it, #173; dist/default has no deny.toml of its own and reads this
    # one; core's own graph builds no ring, held by tools/ci-checks crypto-graph), `aes`/`cipher`
    # (transport-webrtc), `sha2` (busbar-auth-oauth) and `getrandom`/`rand_core` (busbar-store-memory,
    # -postgres, -sqlite): core is clean since oauth-as 1.1 (decision 228), these plugins move in §8 5-7.
    { crate = "aws-lc-rs", wrappers = ["busbar-crypto-backend", "quinn-proto", "rcgen", "rustls", "rustls-webpki", "x509-parser"], reason = "AWS-LC only through the crypto backend" },
    { crate = "aws-lc-sys", wrappers = ["busbar-crypto-backend", "aws-lc-rs"], reason = "AWS-LC only through the crypto backend" },
    { crate = "aws-lc-fips-sys", wrappers = ["aws-lc-rs"], reason = "the private FIPS build only" },
    { crate = "blake3", wrappers = ["busbar-crypto-backend"], reason = "the audit link hash belongs to the crypto backend" },
    { crate = "ed25519-dalek", wrappers = ["busbar-crypto-backend"], reason = "Ed25519 is AWS-LC's, through the facade" },
    { crate = "ed25519", wrappers = ["busbar-crypto-backend", "ed25519-dalek"], reason = "Ed25519 is AWS-LC's, through the facade" },
    { crate = "curve25519-dalek", wrappers = ["busbar-crypto-backend", "ed25519-dalek"], reason = "Ed25519 is AWS-LC's, through the facade" },
    { crate = "rcgen", wrappers = ["busbar-crypto-backend"], reason = "certificates are minted by the crypto backend" },
    { crate = "x509-parser", wrappers = ["busbar-crypto-backend", "rcgen"], reason = "only rcgen's verifier carries it" },
    { crate = "der-parser", wrappers = ["x509-parser"], reason = "only x509-parser carries it" },
    { crate = "num-bigint", wrappers = ["der-parser", "num", "num-rational"], reason = "no bignum outside protocol parsers (224: BigUint RSA-OAEP deleted)" },
    { crate = "num", wrappers = ["fraction"], reason = "jsonschema's number type only" },
    { crate = "num-rational", wrappers = ["num"], reason = "jsonschema's number type only" },
    { crate = "fraction", wrappers = ["jsonschema", "jsonschema-value"], reason = "jsonschema's number type only" },
    { crate = "sha1", wrappers = ["tungstenite"], reason = "SHA-1 is the facade's legacy::sha1" },
    { crate = "md-5", wrappers = ["postgres-protocol"], reason = "MD5 is the facade's legacy::md5" },
    { crate = "hmac", wrappers = ["postgres-protocol"], reason = "HMAC is the facade's" },
    { crate = "digest", wrappers = ["curve25519-dalek", "hmac", "md-5", "sha1", "sha2"], reason = "any new RustCrypto hash/MAC depends on it" },
    { crate = "signature", wrappers = ["ed25519"], reason = "any new RustCrypto signature crate depends on it" },
    { crate = "rand", wrappers = ["busbar-crypto-backend", "dimpl", "metrics-util", "opentelemetry_sdk", "postgres-protocol", "quinn-proto", "sctp-proto", "tungstenite"], reason = "randomness is the facade's fill" },
    { crate = "rand_chacha", wrappers = ["busbar-crypto-backend", "rand"], reason = "randomness is the facade's fill" },
    { crate = "rand_xoshiro", wrappers = ["metrics-util"], reason = "randomness is the facade's fill" },
    { crate = "rand_pcg", wrappers = ["quinn-proto"], reason = "randomness is the facade's fill" },
    { crate = "chacha20", wrappers = ["busbar-crypto-backend", "rand"], reason = "randomness is the facade's fill" },
    { crate = "hyper-rustls", wrappers = ["reqwest"], reason = "TLS configs come from crypto::tls" },
    { crate = "quinn", wrappers = ["reqwest"], reason = "no HTTP/3" },
    { crate = "quinn-proto", wrappers = ["quinn"], reason = "no HTTP/3" },
    { crate = "dimpl", wrappers = ["busbar-crypto", "busbar-crypto-backend", "busbar-core-connector", "str0m", "str0m-proto"], reason = "the DTLS provider is the crypto backend's" },
    { crate = "busbar-crypto-backend", wrappers = ["busbar-crypto"], reason = "the backend is reached only through the facade" },
    { crate = "busbar-crypto-backend", deny-multiple-versions = true, reason = "one backend per graph" },
    { crate = "busbar-crypto", wrappers = ["busbar-contract"], reason = "every crate reaches the facade as busbar_contract::crypto" },
    { crate = "busbar-crypto", deny-multiple-versions = true, reason = "one facade per graph" },
    # Never in any graph: C-backed crypto, other Ed25519s, other RustCrypto algorithms, other str0m providers.
    { crate = "openssl", reason = "TLS is rustls; no OpenSSL" },
    { crate = "openssl-sys", reason = "TLS is rustls; no OpenSSL (C)" },
    { crate = "native-tls", reason = "TLS is rustls; no platform TLS" },
    { crate = "boring" }, { crate = "boring-sys" }, { crate = "libsodium-sys" }, { crate = "sodiumoxide" },
    { crate = "ring@0.16", reason = "the crypto provider is AWS-LC" },
    { crate = "ed25519-dalek@0" }, { crate = "ed25519-dalek@1" }, { crate = "ed25519-dalek@2" },
    { crate = "ed25519-compact" }, { crate = "ed25519-zebra" }, { crate = "ed25519-consensus" },
    { crate = "p256" }, { crate = "p384" }, { crate = "rsa" }, { crate = "aes-gcm" }, { crate = "chacha20poly1305" },
    { crate = "hkdf" }, { crate = "pbkdf2" }, { crate = "x25519-dalek" }, { crate = "aead" }, { crate = "universal-hash" },
    { crate = "elliptic-curve" }, { crate = "sha3" }, { crate = "md5" },
    { crate = "str0m-aws-lc-rs" }, { crate = "str0m-rust-crypto" }, { crate = "str0m-openssl" },
    { crate = "str0m-apple-crypto" }, { crate = "str0m-wincrypto" },
]
features = [
    { crate = "reqwest", deny = ["http3", "native-tls", "default-tls"] },
]
# THE ACCEPTED DUPLICATES: each version here is one a parent forces and busbar cannot collapse.
skip = [
    { crate = "getrandom@0.2", reason = "ring 0.17 pins getrandom 0.2" },
    { crate = "getrandom@0.4", reason = "rand, quinn-proto and tempfile (build) are on getrandom 0.4" },
    { crate = "r-efi@5", reason = "follows getrandom 0.3; UEFI only, never built on linux/macOS" },
    { crate = "windows-sys@0.52", reason = "follows ring's getrandom 0.2; windows only" },
    { crate = "syn@2", reason = "compile time only; the ecosystem is mid-migration to syn 3" },
    { crate = "hashbrown@0.15", reason = "petgraph (prost-build), build time only" },
    { crate = "hashbrown@0.16", reason = "metrics-util (the kernel's recency metrics registry)" },
    { crate = "foldhash@0.1", reason = "follows hashbrown 0.15 (petgraph, build time only)" },
    { crate = "rand_core@0.10", reason = "rand 0.10 via chacha20, forced by busbar-store-postgres's postgres-protocol; dist/default only" },
    # The RustCrypto 0.11 hash line. ed25519-dalek 3 (and, in dist/default, postgres-types) hash on
    # sha2 0.11, while oauth-as 1.0.1, the busbar-auth-oauth plugin and the workspace's own sha2
    # rows are still on 0.10, so neither line can collapse until those move.
    { crate = "sha2@0.11", reason = "ed25519-dalek 3 (and postgres-types, dist/default) on sha2 0.11; oauth-as 1.0.1 and busbar-auth-oauth pin 0.10" },
    { crate = "digest@0.11", reason = "follows sha2 0.11 (ed25519-dalek 3, postgres-types)" },
    { crate = "block-buffer@0.12", reason = "follows digest 0.11 (ed25519-dalek 3, postgres-types)" },
    { crate = "crypto-common@0.2", reason = "follows digest 0.11 (ed25519-dalek 3, postgres-types)" },
    { crate = "cpufeatures@0.3", reason = "sha2 0.11 and curve25519-dalek 5 (ed25519-dalek 3), chacha20 0.10 in dist/default" },
    { crate = "base64@0.23", reason = "pem 4 via rcgen's `pem` feature, which only the tests enable" },
]

[sources]
# Only allow crates from crates.io. A dependency sourced from an arbitrary git repo
# or a private registry bypasses crates.io's (limited) protections and the advisory
# DB — block it so any such addition is an explicit, reviewed allow-list entry.
unknown-registry = "deny"
unknown-git = "deny"
# All authorized Git dependencies must still name an immutable revision.
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The default plugins busbar pulls from their own repos at a PINNED rev (owner ruling, 1.6.0: one
# repo per plugin). Each is a reviewed entry, one URL per plugin repo.
allow-git = [
    "https://github.com/MattJackson/aws-lc-sys",
    "https://github.com/GetBusbar/busbar-plane-llm",
    "https://github.com/GetBusbar/busbar-export-file",
    "https://github.com/GetBusbar/busbar-export-otlp",
    "https://github.com/GetBusbar/busbar-export-prometheus",
    "https://github.com/GetBusbar/busbar-export-webhook",
    "https://github.com/GetBusbar/busbar-auth-oidc",
    "https://github.com/GetBusbar/busbar-auth-admin-tokens",
    "https://github.com/GetBusbar/busbar-transport-ws",
    "https://github.com/GetBusbar/busbar-secret-env",
    "https://github.com/GetBusbar/busbar-secret-file",
    "https://github.com/GetBusbar/busbar-transport-tcp",
    "https://github.com/GetBusbar/busbar-transport-stdio",
    "https://github.com/GetBusbar/busbar-transport-webrtc",
    "https://github.com/GetBusbar/busbar-transport-http",
    "https://github.com/GetBusbar/busbar-hook-ranking",
    "https://github.com/GetBusbar/busbar-hook-complexity",
    "https://github.com/GetBusbar/busbar-store-memory",
    "https://github.com/GetBusbar/busbar-plane-mcp",
    "https://github.com/GetBusbar/busbar-plane-decisions",
    "https://github.com/GetBusbar/busbar-plane-a2a",
    "https://github.com/GetBusbar/busbar-plane-streaming",
    "https://github.com/GetBusbar/busbar-auth-header",
    "https://github.com/GetBusbar/busbar-auth-oauth",
    "https://github.com/GetBusbar/busbar-auth-sigv4",
    "https://github.com/GetBusbar/busbar-auth-webhook-signature",
    "https://github.com/GetBusbar/busbar-transport-grpc",
    "https://github.com/GetBusbar/busbar-hook-webrequest",
    "https://github.com/GetBusbar/busbar-store-sqlite",
    "https://github.com/GetBusbar/busbar-store-postgres",
    # Authorized release-line fixes; exact revisions remain in root/dist manifests and locks.
    # h2 d6146a5c425e55653cdfebc5660e52d87430c588 (upstream hyperium/h2#996).
    "https://github.com/MattJackson/h2",
    # tungstenite 893a21f1f98011a2665840231330c473836c9a0a (1014 fix plus streaming diagnostic formatting).
    "https://github.com/MattJackson/tungstenite-rs",
    "https://github.com/MattJackson/jobserver-rs",
    "https://github.com/MattJackson/rust-stringprep",
    "https://github.com/MattJackson/dunce",
    "https://github.com/MattJackson/fs_extra",
    # YAML: busbar's opt-in serde_yaml-compatibility patches, offered upstream; exact revisions in
    # the root/dist [patch.crates-io] rows and locks.
    "https://github.com/MattJackson/serde-saphyr",
    "https://github.com/MattJackson/granit-parser",
]
