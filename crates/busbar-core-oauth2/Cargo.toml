[package]
name = "busbar-core-oauth2"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar OAuth 2.1 authorization-server plane (`oauth_as:`), off unless configured. Depends one-way on busbar-core."
license = "Apache-2.0"

[lib]
name = "busbar_core_oauth2"
path = "src/lib.rs"

[dependencies]
busbar-kernel = { path = "../busbar-kernel", default-features = false }
busbar-contract = { path = "../busbar-contract" }
axum = { workspace = true }
base64 = { workspace = true }
ring = { workspace = true }
oauth-as = { workspace = true }
psl = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
busbar-kernel = { path = "../busbar-kernel", default-features = false, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "test-util"] }
axum = { workspace = true, features = ["http1"] }
oauth-as = { workspace = true, features = ["test-util"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
futures = { workspace = true }
tracing-subscriber = { workspace = true }
