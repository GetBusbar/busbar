# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-secret-vault"
version = "1.5.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The HashiCorp Vault backend for busbar's kind:secret plugin — reads a field out of a Vault KV v2 secret over HTTP, authenticating with a pre-obtained X-Vault-Token. Implements busbar_api::SecretModule."
license = "Apache-2.0"

[dependencies]
busbar-api = { path = "../api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The SAME reqwest 0.12 major + blocking client shape busbar-auth-oidc's ReqwestFetcher uses (rustls/
# ring TLS, no second HTTP stack). Blocking because SecretModule::resolve is synchronous and runs at
# most once per reference at boot/config-apply — not on the request hot path.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }

[dev-dependencies]
# The real-Vault-gated integration test seeds a secret via a raw HTTP PUT to Vault's KV v2 write
# endpoint before reading it back through the real client — it needs a JSON body builder, already in
# [dependencies] via serde_json.
