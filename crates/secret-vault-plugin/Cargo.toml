# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-secret-vault-plugin"
version = "1.5.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The HashiCorp Vault secret backend as a droppable busbar plugin — a cdylib exporting the secret C ABI. Drop it in the plugins folder, add secrets.<alias>.settings: { addr, token }, and reference secrets as { module: <alias>, settings: { path: \"kv/data/name#field\" } }."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
busbar-api = { path = "../api" }
busbar-plugin-sdk = { path = "../plugin-sdk" }
busbar-secret-vault = { path = "../secret-vault" }
serde_json = "1"
