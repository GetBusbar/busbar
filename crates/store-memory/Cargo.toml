[package]
name = "busbar-store-memory"
version = "1.5.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The default in-memory (RAM) backend for busbar's durable governance store — ephemeral, zero-setup."
license = "Apache-2.0"

[dependencies]
# The record half of the store protocol. `busbar_contract::kinds::Store` declares `record_put`,
# `record_get` and `record_scan` for a plane's kernel-held durable records, and this backend answers
# them at the contract's own spelling. A plugin-kind crate may name the contract freely (the
# manifest allow-list's own rule), which is exactly why the record verbs are shaped against it and
# not against the kernel's sink trait — naming `busbar-kernel` here would be an automatic RED.
busbar-contract = { path = "../busbar-contract" }

[dev-dependencies]
# The `Store` contract conformance suite used to arrive here as `busbar-plugin-testkit`. The owner
# ruled that crate DELETED on 2026-09-22 and #2/#31 forbid a shared test util between plugins, so
# the suite now lives in this crate's own `tests/store_conformance.rs`. It serialises typed rows into
# the opaque `PlaneRecord` body exactly as core does, which is the whole of what it needs from serde;
# `busbar-contract` it already has as a normal dependency above.
#
# Core's own reference backend still runs the suite: if the reference implementation does not pass
# the checks the plugin backends are held to, the checks are wrong.
serde = { workspace = true }
serde_json = { workspace = true }
