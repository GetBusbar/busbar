# busbar-plane-voice — THE VOICE PLANE, as a CODEC and nothing else.
#
# WHAT THIS CRATE IS. One implementation of the plugin contract's plane kind (and its session
# extension) for busbar's duplex/live-voice surface (§6 of ARCHITECTURE.md): the openai-realtime,
# gemini-live, twilio-media-streams and one-shot transcribe/tts dialects, with a turn as the unit,
# a provider tool call as `Progress::OneShot`, an interrupt fact and a pacing fact. It calls
# `busbar-voice-codec`'s dialect codecs to read and write bytes; it invents no wire shape of its own.
#
# THE SEAM, STATED HONESTLY — AND CHECKED. This header used to say the crate depends on
# `busbar-voice`, twenty-five lines above a dependency comment saying it depends on
# `busbar-voice-codec`, NOT `busbar-voice`. The second one is the true one, and cargo agrees: adding
# the edge this header described is a dependency CYCLE, because `busbar-voice` depends on
# `busbar-plane-voice` and not the reverse. That inversion is the point — the retiring crate consumes
# this plane's `governed`/`tools` ports, which is what lets a pure kind stay pure while the legacy T2
# session runtime, the axum mount, the WebSocket accept and the telephony dial stay on the far side
# of it. `tests/dependency_seam.rs` pins the five direct edges below so this paragraph cannot drift
# again.
[package]
name = "busbar-plane-voice"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# One pinned number, set to what CI verifies — the same rationale every other member states.
rust-version = "1.97"
description = "The voice plane for busbar: the plugin contract's plane and session-plane kinds implemented as a thin codec over the busbar-voice dialect codecs."
license = "Apache-2.0"

[lib]
name = "busbar_plane_voice"
path = "src/lib.rs"

# NO FEATURES, ON PURPOSE. A plane compiled two ways is two planes, and the kernel would have no way
# to tell which one it registered. The contract crate holds itself to the same rule and asserts it.

[dependencies]
# THE CONTRACT. The one busbar crate a plugin manifest may name without argument.
busbar-contract = { path = "../busbar-contract" }
# THE CODECS. Read-only from here: this crate calls the dialect readers/writers and the IR types and
# edits none of them. `busbar-voice-codec`, NOT `busbar-voice`: the IR and the dialect grammars split
# out of the plugin so a PURE kind can name them, and the session runtime, the axum mount, the
# WebSocket accept, the telephony dial and the HTTPS minter stayed behind. The
# `default-features = false` that used to fence off the runtime feature is gone with the reason for
# it — the runtime is not in this crate's dependency at all now.
busbar-voice-codec = { path = "../busbar-voice-codec" }
# The object notation the dialect wire (OpenAI Realtime, Gemini Live) is written in. The adapter
# hands values across the seam and never invents a second parser.
serde_json = { workspace = true }
# THE MEDIA-FRAME CARRIER. `busbar_voice::ir::media::IrAudioFrame::media` and the tool IR's opaque
# payloads are `bytes::Bytes`; this crate reads and builds them at the same seam, so it names the
# same crate rather than converting through an owned `Vec<u8>` at the boundary.
bytes = { workspace = true }
# THE SERVER-SIDE TOOL EXECUTOR PORT's async signature. `ToolExecutor::execute` is an `async fn` in a
# trait object the session runtime shares across concurrent frame handlers, so the port is written on
# the same `#[async_trait]` desugaring it always was — the move is a MOVE, and rewriting the signature
# to a hand-rolled `Pin<Box<dyn Future>>` would change the item's shape crossing the boundary. On
# `qa/construction.toml`'s `manifest-allowlist.reviewed_allowlist`, so a pure kind may name it; it is a
# proc-macro that expands to `Box`ed futures and pulls no I/O into this crate's closure.
async-trait = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
