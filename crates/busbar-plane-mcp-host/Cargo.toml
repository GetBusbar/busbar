# busbar-plane-mcp-host — THE MCP PLANE'S IMPURE HOST CRATE.
#
# The fat `busbar-mcp` splits four ways (DECISIONS #19/#20/#21/#1): the pure codec
# (`busbar-mcp-codec`), the shared transport crates, the purity-scanned contract adapter
# (`busbar-plane-mcp`), and THIS crate — the impure, bridged-ABI host: the substrate `PlaneDecl`
# (`PLANE_DECL`), the runtime slot (`McpResource`/`McpRuntime`), `serve_stdio`, the plane test-kit,
# the plane-contributed DIAGNOSTICS and the engine glue. `busbar-mcp` the NAME ultimately drains into
# here and is deleted.
#
# THIS CELL SEEDS THE CRATE with the one byte-safe, non-money, cycle-free leaf: the MCP plane's own
# DIAGNOSTICS catalog. The remainder of the host surface (PLANE_DECL, McpResource, serve_stdio,
# testkit, config/callerask/envelope/admin_view) is a single strongly-connected component welded to
# the money files (`method.rs`, `sampling.rs`) and moves as one unit in the oracle-gated money cell —
# it cannot leave `busbar-mcp` byte-safely while those files stay. See that cell's report.
[package]
name = "busbar-plane-mcp-host"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# One pinned number, set to what CI verifies — the same rationale every other member states.
rust-version = "1.97"
description = "The MCP plane's impure host crate: the substrate PlaneDecl, the runtime slot, serve_stdio, the plane test-kit, the plane-contributed diagnostics and the engine glue. busbar-mcp drains into here."
license = "Apache-2.0"

[lib]
name = "busbar_plane_mcp_host"
path = "src/lib.rs"

[dependencies]
# The neutral shared surface — the diagnostics catalog types (`Class`/`Diagnostic`/`Severity`) and
# the catalog install/render seams the plane-contributed `DIAGNOSTICS` slice is handed to at boot.
busbar-substrate = { path = "../busbar-substrate" }
