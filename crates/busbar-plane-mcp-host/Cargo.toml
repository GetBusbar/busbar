# busbar-plane-mcp-host — THE MCP PLANE'S IMPURE HOST CRATE.
#
# The fat `busbar-mcp` splits four ways (DECISIONS #19/#20/#21/#1): the pure codec
# (`busbar-mcp-codec`), the shared transport crates, the purity-scanned contract adapter
# (`busbar-plane-mcp`), and THIS crate — the impure, bridged-ABI host: the substrate `PlaneDecl`
# (`PLANE_DECL`), the runtime slot (`McpResource`/`McpRuntime`), `serve_stdio`, the plane test-kit,
# the plane-contributed DIAGNOSTICS and the engine glue. `busbar-mcp` the NAME is now a thin
# re-export shim over this crate; it is deleted once every caller repoints here directly.
#
# THE WHOLE MCP PLANE LIVES HERE. The oracle-gated money cell moved the plane's single
# strongly-connected component — `PLANE_DECL`, `McpResource`/`McpRuntime`, `serve_stdio`, the
# testkit and the `config`/`callerask`/`envelope`/`admin_view`/`method`/`sampling` modules — down as
# one unit (it is welded to the money files and cannot leave `busbar-mcp` piecemeal byte-safely), so
# this manifest carries the plane's full runtime surface. `busbar-mcp`'s prior manifest drained here
# verbatim; the only edits are the crate name, dropping the self-referential dependency on this crate
# (the diagnostics leaf now lives here) and keeping the `busbar-mcp-codec` edge the plane's modules
# name for `crate::codec` / `crate::record` / `crate::PROTO_DECL`.
[package]
name = "busbar-plane-mcp-host"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# `rust-version` rationale: see busbar-core/Cargo.toml — one pinned number, set to what CI verifies.
rust-version = "1.97"
description = "The MCP plane's impure host crate: the substrate PlaneDecl, the runtime slot, serve_stdio, the plane test-kit, the plane-contributed diagnostics, the money files and the engine glue. busbar-mcp is a re-export shim over this crate."
license = "Apache-2.0"

[lib]
name = "busbar_plane_mcp_host"
path = "src/lib.rs"

[dependencies]
# THE SEAL (1.6.0): busbar-core is no longer a PRODUCTION dependency of this plugin. The default
# build compiles with NO busbar-core in its closure — every former `busbar_core::` reach is served by
# the neutral substrate (the approvals seal, the config split, the hostless-egress seam) or gated to
# the dual-compile/test-support surface. busbar-core stays an OPTIONAL dep, pulled ONLY by the
# `test-support` feature, for ONE reason: the plane's test binary binds the engine's test kit in a
# single function (`src/mcp/tests/engine.rs`, the only `busbar_core::` line in the test tree). Every
# test reaches the engine through the neutral `busbar_substrate::testkit::engine_kit` seam from there,
# so retargeting the tests at a different engine — or dropping this edge for a dev-dependency once the
# weak `auth-admin-tokens` forward below no longer needs an optional dep to hang off — is a change to
# that one function and this manifest, not to the tests. (Optional rather than a dev-dependency today
# because a feature cannot reference a dev-dep-only crate.)
busbar-core = { path = "../busbar-core", default-features = false, features = ["plane-mcp"], optional = true }
# The substrate crate: the neutral shared surface the plugin names instead of busbar-core — the
# diagnostics macros, the approvals seal, the config-section split, the hostless-egress seam. Carries
# `plane-mcp` so the plane-gated items (the `HostlessEgress` seam, the relocated leaves) are present
# in this crate's own default build.
busbar-substrate = { path = "../busbar-substrate", features = ["plane-mcp"] }
# THE CODEC. The pure half of this plugin, split out so `busbar-plane-mcp` can name the protocol
# declaration, the JSON-RPC dialect, the two operation cells and the record vocabulary without
# pulling this crate's axum routes, stdio serve loop and tokio transports into a pure kind's
# closure. Every module that moved is re-exported from this crate's `lib.rs` under its old name.
busbar-mcp-codec = { path = "../busbar-mcp-codec" }
# The plugin contracts crate, named ahead of use per owner ruling R-E (see header).
busbar-api = { path = "../api" }
# The specification authors' own crate, pinned narrow (see busbar-core/Cargo.toml's rationale): the
# codec takes the protocol VOCABULARY — MCP method names and parameter shapes — from it and nothing
# else, so a name the SDK retires stops compiling here instead of being served.
rmcp = { workspace = true }
# The plane's own runtime surface — the same workspace pins core takes, for the plane code that moved
# here whole: the client pool and transports (tokio, reqwest, futures), the config codecs (serde,
# serde_yaml, indexmap), the seal/digest crypto (sha2, hex, base64) and the plugin ABI (busbar-plugin,
# async-trait) the plane's host calls reach.
busbar-plugin = { path = "../busbar-plugin" }
busbar-plugin-loader = { path = "../plugin-loader" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "io-std", "process"] }
serde = { workspace = true }
serde_yaml = { workspace = true }
# The engine-built token exchange (`upstream::exchange`): request assembly is `http` parts, the
# body read rides `http-body-util`, and the form encodes through `serde_urlencoded` — the crate
# reqwest's `.form()` was, so the wire bytes are unchanged.
http = { workspace = true }
http-body-util = { workspace = true }
serde_urlencoded = { workspace = true }
# TEST MACHINERY ONLY: the plane's test batteries compile into the LIBRARY under `test-support`
# (the dependent-test-binary pattern), and they drive reqwest as a client against the fixtures —
# so the edge is optional on that feature and absent from every shipped build; plain
# `cargo test -p` reaches it via [dev-dependencies].
reqwest = { workspace = true, features = ["http2", "json"], optional = true }
# TEST MACHINERY ONLY, same edge as reqwest: the plane's test batteries mint governance registries
# over the in-memory store (formerly reached as the engine's `governance::MemoryStore` re-export; now
# named directly, so the tests spell no engine path). Optional on `test-support` because the one
# battery a dependent test binary compiles in (`admin_view::adminverbs_tests`) needs it in the
# LIBRARY build; absent from every shipped build.
busbar-store-memory = { path = "../store-memory", optional = true }
indexmap = { workspace = true }
futures = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
getrandom = { workspace = true }
# THE OPENAPI SCHEMA DERIVE, optional and mirroring busbar-core exactly. The plane's admin-view types
# (`src/mcp/admin_view.rs`) derive `schemars::JsonSchema` under `openapi-schema`; when these sources
# dual-compile into busbar-core they take core's `schemars`, and when they compile HERE they need
# their own. Same optional dep, same feature edge, so the derive resolves whichever crate is compiling.
schemars = { workspace = true, optional = true }

[features]
# THE PLANE TESTS run in THIS crate's own binary under `test-support`. They build a `TestApp` and read
# the plane's runtime back out by DOWNCAST; that runtime's type is `McpRuntime`, so the fixtures only
# ever produce a value the tests can reach and downcast when they compile in the same crate — exactly
# as the extracted LLM dialects' tests run in core's. A bare `cargo test -p busbar-plane-mcp-host`
# still builds and runs the CODEC tests (the protocol half, which needs no app), just not the plane
# half.
#
# The App-needing plane tests are gated `#[cfg(all(test, feature = "test-support"))]`: `test-support`
# is exactly the feature that puts an engine in the closure for `src/mcp/tests/engine.rs` to bind, so
# the gate is TRUE precisely when the tests have an engine to build an App with.
#
# The plane's sources carry `#[cfg(feature = "…")]` gates (the `PlaneDecl` OpenAPI-schema field, one
# admin-tokens test path). Since THE SEAL made busbar-core an optional dep, the openapi-schema forward
# points at SUBSTRATE (where `PlaneDecl` lives) rather than busbar-core, and the admin-tokens forward
# is weak; off by default.
# The `openapi_schemas` field of `PlaneDecl` (now `busbar_substrate::plane::registry::PlaneDecl`) is
# gated on substrate's `openapi-schema`, and `admin_view`'s `schemars::JsonSchema` derives need the
# derive crate — so this forwards to SUBSTRATE to keep the `#[cfg(feature = "openapi-schema")]` field
# site and the struct definition in lock-step, plus its own `schemars`.
openapi-schema = ["busbar-substrate/openapi-schema", "dep:schemars"]
# The one `auth-admin-tokens` site is a test module. Forwarded WEAKLY (`?`) so enabling it never
# force-pulls the optional busbar-core into a non-test-support build; it only cascades where
# busbar-core is already in the closure (the test-support / dual-compile surface that test needs).
auth-admin-tokens = ["busbar-core?/auth-admin-tokens"]
# Pulls busbar-core (the optional dep) and its test fixtures so the plane's test binary can bind the
# engine's test kit (`src/mcp/tests/engine.rs`); the plane tests themselves name only the neutral
# `busbar_substrate::testkit::engine_kit` seam. This feature is the one edge that puts busbar-core in
# the closure — the default/prod build has none. Core's `TestApp` fixture names BOTH planes' config
# types unconditionally (`crate::a2a::config::AgentsCfg`, the `tools:` types), so this forwards
# `plane-mcp`/`plane-a2a` too — the same both-planes shape core's own dual-compile test binary builds
# with — or the fixture's `crate::a2a` references are configured out and cannot resolve.
test-support = [
    "dep:busbar-core",
    "busbar-core/test-support",
    "busbar-core/plane-mcp",
    "busbar-core/plane-a2a",
    "dep:reqwest",
    "dep:busbar-store-memory",
]

[dev-dependencies]
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
# THE LLM PROTOCOL crate, dev-only: the MCP sampling suite drives a REAL upstream chat completion on
# the operator's model (`protocol: openai`), so it must register the LLM dialect declarations the way
# the composition root does — the codec the deleted `#[path]` witness used to net into core's test
# binary. A dev-dep back-edge, not linked into any shipped target.
busbar-llm = { path = "../busbar-llm" }
# Test-only crates the MCP plane's own `test-support` suite names — reachable through busbar-core's
# dev-deps under the old dual-compile, declared here now that the suite runs in this crate's own binary.
reqwest = { workspace = true, features = ["json"] }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
busbar-store-memory = { path = "../store-memory" }
busbar-secret-ref = { path = "../secret-ref" }
busbar-plugin-sign = { path = "../plugin-sign" }
# THE ADMIN JSON-REST SERVICE, dev-only — a dev-dep BACK-EDGE, not linked into any shipped target
# (the same shape as the `busbar-llm` back-edge above). `/api/v1/admin/*` is served by busbar-admin,
# which busbar-core nests through the runtime fn-pointer seam `busbar_core::admin::seam`; production
# registers it via `busbar_admin::install()` at the composition root. This plane crate's `test-support`
# engine path never calls it, so the admin surface is absent and every trust-verb test is a router-level
# 404. The `adminverbs_tests` battery installs the seam for THIS crate's own test binary — see the
# `#[cfg(test)]`-gated `busbar_admin::install()` there. A dev-dependency (not a normal/optional dep) is
# what keeps the real build graph one-directional: dev-deps are compiled only when testing THIS crate,
# never when busbar-admin (which itself dev-depends on the shim) links it as a library, so no reverse
# edge exists in any non-test build.
busbar-admin = { path = "../busbar-admin" }
