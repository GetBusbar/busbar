[package]
name = "busbar-transport-stdio"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The stdio transport: the carrier of a spawned program's pipes, one frame per line, over the host's I/O."
license = "Apache-2.0"

[lib]
name = "busbar_transport_stdio"
path = "src/lib.rs"
# rlib: the linked door (`linked::door`, a build that links this crate) and the tests. cdylib: the
# dropped-in door — the same door, exported as the image's one symbol (`export_door!`) under the
# `dropped-in` feature, for the loader to `dlopen` (#3: a transport is swappable, compiled in OR
# dropped in, through the one door).
crate-type = ["rlib", "cdylib"]

[features]
# THE DROPPED-IN DOOR (`exports`): this crate's door, exported as its image's one symbol. OFF in a
# build that links this crate (the linked door is `linked::door`); the dropped-in artifact is built
# on its own: `cargo build -p busbar-transport-stdio --release --features dropped-in`.
dropped-in = []

# DEPENDENCY POLICY. A transport is a plugin (#3, #40(a)): its closure is `busbar-contract` and
# nothing else. It opens no pipe and spawns no process: the program, its pipes and their readiness
# are the host's (`io.*`). It carries the line framing only: one frame per line in, one line per
# frame out. No protocol meaning (JSON-RPC ids, verbs, correlation) lives here; that stays with the
# planes that ride this transport.
[dependencies]
busbar-contract = { path = "../busbar-contract" }

[dev-dependencies]
# THE BOTH-WAYS WITNESS (tests/conformance.rs, its only user): busbar's published conformance suite
# runs the carrier script over the linked door and this crate's own dropped-in cdylib, through the
# one loader (#2 rule (1), #3). This crate names itself with its dropped-in door on, so `cargo test`
# builds the cdylib that test opens. Dev-only: absent from every release build.
busbar-plugin-loader = { path = "../plugin-loader", features = ["conformance"] }
busbar-transport-stdio = { path = ".", features = ["dropped-in"] }
