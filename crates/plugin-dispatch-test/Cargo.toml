# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-plugin-dispatch-test"
version = "1.5.0"
publish = false            # internal TEST-support plugin; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The plugin dispatcher's test plugin: one door and the lifecycle table only. Its `tick` multiplexes the test ops by the extensions blob of its `in`: it answers every outcome, pends and wakes (after, before, spuriously, for stale generations, by timer), arms a driver ticket, hangs for the watchdog and panics unguarded. Built LINKED (rlib) and DROPPED (cdylib) by plugin-loader's dispatch tests."
license = "Apache-2.0"

[lib]
# rlib = the LINKED door the test holds as a `DoorFn`; cdylib = the DROPPED door it dlopens.
crate-type = ["cdylib", "rlib"]

[dependencies]
busbar-contract = { path = "../busbar-contract" }
