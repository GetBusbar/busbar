# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-secret-example-plugin"
version = "1.5.0"
publish = false            # internal TEST-support cdylib; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "A hermetic trivial kind:secret plugin cdylib. Doubles as: (1) the reference implementation docs/plugins.md's secret-plugin example is checked against, so the doc example cannot silently drift from the real SecretModule trait shape the way it did before this crate existed; (2) the end-to-end over-the-ABI coverage of the DynSecret dlopen seam, which had none."
license = "Apache-2.0"

[lib]
# cdylib for the C ABI delivery; rlib is REQUIRED for `cargo test` to actually emit the cdylib
# artifact at all when this crate has no in-crate #[test]s of its own — with cdylib-only, `cargo
# test` builds a trivial "0 tests" harness for this package but never produces the .so/.dylib,
# identical to store-postgres-plugin's original bug (see that crate's Cargo.toml). plugin-loader's
# tests/lib.rs dlopens "the real built cdylib" and were silently finding nothing under a scoped
# `cargo test -p busbar-plugin-loader` as a result.
crate-type = ["cdylib", "rlib"]

[dependencies]
busbar-api = { path = "../api" }
busbar-plugin-sdk = { path = "../plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
