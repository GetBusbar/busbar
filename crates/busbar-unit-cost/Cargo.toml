# busbar-unit-cost — the rate card and the money arithmetic, as pure functions over integers.
#
# WHY A SEPARATE CRATE. The five numbered clauses of the numeric contract (rates, storage,
# projections, immutability, tier) are the one part of the system where a single changed rounding
# step silently changes every invoice. Keeping them in a crate whose only dependency is the
# capability types means the arithmetic can be read, reviewed and re-derived by hand without a
# config parser, a store, a runtime or a plane anywhere in the way.
#
# NO WORKSPACE DEPENDENCIES BEYOND THE CAPABILITY CRATE. The usage report this crate prices is the
# one the usage unit built with its own token; nothing else may reach in. That is why the only
# dependency here is `busbar-caps`, and why there is no serializer, no async runtime and no error
# library: none of them can affect an integer multiply.
[package]
name = "busbar-unit-cost"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# `rust-version` rationale: one pinned number, set to what CI verifies (same as busbar-caps).
rust-version = "1.97"
description = "The rate card and the pricing law: integer nano-unit rates, the stored posting, the cent/micro projections, the pinned card and the tier multiplier."
license = "Apache-2.0"

[lib]
name = "busbar_unit_cost"
path = "src/lib.rs"

[dependencies]
busbar-caps = { path = "../busbar-caps" }
# THE CONTRACT, for the configured-limit vocabulary and nothing else (`busbar_contract::limits`).
# The `groups:` section is parsed by the configuration grammar's crate and PROJECTED by this one,
# which makes the hand-over a relay — and a relay can only be written somewhere that names both
# sides. With the spec types declared here, only a composition root could name both, so every engine
# resolving a model without a root behind it carried its own copy of the relay; two readings of one
# `groups:` section that must agree exactly is how a node comes to be admitted against one set of
# ledger cells and billed against another. Declaring the vocabulary in the contract dissolves that.
# The rule this manifest was written for still holds to the letter: `busbar-contract` is a pure type
# crate with no store, no config parser and no runtime, and it is ALREADY in this crate's compiled
# closure through the capability crate named above (which depends on it), so naming it directly adds
# not one crate to what a money multiply links against.
busbar-contract = { path = "../busbar-contract" }

# TESTS ONLY, AND THE RULE ABOVE STILL HOLDS. The decimal-to-money conversion exists TWICE in the
# tree: once here, and once inside the admission unit's rate projection, because that crate depends
# on nothing here and cannot call across. Two copies of a rounding rule that must agree exactly, and
# nothing checking that they do, is how a request comes to be judged at one rate and billed at
# another. This dev dependency is what lets a test ask both of them the same ten thousand questions.
# It is dev-only: it is not linked into the library, it cannot affect a single integer multiply, and
# the compiled crate still depends on `busbar-caps` and nothing else.
[dev-dependencies]
busbar-unit-admission = { path = "../busbar-unit-admission" }
