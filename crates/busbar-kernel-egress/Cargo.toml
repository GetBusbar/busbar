[package]
name = "busbar-kernel-egress"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The egress unit: the pool per (transport, destination), the ordered walk, the attempt's bound, and the on_exhausted terminals."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_egress"
path = "src/lib.rs"

[features]
# Dev-dependencies only; never a shipped build.
test-support = []

[dependencies]
busbar-contract = { path = "../busbar-contract" }
busbar-kernel-breaker = { path = "../busbar-kernel-breaker" }
# The host clock: the walk's waits are absolute deadlines on it (GROUP-time 3.2).
busbar-ports = { path = "../busbar-ports" }
# Core's one URL redactor (`abi::host::scrub::{mask_url, strip_userinfo}`, IF §12.16).
busbar-plugin-abi = { path = "../busbar-plugin-abi", features = ["host"] }
foldhash = { workspace = true }

[dev-dependencies]
# The bench mints the route pass the walk asks for.
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }

[lints]
workspace = true

# WALK-NEXT (GROUP-time step 3): one Walk::start and one next over a four-member pool.
[[bench]]
name = "walk_next"
harness = false
