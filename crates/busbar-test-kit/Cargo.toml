[package]
name = "busbar-test-kit"
version = "1.5.0"
publish = false
edition = "2021"
rust-version = "1.97"
description = "The busbar core test kit: the published plugin conformance suite and the host-side test doubles (connection tables, a local token issuer) that plugin repos and busbar's own tests run against. A dev-dependency only; no busbar build ships it."
license = "Apache-2.0"

# A plugin repo names this crate as a dev-dependency at the busbar tag it pins:
#   busbar-test-kit = { git = "https://github.com/GetBusbar/busbar", tag = "<core version>" }
# and calls `busbar_test_kit::conformance_suite! { .. }` from its own `tests/conformance.rs`.

[dependencies]
busbar-contract = { path = "../busbar-contract" }
busbar-plugin-loader = { path = "../plugin-loader" }
base64 = { workspace = true }
# The canary spells a hex-encoded credential (`conformance/canary.rs`).
hex = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }

# The suite's own tests drive it over the loader's test fixtures, so they run in the loader's test
# build (which compiles this source by path and sets `busbar_loader_suite`), not in this crate's.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(busbar_loader_suite)"] }
