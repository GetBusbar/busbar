# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-plugin-testkit"
version = "1.5.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "Shared kind-level contract test helpers for every first-party busbar plugin's `open(cfg: &str) -> Result<Box<dyn Trait>, String>` seam. Add a check here once, every plugin that calls it picks it up on its next dependency bump — instead of hand-copying the same assertion into 5 repos."
license = "Apache-2.0"

[dependencies]
# OPTIONAL, and off by default: only the `store`-kind plugins need it, and pulling `busbar-api`
# into every plugin's dev tree (hook/auth/secret alike) for a module they never call would be a
# gratuitous compile cost. No cycle — `busbar-api` depends on nothing in this crate.
busbar-api = { path = "../api", optional = true }
# OPTIONAL, and off by default, for the same reason: only the `unit`-kind crates need the tokens,
# the steps and `Decision<S>` that `unit_conformance` is written against. `plugin-tooling -> caps`
# is an edge class the kind graph already measures, so this adds no new one.
busbar-caps = { path = "../busbar-caps", optional = true }
# Needed only by the neutral plane-record conformance helpers, which serialize a typed row into the
# opaque `PlaneRecord` body exactly as core does — off unless the `store` feature is on.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
# The `Store` contract conformance suite (`store_conformance`). A store plugin turns this on in its
# `[dev-dependencies]`.
store = ["dep:busbar-api", "dep:serde", "dep:serde_json"]
# The `Unit` contract conformance suite (`unit_conformance`). A busbar-unit-* crate turns this on in
# its `[dev-dependencies]`.
unit = ["dep:busbar-caps"]
