# busbar-unit-auth — the authenticate step, as a unit.
#
# WHY IT DEPENDS ON NOTHING BUT THE CAPABILITY CRATE. A unit answers exactly one step and is handed
# exactly one token for the length of one call. If it could name the kernel it could reach past the
# token; if it could name a transport it would grow a second opinion about what a credential is. So
# the only edge out of this crate is `busbar-caps`, which is where the token and the answer type
# live. Everything the chain needs from the outside — the header carriers, the credential digest,
# the key verifier, the revocation set — arrives as a trait the caller implements.
[package]
name = "busbar-kernel-identity"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The authenticate step as a unit: the credential chain, the credential cache, the carriers, the challenge, and the protocol-claim ladder."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_identity"
path = "src/lib.rs"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
# `sha2`/`hex` are now unconditional: the folded `egress_auth` module (former busbar-unit-egress-auth,
# #36) needs them for its sigv4 signing, so they can no longer be gated behind the `sha256` feature.
# The `sha256` feature still gates the ingress-side production `CredentialDigest` code
# (`cache::Sha256Digest`); it just no longer needs to pull the crates in.
sha2 = { workspace = true }
hex = { workspace = true }
# The folded `egress_auth` sigv4 signer.
hmac = { workspace = true }
# The folded `transport_key` module (the retired transport-key crate, #36/#40): it parses the
# node's TLS credential and builds the `rustls` config a TLS transport receives as an opaque
# `TransportConfigHandle`. The workspace pin is `ring`-only, the one crypto backend in the tree.
rustls = { workspace = true }
# The OAuth token response's tolerant `expires_in` parse (`egress_auth::deserialize_expires_in`) is a
# serde deserializer. A leaf already in this crate's closure through `busbar-contract`.
serde = { workspace = true }
# `report_unpresented` logs a credential a declared scheme could not present, in the line its
# scheme's builder always logged (operator logs are frozen text); the diagnostic emit macros it
# writes them through expand to `tracing`.
tracing = { workspace = true }

[features]
# A production `CredentialDigest` (1.5.5's hex SHA-256) for callers who would rather take the
# `sha2`/`hex` dependency than supply their own. Off by default.
sha256 = []

[dev-dependencies]
# Test-only, and only exercised under `--features sha256`: the reference `sha256_hex` the
# `Sha256Digest` jitter-parity test compares against. Never a default-build dependency.
# Self-signed and CA-issued certificates for the `transport_key` cells.
rcgen = { workspace = true }

