# busbar-kernel-identity — the identity pieces the kernel's authenticate step is built from: the
# operator credential's words, refusals and judgement, the revocation view, the anonymous caller,
# and the caller reference.
#
# WHY ITS ONLY BUSBAR EDGE IS THE CONTRACT. It names no kernel crate and no transport: what it
# reads of a credential arrives through the contract's auth types, and what the root supplies (the
# linked auth rows, the operator words, the revocation set) arrives as an argument or a trait the
# root implements.
[package]
name = "busbar-kernel-identity"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The identity pieces of the authenticate step: the operator credential, the revocation view and the caller reference."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_identity"
path = "src/lib.rs"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
# The caller reference (`caller_ref`): its HKDF/HMAC on the one crypto backend, rendered as hex.
hex = { workspace = true }
ring = { workspace = true }

[features]
# The operator credential's kind-neutral stand-in words (`operator::STAND_IN`) for a TEST build that
# has no composition root to hand the root legacy table's words in. busbar-kernel's own tests and
# its `test-support` feature turn it on; a shipped build never does.
stand-in = []

# Temporary standalone root while the workspace members land in parallel.
