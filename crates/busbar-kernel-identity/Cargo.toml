[package]
name = "busbar-kernel-identity"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The identity types around the kernel auth chain: the operator credential, the caller reference and the revocation view."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_identity"
path = "src/lib.rs"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
hex = { workspace = true }
foldhash = { workspace = true }

[features]
# Exposes only explicit metadata injection; fixture values and auth rows remain caller-owned.
test-support = []

[lints]
workspace = true
