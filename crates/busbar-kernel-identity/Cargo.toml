# busbar-kernel-identity — the identity words around the kernel's one chain: the caller reference,
# the operator credential, and the reserved principal ids. It holds no chain walk (the kernel's is the
# only one), and depends on the contract crate and the crypto backend the caller reference needs.
[package]
name = "busbar-kernel-identity"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The identity words around the kernel's chain: the caller reference, the operator credential, and the reserved principal ids."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_identity"
path = "src/lib.rs"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
# The caller reference (`caller_ref`): its HKDF/HMAC on the one crypto backend, rendered as hex.
hex = { workspace = true }
ring = { workspace = true }

[features]
# The operator credential's kind-neutral stand-in words (`operator::STAND_IN`) and its test registry
# row (`operator::install_row`) for a TEST build that has no composition root to hand the root legacy
# table's words in. busbar-kernel's own tests and
# its `test-support` feature turn it on; a shipped build never does.
stand-in = []

