# busbar-llm — THE LLM PROTOCOL, as ONE plugin crate.
#
# ONE PLUGIN PER PROTOCOL, not one per dialect. "LLM" is the protocol; anthropic, openai chat,
# gemini, bedrock, openai responses and cohere are six DIALECTS of it, and an operator chooses LLM
# coverage or no LLM coverage — never "anthropic but not gemini". A seventh dialect is a module
# added here, not a new crate and not a new feature flag. This crate replaces the four per-dialect
# crates (`busbar-proto-anthropic`, `-openai-chat`, `-gemini`, and the bedrock/cohere/responses
# extractions that were in flight) that got the granularity wrong.
#
# MCP is DELIBERATELY NOT FOLDED IN HERE: MCP is a different protocol, so it is a different plugin
# (`busbar-mcp`), which carries the MCP codec today and folds in the MCP plane in a later step.
#
# The contract each dialect module keeps (unchanged from the per-crate shape): five files —
# declaration, reader, writer, handler, tests — with everything consumed through busbar-core's
# public surface, and registration performed by the `busbar` binary (the composition root) and by
# nothing else. Deleting this crate's dependency edge is a build the deletion gate makes on purpose
# (scripts/proto-deletion-gate.sh): with it gone, busbar speaks NO LLM dialect and refuses every one
# of the six at boot.
[package]
name = "busbar-llm"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# `rust-version` rationale: see busbar-core/Cargo.toml — one pinned number, set to what CI verifies.
rust-version = "1.97"
description = "The LLM protocol for busbar: the anthropic, openai-chat, gemini, bedrock, openai-responses and cohere dialects — wire codecs, request handlers and protocol declarations — linked and registered as one plugin by the busbar binary."
license = "Apache-2.0"

[lib]
name = "busbar_llm"
path = "src/lib.rs"

[features]
# Pass-through so a dependent (busbar-core's own test binary, which folds this plane's dialects and
# testkit) and this crate's own gated round-trip codec helpers can ask for the test surface — the same
# shape `busbar-mcp` exposes. Forwards ONLY to the substrate's test seams (`register_test_protocols`
# and friends): this plane has NO production dependency on busbar-core, so there is nothing of core's
# to forward. The G6 A4b leaf-op read/write free fns are `#[cfg(any(test, feature = "test-support"))]`.
test-support = ["busbar-substrate/test-support", "busbar-llm-codec/test-support"]
# THE TELLER WAIST, written dark. DEFAULT OFF, and it stays off until the whole step set is wired and
# the owed golden is clean on both legs. With it off `src/unit/` compiles to nothing (the module root
# carries an inner `cfg`), so the default dependency graph, the default build and every default-feature
# test are byte-for-byte what they were; with it on the per-step files and their identity tests come in
# beside the live `native_ingress` path rather than in place of it. Both paths always compile and are
# always unit-tested — the flag only ever chooses which fn-pointer tables a composition root installs,
# never a config key, an env var or a boot line.
# Passthrough to `busbar-timing`'s debug-only per-method micro-timing (DEFAULT OFF), mirroring
# `busbar-core`'s `timing` feature: the relocated engine's `#[cfg(feature = "timing")]` profiling
# guards (in `engine/pipeline.rs`) resolve against this, so the flag exists in lock-step with the
# `busbar-timing/timing` it forwards. Off ⇒ those guards are zero-sized no-ops.
timing = ["busbar-timing/timing", "busbar-llm-codec/timing"]
# Mirrors `busbar-core`'s admin-tokens feature: a relocated money-path test
# (`forward_pool_integration_tests`) gates an admin-token assertion on
# `#[cfg(feature = "auth-admin-tokens")]`. Nothing in this plane's production build reaches that
# plugin (it is core's), so this forwards nowhere; in this crate's own test binary the busbar-core
# DEV-dependency below is built with core's default features, which already include the plugin.
auth-admin-tokens = []
# The CI-only OpenAPI schema derive, mirroring `busbar-mcp`: the LLM `PLANE_DECL`'s `openapi_schemas`
# field is `#[cfg(feature = "openapi-schema")]` on `busbar_substrate::plane::registry::PlaneDecl`, so
# this feature must resolve that `#[cfg]` in lock-step with the struct definition. FORWARDS straight
# to `busbar-substrate/openapi-schema` — the plugin carries no `schemars` derive of its own (the LLM
# plane contributes `openapi_schemas: None`), it only needs the field-site `#[cfg]` to agree with
# substrate's. The binary's `openapi-schema` forwards `busbar-llm?/openapi-schema`.
openapi-schema = ["busbar-substrate/openapi-schema", "busbar-llm-codec/openapi-schema"]
# T3 — inbound OpenAI Responses async/background WEBHOOK RECEIVER, LIVE HTTP-ROUTE MOUNT. DEFAULT OFF.
# The parse+verify+surface HANDLER (`openai_responses::webhook`) compiles and is tested
# UNCONDITIONALLY; only MOUNTING it as a live `/v1/llm/webhooks/openai` route is gated here, because
# (a) it needs the `busbar-plugin` route-enum vocabulary and (b) it flips the fallback plane's
# `PLANE_DECL.routes` from `None` to `Some(..)`. Gating keeps the money-path fallback plane's default
# boot byte-identical. The signing secret is read from `BUSBAR_LLM_WEBHOOK_SECRET`; with it unset the
# feature mounts NOTHING (never an unauthenticated endpoint). The operator-facing secret-config seam
# (a `webhooks:` config section + a dispatch slot on the fallback plane) is the reported deferred
# remainder — see `openai_responses/webhook.rs`.
webhook-receiver = ["dep:busbar-plugin"]
# THE TELLER WAIST — the `src/unit/` step files, ONE FILE PER TELLER STEP, written dark. DEFAULT OFF,
# and off is byte-identical to not having them: `src/unit/mod.rs` carries the inner
# `#![cfg(feature = "teller-waist")]`, so with the flag down the whole directory compiles to nothing
# and the dependency below is not linked at all. The legacy `native_ingress` path is untouched either
# way; the two coexist until the composition root flips the matrix leg.
#
# It carries `busbar-caps` — the capability vocabulary the loop's step seam is written in
# (`UnitToken<S>`, `Decision<S>`, `Refusal`, `ReasonCode`, the step markers, and the facts each step
# hands the next). `busbar-caps` + `busbar-contract` is the PLUGIN-VISIBLE pair, so naming it is the
# plane ABI rather than a reach into the kernel. `busbar-kernel` is deliberately NOT named here: the
# type that implements the loop's step seam lives in the composition root, and these files are the
# per-step bodies it delegates to.
teller-waist = ["dep:busbar-caps"]

[dependencies]
# NO `busbar-core` HERE, ON PURPOSE. A plane is a plugin on the plane ABI: the ONLY surface between
# it and core is the substrate's ports (`busbar_substrate::plane_host::*`) and the installable seams,
# plus the contract crate. The plane-extraction design (docs/design/plane-extraction-design.md) makes
# the NEUTRAL ABI — busbar-substrate / busbar-api — the surface a plane names; a plane MUST NOT reach
# back into core's implementation. Historically `busbar-core` sat here as "the ONLY busbar crate this
# plugin may name"; every item the plugin consumes (breaker signals, the IR facts/handle types, the
# codec-cell matrix, wire body types, the billing usage type, the operation enum, the clock, the
# engine host, …) is now named at its canonical `busbar_substrate::` / `busbar_api::` home. Core is a
# DEV-dependency only (the money-path test fixture), so `cargo build -p busbar-llm` proves the edge is
# gone: the production build does not link core at all.
#
# The NEUTRAL ABI (the substrate + contract crates). A plane depends on these DIRECTLY. `busbar-core`
# re-exports these same items, so every historical repoint from a core path to `busbar_substrate::X` /
# `busbar_api::X` was by-identity (the very same type/const), i.e. byte-identical behaviour.
busbar-substrate = { path = "../busbar-substrate", default-features = false }
busbar-api = { path = "../api" }
# THE CODECS. The pure half of this plugin, split out so `busbar-plane-llm` can name the dialect
# readers/writers, the IR, the stream translator and the answer-normalization pass without pulling
# this crate's HTTP stack and async runtime into a pure kind's closure. Every module that moved is
# re-exported from this crate's `lib.rs` under its old name.
busbar-llm-codec = { path = "../busbar-llm-codec" }
# Debug-only per-method micro-timing (DEFAULT OFF, zero cost). Instruments the per-dialect
# reader/writer translate entry points (bedrock/cohere — the heavy cells). Enable the registry via
# `--features busbar-timing/timing`.
busbar-timing = { path = "../busbar-timing" }
axum = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sonic-rs = { workspace = true }
tracing = { workspace = true }
# The relocated money-path engine (src/engine): the pool/lane routing tables, the egress pipeline,
# the active-probe health loop and the native fallback plane. These are the runtime deps those files
# name directly; the engine calls DOWN into busbar-core for the neutral egress/auth/health primitives.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = { workspace = true }
metrics = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
url = { workspace = true }
smallvec = { workspace = true }
# The relocated native-plane gauntlet (`native_ingress::NativePlane`) implements the async
# `busbar_substrate::plane_host::GauntletPlane` trait.
async-trait = { workspace = true }
# Synthesized wire ids (anthropic `req_…`, gemini/bedrock request ids, responses `resp_…`): random
# bytes, hex-encoded.
getrandom = { workspace = true }
hex = { workspace = true }
# T3 inbound webhook signature verification (Standard Webhooks / OpenAI Responses async webhooks):
# HMAC-SHA256 over the signed content, base64 for the `whsec_` secret decode + signature encode. The
# generic HMAC-SHA256 helper in `busbar_substrate::sigv4` is PRIVATE (SigV4-only, no public
# re-export), so this plane computes its own HMAC exactly as sigv4 does; the constant-time compare is
# the neutral `busbar_api::constant_time_eq` (no `subtle` dep introduced).
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# The route-mount enums (`RouteMethod`/`RouteAuth`) for the OFF-by-default live webhook HTTP route.
# Optional so the default dependency graph is unchanged; enabled only by `webhook-receiver`.
busbar-plugin = { path = "../busbar-plugin", optional = true }
# The capability vocabulary the `teller-waist` step files are typed in (see the feature above).
# Optional so the default dependency graph — and therefore the default build — is unchanged.
busbar-caps = { path = "../busbar-caps", optional = true }

[dev-dependencies]
# THE NEUTRAL TEST KIT (`busbar_substrate::testkit`: the built-app seam the money-path tests forward
# through, the warn-capture layer, the fixture seams), named explicitly here so this crate's test build
# turns the substrate's test surface on in its own right — not as a side effect of core's dev-edge.
busbar-substrate = { path = "../busbar-substrate", features = ["test-support"] }
# THE CODECS' TEST SEAM (`ensure_test_protocols_registered`) is gated on the codec crate's
# `test-support`, so this crate's own test binary turns it on in its own right rather than relying on
# a dependent's feature selection.
busbar-llm-codec = { path = "../busbar-llm-codec", features = ["test-support"] }
# THE MONEY-PATH FIXTURE (`TestApp`/`MockServer`/`LaneSpec`, the governance/cost/config types that
# configure it, the metrics recorder): core's `test_support`, which core exposes behind this feature
# only. The fixture constructs core's `App`, so it lives in core and this dev-edge stays until the
# fixture (and the config/governance/cost vocabulary that configures it) has a neutral home; the tests
# reach the BUILT App only through `busbar_substrate::testkit::BuiltAppSeam`, which core implements.
busbar-core = { path = "../busbar-core", features = ["test-support"] }
# THE MCP PROTOCOL crate, dev-only: ONE relocated registry test asserts core's handling of a
# codec-LESS registered protocol using the real MCP declaration (`busbar_mcp::PROTO_DECL`), which the
# deleted `#[path]` witness used to net in. A dev-dep back-edge (busbar-mcp normal-depends on
# busbar-core; this dev-dep the other way is not a build cycle). Not linked into any shipped target.
busbar-mcp = { path = "../busbar-mcp" }
# The in-memory `Store` the governed engine tests seed a registry with, named at its own crate so
# a test reaches governance through the neutral engine test kit rather than through core.
busbar-store-memory = { path = "../store-memory" }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
# The relocated money-path tests (src/engine/{tests,engine_tests}) drive the engine through
# core's test_support mock harness and name these directly.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
reqwest = { workspace = true, features = ["http2", "json"] }
proptest = { workspace = true }
hyper-util = { workspace = true }
# The relocated money-path tests drive these directly (config round-trips + the audit-chain crc).
serde_yaml = { workspace = true }
crc32fast = { workspace = true }
rcgen = { workspace = true }
http-body-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
metrics = { workspace = true }
http = { workspace = true }

# The allocation-count PERF gate (`engine/tests/alloc_gate.rs`) reads a per-thread counter off a
# jemalloc-wrapping `#[global_allocator]` this crate's TEST binary installs (see `lib.rs`), mirroring
# busbar-core. Target-gated exactly as core's is.
[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
tikv-jemallocator = { workspace = true }
