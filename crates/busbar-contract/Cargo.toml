[package]
name = "busbar-contract"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The plugin-visible contract: the traits, closed grammars and bounded types every busbar plugin is written against, and nothing else."
license = "Apache-2.0"

[[example]]
name = "sdk_door_plugin"
path = "tests/fixtures/sdk_door_plugin.rs"
crate-type = ["cdylib"]

[[example]]
name = "sdk_door_baseline"
path = "tests/fixtures/sdk_door_baseline.rs"
crate-type = ["cdylib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml = { workspace = true }
indexmap = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
smallvec = { workspace = true }
zeroize = { workspace = true, features = ["serde"] }
num-bigint = { workspace = true }
getrandom = { workspace = true }
ring = { workspace = true }
aws-lc-sys = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
idna = { workspace = true }
memchr = { workspace = true }
tracing = { workspace = true }
tracing-core = { workspace = true }
tracing-log = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
jsonschema = { workspace = true }
hyper = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[features]
# Test-only; named only in [dev-dependencies], absent from release builds.
test-seal = ["test-support"]

# Ordinary ABI test support (`abi::sdk::test_support`): the all-zero value of a reviewed ABI
# struct, `Default` on it, and the lending pairs. It forges nothing; sealed credentials stay
# behind the dev-dependency-only `test-seal` feature.
test-support = []

# Dev-only count probes for the single-path stages (`stage_probe`, SINGLE-PATH §8). Named only in
# [dev-dependencies]; without it every probe call compiles to nothing.
stage-probe = []

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
