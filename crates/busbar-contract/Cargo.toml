[package]
name = "busbar-contract"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The plugin-visible contract: the traits, closed grammars and bounded types every busbar plugin is written against, and nothing else."
license = "Apache-2.0"

[[example]]
name = "sdk_door_plugin"
path = "tests/fixtures/sdk_door_plugin.rs"
crate-type = ["cdylib"]

[[example]]
name = "sdk_door_baseline"
path = "tests/fixtures/sdk_door_baseline.rs"
crate-type = ["cdylib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
indexmap = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
smallvec = { workspace = true }
zeroize = { workspace = true }
num-bigint = { workspace = true }
getrandom = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
idna = { workspace = true }
memchr = { workspace = true }
tracing = { workspace = true }
tracing-core = { workspace = true }
tracing-log = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
jsonschema = { workspace = true }
hyper = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[features]
# Test-only; named only in [dev-dependencies], absent from release builds.
test-seal = []

# Test-only; named only in [dev-dependencies], absent from release builds.
alloc-counter = []
