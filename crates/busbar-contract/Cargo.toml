[package]
name = "busbar-contract"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The plugin-visible contract: the traits, closed grammars and bounded types every busbar plugin is written against, and nothing else."
license = "Apache-2.0"

[[example]]
name = "sdk_door_plugin"
path = "tests/fixtures/sdk_door_plugin.rs"
crate-type = ["cdylib"]

[[example]]
name = "sdk_door_baseline"
path = "tests/fixtures/sdk_door_baseline.rs"
crate-type = ["cdylib"]

[dependencies]
busbar-json = { path = "../busbar-json" }
busbar-artifact-metadata = { path = "../busbar-artifact-metadata" }
busbar-count = { path = "../busbar-count" }
# SDK-SECRET-BUFFER: one shared byte owner, exposed only through the producer facades.
busbar-secure = { path = "../busbar-secure" }
# The crypto facade, re-exported whole as `busbar_contract::crypto`.
busbar-crypto = { path = "../busbar-crypto" }
# Calendar dates and RFC 3339 (`civil`).
time = { workspace = true, features = ["formatting"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
# The JSON facade (`json`): sonic-rs, numbers exact (`arbitrary_precision`, workspace row).
sonic-rs = { workspace = true }
# `schema` only: `json::SchemaCheck` (tooling and tests; the engine's normal graph keeps none).
# `axum` only: `json::Body`, the JSON responder.
serde-saphyr = { workspace = true }
ciborium = { workspace = true }
serde_path_to_error = { workspace = true }
indexmap = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
smallvec = { workspace = true }
foldhash = { workspace = true }
zeroize = { workspace = true, features = ["serde"] }
hex = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
idna = { workspace = true }
memchr = { workspace = true }
percent-encoding = { workspace = true }
sseer = { workspace = true }
subtle = { workspace = true }
tracing = { workspace = true }
tracing-core = { workspace = true }
tracing-log = { workspace = true }

[dev-dependencies]
# `json::Body`'s responder test (tests/json_facade.rs, feature `axum`) names axum-core's IntoResponse.
axum-core = { workspace = true }
busbar-secure = { path = "../busbar-secure", features = ["test-support"] }
libc = { workspace = true }
stats_alloc = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
hyper = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[features]
# `json::SchemaCheck`: JSON Schema over bytes. Tooling (plugin-loader `pack`) and dev edges only.
schema = ["busbar-json/schema"]

# `json::Body`: a JSON answer over axum (axum's own `Json` is serde_json's; its `json` stays off).
axum = ["busbar-json/axum"]

# Test-only; named only in [dev-dependencies], absent from release builds.
test-seal = ["test-support"]

# Ordinary ABI test support (`abi::sdk::test_support`): the all-zero value of a reviewed ABI
# struct, `Default` on it, and the lending pairs. It forges nothing; sealed credentials stay
# behind the dev-dependency-only `test-seal` feature.
test-support = ["busbar-crypto/test-support", "busbar-secure/test-support"]

# R131 `test-unsafe-outside-boundary` (`abi_scan`): test-reachable files, scanned as tokens. Test-only
# (it rides `test-support`); called from core's tests and the plugin template's `tests/abi_scan.rs`.
abi-scan = ["test-support"]

# TLS configs and verifiers through the crypto facade (TLS crates and tests only).
tls = ["busbar-crypto/tls"]

# Dev-only count probes for the single-path stages (`stage_probe`, SINGLE-PATH §8). Named only in
# [dev-dependencies]; without it every probe call compiles to nothing.
stage-probe = []

# Test-only; named only in [dev-dependencies]. Counts every entry `abi::sdk::expiry::Counted`
# reads or yields, so a test can assert that a request-path operation does not walk its state.
visit-count = []

[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# json_scanner's thread CPU clock, without `unsafe` (UNSAFE-MIN r3.1 §4.4).
rustix = { version = "1.1", default-features = false, features = ["std", "time"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# The source spool's directory-relative create and unlink (UNSAFE-MIN r3.1 §4.3).
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
