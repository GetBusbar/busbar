[package]
name = "busbar-contract"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The plugin-visible contract: the traits, closed grammars and bounded types every busbar plugin is written against, and nothing else."
license = "Apache-2.0"

# DEPENDENCY POLICY (the core-to-plugin section of the design). This crate is the ONLY thing a
# plugin manifest may name from busbar, so it must stand alone: it names no kernel crate, no
# capability crate, no unit crate, no plane and no transport. Standard library, serde, and reviewed
# third-party crates only.
#
# `serde` is here because the closed grammars below (claims, selectors, locations) are sealed into
# the policy journal and read back out of config; a grammar that cannot round-trip through the
# journal cannot be sealed, and sealing is what makes a claim decidable at boot.
#
# `futures` is here for exactly one item: the `Stream` trait in the transport frame pump. The
# standard library has no stable stream trait, and inventing a private one would mean every in-tree
# transport re-implements the adapter the ecosystem already has.
#
# The closed JSON span grammar lives in the `json_grammar` module (folded in from the former
# `busbar-grammar` crate, DECISIONS #40 — the fold satisfies the dep-wall exactly: a plugin
# compiling against the contract no longer drags a second busbar crate into its closure), and is
# re-exported at `busbar_contract::spans` so that a plane resolving a declared pointer and the
# kernel resolving the same pointer are one reading of one grammar rather than two.
#
# The transport-facing half of this contract lives in the `transport` module (folded in from the
# former `busbar-contract-transport` crate, DECISIONS #38): a KIND is a match-arm, not a crate, so
# the vocabulary only a transport author reads is one module tree here rather than a sibling crate.
# The handful of names a plane still touches are re-exported at the crate root, so
# `busbar_contract::wire` means what it always meant.
#
# `zeroize` and `smallvec` arrived with the `busbar-api` fold (DECISIONS #84): `Redacted<T>` zeroizes
# its backing memory on drop, and `SignalBag` keeps the common 0-4-declared-signals case off the
# heap. Both are LEAF crates — each resolves to a node with NO dependencies of its own in
# `Cargo.lock`, so neither widens the closure every plugin inherits (#40(a)) by more than itself and
# in particular neither reaches `libc`. That test is the one that matters here, and it is why
# `sha256_hex` did not come with them.
#
# `sha2` and `hex` arrived with `sha256_hex` (DECISIONS #83; ARCHITECT P68-0 residue (b)): the digest
# every auth module hashes a credential under before the constant-time compare, so a plugin compares
# credentials against the contract alone. `sha2 -> cpufeatures -> libc` is the one edge here that
# reaches `libc`, and it is RULED, not assumed: OWNER RULING 2026-09-22, stated once for the whole
# tree as the `(dep = libc, via = cpufeatures)` edge exemption in `qa/construction.toml` — two
# CPU-capability queries (`getauxval`, `sysctlbyname`), no socket, file, process, handle,
# environment read or HTTP client. `cargo xtask gate denylist` still reds any OTHER path to `libc`.
#
# `serde_json` and `async-trait` arrived with the plugin-facing half of `busbar-api` (DECISIONS
# #83/#84, the per-kind traits and their shapes: `auth`, `hooks`, `secret`, `operation`). `serde_json` is the settings/rewrite carrier those shapes already spoke —
# a `SecretModule` takes a settings `Map`, a rewrite reply is JSON arrays — and it resolves to
# `itoa`/`memchr`/`serde_core`/`zmij` in `Cargo.lock`, none of which reaches `libc`. `async-trait`
# is a proc-macro: it runs at compile time and links nothing into a plugin, and `RoutingPolicy`'s
# every implementor already writes `#[async_trait]` against it.
#
# `http` and `memchr` arrived with the substrate-values SHAPES (DECISIONS #83; SD-1 of the #83a
# split: `billing`, `codec`, `ir`, `protocol`, and the two upstream signal shapes). `http` is the bare
# header/status vocabulary a protocol-seam trait names (`HeaderMap` in a detection predicate and in
# a dialect's error-header attach) — the spec's own "header vocabulary only" acceptance; it resolves
# to `bytes`/`fnv`/`itoa` and opens nothing. `memchr` is the SSE frame-boundary scan's byte search,
# a leaf already in this crate's closure through `serde_json`. Neither reaches `libc`. The shapes
# whose signatures named the reference-counted `bytes` buffer (the IR handle, the wire body, the
# media carriers) came RE-EXPRESSED over this crate's own `SlabBytes` (#83a SD-2b): that buffer type
# stays banned from this surface (`tests/bounded_limits.rs`), so `bytes` is still not a dependency
# here, and the host adopts a slab as its own buffer without copying at its transport boundary.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
smallvec = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
memchr = { workspace = true }

# Tests only. The ABI types that seal into the policy journal are serialised by something, and a
# test that asserts what a serialisation does NOT contain has to run a real serializer over it.
[dev-dependencies]
serde_json = { workspace = true }
# The `secret_ref` module's suite (merged in with the former `busbar-secret-ref` crate, DECISIONS
# #83): it round-trips the same YAML shapes the engine accepts and checks `oneof_schema` against a
# real JSON Schema validator. Test-only, so neither reaches a plugin's closure.
serde_yaml = { workspace = true }
jsonschema = { workspace = true }

# The two NEUTRAL capability features that gate the `transport::transport` module's
# `Transport`/`UpstreamWireKind` wire-selection axis (folded in from `busbar-contract-transport`,
# DECISIONS #38). Both empty here — they gate `#[cfg]` sites only — and must stay DECLARED or
# `unexpected_cfgs` fires under `-D warnings`. `busbar-substrate-values` forwards its own same-named
# features to these so the gated surface arms in lock-step, exactly as before the fold.
[features]
dispatch = []
runtime = []

# The TEST-ONLY seal (#65). `plugin::TestKernelSeal` is the one implementor of the now-SEALED
# `plugin::KernelSeal` that exists for fixtures rather than for the kernel, and it exists at all
# because a PLANE crate may not name `caps` (section 1.2) and so cannot mint a real token for its
# own harness. OFF by default and named only in `[dev-dependencies]`: no non-dev dependency edge in
# this workspace enables it, so the type is absent from every release build.
test-seal = []
