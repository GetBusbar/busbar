[package]
name = "busbar-contract"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The plugin-visible contract: the traits, closed grammars and bounded types every busbar plugin is written against, and nothing else."
license = "Apache-2.0"

# DEPENDENCY POLICY (the core-to-plugin section of the design). This crate is the ONLY thing a
# plugin manifest may name from busbar, so it must stand alone: it names no kernel crate, no
# capability crate, no unit crate, no plane and no transport. Standard library, serde, and reviewed
# third-party crates only.
#
# `serde` is here because the closed grammars below (claims, selectors, locations) are sealed into
# the policy journal and read back out of config; a grammar that cannot round-trip through the
# journal cannot be sealed, and sealing is what makes a claim decidable at boot.
#
# `futures` is here for exactly one item: the `Stream` trait in the transport frame pump. The
# standard library has no stable stream trait, and inventing a private one would mean every in-tree
# transport re-implements the adapter the ecosystem already has.
#
# The closed JSON span grammar lives in the `json_grammar` module (folded in from the former
# `busbar-grammar` crate, DECISIONS #40 — the fold satisfies the dep-wall exactly: a plugin
# compiling against the contract no longer drags a second busbar crate into its closure), and is
# re-exported at `busbar_contract::spans` so that a plane resolving a declared pointer and the
# kernel resolving the same pointer are one reading of one grammar rather than two.
#
# The transport-facing half of this contract lives in the `transport` module (folded in from the
# former `busbar-contract-transport` crate, DECISIONS #38): a KIND is a match-arm, not a crate, so
# the vocabulary only a transport author reads is one module tree here rather than a sibling crate.
# The handful of names a plane still touches are re-exported at the crate root, so
# `busbar_contract::wire` means what it always meant.
[dependencies]
serde = { workspace = true }
futures = { workspace = true }

# Tests only. The ABI types that seal into the policy journal are serialised by something, and a
# test that asserts what a serialisation does NOT contain has to run a real serializer over it.
[dev-dependencies]
serde_json = { workspace = true }

# The two NEUTRAL capability features that gate the `transport::transport` module's
# `Transport`/`UpstreamWireKind` wire-selection axis (folded in from `busbar-contract-transport`,
# DECISIONS #38). Both empty here — they gate `#[cfg]` sites only — and must stay DECLARED or
# `unexpected_cfgs` fires under `-D warnings`. `busbar-substrate-values` forwards its own same-named
# features to these so the gated surface arms in lock-step, exactly as before the fold.
[features]
dispatch = []
runtime = []
