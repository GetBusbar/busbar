[package]
name = "busbar-transport-grpc"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The gRPC transport: unary and multiplexed streams over HTTP/2, byte-blind (no protobuf message meaning)."
license = "Apache-2.0"

[lib]
name = "busbar_transport_grpc"
path = "src/lib.rs"

[dependencies]
tokio-util = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
# The layer this one composes over: `grpc` drives HTTP/2 over a stream it gives up, and opens no
# socket of its own. `src/mount.rs` is written against `busbar_transport_http::mount` and says so,
# so this edge is real and shipped — it is the one transport-to-transport edge this crate keeps, and
# whether it should exist at all is the open question in DECISIONS #40's dep wall, not a thing a
# manifest edit settles. `busbar-transport-tcp` is NOT here: its only mention in the crate is
# `src/tests/battery.rs`, and it has moved to `[dev-dependencies]` accordingly.
busbar-transport-http = { path = "../busbar-transport-http" }
tokio = { workspace = true, features = ["rt", "macros", "io-util", "sync", "time"] }
# `tonic` here is used ONLY for its codec/status/streaming machinery (`tonic::codec::Codec`,
# `tonic::Status`, `tonic::server::Grpc`, `tonic::client::Grpc`) — the gRPC WIRE FRAMING (the
# 5-byte length-prefix per message, the `grpc-status` trailer) with a byte-blind custom `Codec`
# (see `codec.rs`) that carries no protobuf meaning at all. `default-features = false` (the
# workspace pin) keeps `tonic::transport` (the whole `Channel`/`Server` framework, `axum`
# included) OUT of this crate's build: the HTTP/2 listener and dialer below are this crate's own,
# built directly on `hyper`/`hyper-util` (already-pinned workspace deps), which is the deliberate
# choice this crate's own report explains: `tonic::transport::Server`'s routing is by declared
# service NAME, and this transport is protocol-blind — it has no service name to route by.
tonic = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
# The TEST-ONLY seal (#65). `busbar_contract::plugin::TestKernelSeal` is the one blessed
# fixture implementor of the SEALED `KernelSeal` trait; this crate's test harnesses used to
# forge their own. Dev-only and feature-gated, so it is absent from every release build.
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }
# The socket the battery opens under the stack — test-time only; see the note above.
busbar-transport-tcp = { path = "../busbar-transport-tcp" }
# `test-util` is dev-only (this list is `[dev-dependencies]`), so `start_paused` never reaches a
# release build: it lets item 146's stalled-preface cases prove the budget by letting the runtime
# auto-advance virtual time to it, rather than the test suite actually waiting ten real seconds.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util"] }
