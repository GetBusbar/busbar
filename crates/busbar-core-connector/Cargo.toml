# busbar-core-connector — the connector (`BUSBAR-1.6.0.md` THE DESIGN, the connections
# section): the chain is kernel -> busbar-core-connector -> transport plugins. Every plugin that needs an
# external connection declares a need; the kernel instantiates the transport through this crate. It
# holds the one connection table every kind reaches the network through (`busbar_contract::conn`),
# and it is the one place TLS lives: connection security (`tls`, formerly the `busbar-core-connsec`
# crate, folded in verbatim) is core-only and never crosses to a plugin.
#
# A trusted, compiled-in, CLEANLINESS crate, same category as the other
# core-tier crates (DECISIONS #37): a mandatory sibling of `busbar-kernel`, never a
# plugin. One-way dependency on `busbar-kernel` (it reads `TlsCfg` and resolves key material through
# `SecretResolver`) — `busbar-kernel` depends on nothing here.
#
# THE NAME. `connector` names what the crate does for every kind — it connects a need to a transport
# — not any one kind or transport instance, so it needs no waiver under #37's "no
# `busbar-core-<kind>` ever".
[package]
name = "busbar-core-connector"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The connector: the one connection table every plugin kind reaches the network through, and core-only connection security (the opaque ConnectionSecurity wrap, identity / rustls-backed TLS, fail-closed on a TLS-configured binding no capable transport can serve)."
license = "Apache-2.0"

[lib]
name = "busbar_core_connector"
path = "src/lib.rs"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
# One-way: this crate reads `busbar-kernel`'s `TlsCfg` config shape and its `SecretResolver` seam
# (the "secret kind" — the one place a `SecretRef` is turned into bytes), reads its `Destinations`
# config and implements its `DestJudge` trait with the one destination guard (`guard`, `process`);
# `busbar-kernel` names nothing here.
busbar-kernel = { path = "../busbar-kernel", default-features = false }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true }
futures = { workspace = true }
# Bridges the contract's rustls-free, futures-io-based `RawIo` (the wrap's parameter/return type)
# to the tokio-io types `tokio_rustls::TlsAcceptor` requires — the same compat seam the kernel's
# accept loop (`busbar_kernel::tls::serve_one`) crosses on the other side of `wrap`.
tokio-util = { workspace = true }
# The OUTBOUND half (`tls::client`): the platform trust anchors every dialled connection starts from, and
# the SHA-256 an SPKI pin is compared under. Both moved here with the outbound trust itself, which a
# transport no longer holds (TRANSPORT-STACK: TLS is core's connection security).
webpki-roots = { workspace = true }
# The host's UDP port (`udp`): a non-blocking datagram socket built without a runtime.
socket2 = { workspace = true }
# The dtls engine (`dtls`): dimpl for the DTLS state machine, run on ring through the engine's own
# provider (the one crypto backend); rcgen mints the per-session certificate on ring; webpki is
# rustls's ring signature verifier; zeroize clears the exported SRTP keying material.
dimpl = { workspace = true }
ring = { workspace = true }
rcgen = { workspace = true }
webpki = { workspace = true }
zeroize = { workspace = true }
# STUN FINGERPRINT (CRC-32) on the dtls engine's consent probes.
crc32fast = { workspace = true }

# THE HOST'S SOCKETS AND THEIR READINESS (`io`, `socket`, `compose`, `wire`): the connector owns every
# OS socket (BUSBAR-1.6.0.md THE DESIGN, §5). `tokio` is asked for its reactor registration
# (`net`: `AsyncFd`) and its timer (`time`) on the calling worker's own runtime — no runtime and no
# thread of this crate's. `socket2` makes the non-blocking connect and the per-acceptor listener
# (address and port reuse); `libc` names the in-progress connect. `process`: a need whose target is a
# PROGRAM is the child's pipes, spawned and killed by the connector (its reactor carries them).
tokio = { workspace = true, features = ["net", "time", "rt", "process"] }
libc = { workspace = true }

# THE PUBLISHED CONFORMANCE SUITE'S HOST CONNECTOR (`conformance`, never a default and never named by
# a shipped build): the suite (`busbar-plugin-loader`'s `conformance`) binds a networked plugin over
# THIS crate's own connector, composed as the root composes it (carrier -> [TLS] -> framer) over the
# linked tcp and http framer doors. A plugin repo reaches it only through a dev-dependency.
busbar-plugin-loader = { path = "../plugin-loader", features = ["conformance"], optional = true }
busbar-transport-tcp = { workspace = true, optional = true }
busbar-transport-http = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# The suite's host connector (`conformance`): see the optional dependencies above.
conformance = [
    "dep:busbar-plugin-loader",
    "dep:busbar-transport-tcp",
    "dep:busbar-transport-http",
    "dep:serde_json",
]


[dev-dependencies]
# Independent RustCrypto witness: the tests check ring-computed digests against it byte for byte.
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
# THE REAL-TLS ROWS (tls/engine_tests.rs): the kernel's outbound engine and TLS listener driven over
# this crate's wrap. TLS stays in the connector, so the rows that need a real handshake through the
# kernel live here: the kernel's test kit (its fixture servers and the test install of the
# egress-trust capability), 1.5.5's pinned reqwest client the egress differential compares against
# and whose `Identity::from_pem` the identity PEM walk keeps verdict parity with, and the router the
# TLS listener serves. Dev-only.
busbar-kernel = { path = "../busbar-kernel", default-features = false, features = ["test-support"] }
reqwest = { workspace = true }
axum = { workspace = true, features = ["http1"] }
http-body-util = { workspace = true }
bytes = { workspace = true }
# THE UNIVERSAL-NEEDS WITNESS (tests/universal_needs.rs, its only user): the fixture below is loaded
# dropped in through the real admission, scan and open, never a host written for the test. Dev-only.
busbar-plugin-loader = { path = "../plugin-loader" }
serde_json = { workspace = true }
# The tls tests write the minted cert and key as PEM; the shipped dtls engine mints DER only.
rcgen = { workspace = true, features = ["pem"] }
# THE DOOR THE WITNESS DRIVES, dropped in: the tcp transport repo's cdylib (the socket framer), at
# the rev the workspace pins, built under `deps/` by this edge and found by what it states, never by
# name. Dev-only; the wires' own both-doors conformance lives in their repos. The http repo's cdylib
# is not an edge here: its closure reaches a socket stack (hyper-util, socket2, tokio net) that
# qa/dep-wall.ledger does not pin for it, and a new offender is never pinned in the change that
# brings it in.
busbar-transport-tcp-plugin = { workspace = true }

# THE UNIVERSAL-NEEDS FIXTURE: a secret-kind plugin that declares one outbound need and dials through
# the connection table. A cargo example, built by `cargo test` as a cdylib — a fixture, never a
# product plugin, and not a crate of its own.
[[example]]
name = "need_dialler"
crate-type = ["cdylib"]
