[package]
name = "busbar-core-connector"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The connector: the one connection table every plugin kind reaches the network through, and core-only connection security (the opaque ConnectionSecurity wrap, identity / rustls-backed TLS, fail-closed on a TLS-configured binding no capable transport can serve)."
license = "Apache-2.0"

[lib]
name = "busbar_core_connector"
path = "src/lib.rs"

[dependencies]
busbar-ports = { path = "../busbar-ports" }
hex = { workspace = true }
busbar-contract = { path = "../busbar-contract", features = ["tls"] }
arc-swap = { workspace = true }
backon = { workspace = true }
# One-way: busbar-kernel names nothing in this crate.
busbar-kernel = { path = "../busbar-kernel", default-features = false }
busbar-kernel-egress = { path = "../busbar-kernel-egress" }
# The MIN-3 interface the datagram carriers speak (transport constants, record walking, `BoxFut`).
busbar-plugin-abi = { path = "../busbar-plugin-abi", features = ["host"] }
busbar-plugin-loader = { path = "../plugin-loader" }
serde_json = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
webpki-roots = { workspace = true }
x509-cert = { workspace = true }
socket2 = { workspace = true }
# The DTLS protocol engine only (types and state machine); its crypto provider is the backend's,
# reached through `busbar_contract::crypto::dtls`.
dimpl = { workspace = true }
zeroize = { workspace = true }
crc32fast = { workspace = true }
foldhash = { workspace = true }
# Inline small sets (connect candidates, lent fields and datagram paths) with no heap per call.
smallvec = { workspace = true }

tokio = { workspace = true, features = ["net", "time", "rt", "process"] }
libc = { workspace = true }
url = { workspace = true }
http = { workspace = true }
mime = { workspace = true }
hyper = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true, features = ["client-proxy"] }
base64 = { workspace = true }
tracing = { workspace = true }

[features]
# For plugin repos' dev-dependencies only (test certificates through the crypto facade).
test-support = ["busbar-contract/test-support"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
busbar-contract = { path = "../busbar-contract", features = ["tls", "test-support", "stage-probe", "test-seal"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
busbar-kernel = { path = "../busbar-kernel", default-features = false }
# The webpki refusal values the dialled-refusal words are pinned against (tests only).
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
# The tls_subject example dates its run-time certificate from the wall clock.
time = { workspace = true, features = ["std"] }

[lints]
workspace = true
