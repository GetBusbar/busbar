[package]
name = "busbar-core-connector"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The connector: the one connection table every plugin kind reaches the network through, and core-only connection security (the opaque ConnectionSecurity wrap, identity / rustls-backed TLS, fail-closed on a TLS-configured binding no capable transport can serve)."
license = "Apache-2.0"

[lib]
name = "busbar_core_connector"
path = "src/lib.rs"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
arc-swap = { workspace = true }
# One-way: busbar-kernel names nothing in this crate.
busbar-kernel = { path = "../busbar-kernel", default-features = false }
busbar-kernel-egress = { path = "../busbar-kernel-egress" }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
webpki-roots = { workspace = true }
socket2 = { workspace = true }
dimpl = { workspace = true }
ring = { workspace = true }
rcgen = { workspace = true }
webpki = { workspace = true }
zeroize = { workspace = true }
crc32fast = { workspace = true }

tokio = { workspace = true, features = ["net", "time", "rt", "process"] }
libc = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }

[features]
# For plugin repos' dev-dependencies only.
test-support = ["rcgen/pem"]

[dev-dependencies]
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
busbar-kernel = { path = "../busbar-kernel", default-features = false, features = ["test-support"] }
busbar-plugin-loader = { path = "../plugin-loader" }
serde_json = { workspace = true }
rcgen = { workspace = true, features = ["pem"] }
busbar-stub-transport-plugin = { path = "../plugin-loader/stubs/transport/plugin" }
busbar-test-kit = { path = "../busbar-test-kit" }
