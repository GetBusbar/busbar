[package]
name = "busbar-plugin-loader"
version = "1.5.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar plugin subsystem: signed-tarball discovery, in-memory unpack + verification, the three-phase (structural/trust/conflict) load validation, the name/alias registry, and the memfd/private-temp dynamic loader over the plugin C ABI. All FFI unsafe is isolated here so the engine crate keeps its forbid(unsafe_code) invariant."
license = "Apache-2.0"

[features]
# Dev-only conformance retirement barrier; not enabled by shipped defaults.
test-support = []
# Tooling only: `jsonschema` must never reach the engine's graph. Build the CLI with `--features pack`.
pack = ["dep:jsonschema"]

[[bin]]
name = "busbar-plugin-pack"
path = "src/pack.rs"
required-features = ["pack"]

[[test]]
name = "c_abi"
path = "tests/c_abi.rs"
test = false

[[example]]
name = "dispatch_test_plugin"
path = "tests/fixtures/dispatch_test_plugin.rs"
crate-type = ["cdylib"]

[[example]]
name = "log_witness_door"
path = "tests/fixtures/log_witness_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "conditional_store_door"
path = "tests/fixtures/conditional_store_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "conditional_store_legacy_door"
path = "tests/fixtures/conditional_store_legacy_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "secret_broken_door"
path = "tests/fixtures/secret_broken_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "hook_broken_door"
path = "tests/fixtures/hook_broken_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "hook_checkpoint_door"
path = "tests/fixtures/hook_checkpoint_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "json_contract_auth"
path = "tests/fixtures/json_contract_auth.rs"
crate-type = ["cdylib"]

# Adversarial metadata-only descriptor forwarding to the qualified actual Ranking image.
[[example]]
name = "hook_metadata_boundary"
path = "tests/fixtures/hook_metadata_boundary.rs"
crate-type = ["cdylib"]

[dependencies]
ring = { workspace = true }
arc-swap = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
busbar-kernel-seams = { path = "../busbar-kernel-seams" }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
libloading = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
getrandom = { workspace = true }
# `pack` feature only.
jsonschema = { workspace = true, optional = true }

[dev-dependencies]
base64 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util"] }
h2 = { workspace = true }
log = { workspace = true }
tungstenite = { workspace = true }
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }
