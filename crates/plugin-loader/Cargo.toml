[package]
name = "busbar-plugin-loader"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar plugin subsystem: signed-tarball discovery, in-memory unpack + verification, the three-phase (structural/trust/conflict) load validation, the name/alias registry, and the memfd/private-temp dynamic loader over the plugin C ABI. All FFI unsafe is isolated here so the engine crate keeps its forbid(unsafe_code) invariant."
license = "Apache-2.0"

[features]
# Dev-only conformance retirement barrier and the standalone test harness (path loaders,
# probes, door helpers); never enabled by shipped defaults.
test-support = ["busbar-artifact-verifier/test-support"]
# Tooling only: `jsonschema` must never reach the engine's graph. Build the CLI with `--features pack`.
pack = ["dep:jsonschema"]

[[bin]]
name = "busbar-plugin-pack"
path = "src/pack.rs"
required-features = ["pack"]

[[example]]
name = "dispatch_test_plugin"
path = "tests/fixtures/dispatch_test_plugin.rs"
crate-type = ["cdylib"]

[[example]]
name = "log_witness_door"
path = "tests/fixtures/log_witness_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "neutral_store_door"
path = "tests/fixtures/neutral_store_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "neutral_export_door"
path = "tests/fixtures/neutral_export_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "neutral_plane_door"
path = "tests/fixtures/neutral_plane_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "neutral_secret_door"
path = "tests/fixtures/neutral_secret_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "neutral_rotating_secret_door"
path = "tests/fixtures/neutral_rotating_secret_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "secret_broken_door"
path = "tests/fixtures/secret_broken_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "json_contract_auth"
path = "tests/fixtures/json_contract_auth.rs"
crate-type = ["cdylib"]

[[example]]
name = "neutral_frame_door"
path = "tests/fixtures/neutral_frame_door.rs"
crate-type = ["cdylib"]

# The native pack proof uses an actual exported MIN-3 image, built with the other examples.
[[example]]
name = "native_pack_fixture"
path = "tests/fixtures/native_pack_fixture.rs"
crate-type = ["cdylib"]

# A MIN-3 store whose describe answers a recursion-bomb D_SCHEMA (core's D_SCHEMA validator; admin inspect).
[[example]]
name = "native_schema_bomb"
path = "tests/fixtures/native_schema_bomb.rs"
crate-type = ["cdylib"]

# A MIN-3 store whose describe touches a thread_local with a destructor, so glibc keeps it mapped after dlclose
# (DES-443 r3: an inspected image that pins itself).
[[example]]
name = "native_tls_pin"
path = "tests/fixtures/native_tls_pin.rs"
crate-type = ["cdylib"]

[dependencies]
busbar-artifact-verifier = { path = "../busbar-artifact-verifier" }
busbar-artifact-metadata = { path = "../busbar-artifact-metadata" }
busbar-ports = { path = "../busbar-ports" }
arc-swap = { workspace = true }
foldhash = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
busbar-kernel-breaker = { path = "../busbar-kernel-breaker" }
hex = { workspace = true }
# The MIN-3 plugin interface, core side (ABI-MIN3-INTERFACE §10, §11).
busbar-plugin-abi = { path = "../busbar-plugin-abi", features = ["host"] }
# The plugin boundary (UNSAFE-MIN r3.1): admit opens, bounds-checks and admits images through its `image` module
# (the `host` dependent role in unsafe.yaml).
busbar-ffi = { path = "../busbar-ffi", features = ["host"] }
libloading = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
olpc-cjson = { workspace = true }
# The canonical writer of release_trust: `sonic_rs::Serializer` over olpc-cjson's formatter (SERDE-JSON-EXIT r2 §2).
sonic-rs = { workspace = true }
time = { workspace = true, features = ["macros", "parsing"] }
tracing = { workspace = true }
zeroize = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
# `pack` feature only.
jsonschema = { workspace = true, optional = true }

[dev-dependencies]
busbar-artifact-verifier = { path = "../busbar-artifact-verifier", features = ["test-support"] }
base64 = { workspace = true }
tracing-core = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util"] }
h2 = { workspace = true }
log = { workspace = true }
tungstenite = { workspace = true }
busbar-contract = { path = "../busbar-contract", features = ["test-seal", "stage-probe"] }
# The LEASE-HANDED surface rule (tests/lease_surface.rs) reads the loader's own source.
syn = { workspace = true }
stats_alloc = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[[example]]
name = "neutral_transport_door"
path = "tests/fixtures/neutral_transport_door.rs"
crate-type = ["cdylib"]

