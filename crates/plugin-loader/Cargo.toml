[dependencies]
ring = { workspace = true }
arc-swap = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
libloading = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
getrandom = { workspace = true }
# `pack` feature only.
jsonschema = { workspace = true, optional = true }

[dev-dependencies]
base64 = { workspace = true }
tracing-core = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util"] }
h2 = { workspace = true }
log = { workspace = true }
tungstenite = { workspace = true }
busbar-contract = { path = "../busbar-contract", features = ["test-seal", "stage-probe"] }
# Lock alignment (check_shared_core_resolution): dist/default unifies digest 0.11 with `mac` and
# `oid` (its pinned postgres-protocol brings hmac 0.13 and default sha2 0.11), so the root lock must
# resolve the same digest for every shared core crate. Dev-only: plugins never build it.
digest = { version = "0.11", default-features = false, features = ["mac", "oid"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

