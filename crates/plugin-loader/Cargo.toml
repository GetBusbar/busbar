[package]
name = "busbar-plugin-loader"
version = "1.5.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar plugin subsystem: signed-tarball discovery, in-memory unpack + verification, the three-phase (structural/trust/conflict) load validation, the name/alias registry, and the memfd/private-temp dynamic loader over the plugin C ABI. All FFI unsafe is isolated here so the engine crate keeps its forbid(unsafe_code) invariant."
license = "Apache-2.0"

[features]
# Tooling only: `jsonschema` must never reach the engine's graph. Build the CLI with `--features pack`.
pack = ["dep:jsonschema"]

[[bin]]
name = "busbar-plugin-pack"
path = "src/pack.rs"
required-features = ["pack"]

[[example]]
name = "dispatch_test_plugin"
path = "tests/fixtures/dispatch_test_plugin.rs"
crate-type = ["cdylib"]

[[example]]
name = "plane_door_plugin"
path = "tests/fixtures/plane_door_plugin.rs"
crate-type = ["cdylib"]

[[example]]
name = "log_witness_door"
path = "tests/fixtures/log_witness_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "store_v3_door"
path = "tests/fixtures/store_v3_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "open_reason_store_door"
path = "tests/fixtures/open_reason_store_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "secret_broken_door"
path = "tests/fixtures/secret_broken_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "hook_door"
path = "tests/fixtures/hook_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "hook_broken_door"
path = "tests/fixtures/hook_broken_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "json_contract_auth"
path = "tests/fixtures/json_contract_auth.rs"
crate-type = ["cdylib"]

[[example]]
name = "neutral_frame_door"
path = "tests/fixtures/neutral_frame_door.rs"
crate-type = ["cdylib"]

[dependencies]
busbar-contract = { path = "../busbar-contract" }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
libloading = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
getrandom = { workspace = true }
# `pack` feature only.
jsonschema = { workspace = true, optional = true }

[dev-dependencies]
ring = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util"] }
busbar-stub-export = { path = "stubs/export/logic" }
busbar-stub-export-plugin = { path = "stubs/export/plugin", features = ["dropped-in"] }
busbar-stub-export-carried = { path = "stubs/export-carried/logic" }
busbar-stub-export-carried-plugin = { path = "stubs/export-carried/plugin", features = ["dropped-in"] }
busbar-stub-export-scrape = { path = "stubs/export-scrape/logic" }
busbar-stub-export-scrape-plugin = { path = "stubs/export-scrape/plugin" }
busbar-stub-export-trace = { path = "stubs/export-trace/logic" }
busbar-stub-export-trace-plugin = { path = "stubs/export-trace/plugin" }
busbar-stub-store = { path = "stubs/store/logic" }
busbar-stub-secret = { path = "stubs/secret/logic" }
busbar-stub-auth-verify = { path = "stubs/auth-verify/logic" }
busbar-stub-auth-verify-plugin = { path = "stubs/auth-verify/plugin" }
h2 = { workspace = true }
log = { workspace = true }
tungstenite = { workspace = true }
busbar-stub-transport-plugin = { path = "stubs/transport/plugin" }
busbar-stub-transport = { path = "stubs/transport/logic" }
busbar-contract = { path = "../busbar-contract", features = ["test-seal", "services-double"] }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[package.metadata.busbar.both-ways]
store = "busbar-stub-store"
auth-verify = "busbar-stub-auth-verify"
secret = "busbar-stub-secret"
transport = "busbar-stub-transport"
export = "busbar-stub-export"
export-carried = "busbar-stub-export-carried"
export-scrape = "busbar-stub-export-scrape"
export-trace = "busbar-stub-export-trace"
