[package]
name = "busbar-plugin-loader"
version = "1.5.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar plugin subsystem: signed-tarball discovery, in-memory unpack + verification, the three-phase (structural/trust/conflict) load validation, the name/alias registry, and the memfd/private-temp dynamic loader over the plugin C ABI. All FFI unsafe is isolated here so the engine crate keeps its forbid(unsafe_code) invariant."
license = "Apache-2.0"

[dependencies]
busbar-api = { path = "../api" }
busbar-plugin = { path = "../busbar-plugin" }
busbar-plugin-sign = { path = "../plugin-sign" }
# The three unit-side store seams the composition root binds to one loaded store (`store_adapter`).
# None of the three crates may name a store, so the adapter that implements all three lives on this
# side of the seam — where the loaded plugin and its declared payload schema already are. All three
# depend only on `busbar-caps`/`busbar-contract`, so there is no cycle back into this crate.
busbar-caps = { path = "../busbar-caps" }
busbar-kernel = { path = "../busbar-kernel" }
busbar-unit-verbs = { path = "../busbar-unit-verbs" }
# The migration's read off the previous release's rows. The ledger unit states WHAT an opening
# figure is; the row shapes it is read from are on this side of the seam, where the loaded plugin
# already is — the same division the ledger's dual write makes in the other direction. The ledger
# unit depends only on `busbar-caps`, so there is no cycle back into this crate.
busbar-unit-ledger = { path = "../busbar-unit-ledger" }
busbar-unit-wal = { path = "../busbar-unit-wal" }
libloading = { workspace = true }
# The kind:hook seam: `DlopenPolicy` implements the async `busbar_api::RoutingPolicy` trait, running
# the blocking `busbar_call` on `spawn_blocking` (a hook gate can be CPU-heavy). `async-trait` matches
# the engine's; `tokio` is `rt`/`time`/`sync` only (spawn_blocking, timeout, the hook-call semaphore)
# — no runtime is started in this crate.
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Structured logging for the auth seam's fail-closed rejections (a misbehaving auth plugin is logged,
# never admitted). Already the workspace's logging facade; adds no new external crate to the tree.
tracing = { workspace = true }
# Tarball packaging/unpacking for the one-file-per-plugin `.tar.gz` format. flate2 with its
# pure-Rust backend (miniz_oxide) so static musl release builds need no C zlib.
tar = { workspace = true }
flate2 = { workspace = true }
# Random staging-directory suffix (a pid alone is predictable to a pre-planter).
getrandom = { workspace = true }

[dev-dependencies]
# The end-to-end DlopenPolicy test drives the async RoutingPolicy methods, so the test needs a
# runtime + the `#[tokio::test]` macro (the crate's own dep is `rt`/`time` only — no macros).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(unix)'.dependencies]
# memfd_create (Linux zero-disk loads) + kill(pid, 0) liveness for the dead-pid staging sweep.
libc = { workspace = true }

# NOTE: the end-to-end tests load real plugin cdylibs (busbar-secret-example-plugin and
# busbar-store-sqlite-plugin — the latter built from a sibling ../store-sqlite checkout, since
# store-sqlite is fully extracted and no longer lives in this workspace), but a cdylib crate cannot
# be a Rust dependency (no rlib to link). The tests instead locate the artifact on disk and skip if
# it isn't built — under `cargo test --workspace` every in-tree member cdylib is present; the
# sibling-built one is present only under dev-gate.yml (see store_fixture_plugin_path()'s doc
# comment in src/lib.rs).
