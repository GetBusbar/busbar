# Hook route metadata witness using the neutral SDK fixture.
[[example]]
name = "hook_metadata_boundary"
path = "tests/fixtures/hook_metadata_boundary.rs"
crate-type = ["cdylib"]

[[example]]
name = "neutral_frame_door"
path = "tests/fixtures/neutral_frame_door.rs"
crate-type = ["cdylib"]

[dependencies]
arc-swap = { workspace = true }
foldhash = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
hex = { workspace = true }
# The MIN-3 plugin interface, core side (ABI-MIN3-INTERFACE §10, §11).
busbar-plugin-abi = { path = "../busbar-plugin-abi", features = ["host"] }
libloading = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
olpc-cjson = { workspace = true }
time = { workspace = true, features = ["macros", "parsing"] }
tracing = { workspace = true }
zeroize = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
# `pack` feature only.
jsonschema = { workspace = true, optional = true }

[dev-dependencies]
base64 = { workspace = true }
tracing-core = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util"] }
h2 = { workspace = true }
log = { workspace = true }
tungstenite = { workspace = true }
busbar-contract = { path = "../busbar-contract", features = ["test-seal", "stage-probe"] }
# The LEASE-HANDED surface rule (tests/lease_surface.rs) reads the loader's own source.
syn = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[[example]]
name = "neutral_transport_door"
path = "tests/fixtures/neutral_transport_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "neutral_auth_door"
path = "tests/fixtures/neutral_auth_door.rs"
crate-type = ["cdylib"]

[[example]]
name = "hook_door"
