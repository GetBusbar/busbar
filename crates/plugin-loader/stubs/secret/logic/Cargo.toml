# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-stub-secret"
version = "1.0.0"
publish = false            # linked into busbar at a pinned rev, or shipped as a signed tarball; never to crates.io
edition = "2021"
rust-version = "1.97"
description = "The environment-variable secret source for busbar's kind:secret plugin family, on the secret kind's memory ABI: `{ env: VAR }` resolves to the variable's value, byte for byte, fail-closed."
license = "Apache-2.0"

[lib]
name = "busbar_stub_secret"
test = false
doctest = false
# rlib only: the logic and its door. A build that LINKS this crate registers `door::door` as its
# row (no symbol is exported from here); the dropped-in cdylib is `busbar-secret-env-plugin`
# (same repo), which exports the same door as `busbar_plugin_door`.
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only), pinned by git rev to `.busbar-ref`.
busbar-contract = { workspace = true }
serde_json = { workspace = true }
