# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-stub-secret-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "The environment-variable secret source as a droppable busbar plugin: a cdylib exporting the secret kind's door. Drop it in the plugins folder and reference secrets as { env: VAR }."
license = "Apache-2.0"

[lib]
test = false
doctest = false
# cdylib: the DROPPED-IN door, exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what the conformance test depends on to have the cdylib built.
crate-type = ["cdylib", "rlib"]

[dependencies]
# THE LOGIC, same repo: its `door::door` is the door this image exports.
busbar-stub-secret = { path = "../logic" }
busbar-contract = { workspace = true }
