# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-stub-export-scrape"
version = "1.5.0"
publish = false
edition = "2021"
rust-version = "1.97"
description = "The prometheus export sink: renders the host recorder's snapshot as the Prometheus text exposition the host serves at the well-known /metrics. Linked into the shipped binary, or dropped in as a signed tarball — one registration, one contract."
license = "Apache-2.0"

[lib]
name = "busbar_stub_export_scrape"
test = false
doctest = false
# rlib only: the logic and its door. A build that LINKS this crate registers `door::door` as its row
# (no symbol is exported from here); the dropped-in cdylib is `busbar-export-prometheus-plugin` (same
# repo), which exports the same door as `busbar_plugin_door`.
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only; DECISIONS #84 merged the plugin SDK into it
# as `busbar_contract::abi::sdk`, so a plugin's busbar closure is exactly busbar-contract). Pinned by
# git rev to the busbar commit in `.busbar-ref`; a busbar build that links this crate `[patch]`es the
# busbar git source to its own tree, so ONE copy of the contract links.
busbar-contract = { workspace = true }
# The settings shape this sink validates (`buffer_seconds`, `key_gauge_limit`) is parsed with serde so
# its refusals read exactly as the configuration's own settings errors always have.
serde = { workspace = true }
serde_json = { workspace = true }
