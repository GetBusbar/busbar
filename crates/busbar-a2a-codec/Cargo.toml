# busbar-a2a-codec — THE A2A WIRE VOCABULARY, with nothing that opens anything.
#
# WHY THIS CRATE EXISTS. `busbar-a2a` was two things wearing one name: the A2A wire vocabulary (the
# JSON canonicalization the card signature is taken over, the anomaly grammar, the request-id
# remapping table, the meter-class projection, the durable task/task-event record shapes, the mount
# paths and the registry key) and the A2A plane that carries them over the network (the axum REST
# and JSON-RPC routes, the tonic gRPC binding, the reqwest relay leg, the push-notification
# delivery, the mTLS transport). The A2A PLANE CRATE (`busbar-plane-a2a`) adapts the first and must
# never link the second — a plane is a pure kind, and the plane's HTTP/gRPC stack put `hyper`,
# `reqwest`, `axum`, `tonic` and a socket-capable `tokio` in the pure kind's transitive closure.
# This crate is the first half, so `busbar-plane-a2a` can name the vocabulary without the server.
#
# THE RULE THIS CRATE KEEPS. No `hyper`, no `reqwest`, no `axum`, no `tonic`, no `tokio`, and no
# `std::{net,fs,process,env}` in its own dependencies or its own source.
#
# WHAT STAYED BEHIND in `busbar-a2a`: the plane — the agent card and its trust pin, the JWS
# verification that reads that pin, the registry and its drift ledger, the inbound admission, the
# relay, the REST/JSON-RPC/gRPC bindings, the push delivery and the task store. `busbar-a2a` depends
# on this crate and re-exports every module that moved, so a caller that named
# `busbar_a2a::record::…` or `crate::a2a::canonical::…` still resolves it.
[package]
name = "busbar-a2a-codec"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# `rust-version` rationale: see busbar-core/Cargo.toml — one pinned number, set to what CI verifies.
rust-version = "1.97"
description = "The A2A wire vocabulary for busbar: the JSON canonicalization the card signature is taken over, the anomaly grammar, the request-id remapping table, the meter-class projection and the durable task record shapes — the pure half of the A2A protocol, with no I/O in its closure."
license = "Apache-2.0"

[lib]
name = "busbar_a2a_codec"
path = "src/lib.rs"

[dependencies]
# The plugin CONTRACTS: the durable record vocabulary (`PlaneRecord`, `PlaneSelector`,
# `PlaneDisposition`, the store result types) the task rows are written and read through. A leaf.
busbar-api = { path = "../api" }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# DECLARED, AND DELIBERATELY EMPTY. The three relocated modules carry
# `#[cfg(all(test, feature = "test-support"))]` test gates: those suites were written for the
# dual-compile binary and are configured OUT of the owning plugin's own test binary, and they must
# stay configured out here too or the split would change what runs. Declaring the feature is what
# makes those `#[cfg]`s resolve to the SAME answer they resolved to before the move; forwarding it
# anywhere would change that answer.
test-support = []

[dev-dependencies]
serde_json = { workspace = true }
