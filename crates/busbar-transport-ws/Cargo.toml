[package]
name = "busbar-transport-ws"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The WebSocket transport: duplex message frames over an HTTP upgrade."
license = "Apache-2.0"

[lib]
name = "busbar_transport_ws"
path = "src/lib.rs"

[dependencies]
tokio-util = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
tokio = { workspace = true, features = ["rt", "macros", "io-util", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
# The TEST-ONLY seal (#65). `busbar_contract::plugin::TestKernelSeal` is the one blessed
# fixture implementor of the SEALED `KernelSeal` trait; this crate's test harnesses used to
# forge their own. Dev-only and feature-gated, so it is absent from every release build.
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }
# The layer this one composes over, AND IT COMPOSES OVER IT AT TEST TIME ONLY. `ws` is an upgrade of
# an HTTP connection, expressed as this transport adopting the stream that one gives up — but the
# adoption is a contract trait method, so the shipped crate never names the transport it adopts
# from; the composition root does. The only lines in this crate that say `busbar_transport_http` or
# `busbar_transport_tcp` are in `src/tests/battery.rs`, which builds a real pair to drive the
# upgrade through. A dev-dependency is available to a `#[cfg(test)]` module inside the lib and is
# absent from every release build, so the battery is unchanged and the plugin closure loses both
# (DECISIONS #40 — the closure, not the direct edge).
busbar-transport-http = { path = "../busbar-transport-http" }
busbar-transport-tcp = { path = "../busbar-transport-tcp" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util"] }
