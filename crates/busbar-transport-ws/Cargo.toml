[package]
name = "busbar-transport-ws"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The WebSocket transport: duplex message frames over an HTTP upgrade."
license = "Apache-2.0"

[lib]
name = "busbar_transport_ws"
path = "src/lib.rs"

[dependencies]
tokio-util = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
busbar-contract-transport = { path = "../busbar-contract-transport" }
# The layer this one composes over: `ws` is an upgrade of an HTTP connection, and the upgrade is
# expressed as this transport adopting the stream that one gives up.
busbar-transport-http = { path = "../busbar-transport-http" }
busbar-transport-tcp = { path = "../busbar-transport-tcp" }
tokio = { workspace = true, features = ["rt", "macros", "io-util", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }
futures = { workspace = true }

[features]
# THE DUPLEX SERVING PATH, DEFAULT OFF. `mount` — the addressing, the open, the pump and the close
# codes — is compiled always, because it is a declaration-driven module with no socket in it and its
# whole battery runs against fakes. This feature is the half that touches one: the `FrameSource` and
# `FrameSink` over a real `WebSocketStream`, and the accept path that runs an upgrade, opens a
# session on it and pumps it to its end. Off, this crate is the byte-for-byte transport it was and no
# call site anywhere names either.
serve-sessions = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util"] }
