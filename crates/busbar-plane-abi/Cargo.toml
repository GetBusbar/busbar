#
# busbar-plane-abi — the HOT-tier, repr(C) POD-by-pointer protocol-plane ABI skeleton.
#
# This is the SIBLING of `busbar-plugin-abi`. That crate is the COLD lane: JSON over a tiny
# extern-C surface for backends OFF the request hot path (store/secret/auth), where a serialize
# per call is irrelevant. THIS crate is the HOT lane: a `#[repr(C)]` fn-pointer vtable, POD args
# by pointer, results by value or into a caller `&mut MaybeUninit<Out>`, zero alloc / zero serde
# on the call — the shape proven <1µs by `plane-abi-spike`. The two disciplines are deliberately
# opposite, so they are deliberately separate crates, not two lanes crammed into one.
#
# ADDITIVE / UNUSED. Nothing in the workspace depends on this crate yet. Phase 2 wires it into the
# engine. It compiles clean and is exercised only by its own tests + the neutrality/layout gates.
[package]
name = "busbar-plane-abi"
version = "1.5.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar protocol-plane HOT-tier repr(C) POD-by-pointer host/decl ABI: the frozen airlock preamble, sized/append-only POD structs, the WorkItem extensibility keystone, and the PlaneHost/PlaneDecl vtables every plane rides."
license = "Apache-2.0"

# No external dependencies BY DESIGN: a hot repr(C) ABI is pure `core`/`std` layout. Nothing to
# inherit from the workspace version table, nothing to serialize.
[dependencies]
