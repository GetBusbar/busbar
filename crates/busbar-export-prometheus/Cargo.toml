[package]
name = "busbar-export-prometheus"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The built-in `prometheus` export sink: the well-known `GET /metrics` it declares, and the scrape it shapes from a reading of the process its composer hands it. Kind `export`."
license = "Apache-2.0"

# ONE DEPENDENCY, AND IT IS THE FACE THIS CRATE IMPLEMENTS, exactly as for its two push siblings.
#
# A sink of this kind names nothing else of the tree: no engine, no router, no recorder, no
# registry. What it needs of the process it was composed into — the exposition — it asks the HOST
# the face hands it, at the moment of the scrape and never before.
[dependencies]
busbar-contract = { path = "../busbar-contract" }
