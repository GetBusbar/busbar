[package]
# The crypto facade (CRYPTO-SEAM §2.1-2.3). Crypto-free: every primitive is the backend's. Reached by
# every other crate as `busbar_contract::crypto`; no crate but busbar-contract and
# busbar-plugin-abi[host] names it (abi sits below busbar-contract, IF §16.23).
name = "busbar-crypto"
version = "1.6.0"
publish = false
edition = "2021"
rust-version = "1.97"
description = "busbar's one crypto API. Calls exactly one busbar-crypto-backend, swappable by [patch]."
license = "Apache-2.0"

[dependencies]
# Named by core's git URL at an exact rev (reproducible builds) so a plugin without a [patch] resolves it; core's roots
# `[patch.'https://github.com/GetBusbar/busbar']` it to crates/busbar-crypto-backend, and a private
# build patches its own crate of the same name in. The rev's crates/busbar-crypto-backend tree must equal
# this commit's (tests/backend_pin.rs): a plugin pinned to this commit builds exactly that backend. A
# backend change therefore takes two commits: the change, then the bump of this rev to a commit carrying it.
busbar-crypto-backend = { git = "https://github.com/GetBusbar/busbar", rev = "84cfdff6ef30e92f14c93f5349fe83d40a7aed47" }
zeroize = { version = "1", default-features = false }
# The listener-ticket key-failure warning (tls::ListenerTickets).
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
# Protocol crates only, with no provider features (the backend turns its provider on).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
rustls-pki-types = { version = "1", default-features = false, features = ["std"], optional = true }
dimpl = { version = "=0.7.4", default-features = false, optional = true }

[features]
# TLS configs, verifiers and the ticketer, built only through this crate (no public provider).
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:dimpl", "dep:tracing", "busbar-crypto-backend/tls"]
# Test certificates; dev-dependencies only.
test-support = ["tls", "busbar-crypto-backend/test-support"]

[dev-dependencies]
# The suite runs against the facade as every crate sees it (busbar_contract::crypto, test-support on).
busbar-contract = { path = "../busbar-contract", features = ["test-support"] }

[lints]
workspace = true
