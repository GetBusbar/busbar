[package]
name = "busbar-transport-webrtc-plugin"
version = "1.6.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "First-party kind:transport plugin cdylib: the `webrtc` framer, packaged as a droppable busbar plugin."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door (`busbar_plugin_door`). rlib: what `cargo test` links, and what makes
# `cargo test` emit the cdylib the conformance test loads.
crate-type = ["cdylib", "rlib"]

[dependencies]
busbar-transport-webrtc = { path = "../busbar-transport-webrtc" }
busbar-contract = { path = "../busbar-contract" }

[dev-dependencies]
# The conformance test loads the linked door and dlopens the built cdylib over the REAL loader.
busbar-plugin-loader = { path = "../plugin-loader", features = ["conformance"] }
