[package]
name = "busbar-kernel-breaker"
version = "1.6.0"
publish = false
edition = "2021"
rust-version = "1.97"
description = "The breaker unit: per-(pool, destination) circuit breaker (trip/cooldown/half-open) and lifetime request budget."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_breaker"
path = "src/lib.rs"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
foldhash = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
tikv-jemallocator = { workspace = true }

# B-WINDOW: one outcome pushed and the window read, timed (median, p99).
[[bench]]
name = "b_window"
path = "benches/b_window.rs"
harness = false

[lints]
workspace = true
