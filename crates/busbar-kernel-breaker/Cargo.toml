# The breaker unit: trip / cooldown / fast-fail per (pool, destination).
#
# WHAT THIS CRATE IS. The design (docs/design/BUSBAR-1.6.0.md THE DESIGN, §1, §5) names a `Breaker` unit
# trait (`observe`/`state`) separate from the egress unit that owns the pool. This crate is that
# unit: the per-cell circuit-breaker state machine (trip, escalating cooldown with jitter, the
# requested-wait floor, half-open recovery probes) plus the per-destination lifetime request budget,
# ported from the 1.5.5 store (`crates/busbar/src/store/in_memory/{breaker,mod}.rs`); the deliberate
# differences are listed in `src/cell.rs`.
#
# WORKSPACE DEPENDENCIES: busbar-contract only (the capability token, the destination locator, the
# transport's fault reading and the disposition table). No `axum` and no `tracing`. The unit reads
# facts only: no status band, no header and no vendor's status is read here (Law 1); a plane's own
# reading of its far end's error is the plane's.
[package]
name = "busbar-kernel-breaker"
version = "1.6.0"
publish = false
edition = "2021"
rust-version = "1.97"
description = "The breaker unit: per-(pool, destination) circuit breaker (trip/cooldown/half-open) and lifetime request budget."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_breaker"
path = "src/lib.rs"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
