# busbar-unit-scope — the APPROVE step: required scope from (claim, op_class) in Policy.
#
# WHY A SEPARATE CRATE. The kernel loop's APPROVE step asks one question — does the principal's
# held scope cover what this operation needs — and answers it with resource locators only; a hook's
# veto is a separate, closed code, and the first veto at any seat wins. None of that needs a wire
# format, an HTTP framework, or a store: it is a pure function over data, so it gets its own crate
# with `busbar-caps` as its only workspace dependency, exactly like the door does not need to know
# what building it is bolted to.
#
# WHAT LIVES HERE. The two-rung `Scope` chain (`ReadOnly`/`Full`), the `Grants` bitset roles
# aggregate into, `required_scope(method, path)` — the admin-API scope matrix ported verbatim from
# 1.5.5's `openapi.json` at the tag (66 operations, 34 read-only / 32 full) — and the kernel-granted
# scopes every principal holds without a `Policy` entry (`transport:handshake`, and the data-listener
# operational routes `/healthz`, `/stats`, `/metrics`, `/metrics/hooks`).
[package]
name = "busbar-unit-scope"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The APPROVE step: required scope from (claim, op_class) in Policy, and the 1.5.5 admin scope table as data."
license = "Apache-2.0"

[lib]
name = "busbar_unit_scope"
path = "src/lib.rs"

[dependencies]
busbar-caps = { path = "../busbar-caps" }
