# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-example-plugin"
version = "1.5.0"
publish = false            # internal TEST-support cdylib; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "A hermetic trivial kind:store plugin cdylib, wrapping the in-tree MemoryStore. Provides the in-tree ABI-crossing coverage for kind:store, mirroring busbar-secret-example-plugin's role for kind:secret. Also the fixture plugin-ci.yml's install-and-serve CI step packs and installs against a real running busbar."
license = "Apache-2.0"

[lib]
# cdylib for the C ABI delivery; rlib is REQUIRED for `cargo test` to actually emit the cdylib
# artifact at all when this crate has no in-crate #[test]s of its own — with cdylib-only, `cargo
# test` builds a trivial "0 tests" harness for this package but never produces the .so/.dylib.
# plugin-loader's durability test dlopens the real built cdylib, so without this it would find
# nothing under a scoped `cargo test -p busbar-plugin-loader`. Same fix, same reason, as
# busbar-secret-example-plugin's.
crate-type = ["cdylib", "rlib"]

[dependencies]
busbar-api = { path = "../api" }
# THE STORE-KIND FACE, NAMED WHERE IT LIVES. `busbar_contract::store` holds the records and the
# 1.5.5 replay face this crate reads and writes; `busbar-api` re-exported them while it drained and
# this line is the drain arriving. No new closure: `busbar-api` already links `busbar-contract`.
busbar-contract = { path = "../busbar-contract" }
busbar-plugin-sdk = { path = "../plugin-sdk" }
# NO SIBLING INSTANCE. This crate is the copy-me template for `kind: store`, so it names no other
# store — its in-process backend is its own (`src/ram.rs`). See PLUGIN-TREE.md §4.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The shared `Store` contract conformance suite. This fixture is a real store plugin, so it answers
# the same cross-backend questions every shipped backend does — the retention sweep above all, whose
# failure mode is destruction rather than a wrong answer.
busbar-plugin-testkit = { path = "../plugin-testkit", features = ["store"] }

[target.'cfg(unix)'.dependencies]
# Advisory whole-file lock (`flock`) around FileStore's read-modify-write, so two handles on one
# durable_path — the fleet this fixture exists to model — serialise their RMW instead of racing and
# losing an update. Unix-only; see FileLock in lib.rs.
libc = { workspace = true }
