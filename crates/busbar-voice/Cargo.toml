# busbar-voice — THE DUPLEX / LIVE-VOICE PLANE CRATE (Plane 4).
#
# The fourth plane KIND — long-lived, bidirectional, per-frame-governed — added as a NEW crate that
# owns 100% of its protocol vocabulary (see docs/design/plane4-duplex-session.md §7). Core / substrate
# / api never learn the word "audio": this crate declares its own `PlaneDecl` and a `ProtocolDecl`
# with `codec: None` exactly as `busbar-mcp` does (the two dialects meet in the plane's own shared IR
# types, not a `DialectCodec` facade), and the neutral registry unions whatever it declares without
# naming it.
#
# STATUS: the four-layer duplex/session IR (`plane4-duplex-session.md` §2), both dialect codecs (OpenAI
# Realtime + Gemini Live), the T2 session pump, and both topologies are implemented behind the "runtime"
# feature. Boot-mounting into the composition root (PLANE_DECL's build / admission / routes hooks) is
# separate, tracked work. It compiles, registers, and is strong-form deletable.
#
# DEPENDENCY POSTURE: `busbar-substrate` is the neutral shared surface the plugin names instead of
# `busbar-core` — in production AND in its tests. Nothing in this crate's closure, under any feature,
# names or links `busbar-core`: the host-driving tests run over the substrate's in-memory fixture host
# (`busbar_substrate::testkit`), reached through the same plane-host seam the production path uses.
[package]
name = "busbar-voice"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# `rust-version` rationale: see busbar-core/Cargo.toml — one pinned number, set to what CI verifies.
rust-version = "1.97"
description = "The duplex / live-voice plane for busbar (Plane 4): the OpenAI Realtime and Gemini Live dialects and the four-layer session IR, as one removable plugin."
license = "Apache-2.0"

[lib]
name = "busbar_voice"
path = "src/lib.rs"

# THE VOICE CONFORMANCE HARNESS — the real driver the `testing/voice-conformance/` battery legs shell
# out to. It reuses THIS crate's codecs (`OpenAiRealtimeCodec` / `GeminiLiveCodec`) and the T2 runtime
# (`SessionCore` / `LocalLease` hard-close) to decode/encode the captured fixtures and diff — the legs
# never reimplement a codec in shell. Gated on `runtime` (the D2 governance probe needs the async
# session engine + tokio) AND `test-support` (the admit/route/audit/exit composition legs drive the
# substrate's `FixtureHost` — a full `EngineHost` double — over the SAME production `EngineHost` seam
# `build_runtime_hosted` takes, so the admin-audit row and the breaker/lease behavior are read back
# through the host, not reimplemented in the harness). Neither feature is default-on, so the default /
# prod build never compiles this bin.
[[bin]]
name = "voice-conform"
path = "src/bin/voice-conform.rs"
required-features = ["runtime", "test-support"]

[dependencies]
# THE SEAL: busbar-core is NOT a dependency of this plugin at all — not in the shipped build and not in
# its test build. Every build compiles with NO busbar-core in its closure; the neutral surface the
# plane names is `busbar-substrate` (+ `busbar-api`), and its tests drive the substrate's fixture host.
# The substrate crate: the neutral shared surface the plugin names instead of busbar-core — the plane
# and protocol registry descriptors (`PlaneDecl`, `ProtocolDecl`), the diagnostics namespace, the
# proxy/egress constants the `ProtocolDecl` fields carry.
busbar-substrate = { path = "../busbar-substrate" }
# The plugin contracts crate, named ahead of use (the `ProtocolDecl::verbs` field is a
# `busbar_api::operation::Operation` slice), exactly as busbar-mcp names it.
busbar-api = { path = "../api" }
# `axum::http::StatusCode` appears in the `ProtocolDecl` field set (quota / auth-failure statuses).
axum = { workspace = true }
# The plane's OWN media-frame carrier: `IrAudioFrame.media` is opaque `bytes::Bytes` (`plane4-duplex-session.md` §2.4 identity IR).
bytes = { workspace = true }
# THE DIALECT CODEC's (de)serialization surface. The plane's IR is busbar-owned, but the OpenAI
# Realtime wire is JSON: the `DuplexReader`/`DuplexWriter` pair parses/produces JSON event frames, so
# the codec derives serde on its OWN wire structs and hand-maps them to/from the neutral IR. Opaque
# JSON payloads (tool arguments, tool definitions, tool_choice) ride as `serde_json::Value` — the
# plane never reshapes them, it carries them verbatim (the `plane4-duplex-session.md` §2.2 tool moat normalizes correlation, not
# the argument bytes).
serde = { workspace = true }
serde_json = { workspace = true }
# THE `streams:` CONFIG-SECTION reader (`config.rs`): `PLANE_DECL.parse_section` deserializes the
# owned section from a `serde_yaml::Value` through the plane's own typed `StreamsCfg`, exactly as the
# MCP/A2A `parse_section` hooks do. UNCONDITIONAL (config parse/validate is needed in the default
# feature-off build too), so it is a plain dep rather than a `runtime`-gated one.
serde_yaml = { workspace = true }

# ── THE T2 RUNTIME's async surface — OPTIONAL, pulled ONLY by the `runtime` feature (OFF by default).
# The default / prod `cargo build -p busbar-voice` compiles with NONE of these in its closure: the
# IR + declarations need no async runtime. The live duplex session pump (`session.rs`), the
# metering lease, and the two topologies name `async_trait`, the `futures` Stream/Sink vocabulary the
# neutral `serve_messages` pump is generic over, and `tokio` sync/task primitives — so each is an
# OPTIONAL dep the `runtime` feature turns on (HARD RULE 4: the async surface stays feature-gated, not compiled into the default build).
async-trait = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# `net` + `rt-multi-thread`: the voice CONFORMANCE HARNESS's `provider-dial` / `gemini-live-route` legs
# stand up a tiny in-process loopback WS provider (a stand-in for a real realtime provider) and drive
# `topology::dial_provider` at it end to end — the harness needs a real listener + a runtime that can
# accept a connection while the dial races it, not just the single-threaded task/timer primitives the
# rest of the plane's async surface needs. The PRODUCTION runtime never binds a listener of its own
# (see `crate::mount::voice_start`), so this is pure harness/test weight, still `runtime`-gated.
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "net", "rt-multi-thread"], optional = true }
# THE LOOPBACK PROVIDER's WS ACCEPT SIDE — `topology::dial_provider` (and the substrate egress dialer
# it rides) already pulls `tokio-tungstenite` transitively through `busbar-substrate/runtime`; this is
# the harness's OWN direct dep for the ACCEPT half (`accept_async`), which the substrate crate has no
# reason to expose. Same feature set as the substrate's own use (handshake only, no TLS/connector).
tokio-tungstenite = { workspace = true, optional = true }
# THE NEUTRAL ROUTE-ENUM ABI (`RouteAuth`/`RouteMethod`) the plane names to describe its data routes as
# `PlaneRouteSpec`s (`PLANE_DECL.routes`), the SAME crate busbar-a2a names for its own routes. OPTIONAL,
# pulled only by `runtime`: the default feature-off build mounts no routes and names no route enum.
busbar-plugin = { path = "../busbar-plugin", optional = true }
# `url` — ONE reading of the deployment's `public_url` into the plane's RFC 8707 audience + metadata URL
# (`crate::mount::absolute`, the A2A `serve::absolute` discipline). OPTIONAL, pulled only by `runtime`.
url = { workspace = true, optional = true }
# `tracing` — the boot `hydrate` / `start` hooks log the durable-session restore outcome (counts, and a
# per-row unreadable warning) exactly as the A2A / MCP boot hooks do. OPTIONAL, pulled only by `runtime`
# (the boot hooks arm with the live session runtime); the default feature-off build wires no boot hook.
tracing = { workspace = true, optional = true }
# The egress request/response vocabulary the concrete HTTPS token minter names to drive the substrate
# egress engine: `http::Request`/`Response`, the `Full<Bytes>` request body, and the `Incoming` body
# reader. OPTIONAL, pulled only by `runtime` (the minter compiles with the rest of the async topology).
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
# The neutral telemetry recorder the front-door session-open counter emits into
# (`busbar_plane_requests_total`, plane = voice) — the SAME `metrics` crate the substrate's
# `upstream_attempt_on` emit names, so voice counts on the family without reaching into `busbar-core`.
# OPTIONAL, pulled only by `runtime` (the mount that emits is runtime-gated).
metrics = { workspace = true, optional = true }

[features]
# THE VOICE SESSION RUNTIME — the T2 live duplex engine (session pump + SessionScope + D2 metering
# lease + both topologies). OFF by default (HARD RULE 4): the default workspace build is UNAFFECTED and
# the crate still compiles with the flag off (IR + declarations only, no async runtime pulled in). Turning it on pulls the
# async closure (`async-trait` / `futures` / `tokio`) and compiles `session`/`topology`.
# `busbar-substrate/runtime` ARMS the neutral full-duplex WS transport (the ingress acceptor + the
# net-guard-pinned egress dialer): the plane SELECTS `Transport::WebSocket` and lets the substrate open
# the socket, so the provider sideband WSS dials THROUGH `net_guard` and the plane holds no socket
# plumbing of its own. Turned on in lock-step with the plane's own async runtime.
runtime = ["dep:async-trait", "dep:futures", "dep:tokio", "dep:tokio-tungstenite", "dep:busbar-plugin", "dep:url", "dep:tracing", "dep:http", "dep:http-body-util", "dep:hyper", "dep:metrics", "busbar-substrate/runtime"]
# THE OPENAPI-SCHEMA EDGE, mirroring busbar-mcp/busbar-a2a: `PlaneDecl::openapi_schemas` is a field the
# substrate struct gates on its own `openapi-schema` feature, so this forwards to substrate to keep the
# `#[cfg(feature = "openapi-schema")]` field site and the struct definition in lock-step. The plane
# contributes no schemas (the field is `None`), so no `schemars` dep is pulled.
openapi-schema = ["busbar-substrate/openapi-schema"]
# THE HOST-DRIVING TEST SURFACE: reveals the substrate's `testkit` (the in-memory fixture host, the
# loopback HTTP provider, the metrics capture) to the cells that drive a plane-host seam — the breaker,
# hook-gate/tap, metrics, SDP-broker and billing-ledger batteries. Pulls NO busbar-core: the fixture
# host is a substrate double reached through the same seam production uses.
test-support = ["busbar-substrate/test-support"]

[dev-dependencies]
# None beyond the workspace crates above: the test surface is the `test-support` feature.
