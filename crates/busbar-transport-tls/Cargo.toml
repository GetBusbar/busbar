[package]
name = "busbar-transport-tls"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The tls transport: frames over TLS, composed over tcp."
license = "Apache-2.0"

# DEPENDENCY POLICY. In-tree only, inside the trusted computing base, reviewed rather than
# manifest-gated. Names `busbar-contract` for the plugin surface and rustls for the handshake
# itself — the same crypto backend the rest of the workspace pins (`ring`).
#
# `busbar-transport-tcp` is NOT a dependency here, and is not a dev-dependency either: naming a
# sibling transport crate — even under `[dev-dependencies]` — links that crate's whole SHIPPED
# closure into this one's `cargo test` binary (`kind-isolation:closure`'s `closure-test-reach`
# finding). What `tls` does is ADOPT, through a contract trait, and no line of this crate's shipped
# source names `busbar_transport_tcp` at all. The one battery cell that upgrades off a real
# accepted socket (`src/tests/mod.rs::an_in_band_upgrade_adopts_the_lower_layers_stream`) opens one
# straight off `tokio`, already an ordinary dependency below, instead of the sibling crate.
[dependencies]
tokio-util = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
futures = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "io-util", "time"] }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
ring = { workspace = true }

[dev-dependencies]
# The TEST-ONLY seal (#65). `busbar_contract::plugin::TestKernelSeal` is the one blessed
# fixture implementor of the SEALED `KernelSeal` trait; this crate's test harnesses used to
# forge their own. Dev-only and feature-gated, so it is absent from every release build.
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "io-util", "time", "macros", "test-util"] }
rcgen = { workspace = true }
