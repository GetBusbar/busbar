[package]
name = "busbar-transport-tls"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The tls transport: frames over TLS, composed over tcp."
license = "Apache-2.0"

# DEPENDENCY POLICY. In-tree only, inside the trusted computing base, reviewed rather than
# manifest-gated. Names `busbar-contract` for the plugin surface, `busbar-transport-tcp` for the
# base byte stream it composes over (and the in-band-upgrade seam, `take_stream`), and rustls for
# the handshake itself — the same crypto backend the rest of the workspace pins (`ring`).
[dependencies]
tokio-util = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
busbar-contract-transport = { path = "../busbar-contract-transport" }
busbar-transport-tcp = { path = "../busbar-transport-tcp" }
futures = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "io-util", "time"] }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
ring = { workspace = true }

[dev-dependencies]
busbar-caps = { path = "../busbar-caps" }
# The unit that resolves TLS key material. A DEV dependency and never a shipping one: the battery
# below builds real certificates and drives them through the unit's own provisioning, which is the
# honest way to test that the handle a listener presents resolves to the config a listener needs.
# What must not exist is the shipping edge — a transport naming a unit inverts the handle-passing
# rule of ARCHITECTURE.md section 3.4 — so the production join is a two-method adapter in the
# composition root (`crates/busbar/src/root/transports.rs`, `TlsSink`) and neither crate names the
# other in what it ships.
busbar-unit-transport-key = { path = "../busbar-unit-transport-key" }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "io-util", "time", "macros"] }
rcgen = { workspace = true }
