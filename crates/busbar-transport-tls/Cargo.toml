[package]
name = "busbar-transport-tls"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The tls transport: frames over TLS, composed over tcp."
license = "Apache-2.0"

# DEPENDENCY POLICY. In-tree only, inside the trusted computing base, reviewed rather than
# manifest-gated. Names `busbar-contract` for the plugin surface and rustls for the handshake
# itself — the same crypto backend the rest of the workspace pins (`ring`).
#
# `busbar-transport-tcp` is a DEV-dependency, and the manifest used to claim it was needed for the
# in-band-upgrade seam (`take_stream`). It is not: `take_stream` is `TcpTransport`'s own method and
# the caller of it is the composition root, not this crate. What `tls` does is ADOPT, through a
# contract trait, and no line of this crate's shipped source names `busbar_transport_tcp` at all —
# the single reference in the whole crate is `src/tests/mod.rs:651`, which builds a real `tcp` to
# upgrade from.
[dependencies]
tokio-util = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
# The unit that resolves this transport's key material. The edge points this way on purpose: the
# unit reads secrets and this crate must not, so what crosses the seam is an already-built config
# and a slot number, and the transport is the end that offers somewhere to put them.
busbar-unit-transport-key = { path = "../busbar-unit-transport-key" }
futures = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "io-util", "time"] }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
ring = { workspace = true }

[dev-dependencies]
# The TEST-ONLY seal (#65). `busbar_contract::plugin::TestKernelSeal` is the one blessed
# fixture implementor of the SEALED `KernelSeal` trait; this crate's test harnesses used to
# forge their own. Dev-only and feature-gated, so it is absent from every release build.
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }
# The base byte stream the upgrade battery starts from — test-time only; see the note above.
busbar-transport-tcp = { path = "../busbar-transport-tcp" }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "io-util", "time", "macros", "test-util"] }
rcgen = { workspace = true }
