[package]
name = "busbar-ports"
version = "1.6.0"
publish = false
edition = "2021"
rust-version = "1.97"
description = "Host-side plugin port vocabulary and wire codecs"
license = "Apache-2.0"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
# The session handle of a kind holds the boundary crate's live session, named through
# busbar_plugin_abi::host_side::boundary (only plugin-abi, the loader and plugin-test depend on busbar-ffi: E12).
busbar-plugin-abi = { path = "../busbar-plugin-abi", features = ["host"] }
zeroize = { workspace = true }

[dev-dependencies]
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }

[lints]
workspace = true
