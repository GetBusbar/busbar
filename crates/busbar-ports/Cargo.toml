[package]
name = "busbar-ports"
version = "1.6.0"
publish = false
edition = "2021"
rust-version = "1.97"
description = "Host-side plugin port vocabulary and wire codecs"
license = "Apache-2.0"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
busbar-plugin-abi = { path = "../busbar-plugin-abi", features = ["host"] }
zeroize = { workspace = true }

[dev-dependencies]
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }

[lints]
workspace = true

# B-FRAME: take, share and drop of a request frame, timed against a fresh allocation.
[[bench]]
name = "frame"
path = "benches/frame.rs"
harness = false
