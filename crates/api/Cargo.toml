[package]
name = "busbar-api"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar engine's plugin contracts: the auth-module trait, the hook/routing-policy trait, and their projection types."
license = "Apache-2.0"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
# The money-path durable record SHAPES + the `RecordStore` trait, which now live in
# `busbar_contract::records` (DECISIONS #83: contract = shapes; #84: nothing on the plugin path may
# link a crate holding semantics). `busbar-api` re-exports them under their original names for
# staged back-compat (retires W5.b).
#
# THIS EDGE USED TO NAME THE MONEY ONE-BOOK, AND THAT WAS THE #84 DEFECT. Every plugin names
# `busbar-api`, so that edge put the book in every third-party plugin's compile closure: change a
# ledger type and every plugin rebuilt, though nothing it names moved. The shapes moved to the
# contract and this edge follows them; the book's SEMANTICS (settlement, postings, totals, the
# identity, the recompute) are no longer nameable from here AT ALL — not in code, and deliberately
# not in a comment either, because #40's dep-wall counts both. No cycle: `busbar-contract` depends
# on no busbar crate.
busbar-contract = { path = "../busbar-contract" }
# `sha2`/`hex` LEFT with `sha256_hex` (DECISIONS #83, ARCHITECT P68-0 residue (b)): the digest now
# lives in `busbar_contract::redacted` and is re-exported from `auth.rs` under its historical path.
