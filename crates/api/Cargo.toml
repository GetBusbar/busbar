[package]
name = "busbar-api"
version = "1.5.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar engine's plugin contracts: the auth-module trait, the hook/routing-policy trait, and their projection types."
license = "Apache-2.0"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
# The SecretRef reference type ({ module, settings } + env/file sugar). Re-exported so a plane crate
# (or any consumer that already depends on busbar-api) can name `busbar_api::SecretRef` without a
# separate path dep. This crate depends only on serde/serde_json, so no dependency cycle.
busbar-secret-grammar = { path = "../secret-grammar" }
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
# The hooks-kind face (`RoutingPolicy`, its projections, the signal catalog) is the CONTRACT's;
# this crate re-exports it while it drains (Track 4 deletes busbar-api). Transitional edge.
busbar-contract = { path = "../busbar-contract" }
