[package]
name = "busbar-api"
version = "1.5.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar engine's plugin contracts: the auth-module trait, the hook/routing-policy trait, and their projection types."
license = "Apache-2.0"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
# The decision-observability signal catalog's per-projection signal bag
# (`SignalBag`): inline capacity for the common 0-4-declared-signals case so the default
# (nothing declared) path never touches the heap. Already a transitive dependency of the
# workspace (pulled in via tokio et al.), so this adds no new crate to the tree.
smallvec = { workspace = true }
# The `Stream` trait, and nothing else. A plane that serves SSE or a long-lived session must be able
# to RETURN a stream; expressing that needs the trait. `futures-core` is the trait-only crate (no
# executor, no combinators, no runtime), so the plugin contract stays runtime-agnostic — a plugin
# author is not forced onto tokio by the ABI.
futures-core = { workspace = true }
