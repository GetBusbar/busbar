[package]
name = "busbar-api"
version = "1.5.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar engine's plugin contracts: the auth-module trait, the hook/routing-policy trait, and their projection types."
license = "Apache-2.0"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
# The SecretRef reference type ({ module, settings } + env/file sugar). Re-exported so a plane crate
# (or any consumer that already depends on busbar-api) can name `busbar_api::SecretRef` without a
# separate path dep. This crate depends only on serde/serde_json, so no dependency cycle.
busbar-secret-ref = { path = "../secret-ref" }
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
# The decision-observability signal catalog's per-projection signal bag
# (`SignalBag`): inline capacity for the common 0-4-declared-signals case so the default
# (nothing declared) path never touches the heap. Already a transitive dependency of the
# workspace (pulled in via tokio et al.), so this adds no new crate to the tree.
smallvec = { workspace = true }
