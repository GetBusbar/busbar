[package]
name = "busbar-api"
version = "1.5.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar engine's plugin contracts: the auth-module trait, the hook/routing-policy trait, and their projection types."
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
sha2 = "0.11.0"
hex = "0.4.3"
zeroize = "1"
# The Feature-2 decision-observability signal catalog's per-projection signal bag
# (`SignalBag`): inline capacity for the common 0-4-declared-signals case so the default
# (nothing declared) path never touches the heap. Already a transitive dependency of the
# workspace (pulled in via tokio et al.), so this adds no new crate to the tree.
smallvec = "1"
