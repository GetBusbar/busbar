[package]
name = "busbar-plugin-test"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The plugin test facade (SDK-SAFE-TEST-HOST): load and drive any plugin from test code with no unsafe. A plugin repository's one test dev-dependency; never in a release build."
license = "Apache-2.0"
# W1-T1: every `tests/<case>.rs` (one per live IF §14 case) compiles into the one `cases` binary below, so the
# conformance cases add one link step to CI, not one per case (Q22). Each other test target is listed by hand;
# `cases.rs` fails if a file under `tests/` is wired nowhere.
autotests = false

# The host's own fixtures: one store and one transport, SDK-authored; each test pulls in its
# linked twin with #[path].
[[example]]
name = "store_fixture"
path = "tests/fixtures/store_fixture.rs"
crate-type = ["cdylib"]

[[example]]
name = "transport_fixture"
path = "tests/fixtures/transport_fixture.rs"
crate-type = ["cdylib"]

[[example]]
name = "carrier_target"
path = "tests/fixtures/carrier_target.rs"

# The stream target's own line framer (its cdylib), and a stream target over it run as a process.
[[example]]
name = "framer_fixture"
path = "tests/fixtures/framer_fixture.rs"
crate-type = ["cdylib"]

[[example]]
name = "framer_target"
path = "tests/fixtures/framer_target.rs"

[[test]]
name = "host"
path = "tests/host.rs"

[[test]]
name = "r131_core_3a"
path = "tests/r131_core_3a.rs"

[[test]]
name = "r131_core_3b"
path = "tests/r131_core_3b.rs"

[[test]]
name = "store_no_growth_case"
path = "tests/store_no_growth_case.rs"

[[test]]
name = "target_carrier"
path = "tests/target_carrier.rs"

[[test]]
name = "target_stream"
path = "tests/target_stream.rs"

# The IF §14 conformance cases (W1-T1; WBS rule 10): one module per case file, each arm a test named for its
# owner while ignored.
[[test]]
name = "cases"
path = "tests/cases.rs"

[features]
# Host targets (SDK-SAFE-TEST-HOST §10.2), off by default and never in a release build: a plugin
# repository enables one in its [dev-dependencies]. `target` is the shared code (std::net only, so
# a stream framer's test graph gains no hyper and no tokio net; the driver supplies the host and
# its test caller binding). `target-http` adds the carrier: hyper and hyper-util, no hand-written codec,
# no direct h2, no tonic. Every crate here is already in core's lock.
target = ["dep:sonic-rs"]
target-http = ["target", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio"]
# STH-ROWS D-7: the contract's caller seal for a plugin repository's test host, a loud dev-only opt-in on
# its `busbar-plugin-test` DEV edge (the guard `test_seal_is_dev_only` allows this forward, never a normal edge).
test-seal = ["busbar-contract/test-seal"]

[dependencies]
zeroize = { workspace = true }
busbar-contract = { path = "../busbar-contract", features = ["test-support", "abi-scan"] }
busbar-plugin-loader = { path = "../plugin-loader", features = ["test-support"] }
# The MIN-3 interface the conformance harness drives (IF §14): `FakeNeeds` implements its host-side `Needs`.
busbar-plugin-abi = { path = "../busbar-plugin-abi", features = ["host"] }
sonic-rs = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "net", "time", "sync"] }

[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
tikv-jemallocator = { workspace = true }

[dev-dependencies]
# W1-K8B: the head-authority and card-redirect arms build URLs.
url = { workspace = true }
# The bridge fixture image (W1-A3, `tests/bridge_fixture.rs`) is wired by hand over busbar-ffi's safe adapter and host
# API, as `plugin!` wires an image; never `host` here (the loader side reaches it through busbar-plugin-abi).
busbar-ffi = { path = "../busbar-ffi" }
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }
# W1-K2: the custody arms of C-SCRUB and C-SCRUB-HIT drive the kernel's custody, with its `conformance` miss-path
# probe (IF §14 round 19). A dev edge only: a plugin repository resolving this facade never sees it.
busbar-kernel = { path = "../busbar-kernel", features = ["conformance"] }
# W2-K8P: C-PROVISION drives the provisioning mount and the guard admin (busbar-core-admin `provision`) over
# axum requests. Dev edges only.
busbar-core-admin = { path = "../busbar-core-admin" }
axum = { workspace = true }
# The facade's own tests drive its targets; CI's test and red-proof jobs pass none of its features.
busbar-plugin-test = { path = ".", features = ["target-http", "test-seal"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
