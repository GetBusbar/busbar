# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-hook-test-plugin"
version = "1.5.0"
publish = false            # internal TEST-support cdylib; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "A hermetic trivial kind:hook plugin cdylib used to drive the end-to-end hook seam tests through the hook axis (no network; a fixed gate that ranks/transforms/reports based on the projection it is handed)."
license = "Apache-2.0"

[lib]
# cdylib for the real dlopen ABI seam; rlib is REQUIRED for `cargo test` to actually emit the
# cdylib artifact at all — with cdylib-only, `cargo test -p busbar` builds a trivial "0 tests"
# harness for this package but never produces the .so/.dylib, so every hooks::tests:: test gated on
# `hook_cdylib()` silently found nothing and skipped (confirmed: no .so/.dylib under target/debug
# at all after a bare `cargo test -p busbar`, only .rcgu.o object files). Same fix already applied
# to store-postgres-plugin's identical crate-type-only-cdylib bug.
crate-type = ["cdylib", "rlib"]

[dependencies]
tracing = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# THE KIND'S CONFORMANCE (`tests/conformance.rs`, the loader's only user here): the compiled-in door
# and this crate's own cdylib, each admitted through the hook axis of the one loader and called
# through the one dispatcher (compiled-in is dropped-in). Any other file naming the loader makes this
# an ungranted test edge.
busbar-plugin-loader = { path = "../plugin-loader" }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
