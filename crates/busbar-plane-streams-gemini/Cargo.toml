# busbar-plane-streams-gemini — ONE VENDOR'S DUPLEX EVENT VOCABULARY, AND NOTHING ELSE.
#
# THE KIND IS `dialect`, the second crate of that kind in the tree and the second of this plane's
# three. The name is the four-segment dialect form `busbar-plane-<plane>-<dialect>` and nothing
# else. Spelling the dialect's whole wire name into the crate name would make a fifth segment, and
# the gate refuses a fifth outright (`MAX_NAME_SEGMENTS = 4`,
# xtask/src/gates/kind_isolation.rs) — the same correction VT-2 made when the carrier's three-word
# product name would have made six. The WIRE name is two words
# (`gemini-live`) and is declared once, as `NAME` in this crate's own source, on the dialect row
# that carries it.
#
# WHAT THIS CRATE TOOK OUT OF THE NEUTRAL PLANE, AND IT IS NOT ONLY A ROW. `busbar-plane-streams`
# carried two `if dialect.name == NAME_GEMINI_LIVE { GeminiLiveCodec } else { OpenAiRealtimeCodec }`
# tests at its own altitude — instance dispatch with a string comparison in front of it, in the one
# crate the dialect kind's direction rule makes the neutral party. The reader and the writer are
# FIELDS of the dialect row now, this crate fills them with its own codec, and the neutral plane
# names `GeminiLiveCodec` nowhere at all.
[package]
name = "busbar-plane-streams-gemini"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# One pinned number, set to what CI verifies — the same rationale every other member states.
rust-version = "1.97"
description = "The Gemini Live (BidiGenerateContent) dialect of the busbar streams plane: the vendor's duplex event vocabulary and the reader/writer that maps it into the plane's shared IR."
license = "Apache-2.0"

[lib]
name = "busbar_plane_streams_gemini"
path = "src/lib.rs"

# NO FEATURES. A dialect compiled two ways is two dialects speaking one name.

[dependencies]
# THE PLANE THIS IS A DIALECT OF. The direction the kind gate fixes: the dialect names its plane and
# the plane never names a dialect. What is named is the plane's own dialect FACE — never a second
# plane, and never a sibling dialect.
busbar-plane-streams = { path = "../busbar-plane-streams" }
# THE SHARED DUPLEX IR, AND THIS DIALECT'S READER INSIDE IT. The audio-frame, event and
# session-config vocabulary every dialect of this plane meets in; this crate's own reader/writer
# (`ir::GeminiLiveCodec`) is a PRE-SPLIT half of the same crate and is named here until the codec
# splits. It is the same `dialect -> codec` edge class the carrier's mint measured.
busbar-voice-codec = { path = "../busbar-voice-codec" }
