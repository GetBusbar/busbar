# busbar-core — the engine LIBRARY. Step 3.7 of 1.6.0 splits `crates/busbar` into this crate
# (everything a protocol plugin or the binary links against) and the thin `busbar` binary
# (argument parsing, config location, process lifecycle, and — from step 4 — protocol
# registration, which is the composition root's knowledge and no one else's).
#
# NOTE ON THE PUBLIC SURFACE: this crate is `publish = false` and its `pub` items are NOT a
# semver contract. The visibility here exists for the `busbar` binary and the protocol crates;
# it is widened by the compiler's demands, not by design intent, and may narrow again at any time.
[package]
name = "busbar-core"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"

[lib]
name = "busbar_core"
path = "src/lib.rs"

[features]
# Mirrors of `busbar`'s feature axes: the `#[cfg(feature = ...)]` sites live in the library, so
# the library declares the features and the binary forwards them. Empty until the move commit.
default = ["auth-admin-tokens", "hooks-ranking"]
auth-admin-tokens = []
hooks-ranking = []
openapi-schema = []
loom-model = []
txn-fence-red = []
