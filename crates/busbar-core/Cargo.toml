# busbar-core — the engine LIBRARY. Step 3.7 of 1.6.0 splits `crates/busbar` into this crate
# (everything a protocol plugin or the binary links against) and the thin `busbar` binary
# (argument parsing, config location, process lifecycle, and — from step 4 — protocol
# registration, which is the composition root's knowledge and no one else's).
#
# NOTE ON THE PUBLIC SURFACE: this crate is `publish = false` and its `pub` items are NOT a
# semver contract. Visibility here is what the lib/bin seam and the protocol crates need — it
# was widened at the compiler's demand, not by design intent, and may narrow again at any time.
# The security-relevant internals (the audit sink, the token signer, the durable statics, the
# trust sweeper) stay `pub(crate)` behind the `boot` module's entry points; see src/boot.rs.
#
# Per-dependency rationale lives where it always did: the workspace table and the `busbar`
# manifest this list was split from (crates/busbar/Cargo.toml, pre-split history).
[package]
name = "busbar-core"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar engine library: protocol registry, planes, governance, trust, audit, store, config — everything the thin `busbar` binary and the protocol crates link against."
license = "Apache-2.0"

[lib]
name = "busbar_core"
path = "src/lib.rs"

[dependencies]
busbar-api = { path = "../api" }
busbar-store-memory = { path = "../store-memory" }
busbar-plugin-loader = { path = "../plugin-loader" }
busbar-plugin-sign = { path = "../plugin-sign" }
busbar-secret-ref = { path = "../secret-ref" }
busbar-auth-admin-tokens = { path = "../auth-admin-tokens", optional = true }
busbar-hooks-ranking = { path = "../hooks-ranking", optional = true }
axum = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "io-std", "process"] }
reqwest = { workspace = true, features = ["http2"] }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
schemars = { workspace = true, optional = true }
loom = { workspace = true, optional = true }
ring = { workspace = true }
base64 = { workspace = true }
oauth-as = { workspace = true }
sonic-rs = { workspace = true }
serde_yaml = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-util = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-http = { workspace = true }
hyper-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
ed25519-dalek = { workspace = true }
crc32fast = { workspace = true }
async-trait = { workspace = true }
a2a-lf = { workspace = true }
a2a-pb = { workspace = true }
rmcp = { workspace = true }
tonic = { workspace = true }
tonic-types = { workspace = true }
prost = { workspace = true }
httpdate = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }

[features]
# The `#[cfg(feature = ...)]` sites live in this crate, so this crate declares the features and
# the `busbar` binary forwards them (busbar/<feature> = ["busbar-core/<feature>"]).
#
# NOTE — SUPERSEDED 2026-08-16 BY OWNER RULING R-H. PRESERVED, NOT DELETED, so the record of what
# changed and why survives.
#
# WHAT IT SAID: keeping `dep:busbar-auth-admin-tokens` here leaves the `admin-tokens` match arm IN
# CORE — a feature-gated arm inside the engine rather than a dependency edge owned by the
# composition root — and moving that registration to the binary was "the protocol-extraction step's
# job". The 1.6.0 plugin-ABI design proposed exactly that move.
#
# THE RULING: "i want plugins to be plugins and some are compiled in some are not. but whats in or
# not doesnt matter to core. This should be as auth-tokens is today." The core-held optional
# dependency IS the shape, on every plugin kind. The edge does NOT move to the binary.
#
# WHY IT IS SOUND, and what it obliges instead: the note's real concern was that core would end up
# unable to build or boot without a given plugin. That concern is legitimate and is now discharged
# by PROOF rather than by relocation — every plugin dependency here is optional, `default` is a
# CHOICE and not a requirement, and the no-plugins gate builds and BOOTS core with the whole default
# set switched off. The obligation this note transfers to: any new plugin edge added here must be
# optional and must keep that gate green. Do not "fix" the core-held edge — it is the ruled shape.
default = ["auth-admin-tokens", "hooks-ranking"]
auth-admin-tokens = ["dep:busbar-auth-admin-tokens"]
hooks-ranking = ["dep:busbar-hooks-ranking"]
openapi-schema = ["dep:schemars"]
loom-model = ["dep:loom"]
txn-fence-red = []
# Exposes `test_support` to a DEPENDENT crate's tests (the bin's). Never on in a normal build;
# the bin enables it from its [dev-dependencies] edge only.
test-support = []

[dev-dependencies]
busbar-store-example-plugin = { path = "../store-example-plugin" }
# THE REFERENCE PLANE PLUGIN — a DEV-dependency on purpose, and the purpose is the claim.
# `plane_plugin.rs` mounts whatever declarations the composition root installs and names no plane;
# core's PRODUCTION build therefore has no edge to any plane crate at all, which is what makes "core
# with no plugins compiles and runs, just does nothing" structural rather than feature-gated. The
# test needs a real plane to install, so the edge exists here and only here.
busbar-plane-example = { path = "../plane-example" }
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true, features = ["json"] }
axum = { workspace = true, features = ["http1"] }
http-body-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
rcgen = { workspace = true }
proptest = { workspace = true }
oauth-as = { workspace = true, features = ["test-util"] }

# The telemetry recovery tests read per-thread jemalloc counters; the lib's TEST binary therefore
# runs on the same allocator the shipped binary does (see the cfg(test) global_allocator in
# lib.rs). Dev-only and target-gated exactly as the binary's dependency is.
[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }
