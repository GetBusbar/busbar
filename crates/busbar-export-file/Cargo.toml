[package]
name = "busbar-export-file"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The built-in `request-log-file` export sink: an append-only JSONL file with rename-based rotation. Kind `export`."
license = "Apache-2.0"

# ONE DEPENDENCY, AND IT IS THE FACE THIS CRATE IMPLEMENTS.
#
# A sink of this kind is written against the face it implements and names nothing else of the tree:
# no engine, no substrate, no runtime, no recorder, no diagnostics registry. Until the face existed
# this crate's list was empty and its composer paired it up by hand, which is the pairing the
# contract's `Export` abolishes — every sink of the kind now reaches ONE face, and a composer that
# holds a `dyn Export` cannot tell which of them it is holding. `busbar-contract` is the whole of
# the list and there is nothing else this crate is allowed to want.
[dependencies]
busbar-contract = { path = "../busbar-contract" }
