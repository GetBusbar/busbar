[package]
name = "busbar-transport-http"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The http transport: request/response frames over tcp, plus the pinned 1.5.5 egress client posture."
license = "Apache-2.0"

# DEPENDENCY POLICY. A transport is in-tree only and never dynamically loaded, so it sits inside
# the trusted computing base and is reviewed rather than manifest-gated. `memchr` is the one
# non-plumbing name here: the framing scanners search for their terminators with it, and it is
# already in the lock through hyper's own tree, so naming it adds no crate to the graph.
#
# AND NO SIBLING TRANSPORT. This crate once declared `busbar-transport-tcp` and a `tls` transport
# crate (retired: TLS is core's connection security) and referenced neither in
# any of its source files: `listen`/`accept` bind their own socket through `tokio::net`, and the
# egress client's TLS is `rustls`/`hyper-rustls` directly. Those names put a capability crate in the
# dependency closure of four plugin crates by two lines that compiled nothing (DECISIONS #40 — the
# wall is over the CLOSURE, and a transitive member is invisible in the manifest that causes it).
# What `http` composes over is still stated, but it is stated where it is true: `COMPOSES_OVER =
# &["tcp"]` in `meta.rs` is a declared wire fact the registry reads, and it needs no link edge to be
# true.
[dependencies]
tokio-util = { workspace = true }
memchr = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
futures = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "io-util", "time", "macros"] }
rustls = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { workspace = true }
http-body-util = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
# The door's settings blob is JSON (`door::read_settings`).
serde_json = { workspace = true }
webpki-roots = { workspace = true }
# THE gRPC MODULE (`src/grpc/`, folded in from `busbar-transport-grpc`).
# `tonic` here is used ONLY for its codec/status/streaming machinery (`tonic::codec::Codec`,
# `tonic::Status`, `tonic::server::Grpc`, `tonic::client::Grpc`) — the gRPC WIRE FRAMING (the
# 5-byte length-prefix per message, the `grpc-status` trailer) with a byte-blind custom `Codec`
# (see `grpc/codec.rs`) that carries no protobuf meaning at all. `default-features = false` (the
# workspace pin) keeps `tonic::transport` (the whole `Channel`/`Server` framework, `axum`
# included) OUT of this crate's build: the HTTP/2 listener and dialer are the module's own, built
# directly on `hyper`/`hyper-util`, because `tonic::transport::Server`'s routing is by declared
# service NAME, and this transport is protocol-blind — it has no service name to route by.
tonic = { workspace = true }
tower = { workspace = true }

[dev-dependencies]
# THE DOOR'S CONFORMANCE (`tests/conformance.rs`): a real hyper server on the far side of the
# framer, and the dropped-in image (`examples/http_door.rs`) loaded beside the linked one.
libloading = { workspace = true }
# THE 1.5.5 BYTE COMPARISON (`tests/h2_parity.rs`): 1.5.5's egress client, reqwest 0.12 with its
# `http2` feature, built exactly as 1.5.5 built it, captured beside this door on the same request.
reqwest = { workspace = true, features = ["http2"] }
# THE REQUEST TARGET'S 1.5.5 BYTES (`door/tests`): the URL parser 1.5.5's client serialised
# every upstream path with, compared against the door's own encoder. Already in this list's closure
# through reqwest: no crate is added.
url = { workspace = true }
# The TEST-ONLY seal (#65). `busbar_contract::plugin::TestKernelSeal` is the one blessed
# fixture implementor of the SEALED `KernelSeal` trait; this crate's test harnesses used to
# forge their own. Dev-only and feature-gated, so it is absent from every release build.
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }
# `test-util` is dev-only (this list is `[dev-dependencies]`), so `start_paused` never reaches a
# release build: it lets the gRPC module's stalled-preface cases (item 146) prove the budget by
# letting the runtime auto-advance virtual time to it, rather than actually waiting ten real seconds.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "io-util", "time", "macros", "test-util"] }

# THE DROPPED-IN IMAGE: the same door, exported through the one symbol, built by `cargo test`.
[[example]]
name = "http_door"
crate-type = ["cdylib"]
