[package]
name = "busbar-transport-http"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The http transport: request/response frames over tcp or tls, plus the pinned 1.5.5 egress client posture."
license = "Apache-2.0"

# DEPENDENCY POLICY. A transport is in-tree only and never dynamically loaded, so it sits inside
# the trusted computing base and is reviewed rather than manifest-gated. `memchr` is the one
# non-plumbing name here: the framing scanners search for their terminators with it, and it is
# already in the lock through hyper's own tree, so naming it adds no crate to the graph.
#
# AND NO SIBLING TRANSPORT. This crate declared `busbar-transport-tcp` and `busbar-transport-tls`
# and referenced neither in any of its source files: `listen`/`accept` bind their own socket through
# `tokio::net`, and the egress client's TLS is `rustls`/`hyper-rustls` directly. The two names were
# the only reason `busbar-transport-tls` and `busbar-unit-transport-key` stood in the dependency
# closure of `-http`, `-ws`, `-sse` and `-grpc`, which is four plugin crates made to carry a
# capability crate by two lines that compiled nothing (DECISIONS #40 — the wall is over the CLOSURE,
# and a transitive member is invisible in the manifest that causes it). What `http` composes over is
# still stated, but it is stated where it is true: `COMPOSES_OVER = &["tcp", "tls"]` in `meta.rs` is
# a declared wire fact the registry reads, and it needs no link edge to be true.
[dependencies]
tokio-util = { workspace = true }
memchr = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
futures = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "io-util", "time"] }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { workspace = true }
http-body-util = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
webpki-roots = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# The TEST-ONLY seal (#65). `busbar_contract::plugin::TestKernelSeal` is the one blessed
# fixture implementor of the SEALED `KernelSeal` trait; this crate's test harnesses used to
# forge their own. Dev-only and feature-gated, so it is absent from every release build.
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "io-util", "time", "macros"] }
