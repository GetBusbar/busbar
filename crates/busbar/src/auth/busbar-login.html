<title>Sign in · Busbar</title>
<style>
  :root {
    --bg: #f4f6f4;
    --card: #ffffff;
    --ink: #0b1220;
    --ink-soft: #1e293b;
    --muted: #64748b;
    --line: #e4e8e6;
    --line-strong: #d3dad6;
    --lime: #a3e635;
    --limed: #4d7c0f;
    --lime-deep: #35510b;
    --field: #f8fafc;
    --key-bg: #0f172a;
    --key-ink: #e6f5c8;
    --shadow: 0 1px 2px rgba(11,18,32,.04), 0 12px 32px -12px rgba(11,18,32,.16);
    --focus: #4d7c0f;
    --good: #4d7c0f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0e0a;
      --card: #12171a;
      --ink: #f1f5f0;
      --ink-soft: #cbd5cc;
      --muted: #8b978c;
      --line: #232b26;
      --line-strong: #2e3830;
      --lime: #a3e635;
      --limed: #a3e635;
      --lime-deep: #bef264;
      --field: #0e1412;
      --key-bg: #06090a;
      --key-ink: #cdee97;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px -16px rgba(0,0,0,.6);
      --focus: #a3e635;
      --good: #a3e635;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* ── card ── */
  .stack { display: flex; flex-direction: column; align-items: center; gap: 40px; width: 100%; }
  .card {
    width: 100%; max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 34px 32px 26px;
    animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

  /* ── brand lockup ── */
  .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 26px; }
  .glyph {
    width: 38px; height: 38px; border-radius: 10px; background: #0f172a;
    display: grid; place-items: center; flex: 0 0 auto;
    box-shadow: inset 0 0 0 1px rgba(163,230,53,.14);
  }
  .glyph svg { width: 30px; height: 30px; display: block; }
  .wordmark { font-size: 19px; font-weight: 680; letter-spacing: -.015em; color: var(--ink); }
  .wordmark span { color: var(--muted); font-weight: 500; }

  h1 { font-size: 21px; line-height: 1.25; margin: 0 0 7px; letter-spacing: -.02em; text-wrap: balance; }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }

  /* ── provider buttons ── */
  .providers { display: flex; flex-direction: column; gap: 10px; }
  .provider {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 12px 16px;
    background: var(--field);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    color: var(--ink); font-size: 14.5px; font-weight: 560;
    cursor: pointer; text-decoration: none;
    transition: border-color .15s, background .15s, transform .06s;
  }
  .provider:hover { border-color: var(--limed); background: var(--card); }
  .provider:active { transform: translateY(1px); }
  .provider:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .provider .picon { width: 20px; height: 20px; flex: 0 0 auto; }
  .provider .plabel { flex: 1; }
  .provider .chev { color: var(--muted); width: 16px; height: 16px; flex: 0 0 auto; }

  .foot {
    margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 12.5px; line-height: 1.55;
  }
  .foot .mono { color: var(--ink-soft); font-size: 12px; }

  /* ── key-issued screen ── */
  .issued-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .check {
    width: 24px; height: 24px; border-radius: 50%; background: var(--lime);
    display: grid; place-items: center; flex: 0 0 auto;
  }
  .check svg { width: 13px; height: 13px; }
  .keyrow {
    display: flex; align-items: stretch; gap: 0; margin: 6px 0 8px;
    border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden;
    background: var(--key-bg);
  }
  .keyval {
    flex: 1; min-width: 0; padding: 12px 14px; color: var(--key-ink);
    font-size: 13px; letter-spacing: .01em; overflow-x: auto; white-space: nowrap;
    display: flex; align-items: center;
  }
  .copy {
    flex: 0 0 auto; border: 0; border-left: 1px solid rgba(255,255,255,.1);
    background: transparent; color: var(--lime); font-weight: 600; font-size: 12.5px;
    padding: 0 16px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; gap: 6px;
  }
  .copy:hover { background: rgba(163,230,53,.1); }
  .copy:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .reshow {
    display: flex; align-items: center; gap: 7px;
    color: var(--muted); font-size: 12.5px; font-weight: 500; margin-bottom: 20px;
  }
  .reshow a { color: var(--limed); font-weight: 600; text-decoration: none; }
  .reshow a:hover { text-decoration: underline; }
  .reshow svg { width: 14px; height: 14px; flex: 0 0 auto; }

  .budget {
    display: flex; gap: 10px; margin-bottom: 20px;
  }
  .tier {
    flex: 1; background: var(--field); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 13px;
  }
  .tier .tname { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .tier .tval { font-size: 17px; font-weight: 680; letter-spacing: -.01em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tier .tval small { font-size: 12px; font-weight: 500; color: var(--muted); }

  .usein { color: var(--muted); font-size: 12.5px; margin: 0 0 8px; }
  .snippet {
    background: var(--key-bg); border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 13px 14px; color: var(--key-ink); font-size: 12px; line-height: 1.7;
    overflow-x: auto;
  }
  .snippet .k { color: var(--muted); }
  .snippet .v { color: var(--key-ink); }
  /* Credential-login form (the Prompt shape). */
  .credform { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .credform .flabel { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); text-align: left; }
  .credform .finput {
    background: var(--card); border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 11px 12px; color: var(--ink); font-size: 14px;
  }
  .credform .finput:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-color: var(--limed); }
  .credform button.provider { justify-content: center; margin-top: 4px; }
</style>
