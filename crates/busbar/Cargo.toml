[package]
name = "busbar"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# `rust-version` rationale: see busbar-kernel/Cargo.toml — one pinned number, set to what CI verifies.
rust-version = "1.97"
description = "Native-protocol LLM gateway: lossless cross-protocol translation, weighted pools, per-(pool,lane) circuit breaking, and governance — in one self-contained Rust binary."
license = "Apache-2.0"
autotests = false
autobenches = false
autoexamples = false

# CORE: the composition root with no plugin linked. It names no plugin; every plugin arrives dropped
# into `plugins/`. The default distribution (dist/default) compiles this same source with the
# standard plugins linked, and runs its tests there.
[[bin]]
name = "busbar"
path = "src/main.rs"
test = false
bench = false

[dependencies]
busbar-core-oauth2 = { path = "../busbar-core-oauth2" }
busbar-core-admin = { path = "../busbar-core-admin", default-features = false }
busbar-core-connector = { path = "../busbar-core-connector" }
busbar-plugin-loader = { path = "../plugin-loader" }
busbar-kernel = { path = "../busbar-kernel", default-features = false }
busbar-contract = { path = "../busbar-contract" }
busbar-kernel-identity = { path = "../busbar-kernel-identity" }
busbar-kernel-scope = { path = "../busbar-kernel-scope" }
busbar-kernel-ledger = { path = "../busbar-kernel-ledger" }
busbar-kernel-egress = { path = "../busbar-kernel-egress" }
busbar-kernel-breaker = { path = "../busbar-kernel-breaker" }
busbar-kernel-wal = { path = "../busbar-kernel-wal" }
busbar-kernel-audit = { path = "../busbar-kernel-audit" }
serde_json = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
arc-swap = { workspace = true }
tower = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { workspace = true }
http-body = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
idna_adapter = { workspace = true }
metrics = { workspace = true }
serde_yaml = { workspace = true }
core_affinity = { workspace = true }
socket2 = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }

[target.'cfg(target_env = "musl")'.dependencies]
tikv-jemallocator = { workspace = true, features = ["disable_initial_exec_tls"] }

[features]
default = ["root-admin", "data-door-handup"]
root-admin = ["dep:tower"]
# THE DATA DOOR'S HAND-UP (status row 192 C), IN `default` until the flip: on, each data worker's
# listener hands every accepted socket up to the kernel's hyper loop; off, the data listener is
# bound to its own framer and the units its transport hands in are served by the accepted data
# door (`root::accepted`). The source reads it in one place (`root::accepted::DATA_DOOR_FRAMED`)
# and both paths compile in every build. A build switch, never an environment variable: the oracle
# recorder strips the environment. The default distribution (dist/default) states the same switch.
data-door-handup = []
test-harness = []

[lints.rust]
# The default distribution's build script sets a `linked_section_<section>` cfg per linked plane door;
# core's source gates a few tests on two of them, and core alone sets none.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(linked_section_pools)", "cfg(linked_section_agents)"] }
