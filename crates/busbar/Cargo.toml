[package]
name = "busbar"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# `rust-version` rationale: see busbar-core/Cargo.toml — one pinned number, set to what CI verifies.
rust-version = "1.97"
description = "Native-protocol LLM gateway: lossless cross-protocol translation, weighted pools, per-(pool,lane) circuit breaking, and governance — in one self-contained Rust binary."
license = "Apache-2.0"

# THE THIN BINARY. Step 3.7 of 1.6.0: everything an operator's request touches lives in
# `busbar-core`; this package is argument parsing, config LOCATION, process lifecycle (bind /
# serve / shutdown / the jemalloc purge fallback), and — from step 4 — protocol registration.
# The composition root is allowed to know the protocol set; nothing else is.
[[bin]]
name = "busbar"
path = "src/main.rs"

[dependencies]
# The engine. `default-features = false` so the binary's OWN feature list is the single decision
# point: each busbar feature forwards to the core feature of the same name below.
busbar-core = { path = "../busbar-core", default-features = false }
# The neutral substrate, named directly so the composition root can install the plane-facing seams
# that live there — the hostless-egress driver (`egress::seam::install_hostless_egress`), which the
# binary backs with core's `CoreHostlessEgress`. Core already depends on substrate; naming it here is
# the one composition-root edge, not a new leaf.
busbar-substrate = { path = "../busbar-substrate" }
# THE PROTOCOL CRATES — the composition root's knowledge, per the manifest header above. ONE CRATE
# PER PROTOCOL: `busbar-llm` carries the LLM protocol's six dialects together (an operator picks LLM
# coverage or none, never a subset), and `busbar-mcp` is a different protocol and therefore a
# different plugin — it carries the MCP protocol codec today (folded in from the former
# `busbar-proto-mcp`) and the MCP plane in a later plane-split step, both behind the ONE `plane-mcp`
# switch. Each is optional behind a feature so the deletion gate can build the binary WITHOUT a
# protocol and watch it refuse that protocol's config rather than serve it
# (scripts/proto-deletion-gate.sh). Default-on: the shipped binary speaks both.
busbar-llm = { path = "../busbar-llm", optional = true }
busbar-mcp = { path = "../busbar-mcp", optional = true }
# THE A2A PLANE-KIND SHELL (step 3.B.0 of the plane split). Empty crate so far (see its `src/lib.rs`)
# — nothing in `main.rs` names it and `plane-a2a` below is not in `default`, so this edge is inert
# until the plane/codec code that a later step moves actually lands here.
busbar-a2a = { path = "../busbar-a2a", optional = true }
# THE VOICE PLANE-KIND CRATE (Plane 4), the analogue of busbar-a2a above. Optional behind
# `plane-voice`, now IN `default` (voice ships default-ON + deletable, exactly like plane-mcp/
# plane-a2a). The LLM money path is unchanged (busbar-core's default carries no voice/duplex-ws
# edge); the shipped binary gains the voice plane + its WS transport, and `--no-default` proves the
# whole edge disappears with the crate (strong-form deletable). The `busbar-voice/runtime` edge is
# carried by the feature (below), not here.
busbar-voice = { path = "../busbar-voice", optional = true }
# Boot-time plugin listing (`--plugins`) reads the registry the loader builds.
busbar-plugin-loader = { path = "../plugin-loader" }

# ── THE COMPOSITION ROOT'S OWN EDGES (src/root/) ────────────────────────────────────────────────
# The binary is the one place entitled to name the kernel, the units, the planes and the transports
# together: that is what a composition root IS. Everything below is reached only from `src/root/`,
# and nothing below reaches back — the three axes stay blind to each other and only this crate
# composes them. These edges exist so `ProductionUnits` (the one implementor of the kernel's `Units`
# trait), the registry seal, the vocabulary interner, the durability branch and the listener
# provisioning have somewhere to live that is not a unit and not a plane.
busbar-kernel = { path = "../busbar-kernel" }
busbar-caps = { path = "../busbar-caps" }
busbar-contract = { path = "../busbar-contract" }
# THE PUBLISHED STORE PROTOCOL. A plane's durable records reach the node through record legs on its
# route plan, and the eight kind-tagged operations those legs run are declared here. Named by the
# root and by nothing else on this path: a plane may not hold a store and a unit may not know a
# schema, so the mapping from one to the other belongs to the composition and lives in `src/root/`.
busbar-api = { path = "../api" }
# The fourteen units. Eight are facades reached as free functions; six carry a long-lived object the
# root owns and holds in `ProductionUnits`.
busbar-unit-admission = { path = "../busbar-unit-admission" }
busbar-unit-audit = { path = "../busbar-unit-audit" }
busbar-unit-auth = { path = "../busbar-unit-auth" }
busbar-unit-breaker = { path = "../busbar-unit-breaker" }
busbar-unit-cost = { path = "../busbar-unit-cost" }
busbar-unit-egress = { path = "../busbar-unit-egress" }
busbar-unit-egress-auth = { path = "../busbar-unit-egress-auth" }
busbar-unit-ledger = { path = "../busbar-unit-ledger" }
busbar-unit-scope = { path = "../busbar-unit-scope" }
busbar-unit-transport-key = { path = "../busbar-unit-transport-key" }
busbar-unit-trust = { path = "../busbar-unit-trust" }
busbar-unit-usage = { path = "../busbar-unit-usage" }
busbar-unit-verbs = { path = "../busbar-unit-verbs" }
busbar-unit-wal = { path = "../busbar-unit-wal" }
# The five planes. The root is the only thing that knows both a plane's type (and therefore its
# `PlaneMeta` associated constants, which a `dyn Plugin` cannot read) and its registry key, so the
# root is what pairs them into the claim slice the boot check reads.
busbar-plane-llm = { path = "../busbar-plane-llm" }
busbar-plane-mcp = { path = "../busbar-plane-mcp" }
busbar-plane-a2a = { path = "../busbar-plane-a2a" }
busbar-plane-voice = { path = "../busbar-plane-voice" }
busbar-plane-admin = { path = "../busbar-plane-admin" }
# The seven transports. Composition is an edge that does not exist as a Cargo dependency — a
# transport may not name the layer beneath it — so the root supplies each composing transport its
# lower layer as a constructor argument, which is why every one of them is named here.
busbar-transport-tcp = { path = "../busbar-transport-tcp" }
busbar-transport-tls = { path = "../busbar-transport-tls" }
busbar-transport-http = { path = "../busbar-transport-http" }
busbar-transport-sse = { path = "../busbar-transport-sse" }
busbar-transport-ws = { path = "../busbar-transport-ws" }
busbar-transport-grpc = { path = "../busbar-transport-grpc" }
busbar-transport-stdio = { path = "../busbar-transport-stdio" }
# Named directly because provisioning a listener means handing the transport-key unit a resolved
# `rustls` config: the root builds the dial-side trust store, and the deployment's trust roots are
# its own statement rather than a unit's.
rustls = { workspace = true }
# Behind `root-admin` only. The root-driven admin surface wraps the router the operations are already
# mounted on and calls it as the tower service it is, so the inner surface answers exactly as it did
# and no status, header or byte is re-derived on the way out.
tower = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
serde_yaml = { workspace = true }
# THE THREAD-PER-CORE BOOT SEAM — the one unix data-plane topology (non-unix keeps the classic
# runtime as a compile-time platform shape; no knob selects either). Binary-only deps — nothing on
# the request path names them. `core_affinity` advisorily pins the per-worker threads, `socket2`
# sets SO_REUSEPORT on each per-worker listener so the kernel fans connections across them. See
# main.rs `serve_thread_per_core`.
core_affinity = { workspace = true }
socket2 = { workspace = true }

# Global allocator: jemalloc on EVERY target EXCEPT windows-msvc — a property of the BINARY (only
# one crate in a link may declare a global allocator), which is why these stay here when everything
# else moved to busbar-core. Full rationale in main.rs at the `#[global_allocator]` site.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }

[target.'cfg(target_env = "musl")'.dependencies]
tikv-jemallocator = { workspace = true, features = ["disable_initial_exec_tls"] }

[features]
# Pure forwards: every `#[cfg(feature = ...)]` site lives in busbar-core, so the binary's features
# are one-line re-exports of the core feature with the same name. The binary keeps the SAME default
# set the monolithic crate had, so `cargo build -p busbar` builds the same artifact as before.
default = ["auth-admin-tokens", "hooks-ranking", "proto-llm", "plane-mcp", "plane-a2a", "plane-voice"]
# A protocol crate: the dependency edge plus its registration line in main.rs. Dropping the
# feature is the deletion test's level-1 build. There is no per-DIALECT feature and there must not
# be one — "LLM coverage or not" is the choice this seam offers, and a `proto-gemini` knob would be
# a second, finer answer to a question the owner ruling already settled.
proto-llm = ["dep:busbar-llm", "busbar-core/plane-llm"]
# THE MCP PROTOCOL, carried by `busbar-mcp`: the dependency edge plus the `busbar_mcp::PROTO_DECL`
# registration line in main.rs. ONE switch for MCP the protocol codec today and MCP the plane once
# it folds in — never two — so it keeps the plane-kind name `plane-mcp` rather than a `proto-mcp`
# that would imply the plane rode a different knob. Default-on: the shipped binary speaks MCP.
plane-mcp = ["dep:busbar-mcp", "busbar-core/plane-mcp"]
# THE A2A PLANE, now the `busbar-a2a` crate, behind this switch which carries that crate edge. ONE
# switch for A2A the plane and the A2A crate — never two — the exact analogue of `plane-mcp` above.
# Default-on: the shipped binary speaks A2A. Forwards to `busbar-core/plane-a2a` (= `busbar-substrate/
# plane-a2a`), which gates the plane's substrate items and captures/refuses the `agents:` config
# section when off, so `--no-default-features` drops the `busbar-a2a` edge and compiles the whole A2A
# plane out while core still routes LLM + MCP (the plane-split deletion test).
plane-a2a = ["dep:busbar-a2a", "busbar-core/plane-a2a"]
# THE VOICE PLANE, the busbar-voice crate, behind this switch. The analogue of `plane-a2a` — one
# switch for the crate edge + the core/substrate forwards — EXCEPT it is deliberately absent from
# `default`. `dep:busbar-voice` pulls the crate; `busbar-voice?/runtime` turns on its live-session
# runtime (the same feature it would be under `busbar-voice/runtime`, since `dep:busbar-voice` here
# enables the crate). The `?/` spelling is deliberate: it makes the forward an OPTIONAL-dep feature
# reference, so the strong-form deletion gate (scripts/plane-delete-test.sh) strips it with the same
# rule it strips `busbar-voice?/openapi-schema`, leaving voice byte-for-byte removable. Compiling the
# runtime here gives the `build_runtime` body; the skeleton build leaves `build_runtime: None`.
plane-voice = ["dep:busbar-voice", "busbar-voice?/runtime", "busbar-core/plane-voice"]
# THE VOICE PLANE, SERVED THROUGH THE COMPOSITION ROOT rather than through the previous release's
# path. OFF by default and deliberately so: the root is BUILT before any plane is SWITCHED onto it,
# and this is the switch. Off, the binary is byte-for-byte what it was — the module still compiles
# and its cells still run, because the root is proved against the real traits whether or not
# anything routes through it. On, `main()` mounts the voice plane's units.
#
# It carries no config key, no environment variable and no boot line. A deployment cannot turn it on
# by editing a config file and cannot tell from the logs which way it was built, which is what keeps
# the neutrality cells answering the same on both legs. It forwards to `plane-voice` because the
# thing it mounts needs the plane's own crate edge to exist.
root-voice = ["plane-voice"]
# THE A2A PLANE ON THE KERNEL. Default OFF, and off is the point: the root is BUILT before any
# plane is SWITCHED onto it, so this feature installs the composition and diverts no byte. With it
# on, `main()` assembles the A2A plane's scope entries and its record-leg binding at boot and holds
# them; the serving path is still the one the A2A plugin mounts, which is why the conformance
# battery, the TCK and the neutrality cells read identically with the feature on and with it off.
# It carries no config key, no environment variable and no boot line, for the same reason.
root-a2a = []
# THE MCP PLANE'S KERNEL BINDINGS, default OFF. Not a second MCP switch: `plane-mcp` above still
# decides whether this binary speaks the protocol at all. This one decides whether the MCP plane's
# bindings to the fourteen units are compiled and sealed at boot, which is the step BEFORE any byte
# is served through them. Default-off is the whole point of the ordering — the bindings are built and
# checked against the real unit traits while the serving path is untouched — so a build with it on
# and a build with it off answer identically on the wire, and the rigs prove that both ways.
root-mcp = []
# THE ROOT-DRIVEN ADMIN SURFACE (composition-root step C1 / switch-over S1). DEFAULT OFF, and it
# stays off until the oracle's admin family is green on it: the switch is what makes an admin request
# travel through the kernel's loop instead of reaching its handler directly, and until that is
# measured the shipped binary must keep the path it has. Off, the feature costs one unbuilt module
# and nothing else — `main.rs` names the mount inside a `cfg` and the router it wraps is untouched.
#
# `tower` is the feature's own edge: wrapping a mounted router means calling it as the service it
# already is, which is the one thing that guarantees the inner surface answers exactly as it did.
root-admin = ["dep:tower"]
auth-admin-tokens = ["busbar-core/auth-admin-tokens"]
hooks-ranking = ["busbar-core/hooks-ranking"]
openapi-schema = ["busbar-core/openapi-schema", "busbar-llm?/openapi-schema", "busbar-mcp?/openapi-schema", "busbar-a2a?/openapi-schema", "busbar-voice?/openapi-schema"]
loom-model = ["busbar-core/loom-model"]
txn-fence-red = ["busbar-core/txn-fence-red"]

[dev-dependencies]
# The bin's own unit tests (src/tests/tests.rs, the ~14 boot/CLI helpers) build App fixtures
# through core's test_support, which core exposes to dependents only behind this feature.
busbar-core = { path = "../busbar-core", features = ["test-support"] }
# The integration suite under tests/ (black-box: boots the binary / reads generated inventories).
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true, features = ["json"] }
axum = { workspace = true, features = ["http1"] }
http-body-util = { workspace = true }
futures = { workspace = true }
# tests/mcp_stdio_serve.rs encodes the MRTR requestState fixtures it drives over the process's
# own stdin/stdout the same way the engine does; the binary crate no longer pulls base64 as a
# runtime dep after the core split, so the integration test needs its own copy.
base64 = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
# tests/method_coverage.rs et al. keep their rationale from the pre-split manifest (git history).
busbar-store-example-plugin = { path = "../store-example-plugin" }
# tests/cli_validate.rs builds signed plugin tarball fixtures.
busbar-plugin-sign = { path = "../plugin-sign" }
hex = { workspace = true }
# `root/transports.rs` provisions a listener against a real self-signed pair rather than a fixture
# shaped to fit: the point of that test is that the material actually parses.
rcgen = { workspace = true }
# THE ADDED-LATENCY INSTRUMENT (`benches/hook_path.rs`) — black-box, boots the shipped binary.
criterion = { workspace = true }

# ── THE HOOK-PATH BENCH ── `harness = false` because criterion supplies its own `main`. Still a
# black-box instrument that boots the shipped binary (see the bench's own header). The split gives
# it the OPTION of becoming a lib-level bench against busbar-core; taking that option is step 9's
# business, not this unit's.
[[bench]]
name = "hook_path"
harness = false
