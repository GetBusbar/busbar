[package]
name = "busbar"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# `rust-version` rationale: see busbar-kernel/Cargo.toml — one pinned number, set to what CI verifies.
rust-version = "1.97"
description = "Native-protocol LLM gateway: lossless cross-protocol translation, weighted pools, per-(pool,lane) circuit breaking, and governance — in one self-contained Rust binary."
license = "Apache-2.0"

# THE THIN BINARY. Step 3.7 of 1.6.0: everything an operator's request touches lives in
# `busbar-core`; this package is argument parsing, config LOCATION, process lifecycle (bind /
# serve / shutdown / the jemalloc purge fallback), and — from step 4 — protocol registration.
# The composition root is allowed to know the protocol set; nothing else is.
[[bin]]
name = "busbar"
path = "src/main.rs"

[dependencies]
# The engine (busbar-core absorbed INTO busbar-kernel, W4.a #19/#37) is the merged `busbar-kernel`
# dep declared below with the loop crate; `default-features = false` there so the binary's OWN
# feature list stays the single decision point (each busbar feature forwards to the kernel feature
# of the same name below).
# THE OAUTH 2.1 AUTHORIZATION-SERVER PLANE (`oauth_as:`), a NORMAL (non-optional) dependency — it
# carries no feature flag, unlike the protocol crates below, because `oauth-as` (the underlying
# crate) was always a normal dependency of the engine and 1.6.0's extraction did not change that:
# the plane costs nothing until `oauth_as:` is configured. The composition root (`main`) calls
# `busbar_core_oauth2::install()` once, registering this crate's seam implementation into
# `busbar_core::oauth_as::seam` — core cannot name this crate directly (one-way dependency; core
# depends on nothing here), so the registration is the one place the binary's own manifest and
# `main.rs` have to know this plane exists.
busbar-core-oauth2 = { path = "../busbar-core-oauth2" }
# The admin API service (`/api/v1/admin/*`), a MANDATORY sibling crate (not a plugin). Always linked;
# `main` registers its mount seam unconditionally. Feature-neutral defaults off — the binary's own
# feature forwards below turn on `busbar-admin`'s features in lock-step with busbar-core's.
busbar-core-admin = { path = "../busbar-core-admin", default-features = false }
# The core-side connection-security seam (DECISIONS #40): builds the opaque `ConnectionSecurity`
# wrap (identity for a plaintext binding, rustls-backed for a TLS one) the composition root hands
# to `busbar_kernel::tls::serve`. A mandatory sibling, like `busbar-admin`/`busbar-core-oauth2` above —
# never a plugin, always linked.
busbar-core-connector = { path = "../busbar-core-connector" }
# `amend_rate_history` decodes the correction body and digests the operator's free-text reason
# into the fixed-width `reason_hash` the dated rate-card history seals (the same SHA-256 the substrate
# signs with). These are the composition root's, used only by the admin verb's effect half.
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# The deployment keyset (spec #82(a); BUSBAR-1.6.0.md THE DESIGN, §2, PB-13): `root::keyset` mints the one
# ed25519 seed that signs the audit chain and the ledger's checkpoints from the OS CSPRNG.
getrandom = { workspace = true }
# The operator-signature verifier for the D38 `amend_rate_history` effect: the sealed operator key
# arrives (through the posture seam) as raw ed25519 bytes, and this parses them and checks the
# detached signature with the inherent STRICT verify. Composition-root knowledge, used only by the
# admin verb's effect half.
ed25519-dalek = { workspace = true }
# THE PROTOCOL CRATES — the composition root's knowledge, per the manifest header above. ONE CRATE
# PER PROTOCOL: `busbar-llm` carries the LLM protocol's six dialects together (an operator picks LLM
# coverage or none, never a subset), and `busbar-mcp` is a different protocol and therefore a
# different plugin — it carries the MCP protocol codec today (folded in from the former
# `busbar-proto-mcp`) and the MCP plane in a later plane-split step, both behind the ONE `plane-mcp`
# switch. Each is optional behind a feature so the deletion gate can build the binary WITHOUT a
# protocol and watch it refuse that protocol's config rather than serve it
# (scripts/proto-deletion-gate.sh). Default-on: the shipped binary speaks both.
busbar-llm = { path = "../busbar-llm", optional = true }
# THE LLM PLANE, through its memory-ABI door: the edge the development-only `llm-on-driver` switch
# carries (see that feature). Off by default: the `proto-llm` row serves llm until the flip.
busbar-plane-llm = { path = "../busbar-plane-llm", optional = true }
busbar-mcp = { path = "../busbar-mcp", optional = true }
# THE A2A PLANE-KIND SHELL (step 3.B.0 of the plane split). Empty crate so far (see its `src/lib.rs`)
# — nothing in `main.rs` names it and `plane-a2a` below is not in `default`, so this edge is inert
# until the plane/codec code that a later step moves actually lands here.
busbar-a2a = { path = "../busbar-a2a", optional = true }
# THE VOICE PLANE-KIND CRATE (Plane 4), the analogue of busbar-a2a above. Optional behind
# `plane-streaming`, now IN `default` (voice ships default-ON + deletable, exactly like plane-mcp/
# plane-a2a). The LLM money path is unchanged (busbar-core's default carries no voice/duplex-ws
# edge); the shipped binary gains the voice plane + its WS transport, and `--no-default` proves the
# whole edge disappears with the crate (strong-form deletable). The `busbar-voice/runtime` edge is
# carried by the feature (below), not here.
busbar-voice = { path = "../busbar-voice", optional = true }
# Boot-time plugin listing (`--plugins`) reads the registry the loader builds.
busbar-plugin-loader = { path = "../plugin-loader" }

# ── THE COMPOSITION ROOT'S OWN EDGES (src/root/) ────────────────────────────────────────────────
# The binary is the one place entitled to name the kernel, the units, the planes and the transports
# together: that is what a composition root IS. Everything below is reached only from `src/root/`,
# and nothing below reaches back — the three axes stay blind to each other and only this crate
# composes them. These edges exist so `ProductionUnits` (the one implementor of the kernel's `Units`
# trait), the registry seal, the vocabulary interner, the durability branch and the listener
# provisioning have somewhere to live that is not a unit and not a plane.
busbar-kernel = { path = "../busbar-kernel", default-features = false }
busbar-contract = { path = "../busbar-contract" }
# The eight kernel workflow crates (#36).
busbar-kernel-identity = { path = "../busbar-kernel-identity", features = ["sha256"] }
busbar-kernel-scope = { path = "../busbar-kernel-scope" }
busbar-kernel-budget = { path = "../busbar-kernel-budget" }
busbar-kernel-ledger = { path = "../busbar-kernel-ledger" }
busbar-kernel-egress = { path = "../busbar-kernel-egress" }
busbar-kernel-breaker = { path = "../busbar-kernel-breaker" }
busbar-kernel-wal = { path = "../busbar-kernel-wal" }
busbar-kernel-audit = { path = "../busbar-kernel-audit" }
# The pure planes reach the boot seal through their host's linked entry (`PLANE` + `CLAIMS` on the
# `claims` axis), so the root names none of them. The streaming plane's edge stays for the root's own
# streaming unit, which builds its node over the pure plane.
busbar-plane-streaming = { path = "../busbar-plane-streaming" }
# THE DECISIONS PLANE (jev), #48's fifth — and the one plane crate that is BOTH halves at once. Its
# four siblings above are PURE planes whose registry declaration is carried by a separate impure
# host crate (`busbar-llm`/`busbar-mcp`/`busbar-a2a`/`busbar-voice`, the optional protocol crates
# declared further up); jev has no host, by the signed design, so this single crate is the plane AND
# the section. That is why this line is OPTIONAL when the four above are not: it follows the
# convention of the thing it is — the crate whose `PLANE_DECL` is installed — and `plane-decisions`
# below is the ONE switch for the plane and its crate edge together, exactly as `plane-a2a` and
# `plane-streaming` are. `--no-default-features` therefore still installs no plane at all, which is the
# property the strong-form deletion test is written about.
#
# The declaration itself is NOT in this crate and cannot be: a pure plane's manifest may name
# `busbar-contract` and nothing else (DECISIONS #40), and `PlaneDecl` is a `busbar-kernel` type. The
# composition root writes it, in `src/root/plane_decisions.rs`, which is the one place entitled to
# name a kernel type and a plane in the same file.
busbar-plane-decisions = { path = "../busbar-plane-decisions", optional = true }
# THE DEFAULT STORE (`governance.store: memory`), linked in every build through the `stores` axis —
# the same row a dropped-in store takes, opened in process. The kernel names no store.
busbar-store-memory = { path = "../store-memory" }
# THE SECRET SOURCES (`{ env: VAR }`, `{ file: PATH }`), linked in every build through the `secrets`
# axis (THE DESIGN, "Plugins": env and file secrets are ordinary plugins, linked in the default build;
# ARCHITECT 2026-10-02 WIRE-SECRET) and loaded through the one loader only when a reference names one.
# They live in their own repos (GetBusbar/busbar-secret-env, GetBusbar/busbar-secret-file) and are
# pulled at a PINNED rev; the workspace `[patch]` points the busbar crate they name at this tree.
# The kernel names neither.
busbar-secret-env = { workspace = true }
busbar-secret-file = { workspace = true }
# THE RANKING HOOKS (`cheapest`/`fastest`/`least_busy`/`usage`), linked through the `hooks` axis
# under `hooks-ranking` — one row, the strategy spellings its aliases. The kernel names no hook.
busbar-hooks-ranking = { path = "../hooks-ranking", optional = true }
# THE OPERATOR CREDENTIAL (`auth.admin_auth: [admin-tokens]`, the single operator admin token), a
# first-party AUTH plugin linked through the `auths` axis under `auth-admin-tokens` — the same row a
# signed tarball of it registers when dropped in (DECISIONS #2 rule (1); ARCHITECT 2026-09-27
# AUTH-ROW). It lives in its own repo (GetBusbar/busbar-auth-admin-tokens) and is pulled at a PINNED rev; the
# workspace `[patch]` points the busbar crates it names at this tree. The kernel names no auth module.
busbar-auth-admin-tokens-plugin = { workspace = true, optional = true }
# THE REQUEST-LOG FILE SINK (`module: request-log-file`), a first-party EXPORT plugin linked through
# the `exports` axis (K9b) — the same row a signed tarball of it registers when dropped in. It lives
# in its own repo (GetBusbar/busbar-export-file) and is pulled at a PINNED rev; the workspace `[patch]`
# points the busbar crates it names back at this tree.
busbar-export-file = { workspace = true, optional = true }
# THE REQUEST-LOG WEBHOOK SINK (`module: request-log-webhook`), a first-party EXPORT plugin linked
# through the `exports` axis (K9c) — the same row a signed tarball of it registers when dropped in. It
# lives in its own repo (GetBusbar/busbar-export-webhook) and is pulled at a PINNED rev; the workspace
# `[patch]` points the busbar crates it names back at this tree.
busbar-export-webhook = { workspace = true, optional = true }
# THE PROMETHEUS EXPORT SINK (`module: prometheus`), a first-party EXPORT plugin linked through the
# `exports` axis (K9d) — the same row a signed tarball of it registers when dropped in. The host
# keeps the recorder and serves `/metrics`; this sink renders the recorder's snapshot. It lives in its
# own repo (GetBusbar/busbar-export-prometheus) and is pulled at a PINNED rev; the workspace `[patch]` points
# the busbar crates it names back at this tree.
busbar-export-prometheus = { workspace = true, optional = true }
# THE OTLP TRACE SINK (`module: otlp`), a first-party EXPORT plugin linked through the `exports` axis
# (K9e-2; owner answer Q75: OTLP export never delivered in 1.5.5, and 1.6.0 fixes it) — the same row a
# signed tarball of it registers when dropped in. It encodes each `traces` record as an OTLP/HTTP
# protobuf request the host posts under the collector egress policy it declares. It lives in its own
# repo (GetBusbar/busbar-export-otlp) and is pulled at a PINNED rev; the workspace `[patch]` points the busbar
# crate it names back at this tree.
busbar-export-otlp = { workspace = true, optional = true }
# The transports. Composition is an edge that does not exist as a Cargo dependency — a transport may
# not name the layer beneath it — so the root hands each wire's build the layer it built below it.
# Which wires a build links is the `transport` rows of the linked table below; the source names none.
busbar-transport-tcp = { workspace = true }
busbar-transport-http = { workspace = true }
# WebSocket, and the ONE transport that is optional: it is the voice plane's edge and nothing else
# reaches it, so a build without voice must not carry it. Non-optional, `--no-default-features` still
# pulled `tokio-tungstenite` through this line and voice stopped being strong-form deletable — the
# exact leak `cargo xtask gate duplex-ws-default-edge` exists to catch. `plane-streaming` carries the edge.
busbar-transport-ws = { workspace = true, optional = true }
busbar-transport-stdio = { path = "../busbar-transport-stdio" }
# The root's card is SWAPPED by a live config apply and PINNED by every unit that prices against it,
# which is one atomic store against many lock-free readers — the same shape, and the same crate, the
# engine already swaps its config snapshot with.
arc-swap = { workspace = true }
# Behind `root-admin` only. The root-driven admin surface wraps the router the operations are already
# mounted on and calls it as the tower service it is, so the inner surface answers exactly as it did
# and no status, header or byte is re-derived on the way out.
tower = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { workspace = true }
# The body trait itself, named because the composition root implements it: the llm plane's answer goes
# out wrapped so the spend its body reports on the way past has somewhere to land. A passthrough, and
# the same version axum is built on — this is the trait axum's own `Body` implements, not a second one.
http-body = { workspace = true }
tracing = { workspace = true }
# THE COLLECTOR EGRESS POLICY (`root::otlp`, K9e-2): the OTLP endpoint guard, which the host's egress
# carrier holds a sink that declares `collector` to, parses the target as a URL.
url = { workspace = true }
metrics = { workspace = true }
serde_yaml = { workspace = true }
# THE THREAD-PER-CORE BOOT SEAM — the one unix data-plane topology (non-unix keeps the classic
# runtime as a compile-time platform shape; no knob selects either). Binary-only deps — nothing on
# the request path names them. `core_affinity` advisorily pins the per-worker threads, `socket2`
# sets SO_REUSEPORT on each per-worker listener so the kernel fans connections across them. See
# main.rs `serve_thread_per_core`.
core_affinity = { workspace = true }
socket2 = { workspace = true }

# Global allocator: jemalloc on EVERY target EXCEPT windows-msvc — a property of the BINARY (only
# one crate in a link may declare a global allocator), which is why these stay here when everything
# else moved to busbar-core. Full rationale in main.rs at the `#[global_allocator]` site.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }

[target.'cfg(target_env = "musl")'.dependencies]
tikv-jemallocator = { workspace = true, features = ["disable_initial_exec_tls"] }

[features]
# Pure forwards: every `#[cfg(feature = ...)]` site lives in busbar-core, so the binary's features
# are one-line re-exports of the core feature with the same name. Every protocol entry below is the
# SAME default set the monolithic crate had; `root-admin` is the addition, and it is a path rather
# than a surface — the operations, their bytes and their features are unchanged.
default = ["auth-admin-tokens", "hooks-ranking", "proto-llm", "plane-mcp", "plane-a2a", "plane-streaming", "plane-decisions", "export-file", "export-webhook", "export-prometheus", "export-otlp", "root-admin", "transport-tcp"]
# A protocol crate: the dependency edge plus its registration line in main.rs. Dropping the
# feature is the deletion test's level-1 build. There is no per-DIALECT feature and there must not
# be one — "LLM coverage or not" is the choice this seam offers, and a `proto-gemini` knob would be
# a second, finer answer to a question the owner ruling already settled.
# ONE switch for the plane and the node its units run through (`src/root/plane_node.rs`): the plane's
# `linked-axes` row carries the `node` axis, so linking it sets the generated `linked_axis_node` cfg
# the node compiles under, and its `root-units` row puts the node's `ROOT_UNIT` in the boot order. The
# plane's arrivals hand every unit to the node and there is no other path an arrival can take
# (ARCHITECT R7(b): the build that served them through the shell instead is dropped). There is no
# second, per-node switch (spec #17: one feature per plane, no `root-*`; ARCHITECT K2i residue).
proto-llm = ["dep:busbar-llm"]
# THE MCP PROTOCOL, carried by `busbar-mcp`: the dependency edge plus the `busbar_mcp::PROTO_DECL`
# registration line in main.rs. ONE switch for MCP the protocol codec today and MCP the plane once
# it folds in — never two — so it keeps the plane-kind name `plane-mcp` rather than a `proto-mcp`
# that would imply the plane rode a different knob. Default-on: the shipped binary speaks MCP.
plane-mcp = ["dep:busbar-mcp", "busbar-kernel/plane-mcp", "busbar-core-admin/plane-mcp"]
# THE A2A PLANE, now the `busbar-a2a` crate, behind this switch which carries that crate edge. ONE
# switch for A2A the plane and the A2A crate — never two — the exact analogue of `plane-mcp` above.
# Default-on: the shipped binary speaks A2A. Forwards to `busbar-kernel/plane-a2a` (= `busbar-substrate/
# plane-a2a`), which gates the plane's substrate items and captures/refuses the `agents:` config
# section when off, so `--no-default-features` drops the `busbar-a2a` edge and compiles the whole A2A
# plane out while core still routes LLM + MCP (the plane-split deletion test).
plane-a2a = ["dep:busbar-a2a", "busbar-kernel/plane-a2a", "busbar-core-admin/plane-a2a"]
# THE VOICE PLANE, the busbar-voice crate, behind this switch. The analogue of `plane-a2a` — one
# switch for the crate edge + the core/substrate forwards — and, like it, IN `default` (voice ships
# default-ON + deletable; `--no-default-features` compiles it out). `dep:busbar-voice` pulls the crate; `busbar-voice?/runtime` turns on its live-session
# runtime (the same feature it would be under `busbar-voice/runtime`, since `dep:busbar-voice` here
# enables the crate). The `?/` spelling is deliberate: it makes the forward an OPTIONAL-dep feature
# reference, so the strong-form deletion gate (scripts/plane-delete-test.sh) strips it with the same
# rule it strips `busbar-voice?/openapi-schema`, leaving voice byte-for-byte removable. Compiling the
# runtime here gives the `build_runtime` body; the skeleton build leaves `build_runtime: None`.
plane-streaming = ["dep:busbar-voice", "transport-ws", "busbar-voice?/runtime", "busbar-kernel/duplex-ws"]
# THE WS WIRE, the one optional transport: the voice plane's edge and nothing else's, so `plane-streaming`
# carries it and `--no-default-features` drops the crate edge and its linked row together.
transport-ws = ["dep:busbar-transport-ws"]
# THE TCP WIRE'S LINKED ROW, DEFAULT ON (#3: a transport is swappable, compiled in OR dropped in). Off,
# the build links no `tcp` row and the wire is served only when its tarball is dropped into
# `plugins/`: the boot seal folds it in the same pass as the linked rows, and the data door accepts
# through it (`root::registry::BootRegistry::dropped_door`). The crate edge stays — the row is what
# the switch gates, as `export-file`'s is.
transport-tcp = []
# THE DECISIONS PLANE (jev), #48's fifth, DEFAULT ON. The analogue of `plane-a2a` above: one switch
# for the plane and the crate edge that carries it, never two. It forwards to NO kernel feature, and
# that is the whole difference between this plane and its four siblings — `busbar-kernel` holds no
# `decisions:` grammar, no decision runtime and no decision seam to gate, because this plane is
# post-1.5.5 and nothing of it was ever built into the engine. What the switch turns on is a
# declaration and a dependency edge; what it turns off is both, so the plane is strong-form
# deletable on the day it lands rather than as a later cleanup.
#
# It carries ONE config key and nothing on the wire. With the switch on, the declaration owns the
# `decisions:` section and wires its parse/default hooks (see `src/root/plane_decisions.rs`), so a
# malformed `decisions:` block fails `--validate` and boot, naming the key; with it off, the key is
# the untyped raw capture every unowned section falls through to. That is the one place a
# deployment can tell the two builds apart, and only with a malformed block. The declaration
# claims no path, binds no audience and builds no runtime slot, so no request is answered
# differently either way — which is what keeps the neutrality cells answering the same on both
# legs, and is why this ships on rather than waiting for a golden it could never move.
plane-decisions = ["dep:busbar-plane-decisions"]
# THE DECISIONS PLANE THROUGH ITS DOOR, the plane's development-only switch (BUSBAR-1.6.0.md Part 3
# section 12, "The switch": a development-only cargo feature flips a plane onto the driver during its
# fold and is deleted when the fold completes). Never in `default`. On, the plane's memory-ABI door
# (`busbar_plane_decisions::plane_door::door`) is a `plane-door` row: the root hands it to the loader
# beside every dropped-in plane door and binds it through the one load on the one dispatcher, so the
# compiled-in plane is called through the same table as its dropped-in cdylib (#2, #30; THE DESIGN
# section 11.4). It carries `plane-decisions`, which keeps the crate edge and the `decisions:` key's
# owner.
plane-decisions-door = ["plane-decisions"]
# THE LLM PLANE THROUGH ITS DOOR, the llm fold's development-only switch (BUSBAR-1.6.0.md Part 3
# section 12, "The switch"; deleted when the llm fold completes). Never in `default`. On, the plane's
# memory-ABI door (`busbar_plane_llm::plane_door::door`) is a `plane-door` row, bound through the
# loader's one load beside every dropped-in plane door, the same table as its dropped-in cdylib
# (#2, #30; THE DESIGN section 11.4). It carries `proto-llm`, whose row stays linked and answers
# every arrival the serve path does not hand the door.
llm-on-driver = ["proto-llm", "dep:busbar-plane-llm"]
# THE REQUEST-LOG FILE SINK, DEFAULT ON: the `busbar-export-file` crate on the export axis. Off, the
# module resolves only when a signed tarball of the sink is dropped into `plugins/`.
export-file = ["dep:busbar-export-file"]
# THE REQUEST-LOG WEBHOOK SINK, DEFAULT ON: the `busbar-export-webhook` crate on the export axis.
# Off, the module resolves only when a signed tarball of the sink is dropped into `plugins/`.
export-webhook = ["dep:busbar-export-webhook"]
# THE PROMETHEUS EXPORT SINK, DEFAULT ON: the `busbar-export-prometheus` crate on the export axis —
# the exposition 1.5.5 shipped built in. Off, the module resolves only when a signed tarball of the
# sink is dropped into `plugins/`.
export-prometheus = ["dep:busbar-export-prometheus"]
# THE OTLP TRACE SINK, DEFAULT ON (K9e-2; the `module: otlp` 1.5.5 shipped): the `busbar-export-otlp`
# crate on the export axis. Off, the module resolves only when a signed tarball of the sink is dropped
# into `plugins/`.
export-otlp = ["dep:busbar-export-otlp"]
# THE ROOT-DRIVEN ADMIN SURFACE (composition-root step C1 / switch-over S1). DEFAULT ON: it was held
# off until the oracle's admin family was green on it, and it is. The switch is what makes an admin
# request travel through the kernel's loop instead of reaching its handler directly; the 234 owed
# `admin.ops` cells and the whole 890-cell owed golden read the same either way, which is the
# measurement the default was waiting for. The leg stays switchable — turning it off drops one
# unbuilt module and nothing else, because `main.rs` names the mount inside a `cfg` and the router it
# wraps is untouched.
#
# `tower` is the feature's own edge: wrapping a mounted router means calling it as the service it
# already is, which is the one thing that guarantees the inner surface answers exactly as it did.
root-admin = ["dep:tower"]
# THE INTEGRATION-TEST HARNESS SEAM (`src/root/harness.rs`), off by default and never in `default`.
# An integration test under `tests/` links the library as an ordinary DEPENDENCY, where `cfg(test)`
# is false — so the legs' own `#[cfg(test)] mod tests` fixtures do not exist in the artifact it
# links, and no visibility change can reach them. This feature is how a cross-leg test gets an
# in-crate module compiled INTO that artifact instead. It adds no code to the shipped binary: the
# module is `#[cfg(any(test, feature = "test-harness"))]` and this feature is never enabled by a
# release build, which is why the surface ceilings do not count it.
test-harness = []
# THE OPERATOR CREDENTIAL'S LINKED ROW, DEFAULT ON: the auth plugin on the `auths` axis. Off, the
# operator credential resolves only when a signed tarball of the module is dropped into `plugins/`,
# and a configured admin token with no row answering it is a boot refusal naming this feature.
auth-admin-tokens = ["dep:busbar-auth-admin-tokens-plugin"]
hooks-ranking = ["dep:busbar-hooks-ranking", "busbar-kernel/hooks-ranking", "busbar-core-admin/hooks-ranking"]
openapi-schema = ["busbar-kernel/openapi-schema", "busbar-core-admin/openapi-schema", "busbar-llm?/openapi-schema", "busbar-mcp?/openapi-schema", "busbar-a2a?/openapi-schema", "busbar-voice?/openapi-schema"]
loom-model = ["busbar-kernel/loom-model"]

# ── THE LINKED PLUGINS (K1, #2 rule (1)) ─────────────────────────────────────────────────────────────
# The composition root's source names no plugin: WHICH plugins a build links is this data. build.rs
# (src/linked_gen.rs) reads the three tables below and writes `$OUT_DIR/linked.rs`, which main.rs
# includes: `extern crate <crate> as _;` for every row whose cargo feature is ENABLED, `LINKED` — one
# table per registration axis over each linked crate's `linked` entry module (the contract
# PLANE_DECLARATION joined kernel-side to its kernel-typed PLANE_HOOKS, protocol declarations,
# arrivals, diagnostics, installers …) — a `linked_*` cfg per root-bound seam an enabled entry drives,
# and the `ROOT_UNITS` table of each enabled root module's `ROOT_UNIT`. `src/root/linked.rs` folds
# them into the kernel's registration seams, axis by axis, in table order — the same path an entry
# adapted from a plugin dropped into `plugins/` feeds.
#
# THE ORDER IS THE REGISTRATION ORDER on every axis (protocols, planes, diagnostics, WS arrivals, the
# root-bound seams): appending a row keeps every existing protocol's index; inserting one renumbers
# them. `crates/busbar/tests/composition_root_names_no_linked_plugin.rs` refuses a `main.rs` that
# names any crate or root module listed here.
[package.metadata.busbar.linked]
proto-llm = "busbar-llm"
plane-mcp = "busbar-mcp"
plane-a2a = "busbar-a2a"
plane-streaming = "busbar-voice"
plane-decisions = "busbar-plane-decisions"
export-file = "busbar-export-file"
export-webhook = "busbar-export-webhook"
export-prometheus = "busbar-export-prometheus"
export-otlp = "busbar-export-otlp"
# THE AUTH AXIS: the operator credential's module, under its packaging feature.
auth-admin-tokens = "busbar-auth-admin-tokens-plugin"
# THE COLD-KIND AXIS's in-process rows: the default store (a required dependency: every build links
# it) and the ranking hooks (under their feature).
store-memory = "busbar-store-memory"
hooks-ranking = "busbar-hooks-ranking"
# THE SECRET AXIS: the env and file sources, required dependencies (every build links them; the key
# names the row). Each is loaded only when a reference names it.
secret-env = "busbar-secret-env"
secret-file = "busbar-secret-file"
# THE TRANSPORT AXIS (#3, #30): the wires this build links, one row each, folded bottom-up by the boot
# seal. A row whose crate is a required dependency is linked in every build (its key names the row);
# `ws` rides its optional edge. Rows share a crate where one crate carries several wires.
transport-tcp = "busbar-transport-tcp"
transport-http = "busbar-transport-http"
transport-sse = "busbar-transport-http"
transport-ws = "busbar-transport-ws"
transport-grpc = "busbar-transport-http"
transport-stdio = "busbar-transport-stdio"
# THE PLANE DOOR AXIS (#2, THE DESIGN section 11.4): a plane's memory-ABI `door`, bound through the
# loader's one load beside the dropped-in plane doors.
plane-decisions-door = "busbar-plane-decisions"
llm-on-driver = "busbar-plane-llm"

# What each linked feature's crate registers (keyed by the feature, as the linked row is), axis by axis: `plane` (PLANE_DECLARATION + PLANE_HOOKS, joined
# kernel-side), `protocols`, `path-ingress`, `body-ingress`, `protocol-seams`, `diagnostics`,
# `ws-arrivals`, `on-host`, `compose`, `stdio-serve`, `exports` — each an item of the crate's entry
# module — and the root-bound seams it drives: `egress`, `plane-sections`, `admin-envelope`.
# `gauntlet-one-shot` / `gauntlet-session`: the plane rides the unified kernel loop (#28) —
# `gauntlet_install::install()` flips its `PLANE_DECLARATION.key` onto the one-shot or session runner.
# `claims`: the pure plane the boot seal registers (`PLANE`) and the claims it declares (`CLAIMS`).
# `node`: the entry's `install_node`, handed the node a root unit drives the entry's units through.
# `transport`: a wire's `KEY`, `COMPOSES_OVER` and `build(lower, &TransportSettings)`.
# `stores` / `hooks`: an in-process store's `STORE` and a ranking row's `HOOK` (`root::linked`).
# `auths`: a `kind: auth` plugin's memory-ABI door (`<entry>::door::door`, the one its dropped-in
# build exports), under its `linked-name` key.
# `plane-door`: a plane's memory-ABI `door`, bound through the loader's one load (`root::linked`).
# `secrets`: a `kind: secret` plugin's memory-ABI `door`.
[package.metadata.busbar.linked-axes]
proto-llm = "plane claims protocols path-ingress body-ingress protocol-seams diagnostics on-host cli-help node gauntlet-one-shot"
plane-mcp = "plane claims protocols diagnostics egress stdio-serve cli-help gauntlet-one-shot"
plane-a2a = "plane claims diagnostics egress plane-sections admin-envelope gauntlet-one-shot"
plane-streaming = "plane claims diagnostics ws-arrivals compose gauntlet-session"
plane-decisions = "plane claims"
export-file = "exports"
export-webhook = "exports"
export-prometheus = "exports"
export-otlp = "exports"
auth-admin-tokens = "auths"
store-memory = "stores"
hooks-ranking = "hooks"
secret-env = "secrets"
secret-file = "secrets"
transport-tcp = "transport transport-door"
transport-http = "transport"
transport-sse = "transport"
transport-ws = "transport"
transport-grpc = "transport"
transport-stdio = "transport"
plane-decisions-door = "plane-door"
llm-on-driver = "plane-door"

# A linked crate whose entry module is not `<crate>::linked`: the decisions plane is a PURE plane
# crate whose manifest names `busbar-contract` and nothing else (#40), so its kernel-typed hooks are
# written in the composition root and its entry module is that root module.
[package.metadata.busbar.linked-entry]
busbar-plane-decisions = "crate::root::plane_decisions"
# One crate, several wires: each row past the crate's own `linked` names its entry.
transport-sse = "busbar_transport_http::linked::sse"
transport-grpc = "busbar_transport_http::linked::grpc"
# A secret plugin's door is its `door` module's.
busbar-secret-env = "busbar_secret_env::door"
busbar-secret-file = "busbar_secret_file::door"
# An auth plugin's entry is its crate root; its memory-ABI door is `<entry>::door::door`.
busbar-auth-admin-tokens-plugin = "busbar_auth_admin_tokens_plugin"
# A plane door row's entry is the module that exports its `door`.
plane-decisions-door = "busbar_plane_decisions::plane_door"
llm-on-driver = "busbar_plane_llm::plane_door"

# The key an `auths` row answers on the auth axis — the name its signed tarball's manifest states.
[package.metadata.busbar.linked-name]
auth-admin-tokens = "admin-tokens"

# The root's own unit modules (the kernel-loop halves of planes that still live in the root), each
# compiled when its row's cargo feature is on (the node under the `linked_axis_node` cfg that
# feature's `linked-axes` row sets) and exporting a `ROOT_UNIT` (`root::linked::RootUnit`). Order is
# the order their boot steps run in: seals, then the configuration step, then the book step.
# THE SERVED-LEG WITNESSES the root's rider tests run: cargo feature -> the plane crate whose
# `testkit::SERVED` table they drive through the kernel-loop runner `gauntlet_install::install()`
# registers for that plane's key. Test builds only (`build.rs` emits `$OUT_DIR/served_witness.rs`, which
# `root/tests/gauntlet_kernel.rs` includes); each crate is linked with `test-support` by the dev-deps.
[package.metadata.busbar.served-witness]
plane-mcp = "busbar-mcp"
plane-a2a = "busbar-a2a"
plane-streaming = "busbar-voice"

[package.metadata.busbar.root-units]
plane-decisions = "plane_decisions"
proto-llm = "plane_node"

[dev-dependencies]
# root_listeners_are_the_connectors.rs: the TLS data door's certificate, generated per run.
rcgen = { workspace = true, features = ["pem"] }
# The loop-unify shadow-compare test (`root::gauntlet_kernel`) implements a deterministic
# `GauntletPlane` to drive both the substrate gauntlet and the kernel rider on one input; the trait
# is `#[async_trait]`, so its test impl needs the macro.
async-trait = { workspace = true }
# The root's own llm tests install the plane's seams.
busbar-llm = { path = "../busbar-llm", features = ["test-support"] }
# The served planes' test kits: `testkit::SERVED` (their served-leg witnesses) is `test-support` only.
busbar-mcp = { path = "../busbar-mcp", features = ["test-support"] }
busbar-a2a = { path = "../busbar-a2a", features = ["test-support"] }
busbar-voice = { path = "../busbar-voice", features = ["test-support"] }
# The bin's own unit tests (src/tests/tests.rs, the ~14 boot/CLI helpers) build App fixtures
# through the kernel's test_support, exposed to dependents only behind this feature.
busbar-kernel = { path = "../busbar-kernel", features = ["test-support"] }
# The amendment-chain verify test edits the held journal in memory (`tamper_node_for_test`), which the
# audit crate exposes to a dependent's tests only behind this feature.
busbar-kernel-audit = { path = "../busbar-kernel-audit", features = ["test-support"] }
# THE EQUIVALENCE PROOF CALLS THE ADMIN READ RATHER THAN REPRODUCING IT.
# `tests/money_one_function_equivalence.rs` runs every implementation of `money = f(ledger, card)`
# side by side, and `GET /api/v1/admin/usage` is one of them. Its three derivations are crate-private
# to busbar-core-admin, so the proof used to carry COPIES — and the copies drifted (the dated one
# grew `resolve_model_alias`; the copy did not, and nothing reddened). The admin crate's existing
# `test-support` feature exposes them through `v1::service::read_path_money`, so the proof now calls
# the shipped arithmetic. `default-features = false` mirrors the normal edge above exactly, so this
# dev edge turns on the one feature and nothing else.
busbar-core-admin = { path = "../busbar-core-admin", default-features = false, features = ["test-support"] }
# The integration suite under tests/ (black-box: boots the binary / reads generated inventories).
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true, features = ["json"] }
axum = { workspace = true, features = ["http1"] }
http-body-util = { workspace = true }
futures = { workspace = true }
# tests/mcp_stdio_serve.rs encodes the MRTR requestState fixtures it drives over the process's
# own stdin/stdout the same way the engine does; the binary crate no longer pulls base64 as a
# runtime dep after the core split, so the integration test needs its own copy.
base64 = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
# The plane axis's both-doors proof (`src/root/tests/linked.rs`): a `["cdylib", "rlib"]` fixture, so
# the test links its `PLANE_DECL` (the linked door) and drops its cdylib into a temp `plugins/`
# directory (the dropped-in door) and requires the two to install byte-identical registry rows.
busbar-plugin-example-plane = { path = "../plane-example" }
# The dropped-in export plugin's end-to-end proof (`tests/export_plugin_dropped_in_serves.rs`): the
# FILE sink's repo's cdylib crate at the SAME pinned rev as the linked `busbar-export-file` edge
# above, dropped into `plugins/` as the library a tarball of the sink carries. The sink's own
# both-doors conformance lives in its repo (GetBusbar/busbar-export-file, `tests/conformance.rs`).
busbar-export-file-plugin = { workspace = true }
# The dropped-in transport proofs (`tests/transport_dropped_in_serves.rs`, the tcp-less boot in
# `tests/linked_export_sinks_boot_as_their_own_kind.rs`): the tcp transport repo's cdylib crate at the
# SAME pinned rev as the linked `busbar-transport-tcp` edge above, found in this target dir under
# `deps/` (hashed) by the door it loads as. The wire's own both-doors conformance lives in its repo.
busbar-transport-tcp-plugin = { workspace = true }
# The scrape role's first-party proof (`tests/export_scrape_is_first_party.rs`): the scrape sink's
# repo's cdylib crate at the SAME pinned rev as the linked `busbar-export-prometheus` edge above —
# the library a tarball of the sink carries, found in this target dir by what it loads as. The
# sink's own both-doors conformance lives in its repo (GetBusbar/busbar-export-prometheus).
busbar-export-prometheus-plugin = { workspace = true }
# The REAL token-verifying auth module the dropped-in auth proofs load (R-FIX2; the owner's FIXTURES
# ruling: real plugins are the proofs): GetBusbar/busbar-auth-oidc's cdylib crate at a pinned rev. Nothing
# links it; the dev edge is what makes this crate's test build carry its cdylib (under `deps/`,
# hashed), which the child-process session battery signs into a temp `plugins/` directory and drives
# with JWTs a local issuer signs. Its busbar-contract resolves to this tree through the `[patch]`
# table in the workspace manifest.
busbar-auth-oidc-plugin = { workspace = true }
# The local issuer those proofs verify against: the module's OWN test issuer (its logic crate's
# `testkit` feature — an ES256 key, its JWKS served over a certificate-verified loopback endpoint the
# module trusts through `ca_cert_pem`, and genuinely signed tokens), at the SAME rev.
busbar-auth-oidc = { workspace = true, features = ["testkit"] }
# That proof calls the router it built as the tower service it is (`ServiceExt::oneshot`). The
# normal-edge `tower` above is `root-admin`'s own and optional, so a build without `root-admin` (every
# single-plane build) would not compile the test; the test's edge is its own, unconditional here.
tower = { workspace = true, features = ["util"] }
# The `traces` stream's both-doors proof (`tests/traces_stream_both_doors.rs`, K9a S7 + K9e-2): the
# OTLP sink's repo's cdylib crate at the SAME pinned rev as the linked `busbar-export-otlp` edge above —
# its linked row and its dropped-in library both fed the kernel's traces producer, both posting to a
# local collector — and the subscriber that test installs the producer under.
busbar-export-otlp-plugin = { workspace = true }
tracing-subscriber = { workspace = true }
# What that test and `tests/export_otlp_delivers_spans.rs` (the shipped binary posting to a local
# collector) receive is decoded with the OpenTelemetry project's own generated types, and re-encoded
# to the same bytes: the proto's publisher, not the sink's encoder, says it is an OTLP request.
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
# tests/cli_validate.rs builds signed plugin tarball fixtures.
hex = { workspace = true }
# THE ADDED-LATENCY INSTRUMENT (`benches/hook_path.rs`) — black-box, boots the shipped binary.
criterion = { workspace = true }
# tests/ws_composed_battery.rs (the `ws` transport battery's cross-transport composition cells,
# moved here off `busbar-transport-ws`'s own `kind-isolation:closure` `closure-test-reach`
# findings) builds fixture `VerifiedDestination` and `TransportKeyHandle` values through
# `busbar_contract::plugin::TestKernelSeal`, the one blessed fixture implementor of the SEALED
# `KernelSeal` trait (#65) — dev-only and feature-gated, so it is absent from every release build,
# same as every other crate's own battery does it.
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }

# ── THE HOOK-PATH BENCH ── `harness = false` because criterion supplies its own `main`. Still a
# black-box instrument that boots the shipped binary (see the bench's own header). The split gives
# it the OPTION of becoming a lib-level bench against busbar-core; taking that option is step 9's
# business, not this unit's.
# THE PLANE DRIVER'S TEST PLANE (`tests/plane_driver.rs`): one source, compiled into the test as a
# module (the LINKED door) and built here as a `cdylib` (the DROPPED door), so one unit runs end to end
# through the kernel's plane driver and both doors. An example, not a crate: it never ships.
[[example]]
name = "plane_driver_test_plane"
path = "tests/fixtures/plane_driver_test_plane.rs"
crate-type = ["cdylib"]

[[bench]]
name = "hook_path"
harness = false
