[package]
name = "busbar"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# `rust-version` rationale: see busbar-kernel/Cargo.toml — one pinned number, set to what CI verifies.
rust-version = "1.97"
description = "Native-protocol LLM gateway: lossless cross-protocol translation, weighted pools, per-(pool,lane) circuit breaking, and governance — in one self-contained Rust binary."
license = "Apache-2.0"
autotests = false
autobenches = false
autoexamples = false

# CORE: the composition root with no plugin linked. It names no plugin; every plugin arrives dropped
# into `plugins/`. The default distribution (dist/default) compiles this same source with the
# standard plugins linked, and runs its tests there.
[[bin]]
name = "busbar"
path = "src/main.rs"
test = false
bench = false

[[test]]
name = "test_source_gen"
path = "src/test_source_gen_tests.rs"

# LINT-RULES R16 (SHUTDOWN-HANG §7a): parses root/shutdown.rs and main.rs; every shutdown wait is
# bounded by the drain owner, nothing is aborted, nothing blocks the control thread.
[[test]]
name = "shutdown_waits"
path = "tests/shutdown_waits.rs"

# SEALING-FIX r20 §9 test 31: the release graph never enables busbar-kernel-audit/test-support.
[[test]]
name = "release_build_has_no_test_support"
path = "tests/release_build_has_no_test_support.rs"

[dependencies]
busbar-ports = { path = "../busbar-ports" }
async-trait = { workspace = true }
busbar-core-oauth2 = { path = "../busbar-core-oauth2" }
busbar-core-admin = { path = "../busbar-core-admin", default-features = false }
busbar-core-connector = { path = "../busbar-core-connector" }
busbar-plugin-loader = { path = "../plugin-loader" }
busbar-plugin-abi = { path = "../busbar-plugin-abi", features = ["host"] }
busbar-kernel = { path = "../busbar-kernel", default-features = false }
busbar-migrate = { path = "../busbar-migrate" }
busbar-contract = { path = "../busbar-contract" }
busbar-kernel-identity = { path = "../busbar-kernel-identity" }
busbar-kernel-ledger = { path = "../busbar-kernel-ledger" }
busbar-kernel-egress = { path = "../busbar-kernel-egress" }
busbar-kernel-breaker = { path = "../busbar-kernel-breaker" }
busbar-kernel-wal = { path = "../busbar-kernel-wal" }
busbar-kernel-audit = { path = "../busbar-kernel-audit" }
serde_json = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
arc-swap = { workspace = true }
foldhash = { workspace = true }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "process"] }
axum = { workspace = true }
http-body = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
zeroize = { workspace = true }
tracing = { workspace = true }
idna_adapter = { workspace = true }
lexopt = { workspace = true }
metrics = { workspace = true }
core_affinity = { workspace = true }
socket2 = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }

# Close-on-exec before the migrate re-exec (root/migrate.rs).
[target.'cfg(unix)'.dependencies]
close_fds = { workspace = true }

[features]
test-harness = []

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
# The legacy-signing chain builder of the existing audit fixtures (SEALING-FIX §3.2).
busbar-kernel-audit = { path = "../busbar-kernel-audit", features = ["test-support"] }
# Root trust tests bind admin trust to one real KernelServices (kernel test fixtures).
busbar-kernel = { path = "../busbar-kernel", default-features = false, features = ["test-support"] }
busbar-core-admin = { path = "../busbar-core-admin", default-features = false, features = ["test-support"] }
busbar-contract = { path = "../busbar-contract", features = ["tls", "stage-probe", "test-seal"] }
# The seam's tests count busbar_migrate's entries (MIGRATE-ON-BOOT §9 C1 (sz2)).
busbar-migrate = { path = "../busbar-migrate", features = ["counted"] }
proc-macro2 = { workspace = true }
syn = { workspace = true }
# External fixtures used by this source when the distribution runs its unit tests.

[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
tikv-jemalloc-ctl = { workspace = true }
stats_alloc = { workspace = true }

[lints]
workspace = true
