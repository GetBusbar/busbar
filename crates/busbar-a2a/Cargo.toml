# busbar-a2a — THE A2A (Agent2Agent) PLUGIN CRATE.
#
# The A2A plane and codec, folded together (the former `crates/busbar-core/src/a2a`, ~19k lines: the
# agent card, the task store, the delegating and inbound JSON-RPC/gRPC/REST transports, the `agents:`
# config sections, boot hydration, the router mount and the admin API). A2A the protocol and A2A the
# plane are the same protocol, so they sit behind ONE on/off switch rather than two — ONE PLUGIN PER
# PROTOCOL. Unlike busbar-mcp, A2A is PLANE-ONLY: it contributes a `PlaneDecl` (`PLANE_DECL`) and no
# separate protocol-codec `PROTO_DECL`.
#
# `busbar-core = { default-features = false, optional = true }` mirrors busbar-mcp's SEALED shape: the
# feature decisions belong to the composition root, and busbar-core is no longer a PRODUCTION
# dependency — the default build compiles with NO busbar-core in its closure, every former
# `busbar_core::` reach served by the neutral substrate (the config-section split, the task-reader /
# hostless-egress / admin-envelope seams). busbar-core stays an OPTIONAL dep pulled ONLY by
# `test-support`: the plane's tests drive the engine fixture through the neutral substrate test kit
# (`busbar_substrate::testkit::engine_kit` / `engine_kit_plus`), and the engine's ONE implementation
# of that kit is bound in three `tests/`-path boot files (`engine_boot`, `egress_boot`,
# `envelope_boot`) — the only places this crate's test tree names `busbar_core::`.
[package]
name = "busbar-a2a"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# `rust-version` rationale: see busbar-core/Cargo.toml — one pinned number, set to what CI verifies.
rust-version = "1.97"
description = "The Agent2Agent protocol for busbar: the A2A codec and the A2A plane, as one removable plugin."
license = "Apache-2.0"

[lib]
name = "busbar_a2a"
path = "src/lib.rs"

[dependencies]
# THE SEAL (1.6.0): busbar-core is no longer a PRODUCTION dependency of this plugin. Optional, pulled
# ONLY by `test-support`: the plane's tests reach the engine fixture through the neutral substrate
# test kit, and the engine's implementation of that kit is bound in the `tests/`-path boot files
# alone (see the header). Optional rather than a dev-dependency because a feature cannot reference a
# dev-dep-only crate.
busbar-core = { path = "../busbar-core", default-features = false, features = ["plane-a2a"], optional = true }
# The substrate crate: the neutral shared surface the plugin names instead of busbar-core — the
# diagnostics macros, the config-section split, the task-reader / hostless-egress / admin-envelope
# seams. Carries `plane-a2a` so the plane-gated items are present in this crate's own default build.
busbar-substrate = { path = "../busbar-substrate", features = ["plane-a2a"] }
# The plugin contracts crate, named ahead of use per owner ruling R-E (see header).
busbar-api = { path = "../api" }
# THE WIRE VOCABULARY. The pure half of this plugin, split out so `busbar-plane-a2a` can name the
# canonicalization, the anomaly grammar, the id remap, the meter classes, the durable task record
# shapes and the mount paths without pulling this crate's axum routes, tonic binding, reqwest relay
# leg and socket-capable tokio into a pure kind's closure. Every module that moved is re-exported
# from this crate under its old name.
busbar-a2a-codec = { path = "../busbar-a2a-codec" }
# The plane's own runtime surface — the same workspace pins core takes, for the plane code that moved
# here whole: the transports (tokio, reqwest, futures, tonic/tonic-types/prost + a2a-pb for the gRPC
# binding, tower), the config codecs (serde, serde_yaml, indexmap), the trust crypto (sha2, hex,
# base64, ed25519-dalek, hmac) and the plugin ABI (busbar-plugin, async-trait) the plane's host reaches.
busbar-plugin = { path = "../busbar-plugin" }
busbar-plugin-loader = { path = "../plugin-loader" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "io-std", "process"] }
# `http` under its own name (Method/header vocabulary the engine-era transport speaks); the
# reqwest edge is GONE from the production graph — the plane's hops ride the engine host-side,
# and reqwest survives only in [dev-dependencies] for the live-server test batteries.
http = { workspace = true }
# TEST MACHINERY ONLY: the plane's live-server test batteries compile into the LIBRARY under
# `test-support` and drive reqwest as a client against the fixtures — optional on that feature,
# absent from every shipped build; plain `cargo test -p` reaches it via [dev-dependencies].
reqwest = { workspace = true, features = ["http2", "json"], optional = true }
# TEST MACHINERY ONLY, same shape: the in-memory store the admin-verb battery hands the engine kit's
# governance registry. That battery compiles into the LIBRARY under `test-support` (core's own
# test-support build takes this shape), where a dev-dependency is out of reach.
busbar-store-memory = { path = "../store-memory", optional = true }
# The transport's extra trust anchors are DER (`CertificateDer`) now that the hostless hop rides
# the engine (`Trust::WebpkiPlus`); parsed from PEM at registration, same fail-at-parse posture as
# the retired `reqwest::Certificate::from_pem`.
rustls-pki-types = { workspace = true }
url = { workspace = true }
tonic = { workspace = true }
tonic-types = { workspace = true }
prost = { workspace = true }
http-body-util = { workspace = true }
# The a2aproject's own generated types: `a2a-pb` carries the prost `Message` impls (gRPC wire), and
# `a2a-lf` (lib name `a2a`) carries the ProtoJSON/native type vocabulary the transports name as `a2a::`.
a2a-pb = { workspace = true }
a2a-lf = { workspace = true }
tower = { workspace = true }
ed25519-dalek = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
indexmap = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
getrandom = { workspace = true }
# THE OPENAPI SCHEMA DERIVE, optional and mirroring busbar-core/busbar-mcp exactly. The plane's
# admin-view types derive `schemars::JsonSchema` under `openapi-schema`; when these sources
# dual-compile into busbar-core they take core's `schemars`, and when they compile HERE they need
# their own. Same optional dep, same feature edge, so the derive resolves whichever crate is compiling.
schemars = { workspace = true, optional = true }

[features]
# THE PLANE TESTS SKIP IN THIS CRATE'S OWN BINARY and run only when busbar-core dual-compiles `src/a2a`
# back into ITS test binary. They build a `TestApp` and read the plane's runtime back out by DOWNCAST;
# that runtime's type is `<compiling-crate>::a2a::plane::A2aPlane`, so the fixtures (in busbar-core,
# `pub(crate)`) only produce a value the tests can reach and downcast when BOTH are the same crate —
# in THIS crate's own binary. The App-needing plane tests are gated
# `#[cfg(all(test, feature = "test-support"))]` — `test-support` is exactly the feature that pulls
# busbar-core into the closure (the `&App` fixtures name it), so the gate is TRUE precisely when the
# tests can compile. `cargo test -p busbar-a2a --features test-support` runs the full plane suite here;
# a bare `cargo test -p busbar-a2a` runs only the App-free unit/codec tests. (This replaced the former
# `busbar_a2a_native` build-script cfg + `#[path]` dual-compile into busbar-core; both are gone.)
#
# The plane's sources carry `#[cfg(feature = "…")]` gates (the `PlaneDecl` OpenAPI-schema field, one
# admin-tokens test path). Declared here as FORWARDS so the same `#[cfg]` resolves identically whether
# these sources compile here or dual-compile into busbar-core. The openapi-schema forward points at
# SUBSTRATE (where `PlaneDecl` lives) since busbar-core is no longer a prod dep; the admin-tokens
# forward is weak (off by default, exactly as in core).
openapi-schema = ["busbar-substrate/openapi-schema", "dep:schemars"]
# The one `auth-admin-tokens` site is a test module. Forwarded WEAKLY (`?`) so enabling it never
# force-pulls the optional busbar-core into a non-test-support build; it only cascades where
# busbar-core is already in the closure.
auth-admin-tokens = ["busbar-core?/auth-admin-tokens"]
# Pulls busbar-core (the optional dep) and its test fixtures: the plane's App-driving tests reach the
# engine fixture through the neutral substrate test kit, whose engine-side implementation the
# `tests/`-path boot files bind from busbar-core, so this feature is the one edge that puts
# busbar-core in the closure — the default/prod build has none. Core's `TestApp` fixture names BOTH
# planes' config types unconditionally, so this forwards `plane-mcp`/`plane-a2a` too — the same
# both-planes shape core's own dual-compile test binary builds with.
test-support = [
    "dep:busbar-core",
    "busbar-core/test-support",
    "busbar-core/plane-mcp",
    "busbar-core/plane-a2a",
    "dep:reqwest",
    "dep:busbar-store-memory",
]

[dev-dependencies]
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
# Test-only crates the A2A plane's own `test-support` suite names. These were reachable when the plane
# dual-compiled into busbar-core (through core's dev-deps); now that the suite runs in THIS crate's own
# binary they must be declared here. `reqwest`'s `json` feature is likewise test-only (the live-server
# tests decode responses), unioned with the `http2` prod feature by the resolver.
reqwest = { workspace = true, features = ["json"] }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
busbar-store-memory = { path = "../store-memory" }
busbar-secret-ref = { path = "../secret-ref" }
busbar-plugin-sign = { path = "../plugin-sign" }
