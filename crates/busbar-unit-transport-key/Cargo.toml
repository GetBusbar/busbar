# busbar-unit-transport-key — EMPTIED by fold F14, awaiting its deletion commit.
#
# Everything this crate held — the TLS secret→config provisioning — moved kernel-side (#36: "the TLS
# secret→config provisioning → kernel-side machinery"; #40(b): the tls transport receives only the
# contract's opaque config handle). No crate depends on this one. The directory stays only until the
# gate tables that still name it by name (the kind-isolation waiver and selftest plants, the
# `busbar-unit-*` construction scopes) are re-targeted in the same commit that deletes it.
[package]
name = "busbar-unit-transport-key"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "Emptied by fold F14: the transport-key provisioning moved kernel-side (#36)."
license = "Apache-2.0"

[lib]
name = "busbar_unit_transport_key"
path = "src/lib.rs"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
