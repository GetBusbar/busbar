# busbar-admin — the ADMIN API SERVICE (`/api/v1/admin/*`), extracted out of busbar-core into its own
# sibling crate (1.6.0).
#
# ONE-WAY DEPENDENCY (Cargo-enforced): this crate depends on busbar-core (to reach `App`/`AppHandle`,
# `CoreRouter`, the `governance`/`config`/`hooks`/`auth` engine internals the handlers call, and the
# `admin::v1::contract` frozen surface + the `admin::v1::json` envelope primitives that STAYED in
# core). busbar-core depends on NOTHING here — naming this crate from core would be a dependency
# cycle, which Cargo refuses outright. Core reaches this crate's router only through the small seam in
# `busbar_core::admin::seam` (`AdminMountSeam`), registered once by the composition root
# (`crates/busbar`), exactly the way `oauth_as::seam` mounts the authorization-server plane.
#
# MANDATORY, NON-OPTIONAL sibling crate — NOT a plugin. Always compiled into the shipped binary;
# runtime-optional only through the control/admin listener seam.
[package]
name = "busbar-core-admin"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar admin API service (`/api/v1/admin/*`). Depends one-way on busbar-core."
license = "Apache-2.0"

[lib]
name = "busbar_core_admin"
path = "src/lib.rs"

# THE LINKED TEST-SEAM LIST: the dev-dependency crates whose `testkit::TEST_SEAM` entry this crate's
# unit tests register and loop (build.rs emits the table; the sources name none of these crates).
[package.metadata.busbar]
test-linked = ["door:busbar-plane-llm", "busbar-mcp", "busbar-a2a"]
# A `door:` row is a plane crate served through its memory-ABI door only: build.rs emits its
# `plane_door::door` and the harness folds its registry row from its Statement, as the composition
# root does (`root::linked::door_rows`). The list is the install order (the planes' layering order).
# `test-linked-protocols` names the crates whose linked row installs protocol declarations on the
# protocol axis (`linked::PROTOCOLS`): the dialects a lane's `protocol:` resolves against.
test-linked-protocols = ["busbar-plane-llm"]
# THE TEST REGISTRY ROW for the operator credential: the auth plugin dev-dependency whose SDK boundary
# this crate's unit tests link onto the auth axis (build.rs emits it; the sources name no auth plugin),
# as the composition root links it into the shipped binary.
test-operator-auth = ["busbar-auth-admin-tokens-plugin"]

[dependencies]
busbar-kernel = { path = "../busbar-kernel", default-features = false }
# The kernel-verb store face + idempotency window the absorbed verb-execution unit binds against
# (DECISIONS #38/#40): `busbar_contract::verb_store::{Store, StoreError, IDEMPOTENCY_TTL_SECS}`.
busbar-contract = { path = "../busbar-contract" }
busbar-plugin-loader = { path = "../plugin-loader" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
tracing = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
schemars = { workspace = true, optional = true }

[features]
default = ["hooks-ranking", "plane-mcp", "plane-a2a"]
# The moved v1 service has a `#[cfg(feature = "hooks-ranking")]` site; declare the feature (forwarded
# to busbar-core) so the cfg is recognized, mirroring busbar-core's own default.
hooks-ranking = ["busbar-kernel/hooks-ranking"]
plane-mcp = ["busbar-kernel/plane-mcp"]
plane-a2a = ["busbar-kernel/plane-a2a"]
# Pulls busbar-core's `test-support` so a SIBLING crate can build an admin-configured `TestApp`, and
# so this crate's own dev-deps resolve the fixtures.
test-support = ["busbar-kernel/test-support"]
# The openapi-schema derive: the moved admin-view types derive `schemars::JsonSchema` under this
# feature, mirroring busbar-kernel/busbar-a2a. Forwards to busbar-kernel/openapi-schema so the shared
# schema surface resolves in lock-step. It ALSO forwards to the two dev-dependency planes'
# `openapi-schema` (a dev-dep feature only applies to test builds; it never links a plane into the
# library): the openapi tests assemble the document from the linked plane decls, and a plane built
# without its own feature contributes its paths but not its `openapi_schemas`, so the a2a/mcp trust
# verbs lose their typed bodies. The binary forwards the same four; without this, `cargo test -p
# busbar-core-admin --features openapi-schema` run alone generated a different document than CI's
# combined `-p busbar -p busbar-kernel -p busbar-core-admin` run, where feature unification hid it.
openapi-schema = ["dep:schemars", "busbar-kernel/openapi-schema", "busbar-mcp/openapi-schema", "busbar-a2a/openapi-schema"]

[dev-dependencies]
# Test-only (json body decode + public-key hex in the service tests); no production use.
hex = { workspace = true }
http-body-util = { workspace = true }
busbar-kernel = { path = "../busbar-kernel", default-features = false, features = ["test-support", "plane-mcp", "plane-a2a"] }
# The moved cross-plane drift test drives the MCP and A2A plane trust-verb error surfaces. Their
# testkits register the plane decls + the self-enveloping admin-verb backing (core's
# `CorePlaneAdminEnvelope`, which STAYED in busbar-core). NOTE: do NOT enable busbar-admin/test-support
# on these edges.
# THE FIRST TEST-LINKED PLANE, through its memory-ABI door only (a `door:` row of `test-linked`
# above, its protocol declarations `test-linked-protocols`): a pure plane crate (it names the contract
# alone), so no engine rides in.
busbar-plane-llm = { path = "../busbar-plane-llm" }
busbar-mcp = { path = "../busbar-mcp", features = ["test-support"] }
busbar-a2a = { path = "../busbar-a2a", features = ["test-support"] }
# THE OPERATOR CREDENTIAL'S TEST REGISTRY ROW (`test-operator-auth` above): the admin e2e tests
# authenticate through the auth plugin the composition root links for it, from its own repo, at the
# SAME pinned rev plugin-loader's both-ways proof drives. Dev-only: the library names no auth plugin.
busbar-auth-admin-tokens-plugin = { workspace = true }
# The export axis the named-map tests resolve `module: prometheus` against: the scrape sink LINKED
# into the test binary, as the composition root links it into the shipped one — from its own repo, at
# the SAME pinned rev the composition root links.
busbar-export-prometheus = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "test-util"] }
axum = { workspace = true, features = ["http1"] }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing-subscriber = { workspace = true }
