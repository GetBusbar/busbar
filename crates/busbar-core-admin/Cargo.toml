[package]
name = "busbar-core-admin"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar admin API service (`/api/v1/admin/*`). Depends one-way on busbar-core."
license = "Apache-2.0"

[lib]
name = "busbar_core_admin"
path = "src/lib.rs"

[dependencies]
busbar-kernel = { path = "../busbar-kernel", default-features = false }
busbar-contract = { path = "../busbar-contract" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
tracing = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
schemars = { workspace = true, optional = true }

[features]
default = []
test-support = ["busbar-kernel/test-support"]
openapi-schema = ["dep:schemars", "busbar-kernel/openapi-schema"]

[dev-dependencies]
http-body-util = { workspace = true }
busbar-kernel = { path = "../busbar-kernel", default-features = false, features = ["test-support"] }
busbar-kernel-egress = { path = "../busbar-kernel-egress" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "test-util"] }
axum = { workspace = true, features = ["http1"] }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing-subscriber = { workspace = true }
