# busbar-admin — the ADMIN API SERVICE (`/api/v1/admin/*`), extracted out of busbar-core into its own
# sibling crate (1.6.0).
#
# ONE-WAY DEPENDENCY (Cargo-enforced): this crate depends on busbar-core (to reach `App`/`AppHandle`,
# `CoreRouter`, the `governance`/`config`/`hooks`/`auth` engine internals the handlers call, and the
# `admin::v1::contract` frozen surface + the `admin::v1::json` envelope primitives that STAYED in
# core). busbar-core depends on NOTHING here — naming this crate from core would be a dependency
# cycle, which Cargo refuses outright. Core reaches this crate's router only through the small seam in
# `busbar_core::admin::seam` (`AdminMountSeam`), registered once by the composition root
# (`crates/busbar`), exactly the way `oauth_as::seam` mounts the authorization-server plane.
#
# MANDATORY, NON-OPTIONAL sibling crate — NOT a plugin. Always compiled into the shipped binary;
# runtime-optional only through the control/admin listener seam.
[package]
name = "busbar-core-admin"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar admin API service (`/api/v1/admin/*`). Depends one-way on busbar-core."
license = "Apache-2.0"

[lib]
name = "busbar_core_admin"
path = "src/lib.rs"

[dependencies]
busbar-kernel = { path = "../busbar-kernel", default-features = false }
# The kernel-verb store face + idempotency window the absorbed verb-execution unit binds against
# (DECISIONS #38/#40): `busbar_contract::verb_store::{Store, StoreError, IDEMPOTENCY_TTL_SECS}`.
busbar-contract = { path = "../busbar-contract" }
# The MONEY LOOKUP the usage read performs (DECISION #79): the dated rate-card history
# (`cost::History`/`HistoryView::card_at`), the card it resolves to, and the one micro-unit
# projection. Named directly rather than re-derived here, because the resolution rule and the
# multiply-and-sum live in exactly one crate — a second copy in this one is how a request comes to
# be judged at one figure and billed at another. The edge is one-way (the ledger names nothing
# here) and adds no cycle — the ledger's own closure is `busbar-contract` + `sha2` + `serde`.
#
# IT DOES NOT REOPEN #84. That decision took the ledger edge OFF `busbar-api` so a third-party
# plugin stops transitively linking the money one-book (`plugin -> busbar-plugin-sdk ->
# busbar-api`). This crate is not on that path: it is a mandatory, compiled-in core sibling and no
# plugin names it. The prohibition is on the PLUGIN closure carrying settlement semantics, and core
# is where the money view is supposed to live (#43: pricing is CORE functionality).
busbar-kernel-ledger = { path = "../busbar-kernel-ledger" }
busbar-plugin-loader = { path = "../plugin-loader" }
busbar-plugin-sign = { path = "../plugin-sign" }
busbar-api = { path = "../api" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
tracing = { workspace = true }
base64 = { workspace = true }
ring = { workspace = true }
hex = { workspace = true }
flate2 = { workspace = true }
url = { workspace = true }
schemars = { workspace = true, optional = true }

[features]
default = ["auth-admin-tokens", "hooks-ranking", "plane-mcp", "plane-a2a"]
# The moved v1 service has a `#[cfg(feature = "hooks-ranking")]` site; declare the feature (forwarded
# to busbar-core) so the cfg is recognized, mirroring busbar-core's own default.
hooks-ranking = ["busbar-kernel/hooks-ranking"]
# Forwards to busbar-core's own feature: the admin e2e tests authenticate through the `admin-tokens`
# module, and the drift-audit test module is gated on it. A `--no-default-features` build compiles
# the admin-token module OUT, disabling the admin API wholesale, exactly as it did in-core.
auth-admin-tokens = ["busbar-kernel/auth-admin-tokens"]
plane-mcp = ["busbar-kernel/plane-mcp"]
plane-a2a = ["busbar-kernel/plane-a2a"]
# Pulls busbar-core's `test-support` so a SIBLING crate can build an admin-configured `TestApp`, and
# so this crate's own dev-deps resolve the fixtures.
test-support = ["busbar-kernel/test-support"]
# The openapi-schema derive: the moved admin-view types derive `schemars::JsonSchema` under this
# feature, mirroring busbar-kernel/busbar-a2a. Forwards to busbar-kernel/openapi-schema so the shared
# schema surface resolves in lock-step.
openapi-schema = ["dep:schemars", "busbar-kernel/openapi-schema"]

[dev-dependencies]
busbar-kernel = { path = "../busbar-kernel", default-features = false, features = ["test-support", "auth-admin-tokens", "plane-mcp", "plane-a2a"] }
# The moved cross-plane drift test drives the MCP and A2A plane trust-verb error surfaces. Their
# testkits register the plane decls + the self-enveloping admin-verb backing (core's
# `CorePlaneAdminEnvelope`, which STAYED in busbar-core). NOTE: do NOT enable busbar-admin/test-support
# on these edges.
busbar-llm = { path = "../busbar-llm", features = ["test-support"] }
busbar-mcp = { path = "../busbar-mcp", features = ["test-support", "auth-admin-tokens"] }
busbar-a2a = { path = "../busbar-a2a", features = ["test-support", "auth-admin-tokens"] }
busbar-store-memory = { path = "../store-memory" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "test-util"] }
axum = { workspace = true, features = ["http1"] }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing-subscriber = { workspace = true }
