[package]
name = "busbar-kernel"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar engine library: protocol registry, planes, governance, trust, audit, store, config — everything the thin `busbar` binary and the protocol crates link against."
license = "Apache-2.0"

[lib]
name = "busbar_kernel"
path = "src/lib.rs"

[dependencies]
foldhash = { workspace = true }
# `schema`: the binder compiles each secret instance's D_REF_SCHEMA once (IF §12.7, plugin_config).
busbar-contract = { path = "../busbar-contract", features = ["schema"] }
busbar-kernel-egress = { path = "../busbar-kernel-egress" }
busbar-kernel-ledger = { path = "../busbar-kernel-ledger" }
busbar-kernel-wal = { path = "../busbar-kernel-wal" }
busbar-kernel-audit = { path = "../busbar-kernel-audit" }
busbar-kernel-breaker = { path = "../busbar-kernel-breaker" }
busbar-kernel-identity = { path = "../busbar-kernel-identity" }
# The MIN-3 plugin interface, core side: `Caller`, `BoxFut`, the Need types the §12 kernel contracts name
# (ABI-MIN3-INTERFACE §10, §12). A leaf crate.
busbar-plugin-abi = { path = "../busbar-plugin-abi", features = ["host"] }
# The port types custody, the credential cache and the verdict cache name (`CallCx`, `PortError`, `SecretPort`,
# `OutboundAnswer`, `Identity`, `Verdict`; IF §11.3, §12.2, §12.28). The loader never names the kernel.
busbar-plugin-loader = { path = "../plugin-loader" }
# Only under the non-default `timing` feature.
libc = { workspace = true, optional = true }
axum = { workspace = true }
tower = { workspace = true }
# No `net`: the kernel opens no socket; its external dev-only kit enables socket tests.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal", "io-util", "io-std", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
indexmap = { workspace = true }
schemars = { workspace = true, optional = true }
loom = { workspace = true, optional = true }
unicode-normalization = { workspace = true }
base64 = { workspace = true }
sonic-rs = { workspace = true }
futures = { workspace = true }
# TaskTracker counts the worker's detached tasks (detached.rs).
tokio-util = { workspace = true, features = ["rt"] }
bytes = { workspace = true }
smallvec = { workspace = true }
zeroize = { workspace = true }
http-body-util = { workspace = true }
metrics = { workspace = true }
metrics-util = { workspace = true, features = ["recency"] }
http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }
hex = { workspace = true }
async-trait = { workspace = true }
arc-swap = { workspace = true }
# PEM CAs at D_TRUST_PATH nodes (plugin_config/pem.rs).
rustls-pki-types = { workspace = true }

[features]
openapi-schema = ["dep:schemars"]
loom-model = ["dep:loom"]
# Never on in a normal build; dependents enable it from [dev-dependencies].
test-support = ["busbar-kernel-identity/test-support"]
# Default off: `timeit!` expands to `()`.
timing = ["dep:libc"]
# Never on in a normal build: custody's miss-path probe for C-SCRUB-HIT's publish-order arm (IF §14 round 19). Enabled
# only from a [dev-dependencies] table; the shipped binary's feature tree must not show it.
conformance = []

[dev-dependencies]
busbar-plugin-loader = { path = "../plugin-loader", features = ["test-support"] }
# The architecture checks (tests/architecture.rs, tests/arch/) parse sources with syn; they never build core.
proc-macro2 = { workspace = true }
syn = { workspace = true }
# Integration tests use ordinary production ABI test support, never kernel fixture exports.
# Dev-only: the test seal is absent from release builds.
# Dev-only: the single-path count probes (SINGLE-PATH §8) count only in test builds.
# Dev-only: the JSON facade's `SchemaCheck` and `Body` (busbar-contract tests/json_facade.rs); the
# engine's normal graph keeps no jsonschema.
busbar-contract = { path = "../busbar-contract", features = ["test-seal", "stage-probe", "visit-count", "schema", "axum"] }
tokio = { workspace = true, features = ["test-util", "net"] }
reqwest = { workspace = true, features = ["json"] }
axum = { workspace = true, features = ["http1"] }
http-body-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
# Member `test-support` features are enabled here, never in a release build.
busbar-kernel-audit = { path = "../busbar-kernel-audit", features = ["test-support"] }
busbar-kernel-ledger = { path = "../busbar-kernel-ledger", features = ["test-support"] }
busbar-kernel-egress = { path = "../busbar-kernel-egress", features = ["test-support"] }

[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
tikv-jemallocator = { workspace = true }
stats_alloc = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }

[lints]
workspace = true
