[package]
name = "busbar-kernel"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar engine library: protocol registry, planes, governance, trust, audit, store, config — everything the thin `busbar` binary and the protocol crates link against."
license = "Apache-2.0"

[lib]
name = "busbar_kernel"
path = "src/lib.rs"

[dependencies]
bumpalo = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
busbar-kernel-egress = { path = "../busbar-kernel-egress" }
busbar-kernel-ledger = { path = "../busbar-kernel-ledger" }
busbar-kernel-wal = { path = "../busbar-kernel-wal" }
busbar-kernel-audit = { path = "../busbar-kernel-audit" }
busbar-kernel-breaker = { path = "../busbar-kernel-breaker" }
busbar-kernel-identity = { path = "../busbar-kernel-identity" }
# Only under the non-default `timing` feature.
libc = { workspace = true, optional = true }
axum = { workspace = true }
tower = { workspace = true }
# No `net`: the kernel opens no socket; `test-support` adds it.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal", "io-util", "io-std", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
url = { workspace = true }
indexmap = { workspace = true }
schemars = { workspace = true, optional = true }
loom = { workspace = true, optional = true }
ring = { workspace = true }
base64 = { workspace = true }
sonic-rs = { workspace = true }
serde_yaml = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
zeroize = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
metrics = { workspace = true }
metrics-util = { workspace = true, features = ["recency"] }
http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
ed25519-dalek = { workspace = true }
crc32fast = { workspace = true }
async-trait = { workspace = true }
arc-swap = { workspace = true }
httpdate = { workspace = true }

[features]
default = ["plane-mcp", "plane-a2a"]
# Default-on; off compiles out `src/mcp`, and the `tools:`/`mcp:` config sections are refused if used.
plane-mcp = ["dispatch"]
# Default-on; off compiles out `src/a2a`, and the `agents:` config section is refused if used.
plane-a2a = ["relay"]
# Off by default so the shipped build carries no `axum/ws` edge.
duplex-ws  = ["runtime"]
dispatch = []
relay = []
runtime = ["axum/ws"]
openapi-schema = ["dep:schemars"]
loom-model = ["dep:loom"]
# Never on in a normal build; dependents enable it from [dev-dependencies].
test-support = ["tokio/net", "busbar-kernel-identity/stand-in"]
# Default off: `timeit!` expands to `()`.
timing = ["dep:libc"]

[dev-dependencies]
sha2 = { workspace = true }
# Self-edge so integration tests reach `test_support`, where `cfg(test)` is false.
busbar-kernel = { path = ".", default-features = false, features = ["test-support"] }
# Dev-only: the test seal is absent from release builds.
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }
metrics-exporter-prometheus = { workspace = true }
tokio = { workspace = true, features = ["test-util", "net"] }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
axum = { workspace = true, features = ["http1"] }
http-body-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
rcgen = { workspace = true, features = ["pem"] }
criterion = { workspace = true }
# Member `test-support` features are enabled here, never in a release build.
busbar-kernel-audit = { path = "../busbar-kernel-audit", features = ["test-support"] }

[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }

[[bench]]
name = "pool_upstream_creds"
harness = false

[[bench]]
name = "plane_host_vtable_perf"
harness = false

[[bench]]
name = "plane_host_vtable_alloc"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(txn_fence_red)'] }
