# workspace root while sibling members are mid-landing. Several in-flight crates currently carry the
# same table, which makes the repository root workspace unloadable; this lets `-p busbar-kernel`
# build, test, lint and document in isolation. The `members` line in the root manifest is already in
# place, so removing this table is the only step needed to fold the crate back in.
