# A 1.5.x-style config that names NO billing/limits knobs at all. Its resolved billing/limits
# surface is therefore ENTIRELY the hardcoded defaults — the case that pins the default
# `limits.default_max_tokens`, the default `reasoning_effort_budgets` ladder, a 0 per_request_fee,
# and an ABSENT rate_card (token pricing 0 for every model). If M3's eviction changed any default,
# this is the config that catches it with no operator input to hide behind.
listen: "0.0.0.0:8080"
providers:
  openai:
    api_key: { env: OPENAI_API_KEY }
models:
  gpt-4o:
    provider: openai
  gpt-4o-mini:
    provider: openai
