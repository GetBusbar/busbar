title = "Self-serve sign-in or refresh refused: the subject's key is on hold"
severity = "BenignRecurring"
summary = "A self-serve sign-in (POST /auth/token or the hosted login) or a Refresh was refused because the subject's key is on hold: an administrator disabled it, an administrator revoked it, it was issued through a different identity provider, or the subject itself is held by a principal transition. Nothing is written: the key is not re-enabled, no sibling key is minted, and its old tokens stay dead. The caller gets a 403 that names the reason, and the admin audit log records `self_serve.mint` as `rejected` on `key:<id>#<reason>` (or `subject:<subject>#on_hold`). This is a client-side state, so it is emitted at debug."
action = "Nothing, if the hold is intended. To let the user back in: for a disabled key, PATCH /api/v1/admin/keys/{id} with `enabled: true` (the same key comes back and its earlier tokens work again). For a revoked key, or a key issued through another provider, DELETE /api/v1/admin/keys/{id}: the next sign-in issues a new key with a new id, and every old token stays dead. A revoked key is never re-enabled."

[[diagnostic]]
name = "REVOKED_KEY_REENABLE_REFUSED"
code = 4044
class = "Auth"
slug = "revoked-key-reenable-refused"
title = "Admin request to re-enable a revoked key refused (revoked is terminal)"
severity = "BenignRecurring"
summary = "A PATCH /api/v1/admin/keys/{id} asked for `enabled: true` on a revoked key. Revoked is terminal: no admin request, sign-in or refresh ever re-enables a revoked key. The request is answered 409 `conflict` with this code, nothing is written, and the admin audit log records `key.patch` as `rejected`. This is a client-side request, so it is emitted at debug."
action = "Leave the key revoked. To give a self-serve user a working key again, DELETE the revoked key: their next sign-in issues a new key with a new id. For an admin-minted key, mint a new one."

[[diagnostic]]
name = "PLANE_BREAKER_TRIPPED"
code = 5038
class = "Proxy"
slug = "plane-breaker-tripped"
title = "Plane breaker tripped (upstream target failing; dispatches fast-fail)"
severity = "Actionable"
summary = "A plane target's circuit breaker transitioned Closed→Open because the upstream target is failing, so further dispatches fast-fail until the half-open probe recovers it. Names the specific target (every plane target shares one degenerate lane, so without this the operator would not learn WHICH server is down). Emitted once per logical trip, not per failure."
action = "Investigate the named plane target's health (the tool, agent, or server it fronts). Traffic to it fast-fails until the breaker's half-open probe finds it healthy again."

[[diagnostic]]
name = "PLANE_BREAKER_HARD_DOWN"
code = 5039
class = "Proxy"
slug = "plane-breaker-hard-down"
title = "Plane breaker tripped hard-down (definitive auth/billing failure; sticky cooldown)"
severity = "Actionable"
summary = "A plane target answered a DEFINITIVE failure (auth/billing), so busbar trips its breaker hard-down: dispatches fast-fail for a sticky cooldown rather than keep retrying a target that will keep rejecting. Emitted per hard-down disposition for the named target."
action = "Fix the named target's credentials or billing/quota with its provider — a hard-down is a definitive rejection, not a transient blip. It recovers via the half-open probe once the underlying auth/billing fault is resolved."

[[diagnostic]]
name = "LANE_HARD_DOWN_ALL_CELLS"
code = 5040
class = "Proxy"
slug = "lane-hard-down-all-cells"
title = "Lane hard-down across all cells (sticky cooldown; recovers via half-open probe)"
severity = "Actionable"
summary = "A lane was recorded hard-down across ALL its per-pool cells at once (the all-cells variant of BUSBAR-5026) — every pool's view of the lane is tripped Open with a sticky cooldown. The lane is RECOVERABLE via the half-open probe (it is not marked dead), so it re-admits once a probe succeeds."
action = "Investigate the named upstream/model lane's health — a hard-down across all cells means a definitive lane-wide fault. Traffic fails over automatically; the lane recovers via the half-open probe once the upstream is healthy."

[[diagnostic]]
name = "BREAKER_UNEXPECTED_STATE_CLASSIFY"
doc = "RETIRED before 1.6.0 shipped: the kernel's own breaker state machine that raised this code is deleted and the kernel runs on the one breaker, which logs nothing. The number is kept so a log line from a pre-release build still resolves to an entry that says what happened."
code = 5041
class = "Proxy"
slug = "breaker-unexpected-state-classify"
title = "Unexpected breaker state on classify (fail-safe: deny admission) — RETIRED"
severity = "Actionable"
summary = "RETIRED. The breaker classify path read a cell state that is not one of the three valid encodings (Closed/Open/HalfOpen). This is IMPOSSIBLE under the atomic-sentinel invariant, so reaching it means a real invariant break or memory corruption. busbar fails SAFE — treats the cell as never-elapsing Open so admission is denied — rather than panic the dispatching task. Warned once per process; recurrence logs at debug."
action = "Nothing emits this code. The one breaker keeps its cell state behind a lock and answers an unreachable encoding silently, with the same fail-safe result."
retired = true

[[diagnostic]]
name = "BREAKER_UNEXPECTED_STATE_PROBE"
doc = "RETIRED before 1.6.0 shipped: the kernel's own breaker state machine that raised this code is deleted and the kernel runs on the one breaker, which logs nothing. The number is kept so a log line from a pre-release build still resolves to an entry that says what happened."
code = 5042
class = "Proxy"
slug = "breaker-unexpected-state-probe"
title = "Unexpected breaker state on probe acquisition (fail-safe: refuse) — RETIRED"
severity = "Actionable"
summary = "RETIRED. The breaker probe-acquisition path read an unexpected cell state (not Closed/Open/HalfOpen). Impossible under the atomic-sentinel invariant; busbar refuses the probe acquisition (admits nobody) rather than panic the dispatching task. Same invariant-break family as BUSBAR-5041. Warned once per process; recurrence logs at debug."
action = "Nothing emits this code. The one breaker keeps its cell state behind a lock and answers an unreachable encoding silently, with the same fail-safe result."
retired = true

[[diagnostic]]
name = "BREAKER_UNEXPECTED_STATE_READ"
doc = "RETIRED before 1.6.0 shipped: the kernel's own breaker state machine that raised this code is deleted and the kernel runs on the one breaker, which logs nothing. The number is kept so a log line from a pre-release build still resolves to an entry that says what happened."
code = 5043
class = "Proxy"
slug = "breaker-unexpected-state-read"
title = "Unexpected breaker state on state read (reporting Closed) — RETIRED"
severity = "Actionable"
summary = "RETIRED. A breaker cell state read (a total, side-effect-free projection) found an unexpected encoding. Impossible under the atomic-sentinel invariant; busbar reports the benign Closed default rather than panic, keeping the read total for any encoding. Same family as BUSBAR-5041. Warned once per process; recurrence logs at debug."
action = "Nothing emits this code. The one breaker keeps its cell state behind a lock and answers an unreachable encoding silently, with the same fail-safe result."
retired = true

[[diagnostic]]
name = "BREAKER_UNEXPECTED_STATE_RECORD_FAILURE"
doc = "RETIRED before 1.6.0 shipped: the kernel's own breaker state machine that raised this code is deleted and the kernel runs on the one breaker, which logs nothing. The number is kept so a log line from a pre-release build still resolves to an entry that says what happened."
code = 5044
class = "Proxy"
slug = "breaker-unexpected-state-record-failure"
title = "Unexpected breaker state in record_failure (no-op) — RETIRED"
severity = "Actionable"
summary = "RETIRED. The breaker failure-recording path read an unexpected cell state (not Closed/Open/HalfOpen). Impossible under the atomic-sentinel invariant; busbar treats it as a no-op (like the already-Open case) rather than panic the task. Same family as BUSBAR-5041. Warned once per process; recurrence logs at debug."
action = "Nothing emits this code. The one breaker keeps its cell state behind a lock and answers an unreachable encoding silently, with the same fail-safe result."
retired = true

[[diagnostic]]
name = "PLUGINS_DIR_FINGERPRINT_FAILED"
code = 6004
class = "Plugins"
slug = "plugins-dir-fingerprint-failed"
title = "Cannot fingerprint the plugins dir (bypassing the catalog cache)"
severity = "BenignRecurring"
summary = "A real I/O error (not a missing directory) meant the plugins directory could not be fingerprinted, so its content-hash freshness signal cannot be trusted and busbar bypasses the catalog cache for this read, falling through to the real scan. Self-healing: it clears once the directory is readable. Warned once on entry to the failing state; recurrence logs at debug."
action = "Investigate the plugins directory's readability (permissions, a stale/hung mount). The catalog read still works via the direct scan; the cache re-engages once the directory fingerprints cleanly again."

[[diagnostic]]
name = "PLUGIN_CATALOG_SCAN_GATE_TIMEOUT"
code = 6005
class = "Plugins"
slug = "plugin-catalog-scan-gate-timeout"
title = "Plugin catalog scan gate not acquired within the wait bound (retryable 503)"
severity = "Actionable"
summary = "A plugin catalog scan could not acquire the scan gate within its bounded wait, which signals a PRIOR scan is not returning — typically a stale or hung plugins_dir mount. busbar answers with a retryable Unavailable (503) rather than hang this request behind the wedged scan."
action = "Investigate the plugins_dir mount — a hung scan usually means the directory's filesystem is stalled (e.g. an unresponsive network mount). Resolve the mount; the gate frees once the prior scan returns or is unwedged."

[[diagnostic]]
name = "PLUGIN_CATALOG_BLOCKING_TASK_FAILED"
code = 6006
class = "Plugins"
slug = "plugin-catalog-blocking-task-failed"
title = "Plugin catalog blocking task failed to join (fail-soft to the compiled-in row)"
severity = "Actionable"
summary = "The plugin catalog store scan ran on a `spawn_blocking` task that failed to join (cancelled or panicked). busbar fails SOFT to the always-true compiled-in catalog row rather than a 500 — this is just a plugin CATALOG read — the same posture it takes on an unparseable plugins_cfg. Rare."
action = "Investigate the logged context if it recurs — a blocking-task join failure on the catalog read is unusual. The catalog is served fail-soft in the meantime, so the admin read still returns."

[[diagnostic]]
name = "PLUGIN_ROLLBACK_PIN_PERSIST_FAILED"
code = 6007
class = "Plugins"
slug = "plugin-rollback-pin-persist-failed"
title = "Plugin rollback could not persist the version pin (nothing swapped, fail-closed)"
severity = "Actionable"
summary = "A plugin rollback tried to persist the lowered version pin to the config overlay and the write failed, so busbar FAILS CLOSED and swaps nothing — the running engine still serves the current plugin. Persisting the pin is the whole point of the rollback: a swallowed failure would swap the live engine while disk still carried the rolled-forward state, so a restart would silently re-upgrade."
action = "Investigate the config overlay's writability (the log names the plugin). Fix the overlay path/permissions and re-issue the rollback; nothing was changed, so it is safe to retry."

[[diagnostic]]
name = "PLUGIN_ROLLBACK_REVERT_FAILED"
code = 6008
class = "Plugins"
slug = "plugin-rollback-revert-failed"
title = "Plugin rollback rebuild failed AND reverting the version pin failed (disk out of sync)"
severity = "Actionable"
summary = "A plugin rollback's rebuild failed AFTER the lowered pin was persisted, and the compensating revert of that pin ALSO failed, so disk now carries the rolled-forward pin while the running engine still serves the prior plugin. A restart would honor the stale on-disk pin and contradict the running engine. Loud because disk and the live engine now disagree."
action = "Fix the config overlay so the version pin matches the plugin the running engine serves BEFORE restarting (the log names the plugin and both errors). Until then a restart would come up in a state the running engine rejected."

[[diagnostic]]
name = "CLI_METADATA_BLOCKLIST_CONFIG_UNREADABLE"
doc = "`--print-metadata-blocklist` could not read/parse config, so it printed the built-in denylist only."
code = 3014
class = "Config"
slug = "cli-metadata-blocklist-config-unreadable"
title = "--print-metadata-blocklist printed the built-in denylist only (config unreadable)"
severity = "Actionable"
summary = "`busbar --print-metadata-blocklist` could not parse or env-interpolate config.yaml, so it printed the HARDCODED cloud-metadata denylist ALONE and skipped the operator's `security.blocked_metadata_hosts` additions. The list shown is therefore INCOMPLETE — it omits whatever the config would have added — even though the running gateway (once it boots on a valid config) would enforce the full union."
action = "Run `busbar` (or `busbar --validate`) normally to see the precise parse/interpolation error, fix config.yaml, then re-run the flag to see the full effective denylist. The error itself is not echoed here because it could quote a config value."

[[diagnostic]]
name = "CLI_VALIDATE_CONFIG_INVALID"
doc = "`--validate` found config.yaml/providers.yaml invalid (load, resolve, semantic, or secret phase)."
code = 3015
class = "Config"
slug = "cli-validate-config-invalid"
title = "--validate rejected the config (load, resolve, semantic, or secret-resolution failure)"
severity = "Actionable"
summary = "`busbar --validate` ran the exact load → resolve → semantic-validate → strict-secret pipeline boot runs and the config did NOT pass at one of those phases, so it exits non-zero. Because `--validate` mirrors boot, this same config would fail to boot the gateway. The specific phase and offending entries are printed alongside this code."
action = "Fix the reported errors in config.yaml / providers.yaml (a parse/structure error, a cross-reference the resolver rejected, a semantic-validation failure, or an unset required secret) and re-run `--validate` until it reports `ok`."

[[diagnostic]]
name = "CLI_LIST_PLUGINS_CONFIG_UNREADABLE"
doc = "`--list-plugins` could not read config, so it inventoried using the default plugins block."
code = 3016
class = "Config"
slug = "cli-list-plugins-config-unreadable"
title = "--list-plugins fell back to the default plugins block (config unreadable)"
severity = "Actionable"
summary = "`busbar --list-plugins` could not read/parse config.yaml, so it inventoried the plugins directory using the DEFAULT `plugins:` block (default dir and trust policy) rather than the deployment's configured one. The inventory shown may not reflect the directory, trust policy, or store selection the running gateway would actually use."
action = "This is informational and best-effort pre-deployment. To inventory against the real config, fix config.yaml so it parses (run `busbar --validate` to see the error) and re-run `--list-plugins`."

[[diagnostic]]
name = "CONFIG_SETTINGS_OVERLAY_UNREADABLE"
doc = "GET /config/settings read the overlay while unreadable/corrupt and reported NO root overrides."
code = 3017
class = "Config"
slug = "config-settings-overlay-unreadable"
title = "Config-settings read found the overlay unreadable/corrupt (reported no root overrides)"
severity = "Actionable"
summary = "A `GET /config/settings` read found the persisted config overlay present but unreadable/corrupt, so it returned an EMPTY set of root overrides. Nothing is mutated, but the response cannot be distinguished from a genuine \"no overrides set\" — the operator's stored single-value overrides may exist on disk yet be absent from this answer."
action = "Fix or remove the corrupt overlay file to restore durable reads (see BUSBAR-3005 for the boot-time counterpart). Until then this endpoint under-reports the stored root settings."

[[diagnostic]]
name = "CONFIG_SETTINGS_OVERLAY_VERSION_TOO_NEW"
doc = "GET /config/settings read the overlay written by a NEWER busbar and reported NO root overrides."
code = 3018
class = "Config"
slug = "config-settings-overlay-version-too-new"
title = "Config-settings read found a newer-busbar overlay (reported no root overrides)"
severity = "Actionable"
summary = "A `GET /config/settings` read found the config overlay was written by a NEWER busbar than this binary, so — rather than misrepresent fields it cannot parse — it returned an EMPTY set of root overrides. The response cannot be distinguished from a genuine \"no overrides set\", so stored overrides may exist yet be absent from this answer."
action = "Read config settings from a busbar at least as new as the one that wrote the overlay, or roll the overlay back to a version this binary understands (see BUSBAR-3006 for the boot-time counterpart)."

[[diagnostic]]
name = "CONFIG_SETTINGS_READ_TASK_JOIN_FAILED"
doc = "The spawn_blocking task backing GET /config/settings panicked or the runtime is shutting down."
code = 3019
class = "Config"
slug = "config-settings-read-task-join-failed"
title = "Config-settings overlay read task failed to join (500 rather than a fabricated 200)"
severity = "Actionable"
summary = "The blocking task that reads the config overlay for `GET /config/settings` failed to join — it panicked, or the runtime is shutting down — so busbar returns 500 rather than a fabricated empty-settings 200 that would misreport \"no overrides set\" when the read never completed. A panic here is a bug."
action = "Retry the request; a shutdown-race clears on its own. A repeatable failure is a panic in the overlay read path — capture the logged join error and file a bug."

[[diagnostic]]
name = "METADATA_PROTECTION_DISABLED"
doc = "RETIRED in 1.6.0: `allow_all_metadata` is refused (BUSBAR-3136), so the cloud-metadata guard is never off."
code = 5045
class = "Proxy"
slug = "metadata-protection-disabled"
title = "Cloud-metadata SSRF protection DISABLED (allow_all_metadata is set) — RETIRED"
severity = "Actionable"
summary = "RETIRED. Nothing emits this code: 1.6.0 refuses `security.allow_all_metadata` at startup (BUSBAR-3136), and cloud metadata is refused for every outbound connection, so the guard can no longer be disabled."
action = "Nothing emits this code. See BUSBAR-3136."
since = "1.5.0"
retired = true

[[diagnostic]]
name = "CLI_VALIDATE_PLUGIN_PREFLIGHT_FAILED"
doc = "`--validate`'s plugin pre-flight (the exact pipeline boot runs) failed. Plugin-trust subject."
code = 6009
class = "Plugins"
slug = "cli-validate-plugin-preflight-failed"
title = "--validate plugin pre-flight failed (structure, trust, conflict, or store resolution)"
severity = "Actionable"
summary = "`busbar --validate` ran the same plugin pre-flight boot runs — consistency, trust-policy resolution, the three-phase scan of every tarball (structural → trust → conflict), and store resolution — and it FAILED. Because this is the boot pipeline (manifest-only, no dlopen), the same plugin set would fail the plugin half of boot."
action = "Fix the reported plugin problem: a malformed manifest, a signature/trust-policy rejection, an ABI-floor or version-floor violation, a name/alias conflict, or an unresolvable `store.module`. Re-run `--validate` until it reports `ok`."

[[diagnostic]]
name = "CLI_LIST_PLUGINS_TRUST_INVALID"
doc = "`--list-plugins` could not build a trust policy from `plugins.trust` — the config is invalid."
code = 6010
class = "Plugins"
slug = "cli-list-plugins-trust-invalid"
title = "--list-plugins could not build a trust policy (plugins.trust is invalid)"
severity = "Actionable"
summary = "`busbar --list-plugins` could not compile a trust policy from the `plugins.trust` block (e.g. an unparsable trust anchor or a malformed policy), so it cannot compute per-tarball signature verdicts and exits non-zero. The running gateway would reject this same `plugins.trust` at boot."
action = "Fix the `plugins.trust` block (the logged error names the problem), then re-run `--list-plugins` or `--validate`."

[[diagnostic]]
name = "PLUGIN_FIRSTPARTY_FLOOR_UNREADABLE"
doc = "The persisted first-party anti-downgrade floor could not be READ, so the node boots with none."
code = 6011
class = "Plugins"
slug = "plugin-firstparty-floor-unreadable"
title = "First-party anti-downgrade floor unreadable (booting with NO first-party floor)"
severity = "Actionable"
summary = "The persisted per-plugin-name high-water marks — the automatic first-party anti-downgrade floor — could not be read or were not valid, so busbar booted with NO first-party floor. Security-relevant: while the floor is absent, a validly-signed but OLD first-party artifact planted in the plugins directory would load without being refused as a downgrade. The floor re-establishes itself as plugins load successfully. busbar fails SOFT here on purpose: refusing the boot would let anyone able to corrupt one file take the node down."
action = "Check the data directory is readable and that `plugin-highwater.json` beneath it is intact (the log names the path and the exact problem). Deleting the file is safe — the floor rebuilds from the next successful load — but it does re-open the replay window until it does."

[[diagnostic]]
name = "PLUGIN_FIRSTPARTY_FLOOR_UNWRITABLE"
doc = "The first-party anti-downgrade floor could not be PERSISTED; it still applies to this process."
code = 6012
class = "Plugins"
slug = "plugin-firstparty-floor-unwritable"
title = "First-party anti-downgrade floor could not be persisted (it will not survive a restart)"
severity = "Actionable"
summary = "busbar raised the per-plugin-name high-water marks — the automatic first-party anti-downgrade floor — but could not write them to the data directory. The floor still applies to THIS process; it will not survive a restart, so the replay window reopens at the next boot until a load re-establishes it."
action = "Make the configured data directory writable (the log names the underlying I/O error). A node that cannot write its data directory usually has a larger problem than this notice."

[[diagnostic]]
name = "PLUGIN_TEXT_CUT"
doc = "Plugin-supplied text over its cap was cut. Fields and caps: a hook reject message (`reject_message`, 300), a metric `help` (`metric_help`, 200), `label` (`metric_label`, 64), `unit` (`metric_unit`, 16) or label value (`metric_label_value`, 64), and a plugin diagnostic message (`diag_message`, 300) or field value (`diag_field`, 64). The `plugin` field is the configured hook instance name for a reject or a hook status read, and the plugin module name for a metric or diagnostic a plugin reported. `busbar_plugin_text_cut_total{plugin,field}` counts over-cap values received in plugin and hook replies (counted at parse, including values in metrics later refused)."
code = 6013
class = "Plugins"
slug = "plugin-text-cut"
title = "Plugin-supplied text exceeded its cap and was cut"
severity = "Actionable"
summary = "A plugin or hook sent text longer than its documented cap: a hook reject message, a metric help, label, unit or label value, or a plugin diagnostic message or field. busbar kept the first `cap` sanitised characters exactly as 1.5.5 did, with nothing appended (for a reject whose kept text is all whitespace, clients see the default reject message instead). This warning fires once per plugin and field for the life of the process; `busbar_plugin_text_cut_total{plugin,field}` counts over-cap values received in plugin and hook replies (counted at parse, including values in metrics later refused)."
action = "Shorten the named plugin's text for the named field to within the cap; the log gives the cap and the text's length after sanitising (control and format characters removed)."

[[diagnostic]]
name = "GROUP_USAGE_READ_FAILED"
doc = "A group `/usage` read could not derive a bucket's usage from the governance store. Read-path fault."
code = 8018
class = "Governance"
slug = "group-usage-read-failed"
title = "Group usage read failed (could not derive a bucket's usage from the governance store)"
severity = "Actionable"
summary = "An admin group `/usage` read could not derive a bucket's usage from the governance store (a store read error while computing enforcement-matched spend), so the request returns 500 rather than a partial or understated usage view. No governance state is mutated; the read simply could not complete for the named group/bucket."
action = "Investigate the governance store's health for the logged group and bucket (reachability, the underlying store error). The condition is a read-path fault; usage reads recover once the store answers."

[[diagnostic]]
name = "BOOT_FATAL_ERROR"
doc = "A boot-time fatal error: the binary printed a one-line reason and exited non-zero (`die`)."
code = 9007
class = "Boot"
slug = "boot-fatal-error"
title = "Boot refused (fatal misconfiguration or startup error; process exits non-zero)"
severity = "Fatal"
summary = "The binary hit a fatal startup condition — a misconfiguration or other boot-time failure the process cannot serve past — so it printed a single-line reason to stderr and exited non-zero rather than a Rust panic backtrace. The specific reason is printed alongside this code. This is a deliberate refusal, not a crash."
action = "Read the printed reason, fix the underlying config/environment problem, and restart. `busbar --validate` reproduces most boot refusals without binding a listener."

[[diagnostic]]
name = "WORKER_THREADS_INVALID"
doc = "An explicitly-set worker-thread count (env or config) is not a positive integer; default used."
code = 9008
class = "Boot"
slug = "worker-threads-invalid"
title = "Configured worker-thread count is invalid (ignored; default used)"
severity = "Actionable"
summary = "An explicitly-set data-plane worker count — `TOKIO_WORKER_THREADS`/`advanced.worker_threads` — is not a positive integer (e.g. `0`, or non-numeric), so busbar IGNORES it and boots on the default worker count (one per core). The operator's intended worker count is NOT in effect. Emitted pre-tracing, to stderr, at boot."
action = "Set the data-plane worker count to a positive integer (at least 1) or remove it to accept the default. The gateway runs, but on the default worker count, not the value provided."

[[diagnostic]]
name = "SHUTDOWN_SIGNAL_HANDLER_INSTALL_FAILED"
doc = "A shutdown-signal handler could not be installed; that signal will not trigger graceful drain."
code = 9009
class = "Boot"
slug = "shutdown-signal-handler-install-failed"
title = "Shutdown-signal handler not installed (that signal won't trigger graceful drain)"
severity = "Actionable"
summary = "A graceful-shutdown signal handler (SIGINT/ctrl_c, SIGTERM on unix, or CTRL_CLOSE/CTRL_SHUTDOWN on Windows) failed to register. busbar fails soft — that one branch parks forever so the others still trigger the drain — but a stop delivered ONLY via the failed signal will kill the process without draining in-flight requests."
action = "Investigate the logged registration error (an unusual sandbox or signal-handling environment). Other shutdown signals still drain; if the affected signal is your deployment's stop path, restart in an environment where it can register."

[[diagnostic]]
name = "JEMALLOC_IDLE_PURGE_FALLBACK_UNAVAILABLE"
doc = "The jemalloc idle-purge fallback could not start; a fully idle process may hold freed RSS."
code = 9010
class = "Boot"
slug = "jemalloc-idle-purge-fallback-unavailable"
title = "jemalloc idle-purge fallback unavailable (idle RSS may not return to the OS)"
severity = "Actionable"
summary = "The fallback idle-purge helper (for targets where jemalloc's background purge threads are compiled out, e.g. static-musl or macOS) could not start — its worker thread failed to spawn, or it could not read `opt.dirty_decay_ms`. A fully IDLE process may therefore hold freed-but-unpurged dirty pages and its RSS can ratchet at the last burst's peak until traffic resumes. Request behavior is unaffected."
action = "Usually benign — RSS is reclaimed the moment traffic resumes, and under load the helper does nothing. If steady idle RSS on a musl/macOS build matters, investigate the logged spawn/mallctl error; the gateway serves normally regardless."

[[diagnostic]]
name = "SIGNING_KEY_GENERATION_FAILED"
doc = "`--generate-signing-key` could not obtain OS entropy to mint an ed25519 key."
code = 9011
class = "Boot"
slug = "signing-key-generation-failed"
title = "--generate-signing-key could not mint a key (OS entropy source unavailable)"
severity = "Actionable"
summary = "`busbar --generate-signing-key` could not mint a fresh ed25519 signing secret because the OS entropy source was unavailable, so it printed nothing and exited non-zero. No key was generated and nothing was written."
action = "Retry on a host with a working RNG (`/dev/urandom` / `getrandom`). A persistent failure points at a broken or blocked entropy source in the environment."

# ---- CLI errors (9101-9199) -------------------------------------------------------------------

[[diagnostic]]
name = "CLI_UNRECOGNIZED_ARGUMENT"
code = 9101
class = "Boot"
slug = "cli-unrecognized-argument"
title = "The command line names an argument busbar does not know"
severity = "Fatal"
summary = "busbar was started with an argument that is neither a flag it accepts nor the value of one. Nothing ran; the process exited with the usage status (2)."
action = "Check the spelling against `busbar --help`. Configuration is not passed on the command line: put settings in config.yaml and point busbar at it with `--config <path>`."
text = "unrecognized argument '{argument}'; try 'busbar --help'"
example = "busbar --valdiate"
example_detail = "unrecognized argument '--valdiate'; try 'busbar --help'"

[[diagnostic]]
name = "CLI_INVALID_ARGUMENTS"
code = 9102
class = "Boot"
slug = "cli-invalid-arguments"
title = "A command's arguments do not fit together"
severity = "Fatal"
summary = "A command-line command (an overlay migration or a principal transition) was given arguments it cannot act on: a missing companion flag, a conflicting pair, or a malformed value. The text after the code names which. Nothing ran; the process exited with the usage status (2)."
action = "Fix the arguments the message names; `busbar --help` lists every command with its flags."
text = "{reason}; try 'busbar --help'"
example = "busbar --migrate-overlay"
example_detail = "--migrate-overlay requires --overlay <path>; try 'busbar --help'"

[[diagnostic]]
name = "CLI_FLAG_REQUIRES_VALUE"
code = 9103
class = "Boot"
slug = "cli-flag-requires-value"
title = "A command-line flag is missing its value"
severity = "Fatal"
summary = "A flag that takes a value (such as `--config <path>` or `--providers <path>`) was the last argument, so it has nothing to read. Nothing ran; the process exited with the usage status (2)."
action = "Give the flag its value, for example `busbar --config /etc/busbar/config.yaml --validate`."
text = "{flag} requires a value; try 'busbar --help'"
example = "busbar --validate --config"
example_detail = "--config requires a value; try 'busbar --help'"

# ---- config migration (3401-3499) -------------------------------------------------------------

[[diagnostic]]
name = "MIGRATE_PATH_MISSING"
code = 3401
class = "Config"
slug = "migrate-path-missing"
title = "--migrate-config was given no file to migrate"
severity = "Fatal"
summary = "`busbar --migrate-config` converts one old config file and needs its path. None was given, so nothing was read or printed; the process exited with the usage status (2)."
action = "Name the file: `busbar --migrate-config old-config.yaml > config.yaml`."
text = "--migrate-config requires a path: busbar --migrate-config <old-config.yaml>"
example = "busbar --migrate-config"
example_detail = "--migrate-config requires a path: busbar --migrate-config <old-config.yaml>"

[[diagnostic]]
name = "MIGRATE_SOURCE_UNREADABLE"
code = 3402
class = "Config"
slug = "migrate-source-unreadable"
title = "--migrate-config could not read the file it was given"
severity = "Fatal"
summary = "The old config file named to `--migrate-config` could not be read: it does not exist, it is not readable by this user, or it is not UTF-8 text. The operating system's reason follows the path. Nothing was migrated."
action = "Check the path and its permissions, then run the migration again."
text = "cannot read '{path}': {error}"
example = "busbar --migrate-config /etc/busbar/old.yaml"
example_detail = "cannot read '/etc/busbar/old.yaml': No such file or directory (os error 2)"

[[diagnostic]]
name = "MIGRATE_LAUNCH_DIRECTORY"
code = 3403
class = "Config"
slug = "migrate-launch-directory"
title = "--migrate-config could not resolve its working directory"
severity = "Fatal"
summary = "The migration resolves relative paths (a providers file, a store path) against the directory busbar was launched from, as the old launcher did. The current directory could not be read (it was deleted or is not accessible), so nothing was migrated."
action = "Run the migration from an existing, readable directory, ideally the one the old deployment was launched from."
text = "cannot resolve migration launch directory: {error}"
example = "cd /tmp/gone && rmdir /tmp/gone && busbar --migrate-config old.yaml"
example_detail = "cannot resolve migration launch directory: No such file or directory (os error 2)"

[[diagnostic]]
name = "MIGRATE_FAILED"
code = 3404
class = "Config"
slug = "migrate-failed"
title = "--migrate-config refused the file"
severity = "Fatal"
summary = "The old config could not be converted mechanically: it is not valid YAML, it has a shape no busbar release accepted, or it carries a value the migration cannot carry forward without guessing. The reason follows the code. Nothing was printed to stdout, so no half-migrated config can be deployed by accident."
action = "Fix the reason the message names in the OLD file (or capture the setting by hand), then run the migration again. docs/migration-1-6.md lists every key the migration rewrites."
text = "--migrate-config failed: {reason}"
example = "busbar --migrate-config not-yaml.txt"
example_detail = "--migrate-config failed: config is not a YAML mapping"

[[diagnostic]]
name = "MIGRATE_REFRESH_TTL_MEANING_CHANGED"
code = 3405
class = "Config"
slug = "migrate-refresh-ttl-meaning-changed"
title = "Migration carried refresh_ttl over to verify_ttl, whose meaning differs"
severity = "Actionable"
summary = "1.5's `refresh_ttl` was a background sweep cadence (default 6h). Its replacement `verify_ttl` is the longest a cached tool listing may be served before a `tools/call` re-verifies the upstream live (default 5s). The migration carried your value over unchanged, which can leave a long drift-serving window on the request path."
action = "Review the migrated `verify_ttl`: a few seconds is the default, `0` is strict-live, and a large value is an explicit security downgrade."
text = "{entry}.refresh_ttl -> verify_ttl (value `{value}` carried over). The meaning CHANGED: `refresh_ttl` was a background sweep cadence (default 6h); `verify_ttl` is the MAX staleness before a `tools/call` re-verifies the upstream live (default 5s). Your value is now a drift-serving window on the request path — reconsider it: a few seconds is the new default, `0` is strict-live, and a large value is an explicit security downgrade"
example = "mcp_servers:\n  search:\n    refresh_ttl: 6h"
example_detail = "mcp_servers.search.refresh_ttl -> verify_ttl (value `6h` carried over). The meaning CHANGED: `refresh_ttl` was a background sweep cadence (default 6h); `verify_ttl` is the MAX staleness before a `tools/call` re-verifies the upstream live (default 5s). Your value is now a drift-serving window on the request path — reconsider it: a few seconds is the new default, `0` is strict-live, and a large value is an explicit security downgrade"

[[diagnostic]]
name = "MIGRATE_ADMIN_SCOPE_WIDENED"
code = 3406
class = "Config"
slug = "migrate-admin-scope-widened"
title = "Migration widened a retired delegated admin scope to full"
severity = "Actionable"
summary = "1.5.2 retired the delegated admin scopes. An auth chain entry or role binding that granted one is migrated to `full`, the nearest scope that keeps every call it allowed working, which may be broader than intended."
action = "Review the named entry and tighten it to `read-only` if `full` is too broad."
text = "{entry}: {old} -> full (the delegated {old} scope is retired in 1.5.2; tighten to read-only if full is too broad)"
example = "auth:\n  admin_auth:\n    - oidc: { max_admin_scope: keys }"
example_detail = "auth.admin_auth entry 'oidc' max_admin_scope: keys -> full (the delegated keys scope is retired in 1.5.2; tighten to read-only if full is too broad)"

[[diagnostic]]
name = "MIGRATE_EMPTY_ALLOWED_POOLS_FLIPPED"
code = 3407
class = "Config"
slug = "migrate-empty-allowed-pools-flipped"
title = "An empty allowed_pools list now means no pools"
severity = "Actionable"
summary = "Before 1.5.0 an empty `allowed_pools: []` on a role binding meant every pool; since 1.5.0 it means no pool. The migration keeps the list as written, so the role now reaches nothing."
action = "If the role should reach every pool, delete the `allowed_pools` line (omitted means all). If it should reach none, keep `[]`."
text = "auth.role_bindings.{module}.{role}.allowed_pools: [] - the MEANING of an empty list FLIPPED in 1.5.0: it used to mean ALL pools, it now means NO pools. If this role should reach every pool, DELETE the allowed_pools line (omitted = all); if it should reach none, keep []"
example = "auth:\n  role_bindings:\n    oidc:\n      engineers: { allowed_pools: [] }"
example_detail = "auth.role_bindings.oidc.engineers.allowed_pools: [] - the MEANING of an empty list FLIPPED in 1.5.0: it used to mean ALL pools, it now means NO pools. If this role should reach every pool, DELETE the allowed_pools line (omitted = all); if it should reach none, keep []"

[[diagnostic]]
name = "MIGRATE_UNGOVERNED_BINDING_ADDED"
code = 3408
class = "Config"
slug = "migrate-ungoverned-binding-added"
title = "Migration added a binding that keeps 1.5.5's ungoverned access"
severity = "Actionable"
summary = "1.5.5 admitted a principal its identity provider recognised even when no role binding granted it anything; 1.6.0 refuses such a principal (401). To keep a migrated deployment serving the same callers, the migration wrote an empty binding for them: every pool, no group, no budget."
action = "Tighten the named binding (allowed_pools, a group with limits) or remove it to refuse those principals."
text = "auth.role_bindings.{provider}.\"{role}\" was written by the migration to keep 1.5.5's access: {who} is admitted on every pool with no budget, as 1.5.5 admitted them. Tighten it (allowed_pools, a group with limits) or remove it to refuse them"
example = "auth:\n  auth_chain: [oidc]"
example_detail = "auth.role_bindings.oidc.\"*\" was written by the migration to keep 1.5.5's access: every principal it identifies is admitted on every pool with no budget, as 1.5.5 admitted them. Tighten it (allowed_pools, a group with limits) or remove it to refuse them"

[[diagnostic]]
name = "MIGRATE_WORKER_THREADS_IGNORED"
code = 3409
class = "Config"
slug = "migrate-worker-threads-ignored"
title = "BUSBAR_WORKER_THREADS was not a positive integer and was not captured"
severity = "Actionable"
summary = "The migration captures the old launcher's BUSBAR_WORKER_THREADS into `advanced.worker_threads`. Its value was not a positive integer, which the old launcher also ignored, so nothing was captured and the configured worker count (or TOKIO_WORKER_THREADS) still applies."
action = "Set `advanced.worker_threads` in the migrated config if you meant to pin the worker count, and remove BUSBAR_WORKER_THREADS from the launcher."
text = "BUSBAR_WORKER_THREADS is not a positive integer; ignored as in the old launcher; configured workers and the TOKIO_WORKER_THREADS fallback are preserved"
example = "BUSBAR_WORKER_THREADS=auto busbar --migrate-config old.yaml"
example_detail = "BUSBAR_WORKER_THREADS is not a positive integer; ignored as in the old launcher; configured workers and the TOKIO_WORKER_THREADS fallback are preserved"

# ---- config / boot refusals (3101-3399) ---------------------------------------------------------
# One code per refusal family: the subject (a model, a pool's failover block, a provider's
# credential, ...) and the kind of rule. The specific sentence (which key, which value, why) is the
# message's detail; the page explains the family and how to fix every member of it.
# 3101 CONFIG_RESERVED_NAME is contract-owned (busbar_contract::diagnostic), re-exported above.

[[diagnostic]]
name = "CONFIG_MODEL_INVALID"
code = 3102
class = "Config"
slug = "config-model-invalid"
title = "A model definition is invalid"
severity = "Fatal"
summary = "An entry under `models:` names a provider that is not defined, or sets a per-model value outside its range: `default_max_tokens`, `max_concurrent` or `max_requests` of 0, an `attempt_timeout_ms` of 0 or above the 30-year ceiling, an empty `upstream_model`, or a `context_max` that two pools declare differently. The message names the model and the field."
action = "Fix the named field under `models.<name>:`: point `provider:` at a provider defined in providers.yaml or `providers:`, use a positive value, or omit the field to take its default. Then run `busbar --validate`."
text = "{detail}"
example = "models:\n  gpt-4o:\n    provider: openia     # typo: no such provider"
example_detail = "model 'gpt-4o' references unknown provider 'openia'"

[[diagnostic]]
name = "CONFIG_NAME_RESERVED_ROUTE"
code = 3103
class = "Config"
slug = "config-name-reserved-route"
title = "A model, pool or provider is named after a reserved route prefix"
severity = "Fatal"
summary = "Models, pools and providers are reachable at `/<name>/...`. The names `admin` and the native-API root are routed to the operator admin surface before any model, pool or provider route, so an entry with one of those names could never be reached by a client and would bypass its own governance."
action = "Rename the model, pool or provider the message names, and update every reference to it."
text = "{detail}"
example = "pools:\n  admin:\n    members: [gpt-4o]"
example_detail = "pool name 'admin' is reserved: 'admin' is a built-in management prefix (the auth middleware routes /admin and /admin/* to the operator admin surface), so a pool reachable via that path is unreachable to clients and bypasses per-pool governance; rename it"

[[diagnostic]]
name = "CONFIG_NAME_CONFLICT"
code = 3104
class = "Config"
slug = "config-name-conflict"
title = "A pool shares its name with a provider or a model"
severity = "Fatal"
summary = "Pools, providers and models share one route namespace (`/<name>/...`), so a pool may not take the name of a provider or a model: one of the two would be unreachable."
action = "Rename the pool (or the provider or model) so every name is distinct, and update the references to it."
text = "{detail}"
example = "models:\n  fast: { provider: openai }\npools:\n  fast: { members: [fast] }"
example_detail = "pool name 'fast' conflicts with model name 'fast'; pools and models must have distinct names"

[[diagnostic]]
name = "CONFIG_POOL_MEMBERS_INVALID"
code = 3105
class = "Config"
slug = "config-pool-members-invalid"
title = "A pool's member list is invalid"
severity = "Fatal"
summary = "A pool has no members, a member's `weight` is 0, a member's `attempt_timeout_ms` is 0 or above the 30-year ceiling, or a member names a model that is not defined (or whose provider is not). A pool with no routable member answers every request with a misleading 503."
action = "Fix the member the message names under `pools.<pool>.members:`: name a model defined under `models:`, use a weight of at least 1 and a positive timeout, or remove the pool."
text = "{detail}"
example = "pools:\n  default:\n    members: [gpt-4o, claude-sonet]   # typo"
example_detail = "pool 'default' references unknown model 'claude-sonet'"

[[diagnostic]]
name = "CONFIG_POOL_FAILOVER_INVALID"
code = 3106
class = "Config"
slug = "config-pool-failover-invalid"
title = "A pool's failover block is invalid"
severity = "Fatal"
summary = "`failover.timeout_secs` is 0 (every request would 503 before its first attempt) or above 24 hours, or `failover.exclusions` names something that is not a member of the pool (so it benches nothing)."
action = "Set `failover.timeout_secs` between 1 and 86400 and list only the pool's own members under `failover.exclusions`."
text = "{detail}"
example = "pools:\n  default:\n    members: [gpt-4o]\n    failover: { timeout_secs: 0 }"
example_detail = "pool 'default' failover.timeout_secs must be >= 1; a 0 budget rejects the primary attempt before it runs (every request 503s)"

[[diagnostic]]
name = "CONFIG_POOL_ON_EXHAUSTED_INVALID"
code = 3107
class = "Config"
slug = "config-pool-on-exhausted-invalid"
title = "A pool's on_exhausted block is invalid"
severity = "Fatal"
summary = "`on_exhausted` names a fallback pool that does not exist or the pool itself, or its `queue.max_ms` is 0 or longer than the pool's whole failover budget. Such a setting never engages: the pool 503s exactly as if it had no fallback."
action = "Point `on_exhausted.fallback_pool` at a different, defined pool, and keep `queue.max_ms` above 0 and at or below the failover budget (or raise `failover.timeout_secs`)."
text = "{detail}"
example = "pools:\n  primary:\n    members: [gpt-4o]\n    on_exhausted: { fallback_pool: backup }   # no such pool"
example_detail = "pool 'primary' on_exhausted references unknown fallback pool 'backup'"

[[diagnostic]]
name = "CONFIG_POOL_AFFINITY_INVALID"
code = 3108
class = "Config"
slug = "config-pool-affinity-invalid"
title = "A pool's affinity header name is invalid"
severity = "Fatal"
summary = "`affinity.header_name` must be a valid, non-empty, ASCII HTTP field-name of at most 64 characters; anything else would silently disable session affinity."
action = "Set `affinity.header_name` to a plain header name such as `x-session-id`, or remove the affinity block."
text = "{detail}"
example = "pools:\n  chat:\n    members: [gpt-4o]\n    affinity: { mode: header, header_name: \"\" }"
example_detail = "pool 'chat' affinity.header_name must not be empty (an empty HTTP header field-name silently disables session affinity)"

[[diagnostic]]
name = "CONFIG_POOL_FALLBACK_CYCLE"
code = 3109
class = "Config"
slug = "config-pool-fallback-cycle"
title = "Pools' on_exhausted fallbacks form a cycle"
severity = "Fatal"
summary = "Following `on_exhausted.fallback_pool` from pool to pool leads back to a pool already visited. The runtime loop guard would cut the ring on re-entry, so every pool in it 503s instead of degrading."
action = "Break the cycle the message prints: point one pool at a pool outside the ring, or remove its `on_exhausted`."
text = "{detail}"
example = "pools:\n  a: { members: [m1], on_exhausted: { fallback_pool: b } }\n  b: { members: [m2], on_exhausted: { fallback_pool: a } }"
example_detail = "fallback_pool cycle detected: a -> b -> a; on_exhausted fallback chains must not loop — the runtime loop guard terminates a cycle on re-entry, so every pool in the ring 503s instead of degrading. Break the cycle (point one pool at a non-looping pool or remove its on_exhausted)"

[[diagnostic]]
name = "CONFIG_POOL_BREAKER_INVALID"
code = 3110
class = "Config"
slug = "config-pool-breaker-invalid"
title = "A pool's circuit-breaker settings are invalid"
severity = "Fatal"
summary = "A `breaker:` value is out of range: a cooldown of 0 (which re-admits a tripped backend at once), `max_cooldown_secs` below `base_cooldown_secs`, a trip `min_requests`, `window_secs` or `consecutive_n` of 0, or an error-rate `threshold` outside (0.0, 1.0]."
action = "Fix the field the message names under `pools.<pool>.breaker:`; docs/circuit-breaker.md gives every default."
text = "{detail}"
example = "pools:\n  default:\n    members: [gpt-4o]\n    breaker: { base_cooldown_secs: 0 }"
example_detail = "pool 'default' breaker base_cooldown_secs must be >= 1 (got 0); a zero cooldown re-admits a tripped backend immediately, defeating the breaker's back-off"

[[diagnostic]]
name = "CONFIG_POOL_HOOKS_INVALID"
code = 3111
class = "Config"
slug = "config-pool-hooks-invalid"
title = "A pool's hook list is invalid"
severity = "Fatal"
summary = "A pool's `hooks:` list names a hook that is not defined under top-level `hooks:`, names a tap (only a gate can influence routing), or names a built-in ranking strategy this binary was built without."
action = "Define the hook under top-level `hooks:`, use a gate, or name a strategy this build carries (`busbar --help` lists the build's features)."
text = "{detail}"
example = "pools:\n  default:\n    members: [gpt-4o]\n    hooks: [pii-scrub]   # not defined under hooks:"
example_detail = "pool 'default' references unknown hook 'pii-scrub'; define it under top-level `hooks:`"

[[diagnostic]]
name = "CONFIG_HOOK_INVALID"
code = 3112
class = "Config"
slug = "config-hook-invalid"
title = "A hook definition is invalid"
severity = "Fatal"
summary = "An entry under top-level `hooks:` (or `global_hooks:`) cannot work as written: it names no plugin, a tap asks to rewrite or to be the default ordering, it takes a reserved name, more than one hook is the default, its timeout is out of range, or its `on_error` chain names an unknown fallback, a tap, an absent ranking strategy or loops."
action = "Fix the hook the message names: set `module:` to a `kind: hook` plugin, use `kind: gate` where it must decide, rename it off reserved words, and end every `on_error` chain on nothing, weighted, reject, first or a ranking strategy."
text = "{detail}"
example = "hooks:\n  audit-tap:\n    module: audit\n    kind: tap\n    prompt: rw"
example_detail = "hook 'audit-tap' is a tap with `prompt: rw`, but only a gate can rewrite (a tap never replies). Use `kind: gate`, or lower to `prompt: ro`"

[[diagnostic]]
name = "CONFIG_AUTH_POLICY_INVALID"
code = 3113
class = "Config"
slug = "config-auth-policy-invalid"
title = "An auth policy or key lifetime setting is invalid"
severity = "Fatal"
summary = "A setting under `auth:` that governs minted keys cannot hold: a duration that does not parse, a default TTL above the maximum, a per-role mint ceiling wider than the deployment-wide policy, a delegated admin scope that does not parse, or a browser-login method without a `public_url:` to build its redirect URLs."
action = "Fix the named setting: durations are written like `30d` or `12h`, per-role ceilings must stay within `auth.policy`, and a browser login needs top-level `public_url: https://<busbar-host>`."
text = "{detail}"
example = "auth:\n  policy: { default_ttl: 90d, max_ttl: 30d }"
example_detail = "auth.policy.default_ttl ('90d', 7776000s) exceeds auth.policy.max_ttl ('30d', 2592000s); the default a mint falls back to cannot be longer than the ceiling"

[[diagnostic]]
name = "CONFIG_ROLE_BINDING_INVALID"
code = 3114
class = "Config"
slug = "config-role-binding-invalid"
title = "A role binding is invalid"
severity = "Fatal"
summary = "An entry under `auth.role_bindings` names a module that is in neither auth chain, a role that shadows the reserved operator principal, an unknown admin scope or admin verb, a grant kind no installed plane declares, or a group that does not exist. A binding like that grants nothing, or grants something other than what it says."
action = "Fix the binding the message names; the message prints the exact YAML to add where a module or group is missing."
text = "{detail}"
example = "auth:\n  role_bindings:\n    oidc:\n      engineers: { group: eng }   # no group `eng`"
example_detail = "role_bindings.oidc.engineers names group 'eng', which does not exist.\nPaste this under groups and set its limits:\n\n  eng:\n    limits:\n      - { requests: 0, per: minute }\n"

[[diagnostic]]
name = "CONFIG_AUTH_CHAIN_INVALID"
code = 3115
class = "Config"
slug = "config-auth-chain-invalid"
title = "The auth chain cannot authenticate as configured"
severity = "Fatal"
summary = "The data-plane or admin auth chain is incomplete: it names a module that was removed, it verifies busbar-signed keys without an `auth.signing_key` or without any way to mint one, an operator token sits on a module that is not the operator provider, or the operator token has no answer. Busbar refuses rather than start with an auth surface that admits the wrong callers or none."
action = "Follow the message: generate a signing key with `busbar --generate-signing-key` and reference it from `auth.signing_key`, name `keys` or an IdP plugin in `auth.chain`, and keep the operator token on the operator provider."
text = "{detail}"
example = "auth:\n  chain: [keys]          # no signing_key"
example_detail = "auth.signing_key is required for signed-token auth (auth.chain names the built-in `keys` verifier), but none is set - and busbar no longer auto-generates one. Generate a key with `busbar --generate-signing-key`, then set auth.signing_key to a secret reference for it ({file: /path} or {env: VAR} - a SHARED secret across nodes for a fleet)"

[[diagnostic]]
name = "CONFIG_PLANE_OPEN_TO_ANONYMOUS"
code = 3116
class = "Config"
slug = "config-plane-open-to-anonymous"
title = "A plane is configured while the data-plane auth chain is empty"
severity = "Fatal"
summary = "A plane section (tools, agents and the like) is configured but `auth.chain` is empty, so the plane would serve anonymous callers with wildcard grants over every registered subject, and outbound credentials would have no inbound grant to bind to."
action = "Close the data-plane chain (`auth: { chain: [keys] }` or an IdP auth plugin), or remove the plane block if this deployment does not serve it."
text = "{detail}"
example = "tools:\n  search: { url: https://mcp.example.com }\n# no auth.chain"
example_detail = "`tools:` is configured but auth.chain is empty, which serves the MCP endpoint to ANONYMOUS callers — and a request that carries no key is never narrowed by one, so it runs with WILDCARD grants over every registered subject on that plane. It also leaves `upstream::authorise` with no inbound grant to bind busbar's outbound credentials to. Close the data-plane chain (`auth: { chain: [keys] }`, or an IdP auth plugin), or remove the `tools:` block if this deployment is not a MCP endpoint"

[[diagnostic]]
name = "CONFIG_SETTING_OUT_OF_RANGE"
code = 3117
class = "Config"
slug = "config-setting-out-of-range"
title = "A global limit or timing setting is out of range"
severity = "Fatal"
summary = "A value under `limits:`, `health:`, `routing:` or `advanced:` is outside what busbar can run with: a timeout or interval of 0 (which fails or disables the thing it bounds), a size below its floor or above its ceiling, a duration above the 30-year ceiling the runtime's clock arithmetic can hold, or reasoning-effort budgets that are zero or not ascending."
action = "Set the named key within the range the message states, or omit it to take the default; docs/configuration.md lists every default."
text = "{detail}"
example = "limits:\n  upstream_request_timeout_secs: 0"
example_detail = "limits.upstream_request_timeout_secs must be >= 1 (0 would time out every upstream call instantly)"

[[diagnostic]]
name = "CONFIG_RATE_CARD_INVALID"
code = 3118
class = "Config"
slug = "config-rate-card-invalid"
title = "A rate card or fee is invalid"
severity = "Fatal"
summary = "A rate card or fee cannot be priced as written: a rate that is negative, not finite or implausibly large, a unit or class the plane does not declare or count, a reserved class priced by name, a card entry for a model that is not defined, or a negative per-request fee."
action = "Fix the named entry: price only the units and classes the plane declares, keep rates finite and non-negative, and name only defined models."
text = "{detail}"
example = "rate_card:\n  gpt-5: { input_utok: 1.25 }   # no model gpt-5"
example_detail = "rate_card names model 'gpt-5', which is not defined under models:"

[[diagnostic]]
name = "CONFIG_GROUP_INVALID"
code = 3119
class = "Config"
slug = "config-group-invalid"
title = "A group's limits are invalid"
severity = "Fatal"
summary = "A group under `groups:` sets a limit of 0, which rejects every request through the group instead of bounding it."
action = "Use a positive limit, or remove the limit to leave that dimension unbounded."
text = "{detail}"
example = "groups:\n  eng:\n    limits:\n      - { requests: 0, per: minute }"
example_detail = "groups.eng has a `requests` limit of 0, which rejects every request through the group from the first admission; set a positive amount, or set `enabled: false` to freeze the group explicitly"

[[diagnostic]]
name = "CONFIG_STORE_INVALID"
code = 3120
class = "Config"
slug = "config-store-invalid"
title = "The store block is missing or names no module"
severity = "Fatal"
summary = "Busbar keeps keys, budgets, audit and configuration overlays in the store named by top-level `store:`. The block is missing or its `module:` is empty."
action = "Add `store: { module: <store plugin> }` (for example `sqlite` with a `db_path` setting)."
text = "{detail}"
example = "store:\n  module: \"\""
example_detail = "store.module must be non-empty; name the configured Store plugin"

[[diagnostic]]
name = "CONFIG_SECRET_REFERENCE_INVALID"
code = 3121
class = "Config"
slug = "config-secret-reference-invalid"
title = "A secret reference or secret module setting is invalid"
severity = "Fatal"
summary = "A secret is referenced in a way busbar cannot resolve safely: `none` where a credential is required, a reference form the setting does not accept, or module-level settings on a built-in secret module that takes none."
action = "Reference the secret as `{ env: VAR }`, `{ file: /path }` or `{ module: <secret-module>, settings: {...} }`, as the message shows for the setting it names."
text = "{detail}"
example = "secrets:\n  env: { prefix: BUSBAR_ }"
example_detail = "secrets.env: the built-in 'env' secret module takes no module-level settings"

[[diagnostic]]
name = "CONFIG_METADATA_HOST_ENTRY_INVALID"
code = 3122
class = "Config"
slug = "config-metadata-host-entry-invalid"
title = "A metadata host list entry can never match"
severity = "Fatal"
summary = "`security.blocked_metadata_hosts` and `security.allow_metadata_hosts` are matched by exact IP or hostname. An entry with a CIDR (`/`) or one that maps to no host would silently never match, leaving the protection it was meant to add (or remove) a no-op."
action = "List exact IPs or hostnames, for example `169.254.169.254`, not `169.254.0.0/16`."
text = "{detail}"
example = "security:\n  blocked_metadata_hosts: [169.254.0.0/16]"
example_detail = "security.blocked_metadata_hosts entry '169.254.0.0/16' contains '/' (CIDR is not supported here): these lists are matched by EXACT IP or hostname, so a CIDR/slash entry silently never matches and is a no-op. List exact IPs/hostnames instead (e.g. '169.254.169.254', not '169.254.0.0/16')"

[[diagnostic]]
name = "CONFIG_PROVIDER_INVALID"
code = 3123
class = "Config"
slug = "config-provider-invalid"
title = "A provider definition is invalid"
severity = "Fatal"
summary = "A provider's settings cannot work: a health interval or timeout of 0 or above its ceiling, an `error_map` class that does not exist, a `path` or `path_base` that does not begin with `/`, or an option the provider's protocol does not take."
action = "Fix the field the message names under `providers.<name>:`; docs/providers.md documents every provider field."
text = "{detail}"
example = "providers:\n  openai:\n    base_url: https://api.openai.com\n    path: v1/chat/completions"
example_detail = "provider 'openai' path 'v1/chat/completions' must begin with '/': a path override is appended to base_url verbatim, so a path that does not start with '/' fuses into the host (e.g. base_url + 'v1/chat/completions') and can redirect signed traffic to an attacker-controlled host"

[[diagnostic]]
name = "CONFIG_PROVIDER_DESTINATION_BLOCKED"
code = 3124
class = "Config"
slug = "config-provider-destination-blocked"
title = "A provider URL targets a blocked cloud-metadata host"
severity = "Fatal"
summary = "A provider's `base_url`, `base_url` + `path`, `base_url` + `path_base` or `token_url` resolves to a cloud-metadata (IMDS) endpoint on `security.blocked_metadata_hosts`. Busbar would send credentials there, so it refuses the configuration."
action = "Point the provider at its real API host. If the host is deliberately reachable, list it under `security.allow_metadata_hosts`."
text = "{detail}"
example = "providers:\n  internal:\n    base_url: http://169.254.169.254"
example_detail = "provider 'internal' base_url 'http://169.254.169.254' targets a blocked cloud-metadata host '169.254.169.254' (cloud-metadata/IMDS endpoints are denied; ...)"

[[diagnostic]]
name = "CONFIG_PROVIDER_CREDENTIAL_INVALID"
code = 3125
class = "Config"
slug = "config-provider-credential-invalid"
title = "A provider's credential cannot be used as configured"
severity = "Fatal"
summary = "A provider's outbound credential is invalid for its auth style: the referenced secret does not parse (a service-account key, a signing key), required auth settings are missing, or the settings contradict the style. The message names the provider, the style and the secret's source, never its value."
action = "Fix the secret the message points at (its `env:`, `file:` or module source) or the provider's auth settings, then run `busbar --validate`."
text = "{detail}"
example = "providers:\n  vertex:\n    auth: jwt-bearer\n    api_key: { env: VERTEX_SA }   # not a service-account JSON"
example_detail = "provider 'vertex' jwt-bearer credential (from env:VERTEX_SA) is invalid: service-account key is not JSON"

[[diagnostic]]
name = "CONFIG_PROVIDER_PROTOCOL_UNKNOWN"
code = 3126
class = "Config"
slug = "config-provider-protocol-unknown"
title = "A provider names a protocol this build does not speak"
severity = "Fatal"
summary = "A provider's `protocol:` is not one this binary carries: it is misspelled, or the build has no plane that speaks it."
action = "Use one of the protocols the message lists, or run a build that carries the plane for it."
text = "{detail}"
example = "providers:\n  claude:\n    protocol: antropic"
example_detail = "provider 'claude' has unknown protocol 'antropic': must be one of: anthropic, bedrock, cohere, gemini, openai, responses"

[[diagnostic]]
name = "CONFIG_PLANE_POOL_INVALID"
code = 3127
class = "Config"
slug = "config-plane-pool-invalid"
title = "A plane section's failover pool is invalid"
severity = "Fatal"
summary = "A failover pool inside a plane section (`tools.pools`, `agents.pools`, ...) cannot fail over as written: it has fewer than two members or more than the breaker's lane table holds, it shares its name with a registration, it names a member twice, a member belongs to another plane or is not defined, a member sits in two pools, or a `repeatable:` entry is empty."
action = "Fix the pool the message names: list two or more distinct members defined in the same plane section, give the pool its own name, and keep each registration in at most one pool."
text = "{detail}"
example = "tools:\n  pools:\n    search: { members: [brave] }"
example_detail = "tools.search: a failover pool needs at least TWO members (it has 1). A pool with one member has nowhere to fail over to, so it changes nothing; remove it or add the second registration"

[[diagnostic]]
name = "CONFIG_PROVIDER_REFERENCE_UNKNOWN"
code = 3128
class = "Config"
slug = "config-provider-reference-unknown"
title = "A reference names a provider that is not defined or speaks the wrong protocol"
severity = "Fatal"
summary = "config.yaml (or a plane section) names a provider that providers.yaml and `providers:` do not define, or one whose protocol the referencing plane does not speak."
action = "Define the provider, fix the spelling, or point the reference at a provider of the right protocol; the message lists the valid choices."
text = "{detail}"
example = "models:\n  gpt-4o: { provider: openai-eu }   # not in providers.yaml"
example_detail = "provider 'openai-eu' referenced in config.yaml not found in providers.yaml"

[[diagnostic]]
name = "CONFIG_SECTION_INVALID"
code = 3129
class = "Config"
slug = "config-section-invalid"
title = "A configuration section is not valid for this build"
severity = "Fatal"
summary = "A top-level section does not parse into its shape, its registry fails its own checks, or it configures a plane (such as `oauth_as:`) whose implementation this binary does not link. The message names the section and the reason."
action = "Fix the section as the message describes, or remove a section this build does not carry."
text = "{detail}"
example = "oauth_as:\n  issuer: https://busbar.example.com"
example_detail = "oauth_as: configured, but the authorization-server plane (busbar-core-oauth2) is not linked into this binary"

[[diagnostic]]
name = "CONFIG_ADMIN_LISTENER_EXPOSED"
code = 3130
class = "Config"
slug = "config-admin-listener-exposed"
title = "The admin listener is network-exposed without mTLS"
severity = "Fatal"
summary = "`admin_listen` binds a non-loopback address but `admin_tls.client_ca` is unset, so the admin plane would accept connections from the network without client certificates."
action = "Set `admin_tls.client_ca` to require client certificates, or bind `admin_listen` to a loopback address."
text = "{detail}"
example = "admin_listen: 0.0.0.0:9090"
example_detail = "admin_listen '0.0.0.0:9090' is network-exposed but the admin plane has no mTLS (admin_tls.client_ca is unset). Require client certificates by supplying admin_tls.client_ca, bind admin_listen to loopback, or set admin_require_mtls: false to deliberately run a token-only admin plane (e.g. behind a mesh)"

[[diagnostic]]
name = "CONFIG_EXPORT_INVALID"
code = 3131
class = "Config"
slug = "config-export-invalid"
title = "An export sink definition is invalid"
severity = "Fatal"
summary = "An entry under `export:` cannot deliver what it promises: an unknown module, settings the module refuses, a stream or field that does not exist, has no producer or that the module cannot carry, a duplicate, an empty list, a pinned field left out, or `durable: true` that this release does not implement."
action = "Fix the sink the message names; the message lists the valid streams and fields. docs/export.md documents every stream."
text = "{detail}"
example = "export:\n  siem:\n    module: otlp\n    streams: [audit]"
example_detail = "export.siem.streams: `audit` is NOT a stream — it was a use case, not a data type"

[[diagnostic]]
name = "CONFIG_DESTINATION_REFUSED"
code = 3132
class = "Config"
slug = "config-destination-refused"
title = "An outbound destination is refused by the egress policy"
severity = "Fatal"
summary = "A configured outbound URL (an upstream, a token endpoint, a sink) is not one busbar will send to: it is malformed, uses plaintext for a public host, or targets a blocked cloud-metadata host."
action = "Use an `https://` URL for a public host, fix the URL the message names, or list a deliberately reachable metadata host under `security.allow_metadata_hosts`."
text = "{detail}"
example = "providers:\n  remote: { base_url: http://api.example.com }"
example_detail = "provider 'remote' base_url must use a secure connection for a public host; plaintext is permitted only for a private/loopback local-model upstream"

# ---- admin API error responses (8101-8199): the `diag` field of the `error` object --------------

[[diagnostic]]
name = "ADMIN_NOT_FOUND"
doc = "The admin API error envelope's `diag` for `error.code = not_found`."
code = 8101
class = "Governance"
slug = "admin-not-found"
title = "The admin resource named in the request does not exist"
severity = "Actionable"
summary = "The path names a resource (a key, a group, a hook, an exporter, a plugin) that this deployment does not have, or one that cannot exist in its current mode (a key read with governance disabled). The response's `message` names the missing thing."
action = "List the collection (for example `GET /api/v1/admin/keys`) to find the right name or id, or create the resource first."

[[diagnostic]]
name = "ADMIN_UNAUTHORIZED"
doc = "The admin API error envelope's `diag` for `error.code = unauthorized`."
code = 8102
class = "Governance"
slug = "admin-unauthorized"
title = "The admin request carries no valid admin credential"
severity = "Actionable"
summary = "The request reached `/api/v1/admin` without a credential the `admin_auth:` chain accepts: no `Authorization: Bearer` or `x-admin-token` header, an unknown or expired token, or a key that is not an admin credential (`invalid_api_key`)."
action = "Send the operator admin token (or a credential your admin auth plugin accepts) in `Authorization: Bearer <token>` or `x-admin-token`. docs/admin-api.md covers the auth chain."

[[diagnostic]]
name = "ADMIN_METHOD_NOT_ALLOWED"
doc = "The admin API error envelope's `diag` for `error.code = method_not_allowed`."
code = 8103
class = "Governance"
slug = "admin-method-not-allowed"
title = "The admin path does not take this HTTP method"
severity = "Actionable"
summary = "The path exists on the admin surface, but not with the method the request used (for example a `DELETE` on a read-only collection)."
action = "Use a method the path documents; the OpenAPI document at /docs/api/ lists every path and method."

[[diagnostic]]
name = "ADMIN_FORBIDDEN"
doc = "The admin API error envelope's `diag` for `error.code = forbidden`."
code = 8104
class = "Governance"
slug = "admin-forbidden"
title = "The admin credential's scope does not cover this call"
severity = "Actionable"
summary = "The caller authenticated, but its admin scope (read-only, or a role binding's verb list) does not include this operation. The message names the scope that would have sufficed."
action = "Call with a credential whose scope covers the operation, or widen the role binding's `admin_scope` or `verbs`."

[[diagnostic]]
name = "ADMIN_INVALID_REQUEST"
doc = "The admin API error envelope's `diag` for `error.code = invalid_request`."
code = 8105
class = "Governance"
slug = "admin-invalid-request"
title = "The admin request is malformed or fails validation"
severity = "Actionable"
summary = "The request body or its parameters are not what the operation takes: a malformed JSON body, an unknown or missing field, a value out of range, or a configuration change that fails the same validation `busbar --validate` runs. The message says which."
action = "Fix the request as the message describes; the OpenAPI document at /docs/api/ gives each operation's schema."

[[diagnostic]]
name = "ADMIN_VERSION_CONFLICT"
doc = "The admin API error envelope's `diag` for `error.code = version_conflict`."
code = 8106
class = "Governance"
slug = "admin-version-conflict"
title = "The If-Match version is stale"
severity = "Actionable"
summary = "The request's `If-Match` names a version of the resource that is no longer current: someone else changed it after you read it. This is retryable."
action = "Re-read the resource, re-apply your change to the current version, and retry with the new `ETag`."

[[diagnostic]]
name = "ADMIN_CONFLICT"
doc = "The admin API error envelope's `diag` for `error.code = conflict`."
code = 8107
class = "Governance"
slug = "admin-conflict"
title = "The admin request contradicts the server's state"
severity = "Actionable"
summary = "The request cannot apply to the current state and a retry will not change that: governance is disabled, a base-defined hook cannot be removed, a grant is immutable, a duplicate already exists, or an idempotency key is still in flight. The message says which."
action = "Change the request (or the state it depends on) as the message describes; this is not a transient error."

[[diagnostic]]
name = "ADMIN_RATE_LIMITED"
doc = "The admin API error envelope's `diag` for `error.code = rate_limited`."
code = 8108
class = "Governance"
slug = "admin-rate-limited"
title = "The admin mutation rate limit is exhausted"
severity = "Actionable"
summary = "The caller has used its per-minute budget of admin mutations. Reads are not limited."
action = "Wait for the window the `retry-after` header gives (at most a minute) and retry; batch changes where the API allows."

[[diagnostic]]
name = "ADMIN_INTERNAL"
doc = "The admin API error envelope's `diag` for `error.code = internal`."
code = 8109
class = "Governance"
slug = "admin-internal"
title = "The admin call failed inside busbar"
severity = "Actionable"
summary = "An internal failure (a store or plugin error) stopped the call. The response never carries the cause, which may be sensitive; the server log carries it under its own code."
action = "Check the busbar log at the time of the call for the error line and its code, then retry once the cause is fixed."

[[diagnostic]]
name = "ADMIN_UNAVAILABLE"
doc = "The admin API error envelope's `diag` for `error.code = unavailable`."
code = 8110
class = "Governance"
slug = "admin-unavailable"
title = "The admin call could not complete within its bound"
severity = "Actionable"
summary = "An operation that is normally fast could not start or finish in time (for example the plugin catalog scan), or no administrative surface is mounted on this listener. The call was abandoned rather than left to hang."
action = "Retry after a short wait. If it persists, check the server log and the store's health."

[[diagnostic]]
name = "ADMIN_UNPRICED_CLASS"
doc = "The admin API error envelope's `diag` for `error.code = unpriced_class`."
code = 8111
class = "Governance"
slug = "admin-unpriced-class"
title = "A usage read names a class the rate card does not price"
severity = "Actionable"
summary = "A usage query asked for a class the rate card in force does not price, so there is no amount to report for it."
action = "Price the class on the plane's rate card, or drop it from the query."

[[diagnostic]]
name = "ADMIN_REQUEST_TOO_LARGE"
doc = "The admin API error envelope's `diag` for `error.code = request_too_large`."
code = 8112
class = "Governance"
slug = "admin-request-too-large"
title = "The admin request body exceeds the configured limit"
severity = "Actionable"
summary = "The request body is larger than the admin surface accepts."
action = "Send a smaller body (split a bulk change into several requests), or raise the configured admin body limit."

[[diagnostic]]
name = "ADMIN_REQUEST_REFUSED"
doc = "The admin API error envelope's `diag` for `error.code = (any other)`."
code = 8199
class = "Governance"
slug = "admin-request-refused"
title = "The admin request was refused"
severity = "Actionable"
summary = "The admin surface refused the request for a reason the `error.code` field names. This code covers refusals without a more specific admin code."
action = "Read `error.code` and `error.message` in the response; docs/admin-api.md lists every error code."
