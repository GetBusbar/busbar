severity = "Actionable"
summary = "An `on_error` fallback hook itself returned an error, so busbar continued down the fallback chain to the next link (or the reserved terminal). The fallback chain meant to cover a broken primary is itself partly broken. Warned once per fault window."
action = "Fix the failing fallback hook. The request is still served by a later chain link or the terminal policy, but the chain has less depth than configured."

[[diagnostic]]
name = "ON_ERROR_FALLBACK_DEADLINE_EXCEEDED"
doc = "An `on_error` fallback hook exceeded its deadline; the chain continued. Warn-once (latched)."
code = 5009
class = "Proxy"
slug = "on-error-fallback-deadline-exceeded"
title = "on_error fallback hook deadline exceeded; continuing down the chain"
severity = "Actionable"
summary = "An `on_error` fallback hook exceeded its deadline, so busbar continued down the fallback chain. Warned once per fault window; continued timeouts log at debug."
action = "Investigate why the fallback hook is slow, or raise its timeout if the latency is expected. The chain still resolves via a later link or the terminal policy."

