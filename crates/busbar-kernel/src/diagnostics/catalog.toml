severity = "BenignRecurring"
summary = "After a routing gate failed, one of its configured `on_error` fallback hooks answered and decided the request. This is a RECOVERY signal: the fallback chain did its job."
action = "None — informational. The paired gate-failure diagnostic (BUSBAR-5005/5006) names the primary hook to fix."

[[diagnostic]]
name = "ON_ERROR_FALLBACK_HOOK_FAILED"
