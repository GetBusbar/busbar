[[diagnostic]]
name = "OAUTH_AS_EPHEMERAL_SIGNING_KEY"
doc = "oauth_as has no configured signing_key, so an EPHEMERAL ES256 key was generated at boot. Lives in `appbuild.rs`, but the subject is auth & identity (token signing), so it is a 4000 code."
code = 4025
class = "Auth"
slug = "oauth-as-ephemeral-signing-key"
title = "oauth_as generated an ephemeral ES256 signing key (tokens die on restart)"
severity = "Actionable"
summary = "The oauth_as authorization server has no `signing_key` configured, so busbar generated an EPHEMERAL ES256 key at boot. Every token this deployment issues is signed with that in-memory key and stops verifying the moment the process restarts, because a new key is generated on the next boot. Acceptable only for a trial or local development."
action = "Set `oauth_as.signing_key` to a durable key reference before relying on issued tokens across restarts. Until then, every restart invalidates all outstanding oauth_as tokens."

[[diagnostic]]
name = "ROUTING_POLICY_FAILED_ON_ERROR_FALLBACK"
doc = "A routing-policy hook errored; the pool's `on_error` fallback was applied. Warn-once (latched)."
code = 5005
class = "Proxy"
slug = "routing-policy-failed-on-error-fallback"
title = "Routing policy failed; on_error fallback applied"
severity = "Actionable"
summary = "A routing-policy hook returned an ERROR while deciding a request, so busbar applied the pool's configured `on_error` fallback. A hook binary that is down, crashing, or returning garbage degrades every request in the pool to the fallback. Warned once per fault window; continued failures log at debug."
action = "Fix the routing-policy hook — check that its process is running, reachable, and returning a valid decision. The pool serves via `on_error` until it recovers."

[[diagnostic]]
name = "ROUTING_POLICY_DEADLINE_EXCEEDED"
doc = "A routing-policy hook exceeded its deadline; the `on_error` fallback was applied. Warn-once."
code = 5006
class = "Proxy"
slug = "routing-policy-deadline-exceeded"
title = "Routing policy deadline exceeded; on_error fallback applied"
severity = "Actionable"
summary = "A routing-policy hook did not answer within the seam's hard wall-clock deadline, so busbar applied the pool's `on_error` fallback. A slow hook adds latency to every request in the pool. Warned once per fault window; continued timeouts log at debug."
action = "Investigate why the routing-policy hook is slow (overload, blocking I/O, an undersized deadline). Tune the hook or raise its configured timeout if the latency is legitimate."

[[diagnostic]]
name = "ON_ERROR_FALLBACK_ANSWERED"
