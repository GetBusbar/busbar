title = "Metrics scrape: failed to list virtual keys (per-key gauges skipped)"
severity = "BenignRecurring"
summary = "A /metrics scrape could not list virtual keys from the governance store (a transient store hiccup), so it skips the per-key spend/token gauges for this scrape. Other gauges still refresh."
action = "None — self-heals on the next scrape once the store responds. Sustained failures indicate a governance-store problem worth investigating."

[[diagnostic]]
name = "METRICS_KEY_GAUGE_LIMIT_EXCEEDED"
doc = "Virtual-key count exceeds the per-key gauge limit; gauges truncated. Warn-once (latched)."
code = 5035
class = "Proxy"
slug = "metrics-key-gauge-limit-exceeded"
title = "Metrics scrape: virtual-key count exceeds the per-key gauge limit (truncating)"
severity = "Actionable"
summary = "The number of virtual keys exceeds the per-key gauge limit (`metrics.key_gauge_limit`), so busbar emits gauges for only the first `limit` keys to bound the exposition's cardinality and scrape-path DB load. Some keys have no per-key series. Warned once until the count drops back under the limit."
action = "Raise `metrics.key_gauge_limit` if you need per-key series for all keys and can afford the cardinality, or reduce the number of active virtual keys. Aggregate group gauges are unaffected."

[[diagnostic]]
name = "METRICS_SCRAPE_KEY_USAGE_READ_FAILED"
doc = "A /metrics scrape could not read one key's usage; that key's gauges skipped this scrape."
code = 5036
class = "Proxy"
slug = "metrics-scrape-key-usage-read-failed"
title = "Metrics scrape: usage read failed; skipping key"
severity = "BenignRecurring"
summary = "During a /metrics scrape, reading one virtual key's usage from the store failed, so busbar skips that key's gauges for this scrape and continues with the rest. Per-key, per-scrape."
action = "None — self-heals on the next scrape. A high volume across keys points to a governance-store problem."

[[diagnostic]]
name = "METRICS_SCRAPE_GROUP_LEDGER_READ_FAILED"
doc = "A /metrics scrape could not read a group ledger bucket; that bucket skipped this scrape."
code = 5037
class = "Proxy"
slug = "metrics-scrape-group-ledger-read-failed"
title = "Metrics scrape: group ledger read failed; skipping bucket"
severity = "BenignRecurring"
summary = "During a /metrics scrape, reading a group budget bucket's ledger from the store failed, so busbar skips that bucket's gauges for this scrape and continues. Per-bucket, per-scrape."
action = "None — self-heals on the next scrape. Sustained failures indicate a governance-store problem."

[[diagnostic]]
name = "PLUGINS_FETCH_RELOAD_MISS"
doc = "A plugin fetch missed on reload; busbar kept the current on-disk artifact. Boot/reload notice. Lives in `appbuild.rs`, but the subject is the plugin loader, so it is a 6000 code."
code = 6001
class = "Plugins"
slug = "plugins-fetch-reload-miss"
title = "plugins.fetch missed on reload (keeping the current artifact)"
severity = "Actionable"
summary = "During a reload, fetching a pinned plugin artifact missed (the source did not return a usable download for the pinned spec), so busbar kept the artifact already on disk and continued the reload. The running plugin is unchanged; the intended refresh did not land."
action = "Check the plugin source (registry/URL) and the pinned spec for the named artifact — a transient fetch miss self-heals on the next reload, a persistent one means the pin no longer resolves. busbar keeps serving the current artifact until a fetch succeeds."

[[diagnostic]]
name = "PLUGIN_SKIPPED_TRUST_POLICY"
doc = "A plugin is present in the directory but not loaded because the trust policy skips it. Lives in `preflight.rs`, but the subject is plugin trust, so it is a 6000 code."
code = 6002
class = "Plugins"
slug = "plugin-skipped-trust-policy"
title = "Plugin present but NOT loaded (skipped by trust policy)"
severity = "Actionable"
summary = "A plugin artifact is present in the plugins directory but was NOT loaded because the configured trust policy skipped it (unsigned, an untrusted publisher, or a failed signature/floor check). busbar fails closed: an untrusted plugin is left inert rather than loaded. Emitted once per skipped plugin at boot."
action = "If the plugin should load, sign it with a trusted publisher key or add that publisher to `plugins.trust` (the log names the plugin, file, and reason). If the skip is intended, remove the artifact from the directory to silence the notice."

[[diagnostic]]
name = "PLUGIN_LOADED_UNVERIFIED"
doc = "A plugin was loaded but its signature is UNVERIFIED, permitted by an explicit plugins.trust opt-in. Lives in `preflight.rs`, but the subject is plugin trust, so it is a 6000 code."
code = 6003
class = "Plugins"
slug = "plugin-loaded-unverified"
title = "Plugin loaded UNVERIFIED (permitted by an explicit plugins.trust opt-in)"
severity = "Actionable"
summary = "A plugin was loaded even though its signature is UNVERIFIED — its code is running unauthenticated, permitted only because an explicit `plugins.trust` opt-in (`allow_unsigned`/`allow_third_party`) let it through. Security-relevant: unverified plugin code runs in-process with busbar's privileges. Emitted once per such plugin at boot."
action = "Prefer a signed artifact from a trusted publisher and remove the `plugins.trust` opt-in once you no longer need it. If running unverified is a deliberate, understood choice (e.g. a locally-built plugin), the opt-in is what keeps it explicit."

[[diagnostic]]
name = "STATEFUL_PLANE_EPHEMERAL_STORE"
doc = "The RAM (ephemeral) store was resolved while a STATEFUL plane (one carrying per-task state) is configured, so in-flight plane task state is dropped on restart."
code = 7030
class = "Plane"
slug = "stateful-plane-ephemeral-store"
title = "Stateful plane on the in-memory store — plane task state is lost on restart"
severity = "Actionable"
summary = "busbar resolved the in-memory (ephemeral) store while a STATEFUL plane is configured — a plane subject (a tool, an agent, or a pool of them). Such planes carry per-task state that lives only in RAM with this store, so it is DROPPED on restart: a task that was mid-flight when the process restarts will break on its next request. Stateless planes are deliberately NOT warned — a restart costs them nothing, so warning there would be noise. This is a WARN, not a boot refusal: a durable store is opt-in and RAM is the convenience default."
action = "Configure a durable store plugin so plane task state survives a restart. No action is needed if losing in-flight task state on restart is acceptable for this deployment."

[[diagnostic]]
name = "REVOCATION_RESYNC_OUTSTANDING"
doc = "A revocation denylist re-sync is still outstanding from an earlier window; store hasn't answered."
code = 8001
class = "Governance"
slug = "revocation-resync-outstanding"
title = "Revocation denylist re-sync still outstanding from an earlier window"
severity = "Actionable"
summary = "A revocation-denylist re-sync launched in an earlier window has not returned — the governance store has not answered for at least a full sync window — so busbar keeps serving the last-known revocations and does not start a second overlapping read. A peer's revoke may not be visible on this node until the store recovers. The CAS bound rate-limits this warning to once per window."
action = "Investigate the governance store's health and latency. Revocations already known stay enforced (fail-closed); the risk is a NEW revoke made elsewhere not yet reaching this node. Re-sync resumes automatically once the store answers."

[[diagnostic]]
name = "REVOCATION_RESYNC_FAILED"
doc = "A revocation denylist re-sync store read returned an error; the prior set is kept (fail-closed)."
code = 8002
class = "Governance"
slug = "revocation-resync-failed"
title = "Revocation denylist re-sync failed (keeping the previously-known revocations)"
severity = "Actionable"
summary = "A revocation-denylist re-sync read from the governance store returned an error, so busbar keeps the previously-known revocations in place (fail-closed: a store blip never widens access) and leaves the set marked stale so the next window retries. A peer's revoke may not be visible on this node until a later sync succeeds."
action = "Investigate the governance store — a transient error self-heals on the next window's retry; sustained failures mean the store is unreachable and cross-node revocations are not propagating."

[[diagnostic]]
name = "GOVERNANCE_KEY_RESERVED_NAMESPACE_COLLISION"
doc = "A principal id collides with a reserved bucket namespace (group:/vk_); no synthetic key minted."
code = 8003
class = "Governance"
slug = "governance-key-reserved-namespace-collision"
title = "Refused to synthesize a governance key (principal id collides with a reserved namespace)"
severity = "BenignRecurring"
summary = "A principal id (attacker-influenceable at the IdP) starts with a reserved ledger-bucket prefix (`group:` or `vk_`), which would alias a group's or a real virtual key's ledger and rate bucket. busbar fails closed and synthesizes NO key for that principal rather than mint a colliding bucket. This is a per-request, caller-side signal, not an operator problem, so it is emitted at debug."
action = "None — self-heals; the principal is correctly refused data-plane access. If a legitimate identity is being rejected, its IdP subject must be reshaped to avoid the reserved `group:` and `vk_` prefixes."

[[diagnostic]]
name = "LIMIT_WINDOW_UNRECOGNIZED"
doc = "An unrecognized limit-window word (corrupt/foreign store row); enforced as all-time ('total')."
code = 8004
class = "Governance"
slug = "limit-window-unrecognized"
title = "Unrecognized limit window (enforcing as all-time 'total')"
severity = "Actionable"
summary = "A limit's window word was not recognized — it can only arise from a corrupt or foreign store row, since config parse rejects unknown windows. busbar fails SAFE and enforces the limit as the all-time ('total') window, the tightest enforcement, never wider, and surfaces the value so the corruption is visible instead of silent."
action = "Inspect the governance store row for the named window value — it was written by something other than a validated config load. Enforcement is safe (all-time) in the meantime; correct the row so the intended window applies."

[[diagnostic]]
name = "REFRESH_SELF_INCONSISTENT_BINDING"
doc = "refresh_self: tombstone of the prior binding failed AND the rollback failed — two live bindings."
code = 8005
class = "Governance"
slug = "refresh-self-inconsistent-binding"
title = "Self-serve refresh left an inconsistent binding (tombstone AND rollback both failed)"
severity = "Actionable"
summary = "During a self-serve key refresh, tombstoning the prior binding failed and the compensating rollback of the newly-minted binding ALSO failed, so the subject may now have TWO live bindings in the store for one identity. busbar exhausted its best-effort recovery and surfaces the inconsistent state for inspection. Rare."
action = "Inspect the governance store for the named subject — it may hold two live bindings (old_id and new_id). Tombstone whichever is not intended so the subject has exactly one valid credential."

[[diagnostic]]
name = "REFRESH_SELF_CACHE_REFRESH_FAILED"
doc = "refresh_self: cache reconcile failed after the store tombstone; prior binding evicted surgically."
code = 8006
class = "Governance"
slug = "refresh-self-cache-refresh-failed"
title = "Self-serve refresh: cache reconcile failed after tombstoning the prior binding"
severity = "Actionable"
summary = "During a self-serve key refresh, the store tombstone of the prior binding committed but the follow-up cache reconcile (a store round-trip) failed. busbar evicted the prior binding directly from the cache so its old token stops verifying immediately; the store is consistent, but the rest of the cache may be stale until the next successful refresh."
action = "Investigate the governance store's reachability — the durable state is correct and the old credential no longer verifies. The cache self-heals on the next successful reconcile; sustained failures mean the store is unhealthy."

[[diagnostic]]
name = "ACCRUAL_GROUP_MISSING"
doc = "A group was missing at accrual; tokens were ledgered to the key bucket only (self-degrading)."
code = 8007
class = "Governance"
slug = "accrual-group-missing"
title = "Group missing at accrual (tokens ledgered to the key bucket only)"
severity = "BenignRecurring"
summary = "A group referenced by a key was gone by the time usage was accrued (the group was deleted between admission and accrual), so busbar degrades to ledgering the tokens on the key's own bucket only rather than lose them. The request was already admitted and served; nothing is lost. This is a per-request, self-degrading path, so it is emitted at debug."
action = "None — self-heals; tokens are preserved on the key bucket. Frequent occurrence for one key means a group is being deleted out from under active keys; reconcile the key's group assignment."

[[diagnostic]]
name = "METERING_FLUSH_PARTIAL_FAILURE"
doc = "Metering flush had key(s) fail to persist this tick; already aggregated to one warn per tick."
code = 8008
class = "Governance"
slug = "metering-flush-partial-failure"
title = "Metering flush: some keys failed to persist this tick (retained for retry)"
severity = "Actionable"
summary = "A metering flush tick could not persist one or more keys' usage deltas to the store. busbar retains the failed deltas and retries them on the next tick, so no usage is lost. This is already collapsed to ONE aggregate warning per tick (per-key detail is at debug), so it fires at a human cadence, not per key."
action = "Investigate the governance store if the failure count stays non-zero across ticks — a transient store hiccup self-heals on the next flush. Usage is retained and re-tried, so billing is not lost, only delayed."

[[diagnostic]]
name = "METERING_PENDING_OVERFLOW_COALESCED"
doc = "Metering write-behind accumulator hit its cap; a new cell was coalesced into an overflow sentinel."
code = 8019
class = "Governance"
slug = "metering-pending-overflow-coalesced"
title = "Metering accumulator at cap: a cell was coalesced into an overflow sentinel"
severity = "Actionable"
summary = "The write-behind metering accumulator (pending_metering) reached its cap while a NEW (key_id, bucket, model, provider) cell arrived — a sustained governance-store outage with diverse keys/models, where every flush re-queues the failed cells while new ones keep arriving. Rather than grow without bound OR silently drop billable usage, busbar COALESCES the arriving cell's counts into a per-bucket overflow sentinel: the day's token and request TOTALS are preserved, only their per-key/model/provider ATTRIBUTION is collapsed. Each coalesce also increments busbar_metering_pending_coalesced_total. The warning is emitted at most once per minute and names how many cells were coalesced since the previous line; the counter carries the running total."
action = "Restore the governance store — the accumulator overflows only under a sustained write outage. Usage is not lost (totals are retained under the overflow sentinel key), but once the store recovers the retained deltas flush and normal per-key attribution resumes. A steadily climbing coalesced counter means the outage has outlasted the cap."

[[diagnostic]]
name = "DELETE_KEY_CACHE_RECONCILE_FAILED"
doc = "delete_key: tombstone committed and key evicted, but the full cache reconcile failed."
code = 8009
class = "Governance"
slug = "delete-key-cache-reconcile-failed"
title = "delete_key: tombstone committed and key evicted, but cache reconcile failed"
severity = "Actionable"
summary = "An admin key deletion committed the tombstone in the store and evicted the deleted key from the in-memory caches (it no longer authenticates), but the follow-up full cache reconcile failed. The deletion is durable and the key is dead; only OTHER cache entries may be stale until the next successful refresh. Rare admin path."
action = "Investigate the governance store's reachability — the deletion itself is complete and safe. The cache self-heals on the next successful refresh; sustained failures indicate an unhealthy store."

[[diagnostic]]
name = "ROTATE_KEY_CACHE_RECONCILE_FAILED"
doc = "rotate_key: new generation committed and key evicted, but cache reconcile failed; new secret lost."
code = 8010
class = "Governance"
slug = "rotate-key-cache-reconcile-failed"
title = "rotate_key: new generation committed, but cache reconcile failed (new secret not returned)"
severity = "Actionable"
summary = "An admin key rotation committed the new generation in the store — so the PREVIOUS credential is permanently dead — and evicted the key from the caches, but the follow-up cache reconcile failed, so the freshly-minted secret could not be returned to the admin. The rotation IS durable; the new secret is simply lost from this response. Rare admin path."
action = "Re-rotate the key to obtain a fresh secret — the previous credential is already dead and will not come back. Investigate the governance store's reachability, which is why the reconcile failed."

[[diagnostic]]
name = "BUDGET_FLUSH_PARTIAL_FAILURE"
doc = "Budget flush had bucket(s) fail to persist this tick; already aggregated to one warn per tick."
code = 8011
class = "Governance"
slug = "budget-flush-partial-failure"
title = "Budget flush: some buckets failed to persist this tick (re-marked dirty for retry)"
severity = "Actionable"
summary = "A budget flush tick could not persist one or more group-budget buckets to the store. busbar re-marks those buckets dirty and retries them on the next tick, so no spend is lost. This is already collapsed to ONE aggregate warning per tick (per-bucket detail is at debug), so it fires at a human cadence, not per bucket."
action = "Investigate the governance store if the failure count stays non-zero across ticks — a transient store hiccup self-heals on the next flush. Spend is retained and re-tried, so budgets are not lost, only delayed."

[[diagnostic]]
name = "SAFE_MODE_OVERLAY_QUARANTINED"
doc = "--safe-mode boot: the config overlay was quarantined; running on base config.yaml alone."
code = 8012
class = "Governance"
slug = "safe-mode-overlay-quarantined"
title = "SAFE MODE: config overlay not merged (running on base config.yaml alone)"
severity = "Actionable"
summary = "busbar was booted with `--safe-mode`, so the persisted config overlay (API-registered hooks) was NOT merged and busbar is running on the operator-owned base config.yaml alone. This is the intentional escape hatch for an applied hook that harms traffic and re-applies itself every boot. The overlay file is untouched, not deleted."
action = "This is an operator-requested state. Repair or remove the offending overlay entry, then boot WITHOUT `--safe-mode` to re-apply the overlay. Until then, API-registered hooks are not in effect."

[[diagnostic]]
name = "PROVIDER_API_KEY_UNRESOLVED"
doc = "RETIRED before 1.6.0 shipped, superseded by [`PROVIDER_API_KEY_UNRESOLVABLE`]: the degrade this code described no longer exists. The number is kept so a log line from a pre-release build still resolves to an entry that says what happened and what replaced it."
code = 8013
class = "Governance"
slug = "provider-api-key-unresolved"
title = "Provider api_key did not resolve (degraded to an empty key) — RETIRED, see BUSBAR-8020"
severity = "Actionable"
summary = "RETIRED. A provider's `api_key` secret reference did not resolve at boot, so busbar degraded that provider to an empty key and started the lane anyway. 1.6.0 removed that degrade: an `api_key` that does not resolve now REFUSES BOOT (BUSBAR-8020), and an upstream that genuinely takes no credential is declared with `api_key: none`."
action = "Nothing emits this code. See BUSBAR-8020."
retired = true

[[diagnostic]]
name = "PROVIDER_API_KEY_UNRESOLVABLE"
doc = "A provider api_key SecretRef did not resolve; boot refuses."
code = 8020
class = "Governance"
slug = "provider-api-key-unresolvable"
title = "Provider api_key did not resolve (boot refuses)"
severity = "Fatal"
summary = "A provider's `api_key` secret reference could not be resolved — an unset environment variable, a missing file, a value or file that is empty or whitespace-only, an unknown module, or a secret plugin that failed — so busbar refuses to start. It does not fall back to an empty credential: that lane could never authenticate, would report healthy, would be skipped by the health prober (no key, no probe), and would answer every request routed to it with a 401 from the upstream. The diagnostic names the provider and the secret module (`secret module 'busbar-secret-env'`), never the value."
action = "Fix the reference so it resolves (set the variable, mount the file, install and trust the secret plugin), or — if this upstream genuinely takes NO credential, such as a local ollama or vLLM — declare that explicitly with `api_key: none`, which starts the lane with no credential and sends no auth header. `--validate` reports the same refusal before you deploy."

[[diagnostic]]
name = "METER_CLASS_UNDECLARED"
doc = "A unit's one line carried a class its plane never declared."
code = 8022
class = "Governance"
slug = "meter-class-undeclared"
title = "A unit reported a usage class its plane never declared (the line is refused, not billed)"
severity = "Actionable"
summary = "A unit's drained usage report named a class that no installed plane declares as billable, no configured `units:` entry names, and is not one of the reserved four. The unit's one line is still written with every count, but its money is REFUSED rather than priced: a class nobody declared is never billed at zero and never dropped. Every read of the balance the line sits on refuses until it is explained."
action = "The plane that served the unit reported a class outside its declaration, which is a plugin defect: upgrade or fix the plane so it declares every class it reports, or configure the class under the lane's `units:` if it is an operator-priced open class."

[[diagnostic]]
name = "OPEN_RELAY_NO_AUTH"
doc = "auth.chain is empty (open relay) — emitted at error so RUST_LOG=error cannot mask it."
code = 8014
class = "Governance"
slug = "open-relay-no-auth"
title = "auth.chain is empty — OPEN RELAY (every request admitted unauthenticated)"
severity = "Actionable"
summary = "The auth chain is empty (either explicitly, or because the `auth:` block is absent and serde-defaults to none), so every data-plane request is admitted unauthenticated — an OPEN RELAY forwarding anyone's traffic on your upstream credentials. Emitted at ERROR (not warn, which RUST_LOG=error would suppress) and unconditionally on stderr so the state cannot be masked by log configuration. Acceptable only for local development."
action = "Configure `auth.chain` (a `keys` verifier and/or an auth plugin) before exposing busbar to any untrusted network. This is the same open-relay condition as BUSBAR-4004, surfaced at boot."

[[diagnostic]]
name = "CREDENTIAL_AT_REST_UNOPENABLE"
doc = "A stored recoverable credential opens under neither at-rest key, so it does not authenticate."
code = 8023
class = "Governance"
slug = "credential-at-rest-unopenable"
title = "A stored recoverable credential opens under neither at-rest key (it does not authenticate)"
severity = "Actionable"
summary = "A recoverable credential (a signed-request secret) is stored sealed under an at-rest key whose kid matches neither credentials.at_rest.key nor credentials.at_rest.previous on this node, or its row was altered. It answers as an unknown credential: requests signed with it are refused. The refusal is audited once per kid."
action = "Configure the key with the named kid as credentials.at_rest.previous (or as key) on every node that shares the store, and reload. A credential whose key is lost cannot be recovered: re-mint it."

[[diagnostic]]
name = "CREDENTIAL_AT_REST_REWRAP_PENDING"
doc = "Recoverable credentials still need re-sealing under the current at-rest key."
code = 8024
class = "Governance"
slug = "credential-at-rest-rewrap-pending"
title = "Recoverable credentials are not yet re-sealed under the current at-rest key"
severity = "Actionable"
summary = "A boot or reload re-seals every stored recoverable credential sealed under credentials.at_rest.previous (or stored in the clear before 1.6.0) under credentials.at_rest.key. Some rows were not re-sealed on this pass: another node held their claim, the store keeps no claims, or the store refused the write. They still authenticate under the key they were sealed under."
action = "Keep credentials.at_rest.previous configured until a boot or reload re-seals them all (no further warning). If it persists on a single node, check that the store supports single-use claims and accepts credential writes."

[[diagnostic]]
name = "CREDENTIAL_AT_REST_LEGACY_PLAIN"
doc = "A recoverable credential written before 1.6.0 is stored in the clear."
code = 8025
class = "Governance"
slug = "credential-at-rest-legacy-plain"
title = "A recoverable credential written before 1.6.0 is stored in the clear"
severity = "Actionable"
summary = "A recoverable credential (a signed-request secret) minted by 1.5.5 is stored as v1:plain. It still authenticates. A boot or reload with credentials.at_rest.key configured re-seals it under that key."
action = "Configure credentials.at_rest.key (a secret reference resolving to 32 random bytes) and reload; the row is re-sealed and no longer stored in the clear."

[[diagnostic]]
name = "UPSTREAM_CREDENTIAL_REFRESH_FAILED"
doc = "A plane member's upstream credential could not be refreshed; the held value is kept until its lease ends."
code = 8026
class = "Governance"
slug = "upstream-credential-refresh-failed"
title = "A plane member's upstream credential could not be refreshed"
severity = "Actionable"
summary = "busbar renews each plane member's upstream_credential off the request path, at half its lease_ttl_ms (at most every five minutes). A renewal failed: the source could not be read (cause resolve: unavailable, internal fault, an empty or non-text value), or the value changed and the auth plugin refused the new one (cause reopen, at ERROR). The value already held is still presented until its lease ends, and the renewal is retried with a jittered backoff. Reported on the first failure, then at most once a minute per member (also after the lease has ended); members on the same source within that minute are counted in its others field. Each report is audited as upstream_credential.refresh, degraded. An A2A member whose lease ends meanwhile has its hops refused as BUSBAR-7013."
action = "Check the source the reference field names (the file, the environment variable or the secret module) and the error field. For cause reopen, the value at the source is one the auth plugin cannot present (for example a header value with illegal characters): correct it at the source. The next successful refresh logs that it refreshed again and is audited as applied."

[[diagnostic]]
name = "UPSTREAM_CREDENTIAL_LAPSED"
doc = "A plane member's upstream credential is no longer presented: its lease ended unrenewed, or its source confirmed it revoked."
code = 8027
class = "Governance"
slug = "upstream-credential-lapsed"
title = "A plane member's upstream credential lapsed or was revoked at its source"
severity = "Actionable"
summary = "A plane member's upstream credential is no longer presented, so every hop on the member is refused (credential_unavailable; for an A2A member, BUSBAR-7013). Cause lease-expired: its lease_ttl_ms ran out with no successful refresh (reported when the lease ends, whether or not a hop arrives). Cause revoked-at-source: the source answered not-found or permission-denied twice, one second apart, so busbar dropped the credential at once instead of riding out an outage. Reported once per lapse and audited as upstream_credential.refresh, rejected. Refreshes continue; the first that succeeds presents the credential again."
action = "For revoked-at-source, this is expected after deleting the secret or removing busbar's access to it; restore it to resume. For lease-expired, see the BUSBAR-8026 lines for the member: they name the source and the error. A longer lease_ttl_ms rides out longer outages; a shorter one revokes faster."

[[diagnostic]]
name = "PLUGIN_CREDENTIAL_ROTATION_FAILED"
doc = "A plugin instance's own rotated credential could not be applied; the running instance is kept."
code = 8028
class = "Governance"
slug = "plugin-credential-rotation-failed"
title = "A plugin's rotated credential could not be applied"
severity = "Actionable"
summary = "busbar re-reads the secret references a secret or auth plugin instance was opened with every 30 seconds. When one changed (a rotated token file, for example a workload-identity token), busbar hands the new material to the plugin's refresh, or, for a plugin with no refresh, opens a new instance from the same plugin artifact and swaps it in. This failed: the reference could not be re-read (cause unresolvable), the plugin refused the new material (cause refused, at ERROR), or the new instance did not open (cause reopen-failed, at ERROR). The running instance and the credentials it holds are kept and the change is retried on the next poll. Reported at most once a minute per instance and audited as plugin.credential.rotate, degraded; a later success is audited as applied."
action = "Check the reference and the error field. For refused or reopen-failed, the plugin rejected the rotated material: fix it at the source. If the old material expires first, the plugin's own calls fail until the new material is accepted."

[[diagnostic]]
name = "PLUGIN_TICK_FAILED"
reexport = "busbar_contract::diagnostic"

[[diagnostic]]
name = "STORE_SECRET_REF_UNRESOLVED"
doc = "A store settings SecretRef does not resolve at boot; restart-to-apply, so it WILL fail next restart."
code = 8015
class = "Governance"
slug = "store-secret-ref-unresolved"
title = "Store settings hold a secret reference that does not resolve here"
severity = "Actionable"
summary = "A governance-store `settings` value holds a secret reference that does not resolve on this boot. busbar warns rather than fails, because the store is restart-to-apply and staging a ref whose secret the orchestrator mounts on the next deploy is a legitimate workflow. But if the secret is still absent at the next restart, THAT restart will fail in resolve_settings before serving."
action = "Ensure the named store secret reference resolves before the next restart. If you are staging it for an upcoming deploy, no action now; otherwise fix the reference so the next restart does not die resolving it."

[[diagnostic]]
name = "GOVERNANCE_STORE_EPHEMERAL"
doc = "The in-memory (ephemeral) governance store was selected; keys/usage/ledgers reset on restart."
code = 8016
class = "Governance"
slug = "governance-store-ephemeral"
title = "Governance store is in-memory (ephemeral) — state resets on restart"
severity = "Actionable"
summary = "busbar selected the in-memory (ephemeral) governance store, so virtual keys, groups' usage, and ledgers live only in RAM and are LOST on restart. This is the default when no durable store plugin is configured — fine for a trial or local development, but not for anything that must retain keys or spend across restarts."
action = "Configure a durable governance store plugin for persistence if keys, usage, or budgets must survive a restart. No action is needed for ephemeral/dev use."

[[diagnostic]]
name = "DURABLE_KEYS_INERT"
doc = "Durable store is configured with keys but keys-in-chain is off; durable keys are inert."
code = 8017
class = "Governance"
slug = "durable-keys-inert"
title = "Durable keys are inert (keys exist but `keys` is not in the running auth chain)"
severity = "Actionable"
summary = "A durable governance store holds virtual keys, but the running auth chain does not include the `keys` verifier, so those keys enforce nothing — every request bypasses key-based governance. Emitted at ERROR (not warn, which RUST_LOG=error would suppress) and unconditionally on stderr, the same pattern as the open-relay banner, so the inert state cannot be masked by log configuration."
action = "Add `keys` to `auth.chain` so the durable keys actually gate traffic, or remove the keys if key-based governance is not intended. Until then, minted keys are dead weight."

[[diagnostic]]
name = "BOOT_AUDIT_RESTORE_READ_FAILED"
doc = "The durable audit log could not be READ at boot (a store hiccup); busbar starts on an empty ring."
code = 9001
class = "Boot"
slug = "boot-audit-restore-read-failed"
title = "Durable audit log could not be read at boot (starting with an empty ring)"
severity = "Actionable"
summary = "busbar could not READ the durable audit log from the governance store at boot — a store hiccup, not a chain-verification failure — so it started with an empty in-memory audit ring. This is deliberately distinct from BUSBAR-2043 (chain verification failed): here the bytes could not be read at all, so there is no tamper signal, just a store that did not answer."
action = "Investigate the governance store's reachability at boot. If the store recovers, restart so the durable history is restored into the ring; a transient hiccup needs no action beyond confirming the store is healthy."

[[diagnostic]]
name = "BOOT_AUDIT_MIGRATE_FAILED"
doc = "The ONE-TIME legacy-audit-table → `plane_records` migration could not be completed at boot (a store write hiccup); the durable seam has not yet taken over the pre-existing audit history."
code = 9012
class = "Boot"
slug = "boot-audit-migrate-failed"
title = "Legacy audit table could not be migrated into the durable journal seam at boot"
severity = "Actionable"
summary = "busbar found audit history in the legacy durable table but could not copy it into the neutral `plane_records` the durable audit seam now reads at boot — a store read/write hiccup, not a chain-verification failure. The migration is IDEMPOTENT and is retried on the next boot, so the pre-existing history reappears once the store is healthy; until then the seam-backed audit read (`GET /audit`) reflects only records written since this boot."
action = "Investigate the governance store's write path at boot (the same store the audit log persists to). Once it accepts writes, restart so the one-time migration completes and the durable history is restored into the seam; a transient hiccup needs no action beyond confirming the store is healthy."

[[diagnostic]]
name = "TLS_ACCEPT_PERSISTENT_FAILURE"
doc = "The TLS accept loop is failing persistently (fd exhaustion?); busbar backs off. Backoff-latched."
code = 9002
class = "Boot"
slug = "tls-accept-persistent-failure"
title = "TLS accept loop failing persistently (backing off)"
severity = "Actionable"
summary = "A TLS listener's accept loop is failing persistently — commonly file-descriptor exhaustion — so busbar backs off before retrying rather than spin hot on the error. On unix each of the N data-plane workers runs its own accept loop, so the warning can fire from one worker or from several at once. The warning is already rate-limited by the backoff delay, so each loop fires at a human cadence, not per failed accept."
action = "Investigate the accept failure — most often the process fd limit (raise `ulimit -n` / the systemd `LimitNOFILE`) or a resource leak holding sockets open. Each listener keeps retrying with backoff and recovers on its own once accepts succeed."

[[diagnostic]]
name = "TELEMETRY_SLOT_TABLE_FULL"
doc = "The telemetry bank's slot table is full; further label sets fall back to the metrics macros. Warn-once."
code = 9003
class = "Boot"
slug = "telemetry-slot-table-full"
title = "Telemetry slot table full (further label sets fall back to the metrics macros)"
severity = "BenignRecurring"
summary = "The telemetry bank's pre-registered slot table reached its cap, so further label sets fall back to the ordinary metrics macros instead of a reserved slot — correct, just slower on that path. Warned ONCE per table (a latch), never per registration, so it cannot spam."
action = "None — self-heals; the fallback path is correct. If a deployment legitimately needs more distinct label sets than the slot cap, that cap is a build-time bound; the metrics remain accurate via the fallback in the meantime."

