[[diagnostic]]
name = "CONFIG_OVERLAY_CORRUPT_REFUSE_WRITE"
doc = "A read-modify-write apply found the overlay unreadable/corrupt; refuses to overwrite it."
code = 3003
class = "Config"
slug = "config-overlay-corrupt-refuse-write"
title = "Config overlay unreadable/corrupt on apply (refusing to overwrite)"
severity = "Actionable"
summary = "An admin apply tried to read-modify-write the config overlay but found the existing overlay present yet unreadable/corrupt, so busbar REFUSED to overwrite it — a blind overwrite would drop the hook AND group deletion tombstones every section carries and could resurrect a deleted item. This apply was NOT persisted."
action = "Fix or remove the corrupt overlay file to restore durability, then re-apply. Until then admin config mutations cannot be persisted (they are refused, not silently lost)."

[[diagnostic]]
name = "CONFIG_OVERLAY_VERSION_TOO_NEW_RMW"
doc = "A read-modify-write apply found the overlay written by a NEWER busbar; refuses to overwrite it."
code = 3004
class = "Config"
slug = "config-overlay-version-too-new-rmw"
title = "Config overlay written by a newer busbar on apply (refusing to overwrite)"
severity = "Actionable"
summary = "An admin apply found the config overlay was written by a NEWER busbar than this binary, so busbar REFUSED to overwrite it: this binary cannot represent everything the newer overlay holds, and a write would silently discard whatever it does not understand. This apply was NOT persisted."
action = "Apply config mutations from a busbar at least as new as the one that wrote the overlay, or roll the overlay back to a version this binary understands. This binary serves on the overlay it can read but cannot persist changes to it."

[[diagnostic]]
name = "CONFIG_OVERLAY_CORRUPT_BASE_ONLY"
doc = "At boot the overlay is present but corrupt; busbar starts on base config.yaml alone."
code = 3005
class = "Config"
slug = "config-overlay-corrupt-base-only"
title = "Config overlay corrupt at boot (starting on base config.yaml alone)"
severity = "Actionable"
summary = "At boot the config overlay is present but unreadable/corrupt, so busbar fails soft and starts on the base config.yaml ALONE — API-applied hooks (INCLUDING security GATES that enforce admission control), groups, and plugin version pins are NOT restored. Any gate registered only via the admin API is now ABSENT until re-applied. busbar never bricks boot on a corrupt overlay, but it must not disarm those gates silently."
action = "Fix or remove the corrupt overlay file to restore durability, then restart so the API-applied hooks and gates are re-loaded. Until then, re-apply any admin-API gates the deployment depends on, or run on base config.yaml deliberately."

