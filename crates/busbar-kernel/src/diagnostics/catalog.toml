[[diagnostic]]
name = "CONFIG_OVERLAY_VERSION_TOO_NEW"
doc = "At boot the overlay was written by a NEWER busbar; the boot caller refuses to start (fatal)."
code = 3006
class = "Config"
slug = "config-overlay-version-too-new"
title = "Config overlay written by a newer busbar (boot refuses to start)"
severity = "Fatal"
summary = "At boot the config overlay is intact and meaningful but was written by a NEWER busbar than this one. Ignoring it would run without hooks and groups the operator believes are persisted — security gates included — so the boot caller REFUSES to start rather than silently disarm them."
action = "Boot a busbar at least as new as the one that wrote the overlay, or roll the overlay back to a version this binary understands. This is a deliberate boot refusal, not a crash — resolve the version mismatch and restart."

[[diagnostic]]
name = "CONFIG_OVERLAY_PATCH_UNPARSABLE"
doc = "An overlay patch does not parse against this binary's structs; the entry is dropped whole."
code = 3007
class = "Config"
slug = "config-overlay-patch-unparsable"
title = "Config overlay patch does not parse (entry not applied)"
severity = "Actionable"
summary = "The config overlay holds a named-map patch that, merged against base config, does not produce a definition this binary can parse (it faces the same typed `deny_unknown_fields` parse config.yaml does). busbar drops the entry WHOLE rather than half-apply it, so that named definition is never applied and sits inert in the overlay."
action = "Edit or remove the offending overlay entry (the log names the section and entry), then reload. The operator's stored data is untouched; the entry is simply not applied until it parses."

[[diagnostic]]
name = "CONFIG_ANTIDOWNGRADE_FLOOR_INVALID"
doc = "A plugins.min_versions anti-downgrade floor is not valid semver; the control is disarmed."
code = 3008
class = "Config"
slug = "config-antidowngrade-floor-invalid"
title = "plugins.min_versions floor is not valid semver (anti-downgrade disarmed)"
severity = "Actionable"
summary = "A `plugins.min_versions` anti-downgrade floor is not a valid MAJOR.MINOR.PATCH version (e.g. a stray leading `v`). It cannot be satisfied, so the floored plugin is refused, and — more subtly — an operator who believes the anti-downgrade control is armed does not get the protection they configured."
action = "Fix or remove the named `plugins.min_versions` entry so the floor is a bare MAJOR.MINOR.PATCH version. Until then that plugin is refused and the anti-downgrade floor for it is effectively disarmed."

[[diagnostic]]
name = "CONFIG_FIRSTPARTY_FLOOR_INVALID"
doc = "A plugins.first_party_floors floor is not valid semver; the plugin is refused unconditionally."
code = 3009
class = "Config"
slug = "config-firstparty-floor-invalid"
title = "plugins.first_party_floors floor is not valid semver (plugin refused unconditionally)"
severity = "Actionable"
summary = "A `plugins.first_party_floors` floor is not a valid MAJOR.MINOR.PATCH version. It cannot be satisfied, and because a first-party floor REPLACES the binary-version floor, the named plugin is refused UNCONDITIONALLY until this is fixed — a stricter failure than an invalid `min_versions` floor."
action = "Fix or remove the named `plugins.first_party_floors` entry so the floor is a bare MAJOR.MINOR.PATCH version. Until then that first-party plugin is refused on every boot."

[[diagnostic]]
name = "CONFIG_POOL_HETEROGENEOUS"
doc = "A pool mixes upstream protocols; cross-protocol failover translates via the IR and may lose features."
code = 3010
class = "Config"
slug = "config-pool-heterogeneous"
title = "Heterogeneous pool (cross-protocol failover may not preserve all features)"
severity = "Actionable"
summary = "A pool's members span more than one upstream protocol, so cross-protocol failover within the pool translates requests and replies via busbar's internal representation (IR) and may not preserve every provider-specific feature. Advisory: the pool is valid and serves, but mixed protocols carry a fidelity caveat."
action = "None required if intentional. If a feature is being lost across failover, split the pool so each pool is single-protocol, keeping cross-protocol members in a fallback tier rather than the same failover pool."

[[diagnostic]]
name = "CONFIG_RATE_CARD_ALL_ZERO"
doc = "A rate_card entry prices a model at all-zero across every tier: it meters as FREE and uncapped."
code = 3020
class = "Config"
slug = "config-rate-card-all-zero"
title = "rate_card entry prices a model at ALL ZERO (metered as free, uncapped)"
severity = "Actionable"
summary = "A model has a `rate_card` entry present but every tier (input, output, cache_read, cache_write) is zero, so its token usage prices to $0: budget-group `budget:` limits never accrue token cost against it and it is effectively uncapped on spend. This is LEGAL (a deliberately free model is a valid choice, e.g. a self-hosted lane), so it is a WARNING, not a boot error — but an accidental all-zero entry (a paste of the completeness stub left unfilled) silently under-bills every request to that model."
action = "If the model is intentionally free, ignore this. Otherwise fill in the model's `rate_card` rates (micro-units per token) so its usage prices and counts against any `budget:` limit."

[[diagnostic]]
name = "CONFIG_RATE_CARD_MISSING"
doc = "A configured lane lacks rates for declared billable classes; startup continues with a warning."
code = 3026
class = "Config"
slug = "config-rate-card-missing"
title = "Declared billable classes have no configured rate"
severity = "Actionable"
summary = "A plugin declares billable classes for a configured lane, but that lane lacks one or more rates. Startup continues and raw counts remain available. With a present card, missing classes remain unpriced; a rate on another lane does not price them. With no card for the plane, usage-based pricing is disabled. An explicit zero rate is a configured free class, not a missing rate. Class-parent relationships are reporting and cap projections, not inherited prices."
action = "Configure the named lane and classes in the plane's rate_card. Use an explicit zero only for deliberately free usage. Invalid rates, unknown class names and other structural mistakes still prevent startup."

[[diagnostic]]
name = "CONFIG_DESTINATION_NAMES_METADATA"
doc = "An `advanced.allow_destinations` entry names a cloud-metadata destination, which no configuration admits."
code = 3134
class = "Config"
slug = "config-destination-names-metadata"
title = "An allowlist entry names a cloud-metadata destination"
severity = "Fatal"
summary = "An `advanced.allow_destinations` entry is a cloud-metadata host name (such as `metadata.google.internal`), a metadata address (such as `169.254.169.254`, `fd00:ec2::254` or an IPv6 link-local address), or a /32 or /128 network equal to one. Cloud metadata is refused for every outbound connection, in every egress class, and no configuration admits it, so the entry is refused at startup rather than silently ignored. A wider network that merely covers a metadata address (such as `169.254.0.0/16`) loads, and still never admits the metadata address."
action = "Remove the entry named in the message. A workload that needs cloud credentials uses workload-identity federation (IRSA, AKS workload identity, GKE workload identity federation) through a projected token file, never the instance metadata endpoint."

[[diagnostic]]
name = "CONFIG_METADATA_CARVE_OUT_RETIRED"
doc = "A retired 1.5.5 cloud-metadata carve-out key is set; no configuration admits cloud metadata."
code = 3136
class = "Config"
slug = "config-metadata-carve-out-retired"
title = "A retired cloud-metadata carve-out key is set"
severity = "Fatal"
summary = "The configuration sets `security.allow_metadata_hosts`, `security.allow_all_metadata: true` or a provider's `allow_metadata_hosts`. In 1.6.0 cloud metadata is refused for every outbound connection, in every egress class, and no configuration admits it, so these 1.5.5 carve-outs are retired. The configuration is refused rather than read with the carve-out ignored. `security.blocked_metadata_hosts` still extends the denylist."
action = "Run `busbar --migrate-config`: it removes the keys and reports each removed entry (BUSBAR-3411). A workload that needs cloud credentials uses workload-identity federation (IRSA, AKS workload identity, GKE workload identity federation) through a projected token file, never the instance metadata endpoint."

[[diagnostic]]
name = "MIGRATE_PRIVATE_REACH_TO_ALLOWLIST"
doc = "The migration retired a registration's `allow_private` and listed exactly its hosts in `advanced.allow_destinations`."
code = 3410
class = "Config"
slug = "migrate-private-reach-to-allowlist"
title = "A registration's allow_private was replaced by exact advanced.allow_destinations entries"
severity = "Actionable"
summary = "An MCP server (`tools.<server>`) or A2A agent (`agents.<agent>`) set the retired `allow_private`. The migration removed the key and listed exactly the hosts that registration dials in `advanced.allow_destinations` (never a wildcard or a network, never a cloud-metadata host). A plaintext `http://` registration to a non-loopback host is refused at 1.6.0: the planes admit `http://` to loopback only."
action = "Review the listed hosts. Move a non-loopback `http://` registration to `https://`; per-destination plaintext arrives after 1.6.0."

[[diagnostic]]
name = "MIGRATE_METADATA_CARVE_OUT_REMOVED"
doc = "The migration removed a retired 1.5.5 cloud-metadata carve-out key."
code = 3411
class = "Config"
slug = "migrate-metadata-carve-out-removed"
title = "A retired cloud-metadata carve-out key was removed"
severity = "Actionable"
summary = "The migration removed `security.allow_metadata_hosts`, `security.allow_all_metadata` or a provider's `allow_metadata_hosts`, naming each removed entry. 1.6.0 refuses cloud metadata for every outbound connection and no configuration admits it; a destination the carve-out reached is now refused."
action = "If a removed entry reached an instance credential endpoint, move that workload to workload-identity federation (IRSA, AKS workload identity, GKE workload identity federation) through a projected token file."

[[diagnostic]]
name = "PLUGIN_DECLARES_RETIRED_ABI_VALUE"
doc = "A plugin declares a retired ABI value or need shape; the plugin or need is refused."
code = 6013
class = "Plugins"
slug = "plugin-declares-retired-abi-value"
title = "A plugin declares a retired ABI value"
severity = "Fatal"
summary = "A plugin's Statement or need uses something the 1.6.0 ABI retired: the plane trust role `TRUST_PRIVATE_REACH` (4), or an operator-infrastructure need over a framed transport (`http`, `grpc`) that names no config-declared target (`target_from`). The operator-infrastructure class is a property of a target the operator configured, never a plugin's choice. The plugin (for a trust role) or the need is refused, naming what it declared. A carrier need (`tcp`, `unix`) without a declared target is deprecated and refused from 1.7.0."
action = "Upgrade the plugin to a release built against busbar 1.6.0. A plugin author drops the retired role, and declares `target_from` on an operator-infrastructure need."

[[diagnostic]]
name = "PLUGIN_CALL_REFUSED_ABI_RULE"
doc = "A plugin call broke an ABI rule and was refused; flagged once per instance and audited."
code = 6014
class = "Plugins"
slug = "plugin-call-refused-abi-rule"
title = "A plugin call was refused by an ABI rule"
severity = "Actionable"
summary = "A plugin asked for something the ABI does not allow: `dest.judge` under the operator-infrastructure egress class (content-named hosts are judged in the default or open-web class), or a mid-stream upgrade offering a name that is not the dialled host (only a dial to an IP literal may offer another name). The call is refused; the first refusal per instance is logged and audited."
action = "Upgrade the plugin to a release built against busbar 1.6.0, or report the plugin to its author."

[[diagnostic]]
name = "PLUGIN_USES_DEPRECATED_ABI_VALUE"
doc = "A plugin used a deprecated ABI value that is still honoured; flagged once per instance and audited."
code = 6015
class = "Plugins"
slug = "plugin-uses-deprecated-abi-value"
title = "A plugin used a deprecated ABI value (refused from 1.7.0)"
severity = "Actionable"
summary = "A plugin secured an operator-infrastructure connection with `UPGRADE_VERIFY_OFF`, so the far end's certificate is not verified (postgres `sslmode=prefer`, valkey `#insecure`). The value is honoured in 1.6.x, deprecated, and refused from 1.7.0. The first use per instance is logged and audited."
action = "Configure the server with a certificate the plugin can verify (`sslmode=require` or `verify-full`, `rediss://` without `#insecure`); the core trust store for private CAs arrives after 1.6.0."

[[diagnostic]]
name = "CONFIG_PRIVATE_REACH_RETIRED"
doc = "A plane registration sets the retired `allow_private`; the one private-address policy is `advanced.allow_destinations`."
code = 3135
class = "Config"
slug = "config-private-reach-retired"
title = "A registration still carries the retired per-registration private-address switch"
severity = "Fatal"
summary = "A plane registration (an MCP server under `tools:`, an A2A agent under `agents:`) sets `allow_private`. 1.6.0 has one private-address policy for every outbound connection, `advanced.block_private_addresses` with `advanced.allow_destinations`; a per-registration switch that lifted it for one plugin is retired. The configuration is refused, naming the registration, rather than read with the switch ignored or applied."
action = "Run `busbar --migrate-config`: it removes the key and lists exactly that registration's host in `advanced.allow_destinations`. Or do the same by hand: delete `allow_private` and add the host (or its address) to `advanced.allow_destinations`. A cloud-metadata address stays refused whatever is listed."

[[diagnostic]]
name = "CONFIG_PROVIDER_DESTINATION_REFUSED"
doc = "A provider URL names a private or loopback host the destination guard refuses (1.5.5 upgrade)."
code = 3025
class = "Config"
slug = "config-provider-destination-refused"
title = "A provider URL names a private or loopback host the destination guard refuses"
severity = "Actionable"
summary = "A provider's `base_url` or `token_url` names a private or loopback address (an RFC 1918, loopback, link-local, CGNAT or unique-local literal, or the `localhost` name), and `advanced.block_private_addresses` is on (the default) and `advanced.allow_destinations` does not name it. The destination guard refuses every request to it, so the provider would fail on its first request rather than at startup. 1.5.5 had no such guard. Emitted once per URL at config load, naming the provider, the key and the host."
action = "Add exactly that host to `advanced.allow_destinations` (`busbar --migrate-config` adds the hosts a provider's plane reports), or point the provider at a public address. Turning `block_private_addresses` off also admits it, and every other private address with it."

[[diagnostic]]
name = "CONFIG_METADATA_ENTRY_NAMES_NO_HOST"
doc = "RETIRED: a metadata host-list entry that names no host is refused at startup, not warned about."
code = 3024
class = "Config"
slug = "config-metadata-entry-names-no-host"
title = "A metadata host-list entry names no host (it matches nothing and is dropped) — RETIRED"
severity = "Actionable"
summary = "RETIRED. Nothing emits this code: a metadata host-list entry that names no host is refused at startup by config validation, naming the key and the entry."
action = "Nothing emits this code. Fix the entry config validation names."
retired = true

[[diagnostic]]
name = "CONFIG_AUTH_CHAIN_FULL_SCOPE"
doc = "An auth chain entry grants max_admin_scope: full — principals it identifies hold full admin."
code = 3011
class = "Config"
slug = "config-auth-chain-full-scope"
title = "auth.chain entry grants max_admin_scope: full"
severity = "Actionable"
summary = "An auth chain entry sets `max_admin_scope: full`, so every principal identified by that module can hold FULL admin authority — the default ceiling is read-only. A security advisory: a compromised or over-broad identity source behind that module becomes an admin-authority source."
action = "Confirm the named module's chain is trusted end to end and that granting full admin to everyone it identifies is intended. Lower `max_admin_scope` (or scope the module's principals) if full admin is broader than needed."

[[diagnostic]]
name = "CONFIG_OPEN_ADMIN_MINT"
doc = "auth.chain names `keys` and auth.admin_auth is explicitly empty — anyone can mint keys."
code = 3012
class = "Config"
slug = "config-open-admin-mint"
title = "auth.chain names `keys` with an empty admin_auth (anyone can mint virtual keys)"
severity = "Actionable"
summary = "The auth chain names the built-in `keys` verifier while `auth.admin_auth` is explicitly empty, so the admin API has no credential gating it — ANYONE can mint virtual keys through it. Acceptable only for local development."
action = "Configure `auth.admin_auth` (an admin credential entry, or an admin module granting `mint`/`full`) before exposing busbar's admin API to any untrusted network, so key minting is gated by an operator credential."

[[diagnostic]]
name = "CONFIG_PASSTHROUGH_UNUSED_APIKEY"
doc = "upstream_credentials: passthrough with a non-empty configured api_key on a provider; key is inert."
code = 3013
class = "Config"
slug = "config-passthrough-unused-apikey"
title = "passthrough provider has a non-empty api_key that is never forwarded (inert config)"
severity = "Actionable"
summary = "A provider is configured with a NON-EMPTY api_key while `upstream_credentials` is `passthrough`, under which the upstream key is the caller's own token (or empty), so the configured api_key is NEVER forwarded — it is inert dead config. A legitimate passthrough provider may itself sign each request and need no static key, hence a warning rather than a hard reject."
action = "If you intended static-key gating, use `upstream_credentials: own` (plus an auth chain). Otherwise clear the referenced provider secret so the config reflects that no static key is used on that passthrough provider."

[[diagnostic]]
name = "TOKEN_EXCHANGE_MINT_FAILED"
doc = "Token-exchange could not mint a self-serve key — a keystore/HMAC fault, not a client error."
code = 4001
class = "Auth"
slug = "token-exchange-mint-failed"
title = "Token-exchange could not mint a self-serve key"
severity = "Actionable"
summary = "An authenticated, authorized token-exchange request could not be completed because minting the self-serve key failed inside busbar (a keystore write or HMAC/signing fault), so the caller receives a 500. The identity was valid; the failure is on busbar's side, not the client's."
action = "Investigate the keystore / signing subsystem — check disk, permissions, and the key-derivation secret. The condition is rare; capture the logged detail and file a bug if it recurs."

[[diagnostic]]
name = "LOGIN_OFFLOAD_SATURATED"
doc = "A login plugin is not returning, so its offload permit could not be acquired. Warn-once (latched)."
code = 4002
class = "Auth"
slug = "login-offload-saturated"
title = "Login plugin offload saturated (permit not acquired; login rejected fail-closed)"
severity = "Actionable"
summary = "A login-plugin call could not obtain a blocking-offload permit within the wait window because the offload budget is fully in flight — a login plugin is wedged and not returning. busbar rejects the login fail-closed rather than complete a login it never ran. Warned once on entry to the saturated state; recurrence logs at debug."
action = "Investigate the login plugin (its directory bind or identity-provider round-trip) — it is blocking past its timeout. Restore or restart it; the saturation clears once calls return within budget."

[[diagnostic]]
name = "LOGIN_PLUGIN_PANICKED"
doc = "A login plugin's blocking call panicked; the login is rejected fail-closed."
code = 4003
class = "Auth"
slug = "login-plugin-panicked"
title = "Login plugin call panicked (login rejected fail-closed)"
severity = "Actionable"
summary = "A login plugin's blocking call panicked (the offloaded task returned a join error), so busbar rejects the login fail-closed rather than complete a login it never verified. A panicking plugin is a plugin bug."
action = "Fix the login plugin — a panic on the login path is a bug in that plugin. Capture the logged method/op context and the plugin's own logs; logins via that method fail until it is corrected."

[[diagnostic]]
name = "AUTH_CHAIN_OPEN_RELAY"
doc = "The auth chain is empty (open relay) — acceptable only in dev. Boot-time config warning."
code = 4004
class = "Auth"
slug = "auth-chain-open-relay"
title = "auth.chain is empty (open relay)"
severity = "Actionable"
summary = "The auth chain was built with no verifiers and no keys-in-chain, so every data-plane request is admitted unauthenticated — an OPEN RELAY. This is acceptable only for local development. Emitted once when the chain is built."
action = "Configure `auth.chain` (a `keys` verifier and/or an auth plugin) before exposing busbar to any untrusted network. An open relay in production forwards anyone's traffic on your upstream credentials."

[[diagnostic]]
name = "AUTH_OFFLOAD_SATURATED"
doc = "An auth plugin is not returning, so the chain offload permit could not be acquired. Warn-once."
code = 4005
class = "Auth"
slug = "auth-offload-saturated"
title = "Auth chain offload saturated (permit not acquired; request denied fail-closed)"
severity = "Actionable"
summary = "The auth chain could not obtain a blocking-offload permit within the wait window because the offload budget is fully in flight — an auth plugin is wedged and not returning. The chain never ran, so the credential is unverified and busbar denies fail-closed. Warned once on entry to the saturated state; recurrence logs at debug."
action = "Investigate the auth plugin — it is blocking past its timeout and starving the offload budget. Restore or restart it; the saturation clears once chain calls return within budget."

[[diagnostic]]
name = "AUTH_CHAIN_PANICKED"
doc = "The auth chain's blocking task panicked; the request is denied fail-closed. Warn-once (latched)."
code = 4006
class = "Auth"
slug = "auth-chain-panicked"
title = "Auth chain panicked (request denied fail-closed)"
severity = "Actionable"
summary = "The auth chain's blocking task panicked, so busbar denies the request fail-closed rather than admit an unverified credential. A panicking chain is a plugin bug. Warned once on entry to the panicking state; recurrence logs at debug."
action = "Fix the auth plugin — a panic in the chain is a bug in one of its modules. Capture the logged error and the plugin's own logs; requests are denied until it is corrected."

[[diagnostic]]
name = "ADMIN_MODULE_UNRESOLVED"
doc = "admin_auth names a module with no resolved plugin — a post-boot invariant breach."
code = 4007
class = "Auth"
slug = "admin-module-unresolved"
title = "admin_auth names a module with no resolved plugin"
severity = "Actionable"
summary = "The admin auth chain named a module that has no resolved plugin, and busbar skipped it fail-closed. This is supposed to be impossible after a successful boot — `AdminAuthChain::build` fails closed on any unresolvable name — so reaching it means the admin-module table drifted from the configured chain."
action = "Investigate the admin auth configuration and plugin load state; a named admin module is missing at runtime. Restart busbar so boot re-resolves the chain, and file a bug with the logged module name if it persists."

[[diagnostic]]
name = "ADMIN_OFFLOAD_SATURATED"
doc = "An admin auth plugin is not returning; the admin offload permit could not be acquired. Warn-once."
code = 4008
class = "Auth"
slug = "admin-offload-saturated"
title = "Admin auth offload saturated (permit not acquired; request denied fail-closed)"
severity = "Actionable"
summary = "The admin auth chain could not obtain a blocking-offload permit within the wait window because the admin offload budget is fully in flight — an admin auth plugin is wedged and not returning. The chain never ran, so busbar denies fail-closed. Warned once on entry to the saturated state; recurrence logs at debug."
action = "Investigate the admin auth plugin — it is blocking past its timeout. Restore or restart it; admin access is denied until admin-chain calls return within budget."

[[diagnostic]]
name = "ADMIN_CHAIN_STALLED"
doc = "The admin auth chain did not complete within its deadline (or panicked); denied. Warn-once."
code = 4009
class = "Auth"
slug = "admin-chain-stalled"
title = "Admin auth chain did not complete in time (request denied fail-closed)"
severity = "Actionable"
summary = "The admin auth chain's offloaded task did not complete within its deadline, or it panicked, so busbar denies the admin request fail-closed rather than admit an unverified operator. Warned once on entry to the stalled state; recurrence logs at debug."
action = "Investigate the admin auth plugin — it is slow or crashing on the admin path. Restore or restart it; admin access is denied until the chain completes within its deadline."

[[diagnostic]]
name = "ADMIN_FORBIDDEN_SUPPRESSED"
doc = "An admin request was forbidden but its audit record was suppressed (already recorded this window)."
code = 4010
class = "Auth"
slug = "admin-forbidden-suppressed"
title = "Admin request forbidden (audit record suppressed this window)"
severity = "BenignRecurring"
summary = "An admin request was forbidden (insufficient scope for the path), and a durable audit record for it was suppressed because one was already written for this principal in the current rate window. This is a per-request signal of a CLIENT-side authorization failure, not an operator problem, so it is emitted at debug to avoid log spam under a client that keeps retrying a forbidden call."
action = "None — self-heals; the client is being correctly refused. Persistent volume from one principal indicates a misconfigured client or a probe; the durable audit chain already carries the first occurrence per window."

[[diagnostic]]
name = "KEYS_IN_CHAIN_PASSTHROUGH_CONFLICT"
doc = "`keys` in the auth chain configured alongside upstream_credentials: passthrough. Warn-once (latched)."
code = 4011
class = "Auth"
slug = "keys-in-chain-passthrough-conflict"
title = "auth.chain names `keys` alongside upstream_credentials: passthrough"
severity = "Actionable"
summary = "The auth chain names the `keys` verifier while `upstream_credentials` is set to `passthrough`. keys-in-chain requires a valid virtual key on every request and supersedes passthrough's accept-and-forward-the-caller-credential intent, so passthrough never takes effect. Warned once at first request."
action = "Resolve the config conflict: use `upstream_credentials: own` (or omit it) alongside `keys`, or drop `keys` from the chain if you genuinely want to forward caller credentials. The two settings are mutually exclusive."

[[diagnostic]]
name = "SELF_SUBJECT_UNSAFE"
doc = "A client presented a principal id unsafe to use as a self-serve subject — a client error."
code = 4012
class = "Auth"
slug = "self-subject-unsafe"
title = "Token-exchange refused an unsafe self-serve subject"
severity = "BenignRecurring"
summary = "A token-exchange request presented a principal id that is unsafe as a self-serve subject — empty, containing a '/' route separator or a control character, or carrying a reserved `vk_`/`user:`/`group:` prefix — so busbar refused it with a 403. This is a CLIENT-supplied bad value, not an operator problem, so it is emitted at debug to avoid spam from a misbehaving client."
action = "None — self-heals; the client must present a valid subject id. If a legitimate identity is being rejected, its id needs to be reshaped to avoid the reserved prefixes and separators."

[[diagnostic]]
name = "EGRESS_APIKEY_INVALID_BYTES"
doc = "A configured egress API key contains bytes invalid for a header value: the auth plugin that presents a static header omits it and raises this code, at warn, on each request it meets."
code = 4013
class = "Auth"
slug = "egress-apikey-invalid-bytes"
title = "Egress API key contains invalid header bytes (auth header omitted)"
severity = "Actionable"
summary = "A configured static egress credential contains bytes that are invalid in a header value (an ASCII control character, such as a trailing newline), so the auth plugin omits the auth header and the upstream rejects the request with 401. It is raised on each request that would have carried the header."
action = "Fix the credential's configured value: strip the control character (often a trailing newline in the secret's source). Egress to that upstream 401s until it is fixed."

[[diagnostic]]
name = "EGRESS_OAUTH_TOKEN_INVALID_BYTES"
doc = "A minted token contains bytes invalid for a header value: the auth plugin that mints it omits the header and raises this code, at warn, when such a token is minted."
code = 4014
class = "Auth"
slug = "egress-oauth-token-invalid-bytes"
title = "Minted OAuth token contains invalid header bytes (auth header omitted)"
severity = "Actionable"
summary = "A token minted for egress contains bytes invalid in a header value, so the `Bearer` auth header is omitted and the upstream rejects the request with 401. It is raised when such a token is minted."
action = "Investigate the token endpoint: a minted token with a control character in it is malformed. Egress to that upstream 401s until a well-formed token is minted."

[[diagnostic]]
name = "EGRESS_OAUTH_EMPTY_TOKEN"
doc = "The OAuth token endpoint returned a 200 with an empty access_token. Warn-once (latched)."
code = 4015
class = "Auth"
slug = "egress-oauth-empty-token"
title = "OAuth token endpoint returned a 200 with an empty access_token"
severity = "Actionable"
summary = "The upstream OAuth token endpoint answered 200 but with an EMPTY access_token. busbar treats it as a (retryable) mint failure rather than storing it, because an empty token collides with the pre-first-mint sentinel and would wedge the lane permanently. It retries on the refresh cadence."
action = "Investigate the OAuth token endpoint / client-credentials configuration — a 200 with no token usually means a misconfigured client, scope, or audience. Egress to that upstream 401s until a non-empty token is minted."

[[diagnostic]]
name = "EGRESS_OAUTH_MINT_FAILED"
doc = "An OAuth token mint (background refresh) failed; busbar keeps the current token and retries."
code = 4016
class = "Auth"
slug = "egress-oauth-mint-failed"
title = "OAuth token mint (refresh) failed; retrying"
severity = "Actionable"
summary = "The background OAuth token refresh failed to mint a new token. busbar keeps serving the current token and retries soon; if retries keep failing past expiry, egress requests carry a stale/empty token and the upstream 401s. Fires on the refresh cadence, not per request."
action = "Investigate the OAuth token endpoint — a transient outage self-heals on the next retry; sustained failures mean a credential/endpoint/network problem that will 401 egress once the current token expires."

