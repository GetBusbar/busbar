#
# THE HOST DIAGNOSTICS CATALOG, as data. `build.rs` turns each `[[diagnostic]]` into a
# `busbar_kernel::diagnostics::<name>` const and lists them, in this file's order, in `REGISTRY`.
#
# Codes are `BUSBAR-NNNN`: the thousands digit is the class. They are append-only: a retired code
# keeps its number (`retired = true`). Add an entry anywhere (the rendered docs sort by code), then
# regenerate the docs: `UPDATE_DIAGNOSTICS=1 cargo test -p busbar catalogue_tests`.
#
# Keys: `name`, `doc`, `code`, `class` and `severity` (their `busbar_contract::diagnostic` variant
# names), `slug`, `title`, `summary`, `action`; `since` defaults to "1.6.0", `retired` to false. An
# entry with `reexport = "<path>"` names a const defined at that path instead. Strings are TOML basic
# strings on one line (`\n` for a line break); `build.rs` reads only this subset and refuses anything else.
#
# OPERATOR MESSAGES (owner decision 2026-11-12). An entry an operator reads as a message (a config
# refusal, a CLI error, a migration warning) also carries `text`: the message template, `{name}` per
# argument, no trailing period. `build.rs` generates `diagnostics::coded::<name in lower case>(..)`,
# which formats exactly that template (the compiler checks the placeholders) and renders
# `BUSBAR-NNNN: <text>. See https://getbusbar.com/docs/<major.minor>/errors/BUSBAR-NNNN`. Call sites
# never spell a code, a link or the template: they call the constructor. Optional `example` (what
# triggers it) and `example_detail` (the template filled in for it) complete the code's docs page.
# Config/boot refusals take 3101-3399, migration messages 3401-3499, CLI errors 9101-9199, admin
# API errors 8101-8199. The pages are generated: `UPDATE_ERROR_PAGES=1 cargo test -p busbar-kernel
# error_pages`.

