# busbar-oauth2 — the OAuth 2.1 AUTHORIZATION-SERVER plane (`oauth_as:`), extracted out of
# busbar-core into its own sibling crate.
#
# ONE-WAY DEPENDENCY (Cargo-enforced): this crate depends on busbar-core (to reach `CoreRouter`,
# `App`/`AppHandle`, `net_guard`, the diagnostics macros, and the `oauth_as::config` types the
# single-document config pipeline still owns). busbar-core depends on NOTHING here — naming this
# crate from core would be a dependency cycle, which Cargo refuses outright. Core reaches this
# plane's runtime object only through the small seam in `busbar_core::oauth_as::seam`
# (`AsPlaneSeam`), registered once by the composition root (`crates/busbar`), exactly the way
# `App::oauth_as` never names a concrete type on the core side.
#
# `oauth_as::config` (the raw/validated config types `OauthAsCfg`/`AsIdentity`) STAYS in
# busbar-core: `DeployConfig` and its validated twin embed them BY VALUE for the single-document
# config pipeline, and `config_validate::secret_refs` exhaustively destructures `AsIdentity` to
# walk its one secret-bearing field. Moving those types here would need core to name them back,
# which is the forbidden cycle. See `busbar_core::oauth_as` for the full rationale.
[package]
name = "busbar-oauth2"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The busbar OAuth 2.1 authorization-server plane (`oauth_as:`), off unless configured. Depends one-way on busbar-core."
license = "Apache-2.0"

[lib]
name = "busbar_oauth2"
path = "src/lib.rs"

[dependencies]
busbar-core = { path = "../busbar-core", default-features = false }
# The neutral substrate: the CIMD fetch (`cimd.rs`) goes through `busbar_substrate::egress::engine`
# directly — the SAME bounded-body/hop-deadline guard the rest of busbar's egress uses — rather than
# a second copy of it, exactly as it did when this file compiled inside busbar-core (core names this
# crate directly too; it is the shared Tier-0 leaf, not a plane-owned one).
busbar-substrate = { path = "../busbar-substrate" }
busbar-plugin-loader = { path = "../plugin-loader" }
axum = { workspace = true }
base64 = { workspace = true }
ring = { workspace = true }
oauth-as = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
# The plane's own sweeper (`plane::spawn_sweeper`) and the CIMD fetch's hop-deadline timeout are
# PRODUCTION code, not test-only — this is a real (non-dev) dependency, matching what it cost when
# both lived inside busbar-core (a normal dependency there too).
tokio = { workspace = true, features = ["rt", "time"] }
tracing = { workspace = true }
serde = { workspace = true }

[features]
# Pulls busbar-core's own `test-support` feature so `testkit` (which names
# `busbar_core::test_support::TestApp`) resolves for a dependent crate's fixtures, exactly as
# `busbar-mcp`/`busbar-a2a`'s `test-support` do for their own testkits. `cargo test -p busbar-oauth2`
# does not need this flag itself — the dev-dependency below already carries the same core feature —
# but a SIBLING crate that wants to build an `oauth_as:`-configured `TestApp` in its own tests
# enables this to pull `testkit` in as a production (non-dev) capability.
test-support = ["busbar-core/test-support"]

[dev-dependencies]
busbar-core = { path = "../busbar-core", default-features = false, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
axum = { workspace = true, features = ["http1"] }
oauth-as = { workspace = true, features = ["test-util"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
