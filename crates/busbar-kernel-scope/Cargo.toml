# busbar-kernel-scope — the APPROVE step's scope half: the admin-API scope matrix.
#
# WHY A SEPARATE CRATE. The kernel loop's APPROVE step asks one question — does the principal's
# held scope cover what this operation needs. None of that needs a wire format, an HTTP framework,
# or a store: it is a pure function over data, so it gets its own crate with `busbar-contract` as its
# only workspace dependency.
#
# WHAT LIVES HERE. `admin_required_scope(method, path)` — THE admin-API scope matrix, ported from
# 1.5.5's `openapi.json` at the tag (66 operations, 34 read-only / 32 full), which the kernel's admin
# gate calls, proven in its tests against the 1.5.5 admin document in the oracle corpus
# (testing/shadow-oracle/fixtures/openapi-1.5.5.json). The two-rung `Scope` chain
# and the `Grants` bitset are re-exported from `busbar_contract::authz`, their one home.
[package]
name = "busbar-kernel-scope"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The APPROVE step's scope half: the admin-API scope matrix."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_scope"
path = "src/lib.rs"

[dependencies]
busbar-contract = { path = "../busbar-contract" }

[dev-dependencies]
# The table test reads the 1.5.5 admin document (the oracle corpus's openapi-1.5.5.json).
serde_json = { workspace = true }
