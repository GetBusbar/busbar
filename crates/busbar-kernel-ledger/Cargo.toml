[package]
name = "busbar-kernel-ledger"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "Money as counts x the rate card: the dated rate-card history and the one pricing lookup."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_ledger"
path = "src/lib.rs"

[features]
# Dev-dependencies only; never a shipped build.
test-support = []

[dependencies]
hex = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
serde = { workspace = true }
foldhash = { workspace = true }

[dev-dependencies]
stats_alloc = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
tikv-jemallocator = { workspace = true }

[lints]
workspace = true
