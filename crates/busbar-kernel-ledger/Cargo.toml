# busbar-kernel-ledger — money as counts x the rate card: the dated rate-card history and the one
# lookup that prices a set of counts against it. It stores nothing.
[package]
name = "busbar-kernel-ledger"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "Money as counts x the rate card: the dated rate-card history and the one pricing lookup."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_ledger"
path = "src/lib.rs"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
# SHA-256 for a rate-card history entry's id (`cost::EntryId`: the first 12 bytes of SHA-256 of
# the entry's key), on ring, the one crypto backend.
ring = { workspace = true }
# `serde`, for ONE type: an open meter class's configured rate (`cost::UnitRate`, #83a O1 — the
# rate-card representation lives with the card). Its exact-decimal `Deserialize` and its two-form
# `Serialize` are written by hand (no derive, no float): the config text a rate is read from. The
# money-path durable record SHAPES left for the contract crate's `records` module under DECISIONS
# #83/#84, so no durable record is serialized here — the book states what money MEANS; it does not
# define what money LOOKS LIKE on a disk.
serde = { workspace = true }

