[package]
name = "busbar-plugin-bench"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2024"
rust-version = "1.97"
description = "The MIN-3 plugin interface benches (B-SLOTS, B-OPEN, B-CHAIN, B-STORE-LANE, B-SYNC, B-HOLD); one file per bench, each written by its owner."
license = "Apache-2.0"

[lib]
name = "busbar_plugin_bench"
path = "src/lib.rs"

[[bench]]
name = "b_slots"
path = "benches/b_slots.rs"
harness = false

[[bench]]
name = "b_open"
path = "benches/b_open.rs"
harness = false

[[bench]]
name = "b_chain"
path = "benches/b_chain.rs"

[[bench]]
name = "b_store_lane"
path = "benches/b_store_lane.rs"

[[bench]]
name = "b_sync"
path = "benches/b_sync.rs"
harness = false

[[bench]]
name = "b_hold"
path = "benches/b_hold.rs"

[dev-dependencies]
# B-SYNC (W1-H0) times the host side directly.
busbar-plugin-abi = { path = "../busbar-plugin-abi", features = ["host"] }
# B-SYNC REFUSED arm through the auth adapter (W1-L5).
busbar-plugin-loader = { path = "../plugin-loader" }
# B-SLOTS (W1-A3) records the AGREED 209/215 comparison against the slab crate already in core's lock.
sharded-slab = "0.1.7"

[lints]
workspace = true
