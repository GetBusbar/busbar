# busbar-voice-codec — THE VOICE DUPLEX IR AND ITS DIALECT GRAMMARS, with nothing that opens
# anything.
#
# WHY THIS CRATE EXISTS. `busbar-voice` was two things wearing one name: the realtime codecs — the
# plane-4 duplex/session intermediate representation and the dialect readers/writers that map a
# provider's realtime wire onto it — and the runtime that carries them over a live socket (the axum
# mount, the WebSocket accept, the tokio session tasks, the telephony dial, the HTTPS token minter).
# The VOICE PLANE CRATE (`busbar-plane-voice`) adapts the first and must never link the second — a
# plane is a pure kind, and the runtime put `hyper`, `reqwest`, `axum`, `tokio-tungstenite` and a
# socket-capable `tokio` in the pure kind's transitive closure. This crate is the first half, so
# `busbar-plane-voice` can name the IR and the grammars without naming the runtime.
#
# THE RULE THIS CRATE KEEPS. No `hyper`, no `reqwest`, no `axum`, no `tokio` (and no
# `tokio-tungstenite`), and no `std::{net,fs,process,env}` in its own dependencies or its own source.
#
# WHAT STAYED BEHIND in `busbar-voice`: the runtime — the session core and its carrier, the metering
# lease, the scope gate, the route mount, the WebRTC and telephony topologies, the HTTPS minter and
# the conformance binary. `busbar-voice` depends on this crate and re-exports every module that
# moved, so a caller that named `busbar_voice::ir::…` or `busbar_voice::topology::twilio::…` still
# resolves it.
[package]
name = "busbar-voice-codec"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# `rust-version` rationale: see busbar-core/Cargo.toml — one pinned number, set to what CI verifies.
rust-version = "1.97"
description = "The voice duplex codecs for busbar: the plane-4 session intermediate representation (media, control, events, tools, config, usage), the shared duplex reader/writer, the Gemini Live dialect and the Twilio Media Streams grammar — the pure half of the voice protocol, with no I/O in its closure."
license = "Apache-2.0"

[lib]
name = "busbar_voice_codec"
path = "src/lib.rs"

[dependencies]
# The NEUTRAL ABI, PURE HALF, NAMED DIRECTLY: the base64 media transcode the wire dialects frame
# their audio through, and the name-keyed billing carrier the duplex usage projects into.
#
# `busbar-substrate-values` and NOT `busbar-substrate`: the parent crate also carries the egress
# engine (hyper, hyper-util, hyper-rustls, reqwest, a socket-capable tokio), and a plane is a PURE
# kind whose ENTIRE transitive closure is scanned — with one whole-workspace metadata resolve
# unifying features, so no gate could have kept the engine out of this crate's closure while the
# values lived beside it. Nothing here may take a `busbar-substrate` edge back.
busbar-substrate-values = { path = "../busbar-substrate-values", default-features = false }
# The plugin CONTRACTS: the four reserved billing unit names the duplex usage projects itself onto.
# A leaf.
busbar-api = { path = "../api" }
# The plane's OWN media-frame carrier: `IrAudioFrame.media` is opaque `bytes::Bytes`.
bytes = { workspace = true }
# The dialect codecs derive serde on their OWN wire structs and hand-map them to and from the
# neutral IR; opaque JSON payloads (tool arguments, tool definitions, tool_choice) ride as
# `serde_json::Value`.
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# THE SAME `runtime` GATE THE MOVED TWILIO GRAMMAR WAS ALREADY BEHIND. `busbar_voice::topology` is
# gated on `runtime` (OFF by default), so the Twilio Media Streams grammar and its tests were
# compiled out of the default build; the gate travelled with the module so the move changes neither
# what compiles nor what runs. It pulls NOTHING — the grammar is serde and `bytes`, both
# unconditional above — it only decides whether the module exists, exactly as before.
# `busbar-voice`'s own `runtime` forwards to this one so the two answers cannot diverge.
runtime = []

[dev-dependencies]
serde_json = { workspace = true }
