[package]
name = "busbar-kernel-audit"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The audit unit: the fixed audit record every plane contributes to, the signature over each sealed record, and the access and adjustment amendments."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_audit"
path = "src/lib.rs"

[features]
# Dev-dependencies only; never a shipped build.
test-support = []

[dependencies]
busbar-contract = { path = "../busbar-contract" }
ring = { workspace = true }
ed25519-dalek = { workspace = true }
zeroize = { workspace = true }
