[package]
name = "busbar-kernel-audit"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The audit unit: the fixed audit record every plane contributes to, the signature over each sealed record, and the access and adjustment amendments."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_audit"
path = "src/lib.rs"

# B-INTENT: one response intent verified on the request path (median, p99).
[[bench]]
name = "b_intent"
path = "benches/b_intent.rs"
harness = false

[features]
# Dev-dependencies only; never a shipped build.
test-support = []

[dependencies]
hex = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
zeroize = { workspace = true }
foldhash = { workspace = true }
lexopt = { workspace = true }

[lints]
workspace = true
