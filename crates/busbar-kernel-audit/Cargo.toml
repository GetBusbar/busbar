# busbar-kernel-audit — the audit unit.
#
# The fixed audit record every plane contributes to, the amendments that follow it, and the signature
# over each sealed record's digest. The digest formula is a WIRE FACT of records already on disk: a
# digest that moved would make every deployed chain report its own history as tampered at the next
# boot.
#
# DEPENDENCIES.
#   busbar-contract  the audit unit is a unit; sealing a record takes the token for the audit step.
#   sha2         the record digest. The formula is a WIRE FACT of records already on disk.
#   ed25519-dalek the signature over a sealed record's digest. The SAME primitive the plugin
#                signing crate already uses, deliberately: a second curve or a second library
#                would be a second thing to audit and a second way to be wrong. Verify + sign
#                only, no key generation, so this crate stays RNG-free exactly as the artifact
#                signing crate beside it does.
#   zeroize      a decoded seed is wiped before the reader that decoded it returns. Key material
#                that outlives its use is key material in freed heap.
[package]
name = "busbar-kernel-audit"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The audit unit: the fixed audit record every plane contributes to, the signature over each sealed record, and the access and adjustment amendments."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_audit"
path = "src/lib.rs"

[features]
# Test-only hooks a dependent's tests need to reach the node's one amendment journal (an in-memory
# edit, to prove the on-demand verify sees it). Never enabled by a shipped build.
test-support = []

[dependencies]
busbar-contract = { path = "../busbar-contract" }
# The chain digest (SHA-256), on ring (the one crypto backend).
ring = { workspace = true }
ed25519-dalek = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# Independent RustCrypto witness: the tests check ring-computed digests against it byte for byte.
sha2 = { workspace = true }
# The published bodies are JSON; the tests parse them rather than trusting the renderer.
serde_json = { workspace = true }
