[package]
name = "busbar-transport-sse"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The sse transport: request plus N response frames, composed over http."
license = "Apache-2.0"

# DEPENDENCY POLICY. In-tree only. Names `busbar-contract` for the plugin surface,
# `busbar-transport-http` for the request/response byte stream it composes over, and `memchr` for
# the terminator scan — already in the lock through hyper's tree, so it adds no crate to the graph.
[dependencies]
memchr = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
busbar-contract-transport = { path = "../busbar-contract-transport" }
busbar-transport-http = { path = "../busbar-transport-http" }
futures = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
# TEST-ONLY, and only for the seal. The battery needs a kernel-side seal to build the handle and the
# destination a dial takes; minting the capability crate's own token is the seam a deployment uses,
# where declaring a private type and implementing the contract's sealing trait on it was a forgery
# that happened to compile. A dev-dependency never ships in the transport, and the plugin manifest
# allow-list reads `[dependencies]` only, by its own stated narrowing.
busbar-caps = { path = "../busbar-caps" }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "io-util", "time", "macros"] }
