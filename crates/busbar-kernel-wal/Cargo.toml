[package]
name = "busbar-kernel-wal"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The journal codec: the fixed journal record, its hash chain, body fields and the quarantine note the store journal verifies."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_wal"
path = "src/lib.rs"

[dependencies]
ring = { workspace = true }
foldhash = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
