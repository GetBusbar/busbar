[package]
name = "busbar-kernel-wal"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The write-ahead log unit: fixed-size records with overflow continuation, group commit, torn-tail truncation at recovery, poison-on-sync-error, and a memory-buffered mode that touches no disk."
license = "Apache-2.0"

[lib]
name = "busbar_kernel_wal"
path = "src/lib.rs"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
ring = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
