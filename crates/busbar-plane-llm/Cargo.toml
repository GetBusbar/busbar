# busbar-plane-llm — THE LLM PLANE, as an ADAPTER and nothing else.
#
# WHAT THIS CRATE IS. One implementation of the plugin contract's plane kind for the LLM protocol.
# Every method is a thin adapter over the codecs folded into its `codec` module: the dialect readers
# and writers, the intermediate representation, the cross-dialect translator, the stream translator
# and the dialect-shaped error envelopes. No wire format is written twice.
#
# WHAT THIS CRATE IS NOT. There is no governance here, no breaker, no hook seat, and no metering
# arithmetic. Those are units, and a unit is on the other side of the kernel from a plane. The
# metering method returns LOCATORS — where the numbers are — and never a number the ledger would
# post. The routing method returns a plan, never a connection.
#
# THE DEPENDENCY EDGE. The contract crate is the surface a plugin is written against and it stands
# alone; it is the one busbar crate this manifest names. The engine crate the codecs once sat beside
# (`busbar-llm`) is deleted (FLIP-LLM): the plane is served through its door.
[package]
name = "busbar-plane-llm"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# One pinned number, set to what CI verifies — the same rationale every other member states.
rust-version = "1.97"
description = "The LLM plane for busbar: the plugin contract's plane kind implemented as a thin adapter over its dialect codecs."
license = "Apache-2.0"

[lib]
name = "busbar_plane_llm"
path = "src/lib.rs"

# NO FEATURES THAT AFFECT THE PLANE, ON PURPOSE. A plane compiled two ways is two planes, and the
# kernel would have no way to tell which one it registered — [`crate::LlmPlane`] and its `Plugin`
# impl are unconditional, never behind a `#[cfg(feature = …)]`. The contract crate holds itself to
# the same rule and asserts it.
#
# ONE EXCEPTION, CARRIED BY THE `codec` MODULE: it declares `test-support`, EMPTY, purely so
# `#[cfg(any(test, feature = "test-support"))]` on its own test-only constructors
# (`Protocol::anthropic()` and siblings, `leaf_codec`'s per-dialect readers `fuzz` drives directly)
# resolves as a KNOWN feature rather than an unexpected-cfg warning. It gates CODEC test helpers
# only — nothing the registered plane's own methods read — so it stays empty.
[features]
test-support = []

[dependencies]
# THE CONTRACT. The one busbar crate a plugin manifest may name without argument.
busbar-contract = { path = "../busbar-contract" }
# THE CODECS. Read-only from `plane.rs`/`dialect.rs`: this crate calls the dialect readers, writers,
# translator and error-envelope builders and edits none of them. Folded IN as the `codec` module
# (owner ruling R7, 2026-09-27, THE DESIGN section 9/#39: no `busbar-*-codec` crate) rather than named as a
# separate crate — the fold is a pure move, so the dependencies the codecs themselves needed
# (serde/serde_json/sonic-rs/bytes/tracing) are now this crate's own.
serde = { workspace = true }
# The object notation the codecs speak. The adapter hands values across the seam and never invents
# a second parser.
serde_json = { workspace = true }
# The SAME serializer the codecs use. Byte-identity is the point: a document serialized by a second
# library would differ in escaping and in number formatting, and the difference would show up as a
# changed request on the wire rather than as a failing test.
sonic-rs = { workspace = true }
# The codecs' own media/wire byte carrier (event-stream framing, opaque bodies).
bytes = { workspace = true }
# The codecs' own diagnostics.
tracing = { workspace = true }

[dev-dependencies]
# The TEST-ONLY seal (#65). `busbar_contract::plugin::TestKernelSeal` is the one blessed
# fixture implementor of the SEALED `KernelSeal` trait; this crate's test harnesses used to
# forge their own. Dev-only and feature-gated, so it is absent from every release build.
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }
# The codec module's own test host (`codec::test_host`), and the entropy source it arms — the same
# ones the codec's tests used before the fold.
serde_json = { workspace = true }
getrandom = { workspace = true }
# THE DOOR'S BOTH-WAYS WITNESS (`tests/conformance.rs`): the linked door and this crate's own
# dropped-in image (the `llm_door` example below), admitted through the one loader and driven
# through the one dispatcher.
busbar-plugin-loader = { path = "../plugin-loader" }
# THE SHIPPED PROVIDER CATALOG (`tests/exchange_shaping_ported.rs`): `providers.yaml` read as the
# provider entries the plane is handed, so its declared lane capabilities are judged by this plane's
# own shaping.
serde_yaml = { workspace = true }

# THE DROPPED-IN DOOR: built by `cargo test`.
[[example]]
name = "llm_door"
crate-type = ["cdylib"]
