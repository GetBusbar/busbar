# crates/busbar-plane-llm/dialects/openai_responses.toml: the HAND-WRITTEN wire <> IR mapping of
# the OpenAI Responses dialect (stage 0: flat request fields). Format: see openai_chat.toml.

[dialect]
wire = "responses"  # the wire lock: dialects/responses.wire.json (notation A paths)
request = [
    "responses_structure",
    "sampling",
    "openai_family",
    "responses",
]

# Members the dialect's own code models (`prim`). `text` is NOT one: its `format` is
# `response_format`, its other members ride `extra`.
[rows.responses_structure]
"model" = { prim = "model" }
"instructions" = { prim = "system" }
"input" = { prim = "messages" }
"input[].type=reasoning" = { prim = "reasoning" }
"input[].type=function_call.arguments" = { prim = "tool_arguments" }
"reasoning.effort" = { prim = "reasoning" }
"tool_choice.type=allowed_tools.tools" = { prim = "allowed_tools" }
"tools" = { prim = "tools" }
"max_output_tokens" = { prim = "max_output" }
"top_logprobs" = { prim = "logprobs" }
"stream" = { prim = "stream" }
"tool_choice" = { prim = "tool_choice" }
"parallel_tool_calls" = { prim = "parallel_tool_calls" }
"user" = { prim = "user" }

# Sampling Responses spells as OpenAI Chat does.
[rows.sampling]
"temperature" = { ir = "temperature" }
"top_p" = { ir = "top_p" }

# The Q57 request members Responses and Chat spell alike (ir-slots-landed.md IR-03..06). A raw
# member the slot cannot reproduce is parked in `extra` (same-dialect fidelity).
[rows.openai_family]
park = true
"metadata" = { ir = "metadata" }
"service_tier" = { ir = "service_tier" }
"store" = { ir = "store" }
"safety_identifier" = { ir = "safety_identifier" }
"prompt_cache_key" = { ir = "prompt_cache_key" }

# `text.verbosity` (IR-07), beside the `text.format` the dialect writes from `response_format`.
[rows.responses]
park = true
"text.verbosity" = { ir = "verbosity" }

# Paths no row maps although another dialect maps a field of the same name (`dialect-candidates`).
[unmapped.request]
"input[].type=additional_tools.tools" = { no-equivalent = "tools added mid-conversation by an additional_tools item; the IR declares tools once per request" }
"input[].type=additional_tools.tools[].type=image_generation.model" = { no-equivalent = "the image-generation tool's own model, not the request's model; the IR has no image-generation tool" }
"input[].type=additional_tools.tools[].type=namespace.tools" = { no-equivalent = "a tool namespace's member tools; the IR has no tool namespaces" }
"input[].type=configuration_update.reasoning" = { no-equivalent = "a mid-conversation reasoning reconfiguration item; the IR reasoning ask is per request" }
"input[].type=configuration_update.reasoning.effort" = { no-equivalent = "a mid-conversation reasoning reconfiguration item; the IR reasoning ask is per request" }
"input[].type=custom_tool_call.input" = { no-equivalent = "a replayed custom-tool call's free-text input; the IR tool call carries function arguments only" }
"input[].type=mcp_approval_request.arguments" = { no-equivalent = "the arguments of a replayed hosted-MCP approval request; the IR has no hosted MCP calls" }
"input[].type=mcp_call.arguments" = { no-equivalent = "the arguments of a replayed hosted-MCP call; the IR has no hosted MCP calls" }
"input[].type=tool_search_call.arguments" = { no-equivalent = "the arguments of a replayed tool-search call; the IR has no tool search" }
"input[].type=additional_tools.tools[].type=mcp.allowed_tools" = { no-equivalent = "the tools a hosted MCP server may expose, not the tool-choice subset; the IR has no hosted MCP tool" }
"input[].type=tool_search_output.tools[].type=mcp.allowed_tools" = { no-equivalent = "the tools a hosted MCP server may expose, not the tool-choice subset; the IR has no hosted MCP tool" }
"tools[].type=mcp.allowed_tools" = { no-equivalent = "the tools a hosted MCP server may expose, not the tool-choice subset; the IR has no hosted MCP tool" }
"moderation.policy.input" = { no-equivalent = "OpenAI's moderation policy for the input; no other dialect has a moderation pass" }
"input[].type=local_shell_call.action.user" = { no-equivalent = "the OS user of a replayed local-shell call; the matched `user` is the end-user identifier member" }
"input[].type=mcp_list_tools.tools" = { no-equivalent = "a replayed MCP tool listing (Responses' hosted MCP record); the IR has no MCP listing" }
"input[].type=message.content[].type=output_text.logprobs" = { no-equivalent = "log probabilities of a replayed assistant answer in history; the IR logprobs are an answer's, not a request's" }
"input[].type=message.content[].type=output_text.logprobs[].top_logprobs" = { no-equivalent = "log probabilities of a replayed assistant answer in history; the IR logprobs are an answer's, not a request's" }
"input[].type=tool_search_output.tools" = { no-equivalent = "tools returned by a replayed tool-search call; the IR has no tool search" }
"input[].type=tool_search_output.tools[].type=image_generation.model" = { no-equivalent = "the image-generation tool's own model, not the request's model; the IR has no image-generation tool" }
"input[].type=tool_search_output.tools[].type=namespace.tools" = { no-equivalent = "a tool namespace's member tools; the IR has no tool namespaces" }
"moderation.model" = { no-equivalent = "the model of OpenAI's moderation pass, not the request's model; no other dialect has a moderation pass" }
"tools[].type=image_generation.model" = { no-equivalent = "the image-generation tool's own model, not the request's model; the IR has no image-generation tool" }
"tools[].type=namespace.tools" = { no-equivalent = "a tool namespace's member tools; the IR has no tool namespaces" }

# Controls beyond the rows. The /v1/responses create API models no top_k, stop, penalties, seed or n
# (openai-python ResponseCreateParamsBase); each drop is warned in these words and audited. The
# output-modality drop is the writer's own code (reported as `modalities`); custom tools are flat
# tools[] entries.
[controls]
"top_k" = { warn = "responses writer: the /v1/responses API models no `top_k` parameter; dropping top_k (lossy-by-target)" }
"stop" = { warn = "responses writer: the /v1/responses API models no `stop` parameter; dropping {count} stop sequence(s) (lossy-by-target)", value = true }
"frequency_penalty" = { warn = "responses writer: the /v1/responses API models no `frequency_penalty`; dropping it (lossy-by-target)", value = true }
"presence_penalty" = { warn = "responses writer: the /v1/responses API models no `presence_penalty`; dropping it (lossy-by-target)", value = true }
"seed" = { warn = "responses writer: the /v1/responses API models no `seed`; dropping it (lossy-by-target)", value = true }
"n" = { warn = "responses writer: the /v1/responses API models no `n` candidate-count; dropping it (lossy-by-target)", value = true }
"output_modalities" = { code = "responses_modalities" }
"custom_tool" = { code = "responses_custom_tools" }

# The response `service_tier` (the tier that SERVED the answer, RSP-17) <> the IR attribution word
# (the Anthropic vocabulary: `default` IS `standard`). The OpenAI-family words are written as-is so
# a tier that arrived in that vocabulary is not lost.
[words.served_tier]
"standard" = { wire = "default" }
"default" = { wire = "default", dir = "write" }
"priority" = { wire = "priority" }
"flex" = { wire = "flex", dir = "write" }
"scale" = { wire = "scale", dir = "write" }
