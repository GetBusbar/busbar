# crates/busbar-plane-llm/dialects/gemini.toml: the HAND-WRITTEN wire <> IR mapping of the Gemini
# generateContent dialect (stage 0: flat request fields). Format: see openai_chat.toml.

[dialect]
wire = "gemini"  # the wire lock: dialects/gemini.wire.json (notation A paths)
label = "Gemini"
request = ["structure", "generation_config", "tier"]
drop_warn = "dropping a request control on Gemini egress: generateContent has no form for it"

# Members the dialect's own code models (`prim`). `generationConfig` is NOT one: it rides `extra`
# raw so its unmodelled members survive, and the rows below overlay it.
[rows.structure]
"contents" = { prim = "messages" }
"tools" = { prim = "tools" }
"systemInstruction" = { prim = "system" }
"generationConfig.maxOutputTokens" = { prim = "max_output" }
"generationConfig.responseLogprobs" = { prim = "logprobs" }
"generationConfig.logprobs" = { prim = "logprobs" }
"tools[].googleSearch" = { prim = "web_search" }
"model" = { prim = "model" }
"__busbar_gemini_json_array" = { prim = "json_array_shim", off_wire = "busbar's own marker for a caller that asked for the JSON-array stream; stripped before egress" }

# `generationConfig` rides `extra` raw; these rows overlay it. 1.5.4 silent-degrade: a stop list
# past Gemini's cap of 5 is truncated, not refused.
[rows.generation_config]
"generationConfig.temperature" = { ir = "temperature" }
"generationConfig.topP" = { ir = "top_p" }
"generationConfig.topK" = { ir = "top_k" }
"generationConfig.stopSequences" = { ir = "stop", cap = 5 }
"generationConfig.frequencyPenalty" = { ir = "frequency_penalty" }
"generationConfig.presencePenalty" = { ir = "presence_penalty" }
"generationConfig.seed" = { ir = "seed" }
"generationConfig.candidateCount" = { ir = "n" }

# The service tier (Gemini `serviceTier`: standard / flex / priority) and the request-logging
# switch (`store`), the members OpenAI Chat and Responses spell `service_tier` / `store`. A raw
# member the slot cannot reproduce (`unspecified`) is parked in `extra` (same-dialect fidelity).
[rows.tier]
park = true
"serviceTier" = { ir = "service_tier", words = "service_tier" }
"store" = { ir = "store" }

[words.service_tier]
"default" = { wire = "standard" }
"flex" = { wire = "flex" }
"priority" = { wire = "priority" }

# Controls beyond the rows: `labels` (validated per entry) and `responseModalities` are the
# dialect's own code.
[controls]
"metadata" = { code = "gemini_labels" }
"output_modalities" = { code = "gemini_response_modalities" }

# Paths no row maps although another dialect maps a field of the same name (`dialect-candidates`).
[unmapped.request]
"generationConfig.responseFormat" = { no-equivalent = "Gemini's output-media format object (audio, image, text mime type and schema); the dialect reads structured output from responseMimeType / responseSchema, and no other dialect has the audio and image delivery settings" }
"tools[].fileSearch.topK" = { no-equivalent = "the file-search tool's retrieval count, not the sampling top_k; the IR has no file-search tool" }
"tools[].googleSearch.searchTypes.webSearch" = { no-equivalent = "googleSearch's corpus selector; the IR web search has no corpus choice (the tool itself is carried, its sub-config dropped with a warn)" }
