# crates/busbar-plane-llm/dialects/anthropic.toml: the HAND-WRITTEN wire <> IR mapping of the
# Anthropic Messages dialect (stage 1: request, response and stream). Format: see openai_chat.toml.

[dialect]
wire = "anthropic"  # the wire lock: dialects/anthropic.wire.json (notation A paths)
request = ["structure", "sampling", "tier", "blocks"]
response = ["response"]
stream = ["stream"]
drop_warn = "dropping {slot} on Anthropic egress: the Messages API has no such request                      member (lossy-by-target)"
drop_field = "parameter"

# Members the dialect's own code models (`prim`). `metadata` (its `user_id` is `user`), `thinking`
# and `output_config` are read by code and otherwise ride `extra`.
[rows.structure]
"max_tokens" = { prim = "max_output" }
"messages" = { prim = "messages" }
"model" = { prim = "model" }
"stream" = { prim = "stream" }
"system" = { prim = "system" }
"tool_choice" = { prim = "tool_choice" }
"tools" = { prim = "tools" }
"metadata.user_id" = { prim = "user" }
"output_config.effort" = { prim = "reasoning" }
"messages[].content[].type=tool_use.input" = { prim = "tool_arguments" }

# Thinking: Anthropic refuses a modified sampling knob beside a thinking ask; the ask wins and the
# knob is omitted, observably. The temperature clamp is to Anthropic's [0.0, 1.0] (it 422s above).
[rows.sampling]
"temperature" = { ir = "temperature", clamp = [0.0, 1.0], clamp_warn = "clamping temperature to Anthropic's [0.0, 1.0] range; the requested value was outside it (e.g. an OpenAI/Responses value up to 2.0) and would 422 — the forwarded value diverges from the caller's request", clamp_parameter = true, drop_if = "thinking", drop_warn = "omitting temperature on Anthropic egress: not compatible with thinking" }
"top_p" = { ir = "top_p", drop_if = "thinking", drop_warn = "omitting top_p on Anthropic egress: not compatible with thinking" }
"top_k" = { ir = "top_k", drop_if = "thinking", drop_warn = "omitting top_k on Anthropic egress: not compatible with thinking" }
"stop_sequences" = { ir = "stop" }

# IR-04: Anthropic serves `auto` and `standard_only`; Priority asks `auto` (Priority capacity when
# the org has it); Flex / Scale have no form and are dropped.
[rows.tier]
"service_tier" = { ir = "service_tier", words = "service_tier", park = true }

[words.service_tier]
"auto" = { wire = "auto" }
"default" = { wire = "standard_only" }
"priority" = { wire = "auto", dir = "write" }

# The request members inside the message, tool and config structure that the dialect's own code
# reads and writes (`prim`: structure is code; the walker does not walk these rows).
[rows.blocks]
"messages[].role" = { prim = "role" }
"messages[].content" = { prim = "content" }
"messages[].content[].type=text.text" = { prim = "text" }
"messages[].content[].type=image.source.type=base64" = { prim = "base64" }
"messages[].content[].type=image.source.type=file" = { prim = "file" }
"messages[].content[].type=image.source.type=url" = { prim = "url" }
"messages[].content[].type=image.source.type=base64.media_type" = { prim = "media_type" }
"messages[].content[].type=image.source.type=base64.data" = { prim = "data" }
"messages[].content[].type=document.source.type=base64" = { prim = "base64" }
"messages[].content[].type=document.source.type=content" = { prim = "content" }
"messages[].content[].type=document.source.type=file" = { prim = "file" }
"messages[].content[].type=document.source.type=text" = { prim = "text" }
"messages[].content[].type=document.source.type=url" = { prim = "url" }
"messages[].content[].type=document.source.type=text.media_type" = { prim = "media_type" }
"messages[].content[].type=document.source.type=base64.media_type" = { prim = "media_type" }
"messages[].content[].type=document.source.type=text.data" = { prim = "data" }
"messages[].content[].type=document.source.type=base64.data" = { prim = "data" }
"messages[].content[].type=document.title" = { prim = "title" }
"messages[].content[].type=tool_use.id" = { prim = "id" }
"messages[].content[].type=tool_use.name" = { prim = "name" }
"messages[].content[].type=tool_result.tool_use_id" = { prim = "tool_use_id" }
"messages[].content[].type=tool_result.content" = { prim = "content" }
"messages[].content[].type=document.source.type=file.file_id" = { prim = "file_id" }
"messages[].content[].type=document.source.type=content.content" = { prim = "content" }
"messages[].content[].type=redacted_thinking.data" = { prim = "data" }
"messages[].content[].type=text.cache_control" = { prim = "cache_control" }
"messages[].content[].type=text.citations" = { prim = "citations" }
"messages[].content[].type=image.source.type=url.url" = { prim = "url" }
"messages[].content[].type=image.cache_control" = { prim = "cache_control" }
"messages[].content[].type=tool_use.cache_control" = { prim = "cache_control" }
"messages[].content[].type=tool_result.is_error" = { prim = "is_error" }
"messages[].content[].type=tool_result.cache_control" = { prim = "cache_control" }
"messages[].content[].type=thinking.thinking" = { prim = "thinking" }
"messages[].content[].type=thinking.signature" = { prim = "signature" }
"messages[].content[].type=document.source.type=url.url" = { prim = "url" }
"messages[].content[].type=document.context" = { prim = "context" }
"messages[].content[].type=document.citations" = { prim = "citations" }
"messages[].content[].type=document.cache_control" = { prim = "cache_control" }
"messages[].content[].type=search_result.source" = { prim = "source" }
"messages[].content[].type=search_result.title" = { prim = "title" }
"messages[].content[].type=search_result.content" = { prim = "content" }

# The answer members the dialect's reader and writer carry (`prim`: code carries them).
[rows.response]
"id" = { prim = "id" }
"type" = { prim = "type" }
"role" = { prim = "role" }
"model" = { prim = "model" }
"content" = { prim = "content" }
"stop_reason" = { prim = "finish_reason" }
"stop_sequence" = { prim = "stop_sequence" }
"usage.input_tokens" = { prim = "input_tokens" }
"usage.output_tokens" = { prim = "output_tokens" }
"usage.cache_creation_input_tokens" = { prim = "cache_write_tokens" }
"usage.cache_read_input_tokens" = { prim = "cache_read_tokens" }
"usage.cache_creation.ephemeral_5m_input_tokens" = { prim = "ephemeral_5m_input_tokens" }
"usage.cache_creation.ephemeral_1h_input_tokens" = { prim = "ephemeral_1h_input_tokens" }
"usage.server_tool_use.web_search_requests" = { prim = "web_search_requests" }
"usage.service_tier" = { prim = "served_tier" }

# The stream events the dialect's stream reader and writer carry (`prim`: code carries them).
[rows.stream]
"type=message_start" = { prim = "message_start" }
"type=content_block_start" = { prim = "content_block_start" }
"type=content_block_delta.delta.type=text_delta" = { prim = "text_delta" }
"type=content_block_delta.delta.type=input_json_delta" = { prim = "input_json_delta" }
"type=content_block_delta.delta.type=thinking_delta" = { prim = "thinking_delta" }
"type=content_block_delta.delta.type=signature_delta" = { prim = "signature_delta" }
"type=content_block_delta.delta.type=citations_delta" = { prim = "citations_delta" }
"type=content_block_stop" = { prim = "content_block_stop" }
"type=message_delta" = { prim = "message_delta" }
"type=message_stop" = { prim = "message_stop" }

# Controls beyond the rows: the Messages API models no penalties, seed or candidate count; each
# drop is warned in these words, naming the value, and audited.
[controls]
"frequency_penalty" = { warn = "dropping frequency_penalty on Anthropic egress: the Messages API models no such sampling control (lossy-by-target)", value = true }
"presence_penalty" = { warn = "dropping presence_penalty on Anthropic egress: the Messages API models no such sampling control (lossy-by-target)", value = true }
"seed" = { warn = "dropping seed on Anthropic egress: the Messages API models no deterministic-sampling seed (lossy-by-target)", value = true }
"n" = { warn = "dropping n on Anthropic egress: the Messages API returns a single completion and models no candidate-count parameter (lossy-by-target)", value = true }
"service_tier" = { warn = "dropping service_tier on Anthropic egress: Anthropic offers only auto /                      standard_only capacity (lossy-by-target)", value = true }
