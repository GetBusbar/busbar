# busbar-plane-llm-openai — THE `openai` DIALECT OF THE `llm` PLANE, AND THE FIRST CRATE OF ITS KIND.
#
# WHAT A DIALECT IS. One wire vocabulary through one plane. The plane owns what a request MEANS —
# the IR, the step list, the operation classes, the meter CLASSES — and a dialect owns how one
# vendor spells it: which paths and headers name it, where the model is, where the four metered
# quantities are, which credential its clients present. The kind exists because those two things
# change on different clocks: a vendor ships a seventh spelling and a plane that carried a branch
# per vendor would be edited for it.
#
# THE ONE EDGE. A dialect names its plane and the contract, and NOTHING ELSE — no transport, no
# unit, no sibling dialect, not even another plane. That is the narrowest edge set in the plugin
# tree, and it is what makes `busbar-plane-llm` dialect-neutral while its wire surface stays open:
# the dialect names the plane, the plane never names the dialect. `kind-isolation:deps` refuses the
# reverse.
#
# HOW IT REGISTERS: BY CLAIM, NOT BY A MATCH ARM. This crate declares its ladder rungs and its
# location row as constants, and a composition root seals them into the plane's registry at boot.
# Nothing in `busbar-plane-llm` spells `openai` for this to work. Adding an eighth dialect is adding
# a crate and a registry entry; it is not a patch to the plane.
#
# WHY THE CODEC IS A DEV-DEPENDENCY AND NOT A DEPENDENCY. The translation this dialect performs is
# the PLANE'S OWN CODE, reached through `decode_ingress_as` and its three siblings with this
# crate's row as the argument. There is no second implementation here to keep in step, so
# byte-identity with the reference codec is not a property this crate tests for — it is the same
# statements running. The codec crate appears below only under `[dev-dependencies]`, and only to
# turn on the self-registering declaration seam the plane's own test binary turns on for the same
# reason: a test process runs no composition root. A dev edge is not a shipped edge, and
# `kind-isolation` scores it by the battery rule and by nothing else.
[package]
name = "busbar-plane-llm-openai"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# One pinned number, set to what CI verifies — the same rationale every other member states.
rust-version = "1.97"
description = "The openai dialect of the busbar LLM plane: the claim rungs, the locations and the meter locators for OpenAI Chat Completions, registering into busbar-plane-llm by claim."
license = "Apache-2.0"

[lib]
name = "busbar_plane_llm_openai"
path = "src/lib.rs"

# NO FEATURES, ON PURPOSE, and for the reason the plane states: a dialect compiled two ways is two
# dialects, and the registry that sealed one of them could not say which.

[dependencies]
# THE CONTRACT. The one busbar crate a plugin manifest may name without argument.
busbar-contract = { path = "../busbar-contract" }
# ITS PLANE, AND THE ONLY OTHER CRATE THIS ONE MAY NAME. The claim builder, the location row shape,
# the registry entry and the four dialect-parameterised codec bodies all come from here.
busbar-plane-llm = { path = "../busbar-plane-llm" }

[dev-dependencies]
# THE PLANE, AND THE CODEC'S SELF-REGISTERING TEST SEAM. A test binary runs no composition root, so
# the dialect declarations the translation resolves against are registered by the codec crate's own
# test seam instead — exactly as `busbar-plane-llm`'s test binary does it. Test targets only.
busbar-llm-codec = { path = "../busbar-llm-codec", features = ["test-support"] }
serde_json = { workspace = true }
