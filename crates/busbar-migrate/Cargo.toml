[package]
name = "busbar-migrate"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The boot's one-time 1.5.5 -> 1.6.0 config migration (MIGRATE-ON-BOOT): cold library code the gateway calls only for an unstamped config. Library only: no binary, no plugin loader, no store driver."
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

# Separation (MIGRATE-ON-BOOT §7): YAML only through busbar_contract::yaml, digests only through
# busbar_contract::crypto; no plugin-loader, no store driver, no postcard, no sha2. The kernel is
# the config grammar vocabulary the kept passes read (interpolation, the hostless-entry and
# zero-cache-write rules, the rate encoding), never the strict parse (the gateway's `check`).
[dependencies]
busbar-contract = { path = "../busbar-contract" }
busbar-kernel = { path = "../busbar-kernel", default-features = false }
busbar-kernel-ledger = { path = "../busbar-kernel-ledger" }
serde = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true

# `counted`: the test-build call counter (MIGRATE-ON-BOOT §9 C1 (sz2)). The gateway's tests turn it
# on through their dev-dependency to assert that a stamped boot enters no function of this crate
# and an unstamped one plans and writes once. Off in every shipped build.
[features]
counted = []
