# busbar-core-policy — THE HOOK POLICY ENGINE. Kind: core.
#
# THE NAME. A crate is `busbar-<kind>-<name>`, named by what it IS. This is the POLICY engine: it
# decides which hook runs, with which grants, on which terminal, out of which pool's configuration.
# It is not a hook plugin — `hooks` is the marker word of the hook-plugin kind (`busbar-hook-*`,
# `busbar-hooks-*`), and a core crate wearing another kind's marker was the fusion `kind-isolation:name`
# exists to refuse. It landed once as `busbar-core-hooks` on a waiver; the waiver is struck with the
# rename, and the `[[renamed]]` row in qa/kind-isolation.toml is how history is read across it.
#
# WHAT IT IS. The engine that turns a pool's `route:`/`hooks:` configuration into resolved policy
# transports, fires them, and reads what they answered: `resolve_policy`, the three pool resolvers
# (ordering / gates / rewrites), the gate decision, `push_configure`, the transport-publish wait,
# the status/schema reads, the settings-drift keys, the single-flight resolution cache, and the
# `/metrics/hooks` scrape. The kernel seats a hook plugin after Admit; deciding WHICH hook, with
# WHICH grants, on WHICH terminal is policy, and policy is core's.
#
# WHAT IT MUST NEVER NAME. No plane, no dialect, no transport. Its whole vocabulary is the hook
# CONTRACT (`busbar-api`'s `RoutingPolicy` and its projections, `busbar-substrate::hooks::wire`) plus
# the config leaf structs the operator wrote. A request reaches the gate as an `IrFacts` projection
# and nothing else — that is what "protocol-blind" means here, and it is checkable by reading this
# manifest: there is no `busbar-llm`, no `busbar-mcp`, no `busbar-a2a`, no `busbar-transport-*` in it,
# and there is no `busbar-core` either.
#
# DEPENDENCIES, each with its reason.
#   busbar-api          the hook contract itself: `RoutingPolicy`, `RoutingRequest`, `Candidate`,
#                       `RoutingDecision`, the prompt/identity projections, the signal catalog.
#   busbar-substrate    the config leaf structs the engine reads (`HookCfg`/`PoolCfg`/the access and
#                       terminal enums), the neutral hook wire projection, the `IrFacts` projection a
#                       gate screens, the per-session substrate the incremental screen cache is a
#                       tenant of, the secret resolver, and the installed-limits slot.
#   busbar-plugin-loader the hybrid-ABI registry a `kind: hook` plugin is resolved out of, and the
#                       shared hook projectors.
#   tokio               the resolvers offload a `dlopen` onto the blocking pool with a deadline; the
#                       scrape refreshes stale hooks off the request path.
#   axum                the one `IntoResponse` the hook-facing reply normalizer builds.
[package]
name = "busbar-core-policy"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The hook policy engine: resolving a pool's configured hooks into policy transports, firing them, and reading what they answered. Names no plane, no dialect and no transport."
license = "Apache-2.0"

[lib]
name = "busbar_core_policy"
path = "src/lib.rs"

[dependencies]
busbar-api = { path = "../api" }
busbar-substrate = { path = "../busbar-substrate" }
busbar-substrate-values = { path = "../busbar-substrate-values" }
busbar-plugin-loader = { path = "../plugin-loader" }
# The MANIFEST's declared needs (`NeedLevel`) — what a hook's author said it needs to see. The engine
# intersects that declaration with what the operator granted; both halves have to be nameable here or
# the intersection would be computed somewhere that cannot see one of them.
busbar-plugin-sign = { path = "../plugin-sign" }
# THE BUILT-IN RANKING HOOKS, AND THEY STAY A PLUGIN. `native_policy` hands back a `RoutingPolicy`
# — the same contract a dlopened hook is reached through — so the engine calls it the same way and
# knows nothing else about it. Optional and feature-gated exactly as it was in busbar-core, so the
# deletion test (`--no-default-features`) still compiles the ranking strategies out and a
# `route: cheapest` is still a boot-time config error rather than a silent SWRR.
busbar-hooks-ranking = { path = "../hooks-ranking", optional = true }
serde = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
tracing = { workspace = true }
axum = { workspace = true }

[features]
default = ["hooks-ranking"]
hooks-ranking = ["dep:busbar-hooks-ranking"]
# The readiness signal a battery in ANOTHER crate waits on (`await_transport_published`, and the two
# single-flight predicates under it). It is a real observable — "has the load actually published" —
# rather than a wall clock bet on the dynamic linker, which is why it has to be reachable at all;
# `cfg(test)` alone would not exist for the caller's test build.
test-support = []

[dev-dependencies]
# The engine's battery dlopens a REAL hook plugin rather than a mock, because "the plugin answered
# this" is the only claim worth making about an ABI. `hook-test-plugin` is that plugin; the fixture
# packages it exactly as the shipped packer does.
busbar-plugin-testkit = { path = "../plugin-testkit", features = ["loader-fixtures"] }
busbar-plugin-sign = { path = "../plugin-sign" }
busbar-substrate-values = { path = "../busbar-substrate-values", features = ["test-support"] }
# The relocated limits assertion takes `busbar_substrate::config::limits::LIMITS_TEST_LOCK`, which
# the substrate gates behind `cfg(any(test, feature = "test-support"))`. Declared HERE rather than
# leaned on: without this edge the crate's own `cargo test -p busbar-core-policy` does not compile,
# and it only ever passed because a workspace-wide run unified the feature in from another crate.
busbar-substrate = { path = "../busbar-substrate", features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
tracing-subscriber = { workspace = true }
