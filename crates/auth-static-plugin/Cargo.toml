# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-static-plugin"
version = "1.5.0"
publish = false            # internal TEST-support cdylib; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "A hermetic static-token kind:auth plugin cdylib used by the full-chain auth-plugin seam tests (no network; a fixed token maps to a fixed identity + roles)."
license = "Apache-2.0"

[lib]
# cdylib for the C ABI delivery; rlib so the SAME source can ALSO be linked compiled-in. Both
# crate-types, because #11's claim is that a plugin compiled into the binary and the same plugin
# dropped into `plugins/` are one plugin over one contract — and a claim with one artifact has no
# way to be tested. The `plane` and `export` fixtures already carry both and already hold the only
# two both-ways witnesses in the tree (`plugin-loader/src/tests/{plane,export}_conformance_tests.rs`);
# this crate was the one fixture that could not, being cdylib-only.
#
# ADDING THE ARTIFACT IS NOT THE WITNESS — the witness is `plugin-loader`'s
# `src/tests/auth_conformance_tests.rs`, #2's ordered cost walked in full: the SDK's
# `dispatch_auth_enveloped` (1), the `dispatch_compiled_in` twin `export_auth_plugin!` emits beside
# `busbar_call` (2), this crate's `pub fn open` (3), `plugin-loader`'s dev-dependency on this crate
# (4), and the test (5), which drives `open` through the twin (compiled in) and this crate's `cdylib`
# over the C ABI (dropped in) and requires the two wires to be byte-identical. The `rlib`'s
# `BUSBAR_COLD_ENTRY` is also registered through `PluginRegistry::link` there, beside the same
# `cdylib` signed into `plugins/`: one row, one module.
crate-type = ["cdylib", "rlib"]

[dependencies]
busbar-api = { path = "../api" }
busbar-plugin-sdk = { path = "../plugin-sdk" }
serde = { workspace = true }
serde_json = { workspace = true }
