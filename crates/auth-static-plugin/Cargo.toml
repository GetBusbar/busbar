# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-static-plugin"
version = "1.5.0"
publish = false            # internal TEST-support cdylib; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "A hermetic static-token kind:auth plugin cdylib used by the full-chain auth-plugin seam tests (no network; a fixed token maps to a fixed identity + roles)."
license = "Apache-2.0"

[lib]
# cdylib for the C ABI delivery; rlib so the SAME source can ALSO be linked compiled-in. Both
# crate-types, because #11's claim is that a plugin compiled into the binary and the same plugin
# dropped into `plugins/` are one plugin over one contract — and a claim with one artifact has no
# way to be tested. The `plane` and `export` fixtures already carry both and already hold the only
# two both-ways witnesses in the tree (`plugin-loader/src/tests/{plane,export}_conformance_tests.rs`);
# this crate was the one fixture that could not, being cdylib-only.
#
# ADDING THE ARTIFACT IS NOT THE WITNESS. `open` below is still private and there is no
# `dispatch_compiled_in` twin of the `busbar_call` symbol `export_auth_plugin!` emits, so nothing
# can yet drive the compiled-in door. The blocking piece is upstream of this crate:
# `busbar_plugin_sdk::dispatch_export_enveloped` is the ONLY enveloped dispatch the SDK has (#85
# covered `export` and no other kind), and the envelope is what makes "observationally identical"
# testable at all. See the report in the commit that added this comment.
crate-type = ["cdylib", "rlib"]

[dependencies]
busbar-api = { path = "../api" }
busbar-plugin-sdk = { path = "../plugin-sdk" }
serde = { workspace = true }
serde_json = { workspace = true }
