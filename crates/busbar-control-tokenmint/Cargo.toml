# busbar-control-tokenmint — busbar's OAuth 2.1 authorization server, as a CONTROL-kind crate.
#
# WHAT A CONTROL CRATE MAY NAME, and why this list is short. A control surface is an unmetered way
# of reaching busbar's controls and obtaining a credential; it is not a data plane and runs none of
# the metered steps. It declares its routes as DATA (`src/claims.rs`), carries its own bodies
# (`src/answer.rs`), fails with the contract's one structured error and ships its catalog beside
# its claims (`src/catalog.rs`). It names the CONTRACT, the crates that speak its own protocol, and
# the cryptography it signs with — and NOTHING of a transport, a plane, a dialect, a unit, the
# substrate or core. `kind-isolation` measures that: this crate's only busbar edge is
# `busbar-contract`.
[package]
name = "busbar-control-tokenmint"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "busbar as an OAuth 2.1 authorization server: the control-kind crate that mints credentials for the clients an identity team will not register."
license = "Apache-2.0"

[lib]
name = "busbar_control_tokenmint"
path = "src/lib.rs"

[dependencies]
# THE ONE BUSBAR EDGE. The structured error every refusal is (`PluginError`), the catalog shape the
# crate ships beside its claims (`Catalog`), and the path grammar the route table is written in
# (`PathSeg`). This crate builds no kernel view and holds no capability token, so it takes no edge
# on the capability crate — the manifest below is the whole of what it names.
busbar-contract = { path = "../busbar-contract" }
# THE PROTOCOL. `oauth-as` is the RFC 6749/8414/7591/9068/9207 implementation this crate serves;
# the crate is the deployment's policy around it, not a second copy of it.
oauth-as = { workspace = true }
# The `http` 1.x request/response VOCABULARY the neutral `answer` is written in. Naming `http` is
# not naming a transport: nothing here binds, listens or frames — the composition hands a parsed
# request across and takes a response back.
http = { workspace = true }
bytes = { workspace = true }
# ES256 over `ring` — the crypto the tree already links as rustls's provider, rather than a SECOND
# complete elliptic-curve implementation. See `src/signer.rs`'s header for the measurement.
ring = { workspace = true }
# base64: the JOSE alphabet for the JWKS coordinates, and the PKCS#8 document the operator hands in.
base64 = { workspace = true }
serde = { workspace = true }
# The Client ID Metadata Document is JSON this crate validates itself; `src/cimd.rs`.
serde_json = { workspace = true }
# The consent screen's `?return=` query and its form body: the same decoder the framework
# extractors used, so a query this deployment used to accept is one it still accepts.
serde_urlencoded = { workspace = true }
# The sweeper: `Storage::sweep_expired` is the only thing that reclaims anything in `oauth-as`, and
# it runs when it is called and never otherwise.
tokio = { workspace = true, features = ["rt", "time", "macros"] }
# Two `debug!` lines on the CIMD path, both routine authorization denials, and one on the sweep.
tracing = { workspace = true }

[features]
# Exposes `CimdStore::set_fetcher` and `cimd::NoDocuments` to a DEPENDENT crate's tests — the
# end-to-end flow proof drives a whole node and therefore lives in the composition's crate rather
# than this one. Never on in a release build.
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# `oauth_as::signer_conformance` — the UPSTREAM harness `src/tests/signer_tests.rs` drives the
# ES256 signer through, against the RFC 7515 appendix A.3 vector.
oauth-as = { workspace = true, features = ["test-util"] }
