# busbar-unit-auth — the authenticate step, as a unit.
#
# WHY IT DEPENDS ON NOTHING BUT THE CAPABILITY CRATE. A unit answers exactly one step and is handed
# exactly one token for the length of one call. If it could name the kernel it could reach past the
# token; if it could name a transport it would grow a second opinion about what a credential is. So
# the only edge out of this crate is `busbar-caps`, which is where the token and the answer type
# live. Everything the chain needs from the outside — the header carriers, the credential digest,
# the key verifier, the revocation set — arrives as a trait the caller implements.
[package]
name = "busbar-unit-auth"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The authenticate step as a unit: the credential chain, the credential cache, the carriers, the challenge, and the protocol-claim ladder."
license = "Apache-2.0"

[lib]
name = "busbar_unit_auth"
path = "src/lib.rs"

[dependencies]
busbar-caps = { path = "../busbar-caps" }
busbar-contract = { path = "../busbar-contract" }
# Optional: only pulled in by the `sha256` feature, for the production `CredentialDigest`
# (`cache::Sha256Digest`). Kept optional so the crate stays dependency-free by default — see the
# WHY note above and `cache::CredentialDigest`'s doc.
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[features]
# A production `CredentialDigest` (1.5.5's hex SHA-256) for callers who would rather take the
# `sha2`/`hex` dependency than supply their own. Off by default.
sha256 = ["dep:sha2", "dep:hex"]

[dev-dependencies]
# Test-only, and only exercised under `--features sha256`: the reference `sha256_hex` the
# `Sha256Digest` jitter-parity test compares against. Never a default-build dependency.
busbar-api = { path = "../api" }

