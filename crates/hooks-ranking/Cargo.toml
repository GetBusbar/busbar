[package]
name = "busbar-hooks-ranking"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The ranking hook for busbar: cheapest / fastest / least_busy / usage order-gates over the hook kind's decide view."
license = "Apache-2.0"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
# The settings document `open` reads (already in the contract's closure).
serde_json = { workspace = true }

[dev-dependencies]
# THE DOOR'S CONFORMANCE WITNESS (`tests/conformance.rs`, the loader's only user here): the linked
# door admitted through the one loader and driven through the one dispatcher (the plugin's own
# conformance witness, the transport crates' pattern). Any other file naming the loader makes this
# an ungranted test edge (kind-isolation:test-deps, :closure).
busbar-plugin-loader = { path = "../plugin-loader" }
