# busbar-plane-a2a — THE A2A PLANE, as an ADAPTER and nothing else.
#
# WHAT THIS CRATE IS. One implementation of the plugin contract's plane kind for the agent-to-agent
# protocol. Every method is a thin adapter over a codec that already exists in `busbar-a2a`: the
# JSON-RPC envelope reader and writer, the task-operation vocabulary, the error envelopes and the
# push-notification shapes. No wire format is written twice. If a byte differs between what this
# crate produces and what the existing codec produces, the existing codec is the answer and this
# crate has the bug.
#
# WHAT THIS CRATE IS NOT. There is no governance here, no breaker, no hook seat, no signing key and
# no metering arithmetic. Those are units, and a unit is on the other side of the kernel from a
# plane. The metering method returns LOCATORS — where the numbers are — and never a number the
# ledger would post. The routing method returns a plan, never a connection. The plane's durable
# state — the tasks, the push configurations, the pins — is reached only through record legs on that
# plan, never through a store this crate holds.
#
# THE DEPENDENCY EDGE, STATED HONESTLY. The contract crate is the surface a plugin is written
# against and it stands alone. `busbar-a2a` is named here for the codec vocabulary only, and it is
# a heavier crate than a pure plane's dependency rule would like: it carries an HTTP stack, a gRPC
# stack, an async runtime and the engine that still lives beside its codec. That is a finding about
# where the codec sits today, not a decision taken here — the adapter itself names no runtime, opens
# nothing, holds no connection and reads no clock but the one the context hands it.
[package]
name = "busbar-plane-a2a"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# One pinned number, set to what CI verifies — the same rationale every other member states.
rust-version = "1.97"
description = "The A2A plane for busbar: the plugin contract's plane kind implemented as a thin adapter over the busbar-a2a task-operation codec."
license = "Apache-2.0"

[lib]
name = "busbar_plane_a2a"
path = "src/lib.rs"

# NO FEATURES, ON PURPOSE. A plane compiled two ways is two planes, and the kernel would have no way
# to tell which one it registered. The contract crate holds itself to the same rule and asserts it.

[dependencies]
# THE CONTRACT. The one busbar crate a plugin manifest may name without argument.
busbar-contract = { path = "../busbar-contract" }
# THE CODEC. Read-only from here: this crate calls the JSON-RPC envelope vocabulary, the task-op
# names and the error envelopes, and edits none of them.
busbar-a2a = { path = "../busbar-a2a" }
# The object notation the codec speaks. The adapter hands values across the seam and never invents
# a second parser.
serde_json = { workspace = true }
