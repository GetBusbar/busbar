[package]
name = "busbar-plugin-abi"
version = "1.6.0"
publish = false            # internal workspace crate; plugins name it by git
edition = "2024"
rust-version = "1.97"
description = "The MIN-3 plugin interface: the records codec, Host services, Need steps, the plugin header and the seven kind traits (ABI-MIN3-INTERFACE §2-§10). Wave 0 lands it as compiling stubs."
license = "Apache-2.0"

[lib]
name = "busbar_plugin_abi"
path = "src/lib.rs"

[features]
default = []
# Core's side: answers, the buffer pool, the Need driver, the entry guard, the Host static and the scrubber (§10).
host = ["busbar-ffi/host", "dep:busbar-crypto", "dep:aho-corasick", "dep:arc-swap", "dep:base64", "dep:percent-encoding", "dep:hex"]
# The in-memory hyper/tokio IO adapter transports use (§9).
memio = []

[dependencies]
zerocopy = { version = "0.8", features = ["derive"] }
# The plugin boundary (UNSAFE-MIN r3.1): the views, Host table, Out sink, Plugin header, chain bytes and the 7 layouts live there; this crate re-exports them. `host` forwards its loader side.
busbar-ffi = { path = "../busbar-ffi" }
# Feature `host` (IF §1): the crypto facade the Host marshals onto (never the backend), the scrubber's automaton,
# lock-free snapshot swap and the encodings its needles are matched in. The arena/needle wipes use the unconditional zeroize below.
busbar-crypto = { path = "../busbar-crypto", optional = true }
aho-corasick = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
# The volatile wipe of a Reply block before it is freed (I11; IF §1 names zerocopy + zeroize). Never `Zeroizing`.
zeroize = { workspace = true }

[lints]
workspace = true
