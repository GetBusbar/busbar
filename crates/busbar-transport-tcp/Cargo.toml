[package]
name = "busbar-transport-tcp"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The tcp transport: a byte stream, the base every session transport composes over."
license = "Apache-2.0"

[lib]
# rlib: the linked door (a build that links this crate hands the loader `hot::TRANSPORT_DECL`) and
# the tests. cdylib: the dropped-in door — the same decl, exported as `busbar_transport_decl` for the
# loader to `dlopen` (#3: a transport is swappable, compiled in OR dropped in, over the HOT lane).
crate-type = ["rlib", "cdylib"]

# DEPENDENCY POLICY. A transport is a plugin (#3), so its closure is `busbar-contract` plus the async
# runtime and stream plumbing it actually needs: no plane, no kernel crate, no capability crate, and
# not the crate that defines the HOT lane either — `src/hot.rs` restates the published layout it
# implements (#84: a layout, not a crate).
[dependencies]
tokio-util = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
futures = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "io-util", "time"] }

[dev-dependencies]
# The TEST-ONLY seal (#65). `busbar_contract::plugin::TestKernelSeal` is the one blessed
# fixture implementor of the SEALED `KernelSeal` trait; this crate's test harnesses used to
# forge their own. Dev-only and feature-gated, so it is absent from every release build.
busbar-contract = { path = "../busbar-contract", features = ["test-seal"] }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "io-util", "time", "macros", "test-util"] }
