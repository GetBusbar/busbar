[package]
name = "busbar-transport-tcp"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The tcp transport: an identity framer over the host's byte stream."
license = "Apache-2.0"

[lib]
# rlib: the linked door (`linked::door`) and the tests. cdylib: the dropped-in door — the same door
# exported through the one symbol (`exports`, feature `dropped-in`).
crate-type = ["rlib", "cdylib"]

# DEPENDENCY POLICY. A transport is a plugin, so its closure is `busbar-contract` and nothing else it
# does not need. This one needs nothing else: the socket, its readiness and its clock are the host's.
[features]
# THE DROPPED-IN DOOR (`exports`): the door exported as its image's one symbol through the contract's
# `export_door!`. OFF in a build that links this crate (the linked door is `linked::door`); the
# dropped-in artifact is built on its own: `cargo build -p busbar-transport-tcp --release --features
# dropped-in`.
dropped-in = []

[dependencies]
busbar-contract = { path = "../busbar-contract" }

[dev-dependencies]
# THE BOTH-WAYS WITNESS (`tests/conformance.rs`): the linked door and this crate's own dropped-in
# image, admitted through the one loader and driven through the one dispatcher.
busbar-plugin-loader = { path = "../plugin-loader" }
busbar-transport-tcp = { path = ".", features = ["dropped-in"] }
