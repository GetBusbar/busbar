[package]
name = "busbar-plugin-sdk"
version = "1.5.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "SDK for writing busbar store plugins in Rust: implement the Store trait, call export_store_plugin!(ctor), build as a cdylib. Emits the extern-C glue for the busbar store ABI."
license = "Apache-2.0"

# AUTHOR-SIDE PACKAGING (roster def 14) DOES NOT LIVE HERE. The `busbar-plugin-pack` CLI moved to
# `busbar-plugin-loader` (a `[[bin]]` behind that crate's `pack` feature; batch 68/69 D1). DECISIONS
# #84 is owner-locked -- "a plugin's busbar closure is EXACTLY busbar-plugin-sdk; the SDK's own busbar
# closure is EMPTY" -- and `kind-isolation:closure` scores the UNION of feature configurations: an
# optional `pack` feature here put `busbar-plugin-loader`, `busbar-kernel-ledger` and
# `busbar-kernel-wal` (the money one-book) into the closure of every plugin that names this crate.
# Do not add a feature or a dependency here that reaches the loader.

[dependencies]
# For the tracing->host bridge (`hostlog::install_tracing_bridge`). A plugin's own `tracing` calls
# are otherwise discarded: the cdylib links its own dispatcher and nothing joins it to the host's.
tracing = { workspace = true }
tracing-core = { workspace = true }
busbar-contract = { path = "../busbar-contract" }
busbar-plugin = { path = "../busbar-plugin" }
serde_json = { workspace = true }

[dev-dependencies]
busbar-store-memory = { path = "../store-memory" }
# The boundary_class integration test names the ABI status codes directly (STATUS_PANIC etc.).
busbar-plugin = { path = "../busbar-plugin" }
