[package]
name = "busbar-plugin-sdk"
version = "1.5.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "Source-compatibility name for the busbar plugin SDK, which lives in busbar-contract (busbar_contract::abi::sdk) since DECISIONS #84 merged the two. Re-exports it, adds nothing."
license = "Apache-2.0"

# THE SDK IS `busbar_contract::abi::sdk` (DECISIONS #84: the SDK and the contract share one
# definition, "the plugin contract", so they MERGED into busbar-contract). This package holds no code
# of its own: it is the NAME a plugin built against an older busbar still spells —
# `busbar-plugin-sdk = { git = "https://github.com/GetBusbar/busbar", rev = <.busbar-ref> }` — so a
# pinned plugin keeps building unchanged (#84: "a kernel change shouldn't mean all 3rd party plugins
# need updating"). The composition root pulls such a plugin at a pinned rev (the request-log file
# sink, GetBusbar/export-file) and `[patch]`es this name to this directory. A plugin written today
# names busbar-contract directly; this name goes when no pulled plugin's pin spells it any more.
#
# Its whole busbar closure is busbar-contract (#40(a)). Add nothing here: a dependency or a feature on
# this package is one in the closure of every plugin that still names it.
[lib]
path = "src/compat.rs"

[dependencies]
busbar-contract = { path = "../busbar-contract" }
