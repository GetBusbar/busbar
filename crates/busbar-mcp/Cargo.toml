# busbar-mcp — THE MCP (Model Context Protocol) PLUGIN NAME, now a thin RE-EXPORT SHIM.
#
# The fat crate has drained (DECISIONS #19/#20/#21/#1). What `busbar-mcp` held splits four ways: the
# pure codec (`busbar-mcp-codec`), the shared transport crates, the purity-scanned contract adapter
# (`busbar-plane-mcp`), and the impure bridged-ABI host (`busbar-plane-mcp-host`) — which now holds the
# whole MCP plane (the substrate `PlaneDecl`, the runtime slot, `serve_stdio`, the testkit, the money
# files and the engine glue). This crate keeps the NAME alive so every `busbar_mcp::…` caller — the
# binary's `PROTO_DECL`/`PLANE_DECL`/`DIAGNOSTICS` install sites and the plane's test references —
# resolves unchanged; it depends only on the host crate and forwards its feature edges. The name is
# deleted once every caller repoints onto `busbar-plane-mcp-host` directly.
[package]
name = "busbar-mcp"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# `rust-version` rationale: see busbar-core/Cargo.toml — one pinned number, set to what CI verifies.
rust-version = "1.97"
description = "The Model Context Protocol for busbar, as a removable plugin: a thin re-export shim over busbar-plane-mcp-host (the plane) and busbar-mcp-codec (the wire codec)."
license = "Apache-2.0"

[lib]
name = "busbar_mcp"
path = "src/lib.rs"

[dependencies]
# THE HOST CRATE — the MCP plane's whole runtime surface (the substrate `PlaneDecl`, the runtime slot,
# `serve_stdio`, the testkit, the plane-contributed diagnostics, the money files and the engine glue),
# plus the codec re-exports it forwards from `busbar-mcp-codec`. Every item this shim exposes is a
# forward of its one definition there.
busbar-plane-mcp-host = { path = "../busbar-plane-mcp-host" }

[features]
# EVERY FEATURE FORWARDS to the host crate that now owns the gated sources, so enabling
# `busbar-mcp/<feature>` resolves exactly the same `#[cfg]`s it always did — the binary's
# `busbar-mcp?/openapi-schema` forward, busbar-core's and busbar-admin's dev-dep
# `features = ["test-support", "auth-admin-tokens"]`, all cascade to `busbar-plane-mcp-host`.
openapi-schema = ["busbar-plane-mcp-host/openapi-schema"]
auth-admin-tokens = ["busbar-plane-mcp-host/auth-admin-tokens"]
test-support = ["busbar-plane-mcp-host/test-support"]
