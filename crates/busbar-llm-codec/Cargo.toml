# busbar-llm-codec — THE LLM WIRE CODECS, with nothing that opens anything.
#
# WHY THIS CRATE EXISTS. `busbar-llm` was two things wearing one name: the six dialect codecs (the
# readers, the writers, the neutral IR, the stream translator, the answer-normalization pass) and
# the money-path engine that carries those codecs over the network (attempt, exhaustion, select,
# native ingress). The LLM PLANE adapts the first and must never link the second — a plane is a pure
# kind, and the engine's HTTP stack put `hyper`, an async runtime and a socket-capable `tokio` in the
# plane's transitive closure. This crate is the first half, so `busbar-plane-llm` can name the codecs
# without naming the engine.
#
# THE RULE THIS CRATE KEEPS. No `hyper`, no `reqwest`, no `hyper-util`, no `tokio`, no `axum`, and no
# `std::{net,fs,process,env}` in its own dependencies or its own source. The HTTP vocabulary (types
# only — `StatusCode`, `HeaderMap`, `HeaderName`, `HeaderValue`), reached through the contract's
# `http` re-export, replaces what used to be reached as `axum::http::*`: the same types, without
# axum's server.
#
# WHAT STAYED BEHIND in `busbar-llm`: the engine, the native ingress, the path-model arrivals, the
# plane declaration, the testkit and the inbound webhook receiver — everything that reads a socket,
# a clock or a process. `busbar-llm` depends on this crate and re-exports every module that moved,
# so a caller that named `busbar_llm::proto_codec::…` still resolves it.
[package]
name = "busbar-llm-codec"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
# `rust-version` rationale: see busbar-kernel/Cargo.toml — one pinned number, set to what CI verifies.
rust-version = "1.97"
description = "The LLM wire codecs for busbar: the anthropic, openai-chat, gemini, bedrock, openai-responses and cohere readers/writers, the neutral IR, the stream translator and the answer-normalization pass — the pure half of the LLM protocol, with no I/O in its closure."
license = "Apache-2.0"

[lib]
name = "busbar_llm_codec"
path = "src/lib.rs"

[features]
# Declared for the dependents that name it (`busbar-llm`, `busbar-plane-llm` test builds). EMPTY since
# #83a SD-3: this crate's test surface is dev-only — its test registration reaches the host through
# its OWN dev-dependency on the kernel — so no dependent build of this crate names the host.
test-support = []
# Declared for `busbar-llm`, which forwards its own `timing` flag here. EMPTY since #83a SD-3 (owner
# ruling O9): the plane drops the per-method micro-timing instrumentation, so the flag arms nothing.
timing = []
# The CI-only OpenAPI schema derive. DECLARED but EMPTY: this crate carries no `schemars` derive and
# no `#[cfg(feature = "openapi-schema")]` site of its own. The feature stays declared because
# `busbar-llm` names it.
openapi-schema = []

[dependencies]
# THE CONTRACT — the one busbar crate this plane names (#83/#83a). Every value family a codec speaks
# that the host must spell identically — the protocol declaration it fills, the codec-cell traits,
# the IR shapes, the billing, media and wire carriers, the operation vocabulary — is a contract
# shape, and the host services a codec reaches (the entropy source, the wall clock, the translation
# cap, the usage-tap count) are installed by the host behind contract seams. The header vocabulary
# (`StatusCode`, `HeaderMap`, `HeaderName`, `HeaderValue`) is reached through the contract's `http`
# re-export, so this crate names no HTTP crate of its own.
#
# NOTHING HERE MAY OPEN ANYTHING. No `hyper`, no `reqwest`, no `tokio`, no `axum`, no host crate: the
# plane is a pure kind whose whole closure is scanned.
busbar-contract = { path = "../busbar-contract" }
# The plane's own JSON seam (`json.rs`) funnels every body parse and serialize through sonic-rs (SIMD
# on the large string-heavy LLM bodies); `serde` names the traits it is generic over and
# `serde_json::Value` is the document it produces.
serde = { workspace = true }
serde_json = { workspace = true }
sonic-rs = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The host, for this crate's own tests only: the test registration seam (which also arms the host
# services a shipped binary's composition root arms), the drift guards that hold this plane's copies
# of the JSON seam, the event-stream codec, the dialect helpers and its coded diagnostics to the
# host's, the egress-auth unit a dialect's declared credential scheme is asserted through, and the
# warn-capture layer the tests assert coded diagnostics through. A dev edge only, so no shipped
# target links the host.
busbar-kernel = { path = "../busbar-kernel", features = ["test-support"] }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
# The usage-tap count pin records the host's counter through a local `metrics` recorder.
metrics = { workspace = true }
# ONE relocated registry test asserts the registry's handling of a codec-LESS registered protocol
# using the real MCP declaration (`busbar_mcp::PROTO_DECL`). A dev-dep back-edge; not linked into any
# shipped target.
busbar-mcp = { path = "../busbar-mcp" }
