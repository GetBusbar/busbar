# THE PLUGIN FLEET'S DEPENDENCY POLICY (ARCHITECT ruling 3a, PLUGIN-TEMPLATE, 2026-10-01).
#
# Two homes, one fact each:
#   - SHARED crates (anything busbar itself also uses) live in busbar's root Cargo.toml
#     [workspace.dependencies], exactly as they do for busbar's own members. No second copy here.
#   - PLUGIN-ONLY crates, the git sources (GetBusbar forks at pinned revs), the banned list, the
#     socket/TLS ban and the C-dependency allow-list live HERE.
# A crate may not appear in both (the fleet tool's `plugin sync` refuses the render).
#
# This file MOVES WITH THE BUSBAR PIN: the fleet tool's `plugin sync` reads it
# (and the root table, the toolchain and Cargo.lock) at the busbar commit each plugin repo pins in
# `.busbar-ref`, and renders it into that repo's root Cargo.toml [workspace.dependencies] and
# [patch.crates-io], deny.toml and dependabot ignores. The fleet tool's plugin
# harness enforces the rest at the same commit: the net ban, the C-dependency allow-list and Cargo.lock parity with busbar's lock (RED,
# ruling 3b). Adding a plugin-only crate is one reviewed row here; a plugin naming a crate in neither
# table is a new row first.
schema = 1

# ── Plugin-only crates ────────────────────────────────────────────────────────────────────────────
# Rendered as `name = { version, default-features, features }`; `repos` and `reason` are for review.
[plugin-deps.ldap3]
version = "0.12"
default-features = false
features = ["sync"]
repos = ["busbar-auth-ldap"]
reason = "TESTS ONLY: the LDAP client the ldap auth module's live end-to-end test seeds its directory with, plaintext and no TLS feature. Never in the shipped image: the module speaks LDAP through its own sans-IO codec over the host's connector (busbar-auth-ldap#8; StartTLS through the host, #11), and [net-ban] refuses ldap3 in the shipped closure."

[plugin-deps.multer]
version = "3.1"
default-features = false
repos = ["busbar-plane-llm"]
reason = "the multipart/form-data parser the llm plane's screened (hook-gated) units parse the caller's form with before rebuilding it canonically, so the upstream reads exactly the form the gate judged; LADDER step 1 (AGREED §4, 209), #![forbid(unsafe_code)], no socket; cargo-vet audit recorded under AGREED 284 (hook-screening canonical forwarding §4)."

[plugin-deps.mysql]
version = "28"
default-features = false
features = ["minimal-rust"]
repos = ["busbar-store-mysql"]
reason = "TESTS ONLY: the upstream MySQL/MariaDB driver the mysql store's live tests verify what landed with, independently of the store. Never in the shipped image (the store reaches its server only over the host's connector, busbar-store-mysql#15)."

[plugin-deps.mysql_common]
version = "0.35"
default-features = false
repos = ["busbar-store-mysql"]
reason = "the sans-IO MySQL client protocol (packets, handshake, auth plugins, values) the mysql store speaks over the host's connector; no socket of its own (busbar-store-mysql#15)."

[plugin-deps.postgres]
version = "0.19"
repos = ["busbar-store-postgres"]
reason = "TESTS ONLY: the upstream Postgres driver (tokio-postgres underneath) the postgres store's live tests verify what landed with, independently of the store. Never in the shipped image: the store reaches its server only over the host's connector (busbar-store-postgres#20), and [net-ban] refuses postgres and tokio-postgres in the shipped closure."

[plugin-deps.postgres-protocol]
version = "0.6.11"
repos = ["busbar-store-postgres"]
reason = "the sans-IO Postgres frontend protocol (the messages, SCRAM-SHA-256 and md5) the postgres store speaks over the host's connector, the codec the 1.5.5 `postgres` driver encoded with; no socket of its own. 0.6.11 is the floor: 0.6.10 carries RUSTSEC-2026-0179/0180."

[plugin-deps.postgres-types]
version = "0.2"
repos = ["busbar-store-postgres"]
reason = "the Postgres binary value encodings (`ToSql`/`FromSql`) the 1.5.5 `postgres` driver read and wrote every parameter and column with; pure encoding, no socket."

[plugin-deps.fallible-iterator]
version = "0.2"
repos = ["busbar-store-postgres"]
reason = "the iterator type `postgres-protocol`'s message bodies hand back (the postgres store walks DataRow and RowDescription fields with it); pure."

[plugin-deps.redis]
version = "1"
default-features = false
features = ["script"]
repos = ["busbar-store-valkey"]
reason = "TESTS ONLY: the upstream Valkey client the valkey store's live tests verify what landed with, independently of the store (the plugin crate's live tests add the `tls-rustls` feature to verify the store's TLS through the host's connector; tests only). Never in the shipped image: the store speaks RESP itself over the host's connector (busbar-store-valkey#19), and [net-ban] refuses redis in the shipped closure."

[plugin-deps.rusqlite]
version = "0.42"
features = ["bundled"]
repos = ["busbar-store-sqlite"]
reason = "the SQLite store's engine, with SQLite compiled in (libsqlite3-sys bundled, on the C allow-list below)."

[plugin-deps.ulid]
version = "1"
repos = ["busbar-store-mysql"]
reason = "TESTS ONLY: sortable ids the mysql store's conformance battery writes (a dev-dependency since busbar-store-mysql#15)."

[plugin-deps.pbjson]
version = "0.9"
repos = ["busbar-plane-a2a"]
reason = "the ProtoJSON mapping of the a2aproject's gRPC messages the a2a plane generates from its vendored `a2a.proto` (ARCHITECT ruling Q1 (C), 2026-10-04: the plane generates its messages; no gRPC server stack in a plane's closure). Moved here from busbar's root table when the a2a plane left busbar for its own repo (row 106): nothing in busbar names it."

[plugin-deps.prost-build]
version = "0.14"
default-features = false
repos = ["busbar-plane-a2a"]
reason = "BUILD ONLY: the a2a plane's `build.rs` generates the a2aproject's prost messages from its vendored `a2a.proto` (ARCHITECT ruling Q1 (C), 2026-10-04). Never in the shipped image. Moved here from busbar's root table with the plane (row 106). Default features off: the `format` feature pulls prettyplease, which the C-dependency/cdeps gate refuses, and the generated messages are compiled, not read, so they need no pretty-printing."

[plugin-deps.pbjson-build]
version = "0.9"
repos = ["busbar-plane-a2a"]
reason = "BUILD ONLY: the a2a plane's `build.rs` generates the ProtoJSON serde for those messages (ARCHITECT ruling Q1 (C), 2026-10-04). Never in the shipped image. Moved here from busbar's root table with the plane (row 106)."

[plugin-deps.protoc-bin-vendored]
version = "3"
repos = ["busbar-plane-a2a"]
reason = "BUILD ONLY: the protoc the a2a plane's `build.rs` drives, vendored so the build needs no system protoc (ARCHITECT ruling Q1 (C), 2026-10-04). Never in the shipped image. Moved here from busbar's root table with the plane (row 106)."

[plugin-deps.sonic-number]
version = "=0.1.3"
repos = ["busbar-plane-decisions"]
reason = "the JSON number reader sonic-rs uses. The decisions plane reads a number with it exactly as ingress does: exponent capped at 1000, 19 significant digits kept. It replaces the plane's vendored port of 0.1.2 (coordinator ruling, new-planes Lane D). Pinned to 0.1.3, the version busbar's lock already carries through sonic-rs, so this adds no second version. The plane's `tests/number_reader.rs` holds 0.1.3 to the port's frozen verdicts. Its only dependency is cfg-if, so nothing new reaches a pure plane."

[plugin-deps.jiter]
version = "0.19"
default-features = false
repos = ["busbar-plane-llm"]
reason = "the llm plane's selective reader (JSON-STACK r8 J1, J2, J4; DEP-3, AGREED 223): named only in busbar-plane-llm's `plane-llm/src/codec/json.rs`, the plane's one JSON door, which reads the few facts a request or answer needs without building a tree. Adopted only by J0, the `bench-json` CI bench (JSON-STACK r8 §3.8: jiter's median lower on every row on both size-l and size-arm); if J0 keeps sonic-rs, S2-JSON-LLM's core MR deletes this row. `python` and `num-bigint` off (229(3)); its optional `ahash` comes only with `python`, so it adds no randomness crate. Its graph meets busbar's lock only at num-traits 0.2 and smallvec 1, the lines busbar holds, so lock parity needs no [parity-lines] row. Core, dist/default and tools name no jiter; another plugin joins `repos` only with its own CI bench (DEP-2, DEP-3)."

[plugin-deps.httparse]
version = "1"
default-features = false
repos = ["busbar-transport-ws"]
reason = "the HTTP/1 chunked transfer-coding decoder (parse_chunk_size) a refused WebSocket upgrade's body is read with; already in the closure through tungstenite, no socket of its own (Q128 transport-ws r162)."

[plugin-deps.siphasher]
version = "1"
default-features = false
repos = ["busbar-plane-llm"]
reason = "the ONE wire-compatible hasher (PLANE-LLM-SYNTH-ID, drop-in): SipHasher13 with a zero key keeps the client-visible tool-call ids 1.5.5 synthesized (std's DefaultHasher, whose algorithm std does not promise), byte for byte. Used only in plane-llm/src/codec/tool_call_id.rs; busbar-release bad-patterns (LINT-RULES LR-159) refuses it anywhere else. No dependencies of its own."

# ── Git sources (GetBusbar forks of crates.io crates; Q128 ruling, 2026-10-18) ────────────────────
# A plugin takes a crates.io crate from a git repository only through a row here: ONE repository, for
# the plugin repos `repos` names and no other, at ONE pinned commit, with a reviewed `reason`. The key is
# the crates.io crate the fork replaces. `git` is a repository under https://github.com/GetBusbar/;
# the sole external exception is the exact tungstenite URL/revision/WS-only row below, already
# approved in core Cargo.lock. `rev` is a full 40-hex commit (no branch, no tag). Every other
# outside repository, revision or consumer scope refuses the render. The fleet tool's `plugin sync` renders each row into the listed repos only: its
# `git` joins deny.toml's [sources] allow-git, and `name = { git, rev }` joins Cargo.toml's
# [patch.crates-io]. busbar's `cargo xtask plugin-gates gitsources` validates the rows.
# The str0m, dimpl and ring forks were dropped (the webrtc plugin builds from crates.io,
# OWNER 2026-10-25). This row declares the already-pinned WS fork; it adds no new dependency.
[git-sources.tungstenite]
git = "https://github.com/MattJackson/tungstenite-rs"
rev = "1c190f7dda55dc7df4781b7ecea9faa671fc76fd"
repos = ["busbar-transport-ws"]
reason = "Existing core-approved tungstenite patch, matching core Cargo.lock and the WS workspace patch at the same full revision."

# Dependency ladder S2 / F9 (DEPENDENCY-LADDER r4): the valkey store's vendored rdb-parser moves to a
# fork of nmvk/valkey-rdb-tools whose diff equals the vendored patch. Not on crates.io, so the store
# names it as a git dependency at this revision; the row admits the source for that repo only.
[git-sources.rdb-parser]
git = "https://github.com/MattJackson/valkey-rdb-tools"
rev = "1e6e453b4cc1e4977d688a93b0fb1226c6b58c24"
repos = ["busbar-store-valkey"]
reason = "rdb-parser (nmvk/valkey-rdb-tools 364d0e03 plus the strict profile, aggregate budgets and zeroized buffers the store already vendors). Upstream PR: https://github.com/nmvk/valkey-rdb-tools/pull/1. Replaces busbar-store-valkey vendor/rdb-parser (5,692 lines) under the dependency ladder (209): rung 2, patch the crate, never vendor our own. BSD-3-Clause; one dependency (zeroize)."

# ── Extra semver lines (Cargo.lock parity, ARCHITECT 2026-10-05) ──────────────────────────────────
# Parity is ONE vetted version per semver-compatible line, shared by busbar and its plugins: where busbar's
# lock holds a version in a crate's compatible line, a plugin's lock holds exactly that version (any drift
# is RED). A line busbar's lock holds NO version of is a different crate to Cargo; a plugin may carry it
# only when it is declared HERE for that plugin repo: `crate`, `line` (`1`, `0.11`, `0.0.3`), `repos`,
# `use` (`shipped` | `tests-only`) and `reason`. Undeclared is RED, by name (`plugin-gates parity`). A
# declaration never exempts an advisory: cargo-deny's advisory check stays blocking, and the parity gate
# is RED on a declared line it refused.
[parity-lines]
allow = [
    { crate = "sha2", line = "0.11", repos = ["busbar-store-postgres"], use = "shipped", reason = "postgres-protocol >= 0.6.11 (SCRAM-SHA-256; 0.6.10 carries RUSTSEC-2026-0179/0180) is on the sha2 0.11 line; busbar's own rows hold 0.10 (its lock also carries 0.11, only through ed25519-dalek 3)" },
    { crate = "digest", line = "0.11", repos = ["busbar-store-postgres"], use = "shipped", reason = "sha2 0.11's digest line (postgres-protocol >= 0.6.11 SCRAM)" },
    { crate = "block-buffer", line = "0.12", repos = ["busbar-store-postgres"], use = "shipped", reason = "digest 0.11's block-buffer line (postgres-protocol >= 0.6.11 SCRAM)" },
    { crate = "crypto-common", line = "0.2", repos = ["busbar-store-postgres"], use = "shipped", reason = "digest 0.11's crypto-common line (postgres-protocol >= 0.6.11 SCRAM)" },
    { crate = "const-oid", line = "0.10", repos = ["busbar-store-postgres"], use = "shipped", reason = "digest 0.11's const-oid line (postgres-protocol >= 0.6.11 SCRAM)" },
    { crate = "wasi", line = "0.14", repos = ["busbar-store-postgres"], use = "tests-only", reason = "the independent `postgres` test client (tokio-postgres 0.7.18 -> whoami 2) the live tests verify the store with; never shipped" },
    { crate = "zlib-rs", line = "0.6", repos = ["busbar-store-mysql"], use = "shipped", reason = "SMALL-DEP-WINS F.5: flate2's zlib-rs backend for the store's compressed MySQL packet codec (vendored mysql_common), opted in at member level; busbar's own lock holds no zlib-rs while core keeps rust_backend" },
    { crate = "miniz_oxide", line = "0.9", repos = ["busbar-store-mysql"], use = "tests-only", reason = "SMALL-DEP-WINS F/F.5: the `mysql` test client (minimal-rust = flate2/rust_backend) keeps flate2's miniz_oxide backend in the store's lock if core moves flate2 to zlib-rs; never shipped" },
    { crate = "adler2", line = "2", repos = ["busbar-store-mysql"], use = "tests-only", reason = "SMALL-DEP-WINS F/F.5: miniz_oxide 0.9's checksum, kept only by the `mysql` test client if core moves flate2 to zlib-rs; never shipped" },
    { crate = "simd-adler32", line = "0.3", repos = ["busbar-store-mysql"], use = "tests-only", reason = "SMALL-DEP-WINS F/F.5: miniz_oxide 0.9's SIMD checksum, kept only by the `mysql` test client if core moves flate2 to zlib-rs; never shipped" },
]

# ── cargo-deny [bans] ─────────────────────────────────────────────────────────────────────────────
# ONE protocol = ONE library, ONE crypto backend = ring (BUSBAR-1.6.0.md §Libraries). Rendered into
# every plugin's deny.toml; `cargo deny check` runs on it in the harness. These apply to the whole
# graph, dev-dependencies included.
[bans]
multiple-versions = "deny"
deny = [
    { crate = "openssl", reason = "TLS is rustls (core-only); no OpenSSL anywhere in the fleet" },
    { crate = "openssl-sys", reason = "TLS is rustls (core-only); no OpenSSL anywhere in the fleet" },
    { crate = "native-tls", reason = "TLS is rustls (core-only); no platform TLS anywhere in the fleet" },
    { crate = "hyper:<1", reason = "HTTP is hyper 1; no hyper 0.14 stack" },
    { crate = "rustls:<0.23", reason = "one rustls major (0.23) fleet-wide" },
    { crate = "ring:<0.17", reason = "one ring major (0.17) fleet-wide" },
    { crate = "serde_yaml", reason = "unmaintained; YAML is serde-saphyr through busbar_contract::yaml" },
    { crate = "unsafe-libyaml", reason = "unmaintained C translation (RUSTSEC-2024-0449); YAML is serde-saphyr through busbar_contract::yaml" },
    { crate = "yaml_serde", reason = "rests on libyaml-rs, a c2rust translation; YAML is serde-saphyr through busbar_contract::yaml" },
    { crate = "libyaml-rs", reason = "c2rust translation of libyaml (renamed unsafe-libyaml); YAML is serde-saphyr through busbar_contract::yaml" },
    { crate = "paste", reason = "unmaintained (RUSTSEC-2024-0436)" },
]
# Duplicate versions the fleet accepts beyond busbar's own. multiple-versions is "deny" (OWNER
# 2026-10-02: no plugin may drag in a second version of anything busbar already uses); the fleet tool's
# render adds a skip for every duplicate busbar's own Cargo.lock holds at the pin and bans every version
# of a shared crate outside the line busbar resolves it to, so this list stays for a reviewed exception:
# `{ crate = "name@<version>", reason = "..." }`.
skip = []

# ── The socket/TLS ban (enforced by the harness, not cargo-deny) ─────────────────────────────────────
# BUSBAR-1.6.0.md line 3980 (OWNER LAW 2026-09-27): "NO plugin opens its own socket, dials, binds, or
# does TLS." A connection is a declared need; the kernel instantiates the transport through the
# connector, and TLS lives only in busbar-core-connector (Part 2 #40, THE DESIGN §5). The harness walks
# each plugin's NORMAL + BUILD closure (dev-dependencies are tests, not the shipped image) and is RED on
# any crate below, on any feature below, and on any import below in the built cdylib (the post-LTO
# import scan). `carriers` lists plugin repos exempt from the SOCKET half only (Part 2 #40 names the
# carrier transports as the one exception); it is empty because no carrier opens a socket today.
# The crates list holds the socket/TLS stacks AND the database and directory drivers that dial their
# own socket (mysql, postgres, tokio-postgres, redis, ldap3): a store or auth plugin speaks its wire
# protocol as a sans-IO codec over the host's stream (THE DESIGN §5, "a driver is a sans-IO codec over
# the host stream, never a blocking driver"), so each driver may be a plugin's TESTS-ONLY dependency
# (its [plugin-deps] row says so) and never a shipped one.
[net-ban]
spec = "BUSBAR-1.6.0.md line 3980: NO plugin opens its own socket, dials, binds, or does TLS"
crates = [
    "rustls", "native-tls", "openssl", "openssl-sys", "socket2", "tokio-rustls", "hyper-rustls", "tokio-native-tls",
    "mysql", "postgres", "tokio-postgres", "redis", "ldap3",
]
features = ["tokio/net", "mio/net"]
imports = [
    "socket", "socketpair", "connect", "bind", "listen", "accept", "accept4",
    "getaddrinfo", "gethostbyname", "gethostbyname_r", "sendto", "recvfrom", "sendmsg", "recvmsg",
    "SSL_new", "SSL_connect", "SSL_CTX_new",
]
carriers = []

# ── C dependencies (ARCHITECT approval, ruling 3d) ───────────────────────────────────────────────────
# A crate with a `links` key (a native library) in a plugin's normal + build closure must be listed
# here, at this version requirement, with these features on (bundled: the C source is compiled in,
# never a system library). Anything else with `links` is RED.
[c-deps]
allow = [
    { crate = "ring", version = "0.17", features = [], reason = "the one crypto backend (accepted, §Libraries)" },
    { crate = "libsqlite3-sys", version = "=0.40.0", features = ["bundled"], reason = "SQLite compiled in for the sqlite store (rusqlite 0.42's line, bundling SQLite 3.54.1, which fixes RUSTSEC-2026-0459; bundled + pinned)" },
    { crate = "libz-sys", version = "=1.1.29", features = ["static"], reason = "zlib compiled in for the mysql store's compression (ARCHITECT 2026-10-01, bundled + pinned)" },
]
