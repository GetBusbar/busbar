[workspace]
resolver = "2"
members = [
    "crates/busbar",
    "crates/busbar-core-connector",
    "crates/busbar-core-admin",
    "crates/busbar-core-oauth2",
    "crates/busbar-llm",
    "crates/busbar-a2a",
    "crates/busbar-voice",
    "crates/busbar-contract",
    "crates/busbar-kernel",
    "crates/busbar-kernel-identity",
    "crates/busbar-kernel-scope",
    "crates/busbar-kernel-ledger",
    "crates/busbar-kernel-egress",
    "crates/busbar-kernel-breaker",
    "crates/busbar-kernel-wal",
    "crates/busbar-kernel-audit",
    "crates/busbar-plane-llm",
    "crates/busbar-plane-mcp",
    "crates/busbar-plane-a2a",
    "crates/busbar-plane-streaming",
    "crates/busbar-plane-decisions",
    "crates/plugin-loader",
    "crates/store-memory",
    "crates/busbar-transport-stdio",
    "testing/ws-conformance/subject",
    "xtask",
]

# ── the single source of truth for external dependency VERSIONS ──────────────────────────────────
#
# WHY THIS EXISTS. Before this table, every external dependency was declared per-crate, and three
# were already declared two different ways: `hex` as "0.4" and "0.4.3", `sha2` as "0.11" and
# "0.11.0", `tracing` as "0.1" and "0.1.44". Every one of them resolved to the same version — by
# coincidence, maintained by hand, with nothing that would notice if it stopped. That is the same
# defect that shipped a release binary with no plugin signing key: a property everyone believed was
# true, asserted nowhere, checked by nothing.
#
# THE RULE. A version requirement is written here EXACTLY ONCE. Members inherit with
# `foo = { workspace = true }`. A member may ADD features (`features = [...]` unions with the set
# below) and may mark a dependency `optional`, but it may not restate a version. A new crate joining
# the workspace inherits by default instead of introducing a second opinion.
#
# WHAT LIVES WHERE. Versions, `default-features`, and the feature floor shared by every consumer
# live here. The PROSE explaining why a dependency exists, and why its features are set the way they
# are, stays next to the member that has the reason — that comment is about the crate's own design,
# not about version selection.
#
# `default-features = false` MUST be set here when any member needs it: a member can turn workspace
# defaults ON but never back off. The entries carrying it below are the ones where a member
# deliberately declines the default feature set (crypto backends, allocators, the HTTP stacks).
#
# THE ORACLE. This refactor changes no Rust and must change no resolution: `Cargo.lock` is
# byte-identical across it, and so is `cargo tree -e features` on every shipped target. If either
# moves, the table disagrees with what the tree was actually building and the change is wrong. That
# is the check — not a reviewer's eye.
[workspace.dependencies]
# ── External plugin crates: ONE pin each (ONE HOME PER FACT); members use `workspace = true` ──
busbar-auth-admin-tokens-plugin = { git = "https://github.com/GetBusbar/busbar-auth-admin-tokens", rev = "648b6683d0b9274c02a20f6da17146ba1b85f74c" }
busbar-auth-oidc = { git = "https://github.com/GetBusbar/busbar-auth-oidc", rev = "0a7b7a5c59593e4e5a9b742b5c5a9f0147dc17cb" }
busbar-auth-oidc-plugin = { git = "https://github.com/GetBusbar/busbar-auth-oidc", rev = "0a7b7a5c59593e4e5a9b742b5c5a9f0147dc17cb" }
busbar-export-file = { git = "https://github.com/GetBusbar/busbar-export-file", rev = "c0a2d690b281ec96ef5d904981f73e2b2a0b11c2" }
busbar-export-file-plugin = { git = "https://github.com/GetBusbar/busbar-export-file", rev = "c0a2d690b281ec96ef5d904981f73e2b2a0b11c2" }
busbar-export-otlp = { git = "https://github.com/GetBusbar/busbar-export-otlp", rev = "d4e24f17b57ae9e16026fbe6a56a1e8966773e51" }
busbar-export-otlp-plugin = { git = "https://github.com/GetBusbar/busbar-export-otlp", rev = "d4e24f17b57ae9e16026fbe6a56a1e8966773e51" }
busbar-export-prometheus = { git = "https://github.com/GetBusbar/busbar-export-prometheus", rev = "049592be7a06945cd35bfc32d72ac0fb21197a57" }
busbar-export-prometheus-plugin = { git = "https://github.com/GetBusbar/busbar-export-prometheus", rev = "049592be7a06945cd35bfc32d72ac0fb21197a57" }
# THE SECRET SOURCES (THE DESIGN, "Plugins"; ARCHITECT 2026-10-02 WIRE-SECRET): `busbar` links each logic
# crate's door on the secret axis; the kernel's test build stands their `resolve` in. One rev each.
# The env source's logic crate is also the door the loader's secret conformance suite links; its cdylib
# crate (`busbar-secret-env-plugin`, same repo) is NOT a dependency: it is built from this pinned
# checkout by the build:dlopen-cdylibs step and dlopened.
busbar-secret-env = { git = "https://github.com/GetBusbar/busbar-secret-env", rev = "495318c9fa50c42b28705208fd02e83e3f363312" }
busbar-secret-file = { git = "https://github.com/GetBusbar/busbar-secret-file", rev = "479c833a108bc5d94e03f754b0a1b5f9ea97c0e3" }
# The same two crates at the same revs, under the role the kernel's test build gives them (its
# stand-in secret axis; a kernel source names no plugin). A rev bump moves both lines of its pair.
fixture-secret-env = { package = "busbar-secret-env", git = "https://github.com/GetBusbar/busbar-secret-env", rev = "495318c9fa50c42b28705208fd02e83e3f363312" }
fixture-secret-file = { package = "busbar-secret-file", git = "https://github.com/GetBusbar/busbar-secret-file", rev = "479c833a108bc5d94e03f754b0a1b5f9ea97c0e3" }
# THE REQUEST-LOG WEBHOOK SINK: the one home of its pinned rev (a rev bump is this one edit). `busbar`
# links the logic crate; `busbar-plugin-loader`'s conformance test builds the cdylib crate. Same repo,
# same rev, one resolved copy in Cargo.lock.
busbar-export-webhook = { git = "https://github.com/GetBusbar/busbar-export-webhook", rev = "46cd95ba78f6639b28d14067bc7c6876e00c5458" }
# THE HTTP TRANSPORT (kind: transport), pulled at a pinned rev; the logic crate the root links.
busbar-transport-http = { git = "https://github.com/GetBusbar/busbar-transport-http", rev = "2d1dbfdabf57842875b52f25a7fda73e7e32a73f" }
# THE GRPC TRANSPORT: the gRPC framer door (kind: transport), pulled at a pinned rev; the logic crate the root
# links on the transport-door axis (the gRPC module left busbar-transport-http for it).
busbar-transport-grpc = { git = "https://github.com/GetBusbar/busbar-transport-grpc", rev = "1303273a732bdd208305c4b96c8f4a5d0c05400f" }
# THE WS TRANSPORT: the websocket framer door (kind: transport), pulled at a pinned rev; the logic
# crate the root links (behind plane-streaming) and the ws-conformance subject drives.
busbar-transport-ws = { git = "https://github.com/GetBusbar/busbar-transport-ws", rev = "2ec0786eba86eeb0c51def66a5f9cb8ddd9e5a0d" }
busbar-export-webhook-plugin = { git = "https://github.com/GetBusbar/busbar-export-webhook", rev = "46cd95ba78f6639b28d14067bc7c6876e00c5458" }
# THE TCP TRANSPORT: the identity framer door (kind: transport), one pin for the logic crate the root
# links and the cdylib crate the loader's both-ways proof builds. Same repo, same rev, one resolved copy.
busbar-transport-tcp = { git = "https://github.com/GetBusbar/busbar-transport-tcp", rev = "b3047ce8748dcb6485f032c9c2c0cfa892ba3966" }
busbar-transport-tcp-plugin = { git = "https://github.com/GetBusbar/busbar-transport-tcp", rev = "b3047ce8748dcb6485f032c9c2c0cfa892ba3966" }
# THE OUTBOUND HEADER STYLES (kind: auth): the logic crate the root links on its `auths` axis
# (feature `auth-header`), pulled at a pinned rev (P5; OWNER Q99 keep the split).
busbar-auth-header = { git = "https://github.com/GetBusbar/busbar-auth-header", rev = "6ede2a5b1a27e6a265e3a76db7e5749cb5abce8a" }
# THE OAUTH MINTING STYLES (kind: auth): a dev edge only — the root's door_steps tests mint a member's
# credential through the real plugin's door. One pin.
busbar-auth-oauth = { git = "https://github.com/GetBusbar/busbar-auth-oauth", rev = "b7d15c7137e890072a4968abc544b0bbfc107f67" }
# THE RANKING HOOK (kind: hook), pulled at a pinned rev: the logic crate the root links on its hooks
# axis (feature `hooks-ranking`). The same package at the same rev, under the role the kernel's test
# build gives it (`fixture-hook`: a kernel source names no plugin). A rev bump moves both lines.
busbar-hook-ranking = { git = "https://github.com/GetBusbar/busbar-hook-ranking", rev = "7e1285e2e3293627723ab2754b9ddbfddeba9c46" }
fixture-hook = { package = "busbar-hook-ranking", git = "https://github.com/GetBusbar/busbar-hook-ranking", rev = "7e1285e2e3293627723ab2754b9ddbfddeba9c46" }
# ── A2A, from the a2aproject's OWN crates ──────────────────────────────────────────────────────
# THE OBVIOUS NAME IS THE WRONG ONE. `a2a-rs` on crates.io is `emillindfors/a2a-rs` (MIT, v0.5.0) —
# a different author entirely. The a2aproject family is the `a2a-*-lf` / `a2a-pb` set, all
# Apache-2.0, and pinning by name similarity would have taken the impostor.
#
# WHAT IS DELIBERATELY ABSENT, and it is the whole shape of this adoption:
#   a2a-server-lf   a server FRAMEWORK. Its router is a pre-built `axum::Router`, which would enter
#                   the tree with no entry in `CoreRouteTable` — the identical objection recorded
#                   against `oauth-as`'s `axum` feature below, and it applies unchanged. Worse, it
#                   carries its own `AgentExecutor` and `TaskStore`, and a SECOND task store means
#                   two answers to "what happened" with the auditor reading whichever was wired last.
#   a2a-client-lf   same framework, dialling out. busbar's own transport does resolve-then-pin (one
#                   DNS resolution per hop, every returned address judged, the connection made to the
#                   address that was judged). An SDK client handed a URL resolves it AGAIN, which is
#                   the TOCTOU that transport exists to close. Taking it would be a measurable
#                   security regression, not a convenience.
#   a2a-grpc        looks like the one to take for the gRPC binding and is not: its `GrpcHandler`
#                   implements the tonic service BY WRAPPING `a2a_server::RequestHandler`, so it
#                   drags both crates above in behind it.
#
# Together those three cost +65 crate names. What is taken below costs +42 in the lock and **+13 in
# the binary** — the other 29 are build-only. Measured with `cargo tree -e normal`, not estimated.
#
# a2a-lf   the core wire types. The protocol vocabulary, which is where compliance comes from and
#          where hand-rolling was never justified.
# a2a-pb   the protobuf types, generated from the a2aproject's own vendored `a2a.proto`. Required
#          for the gRPC binding; there is no types-only path to one. Its build script shells out to
#          protoc via `protoc-bin-vendored` — BUILD-only, so it ships nothing, but it is why this
#          pin is gated on `cargo deny` and the 11-configuration gate rather than landing quietly.
a2a-lf = "0.3.0"
a2a-pb = "0.2.0"
arc-swap = "1"
async-trait = "0.1"
axum = "0.8"
# 0.22, the line axum, tonic, pbjson, oauth-as and a2a-lf already ship: one base64 in the binary.
# STANDARD / URL_SAFE_NO_PAD encode and decode identically on 0.22 and 0.23 (same PAD/NO_PAD configs).
base64 = "0.22"
# THE CHUNK-CHAINING BUMP ALLOCATOR behind the per-call scratch pad (DECISIONS #41). It grows by
# adding a chunk when the current one does not fit, which is exactly the grow-on-demand the design
# requires; `try_alloc*` returns a Result on OOM rather than aborting, so the kernel — which is
# `forbid(unsafe)` and must never crash on growth — refuses one request instead of the process
# dying. Already in the lock via `sonic-rs`, so it adds no crate name to the graph. Only
# `busbar-kernel` names it; it is deliberately NOT a dependency of `busbar-contract`.
bumpalo = "3"
bytes = "1"
# CPU-core enumeration + per-thread pinning for the thread-per-core data plane (the one unix
# topology). Used ONLY by the `busbar` binary's boot seam; nothing on the request path names it.
core_affinity = "0.8"
crc32fast = "1"
# DTLS for the connector's dtls engine (WebRTC), on ring through the connector's own provider:
# no default features, so neither aws-lc-rs nor the RustCrypto suite enters.
dimpl = { version = "=0.7.4", default-features = false }
# THE MICROBENCHMARK HARNESS. Dev-only, and deliberately stripped: `default-features = false` drops
# criterion's plotting stack (plotters, its font/image chain) and its rayon thread pool, keeping
# `cargo_bench_support` — the part `cargo bench` actually needs to run a `harness = false` target.
# The shipped binary's dependency graph is unchanged; `cargo build --release` never resolves it.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
getrandom = "0.3"
hex = "0.4.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = "1.0"
hyper = { version = "1", default-features = false, features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = [
    "client-legacy",
    "http1",
    "http2",
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
indexmap = { version = "2", features = ["serde"] }
# No default features: validation is offline (`validator_for`), never a remote `$ref`. The defaults
# pulled reqwest 0.13 and rustls on aws-lc-rs, a second crypto backend and a C build (ring only).
jsonschema = { version = "0.49", default-features = false }
libc = "0.2"
libloading = "0.9"
loom = "0.7"
# THE BYTE SEARCH the stream transports scan their framing terminators with. Already in the lock
# through hyper's own tree, so this adds no crate name to the graph — it names the edge the
# transports rely on directly instead of reaching it by accident. Pure computation: no allocator,
# no I/O, no platform surface beyond the SIMD it selects at runtime.
memchr = "2"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
metrics-util = { version = "0.20.4", default-features = false }
# THE OAUTH 2.1 AUTHORIZATION SERVER (scope item A of 1.5.5).
#
# `default-features = false` is not written because the crate's default set is ALREADY EMPTY and
# stays that way by its own policy; the features below are the whole of what busbar turns on, and
# each one is a decision:
#
#   http               the RFC-shaped wire surface as `http::Request` in / `http::Response` out.
#                      NOT `axum`: that feature exists to hand back an `axum::Router`, and busbar
#                      mounts core routes exclusively through `core_routes::CoreRouter` so that
#                      every route declares its admission bar in the same act that wires it. A
#                      pre-built router would enter the tree with no entry in `CoreRouteTable`,
#                      which is the one thing that table exists to make impossible.
#   jwt                RFC 9068 `at+jwt` access tokens and the RFC 7517 JWKS document — and, since
#                      0.9.0 split the seam, the signer/verifier TRAITS with NO curve implementation
#                      behind them (`JwsSigner`/`JwsVerifier` since 0.10.0, which generalised the
#                      ES256-only `Es256Signer`/`Es256Verifier`). `jwt-p256` is deliberately ABSENT: busbar
#                      already links `ring` through rustls and implements both traits over it
#                      (`oauth_as::signer`), so the RustCrypto P-256 stack — twenty packages, a
#                      complete second elliptic-curve implementation — never enters the tree.
#   consent            the consent seam and RFC 9470 step-up. An authorization endpoint that does
#                      not ask the user anything is not an authorization endpoint.
#   resource-metadata  RFC 9728 §4 `protected_resources` on the AS metadata document, which is the
#                      AS half of the discovery loop busbar's resource half already publishes.
#
# RE-DERIVED at 1.0.0 against that release's own feature table (`cargo info oauth-as@1.0.0`), not
# carried across. 0.9.3 → 1.0.0 renamed and split NONE of these four; it ADDED `jwt-rsa`,
# `jwt-ed25519` and `jwt-ed25519-pkcs8` (off-by-default RS256/PS256 and EdDSA backends). They stay
# off: busbar signs and verifies ES256 only, over `ring`, and `jwt-rsa` would pull the `rsa` crate
# with its RUSTSEC-2023-0071 signing advisory into a tree that has no use for it. `test-util` (the
# signer/storage conformance harnesses, dev-dependencies only) is likewise unrenamed.
#
# THE FAPI 2.0 SECURITY PROFILE BUILDING BLOCKS (1.6.0, owner ruling 2026-09-19: the code is built
# to pass the OIDF suite). Each is used only under `oauth_as.fapi2: true`; none adds a crate to the
# graph (`par = []`, `dpop` and `client-assertion` = `["jwt"]`, already on):
#
#   par                RFC 9126 pushed authorization requests: the `/par` endpoint and the
#                      `require_pushed_authorization_requests` flag FAPI 2.0 s5.3.2.2-3 mandates.
#   dpop               RFC 9449 sender-constrained tokens (`cnf.jkt`), FAPI 2.0 s5.3.4-2. Verified
#                      by the ES256 verifier busbar already installs over `ring`.
#   client-assertion   RFC 7523 `private_key_jwt`, the profile's client authentication.
#
# The plain posture's RFC 8414 document stays the bytes it was: the plane serves it with the
# members these three add removed (`busbar_core_oauth2::plane`), so a deployment that did not ask
# for the profile advertises none of it.
oauth-as = { version = "1.0.0", features = [
    "http",
    "jwt",
    "consent",
    "resource-metadata",
    "par",
    "dpop",
    "client-assertion",
] }
# The OpenTelemetry project's own generated OTLP types, DEV-ONLY: the root's OTLP proofs decode what
# the `otlp` sink (GetBusbar/busbar-export-otlp) posts with the proto's publisher's types, never with the
# sink's own encoder. Not in any shipped build.
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace"] }
proptest = "1"
# DER minting on ring only. `pem` (and its base64 0.23) is a test-only need: the members whose tests
# write PEM add the feature on their dev/test-support declaration.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# `rmcp` (MCP's protocol-vocabulary crate) is STRUCK: its one member, `busbar-mcp`, is deleted (P3
# DEL-MCP, ARCHITECT 2026-10-05), and `workspace-deps:no-orphans` refuses a pin nothing inherits.
# THE LINE COUNTER'S PARSER, and the only reason either of these is a direct dependency of anything
# in this workspace. `cargo xtask loc` is the ONE instrument that answers "how many lines of
# production Rust is this tree", and the three wrong answers it replaces were each a regex or a
# hand-rolled scanner: a nested `/* /* */ */` terminates one early, a `r#"…#[cfg(test)]…{"#` raw
# string arms another, a `'{'` char literal shifts a third's brace depth. A PARSE makes every one of
# those unrepresentable rather than handled. `span-locations` is what turns a parsed item back into
# the line range it occupied, which is the whole measurement. Both are already in the lock as
# build-time dependencies of the derive macros; resolver = "2" keeps that feature set separate from
# this normal-dependency one, so enabling `span-locations` here does not re-build anybody's proc
# macros.
proc-macro2 = { version = "1", features = ["span-locations"] }
# The floor shared by the dependency and dev-dependency uses; busbar adds `http2` to one and `json`
# to the other. Both decline default features — rustls only, so no second crypto backend enters.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# The ring signature verifier the dtls engine checks a peer's DTLS signature with (rustls's own).
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"] }
rustls-pki-types = { version = "1", default-features = false, features = ["std"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Form-encoding for the engine-built RFC 8693 token exchange — the exact crate reqwest's `.form()`
# delegated to, so the encoded bytes are identical by construction. Already in the lock via reqwest.
serde_urlencoded = "0.7"
# `serde_yaml` (dtolnay) is archived — its last release is literally `0.9.34+deprecated`.
# `serde_yaml_ng` is the maintained, API-compatible fork; the `package` rename keeps every
# `serde_yaml::from_str` call site unchanged. Renaming here states the substitution once for the
# whole workspace instead of re-arguing it in each member.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
# 0.10, the line every dependency that carries RustCrypto ships (oauth-as, sha1 via axum/tungstenite).
# busbar's own digests and MACs are on ring (the one crypto backend); sha2 stays only where ring
# would be a new backend in a plugin's closure (busbar-contract) and as the independent witness the
# tests compare ring's bytes against.
sha2 = "0.10"
smallvec = "1"
# Raw socket options for the thread-per-core data plane: each per-worker listener sets SO_REUSEPORT
# so the kernel load-balances connections across the per-worker `TcpListener`s. Binary-only boot seam;
# already present transitively in the lock. `all` exposes the `set_reuse_port` accessor on all targets.
socket2 = { version = "0.6", features = ["all"] }
sonic-rs = "0.5"
# The other half of `cargo xtask loc`'s parser (see `proc-macro2` above). `full` because the counter
# has to see items nested inside function bodies — `#[cfg(test)]` on a `fn` inside a `fn` is the
# shape that hid from every line-oriented rule — and `visit` because the walk must reach EVERY node
# that can carry an attribute rather than the handful somebody remembered to enumerate.
syn = { version = "2", features = ["full", "visit", "parsing", "printing"] }
# No `xattr`: the loader unpacks in memory and restores nothing to disk.
tar = { version = "0.4", default-features = false }
tikv-jemalloc-ctl = "0.6"
tikv-jemallocator = "0.6"
# No feature floor: each consumer needs a different slice of the runtime and tokio's default set is
# empty, so the whole feature choice belongs to the member.
tokio = "1"
# The bridge between the two duplex-stream vocabularies. `busbar-contract` names a detached byte
# stream in the `futures` traits it already depends on, because the seam between two transport
# layers must not name a runtime; every concrete socket in the tree is a tokio one. `compat` is what
# carries a stream across that boundary and back, and it is the only feature any member wants.
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# The neutral full-duplex WEBSOCKET transport (busbar-substrate `ingress`/`egress` duplex-ws): the
# egress dialer runs the client WS handshake OVER a stream the connector's TLS wrap has already
# secured to a net-guard-pinned address, so only `handshake` is enabled — the crate's own `connect` (which would
# resolve DNS itself, bypassing the guard) is deliberately left OFF. Version 0.29 is exactly what
# axum 0.8's `ws` feature rides, so the ingress acceptor (axum) and the egress dialer share ONE
# tungstenite in the graph (no duplicate version); the handshake is generic over the already-wrapped
# stream, so this tracks axum's tungstenite rather than the connector's tokio-rustls.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# The generic gRPC runtime for the A2A gRPC binding. NOT an A2A-specific framework — this is the
# same crate every Rust gRPC server uses, and taking it is what lets busbar implement the tonic
# service trait itself, over its own admission and its own store, rather than adopting
# `a2a-grpc`'s handler and the two framework crates behind it.
#
# `prost 0.14` is already in the lock (via `opentelemetry-otlp`) and the major aligns, so the
# protobuf runtime is not new to the tree — only the service layer is.
tonic = { version = "0.14", default-features = false }
# The protobuf runtime, named directly because busbar is now a gRPC CLIENT as well as a server. The
# server direction never had to touch it: `tonic` decodes the request and encodes the answer, and
# `a2a-pb`'s generated types carry the `Message` impls. The A2A gRPC binding in the DELEGATING
# direction has to put the length-prefixed frame on the wire itself — busbar's outbound hop is its
# own resolve-then-pin transport, not a tonic `Channel`, precisely so the address the SSRF guard
# judged is the address that connects — so `Message::encode`/`decode` have to be nameable.
#
# ZERO NEW SUPPLY-CHAIN SURFACE, which is the same argument `tonic` above makes for itself: prost
# 0.14 is already in `Cargo.lock` and already in the shipped artifact (a2a-pb, tonic and
# opentelemetry-otlp all depend on it). What changes is that busbar can say its name.
prost = { version = "0.14", default-features = false, features = ["std"] }
# The tonic project's own `google.rpc` types (`Status`, `ErrorInfo`) and the richer-error model
# that puts them in the `grpc-status-details-bin` trailer. Taken for exactly one MUST: A2A section
# 10.6 requires every A2A-specific gRPC refusal to carry a `google.rpc.ErrorInfo` in
# `status.details` (the TCK's `GRPC-ERR-001`), and neither message is in the tree — the vendored
# `a2a.proto` brings `google.api` and nothing else. The alternative was hand-encoding two protobuf
# messages beside the service, and hand-writing a wire fact is what adopting the publisher's own
# generated types was meant to end. Same authors and same workspace as `tonic` itself, and its
# whole dependency set (`prost`, `prost-types`, `tonic`) is already in the lock, so the new
# supply-chain surface is this one crate.
tonic-types = "0.14"
tower = "0.5"
tracing = "0.1.44"
tracing-core = "0.1"
tracing-subscriber = "0.3.23"
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
# The plugin-logging witness's libraries (plugin-loader's `log_witness_plugin` fixture): a plugin logs
# through these from inside a call, and the door's capture must carry it. All three are already in
# the lock.
h2 = "0.4"
log = "0.4"
tungstenite = { version = "0.29", default-features = false }
# The WHATWG URL parser, named under its OWN name: every `reqwest::Url` in the tree was this crate
# under reqwest's re-export alias, and the egress-symmetry sweep spells the dependency honestly.
# Already in the lock (reqwest, a2a-lf and friends all resolve it).
url = "2"
# THE IDNA BACKEND SELECTOR `idna` itself documents: 1.1.x maps Unicode hostnames through the small
# unicode-rs crates (unicode-normalization, unicode-bidi) instead of ICU4X's ~20-crate stack, which
# `url` -> `idna` otherwise links into the binary only for this. UTS #46 processing is unchanged.
# Pinned exactly: the selection is the version number. Declared by the binary crate (`busbar`).
idna_adapter = "=1.1.0"
zeroize = "1"

# ── BUSBAR'S OWN CRATES, AS A PLUGIN REPO NAMES THEM ─────────────────────────────────────────────
#
# A default plugin lives in its own repo (owner ruling, 1.6.0: one repo per plugin) and names busbar
# by git: `busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = <.busbar-ref> }` —
# a plugin's whole busbar closure is the contract (#40; the plugin SDK is `busbar_contract::abi::sdk`
# since the #84 merge). When THIS workspace links that plugin (the root pulls it at a pinned rev),
# every busbar crate the plugin names resolves to THIS tree instead, so exactly ONE copy of
# busbar-contract links into the binary, and a plugin's rev of busbar never decides what the
# binary's contract is. Add a row here for each busbar crate a pulled plugin names directly.
[patch.'https://github.com/GetBusbar/busbar']
busbar-contract = { path = "crates/busbar-contract" }

[profile.release]
# Tuned for the shipped "deploy-and-done" binary: max optimization and smallest size,
# at the cost of slower release compiles (fine — releases are built in CI, not in the loop).
opt-level = 3        # opt-3 for the CPU-bound in-process work (parse/translate/serialize on the hot
                     # path). Larger than opt-level "s", but the stripped binary is still small (~11 MB)
                     # and the extra size is negligible in production, where provider round-trips dwarf it.
lto = "fat"          # whole-program inlining across crates: faster hot path + smaller binary
codegen-units = 1    # let LTO optimize across the whole crate graph (best codegen, smaller output)
strip = true         # strip symbols from the shipped binary (much smaller; set RUST_BACKTRACE aside)
# panic is left at the default `unwind` ON PURPOSE: a panic in one request task must unwind that
# task, not abort the whole gateway. `panic = "abort"` would trade per-request isolation for a
# little size — the wrong trade for a service in the request path.

# xtask, OPTIMIZED IN EVERY DEV BUILD (ARCHITECT 2026-10-07, p6-selftest-memo). `cargo xtask` is
# `cargo run --package xtask` under the dev profile, so CI's gates and self-tests ran xtask at
# opt-level 0. Measured on busbar 214678af59, Latchkey large (8 cores), the same four batteries at
# opt-level 0 -> 2: kind-isolation 925 s -> 170 s, kind-isolation-ship 631 s -> 123 s, ship-ready
# 127 s -> 23 s, construction 101 s -> 19 s, every per-case verdict line byte-identical; building
# xtask 67 s -> 71 s. Only xtask itself: its dependencies keep the dev profile. debug-assertions and
# overflow-checks stay on (they follow the profile, not the opt-level), so the checks a dev build
# makes are the checks it still makes. The self-test budgets (xtask/src/gates/mod.rs, TAKEN and
# BUDGET) are measured at this opt-level.
[profile.dev.package.xtask]
opt-level = 2
