[workspace]
resolver = "2"
# dist/default and testing/oracle (the black-box oracle) are their own workspaces; the root crate depends on
# no plugin. busbar-crypto-backend is its own lock root so a private build can [patch] a backend of the same
# name in.
exclude = ["dist/default", "testing/oracle", "crates/busbar-linked-gen", "tools/system-hammer", "crates/busbar-crypto-backend"]
members = [
    "crates/busbar",
    "crates/busbar-core-connector",
    "crates/busbar-core-admin",
    "crates/busbar-core-oauth2",
    "crates/busbar-contract",
    "crates/busbar-count",
    "crates/busbar-json",
    "crates/busbar-artifact-metadata",
    "crates/busbar-artifact-verifier",
    "crates/busbar-secure",
    "crates/busbar-crypto",
    "crates/busbar-kernel",
    "crates/busbar-migrate",
    "crates/busbar-kernel-identity",
    "crates/busbar-kernel-ledger",
    "crates/busbar-kernel-egress",
    "crates/busbar-kernel-breaker",
    "crates/busbar-kernel-wal",
    "crates/busbar-kernel-audit",
    "crates/plugin-loader",
    "crates/busbar-ports",
    "crates/busbar-ffi",
    "crates/busbar-plugin-abi",
    "crates/busbar-plugin-bench",
    "crates/busbar-plugin-test",
    # Core's repository checks (no-getrandom, crypto-graph), one CI job line each.
    "tools/ci-checks",
    # ci/hop: no thread hop around a plugin entry (IF §15 rule 10), one CI job line.
    "ci/hop",
]

# Each version is written once here; members inherit with `workspace = true` and may add features.
# `default-features = false` must be set here: a member cannot turn workspace defaults off.
[workspace.dependencies]
# Existing fleet HTTP envelope parser, also used by native test-host subjects.
httparse = { version = "1", default-features = false }
busbar-contract = { path = "crates/busbar-contract" }
# The one crypto backend: busbar-crypto names it by this URL; a private build patches its own in.
busbar-crypto-backend = { path = "crates/busbar-crypto-backend" }
# The plugin host's scrubber automaton (busbar-plugin-abi[host], IF §12.16); already in the lock.
aho-corasick = "1"
arc-swap = "1"
# The accept-error backoff (core-connector listen.rs, shared by the root listener). No default
# features: no sleeper, no std rng; only the ExponentialBuilder iterator, as a const.
backon = { version = "1.6", default-features = false }
async-trait = "0.1"
axum = "0.8"
# `busbar_contract::json::Body` (feature `axum`): the responder trait alone, already linked through axum.
axum-core = "0.5"
base64 = "0.22"
bytes = "1"
# Step 5's re-exec marks every descriptor >= 3 close-on-exec (root/migrate.rs). Builder path only
# (allow_filesystem(false)): 0.3.2's /dev/fd walk is unsound; see its cargo-vet exemption.
close_fds = "=0.3.2"
core_affinity = "0.8"
crc32fast = "1"
# The host buffer pool's per-class bounded MPMC queues (busbar-plugin-abi[host], IF §10.1, AGREED 209).
crossbeam-queue = { version = "0.3", default-features = false, features = ["std"] }
# The DTLS protocol engine only, no default features: its crypto provider is the backend's.
dimpl = { version = "=0.7.4", default-features = false }
# 3.x dropped its `std` feature (core::error::Error); no default features keeps pkcs8/pem, rand_core and zeroize out.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# FAST-MAPS: the fast map hasher (already locked through hashbrown); `std` gives the HashMap aliases.
foldhash = "0.2"
futures = "0.3"
hex = "0.4.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = [
    "http1",
    "http2",
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
indexmap = { version = "2", features = ["serde"] }
# Defaults off: validation is offline, and they pull reqwest and a second crypto backend (aws-lc-rs).
jsonschema = { version = "0.49", default-features = false }
# The command-line lexer for `busbar` and `busbar-audit-verify` (C19): zero dependencies.
lexopt = "0.3"
libc = "0.2"
libloading = "0.9"
loom = "0.7"
memchr = "2"
# Already in both lockfiles (hyper, axum): the content-type parameter grammar, quoted values included.
mime = "0.3.17"
metrics = "0.24.6"
metrics-util = { version = "0.20.4", default-features = false }
# No crypto of its own (decision 228): default features off, so no backend; busbar-core-oauth2 passes
# FacadeCrypto. Keep `axum`, `jwt-p256`, `jwt-rsa` and `jwt-ed25519` off.
oauth-as = { version = "1.1", default-features = false, features = [
    "http",
    "jwt",
    "consent",
    "resource-metadata",
    "par",
    "dpop",
    "client-assertion",
] }
# Canonical (OLPC) JSON for the signed release documents (plugin-loader release_trust), written through
# its sonic-rs formatter; serde_json, its default, stays off (SERDE-JSON-EXIT r2 §2, decision 223).
olpc-cjson = { version = "0.1.4", default-features = false, features = ["sonic-rs"] }
# URI component and form codecs (DEPENDENCY-LADDER C6); already linked through url. The fleet's
# plugins take percent-encoding from this row too.
percent-encoding = "2.3.2"
form_urlencoded = "1.2.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# Test clients only (dev-dependencies of kernel, admin and oauth2; nothing ships it): they speak plain
# HTTP to loopback servers, so no TLS feature. Its `rustls-tls` turns on rustls's ring provider, a second
# crypto backend beside AWS-LC (229; tools/ci-checks crypto-graph).
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
webpki-roots = "1"
# Reading a CA certificate's basicConstraints, keyUsage and validity (core-connector trust store,
# migrations); parsing only, no crypto features (x509-parser stays rcgen-only, deny.toml [bans]).
x509-cert = { version = "0.3", default-features = false }
rustls-pki-types = { version = "1", default-features = false, features = ["std"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
# YAML is serde-saphyr (YAML 1.2, forbid(unsafe_code)) behind `busbar_contract::yaml`, which pins
# its options to 1.5.5's meaning; the untyped tree is ciborium's `Value` (ordered pairs, no unsafe).
# busbar-contract's git consumers (the plugins) inherit both through these rows.
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize", "serialize"] }
ciborium = "0.2.2"
# Names the failing node's path in a YAML error (`a.b[0].c: ...`), as serde_yaml did.
serde_path_to_error = "0.1.20"
smallvec = "1"
socket2 = { version = "0.6", features = ["all"] }
# THE JSON SEAM (DEP-3): sonic-rs behind `busbar_contract::json`. `arbitrary_precision` keeps every
# number's lexeme (SERDE-NUMBERS r17), through the MattJackson fork in [patch.crates-io].
# `sort_keys` keeps a built or edited `Value` object in key order (sonic's default is a hash map, so
# its members would be written in no fixed order): core's JSON answers, audit lines and digests stay
# byte-stable, in the key order serde_json's `Map` wrote (#162, SERDE-JSON-EXIT CORE-A).
sonic-rs = { version = "0.5", features = ["arbitrary_precision", "sort_keys"] }
# The event-stream line parser (`parser::parse_line`) under busbar-contract's SSE framer
# (DEPENDENCY-LADDER C17); no default features, so no client, JSON or retry layer.
sseer = { version = "0.3.1", default-features = false }
# Constant-time byte equality (`redacted::constant_time_eq`); already linked through rustls.
subtle = { version = "2.6", default-features = false }
syn = { version = "2", features = ["full", "visit", "parsing", "printing"] }
# Calendar dates and RFC 3339 (busbar-contract `civil`, release-document times); already linked
# through rcgen. Members pick their own features.
time = { version = "0.3.49", default-features = false }
# No `xattr`: the loader unpacks in memory.
tar = { version = "0.4", default-features = false }
# Test-only (dev-dependencies of busbar-kernel and busbar): the per-thread allocation counters through the
# upstream safe wrapper (UNSAFE-MIN QJ). `stats` makes jemalloc keep them. Its `paste` dependency is a
# recorded cargo-deny exception (RUSTSEC-2024-0436), dev graph only.
tikv-jemalloc-ctl = { version = "=0.6.1", default-features = false, features = ["stats"] }
tikv-jemallocator = "0.6"
# Test-only allocation counters (UNSAFE-MIN §4.4): `StatsAlloc<Jemalloc>` counts allocations, deallocations
# and reallocations process-wide; its own `unsafe impl` is the dependency's (cargo-vet exemption). The
# `nightly` feature only makes `StatsAlloc::new` a `const fn`, which a `#[global_allocator]` static needs.
stats_alloc = { version = "0.1.10", features = ["nightly"] }
# No feature floor: each member picks its own slice.
tokio = "1"
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }
tokio-rustls = { version = "0.26", default-features = false }
# `handshake` only: the crate's `connect` would resolve DNS itself and bypass the net guard.
psl = "2.1"
tower = "0.5"
tracing = "0.1.44"
tracing-core = "0.1"
tracing-subscriber = "0.3.23"
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
h2 = "0.4"
log = "0.4"
tungstenite = { version = "0.29", default-features = false }
url = "2"
# Pinned exactly: the version selects the small unicode-rs IDNA backend over ICU4X.
idna_adapter = "=1.1.0"
idna = { version = "1.1.0", default-features = false, features = ["alloc", "compiled_data"] }
zeroize = "1"
unicode-normalization = "0.1.25"
# The shared fast-hash aliases (foldhash::HashMap / HashSet, per-process seeded) the bad-pattern rules
# point at instead of std's SipHash HashMap/HashSet. Already in Cargo.lock.

# Every member takes these with `[lints] workspace = true`.
[workspace.lints.rust]
# busbar: the default distribution's build script sets a `linked_section_<section>` cfg per linked
# plane door; core's source gates a few tests on two of them, and core alone sets none.
# busbar-kernel: the transaction-fence red witness.
# busbar-core-connector: mio's poll(2) backend switch, mirrored by the short-transfer readiness gate.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(linked_section_pools)", "cfg(linked_section_agents)", "cfg(txn_fence_red)", "cfg(mio_unsupported_force_poll_poll)", "cfg(loom)"] }

# Fleet bad-pattern rules: the list is in clippy.toml (a byte-identical copy of GetBusbar/busbar-release
# template/clippy.toml's block). It is raised to deny only inside module trees that carry the
# request-path marker; everywhere else these three stay off. The crate-wide rows
# (clippy-crate-wide/clippy.toml) run in a second clippy pass that raises these three on the command
# line, which outranks this table.
[workspace.lints.clippy]
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
# Always on, every crate and target: each one's suggested fix is itself allowed.
assigning_clones = "deny"
cloned_instead_of_copied = "deny"
unnecessary_to_owned = "deny"
mutex_atomic = "deny"
rc_buffer = "deny"
large_stack_arrays = "deny"
large_futures = "deny"

# Plugins that name busbar-contract by git resolve to this tree, so exactly one copy links.
[patch.'https://github.com/GetBusbar/busbar']
busbar-contract = { path = "crates/busbar-contract" }

# The one crypto backend: busbar-crypto names it by this URL; a private build patches its own in.
busbar-crypto-backend = { path = "crates/busbar-crypto-backend" }

# Pinned dependency fixes: h2 sensitive fields, WebSocket 1014 and bounded frame diagnostics.
[patch.crates-io]
# Adopted funded TLS output/ticket storage and actual wire provenance.
rustls = { git = "https://github.com/MattJackson/rustls", rev = "02181ad51e81f9cb33a0648117b03039274716a3" }
# Dependency patches are effective only at the consuming workspace root.
aws-lc-sys = { git = "https://github.com/MattJackson/aws-lc-sys", rev = "3469edb189e0cc2fab40e88f551713a828a5d867" }
jobserver = { git = "https://github.com/MattJackson/jobserver-rs", rev = "fbe3efc1acc11add04854cc093f97876e439e129" }
dunce = { git = "https://github.com/MattJackson/dunce", rev = "bb4757b8dffd9bdc619ce1fda1a147bd53e7b29d" }
fs_extra = { git = "https://github.com/MattJackson/fs_extra", rev = "70f47864db8ae763979f47cde6785449cd790dad" }
# Native HTTP allocation projection and serializer provenance (adopted transport cohort).
http = { git = "https://github.com/MattJackson/http", rev = "904f4519b5f27a0424b121a4828640c741efcd95" }
h2 = { git = "https://github.com/MattJackson/h2", rev = "6bdbf046878247aebe9138f37f32d2665b54bdd9" }
hyper = { git = "https://github.com/MattJackson/hyper", rev = "c140435f43477ca3ffbdb2078a5994e9dfb11969" }
hyper-util = { git = "https://github.com/MattJackson/hyper-util", rev = "b4c554c133c7fc83ee55a9ce0271849f7387994d" }
tungstenite = { git = "https://github.com/MattJackson/tungstenite-rs", rev = "893a21f1f98011a2665840231330c473836c9a0a" }
# YAML: serde-saphyr and granit-parser carry busbar's opt-in serde_yaml-compatibility options
# (null_scalars_as_text, lowercase_radix_prefixes_only, bom_inside_document_as_content), offered
# upstream; forks of the exact published versions plus those commits.
serde-saphyr = { git = "https://github.com/MattJackson/serde-saphyr", rev = "a94d2da01a448d348b5d14945e29192e511b8452" }
granit-parser = { git = "https://github.com/MattJackson/granit-parser", rev = "d31e9292a0be49de7d3a85ee07555bb9d0afce20" }
# JSON (SERDE-NUMBERS r17 P0-P3): sonic-rs 0.5.11 plus exact numbers through foreign deserializers
# (serde buffering, YAML) and an authenticated Value hand-off, offered upstream (cloudwego/sonic-rs).
sonic-rs = { git = "https://github.com/MattJackson/sonic-rs", rev = "1241c129cef83686109f820825206f56ff470f67" }
# Canonical JSON: olpc-cjson 0.1.4 with serde_json optional and a sonic-rs Formatter, offered upstream
# (awslabs/tough). busbar's workspace row turns its default (serde_json) off and takes the sonic-rs formatter.
olpc-cjson = { git = "https://github.com/MattJackson/olpc-cjson", rev = "0a96a65b1122a2bbb93fd36cae3b36dd2b045c7e" }

[profile.release]
opt-level = 3        # opt-3 for the CPU-bound in-process work (parse/translate/serialize on the hot
lto = "fat"          # whole-program inlining across crates: faster hot path + smaller binary
codegen-units = 1    # let LTO optimize across the whole crate graph (best codegen, smaller output)
strip = true         # strip symbols from the shipped binary (much smaller; set RUST_BACKTRACE aside)
# `panic` stays `unwind`: a request panic must unwind its task, not abort the gateway.
