busbar-transport-grpc = { git = "https://github.com/GetBusbar/busbar-transport-grpc", rev = "2531ef131e492385788b6714687346e48d864d44" }
# THE WS TRANSPORT: the websocket framer door (kind: transport), pulled at a pinned rev; the logic
