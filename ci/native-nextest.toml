# Existing native qualification timeout; no test is retried or silently skipped.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.default.junit]
path = "native.xml"

# These existing end-to-end fixtures compile and boot the complete release product.
# Cold compilation is part of the test; retain the five-minute limit for other tests.
[[profile.default.overrides]]
filter = '''
test(/^live_e2e::/)
| test(=github_get_flow_mints_key_via_core_executed_hops)
| test(=install_oidc_plugin_via_admin_api_and_authenticate)
| test(=sigv4_is_verified_inbound_and_signed_outbound)
| test(=install_over_admin_api_then_mint_a_key_and_verify_mysql_directly)
| test(=load_and_exercise_postgres_plugin_via_file_drop)
| test(=install_over_admin_api_then_mint_a_key_and_verify_postgres_directly)
| test(=admin_api_installs_the_valkey_plugin_and_writes_land_in_real_valkey)
| test(=admin_api_installs_headroom_and_a_real_request_is_compressed_upstream)
'''
slow-timeout = { period = "60s", terminate-after = 20 }
