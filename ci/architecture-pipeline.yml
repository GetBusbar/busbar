# Selected by each project's CI configuration setting at an immutable approved SHA.
# Candidate .gitlab-ci.yml and candidate architecture tooling are never executed here.
#
# Core runs in three tiers; plugin projects keep one (native-qualification + security).
#   DEV  (dev merge requests, dev push): core-build (fmt, deny/vet, the one clippy-linted
#        release build of dist/default `busbar`) -> core-conformance on that binary.
#   QA   (protected qa push; owner "qa-nightly" schedule on dev): DEV + native-qualification
#        (every test, full clippy, witnesses, oracle, loom) + security-scans, all on the
#        same certified binary.
#   MAIN (protected main push): release-certification, zero builds: the QA-certified
#        digests for this exact commit or no release.
workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "dev" && ($CI_PROJECT_NAMESPACE == "GetBusbar" || $CI_PROJECT_NAMESPACE == "BusbarInc")'
    - if: '$CI_PIPELINE_SOURCE == "api" && ($CI_PROJECT_PATH == "GetBusbar/busbar" || $CI_PROJECT_PATH == "GetBusbar/busbar-plane-llm" || $CI_PROJECT_PATH == "GetBusbar/busbar-plane-decisions")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_PROJECT_PATH == "GetBusbar/busbar" && ($CI_COMMIT_BRANCH == "qa" || $CI_COMMIT_BRANCH == "main") && $CI_COMMIT_REF_PROTECTED == "true"'
    # Owner-created dev schedules: the advisory refresh (security only) and "qa-nightly".
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "dev"'
    - when: never

stages: [build, qualify, website, release]

# The protected controller every job runs: it fetches the approved core revision
# named by the server-selected configuration and dispatches on CI_JOB_NAME.
.controller:
  tags: [busbar-native-admission]
  interruptible: true
  allow_failure: false
  retry: 0
  timeout: 4h
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
    RUSTUP_TOOLCHAIN: "1.98.0"
    CARGO_TERM_COLOR: never
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    - |
      set -eu
      # Bootstrap from the server-selected top-level configuration, not a variable
      # or script supplied by the candidate. Pipeline variable overrides are disabled.
      python3 -I -B - <<'PY'
      import base64, os, pathlib, re, shutil, subprocess
      uri = os.environ['CI_CONFIG_REF_URI']
      # GitLab identifies the consumer project/ref around the full external
      # configuration setting. The trusted revision is the SHA after its colon.
      match = re.fullmatch(r'(?:https://)?' + re.escape(os.environ['CI_SERVER_HOST']) + '/' + re.escape(os.environ['CI_PROJECT_PATH']) + r'//ci/architecture-pipeline\.yml@GetBusbar/busbar:([0-9a-f]{40})@refs/heads/[^\s]+', uri)
      if not match:
          raise SystemExit('CI configuration must select the approved immutable core revision: ' + uri)
      base = pathlib.Path(os.environ['BUSBAR_NATIVE_SCRATCH']).resolve()
      work = base / ('boundary-' + os.environ['CI_PROJECT_ID'] + '-' + os.environ['CI_JOB_ID'])
      work.mkdir(parents=True, exist_ok=False)
      trusted = work / 'trusted'
      trusted.mkdir()
      env = dict(os.environ)
      auth = base64.b64encode(('gitlab-ci-token:' + env['CI_JOB_TOKEN']).encode()).decode()
      server = env['CI_SERVER_URL'].rstrip('/')
      env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.' + server + '/.extraheader', GIT_CONFIG_VALUE_0='Authorization: Basic ' + auth, GIT_TERMINAL_PROMPT='0')
      try:
          subprocess.run(['git', '-C', str(trusted), 'init', '-q'], check=True)
          subprocess.run(['git', '-C', str(trusted), 'fetch', '--depth', '1', server + '/GetBusbar/busbar.git', match[1]], env=env, check=True)
          subprocess.run(['git', '-C', str(trusted), 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          actual = subprocess.check_output(['git', '-C', str(trusted), 'rev-parse', 'HEAD'], text=True).strip()
          if actual != match[1]:
              raise SystemExit('trusted policy checkout mismatch')
          command = ['python3', '-I', '-B', str(trusted / 'scripts/architecture/native_ci_bootstrap.py'), '--trusted', str(trusted), '--checkout', os.environ['CI_PROJECT_DIR'], '--work', str(work)]
          if os.environ['CI_JOB_NAME'] == 'native-qualification' and os.environ['CI_PROJECT_PATH'] != 'GetBusbar/busbar':
              # Plugins only: core jobs certify this pipeline's own binary and always run.
              # Decide before any bootstrap download: exit 0 only after the trusted
              # module authenticated an equal-input successful original and wrote
              # boundary-evidence/retained.json naming it. Anything else runs fresh.
              retained = pathlib.Path(os.environ['CI_PROJECT_DIR']) / 'boundary-evidence/retained.json'
              decision = subprocess.run(['python3', '-I', '-B', str(trusted / 'scripts/architecture/ci_retention.py'), '--policy', match[1], '--checkout', os.environ['CI_PROJECT_DIR'], '--output', str(retained)])
              if decision.returncode == 0 and retained.is_file() and not retained.is_symlink():
                  command = None
              elif retained.exists() or retained.is_symlink():
                  raise SystemExit('retention decision left evidence without retaining')
          if os.environ['CI_JOB_NAME'] == 'security-scans':
              command = ['python3', str(trusted / 'scripts/security/scan.py'), '--trusted', str(trusted), '--checkout', os.environ['CI_PROJECT_DIR'], '--work', str(work), '--output', str(pathlib.Path(os.environ['CI_PROJECT_DIR']) / 'boundary-evidence/security.json')]
          elif os.environ['CI_JOB_NAME'] == 'release-certification':
              command = ['python3', '-I', '-B', str(trusted / 'scripts/architecture/release_certification.py'), '--output', str(pathlib.Path(os.environ['CI_PROJECT_DIR']) / 'boundary-evidence/release-certification.json')]
          elif os.environ['CI_JOB_NAME'] not in ('core-build', 'native-qualification', 'core-conformance', 'native-isolation-diagnostic') and not re.fullmatch(r'plugin-dependency-units [1-8]/8', os.environ['CI_JOB_NAME']):
              raise SystemExit('unrecognized trusted native job')
          if command is not None:
              subprocess.run(command, check=True)
      finally:
          shutil.rmtree(work, ignore_errors=True)
      PY
  artifacts:
    when: always
    access: developer
    expire_in: 30 days
    paths: [boundary-evidence/]

# Shared rule sets, spliced into job rules with !reference. No set ends in a catch-all;
# every job closes its own list with `when: never`.
.rules:
  core-dev:
    - if: '$CI_PROJECT_PATH == "GetBusbar/busbar" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
    - if: '$CI_PROJECT_PATH == "GetBusbar/busbar" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == "dev"'
  core-qa:
    - if: '$CI_PROJECT_PATH == "GetBusbar/busbar" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "qa" && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PROJECT_PATH == "GetBusbar/busbar" && $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "qa-nightly"'
  plugin-dev:
    - if: '$CI_PROJECT_PATH != "GetBusbar/busbar" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
    - if: '$CI_PROJECT_PATH != "GetBusbar/busbar" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == "dev"'

# ---- DEV tier (core) -------------------------------------------------------------------
# fmt, cargo deny/vet for both workspaces, then the ONE product build: cargo build
# --release of dist/default `busbar` with clippy-driver and -D warnings. Its binary
# (boundary-evidence/busbar) and sha256 are this pipeline's certified subject.
core-build:
  extends: .controller
  stage: build
  timeout: 2h
  rules:
    - !reference [.rules, core-dev]
    - !reference [.rules, core-qa]
    - when: never

# Every core conformance suite judges the core-build binary by sha256; no own build.
# Stage order starts it once core-build passed; it reads that job through the API.
core-conformance:
  extends: .controller
  stage: qualify
  tags: [busbar-conformance]
  rules:
    - !reference [.rules, core-dev]
    - !reference [.rules, core-qa]
    - when: never

# ---- QA tier (core) and plugin qualification --------------------------------------------
# Core: every test (root/dist workspaces, doctests, loader witnesses, loom), full clippy,
# compiler witnesses, the oracle replay and product inputs; records the same certified
# binary. Plugins: their native qualification on dev, as before.
native-qualification:
  extends: .controller
  stage: qualify
  rules:
    - !reference [.rules, core-qa]
    - !reference [.rules, plugin-dev]
    - when: never

# Runner 32 allocates a distinct one-use VM per job (capacity_per_instance=1,
# max_use_count=1, no shared cache). This job never executes candidate processes.
# Its own database age/content checks decide freshness.
security-scans:
  extends: .controller
  stage: qualify
  timeout: 1h
  rules:
    - !reference [.rules, core-qa]
    - !reference [.rules, plugin-dev]
    # Every dev schedule (the advisory refresh included) runs security.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "dev"'
    - when: never
  artifacts:
    when: always
    access: developer
    expire_in: 1 year
    paths: [boundary-evidence/security.json]

# Fixed-source runtime witnesses on an exclusive native worker. Owner API runs on
# corefix-native-isolation-* only; it neither qualifies candidate code nor publishes it.
native-isolation-diagnostic:
  extends: .controller
  stage: qualify
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_PROJECT_PATH == "GetBusbar/busbar" && $CI_COMMIT_BRANCH =~ /^corefix-native-isolation-/'
    - when: never

# ---- dev publication ---------------------------------------------------------------------
# Trusted producer of prebuilt plugin dependency units (native_dep_cache.py): a protected
# core dev push after its qualification jobs, or an owner API pipeline on the protected
# ci/dep-cache branch (a commit already on dev; every other job excludes that ref). No
# candidate code: each pinned product's manifests and lock with stubbed sources. Eight
# instances own fixed digest-assigned product subsets; a per-index resource_group writes
# each package file once.
plugin-dependency-units:
  extends: .controller
  stage: website
  interruptible: false
  allow_failure: true
  parallel: 8
  # A first fill builds at most six products per instance (~5 min each); later
  # runs only products whose lock or toolchain identity changed.
  timeout: 2h
  resource_group: plugin-dependency-units-$CI_NODE_INDEX
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev" && $CI_PROJECT_PATH == "GetBusbar/busbar"'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "ci/dep-cache" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PROJECT_PATH == "GetBusbar/busbar"'
    - when: never

# Every qualified assembled-product dev change refreshes current website evidence.
# The marketing pipeline independently verifies source and binary freshness.
website-dev:
  stage: website
  # Stage ordering requires every qualification job, including conformance.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev" && $CI_PROJECT_PATH == "GetBusbar/busbar"'
      variables:
        WEBSITE_CORE_REVISION: $CI_COMMIT_SHA
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev" && $CI_PROJECT_NAMESPACE == "GetBusbar" && $CI_PROJECT_NAME =~ /^busbar-/'
    - when: never
  variables:
    WEBSITE_EVENT_REPOSITORY: $CI_PROJECT_PATH
    WEBSITE_SOURCE_REVISION: $CI_COMMIT_SHA
    WEBSITE_UPSTREAM_PIPELINE_ID: $CI_PIPELINE_ID
  trigger:
    project: BusbarInc/marketing
    branch: dev
    strategy: mirror
    forward:
      yaml_variables: true
      pipeline_variables: false

# ---- MAIN tier (core) ----------------------------------------------------------------------
# Zero builds: the newest successful protected qa push pipeline at this exact commit must
# have certified one binary sha256 across core-build, core-conformance and
# native-qualification, with security passing (release_certification.py). Signing,
# tagging and publication take only that digest; there is no signing key in DEV or QA.
release-certification:
  extends: .controller
  stage: release
  timeout: 30m
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PROJECT_PATH == "GetBusbar/busbar"'
    - when: never
  artifacts:
    when: always
    access: developer
    expire_in: 1 year
    paths: [boundary-evidence/]
