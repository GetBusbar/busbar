# Selected by each project's CI configuration setting at an immutable approved SHA.
# Candidate .gitlab-ci.yml and candidate architecture tooling are never executed here.
workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "dev" && ($CI_PROJECT_NAMESPACE == "GetBusbar" || $CI_PROJECT_NAMESPACE == "BusbarInc")'
    - if: '$CI_PIPELINE_SOURCE == "api" && ($CI_PROJECT_PATH == "GetBusbar/busbar" || $CI_PROJECT_PATH == "GetBusbar/busbar-plane-llm" || $CI_PROJECT_PATH == "GetBusbar/busbar-plane-decisions")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
    # Owner-created dev schedule: advisory database refresh. Runs security only.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "dev"'
    - when: never

stages: [qualify, website]

native-qualification:
  stage: qualify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH != "dev"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  tags: [busbar-native-admission]
  interruptible: true
  allow_failure: false
  retry: 0
  timeout: 4h
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
    RUSTUP_TOOLCHAIN: "1.98.0"
    CARGO_TERM_COLOR: never
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    - |
      set -eu
      # Bootstrap from the server-selected top-level configuration, not a variable
      # or script supplied by the candidate. Pipeline variable overrides are disabled.
      # POSIX sh only. Every trusted job runs the one busbar-ci controller that
      # the verified policy checkout pins (tools/ci/controller.pin); see controller.sh.
      uri=$CI_CONFIG_REF_URI
      # GitLab identifies the consumer project/ref around the full external
      # configuration setting. The trusted revision is the SHA after its colon:
      # (https://)?HOST/PROJECT//ci/architecture-pipeline.yml@GetBusbar/busbar:SHA@refs/heads/REF
      # where REF has no Unicode whitespace. Bytes are matched under LC_ALL=C.
      select_revision() (
        LC_ALL=C
        prefix="$CI_SERVER_HOST/$CI_PROJECT_PATH//ci/architecture-pipeline.yml@GetBusbar/busbar:"
        selected=${uri#https://}
        case "$selected" in "$prefix"*) selected=${selected#"$prefix"} ;; *) exit 1 ;; esac
        revision=${selected%%@*}
        test "${#revision}" -eq 40 || exit 1
        case "$revision" in *[!0-9a-f]*) exit 1 ;; esac
        branch=${selected#"$revision"}
        case "$branch" in @refs/heads/?*) branch=${branch#@refs/heads/} ;; *) exit 1 ;; esac
        space=$(printf ' \t\n\r\013\014\034\035\036\037.')
        case "$branch" in *["${space%.}"]*) exit 1 ;; esac
        for code in '\302\205' '\302\240' '\341\232\200' '\342\200\250' '\342\200\251' '\342\200\257' \
            '\342\201\237' '\343\200\200' '\342\200\200' '\342\200\201' '\342\200\202' '\342\200\203' \
            '\342\200\204' '\342\200\205' '\342\200\206' '\342\200\207' '\342\200\210' '\342\200\211' '\342\200\212'; do
          character=$(printf "$code")
          case "$branch" in *"$character"*) exit 1 ;; esac
        done
        printf '%s' "$revision"
      )
      revision=$(select_revision) || {
        printf '%s\n' "CI configuration must select the approved immutable core revision: $uri" >&2
        exit 1
      }
      case $CI_JOB_NAME in
        (security-scans|native-qualification|core-conformance|external-conformance|native-isolation-diagnostic) ;;
        (*) echo 'unrecognized trusted native job' >&2; exit 1 ;;
      esac
      test -n "${BUSBAR_NATIVE_SCRATCH+set}" || exit 1
      mkdir -p -- "${BUSBAR_NATIVE_SCRATCH:-.}"
      base=$(cd -P -- "${BUSBAR_NATIVE_SCRATCH:-.}" && pwd -P)
      work="$base/boundary-$CI_PROJECT_ID-$CI_JOB_ID"
      mkdir -- "$work"
      # Cleanup on every exit path, including cancellation signals.
      trap 'rm -rf -- "$work"' EXIT
      trap 'exit 143' TERM
      trap 'exit 130' INT
      trusted="$work/trusted"
      mkdir -- "$trusted"
      server=$CI_SERVER_URL
      while case "$server" in */) true ;; *) false ;; esac; do server=${server%/}; done
      auth=$(printf 'gitlab-ci-token:%s' "$CI_JOB_TOKEN" | base64 | tr -d '\n')
      git -C "$trusted" init -q
      # The credential reaches only this fetch, through its environment.
      GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$server/.extraheader" \
        GIT_CONFIG_VALUE_0="Authorization: Basic $auth" GIT_TERMINAL_PROMPT=0 \
        git -C "$trusted" fetch --depth 1 "$server/GetBusbar/busbar.git" "$revision"
      unset auth
      git -C "$trusted" checkout --detach FETCH_HEAD
      if test "$(git -C "$trusted" rev-parse HEAD)" != "$revision"; then
        echo 'trusted policy checkout mismatch' >&2
        exit 1
      fi
      # The pinned controller runs from the job staging root. native-bootstrap
      # makes the retention decision before any bootstrap download.
      controller() { sh "$trusted/tools/ci/controller.sh" "$trusted" "$work" "$@"; }
      case $CI_JOB_NAME in
        (security-scans)
          controller security-scans --trusted "$trusted" --checkout "$CI_PROJECT_DIR" --work "$work" \
            --output "$CI_PROJECT_DIR/boundary-evidence/security.json" ;;
        (*)
          controller native-bootstrap --trusted "$trusted" --checkout "$CI_PROJECT_DIR" --work "$work" ;;
      esac
  artifacts:
    when: always
    access: developer
    expire_in: 30 days
    paths: [boundary-evidence/]

# Fixed-source runtime witnesses execute on an exclusive existing native worker.
# This API-only core diagnostic neither qualifies candidate code nor publishes it.
native-isolation-diagnostic:
  extends: native-qualification
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_PROJECT_PATH == "GetBusbar/busbar" && $CI_COMMIT_BRANCH =~ /^corefix-native-isolation-/'
    - when: never

# Runner 32 allocates a distinct one-use VM per job (capacity_per_instance=1,
# max_use_count=1, no shared cache). This job never executes candidate processes.
# Keep that lifecycle contract when changing the runner behind this tag.
security-scans:
  extends: native-qualification
  tags: [busbar-native-admission]
  timeout: 1h
  # Security always runs fresh, including the dev schedule; its own database
  # age/content checks decide freshness. It never invalidates native/conformance.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH != "dev"'
      when: never
    - when: on_success
  artifacts:
    when: always
    access: developer
    expire_in: 1 year
    paths: [boundary-evidence/security.json]

# Conformance is mandatory alongside native qualification. API runs remain useful
# diagnostics, but cannot replace these same-pipeline publication prerequisites.
core-conformance:
  extends: native-qualification
  tags: [busbar-conformance]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH =~ /^corefix-native-isolation-/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PROJECT_PATH == "GetBusbar/busbar"'
    - when: never

# LLM's eight spec/voice suites and decisions' Jev suite run inside required
# native-qualification. Their protected ci-coverage roster cannot be omitted.
# Neither owner provides the former external-openai.sh/external-jev.sh endpoint
# entrypoints; no separate external endpoint certification is claimed.

# Every qualified assembled-product dev change refreshes current website evidence.
# The marketing pipeline independently verifies source and binary freshness.
website-dev:
  stage: website
  # Stage ordering requires every qualification job, including conformance.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev" && $CI_PROJECT_PATH == "GetBusbar/busbar"'
      variables:
        WEBSITE_CORE_REVISION: $CI_COMMIT_SHA
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev" && $CI_PROJECT_NAMESPACE == "GetBusbar" && $CI_PROJECT_NAME =~ /^busbar-/'
    - when: never
  variables:
    WEBSITE_EVENT_REPOSITORY: $CI_PROJECT_PATH
    WEBSITE_SOURCE_REVISION: $CI_COMMIT_SHA
    WEBSITE_UPSTREAM_PIPELINE_ID: $CI_PIPELINE_ID
  trigger:
    project: BusbarInc/marketing
    branch: dev
    strategy: mirror
    forward:
      yaml_variables: true
      pipeline_variables: false
