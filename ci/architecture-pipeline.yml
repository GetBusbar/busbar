# Selected by each project's CI configuration setting at an immutable approved SHA.
# Candidate .gitlab-ci.yml and candidate architecture tooling are never executed here.
workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "dev" && ($CI_PROJECT_NAMESPACE == "GetBusbar" || $CI_PROJECT_NAMESPACE == "BusbarInc")'
    - if: '$CI_PIPELINE_SOURCE == "api" && ($CI_PROJECT_PATH == "GetBusbar/busbar" || $CI_PROJECT_PATH == "GetBusbar/busbar-plane-llm" || $CI_PROJECT_PATH == "GetBusbar/busbar-plane-decisions")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
    # Owner-created dev schedule: advisory database refresh. Runs security only.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "dev"'
    - when: never

stages: [qualify, website]

native-qualification:
  stage: qualify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH != "dev"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  tags: [busbar-native-admission]
  interruptible: true
  allow_failure: false
  retry: 0
  timeout: 4h
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
    RUSTUP_TOOLCHAIN: "1.98.0"
    CARGO_TERM_COLOR: never
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    - |
      set -eu
      # Bootstrap from the server-selected top-level configuration, not a variable
      # or script supplied by the candidate. Pipeline variable overrides are disabled.
      python3 -I -B - <<'PY'
      import base64, os, pathlib, re, shutil, subprocess
      uri = os.environ['CI_CONFIG_REF_URI']
      # GitLab identifies the consumer project/ref around the full external
      # configuration setting. The trusted revision is the SHA after its colon.
      match = re.fullmatch(r'(?:https://)?' + re.escape(os.environ['CI_SERVER_HOST']) + '/' + re.escape(os.environ['CI_PROJECT_PATH']) + r'//ci/architecture-pipeline\.yml@GetBusbar/busbar:([0-9a-f]{40})@refs/heads/[^\s]+', uri)
      if not match:
          raise SystemExit('CI configuration must select the approved immutable core revision: ' + uri)
      base = pathlib.Path(os.environ['BUSBAR_NATIVE_SCRATCH']).resolve()
      work = base / ('boundary-' + os.environ['CI_PROJECT_ID'] + '-' + os.environ['CI_JOB_ID'])
      work.mkdir(parents=True, exist_ok=False)
      trusted = work / 'trusted'
      trusted.mkdir()
      env = dict(os.environ)
      auth = base64.b64encode(('gitlab-ci-token:' + env['CI_JOB_TOKEN']).encode()).decode()
      server = env['CI_SERVER_URL'].rstrip('/')
      env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.' + server + '/.extraheader', GIT_CONFIG_VALUE_0='Authorization: Basic ' + auth, GIT_TERMINAL_PROMPT='0')
      try:
          subprocess.run(['git', '-C', str(trusted), 'init', '-q'], check=True)
          subprocess.run(['git', '-C', str(trusted), 'fetch', '--depth', '1', server + '/GetBusbar/busbar.git', match[1]], env=env, check=True)
          subprocess.run(['git', '-C', str(trusted), 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          actual = subprocess.check_output(['git', '-C', str(trusted), 'rev-parse', 'HEAD'], text=True).strip()
          if actual != match[1]:
              raise SystemExit('trusted policy checkout mismatch')
          command = ['python3', '-I', '-B', str(trusted / 'scripts/architecture/native_ci_bootstrap.py'), '--trusted', str(trusted), '--checkout', os.environ['CI_PROJECT_DIR'], '--work', str(work)]
          if os.environ['CI_JOB_NAME'] in ('native-qualification', 'core-conformance'):
              # Decide before any bootstrap download: exit 0 only after the trusted
              # module authenticated an equal-input successful original and wrote
              # boundary-evidence/retained.json naming it. Anything else runs fresh.
              retained = pathlib.Path(os.environ['CI_PROJECT_DIR']) / 'boundary-evidence/retained.json'
              decision = subprocess.run(['python3', '-I', '-B', str(trusted / 'scripts/architecture/ci_retention.py'), '--policy', match[1], '--checkout', os.environ['CI_PROJECT_DIR'], '--output', str(retained)])
              if decision.returncode == 0 and retained.is_file() and not retained.is_symlink():
                  command = None
              elif retained.exists() or retained.is_symlink():
                  raise SystemExit('retention decision left evidence without retaining')
          if os.environ['CI_JOB_NAME'] == 'security-scans':
              command = ['python3', str(trusted / 'scripts/security/scan.py'), '--trusted', str(trusted), '--checkout', os.environ['CI_PROJECT_DIR'], '--work', str(work), '--output', str(pathlib.Path(os.environ['CI_PROJECT_DIR']) / 'boundary-evidence/security.json')]
          elif os.environ['CI_JOB_NAME'] not in ('native-qualification', 'core-conformance', 'external-conformance', 'native-isolation-diagnostic') and not re.fullmatch(r'plugin-dependency-units [1-8]/8', os.environ['CI_JOB_NAME']):
              raise SystemExit('unrecognized trusted native job')
          if command is not None:
              subprocess.run(command, check=True)
      finally:
          shutil.rmtree(work, ignore_errors=True)
      PY
  artifacts:
    when: always
    access: developer
    expire_in: 30 days
    paths: [boundary-evidence/]

# Fixed-source runtime witnesses execute on an exclusive existing native worker.
# This API-only core diagnostic neither qualifies candidate code nor publishes it.
native-isolation-diagnostic:
  extends: native-qualification
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_PROJECT_PATH == "GetBusbar/busbar" && $CI_COMMIT_BRANCH =~ /^corefix-native-isolation-/'
    - when: never

# Runner 32 allocates a distinct one-use VM per job (capacity_per_instance=1,
# max_use_count=1, no shared cache). This job never executes candidate processes.
# Keep that lifecycle contract when changing the runner behind this tag.
security-scans:
  extends: native-qualification
  tags: [busbar-native-admission]
  timeout: 1h
  # Security always runs fresh, including the dev schedule; its own database
  # age/content checks decide freshness. It never invalidates native/conformance.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH != "dev"'
      when: never
    - when: on_success
  artifacts:
    when: always
    access: developer
    expire_in: 1 year
    paths: [boundary-evidence/security.json]

# Conformance is mandatory alongside native qualification. API runs remain useful
# diagnostics, but cannot replace these same-pipeline publication prerequisites.
core-conformance:
  extends: native-qualification
  tags: [busbar-conformance]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH =~ /^corefix-native-isolation-/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "ci/dep-cache"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PROJECT_PATH == "GetBusbar/busbar"'
    - when: never

# LLM's eight spec/voice suites and decisions' Jev suite run inside required
# native-qualification. Their protected ci-coverage roster cannot be omitted.
# Neither owner provides the former external-openai.sh/external-jev.sh endpoint
# entrypoints; no separate external endpoint certification is claimed.

# Trusted producer of prebuilt plugin dependency units (native_dep_cache.py). Only
# a protected core dev push; stage order runs it only after every qualification
# job (native, conformance, security) passed, beside website-dev. It runs no
# candidate code: each pinned product's manifests and lock with every Rust source
# stubbed, built in the ordinary confinement, published with this job's
# CI_JOB_TOKEN to core's own generic package registry. Eight parallel instances
# ("plugin-dependency-units K/8") each own a fixed digest-assigned subset of the
# products, within the ordinary per-job confinement budget; a per-index
# resource_group serialises successive pushes so each package file is written
# exactly once.
# The owner may also fill the cache without a qualification run: an API pipeline
# on the protected ci/dep-cache branch (pointed only at a commit already on dev)
# runs only these eight jobs; every other job's rules exclude that ref. The
# controller proves the commit is on current dev, and those files are keyed to
# that exact core commit, so only plugins qualifying against it accept them.
plugin-dependency-units:
  extends: native-qualification
  stage: website
  interruptible: false
  allow_failure: true
  parallel: 8
  # A first fill builds at most six products per instance (~5 min each); later
  # runs only products whose lock or toolchain identity changed.
  timeout: 2h
  resource_group: plugin-dependency-units-$CI_NODE_INDEX
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev" && $CI_PROJECT_PATH == "GetBusbar/busbar"'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "ci/dep-cache" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PROJECT_PATH == "GetBusbar/busbar"'
    - when: never
  artifacts:
    when: always
    access: developer
    expire_in: 30 days
    paths: [boundary-evidence/]

# Every qualified assembled-product dev change refreshes current website evidence.
# The marketing pipeline independently verifies source and binary freshness.
website-dev:
  stage: website
  # Stage ordering requires every qualification job, including conformance.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev" && $CI_PROJECT_PATH == "GetBusbar/busbar"'
      variables:
        WEBSITE_CORE_REVISION: $CI_COMMIT_SHA
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev" && $CI_PROJECT_NAMESPACE == "GetBusbar" && $CI_PROJECT_NAME =~ /^busbar-/'
    - when: never
  variables:
    WEBSITE_EVENT_REPOSITORY: $CI_PROJECT_PATH
    WEBSITE_SOURCE_REVISION: $CI_COMMIT_SHA
    WEBSITE_UPSTREAM_PIPELINE_ID: $CI_PIPELINE_ID
  trigger:
    project: BusbarInc/marketing
    branch: dev
    strategy: mirror
    forward:
      yaml_variables: true
      pipeline_variables: false
