# Selected at an immutable core revision by each SDK project's CI configuration.
# The committed SDK is regenerated and checked; this job never publishes a package.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "dev"'
    - when: never

stages: [verify]

sdk-generation-and-tests:
  stage: verify
  tags: [busbar-native-admission]
  allow_failure: false
  interruptible: true
  retry: 0
  timeout: 1h
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - |
      python3 - <<'PY'
      import datetime, hashlib, json, os, pathlib, re, subprocess, urllib.parse, urllib.request
      root = pathlib.Path(os.environ['CI_PROJECT_DIR']).resolve()
      evidence = root / 'sdk-ci-evidence'
      evidence.mkdir(exist_ok=True)
      repository = os.environ['CI_PROJECT_PATH']
      recipes = {
          'GetBusbar/busbar-js': (
              'node:22-bookworm@sha256:7702d8aa4d5910871692af4480eb3ba86f23047a6417a44d857d06c95d060d3f',
              ['npm ci --ignore-scripts', 'npm run generate', 'npm run typecheck', 'npm run build',
               'node --test tests/package-smoke.mjs'],
              ['src', 'openapi.json', 'package.json', 'package-lock.json']),
          'GetBusbar/busbar-go': (
              'golang:1.25-bookworm@sha256:3b4a11519ad929d1e1d261a12cff056f0c85b735253d7d861346b9c6f8b36437',
              ['go generate ./...', 'go build ./...', 'go vet ./...', 'go test ./...'],
              ['client.gen.go', 'openapi.json', 'go.mod', 'go.sum']),
          'GetBusbar/busbar-python': (
              'python:3.13-bookworm@sha256:cc55e4ded9c95f6ce2133b3d096db43f214d280c2a8af65d83e246c8fa7d168c',
              ['python -m venv /tmp/sdk-venv', 'export PATH=/tmp/sdk-venv/bin:$PATH',
               'python -m pip install -r requirements-dev.txt', 'make generate',
               'python -m pip install -e .', 'python -m unittest discover -s tests'],
              ['busbar_admin', 'setup.py', 'GENERATED_CLIENT.md', 'openapi.json']),
      }
      if repository not in recipes:
          raise SystemExit('This configuration only qualifies the three Admin API SDKs')
      image, steps, generated = recipes[repository]
      revision = os.environ.get('BUSBAR_OPENAPI_CORE_REVISION', '')
      receipt = dict(repository=repository, source=os.environ['CI_COMMIT_SHA'],
                     core_revision=revision, image=image, status='fail',
                     pipeline=os.environ['CI_PIPELINE_ID'], job=os.environ['CI_JOB_ID'])
      name = 'busbar-sdk-' + os.environ['CI_JOB_ID']
      try:
          if not re.fullmatch('[0-9a-f]{40}', revision):
              raise ValueError('Set the owner-controlled immutable BUSBAR_OPENAPI_CORE_REVISION')
          path = urllib.parse.quote('crates/busbar-core-admin/src/v1/json/openapi.json', safe='')
          url = os.environ['CI_API_V4_URL'] + '/projects/3/repository/files/' + path + '/raw?ref=' + revision
          request = urllib.request.Request(url, headers={'JOB-TOKEN': os.environ['CI_JOB_TOKEN']})
          with urllib.request.urlopen(request, timeout=60) as response:
              canonical = response.read()
          receipt['openapi_sha256'] = hashlib.sha256(canonical).hexdigest()
          if (root / 'openapi.json').read_bytes() != canonical:
              raise ValueError('SDK openapi.json differs from its pinned canonical core specification')
          script = 'set -eu\n' + '\n'.join(steps)
          command = ['docker', 'run', '--rm', '--name', name,
                     '--user', str(os.getuid()) + ':' + str(os.getgid()),
                     '-v', str(root) + ':/work', '-w', '/work',
                     '-e', 'NPM_CONFIG_CACHE=/tmp/npm-cache',
                     '-e', 'GOPATH=/tmp/gopath', '-e', 'GOCACHE=/tmp/go-cache',
                     '-e', 'PIP_CACHE_DIR=/tmp/pip-cache', image, 'bash', '-c', script]
          with (evidence / 'verification.log').open('w') as log:
              result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=3300)
          receipt['verification_exit_code'] = result.returncode
          if result.returncode:
              print((evidence / 'verification.log').read_text()[-20000:])
              raise ValueError('SDK generation, compilation or tests failed')
          changes = subprocess.check_output(
              ['git', '-C', str(root), 'status', '--porcelain=v1', '--untracked-files=all', '--', *generated], text=True)
          (evidence / 'generated-drift.txt').write_text(changes)
          if changes:
              print(changes)
              raise ValueError('Generated SDK is stale; regenerate and commit the client')
          receipt['status'] = 'pass'
      finally:
          subprocess.run(['docker', 'rm', '-f', name], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          receipt['finished_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          (evidence / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
      PY
  artifacts:
    when: always
    access: developer
    expire_in: 30 days
    paths: [sdk-ci-evidence/]
