[assembly]
native = { services = ["postgres", "mysql", "valkey", "vault", "wiremock", "openldap"], migration_fixture = "sqlite-1.5.5" }
repository = "GetBusbar/busbar"
manifest = "dist/default/Cargo.toml"
package = "busbar-default"
dev_allows = ["busbar-hook-webrequest", "busbar-store-sqlite", "busbar-store-postgres", "busbar-auth-webhook-signature", "busbar-export-webhook", "busbar-hook-ranking", "busbar-export-prometheus", "busbar-plugin-loader", "busbar-auth-oauth", "busbar-auth-oidc", "busbar-auth-oidc-plugin", "busbar-contract", "busbar-core-admin", "busbar-core-connector", "busbar-export-file-plugin", "busbar-export-otlp-plugin", "busbar-export-prometheus-plugin", "busbar-kernel", "busbar-kernel-audit", "busbar-plane-a2a", "busbar-plane-llm", "busbar-plane-mcp", "busbar-transport-tcp-plugin"]
registration = ["dist/default/src/linked.rs", "crates/busbar/src/root/linked.rs"]

[[test_hosts]]
repository = "GetBusbar/busbar-transport-webrtc"
package = "webrtc-conformance-subject"
manifest = "testing/webrtc-conformance/subject/Cargo.toml"
allows = ["busbar-contract", "busbar-core-connector", "busbar-plugin-loader", "busbar-transport-webrtc"]

[[test_hosts]]
repository = "GetBusbar/busbar-transport-ws"
package = "ws-conformance-subject"
manifest = "testing/ws-conformance/subject/Cargo.toml"
generated_by = "testing/ws-conformance/scripts/subject-manifest.sh"
allows = ["busbar-contract", "busbar-core-connector", "busbar-plugin-loader", "busbar-transport-ws", "busbar-transport-tcp"]

[[external_sources]]
name = "mysql_common"
repository = "GetBusbar/busbar-store-mysql"

[[external_sources]]
name = "postgres-protocol"
repository = "GetBusbar/busbar-store-postgres"

