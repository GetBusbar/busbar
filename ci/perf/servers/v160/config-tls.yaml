# 1.6.0 on the engine line, over TLS. The same provider, model, pool and mock upstream as
# ../v155/config-tls.yaml, in 1.6.0's config shape.
listen: "0.0.0.0:18160"
providers_file: @RUN@/providers.yaml
admin_listen: "127.0.0.1:18161"
admin_listen_insecure_transport: { accept: [plaintext], reason: "loopback measurement in a private network namespace" }
admin_require_mtls: false
store: {module: memory}
identity-providers:
  admin-tokens:
    module: admin-tokens
    settings: { sha256: "@ADMIN_SHA256@" }
auth:
  chain: [anonymous]       # 1.6.0's named open relay (v155: chain: [], unauthenticated); no group, no budget
  role_bindings:
    anonymous: { "*": { allowed_pools: [default] } }   # names a scope (an empty binding is refused, BUSBAR-3114): the one pool the chat route uses
  admin_auth:
    - admin-tokens
providers:
  mock:
    api_key: none   # 1.6.0 has no admitted `env` secret module in this fixture; the stub checks no credential
models:
  test-model:
    provider: mock
pools:
  default:
    members:
      - model: test-model
# The same listener terminating TLS with this run's certificate (docs/configuration.md `tls`);
# the plaintext exception of config.yaml is not stated here.
tls:
  cert: { file: "@TLS@/leaf.pem" }
  key: { file: "@TLS@/leaf.key" }
