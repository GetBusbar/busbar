# Bounded first-party rules, not a claim of comprehensive SAST coverage.
rules:
  - id: busbar.python-unverified-tls
    languages: [python]
    message: TLS verification must not be disabled.
    severity: ERROR
    pattern-either:
      - pattern: ssl._create_unverified_context(...)
      - pattern: requests.$METHOD(..., verify=False, ...)
  - id: busbar.python-dynamic-shell
    languages: [python]
    message: Pass an argument vector instead of executing a shell command.
    severity: ERROR
    pattern-either:
      - pattern: subprocess.$METHOD(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
  - id: busbar.python-unsafe-yaml
    languages: [python]
    message: Use safe_load for YAML from outside the trust boundary.
    severity: ERROR
    pattern: yaml.unsafe_load(...)
  - id: busbar.rust-unverified-tls
    languages: [rust]
    message: TLS peer verification must not be disabled.
    severity: ERROR
    pattern-either:
      - pattern: $X.danger_accept_invalid_certs(true)
      - pattern: $X.danger_accept_invalid_hostnames(true)
  - id: busbar.c-unbounded-input
    languages: [c]
    message: gets cannot bound input to the destination buffer.
    severity: ERROR
    pattern: gets(...)
  - id: busbar.javascript-dynamic-code
    languages: [javascript, typescript]
    message: Dynamic source evaluation needs explicit security review.
    severity: ERROR
    pattern: eval(...)
