# THE 1.5.5 BYTES of the 1.5.3 observability lift-out and the 1.x hook registry, which the kernel now
# prints from the root legacy table's rows (plugins.yaml `legacy:`; crates/busbar/src/root/tests/legacy.rs holds
# `--migrate-config`, boot's 1.x refusal and the unknown-field hints to these). Every line is
# verbatim from the v1.5.5 source cited above it; a value here never changes.
config: |
  hooks:
    audit:
      webhook: "https://sidecar.internal/audit"
      kind: tap
    bare:
      kind: tap
  observability:
    otlp_endpoint: "http://otel:4318/v1/traces"
    request_log_webhook_url: "https://logs.example.com/busbar"
    max_inflight_webhook_deliveries: 32
    webhook_delivery_timeout_secs: 5
  metrics:
    buffer_seconds: 60
  providers: {}
  models: {}
  pools: {}
# `--migrate-config`'s change lines.
changes:
