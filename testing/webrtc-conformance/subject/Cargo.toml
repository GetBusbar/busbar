[package]
name = "webrtc-conformance-subject"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"
rust-version = "1.97"
description = "Browser-cell subject: busbar's terminating datagram path (the webrtc door, the connector's datagram driver and host port) answering a browser's offer and echoing its channels and lines."

# TESTKIT, NOT PRODUCT PATH. This binary exists only so headless browsers have busbar's real
# terminating path to call: the webrtc door admitted through the root's own doors module (mounted
# by path, as testing/ws-conformance/subject mounts it), driven by the connector's EXISTING public
# datagram API (`datagram::DatagramFraming`, `datagram::Associations`, `udp::ReadyPort`) over one
# host port. It is not shipped, `cargo build --bin busbar` never builds it, and it adds no product
# surface.
[[bin]]
name = "webrtc-conformance-subject"
path = "src/main.rs"

[dependencies]
busbar-contract = { path = "../../../crates/busbar-contract" }
busbar-transport-webrtc = { workspace = true }
busbar-core-connector = { path = "../../../crates/busbar-core-connector" }
busbar-plugin-loader = { path = "../../../crates/plugin-loader" }
# The mounted doors module lends the dispatcher the kernel's seal (`busbar_kernel::seal::lend()`, #1021).
busbar-kernel = { path = "../../../crates/busbar-kernel", default-features = false }
# The mounted doors module builds each door's typed settings into the JSON object its `open` reads.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "sync", "time"] }
