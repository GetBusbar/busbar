# THE BLACK-BOX 1.5.5 ORACLE, DECOUPLED (busbar-release planning/design/ORACLE-FIRST.md; owner Q7/Q7b).
# A test-only package: the dist/default tests that judge the product against testing/shadow-oracle/ and
# tests/v1.5.5-validate, compiled BY PATH from dist/default/tests (the same files; no copy, no edit), with
# NO plugin crate. The product they boot is core's own `busbar` binary (BUSBAR_TEST_PRODUCT_BIN) with the
# bundled plugins loaded from packages (testing/oracle/launch.sh), never compiled in. busbar-release
# ci/qa.yml `oracle` builds core, fetches the packages, and runs this package.
#
# Its own workspace (excluded from the root, like dist/default): the root `test` job never builds it.
[package]
name = "busbar-oracle-blackbox"
version = "1.6.0"
publish = false
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
build = "build.rs"
autotests = false
autobins = false
autoexamples = false
autobenches = false

[features]
# The product's feature words as the root-tests subject (dist/default --features test-harness,openapi-schema)
# stated them: BUSBAR_ENABLED_FEATURES and the case `requires.features` read them. Markers only here;
# ci/qa.yml enables both (`--features test-harness,openapi-schema`) and builds the subject core with them.
test-harness = []
openapi-schema = []
loom-model = []

# Core crates only (by path), with the features dist/default's tests compile them with; the external crates
# the shared `common/` helpers and the oracle files use. Not one plugin crate.
[dependencies]
busbar-contract = { path = "../../crates/busbar-contract", features = ["test-seal", "tls", "test-support"] }
busbar-plugin-loader = { path = "../../crates/plugin-loader", features = ["test-support"] }
busbar-kernel = { path = "../../crates/busbar-kernel", features = ["test-support"] }
busbar-core-connector = { path = "../../crates/busbar-core-connector", features = ["test-support"] }
serde_json = "1"
hex = "0.4.3"
base64 = "0.22"
socket2 = { version = "0.6", features = ["all"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pki-types = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = { version = "0.14", default-features = false, features = ["std"] }

[build-dependencies]
busbar-linked-gen = { path = "../../crates/busbar-linked-gen" }
serde_json = "1"

# The oracle binaries. Each is a dist/default test file, by path. root-tests (busbar-release ci/core.yml)
# reads these names and leaves them to `oracle`.
[[test]]
name = "validate_matches_the_1_5_5_golden"
path = "../../dist/default/tests/validate_matches_the_1_5_5_golden.rs"

[[test]]
name = "scrape_shape_1_5_5"
path = "../../dist/default/tests/scrape_shape_1_5_5.rs"

[[test]]
name = "metrics_scrape_boot_window"
path = "../../dist/default/tests/metrics_scrape_boot_window.rs"

[[test]]
name = "models_empty_surface_1_5_5"
path = "../../dist/default/tests/models_empty_surface_1_5_5.rs"

[[test]]
name = "export_request_log_file_1_5_5"
path = "../../dist/default/tests/export_request_log_file_1_5_5.rs"

[[test]]
name = "export_settings_refusal_1_5_5"
path = "../../dist/default/tests/export_settings_refusal_1_5_5.rs"

[[test]]
name = "export_unknown_module_lists_what_links"
path = "../../dist/default/tests/export_unknown_module_lists_what_links.rs"

[[test]]
name = "plane_blackbox"
path = "../../dist/default/tests/plane_blackbox.rs"

[[test]]
name = "oracle_store_ports"
path = "../../dist/default/tests/oracle_store_ports.rs"

# THE HOUSE (H01-H04): the actual product binary with the signed pilot cohort this job packs, booted from
# the Memory configuration. It reads the cohort from launch.env (ORACLE_CORE, ORACLE_PLUGINS, ORACLE_FETCH).
[[test]]
name = "house_runtime"
path = "../../dist/default/tests/house_runtime.rs"

# THE BUNDLED SET: dist/default's own tables, verbatim, so build.rs derives the same `linked_*` cfgs and
# BUSBAR_LINKED_* values the product build had (the same cells apply). These say what the subject must
# serve; they link nothing. testing/oracle/bundle lists the same set as the packages ci/qa.yml loads.
[package.metadata.busbar.core]
dir = "../../crates/busbar"

