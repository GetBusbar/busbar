# THE OUTBOUND CARRIERS: dist/default assigns `http = "transport-http"`; this copy states no table. The subject
# here is core with packages, where the build assigns nothing; a dropped-in transport's assignment is a later step.

[package.metadata.busbar.driver-proofs]
plane-llm-door = "busbar-plane-llm"

[workspace]
resolver = "2"
members = ["."]

# Dependency patches are effective only at the consuming workspace root: the root workspace's, verbatim.
[patch.'https://github.com/GetBusbar/busbar']
busbar-contract = { path = "../../crates/busbar-contract" }

busbar-crypto-backend = { path = "../../crates/busbar-crypto-backend" }

[patch.crates-io]
