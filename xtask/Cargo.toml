# xtask — the workspace's own build-time tooling, per the standard cargo-xtask pattern (a plain
# workspace member invoked as `cargo xtask <verb>` via the `.cargo/config.toml` alias; no separate
# build system, no shell script duplicating what Cargo already knows about the crate graph).
#
# WHY IT EXISTS. ARCHITECTURE.md section 1.2 specifies a transitive source denylist over the pure
# plugin kinds (plane, hook, static auth, egress-auth-scheme): no banned crate anywhere in their
# normal-dependency closure, no banned std/tokio path in their own src/. Section 8.3 lists
# `cargo xtask gate` and section 9.1 makes `xtask` an M1 deliverable. Neither existed before this
# crate (docs/design/1.6.0-contract-gaps.md CG-59) — `cargo metadata` is the only source of truth
# for a TRANSITIVE dependency closure, and nothing short of a cargo subcommand can run it.
[package]
name = "xtask"
version = "0.1.0"
publish = false            # internal workspace tool; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "Workspace tooling: `cargo xtask denylist` proves the pure plugin kinds carry no banned transitive source (ARCHITECTURE.md section 1.2, CG-59)."
license = "Apache-2.0"

# The gate logic is a LIBRARY and the binary is a five-line dispatcher over it. `cargo test -p
# xtask` then drives every gate, reader and reconciliation directly — a test that has to shell out
# to the binary can only assert on printed text, which is how a self-test ends up re-implementing
# the thing it is supposed to prove.
[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# The only external dependency: cargo metadata's own JSON, parsed as a generic Value. No
# `cargo_metadata` crate — one more dependency for a tool whose entire point is auditing
# dependencies is one worth not adding, and the format-version=1 shape this tool reads is small.
serde_json = { workspace = true }

# ── THE CONFORMANCE HARNESS'S SUBJECTS ───────────────────────────────────────────────────────────
#
# A kind's shared conformance battery is TOOLING, and tooling depends on the plugins it drives —
# never the reverse. The obvious shape (a helper crate every plugin crate takes as a dev-dependency)
# puts a `unit -> plugin-tooling` edge in fourteen manifests, and the kind graph refuses every one
# of them: `not-allowed`, and introduced by the branch, which no `[[dep]]` row may admit.
#
# So the subjects are named HERE. `xtask` is the gate runner, and `kind_isolation`'s own
# `OFF_TREE_MANIFESTS` says what that means in its own words: "a workspace member and not a crate of
# the product tree: it has no kind, it ships in no artifact, and every rule here is a rule it
# enforces rather than one it is subject to". These edges are the tooling's; no kind edge is created
# and no `[[cell]]` moves.
#
# `[dev-dependencies]`, deliberately: `cargo run -p xtask -- gate …` — every gate run, on every push
# — builds the runner and nothing below. These compile under `cargo test -p xtask` and nowhere else.
[dev-dependencies]
# The `unit` kind's entry face, its steps and `Decision<S>`: what `tests/battery/unit.rs` is written
# against.
busbar-caps = { path = "../crates/busbar-caps" }
# The fourteen `unit` crates, the subjects of `tests/unit_conformance.rs`.
busbar-unit-admission = { path = "../crates/busbar-unit-admission" }
busbar-unit-audit = { path = "../crates/busbar-unit-audit" }
busbar-unit-auth = { path = "../crates/busbar-unit-auth" }
busbar-unit-breaker = { path = "../crates/busbar-unit-breaker" }
busbar-unit-cost = { path = "../crates/busbar-unit-cost" }
busbar-unit-egress = { path = "../crates/busbar-unit-egress" }
busbar-unit-egress-auth = { path = "../crates/busbar-unit-egress-auth" }
busbar-unit-ledger = { path = "../crates/busbar-unit-ledger" }
busbar-unit-scope = { path = "../crates/busbar-unit-scope" }
busbar-unit-transport-key = { path = "../crates/busbar-unit-transport-key" }
busbar-unit-trust = { path = "../crates/busbar-unit-trust" }
busbar-unit-usage = { path = "../crates/busbar-unit-usage" }
busbar-unit-verbs = { path = "../crates/busbar-unit-verbs" }
busbar-unit-wal = { path = "../crates/busbar-unit-wal" }
# The `transport` kind's declaration face (`TransportMeta`), which `tests/battery/transport.rs` is
# written against, and the seven wires that state it.
busbar-contract = { path = "../crates/busbar-contract" }
busbar-transport-grpc = { path = "../crates/busbar-transport-grpc" }
busbar-transport-http = { path = "../crates/busbar-transport-http" }
busbar-transport-sse = { path = "../crates/busbar-transport-sse" }
busbar-transport-stdio = { path = "../crates/busbar-transport-stdio" }
busbar-transport-tcp = { path = "../crates/busbar-transport-tcp" }
busbar-transport-tls = { path = "../crates/busbar-transport-tls" }
busbar-transport-ws = { path = "../crates/busbar-transport-ws" }
# The universal `open`-seam contract, which `busbar-plugin-testkit` has held since 1.5 and which the
# contract-kind battery wires. The edge runs tooling -> tooling and creates nothing.
busbar-plugin-testkit = { path = "../crates/plugin-testkit" }
