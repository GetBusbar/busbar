# xtask — the workspace's own build-time tooling, per the standard cargo-xtask pattern (a plain
# workspace member invoked as `cargo xtask <verb>` via the `.cargo/config.toml` alias; no separate
# build system, no shell script duplicating what Cargo already knows about the crate graph).
#
# WHY IT EXISTS. BUSBAR-1.6.0.md THE DESIGN, §2 specifies a transitive source denylist over the pure
# plugin kinds (plane, hook, static auth, egress-auth-scheme): no banned crate anywhere in their
# normal-dependency closure, no banned std/tokio path in their own src/. Section 8.3 lists
# `cargo xtask gate` and section 9.1 makes `xtask` an M1 deliverable. Neither existed before this
# crate (docs/design/BUSBAR-1.6.0.md #7 CG-59) — `cargo metadata` is the only source of truth
# for a TRANSITIVE dependency closure, and nothing short of a cargo subcommand can run it.
[package]
name = "xtask"
version = "0.1.0"
publish = false            # internal workspace tool; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "Workspace tooling: `cargo xtask denylist` proves the pure plugin kinds carry no banned transitive source (BUSBAR-1.6.0.md THE DESIGN, §2, CG-59)."
license = "Apache-2.0"

# The gate logic is a LIBRARY and the binary is a five-line dispatcher over it. `cargo test -p
# xtask` then drives every gate, reader and reconciliation directly — a test that has to shell out
# to the binary can only assert on printed text, which is how a self-test ends up re-implementing
# the thing it is supposed to prove.
[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# Cargo metadata's own JSON, parsed as a generic Value. No `cargo_metadata` crate — one more
# dependency for a tool whose entire point is auditing dependencies is one worth not adding, and the
# format-version=1 shape this tool reads is small.
serde_json = { workspace = true }
# THE LINE COUNTER PARSES RUST; EVERY OTHER READER HERE TREATS IT AS TEXT, and that difference is
# the point of `cargo xtask loc`. The rule this crate otherwise lives by — "xtask reads the tree as
# TEXT" — is about not `use`ing the TYPES it audits, so that a verdict cannot move when a product
# type moves; `syn` is a grammar, not a busbar type, and nothing about the tree's own code can
# change what it parses. What text-reading bought instead was three different wrong answers to one
# question, each from a scanner that mis-handled a nested block comment, a raw string or a char
# literal. See the note beside these two in the workspace table.
proc-macro2 = { workspace = true }
# THE WIRE LOCKS READ THREE YAML SPECS (openai, anthropic, cohere), each several MB of full YAML.
# `yaml_lite` is deliberately the workflow subset only, so the spec reader uses the workspace's
# existing YAML parser (already in Cargo.lock via busbar-contract); no new crate enters the lock.
serde_yaml = { workspace = true }
# The spec reader's YAML -> JSON visitor (serde is already in the closure via serde_json).
serde = { workspace = true }
syn = { workspace = true }
# `cargo xtask audit-verify` checks a node's published audit-chain signatures (ed25519) WITHOUT the
# product's code (#82(c), TODO 597). ring is the workspace's one crypto backend and already in
# Cargo.lock; xtask is dev tooling and ships in no binary (ARCHITECT 2026-10-01, MC-2).
ring = { workspace = true }
# `cargo xtask conformance record`'s tls, h2 and oidf rigs boot busbar on a TLS listener with a
# certificate minted per run by a throwaway CA, so a scanner grades busbar's stack and not a missing
# public CA. rcgen on ring, already in Cargo.lock (busbar-core-connector, busbar-a2a); `pem` writes
# the files busbar's `tls:` block reads. xtask ships in no binary.
rcgen = { workspace = true, features = ["pem"] }

[dev-dependencies]
# Test-only: proves the verifier's small-order key table against an independent curve
# implementation (`VerifyingKey::is_weak`), already in Cargo.lock as busbar-kernel-audit's signer.
ed25519-dalek = { workspace = true }
