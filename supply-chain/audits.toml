[[audits.cmake]]
who = "OpenAI Codex (/root/finish_distribution/admin_finish; AI-assisted source review)"
criteria = "safe-to-deploy"
version = "0.1.58"
notes = "AI-assisted actual source review, not human approval or executed tests. Exact crate archive SHA256 c0f78a02292a74a88ac736019ab962ece0bc380e3f977bf72e376c5d78ff0678 matches the target dist lock and every archive file matches reviewed cached source. All implementation code, manifest and documented build-tool contract reviewed. Direct Command argument vectors invoke the configured CMake/compiler tools; no Rust shell expansion, downloaded payload, network client, hidden install path or runtime code generator is present. Default installation goes under OUT_DIR; cache cleanup targets OUT_DIR/build. Output is native artifacts produced by the explicitly selected source/toolchain, so native source and cc dependency remain separately audited inputs. Windows fix_build_dir is the sole unsafe implementation block. It passes a nul-terminated UTF-16 input and a sized initialized Vec to GetFullPathNameW. Failure or a larger second result returns the original path before conversion; returned length truncates only within allocation. No Rust-memory write is driven by an unchecked input length. Assumes trusted build configuration, source/CMake scripts, PATH, CMAKE_* and OUT_DIR. A malicious configured native project can run arbitrary build actions; this helper is not a sandbox. CMake INSTALL_PREFIX can intentionally override OUT_DIR, and cache cleanup is not symlink- or adversarial-workspace-confined. Do not use untrusted shared build directories. cc1.2.62 and native C/C++ code are not certified by this crate review."

