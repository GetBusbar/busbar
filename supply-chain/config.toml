
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[policy.aws-lc-sys]
audit-as-crates-io = true
notes = "Exact-revision standalone published-package source fork; local nonimportable full Git audit only, no exemption or claim covering the unfixed registry archive."

[policy.dunce]
audit-as-crates-io = true
notes = "Local full audits bind exact reviewed Git snapshots; published registry bases are not certified by those records."

[policy.fs_extra]
audit-as-crates-io = true
notes = "Local full audit binds the exact reviewed fixed Git snapshot; the published registry base is not certified."

[policy.h2]
audit-as-crates-io = true

[policy.jobserver]
audit-as-crates-io = true
notes = "Local full audits bind exact reviewed Git snapshots; published registry bases are not certified by those records."

[policy.tungstenite]
audit-as-crates-io = true

