
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.aranya]
url = "https://raw.githubusercontent.com/aranya-project/aranya/main/supply-chain/audits.toml"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[policy.aws-lc-sys]
audit-as-crates-io = true
notes = "Exact-revision standalone published-package source fork; local nonimportable full Git audit only, no exemption or claim covering the unfixed registry archive."

[policy.dunce]
audit-as-crates-io = true
notes = "Local full audits bind exact reviewed Git snapshots; published registry bases are not certified by those records."

[policy.fs_extra]
audit-as-crates-io = true
notes = "Local full audit binds the exact reviewed fixed Git snapshot; the published registry base is not certified."

[policy.granit-parser]
audit-as-crates-io = true
notes = "Published 2.1.0 plus busbar's opt-in bom_inside_document_as_content patch; the local delta audit covers exactly that diff."

[policy.h2]
audit-as-crates-io = true

[policy.jobserver]
audit-as-crates-io = true
notes = "Local full audits bind exact reviewed Git snapshots; published registry bases are not certified by those records."

[policy.olpc-cjson]
audit-as-crates-io = true
notes = "Exact-revision Git fork of the published 0.1.4; see its exemption."

[policy.serde-saphyr]
audit-as-crates-io = true
notes = "Published 2.1.1 plus busbar's opt-in serde_yaml-compatibility patch; the local delta audit covers exactly that diff."

[policy.sonic-number]
audit-as-crates-io = true
notes = "Unchanged sonic-number 0.1.3 from the sonic-rs fork repository; see the sonic-rs exemption."

[policy.sonic-rs]
audit-as-crates-io = true
notes = "Exact-revision Git fork of sonic-rs 0.5.11; see its exemption."

[policy.sonic-simd]
audit-as-crates-io = true
notes = "Unchanged sonic-simd 0.1.4 from the sonic-rs fork repository; see the sonic-rs exemption."

[policy.tungstenite]
audit-as-crates-io = true

