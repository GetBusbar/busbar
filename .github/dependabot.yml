# Version updates are monthly and grouped into one PR per ecosystem.
# Security updates are separate and run whenever an advisory is published.
version: 2
updates:
- package-ecosystem: cargo
  directory: /
  target-branch: dev
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  commit-message:
    prefix: deps
  groups:
    all:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  target-branch: dev
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  commit-message:
    prefix: ci
  groups:
    all:
      patterns:
      - '*'
