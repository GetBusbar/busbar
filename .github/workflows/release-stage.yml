name: Release stage

# EVERYTHING IS BUILT AND PROVEN HERE, ON `qa`. NOTHING IS NAMED HERE.
#
# THE SPLIT, AND THE OWNER'S WORDS THAT DEFINE IT (2026-08-27): "push to dev, fast builds and
# tests; push to qa, everything is done and tested; push to main and it just tags and releases
# what was built in qa. going to qa is identical PGO build just not finalized and pushed. we
# shouldn't be building again on main as that build is not technically what we QA'd."
#
# Before this split, release.yml did BOTH halves on the push to main: build, stage, verify, then
# promote, in one run. The order inside that run was already right -- nothing public until the
# staged verification went green -- but the BYTES were still born on the main push. Whatever soaked
# on `qa` (qa-gate's full multi-hour plugin gate, any manual poking at the staged image, any
# benchmarking) was a statement about a DIFFERENT build than the one main produced and shipped.
# "Should be identical" is exactly the reasoning this repository has already paid for twice
# (the two-build-path release key gap; the rebuild-instead-of-retag promote), so it is removed
# the same way: there is now exactly ONE build, and it happens HERE.
#
# WHAT A PUSH TO `qa` NOW DOES:
#
#   plan            read the version from Cargo.toml, refuse if that name is already taken
#                   anywhere (git tag, published release, immutable Docker Hub tag), mint the
#                   throwaway name `staging-<sha12>`.
#   branch-green    wait for THIS COMMIT's CI run to conclude green. Scoped to the REQUIRED
#                   workflow names only, unlike release.yml's promote-time gate which waits for
#                   EVERYTHING -- see the comment on the job for why the scopes differ and why
#                   that is not a loophole.
#   gate            the full suite on the exact commit being staged, with the live service
#                   containers, same as ever.
#   draft           the GitHub Release as a DRAFT, anchored to this qa commit. Iterations for the
#                   same version REUSE one draft and re-anchor it (see the job).
#   build+attach    binaries, SBOM, OpenAPI, provenance, all onto the draft.
#   stage-image     docker.yml builds the multi-arch PGO image and pushes it under
#                   `staging-<sha12>` ONLY, with the build-provenance attestation recorded
#                   against the digest. This IS the release image; it just does not have its
#                   name yet.
#   verify-*        every verifier release.yml ran before the split, unchanged: draft assets by
#                   name, the per-artifact contract on native runners, set equality, and
#                   verify-deploy.yml in `staging` mode against the staged image and the draft's
#                   real bytes.
#   record-staged   write the durable record -- version, qa sha, staging tag, manifest digest --
#                   as the `staged-manifest` artifact of this run. That record is the ONLY input
#                   release.yml's promote consumes. No record, no promote.
#
# WHAT THIS WORKFLOW MUST NEVER DO: mint a user-facing name. No git tag, no published release, no
# `X.Y.Z` or `latest` container tag, no fan-out, no announcement. Those all belong to release.yml
# on the push to main, which retags the digest recorded here and touches no compiler.
# scripts/release-order-lint.py enforces both directions of that split.
#
# THE ITERATION LOOP THIS EXISTS TO SERVE. "we repeat until 1.6.0 is perfect and qa green, then we
# push to main after X iterations." Every push to qa runs this whole pipeline again: a fresh sha, a
# fresh `staging-<sha12>` tag, a fresh digest, a fresh record, the same reused draft re-filled and
# re-anchored. Iterations do not accumulate state anywhere except the registry's staging tags (see
# the retention note in record-staged). The promote on main looks up the record BY MAIN'S OWN HEAD
# SHA, so only the iteration that is actually fast-forwarded to main can ever ship, and every
# earlier iteration is unreachable by construction rather than by discipline.
#
# BENCHMARKING SLOTS IN HERE, AGAINST THE STAGED IMAGE. Anything that prices or profiles "the
# release" -- the benchmarking harness, a manual soak, a customer repro -- should pull
# `getbusbar/busbar:staging-<sha12>` (or better, the digest from this run's staged-manifest).
# Because the promote is a manifest-only retag, the numbers measured against the staged image are
# numbers about the exact bytes that ship, not about a sibling build that ought to match them.
#
# WHAT IT COSTS, STATED HONESTLY. The full build-and-verify pipeline now runs on EVERY qa push,
# not once per release -- that is the point ("everything is done and tested" at qa), and it is
# real money: the two-arch PGO container build alone is ~40 minutes. Pushing to qa is the act of
# spending that. dev remains the cheap branch; do not push to qa to "see if CI likes it".
on:
  # LANDING ON `qa` IS THE STAGING TRIGGER. main pushes are release.yml's business and dev pushes
  # get ci.yml only. `qa` is where "everything is done and tested" is paid for.
  push:
    branches: [qa]
  # Manual re-run of the same qa commit after fixing whatever went red (infra flake, registry
  # hiccup). Safe because every job below is idempotent against a re-run of the same sha: the
  # draft is reused, assets are --clobber'd, and the staging tag is overwritten in place.
  workflow_dispatch:

# Serialize per-branch. A burst of qa pushes must not interleave two stagings of the same draft.
# cancel-in-progress stays FALSE: a superseded staging run finishes and leaves a coherent record
# for its sha; the promote can only ever consume the record matching main's HEAD anyway, so a
# stale record is unreachable, not dangerous -- but a half-cancelled one is confusing to read.
concurrency:
  group: release-stage
  cancel-in-progress: false

permissions:
  contents: write      # draft the Release and upload assets. NO tag is ever pushed from this workflow.
  packages: write      # docker.yml (called below) pushes to GHCR
  id-token: write      # OIDC identity for keyless Sigstore signing (provenance)
  attestations: write  # record the build-provenance attestation
  actions: read
  # No `issues: write`: verify-deploy.yml no longer files an issue when a release is broken for
  # consumers, it fails its own run and writes the findings to the run summary. Nothing this
  # workflow calls needs the permission any more.

jobs:
  # -- PLAN: what version is this, and is it safe to mint that name at all? -------------------------
  #
  # The version comes from crates/busbar/Cargo.toml, exactly as tag-on-main.yml read it, so the
  # release-cutting ritual is unchanged for a human: bump on dev via prepare-release.yml, promote
  # dev -> qa -> main, and landing on main cuts the release.
  #
  # IDEMPOTENT BY DESIGN, same as before: if the version is already released this is a NO-OP, not a
  # failure. Pushing docs to main without bumping the version must never re-release, and must never
  # go red either, or the red stops meaning anything.
  #
  # THE PRE-FLIGHT THAT IS NEW, AND IT IS THE IMMUTABILITY GUARD. It also asks Docker Hub whether
  # `getbusbar/busbar:X.Y.Z` already exists. That tag cannot be overwritten, so discovering it at
  # PROMOTE time -- after a full build and a full verification -- would mean a run that has done
  # everything right and still cannot finish, with a half-promoted state to unpick. Asking here
  # costs one unauthenticated HEAD request and turns that into a clean refusal before anything is
  # built.
  plan:
    name: plan (version, staging name, is this name still free)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      tag: ${{ steps.p.outputs.tag }}
      staging_tag: ${{ steps.p.outputs.staging_tag }}
      sha: ${{ steps.p.outputs.sha }}
      release: ${{ steps.p.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # so `git rev-parse vX.Y.Z` can see every existing tag
      - id: p
        shell: bash
        run: |
          set -euo pipefail
          V="$(python3 -c "import tomllib; print(tomllib.load(open('crates/busbar/Cargo.toml','rb'))['package']['version'])")"
          echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::crates/busbar/Cargo.toml version '$V' is not X.Y.Z"; exit 1; }
          SHA="${GITHUB_SHA}"
          {
            echo "version=$V"
            echo "tag=v$V"
            echo "sha=$SHA"
            # The throwaway name. Derived from the commit, so a re-run of the SAME commit reuses the
            # SAME staging tag and overwrites it rather than littering the registry, while two
            # different commits can never collide. `staging-` prefixed so it is unmistakable on the
            # tag list and unmistakably not something to pin.
            echo "staging_tag=staging-${SHA:0:12}"
          } >> "$GITHUB_OUTPUT"

          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "::notice::tag v$V already exists - nothing to cut (safe no-op). Bump the version on dev via prepare-release.yml to cut a new release."
            echo "release=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A PUBLISHED (non-draft) release for this version is the same "already cut" signal even
          # if the git tag was deleted by hand during a recovery.
          state="$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo none)"
          if [ "$state" = "false" ]; then
            echo "::notice::Release v$V is already published - nothing to cut (safe no-op)."
            echo "release=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ "$state" = "true" ] && echo "::notice::A DRAFT release for v$V already exists; this run will reuse and re-fill it."

          # IMMUTABILITY PRE-FLIGHT. Anonymous pull token -> HEAD the manifest. A 200 means the tag
          # is taken, permanently, and this version can never be published correctly.
          tok="$(curl -fsS --max-time 30 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:getbusbar/busbar:pull' | jq -r '.token // .access_token' || true)"
          if [ -n "${tok:-}" ] && [ "$tok" != "null" ]; then
            code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -I \
              -H "Authorization: Bearer $tok" \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json' \
              "https://registry-1.docker.io/v2/getbusbar/busbar/manifests/$V" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "::error::getbusbar/busbar:${V} ALREADY EXISTS on Docker Hub, and Docker Hub tag immutability means it can never be overwritten. Refusing to start a release that could not finish. Fix: bump to the next patch version on dev (prepare-release.yml) and promote that, or have an owner delete the tag first."
              exit 1
            fi
            echo "Docker Hub tag ${V} is free (HTTP ${code} on HEAD manifest)."
          else
            echo "::warning::could not obtain an anonymous Docker Hub pull token; skipping the tag-immutability pre-flight. The promote step will still refuse to overwrite an existing tag, just later."
          fi
          echo "release=1" >> "$GITHUB_OUTPUT"
          echo "::notice::Cutting v$V from ${SHA:0:7}. Staging name: staging-${SHA:0:12}. Nothing public until verification is green."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -- GATE ZERO: NOTHING IS RELEASED FROM A RED BRANCH -------------------------------------------
  #
  # Owner, 2026-08-08: "nothing should ever be released red", and "or ignored". Both halves are
  # rules, and the second one is the harder one.
  #
  # WHAT MAKES THIS NECESSARY. GetBusbar/headroom-hook cut and published v2.0.5 with its CI RED. The
  # red was `public-hygiene-lint`, unrelated to the change, and it was sitting on a list under the
  # heading "KNOWN, TRACKED, NOT BLOCKING". That heading is institutionalised ignoring: a red that
  # sits on a list is still ignored, only with paperwork attached. Every red found across the fleet
  # that night had been permitted for weeks by exactly that reasoning.
  #
  # RED IS RED. Not "red for an unrelated reason". Not "red before my change". Not "red on a check
  # that does not matter". If someone believes a particular red does not matter, that is a decision
  # about the CHECK, made in daylight by changing or deleting the check. It is not a decision to be
  # taken silently at release time by whoever happens to be cutting.
  #
  # THERE IS NO BYPASS. No override input, no force flag, no waiver, no exception list, no
  # allowed-to-fail set. That absence is the feature: a waiver IS the permission-to-ignore
  # mechanism, and permission-to-ignore is what shipped a red release. If a future edit to this file
  # starts to look like an escape hatch "just in case", the escape hatch is the thing being banned.
  #
  # UNKNOWN IS RED. If the status lookup errors, times out, is rate-limited, or simply cannot find a
  # CI run for this commit, this job REFUSES. It never degrades to a pass. A check that cannot
  # determine its answer and reports success is the `sibling-missing` defect, which has already
  # cost this project a silently-unverified mirror.
  #
  # THE ACCEPTED COST, STATED PLAINLY. With no waiver, a red we do not control stops the release: a
  # third-party outage, a rate limit, a flaky check. That is accepted. The correct response to a
  # check that blocks releases for reasons unrelated to the software is to HARDEN IT OR DELETE IT,
  # never to mute it. Under this rule a fragile check is a release-stopper, which finally makes its
  # fragility cost something to the people who can fix it.
  #
  # WHY IT WAITS RATHER THAN SAMPLES. This workflow and ci.yml both fire on the same push to qa,
  # so at the instant this job starts, CI is IN PROGRESS. Sampling "is anything red yet" would pass
  # every time, on every commit, forever - a gate that is green because it looked too early is worse
  # than no gate, because it reads as evidence. So it waits for the required runs on this commit to
  # reach a conclusion, and a wait that runs out is a REFUSAL.
  #
  # WHY THIS GATE IS SCOPED TO THE REQUIRED NAMES, UNLIKE THE PROMOTE'S. release.yml's branch-green
  # waits for EVERYTHING on the commit to conclude and judges it all. This one waits only for
  # REQUIRED_WORKFLOWS, and the difference is a deadlock-shaped fact, not a preference: qa-gate
  # fires off CI's COMPLETION on this same qa push and then soaks for hours, and this very workflow
  # is itself a run on this sha. A wait-for-everything here would either time out against qa-gate
  # on every staging run or need qa-gate on an exception list -- and qa-gate IS a check of this
  # commit, so excepting it would be a lie. Nothing is lost by the narrower scope: everything this
  # run produces stays under a throwaway name regardless, and the wait-for-EVERYTHING judgment --
  # qa-gate's umbrella included -- is asserted by release.yml's branch-green and again by its
  # promote-time re-check, on this very same sha, before any user-facing name exists. This gate's
  # only job is to keep the expensive build off a commit ALREADY known red.
  branch-green:
    name: gate 0 (refuse to stage from a red commit)
    needs: plan
    if: ${{ needs.plan.outputs.release == '1' }}
    runs-on: ubuntu-latest
    # Bounded well above a normal CI run (the `check` job with its Postgres and Valkey service
    # containers is the long pole) and well below anything that would sit here all day. Running out
    # is a refusal, not a pass, so a generous bound costs waiting and never correctness.
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ needs.plan.outputs.sha }}
      # Workflows that must have RUN and CONCLUDED on this commit. An empty check set is the
      # vacuous-pass trap: no runs found reads as "nothing is red". These names are asserted
      # PRESENT, so a commit that CI never saw is refused rather than waved through.
      REQUIRED_WORKFLOWS: "CI"
      # NO NOT_COMMIT_CHECKS LIST HERE, AND ITS ABSENCE IS STRUCTURAL, NOT AN OMISSION. The
      # promote's gate filters runs by EXCLUSION (everything except the runs that are not checks
      # of the commit), so it needs to name Release and Verify deploy. This gate filters by
      # INCLUSION -- only the required names above are waited on and judged -- so there is nothing
      # to except: this run, qa-gate, and verify-deploy's schedule runs simply are not in the set.
      # The full-population judgment happens at promote time in release.yml, where every one of
      # those runs has long since concluded and CAN be judged without a deadlock.
    steps:
      - name: Every check on this commit must have concluded, and every conclusion must be green
        shell: bash
        run: |
          set -uo pipefail   # deliberately NOT -e: an API hiccup must be RETRIED, then refused.

          # THE API IS THE ONE THING HERE THAT CAN FAIL FOR REASONS UNRELATED TO THE SOFTWARE, so it
          # is retried properly rather than trusted once. Bounded retries, then refusal: a lookup
          # that never answered has not told us the branch is green.
          api() {  # api <path> -> body on stdout, non-zero if it could not be read
            local path="$1" out rc
            for attempt in 1 2 3 4 5; do
              out="$(gh api --paginate "$path" 2>/tmp/api.err)"; rc=$?
              if [ "$rc" = 0 ] && [ -n "$out" ]; then printf '%s' "$out"; return 0; fi
              echo "  api read of ${path} failed (attempt ${attempt}/5): $(tr '\n' ' ' < /tmp/api.err)" >&2
              sleep $(( attempt * 10 ))
            done
            return 1
          }

          deadline=$(( SECONDS + 75 * 60 ))
          while :; do
            runs="$(api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100")"
            if [ $? -ne 0 ]; then
              echo "::error::REFUSING TO STAGE: the GitHub Actions API could not be read after 5 attempts, so the CI status of ${SHA} is UNKNOWN. Unknown is not green. Nothing has been built, no tag exists and nothing is public. Re-run this workflow when the API is answering." >&2
              exit 1
            fi
            # INCLUSION, not exclusion (see the env comment above): keep only the required
            # workflow names, and never this run itself (a re-run must not deadlock waiting on
            # itself or judge itself by an older attempt's conclusion).
            echo "$runs" | jq -s --arg req "$REQUIRED_WORKFLOWS" '
                ($req | split(",")) as $want
                | [.[] | .workflow_runs[]?]
                | map(select(.id != (env.GITHUB_RUN_ID | tonumber) and (.name | IN($want[]))))
                | unique_by(.name)
                | map({name, status, conclusion, url: .html_url})' > /tmp/runs.json
            total="$(jq 'length' /tmp/runs.json)"
            pending="$(jq '[.[] | select(.status != "completed")] | length' /tmp/runs.json)"
            echo "checks on ${SHA:0:7}: ${total} workflow(s), ${pending} still running"
            jq -r '.[] | "  \(.name): \(.status)/\(.conclusion // "-")"' /tmp/runs.json
            [ "$pending" = 0 ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::REFUSING TO STAGE: ${pending} check(s) on ${SHA} were still running after 75 minutes, so their result is UNKNOWN. Unknown is not green. Nothing has been built, no tag exists and nothing is public. Fix whatever is hanging and re-run." >&2
              jq -r '.[] | select(.status != "completed") | "  STILL RUNNING: \(.name) \(.url)"' /tmp/runs.json >&2
              exit 1
            fi
            sleep 30
          done

          fail=0

          # EVERY REQUIRED WORKFLOW MUST BE PRESENT. Without this the whole gate is vacuous on a
          # commit no workflow ever ran against: zero runs, zero red runs, green.
          for w in $REQUIRED_WORKFLOWS; do
            if [ "$(jq --arg w "$w" '[.[] | select(.name == $w)] | length' /tmp/runs.json)" = 0 ]; then
              echo "::error::REFUSING TO STAGE: no '${w}' run exists for ${SHA}, so this commit's test status is UNKNOWN. A commit CI never saw is not a green commit. Nothing has been built, no tag exists and nothing is public."
              fail=1
            fi
          done

          # `skipped` and `neutral` are green: a workflow that legitimately did not apply to this
          # commit (path filters, an `if:` that was false) has not failed. `cancelled`, `failure`,
          # `timed_out`, `action_required` and `stale` are all RED, and `stale` especially so: it
          # means GitHub never ran the check, which is the unknown case wearing a conclusion.
          red="$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | "  RED: \(.name) -> \(.conclusion // "no conclusion") \(.url)"' /tmp/runs.json)"
          if [ -n "$red" ]; then
            echo "$red"
            names="$(jq -r '[.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | .name] | join(", ")' /tmp/runs.json)"
            echo "::error::REFUSING TO STAGE FROM A RED COMMIT. ${SHA:0:7} is red on: ${names}. There is no override, no waiver and no exception list, and that is deliberate: 'unrelated to my change' and 'known, tracked, not blocking' are how a red release shipped. If one of these checks should not block a release, change or delete the CHECK - do not bypass it here. Nothing has been built, no tag exists, no release is listed and nothing was fanned out."
            fail=1
          fi

          # External commit statuses (anything reporting through the statuses API rather than as a
          # workflow run) get the same treatment, including the same unknown-is-red rule.
          st="$(api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status")"
          if [ $? -ne 0 ]; then
            echo "::error::REFUSING TO STAGE: the commit-status API could not be read after 5 attempts, so external check state on ${SHA} is UNKNOWN. Unknown is not green."
            fail=1
          else
            state="$(echo "$st" | jq -r -s '.[0].state // "unknown"')"
            count="$(echo "$st" | jq -r -s '.[0].statuses | length')"
            echo "external commit statuses: ${count} (combined state: ${state})"
            if [ "$count" -gt 0 ] && [ "$state" != "success" ]; then
              echo "$st" | jq -r -s '.[0].statuses[] | select(.state != "success") | "  RED: \(.context) -> \(.state) \(.target_url)"'
              echo "::error::REFUSING TO STAGE FROM A RED COMMIT: external commit status on ${SHA} is '${state}'. Nothing has been built and nothing is public."
              fail=1
            fi
          fi

          {
            echo "### Gate 0: is ${SHA:0:7} green?"
            echo
            echo "| check | status | conclusion |"
            echo "| --- | --- | --- |"
            jq -r '.[] | "| \(.name) | \(.status) | \(.conclusion // "-") |"' /tmp/runs.json
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$fail" = 0 ] || exit 1
          echo "::notice::${SHA:0:7} is green across every check. Proceeding to stage."

  # ── TEST GATE ────────────────────────────────────────────────────────────────────────────────
  # Nothing is built, signed, attested or published until the suite passes ON THE COMMIT BEING
  # RELEASED.
  #
  # `ci.yml` is armed on pushes to main/dev/qa and on PRs. This job existed because the release used
  # to run off a TAG push, which ci.yml does not see, so test gating depended entirely on someone
  # having pushed the same commit to a branch first and on that run having been green -- a
  # convention, not a gate. The release now runs on the main push itself, so ci.yml does see this
  # commit; the gate stays anyway, and deliberately. A separate run being green is still a fact
  # about a DIFFERENT run that nothing in this graph depends on, and the build-provenance
  # attestation below would otherwise certify an artifact whose suite never ran in the run that
  # attested it.
  #
  # Mirrors `ci.yml`'s `check` job, including the live Postgres/Valkey service containers: without
  # them the store roundtrip tests skip, and `CI` being set makes them hard-fail rather than skip
  # silently, so dropping the services here would turn the gate red rather than hollow — but it
  # would still be wrong to omit them, since that coverage is exactly what a release should prove.
  gate:
    name: gate (fmt · clippy · build · test)
    # `branch-green` FIRST. Nothing is built for a release from a red commit, so the expensive part
    # of the pipeline never starts on one either.
    needs: [plan, branch-green]
    runs-on: ubuntu-latest
    services:
      # PINNED BY DIGEST, NOT BY TAG. `postgres:16` and `valkey/valkey:8` are MOVING tags: Docker Hub
      # re-points them at every patch, so the same commit gets different bytes on different days and
      # a store-roundtrip failure could be caused by a database nobody in this repository changed.
      # These service containers are load-bearing (without them the Postgres/Valkey roundtrip tests
      # hard-fail rather than skip, which is deliberate), so what they resolve to has to be a fact
      # about this commit, not about the calendar.
      #
      # WHAT A DIGEST PIN DOES NOT FIX, SAID PLAINLY SO NOBODY THINKS THE HOLE IS CLOSED: it does
      # nothing about Docker Hub RATE LIMITS. The pull still goes to Docker Hub and an anonymous
      # runner still gets the anonymous quota. The pin buys reproducibility; authentication is what
      # buys quota. See the `credentials:` block below (release.yml) and the note in ci.yml.
      #
      # RE-PINNING: `docker buildx imagetools inspect postgres:16` prints the current digest. These
      # are ordinary dependencies and should move on the same cadence as the rest -- if they go
      # stale enough to matter, re-pin in the monthly-refresh PR.
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        # AUTHENTICATED PULL, WHICH IS THE PART THAT ACTUALLY ADDRESSES RATE LIMITS. Docker Hub's
        # anonymous quota is per source IP and GitHub's runner IPs are shared, so an anonymous pull
        # can be throttled for reasons that have nothing to do with busbar -- and under the
        # no-waiver rule that would be a red nobody can clear by fixing the software. These are the
        # same credentials docker.yml already uses. Safe to reference unconditionally HERE because
        # this workflow only triggers on a push to `main` and on workflow_dispatch, never on
        # `pull_request`, so the secrets are always present; ci.yml cannot do the same without
        # breaking fork PRs, where secrets are withheld.
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: busbar
          POSTGRES_PASSWORD: busbar
          POSTGRES_DB: busbar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U busbar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
        # AUTHENTICATED PULL, WHICH IS THE PART THAT ACTUALLY ADDRESSES RATE LIMITS. Docker Hub's
        # anonymous quota is per source IP and GitHub's runner IPs are shared, so an anonymous pull
        # can be throttled for reasons that have nothing to do with busbar -- and under the
        # no-waiver rule that would be a red nobody can clear by fixing the software. These are the
        # same credentials docker.yml already uses. Safe to reference unconditionally HERE because
        # this workflow only triggers on a push to `main` and on workflow_dispatch, never on
        # `pull_request`, so the secrets are always present; ci.yml cannot do the same without
        # breaking fork PRs, where secrets are withheld.
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked --verbose
      - name: Test
        env:
          BUSBAR_TEST_POSTGRES_URL: postgres://busbar:busbar@localhost:5432/busbar_test
          VALKEY_URL: redis://localhost:6379
          # This is the release gate on the exact SHA being cut. Same sum-across-binaries floor as
          # ci.yml's `check` and `windows` jobs: a suite that compiled to nothing must not let a
          # release pass having tested nothing. MIN carries slack (unix runs a superset of the
          # windows 4755 high-water); EXPECTED warns. PIPESTATUS[0] is cargo's own exit.
          RELEASE_MIN_TESTS: "4700"
          RELEASE_EXPECTED_TESTS: "4783"
        run: |
          set -uo pipefail
          cargo test --workspace --locked --verbose 2>&1 | tee "$RUNNER_TEMP/release-test.log"
          rc=${PIPESTATUS[0]}
          total=$(grep -oE 'test result: (ok|FAILED)\. [0-9]+ passed' "$RUNNER_TEMP/release-test.log" \
                  | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' \
                  | awk '{s+=$1} END {print s+0}')
          echo "release gate: ${total} tests passed across the workspace (floor: ${RELEASE_MIN_TESTS}, expected: ${RELEASE_EXPECTED_TESTS})"
          if [ "$rc" -ne 0 ]; then
            echo "::error::cargo test --workspace FAILED in the release gate (exit ${rc})."
            exit "$rc"
          fi
          if [ "$total" -lt "$RELEASE_EXPECTED_TESTS" ]; then
            echo "::warning::release gate ran ${total} tests, ${RELEASE_EXPECTED_TESTS} were expected."
            echo "::warning::If tests were legitimately removed or merged, LOWER RELEASE_EXPECTED_TESTS in this job."
            echo "::warning::If not, something stopped being collected — a cfg gate, a renamed harness, a dropped target."
          fi
          if [ "$total" -lt "$RELEASE_MIN_TESTS" ]; then
            echo "::error::the release gate ran ${total} tests, below its floor of ${RELEASE_MIN_TESTS}."
            echo "::error::A workspace whose suites compiled to nothing still prints 'test result: ok' and exits 0."
            echo "::error::This is NOT a pass — a release must not be cut having tested nothing."
            echo "::error::If the drop is intended, LOWER the RELEASE_MIN_TESTS floor in this job deliberately."
            exit 1
          fi

  # -- THE DRAFT ------------------------------------------------------------------------------------
  #
  # Created first so the parallel upload jobs have something to attach to (uploading from a matrix
  # without a pre-existing release races -> "release not found").
  #
  # `--draft` IS THE LOAD-BEARING FLAG, AND IT WAS VERIFIED END TO END ON A THROWAWAY REPO BEFORE
  # THE EIGHT PLUGIN REPOS TOOK IT: a draft 404s from `releases/tags/<tag>`, does NOT resolve as
  # `releases/latest`, and is absent from the public releases list -- yet `gh release upload` and
  # `gh release view` still find it BY TAG, its assets have real downloadable URLs through the API,
  # and `gh release edit --draft=false --latest` promotes it in place. So the artifacts are real
  # enough to fetch and execute while the version is not yet a thing anyone can find. Core is the
  # last repo to adopt this, not the pioneer.
  #
  # `--target` REPLACES `--verify-tag`. There IS no tag yet -- that is the point -- so the draft is
  # anchored to the commit instead, and GitHub materialises `vX.Y.Z` at that commit when the draft
  # is published. `promote-release` pushes the tag explicitly first anyway, so the two agree.
  draft:
    name: draft the release (invisible, no tag, real assets)
    needs: [plan, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # THE BODY NAMES WHAT CHANGED. `--generate-notes` alone produced a one-line compare link, so
      # v1.5.3's published body did not mention that `--validate` now RESOLVES `env:`/`file:` secret
      # references and exits 1 when one cannot resolve (boot behaviour unchanged). An operator
      # deciding whether to take a config-affecting release could not learn that from the release.
      # The CHANGELOG section for the version being cut is already written, already reviewed, and
      # already the canonical answer, so the release body is now that section followed by the
      # auto-generated commit/contributor notes rather than the notes alone.
      #
      # FAIL-SOFT, DELIBERATELY: a missing or unparseable CHANGELOG section must never block a
      # release that is otherwise good. It degrades to the previous behaviour and says so in the log.
      - name: Extract this version's CHANGELOG section for the release body
        id: notes
        env:
          V: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$V" > /tmp/relnotes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except OSError:
              sys.exit(0)
          # Headings look like `## [1.5.3], 2026-08-08`. Capture through to the next `## `.
          m = re.search(
              r"^##\s*\[%s\][^\n]*\n(.*?)(?=^##\s|\Z)" % re.escape(version),
              text, re.M | re.S)
          if m:
              sys.stdout.write(m.group(1).strip() + "\n")
          PY
          if [ -s /tmp/relnotes.md ]; then
            echo "found=1" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG section for ${V} ($(wc -l < /tmp/relnotes.md) lines) will lead the release body."
          else
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "::warning::No CHANGELOG section found for ${V}; falling back to generated notes only." \
                 "The release will still publish, but its body will not say what changed."
          fi
      - name: Create the DRAFT GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run of the same commit reuses the existing draft rather than failing or
          # creating a second one. A NON-draft release here means the version is already out, which
          # `plan` should have caught; refuse rather than silently re-upload over a live release.
          state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo none)"
          case "$state" in
            true)
              # THE ITERATION LOOP REUSES ONE DRAFT PER VERSION, and each iteration must RE-ANCHOR
              # it. Every qa push for the same X.Y.Z re-uploads assets over this draft (--clobber),
              # but `--target` was fixed at whichever iteration CREATED it. release.yml's
              # resolve-staged asserts the draft's target commitish equals the sha being promoted
              # -- the check that stops a stale draft (iteration 3's assets, iteration 1's anchor)
              # from publishing at the wrong commit -- so a reused draft must follow the iteration
              # being staged or every promote after the first iteration would be refused.
              echo "Reusing the existing DRAFT ${TAG}; re-anchoring it to ${SHA:0:7}."
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA"
              exit 0 ;;
            false) echo "::error::${TAG} is already PUBLISHED. Refusing to re-upload assets onto a live release."; exit 1 ;;
          esac
          notes_args=(--generate-notes)
          [ "${{ steps.notes.outputs.found }}" = "1" ] && notes_args+=(--notes-file /tmp/relnotes.md)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "busbar ${TAG}" \
            --target "$SHA" \
            --draft \
            "${notes_args[@]}"
          echo "::notice::${TAG} drafted at ${SHA:0:7}. It is NOT listed, does NOT resolve as releases/latest, and NO git tag exists."

  # Generate a CycloneDX Software Bill of Materials (every dependency + version +
  # license) and attach it to the draft. Lets downstream users answer "is the
  # crate in advisory X inside busbar v1.0.1?" without decompiling, and satisfies
  # enterprise/government (EO 14028) procurement that increasingly requires an SBOM.
  sbom:
    needs: [plan, draft]
    name: sbom (cyclonedx)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: cargo cyclonedx --format json --override-filename "busbar-${TAG}.cdx"
      - name: Attach SBOM to the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # cargo-cyclonedx writes the SBOM next to the package's Cargo.toml.
          sbom="$(find . -name "busbar-${TAG}.cdx.json" -print -quit)"
          test -n "$sbom" || { echo "SBOM not found"; exit 1; }
          gh release upload "$TAG" "$sbom" --repo "$GITHUB_REPOSITORY" --clobber

  # Publish the admin API's OpenAPI 3.1 document as a release asset. The gateway generates this doc
  # from its typed route contract (and serves it live at GET /api/v1/admin/openapi.json), but that
  # needs a running, authenticated instance. Attaching a static, version-stamped copy to the Release
  # lets anyone generate a client (busbarctl, the Terraform provider, SDKs) or diff the API surface
  # release-over-release WITHOUT running busbar. The document is emitted by the `emit_openapi_artifact`
  # test — the same `openapi_doc()` the gateway serves — so publishing needs no user-facing CLI flag.
  openapi:
    needs: [plan, draft]
    name: openapi (3.1 document)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Emit the OpenAPI document from the release code
        # `openapi_doc()` (and the `emit_openapi_artifact` test) live behind the CI-ONLY
        # `openapi-schema` feature — schemars is not in the shipped binary. The generated doc is the
        # typed one; it equals the committed `openapi.json` the runtime serves (drift-locked by the
        # `openapi_json_matches_committed_file` test in ci.yml).
        env:
          BUSBAR_EMIT_OPENAPI: ${{ github.workspace }}/busbar-openapi-${{ needs.plan.outputs.tag }}.json
        run: cargo test -p busbar -p busbar-core --bins --lib --features openapi-schema emit_openapi_artifact -- --nocapture
      - name: Validate it is a well-formed OpenAPI 3.1 document
        run: |
          doc="${GITHUB_WORKSPACE}/busbar-openapi-${TAG}.json"
          test -s "$doc" || { echo "OpenAPI doc is empty"; exit 1; }
          jq -e '.openapi | startswith("3.1")' "$doc" > /dev/null \
            || { echo "not an OpenAPI 3.1 document"; exit 1; }
      - name: Attach OpenAPI document to the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" "${GITHUB_WORKSPACE}/busbar-openapi-${TAG}.json" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # THE PLATFORM LIST, IN EXACTLY ONE PLACE. This job emits the build matrix AND the exact set of
  # asset filenames that matrix is contractually obliged to produce, from one literal. `upload-assets`
  # consumes the first; `verify-assets` consumes the second.
  #
  # WHY IT IS A JOB AND NOT A LITERAL MATRIX. v1.5.3 published with FIVE assets where seven were
  # expected: `busbar-aarch64-apple-darwin.tar.gz` and `busbar-x86_64-unknown-linux-gnu.tar.gz` were
  # both missing, which is Apple Silicon Mac and x86_64 Linux, the two most common platforms there
  # are. `curl -fsSL https://getbusbar.com/install.sh | sh` returned a 404 on Apple Silicon (the
  # documented one-line install, dead on the most common developer machine) and two of five download
  # links on the live /download/ page 404'd. The guard below asserted `assets != 0`, which a
  # five-asset release passes comfortably. A count can never see a MISSING platform; only a name can.
  #
  # Deriving both lists here means adding a platform is one edit and its verification comes along
  # automatically. A hardcoded expected-names list in the verifier would be a second place to forget,
  # which is the same defect one level up.
  targets:
    name: release target matrix (single source of truth)
    needs: [plan, branch-green]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
      assets: ${{ steps.emit.outputs.assets }}
      # The bare list of target triples, for the set-equality job. It is emitted HERE, from the same
      # parse as the build matrix, so "the set that was supposed to be produced" and "the set that
      # was supposed to be verified" are literally the same computation and cannot drift apart.
      targets: ${{ steps.emit.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
      - name: Emit the target matrix and the asset names it must produce
        id: emit
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          spec = json.load(open(".github/release-targets.json"))
          tag = os.environ["TAG"]
          # EVERY per-target difference travels in the matrix as a PARAMETER. The build workflow has
          # no `if:` and no second path, so anything a target needs has to arrive this way or not at
          # all -- that is what makes "no way for 1 to be different" a property of the graph rather
          # than a promise in a comment.
          fields = ("target", "runner", "pgo", "archive", "plugin_asset")
          # ONLY THE PUBLISHED TARGETS. `.github/release-targets.json` also declares targets that are
          # NOT release downloads: the two musl binaries (`published: false`, `packaged_into` an
          # image) and the two `kind: image` entries, whose "target" is not a Rust triple and whose
          # `archive` is `oci`. Iterating the file unfiltered put those four into the BUILD matrix
          # (build-artifact.yml would be asked to `cargo build --target image-linux-amd64`) and into
          # the asset list `verify-assets` asserts is present on the GitHub Release -- assets that,
          # by declaration, are never uploaded. `published` is the field that says which is which;
          # scripts/release-gate/lib.sh's `published_targets()` and release-fleet.yml already filter
          # on it, and this is the same predicate.
          #
          # STRICT, NOT `.get(..., True)`: a new target that forgets the flag must stop the release
          # here rather than drift into or out of the matrix silently.
          missing = [t["target"] for t in spec["targets"] if "published" not in t]
          if missing:
              raise SystemExit(
                  "release-targets.json: these targets declare no `published` flag: %s. Every target "
                  "must say whether it is a release download or an input to something else."
                  % ", ".join(missing))
          shipped = [t for t in spec["targets"] if t["published"]]
          inc = [{k: t[k] for k in fields} for t in shipped]
          assets = ["busbar-%s.%s" % (t["target"], t["archive"]) for t in shipped]
          assets += [a.replace("{tag}", tag) for a in spec["metadata_assets"]]
          # A FLOOR, BECAUSE A LOOP OVER A DISCOVERED SET WITH NO FLOOR PASSES WHEN THE SET IS EMPTY.
          # Both the build matrix and the verify matrix are enumerated from this output; a truncated
          # or mis-parsed manifest would otherwise build nothing, verify nothing, and report green
          # all the way to a published release with no assets on it.
          if len(inc) < 5:
              raise SystemExit(
                  "release-targets.json declares %d PUBLISHED targets; busbar ships 5. Refusing to "
                  "run a build matrix and a verify matrix over a set this small: an empty "
                  "expectation list passes for a release that published nothing." % len(inc))
          print("matrix=" + json.dumps({"include": inc}))
          print("targets=" + json.dumps(sorted(t["target"] for t in shipped)))
          print("assets=" + json.dumps(assets))
          PY
          cat "$GITHUB_OUTPUT"

  # -- THE BUILD: ONE PIPELINE, ONE STEP, FIVE TARGETS ---------------------------------------------
  #
  # This job used to be the build. It had TWO build steps -- scripts/pgo-build.sh behind
  # `if: matrix.pgo` for the host-native targets, upload-rust-binary-action behind `if: !matrix.pgo`
  # for the cross targets -- two packaging steps and two upload steps, each pair gated on the same
  # flag. Both build steps carried `BUSBAR_RELEASE_PUBKEY` in their own `env:` block. Both were
  # green. And busbar-aarch64-unknown-linux-gnu shipped with no embedded release key in 1.5.1, 1.5.2
  # and 1.5.3, so on ARM Linux every correctly-signed first-party plugin was refused.
  #
  # The key was never the point: the org variable was set the whole time. TWO BUILD PATHS PRODUCING
  # ONE RELEASE is the point. A property established on one path is unproven on the other, silently
  # and permanently, and no amount of care on either path fixes that.
  #
  # Owner, 2026-08-08: "should just be 1 build pipeline that takes what its building: arm, windows,
  # mac, but it does the same thing for each no way for 1 to be different".
  #
  # So the build is now .github/workflows/build-artifact.yml: one reusable workflow that builds ONE
  # artifact, with no `if:` on any step. Everything a target needs is a matrix VALUE passed in as an
  # input -- runner label, whether PGO applies, archive extension -- read from
  # .github/release-targets.json by the `targets` job above, which is the same single source of
  # truth that computes the asset-name list `verify-assets` enforces.
  #
  # `fail-fast: false` is deliberate and is why `verify-assets` below runs on `!cancelled()`: one
  # target failing must not cancel the other four, because the verifier's job is to NAME the
  # platforms that are missing, and it cannot name what was never attempted.
  upload-assets:
    name: build
    needs: [plan, draft, targets]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    uses: ./.github/workflows/build-artifact.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      archive: ${{ matrix.archive }}
      tag: ${{ needs.plan.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit

  # ── Every plugin releases from its own repo — no plugin upload jobs live here at all ─────────────
  # Through 1.5.0 this file built and published every first-party plugin itself: `store-plugins`
  # (sqlite/postgres/valkey) and `auth-plugins` (oidc) from the in-tree `crates/store-*-plugin` /
  # `crates/auth-oidc-plugin` crates, and `hook-plugins` (headroom/webrequest) from external sibling
  # checkouts — headroom was ALSO baked pre-installed into the official Docker image. All of that
  # special-casing is gone: a plugin is a plugin, full stop. Every first-party plugin — store, auth,
  # AND hook alike — is a standalone repo (GetBusbar/store-sqlite, store-postgres, store-valkey,
  # auth-oidc, headroom-hook, webrequest-hook) with its own CI, its own `main`/`dev` branches, and
  # its own release workflow that builds+signs+publishes ITS OWN tarball to ITS OWN GitHub Release
  # on a version tag, independently versioned from busbar itself. busbar's own release publishes
  # ONLY the core binary — no plugin tarball, signed or otherwise, is uploaded from this workflow.
  # The Docker image (docker.yml) ships with zero plugins pre-installed, same as the binary.
  #
  #   - No trust argument favors bundling. First-party verification comes from the BUSBAR_SIGN_KEY
  #     signature + the embedded BUSBAR_RELEASE_PUBKEY, not from which repo's Release page hosts the
  #     file — a tarball signed by the same key and published from a plugin's own repo verifies
  #     exactly as first-party as one uploaded here would.
  #   - Publishing the SAME plugin from two different repos' Releases is a real provenance/trust
  #     hazard with no offsetting benefit: which one is canonical, which one do docs point at, which
  #     one gets the CVE fix first. One release pipeline per plugin removes the ambiguity.
  #
  # See docs/plugins.md's "Signing and packaging" section for the corrected, current release-source
  # story per plugin kind.

  # -- THE IMAGE, UNDER A NAME NOBODY PINS ---------------------------------------------------------
  #
  # docker.yml builds the multi-arch image and pushes it as `staging-<sha>` and NOTHING else. It is
  # a real push to the real registry: `docker pull getbusbar/busbar:staging-<sha>` works, the image
  # boots, the binary inside runs, and the OCI version label already reads X.Y.Z. What it is not is
  # a name any user, any doc, or any Helm chart refers to.
  #
  # It runs in PARALLEL with the binary matrix, not after it: they are independent artifacts and the
  # two-arch PGO container build is the long pole. `verify-staged` waits for both.
  stage-image:
    name: stage the image (staging tag only, nothing user-facing)
    needs: [plan, gate]
    uses: ./.github/workflows/docker.yml
    with:
      staging_tag: ${{ needs.plan.outputs.staging_tag }}
      label_version: ${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    secrets: inherit

  # PHANTOM-RELEASE GUARD: assert the draft actually carries every asset before anything is
  # promoted. The per-target build/upload jobs run with fail-fast:false, and `draft` always makes the
  # (initially empty) release up front, so a build/pack failure on EVERY target (e.g. a stale
  # Cargo.lock tripping `--locked`) leaves a release with ZERO assets: a "phantom" that silently
  # breaks busbar's plugin-registry-gate. This job fails the run loud if assets are missing.
  #
  # IT NOW GUARDS SOMETHING IT COULD NOT GUARD BEFORE. When this ran against a PUBLISHED release it
  # could only report the damage; the tag and the release page already existed and recovery meant
  # deleting both. Running it against the DRAFT means a red verdict here stops the release before a
  # single user-facing name is minted.
  verify-assets:
    name: the draft owes every asset the manifest names
    needs: [plan, targets, upload-assets, sbom, openapi]
    runs-on: ubuntu-latest
    # `!cancelled()` IS THE POINT OF THIS LINE, and it is the second half of the 1.5.3 defect.
    # `upload-assets` runs `fail-fast: false`, so when two of its five legs failed the JOB failed --
    # and a `needs:` on a failed job SKIPS the dependent by default. So the one guard that existed to
    # notice a broken release was skipped precisely because the release was broken. A verifier that
    # only runs when everything already worked is not a verifier. This one runs whenever the run was
    # not cancelled, so a partial matrix produces a RED verify-assets naming the platforms that are
    # missing, instead of a grey one naming nothing.
    if: ${{ !cancelled() && needs.plan.outputs.release == '1' }}
    steps:
      - name: Assert the draft carries every asset the matrix owes it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED: ${{ needs.targets.outputs.assets }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "\(.name)\t\(.size)"' > /tmp/got.tsv || : > /tmp/got.tsv
          echo "Draft $TAG carries these assets:"
          cat /tmp/got.tsv
          python3 - <<'PY'
          import json, os, sys
          expected = json.loads(os.environ["EXPECTED"])
          got = {}
          for line in open("/tmp/got.tsv"):
              line = line.rstrip("\n")
              if not line:
                  continue
              name, _, size = line.partition("\t")
              got[name] = int(size or 0)

          missing = [a for a in expected if a not in got]
          # A NAME IN THE ASSET LIST IS NOT A USABLE ARTIFACT: GitHub creates the row as soon as the
          # upload starts, so a 0-byte or truncated upload lists identically to a good one. 1 KiB is
          # far below any real busbar tarball and far above an empty or header-only file.
          empty = [a for a in expected if a in got and got[a] < 1024]

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = ["### Draft asset verification", "", "| asset | bytes | verdict |", "| --- | --- | --- |"]
          for a in expected:
              if a not in got:
                  lines.append("| `%s` | - | MISSING |" % a)
              elif got[a] < 1024:
                  lines.append("| `%s` | %d | TOO SMALL |" % (a, got[a]))
              else:
                  lines.append("| `%s` | %d | ok |" % (a, got[a]))
          extra = sorted(set(got) - set(expected))
          if extra:
              lines += ["", "Also present (not required): " + ", ".join("`%s`" % e for e in extra)]
          if summary:
              open(summary, "a").write("\n".join(lines) + "\n")
          print("\n".join(lines))

          tag = os.environ["TAG"]
          if not got:
              print("::error::PHANTOM RELEASE: the %s draft has 0 assets. Every build/pack target "
                    "failed to upload. Nothing is public and no tag exists, so this is a clean "
                    "retry: fix the build (check Cargo.lock freshness vs --locked and the plugin "
                    "cdylib build step) and re-run this workflow." % tag, file=sys.stderr)
              sys.exit(1)
          if missing or empty:
              if missing:
                  print("::error::INCOMPLETE RELEASE: the %s draft is missing %d of %d required "
                        "asset(s): %s. Each missing name is a platform whose users would get a 404 "
                        "from install.sh and from the /download/ page. Nothing was promoted, so fix "
                        "that target's leg in `upload-assets` and re-run: no tag to delete, no "
                        "release to unpublish." %
                        (tag, len(missing), len(expected), ", ".join(missing)), file=sys.stderr)
              if empty:
                  print("::error::TRUNCATED RELEASE: the %s draft has these assets at under 1 KiB, "
                        "which means the upload was cut short: %s" % (tag, ", ".join(empty)),
                        file=sys.stderr)
              sys.exit(1)
          print("All %d required assets present and plausibly sized." % len(expected))
          PY

  # -- THE PER-ARTIFACT CONTRACT: 100% OR 0%, FOR EVERY ARTIFACT -----------------------------------
  #
  # `verify-assets` above answers "is every name present, and plausibly sized". That is a question
  # about the RELEASE. This job answers "is this artifact everything a busbar binary must be", which
  # is a question about the ARTIFACT, and it is the question 1.5.3 never asked: five assets were
  # present and correctly sized, and one of them refused every signed plugin on its platform.
  #
  # ONE VERIFIER, ONE ARTIFACT, EVERY ROW. scripts/verify-artifact.py takes (artifact, target) and
  # checks EVERY row of .github/artifact-contract.json that applies to that target. The rows are
  # data, so adding a property is one entry in that file plus its check function -- and it then
  # applies to all five targets automatically, with no per-target list for a platform to be
  # forgotten from. The verifier refuses to run at all unless the declared row ids and the
  # implemented checks are the SAME SET in both directions, so a row nobody implemented cannot look
  # like a row that passed.
  #
  # IT RUNS ON THE TARGET'S OWN NATIVE RUNNER, and that is what makes the contract uniform. Because
  # every target now builds natively, every artifact can be EXECUTED where it is verified: the
  # aarch64-linux asset runs on ubuntu-24.04-arm, the Intel-mac asset on macos-15-intel, the Windows
  # asset on windows-latest. So the executable rows -- the real signed first-party plugin, the
  # anchored --version, the documented quickstart -- run for EVERY platform. Nothing is statically
  # approximated because a runner could not execute it, and there is no per-platform subset.
  #
  # THE ARTIFACT IS DOWNLOADED BACK FROM THE DRAFT, NOT REUSED FROM THE BUILD. Every property is
  # asserted on the bytes a user would receive. Asserting them on the build machine's copy is what
  # 1.5.3 did with an env var, and the env var was set.
  verify-artifact:
    name: contract ${{ matrix.target }}
    needs: [plan, targets, upload-assets]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    # THE SAME `!cancelled()` REASONING AS `verify-assets`, FOR THE SAME REASON. `upload-assets`
    # runs fail-fast:false, so one failed leg fails the matrix job, and a `needs:` on a failed job
    # SKIPS the dependent by default -- the verifier would be switched off precisely when the
    # release is broken. A skipped leg leaves no receipt, so `verify-set-equality` below turns it
    # red anyway; this line is what lets the other four legs still report what they found.
    if: ${{ !cancelled() && needs.plan.outputs.release == '1' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download this artifact from the draft, and its build evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="busbar-${{ matrix.target }}.${{ matrix.archive }}"
          gh release download "${{ needs.plan.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --dir . --clobber
          # The REAL signed first-party plugin for THIS platform, from its own repo's own release,
          # signed with the real private half of the release key. Nothing here is packed locally: a
          # locally-signed fixture would prove the signature code compiles and would have gone green
          # on the broken 1.5.3 aarch64 artifact.
          gh release download "$(jq -r .plugin_probe.tag .github/release-targets.json)" \
            --repo "$(jq -r .plugin_probe.repo .github/release-targets.json)" \
            --pattern "${{ matrix.plugin_asset }}" --dir plugin-probe --clobber
          ls -l "$archive" plugin-probe

      - uses: actions/download-artifact@v4
        with:
          name: build-evidence-${{ matrix.target }}
          path: build-evidence

      - name: The artifact contract
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/verify-artifact.py \
            --archive "busbar-${{ matrix.target }}.${{ matrix.archive }}" \
            --target "${{ matrix.target }}" \
            --version "${{ needs.plan.outputs.version }}" \
            --pubkey "${{ vars.BUSBAR_RELEASE_PUBKEY }}" \
            --plugin "plugin-probe/${{ matrix.plugin_asset }}" \
            --evidence build-evidence \
            --repo "$GITHUB_REPOSITORY" \
            --repo-root .

      # THE RECEIPT. Written only after the contract exits 0, so its existence means every applicable
      # row passed for this target -- not that a job was scheduled. `verify-set-equality` reads these.
      - name: Write the verified-receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          echo "${{ matrix.target }}" > "verified/${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-${{ matrix.target }}
          path: verified
          if-no-files-found: error
          retention-days: 7

  # -- SET EQUALITY, NOT SUBSET --------------------------------------------------------------------
  #
  # THIS IS THE CLAUSE THAT MAKES A FORGOTTEN LEG IMPOSSIBLE RATHER THAN UNLIKELY.
  #
  # The third structural fault behind the 1.5.3 aarch64 defect was that the PRODUCED set and the
  # VERIFIED set were never compared. The `targets` job was already correct and already the single
  # source of truth; verification simply did not enumerate from it, so an artifact could be produced
  # and never checked and nothing anywhere noticed. verify-deploy.yml still hardcodes
  # `busbar-x86_64-unknown-linux-gnu.tar.gz` for its quickstart check -- one platform, chosen once,
  # standing in for five.
  #
  # So this job asserts three sets are IDENTICAL:
  #
  #   DECLARED  the targets `targets` emitted, from .github/release-targets.json.
  #   BUILT     one `build-evidence-<target>` receipt per artifact the build actually produced.
  #   VERIFIED  one `verified-<target>` receipt per artifact the contract actually passed.
  #
  # A target that is built but not verified is an ERROR. A target that is verified but not built is
  # an ERROR. A subset check in either direction would have passed the whole 1.5.3 release.
  #
  # IT READS RECEIPTS, NOT JOB CONCLUSIONS, and the difference matters: a matrix leg that is skipped
  # (the default `needs:` behaviour when an upstream job fails) leaves a grey square, no receipt, and
  # a set that has silently shrunk to fit. Receipts can only be created by a step that ran and
  # succeeded, so the sets can only shrink in a direction this job can see.
  #
  # `!cancelled()` for the same reason as its two upstream verifiers: this check must be loudest
  # exactly when something upstream went wrong.
  verify-set-equality:
    name: the set built and the set verified must be identical
    needs: [plan, targets, upload-assets, verify-artifact]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.plan.outputs.release == '1' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: receipts
          pattern: "*-*"
      - name: Compare the declared, built and verified sets
        env:
          DECLARED: ${{ needs.targets.outputs.targets }}
        run: |
          set -euo pipefail
          ls -la receipts || true
          python3 - <<'PY'
          import json, os, sys

          declared = set(json.loads(os.environ["DECLARED"]))
          names = set(os.listdir("receipts")) if os.path.isdir("receipts") else set()
          built = {n[len("build-evidence-"):] for n in names if n.startswith("build-evidence-")}
          verified = {n[len("verified-"):] for n in names if n.startswith("verified-")}

          lines = ["### produced vs verified", "", "| target | built | contract |", "| --- | --- | --- |"]
          for t in sorted(declared | built | verified):
              lines.append("| `%s` | %s | %s |" % (
                  t, "yes" if t in built else "**NO**", "PASS" if t in verified else "**NOT VERIFIED**"))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              open(summary, "a").write("\n".join(lines) + "\n")
          print("\n".join(lines))

          fail = False
          # A FLOOR FIRST. Every comparison below is between sets, and all three being empty is the
          # state in which every comparison is trivially satisfied -- the false green this whole
          # design exists to make impossible.
          if len(declared) < 5:
              print("::error::the declared target set has %d entries; busbar ships 5. Set equality "
                    "between three empty sets is not a check." % len(declared), file=sys.stderr)
              fail = True
          for label, got in (("built", built), ("verified", verified)):
              missing = sorted(declared - got)
              extra = sorted(got - declared)
              if missing:
                  print("::error::NOT %s: %s. Every one of those targets is an artifact this release "
                        "owes that was never %s. A target that is built but not verified is an error, "
                        "and so is a target that is verified but not built -- this is set equality, "
                        "not a subset check, because a subset check passes the 1.5.3 release in which "
                        "busbar-aarch64-unknown-linux-gnu shipped with no release key."
                        % (label.upper(), ", ".join(missing), label), file=sys.stderr)
                  fail = True
              if extra:
                  print("::error::%s but NOT DECLARED: %s. An artifact nothing declares is an artifact "
                        "nothing owes and nothing tracks; add it to .github/release-targets.json or "
                        "stop producing it." % (label.upper(), ", ".join(extra)), file=sys.stderr)
                  fail = True
          if fail:
              sys.exit(1)
          print("SET EQUALITY HOLDS: %d targets declared, built and contract-verified: %s"
                % (len(declared), ", ".join(sorted(declared))))
          PY

  # -- THE GATE: CONSUMER VERIFICATION, BEFORE THE NAME EXISTS -------------------------------------
  #
  # This is the job the whole restructure exists to make possible. It runs verify-deploy.yml -- the
  # same verifier, the same checks, reused rather than reimplemented -- in `staging` mode against
  # the artifacts that were just produced:
  #
  #   * `docker rmi` FIRST, then pull the staged image fresh. A cached local image lies, and it has
  #     lied to a human on this project inside the last week. Then boot it and read the OCI version
  #     label off the running image.
  #   * download the real linux tarball FROM THE DRAFT, unpack it, EXECUTE the binary, and assert
  #     `busbar --version` says X.Y.Z. Not "the archive exists" -- the bytes run and identify
  #     themselves.
  #   * run the DOCUMENTED quickstart from docs/getting-started.md, both halves: the binary with the
  #     minimal config, and the docker one-liner, each of which must answer `ok` on /healthz.
  #   * prove `gh attestation verify` -- the exact command the docs tell users to run -- passes on
  #     the real downloaded bytes.
  #   * prove every asset the platform manifest names is not merely listed but actually downloads.
  #
  # WHAT IT DELIBERATELY DOES NOT CHECK YET: the Homebrew tap, the Helm chart, getbusbar.com,
  # /releases/latest, the `latest` container tag. Those are downstream channels that only move once
  # the release is public, so asserting them here would be asserting a falsehood. They are checked
  # by `consumer-verification` at the bottom, after the promote, exactly as before. The split is by
  # what CAN be true before publication, not by what is convenient.
  #
  # NO `!cancelled()` HERE, AND THAT IS DELIBERATE. Every other guard in this file uses it so a red
  # upstream job cannot switch the guard off. This one is a GATE, not a report: if the artifacts did
  # not build, there is nothing to verify and nothing must be promoted. Default `needs` semantics --
  # skip on upstream failure, and therefore skip the promote too -- is exactly the behaviour wanted.
  verify-staged:
    name: consumer verification (STAGED, this is the gate)
    # verify-set-equality (which itself needs verify-artifact) is a load-bearing dependency, not
    # decoration: the audit's designed order is build → per-target contract → set-equality →
    # verify-staged → promote. Without it in this `needs:`, the per-name/per-digest artifact
    # contract and the built==verified set check would NOT gate the promote chain
    # (promote-release ← promote-image ← verify-staged), so a failing contract or an incomplete
    # asset set could still flip the draft public and push the tag — the publish-before-verify
    # seam this release model exists to close. A failed need SKIPS this gate, which skips promote,
    # which leaves nothing public.
    needs: [plan, verify-assets, verify-set-equality, stage-image]
    uses: ./.github/workflows/verify-deploy.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      stage: staging
      image_ref: getbusbar/busbar:${{ needs.plan.outputs.staging_tag }}
    permissions:
      contents: read
      actions: read
    secrets: inherit

  # -- THE RECORD: WRITE DOWN WHAT WAS STAGED, WHERE THE PROMOTE CAN FIND IT ----------------------
  #
  # This is the seam between the two workflows, so its properties are worth stating precisely.
  #
  # WHAT IS RECORDED: the version, the qa commit sha, the staging tag, and the manifest DIGEST the
  # staged push actually produced -- plus the run id, for humans following the trail. The digest is
  # the load-bearing field: the promote retags THAT, and refuses if the staging tag no longer
  # resolves to it.
  #
  # WHERE IT LIVES: a WORKFLOW ARTIFACT named `staged-manifest` on this run, which release.yml's
  # `resolve-staged` job looks up BY HEAD SHA (main's HEAD == this qa sha, because qa->main must be
  # a fast-forward). A committed manifest file was weighed and rejected: a workflow that commits to
  # `qa` mints a NEW sha, so the record would certify the PARENT of the commit it rides on -- the
  # record and the thing recorded can never name each other. It also races concurrent qa pushes,
  # needs contents:write, and lets a human edit the "verified digest" in a PR. The artifact keeps
  # "this record <-> this commit <-> this green run" as facts the Actions API asserts, not facts a
  # file claims. The cost is expiry (retention below) and an API lookup on main; both fail CLOSED
  # in resolve-staged -- an expired or missing record refuses the promote with "re-run the qa
  # stage", it never guesses.
  #
  # ONLY WRITTEN ON GREEN. `needs: verify-staged` (default semantics, no `!cancelled()`) means a
  # red or skipped verification writes NO record, so the promote cannot find one -- fail-closed at
  # the source, not just at the consumer.
  #
  # STAGING-TAG RETENTION, NAMED SO NOBODY IS SURPRISED: every iteration leaves a `staging-<sha12>`
  # tag on both registries (mutable, unlike X.Y.Z; a re-run of the same sha overwrites in place).
  # Nothing here deletes old ones -- a cleanup sweep is a separate, deliberate chore, never part of
  # a release path that must stay idempotent.
  record-staged:
    name: record the staged digest (the promote's only input)
    needs: [plan, stage-image, verify-staged]
    runs-on: ubuntu-latest
    steps:
      - name: Write the staged manifest, from re-derived facts only
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          STAGING_TAG: ${{ needs.plan.outputs.staging_tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          DIGEST: ${{ needs.stage-image.outputs.digest }}
        run: |
          set -euo pipefail
          # AN EMPTY DIGEST IS A REFUSAL, NOT A FIELD. docker.yml's output plumbing is a chain of
          # third-party action outputs; if any link goes quiet the expression above interpolates to
          # "" and a record with no digest would turn the promote's strongest check into a no-op.
          if [ -z "${DIGEST:-}" ]; then
            echo "::error::stage-image reported no manifest digest. Refusing to write a staged"                  "record the promote could not verify against. Re-run this workflow." >&2
            exit 1
          fi
          # THE RECORD MUST MATCH THE REGISTRY BEFORE IT IS WRITTEN, not only when it is consumed.
          # Same Distribution-API read docker.yml's promote assertion uses: what `docker pull`
          # would resolve for the staging tag must BE the digest being recorded.
          tok="$(curl -fsS --max-time 30 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:getbusbar/busbar:pull' | jq -r '.token // .access_token')"
          hub="$(curl -fsS --max-time 30 -I             -H "Authorization: Bearer $tok"             -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json'             "https://registry-1.docker.io/v2/getbusbar/busbar/manifests/${STAGING_TAG}"             | tr -d '\r' | grep -i '^docker-content-digest:' | awk '{print $2}')"
          if [ "$hub" != "$DIGEST" ]; then
            echo "::error::docker.io getbusbar/busbar:${STAGING_TAG} resolves to '${hub:-<none>}'"                  "but this run's build reported '${DIGEST}'. The record would name bytes the"                  "registry does not serve. Refusing to write it; re-run this workflow." >&2
            exit 1
          fi
          jq -n             --arg version "$VERSION"             --arg tag "$TAG"             --arg qa_sha "$SHA"             --arg staging_tag "$STAGING_TAG"             --arg digest "$DIGEST"             --arg run_id "$GITHUB_RUN_ID"             --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             '{version: $version, tag: $tag, qa_sha: $qa_sha, staging_tag: $staging_tag,
              digest: $digest, run_id: $run_id, recorded_at: $recorded_at}'             | tee staged.json
          {
            echo "### Staged and recorded"
            echo
            echo '```json'
            cat staged.json
            echo '```'
            echo
            echo "Promote by fast-forwarding 'qa' (${SHA:0:7}) to 'main'. release.yml will"
            echo "retag ${DIGEST} as ${VERSION} + 'latest' without rebuilding."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: staged-manifest
          path: staged.json
          if-no-files-found: error
          # LONGER THAN THE OTHER ARTIFACTS ON PURPOSE: this one is the promote's input, and "we
          # repeat until it is perfect" can put real calendar time between the final qa push and
          # the push to main. 90 days is GitHub's ceiling; past it, resolve-staged refuses and the
          # remedy is one re-run of this workflow on the same sha.
          retention-days: 90
