# SLSA PROVENANCE FOR EACH DEV COMMIT (ARCHITECT rulings 2026-10-17, option A1, and 2026-10-20).
#
# The conformance suite `slsa-verifier` (conformance/registry.toml) verifies a busbar binary built
# from the commit under judgement against SLSA provenance minted by a TRUSTED BUILDER: keyless,
# through Sigstore, under GitHub's OIDC identity. A ModernCI check has no such identity and a key
# of our own is not one, so the SIGNER is this repository's own Actions run, here, on each push to
# `dev`. It does nothing else: no tests and no gates. The JUDGE is ModernCI's `conformance` check
# (`xtask/src/conformance_record/slsa.rs`).
#
# Per push to dev:
#   1. `build` builds `busbar` at the pushed commit for linux x86_64 and aarch64
#      (`cargo build --locked --release -p busbar --bin busbar`, the oracle check's own build) and
#      uploads each as the run artifact `busbar-linux-<arch>`, holding `busbar-linux-<arch>-<sha>`;
#   2. `hashes` states both binaries' sha256 as the generator's subjects;
#   3. `provenance` is slsa-github-generator's generic generator over those subjects: one signed
#      statement, `busbar-linux-<sha>.intoto.jsonl`, naming both binaries;
#   4. `hand-off` uploads that statement again as the run artifact `busbar-slsa-provenance` (the
#      generator's own copy is kept 5 days, a retention it fixes and we do not).
#
# THE HAND-OFF IS THIS RUN'S OWN ARTIFACTS, nothing else: no release, no write to another
# repository, no secret. The rig finds the run of this workflow whose head_sha is the commit it
# judges, waits a bounded time while it is queued or in progress, and downloads
# `busbar-linux-<arch>` and `busbar-slsa-provenance` with a token holding actions:read on
# GetBusbar/busbar (artifact downloads need one even on a public repository). Every artifact here is
# kept RETENTION_DAYS (90, the most a public repository allows); a commit judged after that reads
# not-run, never a pass.
#
# THE GENERATOR IS REFERENCED BY TAG. slsa-verifier trusts the generic generator only under its
# builder id `.../generator_generic_slsa3.yml@refs/tags/vX.Y.Z`; a workflow called by sha mints
# provenance it refuses. v2.1.0 is commit f7dd8c54c2067bafc12ca7a55595d5ee9b75204a, stated as the
# call's trailing comment and held to that by workflow-rules R14's one tag-pinned entry.
#
# PERMISSIONS: `contents: read` for the workflow. The `provenance` call grants exactly what
# generator_generic_slsa3.yml@v2.1.0 declares for its jobs: `id-token: write` (keyless signing and
# its own ref detection), `actions: read` (the workflow's identity) and `contents: write`, which only
# its `upload-assets` job asks for. That job is skipped here (`upload-assets: false`, and a push to
# a branch is no tag), but GitHub refuses at load a called workflow whose job asks for more than its
# caller grants, so the grant stays and nothing in this run uses it.

name: slsa-dev-provenance

on:
  push:
    branches: [dev]

permissions:
  contents: read

env:
  RETENTION_DAYS: 90

concurrency:
  group: slsa-dev-provenance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build busbar
        run: cargo build --locked --release -p busbar --bin busbar
      - name: Name it for the hand-off
        run: |
          mkdir -p out
          cp target/release/busbar "out/busbar-linux-${{ matrix.arch }}-${{ github.sha }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: busbar-linux-${{ matrix.arch }}
          path: out/busbar-linux-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  hashes:
    needs: [build]
    runs-on: ubuntu-24.04
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: busbar-linux-*
          path: out
          merge-multiple: true
      - id: hash
        run: |
          cd out
          n=$(find . -maxdepth 1 -type f -name 'busbar-linux-*' | wc -l)
          [ "$n" -eq 2 ] || { echo "::error::expected two binaries, found $n"; exit 1; }
          echo "subjects=$(sha256sum busbar-linux-* | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    with:
      base64-subjects: ${{ needs.hashes.outputs.subjects }}
      provenance-name: busbar-linux-${{ github.sha }}.intoto.jsonl
      upload-assets: false

  hand-off:
    needs: [provenance]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: prov
      - name: The provenance is the one the rig asks for
        env:
          PROV: ${{ needs.provenance.outputs.provenance-name }}
          WANT: busbar-linux-${{ github.sha }}.intoto.jsonl
        run: |
          set -euo pipefail
          [ "$PROV" = "$WANT" ] || { echo "::error::the generator named its provenance $PROV, not $WANT"; exit 1; }
          [ -s "prov/$WANT" ] || { echo "::error::prov/$WANT is missing or empty"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: busbar-slsa-provenance
          path: prov/busbar-linux-${{ github.sha }}.intoto.jsonl
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}
