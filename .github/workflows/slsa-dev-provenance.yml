# SLSA PROVENANCE FOR EACH DEV COMMIT (ARCHITECT ruling 2026-10-17, option A1).
#
# The conformance suite `slsa-verifier` (conformance/registry.toml) verifies a busbar binary built
# from the commit under judgement against SLSA provenance minted by a TRUSTED BUILDER: keyless,
# through Sigstore, under GitHub's OIDC identity. A ModernCI check has no such identity and a key
# of our own is not one, so the builder is this repository's own Actions run, here, on each push to
# `dev`. It does nothing else: no tests and no gates (verification stays ModernCI's,
# `xtask/src/conformance_record/slsa.rs`).
#
# Per push to dev:
#   1. `build` builds `busbar` at the pushed commit for linux x86_64 and aarch64
#      (`cargo build --locked --release -p busbar --bin busbar`, the oracle check's own build);
#   2. `hashes` states both binaries' sha256 as the generator's subjects;
#   3. `provenance` is slsa-github-generator's generic generator over those subjects;
#   4. `publish` puts `busbar-linux-<arch>-<sha>` and `busbar-linux-<arch>-<sha>.intoto.jsonl` on
#      busbar-release's `dev-bin` release, where the rig fetches HEAD's pair. Immutable: an asset
#      already there is never replaced.
#
# THE GENERATOR IS REFERENCED BY TAG. slsa-verifier trusts the generic generator only under its
# builder id `.../generator_generic_slsa3.yml@refs/tags/vX.Y.Z`; a workflow called by sha mints
# provenance it refuses. v2.1.0 is the commit named in the
# call's trailing comment and held to that by workflow-rules R14's one tag-pinned entry.
#
# SECRET: `BUSBAR_DEV_BIN_TOKEN`, a token with contents:write on GetBusbar/busbar-release (the
# owner sets it); it is used by `publish` alone.

name: slsa-dev-provenance

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: slsa-dev-provenance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build busbar
        run: cargo build --locked --release -p busbar --bin busbar
      - name: Name it for dev-bin
        run: |
          mkdir -p out
          cp target/release/busbar "out/busbar-linux-${{ matrix.arch }}-${{ github.sha }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: busbar-linux-${{ matrix.arch }}
          path: out/busbar-linux-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error

  hashes:
    needs: [build]
    runs-on: ubuntu-24.04
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: busbar-linux-*
          path: out
          merge-multiple: true
      - id: hash
        run: |
          cd out
          n=$(find . -maxdepth 1 -type f -name 'busbar-linux-*' | wc -l)
          [ "$n" -eq 2 ] || { echo "::error::expected two binaries, found $n"; exit 1; }
          echo "subjects=$(sha256sum busbar-linux-* | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    with:
      base64-subjects: ${{ needs.hashes.outputs.subjects }}
      provenance-name: busbar-linux-${{ github.sha }}.intoto.jsonl
      upload-assets: false

  publish:
    needs: [build, provenance]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: busbar-linux-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: prov
      - name: Publish to busbar-release dev-bin (never over an existing asset)
        env:
          GH_TOKEN: ${{ secrets.BUSBAR_DEV_BIN_TOKEN }}
          SHA: ${{ github.sha }}
          PROV: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          set -euo pipefail
          R=GetBusbar/busbar-release
          have=$(gh release view dev-bin -R "$R" --json assets --jq '.assets[].name')
          for arch in x86_64 aarch64; do
            bin="busbar-linux-$arch-$SHA"
            # One provenance names both binaries as subjects; each binary carries it under its own name.
            cp "prov/$PROV" "out/$bin.intoto.jsonl"
            for f in "$bin" "$bin.intoto.jsonl"; do
              if printf '%s\n' "$have" | grep -qx "$f"; then
                echo "dev-bin already holds $f; it is never replaced"
              else
                gh release upload dev-bin -R "$R" "out/$f"
              fi
            done
          done
