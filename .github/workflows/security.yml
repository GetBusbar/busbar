name: Security

# Supply-chain checks: scan the dependency graph for known advisories and enforce
# the license/source/duplicate policy in deny.toml. Runs on dependency changes AND
# on a weekly schedule — a crate already in Cargo.lock can have an advisory filed
# AFTER it was merged, so PR-time scanning alone is not enough.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  # NO `paths:` filter here. cargo-deny is a REQUIRED status check (branch protection): a
  # paths filter on pull_request means GitHub never creates the check run at all for a PR that
  # doesn't touch the listed files, and a required check that never runs is a required check a
  # PR can merge past unimpeded (or leaves it permanently pending under strict required-checks
  # settings) -- either way, a gate a PR can route around by construction. The push trigger below
  # keeps its paths filter (it's a post-merge advisory re-scan on main, not a merge gate), and the
  # weekly schedule already covers newly-disclosed advisories against unchanged deps; running on
  # every PR regardless of files touched is what keeps this one a real gate.
  pull_request: {}
  schedule:
    # Mondays 07:00 UTC — catch newly-disclosed advisories against pinned deps.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (advisories · licenses · sources · bans)
    runs-on: latchkey-large
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses sources bans
