name: Release

# On a version tag (e.g. v0.9.0): create the GitHub Release, then cross-compile the busbar
# binary for major targets and attach tarballs to that Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write      # create the Release + upload assets
  id-token: write      # OIDC identity for keyless Sigstore signing (provenance)
  attestations: write  # record the build-provenance attestation

jobs:
  # Create the Release first so the parallel upload jobs have something to attach to
  # (uploading from a matrix without a pre-existing release races → "release not found").
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "busbar ${GITHUB_REF_NAME}" \
            --verify-tag --generate-notes \
          || gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"

  # Generate a CycloneDX Software Bill of Materials (every dependency + version +
  # license) and attach it to the Release. Lets downstream users answer "is the
  # crate in advisory X inside busbar v1.0.1?" without decompiling, and satisfies
  # enterprise/government (EO 14028) procurement that increasingly requires an SBOM.
  sbom:
    needs: create-release
    name: sbom (cyclonedx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: cargo cyclonedx --format json --override-filename "busbar-${GITHUB_REF_NAME}.cdx"
      - name: Attach SBOM to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # cargo-cyclonedx writes the SBOM next to the package's Cargo.toml.
          sbom="$(find . -name "busbar-${GITHUB_REF_NAME}.cdx.json" -print -quit)"
          test -n "$sbom" || { echo "SBOM not found"; exit 1; }
          gh release upload "${GITHUB_REF_NAME}" "$sbom" \
            --repo "${GITHUB_REPOSITORY}" --clobber

  # Publish the admin API's OpenAPI 3.1 document as a release asset. The gateway generates this doc
  # from its typed route contract (and serves it live at GET /api/v1/admin/openapi.json), but that
  # needs a running, authenticated instance. Attaching a static, version-stamped copy to the Release
  # lets anyone generate a client (busbarctl, the Terraform provider, SDKs) or diff the API surface
  # release-over-release WITHOUT running busbar. The document is emitted by the `emit_openapi_artifact`
  # test — the same `openapi_doc()` the gateway serves — so publishing needs no user-facing CLI flag.
  openapi:
    needs: create-release
    name: openapi (3.1 document)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Emit the OpenAPI document from the release code
        # `openapi_doc()` (and the `emit_openapi_artifact` test) live behind the CI-ONLY
        # `openapi-schema` feature — schemars is not in the shipped binary. The generated doc is the
        # typed one; it equals the committed `openapi.json` the runtime serves (drift-locked by the
        # `openapi_json_matches_committed_file` test in ci.yml).
        env:
          BUSBAR_EMIT_OPENAPI: ${{ github.workspace }}/busbar-openapi-${{ github.ref_name }}.json
        run: cargo test -p busbar --bin busbar --features openapi-schema emit_openapi_artifact -- --nocapture
      - name: Validate it is a well-formed OpenAPI 3.1 document
        run: |
          doc="${GITHUB_WORKSPACE}/busbar-openapi-${GITHUB_REF_NAME}.json"
          test -s "$doc" || { echo "OpenAPI doc is empty"; exit 1; }
          jq -e '.openapi | startswith("3.1")' "$doc" > /dev/null \
            || { echo "not an OpenAPI 3.1 document"; exit 1; }
      - name: Attach OpenAPI document to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "${GITHUB_WORKSPACE}/busbar-openapi-${GITHUB_REF_NAME}.json" \
            --repo "${GITHUB_REPOSITORY}" --clobber

  upload-assets:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `pgo: true` routes a HOST-NATIVE target through scripts/pgo-build.sh (PGO is MANDATORY for
        # release: the same fail-closed build docker.yml ships). PGO needs the instrumented binary
        # to run ON THE RUNNER to train, so only the targets whose arch matches the runner's are
        # PGO'd: x86_64-linux on the x86_64 ubuntu runner, and aarch64-darwin on the arm64 macos
        # runner. The cross targets (aarch64-linux built on an x86_64 host, x86_64-darwin on an arm64
        # host) and windows cannot self-train, so they keep the plain --release build.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            pgo: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
            pgo: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      # ── PGO path (host-native targets): the release binaries users download ARE PGO-optimized ──
      # scripts/pgo-build.sh runs the three-phase PGO build (instrumented -> on-host training ->
      # optimized) exactly as docker.yml does, FAIL-CLOSED: if any PGO phase fails the script exits
      # non-zero and the job FAILS (it never falls back to a plain build). This closes the
      # "PGO mandatory for release" drift where the GitHub-Release binaries were plain --release.
      - name: Build busbar (PGO, required/fail-closed)
        if: ${{ matrix.pgo }}
        env:
          BUSBAR_RELEASE_PUBKEY: ${{ vars.BUSBAR_RELEASE_PUBKEY }}
          PGO_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          scripts/pgo-build.sh
          file "target/pgo/${{ matrix.target }}/release/busbar"

      # POSITIVE PGO GATE: pgo-build.sh writes this marker ONLY after a non-empty merged profile fed
      # a successful -Cprofile-use build. Asserting it here (not just the script exit code) means a
      # release cannot ship a non-PGO host binary and still pass. (Mirrors docker.yml's gate.)
      - name: Verify PGO was applied (marker gate)
        if: ${{ matrix.pgo }}
        run: |
          set -euo pipefail
          marker="target/pgo/${{ matrix.target }}/release/busbar.pgo-verified"
          if [ ! -s "$marker" ]; then
            echo "::error::PGO proof marker missing or empty at $marker - refusing to ship a non-PGO binary" >&2
            exit 1
          fi
          echo "--- PGO proof marker ---"
          cat "$marker"
          grep -q '^pgo-verified=1$' "$marker" || { echo "::error::marker not marked verified" >&2; exit 1; }
          bytes="$(grep '^profile_bytes=' "$marker" | cut -d= -f2)"
          raw="$(grep '^profraw_count=' "$marker" | cut -d= -f2)"
          if [ -z "$bytes" ] || [ "$bytes" -le 0 ] 2>/dev/null; then
            echo "::error::merged profile was empty (profile_bytes=$bytes) - build was not PGO-optimized" >&2
            exit 1
          fi
          if [ -z "$raw" ] || [ "$raw" -le 0 ] 2>/dev/null; then
            echo "::error::no .profraw files fed the profile (profraw_count=$raw) - build was not PGO-optimized" >&2
            exit 1
          fi
          echo "PGO verified: ${bytes} bytes of merged profile from ${raw} .profraw file(s)."

      # Archive the PGO binary into the SAME `busbar-<target>.tar.gz` name the plain path produces and
      # upload it to the Release, so the attestation glob below covers it identically.
      - name: Package and upload busbar (PGO)
        if: ${{ matrix.pgo }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bin="target/pgo/${{ matrix.target }}/release/busbar"
          archive="busbar-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "$(dirname "$bin")" busbar
          gh release upload "${GITHUB_REF_NAME}" "$archive" \
            --repo "${GITHUB_REPOSITORY}" --clobber

      # ── Plain path (cross / windows targets that cannot self-train for PGO) ──
      # Builds --release for the target (installing the toolchain + cross-linker as
      # needed), tarballs the `busbar` binary, and uploads it to the Release for this tag.
      #
      # BUSBAR_RELEASE_PUBKEY (repository VARIABLE, not a secret — it is the PUBLIC half) is
      # embedded into the binary at build time (plugin-sign's option_env!): busbar-signed
      # plugins then verify as first-party with zero configuration. The matching PRIVATE half
      # is the BUSBAR_SIGN_KEY secret used by the hook-plugins job below (and, independently, by
      # each standalone plugin repo's own release workflow — see the "Store/auth plugin releases
      # moved out" note above hook-plugins for why store/auth plugins are no longer packed here).
      # TODO(release-keys): the release orchestrator generates the real keypair separately
      # (`busbar-plugin-pack keygen`) and provisions BOTH: the variable (public) + the secret
      # (private). Until provisioned, release binaries embed no key and first-party plugin
      # verification is unavailable (plugins still load via the third-party/unsigned paths).
      - name: Build and upload busbar
        if: ${{ !matrix.pgo }}
        uses: taiki-e/upload-rust-binary-action@v1
        env:
          BUSBAR_RELEASE_PUBKEY: ${{ vars.BUSBAR_RELEASE_PUBKEY }}
        with:
          bin: busbar
          target: ${{ matrix.target }}
          archive: busbar-$target
          token: ${{ secrets.GITHUB_TOKEN }}

      # Generate a keyless (Sigstore/OIDC) build-provenance attestation binding THIS
      # archive's digest to this workflow run + commit. A user verifies the download with
      #   gh attestation verify <archive> --repo ${{ github.repository }}
      # so a swapped/backdoored artifact on the Release page (the LiteLLM-PyPI scenario)
      # fails verification. The glob matches whichever extension was produced (.tar.gz on
      # unix, .zip on windows); `archive: busbar-$target` leaves it in the workspace.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "busbar-${{ matrix.target }}.*"

  # ── Store/auth plugin releases moved out — no upload jobs here anymore ───────────────────────────
  # Through 1.5.0 this file had `store-plugins` (sqlite/postgres/redis) and `auth-plugins` (oidc)
  # jobs, built from the in-tree `crates/store-*-plugin` / `crates/auth-oidc-plugin` crates and
  # uploaded to THIS repo's GitHub Release, structured exactly like hook-plugins below. Those four
  # plugins have since been extracted into their own standalone first-party repos
  # (GetBusbar/store-sqlite, GetBusbar/store-postgres, GetBusbar/store-redis, GetBusbar/auth-oidc),
  # each with its own CI and its own release workflow that builds+signs+publishes ITS OWN tarball to
  # ITS OWN GitHub Release on a version tag. The upload jobs here were REMOVED rather than repointed
  # at the external repos (contrast with hook-plugins, which deliberately keeps checking out and
  # rebuilding external sources — see that job's header comment for why hook is different):
  #
  #   - No convenience/zero-config argument applies. hook-plugins bundles headroom/webrequest into
  #     busbar's OWN release because docs/plugins.md documents them as "Shipped first-party hook
  #     plugins" and headroom is additionally pre-installed into the official Docker image
  #     (docker.yml) for out-of-the-box prompt compression — busbar's own release is a genuine
  #     distribution point for them. No store or auth plugin is embedded in the core binary or the
  #     Docker image; every one of them needs external setup (a DB endpoint/credentials, an OIDC
  #     issuer) that busbar's own release cannot make "zero-config" just by also hosting the tarball.
  #   - No trust argument applies either. First-party verification comes from the BUSBAR_SIGN_KEY
  #     signature + the embedded BUSBAR_RELEASE_PUBKEY, not from which repo's Release page hosts the
  #     file — a tarball signed by the same key and published from GetBusbar/store-postgres's own
  #     release verifies exactly as first-party as one uploaded here would.
  #   - Publishing the SAME plugin from two different repos' Releases is a real provenance/trust
  #     hazard with no offsetting benefit: which one is canonical, which one do docs point at, which
  #     one gets the CVE fix first. One release pipeline per plugin removes the ambiguity.
  #
  # The in-tree crates (`crates/store-sqlite-plugin`, `crates/store-postgres-plugin`,
  # `crates/store-redis-plugin`, `crates/auth-oidc-plugin`) are UNCHANGED and deliberately still
  # live in this monorepo — do not read their removal from release.yml as a signal to delete them.
  # They remain load-bearing for:
  #   - the real dlopen ABI-crossing tests in crates/plugin-loader/src/lib.rs
  #     (`load_and_exercise_sqlite_plugin_*`, `load_and_exercise_auth_oidc_plugin_*`), part of the
  #     normal `cargo test --workspace` gate every release already implicitly requires green;
  #   - scripts/release-check.sh's own end-to-end gate, which builds and packs these crates directly
  #     (see that script's header) to prove busbar works against ALL its plugins together at a given
  #     commit — a property that requires the crates to be buildable from inside this checkout,
  #     independent of where the shipped release artifact ultimately comes from.
  # See docs/plugins.md's "Signing and packaging" section for the corrected, current release-source
  # story per plugin kind.

  # ── Hook-plugin tarballs — one signed .tar.gz per (plugin, target) ───────────────────────────────
  # The first-party kind:hook plugins (webrequest, headroom) ship as signed plugin tarballs
  # {cdylib + manifest.json} exactly like the store plugins above: same busbar release PRIVATE key
  # (BUSBAR_SIGN_KEY secret) signs the manifest, and the matching PUBLIC key embedded in the busbar
  # binary (BUSBAR_RELEASE_PUBKEY repository variable) makes them verify as FIRST-PARTY with zero
  # operator configuration.
  #
  # Two hook plugins, distinct declared intent:
  #   - webrequest: a transparent HTTP forwarder. It relays whatever the CORE projected; a deployment
  #     that fronts a prompt:rw gate would re-declare that need, but the shipped first-party artifact
  #     asks for NOTHING by default (no --needs-*), the least-privilege posture. The operator still
  #     grants explicitly, and the forwarder cannot cause content to be sent.
  #   - headroom: a prompt-compression REWRITE gate. It MUST read + rewrite the prompt, so it packs
  #     with --needs-prompt rw (SIGNED into the manifest, surfaced to the admin at register/load).
  #     The operator's config grant of prompt:rw remains the enforcement (belt-and-suspenders).
  #
  # SOURCE: both plugins moved out of this monorepo into their own first-party repos
  # (GetBusbar/headroom-hook, GetBusbar/webrequest-hook) — "separate source, centralized
  # build+sign at busbarAI release time" (docs/plugins.md). This job checks each out as a SIBLING
  # of this checkout (path: ../headroom-hook, ../webrequest-hook) and builds the cdylib from there,
  # pinned to a fixed ref so a release is reproducible:
  #   - headroom-hook: pinned to commit a61e7f8 ("Switch busbar-plugin-sdk to sibling-relative
  #     path dependency", on top of the earlier dlopen ABI port). NOT the latest tag (v1.0.14) —
  #     that tag predates the ABI port and is not loadable by busbar's plugin loader at all.
  #     JUDGMENT CALL: pin by commit until upstream cuts a release tag that includes the port;
  #     re-pin HEADROOM_HOOK_REF to that tag then.
  #   - webrequest-hook: pinned to its only commit so far (5999093, the repo-extraction commit).
  #     Re-pin to a tag once the repo starts cutting releases.
  #
  # Both repos declare their busbar-plugin-sdk dependency as an INTERIM local path dependency
  # (documented in each repo's own Cargo.toml as a stopgap pending busbarAI going public), and both
  # now use the same RELATIVE path convention (`../busbarAI/crates/...`), which resolves correctly
  # given the sibling checkout layout below — no CI-side patching needed. Longer-term this should
  # become a published git/crates.io busbar-plugin-sdk once busbarAI is public.
  #
  # TODO(release-keys): same seam as upload-assets above — until the BUSBAR_SIGN_KEY secret is provisioned
  # this job packages UNSIGNED tarballs (loadable only under plugins.trust.allow_unsigned), so a
  # release is never blocked on key setup. The gh step prints which mode it ran in.
  hook-plugins:
    needs: create-release
    name: hook-plugins (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      # Pinned refs for the external first-party plugin source repos — see the block comment above.
      HEADROOM_HOOK_REF: dev
      WEBREQUEST_HOOK_REF: 5999093848c7574df09faccde71b25d3b137b1e5
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            libext: so
            libprefix: lib
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            libext: so
            libprefix: lib
          - target: x86_64-apple-darwin
            os: macos-latest
            libext: dylib
            libprefix: lib
          - target: aarch64-apple-darwin
            os: macos-latest
            libext: dylib
            libprefix: lib
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            libext: dll
            libprefix: ""
    steps:
      - uses: actions/checkout@v7
      - name: Checkout headroom-hook (first-party plugin source, pinned)
        uses: actions/checkout@v7
        with:
          repository: GetBusbar/headroom-hook
          ref: ${{ env.HEADROOM_HOOK_REF }}
          path: ../headroom-hook
      - name: Checkout webrequest-hook (first-party plugin source, pinned)
        uses: actions/checkout@v7
        with:
          repository: GetBusbar/webrequest-hook
          ref: ${{ env.WEBREQUEST_HOOK_REF }}
          path: ../webrequest-hook
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the hook plugin cdylibs (external first-party repos) + the packer
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path ../headroom-hook/Cargo.toml
          cargo build --release --target ${{ matrix.target }} --manifest-path ../webrequest-hook/Cargo.toml
          cargo build --release --target ${{ matrix.target }} -p busbar-plugin-pack
        shell: bash
      - name: Package + sign the hook plugin tarballs
        env:
          BUSBAR_SIGN_KEY: ${{ secrets.BUSBAR_SIGN_KEY }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          outdir="plugin-dist"; mkdir -p "$outdir"
          pack="target/${target}/release/busbar-plugin-pack"
          [ -x "$pack" ] || pack="target/${target}/release/busbar-plugin-pack.exe"
          unsigned_flag=""
          if [ -z "${BUSBAR_SIGN_KEY:-}" ]; then
            echo "::warning::BUSBAR_SIGN_KEY secret is not provisioned — packaging UNSIGNED hook plugin tarballs (loadable only under plugins.trust.allow_unsigned). See the TODO(release-keys) seam."
            unsigned_flag="--allow-unsigned"
          fi
          libpfx='${{ matrix.libprefix }}'; libext='${{ matrix.libext }}'

          # webrequest: transparent forwarder, declares NO needs (least privilege).
          # Built from the external GetBusbar/webrequest-hook checkout (../webrequest-hook); its
          # crate/package name (busbar-webrequest-hook-plugin) is unchanged from the old in-repo
          # crate, so the lib filename is unchanged too.
          "$pack" pack \
            --lib "../webrequest-hook/target/${target}/release/${libpfx}busbar_webrequest_hook_plugin.${libext}" \
            --name "busbar-webrequest" --alias "webrequest" --kind hook \
            --version "$ver" --publisher busbar \
            --description "busbar webrequest hook plugin: signed dlopen'd HTTP forwarder for hook ops" \
            --license Apache-2.0 \
            --out "${outdir}/busbar-webrequest-${ver}-${target}.tar.gz" \
            $unsigned_flag

          # headroom: prompt-compression rewrite gate, declares needs.prompt=rw (SIGNED).
          # Built from the external GetBusbar/headroom-hook checkout (../headroom-hook); NOTE its
          # package name is just "headroom-hook" (not "busbar-headroom-hook-plugin" like the old
          # in-repo crate), so the built lib filename is libheadroom_hook.* — different from the
          # pre-extraction name. The packed --name/--alias/--kind/--needs-prompt below are
          # unchanged so the plugin's identity in busbar's registry is stable across the move.
          "$pack" pack \
            --lib "../headroom-hook/target/${target}/release/${libpfx}headroom_hook.${libext}" \
            --name "busbar-headroom" --alias "headroom" --kind hook \
            --version "$ver" --publisher busbar \
            --needs-prompt rw \
            --description "busbar headroom hook plugin: deterministic rule-based prompt-compression rewrite gate" \
            --license Apache-2.0 \
            --out "${outdir}/busbar-headroom-${ver}-${target}.tar.gz" \
            $unsigned_flag

          ls -l "$outdir"
        shell: bash
      - name: Attach hook plugin tarballs to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" plugin-dist/*.tar.gz --repo "${GITHUB_REPOSITORY}" --clobber
        shell: bash
      - name: Attest hook plugin build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "plugin-dist/*.tar.gz"
