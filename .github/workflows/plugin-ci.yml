# plugin-ci — THE CI of every first-party plugin repo, in one place: how a plugin tests ITSELF against
# busbar. Each plugin repo's own `.github/workflows/ci.yml` is a thin caller rendered by
# `busbar-release plugin sync` (GetBusbar/busbar-release template/) from plugins.yaml, and it takes this
# file AT THE BUSBAR COMMIT THE REPO PINS (`@<.busbar-ref field 1>`): the CI logic, the dependency policy
# (.github/fleet/deps.toml) and the contract a
# plugin compiles against move together, and a change here reaches a plugin repo only when its pin
# moves (OWNER 2026-10-02: the reusable plugin workflows stay in busbar, called by path at the pin).
# The plugin repo owns its tests; this file owns the harness. Before this file every repo carried
# its own copy of these jobs, and the copies drifted (four different pins, five different shapes of
# the same pin check, a macOS leg on some repos and not others).
#
# A plugin repo is a standalone Cargo workspace (a logic crate the busbar root links, an adapter crate
# whose cdylib a signed tarball carries) whose busbar dependencies are `git` dependencies on
# GetBusbar/busbar at `.busbar-ref` field 1. Nothing here checks busbar out beside the plugin to BUILD
# it: a checkout at the pin exists only for the end-to-end tests that boot a real busbar binary
# (`busbar_checkout: true`), for the fleet scripts
# built from that checkout.
#
# The jobs, in the order a red is cheapest to read:
#   pin        scripts/fleet/pin-check.sh: .busbar-ref, every manifest rev, Cargo.lock and every
#              reusable-workflow ref name ONE busbar commit; no sibling-checkout path dependency.
#   linux      fmt, clippy -D warnings, build, the whole test suite against the real backend service
#              the plugin declares (never a mock), then the both-ways conformance on its own: the
#              ordinary Rust test targets load both its linked door and fresh actual library.
#              Then, every one of them run even after an earlier red (one board, not the first red):
#              cargo deny on the rendered deny.toml; the dep-wall (the shipped closure is busbar-contract
#              plus third-party); the socket/TLS ban (no rustls/native-tls/openssl/socket2/tokio-net in
#              the shipped closure, and no socket or TLS import in the post-LTO cdylib; BUSBAR-1.6.0.md
#              line 3980); the C-dependency allow-list; Cargo.lock parity with busbar's lock at the pin
#              (RED); declares.json's contract_abi against the loader at the pin. A repo with no crates
#              yet runs the pin job only, and only when plugins.yaml at the pin marks it
#              pending_crate: any other failure to read its Cargo workspace is RED. Plugin tests read busbar's golden
#              cells from BUSBAR_GOLDEN_DIR (busbar's testing/shadow-oracle/golden at the pin), never a copy.
#   macos      build and the macOS test command (the plugin's own choice of what runs without a
#              Linux service container; postgres and valkey are provisioned from Homebrew).
#   coverage   llvm-cov over the same tests, with the same busbar checkout. A failing test FAILS this job
#              (only a plugin that needs a service container, which this job does not provision, runs
#              with --ignore-run-fail); the upload is made when CODECOV_TOKEN is present.
#
# The moving leg (a plugin's `dev` against busbar's own tree) is busbar's side: ModernCI's compile
# and test checks (.ci/default.yaml, .ci/dev.yaml) build the linked plugins on every busbar move.
#
# The C ABI integration repository is a header-only compatibility test. Its actual C library is
# compiled against the pinned header and passed to ordinary loader tests; it is not a provider.
name: "Plugins: CI"

on:
  workflow_call:
    inputs:
      service:
        description: "The real backend the Linux tests run against: none | postgres | mysql | valkey | vault | wiremock | openldap"
        required: false
        type: string
        default: "none"
      busbar_checkout:
        description: "Check busbar out at the pin and export BUSBAR_CHECKOUT (the end-to-end tests build and boot a real busbar from it)"
        required: false
        type: boolean
        default: false
      macos_test:
        description: "The test command the macOS leg runs (a live-service case with no macOS provisioning is excluded here)"
        required: false
        type: string
        default: "cargo test --workspace --locked"
      extra_test:
        description: "An extra Linux test command run after the suite (e.g. exclusive, server-wide cases run single-threaded). Empty = none."
        required: false
        type: string
        default: ""
      test_features:
        description: "Existing plugin features required by its test image; production builds remain default."
        required: false
        type: string
        default: ""
      plugin_crate:
        description: "The cdylib's Cargo package (built with -p), e.g. busbar-store-sqlite-plugin. Used only to locate the built cdylib for the signing gate (kind store|auth|hook|secret)."
        required: true
        type: string
      plugin_kind:
        description: "store | secret | auth | hook | export | plane | transport. The signing gate runs only for store|auth|hook|secret, the kinds scripts/signing-gate.sh proves."
        required: true
        type: string
      plugin_alias:
        description: "The manifest alias (the short config name), used by the signing gate's config fixture."
        required: true
        type: string
      manifest_name:
        description: "The signed manifest's `name` (the plugin's identity at load), as its release packs it. Default: the repo's name (plugins.yaml `manifest_name` default)."
        required: false
        type: string
        default: ""
      plugin_lang:
        description: "rust | c. `c`: the plugin is C sources built from busbar_plugin.h alone (THE C PATH above)."
        required: false
        type: string
        default: "rust"
      c_dir:
        description: "plugin_lang c: the repo-relative directory of the plugin's .c sources and its conformance.json."
        required: false
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        description: "Codecov upload token; the coverage job skips the upload without it."
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pin:
    name: the busbar pin is one commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      - name: read .busbar-ref
        id: pin
        run: |
          set -euo pipefail
          sha="$(awk '{print $1; exit}' plugin/.busbar-ref)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.busbar-ref field 1 is not a full 40-hex sha: '$sha'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: the fleet scripts at the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ steps.pin.outputs.sha }}
          path: busbar
          sparse-checkout: |
            scripts/fleet
            dist/default
      - name: pin-check
        env:
          PIN_CHECK_LANG: ${{ inputs.plugin_lang }}
        run: bash busbar/scripts/fleet/pin-check.sh plugin

  linux:
    name: fmt, clippy, build, test, conformance [linux]
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # scripts/signing-gate.sh proves signed-loads + unsigned/wrong-key/tampered-refused for the
      # four kinds it knows a config reference shape for (PB-11). export/plane/transport are outside
      # its coverage today, same as before this became a job condition.
      SIGNING_GATE: ${{ contains(fromJSON('["store", "auth", "hook", "secret"]'), inputs.plugin_kind) }}
    # SERVICE IMAGES ARE DIGEST-PINNED, and the digests are testing/fleet-fixtures/service-images.tsv's
    # rows (`cargo xtask gate service-images` holds every line below to them). An image expression that
    # evaluates to '' starts no container, so only the service the caller names runs.
    services:
      postgres:
        image: ${{ inputs.service == 'postgres' && 'postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b' || '' }}
        env:
          POSTGRES_USER: busbar
          POSTGRES_PASSWORD: busbar
          POSTGRES_DB: busbar_test
        ports:
          - 5432:5432
        options: >-
          ${{ inputs.service == 'postgres' && '--health-cmd "pg_isready -U busbar" --health-interval 10s --health-timeout 5s --health-retries 5' || '' }}
      mysql:
        image: ${{ inputs.service == 'mysql' && 'mysql:8@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: busbar
          MYSQL_USER: busbar
          MYSQL_PASSWORD: busbar
          MYSQL_DATABASE: busbar_test
        ports:
          - 3306:3306
        options: >-
          ${{ inputs.service == 'mysql' && '--health-cmd "mysqladmin ping -h localhost -ubusbar -pbusbar" --health-interval 10s --health-timeout 5s --health-retries 10' || '' }}
      valkey:
        image: ${{ inputs.service == 'valkey' && 'valkey/valkey:8@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6' || '' }}
        ports:
          - 6379:6379
        options: >-
          ${{ inputs.service == 'valkey' && '--health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30' || '' }}
      vault:
        image: ${{ inputs.service == 'vault' && 'hashicorp/vault@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2' || '' }}
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ${{ inputs.service == 'vault' && 'root' || '' }}
        ports:
          - 8200:8200
        options: >-
          ${{ inputs.service == 'vault' && '--cap-add=IPC_LOCK --health-cmd "wget -qO- http://127.0.0.1:8200/v1/sys/health" --health-interval 10s --health-timeout 5s --health-retries 5' || '' }}
      wiremock:
        image: ${{ inputs.service == 'wiremock' && 'wiremock/wiremock:3.9.2@sha256:d13997cd7b52583528a766019cfe7d4e91c4d224a67bdaa6f60efbb532f32176' || '' }}
        ports:
          - 8080:8080
      openldap:
        image: ${{ inputs.service == 'openldap' && 'osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28' || '' }}
        env:
          LDAP_ORGANISATION: ${{ inputs.service == 'openldap' && 'Example Org' || '' }}
          LDAP_DOMAIN: ${{ inputs.service == 'openldap' && 'example.org' || '' }}
          LDAP_ADMIN_PASSWORD: ${{ inputs.service == 'openldap' && 'adminpassword' || '' }}
        ports:
          - 389:389
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      - name: busbar at the pin (the policy, lock, loader and golden; the real binaries the end-to-end tests build and boot, the signing gate, the C path's header and conformance)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ needs.pin.outputs.sha }}
          path: busbar
      # THE NO-CRATES PASS IS plugins.yaml's `pending_crate: true` FOR THIS REPO, NOTHING ELSE'S (the
      # registry at the pin). Any other failure to read the workspace, a broken manifest included, is
      # RED with cargo's error shown: read as "no crates yet", it skipped every build and test below
      # and the leg went green (hook-webrequest #24). The same text on both legs;
      # xtask/tests/plugin_ci_crates_step.rs runs it against planted checkouts.
      - name: does the repo have its crates yet (no crates passes only when plugins.yaml marks it pending_crate)
        id: crates
        working-directory: plugin
        env:
          PLUGIN_LANG: ${{ inputs.plugin_lang }}
          REGISTRY: ${{ github.workspace }}/busbar/plugins.yaml
        run: |
          set -euo pipefail
          # A C plugin has no Cargo workspace by design (pin-check refuses one); its proof is the C path.
          if [ "$PLUGIN_LANG" = c ]; then echo "present=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          repo="${GITHUB_REPOSITORY#*/}"
          err=""
          if [ ! -f Cargo.toml ]; then
            err="no Cargo.toml at the repo root"
          elif ! out="$(cargo metadata --format-version 1 --no-deps 2>&1 >/dev/null)"; then
            err="cargo metadata failed: $out"
          fi
          if [ -z "$err" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ -f "$REGISTRY" ] || { echo "::error::no plugins.yaml at the pin ($REGISTRY): cannot tell a pending_crate repo from a broken one"; printf '%s\n' "$err"; exit 1; }
          pending="$(awk -v r="$repo" '
            /^[^[:space:]#]/ { inp = ($1 == "plugins:"); cur = "" }
            inp && $1 == "-" && $2 == "repo:" { cur = $3 }
            inp && cur == r && $1 == "pending_crate:" && $2 == "true" { print "true" }
          ' "$REGISTRY")"
          if [ "$pending" = true ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no crates yet (plugins.yaml marks $repo pending_crate): the pin job is this repo's whole proof"
            printf '%s\n' "$err"
            exit 0
          fi
          echo "::error::$repo: the Cargo workspace does not read, and plugins.yaml at the pin does not mark $repo pending_crate; the error:"
          printf '%s\n' "$err"
          exit 1
      - name: the test environment (only the variables that apply are SET; an empty one reads as set)
        env:
          SERVICE: ${{ inputs.service }}
          CHECKOUT: ${{ inputs.busbar_checkout }}
        run: |
          set -euo pipefail
          {
            case "$SERVICE" in
              none) ;;
              postgres) echo "BUSBAR_TEST_POSTGRES_URL=postgres://busbar:busbar@localhost:5432/busbar_test" ;;
              mysql)    echo "BUSBAR_TEST_MYSQL_URL=mysql://busbar:busbar@127.0.0.1:3306/busbar_test" ;;
              # `redis://` is the Valkey client's own URL scheme (wire-compatible upstream name).
              valkey)   echo "VALKEY_URL=redis://127.0.0.1:6379/0" ;;
              vault)    echo "BUSBAR_TEST_VAULT_ADDR=http://127.0.0.1:8200"; echo "BUSBAR_TEST_VAULT_TOKEN=root" ;;
              wiremock) echo "BUSBAR_TEST_WIREMOCK_URL=http://127.0.0.1:8080" ;;
              openldap) echo "BUSBAR_TEST_LDAP_URL=ldap://127.0.0.1:389" ;;
              *) echo "::error::unknown service '$SERVICE'" >&2; exit 1 ;;
            esac
            echo "BUSBAR_GOLDEN_DIR=$GITHUB_WORKSPACE/busbar/testing/shadow-oracle/golden"
            if [ "$CHECKOUT" = true ]; then
              echo "BUSBAR_CHECKOUT=$GITHUB_WORKSPACE/busbar"
              echo "BUSBAR_TARGET_DIR=$GITHUB_WORKSPACE/busbar/target"
              # The nested busbar build is busbar's release profile; a CI leg needs it fast, not small.
              echo "CARGO_PROFILE_RELEASE_LTO=off"
              echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"
            fi
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ inputs.plugin_lang == 'c' && 'busbar' || fromJSON('"plugin\nbusbar"') }}
          key: busbar-${{ needs.pin.outputs.sha }}
      - name: fmt
        if: steps.crates.outputs.present == 'true'
        working-directory: plugin
        run: cargo fmt --all -- --check
      - name: clippy (-D warnings)
        if: steps.crates.outputs.present == 'true'
        working-directory: plugin
        # needless_update allowed: `T { .., ..T::ZERO }` is the mandated forward-compat idiom, made
        # safe by the zero-spread gate (coordinator ruling).
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::needless_update
      - name: build (the rlib a busbar build links, and the cdylib a signed tarball carries)
        if: steps.crates.outputs.present == 'true'
        working-directory: plugin
        env:
          CRATE: ${{ inputs.plugin_crate }}
        run: |
          set -euo pipefail
          cargo build --workspace --locked
          # the door is behind the crate's `dropped-in` feature once the crate declares it; pass it only then
          # (works before and after the plugin repos gate their export_door!).
          feat=""
          if cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; sys.exit(0 if any(p["name"]==sys.argv[1] and "dropped-in" in p["features"] for p in json.load(sys.stdin)["packages"]) else 1)' "$CRATE"; then feat="--features dropped-in"; fi
          cargo build --locked -p "$CRATE" --lib $feat
          case "$RUNNER_OS" in
            macOS) file="lib${CRATE//-/_}.dylib" ;;
            Linux) file="lib${CRATE//-/_}.so" ;;
            *) echo "::error::unsupported plugin test platform $RUNNER_OS"; exit 1 ;;
          esac
          target="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          artifact="$target/debug/$file"
          [ -f "$artifact" ] || { echo "::error::fresh plugin library missing: $artifact"; exit 1; }
          echo "BUSBAR_PLUGIN_CDYLIB=$artifact" >> "$GITHUB_ENV"
      - name: "C: build from busbar_plugin.h alone (the library a signed tarball carries)"
        if: inputs.plugin_lang == 'c'
        env:
          CRATE: ${{ inputs.plugin_crate }}
          C_DIR: ${{ inputs.c_dir }}
        run: |
          set -euo pipefail
          [ -n "$C_DIR" ] || { echo "::error::plugin_lang c needs c_dir"; exit 1; }
          src="$GITHUB_WORKSPACE/plugin/$C_DIR"
          ls "$src"/*.c >/dev/null || { echo "::error::no .c source in $C_DIR"; exit 1; }
          lib="$GITHUB_WORKSPACE/plugin/target/debug/lib${CRATE//-/_}.so"
          mkdir -p "$(dirname "$lib")"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fPIC -shared \
            -I busbar/crates/busbar-contract/include -o "$lib" "$src"/*.c
          {
            echo "BUSBAR_C_ABI_LIBRARY=$lib"
            echo "BUSBAR_C_ABI_SOURCES=$src"
          } >> "$GITHUB_ENV"
      - name: signing gate — signed loads; unsigned / wrong-key / tampered are refused (PB-11)
        # End-to-end proof against a REAL busbar binary + the REAL first-party trust pipeline, built
        # here with an ephemeral (never the release) embedded key: positive (correctly signed
        # passes) and four negatives (unsigned, wrong key, tampered lib bytes, tampered manifest),
        # each asserted on the exact refusal message. Runs only for the kinds the script covers.
        if: env.SIGNING_GATE == 'true' && (steps.crates.outputs.present == 'true' || inputs.plugin_lang == 'c')
        working-directory: plugin
        env:
          CRATE: ${{ inputs.plugin_crate }}
        run: |
          set -euo pipefail
          lib="${BUSBAR_PLUGIN_CDYLIB:-$BUSBAR_C_ABI_LIBRARY}"
          [ -f "$lib" ] || { echo "::error::no cdylib at $lib"; ls -la target/debug/ >&2; exit 1; }
          bash "$GITHUB_WORKSPACE/busbar/scripts/signing-gate.sh" \
            "$GITHUB_WORKSPACE/busbar" "$CRATE" "${{ inputs.plugin_kind }}" "${{ inputs.plugin_alias }}" "$lib" \
            "${{ inputs.manifest_name || github.event.repository.name }}"
      - name: fresh test image with the plugin's existing test features
        if: steps.crates.outputs.present == 'true' && inputs.test_features != ''
        working-directory: plugin
        env:
          CRATE: ${{ inputs.plugin_crate }}
          TEST_FEATURES: ${{ inputs.test_features }}
        run: |
          set -euo pipefail
          production="$RUNNER_TEMP/production-$(basename "$BUSBAR_PLUGIN_CDYLIB")"
          cp "$BUSBAR_PLUGIN_CDYLIB" "$production"
          echo "BUSBAR_PRODUCTION_PLUGIN_CDYLIB=$production" >> "$GITHUB_ENV"
          feat=""
          if cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; sys.exit(0 if any(p["name"]==sys.argv[1] and "dropped-in" in p["features"] for p in json.load(sys.stdin)["packages"]) else 1)' "$CRATE"; then feat="--features dropped-in"; fi
          cargo build --locked -p "$CRATE" --lib $feat --features "$TEST_FEATURES"
          [ -f "$BUSBAR_PLUGIN_CDYLIB" ] || { echo "::error::fresh test image missing"; exit 1; }
      - name: mysql strict sql_mode (a dynamic variable; only root may set it)
        if: inputs.service == 'mysql'
        run: mysql -h 127.0.0.1 -uroot -pbusbar -e "SET GLOBAL sql_mode='STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION';"
      - name: "#33 store migration: the 1.5.5 fixture its migrate test reads, written by the pinned published v1.5.5 and the 1.5-line plugin, is present and intact (BUSBAR-1.6.0.md l.1096-1103, M5: a missing fixture is red)"
        if: inputs.plugin_kind == 'store' && inputs.plugin_alias != 'memory' && steps.crates.outputs.present == 'true'
        run: bash busbar/scripts/store-migration-fixture.sh check "plugin/store-${{ inputs.plugin_alias }}/tests/fixtures/1.5.5"
      - name: test (the plugin's whole suite, live backend included)
        if: steps.crates.outputs.present == 'true'
        working-directory: plugin
        env:
          TEST_FEATURES: ${{ inputs.test_features }}
        run: |
          features=()
          [ -z "$TEST_FEATURES" ] || features=(--features "$TEST_FEATURES")
          cargo test --workspace --locked "${features[@]}"
      - name: extra test command
        if: inputs.extra_test != '' && steps.crates.outputs.present == 'true'
        working-directory: plugin
        env:
          EXTRA: ${{ inputs.extra_test }}
        run: bash -c "$EXTRA"
      - name: ordinary plugin tests against the freshly built release library
        if: ${{ !cancelled() && steps.crates.outputs.present == 'true' }}
        working-directory: plugin
        env:
          CRATE: ${{ inputs.plugin_crate }}
          TEST_FEATURES: ${{ inputs.test_features }}
        run: |
          set -euo pipefail
          feat=""
          if cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; sys.exit(0 if any(p["name"]==sys.argv[1] and "dropped-in" in p["features"] for p in json.load(sys.stdin)["packages"]) else 1)' "$CRATE"; then feat="--features dropped-in"; fi
          cargo build --release --locked -p "$CRATE" --lib $feat
          target="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          export BUSBAR_PLUGIN_CDYLIB="$target/release/lib${CRATE//-/_}.so"
          features=()
          if [ -n "$TEST_FEATURES" ]; then
            cp "$BUSBAR_PLUGIN_CDYLIB" "$RUNNER_TEMP/production-release-lib${CRATE//-/_}.so"
            features=(--features "$TEST_FEATURES")
            cargo build --release --locked -p "$CRATE" --lib $feat "${features[@]}"
          fi
          [ -f "$BUSBAR_PLUGIN_CDYLIB" ] || { echo "::error::fresh plugin library missing"; exit 1; }
          list="$RUNNER_TEMP/plugin-tests.list"
          cargo test --release --locked -p "$CRATE" --tests "${features[@]}" -- --list > "$list"
          grep -q ': test$' "$list" || { echo "::error::the actual plugin has no ordinary tests"; exit 1; }
          out="$RUNNER_TEMP/plugin-tests.log"
          cargo test --release --locked -p "$CRATE" --tests "${features[@]}" 2>&1 | tee "$out"
          python3 -c 'import re,sys; text=open(sys.argv[1]).read(); passed=[int(n) for n in re.findall(r"test result: ok\. (\d+) passed;", text)]; assert sum(passed)>0, "no ordinary plugin test executed"' "$out"
      - name: cargo deny (the rendered deny.toml; busbar's .github/fleet/deps.toml at the pin)
        if: ${{ !cancelled() && steps.crates.outputs.present == 'true' }}
        working-directory: plugin
        run: |
          set -euo pipefail
          v=0.20.2; sum=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$v/cargo-deny-$v-x86_64-unknown-linux-musl.tar.gz"
          echo "$sum  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          deny="$RUNNER_TEMP/cargo-deny-$v-x86_64-unknown-linux-musl/cargo-deny"
          # The advisory verdict as data for the parity gate (a declared extra line never exempts an
          # advisory); this step's own blocking check is the line after it.
          "$deny" --locked --format json check advisories 2> "$RUNNER_TEMP/advisories.jsonl" || true
          "$deny" --locked check
      - name: C ABI integration through the actual header-only library
        if: ${{ !cancelled() && inputs.plugin_lang == 'c' }}
        working-directory: busbar
        run: cargo test --locked -p busbar-plugin-loader --test c_abi

  macos:
    name: build, test [macos]
    needs: pin
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      - name: busbar at the pin
        if: inputs.busbar_checkout || inputs.plugin_lang == 'c'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ needs.pin.outputs.sha }}
          path: busbar
      # The linux job always has busbar at the pin (its golden cells); macOS gets the same cells,
      # so a plugin test that reads BUSBAR_GOLDEN_DIR passes on both OSes with no per-plugin exception.
      - name: busbar's golden cells at the pin
        if: ${{ !(inputs.busbar_checkout || inputs.plugin_lang == 'c') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ needs.pin.outputs.sha }}
          path: busbar
          sparse-checkout: testing/shadow-oracle/golden
      - name: the backend, natively (macOS runners have no service containers)
        env:
          SERVICE: ${{ inputs.service }}
          CHECKOUT: ${{ inputs.busbar_checkout }}
        run: |
          set -euo pipefail
          case "$SERVICE" in
            postgres)
              brew install postgresql@16
              pgbin="$(brew --prefix postgresql@16)/bin"
              echo busbar > "$RUNNER_TEMP/pwfile"
              "$pgbin/initdb" -D "$RUNNER_TEMP/pgdata" -U busbar --pwfile="$RUNNER_TEMP/pwfile" -A scram-sha-256
              "$pgbin/pg_ctl" -D "$RUNNER_TEMP/pgdata" -o "-p 5432 -c max_connections=200" -l "$RUNNER_TEMP/pg.log" -w start
              PGPASSWORD=busbar "$pgbin/createdb" -h localhost -p 5432 -U busbar busbar_test
              echo "BUSBAR_TEST_POSTGRES_URL=postgres://busbar:busbar@localhost:5432/busbar_test" >> "$GITHUB_ENV" ;;
            valkey)
              brew install valkey
              valkey-server --port 6379 --bind 127.0.0.1 --daemonize yes --save "" --appendonly no --maxmemory-policy noeviction
              for _ in $(seq 1 30); do valkey-cli -p 6379 ping && break; sleep 1; done
              valkey-cli -p 6379 ping
              echo "VALKEY_URL=redis://127.0.0.1:6379/0" >> "$GITHUB_ENV" ;;
            *) echo "no native $SERVICE on macOS; the macOS test command excludes its live cases" ;;
          esac
          echo "BUSBAR_GOLDEN_DIR=$GITHUB_WORKSPACE/busbar/testing/shadow-oracle/golden" >> "$GITHUB_ENV"
          if [ "$CHECKOUT" = true ]; then
            {
              echo "BUSBAR_CHECKOUT=$GITHUB_WORKSPACE/busbar"
              echo "BUSBAR_TARGET_DIR=$GITHUB_WORKSPACE/busbar/target"
              echo "CARGO_PROFILE_RELEASE_LTO=off"
              echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"
            } >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ inputs.plugin_lang == 'c' && 'busbar' || (inputs.busbar_checkout && fromJSON('"plugin\nbusbar"') || 'plugin') }}
          key: busbar-${{ needs.pin.outputs.sha }}
      # THE NO-CRATES PASS IS plugins.yaml's `pending_crate: true` FOR THIS REPO, NOTHING ELSE'S (the
      # registry at the pin). Any other failure to read the workspace, a broken manifest included, is
      # RED with cargo's error shown: read as "no crates yet", it skipped every build and test below
      # and the leg went green (hook-webrequest #24). The same text on both legs;
      # xtask/tests/plugin_ci_crates_step.rs runs it against planted checkouts.
      - name: does the repo have its crates yet (no crates passes only when plugins.yaml marks it pending_crate)
        id: crates
        working-directory: plugin
        env:
          PLUGIN_LANG: ${{ inputs.plugin_lang }}
          REGISTRY: ${{ github.workspace }}/busbar/plugins.yaml
        run: |
          set -euo pipefail
          # A C plugin has no Cargo workspace by design (pin-check refuses one); its proof is the C path.
          if [ "$PLUGIN_LANG" = c ]; then echo "present=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          repo="${GITHUB_REPOSITORY#*/}"
          err=""
          if [ ! -f Cargo.toml ]; then
            err="no Cargo.toml at the repo root"
          elif ! out="$(cargo metadata --format-version 1 --no-deps 2>&1 >/dev/null)"; then
            err="cargo metadata failed: $out"
          fi
          if [ -z "$err" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ -f "$REGISTRY" ] || { echo "::error::no plugins.yaml at the pin ($REGISTRY): cannot tell a pending_crate repo from a broken one"; printf '%s\n' "$err"; exit 1; }
          pending="$(awk -v r="$repo" '
            /^[^[:space:]#]/ { inp = ($1 == "plugins:"); cur = "" }
            inp && $1 == "-" && $2 == "repo:" { cur = $3 }
            inp && cur == r && $1 == "pending_crate:" && $2 == "true" { print "true" }
          ' "$REGISTRY")"
          if [ "$pending" = true ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no crates yet (plugins.yaml marks $repo pending_crate): the pin job is this repo's whole proof"
            printf '%s\n' "$err"
            exit 0
          fi
          echo "::error::$repo: the Cargo workspace does not read, and plugins.yaml at the pin does not mark $repo pending_crate; the error:"
          printf '%s\n' "$err"
          exit 1
      - name: build
        if: steps.crates.outputs.present == 'true'
        working-directory: plugin
        env:
          CRATE: ${{ inputs.plugin_crate }}
        run: |
          set -euo pipefail
          cargo build --workspace --locked
          # the door is behind the crate's `dropped-in` feature once the crate declares it; pass it only then
          # (works before and after the plugin repos gate their export_door!).
          feat=""
          if cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; sys.exit(0 if any(p["name"]==sys.argv[1] and "dropped-in" in p["features"] for p in json.load(sys.stdin)["packages"]) else 1)' "$CRATE"; then feat="--features dropped-in"; fi
          cargo build --locked -p "$CRATE" --lib $feat
          case "$RUNNER_OS" in
            macOS) file="lib${CRATE//-/_}.dylib" ;;
            Linux) file="lib${CRATE//-/_}.so" ;;
            *) echo "::error::unsupported plugin test platform $RUNNER_OS"; exit 1 ;;
          esac
          target="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          artifact="$target/debug/$file"
          [ -f "$artifact" ] || { echo "::error::fresh plugin library missing: $artifact"; exit 1; }
          echo "BUSBAR_PLUGIN_CDYLIB=$artifact" >> "$GITHUB_ENV"
      - name: fresh test image with the plugin's existing test features
        if: steps.crates.outputs.present == 'true' && inputs.test_features != ''
        working-directory: plugin
        env:
          CRATE: ${{ inputs.plugin_crate }}
          TEST_FEATURES: ${{ inputs.test_features }}
        run: |
          set -euo pipefail
          production="$RUNNER_TEMP/production-$(basename "$BUSBAR_PLUGIN_CDYLIB")"
          cp "$BUSBAR_PLUGIN_CDYLIB" "$production"
          echo "BUSBAR_PRODUCTION_PLUGIN_CDYLIB=$production" >> "$GITHUB_ENV"
          feat=""
          if cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; sys.exit(0 if any(p["name"]==sys.argv[1] and "dropped-in" in p["features"] for p in json.load(sys.stdin)["packages"]) else 1)' "$CRATE"; then feat="--features dropped-in"; fi
          cargo build --locked -p "$CRATE" --lib $feat --features "$TEST_FEATURES"
          [ -f "$BUSBAR_PLUGIN_CDYLIB" ] || { echo "::error::fresh test image missing"; exit 1; }
      - name: test
        if: steps.crates.outputs.present == 'true'
        working-directory: plugin
        env:
          MACOS_TEST: ${{ inputs.macos_test }}
        run: bash -c "$MACOS_TEST"
      - name: "C ABI: build against the public header and run ordinary loader tests"
        if: inputs.plugin_lang == 'c'
        env:
          CRATE: ${{ inputs.plugin_crate }}
          C_DIR: ${{ inputs.c_dir }}
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/plugin/$C_DIR"
          lib="$GITHUB_WORKSPACE/plugin/target/debug/lib${CRATE//-/_}.dylib"
          mkdir -p "$(dirname "$lib")"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fPIC -shared \
            -I busbar/crates/busbar-contract/include -o "$lib" "$src"/*.c
          cd busbar
          BUSBAR_C_ABI_LIBRARY="$lib" BUSBAR_C_ABI_SOURCES="$src" \
            cargo test --locked -p busbar-plugin-loader --test c_abi

  coverage:
    name: coverage
    needs: pin
    # Rust only: a C plugin's lines are not llvm-cov's to count.
    if: inputs.plugin_lang != 'c' && (github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A step's `if:` cannot read its own `env:` or `secrets`; a job-level flag it can.
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      # The same busbar the linux test job uses: a plugin test that reads BUSBAR_CHECKOUT (the
      # end-to-end tests) or BUSBAR_GOLDEN_DIR must find it here too, or coverage runs it red.
      - name: busbar at the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ needs.pin.outputs.sha }}
          path: busbar
      - name: the test environment (as the linux job sets it)
        env:
          CHECKOUT: ${{ inputs.busbar_checkout }}
        run: |
          set -euo pipefail
          {
            echo "BUSBAR_GOLDEN_DIR=$GITHUB_WORKSPACE/busbar/testing/shadow-oracle/golden"
            if [ "$CHECKOUT" = true ]; then
              echo "BUSBAR_CHECKOUT=$GITHUB_WORKSPACE/busbar"
              echo "BUSBAR_TARGET_DIR=$GITHUB_WORKSPACE/busbar/target"
              echo "CARGO_PROFILE_RELEASE_LTO=off"
              echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"
            fi
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@b3c2424e62a3f08fd88bf434799847a4d0da36c8 # cargo-llvm-cov
      - name: collect (a failing test fails the job; a plugin that needs a service container ignores run failures here, linux is its gate)
        working-directory: plugin
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$SERVICE" != none ]; then flags+=(--ignore-run-fail); fi
          cargo llvm-cov --workspace --locked "${flags[@]}" --lcov --output-path lcov.info
      - name: upload
        if: env.HAS_CODECOV_TOKEN == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: plugin/lcov.info
          slug: ${{ github.repository }}
          fail_ci_if_error: false
