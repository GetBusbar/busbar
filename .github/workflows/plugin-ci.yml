# plugin-ci — the ONE canonical build/test/signoff pipeline every first-party plugin repo calls,
# via `workflow_call`, instead of hand-copying a ci.yml into each repo. That copying already
# drifted once (store-redis's manual health-check step used a `redis-cli` binary the runner didn't
# have; the other three repos didn't have that bug because they never had that step at all) — this
# file exists so every plugin repo's CI is the SAME file, not a fork of it.
#
# Standard stages every plugin gets, in this order:
#   1. Checkout the plugin + a sibling checkout of busbar (this repo) at BUSBAR_REF — the same
#      interim local-path-dependency pattern every plugin's Cargo.toml already uses. Update
#      BUSBAR_REF's default below once 1.5.0 ships and plugins can track `main` again.
#   2. Optionally boot a real backend service container (`postgres:16` / `redis:7` /
#      `hashicorp/vault` dev-mode) — never a mock. `pg_isready`/the image's own Docker healthcheck
#      (or, for vault, a `wget` against its own `/v1/sys/health` endpoint) gates every later step so
#      nothing races an unready service.
#   3. fmt / build / clippy / test, in that fixed order, on the plugin repo itself.
#   4. An optional extra test command against the SIBLING busbar checkout (e.g. the monorepo's own
#      live-service integration test for this exact backend) — the reason the sibling checkout
#      exists in the first place for store plugins.
#   5. SIGNOFF: pack + SIGN the plugin with the real busbar-plugin-pack tool using an EPHEMERAL
#      per-run ed25519 keypair (never the real release key) — proves the manifest/tarball actually
#      packs into a valid shape *now*, not first discovered at release time.
#   6. SIGNING GATE: build busbar with the ephemeral PUBLIC key embedded (BUSBAR_RELEASE_PUBKEY)
#      and prove end-to-end that a correctly-signed tarball is accepted while unsigned, wrong-key,
#      and tampered tarballs are each refused with the exact expected error. No CI step uses
#      --allow-unsigned / plugins.trust.allow_unsigned anymore — that bypass is local-dev only.
name: plugin-ci

on:
  workflow_call:
    inputs:
      plugin_crate:
        description: "The plugin cdylib's real Cargo package name, e.g. busbar-store-postgres-plugin"
        required: true
        type: string
      plugin_kind:
        description: "store | auth | hook | secret — passed to busbar-plugin-pack --kind"
        required: true
        type: string
      plugin_alias:
        description: "The short config name, e.g. postgres, oidc — passed to --alias"
        required: true
        type: string
      service:
        description: "none | postgres | redis | vault | mysql | wiremock | openldap — which real backend service container to boot"
        required: false
        type: string
        default: "none"
      extra_sibling_test_command:
        description: >-
          Optional extra shell command run from the sibling busbarAI checkout after this repo's own
          tests pass — e.g. `cargo test -p busbar-store-postgres` to also exercise the monorepo's
          own live-service test against the same running container.
        required: false
        type: string
        default: ""
      busbar_ref:
        description: "Which busbar branch to check out as the sibling dependency"
        required: false
        type: string
        # main since v1.5.0 shipped (2026-08-02): plugins build against the released engine by
        # default, per the header's own "update once 1.5.0 ships" note. Pass busbar_ref: dev
        # explicitly to test a plugin against unreleased engine work.
        default: "main"

jobs:
  build-test-signoff:
    name: build, test, clippy, fmt, signoff
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ inputs.service == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: busbar
          POSTGRES_PASSWORD: busbar
          POSTGRES_DB: busbar_test
        ports:
          - 5432:5432
        options: >-
          ${{ inputs.service == 'postgres' && '--health-cmd "pg_isready -U busbar" --health-interval 10s --health-timeout 5s --health-retries 5' || '' }}
      redis:
        image: ${{ inputs.service == 'redis' && 'redis:7' || '' }}
        ports:
          - 6379:6379
        # Runs INSIDE the container (it has its own redis-cli — the runner does not); GitHub
        # Actions blocks every job step from starting until this reports healthy, so no separate
        # manual "wait for redis" step is needed or correct here.
        options: >-
          ${{ inputs.service == 'redis' && '--health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10' || '' }}
      # Real MySQL 8 server (BUSBAR_TEST_MYSQL_URL, set on the Test steps below). `sql_mode` is a
      # dynamic variable (no restart needed) so strict mode is set via `SET GLOBAL` in a step below
      # once the container's healthy, rather than a boot flag — GitHub's `services:` block has no
      # supported way to pass mysqld command-line args, only `docker run` options.
      mysql:
        image: ${{ inputs.service == 'mysql' && 'mysql:8' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: busbar
          MYSQL_USER: busbar
          MYSQL_PASSWORD: busbar
          MYSQL_DATABASE: busbar_test
        ports:
          - 3306:3306
        options: >-
          ${{ inputs.service == 'mysql' && '--health-cmd "mysqladmin ping -h localhost -ubusbar -pbusbar" --health-interval 10s --health-timeout 5s --health-retries 10' || '' }}
      # Real Vault dev-mode server for a plugin's live-Vault tests (BUSBAR_TEST_VAULT_ADDR /
      # BUSBAR_TEST_VAULT_TOKEN, set on the Test steps below) — same hard-fail-under-CI-if-unset
      # discipline the plugin's own tests apply, mirroring busbarAI's own ci.yml vault service block.
      vault:
        image: ${{ inputs.service == 'vault' && 'hashicorp/vault' || '' }}
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ${{ inputs.service == 'vault' && 'root' || '' }}
        ports:
          - 8200:8200
        options: >-
          ${{ inputs.service == 'vault' && '--cap-add=IPC_LOCK --health-cmd "wget -qO- http://127.0.0.1:8200/v1/sys/health" --health-interval 10s --health-timeout 5s --health-retries 5' || '' }}
      # Ready-made WireMock — the GitHub-OAuth token/user/orgs endpoints for auth-github's live e2e.
      # PINNED (never :latest). No Docker health-cmd (the image has no curl/wget); auth-github's
      # tests/e2e.rs polls the /__admin API for readiness and registers its stub mappings over it, so
      # nothing here mounts a fixture file (service containers start before checkout). Exposed to the
      # test via BUSBAR_TEST_WIREMOCK_URL on the cargo test step below.
      wiremock:
        image: ${{ inputs.service == 'wiremock' && 'wiremock/wiremock:3.9.2' || '' }}
        ports:
          - 8080:8080
      # Ready-made OpenLDAP — the directory auth-ldap binds against for its live e2e. PINNED. The
      # image auto-creates the base suffix dc=example,dc=org + cn=admin from these env vars; auth-ldap's
      # tests/e2e.rs then seeds the test user/group over LDAP itself (ldap3) and retries the admin bind
      # until the container is ready. Exposed via BUSBAR_TEST_LDAP_URL on the cargo test step below.
      openldap:
        image: ${{ inputs.service == 'openldap' && 'osixia/openldap:1.5.0' || '' }}
        env:
          LDAP_ORGANISATION: ${{ inputs.service == 'openldap' && 'Example Org' || '' }}
          LDAP_DOMAIN: ${{ inputs.service == 'openldap' && 'example.org' || '' }}
          LDAP_ADMIN_PASSWORD: ${{ inputs.service == 'openldap' && 'adminpassword' || '' }}
        ports:
          - 389:389
    steps:
      - name: Checkout the plugin
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Checkout busbar (sibling path dependency)
        uses: actions/checkout@v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ inputs.busbar_ref }}
          path: busbarAI

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        working-directory: plugin
        run: cargo fmt --all -- --check

      - name: cargo build
        working-directory: plugin
        run: cargo build --all-targets

      - name: cargo clippy
        working-directory: plugin
        run: cargo clippy --all-targets -- -D warnings

      - name: mysql — set strict sql_mode (dynamic variable, no restart needed)
        if: inputs.service == 'mysql'
        # SET GLOBAL requires SUPER/SYSTEM_VARIABLES_ADMIN, which the official mysql image's
        # MYSQL_USER-created account (`busbar`) never has by design -- only `root` does. Must run
        # as root, not the `busbar` app user this workflow otherwise tests as.
        run: mysql -h 127.0.0.1 -uroot -pbusbar -e "SET GLOBAL sql_mode='STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION';"

      - name: cargo test
        working-directory: plugin
        env:
          # Both conventional service-URL env var names are set whenever a service is active; a
          # plugin's tests read whichever one applies to it and ignore the other.
          BUSBAR_TEST_POSTGRES_URL: ${{ inputs.service == 'postgres' && 'postgres://busbar:busbar@localhost:5432/busbar_test' || '' }}
          REDIS_URL: ${{ inputs.service == 'redis' && 'redis://localhost:6379/0' || '' }}
          BUSBAR_TEST_VAULT_ADDR: ${{ inputs.service == 'vault' && 'http://127.0.0.1:8200' || '' }}
          BUSBAR_TEST_VAULT_TOKEN: ${{ inputs.service == 'vault' && 'root' || '' }}
          BUSBAR_TEST_MYSQL_URL: ${{ inputs.service == 'mysql' && 'mysql://busbar:busbar@127.0.0.1:3306/busbar_test' || '' }}
          # The 1.5.2 auth login-plugin live e2es (auth-github / auth-ldap tests/e2e.rs): the plugin's
          # OWN token-exchange direction driven through a REAL busbar boot against these containers.
          # Unset ⇒ the test skips loudly (never a silent pass).
          BUSBAR_TEST_WIREMOCK_URL: ${{ inputs.service == 'wiremock' && 'http://127.0.0.1:8080' || '' }}
          BUSBAR_TEST_LDAP_URL: ${{ inputs.service == 'openldap' && 'ldap://127.0.0.1:389' || '' }}
        run: cargo test

      - name: cargo test (sibling busbarAI checkout — this backend's own monorepo integration test)
        if: inputs.extra_sibling_test_command != ''
        working-directory: busbarAI
        env:
          BUSBAR_TEST_POSTGRES_URL: ${{ inputs.service == 'postgres' && 'postgres://busbar:busbar@localhost:5432/busbar_test' || '' }}
          REDIS_URL: ${{ inputs.service == 'redis' && 'redis://localhost:6379/0' || '' }}
          BUSBAR_TEST_VAULT_ADDR: ${{ inputs.service == 'vault' && 'http://127.0.0.1:8200' || '' }}
          BUSBAR_TEST_VAULT_TOKEN: ${{ inputs.service == 'vault' && 'root' || '' }}
          BUSBAR_TEST_MYSQL_URL: ${{ inputs.service == 'mysql' && 'mysql://busbar:busbar@127.0.0.1:3306/busbar_test' || '' }}
        run: ${{ inputs.extra_sibling_test_command }}

      - name: Build busbar-plugin-pack (from the sibling checkout)
        working-directory: busbarAI
        run: cargo build --release -p busbar-plugin-pack

      - name: Ephemeral CI release keypair (never the real release key)
        # One throwaway ed25519 pair per run. The PUBLIC half is embedded into the busbar binary
        # built below (BUSBAR_RELEASE_PUBKEY), the PRIVATE half signs the signoff tarball — so
        # every later step exercises the REAL first-party verification path instead of the
        # --allow-unsigned bypass this workflow used to ship.
        run: |
          set -euo pipefail
          busbarAI/target/release/busbar-plugin-pack keygen > /tmp/ci-keys
          PRIV=$(sed -n 's/^private.*: //p' /tmp/ci-keys)
          PUB=$(sed -n 's/^public.*: //p' /tmp/ci-keys)
          rm -f /tmp/ci-keys
          echo "::add-mask::$PRIV"
          echo "CI_EPHEMERAL_SIGN_KEY=$PRIV" >> "$GITHUB_ENV"
          echo "CI_EPHEMERAL_PUBKEY=$PUB" >> "$GITHUB_ENV"
          # A verified first-party plugin must be at/above the binary's version (automatic
          # anti-downgrade floor), so the signoff pack version must match busbar's own version —
          # the old 0.0.0-ci would be REJECTED by a signature-verifying binary.
          BUSBAR_VER=$(sed -n 's/^version *= *"\(.*\)"/\1/p' busbarAI/crates/busbar/Cargo.toml | head -1)
          echo "BUSBAR_VER=$BUSBAR_VER" >> "$GITHUB_ENV"

      - name: SIGNOFF — pack + SIGN the plugin, prove the manifest/tarball shape is valid now
        run: |
          set -euo pipefail
          libext=so; libprefix=lib
          lib="plugin/target/debug/${libprefix}$(echo "${{ inputs.plugin_crate }}" | tr '-' '_').${libext}"
          [ -f "$lib" ] || { echo "expected cdylib not found at $lib" >&2; ls -la plugin/target/debug/ >&2; exit 1; }
          BUSBAR_SIGN_KEY="$CI_EPHEMERAL_SIGN_KEY" busbarAI/target/release/busbar-plugin-pack pack \
            --lib "$lib" \
            --name "${{ inputs.plugin_crate }}" \
            --alias "${{ inputs.plugin_alias }}" \
            --kind "${{ inputs.plugin_kind }}" \
            --version "$BUSBAR_VER" \
            --publisher busbar \
            --description "CI signoff pack for ${{ inputs.plugin_crate }}" \
            --license Apache-2.0 \
            --out /tmp/signoff.tar.gz
          echo "packed OK (signed with the ephemeral CI key):"
          ls -l /tmp/signoff.tar.gz

      # ── Everything below proves the plugin works the way a real operator actually gets it into a
      #    running busbar — not by calling `busbar_plugin_loader::load_store()` (or the auth/hook/
      #    secret equivalents) as a Rust function, which no end user ever does. There are exactly TWO
      #    real mechanisms, and both are exercised here, against a REAL busbar binary:
      #      1. FILE-DROP: place the signed tarball in `plugins.dir` before boot; busbar discovers
      #         and loads it as part of normal startup. This is also how a real durable-persistence
      #         proof should be structured for a plugin with a real backend (dlopen via a real boot,
      #         not a direct `load_store()` call) — see the comment on the STORE mint/fetch step below.
      #      2. RUNTIME INSTALL: `POST /plugins` while busbar is already running, then the documented
      #         restart-to-apply path (`store` module changes are never a hot swap — confirmed by
      #         reading `docs/admin-api.md` and validating locally: `PUT /config/settings` returns
      #         `reload_to_apply: ["store"]` and the change only takes effect after a real process
      #         restart, which busbar's own `POST /restart` deliberately does NOT self-perform — it
      #         drains and exits, expecting a supervisor to respawn it, so CI plays that role here).
      - name: Build busbar (from the sibling checkout) with the ephemeral release key embedded
        working-directory: busbarAI
        # option_env!("BUSBAR_RELEASE_PUBKEY") is compile-time (crates/plugin-sign); with the key
        # set, this binary VERIFIES first-party signatures — no allow_unsigned anywhere below.
        run: |
          touch crates/plugin-sign/src/lib.rs
          BUSBAR_RELEASE_PUBKEY="$CI_EPHEMERAL_PUBKEY" cargo build --release --bin busbar

      - name: SIGNING GATE — signed loads; unsigned / wrong-key / tampered are refused
        # End-to-end proof against the real binary + real `busbar --validate` trust pipeline:
        #   positive (correctly signed passes) and four negatives (unsigned, wrong key, tampered
        #   lib bytes, tampered manifest), each asserted on the exact refusal message.
        # BUSBAR_GATE_* reuses this run's keypair, so the busbar binary built above is reused as-is.
        run: |
          set -euo pipefail
          libext=so; libprefix=lib
          lib="plugin/target/debug/${libprefix}$(echo "${{ inputs.plugin_crate }}" | tr '-' '_').${libext}"
          BUSBAR_GATE_SIGN_KEY="$CI_EPHEMERAL_SIGN_KEY" BUSBAR_GATE_PUBKEY="$CI_EPHEMERAL_PUBKEY" \
            bash busbarAI/scripts/signing-gate.sh busbarAI \
            "${{ inputs.plugin_crate }}" "${{ inputs.plugin_kind }}" "${{ inputs.plugin_alias }}" "$lib"

      - name: INSTALL-AND-SERVE — boot a real busbar, install THIS plugin over the real admin API, confirm it activates
        if: inputs.plugin_kind == 'store'
        run: |
          set -euo pipefail
          WORKDIR=$(mktemp -d)
          mkdir -p "$WORKDIR/plugins"
          export BUSBAR_ADMIN_TOKEN="ci-admin-$(date +%s)"
          export FAKE_UPSTREAM_KEY="sk-ci-fake"

          cat > "$WORKDIR/providers.yaml" <<EOF
          anthropic:
            protocol: anthropic
            base_url: https://api.anthropic.com
            api_key: { env: FAKE_UPSTREAM_KEY }
          EOF
          cat > "$WORKDIR/config.yaml" <<EOF
          auth:
            chain: [keys]
            admin_auth:
              - admin-tokens: { token: { env: BUSBAR_ADMIN_TOKEN } }
          # STRICT trust posture — no allow_unsigned: the tarball is signed with this run's
          # ephemeral key and the binary above embeds the matching public key, so acceptance here
          # exercises the real first-party signature verification path.
          plugins:
            enabled: true
            dir: $WORKDIR/plugins
          providers:
            anthropic:
              api_key: { env: FAKE_UPSTREAM_KEY }
          models:
            m:
              provider: anthropic
              max_concurrent: 1
          EOF

          BUSBAR_BIN=busbarAI/target/release/busbar
          export BUSBAR_CONFIG_OVERLAY="$WORKDIR/overlay.json"
          ADMIN=http://127.0.0.1:8081/api/v1/admin

          # Boot WITHOUT the plugin present — this run's whole point is proving the RUNTIME install
          # path, so the plugin must not already be loadable at first boot.
          BUSBAR_PROVIDERS="$WORKDIR/providers.yaml" BUSBAR_CONFIG="$WORKDIR/config.yaml" \
            "$PWD/$BUSBAR_BIN" > "$WORKDIR/busbar.log" 2>&1 &
          BUSBAR_PID=$!
          trap 'kill $BUSBAR_PID 2>/dev/null || true' EXIT
          # On ANY failure, dump every busbar log before dying — a relaunched busbar that
          # never comes back up otherwise fails as a bare curl exit 7 with its actual boot
          # error invisible (exactly how store-valkey's post-restart boot failure hid).
          trap 'ec=$?; echo "=== step failed (exit $ec) — busbar logs ==="; for f in "$WORKDIR"/busbar*.log; do echo "--- $f ---"; cat "$f" 2>/dev/null || true; done; exit $ec' ERR
          for _ in $(seq 1 20); do curl -sf -o /dev/null "http://127.0.0.1:8081/api/v1/admin/plugins?type=store" -H "Authorization: Bearer $BUSBAR_ADMIN_TOKEN" && break; sleep 0.5; done

          # The packed tarball's base64 text can run into the tens of MB for a plugin that bundles
          # a compiled dependency (e.g. rusqlite's bundled sqlite) — passing that as a literal `-d`
          # ARGUMENT (as this used to) blows past the OS ARG_MAX for a single argv element and curl
          # fails with "Argument list too long" before it even makes a request. Writing the JSON
          # body to a file and using `-d @file` reads it as a request body instead, which has no
          # such limit.
          python3 -c "
          import base64, json, sys
          with open('/tmp/signoff.tar.gz', 'rb') as f:
              b64 = base64.b64encode(f.read()).decode('ascii')
          json.dump({'file': '${{ inputs.plugin_crate }}-ci.tar.gz', 'tarball_b64': b64}, open('/tmp/install-body.json', 'w'))
          "
          echo "install..."
          INSTALL_STATUS=$(curl -s -o /tmp/install.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $BUSBAR_ADMIN_TOKEN" -H "Content-Type: application/json" \
            -d @/tmp/install-body.json \
            "$ADMIN/plugins")
          cat /tmp/install.json
          [ "$INSTALL_STATUS" = "201" ] || { echo "expected 201 from POST /plugins, got $INSTALL_STATUS" >&2; exit 1; }

          # `store` config changes are documented + confirmed restart-to-apply, never a hot swap
          # (`POST /plugins/reload` alone is NOT enough — it refreshes the plugin registry/hook
          # transports only). Set the module durably (persist:true, needs the overlay above), then
          # restart. busbar's restart deliberately does not self-respawn (supervisor_detected), so
          # this step plays supervisor and relaunches it itself.
          # Empty `settings: {}` only works for a plugin with a usable default for every required
          # field (sqlite's default file path, redis's default localhost) -- postgres and mysql
          # have no sensible default connection target and correctly REFUSE to open() without one,
          # which means the restarted busbar process below never comes back up and every later
          # curl in this step fails with "Failed to connect" (exit 7). Inject real settings for the
          # backends that actually need them, matching the service containers' own credentials
          # above -- confirmed failing for real in CI for both postgres and mysql before this fix.
          case "${{ inputs.service }}" in
            postgres) STORE_SETTINGS='{"url": "postgres://busbar:busbar@127.0.0.1:5432/busbar_test"}' ;;
            mysql)    STORE_SETTINGS='{"url": "mysql://busbar:busbar@127.0.0.1:3306/busbar_test"}' ;;
            # store-valkey dropped its localhost default -- its settings now REQUIRE a "url"
            # ("valkey plugin config requires a \"url\""), so the empty-settings fallback made the
            # restarted busbar die at boot exactly like postgres/mysql did before their fix above.
            # Logical DB 5, NOT the default 0: the repo's own `cargo test` step ran against this
            # same service container minutes earlier and its e2e keys persist (a minted key naming
            # a group absent from this step's minimal config fail-closes the restarted boot).
            redis)    STORE_SETTINGS='{"url": "redis://127.0.0.1:6379/5"}' ;;
            *)        STORE_SETTINGS='{}' ;;
          esac
          echo "set store module..."
          curl -sf -X PUT -H "Authorization: Bearer $BUSBAR_ADMIN_TOKEN" -H "Content-Type: application/json" \
            -d "{\"store\": {\"module\": \"${{ inputs.plugin_crate }}\", \"settings\": $STORE_SETTINGS}, \"persist\": true}" \
            "$ADMIN/config/settings"
          curl -s -X POST -H "Authorization: Bearer $BUSBAR_ADMIN_TOKEN" "$ADMIN/restart" || true
          sleep 2
          kill $BUSBAR_PID 2>/dev/null || true
          wait $BUSBAR_PID 2>/dev/null || true

          BUSBAR_PROVIDERS="$WORKDIR/providers.yaml" BUSBAR_CONFIG="$WORKDIR/config.yaml" \
            "$PWD/$BUSBAR_BIN" > "$WORKDIR/busbar2.log" 2>&1 &
          BUSBAR_PID=$!
          for _ in $(seq 1 20); do curl -sf -o /dev/null "$ADMIN/plugins?type=store" -H "Authorization: Bearer $BUSBAR_ADMIN_TOKEN" && break; sleep 0.5; done

          if grep -q "does not match any plugin" "$WORKDIR/busbar2.log"; then
            echo "the installed plugin was NOT accepted as the active store module on restart" >&2
            cat "$WORKDIR/busbar2.log" >&2
            exit 1
          fi

          echo "confirm active + mint/fetch round-trip through the freshly-installed plugin..."
          curl -sf -H "Authorization: Bearer $BUSBAR_ADMIN_TOKEN" "$ADMIN/plugins?type=store" | tee /tmp/list.json
          grep -q "${{ inputs.plugin_crate }}" /tmp/list.json

          # Mint-and-fetch WITHIN this one process proves install -> activate -> use works
          # end-to-end. It does NOT prove cross-restart durability against a real backend — that is
          # backend-specific (needs a real database, not this generic step) and is each plugin's own
          # job via the FILE-DROP mechanism below, structured like this repo's own persistence tests
          # but loaded through a real boot instead of a direct `load_store()` call.
          KEY_ID=$(curl -sf -X POST -H "Authorization: Bearer $BUSBAR_ADMIN_TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"ci-install-verify"}' "$ADMIN/keys" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          [ -n "$KEY_ID" ] || { echo "mint returned no id" >&2; exit 1; }
          curl -sf -H "Authorization: Bearer $BUSBAR_ADMIN_TOKEN" "$ADMIN/keys/$KEY_ID" | grep -q "$KEY_ID"
          echo "OK: ${{ inputs.plugin_crate }} installed via the real admin API and served a real mint/fetch round-trip"

      - name: FILE-DROP — boot a real busbar with THIS plugin already in plugins.dir, confirm boot-time discovery
        if: inputs.plugin_kind == 'store'
        run: |
          set -euo pipefail
          WORKDIR=$(mktemp -d)
          mkdir -p "$WORKDIR/plugins"
          cp /tmp/signoff.tar.gz "$WORKDIR/plugins/${{ inputs.plugin_crate }}.tar.gz"
          export BUSBAR_ADMIN_TOKEN="ci-admin-$(date +%s)"
          export FAKE_UPSTREAM_KEY="sk-ci-fake"

          cat > "$WORKDIR/providers.yaml" <<EOF
          anthropic:
            protocol: anthropic
            base_url: https://api.anthropic.com
            api_key: { env: FAKE_UPSTREAM_KEY }
          EOF
          # Same reasoning as the INSTALL-AND-SERVE step above: postgres/mysql have no usable
          # default connection target and refuse to open() with empty settings, so a boot-time
          # config naming one of them with `settings: {}` never comes up at all.
          case "${{ inputs.service }}" in
            postgres) STORE_SETTINGS_FLOW='{ url: "postgres://busbar:busbar@127.0.0.1:5432/busbar_test" }' ;;
            mysql)    STORE_SETTINGS_FLOW='{ url: "mysql://busbar:busbar@127.0.0.1:3306/busbar_test" }' ;;
            redis)    STORE_SETTINGS_FLOW='{ url: "redis://127.0.0.1:6379/6" }' ;;  # own DB — see the redis notes above
            *)        STORE_SETTINGS_FLOW='{}' ;;
          esac
          cat > "$WORKDIR/config.yaml" <<EOF
          auth:
            chain: [keys]
            admin_auth:
              - admin-tokens: { token: { env: BUSBAR_ADMIN_TOKEN } }
          # STRICT trust posture — no allow_unsigned: the tarball is signed with this run's
          # ephemeral key and the binary above embeds the matching public key, so acceptance here
          # exercises the real first-party signature verification path.
          plugins:
            enabled: true
            dir: $WORKDIR/plugins
          store:
            module: ${{ inputs.plugin_crate }}
            settings: $STORE_SETTINGS_FLOW
          providers:
            anthropic:
              api_key: { env: FAKE_UPSTREAM_KEY }
          models:
            m:
              provider: anthropic
              max_concurrent: 1
          EOF

          BUSBAR_BIN=busbarAI/target/release/busbar
          ADMIN=http://127.0.0.1:8081/api/v1/admin

          BUSBAR_PROVIDERS="$WORKDIR/providers.yaml" BUSBAR_CONFIG="$WORKDIR/config.yaml" \
            "$PWD/$BUSBAR_BIN" > "$WORKDIR/busbar.log" 2>&1 &
          BUSBAR_PID=$!
          trap 'kill $BUSBAR_PID 2>/dev/null || true' EXIT
          # On ANY failure, dump every busbar log before dying — a relaunched busbar that
          # never comes back up otherwise fails as a bare curl exit 7 with its actual boot
          # error invisible (exactly how store-valkey's post-restart boot failure hid).
          trap 'ec=$?; echo "=== step failed (exit $ec) — busbar logs ==="; for f in "$WORKDIR"/busbar*.log; do echo "--- $f ---"; cat "$f" 2>/dev/null || true; done; exit $ec' ERR
          for _ in $(seq 1 20); do curl -sf -o /dev/null "$ADMIN/plugins?type=store" -H "Authorization: Bearer $BUSBAR_ADMIN_TOKEN" && break; sleep 0.5; done

          if grep -q "does not match any plugin" "$WORKDIR/busbar.log"; then
            echo "boot-time file-drop discovery did not pick up the plugin" >&2
            cat "$WORKDIR/busbar.log" >&2
            exit 1
          fi

          KEY_ID=$(curl -sf -X POST -H "Authorization: Bearer $BUSBAR_ADMIN_TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"ci-filedrop-verify"}' "$ADMIN/keys" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          [ -n "$KEY_ID" ] || { echo "mint returned no id" >&2; exit 1; }
          curl -sf -H "Authorization: Bearer $BUSBAR_ADMIN_TOKEN" "$ADMIN/keys/$KEY_ID" | grep -q "$KEY_ID"
          echo "OK: ${{ inputs.plugin_crate }} discovered via file-drop at boot and served a real mint/fetch round-trip"

      # ── kind:auth ONLY — the plugin-SIDE half of the 1.5.2 token-exchange cross-repo matrix. The
      #    busbar-side gate (scripts/release-check-1.5.2.sh) iterates every kind:auth plugin from
      #    plugins.yaml; THIS step is the mirror that runs on a push to the plugin's OWN repo: build
      #    the plugin cdylib (already done above), file-drop the SIGNED tarball into a real busbar
      #    configured with it, and exercise the /auth/token flow(s) the plugin supports — asserting a
      #    working self-scoped key that drives a real chat-completion. Flow capability is per-plugin
      #    (see auth_plugin_flows() in release-check-1.5.2.sh): oidc supports POST (held id_token) +
      #    GET (browser redirect); github supports GET only (opaque token, authenticate()=Pass); ldap
      #    supports the GET credential-form flow. Only oidc's POST flow runs fully today; the rest are
      #    marked VERIFIED-AT-INTEGRATION (plugin finalizes in #84) and STRUCTURED to light up when the
      #    plugin + finalized ABI land. Reuses the ephemeral-key SIGNED /tmp/signoff.tar.gz + the
      #    matching-pubkey busbar built above (STRICT trust, no allow_unsigned).
      - name: TOKEN-EXCHANGE E2E — POST /auth/token → self-scoped key → real chat (kind:auth)
        if: inputs.plugin_kind == 'auth'
        run: |
          set -euo pipefail
          ALIAS='${{ inputs.plugin_alias }}'
          if [ "$ALIAS" != "oidc" ]; then
            case "$ALIAS" in
              github)
                echo "== github: GET browser-redirect flow — RUN LIVE in this repo's own 'cargo test' step =="
                echo "   (tests/e2e.rs against the 'service: wiremock' container: the CORE executes the real"
                echo "    token → /user → /user/orgs hops and mints a self-scoped key). Nothing to do inline here." ;;
              ldap)
                echo "== ldap: GET credential-form flow — RUN LIVE in this repo's own 'cargo test' step =="
                echo "   (tests/e2e.rs against the 'service: openldap' container: real bind + group read →"
                echo "    key; a wrong password is asserted 401). Nothing to do inline here." ;;
              *)
                echo "== kind:auth plugin '$ALIAS' — declare its flow(s) in auth_plugin_flows() and add a live e2e =="
                echo "   VERIFIED-AT-INTEGRATION until a runner (inline here or a tests/e2e.rs service arm) exists." ;;
            esac
            exit 0
          fi

          # ---- OIDC POST /auth/token flow (RUNS fully). ----
          WORKDIR=$(mktemp -d); mkdir -p "$WORKDIR/plugins"
          cp /tmp/signoff.tar.gz "$WORKDIR/plugins/${{ inputs.plugin_crate }}.tar.gz"
          export BUSBAR_ADMIN_TOKEN="ci-admin-$(date +%s)"

          # Real RSA keypair → JWKS (kid gate-key-1, e=AQAB) + a real RS256-signed JWT.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$WORKDIR/rsa.pem" 2>/dev/null
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          MOD=$(openssl rsa -in "$WORKDIR/rsa.pem" -noout -modulus 2>/dev/null | sed 's/^Modulus=//')
          N=$(printf '%s' "$MOD" | xxd -r -p | b64url)
          printf '{"keys":[{"kty":"RSA","use":"sig","alg":"RS256","kid":"gate-key-1","n":"%s","e":"AQAB"}]}' "$N" > "$WORKDIR/jwks.json"
          # Self-signed TLS for the JWKS host (the plugin does a real HTTPS JWKS fetch).
          # `basicConstraints=critical,CA:FALSE` is REQUIRED, not cosmetic: OpenSSL 3.x's `req -x509`
          # (ubuntu-latest) DEFAULTS a self-signed cert to CA:TRUE. The oidc plugin fetches this JWKS
          # over rustls (reqwest), which REFUSES a CA cert presented as the server's end-entity leaf
          # (`CaUsedAsEndEntity`) — so the JWKS fetch fails, the token is Rejected, and POST /auth/token
          # returns 401 "not authenticated" (NOT a BadSubject). Forcing an END-ENTITY cert here is what
          # makes the real rustls JWKS fetch succeed (the same reason the core's rust e2e uses rcgen,
          # which emits an EE cert). The cert is still added as `ca_cert_pem` so it is trusted as a root.
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$WORKDIR/tls.key" -out "$WORKDIR/tls.crt" \
            -days 2 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1" \
            -addext "basicConstraints=critical,CA:FALSE" 2>/dev/null
          ISS="https://idp.ci.local/"; AUD="ci-audience"; SUB="alice"; EXP=$(( $(date +%s) + 3600 ))
          HDR=$(printf '%s' '{"alg":"RS256","typ":"JWT","kid":"gate-key-1"}' | b64url)
          PL=$(printf '%s' "{\"iss\":\"$ISS\",\"aud\":\"$AUD\",\"sub\":\"$SUB\",\"groups\":[\"eng\"],\"exp\":$EXP,\"iat\":$(( $(date +%s) - 10 ))}" | b64url)
          SIG=$(printf '%s' "$HDR.$PL" | openssl dgst -sha256 -sign "$WORKDIR/rsa.pem" -binary | b64url)
          JWT="$HDR.$PL.$SIG"

          # JWKS server (HTTPS) + mock Anthropic upstream.
          python3 - "$WORKDIR" 8443 <<'PY' &
          import http.server, ssl, sys
          wd, port = sys.argv[1], int(sys.argv[2])
          body = open(wd + "/jwks.json", "rb").read()
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200); self.send_header("Content-Type","application/json")
                  self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
              def log_message(self,*a): pass
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain(wd + "/tls.crt", wd + "/tls.key")
          srv = http.server.ThreadingHTTPServer(("127.0.0.1", port), H)
          srv.socket = ctx.wrap_socket(srv.socket, server_side=True); srv.serve_forever()
          PY
          JWKS_PID=$!
          python3 - 8099 <<'PY' &
          import http.server, json, sys
          port = int(sys.argv[1])
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers.get("Content-Length",0)))
                  b = json.dumps({"id":"m","type":"message","role":"assistant","model":"test-model",
                      "content":[{"type":"text","text":"ci-tokenx-marker"}],"stop_reason":"end_turn",
                      "usage":{"input_tokens":11,"output_tokens":7}}).encode()
                  self.send_response(200); self.send_header("Content-Type","application/json")
                  self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
              def log_message(self,*a): pass
          http.server.ThreadingHTTPServer(("127.0.0.1", port), H).serve_forever()
          PY
          MOCK_PID=$!
          trap 'kill $JWKS_PID $MOCK_PID ${BUSBAR_PID:-} 2>/dev/null || true' EXIT

          BUSBAR_BIN="$PWD/busbarAI/target/release/busbar"
          "$BUSBAR_BIN" --generate-signing-key > "$WORKDIR/signing.key" 2>/dev/null
          CA_PEM=$(sed 's/^/            /' "$WORKDIR/tls.crt")
          cat > "$WORKDIR/providers.yaml" <<EOF
          mock:
            protocol: anthropic
            base_url: "http://127.0.0.1:8099"
          EOF
          cat > "$WORKDIR/config.yaml" <<EOF
          listen: "127.0.0.1:8080"
          admin_listen: "127.0.0.1:8081"
          public_url: "https://gate.busbar.ci"
          auth:
            key_ttl: "7d"
            signing_key: { file: "$WORKDIR/signing.key" }
            chain:
              - keys
              - oidc:
                  settings:
                    issuer: "$ISS"
                    audience: "$AUD"
                    jwks_url: "https://127.0.0.1:8443/jwks.json"
                    ca_cert_pem: |
          $CA_PEM
            admin_auth:
              - admin-tokens: { token: { env: BUSBAR_ADMIN_TOKEN } }
            role_bindings:
              oidc:
                eng:
                  group: eng-team
          plugins:
            enabled: true
            dir: "$WORKDIR/plugins"
          groups:
            eng-team:
              limits:
                - { requests: 1000000, per: day }
              child_default:
                limits:
                  - { budget: 5000, per: month }
                  - { requests: 1000, per: day }
          providers:
            mock:
              api_key: { env: MOCK_KEY }
          models:
            test-model:
              provider: mock
          EOF

          MOCK_KEY=unused BUSBAR_PROVIDERS="$WORKDIR/providers.yaml" BUSBAR_CONFIG="$WORKDIR/config.yaml" \
            "$BUSBAR_BIN" > "$WORKDIR/busbar.log" 2>&1 &
          BUSBAR_PID=$!
          for _ in $(seq 1 40); do curl -sf -o /dev/null "http://127.0.0.1:8080/healthz" && break; sleep 0.5; done
          curl -sf -o /dev/null "http://127.0.0.1:8080/healthz" || { echo "busbar did not come up"; cat "$WORKDIR/busbar.log"; exit 1; }

          echo "POST /auth/token with the minted JWT..."
          RESP=$(curl -sS -X POST "http://127.0.0.1:8080/auth/token" -H "Authorization: Bearer $JWT")
          echo "  → $RESP"
          API_KEY=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('api_key',''))" 2>/dev/null || true)
          GROUP=$(echo "$RESP"  | python3 -c "import sys,json;print(json.load(sys.stdin).get('group',''))"   2>/dev/null || true)
          if [ -z "$API_KEY" ]; then
            echo "POST /auth/token did not return an api_key: $RESP" >&2
            echo "NOTE: if this is a 403 BadSubject, the auth-oidc plugin's 'oidc:<sub>' principal id is" >&2
            echo "hitting sanitize_self_sub's ':' rejection — reconcile the prefix vs the sanitizer." >&2
            cat "$WORKDIR/busbar.log" >&2; exit 1
          fi
          # The self-serve budget group is ALWAYS `user:` + the WHOLE (module-namespaced) principal id,
          # which for the oidc plugin is `oidc:<sub>` — so the leaf is `user:oidc:<sub>`, NOT `user:<sub>`
          # (see the step note above re the `oidc:<sub>` principal id, and core's self_keys_tests.rs which
          # asserts exactly `user:oidc:alice`). The internal ':' is legitimate and cannot escape the
          # `user:` namespace.
          [ "$GROUP" = "user:oidc:$SUB" ] || { echo "group '$GROUP' != 'user:oidc:$SUB'" >&2; exit 1; }
          echo "  self-scoped key issued (group=$GROUP)"

          # One-key idempotency: a second POST returns the SAME key_id.
          KID1=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('key_id',''))")
          RESP2=$(curl -sS -X POST "http://127.0.0.1:8080/auth/token" -H "Authorization: Bearer $JWT")
          KID2=$(echo "$RESP2" | python3 -c "import sys,json;print(json.load(sys.stdin).get('key_id',''))")
          [ -n "$KID2" ] && [ "$KID1" = "$KID2" ] || { echo "one-key idempotency broken: $KID1 vs $KID2" >&2; exit 1; }
          echo "  one-key idempotency: second POST returned the SAME key_id"

          # Drive a real chat-completion with the issued key.
          CHAT=$(curl -sS "http://127.0.0.1:8080/v1/chat/completions" -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" -d '{"model":"test-model","messages":[{"role":"user","content":"hi"}]}')
          echo "$CHAT" | grep -q "ci-tokenx-marker" || { echo "chat via issued key failed: $CHAT" >&2; exit 1; }
          echo "OK: ${{ inputs.plugin_crate }} — POST /auth/token issued a working self-scoped key that drove a real chat-completion"
