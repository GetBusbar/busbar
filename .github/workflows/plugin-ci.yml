# plugin-ci — the ONE canonical build/test/signoff pipeline every first-party plugin repo calls,
# via `workflow_call`, instead of hand-copying a ci.yml into each repo. That copying already
# drifted once (store-redis's manual health-check step used a `redis-cli` binary the runner didn't
# have; the other three repos didn't have that bug because they never had that step at all) — this
# file exists so every plugin repo's CI is the SAME file, not a fork of it.
#
# Standard stages every plugin gets, in this order:
#   1. Checkout the plugin + a sibling checkout of busbar (this repo) at BUSBAR_REF — the same
#      interim local-path-dependency pattern every plugin's Cargo.toml already uses. Update
#      BUSBAR_REF's default below once 1.5.0 ships and plugins can track `main` again.
#   2. Optionally boot a real backend service container (`postgres:16` / `redis:7` /
#      `hashicorp/vault` dev-mode) — never a mock. `pg_isready`/the image's own Docker healthcheck
#      (or, for vault, a `wget` against its own `/v1/sys/health` endpoint) gates every later step so
#      nothing races an unready service.
#   3. fmt / build / clippy / test, in that fixed order, on the plugin repo itself.
#   4. An optional extra test command against the SIBLING busbar checkout (e.g. the monorepo's own
#      live-service integration test for this exact backend) — the reason the sibling checkout
#      exists in the first place for store plugins.
#   5. SIGNOFF: pack the plugin with the real busbar-plugin-pack tool (unsigned locally, same
#      fallback CI's own release jobs use when BUSBAR_SIGN_KEY isn't provisioned) on every push —
#      proves the manifest/tarball actually packs into a valid shape *now*, not first discovered at
#      release time. This step is new: none of the 4 hand-written ci.yml files had it before this.
name: plugin-ci

on:
  workflow_call:
    inputs:
      plugin_crate:
        description: "The plugin cdylib's real Cargo package name, e.g. busbar-store-postgres-plugin"
        required: true
        type: string
      plugin_kind:
        description: "store | auth | hook | secret — passed to busbar-plugin-pack --kind"
        required: true
        type: string
      plugin_alias:
        description: "The short config name, e.g. postgres, oidc — passed to --alias"
        required: true
        type: string
      service:
        description: "none | postgres | redis | vault — which real backend service container to boot"
        required: false
        type: string
        default: "none"
      extra_sibling_test_command:
        description: >-
          Optional extra shell command run from the sibling busbarAI checkout after this repo's own
          tests pass — e.g. `cargo test -p busbar-store-postgres` to also exercise the monorepo's
          own live-service test against the same running container.
        required: false
        type: string
        default: ""
      busbar_ref:
        description: "Which busbar branch to check out as the sibling dependency"
        required: false
        type: string
        default: "1.5.0-dev"

jobs:
  build-test-signoff:
    name: build, test, clippy, fmt, signoff
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ inputs.service == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: busbar
          POSTGRES_PASSWORD: busbar
          POSTGRES_DB: busbar_test
        ports:
          - 5432:5432
        options: >-
          ${{ inputs.service == 'postgres' && '--health-cmd "pg_isready -U busbar" --health-interval 10s --health-timeout 5s --health-retries 5' || '' }}
      redis:
        image: ${{ inputs.service == 'redis' && 'redis:7' || '' }}
        ports:
          - 6379:6379
        # Runs INSIDE the container (it has its own redis-cli — the runner does not); GitHub
        # Actions blocks every job step from starting until this reports healthy, so no separate
        # manual "wait for redis" step is needed or correct here.
        options: >-
          ${{ inputs.service == 'redis' && '--health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10' || '' }}
      # Real Vault dev-mode server for a plugin's live-Vault tests (BUSBAR_TEST_VAULT_ADDR /
      # BUSBAR_TEST_VAULT_TOKEN, set on the Test steps below) — same hard-fail-under-CI-if-unset
      # discipline the plugin's own tests apply, mirroring busbarAI's own ci.yml vault service block.
      vault:
        image: ${{ inputs.service == 'vault' && 'hashicorp/vault' || '' }}
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ${{ inputs.service == 'vault' && 'root' || '' }}
        ports:
          - 8200:8200
        options: >-
          ${{ inputs.service == 'vault' && '--cap-add=IPC_LOCK --health-cmd "wget -qO- http://127.0.0.1:8200/v1/sys/health" --health-interval 10s --health-timeout 5s --health-retries 5' || '' }}
    steps:
      - name: Checkout the plugin
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Checkout busbar (sibling path dependency)
        uses: actions/checkout@v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ inputs.busbar_ref }}
          path: busbarAI

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        working-directory: plugin
        run: cargo fmt --all -- --check

      - name: cargo build
        working-directory: plugin
        run: cargo build --all-targets

      - name: cargo clippy
        working-directory: plugin
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: plugin
        env:
          # Both conventional service-URL env var names are set whenever a service is active; a
          # plugin's tests read whichever one applies to it and ignore the other.
          BUSBAR_TEST_POSTGRES_URL: ${{ inputs.service == 'postgres' && 'postgres://busbar:busbar@localhost:5432/busbar_test' || '' }}
          REDIS_URL: ${{ inputs.service == 'redis' && 'redis://localhost:6379/0' || '' }}
          BUSBAR_TEST_VAULT_ADDR: ${{ inputs.service == 'vault' && 'http://127.0.0.1:8200' || '' }}
          BUSBAR_TEST_VAULT_TOKEN: ${{ inputs.service == 'vault' && 'root' || '' }}
        run: cargo test

      - name: cargo test (sibling busbarAI checkout — this backend's own monorepo integration test)
        if: inputs.extra_sibling_test_command != ''
        working-directory: busbarAI
        env:
          BUSBAR_TEST_POSTGRES_URL: ${{ inputs.service == 'postgres' && 'postgres://busbar:busbar@localhost:5432/busbar_test' || '' }}
          REDIS_URL: ${{ inputs.service == 'redis' && 'redis://localhost:6379/0' || '' }}
          BUSBAR_TEST_VAULT_ADDR: ${{ inputs.service == 'vault' && 'http://127.0.0.1:8200' || '' }}
          BUSBAR_TEST_VAULT_TOKEN: ${{ inputs.service == 'vault' && 'root' || '' }}
        run: ${{ inputs.extra_sibling_test_command }}

      - name: Build busbar-plugin-pack (from the sibling checkout)
        working-directory: busbarAI
        run: cargo build --release -p busbar-plugin-pack

      - name: SIGNOFF — pack the plugin, prove the manifest/tarball shape is valid now
        run: |
          set -euo pipefail
          libext=so; libprefix=lib
          lib="plugin/target/debug/${libprefix}$(echo "${{ inputs.plugin_crate }}" | tr '-' '_').${libext}"
          [ -f "$lib" ] || { echo "expected cdylib not found at $lib" >&2; ls -la plugin/target/debug/ >&2; exit 1; }
          busbarAI/target/release/busbar-plugin-pack pack \
            --lib "$lib" \
            --name "${{ inputs.plugin_crate }}" \
            --alias "${{ inputs.plugin_alias }}" \
            --kind "${{ inputs.plugin_kind }}" \
            --version "0.0.0-ci" \
            --publisher busbar \
            --description "CI signoff pack for ${{ inputs.plugin_crate }}" \
            --license Apache-2.0 \
            --out /tmp/signoff.tar.gz \
            --allow-unsigned
          echo "packed OK:"
          ls -l /tmp/signoff.tar.gz
