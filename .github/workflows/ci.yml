name: CI

# TWO TIERS, AND WHY.
#
# This workflow used to trigger on `push` to main/dev/qa ONLY, plus `pull_request`. That left every
# feature branch COMPLETELY UNGATED until someone opened a PR. During 1.5.4 development two work
# items were reported green from local runs and had never been CI-verified at all; the gap was only
# discovered when the PR was opened, days of work later. "It passed locally" is not a CI result, and
# a branch nobody has opened a PR for is exactly where that mistake is cheapest to make and most
# expensive to discover.
#
# So: `branches: ['**']`, and EVERY branch push now runs CI. But the full set is 12 jobs including a
# Windows runner, a release-mode timing gate, a loom model and a full-history migration corpus, and
# paying all of that on every intermediate commit of a long-lived feature branch is real money for
# very little marginal signal. So pushes to NON-PROMOTION branches run the FAST TIER:
#
#   FAST TIER (every branch push)   structure lint, fmt/clippy/build/test, config-stability,
#                                   public-hygiene. This answers the only questions that matter
#                                   mid-feature: does it build, does it lint, do the tests pass, is
#                                   the layout/config-grammar/public-prose still clean.
#   FULL TIER (dev, qa, main, and   everything above PLUS openapi-schema, migration-corpus,
#   EVERY pull request, and         executable-config, no-default-features, no-plugins-gate,
#   workflow_dispatch)              txn-guards, timing, windows.
#
# THE TRADEOFF, STATED PLAINLY: a Windows-only or featureless-build-only regression is now caught at
# PR time rather than at push time. That is exactly where it was caught before this change, so the
# fast tier costs nothing anyone had; it is pure addition. The cost paid is that a branch with an
# open PR runs the fast tier (push) alongside the full tier (pull_request) for the same commit. The
# two events land in DIFFERENT concurrency groups (`github.ref` is `refs/heads/<branch>` for push and
# `refs/pull/N/merge` for pull_request) and they are deliberately NOT unified: a shared group would
# let the cheap push run cancel the full PR run that the required checks depend on. Four duplicated
# jobs is the accepted price of never again shipping an unverified branch.
#
# ESCAPE HATCH: `workflow_dispatch` forces the FULL tier on any ref, so a feature branch can buy the
# whole gate before opening a PR without waiting for one:
#   gh workflow run ci.yml -R GetBusbar/busbar --ref feat/my-branch
#
# `branches:` never matches tag pushes, so the release tag (v1.5.3 et al) still does not run CI here.
#
# `keep-**` IS EXCLUDED, AND IT IS NOT AN UNGATING. A `keep-*` branch is an agent's hand-back, and
# `.github/workflows/keep-proof.yml` is its judge: fmt, clippy -D warnings, the workspace build, the
# workspace suite across five runners, `cargo xtask gate --all`, `cargo xtask selftest`, the design
# bindings, the construction gate and the shadow oracle. Before this exclusion a single keep push
# queued keep-proof's ten jobs AND this workflow's ten AND the three conformance workflows' twenty-
# nine — fifty jobs for one hand-back, of which ten were a verbatim second opinion. The queue is a
# shared resource and every agent waits in it, so the duplicate is the one to cut. Nothing that gets
# PROMOTED skips this workflow: a keep branch is harvested by cherry-pick onto an integration branch,
# and the integration branch runs the full thing.
on:
  push:
    # `!wip/**`: agents push `wip/<name>-<sha>` checkpoint branches by the dozen, and every one of
    # them that lands on a tree carrying an older, unfiltered ci.yml spawns a full CI run that
    # competes for the fleet with the hand-backs people are actually waiting on. Fifteen of them at
    # once is what made this explicit. Redundant against the four patterns above, and stated anyway.
    branches: ['integration/**', 'dev', 'qa', 'main', '!wip/**']
  pull_request:
  workflow_dispatch:

# Without this, every push queues a fully independent run that competes for the same runners
# instead of cancelling the one it superseded -- qa-gate.yml already has this; ci.yml never did,
# so a burst of rapid pushes (e.g. iterating on a CI fix) pays for N full runs instead of 1.
# Doubly load-bearing now that every branch push triggers a run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── COMPILER CACHE (sccache) ───────────────────────────────────────────────────────────────────────
# Swatinem/rust-cache already restores `target/` and the registry PER JOB: it makes the SECOND run of
# the SAME job on the SAME lockfile cheap. It does nothing for the first run of a new branch, and
# nothing for the fifteen OTHER jobs in this run that are compiling the same crates from the same
# sources at the same moment — each one starts from its own key and rebuilds the world.
#
# sccache is the layer under that: a CONTENT-addressed cache of individual rustc invocations, shared
# across every job and every branch through the GitHub Actions cache. Two jobs compiling identical
# `syn` produce the same cache entry; the second one downloads an object file instead of running
# rustc. The two caches are complements, not alternatives, and both are wired here.
#
# `RUSTC_WRAPPER` IS SET FOR THE WHOLE WORKFLOW, DELIBERATELY. A per-job env would be one more list
# to keep in sync with reality, and reality has already moved twice: `scripts/construction-gate.sh`
# shells out to `cargo xtask` from a job whose own steps contain no `cargo` line at all, and
# `service-image-pins` runs `cargo xtask gate` with no toolchain step. A wrapper named workflow-wide
# but installed job-by-job is a red waiting for whichever job grows a cargo line next — so EVERY job
# in this file installs sccache, including the four that compile nothing today. The install is a
# few seconds of a cached binary download; the alternative is a broken job nobody predicted.
#
# `CARGO_INCREMENTAL: 0` because sccache cannot cache incremental compilation and silently falls
# through to plain rustc when it is on. rust-cache already sets it in the jobs it runs in; naming it
# here makes it true in the jobs it does not.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CARGO_INCREMENTAL: "0"

# ── EVERY JOB IS BOUNDED ───────────────────────────────────────────────────────────────────────────
# A job without `timeout-minutes` inherits the runner's SIX-HOUR default. That is not a ceiling, it
# is the absence of one: `structure lint` hung for six hours on 2026-09-07 and the only signal was a
# spinner. Seventeen of this file's jobs were unbounded; every one of them is bounded now, and a new
# job without a bound should not pass review.
#
# THE NUMBER IS MEASURED, NOT GUESSED. Each ceiling is `p95 x 1.5`, floored at 10 minutes, over the
# green runs of that job in the last ten CI runs (`gh run list --workflow=ci.yml` then
# `gh run view --json jobs`). p95 rather than max so one cold-cache outlier does not set the ceiling
# for everyone; x1.5 so a cold cache, a slow runner and normal growth all still fit; floor 10 so a
# job that takes eight seconds today is not strangled by a 15-second ceiling the first time GitHub is
# slow. Each job carries its measured p95 in a comment above its ceiling, so raising one is an
# argument about a number somebody wrote down and not a shrug.
#
# A ceiling is a HANG guard, not a flake knob. When one fires, read the job: either the work grew
# (re-measure, raise deliberately, update the comment) or something is stuck (fix the something).
# Jobs already bounded before this pass keep their own reasoned ceilings, documented at each job:
# `check` 75 (cold-cache headroom on the primary suite), `shadow-oracle` 60, `proof-manifest` 30,
# `teller-steps` 30, `llm-conformance` 20, `construction-gate` 15, `design-bindings` 10,
# `ci-umbrella` 5.

jobs:
  # WHICH TIER RAN, SAID OUT LOUD. A green check mark is read as "the gate passed", and after this
  # change a green check on a feature branch means something WEAKER than a green check on a PR.
  # An operator who cannot see the difference will assume the strong one, which is the precise
  # mistake this workflow's two tiers otherwise re-introduce in a new place. So every run states its
  # own tier in the job summary and names the jobs it did NOT run. Costs one echo; buys the run's
  # verdict being self-describing instead of needing someone to remember the rule.
  gate-tier:
    name: gate tier (what this run actually proved)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 0.1 min
    # over the last 18 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 10
    steps:
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Declare the tier
        # Ref and event come in as ENV, not as `${{ }}` spliced into the script text. A branch name
        # is attacker-influenced data (anyone who can open a PR picks it) and GitHub allows plenty of
        # shell metacharacters in one; splicing it into a `[ ... ]` test is a script-injection seam
        # that happens to be quiet until someone names a branch to exploit it.
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ] || \
             [ "$REF" = "refs/heads/main" ] || \
             [ "$REF" = "refs/heads/dev" ] || \
             [ "$REF" = "refs/heads/qa" ]; then
            {
              echo "### CI tier: FULL"
              echo ""
              echo "Every CI job ran. Event \`$EVENT\`, ref \`$REF\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### CI tier: FAST"
              echo ""
              echo "Push to a non-promotion branch (\`$REF\`), so this run proved:"
              echo "structure lint, fmt/clippy/build/test, config-stability, public-hygiene,"
              echo "generated-artifact-drift, shadow-oracle, llm-conformance, design-bindings"
              echo "and construction-gate (blocking on its posture: a NEW red fails the run)."
              echo ""
              echo "It did NOT run: openapi-schema, migration-corpus, executable-config,"
              echo "no-default-features, no-plugins-gate, txn-guards, timing, windows."
              echo ""
              echo "Those run on every pull request, on dev/qa/main, and on demand via"
              echo "\`gh workflow run ci.yml -R GetBusbar/busbar --ref $REF_NAME\`."
              echo ""
              echo "A green check here is NOT the full gate. Do not promote on it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"

  # LAYOUT GATE — its OWN job, deliberately. It used to be the first step of `check`, ahead of
  # clippy/build/test, which made it a MASK: any layout violation aborted the job before a single
  # test ran, and the `Test` step is the only place BUSBAR_TEST_POSTGRES_URL / VALKEY_URL are set
  # against the service containers, so the two 1.5.0 store backends' live-DB coverage — the coverage
  # the comment on `services:` calls out as load-bearing, hardened to HARD-FAIL rather than skip —
  # silently stopped executing on every push and PR. A layout debt and a broken test are independent
  # facts about a commit; ordering them in one job means the second is unobservable until the first
  # is paid off. Both jobs are required checks, and neither can now hide the other.
  structure-lint:
    name: structure lint
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 14.5 min
    # over the last 20 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 22
    steps:
      # FULL HISTORY, for the `audit-ledger` step at the end of this job: every record in
      # qa/audit-ledger.json stamps the COMMIT it read, and the gate resolves each one. A depth-1
      # clone cannot, and the gate is red on a stamp it cannot check rather than passing over it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # THIS JOB NOW NEEDS A TOOLCHAIN, and that is the one real cost of the conversion: the
      # cheapest job in CI used to install nothing. It is declared rather than assumed. A Rust
      # toolchain does happen to be present on today's runner image, but that is a property of the
      # image and not of anything this repository controls -- the same reasoning the release-order
      # lint's own header gives for parsing YAML by hand rather than importing a parser the image
      # happens to ship. A gate that silently stops running when a base image changes is worse than
      # no gate.
      #
      # The cost is bounded by the segregation gate, which holds the runner's dependency count at
      # one: `cargo build -p xtask --locked` is one step ahead of the gates, and the cache is keyed
      # on `xtask` so the gates below do not pay for the workspace's build.
      - name: Install Rust toolchain (the gate runner)
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target"
          key: xtask
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Build the gate runner once
        run: cargo build -p xtask --locked

      # The lint's `#[cfg(test)]` scope scanner decides which lines are EXEMPT from every
      # choke-point bypass rule, so a scanner that can be lied to reports "no bypass" while the
      # bypass sits in production. Its self-test runs FIRST: never trust the lint's verdict before
      # proving the lint still works. The self-test now plants a violation for EVERY ONE of the
      # gate's owed rows and requires the run to name it, so "the lint still works" is a claim about
      # twenty rules rather than about the five fixtures the shell happened to carry.
      - name: Structure lint self-test
        # THE HANG CEILING IS A CEILING, NOT A BUDGET, AND THIS SELF-TEST IS LEGITIMATELY LONG.
        # `gates::DEFAULT_GATE_CEILING` is 300s, which is the right number for a gate RUN and the
        # wrong one for a self-test that plants its own trees and runs the whole gate over each:
        # 99s measured on a warm laptop, and a cold CI runner is slower. The ceiling is raised
        # for THIS GATE ONLY, so a hang anywhere else still costs five minutes and a red row. The
        # cost itself is measured and ratcheted by that gate's own work-unit budget
        # (`gates::SELFTEST_BUDGETS`), which is the instrument that notices it growing.
        env:
          XTASK_GATE_CEILING_SECS_STRUCTURE_LINT: "900"
        run: cargo xtask gate structure-lint --selftest
      - name: Structure lint
        run: cargo xtask gate structure-lint
      # RELEASE-SCRIPT lint — durable guard against the 1.5.2 gate's 2h31m hang: a backgrounded
      # server (serve_forever) whose stdout was NOT redirected, captured via `$(...)`, held the
      # substitution's pipe open until the job timeout. Self-test runs FIRST (never trust the lint's
      # verdict before proving the scanner still catches the real antipattern), then it scans
      # scripts/release-check*.sh and verifies the 1.5.2 watchdog is intact.
      - name: Release-script lint self-test
        run: scripts/release-script-lint.sh --selftest
      - name: Release-script lint
        run: scripts/release-script-lint.sh
      # RELEASE-ORDER lint: nothing may be tagged until it has been verified from the consumer side,
      # and nothing may be cut from a red commit. Both of those live in the SHAPE of the workflow
      # graph (which job depends on which), which is edited by people in a hurry during an incident
      # and has no other place to be asserted. Self-test runs FIRST, and it earns its place: it
      # caught this lint's own `--draft` rule passing against a release that had had `--draft`
      # deleted, because `--draft=false` elsewhere in the file contained the substring.
      - name: Release-order lint self-test
        run: cargo xtask gate release-order --selftest
      - name: Release-order lint
        run: cargo xtask gate release-order
      # DUPLEX-WS DEFAULT-EDGE gate: `tokio-tungstenite` must not be in the DEFAULT money-path
      # build's dependency closure — the WebSocket edge belongs to `plane-voice` and nowhere else.
      # It was a fully-written, self-testing gate that NOTHING invoked: it lived in `scripts/`,
      # named itself a gate in its own header, passed on every commit, and no workflow, no script
      # and no gate runner ever executed it. A gate nothing runs is not a gate — it is a file that
      # would have caught the regression. Wired here (it is a `cargo tree` read, seconds, no build),
      # self-test first as everywhere else.
      - name: duplex-ws default-edge self-test
        run: cargo xtask gate duplex-ws-default-edge --selftest
      - name: duplex-ws default-edge gate (no WS in the default money-path closure)
        run: cargo xtask gate duplex-ws-default-edge
      # CI-UMBRELLA MEMBERSHIP lint: `ci-umbrella` is the ONE required check, and its `needs:` list
      # is the whole of what "CI is green" means. That list is hand-maintained, and a job added
      # without its `needs:` line is invisible to it: the job goes red and the required check reports
      # GREEN. `deletion-test-matrix` -- an enforcement gate on every pull request -- sat outside
      # `needs` for its whole life, so its red would not have blocked a single merge. This lint makes
      # omission impossible: every job is in `needs` (and in the RESULTS ledger) unless a
      # `# non-gating:` / `# report-only:` line names it WITH a reason. Self-test runs FIRST, and its
      # last case re-plants exactly that historical defect in this very file and requires a red.
      - name: ci-umbrella membership self-test (the historical omission re-planted, proven RED)
        run: cargo xtask gate ci-umbrella --selftest
      - name: ci-umbrella membership (no job is outside the required check by accident)
        run: cargo xtask gate ci-umbrella
      # FEATURE-SET COVERAGE, the same contract one axis over: `ci-umbrella` asserts every JOB is
      # inside the required check, this asserts every non-default CARGO FEATURE is inside a job. A
      # feature nothing builds is not compiled, so it is not type-checked, so it does not have to be
      # valid Rust -- the root duplex-serve leg was default-OFF, named by no job, and broken for DAYS
      # with every run green. Membership is derived from the member manifests and asserted against
      # the `feature-sets` matrix below; a deliberate exclusion is possible only as a written
      # `# feature-covered:` line naming the job that already builds it. Self-test runs FIRST and its
      # first case re-plants exactly that defect -- a crate grows a feature no job names -- and
      # requires a red. `docs/ci/feature-sets.md` is the measurement behind it.
      - name: feature-set coverage self-test (an unbuilt feature re-planted, proven RED)
        run: cargo xtask gate feature-sets --selftest
      - name: feature-set coverage (no non-default feature is outside CI by accident)
        run: cargo xtask gate feature-sets
      # NO-SELF-FILED-ISSUES lint: this repository must not open issues against itself. It used to —
      # verify-deploy.yml filed #51 when a published release was broken — and that was wrong three
      # ways: a robot's issue is indistinguishable from a user's in the queue a human triages, the
      # filing step ended on an `echo` so the run stayed GREEN while the release was broken, and a
      # long-lived mutable issue needed a whole second job to close it again. The replacement is a
      # red check plus a run summary. This lint stops the filing coming back. Self-test runs FIRST,
      # and it includes a comment-only fixture because the workflows now EXPLAIN the ban in prose —
      # a lint its own explanation fails is a lint people learn to skip.
      - name: No-self-filed-issues lint self-test
        run: cargo xtask gate no-self-filed-issues --selftest
      - name: No-self-filed-issues lint
        run: cargo xtask gate no-self-filed-issues
      # AND WATCH IT FAIL. `--prove` fails each job of the release graph in turn and asserts that no
      # name-minting job runs afterwards. It is the executable form of "a failure leaves nothing
      # public", so that property is re-proven on every push rather than argued once in a comment.
      # The proof is now a ROW of the same gate rather than a second invocation: a claim about this
      # graph that lives in its own call site is a claim that can fall out of CI by losing one line.
      # `cargo xtask gate release-order` above emits it, and the owed set refuses a run that does
      # not.
      - name: Release-order proof (a failure leaves nothing public)
        run: cargo xtask gate release-order --format=tsv
      # CHANGELOG lint: the newest entry carries a version AND a date, always. This has shipped
      # wrong more than once and been reported more than once, which is what makes it a gate rather
      # than a reminder. The specific fault was a headless blob at the top of the published page:
      # the site's `## [Unreleased]` strip was terminated by `\Z`, which JavaScript has no anchor
      # for — it matched the literal letter `z` under `/i`, cut the section mid-word, and left the
      # remainder on the page with no heading, so no version and no date. That half is fixed in the
      # site repo; this guards the source shape the site can only render what it is given. Self-test
      # runs FIRST: never trust the lint's verdict before proving the lint still fires.
      - name: Changelog lint self-test (every rule proven RED)
        run: cargo xtask gate changelog --selftest
      - name: Changelog lint
        run: cargo xtask gate changelog
      # WORKSPACE-DEPS lint: one version requirement per external dependency, written once in
      # [workspace.dependencies]. The table makes that POSSIBLE; only this lint makes it TRUE —
      # nothing in Cargo stops a member re-stating a version, and before the table `hex`, `sha2` and
      # `tracing` were each declared two different ways and agreed purely by luck. It sits in the
      # FAST tier deliberately: a manifest can drift on any branch push, and this costs one python
      # process. Self-test runs FIRST and covers dev-dependencies and
      # `[target.'cfg(...)'.dependencies]` explicitly, because a rule enforced only on
      # `[dependencies]` is a rule scoped to where the bug was first seen — and the jemalloc pins,
      # the ones that differ per shipped target, live in a target table.
      - name: Workspace-deps lint self-test
        run: cargo xtask gate workspace-deps --selftest
      - name: Workspace-deps lint
        run: cargo xtask gate workspace-deps
      # THE GATE SET ITSELF, checked against this file. Every step above runs ONE gate; nothing
      # asked whether the set of steps still covers the set of registered gates. That question lives
      # in `full-gate --selftest` — the registry-vs-ci.yml set equality, both directions, plus the
      # written excuse of every gate deliberately not run here, each now checked against the tree
      # rather than taken as prose. It ran in no workflow, no CARGO_LOCAL entry and no test, which
      # means a gate could be deleted from this file with everything green. It reads text and runs
      # nothing, so it costs a second.
      - name: Gate registry vs this workflow
        run: cargo xtask full-gate --selftest
      # THE AUDIT REGISTER. `audit-ledger` judges the instrument that judges everything else — scope
      # coverage, open HIGH/MEDIUM findings, a `fixed` stamped with nobody confirming it, and a
      # record's hash against the commit it claims to have read. Until now its only caller was
      # scripts/verify-1.6.0-done.sh, at release time; per push the register was unguarded and its
      # own excuse entry said so. It reads a JSON file and asks git for hashes, so it costs a second.
      # It needs the HISTORY, which is why this job's checkout is unshallow: a record naming a commit
      # a depth-1 clone cannot resolve is RED, and correctly so — an unresolvable stamp is a stamp
      # nobody can check.
      # THE AUDIT PINS, WHICH NO CHECKOUT CARRIES.
      # `audit-ledger` accepts a record whose `audited_at` commit is reachable from HEAD OR from an
      # audit pin. Pins are written locally under `refs/audit-pins/*` and MIRRORED to
      # `refs/backup/audit-pins/*`, and neither `git clone` nor `actions/checkout` carries anything
      # outside `refs/heads/*` and `refs/tags/*` — `git ls-remote origin 'refs/audit-pins/*'`
      # returns nothing. So on this runner the pin set was EMPTY and the gate degenerated to "an
      # ancestor of HEAD": measured on this base, 13 of the 23 records name a commit that is not an
      # ancestor, and every one would be RED in the blocking step below. `fetch-depth: 0` does not
      # help — that is depth, not namespace. This fetch is what makes the pins exist here at all.
      # `|| true`: a repository with no pins yet is not a broken job, and the gate is what decides
      # whether a missing pin matters.
      - name: Fetch the audit pins (no checkout carries refs/audit-pins/*)
        run: git fetch origin '+refs/backup/audit-pins/*:refs/audit-pins/*' || true
      - name: Audit-ledger self-test (the register's judge cannot be lied to)
        run: cargo xtask gate audit-ledger --selftest
      - name: Audit-ledger gate (BLOCKING — the audit register is sound)
        run: cargo xtask gate audit-ledger
      # QA-GATE DISPATCHER DRIFT. `workflow_run` ALWAYS loads the workflow file from the DEFAULT
      # branch, so the gate that actually fires after a push to `qa` is `main`'s copy, never the
      # promoted commit's. That has already cost a silent green: measured on qa c736177 the
      # auto-fired gate ran ONE job while the segmentation umbrella sat unused, and the run passed
      # having done far less than anyone believed. Gate LOGIC now rides the commit (the dispatcher
      # checks out the triggering SHA and runs scripts/qa-gate-run.sh from there), but everything
      # GitHub reads BEFORE a checkout exists — `on:`, concurrency, permissions, the needs/if graph,
      # the matrix expression — still comes from `main` and cannot.
      #
      # This compares the PARSED structure, not the bytes, so comments drift freely while the run
      # graph may not. That split is what stops the check deadlocking: `main` only moves at a
      # release, so a byte-identical rule would make every prose edit red until the very release it
      # is meant to gate. Self-test first, as everywhere else here.
      - name: qa-gate dispatcher drift self-test
        run: cargo xtask gate qa-gate-dispatch --selftest
      # `fetch-depth: 0` is not set on this job's checkout, so origin/main may be absent; fetch it
      # explicitly rather than letting the lint fail closed for a reason that is not drift.
      - name: Fetch the default branch (the dispatcher that will actually fire)
        run: git fetch --no-tags --depth=1 origin main
      - name: qa-gate dispatcher drift
        run: cargo xtask gate qa-gate-dispatch
      # ARTIFACT CONTRACT wholeness. The contract is data (.github/artifact-contract.json) and the
      # verifier implements it, so the two can drift: a row declared with no implementation is a
      # property everybody believes is checked and nobody checks, and a check outside the contract is
      # invisible to anyone reading it. The guard asserts SET EQUALITY both ways plus a row floor,
      # and this self-test proves that guard still discriminates rather than merely returning the
      # rows unchanged. Its eight cases each construct one malformation and require it be refused.
      - name: Artifact-contract wholeness self-test
        run: python3 scripts/verify-artifact.py --selftest
      # RELEASE-CHECK VERDICT ACCOUNTING. release-check.sh used to end with an unconditional
      # "RELEASE GATE PASSED" banner even when phases had not run at all, so a green gate did not
      # prove those phases executed. This selftest proves the two are now distinguishable: a
      # coverage gap changes the banner, names the phase, and is fatal under --require-siblings,
      # while a by-design segment skip stays a clean pass. Offline, no gate run, seconds.
      - name: Release-check verdict self-test
        run: scripts/release-check.sh --selftest
      # RESPONSE-HEADER lint: every busbar-INJECTED response header
      # (`Server-Timing: busbar;dur=`, `x-busbar-route-policy`/`-target`) must be emitted from its ONE
      # sanctioned, config-gated site — never a hand-rolled second emission that bypasses the
      # `advanced.response_headers` opt-in. Self-test runs FIRST (never trust the lint's verdict before
      # proving the scanner still catches a real bypass), then it scans crates/busbar-core/src.
      - name: Response-header lint self-test
        run: cargo xtask gate response-header --selftest
      - name: Response-header lint
        run: cargo xtask gate response-header
      # TRACING-SEAM lint: every `#[tracing::instrument]` must carry an explicit
      # `level =` so a hot-path span can never again silently default to INFO (always-on). Self-test
      # runs FIRST (never trust the lint's verdict before proving the scanner still catches a real
      # bypass), then it scans crates/**/*.rs.
      - name: Tracing lint self-test
        run: cargo xtask gate tracing --selftest
      - name: Tracing lint
        run: cargo xtask gate tracing
      # SETTINGS-LEAK lint: an admin-facing projection may serve an opaque `settings:` bag's KEY
      # NAMES (`settings_keys` / `service::redact_settings_bags`) but NEVER its values — that bag is
      # where an operator's credentials legitimately live and the reads are READ-ONLY scope. Added
      # after the SAME defect was found in FOUR independent projections (see the script header).
      # Self-test runs FIRST (never trust the lint's verdict before proving the scanner still catches
      # a real leak), then it scans crates/busbar-core/src/admin.
      - name: Settings-leak lint self-test
        run: cargo xtask gate settings-leak --selftest
      - name: Settings-leak lint
        run: cargo xtask gate settings-leak
      # BLOCKING-FFI lint (1.5.3): a synchronous call into a dlopened PLUGIN (`transport_call`, and
      # the `dlopen` + constructor before it) must never run inline in an `async fn` — one such call
      # parks a Tokio worker for the plugin's full network timeout, and N concurrent callers stop the
      # runtime polling anything, `/healthz` included. Added after the SAME defect was found in five
      # independent places, the last of them on the ANONYMOUSLY-reachable `/auth/token` (see the
      # script header). Self-test runs FIRST (never trust the lint's verdict before proving the
      # scanner still catches a real inline call), then it scans crates/busbar-core/src.
      - name: Blocking-FFI lint self-test
        run: cargo xtask gate blocking-ffi --selftest
      - name: Blocking-FFI lint
        run: cargo xtask gate blocking-ffi
      # THE FOUR GATES BELOW EACH SHIPPED WITH A --selftest AND A --check AND WERE INVOKED BY
      # NOTHING: no workflow step, no qa/segments.toml row, and so nothing cargo xtask full-gate could
      # discover. A gate nobody runs measures nothing — it is a script with the SHAPE of a gate, which
      # is worse than no gate at all, because its existence reads as coverage. All four are GREEN on
      # this tree today, which is exactly why they are being wired now rather than after a regression
      # makes one of them red. Each runs its --selftest FIRST, the discipline every lint above uses.
      #
      # KERNEL TOKEN-WIRE PURITY: the kernel never re-derives a usage token class from a raw provider
      # wire field; it reads the plane-normalized locator. The whole point of the plane extraction is
      # that a provider's wire vocabulary stops short of the kernel, and this is the only thing that
      # checks it.
      - name: Kernel token-wire purity self-test (the scanner cannot be lied to)
        run: cargo xtask gate kernel-token-wire-purity --selftest
      - name: Kernel token-wire purity (BLOCKING — no raw provider wire token field reaches the kernel)
        run: cargo xtask gate kernel-token-wire-purity
      # NO-DEFERRAL: every reachable unimplemented!()/todo!() (Class A) and every self-declared debt
      # label (Class B) in shipped source must be a floor-checked entry in the committed
      # scripts/no-deferral.waivers allowlist. verify-1.6.0-done.sh runs the stricter
      # no-deferral-strict-done twin as part of the DONE claim; that is a release-time question. THIS
      # is the per-push posture
      # that stops a NEW unwaived deferral landing in the first place, and it was the half nothing ran.
      - name: No-deferral self-test (the deferral scanner cannot be lied to)
        run: cargo xtask gate no-deferral --selftest
      - name: No-deferral gate (BLOCKING — every deferral marker is a floor-checked waiver)
        run: cargo xtask gate no-deferral
      # INVENTORY-REF LINT: the companion to the design-bindings job below. design-bindings proves
      # every Appendix B binding's CHECKS still exist; this proves every binding's INVENTORY citation
      # still resolves to a docs/design inventory file that exists, so a renamed or deleted inventory
      # cannot leave a binding pointing at nothing while still reading as mapped.
      - name: Inventory-ref lint self-test
        run: cargo xtask gate inventory-ref --selftest
      - name: Inventory-ref lint (BLOCKING — every binding's inventory column resolves)
        run: cargo xtask gate inventory-ref
      # CHANGELOG REGISTER: the second half of the shadow-oracle register's money rule. diff-cells.py
      # refuses at LOAD time to let an `improvement` entry forgive a status or a billing figure — only
      # a `kind: breaking` entry carrying a changelog line may. This proves that changelog line is not
      # a string nobody ever read: it must appear VERBATIM in CHANGELOG.md. Without it an accepted
      # breaking difference could cite a line that was reworded, or never written at all.
      - name: Changelog register self-test
        run: cargo xtask gate changelog-register --selftest
      - name: Changelog register (BLOCKING — every accepted `breaking` names a real CHANGELOG line)
        run: cargo xtask gate changelog-register
      # THE REGISTRY GATE (plugins.yaml is the single source of truth for first-party plugins):
      # red when a registered plugin lacks coverage anywhere — no qa-gate checkout, no
      # release-check phase, no published release (or a phantom release with zero assets) — or
      # when a plugin-shaped org repo exists unregistered. Found necessary during the 1.5.0 ship:
      # the plugin list was duplicated across 5+ places and the "full plugin gate" silently ran
      # 6 of 8. Adding a plugin = one plugins.yaml entry; this gate stays red until every
      # consumer actually covers it.
      - name: Plugin registry gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/plugin-registry-check.sh
      # QA-GATE SEGMENTATION self-test. qa/segments.toml is the umbrella's single
      # source of truth (registry-driven fan-out, mirroring plugins.yaml). This self-test proves the
      # manifest's SHAPE before any segment is trusted to run: it lists both active and reserved
      # entries, the preserved core-data-plane/plugins coverage is present (union ⊇ today's gate),
      # every reserved slot is defined-but-inert (PASS/SKIP), and every segment names a run command.
      # Same "prove the gate before you trust its verdict" discipline as the lints above.
      - name: qa-gate segmentation self-test
        run: scripts/qa-segments.sh --selftest
      # NEUTRAL-PURITY lint — the enforcement gate for the plane ABI. The plane ABI is the ONE
      # surface between core and a plane; every side channel (a `#[path=…/busbar-<plane>/…]` witness
      # include, a `busbar_{llm,mcp,a2a}::` symbol, a concrete plane key/dialect/record-type in a
      # neutral crate, or a plane crate reaching BACK into busbar_core:: implementation) is what let
      # the boundary drift when nothing watched it. Self-test runs FIRST (never trust the scanner's
      # verdict before it re-proves it flags the four planted side channels and passes the allow-listed
      # / comment / test fixtures). Then the tree is scanned in `--check` (BLOCKING) mode: the extraction
      # is COMPLETE (the baseline drained from ~1236 to 0), the `plane-purity` qa segment is now ARMED
      # (reserved→active), so this step fails RED on ANY side channel — the boundary can never drift
      # unwatched again. The deletion test then proves the strong form: each plane crate is physically
      # removable (`git rm -r`) with the neutral crates + bin still compiling — no neutral→plane edge.
      - name: Plane-purity lint self-test (the side-channel scanner cannot be lied to)
        run: cargo xtask gate plane-purity --selftest
      - name: Plane-purity gate (BLOCKING — no side channel in the neutral crates)
        run: cargo xtask gate plane-purity
      # VOICE-TRANSPORT/MEDIA neutrality — the FORWARD-edge companion to plane-purity. plane-purity bans
      # the plane KEYS + LLM dialects; this bans the Plane-4 (busbar-voice) TRANSPORT/MEDIA nouns
      # (rtc/sdp/webrtc/twilio/dtmf/rtp/sideband/realtime/audio/mulaw/g711/barge) that plane-purity does
      # NOT name, so core can never learn a protocol's transport words. Self-test first (it plants a
      # SdpOffer/webrtc hit and proves the scanner RED-flags it and passes a clean/comment/test tree),
      # then the tree is scanned in --check (BLOCKING): the neutral crates carry ZERO transport nouns
      # today and any regression that introduces one fails it RED.
      - name: Plane transport-neutrality self-test (the transport/media scanner cannot be lied to)
        run: cargo xtask gate plane-transport-neutrality --selftest
      - name: Plane transport-neutrality gate (BLOCKING — no voice-transport noun in the neutral crates)
        run: cargo xtask gate plane-transport-neutrality
      # PLANE-ABI NEUTRALITY witness — the plane ABI's capability surface was DERIVED from a primitive
      # taxonomy, not ENUMERATED from one protocol. This greps the busbar-plugin HOT lane for the banned
      # protocol/role nouns and asserts ZERO (with a ban-list self-check of its own). It PASSES today;
      # wired here as a BLOCKING gate so "derived, not enumerated" stays a machine fact, not a claim.
      # Its self-test runs FIRST, like every sibling here. It was the one gate in this job without
      # that step, and it is the gate whose ban list is checked against a DOCUMENT — the arm most
      # worth proving before its verdict is trusted, because a mandate that silently stopped being
      # read would leave the witness checking its own answer.
      - name: Plane-ABI neutrality self-test (the ban list is checked against the design, not itself)
        run: cargo xtask gate plane-abi-neutrality --selftest
      - name: Plane-ABI neutrality witness (BLOCKING — no protocol/role noun in the plane ABI hot lane)
        run: cargo xtask gate plane-abi-neutrality
      # KIND-ISOLATION gate: busbar is core + plugins, and the ~10 plugin kinds can never
      # cross-contaminate (owner ruling, 2026-09-07). A proposal to create `busbar-transport-a2a`
      # was ruled catastrophic — it fuses a KIND with another kind's INSTANCE and merges back what
      # the plane/transport split is tearing apart. This is the ruling as a machine fact, in four
      # rows: the crate NAME (`busbar-transport-a2a`, `busbar-plane-http`, `busbar-unit-mcp`,
      # `busbar-plane-transport` are all refused), the kind-to-kind DEPENDENCY graph (a ratchet over
      # the measured edge classes, so a new one is refused and a dead allowance has to be struck),
      # the source VOCABULARY (a transport never says `a2a`, a plane never says `axum`), and the
      # kind REGISTRY (a crate of no kind is refused with the owner's own instruction: make a new
      # plugin kind, do not fuse two) — and the MATRIX: for every kind and every crate, how many
      # times that crate names that kind's vocabulary, whole text, comments and tests and Cargo
      # features and filenames and the COMPOSITION ROOT included, against per-cell ceilings in
      # `qa/kind-isolation.toml` that are exact in both directions. That row exists because the
      # others measured the wires and never the place the wires are joined, and
      # `crates/busbar/src/root/**` hand-wires one file per plane in plain sight.
      # Self-test runs FIRST — every one of the rows is planted
      # and proven RED before the verdict is trusted, including the `busbar-transport-a2a` the
      # owner refused. The SHIP-criterion twin (`kind-isolation-ship`, one surface and one shared
      # conformance battery per kind) is red on HEAD by design and runs at release time.
      - name: Kind-isolation self-test (the refused busbar-transport-a2a, planted and proven RED)
        # THE HANG CEILING IS A CEILING, NOT A BUDGET, AND THIS SELF-TEST IS LEGITIMATELY LONG.
        # `gates::DEFAULT_GATE_CEILING` is 300s, which is the right number for a gate RUN and the
        # wrong one for a self-test that plants fifty-eight trees and runs the whole gate over each:
        # 273s measured on a warm laptop, and a cold CI runner is slower. The ceiling is raised
        # for THIS GATE ONLY, so a hang anywhere else still costs five minutes and a red row. The
        # cost itself is measured and ratcheted by that gate's own work-unit budget
        # (`gates::SELFTEST_BUDGETS`), which is the instrument that notices it growing.
        env:
          XTASK_GATE_CEILING_SECS_KIND_ISOLATION: "1800"
        run: cargo xtask gate kind-isolation --selftest
      - name: Kind-isolation gate (BLOCKING — no name, edge, word or root wiring fuses two kinds)
        run: cargo xtask gate kind-isolation
      - name: Plane deletion test (each plane crate is strong-form removable)
        run: scripts/plane-delete-test.sh --all

  check:
    name: fmt · clippy · build · test
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # A hung test burns the runner's 6-HOUR default in silence without this: one never-finishing
    # test leaves the job printing nothing until someone notices and cancels by hand. A green run
    # takes ~13 minutes warm, ~40 cold; 75 bounds the damage while leaving cold-cache headroom.
    # The per-test-binary watchdog on the Test step below is the layer that NAMES the hang — this
    # ceiling is only the backstop for everything else.
    timeout-minutes: 75
    # Live-DB service containers for the store-postgres / store-valkey roundtrip tests. Without these
    # the roundtrip tests skip (their URLs are unset) and the two 1.5.0 store backends ship with ZERO
    # CI coverage of the delete_key cascade + credential cleanup. The tests read BUSBAR_TEST_POSTGRES_URL
    # / VALKEY_URL (set on the Test step below) and, because `CI` is set in Actions, HARD-FAIL rather
    # than silently skip if a service is misconfigured - so this coverage cannot vanish unnoticed.
    services:
      # PINNED BY DIGEST for the same reason as release.yml's gate: `postgres:16` and
      # `valkey/valkey:8` are moving tags, and these containers are load-bearing (without them the
      # store roundtrip tests hard-fail rather than skip). What they resolve to must be a fact about
      # the commit, not about the day. Re-pin with `docker buildx imagetools inspect <tag>`; the
      # monthly-refresh PR is the natural place.
      #
      # NO `credentials:` HERE, DELIBERATELY, AND IT LEAVES HALF THE HOLE OPEN. Authenticating would
      # raise Docker Hub's anonymous per-IP rate limit, which is the half a digest pin cannot fix --
      # but this workflow runs on `pull_request`, where secrets are withheld from fork runs, so an
      # unconditional `credentials:` block would hand every fork PR empty credentials. release.yml's
      # gate (push to main only) IS authenticated. Closing this half properly means either
      # restricting the credentials to non-fork events, which GitHub does not allow on a service
      # container, or mirroring both images into GHCR and pulling from there. Written down rather
      # than quietly left, because `branch-green` requires this workflow green: a throttled pull
      # here stops a release.
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: busbar
          POSTGRES_PASSWORD: busbar
          POSTGRES_DB: busbar_test
        # Wait until the DB accepts connections before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U busbar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # NOTE: there used to be a `vault:` service here for busbar-secret-vault /
      # busbar-secret-vault-plugin's live-Vault tests. That coverage moved with the crates to
      # GetBusbar/hashicorp-vault (its own ci.yml boots the same real hashicorp/vault dev-mode
      # container) — see docs/plugins.md and scripts/release-check.sh's Vault phase for how the
      # monorepo now gates on that repo's own test suite via a sibling checkout instead.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # SERVICE CONTAINERS ARE ADDRESSED BY CONTAINER IP, NOT localhost. On a GitHub-hosted runner
      # a job owned the whole machine, so `ports: - 5432:5432` and `localhost:5432` were the same
      # fact. On busbar-xl FOUR agents share a box and the host's 5432 is one resource: the second
      # job to publish it dies in `Initialize containers` with "port is already allocated", before a
      # line of the job has run. So nothing is published; the services keep the per-job
      # `github_network_*` bridge the runner already builds for them, and this step reads each
      # container's address off it. Two jobs, two networks, two addresses, nothing to collide on.
      - name: Service endpoints (container IP, not a published host port)
        run: ./scripts/ci-service-endpoints.sh postgres=${{ job.services.postgres.id }} valkey=${{ job.services.valkey.id }}
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked --verbose

      - name: Test
        # Point the store-postgres / store-valkey roundtrip tests at the service containers above so
        # they RUN (not skip) in CI. The services publish on localhost via the mapped ports.
        env:
          # Same two-number floor as the windows job. This is the PRIMARY unix suite; with the
          # service containers wired it runs a SUPERSET of the windows workspace (it adds the
          # cfg(unix) tests and the postgres/valkey roundtrip tests windows can't run). MIN carries
          # slack; EXPECTED warns.
          #
          # The A2A/MCP/LLM plane crates are honest test targets, and `cargo test --workspace`
          # activates their `test-support` suites through feature unification, so one workspace run
          # collects the full superset — excluding the two plane crates drops ~1123 tests, matching
          # their test-support counts, which confirms those suites do run here. EXPECTED is the count
          # that run produces on the linux runner (5723 at the last measured commit); MIN carries slack
          # below it. RAISE both as the suite grows; lower only when a diff explains the drop.
          UNIX_MIN_TESTS: "5650"
          UNIX_EXPECTED_TESTS: "5723"
          # THE PER-TEST-BINARY HANG CEILING for the watchdog below. This is a HANG guard (a hung
          # test runs unbounded), NOT a per-test timeout knob to tune a flake away with — when it
          # fires, the step fails and names the tests that never finished.
          #
          # Sizing reality: the `busbar_core` lib-test binary is a MONOLITH that runs the whole
          # workspace's dual-compiled dialect suites (field-coverage carry, input-hardening,
          # adversarial, fidelity goldens) as ONE process — ~3900 tests aggregating to ~330s on this
          # runner (it was already 295s before the 1.6.0 field-coverage + hardening work, i.e. at the
          # old 300s edge). So this ceiling gates AGGREGATE binary lifetime, not a single slow test;
          # 600s keeps a genuine hang (unbounded) caught within ~10 min while giving the legitimately
          # grown suite real headroom. If it fires with named finished counts near the total, the
          # binary grew — raise deliberately (as here) or split it; do not treat a full-but-slow run
          # as a hang.
          WATCHDOG_TEST_TIMEOUT_SECS: "600"
        run: |
          set -uo pipefail
          # THE HANG WATCHDOG. A test that never finishes used to leave this job SILENT until the
          # runner's 6-hour ceiling or a manual cancel: one hung test, 576/577 complete, process
          # alive but idle, and the log's only clue was libtest's own over-60-seconds warning
          # scrolling past 50 minutes earlier. cargo now runs in the background writing the same
          # log `tee` used to write (rc discipline unchanged: the exit code is cargo's own, taken
          # from `wait`, never laundered; a `tail --pid` keeps the live stream). A sideband loop
          # watches for any TEST BINARY alive past WATCHDOG_TEST_TIMEOUT_SECS, and on breach it
          # captures a gdb all-thread backtrace of the still-live stuck process, NAMES the tests
          # that started-or-queued and never finished (the binary's --list minus the log's
          # completed lines), and fails the step — a red with a name and a stack instead of an
          # hours-long silence. A clean run pays one `ps` scan per 15s and never installs gdb;
          # the totals accounting below is unchanged.
          cargo test --workspace --locked --verbose > "$RUNNER_TEMP/unix-test.log" 2>&1 &
          cargo_pid=$!
          tail --pid="$cargo_pid" -n +1 -F "$RUNNER_TEMP/unix-test.log" &
          tail_pid=$!
          watchdog_fired=0
          while kill -0 "$cargo_pid" 2>/dev/null; do
            sleep 15
            # argv[0]-anchored so a long rustc/cc invocation (whose ARGUMENTS also name
            # target/debug/deps) can never be mistaken for a stuck test binary. No awk `exit`:
            # an early exit SIGPIPEs `ps` and, under pipefail, fails the substitution.
            stuck=$(ps -eo pid,etimes,args | awk -v lim="$WATCHDOG_TEST_TIMEOUT_SECS" \
              '$2 > lim && $3 ~ /target\/debug\/deps\// && !found {print $1; found=1}' || true)
            [ -z "${stuck:-}" ] && continue
            bin=$(readlink -f "/proc/$stuck/exe" 2>/dev/null || true)
            echo "::error::test watchdog: ${bin:-pid $stuck} still running after ${WATCHDOG_TEST_TIMEOUT_SECS}s — capturing state, then failing"
            # gdb is installed lazily, ONLY on the hang path — a clean run never pays for it.
            sudo apt-get install -y -qq gdb >/dev/null 2>&1 || true
            sudo gdb -p "$stuck" -batch -ex 'set pagination off' -ex 'thread apply all bt' || true
            if [ -n "${bin:-}" ] && [ -x "$bin" ]; then
              "$bin" --list 2>/dev/null | sed -n 's/: test$//p' | sort > /tmp/wd-collected.txt || true
              grep -oE '^test [A-Za-z0-9_:]+ \.\.\. (ok|FAILED|ignored)' "$RUNNER_TEMP/unix-test.log" \
                | awk '{print $2}' | sort -u > /tmp/wd-completed.txt || true
              echo "::error::tests in this binary that started (or were queued) and never finished:"
              comm -23 /tmp/wd-collected.txt /tmp/wd-completed.txt | sed 's/^/::error::    /' || true
            fi
            kill -9 "$stuck" 2>/dev/null || true
            watchdog_fired=1
            break
          done
          rc=0; wait "$cargo_pid" || rc=$?
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          if [ "$watchdog_fired" -ne 0 ]; then
            echo "::error::the test run was ended by the hang watchdog — see the named tests and the backtrace above."
            exit 90
          fi

          # SUM across every test binary — `test result: ok. N passed` prints once per binary, so a
          # single-line grep would floor one binary and miss a whole suite (a cfg gate, a dropped
          # target) compiling to nothing while still printing `ok` and exiting 0.
          total=$(grep -oE 'test result: (ok|FAILED)\. [0-9]+ passed' "$RUNNER_TEMP/unix-test.log" \
                  | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' \
                  | awk '{s+=$1} END {print s+0}')
          echo "unix: ${total} tests passed across the workspace (floor: ${UNIX_MIN_TESTS}, expected: ${UNIX_EXPECTED_TESTS})"

          if [ "$rc" -ne 0 ]; then
            echo "::error::cargo test --workspace FAILED on unix (exit ${rc})."
            exit "$rc"
          fi
          if [ "$total" -lt "$UNIX_EXPECTED_TESTS" ]; then
            echo "::warning::unix ran ${total} tests, ${UNIX_EXPECTED_TESTS} were expected."
            echo "::warning::If tests were legitimately removed or merged, LOWER UNIX_EXPECTED_TESTS in this job."
            echo "::warning::If not, something stopped being collected — a cfg gate, a renamed harness, a dropped target."
          elif [ "$total" -gt "$UNIX_EXPECTED_TESTS" ]; then
            echo "::notice::unix ran ${total} tests, above the recorded ${UNIX_EXPECTED_TESTS}. Raise UNIX_EXPECTED_TESTS."
          fi
          if [ "$total" -lt "$UNIX_MIN_TESTS" ]; then
            echo "::error::the unix test suite ran ${total} tests, below its floor of ${UNIX_MIN_TESTS}."
            echo "::error::A workspace whose suites compiled to nothing still prints 'test result: ok' and exits 0."
            echo "::error::This is NOT a pass. Either a suite stopped being built/collected, or a cfg gate erased one."
            echo "::error::If the drop is intended, LOWER the UNIX_MIN_TESTS floor in this job deliberately."
            exit 1
          fi

      # THE VOICE RUNTIME SUITE — the 4th plane's live duplex/session tests
      # (crates/busbar-voice/src/runtime/tests.rs + crates/busbar-voice-codec/src/topology/tests/)
      # live under `#[cfg(feature = "runtime")]`, which is OFF by default. The workspace `cargo test`
      # above runs with default features, so those tests NEVER execute there, and the
      # voice-conformance workflow only `cargo build`s the conform bin — nothing ran the tests until
      # this step. Voice is dev-only until DoD, so this is a plain `--features runtime` run: no
      # service containers, just the previously-dark plane suites made to actually run and go green.
      # `busbar-voice-codec` is a SEPARATE crate from `busbar-voice` (the codec/topology split moved
      # the Twilio Media Streams grammar and its tests out from under `busbar-voice`'s own tree), so
      # it is named here too — a step that only ever named `busbar-voice` would go on passing green
      # while a whole suite sat uncollected behind a feature gate nothing runs. The floor below is
      # this step's own version of the workspace job's collected-test-count guard above: a suite that
      # stops being built/collected still prints `test result: ok` and exits 0, so the count is what
      # actually proves the suite ran rather than compiled to nothing.
      - name: Voice runtime tests (the `runtime`-gated plane suites `cargo test --workspace` never runs)
        env:
          VOICE_MIN_TESTS: "100"
        # `set -uo pipefail` + PIPESTATUS[0], matching the workspace / no-default-features / windows
        # steps. Without it `cargo … | tee` reports TEE's exit status, which is 0 whether cargo
        # passed or failed, and the only surviving check was a count of PASSING tests — a run with
        # 150 passes and 3 failures cleared the floor and the step went green. The failure count is
        # now asserted at zero explicitly rather than inferred from an exit code that had been
        # laundered through a pipe.
        run: |
          set -uo pipefail
          cargo test -p busbar-voice --features runtime,test-support \
                     -p busbar-voice-codec --features runtime \
                     --locked --verbose 2>&1 | tee "$RUNNER_TEMP/voice-test.log"
          rc=${PIPESTATUS[0]}
          total=$(grep -oE 'test result: (ok|FAILED)\. [0-9]+ passed' "$RUNNER_TEMP/voice-test.log" \
                  | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' \
                  | awk '{s+=$1} END {print s+0}')
          failed=$(grep -oE 'test result: (ok|FAILED)\. [0-9]+ passed; [0-9]+ failed' "$RUNNER_TEMP/voice-test.log" \
                  | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' \
                  | awk '{s+=$1} END {print s+0}')
          echo "voice runtime: ${total} tests passed, ${failed} failed (floor: ${VOICE_MIN_TESTS})"
          if [ "$rc" -ne 0 ] || [ "$failed" -ne 0 ]; then
            echo "::error::the voice runtime suite FAILED (cargo exit ${rc}, ${failed} failing test(s))."
            exit "$((rc == 0 ? 1 : rc))"
          fi
          if [ "$total" -lt "$VOICE_MIN_TESTS" ]; then
            echo "::error::the voice runtime suite ran ${total} tests, below its floor of ${VOICE_MIN_TESTS}."
            echo "::error::A crate split (like codec/topology moving out of busbar-voice) can strand a"
            echo "::error::suite behind a feature gate no workflow step names — this floor exists to catch that."
            exit 1
          fi

      # `busbar-timing`'s real implementation lives entirely behind its `timing` feature, which is
      # OFF by default and therefore OFF under `cargo test --workspace`. So the only suite that
      # exercises the registry, the thread accounting and the runtime gate was never compiled by any
      # step in this workflow: the default build collects only the zero-cost-when-off proof, prints
      # `test result: ok`, and says nothing about the code that actually runs when an operator turns
      # timing on. The floor is the same guard the voice step uses, for the same reason — a suite
      # that stops being collected still exits 0.
      - name: Timing implementation tests (the `timing`-gated suite `cargo test --workspace` never runs)
        env:
          TIMING_MIN_TESTS: "5"
        # Same pipefail + explicit `0 failed` discipline as the voice step above, for the same
        # reason: a `| tee` without it hands the step tee's exit status, and a passing-test count
        # alone cannot tell a clean run from a run that also had failures.
        run: |
          set -uo pipefail
          cargo test -p busbar-timing --features timing \
                     --locked --verbose 2>&1 | tee "$RUNNER_TEMP/timing-test.log"
          rc=${PIPESTATUS[0]}
          total=$(grep -oE 'test result: (ok|FAILED)\. [0-9]+ passed' "$RUNNER_TEMP/timing-test.log" \
                  | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' \
                  | awk '{s+=$1} END {print s+0}')
          failed=$(grep -oE 'test result: (ok|FAILED)\. [0-9]+ passed; [0-9]+ failed' "$RUNNER_TEMP/timing-test.log" \
                  | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' \
                  | awk '{s+=$1} END {print s+0}')
          echo "timing implementation: ${total} tests passed, ${failed} failed (floor: ${TIMING_MIN_TESTS})"
          if [ "$rc" -ne 0 ] || [ "$failed" -ne 0 ]; then
            echo "::error::the timing implementation suite FAILED (cargo exit ${rc}, ${failed} failing test(s))."
            exit "$((rc == 0 ? 1 : rc))"
          fi
          if [ "$total" -lt "$TIMING_MIN_TESTS" ]; then
            echo "::error::the timing implementation suite ran ${total} tests, below its floor of ${TIMING_MIN_TESTS}."
            exit 1
          fi

      # THE LLM PLANE'S TELLER-STEP SUITE — the whole of `crates/busbar-llm/src/unit/` sits behind
      # `#![cfg(feature = "teller-waist")]`, a flag no other step in this workflow turns on. So the
      # workspace `cargo test` above compiles that directory to nothing and reports a green over a
      # suite it never built: the step files, the walk carry and the flip's own rehearsal were all
      # dark. This step is the one place the flag is up. It is exactly the voice step's situation one
      # plane over, and it gets the same collected-count floor for the same reason — a suite that
      # stops being collected still prints `test result: ok` and exits 0, so the count is what proves
      # it ran rather than compiled away.
      - name: LLM teller-step tests (the `teller-waist`-gated step suite `cargo test --workspace` never runs)
        env:
          LLM_UNIT_MIN_TESTS: "70"
        # Same pipefail + explicit `0 failed` discipline as the voice and timing steps above. This
        # one is the most exposed of the three: it is a FILTERED run (`--lib unit::`), so its only
        # other signal is a count, and without pipefail a filtered run with failures in it looked
        # exactly like a clean one.
        run: |
          set -uo pipefail
          cargo test -p busbar-llm --features teller-waist --locked --lib unit:: 2>&1 | tee "$RUNNER_TEMP/llm-unit-test.log"
          rc=${PIPESTATUS[0]}
          total=$(grep -oE 'test result: (ok|FAILED)\. [0-9]+ passed' "$RUNNER_TEMP/llm-unit-test.log" \
                  | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' \
                  | awk '{s+=$1} END {print s+0}')
          failed=$(grep -oE 'test result: (ok|FAILED)\. [0-9]+ passed; [0-9]+ failed' "$RUNNER_TEMP/llm-unit-test.log" \
                  | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' \
                  | awk '{s+=$1} END {print s+0}')
          echo "llm teller steps: ${total} tests passed, ${failed} failed (floor: ${LLM_UNIT_MIN_TESTS})"
          if [ "$rc" -ne 0 ] || [ "$failed" -ne 0 ]; then
            echo "::error::the llm teller-step suite FAILED (cargo exit ${rc}, ${failed} failing test(s))."
            exit "$((rc == 0 ? 1 : rc))"
          fi
          if [ "$total" -lt "$LLM_UNIT_MIN_TESTS" ]; then
            echo "::error::the llm teller-step suite ran ${total} tests, below its floor of ${LLM_UNIT_MIN_TESTS}."
            echo "::error::A directory-wide cfg gate can erase a whole suite without erasing its green."
            exit 1
          fi

      # A test that writes into the repo is a test that can leak. The docs example harness once
      # wrote its patched config and its secret stand-in next to the SHIPPED file it was validating,
      # which put four generated artifacts in the working tree, two of them carrying the absolute
      # home-directory path of the machine that ran them. They were committed, and only the
      # public-hygiene gate downstream noticed. This makes the suite itself prove it wrote nothing:
      # scratch belongs in a temp dir, always.
      - name: Test suite left the working tree clean (no test writes into the repo)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The test suite modified the working tree. Tests must write scratch to a temp dir."
            echo "Offending paths:"
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "working tree clean after the full test suite"

  # OpenAPI schema gate (CI-ONLY `openapi-schema` feature). `openapi_doc()` derives typed response
  # schemas via schemars — a dependency deliberately kept OUT of the shipped binary (the `check` job
  # above builds/tests WITHOUT the feature, proving that). This job compiles the feature, lints it,
  # and runs the openapi tests: the DRIFT GUARD (`openapi_json_matches_committed_file`) fails the PR
  # if the committed `openapi.json` — the file the runtime serves via `include_str!` — no longer
  # matches what the code generates, and the COVERAGE LOCK proves every operation has a typed body.
  # Regenerate a stale file with:
  #   UPDATE_OPENAPI=1 cargo test -p busbar -p busbar-core --features openapi-schema openapi_json_matches_committed_file
  openapi-schema:
    name: openapi-schema clippy · drift · coverage
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 3.9 min
    # over the last 14 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 10
    # FULL TIER ONLY. Skipped on pushes to non-promotion branches; runs on every pull
    # request, on dev/qa/main, and on workflow_dispatch. See the tier note at the top.
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Clippy (--features openapi-schema)
        run: cargo clippy -p busbar -p busbar-core --all-targets --features openapi-schema --locked -- -D warnings
      - name: OpenAPI tests (drift guard + coverage lock)
        run: |
          set -euo pipefail
          # FLOOR ON THE MATCH COUNT. `openapi` is a SUBSTRING filter; a filter that matches nothing
          # prints "running 0 tests / test result: ok" and EXITS 0. The floor is not 1 — this step
          # claims to run the drift guard AND the coverage lock AND their neighbours, so a filter
          # that quietly collapsed to a single surviving test would still be a coverage hole.
          out="$(cargo test -p busbar -p busbar-core --features openapi-schema --locked openapi -- --nocapture 2>&1 | tee /dev/stderr)"
          n="$(echo "$out" | sed -nE 's/^test result: ok\. ([0-9]+) passed.*/\1/p' | awk '{s+=$1} END{print s+0}')"
          if [ "$n" -lt 8 ]; then
            echo "::error::the OpenAPI suite ran only ${n} tests, expected >= 8."
            echo "::error::A zero/low-match 'cargo test' exits 0 — this is NOT a pass. Fix the filter"
            echo "::error::(or lower this floor deliberately, in the same commit that removes tests)."
            exit 1
          fi
          echo "OpenAPI suite: ${n} tests ran (floor 8)"

  # CONFIG-STABILITY gate. 1.5.3 is the LAST config-breaking release; after
  # it the config grammar is FROZEN and every future feature may add only NEW OPTIONAL keys/sections/
  # enum-variants. This job ENFORCES that per-PR, exactly like the openapi drift guard above but with
  # the mechanic that guard lacks: an ADDITIVE-ONLY classifier. The self-test runs FIRST (never trust
  # the gate's verdict before proving its RED/GREEN discipline still holds — like every sibling lint),
  # then the gate: (1) DRIFT — the committed config-schema.snapshot.json must byte-match a fresh render
  # of the config surface (a config-type change that forgot to regen fails loud with UPDATE_CONFIG_SCHEMA=1);
  # (2) ADDITIVE-ONLY — the committed baseline (read from a git ref, NEVER the working tree, so a
  # snapshot refresh cannot launder a break) vs the fresh render, classified: new optional field / new
  # section / enum-append = OK; field removed/retyped, newly-required, enum-drop = FAIL naming the field.
  # Every config busbar ever SHIPPED must still migrate to the current shape. The corpus is the real
  # `config.yaml` (and companion `providers.yaml`) from every non-rc tag, so this asks the only
  # question that matters to an operator upgrading: does the migrator still work for the version I
  # am actually on? Motivated by the terraform provider, where a config shape aged out, broke
  # that consumer, and nothing noticed until a daily poll went red.
  #
  # Needs full history: the corpus is checked in, but `refresh.sh` reads tags, and a shallow clone
  # would make a regenerated corpus silently smaller rather than failing loudly.
  migration-corpus:
    name: migration corpus (every shipped config still migrates)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 2.7 min
    # over the last 14 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 10
    # FULL TIER ONLY. Skipped on pushes to non-promotion branches; runs on every pull
    # request, on dev/qa/main, and on workflow_dispatch. See the tier note at the top.
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Corpus is present and covers the tags
        run: |
          set -euo pipefail
          n=$(find tests/migration-corpus/from-tags -name '*.yaml' | wc -l)
          tags=$(git tag | grep -vcE 'rc' || true)
          echo "corpus: $n config(s) across $tags non-rc tag(s)"
          # A corpus that silently shrank is the failure mode this whole job exists to prevent, so
          # an empty or truncated one fails HERE with a clear message rather than passing a test
          # that iterated over nothing.
          if [ "$n" -lt 20 ]; then
            echo "::error::migration corpus has only $n config(s); regenerate with tests/migration-corpus/refresh.sh"
            exit 1
          fi
      - name: Every shipped config migrates to a valid current config
        run: cargo test -p busbar --test migration_corpus --locked -- --nocapture

  config-stability:
    name: config-stability gate (frozen grammar · additive-only)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 1.0 min
    # over the last 19 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Need history so the additive check can diff against the PR base (not just the tip).
          fetch-depth: 0
      # THIS JOB NOW NEEDS A TOOLCHAIN. The gate used to be a stdlib-python fingerprint and this job
      # installed nothing; the conversion moves it onto the one gate runner, and the cost is
      # declared here rather than assumed. It is bounded the same way every other converted gate's
      # is: the segregation gate holds the runner's dependency count at one, and the cache is keyed
      # on `xtask` so this job does not pay for the workspace's build.
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install Rust toolchain (the gate runner)
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target"
          key: xtask
      - name: Build the gate runner once
        run: cargo build -p xtask --locked

      # The self-test runs FIRST, as it does for every other gate: never trust a verdict before
      # proving the gate can still go RED. It plants 55 cases, every one of them through
      # `Gate::run`, so a rule that stopped firing is caught rather than reported as a clean tree.
      - name: Config-schema gate self-test (prove RED/GREEN before trusting the verdict)
        run: cargo xtask gate config-schema --selftest
      # On a PR, the anti-launder baseline is the BASE branch's snapshot (a break committed alongside
      # a refreshed snapshot on the PR tip is still caught against the base). On a push, HEAD is the
      # baseline (no-op delta). `fetch-depth: 0` above is what makes either resolvable — the gate
      # refuses an unresolvable ref rather than skipping the check, because a skipped additive check
      # is a free bypass.
      - name: Config-schema gate (drift + additive-only)
        env:
          CONFIG_SCHEMA_BASELINE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'HEAD' }}
        run: cargo xtask gate config-schema

  # GENERATED-ARTIFACT DRIFT gate. Sibling to the openapi (`openapi-schema`) and config-schema
  # (`config-stability`) drift guards, closing the third and fourth committed-but-generated files
  # that had NO CI guard at all: `qa/field-inventory.json` and `qa/method-inventory.json`.
  #
  # THE HOLE THIS CLOSES. Both files are GENERATED — field-inventory from the vendored dialect
  # schemas in `qa/field-schemas/`, method-inventory from rmcp's `model.rs` + a2a's vendored
  # `a2a.proto`. The Rust coverage tests (`field_coverage.rs`, `method_coverage.rs`) READ the
  # committed JSON and assert properties OF it — so a STALE inventory (a schema/method moved and
  # nobody re-ran `--write`) is read as gospel and the tests still pass. The generators ship a
  # `--check` mode written expressly "fail if the committed file is stale (CI)", but until now
  # nothing in CI ran it. That is exactly the class the 1.4.1 openapi and the config-stability
  # snapshot guards exist for: a hand-edit (a version bump, a schema tweak) that skips the regen
  # chore lands a stale generated artifact and main goes red later, or worse, silently ships it.
  #
  # Regen-is-clean, enforced: `--check` re-derives from source in memory and fails RED naming the
  # `--write` command if the committed file differs. Self-test FIRST (the sibling convention) so a
  # generator that has quietly stopped deriving anything cannot pass vacuously. Pure stdlib python
  # over tracked files — no toolchain, no build — so it is FAST TIER and runs on every push.
  generated-artifact-drift:
    name: generated-artifact drift (field · method inventories · oracle cells regen-clean)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 0.7 min
    # over the last 10 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The method-inventory derivation reads the rmcp SDK's `model.rs` from the EXTRACTED registry
      # source (`registry/src/*/rmcp-<ver>/src/model.rs`) and REFUSES rather than skip when it is
      # absent — an inventory of nothing is worse than no inventory. A bare checkout never extracts a
      # dependency's source (only a compile does), so this job used to pass ONLY when the runner
      # happened to have rmcp cached, and drew a red the first time it didn't. Extract it
      # deterministically: `cargo fetch` downloads the `.crate`, `cargo check -p rmcp` unpacks its
      # source into `registry/src/` (and rust-cache keeps it warm for later runs).
      - name: Extract rmcp source (the method-inventory derivation reads it)
        run: |
          cargo fetch --locked
          cargo check -p rmcp --locked
      - name: field-inventory self-test (derivation cannot be lied to)
        run: cargo xtask gate field-inventory --selftest
      - name: field-inventory drift (committed == fresh derivation)
        run: cargo xtask gate field-inventory
      - name: method-inventory self-test (derivation cannot be lied to)
        run: python3 scripts/method-inventory.py --selftest
      - name: method-inventory drift (committed == fresh derivation)
        run: python3 scripts/method-inventory.py --check
      # cells.json is a THIRD generated artifact of the same shape, and the one with the widest
      # blast radius: the shadow oracle's recorder and replayer iterate it, so a stale or hand-edited
      # cell list silently changes what the whole 1.5.5 parity battery even asks. It derives from the
      # two inventories checked immediately above, which is exactly why it can fall behind them.
      - name: shadow-oracle cells drift (committed == fresh derivation)
        run: |
          set -euo pipefail
          # Self-test FIRST, as everywhere else here: every `*_cells()` builder returns [] for a
          # missing fixture, so a renamed fixture deletes a whole family from the owed corpus
          # without a word. The self-test plants exactly that and requires the per-family floor to
          # refuse it, before the floor's verdict on this tree is trusted.
          ./bin/oracle cells --selftest
          ./bin/oracle cells --check

  # PUBLIC-HYGIENE gate. busbar is sold to enterprises, and this repo, the docs site and the
  # generated openapi.json are all public. A customer who finds an internal tracking id, a developer's
  # home directory or test-process narration in a shipped file does not conclude "untidy" — they
  # conclude the product was assembled by a process they were not shown.
  # That is a commercial fact about the product, so it gets a control rather than a sweep.
  #
  # Each of these is a TEXT class. A manual sweep removes instances; this removes the class, and
  # keeps it removed.
  #
  # Eleven rules, each derived from text really found in this repo's history, each carrying its own
  # RED fixture AND a GREEN twin. The false-positive controls are as load-bearing as the rules — the
  # vendor names this gateway routes to (Anthropic, OpenAI, Claude, Gemini), technical invariants
  # like `fail closed`, and identifiers that merely contain a flagged word are all explicit GREEN
  # controls — because a gate that cries wolf gets switched off, and then it protects nothing.
  #
  # No toolchain and no build: it is pure stdlib python over the file list `git ls-files` reports,
  # which is the exact definition of "what the public gets". Self-test FIRST, and a scan that
  # discovers ZERO files is a HARD FAILURE, so neither a broken rule table nor a mistyped path can
  # read as "clean". The same script runs over every PLUGIN repo via the plugin-ci reusable workflow.
  public-hygiene:
    name: docs hygiene (public prose describes the software, not the process)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 1.2 min
    # over the last 13 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Public-hygiene self-test (every rule proven RED, every twin proven GREEN)
        run: python3 scripts/public-hygiene-lint.py --selftest
      - name: Public-hygiene gate
        run: python3 scripts/public-hygiene-lint.py --root .

      # SECRET-VALUE-TYPE HYGIENE (scripts/secret-hygiene-gate.sh, docs/design/1.6.0-secret-hygiene.md):
      # a known-secret field declared as a bare String/&str/Vec<u8> instead of busbar_api::Redacted<T>
      # (leakable through a derived Debug/Serialize), and an `.expose_secret()` on the same statement
      # as a log/audit/metric sink.
      #
      # IT HAD NO CALLER IN THIS FILE. The only invocation anywhere was the `secret-hygiene` segment
      # in qa/segments.toml, which runs on the qa fleet — i.e. on promotion, not on a push and not on
      # a pull request. So the scanner and its self-test existed, were correct, and observed nothing
      # on the branch where the offending line is actually written. A gate whose red nobody sees
      # until promotion is a gate that reports on history.
      #
      # It rides here rather than in a job of its own because it is the same shape as the lint above:
      # one shell process over tracked files, no toolchain, no build. Self-test FIRST — a scanner
      # that stopped matching would otherwise report zero debt as zero problems.
      - name: Secret-hygiene self-test (a planted bare secret and a sink leak both proven RED)
        run: scripts/secret-hygiene-gate.sh --selftest
      # REPORT-ONLY, exactly as the qa segment runs it: the baseline debt is the Phase-2 egress
      # credential holders, which Phase 2 converts post-pivot. Arming it is the documented one-flag
      # flip (SECRET_GATE_REPORT_ONLY=0) with no code edit. Report-only here still means the DEBT
      # COUNT and its file:line list are printed on every run, which is the thing that was missing.
      - name: Secret-hygiene debt meter (report-only)
        run: SECRET_GATE_REPORT_ONLY=1 scripts/secret-hygiene-gate.sh --report

  # SERVICE-IMAGE PINS. The durable-store QA cycle (docs/design/store-qa-cycle.md) rests on the
  # four backend services being the SAME BYTES everywhere they are stood up. They were not: the
  # service containers were provisioned in five places — this file's `check` and `coverage` jobs,
  # release-stage.yml's `gate`, plugin-ci.yml's `build-test-signoff`, and scripts/release-check.sh.
  # The four workflows agreed on a digest; release-check.sh, which is what the QA GATE runs, used
  # floating tags. So the gate that decides a release was not pinned to the bytes CI was pinned to,
  # and nothing said so out loud.
  #
  # testing/fleet-fixtures/service-images.tsv is now the one pinned list. Actions cannot read a file
  # into a `services:` block, so the `image:` lines must stay literal and the pin cannot be enforced
  # by construction — this lint is what enforces it instead. A digest bump lands in one commit and
  # this job is what proves the fan-out was complete rather than three-quarters complete.
  #
  # FAST TIER, deliberately, for the same reason workspace-deps-lint is: a pin can drift on ANY
  # branch push, the whole job is one python process over tracked files with no toolchain, and a
  # drift first noticed on a dev merge is a drift that has already been reviewed as if it were
  # pinned. Self-test runs FIRST — every rule is proven RED on a planted fixture (a bumped digest, a
  # floating tag, an image with no row, a pin nobody uses, an empty scan) before the lint's verdict
  # on the real tree is trusted, and it includes the ZERO-ROWS-IS-RED proof against the real
  # testing/fleet-fixtures/verdict.sh.
  service-image-pins:
    name: service image pins (one pinned list, every workflow reads it)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 0.6 min
    # over the last 10 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # THE REGISTRY/TARGET CACHE, which this job never had: it builds the gate runner from source on
      # every run with nothing restored, on the image's ambient toolchain. Keyed `xtask`, the same key
      # `structure-lint` uses, so the two jobs that build only the runner share one entry instead of
      # each paying for it.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target"
          key: xtask
      - name: Service-image lint self-test (every rule proven RED)
        run: cargo xtask gate service-images --selftest
      - name: Service-image pin gate
        run: cargo xtask gate service-images
      # The local store fixtures read the same table. Their self-test needs NO docker: it asserts the
      # properties of the table and of the script's own rules — that the local port band stays
      # disjoint from the shadow oracle's 487xx/488xx band, that a namespace token cannot reach DDL
      # unvalidated, that a valkey namespace never lands on the index `url` hands out, that `down` is
      # safe with nothing up. Each of those is a way this fixture could go quietly wrong on a laptop,
      # where nobody is watching.
      - name: Store-service fixtures self-test
        run: testing/fleet-fixtures/store-services.sh --selftest

  # EXECUTABLE-CONFIG gate. Every config-grammar guard that existed before this one was scoped to
  # DOCS — `crates/busbar/tests/docs_examples.rs` reads `docs/**`, marketing's check-config-blocks.mjs
  # reads what it PUBLISHES. Nothing ever looked at the configs a MACHINE runs: the `cat > config.yaml
  # <<EOF` heredocs in CI workflows and shell scripts, the config strings inside Rust integration
  # tests, the yaml under examples/ and docker/. Those are exactly the ones that rot, because a docs
  # example gets read by a human every release and an e2e heredoc gets read by nobody until an engine
  # upgrade refuses to boot it — which is how the 1.5.3 retired-auth-grammar defect reached a long
  # list of plugin repos, core's own plugin-ci.yml, signing-gate.sh, release-check.sh, the shipped
  # docker/config.yaml and a shipped example, all at once and all invisible.
  #
  # It judges with the REAL binary (`busbar --validate`, the same mechanism docs_examples.rs uses), so
  # it can never drift from `detect_legacy_markers`. Its own job because it needs a compiled busbar;
  # only the one binary is built, not the workspace. Self-test FIRST — a scanner that has quietly
  # stopped extracting anything would otherwise pass vacuously, which is worse than no gate at all.
  # The same script runs over every PLUGIN repo via the plugin-ci reusable workflow, so the fleet
  # inherits it with no per-repo work.
  executable-config-lint:
    name: executable-config gate (heredocs · test literals · shipped yaml)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 2.7 min
    # over the last 14 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 10
    # FULL TIER ONLY. Skipped on pushes to non-promotion branches; runs on every pull
    # request, on dev/qa/main, and on workflow_dispatch. See the tier note at the top.
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build busbar (the validator this gate judges with)
        run: cargo build --locked --bin busbar
      - name: Executable-config gate self-test (RED/GREEN before the verdict is trusted)
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/executable-config-lint.py --busbar target/debug/busbar --selftest
      - name: Executable-config gate
        # --min-docs: the gate is vacuously green over an empty judgement set.
        #
        # THE NUMBER IS OVER DOCUMENTS THE BINARY JUDGED, NOT DOCUMENTS THE SCANNER EXTRACTED. It
        # used to be the latter, which counted the documents the gate had DECLINED to have an
        # opinion about (waived, carved out, skipped) toward "this gate validated enough to mean
        # something" — so a corpus that drifted entirely into skips cleared the floor while judging
        # nothing, which is the state the floor exists to make impossible.
        #
        # 152 documents are extracted today and 106 are judged, against 50/50 before the discovery
        # widening (composite actions under .github/actions, printf-written configs) and the
        # root-key mirror fix that stopped 1.6.0 plane configs being silently unclassifiable. The
        # floor is 90: below today with room for genuine churn, far above a collapsed extractor.
        run: python3 scripts/executable-config-lint.py --busbar target/debug/busbar --root . --min-docs 90

  # Compliance-by-compilation gate: busbar must build + lint clean with the built-in auth plugin
  # COMPILED OUT (`--no-default-features`), so a regulated deployment can ship a binary that provably
  # contains no such auth code. Build, clippy, AND the test suite all stay green on the featureless
  # binary — the feature-dependent behavior tests (admin-token auth, native ranking policies) are
  # `#[cfg(feature = ...)]`-gated, so what remains still passes.
  #
  # SCOPE, STATED HONESTLY: this job proves the featureless binary COMPILES, LINTS, and passes the
  # unit tests that remain compiled into it. It does NOT boot the binary and does NOT serve a request,
  # so it cannot see a core path that compiles fine and then fails at runtime because the module it
  # reaches for is absent. Proving the featureless binary WORKS is the `no-plugins-gate` job below,
  # which boots it and drives real HTTP through it.
  no-default-features:
    name: no-default-features build · clippy · test
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 22.0 min
    # over the last 13 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 33
    # FULL TIER ONLY. Skipped on pushes to non-promotion branches; runs on every pull
    # request, on dev/qa/main, and on workflow_dispatch. See the tier note at the top.
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Clippy (no-default-features)
        run: cargo clippy --no-default-features --locked -- -D warnings
      - name: Build (no-default-features)
        run: cargo build --no-default-features --locked --verbose
      - name: Test (no-default-features)
        # A reduced-feature build must still RUN tests — a feature gate that erases the whole
        # no-default-features suite would otherwise print `ok` and exit 0 (vacuous green). The
        # count here is deliberately a floor of >0 rather than a measured high-water: this build
        # excludes optional features, so its total legitimately differs from the full workspace and
        # a tight number would false-red on feature churn. PIPESTATUS[0] is cargo's own exit.
        run: |
          set -uo pipefail
          cargo test --no-default-features --locked --verbose 2>&1 | tee "$RUNNER_TEMP/ndf-test.log"
          rc=${PIPESTATUS[0]}
          total=$(grep -oE 'test result: (ok|FAILED)\. [0-9]+ passed' "$RUNNER_TEMP/ndf-test.log" \
                  | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' \
                  | awk '{s+=$1} END {print s+0}')
          echo "no-default-features: ${total} tests passed"
          if [ "$rc" -ne 0 ]; then
            echo "::error::cargo test --no-default-features FAILED (exit ${rc})."
            exit "$rc"
          fi
          if [ "$total" -lt 1 ]; then
            echo "::error::the no-default-features suite ran ZERO tests — a feature gate erased it."
            echo "::error::A zero-test 'cargo test' prints 'ok' and exits 0. This is NOT a pass."
            exit 1
          fi
      # THE PROTOCOL DELETION GATE (step 4 of 1.6.0; the LLM protocol is one extracted plugin
      # carrying its dialects, plus mcp on its own leg — one leg per PROTOCOL). Builds the binary WITHOUT ONE extracted protocol
      # crate at a time and proves the deletion at boot, not just at compile: the deleted binary
      # must come up, answer its operator surface, refuse that dialect's `protocol:` config with the
      # unknown-protocol refusal naming the remaining dialects, and still validate the dialects that
      # remain — "fewer protocols is a valid busbar" (owner ruling R-D), executed rather than
      # asserted. Lives in this job because it is the same reduced-feature axis with the same
      # toolchain + cache warm.
      - name: Protocol deletion gate
        run: scripts/proto-deletion-gate.sh

  # THE DELETION-TEST BUILD MATRIX — the enforcement gate (weak form).
  #
  # THE DELETION TEST: for each plane P, with busbar-<P> absent the NEUTRAL crates —
  # busbar-core, busbar-substrate, busbar-api — must still COMPILE (and the binary boots serving no P
  # protocol). This job is the WEAK form of that test, expressed at the neutral-crate level and made a
  # PERMANENT, ASSERTED property: build ONLY the three neutral crates with one plane's feature OFF (the
  # other planes kept ON), and with ALL planes off. It is the compile-only complement to the
  # boot-proving `Protocol deletion gate` above (which builds and boots the whole BIN): this leg proves
  # the neutral ABI crates themselves need no plane crate to compile, one plane at a time.
  #
  # WHY A DEDICATED JOB / MATRIX: the whole point of the extraction is that each plane is independently
  # removable, so each removal is an independent fact about the tree and gets its own matrix leg — a
  # leg that goes red names exactly which plane the neutral crates still can't compile without.
  #
  # LLM: there is NO `plane-llm` feature YET — the LLM PLANE_DECL is still compiled into core
  # unconditionally and the busbar-core↔busbar-llm backwards dependency is live. So the
  # per-plane "llm off" leg cannot be expressed until a `plane-llm` feature lands; TODO: add an
  # `llm` matrix leg (features "plane-mcp,plane-a2a") the moment that feature exists. Until then the
  # ALL-PLANES-OFF leg (`--no-default-features`) is the closest expressible "serves no protocols"
  # neutral build, and it is the owner's literal requirement ("core serving no protocols is valid").
  #
  # STRONG FORM: scripts/plane-delete-test.sh PHYSICALLY REMOVES the crate from the workspace members +
  # `dep:` lines in a scratch checkout, then builds the neutral crates + bin and boot-smokes that the
  # plane reports absent. It is wired as its own gate (`plane-delete-test.sh --all`) and passes for all
  # three planes; this weak form is the per-plane compile-level complement, asserted on every matrix leg.
  deletion-test-matrix:
    name: deletion-test (neutral crates compile with a plane removed)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 1.6 min
    # over the last 15 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 10
    # FULL TIER ONLY (same axis + cost profile as no-default-features). Skipped on pushes to
    # non-promotion branches; runs on every pull request, on dev/qa/main, and on workflow_dispatch.
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mcp removed (a2a kept)
            features: plane-a2a
          - name: a2a removed (mcp kept)
            features: plane-mcp
          - name: all planes off (core serves no protocols)
            features: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build neutral crates — ${{ matrix.name }}
        # The three NEUTRAL crates only, no default features, with just the kept plane(s). cargo
        # applies `--features` to the packages that declare it (busbar-core / busbar-substrate);
        # busbar-api carries no plane features and is simply built neutral alongside. A red here means
        # a neutral crate still needs the removed plane crate to compile — a deletion-test failure.
        run: |
          set -euo pipefail
          FEATS="${{ matrix.features }}"
          if [ -n "$FEATS" ]; then
            cargo build -p busbar-core -p busbar-substrate -p busbar-api \
              --no-default-features --features "$FEATS" --locked --verbose
          else
            cargo build -p busbar-core -p busbar-substrate -p busbar-api \
              --no-default-features --locked --verbose
          fi

  # ── EVERY NON-DEFAULT FEATURE IS COMPILED BY A JOB THAT NAMES IT ──────────────────────────────
  # A cargo feature nothing builds is a feature that is already broken and nobody knows. The code
  # behind `#[cfg(feature = "…")]` is not compiled, so it is not type-checked, so it does not have
  # to be valid Rust; it rots at the speed the rest of the tree moves and the first person to turn
  # the feature on pays the whole bill. That is not hypothetical: the root binary's duplex-serve leg
  # was default-OFF and named by NO job, and it stopped compiling for DAYS without one red run.
  #
  # `check` above compiles a great deal of this by accident — a feature reachable from some crate's
  # `default`, or unified in by a dev-dependency under `--all-targets`, gets built without anybody
  # deciding it should be. Accidental coverage is coverage until the default moves. This job is the
  # coverage that does not move: one matrix row per feature set, each row NAMING its features.
  #
  # `docs/ci/feature-sets.md` is the full measurement — all 67 declared features, 46 non-default,
  # which leg builds each, and the seven that no leg built before this job existed. The
  # `feature-sets` xtask gate holds the two together: a non-default feature that appears neither in
  # this matrix nor in a `# feature-covered:` declaration below is RED.
  #
  # WHY CLIPPY AND NOT `cargo check`: `cargo clippy --workspace --all-targets` IS
  # `cargo check --workspace --all-targets` — same front end, same target set — and then refuses on
  # warnings. Running both would compile the workspace twice per row for no extra information.
  #
  # WHY SEPARATE ROWS: one union row proves the features compile TOGETHER, which is not a build
  # anybody ships. Each row is a build somebody could ship.
  feature-sets:
    name: feature sets (every non-default feature compiles, with lints, with its tests)
    # SAME RUNNER LABEL AND SAME PINNED TOOLCHAIN AS `check`. A feature leg that builds on a
    # different runner class or a different compiler is answering a different question.
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. A row is one workspace clippy
    # plus one set of crate test binaries; `check`'s own workspace clippy+build+test is ~13 min warm
    # and ~40 cold, and a row is a strict subset of that work. 45 leaves cold-cache headroom.
    timeout-minutes: 45
    # FAST TIER — no `if:` guard. The defect this job exists for is "nobody compiled it for days",
    # and a full-tier job on the integration line is a job that does not compile it for days.
    strategy:
      fail-fast: false
      matrix:
        include:
          # The six sets. `features` is passed verbatim to `--features`; `tests` is passed verbatim
          # after `cargo test`. Both are read by `cargo xtask gate feature-sets`, so a row is data,
          # not prose.
          - name: root test-harness
            features: busbar/test-harness
            tests: -p busbar
          - name: timing
            features: busbar-core/timing,busbar-llm/timing,busbar-llm-codec/timing
            tests: -p busbar-core -p busbar-llm -p busbar-llm-codec -p busbar-timing
          - name: llm auth-admin-tokens
            features: busbar-llm/auth-admin-tokens
            tests: -p busbar-llm
          - name: llm webhook-receiver
            features: busbar-llm/webhook-receiver
            tests: -p busbar-llm
          - name: mcp-codec test-support
            features: busbar-mcp-codec/test-support
            tests: -p busbar-mcp-codec
          # duplex-ws is reachable from the root binary's default `plane-voice` TODAY. It is in this
          # matrix anyway, because reachability is a property of a DEFAULT and a default moving is
          # the exposure this whole job is about. A row that NAMES the feature survives the flip.
          - name: core duplex-ws
            features: busbar-core/duplex-ws
            tests: -p busbar-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Clippy — ${{ matrix.name }}
        run: cargo clippy --workspace --all-targets --features "${{ matrix.features }}" --locked -- -D warnings
      - name: Plugin cdylibs the suites dlopen
        # MEASURED, not precautionary. `cargo test -p busbar-core` alone fails eleven tests with
        # "the busbar-store-example-plugin cdylib is not built at target/debug/…", and
        # `cargo test -p busbar-llm` one more on the hook-test plugin: those batteries cross the REAL
        # plugin C ABI on purpose and REFUSE to skip when the artifact is missing. The `check` job
        # never sees it because `cargo build --workspace` has already produced every cdylib by the
        # time its tests run. A per-package test run has to say so itself. ~30 s, and the alternative
        # -- a second `cargo build --workspace` per row -- is a full codegen for the same artifacts.
        run: |
          cargo build --locked \
            -p busbar-store-example-plugin \
            -p busbar-hook-test-plugin \
            -p busbar-auth-static-plugin \
            -p busbar-secret-example-plugin \
            -p busbar-export-example-plugin
      - name: Tests — ${{ matrix.name }}
        # The OWNING crates' suites, with the feature on. Compiling the `#[cfg]`-ed code proves it is
        # valid Rust; running the suite is what proves it does anything.
        run: cargo test ${{ matrix.tests }} --features "${{ matrix.features }}" --locked
  # ── WHERE THE OTHER FORTY NON-DEFAULT FEATURES ARE BUILT ──────────────────────────────────────
  # `cargo xtask gate feature-sets` requires EVERY non-default feature in the tree to appear either
  # in the matrix above or on one of these lines, and requires every line to name a feature that
  # still exists and a job that still exists. The shape is fixed:
  #
  #   # feature-covered: <pkg>/<feature> -- <job-key> -- <reason, at least 30 characters>
  #
  # A feature added to any crate is RED until somebody writes down which job builds it. These are
  # the forty that an existing leg already builds; the derivation behind each is the table in
  # docs/ci/feature-sets.md, produced with `cargo tree -f '{p}|{f}'` over every CI invocation.
  #
  # feature-covered: busbar/loom-model -- txn-guards -- scripts/loom.sh builds it in release to explore the txn interleavings
  # feature-covered: busbar-core/loom-model -- txn-guards -- same scripts/loom.sh run; the root feature is a forward onto this one
  # feature-covered: busbar/openapi-schema -- openapi-schema -- the job clippies and tests -p busbar with the feature named
  # feature-covered: busbar-core/openapi-schema -- openapi-schema -- same job names -p busbar-core with the feature
  # feature-covered: busbar-a2a/openapi-schema -- openapi-schema -- pulled by the forward from busbar-core in that job's build
  # feature-covered: busbar-llm/openapi-schema -- openapi-schema -- pulled by the forward from busbar-core in that job's build
  # feature-covered: busbar-llm-codec/openapi-schema -- openapi-schema -- pulled by the forward from busbar-llm in that job's build
  # feature-covered: busbar-mcp/openapi-schema -- openapi-schema -- pulled by the forward from busbar-core in that job's build
  # feature-covered: busbar-substrate/openapi-schema -- openapi-schema -- pulled by the forward from every plane crate there
  # feature-covered: busbar-voice/openapi-schema -- openapi-schema -- pulled by the forward from busbar with the feature on
  # feature-covered: busbar-timing/timing -- check -- the Timing implementation tests step names -p busbar-timing --features timing
  # feature-covered: busbar-llm/teller-waist -- check -- the LLM teller-step tests step names it, and the root default reaches it
  # feature-covered: busbar-voice/test-support -- check -- the Voice runtime tests step names --features runtime,test-support
  # feature-covered: busbar-voice/runtime -- check -- the Voice runtime tests step names it, and the root default reaches it
  # feature-covered: busbar-voice-codec/runtime -- check -- the Voice runtime tests step names -p busbar-voice-codec --features runtime
  # feature-covered: busbar-core/plane-voice -- check -- reached from the root binary's default plane-voice in the workspace build
  # feature-covered: busbar-substrate/plane-voice -- check -- reached from busbar-core/plane-voice in the workspace default build
  # feature-covered: busbar-substrate/plane-a2a -- check -- reached from busbar-core/plane-a2a in the workspace default build
  # feature-covered: busbar-substrate/plane-mcp -- check -- reached from busbar-core/plane-mcp in the workspace default build
  # feature-covered: busbar-substrate/plane-llm -- check -- reached from busbar-core/plane-llm in the workspace default build
  # feature-covered: busbar-substrate/dispatch -- check -- reached from the plane-mcp forward in the workspace default build
  # feature-covered: busbar-substrate/relay -- check -- reached from the plane-a2a forward in the workspace default build
  # feature-covered: busbar-substrate/runtime -- check -- reached from the plane-voice forward in the workspace default build
  # feature-covered: busbar-substrate-values/dispatch -- check -- reached from busbar-substrate/dispatch in the default build
  # feature-covered: busbar-substrate-values/relay -- check -- reached from busbar-substrate/relay in the default build
  # feature-covered: busbar-substrate-values/runtime -- check -- reached from busbar-substrate/runtime in the default build
  # feature-covered: busbar-unit-auth/sha256 -- check -- reached from the default auth-admin-tokens closure in the workspace build
  # feature-covered: busbar-core/test-support -- check -- unified in by a dev-dependency under cargo clippy --workspace --all-targets
  # feature-covered: busbar-substrate/test-support -- check -- unified in by a dev-dependency under --all-targets in that job
  # feature-covered: busbar-substrate-values/test-support -- check -- unified in by a dev-dependency under --all-targets in that job
  # feature-covered: busbar-a2a/test-support -- check -- unified in by a dev-dependency under --all-targets in that job
  # feature-covered: busbar-a2a/auth-admin-tokens -- check -- unified in by a dev-dependency under --all-targets in that job
  # feature-covered: busbar-a2a-codec/test-support -- check -- unified in by a dev-dependency under --all-targets in that job
  # feature-covered: busbar-mcp/test-support -- check -- unified in by a dev-dependency under --all-targets in that job
  # feature-covered: busbar-mcp/auth-admin-tokens -- check -- unified in by a dev-dependency under --all-targets in that job
  # feature-covered: busbar-llm/test-support -- check -- unified in by a dev-dependency under --all-targets in that job
  # feature-covered: busbar-llm-codec/test-support -- check -- unified in by a dev-dependency under --all-targets in that job
  # feature-covered: busbar-plugin-testkit/store -- check -- unified in by a dev-dependency under --all-targets in that job

  # THE MECHANICAL DEFINITION OF "PLUGIN". Anything busbar calls a plugin must be 100% a plugin: make
  # it downloadable-only tomorrow, ship it uninstalled, and CORE MUST STILL WORK. If core stops
  # working, core assumed it always had that module — and that module is not a plugin, it is part of
  # the engine wearing a plugin's name.
  #
  # This job RUNS the binary; `no-default-features` above only compiles it. Two axes, because a plugin
  # can be wrongly assumed two independent ways and neither axis can see the other's failures:
  # COMPILED OUT (`--no-default-features` — the built-in plugin features are not in the binary) and
  # NOT INSTALLED (default features, but `plugins.dir` holds zero artifacts — catches core assuming a
  # `dlopen`ed store/auth/hook/secret plugin is on disk). Against a config that references ZERO
  # plugins, each axis must boot, serve `/healthz`, ANSWER ITS ADMIN PLANE (real reads and a real
  # write — not just the unauthenticated liveness route), and proxy a real request end-to-end to a
  # real mock upstream, asserted on the upstream's unique marker.
  #
  # It has its own job for the reason txn-guards states: a gate nothing runs is not a gate. The
  # self-test runs FIRST and is a hard prerequisite — it drives the featureless binary against
  # fixtures that genuinely depend on a compiled-out plugin, plus stub servers that pass every earlier
  # assertion and break exactly one later one, so a gate that had rotted into passing vacuously fails
  # here instead of manufacturing false confidence.
  no-plugins-gate:
    name: no-plugins gate (compiled out · not installed)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 2.9 min
    # over the last 14 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 10
    # FULL TIER ONLY. Skipped on pushes to non-promotion branches; runs on every pull
    # request, on dev/qa/main, and on workflow_dispatch. See the tier note at the top.
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: No-plugins gate SELF-TEST (prove RED/GREEN before trusting the verdict)
        run: scripts/no-plugins-gate.sh --selftest
      - name: No-plugins gate (axis 1 compiled out · axis 2 not installed)
        run: scripts/no-plugins-gate.sh --check

  # CONCURRENCY GATES for the config-mutation transaction (choke point C). Neither of these can run
  # inside `cargo test --workspace`: the compile fence must FAIL to build (it is a negative test
  # behind the `txn_fence_red` rustc cfg) and the loom model explores interleavings exhaustively behind
  # `loom-model`, far too slowly for the default suite. A gate nothing runs is not a gate, so they
  # get their own job — otherwise the transaction guard could be dismantled with the tree still green.
  txn-guards:
    name: txn compile fence · loom model
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 12.1 min
    # over the last 14 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 18
    # FULL TIER ONLY. Skipped on pushes to non-promotion branches; runs on every pull
    # request, on dev/qa/main, and on workflow_dispatch. See the tier note at the top.
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Transaction compile fence (must fail to compile)
        run: scripts/txn-fence.sh
      - name: Loom model of the swap invariant
        run: scripts/loom.sh

  # TIMING GATE: the ignored hot-path latency test, in release mode. Its bounds are deliberately
  # generous (25ms p50 / 250ms p99 through the full in-process router+mock round trip) so runner
  # noise can never trip it — it exists to catch GROSS hot-path regressions (sync I/O, stray
  # sleeps) the instant they land. Fine-grained overhead numbers are bench/latency/'s job.
  timing:
    name: timing gate (release)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 18.1 min
    # over the last 14 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 27
    # FULL TIER ONLY. Skipped on pushes to non-promotion branches; runs on every pull
    # request, on dev/qa/main, and on workflow_dispatch. See the tier note at the top.
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Hot-path timing gate
        run: |
          set -euo pipefail
          # FLOOR ON THE MATCH COUNT. `timing_gate` is a SUBSTRING filter and these tests are
          # `#[ignore]`d, so this job is their ONLY execution anywhere. A filter that matches nothing
          # prints "running 0 tests / test result: ok" and EXITS 0 — rename the tests and the hot-path
          # timing gate is green forever having measured nothing, with no other job to notice.
          out="$(cargo test --release --locked timing_gate -- --ignored 2>&1 | tee /dev/stderr)"
          echo "$out" | grep -qE 'test result: ok\. [1-9][0-9]* passed' || {
            echo "::error::the hot-path timing gate ran ZERO tests (renamed, moved, or un-ignored?)."
            echo "::error::A zero-match 'cargo test' exits 0 — this is NOT a pass."
            exit 1
          }

  # Portability gate: busbar must build + pass tests on Windows too (no OS-specific code).
  #
  # WINDOWS IS A PUBLISHED RELEASE TARGET, not a nice-to-have: `.github/release-targets.json` ships
  # `x86_64-pc-windows-msvc`, which is the DEFAULT HOST TARGET of `windows-latest` — so this job
  # builds the same triple the release does, with no `--target` needed.
  #
  # WHAT THIS JOB DOES NOT PROVE, stated so a green check is not over-read. The most
  # platform-sensitive subsystem in the tree is the stdio MCP transport (process spawn, pipes, child
  # teardown), and its tests are `#[cfg(unix)]` because the fixture children are `/bin/sh` scripts
  # (see crates/busbar-mcp/src/mcp/client/tests/stdio_tests.rs). They therefore compile to NOTHING here:
  # this job is green while the spawn half is unexecuted on Windows. `cargo test` cannot notice that
  # — a test that does not exist cannot fail — so the gap is written down rather than inferred.
  # Closing it needs cmd.exe fixture children, which is real work and not a CI edit.
  windows:
    name: windows build · clippy · test
    runs-on: windows-latest
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 18.3 min
    # over the last 7 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 27
    # FULL TIER ONLY. Skipped on pushes to non-promotion branches; runs on every pull
    # request, on dev/qa/main, and on workflow_dispatch. See the tier note at the top.
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    env:
      # TWO numbers, in ONE place, so a change to either is unmissable in a diff.
      #
      # WINDOWS_MIN_TESTS is the HARD floor: below it the job fails. WINDOWS_EXPECTED_TESTS is the
      # observed high-water mark: below it the job WARNS but still passes.
      #
      # Why two rather than one. A single floor pinned at the observed total makes a required check
      # on `main` fail every time anyone legitimately consolidates or renames a test, which trains
      # people to edit the number without reading it — and a floor nobody reads is a floor that gets
      # lowered past a real regression. A single floor with slack, on the other hand, cannot see a
      # whole suite disappear. So: the hard floor has slack, and the high-water mark carries the
      # sensitivity, as a warning that costs nothing to be wrong about.
      #
      # RECOMPUTED for the post-plane-extraction topology (see the unix `check` job for the full
      # rationale): the A2A/MCP/LLM `test-support` suites run under `cargo test --workspace` here too
      # (feature unification), so windows collects the same superset MINUS the cfg(unix)-only tests.
      # EXPECTED is the count the windows runner produced at the last measured commit (5686); MIN keeps
      # generous slack below it. RAISE both as the suite grows; lower only when a diff explains the drop.
      WINDOWS_MIN_TESTS: "5620"
      WINDOWS_EXPECTED_TESTS: "5686"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --workspace --verbose
      # CLIPPY ON WINDOWS, which `build` above does not subsume in either direction. `cargo build`
      # compiles lib+bin targets only, so a `#[cfg(windows)]` branch reachable only from a test or an
      # example is never even parsed by it; and clippy carries lint passes rustc does not. The
      # platform-gated code in this tree is exactly the shape that goes stale unseen — a
      # `#[cfg(unix)]` import whose `#[cfg(windows)]` twin was never added is a warning HERE and
      # nowhere else. `-D warnings` matches the workspace-wide RUSTFLAGS this workflow already sets,
      # so this adds a gate and relaxes none.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --verbose -- -D warnings
      - name: Test
        # `shell: bash` is REQUIRED and not a style choice: `run:` on a windows runner defaults to
        # pwsh, where none of the pipeline below parses.
        shell: bash
        run: |
          set -uo pipefail
          # `tee` keeps the full log in the job output (the point of --verbose) while the same bytes
          # are captured for the count. PIPESTATUS[0], not $?, is cargo's own exit status.
          cargo test --workspace --verbose 2>&1 | tee "$RUNNER_TEMP/windows-test.log"
          rc=${PIPESTATUS[0]}

          # SUM across every test binary, not a single grep line: `test result: ok. N passed`
          # is printed once PER binary, so a single-line match would floor against one binary and
          # miss a whole suite vanishing. Sum every binary's `passed` count.
          total=$(grep -oE 'test result: (ok|FAILED)\. [0-9]+ passed' "$RUNNER_TEMP/windows-test.log" \
                  | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' \
                  | awk '{s+=$1} END {print s+0}')
          echo "windows: ${total} tests passed across the workspace (floor: ${WINDOWS_MIN_TESTS}, expected: ${WINDOWS_EXPECTED_TESTS})"

          if [ "$rc" -ne 0 ]; then
            echo "::error::cargo test --workspace FAILED on windows (exit ${rc})."
            exit "$rc"
          fi
          # The sensitive half: a drop of even one test is surfaced, without failing a required
          # check over legitimate churn. A drop nobody can explain is the shape this job exists for.
          if [ "$total" -lt "$WINDOWS_EXPECTED_TESTS" ]; then
            echo "::warning::windows ran ${total} tests, ${WINDOWS_EXPECTED_TESTS} were expected."
            echo "::warning::If tests were legitimately removed or merged, LOWER WINDOWS_EXPECTED_TESTS in this job."
            echo "::warning::If not, something stopped being collected — a cfg gate, a renamed harness, a dropped target."
          elif [ "$total" -gt "$WINDOWS_EXPECTED_TESTS" ]; then
            echo "::notice::windows ran ${total} tests, above the recorded ${WINDOWS_EXPECTED_TESTS}. Raise WINDOWS_EXPECTED_TESTS."
          fi
          if [ "$total" -lt "$WINDOWS_MIN_TESTS" ]; then
            echo "::error::the windows portability gate ran ${total} tests, below its floor of ${WINDOWS_MIN_TESTS}."
            echo "::error::A workspace whose suites compiled to nothing still prints 'test result: ok' and exits 0."
            echo "::error::This is NOT a pass. Either a suite stopped being built/collected, or a cfg gate erased one."
            echo "::error::If the drop is intended, LOWER the WINDOWS_MIN_TESTS floor in this job deliberately."
            exit 1
          fi
      # THE BLIND SPOT, PRINTED INTO THIS RUN'S OWN SUMMARY. Deliberately NOT a gate — it asserts
      # nothing and cannot fail the job — because what it reports is a known, accepted, written-down
      # gap and turning it red would only teach people to route around it.
      #
      # It exists because of an asymmetry no gate can fix from here: a `#[cfg(unix)]` test compiles
      # to NOTHING on this runner, so the green check above is green partly because those tests were
      # never built, let alone run. `cargo test` cannot notice that — a test that does not exist
      # cannot fail — and the gap is therefore invisible at exactly the moment someone reads the
      # check mark and concludes "Windows is covered". The comment at the top of this job says so
      # once, in a file nobody opens while looking at a green tick; this puts the same sentence, with
      # the CURRENT file list rather than a remembered one, in front of whoever is reading the run.
      #
      # `|| true` on the grep: no match is exit 1 for grep, which would fail the step for the BEST
      # possible reason (no unix-only tests left), and a step that fails on success is worse than no
      # step at all.
      - name: Windows blind spots (informational, never a gate)
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows blind spots in this run"
            echo
            echo "\`cargo test\` above passed. These test items are \`#[cfg(unix)]\`, so on this"
            echo "runner they compiled to nothing and did NOT run. Green here does not cover them."
            echo
            echo '```'
            grep -rn --include='*.rs' -E '^\s*#!?\[cfg\(unix\)\]' crates/ || true
            echo '```'
            echo
            echo "The largest of these is the stdio MCP transport (spawn, pipes, child teardown):"
            echo "its fixture children are \`/bin/sh\` scripts. Closing it needs cmd.exe fixtures,"
            echo "which is real work and not a CI edit. See docs/operations.md, 'Running on Windows'."
          } >> "$GITHUB_STEP_SUMMARY"

  # COVERAGE — instrumented run of the same workspace suite `check` runs, uploaded to Codecov for
  # the README badge and per-PR line-coverage context. Deliberately ADDITIVE and NON-GATING:
  #
  #   * It is NOT in the ci-umbrella `needs`/RESULTS below, so it is never a required check and can
  #     never turn `dev`/`qa`/`main` red. Coverage reporting is an OBSERVATION, not a correctness
  #     gate — the correctness gate is `check`, which this must never be able to mask or block.
  #   * It is a SEPARATE job, not a step folded into `check`, on purpose: `cargo llvm-cov` compiles
  #     with `-C instrument-coverage` and drops `*.profraw` files, which would trip `check`'s
  #     "working tree clean" assertion. Isolating it keeps that assertion honest.
  #   * The upload uses `fail_ci_if_error: false` so a Codecov outage or a tokenless-rate-limit is a
  #     no-op here, not a red job — a reporting dependency must never be able to fail the build.
  #   * FULL TIER ONLY, same `if:` as windows/openapi/etc., so a feature-branch push doesn't pay for
  #     a full instrumented rebuild; it runs on every PR and on dev/qa/main/dispatch.
  #
  # Same digest-pinned postgres/valkey services + BUSBAR_TEST_POSTGRES_URL / VALKEY_URL as `check`,
  # so the store-postgres / store-valkey roundtrip tests are covered here too rather than skipped.
  coverage:
    name: coverage (llvm-cov · codecov)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 6.4 min
    # over the last 9 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 10
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: busbar
          POSTGRES_PASSWORD: busbar
          POSTGRES_DB: busbar_test
        options: >-
          --health-cmd "pg_isready -U busbar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # SERVICE CONTAINERS ARE ADDRESSED BY CONTAINER IP, NOT localhost. On a GitHub-hosted runner
      # a job owned the whole machine, so `ports: - 5432:5432` and `localhost:5432` were the same
      # fact. On busbar-xl FOUR agents share a box and the host's 5432 is one resource: the second
      # job to publish it dies in `Initialize containers` with "port is already allocated", before a
      # line of the job has run. So nothing is published; the services keep the per-job
      # `github_network_*` bridge the runner already builds for them, and this step reads each
      # container's address off it. Two jobs, two networks, two addresses, nothing to collide on.
      - name: Service endpoints (container IP, not a published host port)
        run: ./scripts/ci-service-endpoints.sh postgres=${{ job.services.postgres.id }} valkey=${{ job.services.valkey.id }}
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: llvm-tools-preview
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@b3c2424e62a3f08fd88bf434799847a4d0da36c8 # cargo-llvm-cov
      - name: Collect coverage (workspace, live-DB tests wired)
        # `--ignore-run-fail`: this job REPORTS coverage, it does not RE-GATE tests — the `check`
        # job is the real test gate and passes the full suite. A few subprocess/stdio integration
        # tests (crates/busbar/tests/mcp_stdio_serve.rs) are timing/behaviour-sensitive and flake
        # ONLY under llvm-cov's whole-workspace instrumentation; without this flag their flake would
        # fail this job and no coverage would ever upload. The report is still generated from every
        # test that ran. A real regression is caught by `check`, not here.
        run: cargo llvm-cov --workspace --locked --ignore-run-fail --lcov --output-path lcov.info
      # PINNED BY COMMIT SHA, not by the mutable `v5` tag. This step is handed CODECOV_TOKEN, an
      # org-level secret, and a third-party action referenced by a tag is whatever the tag points at
      # on the morning it runs — the owner can move `v5` to any commit at any time, and the moved
      # code executes here with that secret and the job's `GITHUB_TOKEN` in its environment. A sha is
      # immutable, so the code that gets the token is the code that was reviewed. Bump deliberately:
      # look up the tag's commit (`gh api repos/codecov/codecov-action/git/ref/tags/v5.x.y`) and
      # replace both the sha and the version comment together.
      - name: Upload to Codecov (never fails the build)
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          # Codecov rejects tokenless uploads on protected branches (dev/qa/main) with
          # "Token required because branch is protected". This org-level secret authenticates
          # the upload on every branch. Still never gates CI (fail_ci_if_error: false).
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          slug: GetBusbar/busbar
          fail_ci_if_error: false

  # ── PERF + BUILD-PARITY GATE ─────────────────────────────────────────────────────────────────
  #
  # The deterministic defence against the class of incident that motivated it: a ~20% throughput gap
  # between two releases that was mostly a BUILD-CONFIG mismatch (a non-optimized binary masquerading
  # as a code regression) plus one real per-request allocation regression that no test flagged. This
  # job makes both structurally impossible to ship:
  #
  #   1. BUILD PARITY (structural). `scripts/profile-lock.sh` locks `[profile.release]` to the
  #      optimized posture (opt-level 3 / lto fat / codegen-units 1 / strip / debug-assertions off);
  #      the build-provenance STAMP (`busbar --build-info`, from crates/busbar/build.rs) makes every
  #      binary self-report its posture, and `scripts/build-provenance-gate.sh` asserts a real
  #      release build reports `profile=release opt-level=3 debug-assertions=false`. Weakening the
  #      profile, or a binary built the wrong way, turns this RED. (The PGO=true assertion lives on
  #      the release/docker workflow, where a PGO binary is actually built — dev CI is not PGO.)
  #   2. PERF REGRESSION (deterministic). The allocation-count gate
  #      (`busbar-core/src/proxy/tests/alloc_gate.rs`) drives one openai>openai passthrough request
  #      through the real forward path and asserts the per-request heap-allocation count has not
  #      regressed past a committed bound — machine-independent, non-flaky, unlike a wall-clock RPS
  #      gate. It also runs inside the `check` job's `cargo test --workspace`; running it here by name
  #      makes it a VISIBLE required gate with its own red/green, per the self-test discipline the
  #      other gate jobs follow.
  #
  # FULL TIER: runs on every PR, on dev/qa/main, and on dispatch — same guard as the other gate jobs.
  perf-build-gate:
    name: perf + build-parity gate
    runs-on: [self-hosted, linux, x64, busbar-xl]
    # BOUNDED — see "EVERY JOB IS BOUNDED" at the top of this file. Measured p95 9.9 min
    # over the last 7 green runs of this job; ceiling is p95 x1.5, floor 10.
    timeout-minutes: 15
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          # llvm-tools supplies llvm-profdata, which pgo-drift-check.sh's self-test needs to build
          # its constructed profiles. Without it that script REFUSES to run (exit 2) rather than
          # skipping, which is the vacuous pass it exists to make impossible — so the component is
          # part of wiring it, not an optimisation.
          components: clippy, llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # SELF-TESTS FIRST: never trust a gate's GREEN before proving it still goes RED on a bad input
      # (same discipline as `cargo xtask gate <name> --selftest` et al).
      - name: profile-lock self-test
        run: scripts/profile-lock.sh --selftest
      - name: build-provenance gate self-test
        run: scripts/build-provenance-gate.sh --selftest

      # PGO DRIFT (scripts/pgo-drift-check.sh): does the PGO trainer still heat the code production
      # actually burns cycles in? Two gates that point in opposite directions — overlap ("is the
      # trainer's heat recognizable to production") and the missing-table share ("is production's
      # heat reachable by the trainer") — because either can read perfect while the other reads zero.
      #
      # IT HAD NO CALLER ANYWHERE. Not in this file, not in a workflow, not in qa/segments.toml, not
      # in a script. It was written, calibrated against real artifacts, given a nine-case self-test,
      # and then invoked by nothing — so both gates have been sitting at exit 0 by never running.
      #
      # WHAT IS WIRED HERE IS THE SELF-TEST, AND ONLY THAT, and the reason is written in the script's
      # own header: the full run needs a `--folded` capture of PRODUCTION stacks, and there is no
      # post-egress-cutover capture in this tree to give it. The header is explicit that
      # --max-miss-share must be re-measured against such a capture "before wiring this script into
      # CI". Running the full gate here would mean judging drift against a default nobody has
      # calibrated — a number pretending to be a measurement. The self-test needs no capture at all:
      # it constructs both profiles and proves both gates fire, plus five fail-closed arms. That is
      # the half that can be honestly proven on every run, and it is the half that stops the script
      # from rotting until a capture exists.
      - name: PGO drift-check self-test (both gates proven to fire on constructed profiles)
        run: scripts/pgo-drift-check.sh --selftest

      # STRUCTURAL: the release profile must be the locked optimized posture (source-level; lto and the
      # profile debug-assertions bit are not exposed to a build script, so they are locked here).
      - name: profile-lock ([profile.release] is the optimized posture)
        run: scripts/profile-lock.sh

      # THE STAMP, PROVEN ON A REAL RELEASE BINARY. A plain release build (no BUSBAR_PGO) must report
      # profile=release, opt-level=3, debug-assertions=false, pgo=false. A debug/non-optimized binary
      # would report otherwise and fail — the exact misdiagnosis the stamp exists to prevent.
      - name: Build busbar (release) + assert build-provenance stamp
        run: |
          cargo build -p busbar --release --locked
          scripts/build-provenance-gate.sh target/release/busbar release false

      # THE DETERMINISTIC ALLOCATION-COUNT PERF GATE, by name (also covered by the workspace test run).
      #
      # IT WAS POINTED AT THE WRONG CRATE, AND SAID NOTHING. This step read
      # `-p busbar-core --lib alloc_gate` long after the money-path move relocated the gate to
      # `crates/busbar-llm/src/engine/tests/alloc_gate_tests.rs`. A libtest filter that matches ZERO
      # tests is not an error: the binary prints `test result: ok. 0 passed; 0 failed; N filtered
      # out` and exits 0. So the named perf gate had been running nothing, greenly, and a real
      # allocation regression would have reddened nothing here.
      #
      # Hence the FLOOR, the same instrument the voice/timing/llm-unit suites carry: the count of
      # tests the filter actually collected is what proves the gate ran, and `0 passed` is the
      # failure this step exists to make impossible. Two tests are expected (the surgical
      # translate-write one and the whole-path openai>openai forward); the floor names both.
      - name: Allocation-count perf gate (openai>openai forward path)
        env:
          # `alloc_gate_translate_write_stable` + `alloc_gate_openai_passthrough_forward`. RAISE
          # this when a case is added; a filter matching fewer than this has stopped selecting the
          # gate, which is exactly the silence above.
          ALLOC_GATE_MIN_TESTS: "2"
        run: |
          set -uo pipefail
          cargo test -p busbar-llm --lib alloc_gate -- --nocapture 2>&1 | tee "$RUNNER_TEMP/alloc-gate.log"
          rc=${PIPESTATUS[0]}
          total=$(grep -oE 'test result: (ok|FAILED)\. [0-9]+ passed' "$RUNNER_TEMP/alloc-gate.log" \
                  | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' \
                  | awk '{s+=$1} END {print s+0}')
          failed=$(grep -oE '[0-9]+ failed' "$RUNNER_TEMP/alloc-gate.log" \
                  | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "alloc gate: ${total} test(s) passed, ${failed} failed (floor: ${ALLOC_GATE_MIN_TESTS})"
          if [ "$rc" -ne 0 ] || [ "$failed" -ne 0 ]; then
            echo "::error::the allocation-count perf gate FAILED (exit ${rc}, ${failed} failing test(s))."
            exit "${rc:-1}"
          fi
          if [ "$total" -lt "$ALLOC_GATE_MIN_TESTS" ]; then
            echo "::error::the alloc-gate filter collected ${total} test(s), below its floor of ${ALLOC_GATE_MIN_TESTS}."
            echo "::error::A libtest filter that matches NOTHING prints 'test result: ok' and exits 0."
            echo "::error::The gate has been renamed or moved crates again — repoint this step, do not lower the floor."
            exit 1
          fi

  # ── proof-manifest: PRODUCE + TRANSPORT for the Build Proof Dashboard ──────────────────────────────
  # (docs/design/1.6.0-proof-dashboard.md). Runs ONLY on the three stage-mirrored promotion branches
  # (dev/qa/main). The stage mirroring is preserved in the FILE NAME, not in the branch the file is
  # committed to: a push to dev publishes docs/proof/dev.json; qa -> qa.json; main -> main.json.
  #
  # WHY THIS DOES NOT COMMIT BACK TO dev/qa/main ANY MORE, AND WHY THAT WAS A RELEASE BLOCKER.
  # It used to end with `git commit … [skip ci]` + `git push origin HEAD:<the branch it ran on>`.
  # `qa` and `main` are protected (required status checks, linear history, enforce_admins: true), so
  # that push is REJECTED on exactly the two branches a release travels down: the job fails, the `CI`
  # run concludes failure, and release-stage.yml's gate 0 refuses to stage. The release could not be
  # cut at all. And in the counterfactual where the push succeeded it would be worse: it would mint a
  # NEW qa/main HEAD carrying [skip ci], so no `CI`, no `qa-gate` and no `Release stage` run would
  # exist for that sha, and release.yml's resolve-staged would refuse it forever. A manifest refresh
  # must never be able to move a release branch's HEAD.
  #
  # TRANSPORT NOW: (1) every run uploads the manifest as a workflow ARTIFACT (`proof-manifest-<branch>`),
  # which is the copy CI itself and any release job can consume without a git write anywhere; and
  # (2) the manifest is committed to the dedicated, UNPROTECTED `proof-manifests` branch, which is
  # never built, never released and never fast-forwarded into anything. Readers (the marketing site's
  # deploy.yml) check THAT branch out and read `docs/proof/<stage>.json` — see docs/proof/README.md.
  # No workflow commits to a protected branch; scripts/release-order-lint.py R11 keeps it that way.
  #
  # The collator (scripts/proof-manifest.py) changes NO gate. It re-runs the cheap grep gates
  # (plane-purity/grep/g6/abi), parses the field-coverage ledger, enumerates the golden corpus, runs the
  # busbar-llm parity tests, and STAMPS the heavy cross-job verdicts (--mark) from the sibling jobs that
  # actually ran them (honest capture — a job's GitHub result IS the verdict; a not-run source stays
  # `unknown`, never green). Public-safety is fail-closed (check-proof-manifest-public.mjs: verdicts +
  # counts + names only, no source, no secrets). The commit back carries [skip ci] so it cannot loop.
  # Not in the ci-umbrella needs: a manifest refresh must never gate a promotion.
  proof-manifest:
    name: proof-manifest (stage-mirrored dev/qa/main)
    if: github.event_name == 'push' && contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    needs:
      - structure-lint
      - check
      - no-plugins-gate
      - no-default-features
    runs-on: [self-hosted, linux, x64, busbar-xl]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      # The publication branch is checked out into RUNNER_TEMP as its OWN clone, so nothing here can
      # stage, commit or push anything in the release-branch checkout above. If the branch does not
      # exist yet it is created as an orphan (no history from dev/qa/main, nothing to fast-forward).
      - name: Check out the unprotected publication branch (never dev/qa/main)
        env:
          PUBLISH_BRANCH: proof-manifests
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          pub="$RUNNER_TEMP/proof-pub"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch "$PUBLISH_BRANCH" "$url" "$pub" 2>/dev/null; then
            echo "proof-manifest: updating existing ${PUBLISH_BRANCH}."
          else
            echo "proof-manifest: ${PUBLISH_BRANCH} does not exist yet; creating it as an orphan."
            git clone --depth 1 "$url" "$pub"
            git -C "$pub" checkout --orphan "$PUBLISH_BRANCH"
            git -C "$pub" rm -rq --cached . || true
            find "$pub" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p "$pub/docs/proof"
      - name: Collate the proof manifest (verdicts + counts, public-safe)
        env:
          VERSION: ${{ github.ref_name }}
          CHECK_RESULT: ${{ needs.check.result }}
          STRUCTURE_RESULT: ${{ needs.structure-lint.result }}
          NOPLUGINS_RESULT: ${{ needs.no-plugins-gate.result }}
          NODEFAULT_RESULT: ${{ needs.no-default-features.result }}
        run: |
          set -eu
          python3 scripts/proof-manifest.py \
            --version "$VERSION" \
            --out "$RUNNER_TEMP/proof-pub/docs/proof/${VERSION}.json" \
            --index \
            --run-parity \
            --hits-dir "$RUNNER_TEMP/proof-hits" \
            --sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --reports-dir testing \
            --mark "translate-parity-cross-pairs=${CHECK_RESULT}" \
            --mark "egress-differential=${CHECK_RESULT}" \
            --mark "crossproto-billing=${CHECK_RESULT}" \
            --mark "on-exhausted=${CHECK_RESULT}" \
            --mark "pool-upstream-creds=${CHECK_RESULT}" \
            --mark "usage-decode-tap=${CHECK_RESULT}" \
            --mark "plane-delete-test=${STRUCTURE_RESULT}" \
            --mark "no-plugins-gate=${NOPLUGINS_RESULT}" \
            --mark "proto-deletion-gate=${NODEFAULT_RESULT}"
      - name: Public-safety guard (fail-closed — verdicts only, no source, no secrets)
        run: node scripts/check-proof-manifest-public.mjs "${{ runner.temp }}/proof-pub/docs/proof/${{ github.ref_name }}.json"
      # TRANSPORT (1): the artifact. Public-safe by the guard above, keyed by the SOURCE branch, and
      # available to any consumer without a git write. This upload happens whether or not the commit
      # below does anything, so the manifest for a run always exists somewhere.
      - name: Upload the manifest as a workflow artifact (keyed by source branch)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proof-manifest-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/proof-pub/docs/proof/${{ github.ref_name }}.json
            ${{ runner.temp }}/proof-pub/docs/proof/index.json
          if-no-files-found: error
      - name: Upload hit-list evidence as a PRIVATE CI artifact (contains source; never committed)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proof-hits-${{ github.ref_name }}
          path: ${{ runner.temp }}/proof-hits
          if-no-files-found: ignore
      # TRANSPORT (2): the commit, to `proof-manifests` ONLY. Note the refspec is a LITERAL branch
      # name that is not dev/qa/main: this step cannot be made to move a release branch's HEAD by
      # running on a different branch, which is precisely how the old `HEAD:${{ github.ref_name }}`
      # push became a release blocker on the two protected branches.
      - name: Publish the manifest to the proof-manifests branch
        env:
          VERSION: ${{ github.ref_name }}
          PUBLISH_BRANCH: proof-manifests
        run: |
          set -eu
          pub="$RUNNER_TEMP/proof-pub"
          git -C "$pub" config user.name "busbar-ci"
          git -C "$pub" config user.email "ci@getbusbar.com"
          git -C "$pub" add "docs/proof/${VERSION}.json" docs/proof/index.json
          if git -C "$pub" diff --cached --quiet; then
            echo "proof-manifest: no manifest change to publish."
            exit 0
          fi
          git -C "$pub" commit -m "ci(proof): refresh docs/proof/${VERSION}.json from ${VERSION}@${GITHUB_SHA}"
          git -C "$pub" push origin "HEAD:refs/heads/proof-manifests"

  # ── ci umbrella: the SINGLE required status for branch protection on `qa` and `main`.
  #
  # Branch protection should require ONE context per stage, not a growing list that silently drifts
  # when a job is renamed (the `windows build · test` trap: `main` required a context name that
  # `dev` had already renamed, so any PR hung forever on a check that could no longer be reported).
  # With this umbrella, protection never changes as CI evolves, and a renamed or deleted job can
  # never silently drop out of the gate — it turns this job red instead.
  #
  # `if: always()` so it reports even when a need FAILED, was CANCELLED, or was SKIPPED. It then
  # asserts each need's result itself. The rules, and why:
  #   * failure / cancelled  → RED, always.
  #   * skipped              → RED, UNLESS the job is a full-tier-only job AND this is a fast-tier
  #                            run (a feature-branch push). On qa/main/dev/PR/dispatch every job
  #                            runs, so on those refs NOTHING may skip — a skipped required job must
  #                            never read as a pass. This is the whole point of the gate.
  # Because the umbrella is a required context ONLY on `qa` and `main` (both FULL_TIER), the
  # allowlist below never fires there: it exists solely so a feature-branch push still gets an
  # honest-green umbrella without pretending the full tier ran.
  #
  # It reports ALL offenders (the loop never short-circuits), reads each need's own `result`
  # (never a pipe's exit), and fails once at the end with a count.
  # SHADOW ORACLE — the parity gate. Records this build against the PUBLISHED 1.5.5 binary (fetched
  # by pinned sha256, never built from the tag) over every recorded cell family and diffs cell by
  # cell; any divergence on a 1.5.5-reachable surface is red. FAST tier: it runs on every push, because
  # a regression that lands on a feature branch is cheapest there. The golden recording is cached by
  # (asset digest, cells.json, normalizer, oracle config) so it is recorded once per revision of the
  # oracle itself; the candidate is recorded fresh every run. The candidate is built with the release
  # public key embedded, exactly as build-artifact.yml builds it — without it every first-party
  # plugin signature is unverifiable and the plugins family reads red for the wrong reason.
  shadow-oracle:
    name: shadow oracle (this build vs the published 1.5.5, 0 divergences)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    timeout-minutes: 60
    env:
      BUSBAR_RELEASE_PUBKEY: ${{ vars.BUSBAR_RELEASE_PUBKEY }}
    # THE BACKENDS BOTH SIDES RECORD AGAINST.
    #
    # The store families' cells boot a real backend, spend, restart and read back — persistence IS
    # the thing under comparison. Without a backend here those cells were named gaps on both sides,
    # so the oracle compared nothing and said "0 divergences" about the one family whose whole claim
    # is durability. A gap on both sides is not agreement.
    #
    # Digests are NOT re-pinned here. testing/fleet-fixtures/service-images.tsv is the single pinned
    # list (that is what the `service image pins` job enforces: every workflow `image:` line must
    # equal a row in it), so these three are the same bytes the `check` job runs — postgres 16 and
    # valkey 8 identically, and mysql 8 from the row plugin-ci.yml already uses. Re-pinning with
    # `docker buildx imagetools inspect` here would create a second source of truth and the pin gate
    # would refuse it, which is the gate working. The bump belongs in that one file.
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: busbar
          POSTGRES_PASSWORD: busbar
          POSTGRES_DB: busbar_test
        options: >-
          --health-cmd "pg_isready -U busbar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # MySQL 8's FIRST boot initialises the datadir and restarts once, which is why its readiness
      # budget is larger than the other two here exactly as service-images.tsv's ready_secs records.
      mysql:
        image: mysql:8@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: busbar
          MYSQL_USER: busbar
          MYSQL_PASSWORD: busbar
          MYSQL_DATABASE: busbar_test
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ubusbar -pbusbar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # SERVICE CONTAINERS ARE ADDRESSED BY CONTAINER IP, NOT localhost. On a GitHub-hosted runner
      # a job owned the whole machine, so `ports: - 5432:5432` and `localhost:5432` were the same
      # fact. On busbar-xl FOUR agents share a box and the host's 5432 is one resource: the second
      # job to publish it dies in `Initialize containers` with "port is already allocated", before a
      # line of the job has run. So nothing is published; the services keep the per-job
      # `github_network_*` bridge the runner already builds for them, and this step reads each
      # container's address off it. Two jobs, two networks, two addresses, nothing to collide on.
      - name: Service endpoints (container IP, not a published host port)
        run: ./scripts/ci-service-endpoints.sh postgres=${{ job.services.postgres.id }} mysql=${{ job.services.mysql.id }} valkey=${{ job.services.valkey.id }}
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # THE RECORDER'S PORTS ARE NOT THE KERNEL'S TO HAND OUT. The oracle binds a fixed band
      # (48781 mock, 48811/48812 data+admin, 48821/48822 the boot probe, 48851+ the selftest), and on
      # Linux that band sits INSIDE the default ephemeral range, `net.ipv4.ip_local_port_range`
      # 32768-60999. So any outbound connection this job makes — curl to the mock, busbar to an
      # upstream, the cargo build's own network — can be assigned 48812 as its SOURCE port, and the
      # next `busbar` then dies with `cannot bind listen address '127.0.0.1:48812': Address already
      # in use`. That is exactly what turned 234 of 897 golden cells into FAIL: the recorder's own
      # bindability probe asks "is anything ACCEPTING here" (a TCP connect), which an ephemeral
      # OUTBOUND socket correctly answers "no" to right up until the bind fails.
      #
      # macOS never sees it — its ephemeral range starts at 49152, above the whole band — which is
      # why every local recording is green and only the runner is red.
      #
      # The fix is to tell the kernel the band is spoken for. `ip_local_reserved_ports` removes those
      # ports from EPHEMERAL allocation while leaving an explicit bind to them legal, which is the
      # exact asymmetry the recorder needs. Range chosen to cover the whole 487xx/488xx band the
      # oracle and the fleet fixtures agree on. It is applied, then READ BACK: a silently-failed
      # sysctl would leave the flake in place under a step that printed nothing.
      - name: Reserve the oracle port band from the kernel's ephemeral pool
        run: |
          set -euo pipefail
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=48700-48900
          got="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          echo "ip_local_reserved_ports=${got}"
          case "$got" in *48700-48900*) ;; *) echo "::error::the oracle port band was not reserved (got '${got}'); a recorder bind would race the kernel's ephemeral allocator"; exit 1 ;; esac
      - name: Oracle revision (keys the 1.5.5 artifact cache)
        id: rev
        run: |
          set -euo pipefail
          digest=$(awk -F'\t' '$1=="1.5.5" && $2=="busbar-x86_64-unknown-linux-gnu.tar.gz"{print $3}' testing/shadow-oracle/golden-digests.tsv)
          # The key names the ARTIFACTS this cache holds — the pinned 1.5.5 release binary and the
          # pinned plugins — and nothing else. It used to carry harness_rev too, because the cache
          # also held a re-recorded golden; the golden is now read from the tree, so hashing the
          # harness into this key would only throw away a correct download on every harness edit.
          echo "key=oracle-artifacts-${digest:0:12}" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned 1.5.5 artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/busbar-oracle
          key: ${{ steps.rev.outputs.key }}
      - name: The differ can see a diff (replay selftest)
        run: ./bin/oracle replay-selftest
      - name: Fetch the published 1.5.5 binary and plugins by digest
        run: |
          set -euo pipefail
          ./bin/oracle fetch-golden
          # The plugin set is DERIVED from the same digest file the cells and fetch-plugin.sh read,
          # not restated here: a hand-kept copy of it goes stale the day a plugin is added, and the
          # symptom is a plugins-family cell recording against a plugin that was never fetched.
          plugins="$(cut -f1 testing/shadow-oracle/plugin-digests.tsv | grep -v '^#' | sort -u)"
          [ -n "$plugins" ] || { echo "::error::no plugins derived from plugin-digests.tsv"; exit 1; }
          for pl in $plugins; do
            ./bin/oracle fetch-plugin "$pl" >/dev/null
          done
      - name: Build the candidate (release, with the release public key)
        run: |
          set -euo pipefail
          [ -n "${BUSBAR_RELEASE_PUBKEY:-}" ] || { echo "::error::BUSBAR_RELEASE_PUBKEY is not set; the plugins family would be red for the wrong reason"; exit 1; }
          cargo build -p busbar --release --locked
      - name: Both binaries accept the oracle config
        run: ./bin/oracle selftest target/release/busbar "$HOME/.cache/busbar-oracle/1.5.5/busbar"
      # THE GOLDEN IS COMMITTED, NOT RE-DERIVED. `testing/shadow-oracle/golden/1.5.5/` is the signed-off
      # 1.5.5 recording, reviewed cell by cell, and it is the thing this job is supposed to diff
      # against. Re-recording it here made the gate's own reference an OUTPUT of the runner: 234 of
      # 897 cells failed to record on one run and the report read "the golden no longer owes this id"
      # — the tree's answer to "what did 1.5.5 do" changed because a runner had a bad afternoon.
      # A reference that is re-derived on the machine under test is not a reference.
      #
      # So the golden is COPIED IN, and the copy is checked: the ledger must carry the same number of
      # PASS rows as meta.json says were recorded, and that number must be non-zero. A truncated or
      # half-checked-out golden owes fewer cells, and owing fewer cells is how this gate goes quietly
      # green — owed-baseline.txt in replay.sh is the second half of that guard and catches an id that
      # stops being owed at all.
      - name: The golden is the committed 1.5.5 recording (never re-recorded here)
        run: |
          set -euo pipefail
          src=testing/shadow-oracle/golden/1.5.5
          rm -rf target/oracle/recordings/golden
          mkdir -p target/oracle/recordings
          cp -R "$src" target/oracle/recordings/golden
          pass=$(awk -F'\t' '$2=="PASS"' target/oracle/recordings/golden/ledger.tsv | wc -l | tr -d ' ')
          want=$(python3 -c 'import json;print(json.load(open("target/oracle/recordings/golden/meta.json"))["recorded"])')
          echo "committed golden: ${pass} PASS rows, meta.json records ${want}"
          [ "$pass" -gt 0 ] || { echo "::error::the committed golden carries no PASS rows — the replay below would be vacuously green"; exit 1; }
          [ "$pass" = "$want" ] || { echo "::error::the committed golden's ledger has ${pass} PASS rows but meta.json records ${want}; the checked-in recording is not whole"; exit 1; }
      - name: Record the candidate
        run: |
          set -euo pipefail
          rm -rf target/oracle/recordings/candidate; mkdir -p target/oracle/recordings/candidate
          ./bin/oracle record --bin target/release/busbar --plane all --out target/oracle/recordings/candidate
      - name: Replay — candidate vs golden (0 divergences, gaps named)
        run: ./bin/oracle replay --golden target/oracle/recordings/golden --candidate target/oracle/recordings/candidate --out target/oracle/reports/ci
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-oracle-report
          path: |
            target/oracle/reports/ci/report.md
            target/oracle/reports/ci/report.json
            target/oracle/reports/ci/diverging.txt
            target/oracle/reports/ci/owed-gaps.txt
            target/oracle/reports/ci/ledger.tsv
          if-no-files-found: warn
      # THE HEAD RECORDING, HANDED ON. The `llm-conformance` job below judges the SAME candidate
      # recording this job just made against the providers' published specs, so it is uploaded here
      # rather than re-recorded there (a second recording would need a second release build and
      # could disagree with the one the oracle diffed). `if: always()` so a replay divergence above
      # does not withhold the recording: "differs from 1.5.5" and "violates the spec" are two
      # independent facts about the commit.
      #
      # THE PATH LIST IS AN ALLOW-LIST, and that is a secrets decision, not tidiness. `raw/` is the
      # PRE-NORMALISATION forensic tree: it holds the bodies exactly as they came off the wire, the
      # per-cell working directories (config.yaml with the generated signing key, the admin token),
      # the script-cell logs, and the admin key-mint responses whose `.token` is a live `bbk_…`
      # virtual key. Uploading that whole tree published minted key material to an artifact any
      # reader of the run can download, for seven days, on every commit. Normalisation is what
      # strips those; `cells/` is the post-normalisation view and is safe by construction.
      #
      # It cannot simply be dropped, though: testing/llm-conformance/validate.py PREFERS the raw
      # wire bytes over the normalized cell (Recording.response_bytes -> raw/body, plus raw/headers
      # and raw/request.body), because judging a normalized body against a vendor schema judges the
      # normalizer. Excluding raw/ outright would silently downgrade the conformance verdict to the
      # normalized view rather than the wire. So exactly the three files it reads are carried, and
      # only for `llm__` cells — the only ones it opens. Everything else in raw/, including every
      # admin-plane cell, stays on the runner.
      - name: Upload the candidate recording (consumed by llm-conformance)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-oracle-candidate-recording
          path: |
            target/oracle/recordings/candidate/cells
            target/oracle/recordings/candidate/ledger.tsv
            target/oracle/recordings/candidate/meta.json
            target/oracle/recordings/candidate/raw/llm__*/body
            target/oracle/recordings/candidate/raw/llm__*/headers
            target/oracle/recordings/candidate/raw/llm__*/request.body
          if-no-files-found: warn
          retention-days: 7

  # LLM SPEC CONFORMANCE — the LLM plane held to the providers' PUBLISHED, machine-readable specs
  # (OpenAI, Anthropic, Google, AWS Bedrock, Cohere), the way mcp-conformance and a2a-tck hold the
  # other two planes to theirs. Before this, the LLM plane was only ever compared with busbar itself
  # (goldens, hand-derived field lists); this compares it with the wire the vendor documents. FAST
  # tier: it reads the candidate recording the shadow-oracle job uploads (no toolchain, no build
  # here), and it is RED on any schema violation, any owed row missing, or zero rows.
  #
  # The specs are NOT in the repository; testing/llm-conformance/spec-digests.tsv pins them by URL
  # and sha256 and vendor.sh refuses a mismatch. The cache is keyed on that digest file alone, so a
  # re-pin is the only thing that invalidates it and every other run is offline.
  #
  # `--out` IS DELIBERATELY NOT PASSED. The shared verdict (testing/fleet-fixtures/verdict.sh) changes
  # directory before it reads the ledger, so a RELATIVE --out makes the ledger unreadable and the run
  # reports VACUOUS (zero rows) instead of the real verdict. run.sh's default output directory is
  # absolute (target/llm-conformance/candidate under the repo), which is what the artifact upload
  # below collects.
  llm-conformance:
    name: llm spec conformance (HEAD recording vs the published provider specs)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    timeout-minutes: 20
    needs: shadow-oracle
    # Runs whether the shadow oracle passed or FAILED (a replay divergence must not hide a spec
    # verdict), but not when the run was cancelled. If the oracle died before it recorded, the
    # download step below fails and names the missing artifact — a red with a reason, not a skip.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Download the candidate recording (made by shadow-oracle on this commit)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shadow-oracle-candidate-recording
          path: target/oracle/recordings/candidate
      - name: The recording is real (a ledger with rows, not an empty download)
        run: |
          set -euo pipefail
          led=target/oracle/recordings/candidate/ledger.tsv
          [ -s "$led" ] || { echo "::error::no candidate ledger at $led — the shadow-oracle job did not record HEAD"; exit 1; }
          echo "candidate recording: $(wc -l <"$led" | tr -d ' ') ledger rows"
      - name: Cache the provider specs (by pinned digest; a re-pin is the only invalidation)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/busbar-llm-specs
          key: llm-specs-${{ hashFiles('testing/llm-conformance/spec-digests.tsv') }}
      # PyYAML is needed the FIRST time the two YAML specs (openai, cohere) are parsed; after that the
      # parsed document is cached as JSON beside the spec. Pinned, so the parse that defines
      # "conformant" cannot move because a parser release did.
      - name: PyYAML (pinned) for the first parse of the YAML specs
        run: python3 -c "import yaml" 2>/dev/null || pip install --quiet 'pyyaml==6.0.2'
      # THE PINNED TOOL, INSTALLED THE SAME WAY THE SHADOW ORACLE INSTALLS IT. validate.py rebuilds a
      # request body from the tool's build-request.py for any cell whose recording lacks
      # raw/<cell>/request.body. The tool is a separate product now, so it is fetched through
      # testing/shadow-oracle/oracle.pin (tag + sha256, refused on a mismatch) rather than read from
      # this tree. Python-only — no Rust toolchain, so this job stays in the fast tier.
      - name: Install the pinned oracle tool (build-request.py, for cells with no recorded request)
        run: ./bin/oracle tool-dir
      - name: LLM spec conformance self-test (the rig cannot pass vacuously)
        run: bash testing/llm-conformance/selftest.sh
      - name: LLM spec conformance — HEAD recording vs the published specs
        run: bash testing/llm-conformance/run.sh --recording target/oracle/recordings/candidate
      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-conformance-report
          path: target/llm-conformance/
          if-no-files-found: warn

  # THE CONSTRUCTION GATE — measures how the tree is BUILT against docs/design/ARCHITECTURE.md with
  # the ceilings in qa/construction.toml (one function sends the upstream attempt, request-path
  # functions stay readable, planes reach the kernel through the ABI only, every installable seam is
  # installed, the neutral crates know no dialect, one request terminal). Pure bash + stdlib python:
  # FAST tier, no toolchain. Self-test FIRST — every rule must prove it sees its own planted
  # violation before its verdict on the tree is believed.
  #
  # BLOCKING, ON ITS POSTURE. This job used to be `continue-on-error: true` AND excluded from the
  # umbrella's RESULTS — two of the four independent downgrades that between them meant a construction
  # FAIL, or a timeout-cancellation, could not redden anything. The reason given was real (the gate
  # is RED on HEAD by design while the work it measures is in flight) but the remedy threw away the
  # signal along with the noise: a NEW red was indistinguishable from the standing ones.
  #
  # `cargo xtask gate construction --posture` is the third answer. It exits 0 while the gate is red
  # on exactly the rows `gates::REPORT_ONLY` names and nothing else, and 1 the moment a row appears
  # that the list does not name — or a named row goes green and the list has gone stale. So the job
  # blocks, the standing work does not block it, and draining a row is a diff somebody reads.
  # THE FLIP IS DONE. What remains is to empty CONSTRUCTION_STANDING_REDS, one row at a time.
  # TELLER STEPS — tracker H2's claim in executable form: "conformance rigs carry one cell per Teller
  # step per plane". Three assertions, each doing something the other two cannot:
  #   1. --selftest  the matrix LOADER refuses a matrix that lies — root evidence borrowed from
  #      another leg's file, a root verdict carrying a label instead of an argument, a plane no root
  #      leg answers to, a leg that proves zero steps over the loop.
  #   2. --check     every GATING plane x step cell in qa/teller-steps.json names a real scenario and
  #      not "none". This reads the JSON.
  #   3. --root-legs the part that reads nothing and PROVES something: it builds the binary crate with
  #      all five root legs on (root-admin,root-mcp,root-a2a,root-voice,root-llm) and EXECUTES every
  #      named root-leg cell. A matrix can only be verified against cells that run; verified against
  #      itself it is a spreadsheet.
  # All three were run by scripts/verify-1.6.0-done.sh alone — the release-time DONE claim — so a cell
  # that stopped executing would have stayed invisible until a release was being cut. Wired here so it
  #   4. --root-legs-gating  the shipped-leg bar: a `root-*` feature in the manifest's own `default`
  #      line is the SHIPPED path for its plane, so a GATING step that no cell drives over that leg
  #      is a half-answer, not a queue entry. It is a different question from --root-legs (which
  #      asks whether the cells the matrix names still execute) and it was WIRED NOWHERE: the arm
  #      was implemented, tested, documented as "a real fourth arm", and called by no job, no
  #      segment and no script. An arm nobody runs is an arm whose red nobody sees, which is the
  #      same as not having written it. It is wired here, where its two inputs — the matrix and the
  #      manifest's `default` line — are both already checked out and neither costs a build.
  # (The runner REFUSES an unknown flag with exit 2; the Python it replaced fell through into its
  # default path, so a mistyped arm ran a check nobody asked for and reported green for it.)
  teller-steps:
    name: teller steps (one cell per Teller step per plane, and the cells RUN)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    timeout-minutes: 30
    # FULL TIER. --root-legs compiles the binary crate under a feature combination no other job
    # builds, so it cannot ride a warm cache from the `check` job; it runs on every pull request, on
    # dev/qa/main and on workflow_dispatch, not on every branch push. See the tier note at the top.
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the gate runner once
        run: cargo build -p xtask --locked
      - name: Teller-steps self-test (a lying matrix is refused)
        run: cargo xtask gate teller-steps --selftest
      - name: Teller-steps matrix (BLOCKING — every gating plane x step cell names a real scenario)
        run: cargo xtask gate teller-steps
      # Ordered before the expensive arm on purpose: it reads two files and costs nothing, so a
      # shipped leg with an undriven gating step reddens in seconds rather than after a full
      # five-feature build of the binary crate.
      - name: The shipped root legs owe every gating step a cell over the loop
        run: cargo xtask teller-steps --root-legs-gating

      - name: Every root-leg step cell RUNS and passes (all five root legs compiled in)
        run: cargo xtask teller-steps --root-legs

  construction-gate:
    name: construction gate (how the tree is built vs ARCHITECTURE.md — BLOCKING, on its posture)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    timeout-minutes: 15
    # `continue-on-error: true` IS GONE, AND SO IS THE REASON FOR IT. It was here because the gate
    # is RED BY DESIGN on HEAD and the only two answers available were "green" and "red", neither of
    # which was true. `--posture` is the third: green while the gate is red on exactly the rows
    # `gates::REPORT_ONLY` names, red the instant a row it does not name goes red — or a named row
    # goes green and the list is stale. So this job can block without blocking on the standing work.
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # THE `ceiling-rose` ROW READS HISTORY. It compares every integer in qa/construction.toml
          # and qa/kind-isolation.toml against the same integer at this branch's base, which it
          # resolves as the merge-base with the integration line (or HEAD~1 where that is HEAD). A
          # shallow clone has neither, and the row is RED when it cannot establish a base — a
          # ratchet that switches itself off on the runner where it is cheapest to switch off is not
          # a ratchet. So the history is fetched.
          fetch-depth: 0
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Construction gate self-test (every rule proves it sees its planted violation)
        # THE HANG CEILING IS A CEILING, NOT A BUDGET, AND THIS SELF-TEST IS LEGITIMATELY LONG.
        # `gates::DEFAULT_GATE_CEILING` is 300s, which is the right number for a gate RUN and the
        # wrong one for a self-test that plants thirty-two trees and runs the whole gate over each:
        # 394s measured on a warm laptop, and a cold CI runner is slower. The ceiling is raised
        # for THIS GATE ONLY, so a hang anywhere else still costs five minutes and a red row. The
        # cost itself is measured and ratcheted by that gate's own work-unit budget
        # (`gates::SELFTEST_BUDGETS`), which is the instrument that notices it growing.
        env:
          XTASK_GATE_CEILING_SECS_CONSTRUCTION: "1800"
        run: cargo xtask gate construction --selftest
      - name: Construction gate (BLOCKING on its posture — a NEW red fails this job)
        id: check
        run: |
          set -uo pipefail
          mkdir -p target/construction
          # 2>&1: --posture names the NEW or STALE rows on stderr, and those lines are the whole
          # point of the report when this job fails.
          cargo xtask gate construction --posture 2>&1 | tee target/construction/report.md; rc="${PIPESTATUS[0]}"
          echo "$rc" > target/construction/rc
          exit "$rc"
      - name: Name the verdict for the umbrella
        id: verdict
        if: always()
        run: |
          set -u
          rc="$(cat target/construction/rc 2>/dev/null || echo unknown)"
          if [ "$rc" = "0" ]; then v=green; elif [ "$rc" = "unknown" ]; then v=did-not-run; else v=red; fi
          echo "verdict=$v" >> "$GITHUB_OUTPUT"
          echo "construction gate verdict: $v (exit $rc)"
          if [ -f target/construction/report.md ]; then
            { echo "## Construction gate: $v"; echo; cat target/construction/report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the construction report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: construction-report
          path: target/construction/report.md
          if-no-files-found: warn

  # DESIGN BINDINGS — "is what we built compliant with what we designed?" qa/design-bindings.json maps
  # every ARCHITECTURE.md Appendix B binding to the checks that prove it (tests, oracle cells, lints,
  # gates). Two things are asserted here, no toolchain needed (stdlib python + bash):
  #   1. EXISTENCE (the plain run): every referenced check still exists in the tree. A vanished
  #      test or cell is RED. An UNMAPPED binding is a named gap — listed, not red, and only a gap
  #      the committed ledger already records may skip; the strict form that makes any gap red is
  #      `--strict`, which scripts/verify-1.6.0-done.sh runs as the DONE claim.
  #   2. REGEN-CLEAN: the committed qa/design-bindings.json + qa/DESIGN-BINDINGS.md are what the
  #      gate derives from Appendix B today. Same class as the openapi, config-schema and inventory
  #      drift guards: a hand-edit that skips the regen lands a stale generated artifact. This used
  #      to be a second step that regenerated into target/ and diffed; it is now the owed ledger row
  #      `design-bindings:regen-clean`, reconciled with every other row rather than folded into an
  #      exit code no ledger names. Regenerate with `cargo xtask gate design-bindings --write`.
  # Self-test FIRST, as everywhere else in this file.
  design-bindings:
    name: design bindings (every Appendix B binding proven by a check that exists · regen-clean)
    runs-on: [self-hosted, linux, x64, busbar-xl]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Design bindings self-test (the gate proves itself before it judges the tree)
        run: cargo xtask gate design-bindings --selftest
      - name: Design bindings (existence; unmapped bindings listed as named gaps; regen-clean)
        run: cargo xtask gate design-bindings

  ship-ready:
    name: ship-ready
    # THE SHIP CRITERION, AS A CHECK RATHER THAN A CHECKLIST. The criterion used to be prose in a
    # design document — the ship twin is zero everywhere, no ceiling carries slack, no ceiling rose,
    # nothing is standing red, the mutation job caught everything — and nothing in the repository
    # could tell whether any line of it was true. `cargo xtask gate ship-ready` is those five lines
    # as five rows that can each go red on their own.
    #
    # IT IS RED ON THIS LINE, ON PURPOSE, AND THAT IS WHY IT IS NOT IN THE UMBRELLA'S `needs`. The
    # integration line is not the ship SHA: the twin is red on HEAD by design and the standing-red
    # list is not empty. A criterion that is only interesting at promotion time belongs to the
    # promotion, so this job is a REQUIRED CHECK on `qa` and `main` directly — see
    # scripts/ci-branch-protection.sh, which is what makes it blocking there — and it reports here
    # so that a branch can see, before it asks to be promoted, exactly what a promotion would refuse.
    #
    # `continue-on-error` is deliberately ABSENT. The job's own result is the signal branch
    # protection reads; softening it here would make the required check unable to fail.
    runs-on: [self-hosted, linux, x64, busbar-xl]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fetch the line the branch is measured against
        # `ceiling-rose` and the mutation verdict are both measured against the merge-base with it.
        run: |
          git fetch --no-tags --quiet origin \
            +refs/heads/integration/oracle-phase0:refs/remotes/origin/integration/oracle-phase0
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target"
          key: xtask
      - name: Build the gate runner once
        run: cargo build -p xtask --locked
      - name: Ship-ready self-test
        env:
          XTASK_GATE_CEILING_SECS_SHIP_READY: "1800"
        run: cargo xtask gate ship-ready --selftest
      - name: Ship-ready gate
        env:
          # The posture the rows are judged under. On a promotion branch this is the branch itself,
          # which is what makes the standing-red row bite exactly where a promotion happens.
          XTASK_SHIP_TARGET: ${{ github.ref_name }}
          XTASK_GATE_CEILING_SECS_SHIP_READY: "1800"
          # `ship-ready:gate-mutants` reads the mutation verdict from the checks API, because a
          # verdict carried in the tree is a verdict the person being gated can write.
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask gate ship-ready

  ci-umbrella:
    name: ci umbrella
    if: always()
    needs:
      - gate-tier
      - structure-lint
      - check
      - openapi-schema
      - migration-corpus
      - config-stability
      - generated-artifact-drift
      - public-hygiene
      - service-image-pins
      - executable-config-lint
      - no-default-features
      - deletion-test-matrix
      - feature-sets
      - no-plugins-gate
      - txn-guards
      - timing
      - windows
      - perf-build-gate
      - shadow-oracle
      - llm-conformance
      - design-bindings
      - teller-steps
      - construction-gate
    # ── THE JOBS DELIBERATELY OUTSIDE THIS LIST ───────────────────────────────────────────────────
    # scripts/ci-umbrella-lint.py reads these two lines and requires that EVERY job in this file is
    # either in `needs` above or named here with a reason. `deletion-test-matrix` -- an enforcement
    # gate running on every pull request -- was missing from `needs` for its whole life, which meant
    # a red there reported GREEN on the one required check. Omission is now impossible; deliberate
    # exclusion is possible, in writing.
    # non-gating: coverage -- a REPORTING job (it uploads to Codecov and asserts no threshold here);
    #   coverage policy is enforced by codecov.yml on the PR, not by this workflow's required check.
    # non-gating: ship-ready -- the SHIP criterion, and the integration line is not the ship SHA.
    #   Its rows are claims about a tree that is ready to promote (the kind-isolation ship twin at
    #   zero, every ceiling equal to its measurement, nothing standing red, the mutation job green)
    #   and this line is deliberately none of those yet. It is a REQUIRED CHECK on qa and main
    #   directly -- scripts/ci-branch-protection.sh -- so that it blocks exactly the event it is
    #   about; putting it in this list would make every dev push red for being dev.
    # non-gating: proof-manifest -- publishes the Build Proof Dashboard on dev/qa/main only. By its
    #   own contract it CHANGES NO GATE, it records verdicts other jobs produced; a manifest refresh
    #   must never be able to gate a promotion.
    runs-on: [self-hosted, linux, x64, busbar-xl]
    timeout-minutes: 5
    env:
      # Report-only: printed, never counted. Flip condition is on the construction-gate job.
      CONSTRUCTION_VERDICT: ${{ needs.construction-gate.outputs.verdict }}
      CONSTRUCTION_RESULT: ${{ needs.construction-gate.result }}
      # 'true' on any run where the full tier is expected to execute: every event except a push,
      # plus pushes to the three promotion branches. Mirrors the `if:` on the full-tier jobs above,
      # so "expected to run" and "required to have run" cannot drift apart.
      FULL_TIER: ${{ (github.event_name != 'push') || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref) }}
      # jobkey|tier|result — tier is 'fast' (always runs) or 'full' (skips on a fast-tier push).
      # EVERY LINE IN THIS BLOCK IS DATA. `ci-umbrella:results-row-shape` parses each one and a row
      # it cannot split scores nothing, so a comment belongs here and not inside the block.
      #
      # `construction-gate` is COUNTED as of 2026-09-09. It was in `needs` and out of this list,
      # which meant a FAIL — or a timeout-cancellation — could never redden the umbrella; together
      # with the job's `continue-on-error` that was two of the four independent downgrades sitting on
      # that one gate. The job runs `--posture`, so it is green while the gate is red on exactly its
      # named standing rows and red the moment a NEW row goes red. Scoring it here is what makes
      # that distinction mean anything.
      RESULTS: |
        gate-tier|fast|${{ needs.gate-tier.result }}
        structure-lint|fast|${{ needs.structure-lint.result }}
        check|fast|${{ needs.check.result }}
        config-stability|fast|${{ needs.config-stability.result }}
        generated-artifact-drift|fast|${{ needs.generated-artifact-drift.result }}
        public-hygiene|fast|${{ needs.public-hygiene.result }}
        service-image-pins|fast|${{ needs.service-image-pins.result }}
        shadow-oracle|fast|${{ needs.shadow-oracle.result }}
        llm-conformance|fast|${{ needs.llm-conformance.result }}
        design-bindings|fast|${{ needs.design-bindings.result }}
        openapi-schema|full|${{ needs.openapi-schema.result }}
        migration-corpus|full|${{ needs.migration-corpus.result }}
        executable-config-lint|full|${{ needs.executable-config-lint.result }}
        no-default-features|full|${{ needs.no-default-features.result }}
        deletion-test-matrix|full|${{ needs.deletion-test-matrix.result }}
        feature-sets|fast|${{ needs.feature-sets.result }}
        no-plugins-gate|full|${{ needs.no-plugins-gate.result }}
        txn-guards|full|${{ needs.txn-guards.result }}
        timing|full|${{ needs.timing.result }}
        windows|full|${{ needs.windows.result }}
        perf-build-gate|full|${{ needs.perf-build-gate.result }}
        teller-steps|full|${{ needs.teller-steps.result }}
        construction-gate|fast|${{ needs.construction-gate.result }}
    steps:
      # THE COMPILER CACHE — see "COMPILER CACHE (sccache)" at the top of this file. Installed in
      # EVERY job, including the ones that run no cargo today, because `RUSTC_WRAPPER` is set for
      # the whole workflow: a job that grows a `cargo` line later must not red on a missing wrapper.
      - name: Compiler cache (sccache, GitHub Actions cache backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Assert every required job reported green (skip-allowlist only on a fast-tier run)
        run: |
          set -u
          fails=0
          if [ "$FULL_TIER" = "true" ]; then
            echo "ci umbrella — FULL tier: every job must have run and passed."
          else
            echo "ci umbrella — fast tier: full-tier-only jobs may be skipped; fast-tier jobs must pass."
          fi
          while IFS='|' read -r job tier result; do
            [ -n "$job" ] || continue
            if [ "$result" = "success" ]; then
              status="OK"
            elif [ "$result" = "skipped" ] && [ "$tier" = "full" ] && [ "$FULL_TIER" != "true" ]; then
              status="skipped (full-tier job on a fast-tier run — allowed)"
            else
              status="RED (${result})"
              fails=$((fails + 1))
            fi
            printf '  %-24s %s\n' "$job" "$status"
          done <<< "$RESULTS"
          # The construction gate is SCORED in RESULTS above, like every other job. This line is the
          # detail behind that row: `verdict` is what `--posture` decided, and a red there means a
          # row went red that the gate's standing list does not name.
          printf '  %-24s %s\n' "construction-gate" "posture verdict=${CONSTRUCTION_VERDICT:-unset} (job result ${CONSTRUCTION_RESULT:-unset}; SCORED)"
          if [ "$fails" -ne 0 ]; then
            echo "::error::ci umbrella: RED — ${fails} required job(s) did not pass on this ref."
            echo "::error::A skipped, failed, or cancelled required job is NOT a pass. DO NOT PROMOTE."
            exit 1
          fi
          echo "ci umbrella: GREEN"
