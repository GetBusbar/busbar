name: Verify deploy

# INDEPENDENT post-deploy verifier. release.yml and docker.yml each report their OWN step success —
# neither one proves the release actually shipped end-to-end as a user would experience it. This
# workflow re-derives the truth from the outside, straight from the same sources a user/build would
# hit, and fails loud (non-zero exit, one echoed PASS/FAIL line per check) if anything is off.
#
# The bug this exists to catch: hub.docker.com's tags/search API (and by extension anything that
# trusts it) can lag hours behind a real push. The OCI REGISTRY (registry-1.docker.io) is updated
# synchronously and is what `docker pull` actually reads — so every registry assertion here goes
# straight at registry-1.docker.io / ghcr.io's Distribution API, never hub.docker.com's index.
#
# Checks (each independently PASS/FAIL, ANY failure -> exit 1):
#   (a) registry-1.docker.io has the vX.Y.Z tag, AND `latest` resolves to the SAME manifest digest
#       as vX.Y.Z (i.e. `latest` was actually retagged onto the new release, not left stale).
#   (b) ghcr.io/getbusbar/busbar:vX.Y.Z resolves to the SAME digest as the Docker Hub version tag
#       (docker.yml copies the manifest cross-registry; they must be byte-for-byte the same image).
#   (c) the GitHub Release vX.Y.Z exists and carries every expected asset (5 platform tarballs/zip,
#       the CycloneDX SBOM, the OpenAPI document) — and each one is a plausible SIZE and actually
#       DOWNLOADABLE, not merely a name in the asset list (an empty/truncated upload lists the same
#       as a good one, and only 2 of the 7 assets are exercised by (h)/(j)).
#   (d) the actually-running image's `org.opencontainers.image.version` OCI label equals the
#       version (pull the real image and inspect it — not just trust the tag name).
#   (e) terraform-provider-busbar is published + independently versioned on registry.terraform.io.
#       MIXED-MODEL: the provider is a wrapper — it keeps its OWN semver (v0.x) and does NOT mirror
#       busbar's version, and only re-releases when its generated surface changes (so a busbar
#       release may ship no new provider version). We assert the provider listing exists (>=1
#       published version), NOT that it equals busbar's version. Re-derived from the registry's own
#       public API, not from that workflow's own success report.
#   (f) GetBusbar/helm-charts has published the busbar chart with `appVersion` == the release version
#       (again, read from the published chart index, not the publishing workflow's own claim).
#   (g) getbusbar.com is actually serving the new version (the live site, not the build log), the
#       version match is ANCHORED (the old unanchored substring grep passed v1.5.2 against a page
#       advertising v1.5.20), and the page's download buttons — which are version-agnostic
#       /releases/latest/download/ links — actually resolve to the release under test.
#
# Checks (a)-(g) all verify that ARTIFACTS EXIST. None of them verified that A USER CAN INSTALL,
# and that gap let `curl -fsSL https://getbusbar.com/install.sh | sh` rot in production, unnoticed,
# with a 403 from api.github.com. Checks (h)-(l) close it by exercising the INSTALL PATHS a real
# user follows:
#   (h) install.sh end-to-end: download the LIVE script from getbusbar.com (not the repo working
#       copy — a fix that never deployed must still fail here), run it under `sh` with the
#       environment SCRUBBED of GitHub credentials, and assert the binary lands, is executable,
#       fetched providers.yaml, and reports the version under test.
#   (i) install.sh must NOT depend on api.github.com. THE TRAP: a GitHub Actions runner talks to
#       api.github.com from a different rate-limit pool than a user's laptop and often has
#       GITHUB_TOKEN in scope, so a green "it ran in CI" proves nothing. So this check asserts the
#       ABSENCE of the fragile dependency in the served script, not merely a successful run.
#   (j) Homebrew: the tap formula's version == the version under test, every platform download URL
#       is live, the published sha256 matches the real asset, and `brew install
#       getbusbar/busbar/busbar` (the documented command) resolves and installs that version.
#   (k) the site's own API endpoints (/api/stars, /api/pulls) answer 200 with numeric counts —
#       these back the live numbers on getbusbar.com and are currently unmonitored.
#   (l) the DOCUMENTED quickstart actually runs: both the binary quickstart and the docker
#       one-liner from docs/getting-started.md boot and answer on /healthz.
#   (m) `gh attestation verify <asset> --repo GetBusbar/busbar` -- the exact command the docs tell
#       users to run before trusting a download -- passes on real downloaded bytes. Previously "the
#       release is attested" meant a workflow step exited 0, never that a user could verify it.
#   (n) numbers getbusbar.com presents as LIVE actually track their authority (Docker pull count vs
#       Docker Hub, star count vs GitHub). The download page served a pull count baked into static
#       HTML at build time, beside a working Worker nothing called, so it aged until a redeploy.
#
# THE PATTERN THESE LAST TWO EXIST FOR. Three defects in the 1.5.3 release were one shape: something
# DECLARED a behaviour and nothing CHECKED it. docker.yml's comment claimed a `latest` tag its tag
# list never emitted, so `docker pull getbusbar/busbar` served 1.5.2 for the whole release. The site
# claimed a live pull count that was a build-time snapshot. A "zero broken links" claim turned out
# to be unreproducible, and there is still no link checker anywhere. Check (a) already guards the
# first of those; (n) guards the second. A claim with no assertion behind it decays invisibly, which
# is worse than not making it.
#
# Triggers:
#   - workflow_run: fires when release.yml ("Release") or docker.yml ("Docker") completes on a tag
#     push. The two run in parallel off the same tag push (tag-on-main.yml), so there is no fixed
#     ordering — each check below retries with backoff for a few minutes to ride out the race
#     instead of false-failing because the OTHER workflow hasn't finished publishing yet.
#   - workflow_dispatch: manual re-check of an already-shipped version.
#   - schedule (daily): install.sh worked on release day and broke LATER — GitHub's unauthenticated
#     rate limiting is environmental, not a property of our artifacts, so nothing about the release
#     changed when it broke. A post-release-only trigger structurally CANNOT catch that class of
#     rot. The daily run re-verifies the CURRENT latest release, so the longest a broken install
#     path can hide is ~24h instead of "until the next release, or a user complains".
#
# Timeouts: every check here talks to a THIRD-PARTY host, and a connection that is accepted but
# never answered HANGS rather than fails. Nothing used to bound that — no job timeout (so GitHub's
# 360-minute default applied) and almost no `--max-time` on curl. Now EVERY curl carries
# --max-time, the long steps carry step-level `timeout-minutes` so a hang names the check that hung
# instead of just killing the job, and the job carries an overall `timeout-minutes: 60`. This
# matters more on the daily schedule than on release: a 6-hour hung run would still be "in
# progress" when the next day's run fires.
#
# WHEN THIS RUNS, AND THE HOLE THAT WAS IN IT. The `workflow_run` trigger below is gated on the
# triggering run having SUCCEEDED. During the 1.5.3 release the Release workflow FAILED (two of five
# build legs died), so this verifier never ran at all -- on precisely the release that most needed
# verifying. Every defect it exists to catch was then found BY HAND: install.sh 404ing on Apple
# Silicon, two dead links on the live /download/ page, `docker pull getbusbar/busbar` serving the
# previous version. A verifier that only runs when the build already went well is not a verifier.
#
# THE `workflow_run` DEFAULT-BRANCH TRAP, AND WHY THIS FILE DOES NOT NEED A DISPATCHER.
# `workflow_run` ALWAYS loads the workflow YAML from the repository's DEFAULT BRANCH, whatever
# branch the triggering run was on. That bit qa-gate.yml hard: `main` was over a hundred commits
# behind, so every auto-fired gate ran stale logic, and the repair was to rewrite it as a thin
# DISPATCHER that checks out the triggering SHA and runs the gate scripts from THAT checkout.
#
# This workflow is structurally IMMUNE to the same trap, and the reason is worth stating so nobody
# has to re-derive it or "fix" it by adding a checkout:
#   * It has ZERO `uses:` steps, therefore NO `actions/checkout` at all, therefore no working copy
#     that could be stale. That is deliberate, and check (h) depends on it: reading ./install.sh
#     from a checkout would hide a fix that merged but never deployed.
#   * It reads NO repository file. Every path it touches is either created on the runner (the
#     digest helper, the quickstart config, both written inline here) or fetched over HTTPS. The one
#     repository file it consults, .github/release-targets.json, is fetched from raw.githubusercontent
#     AT THE TAG UNDER TEST, not read from a checkout, precisely so it tracks the release rather
#     than the default branch.
#   * The VERSION under test comes from the event payload (`release.tag_name` /
#     `workflow_run.head_branch`) or, on the schedule, from the live /releases/latest redirect. It
#     never comes from crates/busbar/Cargo.toml, so a stale default branch cannot make it verify the
#     wrong version.
# So the only thing loaded from `main` is this file's own text, and this file's own text has no
# repo-state dependency to go stale against. A dispatcher would add a checkout whose entire purpose
# is to be read, in a workflow whose entire purpose is to read nothing local.
#
# So `release: [published]` is now a trigger in its own right. `create-release` publishes the Release
# object BEFORE the build matrix runs, and that event fires regardless of what the rest of the run
# does, which is exactly the property needed: if a release object exists in public, it gets verified,
# whether or not the workflow that made it finished happy.
on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release", "Docker"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify (e.g. 1.5.2, no leading v)"
        required: true
  schedule:
    # 13:17 UTC daily. Off the top of the hour on purpose: :00 cron slots are the most contended on
    # GitHub's shared scheduler and get delayed the most, and mid-day UTC lands in working hours for
    # both EU and US-East so a red rot alert is seen the day it fires, not the next morning.
    - cron: "17 13 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Every check below talks to a THIRD-PARTY host (registry-1.docker.io, ghcr.io,
    # registry.terraform.io, getbusbar.github.io, getbusbar.com, raw.githubusercontent.com). A TCP
    # connect that is accepted and then never answered does not fail — it hangs, and with no job
    # timeout GitHub's 360-minute default applies: a stalled registry would burn six hours of runner
    # time and, on the daily schedule, still be "in progress" when the NEXT day's run starts.
    # Budget: the retry loops are the floor — (a) runs two 20x15s loops (~10m) and (b)(c)(e)(f)(g)(j)
    # one each (~5m), plus image pulls, the brew install and the two quickstart boots. ~45m worst
    # case when things are merely slow, so 60 leaves headroom without hiding a true hang.
    timeout-minutes: 60
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'release' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    env:
      DOCKERHUB_IMAGE: getbusbar/busbar
      GHCR_IMAGE: ghcr.io/getbusbar/busbar
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve version under test
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # ROT CHECK: no tag in hand, so resolve "the current latest release" the way an
            # unauthenticated user's shell would — the plain HTTP 302 on github.com's
            # /releases/latest, which needs no token and is not rate-limited the way the API is.
            # Deliberately NOT api.github.com: that is the exact dependency check (i) forbids in
            # install.sh, and using it here would make this workflow's own version resolution the
            # first thing to 403 and silently mis-verify.
            loc="$(curl -fsS --max-time 30 -o /dev/null -w '%{redirect_url}' \
              "https://github.com/GetBusbar/busbar/releases/latest" || true)"
            case "$loc" in
              */releases/tag/v*) V="${loc##*/releases/tag/v}" ;;
              *)
                echo "::error::could not resolve the latest release from github.com/GetBusbar/busbar/releases/latest (redirect was '${loc:-<none>}'). Fix: confirm a non-draft, non-prerelease Release exists and that the /releases/latest 302 still points at /releases/tag/vX.Y.Z."
                exit 1
                ;;
            esac
          elif [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
            V="${V#v}"
          else
            V="${{ github.event.workflow_run.head_branch }}"
            V="${V#v}"
          fi
          echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::not a plain X.Y.Z version: '$V'"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Verifying busbar v$V"

      - name: Registry token + digest helpers
        id: helpers
        run: |
          cat > /tmp/reg-digest.sh <<'SH'
          #!/usr/bin/env bash
          # reg-digest.sh <auth-host> <registry-host> <repo> <tag>
          # Anon pull-token flow (works identically against auth.docker.io and ghcr.io's token
          # endpoint) -> HEAD the manifest -> print the Docker-Content-Digest response header.
          set -euo pipefail
          auth_host="$1"; reg_host="$2"; repo="$3"; tag="$4"
          if [ "$auth_host" = "auth.docker.io" ]; then
            token_url="https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull"
          else
            token_url="https://${auth_host}/token?service=${auth_host}&scope=repository:${repo}:pull"
          fi
          # --max-time on BOTH calls: this helper runs inside 20-iteration retry loops, so a hang
          # here is a hang of the whole job. Bounded failure is what makes the retry loop work at
          # all — an unbounded curl never returns to be retried.
          token="$(curl -fsS --max-time 30 "$token_url" | jq -r '.token // .access_token')"
          [ -n "$token" ] && [ "$token" != "null" ] || { echo "no token from $token_url" >&2; exit 1; }
          accept='application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json'
          curl -fsS --max-time 30 -I \
            -H "Authorization: Bearer $token" \
            -H "Accept: $accept" \
            "https://${reg_host}/v2/${repo}/manifests/${tag}" \
          | tr -d '\r' | grep -i '^docker-content-digest:' | awk '{print $2}'
          SH
          chmod +x /tmp/reg-digest.sh

      - name: "(a) registry-1.docker.io: version tag exists, latest == same digest"
        id: dockerhub
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          fail=0
          ver_digest="" latest_digest=""
          for i in $(seq 1 20); do
            ver_digest="$(/tmp/reg-digest.sh auth.docker.io registry-1.docker.io "$DOCKERHUB_IMAGE" "$V" || true)"
            [ -n "$ver_digest" ] && break
            echo "  ...docker.io:${V} not resolvable yet (attempt $i/20), retrying in 15s"
            sleep 15
          done
          if [ -n "$ver_digest" ]; then
            echo "PASS: registry-1.docker.io ${DOCKERHUB_IMAGE}:${V} resolves ($ver_digest)"
          else
            echo "FAIL: registry-1.docker.io ${DOCKERHUB_IMAGE}:${V} did not resolve after retries"
            fail=1
          fi
          for i in $(seq 1 20); do
            latest_digest="$(/tmp/reg-digest.sh auth.docker.io registry-1.docker.io "$DOCKERHUB_IMAGE" latest || true)"
            [ -n "$latest_digest" ] && [ "$latest_digest" = "$ver_digest" ] && break
            echo "  ...docker.io:latest not yet == :${V} digest (attempt $i/20), retrying in 15s"
            sleep 15
          done
          if [ -n "$latest_digest" ] && [ "$latest_digest" = "$ver_digest" ]; then
            echo "PASS: registry-1.docker.io ${DOCKERHUB_IMAGE}:latest digest == :${V} digest ($latest_digest)"
          else
            echo "FAIL: registry-1.docker.io ${DOCKERHUB_IMAGE}:latest digest ($latest_digest) != :${V} digest ($ver_digest)"
            fail=1
          fi
          echo "ver_digest=$ver_digest" >> "$GITHUB_OUTPUT"
          [ "$fail" = 0 ]

      - name: "(b) ghcr.io carries the SAME digest as the Docker Hub version tag"
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          want="${{ steps.dockerhub.outputs.ver_digest }}"
          ghcr_digest=""
          for i in $(seq 1 20); do
            ghcr_digest="$(/tmp/reg-digest.sh ghcr.io ghcr.io "getbusbar/busbar" "$V" || true)"
            [ -n "$ghcr_digest" ] && [ "$ghcr_digest" = "$want" ] && break
            echo "  ...ghcr.io:${V} not yet == docker.io digest (attempt $i/20), retrying in 15s"
            sleep 15
          done
          if [ -n "$ghcr_digest" ] && [ "$ghcr_digest" = "$want" ]; then
            echo "PASS: ghcr.io/getbusbar/busbar:${V} digest == Docker Hub digest ($ghcr_digest)"
          else
            echo "FAIL: ghcr.io/getbusbar/busbar:${V} digest ($ghcr_digest) != Docker Hub digest ($want)"
            exit 1
          fi

      - name: "(c) GitHub Release vX.Y.Z exists with expected assets"
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          fail=0
          got=""
          for i in $(seq 1 20); do
            got="$(gh release view "$TAG" --repo GetBusbar/busbar --json assets --jq '.assets[].name' 2>/dev/null || true)"
            [ -n "$got" ] && break
            echo "  ...Release ${TAG} not found yet (attempt $i/20), retrying in 15s"
            sleep 15
          done
          if [ -z "$got" ]; then
            echo "FAIL: GitHub Release ${TAG} does not exist (or has no assets) after retries"
            exit 1
          fi
          echo "PASS: GitHub Release ${TAG} exists"
          # THE EXPECTED NAMES ARE DERIVED, NOT TYPED. This list used to be five platform names
          # written out by hand here, a second copy of the list release.yml builds from. Two copies
          # of a platform list is one place to forget a platform, and forgetting it here means the
          # verifier cheerfully passes a release that is missing exactly the platform nobody
          # remembered. `.github/release-targets.json` is the single source of truth; release.yml's
          # `targets` job builds the upload matrix from it and this fetches the SAME file AT THE TAG
          # UNDER TEST over raw.githubusercontent, so the verifier and the release that produced the
          # assets cannot disagree about what was supposed to ship. Fetched rather than checked out
          # because this job deliberately checks nothing out.
          mani="https://raw.githubusercontent.com/GetBusbar/busbar/${TAG}/.github/release-targets.json"
          if ! curl -fsS --max-time 30 "$mani" -o /tmp/release-targets.json; then
            # Tags cut BEFORE this manifest existed do not carry it. Falling back to main's copy is
            # correct for them and honest about what it is doing: the platform set is what changes
            # rarely, so main's list is the right answer for an old tag, and the alternative
            # (hardcoding a list here) is the exact defect the manifest replaced. A release cut from
            # now on always carries its own, so the fallback quietly stops being used.
            echo "note: ${TAG} predates .github/release-targets.json; falling back to main's copy."
            if ! curl -fsS --max-time 30 \
              "https://raw.githubusercontent.com/GetBusbar/busbar/main/.github/release-targets.json" \
              -o /tmp/release-targets.json; then
              echo "FAIL: no release-target manifest at ${TAG} and none on main either."
              echo "Without it this check cannot know which platforms ${TAG} owed, and guessing is"
              echo "how a missing platform got waved through in the first place."
              exit 1
            fi
          fi
          mapfile -t expected < <(python3 - "$TAG" <<'PY'
          import json, sys
          tag = sys.argv[1]
          spec = json.load(open("/tmp/release-targets.json"))
          for t in spec["targets"]:
              print("busbar-%s.%s" % (t["target"], t["archive"]))
          for a in spec["metadata_assets"]:
              print(a.replace("{tag}", tag))
          PY
          )
          # A `mapfile` whose process substitution died leaves an EMPTY array and does not trip
          # `set -e`, so the loop below would iterate over nothing and this whole check would PASS
          # vacuously. That is the same shape as a gate that has quietly stopped gating, which is
          # the failure this check exists to prevent, so it is asserted rather than assumed. The
          # floor is 5 because busbar has never shipped fewer platform archives than that plus its
          # two metadata assets; a manifest that produced fewer means the manifest is wrong.
          if [ "${#expected[@]}" -lt 5 ]; then
            echo "FAIL: derived only ${#expected[@]} expected asset name(s) from the manifest."
            echo "Refusing to 'verify' a release against an empty or truncated expectation list:"
            echo "that passes for any release at all, including one that published nothing."
            exit 1
          fi
          echo "manifest at ${TAG} requires ${#expected[@]} asset(s): ${expected[*]}"
          # A NAME IN THE ASSET LIST IS NOT A USABLE ARTIFACT. GitHub lists an asset as soon as the
          # upload row is created, so a 0-byte or truncated upload appears here exactly like a good
          # one. install.sh (check (h)) only ever exercises the ONE tarball matching the runner's
          # platform, and Homebrew (check (j)) only the linux/x86_64 one — so the macOS, Windows and
          # metadata assets were asserted to "exist" and never once proven downloadable. Assert both
          # a plausible size and that the bytes are actually served.
          sizes="$(gh release view "$TAG" --repo GetBusbar/busbar --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"' 2>/dev/null || true)"
          for a in "${expected[@]}"; do
            if ! echo "$got" | grep -qxF "$a"; then
              echo "FAIL: Release asset MISSING: $a"
              echo "::error::(c) Release ${TAG} is missing asset ${a}. Fix: re-run release.yml — that platform's build or upload did not complete."
              fail=1
              continue
            fi
            sz="$(printf '%s\n' "$sizes" | awk -F'\t' -v n="$a" '$1==n{print $2; exit}')"
            # Binaries are multi-MB; the SBOM/OpenAPI JSON are far smaller but never near-empty.
            case "$a" in
              *.tar.gz|*.zip) min=1000000 ;;
              *)              min=1000 ;;
            esac
            if [ -z "${sz:-}" ] || [ "$sz" -lt "$min" ]; then
              echo "FAIL: Release asset ${a} is implausibly small (${sz:-<unknown>} bytes, expected >= ${min})"
              echo "::error::(c) Release ${TAG} asset ${a} is ${sz:-<unknown>} bytes — a truncated or empty upload that is listed as present but is useless to anyone who downloads it. Fix: re-run release.yml to re-upload that asset."
              fail=1
              continue
            fi
            u="https://github.com/GetBusbar/busbar/releases/download/${TAG}/${a}"
            code="$(curl -sSL --max-time 30 --range 0-0 -o /dev/null -w '%{http_code}' "$u" || echo 000)"
            case "$code" in
              200|206) echo "PASS: Release asset present, ${sz} bytes, downloadable: $a" ;;
              *)
                echo "FAIL: Release asset ${a} is listed but NOT downloadable (HTTP ${code})"
                echo "::error::(c) Release ${TAG} lists ${a} but downloading it returns HTTP ${code}. Fix: re-upload the asset on the Release."
                fail=1
                ;;
            esac
          done
          [ "$fail" = 0 ]

      - name: "(d) running image's org.opencontainers.image.version label == version"
        # `docker pull` has no built-in timeout and will sit on a stalled registry indefinitely.
        # A step-level bound fails THIS step with an unambiguous message instead of letting the
        # job-level timeout kill the run with no indication of which check hung.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          docker pull "${DOCKERHUB_IMAGE}:${V}"
          label="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${DOCKERHUB_IMAGE}:${V}")"
          if [ "$label" = "$V" ]; then
            echo "PASS: running image label org.opencontainers.image.version == ${V}"
          else
            echo "FAIL: running image label org.opencontainers.image.version == '${label}', expected '${V}'"
            exit 1
          fi

      - name: "(e) terraform-provider-busbar is published on registry.terraform.io (independent semver)"
        run: |
          set -euo pipefail
          # MIXED-MODEL distribution versioning: the Terraform provider is a WRAPPER, so it keeps
          # its OWN independent semver (its v0.x line) and records the busbar version it targets in
          # its vendored spec — it does NOT mirror busbar's version. It also only cuts a new release
          # when its generated surface actually changes, so a given busbar release may legitimately
          # ship NO new provider version at all. Asserting the registry lists a provider version
          # == busbar's version is therefore WRONG on two counts (independent line + no-op releases),
          # and was the bug that red-failed this workflow.
          #
          # The registry's public API exposes published versions + published_at but NO
          # target-busbar-version field (no docs/appVersion/.busbar-ref surfaced here), so the
          # provider's TARGET version is not cleanly queryable from the registry. We therefore drop
          # the strict "== busbar_version" equality and assert the meaningful, mixed-model-safe
          # invariant instead: the provider IS published and independently versioned on the registry
          # (>=1 version listed and the latest resolves). This still catches "the provider's registry
          # listing never published / disappeared", without false-failing on the legitimate
          # independent-semver / no-op-release case.
          V="${{ steps.ver.outputs.version }}"
          fail=1
          latest=""
          for i in $(seq 1 20); do
            # Public Terraform Registry API, no auth required. Namespace/provider match
            # GetBusbar/terraform-provider-busbar's published listing (registry.terraform.io/providers/getbusbar/busbar).
            versions_json="$(curl -fsS --max-time 30 "https://registry.terraform.io/v1/providers/getbusbar/busbar/versions" 2>/dev/null || true)"
            latest="$(printf '%s' "$versions_json" | jq -r '.versions[]?.version' 2>/dev/null | sort -V | tail -1 || true)"
            [ -n "$latest" ] && { fail=0; break; }
            echo "  ...registry.terraform.io getbusbar/busbar has no published versions yet (attempt $i/20), retrying in 15s"
            sleep 15
          done
          if [ "$fail" = 0 ]; then
            echo "PASS: registry.terraform.io provider getbusbar/busbar is published (latest independent-semver version ${latest}; busbar release under test is v${V})"
            if [ "$latest" = "$V" ]; then
              echo "NOTE: provider's own version happens to equal busbar ${V}; NOT required — provider uses independent semver."
            fi
          else
            echo "FAIL: registry.terraform.io provider getbusbar/busbar lists NO published versions after retries (distribution listing missing)"
          fi
          [ "$fail" = 0 ]

      - name: "(f) GetBusbar/helm-charts busbar chart appVersion == vX.Y.Z"
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          fail=0
          appver=""
          for i in $(seq 1 20); do
            # GetBusbar/helm-charts publishes its index via GitHub Pages (the standard Helm repo
            # layout: index.yaml at the repo's Pages root). Read appVersion straight from the
            # published index, not from helm-charts' own workflow output. Plain grep/awk (no extra
            # YAML tooling dependency): entries are newest-first under `entries.busbar`, so the
            # FIRST `appVersion:` line after the `name: busbar` block is the current release's.
            appver="$(curl -fsS --max-time 60 "https://getbusbar.github.io/helm-charts/index.yaml" 2>/dev/null \
              | awk '/^  busbar:/{f=1} f && /appVersion:/{print $2; exit}' | tr -d '"' || true)"
            [ "$appver" = "$V" ] && break
            echo "  ...helm-charts busbar appVersion not yet == ${V} (got '${appver:-<none>}', attempt $i/20), retrying in 15s"
            sleep 15
          done
          if [ "$appver" = "$V" ]; then
            echo "PASS: GetBusbar/helm-charts busbar chart appVersion == ${V}"
          else
            echo "FAIL: GetBusbar/helm-charts busbar chart appVersion == '${appver:-<none>}', expected '${V}'"
            fail=1
          fi
          [ "$fail" = 0 ]

      - name: "(g) getbusbar.com is serving vX.Y.Z, and its download buttons actually resolve"
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          fail=0
          found=0
          # WHY THE MATCH IS ANCHORED: this used to be `grep -qF "v${V}"`, an unanchored SUBSTRING
          # search. Verifying 1.5.2 against a page still advertising v1.5.20/v1.5.25 matched and
          # PASSED — the check reported "the site is serving v1.5.2" while the site showed a
          # different version entirely. Requiring a non-digit (or end of line) after the version
          # makes the assertion mean what its name says.
          for i in $(seq 1 20); do
            if curl -fsS --max-time 30 "https://getbusbar.com/download/" 2>/dev/null \
                 | grep -qE "v${V}([^0-9]|\$)"; then
              found=1
              break
            fi
            echo "  ...getbusbar.com/download/ does not yet show v${V} (attempt $i/20), retrying in 15s"
            sleep 15
          done
          if [ "$found" = 1 ]; then
            echo "PASS: getbusbar.com/download/ shows v${V}"
          else
            echo "FAIL: getbusbar.com/download/ does not show v${V} after retries"
            echo "::error::(g) getbusbar.com/download/ does not advertise v${V}. Fix: redeploy the marketing site so the download page picks up the new release."
            fail=1
          fi

          # A VERSION STRING IN THE HTML IS NOT A WORKING DOWNLOAD. The page's buttons point at
          # /releases/latest/download/<asset>, which are version-AGNOSTIC: they keep returning 200
          # for the PREVIOUS release even when the new one never published, so the text check above
          # can be green while every button hands users a stale binary — and they 404 outright if
          # the Release exists but is not flagged 'latest'. Both are user-visible breakage that
          # nothing else in this workflow covers, so resolve what the buttons actually point at.
          curl -fsS --max-time 30 "https://getbusbar.com/download/" -o /tmp/dl-page.html || {
            echo "::error::(g) could not fetch getbusbar.com/download/ to inspect its links. Fix: redeploy the marketing site."
            exit 1
          }
          # Where does /releases/latest actually land? That is what every button on the page follows.
          loc="$(curl -fsS --max-time 30 -o /dev/null -w '%{redirect_url}' \
            "https://github.com/GetBusbar/busbar/releases/latest" || true)"
          if [ "${loc##*/releases/tag/}" = "$TAG" ]; then
            echo "PASS: github.com/GetBusbar/busbar/releases/latest resolves to ${TAG}"
          else
            echo "FAIL: /releases/latest resolves to '${loc:-<none>}', expected .../releases/tag/${TAG}"
            echo "::error::(g) the download page's buttons all use /releases/latest/download/, but /releases/latest resolves to '${loc:-<none>}' rather than ${TAG}. Every download button on getbusbar.com therefore serves the WRONG version. Fix: mark Release ${TAG} as 'latest' (it is probably still a draft/prerelease)."
            fail=1
          fi
          links="$(grep -oE 'https://github\.com/GetBusbar/busbar/releases/latest/download/[A-Za-z0-9._-]+' /tmp/dl-page.html | sort -u || true)"
          if [ -z "$links" ]; then
            echo "FAIL: no /releases/latest/download/ links found on getbusbar.com/download/"
            echo "::error::(g) the download page exposes NO release download links at all. Fix: check the download page template on the marketing site."
            fail=1
          fi
          while IFS= read -r u; do
            [ -n "$u" ] || continue
            code="$(curl -sSL --max-time 30 --range 0-0 -o /dev/null -w '%{http_code}' "$u" || echo 000)"
            case "$code" in
              200|206) echo "PASS: download button resolves (${code}): ${u##*/}" ;;
              *)
                echo "FAIL: download button returned ${code}: ${u}"
                echo "::error::(g) the download button for ${u##*/} on getbusbar.com/download/ returns ${code}. Users clicking it get nothing. Fix: publish that asset on Release ${TAG}."
                fail=1
                ;;
            esac
          done <<< "$links"
          [ "$fail" = 0 ]

      # ---------------------------------------------------------------------------------------
      # (h)-(l): THE INSTALL PATHS. Everything above proves artifacts EXIST. Nothing above proves
      # a user can INSTALL. That is how `curl -fsSL https://getbusbar.com/install.sh | sh` shipped
      # broken (403 from api.github.com) with a fully green verifier.
      # ---------------------------------------------------------------------------------------

      - name: "(h) install.sh end-to-end: the live one-liner actually installs vX.Y.Z"
        # Bounds the 10-attempt install loop plus the tarball download it performs.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          fail=0

          # THE LIVE SCRIPT, not the repo working copy. A fix that is merged but never deployed to
          # getbusbar.com is still broken for every user, and reading ./install.sh from the checkout
          # would hide exactly that. (This job does not even check the repo out — on purpose.)
          rm -rf /tmp/busbar-e2e
          mkdir -p /tmp/busbar-e2e/bin
          # --max-time bounds EACH of the 5 attempts, so the worst case is bounded at ~5*30s plus
          # the 4 inter-attempt delays rather than "one attempt hangs forever and --retry never
          # gets a turn". --retry alone does not imply any per-attempt timeout.
          if ! curl -fsSL --max-time 30 --retry 5 --retry-delay 10 --retry-all-errors \
               "https://getbusbar.com/install.sh" -o /tmp/busbar-e2e/install.sh; then
            echo "::error::(h) could not fetch https://getbusbar.com/install.sh at all. The documented one-liner in the README and on the site is dead. Fix: redeploy the marketing site / restore the /install.sh route."
            exit 1
          fi
          [ -s /tmp/busbar-e2e/install.sh ] || {
            echo "::error::(h) https://getbusbar.com/install.sh served an EMPTY body. Fix: redeploy the marketing site."
            exit 1
          }
          echo "PASS: https://getbusbar.com/install.sh is served ($(wc -l < /tmp/busbar-e2e/install.sh) lines)"

          # THE TRAP THIS AVOIDS: an Actions runner reaches api.github.com from a different
          # rate-limit pool than a user's laptop, and GH_TOKEN is in this job's env (check (c) needs
          # it). Running the installer with that inherited would let a token-authenticated,
          # generously-rate-limited runner sail through the precise call that 403s for real users.
          # `env -i` starts from a COMPLETELY empty environment — stronger than
          # `env -u GITHUB_TOKEN -u GH_TOKEN` because it also strips ACTIONS_*, GITHUB_*, and any
          # future credential var nobody remembers to add to the -u list. Nothing is passed that a
          # user's shell would not have, and no auth header is supplied anywhere.
          rc=0
          for i in $(seq 1 10); do
            rm -rf /tmp/busbar-e2e/bin && mkdir -p /tmp/busbar-e2e/bin
            set +e
            env -i \
              PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              HOME="/tmp/busbar-e2e" \
              LANG="C.UTF-8" \
              BUSBAR_INSTALL_DIR="/tmp/busbar-e2e/bin" \
              sh /tmp/busbar-e2e/install.sh > /tmp/busbar-e2e/install.log 2>&1
            rc=$?
            set -e
            got=""
            if [ "$rc" = 0 ] && [ -x /tmp/busbar-e2e/bin/busbar ]; then
              got="$(/tmp/busbar-e2e/bin/busbar --version 2>/dev/null || true)"
              [ "$got" = "busbar ${V}" ] && break
            fi
            echo "  ...install.sh has not yet produced busbar ${V} (rc=$rc, --version='${got:-<none>}', attempt $i/10), retrying in 15s"
            sleep 15
          done

          echo "--- install.sh output (credential-scrubbed run) ---"
          cat /tmp/busbar-e2e/install.log || true
          echo "--------------------------------------------------"

          if [ "$rc" != 0 ]; then
            echo "FAIL: install.sh exited $rc when run WITHOUT GitHub credentials"
            echo "::error::(h) https://getbusbar.com/install.sh FAILS for an unauthenticated user (exit $rc). This is what a real user sees from \`curl -fsSL https://getbusbar.com/install.sh | sh\`. The known failure mode is a 403 from api.github.com (unauthenticated GitHub API rate limiting, which bites hardest on shared/NAT'd/CI IPs) leaving 'could not determine the latest release tag'. Fix: resolve the tag WITHOUT the GitHub API — follow the https://github.com/GetBusbar/busbar/releases/latest 302 (see check (i))."
            exit 1
          fi
          echo "PASS: install.sh exits 0 with a credential-free environment"

          if [ -f /tmp/busbar-e2e/bin/busbar ]; then
            echo "PASS: installed binary exists at \$BUSBAR_INSTALL_DIR/busbar"
          else
            echo "FAIL: install.sh exited 0 but installed NO binary at \$BUSBAR_INSTALL_DIR/busbar"
            echo "::error::(h) install.sh reported success but wrote no binary — it is failing silently. Fix: make every download/extract step in install.sh fail loudly."
            fail=1
          fi
          if [ -x /tmp/busbar-e2e/bin/busbar ]; then
            echo "PASS: installed binary is executable"
          else
            echo "FAIL: installed binary is NOT executable (mode $(stat -c '%a' /tmp/busbar-e2e/bin/busbar 2>/dev/null || echo '<missing>'))"
            echo "::error::(h) the installed busbar is not executable — the user's very next command fails with 'permission denied'. Fix: install.sh must chmod 0755 the binary."
            fail=1
          fi

          got="$(/tmp/busbar-e2e/bin/busbar --version 2>/dev/null || true)"
          if [ "$got" = "busbar ${V}" ]; then
            echo "PASS: installed \`busbar --version\` == 'busbar ${V}'"
          else
            echo "FAIL: installed \`busbar --version\` == '${got:-<none>}', expected 'busbar ${V}'"
            echo "::error::(h) the one-liner installs the WRONG version: got '${got:-<none>}', expected 'busbar ${V}'. Either the GitHub Release for v${V} is not marked 'latest' (so install.sh resolves an older tag), or the v${V} platform tarball contains a stale binary. Fix: check the Release's 'latest' flag and release.yml's artifact build."
            fail=1
          fi

          # The docs promise the installer drops providers.yaml too, and busbar will not boot
          # without it — but install.sh only WARNS if that download fails, so a user can get a
          # "success" that cannot run. Assert it.
          if [ -s /tmp/busbar-e2e/bin/providers.yaml ]; then
            echo "PASS: install.sh also fetched providers.yaml (required at runtime)"
          else
            echo "FAIL: install.sh did not fetch providers.yaml"
            echo "::error::(h) install.sh exited 0 without providers.yaml, which busbar REQUIRES at boot — the user gets a 'successful' install that cannot start. Fix: serve https://getbusbar.com/providers.yaml, and make install.sh treat that download as fatal rather than a warning."
            fail=1
          fi
          [ "$fail" = 0 ]

      - name: "(i) install.sh must NOT depend on api.github.com (the 403 that broke it)"
        run: |
          set -euo pipefail
          # WHY THIS EXISTS SEPARATELY FROM (h): (h) can pass on a runner while failing on every
          # user's laptop, because api.github.com's unauthenticated rate limit is PER SOURCE IP and
          # GitHub's own egress is not treated like a stranger's. A green run is therefore NOT
          # evidence. The only durable assertion is the ABSENCE of the fragile dependency in the
          # script we actually serve, which is IP-independent and cannot pass for the wrong reason.
          curl -fsSL --max-time 30 --retry 5 --retry-delay 10 --retry-all-errors \
            "https://getbusbar.com/install.sh" -o /tmp/busbar-installsh-live || {
              echo "::error::(i) could not fetch https://getbusbar.com/install.sh to inspect it. Fix: redeploy the marketing site."
              exit 1
            }
          [ -s /tmp/busbar-installsh-live ] || {
            echo "::error::(i) https://getbusbar.com/install.sh served an EMPTY body — nothing to inspect. Fix: redeploy the marketing site."
            exit 1
          }
          # Strip COMMENTS before matching. The correct install.sh names api.github.com in a
          # comment explaining that it is deliberately NOT used, so a naive grep fails on the
          # very version that fixes the bug. A check that goes red on the fix is worse than no
          # check: on a daily schedule it trains everyone to ignore red, which is exactly how
          # install.sh rotted in the first place.
          if sed 's/#.*$//' /tmp/busbar-installsh-live | grep -nE 'api\.github\.com'; then
            echo "FAIL: the LIVE install.sh calls api.github.com (lines above)"
            echo "::error::(i) https://getbusbar.com/install.sh resolves the release tag via api.github.com. THE FAILURE MODE: unauthenticated GitHub API calls are rate-limited PER SOURCE IP, so users behind shared/corporate/NAT/cloud IPs get 'curl: (56) The requested URL returned error: 403' and the installer dies with 'busbar: could not determine the latest release tag'. This DOES NOT reproduce on a GitHub Actions runner (different rate-limit pool, credentials often in scope), which is why it went unnoticed in production. FIX: resolve the tag with no API and no auth — e.g. tag=\$(curl -fsS -o /dev/null -w '%{redirect_url}' https://github.com/GetBusbar/busbar/releases/latest); tag=\${tag##*/tag/}  — or serve a pinned version from getbusbar.com. Then redeploy the site."
            exit 1
          fi
          echo "PASS: the live install.sh has NO api.github.com dependency (immune to the unauthenticated 403 rate limit)"

      - name: "(j) Homebrew: getbusbar/busbar tap installs vX.Y.Z"
        # `brew install` builds/downloads and has no timeout of its own.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          fail=0
          formula=""
          # Read the formula the tap actually serves (raw.githubusercontent, unauthenticated — the
          # same bytes `brew` fetches), not a copy in this repo.
          for i in $(seq 1 20); do
            formula="$(curl -fsSL --max-time 30 "https://raw.githubusercontent.com/GetBusbar/homebrew-busbar/main/Formula/busbar.rb" 2>/dev/null || true)"
            [ -n "$formula" ] && echo "$formula" | grep -qE "^ *version \"${V}\"" && break
            echo "  ...tap formula not yet at version ${V} (attempt $i/20), retrying in 15s"
            sleep 15
          done
          if [ -z "$formula" ]; then
            echo "FAIL: could not fetch Formula/busbar.rb from GetBusbar/homebrew-busbar"
            echo "::error::(j) the Homebrew tap formula is unreachable — \`brew install getbusbar/busbar/busbar\` is dead for every user. Fix: confirm GetBusbar/homebrew-busbar is public and Formula/busbar.rb exists on main."
            exit 1
          fi
          fver="$(printf '%s' "$formula" | grep -m1 -E '^ *version "' | sed -E 's/.*version "([^"]+)".*/\1/')"
          if [ "$fver" = "$V" ]; then
            echo "PASS: tap formula version == ${V}"
          else
            echo "FAIL: tap formula version == '${fver:-<none>}', expected '${V}'"
            echo "::error::(j) the Homebrew tap is STALE: Formula/busbar.rb pins '${fver:-<none>}' but the release under test is ${V}, so \`brew install getbusbar/busbar/busbar\` gives users an old binary. Fix: run/repair the tap's bump.yml workflow (it should bump version + all four sha256s on each release)."
            fail=1
          fi

          # Every platform's download URL must actually be live at this version — a formula that
          # points at a missing asset installs for nobody.
          assets="$(printf '%s' "$formula" | grep -oE 'busbar-[A-Za-z0-9_]+-[A-Za-z0-9.-]+\.(tar\.gz|zip)' | sort -u)"
          [ -n "$assets" ] || { echo "::error::(j) could not parse any asset filenames out of the tap formula. Fix: check Formula/busbar.rb's url lines."; exit 1; }
          while IFS= read -r a; do
            [ -n "$a" ] || continue
            u="https://github.com/GetBusbar/busbar/releases/download/${TAG}/${a}"
            code="$(curl -sSL --max-time 30 --range 0-0 -o /dev/null -w '%{http_code}' "$u" || echo 000)"
            case "$code" in
              200|206) echo "PASS: tap download URL is live (${code}): ${a}" ;;
              *)
                echo "FAIL: tap download URL returned ${code}: ${u}"
                echo "::error::(j) the Homebrew formula points at ${u} which returns ${code}. \`brew install\` fails on that platform. Fix: publish the missing asset on Release ${TAG}, or correct the formula's url."
                fail=1
                ;;
            esac
          done <<< "$assets"

          # The published checksum must match the real bytes, or brew aborts with a checksum
          # mismatch even though the URL is fine.
          want_sha="$(printf '%s' "$formula" | awk '/on_linux do/{l=1} l&&/on_intel do/{i=1} l&&i&&/sha256/{gsub(/[",]/,"");print $2;exit}')"
          if [ -n "$want_sha" ]; then
            # Longer bound than the metadata calls: this is a real multi-MB binary download.
            curl -fsSL --max-time 300 "https://github.com/GetBusbar/busbar/releases/download/${TAG}/busbar-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/brew-asset.tar.gz
            got_sha="$(sha256sum /tmp/brew-asset.tar.gz | awk '{print $1}')"
            if [ "$got_sha" = "$want_sha" ]; then
              echo "PASS: tap sha256 for busbar-x86_64-unknown-linux-gnu.tar.gz matches the published asset"
            else
              echo "FAIL: tap sha256 mismatch (formula ${want_sha}, actual ${got_sha})"
              echo "::error::(j) the Homebrew formula's sha256 for busbar-x86_64-unknown-linux-gnu.tar.gz does not match the asset on Release ${TAG}. \`brew install getbusbar/busbar/busbar\` aborts with a checksum mismatch. Fix: re-run the tap's bump workflow to recompute the checksums."
              fail=1
            fi
          else
            echo "FAIL: could not parse the linux/intel sha256 out of the tap formula"
            echo "::error::(j) Formula/busbar.rb has no parseable on_linux/on_intel sha256 — brew cannot verify the download. Fix: restore the sha256 lines in the formula."
            fail=1
          fi

          # And finally the documented command itself. Scrubbed of GitHub credentials: users do not
          # have HOMEBREW_GITHUB_API_TOKEN/GH_TOKEN set, and brew's tap+API calls are rate-limited
          # the same way install.sh's were.
          if command -v brew >/dev/null 2>&1; then
            if env -u GITHUB_TOKEN -u GH_TOKEN -u HOMEBREW_GITHUB_API_TOKEN \
                 HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1 \
                 brew install getbusbar/busbar/busbar; then
              bver="$("$(brew --prefix busbar)/bin/busbar" --version 2>/dev/null || true)"
              if [ "$bver" = "busbar ${V}" ]; then
                echo "PASS: \`brew install getbusbar/busbar/busbar\` installs busbar ${V}"
              else
                echo "FAIL: brew-installed \`busbar --version\` == '${bver:-<none>}', expected 'busbar ${V}'"
                echo "::error::(j) \`brew install getbusbar/busbar/busbar\` resolved and installed, but the resulting binary reports '${bver:-<none>}' instead of 'busbar ${V}'. Fix: the tap formula's url/version pair does not match the binary inside the tarball — re-run the tap bump workflow."
                fail=1
              fi
            else
              echo "FAIL: \`brew install getbusbar/busbar/busbar\` did not succeed"
              echo "::error::(j) the DOCUMENTED Homebrew command \`brew install getbusbar/busbar/busbar\` fails without GitHub credentials — exactly what a user runs. Fix: see the brew output above; usually a bad tap ref, a private tap repo, or a formula syntax error."
              fail=1
            fi
          else
            # VISIBLE fail-open, never a silent no-op: the load-bearing assertions above (version,
            # live URLs, checksum) are hard failures and already ran. Only the convenience "does the
            # documented brew command run end-to-end" half is skipped, and it is announced twice.
            echo "VISIBLE SKIP: Homebrew is not installed on this runner image, so the end-to-end \`brew install\` half of (j) did not run. The formula version / URL / checksum assertions above DID run and are authoritative."
            echo "::warning::(j) PARTIAL: no \`brew\` on the runner, so the end-to-end \`brew install getbusbar/busbar/busbar\` was not exercised (formula version, download URLs and sha256 WERE verified). Fix: pin a runner image that ships Homebrew, or move this half to a macos-latest job."
            { echo "### (j) Homebrew: PARTIAL — no \`brew\` on the runner, end-to-end install not exercised"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          [ "$fail" = 0 ]

      - name: "(k) getbusbar.com's own API endpoints answer with real numbers"
        run: |
          set -euo pipefail
          fail=0
          # These back the live counters on getbusbar.com. Unauthenticated, from outside — the same
          # request a visitor's browser makes. No token is sent, so a runner gets no special
          # treatment here either.
          check_api() {
            ep="$1"; keys="$2"; hint="$3"
            body="$(curl -sS -m 30 -o /tmp/api-body.json -w '%{http_code}' "https://getbusbar.com${ep}" || echo 000)"
            payload="$(cat /tmp/api-body.json 2>/dev/null || true)"
            if [ "$body" != "200" ]; then
              echo "FAIL: https://getbusbar.com${ep} returned HTTP ${body} (body: ${payload:-<empty>})"
              echo "::error::(k) https://getbusbar.com${ep} returns HTTP ${body}, body ${payload:-<empty>} — expected 200 with a numeric count. ${hint}"
              return 1
            fi
            n="$(printf '%s' "$payload" | jq -r "${keys} // empty" 2>/dev/null || true)"
            if [ -n "$n" ] && printf '%s' "$n" | grep -qE '^[0-9]+$'; then
              echo "PASS: ${ep} -> 200, count = ${n}"
              return 0
            fi
            echo "FAIL: ${ep} returned 200 but no numeric count (body: ${payload:-<empty>})"
            echo "::error::(k) https://getbusbar.com${ep} returned 200 but its payload has no numeric count (got '${payload:-<empty>}'). Expected one of ${keys}. ${hint}"
            return 1
          }
          check_api "/api/stars" '.stargazers_count' \
            "Fix: the marketing Worker's /api/stars route must proxy GetBusbar/busbar's star count and return {\"stargazers_count\":N}." || fail=1
          # WAS known-red: /api/pulls used to 400 with {"error":"unknown repo"} unless given
          # ?repo=getbusbar/busbar. The Worker has since been fixed to default the repo, and the
          # bare endpoint now returns 200 {"pull_count":N} (re-verified against production). The
          # check is therefore a NORMAL assertion again — no expected-failure carve-out.
          #
          # The stale "EXPECTED TO FAIL" note is deliberately removed rather than left as history:
          # this workflow now runs on a DAILY schedule, and a check documented as permanently red
          # trains everyone to ignore a red run, which is precisely how the install.sh breakage
          # survived. Do NOT re-introduce an expected-red check here; fix the endpoint instead.
          check_api "/api/pulls" '.pull_count // .count // .pulls' \
            "Fix is MARKETING-SIDE, in the Cloudflare Worker: /api/pulls must default the repo to getbusbar/busbar when no ?repo= is supplied, exactly as /api/stars does." || fail=1
          [ "$fail" = 0 ]

      - name: "(l) the documented quickstart actually runs (binary + docker one-liner)"
        # Boots two servers; a busbar that starts but never binds would otherwise hang the job.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          fail=0
          work=/tmp/busbar-quickstart
          rm -rf "$work"; mkdir -p "$work"
          # The exact minimal config from docs/getting-started.md Step 2. `listen` is omitted so it
          # takes the documented default (0.0.0.0:8080) — that default is part of what we verify.
          cat > "$work/config.yaml" <<'YAML'
          providers:
            anthropic:
              api_key: { env: ANTHROPIC_KEY }
          models:
            claude-sonnet:
              provider: anthropic
          YAML
          # Step 3's env var. A syntactically-valid dummy: the quickstart asserts BOOT + /healthz,
          # which are provider-independent; it deliberately does NOT spend a real provider call.
          export ANTHROPIC_KEY=sk-ant-verify-deploy-dummy

          probe() {  # probe <url> <label> -> 0 if it answers "ok"
            for _ in $(seq 1 30); do
              b="$(curl -fsS -m 5 "$1" 2>/dev/null || true)"
              [ "$b" = "ok" ] && { echo "PASS: $2 answers 200 'ok' on /healthz"; return 0; }
              sleep 2
            done
            echo "FAIL: $2 never answered 'ok' on /healthz (last body: '${b:-<none>}')"
            return 1
          }

          # --- l.1: the binary quickstart from the README / getting-started, using the binary the
          # --- live install.sh produced in (h). Docs promise: `curl -s localhost:8080/healthz` -> ok
          cp /tmp/busbar-e2e/bin/busbar "$work/busbar"
          cp /tmp/busbar-e2e/bin/providers.yaml "$work/providers.yaml"
          pushd "$work" >/dev/null
          BUSBAR_PROVIDERS=./providers.yaml BUSBAR_CONFIG=./config.yaml ./busbar > "$work/busbar.log" 2>&1 &
          bpid=$!
          popd >/dev/null
          if probe "http://127.0.0.1:8080/healthz" "the documented binary quickstart"; then
            :
          else
            echo "--- busbar log ---"; cat "$work/busbar.log" || true; echo "------------------"
            echo "::error::(l) the quickstart printed in the README and docs/getting-started.md does NOT work: the installed busbar ${V} did not boot and serve /healthz with the documented minimal config.yaml. A new user's first five minutes fail. Fix: see the busbar log above — either the minimal config in the docs is no longer valid for this release, or the release binary fails to boot."
            fail=1
          fi
          kill "$bpid" 2>/dev/null || true
          for _ in $(seq 1 15); do curl -fsS -m 2 http://127.0.0.1:8080/healthz >/dev/null 2>&1 || break; sleep 1; done

          # --- l.2: the docker one-liner from docs/getting-started.md, verbatim except that the
          # --- image is pinned to :${V} (check (a) already proves :latest == :${V}, so pinning
          # --- tests the same bytes while making a failure unambiguous about WHICH release broke).
          docker rm -f busbar-quickstart >/dev/null 2>&1 || true
          docker run -d --name busbar-quickstart -p 8080:8080 \
            -e ANTHROPIC_KEY \
            -v "$work/config.yaml:/etc/busbar/config.yaml:ro" \
            "${DOCKERHUB_IMAGE}:${V}" >/dev/null
          if probe "http://127.0.0.1:8080/healthz" "the documented docker one-liner"; then
            :
          else
            echo "--- docker logs ---"; docker logs busbar-quickstart 2>&1 || true; echo "-------------------"
            echo "::error::(l) the documented docker one-liner (docs/getting-started.md Step 1) does NOT work for ${DOCKERHUB_IMAGE}:${V}: the container never served /healthz with the documented minimal config mounted at /etc/busbar/config.yaml. Fix: see the container log above — usually the bundled /etc/busbar/providers.yaml is missing from the image, or the documented mount path changed."
            fail=1
          fi
          docker rm -f busbar-quickstart >/dev/null 2>&1 || true
          [ "$fail" = 0 ]

      # (m) BUILD PROVENANCE ACTUALLY VERIFIES. release.yml records a keyless Sigstore attestation
      # for every archive, and docs tell users to check it with `gh attestation verify`. Nothing has
      # ever run that command against a published asset, so "the release is attested" was a claim
      # about a workflow step succeeding, not about what a user can verify. A user who runs the
      # documented command and gets a failure concludes the artifact is tampered with; that has to
      # be tested from the outside, on the real downloaded bytes, like everything else here.
      - name: (m) the documented attestation check passes on the real published assets
        timeout-minutes: 10
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"; TAG="${{ steps.ver.outputs.tag }}"
          fail=0
          work="$(mktemp -d)"
          # Two platforms rather than all five: attestation is a property of the release run, not of
          # the target, so a second one is a cheap independent sample and five is just slower.
          for a in "busbar-x86_64-unknown-linux-gnu.tar.gz" "busbar-aarch64-apple-darwin.tar.gz"; do
            if ! gh release download "$TAG" --repo GetBusbar/busbar --pattern "$a" --dir "$work" --clobber; then
              echo "FAIL: (m) could not download $a to verify its attestation"
              fail=1; continue
            fi
            if gh attestation verify "$work/$a" --repo GetBusbar/busbar; then
              echo "PASS: (m) $a verifies against its build provenance"
            else
              echo "::error::(m) 'gh attestation verify $a --repo GetBusbar/busbar' FAILED for ${TAG}. This is the exact command the docs tell users to run before trusting a download, so every user who follows that advice sees a tamper warning. Fix: confirm release.yml's attest-build-provenance step ran for this target and that the uploaded bytes are the attested ones (a re-upload after attestation breaks the digest binding)."
              fail=1
            fi
          done
          rm -rf "$work"
          [ "$fail" = 0 ]

      # (n) NUMBERS THE SITE PRESENTS AS LIVE MUST BE LIVE. Four defects in the 1.5.3 release were
      # the same shape: something DECLARED a behaviour and nothing CHECKED it.
      #   * docker.yml's comment claimed a `latest` tag its tag list never emitted, so
      #     `docker pull getbusbar/busbar` served 1.5.2 through the whole release.
      #   * The download page presented a Docker pull count baked into static HTML at BUILD time.
      #   * "Zero broken links" was unreproducible, and one was broken in production.
      #   * And the sharpest one: the Cloudflare Worker behind /api/pulls and /api/stars has a
      #     COMMITTED fix for staleness -- its own commit subject says the stars stop going
      #     stale -- that was never deployed. marketing's deploy.yml runs `wrangler pages deploy`,
      #     which is Pages ONLY; the Worker needs a separate `wrangler deploy` that lives in a
      #     README as a MANUAL step and
      #     runs in no CI anywhere. The code that keeps these numbers fresh has been sitting in git
      #     while the deployed Worker serves frozen values.
      #
      # THE GENERALISATION, which is the reason this check is worth its runtime: WHAT IS DEPLOYED IS
      # NOT WHAT IS COMMITTED unless something proves it. A green build, a merged fix and a passing
      # test suite all say things about the repository. None of them says anything about production.
      #
      # This asserts it from the DATA side, which is what can be checked from outside without the
      # Worker's cooperation. The stronger form is to have the Worker expose its build marker on a
      # health route and compare that to the commit under test; when it grows one, add that here as
      # a direct deployed-equals-committed assertion and this becomes the backstop rather than the
      # primary. Deliberately not stubbed in now: a check that can only go green once another repo
      # ships a feature nobody has scheduled is a known-red gate with no owner, which is how gates
      # get switched off.
      #
      # TOLERANCES ARE TIGHT ON PURPOSE. An earlier revision of this check used 20%, calibrated so it
      # would be green on the day it was written, on the assumption the ~10% gap was a legitimate
      # cache TTL. That assumption was wrong and the calibration was the mistake: the counter is not
      # lagging, it is FROZEN, and a frozen counter's gap grows without bound. A tolerance wide
      # enough to pass a permanently frozen number is a guard that will never fire. These are set to
      # catch a frozen number and nothing looser. Expect this check to be RED until the Worker is
      # actually deployed. That is the check doing its job, not a miscalibration.
      - name: (n) the live numbers on getbusbar.com really are live
        timeout-minutes: 10
        run: |
          set -euo pipefail
          fail=0
          # Docker pull count: authority is Docker Hub's own repository endpoint.
          hub="$(curl -fsS --max-time 30 "https://hub.docker.com/v2/repositories/getbusbar/busbar/" \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin).get("pull_count",-1))' || echo -1)"
          site="$(curl -fsS --max-time 30 "https://getbusbar.com/api/pulls" \
                  | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("pull_count", d.get("count",-1)))' || echo -1)"
          echo "docker pulls: hub=${hub} site-api=${site}"
          if [ "$hub" -lt 0 ] || [ "$site" -lt 0 ]; then
            echo "::error::(n) could not read the Docker pull count from both Docker Hub and getbusbar.com/api/pulls (hub=${hub}, site=${site}). The site advertises this number as live, so an endpoint that cannot answer is a broken promise to every visitor."
            fail=1
          else
            # 1% or 250, whichever is larger: comfortably absorbs a real cache TTL (the Worker's
            # own refresh is hourly) while a frozen counter blows past it within a day.
            tol=$(( hub / 100 )); [ "$tol" -lt 250 ] && tol=250
            d=$(( hub > site ? hub - site : site - hub ))
            if [ "$d" -gt "$tol" ]; then
              echo "::error::(n) the Docker pull count getbusbar.com/api/pulls serves (${site}) is ${d} away from Docker Hub's actual count (${hub}), exceeding the ${tol} tolerance. This is a FROZEN counter, not a stale cache: the gap only grows. Root cause: the Cloudflare Worker that refreshes these values is deployed by nobody. marketing/.github/workflows/deploy.yml runs 'wrangler pages deploy', which is Pages only; the Worker needs a separate 'wrangler deploy' documented in website/workers/README.md as a MANUAL step that no CI runs. The committed Worker source already contains the staleness fix. Fix: add a gated 'wrangler deploy' step for website/workers/** to that workflow so what is committed is what is deployed."
              fail=1
            else
              echo "PASS: (n) the served Docker pull count tracks Docker Hub (delta ${d} <= ${tol})"
            fi
          fi
          # GitHub star count: authority is the repo's own API.
          gh_stars="$(gh api repos/GetBusbar/busbar --jq .stargazers_count 2>/dev/null || echo -1)"
          site_stars="$(curl -fsS --max-time 30 "https://getbusbar.com/api/stars" \
                        | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("stargazers_count", d.get("stars", d.get("count",-1))))' || echo -1)"
          echo "stars: github=${gh_stars} site-api=${site_stars}"
          if [ "$gh_stars" -lt 0 ] || [ "$site_stars" -lt 0 ]; then
            echo "::error::(n) could not read the star count from both api.github.com and getbusbar.com/api/stars (github=${gh_stars}, site=${site_stars})."
            fail=1
          else
            # Stars: a LIVE read equals the truth. 2 absorbs a genuine sub-minute race and nothing
            # else. And a served value that EXCEEDS GitHub's is decisive on its own -- it can only
            # be a value captured before someone unstarred, which is a frozen snapshot by
            # definition, so it is called out separately below.
            stol=2
            sd=$(( gh_stars > site_stars ? gh_stars - site_stars : site_stars - gh_stars ))
            if [ "$sd" -gt "$stol" ]; then
              if [ "$site_stars" -gt "$gh_stars" ]; then
                echo "::error::(n) getbusbar.com/api/stars serves ${site_stars} while GitHub reports ${gh_stars}. A live read CANNOT exceed the truth: this value was captured before someone unstarred and has not been rewritten since, which is proof the refresh is dead rather than merely lagging. Same root cause as the pull count: the Worker is never deployed by CI (marketing deploy.yml runs 'wrangler pages deploy' only; the Worker's 'wrangler deploy' is a manual step in website/workers/README.md)."
              else
                echo "::error::(n) the star count getbusbar.com serves (${site_stars}) is ${sd} away from GitHub's (${gh_stars}), exceeding the ${stol} tolerance. Same failure shape as the Docker pull count: a number presented as live that is not."
              fi
              fail=1
            else
              echo "PASS: (n) the served star count tracks GitHub (delta ${sd} <= ${stol})"
            fi
          fi
          [ "$fail" = 0 ]
