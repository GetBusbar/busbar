# TEMPORARY (1.5.0 ship night): delete the immutability-frozen Docker Hub tags 1.5.0 + latest so
# docker.yml can republish the corrected image (the frozen image predates the plugin anti-downgrade
# floor fix and refuses the 1.0.x plugin fleet). Uses the same org Hub credentials docker.yml
# pushes with. Removed once the corrected image is live.
name: hub-tag-delete
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Hub tags 1.5.0 + latest
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          P: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          JWT=$(curl -s -H "Content-Type: application/json" \
            -d "{\"username\": \"$U\", \"password\": \"$P\"}" \
            https://hub.docker.com/v2/users/login | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))")
          [ -n "$JWT" ] || { echo "::error::Hub login failed"; exit 1; }
          for tag in 1.5.0 latest; do
            code=$(curl -s -o /tmp/out -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $JWT" \
              "https://hub.docker.com/v2/repositories/getbusbar/busbar/tags/$tag/")
            echo "delete $tag -> HTTP $code"; cat /tmp/out; echo
            [ "$code" = "204" ] || [ "$code" = "200" ] || { echo "::error::delete $tag failed ($code)"; exit 1; }
          done
