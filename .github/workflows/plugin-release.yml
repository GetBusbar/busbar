# plugin-release — build, sign, pack and publish ONE first-party plugin release, for every plugin
# repo. The repo's `.github/workflows/release.yml` is a thin caller rendered by `busbar-release plugin
# render <repo>` from plugins.yaml: on a `v*` tag it runs plugin-ci.yml on the tagged commit, then this
# file, then plugin-consumer-verify.yml, each taken at the busbar commit the repo pins.
#
# What a release is, in order (each step refuses before anything is published):
#   pin               the tagged commit's `.busbar-ref` (the busbar the cdylib compiles against and
#                     the packer comes from).
#   abi-completeness  kind:store only: every RecordStore method the store implements is ROUTED by the
#                     pinned contract's store_dispatch (scripts/fleet/verify-abi-completeness.sh). A
#                     method with a default body compiles, ships, and silently drops writes otherwise.
#   create-release    a DRAFT release, so the per-target uploads have something to attach to.
#   build             one UNSIGNED tarball per target: the adapter's cdylib, packed with the pinned
#                     busbar-plugin-pack into {cdylib + manifest.json}, plus the manifest's canonical
#                     bytes (`<tarball>.canonical`), which are exactly what the first-party signature
#                     covers. The plugin's `declares` file (when it has one) goes into the manifest:
#                     the contract-ABI range the plugin supports travels there, and the loader refuses
#                     the plugin outside it. A build-provenance attestation binds each tarball to this
#                     run.
#   verify-assets     a release with ZERO assets is a phantom: red. In every case the release STAYS A
#                     DRAFT.
#
# THIS WORKFLOW SIGNS NOTHING AND PUBLISHES NOTHING (owner ruling 2026-10-25). The first-party plugin
# key lives on the founder's hardware key, never in a CI secret. The owner signs the canonical bytes,
# and `scripts/release/publish_gate.py plugin-release <repo> <tag>`, run from his own busbar clone,
# attaches each signature, verifies it against the compiled-in key list, uploads the signed
# tarballs, and only then publishes the release (docs/verify.md). BUSBAR_SIGN_KEY is still accepted
# as an input so that callers rendered before this change keep parsing, but it is never read.
#
# A C plugin (`plugin_lang: c`, plugin-ci.yml's C path) is released the same way: its build step
# compiles the `c_dir` sources against busbar_plugin.h at the pin with the target's C compiler into
# the same library path a cargo build would leave, and the same packer signs it.
#
# A PRE-RELEASE tag (`vX.Y.Z-dev.N`, cut from a plugin repo's dev branch) runs the same build, sign and
# pack, but its release is a GitHub pre-release: published, never marked latest, and no site dispatch.
name: "Plugins: release"

on:
  workflow_call:
    inputs:
      plugin_crate:
        description: "The cdylib's Cargo package (built with -p), e.g. busbar-store-sqlite-plugin"
        required: true
        type: string
      manifest_name:
        description: "The signed manifest's `name` (the plugin's identity at load)"
        required: true
        type: string
      plugin_alias:
        description: "The manifest alias (the short config name)"
        required: true
        type: string
      plugin_kind:
        description: "store | secret | auth | hook | export | plane | transport"
        required: true
        type: string
      asset_prefix:
        description: "The published tarball's filename prefix: <prefix>-<version>-<target>.tar.gz"
        required: true
        type: string
      description:
        description: "The manifest's one-line description"
        required: true
        type: string
      lib_only:
        description: "Build the cdylib with --lib (a crate that also has binaries)"
        required: false
        type: boolean
        default: false
      needs_prompt:
        description: "kind:hook declared intent: no | ro | rw. Empty = not declared."
        required: false
        type: string
        default: ""
      needs_user:
        description: "kind:hook declared intent: no | ro. Empty = not declared."
        required: false
        type: string
        default: ""
      declares_file:
        description: "Repo-relative path of the plugin's `declares` section (JSON). Empty = none."
        required: false
        type: string
        default: ""
      former_names:
        description: "The manifest names the plugin's earlier releases carried (plugins.yaml former_names), space-separated; each is signed in as --former-name. Empty = none."
        required: false
        type: string
        default: ""
      plugin_lang:
        description: "rust | c. `c`: the library is the c_dir sources built from busbar_plugin.h alone."
        required: false
        type: string
        default: "rust"
      c_dir:
        description: "plugin_lang c: the repo-relative directory of the plugin's .c sources."
        required: false
        type: string
        default: ""
    secrets:
      BUSBAR_SIGN_KEY:
        description: "IGNORED. First-party plugins are signed by the owner's hardware key, never in CI. Kept so older callers still parse."
        required: false
      RELEASE_DISPATCH_TOKEN:
        description: "IGNORED. Nothing is published here, so nothing is announced. Kept so older callers still parse."
        required: false

# Read-only by default; only the jobs that create, upload to, attest or publish the Release are
# granted write, so pin / abi-completeness (which run code from the pinned busbar) hold no write token.
permissions:
  contents: read

jobs:
  pin:
    name: the pinned busbar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: pin
        run: |
          set -euo pipefail
          sha="$(awk '{print $1; exit}' .busbar-ref)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.busbar-ref field 1 is not a full 40-hex sha: '$sha'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  abi-completeness:
    name: every RecordStore method is routed by the pinned ABI
    needs: pin
    if: inputs.plugin_kind == 'store'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ needs.pin.outputs.sha }}
          path: busbar
      - run: bash busbar/scripts/fleet/verify-abi-completeness.sh plugin busbar

  create-release:
    name: draft release
    permissions:
      contents: write
    needs: [pin, abi-completeness]
    # abi-completeness is skipped for every kind but store; skipped is not failed.
    if: ${{ !cancelled() && needs.pin.result == 'success' && needs.abi-completeness.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ inputs.asset_prefix }}
        run: |
          pre=(); case "${GITHUB_REF_NAME}" in *-*) pre=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${TITLE} ${GITHUB_REF_NAME}" --draft --verify-tag --generate-notes "${pre[@]}" \
          || gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"

  build:
    name: build, pack unsigned (${{ matrix.target }})
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: [pin, create-release]
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, libext: so, libprefix: lib }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, libext: so, libprefix: lib }
          - { target: x86_64-apple-darwin, os: macos-latest, libext: dylib, libprefix: lib }
          - { target: aarch64-apple-darwin, os: macos-latest, libext: dylib, libprefix: lib }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, libext: dll, libprefix: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      - name: busbar at the pin (the packer's source; the plugin resolves busbar from git itself)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ needs.pin.outputs.sha }}
          path: busbar
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            plugin
            busbar
      - name: build the cdylib
        if: inputs.plugin_lang != 'c'
        working-directory: plugin
        shell: bash
        env:
          CRATE: ${{ inputs.plugin_crate }}
          LIB_ONLY: ${{ inputs.lib_only }}
        run: |
          set -euo pipefail
          lib_flag=""; [ "$LIB_ONLY" = true ] && lib_flag="--lib"
          # the door is behind the crate's `dropped-in` feature once the crate declares it (a linked rlib
          # must not export busbar_plugin_door); pass it only then, so this works before and after.
          feat=""
          if cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; sys.exit(0 if any(p["name"]==sys.argv[1] and "dropped-in" in p["features"] for p in json.load(sys.stdin)["packages"]) else 1)' "$CRATE"; then feat="--features dropped-in"; fi
          cargo build --release --locked $lib_flag $feat --target "${{ matrix.target }}" -p "$CRATE"
      - name: "C: build the library from busbar_plugin.h alone"
        if: inputs.plugin_lang == 'c'
        shell: bash
        env:
          CRATE: ${{ inputs.plugin_crate }}
          C_DIR: ${{ inputs.c_dir }}
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          out="plugin/target/${target}/release/${{ matrix.libprefix }}${CRATE//-/_}.${{ matrix.libext }}"
          mkdir -p "$(dirname "$out")"
          flags=(-std=c11 -Wall -Wextra -Werror -pedantic -O2 -shared -I busbar/crates/busbar-contract/include)
          case "$target" in
            x86_64-apple-darwin) cc "${flags[@]}" -fPIC -arch x86_64 -o "$out" "plugin/$C_DIR"/*.c ;;
            aarch64-apple-darwin) cc "${flags[@]}" -fPIC -arch arm64 -o "$out" "plugin/$C_DIR"/*.c ;;
            *-windows-msvc) clang "${flags[@]}" --target="$target" -o "$out" "plugin/$C_DIR"/*.c ;;
            *) cc "${flags[@]}" -fPIC -o "$out" "plugin/$C_DIR"/*.c ;;
          esac
          ls -l "$out"
      - name: build busbar-plugin-pack (host build; the packer only reads the cdylib's bytes)
        working-directory: busbar
        shell: bash
        run: cargo build --release --locked -p busbar-plugin-loader --features pack --bin busbar-plugin-pack
      - name: pack (unsigned) + canonical bytes for the owner to sign
        shell: bash
        env:
          CRATE: ${{ inputs.plugin_crate }}
          NAME: ${{ inputs.manifest_name }}
          ALIAS: ${{ inputs.plugin_alias }}
          KIND: ${{ inputs.plugin_kind }}
          PREFIX: ${{ inputs.asset_prefix }}
          DESCRIPTION: ${{ inputs.description }}
          NEEDS_PROMPT: ${{ inputs.needs_prompt }}
          NEEDS_USER: ${{ inputs.needs_user }}
          DECLARES: ${{ inputs.declares_file }}
          FORMER_NAMES: ${{ inputs.former_names }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          pack="busbar/target/release/busbar-plugin-pack"
          [ -x "$pack" ] || pack="busbar/target/release/busbar-plugin-pack.exe"
          lib="plugin/target/${target}/release/${{ matrix.libprefix }}${CRATE//-/_}.${{ matrix.libext }}"
          [ -f "$lib" ] || { echo "::error::no cdylib at $lib"; exit 1; }
          extra=()
          [ -n "$NEEDS_PROMPT" ] && extra+=(--needs-prompt "$NEEDS_PROMPT")
          [ -n "$NEEDS_USER" ] && extra+=(--needs-user "$NEEDS_USER")
          if [ -n "$DECLARES" ]; then
            [ -f "plugin/$DECLARES" ] || { echo "::error::declares_file plugin/$DECLARES does not exist"; exit 1; }
            extra+=(--declares-file "plugin/$DECLARES")
            # The stamp is the newest contract ABI the plugin DECLARES it speaks, never the packer's
            # own newest: a manifest stamped outside its own declared range is refused at load.
            py="$(command -v python3 || command -v python)"
            top="$("$py" -c 'import json,sys; r=json.load(open(sys.argv[1])).get("contract_abi"); print(r["max"] if r else "")' "plugin/$DECLARES")"
            [ -n "$top" ] && extra+=(--abi-version "$top")
          fi
          for name in $FORMER_NAMES; do extra+=(--former-name "$name"); done
          # Never a signing key here: unset it even if a caller passed one.
          unset BUSBAR_SIGN_KEY
          mkdir -p plugin-dist
          out="plugin-dist/${PREFIX}-${ver}-${target}.tar.gz"
          "$pack" pack --lib "$lib" --name "$NAME" --alias "$ALIAS" --kind "$KIND" \
            --version "$ver" --publisher busbar --description "$DESCRIPTION" --license Apache-2.0 \
            --out "$out" --allow-unsigned "${extra[@]}"
          # The exact bytes the owner signs, and their sha256, published beside the draft tarball.
          "$pack" canonical "$out" --out "$out.canonical" | tee "$out.canonical.txt"
          ls -l plugin-dist
      - name: attach to the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" plugin-dist/* --repo "${GITHUB_REPOSITORY}" --clobber
      - name: build-provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "plugin-dist/*.tar.gz"

  verify-assets:
    name: no phantom release; the draft waits for the owner's signature
    permissions:
      contents: write
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')"
          echo "release ${GITHUB_REF_NAME} has ${count} asset(s)"
          if [ "${count}" -eq 0 ]; then
            echo "::error::PHANTOM RELEASE: ${GITHUB_REF_NAME} has 0 assets; it stays a draft. Fix the build, delete the tag and the draft, and re-cut." >&2
            exit 1
          fi
          echo "::notice::${GITHUB_REF_NAME} is a DRAFT with ${count} unsigned asset(s). It is published only by the owner's publish_gate.py plugin-release run, after the hardware-key signature verifies."
