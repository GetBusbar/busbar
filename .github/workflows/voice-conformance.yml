name: Voice conformance

# THE 4th-PLANE (VOICE) CONFORMANCE BATTERY — at structural parity with the MCP and A2A workflows,
# now WIRED: every leg drives the real `busbar-voice` plane (its OpenAI-Realtime and Gemini-Live
# codecs, the captured fixtures, the cross-dialect map, and the T2 runtime's D2 hard-close path) via
# the `voice-conform` harness bin, and the verdict reflects REAL leg results.
#
# THE ANTI-VACUITY DISCIPLINE, INHERITED FROM THE SIBLING WORKFLOWS.
#
#   The MCP and A2A workflows make `NOT ARMED, SO NOT RUN` a RED state, because a disarmed subject leg
#   renders as the identical green tick a leg that judged busbar would produce. That false green is the
#   whole disease they treat. Here the same rule holds one plane over: a READY leg that executed
#   nothing is RED (the vacuous-ready trap), and `voice-conformance.sh --selftest` proves that
#   accounting bites — planting runs it MUST refuse and runs it MUST accept — before any verdict is
#   believed. A leg that genuinely cannot assert an item keeps it an HONEST PENDING sub-item with a
#   precise reason, rather than a faked green.
#
# THE LEGS (each a job; the matrix `spec-per-dialect` job is one job to the coverage linter):
#   gate-selftest      the runner's own accounting, and the verdict-coverage lint, each made to bite
#   spec-per-dialect   the voice spec battery, per dialect. MATRIX: openai, gemini.
#   replay             captured-transcript replay (both dialect goldens).
#   cross-parity       the 4 ordered OpenAI<->Gemini pairs, judged against the cross-dialect map.
#   governance-probe   the 5 vision checkpoints (incl. D2 hard-close-on-exhaustion). NOT A
#                      CONFORMANCE RESULT — separated in the runner, exactly as a2a-governance is.
#
# AND `verdict` IS NOT OPTIONAL. Ten green ticks mean nothing if one is green because it never ran.
# The last job asserts, per leg BY NAME, that the leg reached `success`; skipped or cancelled is RED
# there. Its `needs:` list is held to SET EQUALITY with the workflow's job set by
# `testing/verdict-covers-every-leg.py`, run in gate-selftest below.
#
# THE INPUTS LATER LEGS CONSUME (authored by another agent; referenced, not created, here):
#   testing/voice-conformance/fixtures/{openai,gemini}/   captured transcripts + spec fixtures
#   docs/design/voice-cross-dialect-mapping.*             the OpenAI<->Gemini equivalence mapping
#
# busbar is PUBLIC, so per the org rule every job runs on `ubuntu-latest` at no cost, and there is no
# secret anywhere in this file.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: voice-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-selftest:
    name: gate self-test (the accounting cannot be lied to)
    runs-on: ubuntu-latest
    env:
      # The self-test's final step re-runs the REAL (now READY) legs through `emit_verdict`, which
      # shells out to the conformance harness — so this job builds it too and points the legs at it.
      VOICE_CONFORM_BIN: ${{ github.workspace }}/target/debug/voice-conform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Build the voice conformance harness
        run: cargo build -p busbar-voice --features runtime --bin voice-conform
      # FIRST, and separately from any verdict: never trust a gate's verdict before proving the gate
      # still works. The self-test plants runs that MUST be refused (a ready leg that executed
      # nothing; a dropped leg; a gutted tree) and runs that must be accepted (the all-pending
      # scaffold), and it drives the PENDING->READY transition, so a green below cannot be produced
      # by accounting that refuses everything or accepts everything.
      - name: Prove the scaffold's accounting and pending/ready transition bite
        run: |
          set -euo pipefail
          bash testing/voice-conformance/voice-conformance.sh --selftest | tee voice-selftest.log

      - name: Prove the verdict-coverage lint bites
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 testing/verdict-covers-every-leg.py --selftest

      # The aggregator's `needs:` list is a hand-maintained enumeration, and the last enumeration in
      # this tree that stopped covering what came after it did so silently. Held to SET EQUALITY with
      # the workflow's job set, in both directions, and every leg it depends on must be read by its
      # script.
      - name: The verdict must depend on, and judge, every leg
        run: python3 testing/verdict-covers-every-leg.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voice-gate-selftest
          path: voice-selftest.log
          if-no-files-found: warn

  spec-per-dialect:
    name: spec battery · ${{ matrix.dialect }}
    needs: gate-selftest
    runs-on: ubuntu-latest
    env:
      VOICE_CONFORM_BIN: ${{ github.workspace }}/target/debug/voice-conform
    strategy:
      fail-fast: false
      matrix:
        dialect: [openai, gemini]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Build the voice conformance harness
        run: cargo build -p busbar-voice --features runtime --bin voice-conform
      # The spec leg drives every captured fixture under
      # testing/voice-conformance/fixtures/${{ matrix.dialect }}/ through the real dialect codec and
      # asserts wire→IR→wire round-trip stability (the vacuous-ready trap holds a ready-but-empty run
      # to RED automatically).
      - name: Run the ${{ matrix.dialect }} spec leg
        run: |
          set -euo pipefail
          bash testing/voice-conformance/voice-conformance.sh \
            --leg spec-per-dialect --slice ${{ matrix.dialect }} \
            | tee voice-spec-${{ matrix.dialect }}.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voice-spec-${{ matrix.dialect }}
          path: voice-spec-${{ matrix.dialect }}.log
          if-no-files-found: warn

  replay:
    name: captured-transcript replay
    needs: gate-selftest
    runs-on: ubuntu-latest
    env:
      VOICE_CONFORM_BIN: ${{ github.workspace }}/target/debug/voice-conform
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Build the voice conformance harness
        run: cargo build -p busbar-voice --features runtime --bin voice-conform
      - name: Run the replay leg
        run: |
          set -euo pipefail
          bash testing/voice-conformance/voice-conformance.sh --leg replay | tee voice-replay.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voice-replay
          path: voice-replay.log
          if-no-files-found: warn

  cross-parity:
    name: cross-parity · 4 ordered OpenAI<->Gemini pairs
    needs: gate-selftest
    runs-on: ubuntu-latest
    env:
      VOICE_CONFORM_BIN: ${{ github.workspace }}/target/debug/voice-conform
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Build the voice conformance harness
        run: cargo build -p busbar-voice --features runtime --bin voice-conform
      - name: Run the cross-parity leg
        run: |
          set -euo pipefail
          bash testing/voice-conformance/voice-conformance.sh --leg cross-parity | tee voice-cross-parity.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voice-cross-parity
          path: voice-cross-parity.log
          if-no-files-found: warn

  boot-validate:
    name: "boot --features plane-voice parses the owned streams: section"
    needs: gate-selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      # M5: the composition root LINKS busbar-voice under `plane-voice`, the plane OWNS the `streams:`
      # section, and its grammar is reached at config validation. This leg proves that end to end, so a
      # regression that unwires `parse_section`/`owned_config_sections` — or one that lets a second
      # plane claim `streams` — is RED here rather than discovered at a live boot.
      - name: Build busbar with the voice plane
        run: cargo build -p busbar --features plane-voice
      - name: "The owned streams: grammar parses/refuses; voice reaches config_sections; the dup-claim guard bites"
        run: |
          set -euo pipefail
          # (a) a valid streams: block parses through voice's parse_section, and an unknown key is
          #     refused by deny_unknown_fields (the section's typed grammar is actually reached).
          cargo test -p busbar-voice --features runtime config:: -- --nocapture | tee voice-boot-validate.log
          # (b) "streams" reaches busbar_core::plane::config::config_sections() once voice is
          #     registered, and (c) the dup-claim guard admits the real voice decl and REFUSES a
          #     planted second claimant of `streams`.
          cargo test -p busbar --features plane-voice --test voice_boot -- --nocapture | tee -a voice-boot-validate.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voice-boot-validate
          path: voice-boot-validate.log
          if-no-files-found: warn

  governance-probe:
    name: governance probe · 5 vision checkpoints (NOT a conformance result)
    needs: gate-selftest
    runs-on: ubuntu-latest
    env:
      VOICE_CONFORM_BIN: ${{ github.workspace }}/target/debug/voice-conform
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Build the voice conformance harness
        run: cargo build -p busbar-voice --features runtime --bin voice-conform
      # SEPARATE FROM THE CONFORMANCE VERDICT BY CONSTRUCTION. The runner records governance findings
      # as observations and refuses to let them move the conformance verdict; --selftest proves that
      # separation bites. A green here is not a governance PASS, and it is never a conformance one.
      - name: Observe the governance checkpoints
        run: |
          set -euo pipefail
          bash testing/voice-conformance/voice-conformance.sh --leg governance | tee voice-governance.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voice-governance-probe
          path: voice-governance.log
          if-no-files-found: warn

  verdict:
    name: Voice conformance verdict
    runs-on: ubuntu-latest
    if: always()
    needs:
      - gate-selftest
      - spec-per-dialect
      - replay
      - cross-parity
      - boot-validate
      - governance-probe
    steps:
      # A ROW THAT CANNOT RUN IS RED, NEVER SKIPPED. Every leg above is required to have reached
      # `success` — `skipped` and `cancelled` are failures here, because the failure mode this whole
      # workflow exists to prevent is a tick over a job that executed nothing. Every leg is now WIRED
      # and reaches `success` only by asserting real conformance (or is honestly RED), so this verdict
      # is green only when every declared leg actually executed and passed.
      - name: Every leg must have EXECUTED
        env:
          GATE_SELFTEST: ${{ needs.gate-selftest.result }}
          SPEC_PER_DIALECT: ${{ needs.spec-per-dialect.result }}
          REPLAY: ${{ needs.replay.result }}
          CROSS_PARITY: ${{ needs.cross-parity.result }}
          BOOT_VALIDATE: ${{ needs.boot-validate.result }}
          GOVERNANCE_PROBE: ${{ needs.governance-probe.result }}
        run: |
          set -euo pipefail
          fail=0
          strict () {
            if [ "$2" != "success" ]; then
              echo "::error::$1 did not succeed (result: $2). A leg that did not EXECUTE is red, not skipped."
              fail=1
            else
              echo "  ok    $1"
            fi
          }
          strict gate-selftest     "$GATE_SELFTEST"
          strict spec-per-dialect  "$SPEC_PER_DIALECT"
          strict replay            "$REPLAY"
          strict cross-parity      "$CROSS_PARITY"
          strict boot-validate     "$BOOT_VALIDATE"
          strict governance-probe  "$GOVERNANCE_PROBE"

          [ "$fail" -eq 0 ] || exit 1
          echo
          echo "Voice conformance verdict: every leg executed and passed. Real conformance holds for the"
          echo "ready legs; the shape is enforced and every declared leg is accounted for."
