name: Docker

# Build and publish the busbar container image (Docker Hub + GHCR) as a multi-arch
# manifest (linux/amd64 + linux/arm64), over DYNAMICALLY-LINKED glibc binaries on a digest-pinned
# debian:bookworm-slim base.
#
# IT USED TO BE `FROM scratch` OVER STATIC MUSL, AND THAT IMAGE COULD LOAD NO PLUGIN AT ALL. A
# plugin is a cdylib and loading one is a dlopen; a static-pie musl binary has no PT_INTERP and
# musl's static libc offers dlopen only as a stub that always refuses, so `getbusbar/busbar:1.5.5`
# refused every plugin of every kind — measured outside the container too, on a full glibc host with
# a real /tmp, where the same binary still said `dlopen failed`. Every plugin GetBusbar publishes is
# a `*-unknown-linux-gnu` asset needing `libc.so.6` and `ld-linux-*.so.2` (plugin-digests.tsv), so
# the target moved to gnu and the base moved to one that carries glibc. See the Dockerfile's header
# for the full measurement, and the `image-loads-a-plugin` job below for the gate that keeps it
# true on every push.
#
# THIS WORKFLOW NO LONGER OWNS THE VERSION TAG, AND THAT IS THE WHOLE POINT.
#
# It used to fire on a `v*` tag push and emit `X.Y.Z` + `latest` in the same build-push that
# produced the bytes. So the user-facing name existed the instant the build succeeded, before one
# consumer check had run against it. Docker Hub has TAG IMMUTABILITY enabled on getbusbar/busbar: a
# published `X.Y.Z` CANNOT be overwritten, so a broken one is permanent and the only remedies are
# deleting the tag (which has needed owner scope that was not available) or burning a version
# number. Creating the name before proving the bytes is therefore the wrong order regardless of
# convenience, and 1.5.3 paid for it.
#
# The order is now: build -> push under a THROWAWAY name -> verify from the consumer side ->
# PROMOTE. This file provides both halves as separate, independently callable paths, and the two
# halves are now driven from two DIFFERENT workflows on two different branches: release-stage.yml
# (push to `qa`) calls the staging path, and release.yml (push to `main`) calls the promote path
# against the digest the qa stage recorded -- the split exists precisely so the promoted image is
# the staged one and main never rebuilds. Exactly ONE thing emits `X.Y.Z`: the `promote` job
# below, reached only from release.yml's promote step, only after the qa-staged verification went
# green and release.yml's resolve-staged re-proved the record.
#
# Triggers:
#   - workflow_call (how release-stage.yml and release.yml drive it):
#       * staging_tag: build the multi-arch image and push it under THAT name only. Really
#         pullable, really executable, but no user is looking at `staging-<sha>`. Outputs the
#         manifest digest so the promote path can retag those exact bytes.
#       * promote_to (+ promote_from): manifest-only retag. Creates `X.Y.Z` from the already-pushed
#         staged manifest and moves `latest` onto it. NO REBUILD, so the promoted image is
#         bit-identical to the one verification actually pulled and ran, and the build-provenance
#         attestation recorded against the digest carries over unchanged.
#   - workflow_dispatch: the manual recovery door for the same two primitives, plus a bare dispatch
#     that publishes only a `test` tag (pipeline smoke test, cuts nothing).
#
# THE INPUT THAT WAS REMOVED, AND WHY. There used to be a `version` dispatch input that decided
# whether the semver tag was emitted AT ALL: `type=semver` was gated `enable=<version != ''>`, so a
# bare dispatch published only `test`. That is how the headroom bundle rebuild "succeeded" and
# published nothing anybody pulls. Two mechanisms both believing they own tagging is how this
# breaks again, so `version` is gone and `label_version` (which sets the OCI version LABEL and the
# bundled plugin's version, and emits NO tag) took over the part of its job that was legitimate.
#
# Supply chain: both registries carry a GitHub build-provenance attestation
# (stored by GitHub — no extra tags on the repo). Verify with:
#   gh attestation verify oci://index.docker.io/getbusbar/busbar:<tag> --repo GetBusbar/busbar
# Cosign signatures are additionally pushed for the GHCR image only — cosign
# stores signatures as sha256-*.sig tags, which we keep off the Docker Hub tag
# list deliberately (clean public page; GHCR carries them for cosign users):
#   cosign verify ghcr.io/getbusbar/busbar:<tag> \
#     --certificate-identity-regexp 'https://github.com/GetBusbar/busbar/\.github/workflows/docker\.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  # NO `push: tags` TRIGGER. Its absence is a load-bearing part of the design, not an omission: a
  # `v*` tag existing must not, by itself, cause anything to be published under a user-facing name.
  # scripts/release-order-lint.py asserts this file has no tag trigger and fails the build if one
  # is added back.
  workflow_call:
    inputs:
      staging_tag:
        description: "Build and push the image under THIS throwaway tag only (e.g. staging-abc1234)."
        required: false
        type: string
        default: ""
      label_version:
        description: >-
          The X.Y.Z this build IS, for the org.opencontainers.image.version label. Emits NO tag.
          verify-deploy's check (d) reads this label off the STAGED image, so the staged bytes must
          already claim the right version.
        required: false
        type: string
        default: ""
      promote_to:
        description: >-
          Manifest-only promote: create this version tag (e.g. 1.5.4) and move `latest` onto it.
          No rebuild. Skips the build jobs entirely.
        required: false
        type: string
        default: ""
      promote_from:
        description: >-
          Source tag the promote copies manifests from (normally the staging tag). Leave empty to
          promote from `promote_to` itself, which is the old `retag_from` behaviour: move `latest`
          onto an already-published, immutable version without re-pushing it.
        required: false
        type: string
        default: ""
      promote_latest:
        description: >-
          Whether this promote also moves the FLOATING pointers (`latest`, and `armv8.0`). True for
          a real release. FALSE for a release CANDIDATE: `1.6.0-rc.1` must be pullable by name and
          must NOT become what `docker pull getbusbar/busbar` serves. The immutable pins
          (`X.Y.Z`, `X.Y.Z-armv8.0`) are minted either way, and the landing assertion below drops
          the floating names from its set when this is false rather than asserting them absent --
          `latest` legitimately still points at the PREVIOUS release during an rc soak.
        required: false
        type: boolean
        default: true
    outputs:
      digest:
        description: "Manifest digest of the image this run pushed (staging path only)."
        value: ${{ jobs.publish.outputs.digest }}
      digest_armv8:
        description: >-
          Manifest digest of the armv8.0-compatible arm64 image pushed under
          <staging_tag>-armv8.0 (staging path only). A separate image on purpose: one multi-arch
          manifest cannot carry two arm64 variants, so the +lse build IS the manifest's
          linux/arm64 entry and the armv8.0 build lives under its own suffixed name.
        value: ${{ jobs.publish.outputs.digest_armv8 }}
  # PUSH: THE PROOF ONLY, NEVER A PUBLISH. No registry login happens on this path and no tag is
  # emitted — the `image-loads-a-plugin` job below builds the image LOCALLY from the tree and runs
  # a plugin in it. It exists because nothing in this repository ever ran a plugin against the
  # image, which is how `getbusbar/busbar:1.5.5` shipped unable to load any plugin of any kind and
  # stayed that way until an operator hit it. `build-binaries` (and therefore `publish`) is guarded
  # off this event explicitly; `promote` guards itself on a non-empty `promote_to`.
  # THE INTEGRATION LINE AND THE THREE STAGE BRANCHES, and deliberately NOT `keep-**`. Every agent
  # keep branch touches `crates/**`, so including them would fire a build-and-run-a-container job on
  # each of a dozen parallel branches for a property that only has to hold where they LAND.
  push:
    branches:
      - dev
      - qa
      - main
      - 'integration/**'
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'providers.yaml'
      - 'scripts/image-loads-plugins.sh'
      - 'testing/shadow-oracle/plugin-digests.tsv'
      - '.github/workflows/docker.yml'
      - 'crates/**'
      - 'Cargo.lock'

  workflow_dispatch:
    inputs:
      staging_tag:
        description: "Build and push under this throwaway tag only (e.g. staging-abc1234). Cuts nothing."
        required: false
        default: ""
      label_version:
        description: "X.Y.Z for the OCI version label and the bundled plugin. Emits NO tag."
        required: false
        default: ""
      promote_to:
        description: >-
          Manifest-only promote: create this version tag and move `latest` onto it. No rebuild.
        required: false
        default: ""
      promote_from:
        description: >-
          Source tag to promote FROM. Empty means promote from promote_to itself (move `latest`
          onto an already-published immutable version). This is the old `retag_from` input.
        required: false
        default: ""
      promote_latest:
        description: "Also move the floating `latest`/`armv8.0` pointers. Set false for an rc."
        required: false
        type: boolean
        default: true

env:
  DOCKERHUB_IMAGE: getbusbar/busbar
  GHCR_IMAGE: ghcr.io/getbusbar/busbar

permissions:
  contents: read
  packages: write      # push to GHCR
  id-token: write      # keyless cosign signing
  attestations: write  # build-provenance attestation

jobs:
  # -- THE PROMOTE PRIMITIVE: manifest-only, no rebuild ---------------------------------------------
  #
  # This is the ONLY job in this repository that emits a user-facing `X.Y.Z` container tag. It takes
  # bytes that are ALREADY pushed (normally under `staging-<sha>`, and already pulled, booted and
  # executed by verification) and gives them their real names. Three properties make this the right
  # promote primitive rather than a rebuild:
  #
  #   * BIT-IDENTICAL. `imagetools create` copies manifests. The promoted `X.Y.Z` is the exact
  #     digest verification ran, not a second build that "should" be the same. A rebuild would make
  #     the verification a statement about a DIFFERENT artifact, which is no verification at all.
  #   * THE ATTESTATION CARRIES OVER. Build provenance is recorded against the DIGEST, so the same
  #     digest under a new tag is still attested. `gh attestation verify oci://...:X.Y.Z` passes
  #     without re-attesting.
  #   * CHEAP AND RETRYABLE. Seconds, not the ~40 minutes a two-arch PGO build costs, so a promote
  #     that fails half way can be re-run immediately.
  #
  # IMMUTABILITY IS WHY THE ORDER INSIDE THIS JOB IS WHAT IT IS. `X.Y.Z` on Docker Hub cannot be
  # overwritten, so it is pushed FIRST, while nothing else has moved: if the registry rejects it
  # (the tag already exists) the job dies before `latest` has been touched and before release.yml
  # has pushed a git tag or published anything. `latest` is mutable and therefore safe to move last.
  promote:
    name: promote ${{ inputs.promote_from || inputs.promote_to }} -> ${{ inputs.promote_to }} + latest
    if: ${{ inputs.promote_to != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote (manifest-only, multi-arch preserved)
        env:
          V: ${{ inputs.promote_to }}
          # Empty SRC means "promote from V itself", i.e. the old `retag_from` recovery: V is
          # already published and immutable, and all that is wanted is `latest` pointed at it.
          SRC: ${{ inputs.promote_from }}
          MOVE_LATEST: ${{ inputs.promote_latest }}
        run: |
          set -euo pipefail
          src="${SRC:-$V}"
          if [ "$MOVE_LATEST" = "true" ]; then
            echo "Promoting ${DOCKERHUB_IMAGE}:${src} -> :${V} and :latest on both registries."
          else
            echo "Promoting ${DOCKERHUB_IMAGE}:${src} -> :${V} on both registries. The floating" \
                 "pointers (latest, armv8.0) are NOT moved: this is a release candidate, and" \
                 "\`docker pull getbusbar/busbar\` must keep serving the current release."
          fi

          # 1. The IMMUTABLE tag first, on both registries, while nothing else has moved.
          if [ "$src" != "$V" ]; then
            docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:${V}" "${DOCKERHUB_IMAGE}:${src}"
          fi
          # GHCR may be MISSING this version if a prior combined push aborted mid-way. Mirror it
          # from Docker Hub (cross-registry manifest copy, no rebuild). `imagetools create` is a
          # no-op-safe overwrite if it already exists, which is what makes a re-run idempotent.
          docker buildx imagetools create -t "${GHCR_IMAGE}:${V}" "${DOCKERHUB_IMAGE}:${V}"

          # 2. Only then the MUTABLE pointer. Moving `latest` before the pin exists would, for the
          #    window between the two, hand `docker pull getbusbar/busbar` an image no user can pin.
          if [ "$MOVE_LATEST" = "true" ]; then
            docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:latest" "${DOCKERHUB_IMAGE}:${V}"
            docker buildx imagetools create -t "${GHCR_IMAGE}:latest" "${GHCR_IMAGE}:${V}"
          fi

          # 3. The armv8.0 compat variant, SAME order and same rules: immutable pin (X.Y.Z-armv8.0)
          #    first on Docker Hub, GHCR mirror, floating `armv8.0` pointer last. The compat image
          #    is a first-class artifact; its names move in the same promote or the promote fails.
          if [ "$src" != "$V" ]; then
            docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:${V}-armv8.0" "${DOCKERHUB_IMAGE}:${src}-armv8.0"
          fi
          if docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${V}-armv8.0" >/dev/null 2>&1; then
            docker buildx imagetools create -t "${GHCR_IMAGE}:${V}-armv8.0" "${DOCKERHUB_IMAGE}:${V}-armv8.0"
            if [ "$MOVE_LATEST" = "true" ]; then
              docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:armv8.0" "${DOCKERHUB_IMAGE}:${V}-armv8.0"
              docker buildx imagetools create -t "${GHCR_IMAGE}:armv8.0" "${GHCR_IMAGE}:${V}-armv8.0"
            fi
          else
            # Only reachable in the src==V recovery arm (move `latest` onto an already-published
            # version): a version cut before the dual-arm64 split has no compat pin to point at.
            echo "::warning::${DOCKERHUB_IMAGE}:${V}-armv8.0 does not exist (version predates the dual arm64 artifacts); leaving the armv8.0 pointer untouched."
          fi

      # PARTIAL PROMOTE IS DETECTABLE, NOT SILENT. `imagetools create` exiting 0 says the API call
      # was accepted; it does not say the registry now serves that name, and "the pin published but
      # `latest` never moved" is precisely the class of defect that shipped 1.5.3. So the promote is
      # re-derived from OUTSIDE, over the Distribution API the way `docker pull` reads it, and all
      # four names must agree on ONE digest. Any disagreement names which half landed.
      - name: Assert the promote actually landed on all four names
        env:
          V: ${{ inputs.promote_to }}
          MOVE_LATEST: ${{ inputs.promote_latest }}
        run: |
          set -euo pipefail
          reg_digest() {  # reg_digest <auth-host> <registry-host> <repo> <tag>
            local auth_host="$1" reg_host="$2" repo="$3" tag="$4" token_url token
            if [ "$auth_host" = "auth.docker.io" ]; then
              token_url="https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull"
            else
              token_url="https://${auth_host}/token?service=${auth_host}&scope=repository:${repo}:pull"
            fi
            token="$(curl -fsS --max-time 30 "$token_url" | jq -r '.token // .access_token')"
            [ -n "$token" ] && [ "$token" != "null" ] || return 1
            curl -fsS --max-time 30 -I \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json' \
              "https://${reg_host}/v2/${repo}/manifests/${tag}" \
            | tr -d '\r' | grep -i '^docker-content-digest:' | awk '{print $2}'
          }
          hub_v="$(reg_digest auth.docker.io registry-1.docker.io getbusbar/busbar "$V" || true)"
          hub_l="$(reg_digest auth.docker.io registry-1.docker.io getbusbar/busbar latest || true)"
          ghcr_v="$(reg_digest ghcr.io ghcr.io getbusbar/busbar "$V" || true)"
          ghcr_l="$(reg_digest ghcr.io ghcr.io getbusbar/busbar latest || true)"
          echo "docker.io ${V}     = ${hub_v:-<none>}"
          echo "docker.io latest   = ${hub_l:-<none>}"
          echo "ghcr.io   ${V}     = ${ghcr_v:-<none>}"
          echo "ghcr.io   latest   = ${ghcr_l:-<none>}"
          fail=0
          [ -n "$hub_v" ] || { echo "::error::PARTIAL PROMOTE: docker.io/getbusbar/busbar:${V} does not resolve. The version pin was never created. Nothing downstream should treat ${V} as released."; fail=1; }
          # THE ASSERTED SET FOLLOWS THE PROMOTED SET, and that is the only honest way to do it. An
          # rc promote does not move `latest`, so asserting `latest == ${V}` would be asserting a
          # falsehood about a correct run, and asserting nothing would drop the 1.5.3 guard for real
          # releases. So the immutable pins are always asserted and the floating names are asserted
          # exactly when they were supposed to move.
          assert_pairs="ghcr.io ${V}:$ghcr_v"
          if [ "$MOVE_LATEST" = "true" ]; then
            assert_pairs="docker.io latest:$hub_l|${assert_pairs}|ghcr.io latest:$ghcr_l"
          else
            echo "rc promote: \`latest\` is NOT asserted against ${V} -- it still points at the current release, deliberately."
          fi
          IFS='|' read -r -a assert_arr <<< "$assert_pairs"
          for pair in "${assert_arr[@]}"; do
            name="${pair%%:*}"; got="${pair#*:}"
            if [ "$got" != "$hub_v" ] || [ -z "$got" ]; then
              echo "::error::PARTIAL PROMOTE: ${name} resolves to '${got:-<none>}' but docker.io/${V} is '${hub_v}'. Exactly the 1.5.3 shape: one name moved and another did not, and nothing was red. Fix: re-run docker.yml with promote_to=${V} (the promote is idempotent), then re-run this assertion."
              fail=1
            fi
          done
          # The armv8.0 compat names, same external re-derivation. When the compat pin exists it
          # must agree with its three sibling names AND must be a DIFFERENT digest from the main
          # manifest (a two-arch index and a single-arch armv8.0 image can never be the same
          # bytes; equality would mean the fast build got published under the compat name).
          v8_v="$(reg_digest auth.docker.io registry-1.docker.io getbusbar/busbar "${V}-armv8.0" || true)"
          v8_f="$(reg_digest auth.docker.io registry-1.docker.io getbusbar/busbar armv8.0 || true)"
          ghcr_v8_v="$(reg_digest ghcr.io ghcr.io getbusbar/busbar "${V}-armv8.0" || true)"
          ghcr_v8_f="$(reg_digest ghcr.io ghcr.io getbusbar/busbar armv8.0 || true)"
          echo "docker.io ${V}-armv8.0 = ${v8_v:-<none>}"
          echo "docker.io armv8.0     = ${v8_f:-<none>}"
          echo "ghcr.io   ${V}-armv8.0 = ${ghcr_v8_v:-<none>}"
          echo "ghcr.io   armv8.0     = ${ghcr_v8_f:-<none>}"
          if [ -z "$v8_v" ]; then
            # Mirrors the promote's recovery arm: a pre-dual-arm64 version legitimately has no
            # compat pin. Any version that staged one had it created above or the job already died.
            echo "::warning::docker.io/getbusbar/busbar:${V}-armv8.0 does not resolve; skipping the compat-name assertions (pre-dual-arm64 version recovery only)."
          else
            if [ "$v8_v" = "$hub_v" ]; then
              echo "::error::${V}-armv8.0 resolves to the SAME digest as ${V}. The compat name must carry the armv8.0 baseline build, not the default manifest."
              fail=1
            fi
            compat_pairs="ghcr.io ${V}-armv8.0:$ghcr_v8_v"
            if [ "$MOVE_LATEST" = "true" ]; then
              compat_pairs="docker.io armv8.0:$v8_f|${compat_pairs}|ghcr.io armv8.0:$ghcr_v8_f"
            fi
            IFS='|' read -r -a compat_arr <<< "$compat_pairs"
            for pair in "${compat_arr[@]}"; do
              name="${pair%%:*}"; got="${pair#*:}"
              if [ "$got" != "$v8_v" ] || [ -z "$got" ]; then
                echo "::error::PARTIAL PROMOTE (compat): ${name} resolves to '${got:-<none>}' but docker.io/${V}-armv8.0 is '${v8_v}'. Re-run docker.yml with promote_to=${V} (idempotent) and re-run this assertion."
                fail=1
              fi
            done
          fi
          [ "$fail" = 0 ] || exit 1
          if [ "$MOVE_LATEST" = "true" ]; then
            echo "PASS: docker.io ${V}, docker.io latest, ghcr.io ${V} and ghcr.io latest all resolve to ${hub_v}."
            [ -z "$v8_v" ] || echo "PASS: docker.io ${V}-armv8.0, docker.io armv8.0, ghcr.io ${V}-armv8.0 and ghcr.io armv8.0 all resolve to ${v8_v}."
          else
            echo "PASS: docker.io ${V} and ghcr.io ${V} resolve to ${hub_v}; the floating pointers were deliberately left alone (rc)."
            [ -z "$v8_v" ] || echo "PASS: docker.io ${V}-armv8.0 and ghcr.io ${V}-armv8.0 resolve to ${v8_v}."
          fi

  # Dynamically-linked glibc binaries, one per architecture, built on native runners (no QEMU).
  # GNU, NOT MUSL, and it is not a preference: the image must be able to `dlopen` a plugin cdylib,
  # and every published first-party plugin is a glibc artifact. See this file's header.
  build-binaries:
    name: glibc ${{ matrix.arch }}
    # NOT ON A PUSH. A push runs the proof job only; publishing stays driven by release-stage.yml /
    # release.yml exactly as before. `inputs.promote_to` is empty on a push event, so without the
    # event check this job would start building release binaries on every commit.
    if: ${{ github.event_name != 'push' && inputs.promote_to == '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # THREE PARALLEL LEGS, TWO ARM64 VARIANTS. `arm64` is the DEFAULT arm64 image: it raises
        # its ISA floor to armv8.1 (+lse — native atomic instructions; the armv8.0 baseline's
        # outline-atomics helper calls measured 12.1% of self-time on an arm64 server profile) and
        # becomes the multi-arch manifest's linux/arm64 entry, so every cloud/desktop arm64 pull
        # (all 2016+ cores: Graviton, Ampere, Neoverse, Apple, Raspberry Pi 5) gets the fast build.
        # `arm64-armv8.0` is byte-for-byte TODAY'S recipe — no +lse — for armv8.0 boards (Raspberry
        # Pi 4 class Cortex-A72), published under its own explicit `-armv8.0` tag suffix because a
        # Docker manifest cannot distinguish armv8.0 from armv8.1 under one name.
        #   baseline  "1" flips scripts/pgo-build.sh to the armv8.0 baseline (empty = default).
        include:
          - arch: amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            baseline: ""
          - arch: arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            baseline: ""
          - arch: arm64-armv8.0
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            baseline: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Keyed by ARCH, not target: the two arm64 legs share a triple but differ in RUSTFLAGS
          # (+lse vs baseline), and a shared cache would hand one leg the other's build products.
          key: ${{ matrix.arch }}

      # PGO release build (scripts/pgo-build.sh): instrumented build -> on-host training (native-arch
      # runner, so the musl-static instrumented binary executes locally) -> optimized build.
      # FAIL-CLOSED: PGO is MANDATORY. If any PGO phase fails the script exits non-zero and this
      # step (and the job) FAILS - it never falls back to a plain `cargo build --release`. On
      # success the script writes a proof marker at target/pgo/<target>/release/busbar.pgo-verified
      # which the verification step below asserts, so a non-PGO binary can never ship green.
      - name: Build static binary (PGO, required/fail-closed)
        env:
          # The busbar release ed25519 PUBLIC key, embedded at build time (plugin-sign's
          # option_env!) so the IMAGE binary verifies first-party signed plugins exactly like the
          # release.yml binaries do. Omitting it here was the gap that shipped Docker images unable
          # to verify any plugin (headroom-hook bundled-image smoke test, 2026-08-02).
          BUSBAR_RELEASE_PUBKEY: ${{ vars.BUSBAR_RELEASE_PUBKEY }}
          PGO_TARGET: ${{ matrix.target }}
          # "1" only on the armv8.0 compat leg: pgo-build.sh then omits the +lse floor, for BOTH
          # its instrumented and optimized phases (see the LSE_FLAG comment there).
          BUSBAR_ARM64_BASELINE: ${{ matrix.baseline }}
          # NO `CC: musl-gcc` AND NO MUSL LINKER OVERRIDES. The runner's own gcc targets the same
          # glibc the image's base ships, which is the whole point: the binary, the bundled SQLite
          # it links, and the plugin cdylibs it will later dlopen all speak one libc.
          #
          # The jemalloc-sys autoconf cache seeds below survive the musl removal deliberately. They
          # existed because a gnu-build/musl-host triplet mismatch made jemalloc's `configure`
          # believe it was cross-compiling and default its RUN-based atomics probes to "no"
          # (`atomic.h: #error "Don't have atomics implemented on this platform"`). A native gnu
          # build has no such mismatch and would probe correctly on its own, so these are now
          # belt-and-braces rather than load-bearing — kept, because the correct answers are the
          # correct answers on either path, and deleting them is a change with an upside of zero.
          je_cv_c11_atomics: "yes"
          je_cv_gcc_atomic_atomics: "yes"
          je_cv_gcc_u8_atomic_atomics: "yes"
          je_cv_gcc_sync_atomics: "yes"
          je_cv_gcc_u8_sync_atomics: "yes"
        run: |
          set -euo pipefail
          scripts/pgo-build.sh
          bin="target/pgo/${{ matrix.target }}/release/busbar"
          file "$bin"
          # THE ASSERTION IS NOW THE EXACT OPPOSITE OF WHAT IT USED TO BE, and the reversal is the
          # fix. It used to demand a FULLY STATIC binary "because FROM scratch has no loader" — and
          # a fully static musl binary cannot dlopen anything, so that line was, in effect, CI
          # enforcing that no plugin could ever load in the published image. It is now the
          # dlopen-capability gate: the binary must name a real interpreter and link glibc, or the
          # image it goes into can load no plugin of any kind and must not be built.
          #
          # Checked on the NATIVE leg only. `ldd` on a cross-arch binary reports about the host's
          # loader, not the artifact's; `file` above prints the truth for every leg either way, and
          # the Dockerfile runs this same assertion inside the build for the arch it is building.
          if ! ldd "$bin" 2>&1 | grep -q 'libc\.so\.6'; then
            echo "::error::$bin is not dynamically linked against glibc." >&2
            echo "::error::A busbar plugin is a cdylib and loading one is a dlopen; a static musl" >&2
            echo "::error::binary's dlopen is a stub that always fails, so the image built from" >&2
            echo "::error::this binary could load NO plugin of any kind. This is the 1.5.5 defect." >&2
            exit 1
          fi

      # POSITIVE PGO GATE: pgo-build.sh writes this marker ONLY after a non-empty merged profile
      # was fed to a successful -Cprofile-use build. Asserting it here (not just the script's exit
      # code) means a release cannot ship a non-PGO binary and still pass. Any missing/empty/
      # unverified marker fails the job and blocks the release.
      - name: Verify PGO was applied (marker gate)
        run: |
          set -euo pipefail
          marker="target/pgo/${{ matrix.target }}/release/busbar.pgo-verified"
          if [ ! -s "$marker" ]; then
            echo "::error::PGO proof marker missing or empty at $marker - refusing to ship a non-PGO binary" >&2
            exit 1
          fi
          echo "--- PGO proof marker ---"
          cat "$marker"
          grep -q '^pgo-verified=1$' "$marker" || { echo "::error::marker not marked verified" >&2; exit 1; }
          bytes="$(grep '^profile_bytes=' "$marker" | cut -d= -f2)"
          raw="$(grep '^profraw_count=' "$marker" | cut -d= -f2)"
          if [ -z "$bytes" ] || [ "$bytes" -le 0 ] 2>/dev/null; then
            echo "::error::merged profile was empty (profile_bytes=$bytes) - build was not PGO-optimized" >&2
            exit 1
          fi
          if [ -z "$raw" ] || [ "$raw" -le 0 ] 2>/dev/null; then
            echo "::error::no .profraw files fed the profile (profraw_count=$raw) - build was not PGO-optimized" >&2
            exit 1
          fi
          echo "PGO verified: ${bytes} bytes of merged profile from ${raw} .profraw file(s)."

      # BUILD-PROVENANCE STAMP, on the shipped binary (defense-in-depth beside the marker gate above).
      # crates/busbar/build.rs bakes the optimization posture into the binary; `busbar --build-info`
      # prints it. A PGO release binary MUST self-report `profile=release pgo=true opt-level=3
      # debug-assertions=false` — so even if the marker file were ever bypassed, the binary itself
      # would testify it was built non-PGO and this fails RED. Skipped ONLY when the binary is not
      # host-executable (a cross-arch target on this runner), where the marker gate is the authority.
      - name: Assert build-provenance stamp (pgo=true release)
        run: |
          set -euo pipefail
          bin="target/pgo/${{ matrix.target }}/release/busbar"
          # The gate RUNS the binary itself. This step's own probe only decides whether the binary
          # is host-executable at all (a cross-arch target on this runner is not); it never feeds
          # the gate a stamp. A stamp handed in on a command line is not evidence about any bytes,
          # which is why the gate's --line mode was removed.
          if "$bin" --build-info >/tmp/build-info.txt 2>/dev/null; then
            echo "--- build-provenance stamp ---"; cat /tmp/build-info.txt
            scripts/build-provenance-gate.sh "$bin" release true
          else
            echo "::notice::busbar --build-info not host-executable for ${{ matrix.target }} on this runner;"
            echo "::notice::the PGO marker gate above is the authoritative PGO proof for this cross target."
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: busbar-${{ matrix.arch }}
          path: target/pgo/${{ matrix.target }}/release/busbar
          if-no-files-found: error

      # ── NO PLUGIN IS BUNDLED INTO THIS IMAGE, AND THE MACHINERY THAT PRETENDED TO IS GONE ─────
      # What used to sit here built a headroom-hook cdylib inside a musl-native `rust:alpine`
      # container, extracted musl's libc/libgcc_s/libstdc++ beside it, signed a tarball and
      # uploaded all of it "so the image below can ship it pre-installed (see the Dockerfile)".
      # The Dockerfile never COPYed any of it. Three `COPY` lines, none of them a plugin — so the
      # bundled plugin never shipped, no gate ever noticed, and the only thing the apparatus
      # actually produced was a musl-linked plugin staged into a build context that ignored it.
      #
      # It is removed rather than wired up, for two reasons that point the same way. The
      # Dockerfile's own contract is "ships with ZERO plugins pre-installed — same treatment every
      # first-party plugin gets, store, auth, and hook alike", and a bundled hook would break the
      # kind-neutrality the rest of this release is spending commits to establish. And the cdylib
      # it built was a MUSL artifact, deliberately paired with the musl busbar that is now gone;
      # against a glibc busbar it could not have loaded even if the COPY had been there.
      #
      # Operators who want a plugin pre-wired get it from that plugin's own repo (headroom-hook
      # publishes `getbusbar/busbar-headroom`), and operators who want one HERE mount the signed
      # tarball — which the `image-loads-a-plugin` job below proves actually works, for a store
      # plugin and a hook plugin, on every push.


  # ── THE IMAGE LOADS A PLUGIN, PROVEN ON EVERY PUSH ──────────────────────────────────────────────
  # The gap this closes: `getbusbar/busbar:1.5.5` was FROM scratch over a static-pie musl binary and
  # could load NO plugin of any kind — the memfd path failed `dlopen failed`, the staging fallback
  # failed for want of a /tmp and then, given one, for the same dlopen — while the image's own
  # `--list-plugins` printed `LOADS (store.module: sqlite)` for the very tarball that then refused.
  # Nothing in this repository ran a plugin against the image, so nothing could see it. This job is
  # that missing measurement, and it runs on the commit rather than on the release.
  #
  # LOCAL ONLY. No registry login, no push, no tag. `docker build --load` into the runner's own
  # daemon, drive it, throw it away.
  image-loads-a-plugin:
    name: the image loads a plugin (store + hook)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: image-proof

      # A PLAIN RELEASE BUILD, NOT THE PGO ONE. The question here is linkage and loading, not speed:
      # a PGO build would triple the job for a property PGO cannot change. It IS `--release` and it
      # IS the workspace's own toolchain and target, so the binary under test is shaped like the one
      # that ships. BUSBAR_RELEASE_PUBKEY comes from .cargo/config.toml (committed, not a secret) —
      # without it the published first-party tarballs verify as unsigned and the probe would be red
      # for a reason that has nothing to do with the image.
      - name: Build busbar (release, this runner's glibc)
        run: cargo build -p busbar --release --locked

      # THE PUBLISHED TARBALLS, BY PINNED DIGEST. The subject is the artifact an operator actually
      # has. A tarball built on this runner would only prove busbar can load what busbar just
      # compiled, which is not the claim. The asset names and digests are DERIVED from
      # plugin-digests.tsv — the same file fetch-plugin.sh and the oracle cells read — so a plugin
      # that is re-pinned there is re-pinned here with no second copy to forget.
      - name: Fetch the published store + hook tarballs (digest-verified)
        run: |
          set -euo pipefail
          cache="$HOME/.cache/busbar-oracle/plugins"
          triple=x86_64-unknown-linux-gnu
          tsv=testing/shadow-oracle/plugin-digests.tsv
          for repo in store-sqlite headroom-hook; do
            row="$(awk -F'\t' -v n="$repo" -v t="$triple" '$1==n && index($3,t) {print; exit}' "$tsv")"
            [ -n "$row" ] || { echo "::error::no pinned ${triple} asset for ${repo} in ${tsv}"; exit 1; }
            tag="$(printf '%s' "$row" | cut -f2)"
            asset="$(printf '%s' "$row" | cut -f3)"
            want="$(printf '%s' "$row" | cut -f4)"
            dir="${cache}/${repo}/${tag}"; mkdir -p "$dir"
            curl -fsSL -m 300 -o "${dir}/${asset}" \
              "https://github.com/GetBusbar/${repo}/releases/download/${tag}/${asset}"
            got="$(sha256sum "${dir}/${asset}" | cut -d' ' -f1)"
            # FAIL CLOSED ON A DIGEST MISMATCH, and delete the bytes. A tarball that is not the
            # pinned one must never reach a dlopen, least of all in a job whose whole purpose is to
            # dlopen it.
            [ "$got" = "$want" ] || { rm -f "${dir}/${asset}"; \
              echo "::error::${asset}: expected ${want}, got ${got}"; exit 1; }
            echo "ok ${repo} ${tag} ${asset}"
          done

      # THE IMAGE, BUILT FROM THE TREE. Same Dockerfile, same context layout the publish job
      # arranges — so the thing proven here is the thing that ships, and the Dockerfile's own
      # `ldd`-must-name-libc.so.6 gate runs as part of it.
      - name: Build the image from this tree
        run: |
          set -euo pipefail
          mkdir -p binaries/amd64
          cp target/release/busbar binaries/amd64/busbar
          chmod +x binaries/amd64/busbar
          docker build --platform linux/amd64 -t busbar:ci-candidate .
          docker image inspect busbar:ci-candidate \
            --format 'candidate image: size={{.Size}} layers={{len .RootFS.Layers}} user={{.Config.User}}'

      - name: A store plugin AND a hook plugin load in it, and the store outlives the container
        run: scripts/image-loads-plugins.sh busbar:ci-candidate

      # THE LOGS OF THE RUN THAT FAILED ARE THE FINDING. Without this a red run says only which
      # assertion tripped, and the boot line that explains it (`dlopen failed`, `cannot create
      # private plugin staging dir ...`) is thrown away with the container.
      - name: Container logs (on failure)
        if: failure()
        run: docker ps -a --format '{{.Names}}' | grep '^busbar-image-proof' | xargs -r -n1 docker logs || true

  publish:
    name: build & push image
    needs: build-binaries
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      digest_armv8: ${{ steps.push-armv8.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Stage binaries + plugins into build context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: busbar-*
          path: staged

      - name: Arrange per-arch layout
        run: |
          # THE BUILD CONTEXT CARRIES EXACTLY WHAT THE DOCKERFILE COPYs AND NOTHING ELSE. It used
          # to also stage `plugins/<arch>/busbar-headroom.tar.gz` and `plugins/<arch>/lib/*` for a
          # bundled plugin the Dockerfile never referenced — files arranged for a COPY that did not
          # exist. A build context with contents nobody reads is a claim nobody checks.
          mkdir -p binaries/amd64 binaries/arm64
          mv staged/busbar-amd64/busbar binaries/amd64/busbar
          mv staged/busbar-arm64/busbar binaries/arm64/busbar
          chmod +x binaries/amd64/busbar binaries/arm64/busbar
          # armv8.0 compat image: its OWN build context directory, mirroring exactly what the
          # Dockerfile COPYs (Dockerfile + providers.yaml + docker/config.yaml + the binary),
          # with the BASELINE binary sitting at binaries/arm64/ — the same TARGETARCH path the
          # unmodified Dockerfile reads, so the compat image is the same image in every respect
          # except which arm64 binary it carries.
          mkdir -p compat-armv8.0/binaries/arm64 compat-armv8.0/docker
          mv staged/busbar-arm64-armv8.0/busbar compat-armv8.0/binaries/arm64/busbar
          chmod +x compat-armv8.0/binaries/arm64/busbar
          cp Dockerfile providers.yaml compat-armv8.0/
          cp docker/config.yaml compat-armv8.0/docker/config.yaml

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The LABEL version. This does not, and must not, decide any tag.
      - name: Resolve label version
        id: ver
        run: |
          VER="${{ inputs.label_version }}"; VER="${VER#v}"
          # Matches the plugin-pack step's fallback, so a bare `test` dispatch labels the image
          # honestly rather than with an empty string.
          [ -n "$VER" ] || VER="0.0.0-test"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          # EXACTLY ONE TAG COMES OUT OF THIS JOB, AND IT IS NEVER A VERSION.
          #   staging_tag set -> that throwaway name and nothing else.
          #   staging_tag empty (bare dispatch) -> `test` and nothing else.
          # `X.Y.Z` and `latest` are emitted by the `promote` job above, from already-verified
          # bytes. There is no `type=semver` line here any more and there must not be one: the old
          # `type=semver ... enable=<version != ''>` shape is what let a build decide, on its own,
          # whether a release existed. scripts/release-order-lint.py fails the build if `semver`,
          # or a `latest` raw tag, reappears in this block.
          tags: |
            type=raw,value=${{ inputs.staging_tag }},enable=${{ inputs.staging_tag != '' }}
            type=raw,value=test,enable=${{ inputs.staging_tag == '' }}
          # org.opencontainers.image.version IS SET EXPLICITLY, and it has to be. metadata-action
          # derives that label from the tag it computed, which under a throwaway name would make the
          # staged image claim `staging-abc1234` as its version -- and verify-deploy's check (d)
          # reads exactly this label to prove the tag and the bytes agree. Setting it from
          # label_version means the staged image already claims the version it will be promoted to,
          # so (d) is a real assertion at staging time and the promoted image needs no relabelling.
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.ver }}
            org.opencontainers.image.title=busbar
            org.opencontainers.image.description=The reliability layer for LLM traffic — one endpoint, six wire protocols, fault-attributed circuit breaking, in-flight failover.
            org.opencontainers.image.url=https://getbusbar.com
            org.opencontainers.image.documentation=https://getbusbar.com/docs/getting-started/
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # THE VERSION LABEL IS REPEATED HERE ON PURPOSE, AND IT IS NOT BELT-AND-BRACES FOR ITS OWN
          # SAKE. metadata-action derives an `org.opencontainers.image.version` label from the tag it
          # computed, which under a throwaway name would be `staging-<sha>`; the `labels:` input above
          # overrides it, but that override depends on metadata-action's merge order, which is a
          # property of a third-party action rather than of anything here. buildx applies `--label`
          # last-one-wins, so restating it after the generated block makes the outcome deterministic
          # regardless. This matters because verify-deploy's check (d) reads exactly this label: if it
          # ever said `staging-<sha>`, EVERY release would fail the staged gate, and a check that
          # blocks every release for a reason unrelated to the software is the fragile-gate defect.
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.ver.outputs.ver }}

      # ── THE armv8.0 COMPAT IMAGE ────────────────────────────────────────────────────────────
      # A Docker multi-arch manifest cannot carry two arm64 variants under one tag, so the +lse
      # build above IS the manifest's linux/arm64 entry and the armv8.0-compatible build (for
      # RPi4-class boards without the armv8.1 atomics) publishes under the SAME throwaway tag
      # with an explicit `-armv8.0` suffix. Never `latest`, never `X.Y.Z` — the promote job owns
      # those and mints `X.Y.Z-armv8.0` + the floating `armv8.0` pointer from these bytes.
      - name: Resolve the armv8.0 compat tag
        id: compat
        run: |
          set -euo pipefail
          base="${{ inputs.staging_tag }}"
          [ -n "$base" ] || base="test"
          echo "tag=${base}-armv8.0" >> "$GITHUB_OUTPUT"

      - name: Build and push the armv8.0 compat image (linux/arm64 only, suffixed tag)
        id: push-armv8
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: compat-armv8.0
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.compat.outputs.tag }}
            ${{ env.GHCR_IMAGE }}:${{ steps.compat.outputs.tag }}
          # Same labels, same deterministic version-label override, same reasoning as the main
          # push above: verify-deploy's check (d) must read X.Y.Z off the compat image too.
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.ver.outputs.ver }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # GHCR only: cosign stores signatures as sha256-*.sig tags, which we keep
      # off the Docker Hub tag list (clean public page). Hub verification runs
      # through the GitHub build-provenance attestation instead.
      - name: Sign GHCR image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"

      # The compat image gets the IDENTICAL supply-chain treatment: it is a first-class release
      # artifact, not a side build, so its digest is cosign-signed and attested the same way.
      - name: Sign GHCR armv8.0 compat image (keyless)
        env:
          DIGEST: ${{ steps.push-armv8.outputs.digest }}
        run: cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"

      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: index.docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub, armv8.0 compat)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: index.docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.push-armv8.outputs.digest }}
          push-to-registry: false

      - name: Attest build provenance (GHCR, armv8.0 compat)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.push-armv8.outputs.digest }}
          push-to-registry: true

  # CONSUMER-SIDE PROOF THAT THE TWO ARM64 VARIANTS ARE THE VARIANTS THEY CLAIM TO BE. Pulled
  # back from the registry (never reused from the build) on a REAL arm64 runner — which has the
  # armv8.1 atomics, so it can execute BOTH variants — and interrogated via the build-provenance
  # stamp: the default image must report `target-features=+lse`, the compat image must report the
  # baseline (`target-features=default`). Without this, swapping the two binaries in the publish
  # step would ship green: both boot, both answer --version, and only an armv8.0 board (or a
  # perf profile) would ever notice. Failing this job fails the whole workflow_call, so the
  # staging record is never written over a mislabeled variant.
  verify-arm64-variants:
    name: verify the two arm64 image variants (real arm64 runner)
    needs: publish
    if: ${{ inputs.promote_to == '' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Pull both staged arm64 images and assert their ISA variants
        env:
          BASE_TAG: ${{ inputs.staging_tag != '' && inputs.staging_tag || 'test' }}
        run: |
          set -euo pipefail
          default_img="${DOCKERHUB_IMAGE}:${BASE_TAG}"
          compat_img="${DOCKERHUB_IMAGE}:${BASE_TAG}-armv8.0"
          docker rmi -f "$default_img" "$compat_img" 2>/dev/null || true
          docker pull "$default_img"
          docker pull "$compat_img"
          def_info="$(docker run --rm "$default_img" --build-info)"
          cmp_info="$(docker run --rm "$compat_img" --build-info)"
          echo "default arm64: $def_info"
          echo "armv8.0 compat: $cmp_info"
          case "$def_info" in
            *"target-features=+lse"*) ;;
            *) echo "::error::the DEFAULT arm64 image does not self-report target-features=+lse — it would ship the armv8.0 baseline (outline-atomics calls on every atomic op) under the fast name." >&2; exit 1 ;;
          esac
          case "$cmp_info" in
            *"target-features=default"*) ;;
            *) echo "::error::the armv8.0 compat image reports unexpected target features — it must be the baseline build (no +lse), or armv8.0 boards (RPi4-class) get an illegal-instruction crash." >&2; exit 1 ;;
          esac
          echo "PASS: default arm64 image is +lse (armv8.1 floor); ${BASE_TAG}-armv8.0 is the armv8.0 baseline."
