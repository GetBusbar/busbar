# .github/workflows/oracle-record-store-cells.yml
#
# RECORD THE THREE STORE-BACKED ORACLE CELLS FROM THE PUBLISHED 1.5.5, AND HAND THEM TO A HUMAN.
#
# THE PROBLEM THIS SOLVES. `plugins.store-persist|store-{postgres,mysql,valkey}` are the only cells
# whose whole claim — spend, restart, read back — needs a real durable backend. A recording host
# that cannot stand the servers up reports them `missing.candidate`, which reds replay unless the
# loss is named as an accepted gap. So the golden owes three cells that only a machine with
# Postgres, MySQL and Valkey can record.
#
# THIS FILE IS NOW A CALLER, NOT A RECORDER. Everything the recording does — the pinned images, the
# readiness wait, the fixture URLs, the digest-verified 1.5.5 binary and plugins, the three-and-only-
# three filter, the all-PASS check, the self-merge, the merge notes, the teardown — lives in
# `testing/shadow-oracle/record-store-cells.sh`, and this job runs that one command.
#
# WHY. The recording used to live here as twenty-odd inline steps wired to GitHub's `services:`
# block, so it ran on a GitHub runner or it ran nowhere. It then stopped running even there: four of
# those steps invoked `testing/shadow-oracle/{record,fetch-golden,fetch-plugin}.sh` and
# `testing/shadow-oracle/merge-recordings.py`, every one of which left this tree when the oracle was
# extracted into GetBusbar/busbar-oracle. The recording path for three cells the golden owes had been
# broken for as long as nobody dispatched it — which is exactly how long a path that exists only as
# YAML goes unexercised. A script an operator can run on any box with docker (`bash
# testing/shadow-oracle/record-store-cells.sh`) is a path that gets run, and its breakage is found by
# the person who needed it rather than by the next release.
#
# WHAT THE `services:` BLOCK COST, AND WHY IT IS GONE. GitHub cannot read a file into a `services:`
# block, so the three `image:` digests had to be re-stated in YAML, and `scripts/service-images-
# check.sh` existed to prove the copies still matched `testing/fleet-fixtures/service-images.tsv`. A
# duplication made safe by a lint is still a duplication. The driver provisions through
# `testing/fleet-fixtures/store-services.sh`, which reads that table directly — the same table
# `ci.yml`'s shadow-oracle job records the CANDIDATE side against, which is the agreement that makes
# the two sides comparable — so there is nothing to re-state and nothing to drift. Docker is
# available on `ubuntu-latest`; the driver needs nothing else.
#
# WHY IT STILL CANNOT WRITE THE GOLDEN. The golden is the reviewed, committed answer to "what did
# 1.5.5 do". A gate that can rewrite its own reference is not a gate. The same rule applies to the
# thing that PRODUCES golden bytes: this job records, checks, and UPLOADS. It has `contents: read`,
# it never pushes, and a step below proves it left `testing/shadow-oracle/golden/` byte-identical to
# the checkout. A human runs `testing/shadow-oracle/import-store-cells.sh` on the downloaded
# artifact, reads the diff, and commits it under their own name. The recording is machine work;
# accepting it into the reference is a review.
name: oracle record store cells

on:
  workflow_dispatch:
  schedule:
    # Weekly, off the hour and off midnight. The recording is only interesting when the harness or
    # the pinned backends have moved, and a week is the cadence at which a stale golden is worth
    # noticing without the artifact list becoming noise. Nothing downstream WAITS for this run: it
    # produces an artifact a human collects, so a missed week costs nothing.
    - cron: '23 6 * * 1'

# LEAST PRIVILEGE, AND IT IS LOAD-BEARING HERE. This job's entire output is an artifact. It has no
# reason to read a secret, write a check, or touch a ref — and `contents: read` is what turns "this
# workflow must never push" from a comment into a property of the token it runs under.
permissions:
  contents: read

concurrency:
  # Two recordings of the same ref at once would fight over the same fixed port band and the same
  # service containers. The scheduled run yields to a human's dispatch rather than the reverse.
  group: oracle-record-store-cells-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    name: the three store cells, from the published 1.5.5, against real backends
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # THE DRIVER'S OWN RULES, FIRST AND BEFORE ANYTHING EXPENSIVE. No docker, no binary, no
      # network: it proves the three ids are the three cells.json declares need a fixture, that the
      # vars it exports are the ones the cell driver reads, that an INHERITED fixture URL is refused
      # (a caller's URL can point at any server, and the recording would then claim the pinned
      # digest's name while carrying another server's behaviour), that the pinned service table's
      # own rules hold, and that the golden this records for is the one on disk. Every one of those
      # is a way the run below could go green having recorded the wrong thing.
      - name: The recording driver's own rules (no docker, no binary)
        timeout-minutes: 5
        run: bash testing/shadow-oracle/record-store-cells.sh --selftest

      # THE FIXTURE GATE DECIDES BOTH WAYS. It is the single function that turns "this env var is
      # set" into RECORD and its absence into GAP, and this whole workflow exists to take its
      # recording arm. A gate that had quietly stopped reading the variable would name three gaps
      # in the run below and it would go green having recorded nothing.
      - name: The fixture gate decides both ways (fixture-gate selftest)
        timeout-minutes: 5
        run: ./bin/oracle fixture-gate-selftest

      # ONE COMMAND. Provision (pinned digests, readiness proven), export the three fixture URLs,
      # fetch the published binary and plugins by digest, record exactly the three ids, refuse
      # anything that is not three PASS rows, merge into a scratch recording, write the merge notes,
      # tear the backends down. Every one of those steps used to be a `run:` block here.
      - name: Record the three store cells
        timeout-minutes: 35
        run: bash testing/shadow-oracle/record-store-cells.sh --out target/oracle/store-cells

      # THE GOLDEN IS EXACTLY AS THE CHECKOUT LEFT IT. This workflow's whole contract is that it
      # PRODUCES a recording and never becomes one. `contents: read` stops it pushing; this stops it
      # having written a golden byte that a later step could have picked up and uploaded as though
      # it came off the recorder.
      - name: The golden was never touched
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain -- testing/shadow-oracle/golden)"
          [ -z "$dirty" ] || { echo "::error::this workflow modified the committed golden; it may only ever produce an artifact"; printf '%s\n' "$dirty"; exit 1; }
          echo "testing/shadow-oracle/golden: unchanged"

      # THE PATH LIST IS AN ALLOW-LIST, AND THAT IS A SECRETS DECISION. `raw/` — deliberately not
      # listed — holds each cell's working directory with its generated signing key and admin token,
      # and the key-mint responses whose `.token` is a live virtual key. `cells/`, the ledger, the
      # meta and the notes are the normalised view and are what the import consumes.
      - name: Upload the recorded cells and the merge notes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oracle-store-cells-${{ github.run_id }}
          path: |
            target/oracle/store-cells/merged/cells/
            target/oracle/store-cells/merged/ledger.tsv
            target/oracle/store-cells/merged/meta.json
            target/oracle/store-cells/merged/merge-notes.md
          if-no-files-found: error
          retention-days: 30
