name: jev conformance

# THE DECISIONS PLANE (jev) CONFORMANCE VERDICT — the job that writes `conformance/verdicts/jev.json`.
#
# `testing/jev-conformance/jev-conformance.sh` owns the legs and the judgement; this file runs each
# piece of it as its own job and fans them into `verdict`, the way the a2a, mcp, voice and ws
# batteries do:
#
#   gate-selftest     the rig's --selftest (the judge has no pass arm to reach, every red rule fires,
#                     and THIS FILE runs every battery target the crate has), plus the verdict-
#                     coverage lint over every conformance workflow.
#   battery-*         the decisions plane's own suites, one job per test target of
#                     `busbar-plane-decisions`: the lib (codec and plane units), `jev` (the dialect),
#                     `conformance`, `invariance`, `purity`, `durable_strings` (the PII witness) and
#                     `alloc_gate`. The targets are DISCOVERED by the rig (`--targets`); a test file
#                     added to the crate with no job here turns gate-selftest red.
#   subject           build busbar from this commit, boot it with a configured `decisions:` section
#                     and measure `POST /v1/systemone` against the absence code on the same boot. The
#                     measurement is published as job OUTPUTS; the judgement is the verdict's.
#
# THE VERDICT IS NEVER GREEN WITHOUT A SERVED LEG. While the decisions plane is registered and
# configured but no route serves its operation, the verdict is `fail`, reason "not served", and this
# workflow is RED. A mounted route with no served battery is also `fail`. The verdict file is uploaded
# as an artifact either way, so the release pipeline records the red rather than a missing file.
#
# busbar is PUBLIC and there is no secret anywhere in this file.

on:
  # SERIALISED BEHIND CI, as the other plane conformance workflows are: it runs on CI's completion on
  # `qa`, and every checkout pins the commit that CI run tested.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: jev-conformance-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  gate-selftest:
    name: gate self-test (the judgement and the battery split cannot be lied to)
    # THE ONE GATE. Every other job needs this one, so on a non-qa CI completion the whole battery
    # skips with it. A manual workflow_dispatch always proceeds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["qa"]'), github.event.workflow_run.head_branch))
    runs-on: latchkey-small
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: Prove the judgement bites and the battery split covers every target
        run: bash testing/jev-conformance/jev-conformance.sh --selftest
      - name: Prove the verdict-coverage lint bites
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 testing/verdict-covers-every-leg.py --selftest
      - name: The verdict must depend on, and judge, every leg
        run: python3 testing/verdict-covers-every-leg.py

  battery-lib:
    name: battery · lib (codec and plane units)
    needs: gate-selftest
    runs-on: latchkey-large
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: cargo test -p busbar-plane-decisions --lib (must RUN at least one test)
        run: bash testing/jev-conformance/jev-conformance.sh --battery lib

  battery-jev:
    name: battery · jev (the dialect)
    needs: gate-selftest
    runs-on: latchkey-large
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: cargo test -p busbar-plane-decisions --test jev (must RUN at least one test)
        run: bash testing/jev-conformance/jev-conformance.sh --battery jev

  battery-conformance:
    name: battery · conformance fixtures
    needs: gate-selftest
    runs-on: latchkey-large
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: cargo test -p busbar-plane-decisions --test conformance (must RUN at least one test)
        run: bash testing/jev-conformance/jev-conformance.sh --battery conformance

  battery-invariance:
    name: battery · invariance
    needs: gate-selftest
    runs-on: latchkey-large
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: cargo test -p busbar-plane-decisions --test invariance (must RUN at least one test)
        run: bash testing/jev-conformance/jev-conformance.sh --battery invariance

  battery-purity:
    name: battery · purity
    needs: gate-selftest
    runs-on: latchkey-large
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: cargo test -p busbar-plane-decisions --test purity (must RUN at least one test)
        run: bash testing/jev-conformance/jev-conformance.sh --battery purity

  battery-durable-strings:
    name: battery · durable strings (the PII witness)
    needs: gate-selftest
    runs-on: latchkey-large
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: cargo test -p busbar-plane-decisions --test durable_strings (must RUN at least one test)
        run: bash testing/jev-conformance/jev-conformance.sh --battery durable_strings

  battery-alloc-gate:
    name: battery · alloc gate
    needs: gate-selftest
    runs-on: latchkey-large
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: cargo test -p busbar-plane-decisions --test alloc_gate (must RUN at least one test)
        run: bash testing/jev-conformance/jev-conformance.sh --battery alloc_gate

  subject:
    name: subject (busbar, built from this commit, serving POST /v1/systemone)
    needs: gate-selftest
    runs-on: latchkey-xlarge
    # BOUNDED: one bin build and one boot.
    timeout-minutes: 30
    outputs:
      build: ${{ steps.served.outputs.build }}
      booted: ${{ steps.served.outputs.booted }}
      absent: ${{ steps.served.outputs.absent }}
      code: ${{ steps.served.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Build, boot and measure the served leg
        id: served
        run: bash testing/jev-conformance/jev-conformance.sh --served

  verdict:
    name: jev verdict (battery + served leg)
    runs-on: latchkey-small
    timeout-minutes: 10
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        contains(fromJSON('["qa"]'), github.event.workflow_run.head_branch)))
    needs:
      - gate-selftest
      - battery-lib
      - battery-jev
      - battery-conformance
      - battery-invariance
      - battery-purity
      - battery-durable-strings
      - battery-alloc-gate
      - subject
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: Every leg must have EXECUTED; judge the battery and the served leg
        env:
          GATE_SELFTEST: ${{ needs.gate-selftest.result }}
          BATTERY_LIB: ${{ needs.battery-lib.result }}
          BATTERY_JEV: ${{ needs.battery-jev.result }}
          BATTERY_CONFORMANCE: ${{ needs.battery-conformance.result }}
          BATTERY_INVARIANCE: ${{ needs.battery-invariance.result }}
          BATTERY_PURITY: ${{ needs.battery-purity.result }}
          BATTERY_DURABLE_STRINGS: ${{ needs.battery-durable-strings.result }}
          BATTERY_ALLOC_GATE: ${{ needs.battery-alloc-gate.result }}
          SUBJECT: ${{ needs.subject.result }}
          SERVED_BUILD: ${{ needs.subject.outputs.build }}
          SERVED_BOOTED: ${{ needs.subject.outputs.booted }}
          SERVED_ABSENT: ${{ needs.subject.outputs.absent }}
          SERVED_CODE: ${{ needs.subject.outputs.code }}
        run: |
          set -euo pipefail
          # gate-selftest and subject must have RUN: a skipped or cancelled job measured nothing.
          # Their results feed the judge rather than short-circuiting it, so the verdict file is
          # written (and uploaded) in every case.
          battery=0
          for leg in "battery-lib=$BATTERY_LIB" "battery-jev=$BATTERY_JEV" \
                     "battery-conformance=$BATTERY_CONFORMANCE" "battery-invariance=$BATTERY_INVARIANCE" \
                     "battery-purity=$BATTERY_PURITY" "battery-durable-strings=$BATTERY_DURABLE_STRINGS" \
                     "battery-alloc-gate=$BATTERY_ALLOC_GATE"; do
            if [ "${leg#*=}" != "success" ]; then
              echo "::error::${leg%%=*} did not succeed (result: ${leg#*=}). A leg that did not EXECUTE is red, not skipped."
              battery=1
            fi
          done
          if [ "$GATE_SELFTEST" != "success" ]; then
            echo "::error::gate-selftest did not succeed (result: $GATE_SELFTEST); no judgement is believed"
            battery=1
          fi
          build="${SERVED_BUILD:-}"
          if [ "$SUBJECT" != "success" ] || [ -z "$build" ]; then
            echo "::error::subject did not succeed (result: $SUBJECT); nothing was booted or judged"
            build="the subject job did not run to completion (result: $SUBJECT)"
          fi
          bash testing/jev-conformance/jev-conformance.sh \
            --judge "$battery" "$build" "${SERVED_BOOTED:-0}" "${SERVED_ABSENT:-}" "${SERVED_CODE:-}" \
            --out jev.json \
            --run-id "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Upload the verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-verdict-jev
          path: jev.json
      - name: The verdict must be a pass
        run: |
          set -euo pipefail
          status="$(python3 -c 'import json; print(json.load(open("jev.json"))["status"])')"
          reason="$(python3 -c 'import json; print(json.load(open("jev.json")).get("reason", ""))')"
          if [ "$status" != "pass" ]; then
            echo "::error::jev verdict is ${status}: ${reason}"
            exit 1
          fi
