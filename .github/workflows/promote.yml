name: promote
# Every same-repo PR is one hop up the branch ladder. The hop is GetBusbar/busbar-release's
# ci/promote scripts at RELEASE_REF (private, so no `uses:`); these jobs only check out both repos
# and run them. BOARD (fast-forward of the base) runs only when vars.PROMOTE_BOARD is "true".
on: pull_request
concurrency: { group: "promote-${{ github.event.pull_request.number }}", cancel-in-progress: true }
permissions: { contents: read }
env:
  RELEASE_REF: c35a96823468f40505a997380c8374d36b5230d0
  SHA: ${{ github.event.pull_request.head.sha }}
  TO: ${{ github.base_ref }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
jobs:
  preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs: { runner: "${{ steps.pre.outputs.runner }}" }
    steps:
      - { uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262, with: { ref: "${{ env.SHA }}", path: busbar } } # v4
      - { uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262, with: { repository: GetBusbar/busbar-release, ref: "${{ env.RELEASE_REF }}", token: "${{ secrets.TURNSTILE_DISPATCH_TOKEN }}", path: busbar-release, persist-credentials: false } } # v4
      - { id: pre, run: bash busbar-release/ci/promote/preflight.sh }
  hop:
    needs: preflight
    runs-on: ${{ needs.preflight.outputs.runner }}
    timeout-minutes: 330
    # The test services the old ci.yml `check` job gave `cargo test --workspace` (the hop's --build-test),
    # reached by container address (scripts/ci-service-endpoints.sh), never a published host port.
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env: { POSTGRES_USER: busbar, POSTGRES_PASSWORD: busbar, POSTGRES_DB: busbar_test }
        options: --health-cmd "pg_isready -U busbar" --health-interval 10s --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey:8@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
        options: --health-cmd "valkey-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - { uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262, with: { ref: "${{ env.SHA }}", path: busbar, fetch-depth: 0 } } # v4
      - run: busbar/scripts/ci-service-endpoints.sh postgres=${{ job.services.postgres.id }} valkey=${{ job.services.valkey.id }}
      - { uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262, with: { repository: GetBusbar/busbar-release, ref: "${{ env.RELEASE_REF }}", token: "${{ secrets.TURNSTILE_DISPATCH_TOKEN }}", path: busbar-release, persist-credentials: false } } # v4
      - run: bash busbar-release/ci/promote/hop.sh
        env: { R2_KEY_ID: "${{ secrets.R2_CACHE_ACCESS_KEY_ID }}", R2_KEY_SECRET: "${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}" }
      - { if: always(), uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02, with: { name: "turnstile-report-${{ env.SHA }}", path: "artifacts/turnstile-*.json", if-no-files-found: warn } } # v4
      - if: vars.PROMOTE_BOARD == 'true'
        run: bash busbar-release/ci/promote/board.sh
        env: { GITHUB_TOKEN: "${{ secrets.BUSBAR_TRAIN_TOKEN }}" }
