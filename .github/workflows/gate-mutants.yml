# gate-mutants — THE RATCHET IS ITSELF UNDER TEST, MECHANICALLY, ON EVERY PUSH.
#
# THE LAW THIS WORKFLOW HOLDS. Every rule in this tree is enforced by a gate, and every gate is a
# program that says NO. The only way a gate fails is by SAYING NOTHING: delete a check's body,
# force its `ok` argument true, turn an `offenders.push` into a `drop`, and it still compiles, still
# prints PASS, and nothing notices. A hand audit found 53 such holes in four gates in one pass. A
# hand audit is not a gate. This is.
#
# WHAT IT DOES. On any push that touches gate code, gate data, the landing runner or the workflows,
# it runs `cargo-mutants` over the CHANGED RUST ONLY, with the four gates' own `--selftest` as the
# test command. A mutant that survives that command is a line of gate code no self-test case holds
# down. Any survivor makes `gate-mutants` red, and `gate-mutants` is a required check on `qa` and
# `main` (scripts/ci-branch-protection.sh). There is no human step between the red and the fix.
#
# WHY IT IS ITS OWN WORKFLOW AND NOT A JOB IN ci.yml. Its shape is different from every job there:
# a fan-out matrix whose WIDTH is computed at run time from the diff, on a trigger whose work is
# path-scoped. Folding that into ci.yml would put a dynamic matrix inside the umbrella's `needs:`
# accounting, where `ci-umbrella`'s membership rules cannot read it. The umbrella stays a fixed list
# of fixed jobs; this stays a required check of its own, named in branch protection alongside it.
#
# WHY THE REQUIRED CHECK IS NOT PATH-FILTERED. A required status that a `paths:` filter can decline
# to report is a required status that blocks every unrelated pull request forever, which is how
# required checks get removed. So the WORKFLOW always runs and the required job `gate-mutants`
# always reports; the expensive WORK is what the scope decides. A push with no gate Rust in it gets
# a green `gate-mutants` in about a minute, honestly, having measured that there was nothing to
# measure.
name: gate-mutants

on:
  push:
    # Same branch set as ci.yml. `keep-*` WAS here and is not any more, and it is not an ungating:
    # with ~15 live hand-back branches each fanning 24 shards onto the Latchkey minute pool, the
    # per-branch `concurrency:` below cannot help (it cancels a branch's OWN superseded run, not its
    # neighbours'), and the integration tip's proof sat starved behind slot work — exactly the
    # arithmetic docs/ci/self-hosted-runners.md §1-2 predicts (folded here from CI2's
    # 363ac81b8, which is not an ancestor of this branch). A slot that touches the mutation
    # scope (`xtask/src/gates/**` et al., scripts/gate-mutants.sh) runs the same proof by hand —
    # `scripts/gate-mutants.sh --shard 1/1` — and says so in its hand-back; the 24-shard run then
    # happens at landing, on the integration branch, where the required check is read from.
    # `!wip/**` for the same reason ci.yml carries it — checkpoint pushes arrive by the dozen.
    branches: ['integration/**', 'dev', 'qa', 'main', '!wip/**']
  pull_request:
  workflow_dispatch:
    inputs:
      shards:
        description: 'How many shards to fan the mutants out over'
        required: false
        default: '24'

concurrency:
  group: gate-mutants-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # PINNED. A mutation job whose tool floats is a job whose verdict can change without a commit —
  # the same tree would be green one week and red the next, and neither would be a fact about the
  # tree. Bump this deliberately, in a commit, like any other pin.
  CARGO_MUTANTS_VERSION: "27.1.0"
  # THE FAN-OUT. Wall clock is (baseline) + (mutants-per-shard x one full four-gate self-proof).
  # One self-proof is roughly half an hour, so the shard count is chosen to keep the expected
  # mutants-per-shard at one for a normal landing-sized diff. The fleet is ~40 busbar-xl runners;
  # 24 leaves room for the rest of CI to run beside it.
  SHARD_COUNT: "24"

jobs:
  # -------------------------------------------------------------------------------------------
  # WHAT THIS PUSH ACTUALLY CHANGED. Cheap, and the only job that decides whether the rest runs.
  # -------------------------------------------------------------------------------------------
  scope:
    name: gate-mutants scope
    runs-on: latchkey-small

    timeout-minutes: 10
    outputs:
      in_scope: ${{ steps.scope.outputs.in_scope }}
      shards: ${{ steps.scope.outputs.shards }}
      matrix: ${{ steps.scope.outputs.matrix }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fetch the line the branch is measured against
        # `ceiling-rose`'s ref, spelled once in scripts/gate-mutants.sh. Without it the merge-base
        # cannot be computed and the script REFUSES (exit 2) rather than reporting an empty scope —
        # a shallow clone must never read as "nothing changed".
        run: |
          git fetch --no-tags --quiet origin \
            +refs/heads/integration/oracle-phase0:refs/remotes/origin/integration/oracle-phase0
      - name: The scope script proves itself
        run: scripts/gate-mutants.sh --selftest
      - name: What is in scope
        id: scope
        run: |
          set -euo pipefail
          files="$(scripts/gate-mutants.sh --scope)"
          echo "in scope on this push:"
          printf '%s\n' "$files" | sed 's/^/  /'
          if [ -n "$files" ]; then in=yes; else in=no; fi
          n="${{ github.event.inputs.shards || env.SHARD_COUNT }}"
          matrix="$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$n")"
          {
            echo "in_scope=$in"
            echo "shards=$n"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------------------------
  # THE BASELINE. The test command, on the UNMUTATED tree, once for the whole commit.
  #
  # THE SHARDS RUN THEIR OWN BASELINE TOO, and this job does not replace it: a shard's baseline is
  # about the scratch copy cargo-mutants builds, and this one is about the checkout. The first run
  # of this workflow was read as those two disagreeing — the lib suite passing here and failing
  # there — and that reading was wrong. Both were failing, for one reason, in one place: this
  # workflow never fetched `refs/backup/audit-pins/*`, so `audit-ledger` could not resolve thirteen
  # of the register's commits on the runner, and the scratch copy inherited the same empty pin set
  # because `--copy-vcs true` copies the refs it was given. The fetch step above is the fix.
  #
  # The per-shard baseline stays anyway, and not out of superstition: it is the only thing that can
  # observe the environment a mutant is actually tested in, and a campaign whose baseline is assumed
  # rather than measured scores every mutant CAUGHT the moment that assumption breaks.
  #
  # What this job adds is the plain statement, on the tree as it actually stands, that the four
  # gates DO hold their own planted faults. If it is red, `gate-mutants` is red, and no shard's
  # "caught" means anything.
  # -------------------------------------------------------------------------------------------
  baseline:
    name: gate-mutants baseline (the four gates, unmutated)
    needs: scope
    if: needs.scope.outputs.in_scope == 'yes'
    runs-on: latchkey-xlarge

    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fetch the line the branch is measured against
        run: |
          git fetch --no-tags --quiet origin \
            +refs/heads/integration/oracle-phase0:refs/remotes/origin/integration/oracle-phase0
      - name: Fetch the audit pins (no checkout carries refs/audit-pins/*)
        # WITHOUT THIS STEP EVERY SHARD REPORTS BASELINE RED, AND THAT IS NOT A FIGURE OF SPEECH:
        # it is what the first two runs of this workflow did. `audit-ledger`'s
        # `audited-at-reachable` row asks whether every commit the register names can still be
        # produced -- an ancestor of HEAD, or of an audit pin. Pins are written locally under
        # `refs/audit-pins/*` and MIRRORED to `refs/backup/audit-pins/*`, and neither `git clone`
        # nor `actions/checkout` carries anything outside `refs/heads/*` and `refs/tags/*`. On a
        # runner that has not fetched the mirror the pin set is EMPTY, thirteen of the register's
        # commits read as unreachable, and two `audit_ledger` cases in `cargo test -p xtask --lib`
        # go red for a reason that has nothing to do with any mutation.
        #
        # `cargo-mutants`' scratch copy was blamed for this and is innocent: `--copy-vcs true`
        # copies `.git` faithfully, so the copy carries exactly the refs the checkout had -- no
        # pins in, no pins out. The difference was never checkout-vs-copy, it was runner-vs-laptop.
        # ci.yml and keep-proof.yml already carried this fetch; this workflow did not.
        run: git fetch origin '+refs/backup/audit-pins/*:refs/audit-pins/*'
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Latchkey Fast Cache (cargo registry + target, restore)
        uses: latchkey-dev/cache-action@d0dd21912a57c7435649c77f689b68d348d8a662 # v1
        with:
          action: restore
          key: cargo-${{ runner.os }}-baseline-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
      - name: Build the gate runner once
        run: cargo build -p xtask --locked
      - name: The test command, unmutated
        # THE SAME COMMAND THE SHARDS RUN, INCLUDING THE SAME GATE LIST. `--gates` computes it from
        # the diff (see scripts/gate-mutants.sh): a diff confined to one gate's directory needs only
        # that gate's self-proof, because no other gate's self-proof runs the stubbed line. A
        # baseline proving a WIDER command than the shards run would be a baseline about a different
        # command, and this job exists precisely to be about the shards' command.
        env:
          XTASK_GATE_MUTATION_PROOF: "1"
          XTASK_GATE_CEILING_SECS: "3600"
        run: |
          set -euo pipefail
          gates="$(scripts/gate-mutants.sh --gates)"
          echo "gate self-proofs in the test command: $gates"
          XTASK_GATE_MUTATION_GATES="$gates" cargo test -p xtask --lib --test gate_mutation_proof

  # -------------------------------------------------------------------------------------------
  # THE MUTANTS. One shard per runner; every shard sees the same diff and the same denominator, or
  # cargo-mutants' own sharding stops agreeing on how the work is divided.
  # -------------------------------------------------------------------------------------------
      - name: Latchkey Fast Cache (cargo registry + target, save)
        uses: latchkey-dev/cache-action@d0dd21912a57c7435649c77f689b68d348d8a662 # v1
        with:
          action: save
          key: cargo-${{ runner.os }}-baseline-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
  shard:
    name: gate-mutants shard ${{ matrix.shard }}
    needs: scope
    if: needs.scope.outputs.in_scope == 'yes'
    runs-on: latchkey-xlarge

    # 120, NOT 55, AND THE NUMBER IS MEASURED RATHER THAN GUESSED. A shard pays the test command
    # twice for one mutant -- once as its baseline, once for the mutant -- and the widest test
    # command measures 39m43 (docs/ci/gate-integrity.md). 55 minutes could not hold that, and a
    # shard that times out is red ABOUT THE CLOCK rather than about the tree, which is the least
    # useful red there is. The narrowing brings a construction-scoped push to ~14m; a
    # kind-isolation-scoped one is still ~67m, and this is the number that lets it report.
    timeout-minutes: 120
    strategy:
      # fail-fast OFF on purpose. The output of this job is the LIST of survivors; cancelling the
      # other 23 shards the moment one of them finds a hole reports one hole and hides the rest,
      # which turns a single mechanical run into a queue of runs.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fetch the line the branch is measured against
        run: |
          git fetch --no-tags --quiet origin \
            +refs/heads/integration/oracle-phase0:refs/remotes/origin/integration/oracle-phase0
      - name: Fetch the audit pins (no checkout carries refs/audit-pins/*)
        # WITHOUT THIS STEP EVERY SHARD REPORTS BASELINE RED, AND THAT IS NOT A FIGURE OF SPEECH:
        # it is what the first two runs of this workflow did. `audit-ledger`'s
        # `audited-at-reachable` row asks whether every commit the register names can still be
        # produced -- an ancestor of HEAD, or of an audit pin. Pins are written locally under
        # `refs/audit-pins/*` and MIRRORED to `refs/backup/audit-pins/*`, and neither `git clone`
        # nor `actions/checkout` carries anything outside `refs/heads/*` and `refs/tags/*`. On a
        # runner that has not fetched the mirror the pin set is EMPTY, thirteen of the register's
        # commits read as unreachable, and two `audit_ledger` cases in `cargo test -p xtask --lib`
        # go red for a reason that has nothing to do with any mutation.
        #
        # `cargo-mutants`' scratch copy was blamed for this and is innocent: `--copy-vcs true`
        # copies `.git` faithfully, so the copy carries exactly the refs the checkout had -- no
        # pins in, no pins out. The difference was never checkout-vs-copy, it was runner-vs-laptop.
        # ci.yml and keep-proof.yml already carried this fetch; this workflow did not.
        run: git fetch origin '+refs/backup/audit-pins/*:refs/audit-pins/*'
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Latchkey Fast Cache (cargo registry + target, restore)
        uses: latchkey-dev/cache-action@d0dd21912a57c7435649c77f689b68d348d8a662 # v1
        with:
          action: restore
          key: cargo-${{ runner.os }}-shard-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
      - name: Cache the pinned cargo-mutants binary (restore)
        id: mutants-cache
        uses: latchkey-dev/cache-action@d0dd21912a57c7435649c77f689b68d348d8a662 # v1
        with:
          action: restore
          key: cargo-mutants-${{ env.CARGO_MUTANTS_VERSION }}-linux-x64
          path: ~/.cargo/bin/cargo-mutants
      - name: Install cargo-mutants (pinned)
        if: steps.mutants-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-mutants --version "${CARGO_MUTANTS_VERSION}" --locked
      - name: Cache the pinned cargo-mutants binary (save)
        uses: latchkey-dev/cache-action@d0dd21912a57c7435649c77f689b68d348d8a662 # v1
        with:
          action: save
          key: cargo-mutants-${{ env.CARGO_MUTANTS_VERSION }}-linux-x64
          path: ~/.cargo/bin/cargo-mutants
      - name: Mutate the changed gate code, shard ${{ matrix.shard }}
        env:
          # NOT `skip`. The baseline is a property of the commit IN THE SCRATCH COPY, and the
          # scratch copy is a thing only the shard can see — the first run of this job proved it,
          # by reporting every mutant CAUGHT because the unmutated test command was already failing
          # there for an unrelated reason. See scripts/gate-mutants.sh.
          GATE_MUTANTS_BASELINE: run
          GATE_MUTANTS_JOBS: "4"
          GATE_MUTANTS_TIMEOUT: "5400"
        run: scripts/gate-mutants.sh --shard "${{ matrix.shard }}/${{ needs.scope.outputs.shards }}"
      - name: Keep the shard's outcome for the record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-mutants-shard-${{ matrix.shard }}
          path: |
            mutants.out/
            target/gate-mutants.diff
          if-no-files-found: ignore
          retention-days: 14

  # -------------------------------------------------------------------------------------------
  # THE REQUIRED CHECK. Named `gate-mutants` and nothing else, because that is the string branch
  # protection holds. It runs on every event, including the ones where there was no work, so the
  # status always reports.
  # -------------------------------------------------------------------------------------------
      - name: Latchkey Fast Cache (cargo registry + target, save)
        uses: latchkey-dev/cache-action@d0dd21912a57c7435649c77f689b68d348d8a662 # v1
        with:
          action: save
          key: cargo-${{ runner.os }}-shard-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
  gate-mutants:
    name: gate-mutants
    needs: [scope, baseline, shard]
    if: always()
    runs-on: latchkey-small

    timeout-minutes: 10
    steps:
      - name: Verdict
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BASELINE_RESULT: ${{ needs.baseline.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
          IN_SCOPE: ${{ needs.scope.outputs.in_scope }}
        run: |
          set -uo pipefail
          echo "scope=$SCOPE_RESULT baseline=$BASELINE_RESULT shards=$SHARD_RESULT in_scope=$IN_SCOPE"

          # A scope job that did not succeed says nothing about the tree. Nothing is not green.
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "RED: the scope job did not succeed ($SCOPE_RESULT). Without a scope this run \
          measured no mutants, and a run that measured nothing is not a run that found nothing."
            exit 1
          fi

          if [ "$IN_SCOPE" != "yes" ]; then
            # Honest green: the diff touched no gate source, gate data, landing runner or workflow.
            echo "GREEN: nothing in the mutation scope changed on this push."
            exit 0
          fi

          rc=0
          if [ "$BASELINE_RESULT" != "success" ]; then
            echo "RED: the four gates do not hold their own planted faults on the UNMUTATED tree \
          ($BASELINE_RESULT). Every 'caught' in every shard is meaningless until that is fixed."
            rc=1
          fi
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "RED: at least one shard reported a SURVIVING mutant ($SHARD_RESULT) -- gate code \
          that this branch changed and that no self-test case holds down. Open the red shard jobs \
          above; each prints the exact file, line and stub that survived."
            rc=1
          fi
          [ "$rc" = "0" ] && echo "GREEN: every mutant in the changed gate code was CAUGHT by the \
          gates' own self-proof."
          exit $rc
