name: Security

# Supply-chain checks: scan the dependency graph for known advisories and enforce
# the license/source/duplicate policy in deny.toml. Runs on dependency changes AND
# on a weekly schedule — a crate already in Cargo.lock can have an advisory filed
# AFTER it was merged, so PR-time scanning alone is not enough.
on:
  # QA-gate + weekly (owner ruling, DECISIONS #78). The qa-boundary run now fires on CI's COMPLETION
  # rather than on the qa push directly (mirrors qa-gate.yml): no point scanning a commit whose cheap
  # compile has not gone green. The job `if:` below only proceeds when that CI run concluded `success`
  # on `qa` — or on the weekly schedule, which is independent of CI and kept as-is. `workflow_run`
  # checks out the default branch by default, so the checkout pins the CI run's head sha.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    # Mondays 07:00 UTC — catch newly-disclosed advisories against pinned deps.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (advisories · licenses · sources · bans) + cargo-audit
    # Run on the weekly schedule, or after a qa CI run went green. A non-qa CI completion skips.
    if: >-
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["qa"]'), github.event.workflow_run.head_branch))
    runs-on: latchkey-large
    permissions:
      # Read the code under scan.
      contents: read
      # rustsec/audit-check annotates the run with a check. On a `schedule` trigger it would
      # also self-file a GitHub issue per new advisory if granted `issues: write` — exactly the
      # self-filed-issue anti-pattern `no-self-filed-issues` (xtask gate) exists to refuse, so
      # that scope is withheld on purpose. Losing it does not affect the check-annotation path
      # above, which is the only one `push`/`pull_request`/`workflow_run` triggers ever reach;
      # on the weekly schedule, advisory issue creation now no-ops instead of self-filing.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # workflow_run defaults to the default branch; pin to the CI run's tested commit (empty on
          # the schedule, where it falls back to the default branch, as before).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses sources bans
      # cargo-audit alongside cargo-deny: both read RustSec, but audit is the RustSec
      # project's own scanner and cross-checks deny's advisories view against the source of
      # truth (and surfaces yanked crates). Same job, same qa+weekly cadence — a crate
      # already pinned in Cargo.lock can have an advisory filed after it was merged.
      - name: cargo-audit (RustSec advisories)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
