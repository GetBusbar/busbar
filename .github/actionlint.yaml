# actionlint's runner-label check works off a built-in list of GitHub-HOSTED labels. `busbar-xl` is
# ours — the label scripts/ci-runners-register.sh gives every agent on the EC2 fleet — so without
# this file actionlint reports every `runs-on: [self-hosted, linux, x64, busbar-xl]` in the repo as
# an unknown label, and a lint that cries wolf on 32 correct lines is a lint nobody reads.
#
# `latchkey-small|medium|large|xlarge` are Latchkey's runner-size labels (latchkey.dev), used by
# ci.yml, keep-proof.yml and gate-mutants.yml's `runs-on:` lines now that those three workflows are
# migrated off the EC2 fleet. Without declaring them here actionlint reports each one as an unknown
# label — 37 findings measured on this migration (LK-4) — for the same reason `busbar-xl` needed
# declaring: they are real, fleet-issued (Latchkey-issued) labels, not typos.
#
# Declaring it here is not a way of silencing the check; it is the check working as designed. The
# list below is the ONLY custom labels the fleets issue, so a typo (`busbar-x1`, `latchkey-xlage`, a
# label no runner actually carries) is still caught — the job would otherwise sit queued forever.
#
# THIS IS NOT A CI GATE TODAY. No workflow in .github/workflows/ invokes actionlint; the only caller
# is scripts/land.sh's staged-file check, and even there it is conditional on
# `command -v actionlint` — a contributor without the binary installed silently falls back to a plain
# `yaml.safe_load` parse (which cannot catch a bad runner label at all). So "actionlint says so before
# it is pushed" is true only for a contributor who both has actionlint installed AND runs
# `scripts/land.sh` before pushing; nothing here or in CI enforces either. Wiring an unconditional
# actionlint step into a workflow (so this file's labels are actually checked on every push/PR) is a
# `.github/workflows/` change, outside this file's scope.
self-hosted-runner:
  labels:
    - busbar-xl
    - latchkey-small
    - latchkey-medium
    - latchkey-large
    - latchkey-xlarge
