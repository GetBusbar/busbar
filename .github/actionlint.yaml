# actionlint's runner-label check works off a built-in list of GitHub-HOSTED labels.
#
# `latchkey-small|medium|large|xlarge` are Latchkey's runner-size labels (latchkey.dev), used by
# ci.yml, keep-proof.yml and gate-mutants.yml's `runs-on:` lines now that those three workflows are
# migrated off the (now decommissioned) EC2 fleet. Without declaring them here actionlint reports
# each one as an unknown label — 37 findings measured on the migration (LK-4) — because they are
# real, fleet-issued (Latchkey-issued) labels, not typos.
#
# `busbar-xl` — the label the old EC2 fleet's runner agents carried — is gone from this file as of
# the EC2 decommission (LK-5): no `runs-on:` line in the tree names it any more, and declaring a
# label no runner will ever carry again is exactly the kind of stale entry this file exists to
# avoid keeping around.
#
# Declaring these here is not a way of silencing the check; it is the check working as designed.
# The list below is the ONLY custom labels the fleet issues, so a typo (`latchkey-xlage`, a label no
# runner actually carries) is still caught — the job would otherwise sit queued forever, and
# actionlint says so before it is pushed.
self-hosted-runner:
  labels:
    - latchkey-small
    - latchkey-medium
    - latchkey-large
    - latchkey-xlarge
