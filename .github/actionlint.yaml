# actionlint's runner-label check works off a built-in list of GitHub-HOSTED labels. `busbar-xl` is
# ours — the label the EC2 runner fleet (busbar-release-autoscaler) gives every agent — so without
# this file actionlint reports every `runs-on: [self-hosted, linux, x64, busbar-xl]` in the repo as
# an unknown label, and a lint that cries wolf on 32 correct lines is a lint nobody reads.
#
# `latchkey-small|medium|large|xlarge` are Latchkey's runner-size labels (latchkey.dev), used by
# `runs-on:` lines of the Latchkey-hosted jobs. Without declaring them here actionlint reports each one as an unknown
# label — 37 findings measured on this migration (LK-4) — for the same reason `busbar-xl` needed
# declaring: they are real, fleet-issued (Latchkey-issued) labels, not typos.
#
# Declaring it here is not a way of silencing the check; it is the check working as designed. The
# list below is the ONLY custom labels the fleets issue, so a typo (`busbar-x1`, `latchkey-xlage`, a
# label no runner actually carries) is still caught — the job would otherwise sit queued forever.
#
# ACTIONLINT CI ENFORCEMENT: NOT WIRED. No workflow in .github/workflows/ invokes actionlint; this file
# is read only by a contributor who runs actionlint by hand.
self-hosted-runner:
  labels:
    - busbar-xl
    - latchkey-small
    - latchkey-medium
    - latchkey-large
    - latchkey-xlarge
