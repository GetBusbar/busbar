# THE PLUGIN FLEET'S DEPENDENCY POLICY (ARCHITECT ruling 3a, PLUGIN-TEMPLATE, 2026-10-01).
#
# Two homes, one fact each:
#   - SHARED crates (anything busbar itself also uses) live in busbar's root Cargo.toml
#     [workspace.dependencies], exactly as they do for busbar's own members. No second copy here.
#   - PLUGIN-ONLY crates, the banned list, the socket/TLS ban and the C-dependency allow-list live HERE.
# A crate may not appear in both (`busbar-release plugin sync` refuses the render).
#
# This file MOVES WITH THE BUSBAR PIN: GetBusbar/busbar-release's `busbar-release plugin sync` reads it
# (and the root table, the toolchain and Cargo.lock) at the busbar commit each plugin repo pins in
# `.busbar-ref`, and renders it into that repo's root Cargo.toml [workspace.dependencies], deny.toml and
# dependabot ignores. The plugin harness (busbar-release ci/plugin/run.sh) enforces the rest at the
# same commit: the net ban, the C-dependency allow-list and Cargo.lock parity with busbar's lock (RED,
# ruling 3b). Adding a plugin-only crate is one reviewed row here; a plugin naming a crate in neither
# table is a new row first.
schema = 1

# ── Plugin-only crates ────────────────────────────────────────────────────────────────────────────
# Rendered as `name = { version, default-features, features }`; `repos` and `reason` are for review.
[plugin-deps.ldap3]
version = "0.12"
default-features = false
features = ["sync"]
repos = ["busbar-auth-ldap"]
reason = "TESTS ONLY: the LDAP client the ldap auth module's live end-to-end test seeds its directory with, plaintext and no TLS feature. Never in the shipped image: the module speaks LDAP through its own sans-IO codec over the host's connector (busbar-auth-ldap#11), and [net-ban] refuses ldap3 in the shipped closure."

[plugin-deps.mysql]
version = "28"
default-features = false
features = ["minimal-rust"]
repos = ["busbar-store-mysql"]
reason = "TESTS ONLY: the upstream MySQL/MariaDB driver the mysql store's live tests verify what landed with, independently of the store. Never in the shipped image (the store reaches its server only over the host's connector, busbar-store-mysql#15)."

[plugin-deps.mysql_common]
version = "0.35"
default-features = false
repos = ["busbar-store-mysql"]
reason = "the sans-IO MySQL client protocol (packets, handshake, auth plugins, values) the mysql store speaks over the host's connector; no socket of its own (busbar-store-mysql#15)."

[plugin-deps.percent-encoding]
version = "2"
repos = ["busbar-store-mysql"]
reason = "the mysql store's reading of its `mysql://` URL (the 1.5.5 driver's URL rules); pure parsing."

[plugin-deps.postgres]
version = "0.19"
repos = ["busbar-store-postgres"]
reason = "TESTS ONLY: the upstream Postgres driver (tokio-postgres underneath) the postgres store's live tests verify what landed with, independently of the store. Never in the shipped image: the store reaches its server only over the host's connector (busbar-store-postgres#20), and [net-ban] refuses postgres and tokio-postgres in the shipped closure."

[plugin-deps.postgres-protocol]
version = "0.6.11"
repos = ["busbar-store-postgres"]
reason = "the sans-IO Postgres frontend protocol (the messages, SCRAM-SHA-256 and md5) the postgres store speaks over the host's connector, the codec the 1.5.5 `postgres` driver encoded with; no socket of its own. 0.6.11 is the floor: 0.6.10 carries RUSTSEC-2026-0179/0180."

[plugin-deps.postgres-types]
version = "0.2"
repos = ["busbar-store-postgres"]
reason = "the Postgres binary value encodings (`ToSql`/`FromSql`) the 1.5.5 `postgres` driver read and wrote every parameter and column with; pure encoding, no socket."

[plugin-deps.fallible-iterator]
version = "0.2"
repos = ["busbar-store-postgres"]
reason = "the iterator type `postgres-protocol`'s message bodies hand back (the postgres store walks DataRow and RowDescription fields with it); pure."

[plugin-deps.redis]
version = "1"
default-features = false
features = ["script"]
repos = ["busbar-store-valkey"]
reason = "TESTS ONLY: the upstream Valkey client the valkey store's live tests verify what landed with, independently of the store. Never in the shipped image: the store speaks RESP itself over the host's connector (busbar-store-valkey#19), and [net-ban] refuses redis in the shipped closure."

[plugin-deps.rusqlite]
version = "0.40"
features = ["bundled"]
repos = ["busbar-store-sqlite"]
reason = "the SQLite store's engine, with SQLite compiled in (libsqlite3-sys bundled, on the C allow-list below)."

[plugin-deps.ulid]
version = "1"
repos = ["busbar-store-mysql"]
reason = "TESTS ONLY: sortable ids the mysql store's conformance battery writes (a dev-dependency since busbar-store-mysql#15)."

# ── Extra semver lines (Cargo.lock parity, ARCHITECT 2026-10-05) ──────────────────────────────────
# Parity is ONE vetted version per semver-compatible line, shared by busbar and its plugins: where busbar's
# lock holds a version in a crate's compatible line, a plugin's lock holds exactly that version (any drift
# is RED). A line busbar's lock holds NO version of is a different crate to Cargo; a plugin may carry it
# only when it is declared HERE for that plugin repo: `crate`, `line` (`1`, `0.11`, `0.0.3`), `repos`,
# `use` (`shipped` | `tests-only`) and `reason`. Undeclared is RED, by name (`plugin-gates parity`). A
# declaration never exempts an advisory: cargo-deny's advisory check stays blocking, and the parity gate
# is RED on a declared line it refused.
[parity-lines]
allow = [
    { crate = "sha2", line = "0.11", repos = ["busbar-store-postgres"], use = "shipped", reason = "postgres-protocol >= 0.6.11 (SCRAM-SHA-256; 0.6.10 carries RUSTSEC-2026-0179/0180) is on the sha2 0.11 line; busbar holds 0.10" },
    { crate = "digest", line = "0.11", repos = ["busbar-store-postgres"], use = "shipped", reason = "sha2 0.11's digest line (postgres-protocol >= 0.6.11 SCRAM)" },
    { crate = "block-buffer", line = "0.12", repos = ["busbar-store-postgres"], use = "shipped", reason = "digest 0.11's block-buffer line (postgres-protocol >= 0.6.11 SCRAM)" },
    { crate = "crypto-common", line = "0.2", repos = ["busbar-store-postgres"], use = "shipped", reason = "digest 0.11's crypto-common line (postgres-protocol >= 0.6.11 SCRAM)" },
    { crate = "const-oid", line = "0.10", repos = ["busbar-store-postgres"], use = "shipped", reason = "digest 0.11's const-oid line (postgres-protocol >= 0.6.11 SCRAM)" },
    { crate = "wasi", line = "0.14", repos = ["busbar-store-postgres"], use = "tests-only", reason = "the independent `postgres` test client (tokio-postgres 0.7.18 -> whoami 2) the live tests verify the store with; never shipped" },
]

# ── cargo-deny [bans] ─────────────────────────────────────────────────────────────────────────────
# ONE protocol = ONE library, ONE crypto backend = ring (BUSBAR-1.6.0.md §Libraries). Rendered into
# every plugin's deny.toml; `cargo deny check` runs on it in the harness. These apply to the whole
# graph, dev-dependencies included.
[bans]
multiple-versions = "deny"
deny = [
    { crate = "openssl", reason = "TLS is rustls (core-only); no OpenSSL anywhere in the fleet" },
    { crate = "openssl-sys", reason = "TLS is rustls (core-only); no OpenSSL anywhere in the fleet" },
    { crate = "native-tls", reason = "TLS is rustls (core-only); no platform TLS anywhere in the fleet" },
    { crate = "hyper:<1", reason = "HTTP is hyper 1; no hyper 0.14 stack" },
    { crate = "rustls:<0.23", reason = "one rustls major (0.23) fleet-wide" },
    { crate = "ring:<0.17", reason = "one ring major (0.17) fleet-wide" },
    { crate = "serde_yaml", reason = "unmaintained; busbar uses serde_yaml_ng" },
]
# Duplicate versions the fleet accepts beyond busbar's own. multiple-versions is "deny" (OWNER
# 2026-10-02: no plugin may drag in a second version of anything busbar already uses); busbar-release's
# render adds a skip for every duplicate busbar's own Cargo.lock holds at the pin and bans every version
# of a shared crate outside the line busbar resolves it to, so this list stays for a reviewed exception:
# `{ crate = "name@<version>", reason = "..." }`.
skip = []

# ── The socket/TLS ban (enforced by the harness, not cargo-deny) ─────────────────────────────────────
# BUSBAR-1.6.0.md line 3980 (OWNER LAW 2026-09-27): "NO plugin opens its own socket, dials, binds, or
# does TLS." A connection is a declared need; the kernel instantiates the transport through the
# connector, and TLS lives only in busbar-core-connector (Part 2 #40, THE DESIGN §5). The harness walks
# each plugin's NORMAL + BUILD closure (dev-dependencies are tests, not the shipped image) and is RED on
# any crate below, on any feature below, and on any import below in the built cdylib (the post-LTO
# import scan). `carriers` lists plugin repos exempt from the SOCKET half only (Part 2 #40 names the
# carrier transports as the one exception); it is empty because no carrier opens a socket today.
# The crates list holds the socket/TLS stacks AND the database and directory drivers that dial their
# own socket (mysql, postgres, tokio-postgres, redis, ldap3): a store or auth plugin speaks its wire
# protocol as a sans-IO codec over the host's stream (THE DESIGN §5, "a driver is a sans-IO codec over
# the host stream, never a blocking driver"), so each driver may be a plugin's TESTS-ONLY dependency
# (its [plugin-deps] row says so) and never a shipped one.
[net-ban]
spec = "BUSBAR-1.6.0.md line 3980: NO plugin opens its own socket, dials, binds, or does TLS"
crates = [
    "rustls", "native-tls", "openssl", "openssl-sys", "socket2", "tokio-rustls", "hyper-rustls", "tokio-native-tls",
    "mysql", "postgres", "tokio-postgres", "redis", "ldap3",
]
features = ["tokio/net", "mio/net"]
imports = [
    "socket", "socketpair", "connect", "bind", "listen", "accept", "accept4",
    "getaddrinfo", "gethostbyname", "gethostbyname_r", "sendto", "recvfrom", "sendmsg", "recvmsg",
    "SSL_new", "SSL_connect", "SSL_CTX_new",
]
carriers = []

# ── C dependencies (ARCHITECT approval, ruling 3d) ───────────────────────────────────────────────────
# A crate with a `links` key (a native library) in a plugin's normal + build closure must be listed
# here, at this version requirement, with these features on (bundled: the C source is compiled in,
# never a system library). Anything else with `links` is RED.
[c-deps]
allow = [
    { crate = "ring", version = "0.17", features = [], reason = "the one crypto backend (accepted, §Libraries)" },
    { crate = "libsqlite3-sys", version = "=0.38.1", features = ["bundled"], reason = "SQLite compiled in for the sqlite store (ARCHITECT 2026-10-01, bundled + pinned)" },
    { crate = "libz-sys", version = "=1.1.29", features = ["static"], reason = "zlib compiled in for the mysql store's compression (ARCHITECT 2026-10-01, bundled + pinned)" },
]
