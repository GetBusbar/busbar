# SPDX-License-Identifier: Apache-2.0
#
# RENDERED by `cargo xtask fleet render @@repo@@` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/workspace-Cargo.toml; `cargo xtask fleet check` is red on any edit here.
#
# One repo per plugin, every repo a twin: this workspace is exactly two crates, the logic
# (`@@stem@@/`, the rlib a busbar build can link) and the thin cdylib that packages it as a
# droppable `kind: @@kind@@` plugin (`@@stem@@-plugin/`, crate `@@crate@@`). Its busbar
# dependencies are git dependencies on GetBusbar/busbar at the fleet pin (`.busbar-ref` field 1);
# no sibling-checkout path dependency ships in any manifest.
[workspace]
resolver = "2"
members = [
    "@@stem@@",
    "@@stem@@-plugin",
]

[workspace.package]
edition = "2021"
rust-version = "@@rust_version@@"
license = "Apache-2.0"
publish = false
repository = "https://github.com/GetBusbar/@@repo@@"

[workspace.dependencies]
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "@@pin@@" }
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "@@pin@@" }
