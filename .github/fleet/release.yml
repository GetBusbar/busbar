# RENDERED by `cargo xtask fleet render @@repo@@` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. On a v* tag: this
# repo's CI on the tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then
# the consumer verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    # `vX.Y.Z-dev.N` is a signed PRE-RELEASE from dev (never main/qa); other suffixed tags start nothing.
    tags: ["v*", "!v*-*", "v*-dev.*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@@@pin@@
    with:
      service: @@ci_service@@
      busbar_checkout: @@busbar_checkout@@
      macos_test: @@macos_test@@
      extra_test: @@extra_test@@
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@@@pin@@
    with:
      plugin_crate: @@crate@@
      manifest_name: @@manifest_name@@
      plugin_alias: @@alias@@
      plugin_kind: @@kind@@
      asset_prefix: @@asset_prefix@@
      description: @@description@@
      lib_only: @@lib_only@@
      needs_prompt: @@needs_prompt@@
      needs_user: @@needs_user@@
      declares_file: @@declares@@
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@@@pin@@
    with:
      version: ${{ github.ref_name }}
      asset_prefix: @@asset_prefix@@
      plugin_name: @@manifest_name@@
      plugin_alias: @@alias@@
      plugin_kind: @@kind@@
      bundle_image: @@bundle_image@@
      bundle_env: @@bundle_env@@
    secrets: inherit
