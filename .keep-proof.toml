# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch, and
# by scripts/prove-remote.sh, which runs the SAME legs on a fleet box. It scopes the two expensive
# legs of the run to what the branch actually touched, so a verdict says something specific instead
# of "everything, slowly".
#
#   families — a regex handed to the shadow oracle's `--id-filter`. This branch cuts the streams
#              plane's remaining two dialects into crates of their own and takes three rows, two
#              `if dialect.name ==` bodies and five vendor-named fallbacks OUT of the neutral plane.
#              It is a COMPOSITION change with no wire byte in it: the same three dialects, the same
#              claim table, the same served URLs, the same reader for every frame — what moved is
#              WHERE the row that names the reader lives. So the families that matter are the ones
#              that would catch it if that were untrue:
#
#              `voice` / `streams` — the plane's own family. There is NO streams plane in the
#              published 1.5.5 binary (VT-6 measured it: every realtime URL 404s, `--validate`
#              refuses a `streams:` section by name, and `strings` finds no `/v1/realtime`), so the
#              1.5.5 recording carries zero rows here and zero is the correct, faithful answer. The
#              family is named anyway, because the day a row appears here it must appear for a
#              reason and not as a side effect of a crate boundary moving.
#
#              `boot` — the composition root registers two more plugins at boot. If a dialect
#              registration changed a boot line, the seal order or a refusal, this is where it shows.
#
#              `neutrality` — the one that can actually go red. The neutrality family is what pins
#              "a pure 1.5.5 config sees NOTHING new": no boot line, no metrics series, the same
#              route set. Two new crates linked into the default binary is exactly the shape of
#              change that leaks a series or a line, and this branch's whole claim is that it does
#              not.
#
#   tests    — the plane, its three dialect crates, the composition root that registers them, and
#              the retiring crate whose codec half the dialects still reach. Every cell this branch
#              wrote or moved is in one of those binaries.
families = '^(voice|streams|boot|neutrality)([|.]|$)'
# ONE LINE, and it has to be: both readers of this file — .github/workflows/keep-proof.yml and
# scripts/prove-remote.sh:67 — take the array with a single-line `sed`, so a pretty-printed
# multi-line array is read as NO packages and the run silently widens to the whole workspace. That
# is not a safe default here: it drags in `busbar-a2a`'s
# `the_section_is_a_first_class_member_of_the_chassis`, which is RED at this branch's base
# `0ba0134d9` (the `agent_defs` -> `plane_sections` drain left that cell behind) and which this
# branch does not touch, and the run stops at the first red leg before the ORACLE leg — the one leg
# that answers the only question this branch has to answer.
tests = ["busbar", "busbar-voice", "busbar-plane-streams", "busbar-plane-streams-openai", "busbar-plane-streams-gemini", "busbar-plane-streams-twilio"]
