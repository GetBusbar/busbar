# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly".
#
# THIS FILE IS WRITTEN FIRST, BEFORE THE FIRST CLASS MOVES, AND DELIBERATELY.
# The MCP-NODE slot inherited a predecessor's scope (`tests = ["xtask"]`,
# `families = '^documented([|.]|$)'`), moved eleven classes under it, and took SIX of them back off
# when the battery that judges the moved path finally ran. A stale proof scope is not a slower
# proof; it is a green verdict about code the branch did not write. This branch moves A2A operation
# classes onto a root-side node, so the scope must name the crates that hold the moved code AND the
# composition root that mounts it.
#
#   tests    — `busbar` FIRST and non-negotiably: the composition root is where the node lives, and
#              the real-binary batteries that drive a mounted leg are root test binaries. Then the
#              plane and legacy crates the classes move out of (`busbar-plane-a2a`, `busbar-a2a`,
#              `busbar-a2a-codec`), the kind-neutral units a class meets on its way through the
#              gauntlet (`busbar-unit-admission`, `busbar-unit-auth`, `busbar-unit-breaker` — the
#              admit/approve/verify steps the legacy arm never asked about, which is where the risk
#              of this line actually is), and `xtask` for the gates.
#   families — the recorded-cell families a moved class can disturb: `a2a` itself, `boot` (a node is
#              wired at boot and a composition that disagrees with itself refuses to bind),
#              `neutrality` (the routes cells read the A2A-shaped surface), `admin.ops` (the A2A
#              plane contributes admin verbs), and `billing`/`ledger` — because the rule this line
#              is held to is that the money path stays byte-identical, and a family that is not
#              replayed cannot testify to that.
families = '^(a2a|boot|neutrality|admin\.ops|billing|ledger)([|.]|$)'
tests = [
    "busbar",
    "busbar-plane-a2a",
    "busbar-a2a",
    "busbar-a2a-codec",
    "busbar-unit-admission",
    "busbar-unit-auth",
    "busbar-unit-breaker",
    "xtask",
]
