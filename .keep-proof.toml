# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly". The INTEGRATION tree carries no such file —
# it is a keep-branch artefact, and this branch is a keep branch.
#
#   families — a regex handed to the shadow oracle's `--id-filter`. The oracle replays this build
#              against the published 1.5.5 binary and reports divergences; unfiltered that is the
#              better part of half an hour.
#   tests    — the packages whose test binaries the sharded legs must include by name.
#
# THIS BRANCH IS THE WHOLE DIALECT TRACK AS ONE LINE (K11). K7 re-keyed five lines — the `openai`
# cut, the `responses` cut, the status-table move, the dialect closure, and the `anthropic`/`gemini`
# pair — and K10 measured that they cannot land one at a time: the first line alone carries no mint,
# so it reds on the whole un-minted dialect column. They land together or not at all, so this file
# is the UNION of the five, not the last one's copy.
#
# The scope is the LLM families first of all: every dialect cell is a cell one of them replays, and
# a byte that moved would be a wire format changed under every client of it.
#
# `billing` is here because the metered quantities are located by the DIALECT — the meter locators
# move with the crate, and a locator that pointed at the wrong member would meter a request on a
# number that is not the one the upstream reported. `route.failover` and `neutrality` are here
# because the split changes which crate ANSWERS for a claim: failover walks lanes whose dialect is
# resolved off the merged ladder, and neutrality is the property the split exists to establish —
# a plane that no longer names one of its dialects. Identical in all five lines, so the union is
# that regex unchanged.
families = '^(llm|billing|route\.failover|neutrality)([|.]|$)'
# THE UNION OF THE FIVE LINES' TEST SETS, plus the three packages the union exposed that no single
# line's file named:
#
#   busbar-plane-llm-anthropic / -gemini — the S3 line CREATES these two crates and its own
#     `.keep-proof.toml` never named them, which is a leg that would not run the battery of the
#     thing the line adds.
#   busbar-contract — the S1 line moves the upstream status class and its disposition into
#     `busbar_contract::upstream` and points every reader at it; the contract's own tests are what
#     hold the one table.
#   busbar-plugin-testkit — this line drains two couplings out of it (the fixture key and the
#     module doc), so its batteries are in scope.
#
# `busbar-plane-llm-openai` stays in the list beside every later dialect, and that is not a
# courtesy: the dialects are one ladder, and the way a split of a later one could break an earlier
# one is a rung interleaved at the wrong number. A leg that ran only the new crate's battery would
# not see it.
tests = [
    "busbar-plane-llm-openai",
    "busbar-plane-llm-responses",
    "busbar-plane-llm-anthropic",
    "busbar-plane-llm-gemini",
    "busbar-plane-llm",
    "busbar-llm-codec",
    "busbar-llm",
    "busbar-contract",
    "busbar-plugin-testkit",
    "busbar",
    "xtask",
]
