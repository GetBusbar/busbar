# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch, and
# by scripts/prove-latchkey.sh, which runs the SAME legs on a rented runner. It scopes the two
# expensive legs of the run to what the branch actually touched, so a verdict says something
# specific instead of "everything, slowly".
#
#   families — TLS-1 deletes busbar-core::tls.rs's cert/key/CA parsing against
#              busbar-unit-transport-key's own (now the one live copy, whose parse-error messages
#              were made byte-identical to core's originals) and MOVES its accept/serve loop by
#              identity to crates/busbar/src/root/listener.rs. `boot` is the family that would show
#              a changed boot-diagnostic sentence if the secret-source naming had drifted; `config`
#              is the TLS section's own parse surface; `neutrality` pins that a plain config sees no
#              new boot line or metrics series from the move.
#   tests    — busbar-core (the deletion), busbar-unit-transport-key (the one live copy, whose
#              tests.rs pins the parse-error text byte for byte) and busbar (the composition root
#              that now hosts the accept/serve loop and re-points its two TLS call sites).
families = '^(boot|neutrality|config)([|.]|$)'
tests = ["busbar-core", "busbar-unit-transport-key", "busbar"]
