# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch, and
# by scripts/prove-remote.sh when a hand-back is proved on the fleet. It scopes the two expensive
# legs of the run to what the branch actually touched, so a verdict says something specific instead
# of "everything, slowly". The INTEGRATION tree carries no such file — it is a keep-branch artefact,
# and this branch is a keep branch.
#
#   families — a regex handed to the shadow oracle's `--id-filter`. This branch moves the
#              destination-denial DECISION off the 1.5.x mount and onto the Verify step, gives the
#              denial set the `streams:` key it never had, and must show the 403 body byte-identical
#              through the move. So `voice` is the family under test; `neutrality` is in scope
#              because the plane and the composition root both changed and a pure 1.5.5 config must
#              still see NOTHING new (no boot line, no metrics series, the same route set);
#              `admin.ops` and `boot` are in scope because the plane's own config SECTION grew a key,
#              and a section's shape reaches the admin config surface and the boot validate leg.
#              An unfiltered replay would be a claim about twenty-odd families this branch does not
#              touch. The openapi/boot base-state rows are T6-3's and are not this branch's to move.
#   tests    — the six crates a line of this branch changed, plus the two that implement the face
#              alongside them. `busbar` is named once and the harness runs its default and
#              `root-duplex-serve` legs, because the composition's session Verify only exists under
#              the second.
families = '^(voice|neutrality|admin\.ops|boot)([|.]|$)'
tests = ["busbar-contract", "busbar-plane-a2a", "busbar-plane-mcp", "busbar-plane-voice", "busbar-voice", "busbar"]
