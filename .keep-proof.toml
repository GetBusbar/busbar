# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly".
#
#   families — this branch changes no gate's PRODUCTION behaviour (no rule row moves, no ceiling
#              moves); it only changes how xtask's own CLI test proves its selftest claim. The
#              `documented` family is what covers the CLI-surface / help-text contract the touched
#              command (`cargo xtask selftest --list`) is now part of, so it is the one family this
#              branch owes the oracle.
#   tests    — xtask is the only crate this branch touches: `CasePlan::new` grew a name/expected
#              pair, `Report::plan` and `gates::plan_has_red` are new, and
#              `xtask/tests/cli.rs::selftest_runs_every_registered_gates_red_proof` is rewritten to
#              read the list instead of taking the whole battery. Naming `xtask` here is exactly
#              the one line this hand-back needs measured: this leg's own wall-clock time is the
#              number the defect was about (4 686s before, driving the whole battery; a few seconds
#              after, reading the plan). No other package's tests changed.
families = '^(documented)([|.]|$)'
tests = [
  "xtask",
]
