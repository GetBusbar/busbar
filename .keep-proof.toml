# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly". The INTEGRATION tree carries no such file —
# it is a keep-branch artefact, and this branch is a keep branch.
#
#   families — a regex handed to the shadow oracle's `--id-filter`. This branch is TS-1's
#              `ts-reads-the-clock` construction-rule line, re-cut by TS-3: it plants a clock read
#              and two timestamp-field sites across the a2a record legs, the admin mount / root
#              audit clock, the durable journal's retention stamp, the voice and oauth_as sweeps,
#              and a ChainBreak marker's own reading — so the honest scope is a2a, mcp, llm,
#              admin.ops, boot and teller, the families whose cells actually walk those sites.
#   tests    — the packages whose test binaries the sharded legs must include by name.
#              `busbar-core` and `busbar` carry the construction rule's own crates and the a2a
#              record legs; `busbar-a2a` and `busbar-mcp` are the plane crates the plant touches
#              directly; `xtask` is the gate runner whose own selftests (`construction`) are the
#              subject of this hand-back's fix.
families = '^(a2a|mcp|llm|admin\.ops|boot|teller)([|.]|$)'
tests = ["busbar-core", "busbar", "busbar-a2a", "busbar-mcp", "xtask"]
