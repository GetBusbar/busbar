# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly".
#
#   families — a regex handed to the shadow oracle's `--id-filter`. This branch adds a GATE ROW and
#              a ceiling ledger; it changes no crate's behaviour and no wire byte. The honest scope
#              is therefore the two families that are about the gate's own subject rather than about
#              money or a wire: `neutrality` (the plane/transport separation this row extends to the
#              composition root) and `documented` (the claims the docs make about it, which this
#              branch edits in ARCHITECTURE.md, PLUGIN-TREE.md and xtask-gates.md). An unfiltered
#              replay is the better part of half an hour and would be a claim about twenty-six
#              families this branch does not touch.
#   tests    — `xtask` and nothing else. The row, its two scanners, its ledger reader and its
#              thirty-one self-test cases all live in that package; no other crate's test binary
#              contains a line this branch changed.
families = '^(neutrality|documented)([|.]|$)'
tests = ["xtask"]
