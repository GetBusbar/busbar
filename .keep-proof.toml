# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly". The INTEGRATION tree carries no such file —
# it is a keep-branch artefact, and this branch is a keep branch.
#
# This branch (keep-gates-close) touches only xtask/src/gates/construction/ceilings.rs,
# xtask/src/gates/construction/selftest.rs and xtask/src/gates/mod.rs: the raise-form cutoff (the
# retired `[gate.ceiling_raises."<key>"]` from/to header refused by name, the
# `[[gate.ceiling_raises]]` key/by/because array form added) and construction's own re-measured
# SELFTEST_BUDGETS entry. No boot/config/parse-surface code moved.
#
#   families — a regex handed to the shadow oracle's `--id-filter`. This branch changes no wire
#              behaviour and no documented/printed shape other than a gate's own refusal text, so
#              the honest scope is the `documented` family alone — the cells that read what a
#              refusal message says, which is exactly what changed here (the retired header's
#              refusal now names the shape and the 2026-09-18 closing date instead of the old
#              from/to mismatch wording).
#   tests    — the packages whose test binaries the sharded legs must include by name. `xtask` is
#              the only crate this branch edits; its own gate self-tests are what this branch adds
#              cases to.
families = '^(documented)([|.]|$)'
tests = ["xtask"]
