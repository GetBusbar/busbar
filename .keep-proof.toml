# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly".
#
#   families — a regex handed to the shadow oracle's `--id-filter`. The oracle replays this build
#              against the published 1.5.5 binary and reports divergences; unfiltered that is the
#              better part of half an hour. This is the openapi/overlay landing line, and these are
#              the five prefixes whose recorded behaviour it can move: `admin.ops` (the admin
#              plane's own responses — the openapi document, the overlay-section 404), `cli` (the
#              CLI's `--help`/`--version` text), `boot` (the validation stderr whose expected-one-of
#              list grew), `crosscut` (the traps that read the served document) and `documented`
#              (the docs cells that quote both). Nothing outside them is touched by this branch.
#   tests    — the packages whose test binaries the sharded legs must include by name: `busbar` is
#              the CLI whose usage line moved, `busbar-plane-admin` the plane that serves the
#              openapi document, `busbar-core` the crate that owns the views, the error taxonomy
#              and the overlay message.
families = '^(admin\.ops|cli|boot|crosscut|documented)'
tests = ["busbar", "busbar-plane-admin", "busbar-core"]
