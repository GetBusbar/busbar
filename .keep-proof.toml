# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly". The INTEGRATION tree carries no such file —
# it is a keep-branch artefact, and this branch is a keep branch.
#
#   families — a regex handed to the shadow oracle's `--id-filter`. The oracle replays this build
#              against the published 1.5.5 binary and reports divergences; unfiltered that is the
#              better part of half an hour.
#   tests    — the packages whose test binaries the sharded legs must include by name.
#
# THIS BRANCH IS THE DIALECT SPLIT'S SECOND CUT — the `responses` dialect of the LLM plane leaves
# the plane's own tables and arrives as its own crate, registering by claim, on the pattern the
# `openai` cut established. So the scope is the LLM families first of all: every `responses` golden
# cell is a cell one of them replays, and a byte that moved would be a wire format changed under
# every client of it. Eighteen frozen cells cross this dialect in one direction or the other, and
# the answer direction is the one with the most to lose: this is the only dialect that mints both a
# response identity and a per-item identity, and the only one that reports all four metered classes.
#
# `billing` is here because the metered quantities are located by the DIALECT — the meter locators
# move with the crate, and a locator that pointed at the wrong member would meter a request on a
# number that is not the one the upstream reported. `route.failover` and `neutrality` are here
# because the split changes which crate ANSWERS for a claim: failover walks lanes whose dialect is
# resolved off the merged ladder, and neutrality is the property the split exists to establish —
# a plane that no longer names one of its dialects.
families = '^(llm|billing|route\.failover|neutrality)([|.]|$)'
# `busbar-plane-llm-openai` stays in the list beside the new crate, and that is not a courtesy: the
# two dialects are one vendor's two request surfaces, they sit at adjacent rungs of one ladder, and
# the way a split of the second could break the first is a rung interleaved at the wrong number. A
# leg that ran only the new crate's battery would not see it.
tests = [
    "busbar-plane-llm-responses",
    "busbar-plane-llm-openai",
    "busbar-plane-llm",
    "busbar-llm-codec",
    "busbar",
    "xtask",
]
