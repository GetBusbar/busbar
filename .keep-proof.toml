# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly". The INTEGRATION tree carries no such file —
# it is a keep-branch artefact, and this branch is a keep branch.
#
#   families — a regex handed to the shadow oracle's `--id-filter`. This branch is the config-gate
#              chain: two new admin wire-byte-lock tests over PUT /config/settings, plus the
#              declared kind-isolation ceiling rises those tests cause. The honest scope is the
#              documented/config/admin.ops families — the cells that read the golden
#              documented|changelog|admin-restart cell this chain locks, plus the config surface
#              and admin-ops route it drives.
#   tests    — the packages whose test binaries the sharded legs must include by name.
#              `busbar-core` owns the admin restart-note handler and the two new locks;
#              `busbar` is the binary the no-data-dir neutrality tripwire (re-verified clean on
#              this chain) and the shadow oracle drive end to end.
families = '^(documented|config|admin\.ops)([|.]|$)'
tests = ["busbar-core", "busbar"]
