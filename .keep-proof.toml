# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly". The INTEGRATION tree carries no such file —
# it is a keep-branch artefact, and this branch is a keep branch.
#
#   families — a regex handed to the shadow oracle's `--id-filter`. The oracle replays this build
#              against the published 1.5.5 binary and reports divergences. This hand-back is the
#              LLM-plane finish + money-accrual assessment, so the money-sacred scope is the three
#              families the accrual cutover must keep byte-identical: `llm` (133 cells — the plane's
#              own wire path), `billing` (the 13 billing cells — /usage, /admin/usage, rate-card)
#              and `ledger` (5 cells — amend, currency, rate-history). A green here is the baseline
#              the fat-engine-death accrual cutover would have to preserve; a red here is a money
#              divergence and a STOP.
#   tests    — the packages whose test binaries the sharded legs must include by name. The money
#              crates on this leg: `busbar-llm` (the serving engine + meter step), the kernel money
#              units `busbar-unit-ledger` / `busbar-unit-cost` / `busbar-unit-egress`, and `busbar`
#              (the binary that drives the switch-over golden `root::units_llm` tests).
families = '^(llm|billing|ledger)([|.]|$)'
tests = ["busbar-llm", "busbar-unit-ledger", "busbar-unit-cost", "busbar-unit-egress", "busbar"]
