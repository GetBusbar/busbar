# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly".
#
#   families — a regex handed to the shadow oracle's `--id-filter`. This branch moves the
#              append-only sink WRITER — the bytes-to-disk half of the request-log-file exporter —
#              out of busbar-core and into the unit that answers for recorded history. Three
#              families can see that move. `hooks` and `admin.ops` are the served surfaces whose
#              recorded lines this sink is the disk end of; `ledger` is the money path, and the
#              rule under test (a size threshold may roll a file over, never destroy what it
#              already holds) is exactly the rule a sealed ledger line depends on once it has been
#              exported. If the writer's bytes moved, these cells say so.
#   tests    — the packages whose test binaries the sharded legs must include by name.
#              `busbar-unit-audit` is the writer's new home and carries its battery,
#              `busbar-core` still owns the sink's configuration and fan-out, and `busbar` is the
#              root that assembles both.
families = '^(hooks|admin\.ops|ledger)([|.]|$)'
tests = ["busbar-unit-audit", "busbar-core", "busbar"]
