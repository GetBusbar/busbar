# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly". The INTEGRATION tree carries no such file —
# it is a keep-branch artefact, and this branch is a keep branch.
#
#   families — a regex handed to the shadow oracle's `--id-filter`. This branch is the hook POLICY
#              ENGINE's home (`busbar-core-policy`): the engine moved out of busbar-core body for
#              body, its plugin port was inverted (`HookSeat`), the config secret resolver and the
#              per-session substrate came down into busbar-substrate verbatim, and `SignalBag`
#              is one slot per catalog entry now. Every one of those is a claim about HOOK behaviour
#              — which hook runs, with which grants, what it is handed — so `hooks` is the family
#              that can move; `documented` rides along because the kind-isolation gate and its
#              ledger changed and the docs make claims about both. `neutrality` is out of scope on
#              purpose: no plane and no transport source changed.
#   tests    — the crates a line this branch changed lives in: the engine, the retiring crate that
#              re-exports it, the contract (SignalBag), the substrate (secret/session), the api
#              crate (one re-export line), the llm engine (the upsert call sites) and xtask (the
#              gate seam and its selftest cases).
families = '^(hooks|documented)([|.]|$)'
tests = ["busbar-core-policy", "busbar-core", "busbar-contract", "busbar-substrate", "busbar-api", "busbar-llm", "xtask"]
