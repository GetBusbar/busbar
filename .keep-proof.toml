# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly". The INTEGRATION tree carries no such file —
# it is a keep-branch artefact, and this branch is a keep branch.
#
# THIS FILE WAS INHERITED STALE AND IS REWRITTEN HERE. What it carried was the scope of a previous
# keep branch — the kind-isolation gate's dependency side, `tests = ["xtask"]` and
# `families = '^documented([|.]|$)'`. Every word of that was true about that branch and none of it
# is true about this one. A stale scope is worse than no scope: it produces a GREEN that is a claim
# about code the branch did not touch, while running none of the cells that could go red. The first
# Latchkey job of this hand-back was submitted against the stale copy before it was noticed, and it
# is reported as what it is rather than quietly dropped.
#
#   families — a regex handed to the shadow oracle's `--id-filter`. This branch moves eleven of the
#              MCP plane's thirteen client classes off `method::dispatch`'s arms and onto the
#              composition root's MCP node, so a class that used to be a function call now walks
#              admission, metering and both audit doors. `mcp` is the plane whose serving path
#              moved. `boot` is the composition: the node is built and mounted in `main.rs`.
#              `neutrality` IS in scope here — unlike on the branch this file used to describe,
#              this one edits plane source directly. `billing` and `ledger` are in scope because
#              the whole point of the move is that these classes now draw a budget slot and seal a
#              row where they previously drew and sealed nothing. `admin.ops` covers the operator
#              surface that reads those rows back.
#   tests    — `busbar-mcp`, which holds the 500 cells every class move is checked by (including
#              the `document_for`/`dispatch` complement guard), and `busbar`, which holds the root's
#              own node cells and the end-to-end battery against the real binary.
families = '^(mcp|boot|neutrality|admin\.ops|billing|ledger)([|.]|$)'
tests = ["busbar-mcp", "busbar"]
