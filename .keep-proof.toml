# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly". The INTEGRATION tree carries no such file —
# it is a keep-branch artefact, and this branch is a keep branch.
#
# This branch (keep-llm-switch-over-2 / LLM-SW-2) is the LLM switch-over measurement: a new design
# doc (docs/design/1.6.0-llm-switch-over.md) plus a ceiling-raise drop that lands EMPTY on this
# base (the base tip already reads the ceiling this commit exists to restore). The diff against
# the tip this line rebased onto is exactly one new docs file — zero source, zero ceiling, zero
# wire bytes. There is no crate to run tests against.
#
#   families — a regex handed to the shadow oracle's `--id-filter`. The llm family is the honest
#              scope: the doc's own measurement is over the 142 llm + 36 billing/ledger/failover/
#              cooldown golden cells, and this line's job is to not disturb that recording.
#   tests    — declared EMPTY: no crate's source changed, so there is no test leg this hand-back
#              owes (see prove-latchkey.sh's TESTS="-" convention for a declared-empty scope).
families = '^(llm)([|.]|$)'
tests = []
