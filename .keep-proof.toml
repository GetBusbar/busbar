# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly". The INTEGRATION tree carries no such file —
# it is a keep-branch artefact, and this branch is a keep branch.
#
#   families — a regex handed to the shadow oracle's `--id-filter`. This branch changes what gets
#              STAMPED on the records four shipped paths write: the durable journal's retention
#              stamp (`admin.ops` reads those rows and `boot` composes the seam that writes them),
#              the A2A receive leg's metering window base (`a2a`), the MCP `tools/call` leg's
#              (`mcp`), and the budget window every priced call keys off (`teller`, and `llm`
#              because the LLM plane is the heaviest caller of it). Those six families are the
#              claims a wrong stamp would break. `neutrality` and `documented` are NOT in scope:
#              nothing here moves a plane, a transport byte or a documented gate contract.
#   tests    — the four packages that carry a line this branch changed: `busbar-core` (the journal
#              seam and its cells), `busbar` (the root's a2a retention cells), `busbar-a2a` and
#              `busbar-mcp` (the two metering sites).
#
#              `xtask` IS DELIBERATELY ABSENT, and its absence is the point rather than an
#              oversight. The construction gate's OWN self-test is proven by the `gate self-tests`
#              leg of this same run, which takes the whole battery; putting `xtask` under `--tests`
#              on top of that buys a second copy of it and, on this runner, buys the standing
#              `selftest_runs_every_registered_gates_red_proof` red — two gates unproven for
#              reasons that belong to DB-1 and to the kind-isolation ship twin, neither of them
#              this branch's. A test package whose only new verdict is somebody else's standing
#              red is a package this hand-back should not ask thirty runner-minutes for.
families = '^(a2a|mcp|llm|admin\.ops|boot|teller)([|.]|$)'
tests = ["busbar-core", "busbar", "busbar-a2a", "busbar-mcp"]
