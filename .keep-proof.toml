# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly". The INTEGRATION tree carries no such file —
# it is a keep-branch artefact, and this branch is a keep branch.
#
#   families — a regex handed to the shadow oracle's `--id-filter`. This branch folds duplicated
#              PLUGIN-ABI DISCIPLINE onto one definition each: the borrowed-range reads and the
#              capped out-buffer write, the length-prefixed record framing, and the out-param
#              preamble. Those are not a corner of the tree — they are read on every host call the
#              plane-host vtable serves, and the vtable is WIRED: `gate_decide_over` is called from
#              busbar-mcp and busbar-a2a, `with_dispatch_scope` from the audit log, `guard_url_over`
#              from the egress guard. So the honest scope is every family whose cells cross one of
#              those slots, measured slot by slot rather than guessed:
#
#                llm         the request path the whole vtable hangs off
#                hooks       gate_decide / gate_scan — GateVerdictOut and the message/hook writes
#                billing     meter_charge — the Usage unit-count tail's length-prefixed framing
#                ledger      the same charge, recorded
#                auth        auth_resolve — AuthResolved and the audience borrow
#                route       guard_url + the egress fault path — GuardVerdict and GuardClass
#                admin       the audit log's own dispatch scope
#                neutrality  the kind-neutral readings of the same slots
#                plugins     the subprocess egress descriptor (argv + child env framing)
#                teller      the loop that drives the slots
#
#              What is deliberately OUT: config.migrate and cli touch no host call, and boot only
#              through composition this branch does not change.
#   tests    — the packages whose test binaries the sharded legs must include by name.
#              `busbar-plugin` owns every definition that moved and every cell asserting it;
#              `busbar-core` is the side the copies were deleted from; `busbar-plugin-loader` is the
#              other reader of the crate's root discipline; `busbar` is the binary the oracle drives.
families = '^(llm|hooks|billing|ledger|auth|route|admin|neutrality|plugins|teller)([|.]|$)'
tests = ["busbar-core", "busbar-plugin", "busbar-plugin-loader", "busbar"]
