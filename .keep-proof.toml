# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly".
#
#   families — a regex handed to the shadow oracle's `--id-filter`. This branch moves the A2A
#              plane's AGENT GRANT — may this caller reach this fronted agent — onto the units
#              chain, so the a2a family is the subject. `neutrality` is here because the grant is
#              enforced against a kind-tagged scope the auth unit carries and no plane names;
#              `admin.ops` and `auth.lifecycle` because the grant is read off a key whose minting,
#              scoping and revocation are those families' own cells, and a change to what the
#              enforced key SHAPE carries is exactly what they would catch.
#   tests    — the packages whose test binaries the sharded legs must include by name. The legacy
#              plane (`busbar-a2a`) is named alongside the new one because it still serves by
#              default: its grant body is measured, not deleted, and its suite is what says so.
families = '^(a2a|neutrality|admin\.ops|auth\.lifecycle)([|.]|$)'
tests = ["busbar-a2a", "busbar-plane-a2a", "busbar-unit-auth", "busbar-unit-scope", "busbar"]
