# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly". The INTEGRATION tree carries no such file —
# it is a keep-branch artefact, and this branch is a keep branch.
#
#   families — a regex handed to the shadow oracle's `--id-filter`. This branch changes the generic
#              HTTP mount's reply channel: instead of a buffered status/headers/bytes triple, the
#              mount now carries the plane's own response through untouched. Every mounted plane
#              rides that channel, so the honest scope is every plane that can be mounted (a2a,
#              mcp, llm) plus the neutrality, admin-ops and billing cells that assert on what a
#              mounted answer looks like on the wire — headers, media type, and the moment a body
#              is accounted for.
#   tests    — the packages whose test binaries the sharded legs must include by name: the root
#              (`busbar`, where the mount and its cells live), the three planes, the llm plane
#              crate, and the substrate the mount's contract types come from.

# WHAT THIS HAND-BACK CAN MOVE, DECLARED BY THE HAND-BACK.
#
# `.github/workflows/keep-proof.yml` reads exactly two keys out of this file and nothing else:
#
#   families  the oracle id-filter this branch is recorded and replayed against. It NARROWS the
#             shadow oracle and nothing else — absent or empty, every family is recorded. It cannot
#             narrow the test shards or the gates, on purpose: a gate a hand-back gets to scope is a
#             gate the hand-back can turn off.
#   tests     the packages this branch names, for a reader. Written down so "what did this prove"
#             is answerable from the branch rather than from somebody's memory of the brief.
#
# THIS BRANCH: owner ruling 13:0x (6) — the enforced key's ONE shape for 1.6.0 is `ResolvedKey` in
# `busbar-unit-auth`; the legacy `busbar_api::VirtualKey` (re-exported as
# `busbar_core::governance::VirtualKey`) dies with core; the money-carrying fields it holds move to
# the cost and ledger views.
#
# Five commits:
#   1. MEASURE — the census of every VirtualKey reader across the workspace, grouped by what it
#      reads (identity, scope, budget, rate card, expiry, revocation). No code.
#   2. `ResolvedKey` grows scope, expiry and revocation, each with the production reader that
#      proves it; the root's `KeyFacts` port becomes the same shape with `From` both ways.
#   3. `KeyBudgetView` in `busbar-unit-cost` and the key's ledger row identity in
#      `busbar-unit-ledger`, the latter wired into the root's group projection byte-identically.
#   4. `KeyBudgetView` made a READ-TIME view under the owner's final money model — price is never
#      stored; spend is derived from the ledger's lines times the rate table in force.
#   5. The residue of `VirtualKey` inside `busbar-core` counted (96 production / 173 test
#      occurrences) and ratcheted so it can only fall.
#
# WHY THESE FAMILIES. `auth.lifecycle` is the key's own arc — mint, rotate, expiry, revoke — and it
# is the family the shape change is most directly about. `admin.ops` is where a key is displayed and
# administered, and where this branch's base already carries registered A-1 breaking cells
# (GetAuth/GetConfig/PostConfigReload, from the `is_open()` fix at 71a842144). `billing` and
# `ledger` are named because commits 3 and 4 touch the money path: the ledger's row identity is now
# composed in one place instead of two, and MONEY BYTE-IDENTITY is the bar. The change there is a
# move of a format string, not of an arithmetic operator, so those families are expected identical —
# declaring them is what makes that an assertion rather than a hope.
#
# NO LOCAL RECORDING IS ATTACHED, and that is the process rather than an omission: local workspace
# builds and local oracle recordings are off, and CI's keep-proof records these families on a quiet
# host. For the integrator's comparison, a base recording of exactly these families against this
# branch's base (71a842144) diverged on 13 admin.ops cells — 7 unaccepted, 6 accepted — with
# `auth.lifecycle`, `billing` and `ledger` ALL identical. That is the set to compare against, and
# nothing outside `admin.ops` should appear.

# AND THE r31i CUT: the A2A plane's agent grant is read off the ENFORCED key rather than off the
# legacy carrier, and it is refused before the dial rather than after it. `auth.lifecycle` is the
# key's own arc and `a2a` is the plane whose grant moved; `admin.ops` and `neutrality` are named
# because the same read is what an administrative view of a key displays.
#
# AND THE r31h CUT, on the same branch: the composition root gains ONE data-plane chain and the A2A
# plane is composed through it, behind `root-a2a-serve` — which is NOT in `default` on this cut, so
# the shipped binary is unchanged. `a2a` is named because this is the branch that puts that plane on
# the loop; its oracle cells are SKIP on the golden by design, because a2a is judged by its own
# conformance rig.
#
# THIS BRANCH IS THE MOUNT CHAIN WITH THE a2a CHAIN RE-PICKED ONTO IT, so the declaration is the
# UNION of all three: the mount's own scope (every plane that can be mounted, plus the cells that
# assert on what a mounted answer looks like), the enforced key's arc, and the boot composition the
# data-plane chain is read by.
families = '^(a2a|mcp|llm|neutrality|admin\.ops|billing|auth\.lifecycle|ledger|boot)([|.]|$)'
tests = [
  "busbar",
  "busbar-a2a",
  "busbar-plane-a2a",
  "busbar-mcp",
  "busbar-llm",
  "busbar-plane-llm",
  "busbar-substrate",
  "busbar-unit-auth",
  "busbar-unit-scope",
  "busbar-unit-trust",
  "busbar-unit-admission",
  "busbar-unit-cost",
  "busbar-unit-ledger",
  "busbar-unit-verbs",
  "busbar-core",
]

# The construction rows this cut moves, or must be seen not to move. Every one of them is GREEN on
# the base and must stay green; the tree's other FAIL rows are pre-existing and are not this
# branch's to clear.
gate = '^(legacy-reach|no-test-doubles-in-production|no-test-doubles-in-production:doubles|one-pricing-site)$'

# The feature this branch adds a serving path behind. It is default-OFF on this cut, so a build
# without it is the shipped one; CI should build the package BOTH ways, because the cells above are
# recorded off the default build and the new serving path only exists in the other.
features = ["root-a2a-serve"]
