# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly".
#
#   families — a regex handed to the shadow oracle's `--id-filter`. The oracle replays this build
#              against the published 1.5.5 binary and reports divergences; unfiltered that is the
#              better part of half an hour. This branch changes the GATE RUNNER and its two git
#              readers -- xtask, which no shipped binary links -- so busbar's behaviour is not in
#              scope at all. `^documented` is the slice that says so: the documented cells, and
#              nothing wider, because a wider claim here would be a claim this diff cannot make.
#   tests    — the packages whose test binaries the sharded legs must include by name. `xtask` is
#              the only crate this branch touches, and it is where the red-before-green cases live.
families = '^documented'
tests = ["xtask"]
