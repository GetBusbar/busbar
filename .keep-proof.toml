# WHAT THIS HAND-BACK ASKS keep-proof TO PROVE.
#
# .keep-proof.toml is read by .github/workflows/keep-proof.yml at the root of a `keep-*` branch. It
# scopes the two expensive legs of the run to what the branch actually touched, so a verdict says
# something specific instead of "everything, slowly".
#
#   families — a regex handed to the shadow oracle's `--id-filter`. This branch boots the mcp plane
#              from configuration through the units chain and deletes the legacy in-core boot path,
#              so the cells that judge it are the mcp conformance rig, the neutrality cells that say
#              a plane's presence changes nothing for anyone else, the admin.ops families that read
#              the node the boot assembled, and boot itself.
#   tests    — the packages whose test binaries the sharded legs must include by name: the root that
#              composes the leg, the mcp protocol crate and its plane, and the substrate ABI the
#              plane is written against.
families = '^(mcp|neutrality|admin\.ops|boot)([|.]|$)'
tests = ["busbar", "busbar-mcp", "busbar-plane-mcp", "busbar-substrate"]
