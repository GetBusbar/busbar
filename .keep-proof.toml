]

# The construction-gate rows the five original lines named, unioned. A row that matches nothing is
# not a failure (`stale-waiver` and `rigs` name no construction row on this tree — they are the
# no-deferral gate's and the rigs battery's), but a row that matches and is RED is.
gate = 'stale-waiver|kernel-seal|rigs|seal-sites|surface-ceiling|teller-step-order|secret-carrier-debug|no-uninstalled-seam'
