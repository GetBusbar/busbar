# The DEFAULT config.yaml baked into the getbusbar/busbar Docker image (see ../Dockerfile). It is
# what a user gets from a plain
#
#   docker run -d -p 8080:8080 -e ANTHROPIC_KEY -e BUSBAR_ADMIN_TOKEN getbusbar/busbar
#
# with no `-v .../config.yaml:/etc/busbar/config.yaml` mount at all: one provider (anthropic), one
# pool, zero plugins. This image ships plugin-free — see the Dockerfile's own header for why.
#
# This is a minimal quickstart default, not a production template: `auth.chain: []` is an open
# data-plane relay (loud startup warning; fine for a local/trusted-network trial). For anything
# beyond a quickstart, mount your own config.yaml over this path — see ../config.yaml for the full
# annotated walkthrough (providers, pools, auth, groups, hooks) to build one from. A mounted
# config.yaml REPLACES this file entirely (standard Docker bind-mount override).

listen: "0.0.0.0:8080"

# 1.5.3: an identity provider is DEFINED once here and REFERENCED by bare name from the chains.
identity-providers:
  admin-tokens: { module: admin-tokens, token: { env: BUSBAR_ADMIN_TOKEN } }

auth:
  chain: []                                            # open data-plane relay — see the note above
  admin_auth: [admin-tokens]                           # bare NAME into identity-providers: above

providers:
  anthropic:
    api_key: { env: ANTHROPIC_KEY }

models:
  claude:
    provider: anthropic

pools:
  default:
    members:
      - model: claude

# ── Durable store (optional; commented out — this image ships plugin-free) ────────────────────────
# Default is in-memory: keys/usage/ledgers/audit reset on restart (one WARN at boot). Turning this
# on needs all FOUR of the keys below, not just a writable volume — see
# docs/getting-started.md#durable-store-giving-persistence-a-writable-volume for the full recipe
# and the exact refusal text for each way this goes wrong, and docker/docker-compose.yml for a
# working end-to-end example (docker/config.persistent.yaml is that example's active config, i.e.
# this same block un-commented).
# store:
#   module: sqlite
#   settings:
#     db_path: /var/lib/busbar/governance.db     # directory must exist on a writable volume
#
# plugins:
#   enabled: true                                # master switch — default false
#   dir: /etc/busbar/plugins                     # ABSOLUTE — the default ("plugins") resolves to /plugins here
#   fetch:
#     - github: "GetBusbar/store-sqlite@v1.0.0"  # or omit `fetch` and bind-mount the signed tarball yourself
