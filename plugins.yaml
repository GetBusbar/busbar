    release_gate: optional
    gate: suite
    description: "The AD/LDAP auth module as a droppable busbar plugin: a cdylib exporting the auth C ABI. Drop it in the plugins folder, define it once under identity-providers.<name> (module: ldap, settings: url, bind_dn_template, base_dn, group_attr) and reference that name from auth.chain."
    ci_service: "openldap"
    busbar_checkout: true
    macos_test: "cargo test --workspace --locked --lib --test conformance"
    declares: "auth-ldap/declares.json"
  - repo: busbar-auth-admin-tokens
    kind: auth
    alias: admin-tokens
    crate: busbar-auth-admin-tokens-plugin
    version_line: "1.0"
    service: none
    release_gate: optional
    gate: suite
    description: "First-party signed kind:auth plugin cdylib: the built-in admin-tokens admin-auth module (the single operator admin token, compared in constant time), packaged as a droppable busbar plugin."
    declares: "auth-admin-tokens/declares.json"
    # The built-in operator admin-auth module, moved out of busbar (owner move-out ruling; ARCHITECT
    # 2026-09-27). busbar LINKS it at a pinned rev (busbar-kernel, feature `auth-admin-tokens`); its
    # first release is cut with the core version that pins it.
    released: false
  - repo: busbar-hook-webrequest
    kind: hook
    alias: webrequest
    crate: busbar-hook-webrequest
    version_line: "1.0"
    service: none
    release_gate: optional
    gate: smoke
    description: "A transparent HTTP forwarder that POSTs each hook op envelope (decide/transform/notify/configure/describe/status) to an operator-configured URL and returns the capped JSON reply: a busbar first-party kind:hook plugin (dlopen cdylib)."
    busbar_checkout: true
    lib_only: true
    needs_prompt: "rw"
    needs_user: "ro"
    declares: "declares.json"
