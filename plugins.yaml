    alias: github
    crate: busbar-auth-github-plugin
    version_line: "1.0"
    service: none
    release_gate: optional
    gate: suite
    description: "The GitHub-OAuth login module as a droppable busbar plugin: a cdylib exporting the auth C ABI (login-capable). Drop it in the plugins folder and add github to auth.chain with a browser_login block (the core injects client_secret)."
    ci_service: "wiremock"
    busbar_checkout: true
    macos_test: "cargo test --workspace --locked --lib --test conformance"
    declares: "busbar-auth-github/declares.json"
  - repo: busbar-auth-ldap
