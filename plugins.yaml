# THE first-party plugin registry — the single source of truth for "what plugins exist".
#
# Every system that needs the plugin list derives it from this file rather than carrying its own
# copy: scripts/plugin-registry-check.sh (the CI gate that keeps the consumers honest),
# qa-gate.yml's sibling checkouts, scripts/release-check.sh's per-plugin phases, and the release
# tooling. Found necessary during the 1.5.0 ship: the list was duplicated across at least five
# places, and the copies had drifted — the "full plugin gate" silently covered 6 of 8 plugins.
#
# Adding a plugin = adding ONE entry here. The registry gate then goes RED until every consumer
# actually covers it (qa-gate checkout present, release-check phase present, release published) —
# coverage is enforced, not remembered.
#
# Fields:
#   repo:          GitHub repo under GetBusbar/
#   kind:          store | secret | auth | hook | export | plane | transport  (busbar plugin kind;
#                  selects the C ABI; every kind ships as its own repo)
#   alias:         short config name (busbar-plugin-pack --alias)
#   crate:         the plugin cdylib's Cargo package name: <repo>-plugin beside the <repo> logic
#                  crate, or <repo> itself for a single-crate plugin (owner ruling: repo = crate =
#                  artifact prefix; the registry gate refuses any other name)
#   version_line:  the semver line current releases live on
#   service:       real backend container its tests need (mysql|postgres|valkey|vault|none)
#   release_gate:  required — release-check.sh hard-fails if the sibling checkout is missing
#                  optional — release-check.sh loud-skips (still red in the registry gate's
#                  release check; "optional" only softens a LOCAL run without the checkout)
#   gate:          HOW release-check.sh covers this plugin:
#                  suite  — the UNIFORM pattern: release-check.sh's registry-driven loop boots the
#                           entry's `service` container (if any), exports that service's
#                           BUSBAR_TEST_* env, and runs `cargo test --workspace --release` in the
#                           sibling checkout. Adding a `gate: suite` plugin needs NO script edit
#                           unless it introduces a brand-new `service` value.
#                  binary — a genuinely-special explicit phase driving the plugin through a full
#                           busbar binary (real HTTP traffic + restart durability). sqlite only.
#                  smoke  — a genuinely-special explicit phase: pack the cdylib and prove a real
#                           busbar --validate dlopens it. The hook plugins.
#                  The registry gate enforces that binary/smoke plugins still have an explicit
#                  phase touching ../<dir>, and that the suite loop + every `service` a suite
#                  plugin declares are actually handled in release-check.sh.
#
# Optional fields:
#   checkout_dir:  local sibling/checkout directory name when it differs from `repo`
#                  (no entry needs it today; kept for the next repo rename)
#   checkout_ref:  git ref the qa-gate's registry-driven clone loop checks the repo out at.
#                  DEFAULT: `dev`, NOT the repo's default branch. Every first-party repo runs
#                  busbar's own branch model (main = release-only, dev = ongoing work), so a
#                  sibling's `main` is pinned to its last RELEASE and cannot carry the plugin-side
#                  adaptation to the unreleased core this gate exists to test. qa-gate-run.sh's
#                  `siblings` documents the five legs that cost. Set this only for a repo that
#                  departs from that model; it falls back to the default branch when `dev` is absent.
#
# Fleet fields (read by `busbar-release plugin sync` (GetBusbar/busbar-release), the ONE generator: it
# renders every plugin repo's CI caller, toolchain, lint config, deny.toml, workspace dependency table,
# LICENSE and README header from this file, its template/ and .github/fleet/deps.toml, and checks the repos
# against the render). Defaults in brackets:
#   manifest_name  the signed manifest's `name` (the plugin's identity at load) [repo; the
#                  registry gate refuses any other value]
#   asset_prefix   the published tarball's filename prefix [repo; likewise]
#   description    the manifest's one-line description (also the README header's)
#   ci_service     the backend plugin-ci.yml's Linux leg runs against [service]
#   busbar_checkout  the end-to-end tests build and boot a real busbar from a checkout at the pin [false]
#   macos_test     the macOS leg's test command [cargo test --workspace --locked]
#   extra_test     an extra Linux test command [none]
#   lib_only       build the cdylib with --lib [false]
#   needs_prompt / needs_user   a hook's declared intent, signed into the manifest [none]
#   declares       the plugin's `declares` file (repo-relative), signed into the manifest; it states
#                  the contract-ABI range the plugin supports (`contract_abi`), which the loader
#                  refuses a plugin outside of
#   bundle_image / bundle_env   a runnable container bundle the consumer verification boots [none]
#   keep           repo-specific paths the render does not own: a file under .github/, or a top-level
#                  path (`Dockerfile`, `docker/`). Every repo is a TWIN (owner, 2026-09-30): anything
#                  under .github/ or at the top level that is not rendered, not one of the two crate
#                  dirs (`<kind>-<name>/`, `<kind>-<name>-plugin/`), not Cargo.lock and not kept is drift
#   gitignore      lines the rendered .gitignore carries after the fleet's own [none]
#   notice         lines the rendered NOTICE carries after the fleet's own (a third-party credit) [none]
#   pending_crate  the repo is registered (it exists, it is rendered and seeded by `busbar-release plugin sync`) but its
#                  crates have not moved in yet [false]. It stays OUT of plugin-registry-check.sh's
#                  --list feed, so qa-gate and release-check neither clone nor test it; `busbar-release plugin check`
#                  skips its crate-shaped checks with that reason (the whole repo while it is empty) and
#                  goes RED once both crate dirs are in and the flag is stale. Drop it at the move.

# THE FLEET POLICY (`busbar-release plugin check` holds every repo to it; `busbar-release plugin sync` applies it).
#   busbar_ref  ONE pin for every plugin repo: each repo's `.busbar-ref` is exactly this, every
#               manifest's busbar git rev is its sha, and the rendered callers take busbar's reusable
#               workflows at that sha. Moving it is one edit here, then `busbar-release plugin sync`.
#   name_pattern  every plugin repo is `busbar-<kind>-<name>`, and <kind> is the entry's kind.
#   branches    exactly these branches; dev, qa and main carry the repo ruleset `busbar-release plugin sync` applies (PR + plugin-ci green), main and
#               qa are locked by the org ruleset "release branches: main + qa (owner say-so only)"; any
#               other branch is stale.
fleet:
  busbar_ref: "e1d3d8b097201859751d77208e66249d98b50a4b 1.6.0"
  name_pattern: "^busbar-(store|secret|auth|hook|export|plane|transport)-[a-z0-9]+(-[a-z0-9]+)*$"
  branches: [dev, qa, main]

# Org repos that MATCH the plugin naming pattern but are deliberately NOT plugins (the reverse
# check in plugin-registry-check.sh flags any pattern-matching org repo that is neither listed
# above nor excluded here — so a new plugin repo cannot exist unregistered).
excluded_repos:
  - hindsight-hook # design docs only — no crate, no workflows, private
  - busbar-hook-headroom # removed from busbar and the site (owner ruling 2026-09-30) — the repo is kept, not a busbar plugin

plugins:
  - repo: busbar-store-mysql
    kind: store
    alias: mysql
    crate: busbar-store-mysql-plugin
    version_line: "1.0"
    service: mysql
    release_gate: optional
    gate: suite
    description: "First-party signed kind:store plugin cdylib: the MySQL/MariaDB backend for busbar's durable governance store, exported over the store C ABI. Drop the built library into the plugins folder and set store.module: mysql to share virtual keys, budgets, and usage across a fleet of busbar nodes."
    ci_service: "mysql"
    busbar_checkout: true
    macos_test: "env -u CI cargo test --locked -p busbar-store-mysql-plugin --test conformance"
    declares: "store-mysql/declares.json"
  - repo: busbar-store-postgres
    kind: store
    alias: postgres
    crate: busbar-store-postgres-plugin
    version_line: "1.0"
    service: postgres
    release_gate: required
    gate: suite
    description: "First-party signed kind:store plugin cdylib: the Postgres backend for busbar's durable governance store, exported over the store C ABI. Drop the built library into the plugins folder and set store.module: postgres to share virtual keys, budgets, and usage across a fleet of busbar nodes."
    busbar_checkout: true
    declares: "store-postgres/declares.json"
  - repo: busbar-store-sqlite
    kind: store
    alias: sqlite
    crate: busbar-store-sqlite-plugin
    version_line: "1.0"
    service: none
    release_gate: optional
    gate: binary
    description: "First-party signed kind:store plugin cdylib: the SQLite governance store packaged as a droppable busbar plugin exporting the store C ABI. Drop the built library into the plugins folder and set store.module: sqlite."
    busbar_checkout: true
    declares: "store-sqlite/declares.json"
    gitignore:
      - "busbar-governance.db*"
  - repo: busbar-store-valkey
    kind: store
    alias: valkey
    crate: busbar-store-valkey-plugin
    version_line: "1.0"
    service: valkey
    release_gate: optional
    gate: suite
    description: "The Valkey store as a droppable busbar plugin: a cdylib exporting the store C ABI. Drop it in the plugins folder and set store.module: valkey. One Valkey behind a fleet of busbar nodes means shared virtual keys, budgets, usage, and audit across the cluster."
    busbar_checkout: true
    extra_test: "cargo test -p busbar-store-valkey --locked -- --ignored --test-threads=1"
    declares: "store-valkey/declares.json"
  - repo: busbar-secret-vault
    kind: secret
    alias: vault
    crate: busbar-secret-vault-plugin
    version_line: "1.0"
    service: vault
    release_gate: optional
    gate: suite
    description: "The HashiCorp Vault secret backend as a droppable busbar plugin: a cdylib exporting the secret C ABI. Drop it in the plugins folder, add vault to secrets: with its addr/token settings, and reference secrets as { module: vault, settings: { path: \"kv/data/name#field\" } }."
    macos_test: "cargo test --workspace --locked --lib --test conformance -- --skip roundtrip_against_live_vault"
    declares: "secret-vault/declares.json"
  - repo: busbar-auth-oidc
    kind: auth
    alias: oidc
    crate: busbar-auth-oidc-plugin
    version_line: "1.0"
    service: none
    release_gate: optional
    gate: suite
    description: "The OIDC auth module as a droppable busbar plugin: a cdylib exporting the auth C ABI. Drop it in the plugins folder and add oidc to auth.chain with its settings nested under it."
    busbar_checkout: true
    macos_test: "cargo test --workspace --locked --lib --test conformance"
    declares: "auth-oidc/declares.json"
    keep:
