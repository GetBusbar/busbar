# contract-stateless: DRAIN-ONLY ledger (M0 ABI-SPEC, REPORT-ONLY).
# busbar-contract holds no static, once-cell or thread-local outside test code: each
# row is one the tree carries today. Strike a row in the commit that drains it;
# never add one. Regenerate with `cargo xtask gate contract-stateless --write`.

# The door macro's per-thread call-capture slot (plugin logging, #85), expanded in each PLUGIN's own
# crate: one slot per plugin image, never state shared by host and plugins. Owner 2026-09-28.
[[sanctioned]]
rule = "contract-stateless:static"
file = "crates/busbar-contract/src/abi/sdk/door.rs"
item = "__BUSBAR_CAPTURE"
cite = "ARCHITECT ruling 2026-10-14: the plugin-logging capture is the ONE sanctioned per-thread slot (BUSBAR-1.6.0.md l.1297-1300, one slot per thread per plugin image, expanded by the door macro in the plugin image)"
drain = "none — mandated by SPEC 1297"

[[sanctioned]]
rule = "contract-stateless:thread-local"
file = "crates/busbar-contract/src/abi/sdk/door.rs"
item = "thread_local!"
cite = "ARCHITECT ruling 2026-10-14: the plugin-logging capture is the ONE sanctioned per-thread slot (BUSBAR-1.6.0.md l.1297-1300, one slot per thread per plugin image, expanded by the door macro in the plugin image)"
drain = "none — mandated by SPEC 1297"

