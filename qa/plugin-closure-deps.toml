# plugin-closure-deps: DRAIN-ONLY ledger (M0 ABI-SPEC, REPORT-ONLY).
# A plugin depends on busbar-contract and nothing else of busbar's, holds no runtime,
# logger or recorder, and reaches no thread, socket, file or env of its own. Each row
# is one the tree carries today; `file` is the plugin's manifest or source file.
# Strike a row in the commit that drains it; never add one.
# Regenerate with `cargo xtask gate plugin-closure-deps --write`.

[[finding]]
rule = "plugin-closure-deps:busbar-deps"
file = "crates/busbar-plane-llm/Cargo.toml"
item = "busbar-llm-codec"

