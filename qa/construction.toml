# none of these unions, so the deletion pays nothing back here and the whole 213 is declared.
#
# WHAT IT IS. Two POLICIES over one threat: what a request-log webhook may target (https only,
# loopback and localhost BLOCKED - no webhook should POST to a co-located process) and what a trace
# collector may target (http permitted to loopback ONLY, because the standard deployment is a
# sidecar; everything else the webhook blocks is still blocked). They diverge deliberately on the
# localhost family and on plaintext, each documents its own divergence, and that divergence is why
# they are two functions and not one with a flag. Under them are the URL-shaped atoms the policies
# are written over - the trailing-FQDN-dot strip, the IPv4-mapped-IPv6 arm, the alternate-encoding
# parity mirror, the loopback carve-out - and the userinfo masker every logging site runs first.
#
# WHY IT IS A UNIT AND NOT A LEAF. The question the suite answers is "may this deployment send
# there at all?", and that is the egress unit's question: it is the crate that owns the pool, the
# walk and the one attempt, and a sink URL an operator typed is a destination like any other. It is
# NOT the substrate, which the owner froze on 2026-09-10.
#
# WHAT DID NOT TRAVEL. The range predicates. `ipv4_is_internal`, `ipv6_is_internal`,
# `ip_is_internal` and `is_alternate_ipv4_encoding` are called from busbar_unit_trust::net, exactly
# as the engine called them through its own shim, so no fifth copy exists and a contributor
# hardening one guard against a new range cannot miss this one.
#
# ONE SIGNATURE CHANGED, and it is the only line of this move that is not identity.
# `validate_otlp_endpoint` resolves the collector's NAME as well as reading its text, because a name
# pointed at an internal address passes every textual check. A unit does no I/O, so the lookup
# enters as an argument and the DECISION about what a resolved address means stays with the policy.
# All thirty-two tests are PORTED, not rewritten, and pass.
