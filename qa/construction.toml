from    = 2811
to      = 3177
because = "busbar-a2a x plane: the P0 re-baseline of qa/kind-isolation.toml for the busbar-mcp/busbar-a2a engine split (docs/design/1.6.0-engine-split-plan.md P0). This is NOT a landing that grew the coupling: the row was already BELOW the count it governs and kind-isolation:matrix was already RED on it, so the number was fiction and the ratchet it fed could not fire in either direction. The drain that lowers it is the wave that moves the code; this entry only makes the correction reviewable. This is the cell the split drains to ZERO at Wave F. The plan quotes 2811 as a measurement; it is a ledger row that stopped tracking the tree."

