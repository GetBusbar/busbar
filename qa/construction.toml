# ------------------------------------------------------------------------------------------------
# [gate.census] — THE RATCHET ON THE RATCHETS
# ------------------------------------------------------------------------------------------------
#
# `ceiling-rose` stops a ceiling being RAISED. Nothing stopped a ceiling being DELETED TOGETHER WITH
# THE RULE TABLE THAT HOLDS IT, because the construction gate's owed-row register is derived from
# this very file: delete `[rules.loc-ceilings.kernel_files.arena]` and the check and the obligation
# to run it vanish in the same edit. Measured, 2026-09-09: the gate went from 112 rows to 111 and
# said nothing at all, and the kernel's arena/masking LOC ceiling stopped being measured.
# `[rules.legacy-reach.prefixes.*]`, `gate.plane_crates` and every `[gate.plugin_kinds]` glob have
# the same shape.
#
# So the COUNTS are pinned here, and `ceiling-census` is owed UNCONDITIONALLY — it is a literal in
# the gate's id list rather than something derived from this file, which is the property every other
# derived row lacks.
#
# EACH NUMBER IS A FLOOR, NOT AN EQUALITY. Adding a kernel file, a legacy prefix or a plane crate is
# the ordinary direction of this work and needs no ceremony here; REMOVING one is the manoeuvre, and
# `actual < pinned` is RED.
#
# AND THE FLOOR IS ITSELF PINNED AGAINST THE BASE. Lowering a number here is not something
# `ceiling-rose` sees — that row watches numbers going UP — so `ceiling-census` compares every
# number in this table against the base commit's copy, and a floor that WENT DOWN is RED. Without
# that half, deleting a rule table and dropping its census number in one edit would be exactly as
# silent as deleting the table alone was.
[gate.census]
loc_ceilings_kernel_files = 9
legacy_reach_prefixes = 3
plane_crates = 4

# HOW MANY CRATE DIRECTORIES EACH KIND GLOB MATCHES.
#
# The failure this closes: `kind-isolation:truths` checks that a `[gate.plugin_kinds]` KEY exists,
# never that its globs still match the crates that exist. Narrow `crates/busbar-plane-*` to
# `crates/busbar-plane-llm` and the key is still present, still cross-checked in both directions,
# and four crates silently stop being scanned by manifest-allowlist, source-denylist and
# forbid-unsafe.
#
# A COUNT, NOT "AT LEAST ONE". The header above this file's `[gate.plugin_kinds]` records that a
# glob matching no directory today is the intended state for a kind with no crate yet — `dialect`
# and `control` are both legitimately 0, and `egress_auth` has no crate under its own glob. A
# blanket "at least one" would red three documented zeros while still saying nothing about `plane`
# going from five crates to one. The count catches the narrowing and leaves the intended zeros
# alone; the day the codec split creates the first dialect crate, this number is raised with it.
#
# `plane` is 5 because `crates/busbar-plane-admin` matches the plane glob while being the `control`
# kind — see the note above `[gate.plugin_kinds]`. Pinning the number the glob ACTUALLY matches is
# the point: this table records what is scanned, not what ought to be.
[gate.census.plugin_kinds]
plane = 5
dialect = 0
control = 0
unit = 14
hook = 2
pure_auth = 2
egress_auth = 0
secret = 2
store = 2
export = 1
transport = 7
loader = 1
abi = 1

# ── DECLARED RAISES ─────────────────────────────────────────────────────────────────────────────
#
# `construction:ceiling-rose` refuses every number in `qa/construction.toml` and
# `qa/kind-isolation.toml` that is higher than it was at the base. There is one landing shape that
# legitimately raises one, and it is this one: the composition root — a WIRE-PERMITTED kind, the one
# place in the tree that is allowed to name what it composes — gains vocabulary because it started
# composing something. A declaration is not a waiver. It names the file, the exact dotted path and
# BOTH numbers, so it describes one edit rather than a direction; it carries a reason; and it EXPIRES
# BY ITSELF, because once the commit lands the base carries the new number, the rise disappears, and
# an entry that describes no rise is refused as stale.
#
# The rows below are the composition root mounting the generic duplex acceptor
# (`crates/busbar/src/root/plane_mount.rs`, `root-duplex-serve`). It is one acceptor for every plane
# there will ever be, generic over `busbar_contract::transport::session::DuplexWire`, handed the wire
# the boot seal REGISTERED rather than one it built — so the vocabulary it adds is the root naming
# the seam it mounts through and the registry it takes the wire off, which is what a composition root
# IS. Nothing outside `busbar` moved; a rise in a non-permitted crate is coupling and is drained
# instead of declared.
#
# Each `because` names the cell's CRATE and KIND as well as its index, because the ledger is being
# re-keyed from `cell.N` to `(crate, kind)` and an entry that only knew its ordinal would not survive
# the re-key.

[[gate.ceiling_raises]]
key = "cell.busbar.contract-transport.count"
file = "qa/kind-isolation.toml"
by = 10
because = "cell (crate = \"busbar\", kind = \"contract-transport\"). The composition root composes the duplex wire through the generic acceptor (root/plane_mount.rs); a permitted kind naming what it mounts. `busbar_contract::transport::…` is the seam the acceptor is written against — DuplexWire, SessionBudgets, SessionDriver, SessionEnd — and it is spelled through the contract rather than through the wire's crate precisely so no second transport type is named at the root."

[[gate.ceiling_raises]]
key = "cell.busbar.kernel.count"
file = "qa/kind-isolation.toml"
by = 1
because = "cell (crate = \"busbar\", kind = \"kernel\"). The composition root composes the duplex wire through the generic acceptor (root/plane_mount.rs); a permitted kind naming what it mounts. The one hit is the acceptor's battery asking the registry, by the kernel's own vocabulary, whether the wire it mounts is the entry the boot seal registered — the cell that proves there is exactly one registration."

[[gate.ceiling_raises]]
key = "cell.busbar.transport.count"
file = "qa/kind-isolation.toml"
by = 31
because = "cell (crate = \"busbar\", kind = \"transport\"). The composition root composes the duplex wire through the generic acceptor (root/plane_mount.rs); a permitted kind naming what it mounts. The acceptor itself names no wire; the vocabulary is the root's own — the registry the wire is taken off, the listener the node already bound, and the manifest switch that says this build carries a duplex wire."

[[gate.ceiling_raises]]
key = "cell.busbar.contract-transport.count"
file = "qa/kind-isolation.toml"
by = 29
because = "THE UPSTREAM LEG ON THE DRIVER'S SLOT extends this by 15 (42 -> 57): the leg is offered through the contract's own `session::EgressLease` and refused in its own closed failure vocabulary \u2014 `Backpressure` is `CapacityExhausted`, anything else is `TransportFailed` \u2014 and the decorator that dials it, the driver's two sync seams and the battery's fake lease all name that face and nothing of a wire's. THE PLANE CALL extends this by 4 (38 -> 42): the driver reads the declared media off the row, the upgrade's transport facts (credential, path) through the seam's own keys, and the served-session cell opens on the plane's real row. cell (crate = \"busbar\", kind = \"contract-transport\"). The composition root composes the duplex wire through the generic acceptor (root/plane_mount.rs) and now runs what the acceptor hands it through the generic session driver (root/session_driver.rs); a permitted kind naming what it mounts. `busbar_contract::transport::…` is the seam both are written against — DuplexWire, SessionBudgets, SessionDriver, SessionEnd for the acceptor, and SessionOpen, SessionFrame, SessionReply, SessionHandle, the surface's Answering/Bar/Dispatch and CloseReason for the driver — and all of it is spelled through the contract rather than through the wire's crate precisely so no transport type is named at the root."

[[gate.ceiling_raises]]
key = "cell.busbar.kernel.count"
file = "qa/kind-isolation.toml"
by = 17
because = "THE UPSTREAM LEG ON THE DRIVER'S SLOT extends this by 2 (174 -> 176): `Kernel::unit_view` and `UnitIdentity`, which is the whole of the root's new reach into the kernel \u2014 the relay writes are made against a view the kernel mints and the root cannot. cell (crate = \"busbar\", kind = \"kernel\"). The composition root composes the duplex wire through the generic acceptor (root/plane_mount.rs) and runs a session's frames over the loop through the generic session driver (root/session_driver.rs); a permitted kind naming what it composes. One hit is the acceptor's battery asking the registry, in the kernel's own vocabulary, whether the wire it mounts is the entry the boot seal registered. The rest is the LOOP a session's frames are judged by — run_unit, Units, UnitCtx, Run, Ended, the kernel's own session_id mint, the gauge and the lease cell — named by the root because the root is what composes it. The driver is generic over the unit set for the same reason the acceptor is generic over the wire, so none of it is any plane's units."

[[gate.ceiling_raises]]
key = "cell.busbar.transport.count"
file = "qa/kind-isolation.toml"
by = 39
because = "THE UPSTREAM LEG ON THE DRIVER'S SLOT extends this by 23 (986 -> 1009): the dial happens in the gap between two frames, which means it happens inside a `FrameSource`, which is the duplex mount's own face \u2014 named by the decorator, by the battery's scripted source and by the cells that drive both. No wire is named: what dials is a seam (`LegDialer`) the composition supplies. THE PLANE CALL extends this by 6 (980 -> 986): the transport view the driver hands the plane is built over the upgrade's own key, chain and published facts, and the served-session cell names the wire the row is carried on. cell (crate = \"busbar\", kind = \"transport\"). The composition root composes the duplex wire through the generic acceptor (root/plane_mount.rs) and runs what it accepts through the generic session driver (root/session_driver.rs); a permitted kind naming what it mounts. Neither names a wire; the vocabulary is the root's own — the registry the wire is taken off, the listener the node already bound, the manifest switch that says this build carries a duplex wire, and, for the driver, the declared wire surface a session's row is read off, the registry key an upgrade arrived on and the published transport facts the credential bar is resolved against. All of that is data the plane declared, and none of it is a wire's type."
