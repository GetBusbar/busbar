#     busbar-plugin-loader `auth_conformance_tests`), and the removed ci.yml `plugin-proofs` proves
#     GetBusbar/busbar-auth-github. `crates/auth-*` now matches exactly one: `crates/auth-admin-tokens`.
#
# ── RE-PINNED 2026-09-27: `transport` 5 -> 4 ────────────────────────────────────────────────────────────────
#
#   * `transport` 5 -> 4. TRANSPORT-STACK (owner-approved 2026-09-27, docs/design/1.6.0-QUESTIONS.md;
#     spec #3): TLS is core-only connection security — `busbar-core-connector` is the one TLS path and
#     never crosses the plugin ABI — so `crates/busbar-transport-tls` was deleted, not moved.
#     `crates/busbar-transport-*` now matches exactly four: http, stdio, tcp and ws.
#
# ── RE-PINNED 2026-09-27: `auth` 1 -> 0 ───────────────────────────────────────────────────────────────────
#
#   * `auth` 1 -> 0. The move-out (owner, "PLUGINS LIVE IN THEIR OWN REPOS"; ARCHITECT 2026-09-27:
#     auth-admin-tokens is a REAL auth plugin, extracted with its door and conformance):
#     `crates/auth-admin-tokens` moved to GetBusbar/busbar-auth-admin-tokens with its history, and busbar
#     pulls it at a pinned rev under the unchanged `auth-admin-tokens` feature (busbar-kernel) and as
#     the loader's `auth-verify` both-ways proof. `crates/auth-*` now matches no directory: the
#     kind's documented zero in this repo. Its `known_missing_forbid` entry leaves with it (the
#     crate carries `#![deny(unsafe_code)]` outside its one macro door module).
#
# THE BASE COMPARISON STILL REPORTS THE THREE DECREMENTS (plugin_kinds.plane 6->5,
# plugin_kinds.unit 14->1, plugin_kinds.pure_auth 2->0), AND THAT IS THIS ROW WORKING RATHER THAN
# FAILING. `[gate.census]` reds a floor that went DOWN versus the base commit precisely because it
# cannot tell a narrowed glob from a folded-away crate, so the commit that owns a roster move is
# the commit that carries the report and names the cause — above, and in its own message. It
# EXPIRES BY ITSELF, exactly as a declared ceiling raise does: the moment this lands, the base
# carries these numbers, the decrement disappears and the comparison is quiet. Re-pinning without
# naming the fold, or leaving the pins stale so the row reds on `actual < pinned` forever, are the
# two things this table is written to prevent.
#
# store 2 -> 1 (DOOR-STORE item 4, R-FIX2 + owner FIXTURES ruling): crates/store-example-plugin is
# DELETED — its one remaining test (the dlopen-restart durability proof) moved onto the real durable
# store GetBusbar/busbar-store-sqlite in `plugin_proof_tests`. `crates/store-*` now matches exactly one:
# `crates/store-memory`, the store kind's both-ways proof.
#
# export 1 -> 0 (EX-DEL, owner FIXTURES ruling "real plugins are the proofs" + Q75): the export
# fixture crate is DELETED. Every test that loaded it now loads a REAL sink from its own repo at the
# root's pinned rev (GetBusbar/busbar-export-file, -webhook, -prometheus, -otlp) — the loader's both-ways
# rows `export`, `export-webhook`, `export-scrape`, `export-otlp`. Neither export glob matches a
# directory in this repo any more: the kind's documented zero.
#
# transport -1 (EXTRACT-15, TODO PATH TO DEV-GREEN P5 "EXTRACTION TO 15 CRATES", item http): the http
# transport crate MOVED OUT with its history to GetBusbar/busbar-transport-http and busbar pulls it at one pinned rev
# (root Cargo.toml). Its gates run in that repo's plugin CI.
# transport 3 -> 2 (EXTRACT-15, item tcp): the tcp transport crate MOVED OUT with its history to
# GetBusbar/busbar-transport-tcp and busbar pulls the logic crate and its -plugin cdylib crate at one pinned
# rev (root Cargo.toml). Its gates run in that repo's plugin CI. `crates/busbar-transport-*` now matches
# two: stdio and ws.
# transport 2 -> 1 (EXTRACT-15, item ws, #214): the ws transport crate MOVED OUT with its history to
# GetBusbar/busbar-transport-ws and busbar pulls it at one pinned rev (root Cargo.toml). Its gates run
# in that repo's plugin CI. `crates/busbar-transport-*` now matches one: stdio.
[gate.census.plugin_kinds]
plane = 5
hook = 2
auth = 0
secret = 0
store = 1
export = 0
transport = 1
loader = 1
abi = 1

