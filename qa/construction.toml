# qa/construction.toml — thresholds for THE CONSTRUCTION GATE (cargo xtask gate construction).
#
# The shadow oracle proves the tree is user-correct. This file is the owner's dial for how well the
# tree is BUILT, measured against docs/design/ARCHITECTURE.md. Every rule below is a named invariant
# with a plain-language reason, a current-state threshold, and the one knob the owner tightens as the
# construction improves. Tightening is a one-line edit here; the gate script never restates a number.
#
# Every threshold is a ceiling: the rule fails when the measured value is ABOVE it. A rule at 0 is
# fully enforced. A rule sitting at today's count is a ratchet: it stops regression while the debt
# is paid down. Never loosen a value without saying why in the commit.

[gate]
# Where Rust source is scanned. Globs relative to the repo root; the composition-root bin
# (crates/busbar) is included on purpose because production installers live there.
scan_roots = ["crates/*/src"]
# The plane crates (the plugin side): one name per protocol plane, so each carries its own ceiling
# below. This is the ROW KEY list, not the whole source surface — see gate.plane_codec_crates.
#
# NOTE (PLUGIN-TREE.md): "plane" is defined TWICE in this file, disjointly. This list is the four
# LEGACY ENGINE crates; `gate.plugin_kinds.plane` below is the five `busbar-plane-*` crates, and the
# two lists share zero members. manifest-allowlist reads THIS one to decide what "a plane names
# another plane" means. The two collapse into one definition when the legacy engines are deleted;
# until then a reader must not take either as "the plane kind".
plane_crates = ["busbar-llm", "busbar-mcp", "busbar-a2a", "busbar-voice"]
# A file at one of these path fragments is TEST code (same rule the purity lint applies), in
# addition to any `#[cfg(test)] mod … { … }` block inside a production file.
# A bare `tests.rs` (Rust's `#[cfg(test)] mod tests;` file convention) is test code too.
test_path_fragments = ["/tests/", "_tests.rs", "_test.rs", "/tests.rs"]

# Directory globs (relative to the repo root) that name each PLUGIN KIND from ARCHITECTURE.md section 1.4.
# Shared by manifest-allowlist, source-denylist and forbid-unsafe so the kind boundaries are drawn
# once. A glob matching no directory today is fine (the kind has no crate yet) — every rule below
# treats an empty match list as nothing-to-check, not a failure.
#
# OWED, per docs/design/PLUGIN-TREE.md (normative for every kind boundary; owner rulings 2026-09-07,
# ARCHITECTURE.md Appendix A). These are notes for the gate agent, not changes:
#   * `dialect` is a KIND and has no row here. It lands as `crates/busbar-plane-*-*` once the codec
#     crates split; its manifest rule is the tightest in the tree — a `busbar-plane-<p>-<d>` crate's
#     only workspace dependencies are `busbar-contract` and `busbar-plane-<p>`.
#   * `loader` and `abi` are NOT kinds. They are TCB crates and belong in a separate `tcb_crates`
#     list; they are here only so they inherit the forbid-unsafe deny row, and counting them is how
#     this table reaches "10" with a set that is not the owner's ten.
#   * Kind membership is decided here by DIRECTORY GLOB, and `Plugin::kind()` — the declaration that
#     should be authoritative — is read by nothing. That is how `crates/secret-ref` (a SecretRef TYPE
#     crate, no Secret impl) is classified `secret`, and how `crates/hooks-ranking` is classified
#     `hook` by the directory name while implementing a busbar-api trait. Renaming the fifteen crate
#     directories to their existing `package.name` (PLUGIN-TREE.md section 7) makes these globs
#     correct by construction and is the cheap first half of kind-by-declaration.
[gate.plugin_kinds]
plane = ["crates/busbar-plane-*"]
# THE THREE KINDS THIS TABLE DID NOT NAME, added 2026-09-09. ARCHITECTURE.md's kind list is
# normative and names ten kinds plus the `unit` core row; this table named ten KEYS and three of the
# eleven were missing from it -- `dialect`, `unit` and `control`. `cargo xtask gate kind-isolation`
# cross-checked this table in ONE direction (a key here that maps onto no kind in its table was
# refused), so a kind the design states and this file does not mention was invisible to both.
# `kind-isolation:truths` compares the three vocabularies in both directions now.
#
# `dialect` has no crate yet: the pre-split dialects are the `*-codec` crates and the rename that
# splits them into `busbar-plane-<plane>-<dialect>` is what creates the first one. The glob is
# written for the shape it will have, and a kind whose glob matches nothing is a kind with no crate
# rather than a rule switched off -- which is exactly the case `kind-isolation:truths` now watches.
dialect = ["crates/busbar-plane-*-*"]
# `control` is the tenth kind (owner ruling 2026-09-08). Its one member is `busbar-plane-admin`,
# whose NAME says plane and which is not one; the R7 rename makes it `busbar-control-admin`. The
# declaration lives in qa/kind-isolation.toml's [[registered]] row, which is where PLUGIN-TREE.md
# has said it lives since it was written.
control = ["crates/busbar-control-*"]
unit = ["crates/busbar-unit-*"]
hook = ["crates/hook*"]
pure_auth = ["crates/auth-*"]
egress_auth = ["crates/egress-auth-*"]
secret = ["crates/secret-*"]
store = ["crates/store-*"]
export = ["crates/export-*"]
transport = ["crates/busbar-transport-*"]
loader = ["crates/plugin-loader"]
abi = ["crates/busbar-contract"]

# The OTHER half of each plane's sources. Every plane kept its I/O half under its own name and shed
# its pure half — the codecs, the record vocabularies, the duplex IR, the dialect grammars — into a
# `-codec` crate; scripts/plane-keys.sh's `plane_src_roots` names both halves for exactly that
# reason. A gate that scans sources rather than manifests and knows only the first half stops
# watching the bulk of the plane on the day of the split and still prints a green row, so the second
# half is named here and folded into its plane's ports-only rows.
#
# This is deliberately NOT `plane_crates`. That list also decides which dependency is a
# plane-names-another-plane RED in manifest-allowlist, and a plane naming its own pure codec half is
# the intended shape, already on that rule's reviewed list.
#
# OWED (PLUGIN-TREE.md, owner 2026-09-07): these four crates ARE the dialect kind, unnamed. They are
# the only shipping crate group with no `Kind` variant, no section 1.4 row, no stated contract and no
# ceiling. The 2026-09-06 decision to FOLD each codec into its plane is superseded: each codec SPLITS
# into `busbar-plane-<plane>-<dialect>` crates. Sequence, and the order matters — the llm DECLS order
# (anthropic, openai, gemini, bedrock, responses, cohere) is operator-visible and every metric-family
# index is a position in it, so pin it with an oracle boot cell BEFORE the split, then name the
# shared residue's destination, then split.
[gate.plane_codec_crates]
busbar-llm = ["busbar-llm-codec"]
busbar-mcp = ["busbar-mcp-codec"]
busbar-a2a = ["busbar-a2a-codec"]
busbar-voice = ["busbar-voice-codec"]

# ── DECLARED CEILING RAISES ──────────────────────────────────────────────────────────────────────
#
# `ceiling-rose` refuses any integer in this file or in qa/kind-isolation.toml that is higher than
# it is at this branch's base. A ratchet with NO route through it is a ratchet somebody edits the
# rule to get past, and there are raises that are legitimate and cannot be avoided: the FIRST
# gating figure of a row that was not gating before, and a face landed under a ceiling that
# measures the very lines the face is made of.
#
# A declaration is not a waiver. It is ONE DELTA PER FACE, in an array of tables, so that several
# faces declared off the same base each carry their own and the entries SUM: the tree is green when
# the ceiling rose by exactly the sum. A `by` above what the tree rose by is over-declared and red;
# a `by` below leaves the remainder undeclared and red. The figure in the file is still pinned to
# the exact measurement by `ceiling-slack` — a declared raise moves the ratchet, it does not loosen
# it.
#
# It EXPIRES BY ITSELF. The entry rides in the face's commit; once that commit is in the base, the
# base's copy of this file carries the entry too, and `ceiling-rose` reports it as a warning (never
# red — the strike cannot ride in the same batch as the face) until `cargo xtask gate construction
# --write` strikes it. An entry the base does NOT carry, naming a ceiling that did not rise, is a
# deleted face's leftover and IS red.
#
# THE SHAPE a face commit carries (the `[gate.ceiling_raises."<key>"]` `from`/`to` header this
# table used to take is refused by name — it could name one face per key and never expired):
#
#   [[gate.ceiling_raises]]
#   key = "rules.loc-ceilings.caps_contract_ceiling"   # the dotted path of the integer that rose
#   by = 10                                            # the lines the face measured, exactly
#   because = "governance virtual-key face: KeyFacts + VirtualKeyDirectory, +10 lines in ..."
#   # optional: file = "qa/kind-isolation.toml"  (default: this file);  commit = "<sha>"
#
# A qa/kind-isolation.toml row is keyed by its IDENTITY — `cell.<crate>.<kind>.count`,
# `dep.<from>.<to>.<half>.count`, `face.<crate>.<face>.count` — never by its ordinal, because
# striking one `[[cell]]` renumbers every later row. `because` is at least 80 characters and names
# the face.

# NO ENTRY STANDS HERE TODAY. The virtual-key directory face (`busbar_contract::kinds::{KeyScope,
# KeyFacts, VirtualKeyDirectory}`; 19 surface lines) landed under three declarations of exactly this
# shape -- contract_caps 3478 -> 3497, caps_contract_ceiling 3480 -> 3499, union_ceiling 23465 ->
# 23484 -- and the DELETION that followed it (`Unit::{byte_counts, frame_counts, set_counts}` and
# their two fields, 21 lines the kernel never wrote) took the pair BELOW the base again. A
# declaration that describes no rise at the base is stale and refused, so the three were struck in
# that same deletion commit and the ceilings re-pinned to the measurement; the face is paid for.

# kind-isolation cell: crate `busbar`, kind `substrate`. The protocol boot installer moved verbatim
# out of the legacy core (52 lines) into `crates/busbar/src/root/proto_install.rs`; the composition
# root owns the boot installers, and the one symbol the move newly puts in the root's mouth is
# `busbar_substrate::ingress::arrival::install_path_ingress`. The same commit takes the root's reach
# into the legacy core DOWN by two and its total legacy reach DOWN by one, so the retirement is net
# forward and this single name is the sideways step that paid for it.
[[gate.ceiling_raises]]
key = "rules.legacy-reach.prefixes.busbar_substrate.figure"
by = 1
because = "moved verbatim from busbar-core/src/proto/registry.rs (52 lines): the composition root owns the boot installers. kind-isolation cell crate `busbar`, kind `substrate`. The root's busbar_core:: prefix falls 27 -> 25 and its total legacy reach falls 91 -> 90 in the same commit."

# THE CHAIN CACHE FACE: `busbar_unit_admission::{ChainCache, Chain, BucketView}`
# (crates/busbar-unit-admission/src/cache.rs, 136 surface lines, + 2 module-wiring lines in that
# crate's lib.rs = 138 measured). Every chain a resolved `GroupTable` can produce, walked ONCE at
# boot beside the `ChainWalk` that produces it, plus the index of the bucket ids that still carry a
# cap; a request READS its chain by index-chase and the cursor `BucketView` borrows every field, so
# the admission path allocates nothing. It is here rather than on `busbar_unit_cost::GroupTable`
# because the cache is made of what the walk RETURNS (`BucketChain`, `ChainBucket`, `ChainGroup`),
# and the cost unit naming the admission unit is a Cargo library cycle, refused by name. The
# retiring engine's copy — `cost::BucketView`, `cost::Chain`, `CostModel::{group_chain,
# capped_bucket_ids}` and the `chains`/`empty_chain`/`capped_bucket_ids` fields — is deleted in the
# commit that follows this one: busbar-core/src/cost.rs 471 -> 292 lines, 105 of the 138 the same
# lines by identity. `kernel_ceiling` rises by two because busbar-unit-admission/src/lib.rs is in
# the kernel's call-graph name-match set, so DECLARING a module in that crate spends kernel budget:
# `pub mod cache;` and `pub use cache::{BucketView, Chain, ChainCache};`, and nothing else.
[[gate.ceiling_raises]]
key = "rules.loc-ceilings.unit_total_ceiling"
by = 138
because = "chain cache face busbar_unit_admission::{ChainCache, Chain, BucketView} (src/cache.rs, 136 surface lines + 2 module-wiring lines in lib.rs): every chain of a resolved GroupTable walked once at boot beside the ChainWalk that walks it, and the capped-bucket-id index. 105 of the 138 are busbar-core/src/cost.rs's own lines by identity; core falls 471 -> 292 in the deletion commit."

[[gate.ceiling_raises]]
key = "rules.loc-ceilings.union_ceiling"
by = 140
because = "chain cache face busbar_unit_admission::{ChainCache, Chain, BucketView}: the same 138 unit lines, plus the 2 lib.rs module-wiring lines counted a second time here because busbar-unit-admission/src/lib.rs is call-graph-reachable from the Teller loop and a reachable unit file spends kernel budget as well as its own crate's."

[[gate.ceiling_raises]]
key = "rules.loc-ceilings.kernel_ceiling"
by = 2
because = "chain cache face busbar_unit_admission::{ChainCache, Chain, BucketView}: two lines of MODULE WIRING, not two lines of kernel. busbar-unit-admission/src/lib.rs is in the kernel's call-graph name-match set, so `pub mod cache;` and `pub use cache::{BucketView, Chain, ChainCache};` spend kernel budget; cache.rs itself is not name-matched and none of its 136 lines are counted here."

# THE KERNEL-HELD RECORD LEG, and its store reach: `crates/busbar/src/root/records.rs` and the
# boot-verify golden beside it. A plane declares its record; the audit unit frames the bytes; the
# kernel admits the leg; the composition root lands it on the published store protocol. That last
# sentence is the rise: the root is the ONE kind entitled to name a store, a unit, a kernel and a
# plane in the same file, and the five cells below are what naming all four of them costs. Every one
# of them is the root composing what it mounts — none is a new dependency edge, and none of it is
# reachable from anything but `src/root/`. The leg is built for TWO streams and one of them is
# retired in the commit after this one: `busbar-core/src/plane/auditlog.rs` and its battery, 1375
# lines that carried the admin chain over a foreign-function seam. The other, the per-call log, has
# its bytes replayed through the leg here and its engine still standing; the line that retires it
# takes this cost the rest of the way down.
[[gate.ceiling_raises]]
key = "cell.busbar.api.count"
file = "qa/kind-isolation.toml"
by = 15
because = "the kernel-held record leg's STORE REACH: the root binds `busbar_api::Store` and maps the operation a plane spelled onto the store verb that performs it (PlaneRecord, PlaneSelector, PlaneDisposition, StoreError), plus the frozen-bytes fixture store the boot-verify golden replays the persisted chains through. A plane may not hold a store and a unit may not know a schema, so this mapping belongs to the composition and to nothing else."

[[gate.ceiling_raises]]
key = "cell.busbar.control.count"
file = "qa/kind-isolation.toml"
by = 9
because = "the admin mutation log's record declaration, named by the composition that mounts it: `busbar_plane_admin::records` (the schema, its two operations, the suffix its five fields frame to, and the previous release's flat row), plus the scope constant `admin` that the frozen boot-verify fixtures were persisted under and still carry inside their own bytes."

[[gate.ceiling_raises]]
key = "cell.busbar.kernel.count"
file = "qa/kind-isolation.toml"
by = 3
because = "the ONE runner of a record leg: `busbar_kernel::pump::{run_record_leg, RecordSchemas, RecordStore, RecordKey, RecordAnswer, RecordRefusal}`. The three checks a leg is admitted by — the schema is declared, the operation is within it, the body is within the record ceiling — are made in the one place a leg is run, and the root calls onto that rather than repeating them."

[[gate.ceiling_raises]]
key = "cell.busbar.plane.count"
file = "qa/kind-isolation.toml"
by = 17
because = "the call log's record declaration, named by the composition that mounts it: `busbar_plane_mcp::records` (the call schema, its append-and-scan operation table, and the seven-field length-prefixed suffix its record frames to), plus the boot-verify golden that replays that plane's frozen persisted chain through the leg."

[[gate.ceiling_raises]]
key = "cell.busbar.unit.count"
file = "qa/kind-isolation.toml"
by = 8
because = "the audit unit's chain, named by the composition that drives it: `busbar_unit_audit::legacy::{Chain, ChainedRecord, ChainBreak, ChainLabels, Digest, Framing, frame_prelude, verify_chain}`. The prelude, the digest, the sequence authority and the verifier are the unit's and are not re-implemented here; what the root adds is the position it holds and the store it lands on."

# THE PER-CALL RECORD ON THE SAME LEG, and the battery that proves the writer is REACHED, moved to
# the one kind that may name both halves. `crates/busbar/src/root/call_stream.rs` mounts the MCP
# plane's per-call record on the kernel-held record leg — the plane declares the record and keeps the
# ONE chokepoint every call is written through, and the root lands it, because a plane performs no
# output. `crates/busbar/src/root/tests/call_record_dlopen.rs` is the MOVE: a real `tools/call`,
# through the real dispatcher, into a real `dlopen`ed store plugin, the handle closed and reopened
# and the rows read back. It had to name BOTH the plane and the root's persister, and a plane crate
# may not name the persister, so it came here — the landed precedent for a battery that must name two
# halves. Nothing about the proof moved with it and no assertion was weakened; the two seams it used
# to reach the engine's own call log through are gone, and it now drives the leg the deployment does.
# The measured cost is below. Six busbar-mcp and busbar-core cells FALL in the same landing and are
# re-pinned to the measurement; `busbar-mcp × store` alone falls 57 -> 37.
[[gate.ceiling_raises]]
key = "cell.busbar.api.count"
file = "qa/kind-isolation.toml"
by = 3
because = "the per-call record's store reach, in the root, and the battery's read-back: `busbar_api::Store` as the handle the leg is bound to and the handle a reopened plugin is read through, and `busbar_api::PlaneSelector` as the parent selector one caller's chain is listed by. A plane may not hold a store, so the mapping from a record to a store verb belongs to the composition and to nothing else."

[[gate.ceiling_raises]]
key = "cell.busbar.plane.count"
file = "qa/kind-isolation.toml"
by = 83
because = "the MOVE of the per-call record's dlopen battery into the composition root, plus the mount that installs the durable path behind the plane's chokepoint. The battery drives the MCP plane's real dispatcher and reads the MCP plane's own record type back out, so every name it spells is a plane name; it spelled them in the plane crate before this landing and spells them here now, and `busbar-mcp × plane` falls 3345 -> 3298 against it. The mount names `busbar_plane_mcp::records` (the call schema, its append/scan table, the seven-field length-prefixed suffix) and `busbar_mcp::mcp::callrecord` (the chokepoint's sink trait and its restore narrator), which is the composition root naming what it mounts."

[[gate.ceiling_raises]]
key = "cell.busbar.plugin-tooling.count"
file = "qa/kind-isolation.toml"
by = 3
because = "the MOVE: the battery loads the REAL store plugin over the REAL plugin C ABI (`busbar_plugin_loader::{load_store, plugin_library_filename}`) rather than against an in-process double, because the defect it exists to catch — an ABI that carried four store methods and discarded every write — is invisible to any double. `busbar-mcp × plugin-tooling` falls 7 -> 4 against it."

[[gate.ceiling_raises]]
key = "cell.busbar.store.count"
file = "qa/kind-isolation.toml"
by = 23
because = "the MOVE: the battery's whole subject is a store — the example store plugin's cdylib, its durable-path config, the `dlopen` that opens it, the second `dlopen` that reopens it after the handle is dropped (which is what a restart is), and the on-disk ledger it prints as evidence — plus the one name the mount spells, the store handle the leg is bound to. `busbar-mcp × store` falls 57 -> 37 against it, which is the same coverage measured in the home that may hold it."

[[gate.ceiling_raises]]
key = "cell.busbar.unit.count"
file = "qa/kind-isolation.toml"
by = 2
because = "the audit unit's framing declaration, named by the composition that binds the per-call leg to it: `busbar_unit_audit::legacy::Framing` and the length-prefixed variant the already-persisted call records were sealed under. The framing arrives from the composition rather than being chosen in the leg because it is a wire fact of the rows already on disk — a stream whose framing moved would report every deployed chain as tampered at its next boot."

# THE ADMIN MUTATION LOG, mounted on the record leg, and the SECOND COPY OF IT deleted from the
# engine. `crates/busbar-core/src/plane/auditlog.rs` (787 lines) and its battery (588) go; what
# replaces them is `crates/busbar/src/root/audit_stream.rs` and its cells, which build the durable
# path the engine's one chokepoint records through and hand it over at hydration. Five busbar-core
# cells FALL in the same landing and are re-pinned to the measurement; the three that rise below are
# the composition the fall paid for.
[[gate.ceiling_raises]]
key = "cell.busbar.api.count"
file = "qa/kind-isolation.toml"
by = 14
because = "the admin mutation log's store reach, in the root: the copy-forward that carries the previous release's audit table onto the record leg reads and writes the published store protocol directly (list_audit, append_plane_record, list_plane_records, PlaneRecord, PlaneSelector, PlaneDisposition), plus the fixture store its cells drive that copy-forward through. It is 1375 busbar-core lines lighter for it."

[[gate.ceiling_raises]]
key = "cell.busbar.control.count"
file = "qa/kind-isolation.toml"
by = 28
because = "the admin mutation log's record, named by the composition that mounts it: the schema, the five-field suffix, the previous release's flat row and the log's single scope, plus the cell that pins the leg's framing byte-identical to the ring's own digest and the three that pin the copy-forward as a copy rather than a re-seal. The record declaration is the admin plane's; what is named here is the mounting of it."

[[gate.ceiling_raises]]
key = "cell.busbar.unit.count"
file = "qa/kind-isolation.toml"
by = 4
because = "the audit unit's own record and window verifier, named by the root that now hands them over: busbar_unit_audit::legacy::{AuditEntry, DurableSeam, verify_window, digest}. The ring, the digest and the verifier stay the unit's; the root supplies the durable path and the tail to seed from, which is the half the unit has no way to reach."

# The surface ceilings from ARCHITECTURE.md section 1.1: what a PLUGIN AUTHOR has to read. These are
# owner decisions, not ratchets that drift upward with the tree — the gate reads them
# from here (rather than a literal in the rule table) purely so --selftest can also produce
# a green baseline value for a scratch copy; the checked-in numbers below never move except by the
# owner's own hand.
[gate.surface_ceilings]
contract_caps = 3580
grammar = 388
contract_transport = 845

# ── 1. one-attempt-seam ──────────────────────────────────────────────────────────────────────────
[rules.one-attempt-seam]
why = """Exactly one function in the workspace may send the egress request for a unit. Two twins \
(the pooled hot path and the degraded walk path) mean every fix to the attempt — a timeout arm, a \
breaker recording, a header rule — has to be made twice and is made once. The architecture's loop \
has one ROUTE step and one dispatch; the code should have one too."""
# The egress client's send verb: the call that turns an assembled request into an upstream
# round trip. Every occurrence in non-test code outside `allowed_function` is a finding.
send_verb = '\.client\(\)\.get\(\)\.request\('
# The seam moved from the pooled hot loop to `engine/attempt/mod.rs::attempt` when the degraded
# walk twin was deleted; the hot loop now calls `attempt()` too, so no extra site remains.
allowed_function = "attempt"
max_extra_sites = 0

# ── 2. request-path-fn-size ──────────────────────────────────────────────────────────────────────
[rules.request-path-fn-size]
why = """A function on the request path that runs to four figures of lines cannot be read whole, \
tested at its seams, or diffed with confidence. The loop is eight named steps; a function should \
be one of them, not all of them."""
files = [
  "crates/busbar-llm/src/engine/pipeline.rs",
  "crates/busbar-llm/src/engine/attempt/mod.rs",
  "crates/busbar-llm/src/engine/attempt/assemble.rs",
  "crates/busbar-llm/src/engine/attempt/send.rs",
  "crates/busbar-llm/src/engine/attempt/classify.rs",
  "crates/busbar-llm/src/engine/attempt/respond.rs",
  "crates/busbar-llm/src/engine/attempt/buffered.rs",
  "crates/busbar-llm/src/engine/exhaustion/mod.rs",
  "crates/busbar-llm/src/engine/exhaustion/queue.rs",
  "crates/busbar-llm/src/engine/exhaustion/fallback.rs",
  "crates/busbar-llm/src/engine/exhaustion/least_bad.rs",
  "crates/busbar-llm/src/native_ingress.rs",
  "crates/busbar-llm/src/arrival.rs",
  "crates/busbar-core/src/ingress/mod.rs",
  "crates/busbar-core/src/limits/admission.rs",
]
max_lines = 200
# How many of the worst offenders the report lists.
top = 10

# ── 3. ports-only / ports-only-tests ─────────────────────────────────────────────────────────────
[rules.ports-only]
why = """A plane crate talks to the kernel through the substrate/api ABI only. Every `busbar_core::` \
it names is a hole in that wall: the plane cannot be compiled out, cannot be replaced by a plugin, \
and breaks whenever core moves. This is the production residue, counted per crate."""
needle = "busbar_core::"
[rules.ports-only.max_per_crate]
busbar-llm = 0
busbar-mcp = 0
busbar-a2a = 0
busbar-voice = 0

[rules.ports-only-tests]
why = """The same reach from test code. Tests that name core internals pin the plane to core's \
private shape just as surely as production code does; they are reported separately so both \
counts can trend to zero at their own pace."""
[rules.ports-only-tests.max_per_crate]
busbar-llm = 20
busbar-mcp = 1
busbar-a2a = 3
busbar-voice = 0

# ── 4. no-uninstalled-seam ───────────────────────────────────────────────────────────────────────
[rules.no-uninstalled-seam]
why = """An installable seam (a substrate `install_*` / `set_*_factory` that fills a process-wide \
static) is a promise that boot fills it. A seam only the test kit installs is a seam production \
never fills — the stream-translator factory fault that made real streams pass through \
untranslated while every test was green."""
# BOTH HALVES of the substrate. The value families split into `busbar-substrate-values` so a plane's
# closure resolves no hyper/reqwest/tokio edge, and `install_protocols`,
# `install_stream_translator_factory` and `install_diagnostics` all went with them — the second root
# is what keeps this rule reading the seams the fault it exists for actually lived in.
seam_root = ["crates/busbar-substrate/src", "crates/busbar-substrate-values/src"]
seam_name_pattern = '^(install_[a-z0-9_]+|set_[a-z0-9_]+_factory)$'
# A file whose path contains one of these is NOT production and cannot count as an installer.
non_production_path_fragments = ["testkit", "test_support", "plugin-testkit", "fixtures.rs"]
# A seam DEFINED under the substrate's own test kit is a fixture install hook, never a production
# promise, so it is not counted at all.
exempt_seam_path_fragments = ["/testkit/", "/testkit.rs"]
max_uninstalled = 0

# ── 5. neutral-no-dialect ────────────────────────────────────────────────────────────────────────
[rules.neutral-no-dialect]
why = """The neutral crates (busbar-core, busbar-substrate, busbar-api) must not know a dialect or \
a plane by name. This rule is a thin delegation to `cargo xtask gate plane-purity`, which owns the \
scanner, the noun list and the frozen-wire allow-list; the construction gate only counts its \
DIALECT and KEY rows so there is one policy, not two."""
categories = ["DIALECT", "KEY"]
max_hits = 0

# ── 6. single-terminal ───────────────────────────────────────────────────────────────────────────
[rules.single-terminal]
why = """The request terminal is where a unit's end is sealed and posted once. Every extra caller \
is a second place the money can be counted, or not counted. The named wrappers are the only \
doors; anything else calling the terminal is a finding."""
terminal = "finish_inner"
allowed_callers = ["finish", "finish_admitted", "finish_rejected"]
max_extra_sites = 0

# ── 7. duplicate-dispatch (informational) ────────────────────────────────────────────────────────
[rules.duplicate-dispatch]
why = """How much of the two attempt twins is the same code. Informational (a WARN row, never a \
FAIL) until the twins are merged; then it becomes moot and the rule can be retired."""
informational = true
twins = ["forward_with_pool_parsed_inner", "forward_once"]
# A shared block must span at least this many source lines to be reported.
min_block_lines = 40
# Token-shingle width for the cheap similarity pass.
shingle_tokens = 12
top_pairs = 5
# Ceiling on total duplicated lines. Informational: shown in --summary, never enforced.
max_duplicated_lines = 0

# ── 8. token-sealed ──────────────────────────────────────────────────────────────────────────────
[rules.token-sealed]
why = """The Teller's decision, hold and posting tokens are what make the loop's order a matter of \
types rather than discipline: a step can only be answered with that step's token, a hold can only \
be opened by Admit, a posting can only be minted after Audit. Every one of those constructors takes \
a token, so a unit spelling Decision::proceed or Hold::open with its own token is the design working; \
the forgery surface is MINTING a token. That holds exactly as long as nothing outside the kernel can \
spell a token constructor. Every such spelling elsewhere is a forged token."""
patterns = ["UnitToken::mint(", "LedgerToken::mint(", "UsageToken::mint(", "AuditToken::mint(", "ExitToken::mint("]
allowed_root = "crates/busbar-kernel/src"
max_sites = 0
# Two more of the same shape, scoped to busbar-kernel (not busbar-substrate/src/teller, which is
# the pre-busbar-kernel path the `patterns` list above still ratchets against): `KernelSeal::
# acquire_for_kernel(` mints the one seal every token constructor needs, and the unit crates'
# OWN test modules call it directly to build sealed tokens for their tests (mirroring
# busbar-caps/src/tests.rs) -- allowed there because production_only test-classification already
# excludes them, never allowed from a unit's production src. `AdmitToken::mint(` is the in-flight
# table's arrival-hold constructor; `Kernel::admit_token()` (busbar-kernel/src/teller.rs) is its one
# named seam, so the mint itself should never be spelled anywhere else -- it is scanned only by the
# admit-token-mint sub-rule below, not by the `patterns` list above, so each seal-site symbol has
# exactly one scanner.
kernel_seal_pattern = 'KernelSeal::acquire_for_kernel\('
admit_token_mint_pattern = 'AdmitToken::mint\('
kernel_root = "crates/busbar-kernel/src"
max_kernel_seal_sites = 0
max_admit_token_mint_sites = 0

# ── 9. teller-step-order ─────────────────────────────────────────────────────────────────────────
[rules.teller-step-order]
why = """The loop is nine named steps in one fixed order, written once. The loop file is read as \
the loop plus the helpers it calls (the opener is synchronous, the runner is async), and the steps \
must appear once each in the canonical order; the session opener runs exactly the steps up to the \
door. Exactly one loop function may exist."""
file = "crates/busbar-substrate/src/teller/run.rs"
loop_function = "run_unit"
opener_function = "open_unit"
door_step = "admit"
steps = ["arrival", "decode", "authenticate", "verify", "approve", "admit", "route", "meter", "audit"]
max_findings = 0

# ── 10. one-teller-loop ──────────────────────────────────────────────────────────────────────────
[rules.one-teller-loop]
why = """Each plane enters the loop from one place, so a unit cannot be run twice or half-run. The \
legacy adapter (`run_gauntlet`) is the coexistence shim the planes migrate off one at a time; its \
call-site count is a ratchet the owner drives to zero and never loosens."""
loop_verb = "run_unit"
loop_root = "crates/busbar-substrate/src/teller"
max_callers_per_plane_crate = 1
legacy_verb = "run_gauntlet"
# Today: the LLM, MCP and A2A planes plus the host-seam adapter body. Down to 0 when the planes move.
max_legacy_sites = 4

# ── 11. no-response-escapes-audit ────────────────────────────────────────────────────────────────
[rules.no-response-escapes-audit]
why = """A plane's step files decide; only its Audit step answers. A function under the plane's \
step directory that returns a `Response` from anywhere but `audit.rs` is a way for a unit to end \
without being posted — the exact hole the loop exists to close."""
root = "crates/busbar-llm/src/unit"
allowed_files = ["audit.rs"]
max_escapes = 0

# ── 12. terminal-doors-in-audit-step ─────────────────────────────────────────────────────────────
[rules.terminal-doors-in-audit-step]
why = """The terminal doors (`finish_admitted` / `finish_rejected`) seal and post a unit. In the \
rebuilt plane they are called from its Audit step and nowhere else, so every unit is posted exactly \
once by the one step whose job that is. Red by design until that step exists: every call from the \
legacy ingress is a site the rebuild must move."""
crate = "busbar-llm"
doors = ["finish_admitted", "finish_rejected"]
allowed_file = "crates/busbar-llm/src/unit/audit.rs"
max_extra_sites = 0

# ── 13. one-pick-site ────────────────────────────────────────────────────────────────────────────
[rules.one-pick-site]
why = """The lane pick has two legitimate callers: the Route loop and the fallback-pool re-entry. \
A third is a second selection policy growing beside the first."""
verb = "pick_among"
max_sites = 2

# ── 14. loc-ceilings (ARCHITECTURE.md section 1.1) ─────────────────────────────────────────────────────────
[rules.loc-ceilings]
why = """The kernel stays small by construction, not by promise. section 1.1 gives one union ceiling, one \
per-crate ceiling for busbar-caps + busbar-contract, one for the busbar-unit-* union (with a verbs \
sub-ceiling), and a NAMED per-file split of the kernel's own 8k. Counted BY CALL-GRAPH: a \
busbar-unit-* file the Teller loop reaches WITHOUT crossing a sealed unit-trait boundary spends \
kernel budget even though it lives in another crate — a kernel that stayed nominally small by \
pushing its loop body into an unsealed helper file next door would still be measured honestly here. \
The call-graph step is a CONSERVATIVE NAME-MATCH approximation, not a true call graph: it collects \
every identifier called directly from `teller_files` and counts any busbar-unit-* file that defines \
a same-named function, whether or not that call is actually reaching it (a same-named unrelated \
helper is over-counted, never under-counted) and without knowing whether the call crosses a sealed \
trait object (which the real rule says should NOT count). This is stated honestly so the number is \
read as "at most this many files could be in scope", not as a precise call graph. Counts SURFACE \
lines only (owner decision): non-blank, non-comment lines under src/, excluding #[cfg(test)] module \
bodies and src/tests/** -- a proof table, fixture or data table moved into a test-classified path is \
a proof, not surface, and does not spend the ceiling. A separate, purpose-built \
`surface-ceiling:contract+caps` row (scripts/loc-surface.py, another in-flight change) applies the \
identical counting rule to busbar-caps + busbar-contract once their proof tables move out of src/; \
this rule's own `loc-ceilings:caps-contract` row is not that row and is not removed by it -- the two \
are expected to converge once the move lands, not to be reconciled here."""
kernel_crate = "busbar-kernel"
kernel_ceiling = 5382
caps_crate = "busbar-caps"
contract_crate = "busbar-contract"
caps_contract_ceiling = 3582
unit_crate_glob = "busbar-unit-*"
unit_total_ceiling = 15149
verbs_crate = "busbar-unit-verbs"
verbs_ceiling = 1428
union_ceiling = 24113
# Files (by basename, wherever they sit under busbar-kernel/src) whose bodies seed the call-graph
# name-match: every identifier called from one of these files, that busbar-kernel does not itself
# define, is looked up by name against every busbar-unit-* file.
teller_files = ["teller.rs"]

[rules.loc-ceilings.kernel_files.teller]
label = "Teller loop"
patterns = ["teller.rs"]
ceiling = 606

[rules.loc-ceilings.kernel_files.pump]
label = "pump/scheduler"
patterns = ["pump.rs"]
ceiling = 453

[rules.loc-ceilings.kernel_files.inflight]
label = "in-flight/sessions"
patterns = ["inflight.rs"]
ceiling = 564

[rules.loc-ceilings.kernel_files.recovery]
label = "recovery"
patterns = ["recovery.rs"]
ceiling = 177

[rules.loc-ceilings.kernel_files.slice]
label = "slice/lease"
patterns = ["slice.rs"]
ceiling = 397

[rules.loc-ceilings.kernel_files.registry]
label = "registry + generations"
patterns = ["registry.rs"]
ceiling = 313

[rules.loc-ceilings.kernel_files.grammars]
label = "grammars incl. JSON span scanner"
patterns = ["grammar.rs"]
ceiling = 61

[rules.loc-ceilings.kernel_files.ticks]
# The file is `tick.rs`, singular, and always was. `ticks.rs`, `drain.rs` and `fleet.rs` matched no
# file in the tree, so this row measured the empty set and reported 0/500 -- a ceiling nothing
# spends is a ceiling that has been abolished rather than met. The drain and the fleet sweep are
# not separate files: they are two of the three jobs inside tick.rs, and the label says so.
#
# The ceiling is today's measurement, not the abolished 500: a ratchet, so the first line that
# grows this file is the line that has to justify itself.
label = "tick: session tick, node tick and the drain sweep"
patterns = ["tick.rs"]
ceiling = 193

[rules.loc-ceilings.kernel_files.arena]
label = "arena/masking"
patterns = ["arena.rs", "masking.rs"]
ceiling = 178

# ── 15. manifest-allowlist (ARCHITECTURE.md section 1.2) ────────────────────────────────────────────────────
[rules.manifest-allowlist]
why = """Core → plugin, never plugin → core. A plugin-kind crate (plane, store, auth, hook, export, \
secret) may name `busbar-contract` and the closed grammar it is written on (`busbar-grammar`) freely; \
every other workspace crate it names is either an \
automatic RED (busbar-kernel, busbar-caps, a busbar-unit-*, another plane, a transport — the \
coupling the ABI exists to prevent, and no allow-list can excuse it) or must be on the reviewed \
list below, named once with its reason. Parsed out of every SHIPPED dependency table each crate \
declares — `[dependencies]`, `[build-dependencies]` and the per-target forms of both, with \
`package = "…"` and workspace renames resolved — through the one manifest reader (xtask \
`manifest::shipped_dep_names`). It read `[dependencies]` alone until 2026-09-09, on the stated \
ground that the other tables "never ship in the plugin binary": a `[target.'cfg(unix)'.dependencies]` \
entry ships in every Linux artifact this tree builds, and a red-team pass carried a whole plane into \
a transport through that table with every gate green. `[dev-dependencies]` is still out — a test \
edge is not a shipped edge, and it is scored on `kind-isolation:test-deps` instead of here. \
`cargo metadata` is \
consulted when present to widen the same check to transitive path/workspace deps, and skipped \
(noted, not failed) when cargo is unavailable, keeping this gate cargo-optional."""
# Every dependency a plugin-kind crate may name beyond busbar-contract, with the review recorded in
# the commit that added it: busbar-api / busbar-plugin-sdk are the 1.5.5-era loader ABI every
# example plugin still bridges through until it moves onto busbar-contract; busbar-grammar is the
# closed JSON span grammar the contract itself is written on and re-exports as `spans`, so naming it
# directly is naming a piece of the contract rather than reaching past it; the rest are ordinary
# third-party crates.
reviewed_allowlist = ["busbar-api", "busbar-plugin-sdk", "serde", "serde_json", "tracing", "async-trait", "bytes", "sonic-rs", "busbar-llm-codec", "busbar-mcp-codec", "busbar-a2a-codec", "busbar-voice-codec", "busbar-grammar"]
# busbar-llm-codec: the pure codec half of the split llm crate (no I/O in its closure); the plane adapts it.
# Per-crate additions beyond the global list above, each a one-line review.
[rules.manifest-allowlist.reviewed_extra]
# RETIRED 2026-09-08: store-example-plugin named busbar-store-memory, a sibling instance of its own
# kind, which PLUGIN-TREE.md §4 forbids without exception. The waiver is gone because the dependency
# is: the example now carries its own in-process backend (crates/store-example-plugin/src/ram.rs).
# Ratchet, NOT a review: each busbar-plane-* adapter names its own dialect's legacy engine crate
# (busbar-llm/-mcp/-a2a/-voice) for codecs only, read-only, no engine state crossing back — but
# those engine crates are ALSO named in gate.plane_crates, so this is structurally the exact "a
# plane names another plane" coupling section 1.2 forbids. Tracked here, not waved through, until
# docs/design/1.6.0-protocols-as-plugins.md's codec split lands and the dependency disappears.
# STALE — verified 2026-09-07: NONE of the four edges below exists at this commit. Every plane crate
# is exactly `busbar-contract` + its own codec and nothing else; the planes are the cleanest seam in
# the workspace. This ratchet describes a tree that no longer exists and tells a reader the coupling
# is still there. Delete it (PLUGIN-TREE.md section 9) — noted here, not done here, because a rule
# change is not this commit's business.
#
# REVIEWED 2026-09-09, and it is the first dependency this rule could see: the manifest reader read
# `[dependencies]` and nothing else, so a `[target.'cfg(unix)'.dependencies]` entry was invisible to
# it — and `cfg(unix)` is true on every runner and every shipped Linux artifact this tree builds, so
# what the narrowing excluded was a dependency that ships. `libc` here is the advisory whole-file
# `flock` FileStore takes around its read-modify-write (crates/store-example-plugin/src/lib.rs,
# FileLock), unix-only, in the fixture that models a fleet sharing one durable path.
store-example-plugin = ["libc"]
[rules.manifest-allowlist.known_red_deps]
busbar-plane-llm = ["busbar-llm"]
busbar-plane-a2a = ["busbar-a2a"]
busbar-plane-mcp = ["busbar-mcp"]
busbar-plane-voice = ["busbar-voice"]

# ── 16. source-denylist (ARCHITECTURE.md section 1.2) ───────────────────────────────────────────────────────
[rules.source-denylist]
why = """The pure kinds (plane, hook, pure auth, egress-auth-scheme) do no I/O by construction: no \
socket, no file, no process, no OS handle, no environment read, no HTTP client. A plugin that opens \
one of these itself is a plugin the deadline/blocking-pool machinery around the I/O kinds was never \
built to bound. The allow-list is empty at hour 0, same as section 1.2 says; every entry added later names \
the exact crate and pattern reviewed."""
patterns = [
  'std::net', 'std::fs', 'std::process', 'std::os', 'std::env',
  'tokio::net', 'tokio::fs', 'tokio::process',
  'async_std', 'libc', 'reqwest', 'hyper',
]
# kinds scanned: plane, hook, pure_auth, egress_auth (gate.plugin_kinds); store/secret/export are
# I/O kinds and are out of scope for this rule by design (section 1.2 exempts them).
kinds = ["plane", "hook", "pure_auth", "egress_auth"]
# Reviewed exceptions: crate -> list of patterns from above accepted for that crate, with the reason
# living in the commit that added it. Empty at hour 0.
[rules.source-denylist.allowlist]

# ── 17. lean-core (ARCHITECTURE.md section 1.3) ─────────────────────────────────────────────────────────────
[rules.lean-core]
why = """The kernel and the unit crates have no closed enum a plugin could need to extend, and no \
open-vocabulary word of their own: every dialect name and plane key is a runtime registration, never \
a literal a kernel or unit file compares against. This mechanically checks every string literal in \
busbar-kernel and busbar-unit-* against section 1.3's own pinned word list plus the dialect names it names \
by name in section 6 — the exact list the architecture text gives, not a guess at "the union of all \
registered keys" (that union only exists at runtime; approximating it with the pinned list is what \
the design's own doc-scan already does, so this rule reuses it rather than inventing a second one). \
A literal used in an `if kind == …` or `match` arm is still a string literal and is caught the same \
way."""
crates_kernel = ["busbar-kernel"]
crate_glob = "busbar-unit-*"
# section 6's dialect names + the section 1.3 pinned word list, verbatim.
words = [
  "anthropic", "openai", "responses", "gemini", "bedrock", "cohere", "mcp", "a2a", "voice",
  "chat", "completion", "prompt", "assistant", "agent", "realtime", "speech", "transcribe",
  "audio", "image", "embedding", "model", "tool call", "sampling", "mail", "message queue",
  "tunnel",
]
# Ratchet, not zero: busbar-unit-auth's carrier-detection ladder and busbar-unit-egress-auth's
# per-scheme header decoration both name vendor headers/paths literally today (a real section 1.3 gap
# this rule's first run found, not something this gate may edit — the fix is a registry lookup in
# the unit crate, tracked as debt). Tightens to 0 once that lands.
max_hits = 21

# ── 18. no-default-bodies (ARCHITECTURE.md section 3.7) ─────────────────────────────────────────────────────
[rules.no-default-bodies]
why = """A kind trait with a default method body is a place a plugin's behaviour was decided for it \
without the plugin's author ever writing a line — the opposite of "every trait method implemented". \
Every method on every kind trait below must be bodiless (`;`), so implementing the trait is the only \
way to answer it."""
file = "crates/busbar-contract/src/kinds.rs"
plane_file = "crates/busbar-contract/src/plane.rs"
transport_file = "crates/busbar-contract/src/transport.rs"
traits = [
  "AuthScheme", "EgressAuthScheme", "Store", "Secret", "Hook", "Export", "Anchor",
  "Plane", "SessionPlane", "Transport", "VirtualKeyDirectory",
]
max_defaulted = 0

# ── 19. sealed-unit-traits (ARCHITECTURE.md section 3.7) ────────────────────────────────────────────────────
[rules.sealed-unit-traits]
why = """The trait a unit implements to be called by the Teller is sealed on a private supertrait, \
so no plugin crate can implement it and stand in for a unit the kernel itself must own. \
busbar-unit-breaker's `Breaker` trait does this today (`mod sealed { pub trait Sealed {} }`, \
`pub trait Breaker: sealed::Sealed`); this rule requires the same shape of every unit's own \
kernel-facing trait as each is written. NOT every `pub trait` in a busbar-unit-* crate is one of \
these — most are internal ports (a header reader, a journal sink) a unit crate defines to keep its \
own tests fast, never the thing a plugin would implement to BE the unit — so the check is scoped to \
the explicit list below, maintained by the owner as each unit's sealed shape lands."""
# Ratchet: Admission is not sealed yet (tracked debt); Breaker is. Tightens to 0 when Admission is
# sealed too.
max_unsealed = 1
# crate, trait, file (relative to repo root) — the unit's own kernel-facing trait.
[rules.sealed-unit-traits.traits.admission]
crate = "busbar-unit-admission"
file = "crates/busbar-unit-admission/src/lib.rs"
trait = "Admission"

[rules.sealed-unit-traits.traits.breaker]
crate = "busbar-unit-breaker"
file = "crates/busbar-unit-breaker/src/lib.rs"
trait = "Breaker"

[rules.sealed-unit-traits.traits.audit]
crate = "busbar-unit-audit"
file = "crates/busbar-unit-audit/src/record.rs"
trait = "Audit"

# ── 20. hold-discipline (ARCHITECTURE.md section 3.7 / section 8.3) ────────────────────────────────────────────────
[rules.hold-discipline]
why = """Every path takes its Hold exactly once and every path that takes one actually settles it. \
Five mechanical proxies for that, each a pattern match over busbar-kernel and busbar-unit-* \
production code, each reported only where its subject exists (a crate that has none of the pattern \
yet is a vacuous PASS, not a lie): no `?` or early `return` between a HoldCell take and its settle; \
no identifier typed `Hold` closed over by a `catch_unwind` closure; no `JoinHandle::abort`; no \
`mem::forget`/`drop(...)` of a value whose name says it is a hold; and a cancellation-token check \
before every `.await` inside the route step, wherever the route step is async."""
scope_crates_kernel = ["busbar-kernel"]
scope_crate_glob = "busbar-unit-*"
take_pattern = '\.take\('
settle_pattern = '::settle\(|\.settle\('
catch_unwind_pattern = 'catch_unwind'
hold_word = "Hold"
abort_pattern = '\.abort\('
forget_or_drop_pattern = '(?:mem::forget|drop)\(\s*&?\s*[A-Za-z_][A-Za-z0-9_]*[Hh]old[A-Za-z0-9_]*'
route_step_functions = ["route"]
cancel_check_pattern = 'is_cancelled|cancellation'
max_early_exit = 0
max_catch_unwind_capture = 0
max_join_abort = 0
max_forget_or_drop = 0
max_uncancellable_await = 0

# ── 21. forbid-unsafe (ARCHITECTURE.md section 1.2) ─────────────────────────────────────────────────────────
[rules.kernel-seal-impls]
why = """`busbar_contract::plugin::KernelSeal` is what every kernel-built view the contract declares \
takes to be constructed: a verified destination, the unit a plane reads, a one-shot secret, a \
transport key handle. It has to be a public trait, because busbar-caps implements it on every token \
and sits ABOVE the contract, and Rust cannot say "implementable by exactly one other crate". So the \
type system does not close it and this scan does: outside busbar-caps, an in-tree crate that \
implements this trait can mint its own kernel evidence, and it does not need a token, a kernel or a \
review to do it. Scanned INCLUDING test code on purpose -- every site this rule found on the day it \
was written was in a test module, so a production-only reading of it would be vacuous by \
construction and would prove nothing. This is the in-tree half only: an out-of-tree plugin can still \
implement the trait, and per the trust policy a loaded plugin is trusted code, so that is not a line \
this rule pretends to draw."""
pattern = 'impl(<[^>]*>)?\s+(busbar_contract::)?(plugin::)?KernelSeal\s+for'
allowed_root = "crates/busbar-caps/src"
max_sites = 0
# Ratchet, NOT a review: each file below forges a seal today with a private type, and each is owned
# by a change that is not this one. A new site anywhere else is held to the rule immediately.
# busbar-plane-admin and busbar-plane-voice are the awkward two: a PLANE crate may not name
# busbar-caps at all (section 1.2, and manifest-allowlist makes it an automatic RED), so their test
# seals cannot move onto a token until the contract offers a seal a plane is allowed to name. That is
# debt this rule now PINS rather than debt it hides.
known_sites = [
  "crates/busbar-plane-admin/src/tests/mod.rs",
  "crates/busbar-plane-voice/src/tests/harness.rs",
  "crates/busbar-transport-grpc/src/tests/battery.rs",
  "crates/busbar-transport-http/src/tests/mod.rs",
  "crates/busbar-transport-stdio/src/tests/battery.rs",
  "crates/busbar-transport-tcp/src/tests.rs",
  "crates/busbar-transport-tls/src/tests.rs",
  "crates/busbar-transport-ws/src/tests/battery.rs",
  "crates/busbar-transport-ws/src/transport.rs",
  "crates/busbar-unit-egress/src/tests/harness.rs",
]

# ── 22. forbid-unsafe ────────────────────────────────────────────────────────────────────────────
[rules.forbid-unsafe]
why = """Plane, hook, pure-auth, egress-auth and secret crates carry `#![forbid(unsafe_code)]` — a \
lint level nothing inside the crate can locally override, matching that these kinds are structurally \
barred from unsafe by design, not merely asked nicely. Transport, ABI, loader, store and export \
crates carry at least `#![deny(unsafe_code)]` (weaker: a reviewed site may locally `#[allow]` it), \
because these kinds legitimately touch FFI or the wire. This checks the attribute is present at the \
crate root — not that every individual unsafe site is itself reviewed, which is a finer-grained \
check left to `cargo xtask gate blocking-ffi`-style tooling outside this gate."""
forbid_kinds = ["plane", "hook", "pure_auth", "egress_auth", "secret"]
deny_kinds = ["transport", "abi", "loader", "store", "export"]
# Ratchet: crates known to be missing the attribute today, so the gate does not go red the moment
# this rule is born. Each is real debt the owner closes by adding the attribute and deleting the
# name below; a new crate NOT on this list is held to the rule immediately.
known_missing_forbid = [
  "hook-test-plugin", "hooks-ranking", "auth-static-plugin", "auth-admin-tokens",
  "secret-example-plugin", "secret-ref",
]
known_missing_deny = [ "plugin-loader",
  "store-memory", "store-example-plugin", "export-example-plugin",
]

# ── 22. secret-carrier-debug (ARCHITECTURE.md section 3.7) ───────────────────────────────────────────────────
[rules.secret-carrier-debug]
why = """A value that carries secret bytes must hand-roll its `Debug` so the bytes cannot be printed \
— never derive one. On the plugin ABI this is not a matter of caller discipline: every auth scheme \
in the tree and out of it is handed a `Credential`, and the code that might format it is code this \
repository cannot read. The carriers below are the named ones; adding a type that holds a resolved \
secret, a client credential or key material means adding it here and writing the impl."""
carriers = ["Credential", "SecretValue", "CredentialSecret", "KeyMaterial", "UpstreamAddress", "SecretOnce", "LaneInput"]
max_derived = 0

# ── 23. no-escaped-newline-doc-comment ──────────────────────────────────────────────────────────────
[rules.no-escaped-newline-doc-comment]
why = """A relocation script that moves a test module into its own file can turn the doc comment's
intended line breaks into the literal two characters backslash-n, which then sits on one physical
line right before the next `//!`/`///` prefix instead of starting a new one. rustdoc renders it as
inert text mid-sentence and no compiler warning catches it, so it survives until someone reads the
generated docs. The ceiling is zero and is never calibrated upward: this is a class of typo, not a
figure the tree is allowed to carry any of."""
max_hits = 0

# ── 24. hold-escapes (ARCHITECTURE.md section 3.5) ────────────────────────────────────────────────────────────
[rules.hold-escapes]
why = """Rust has no linear types, so "this value must be consumed by exactly this function" is not \
expressible: `std::mem::forget`, `ManuallyDrop`, `Box::leak` and an `AssertUnwindSafe` wrapper all \
compile, and a hold that goes away through one of them is a unit that was admitted and never \
settled — money that vanishes with no canary arithmetic to catch it, because the canary only ever \
sees the counts a settled unit leaves behind. busbar-caps writes the escape list down as data in \
its `fixtures/lint_rules.rs` and says in its own honesty table that CI scans for it; this rule is \
that scan. It reads the same symbols with the same scopes, over every crate's production sources \
rather than only the kernel's, because a plugin-side crate that leaks a hold loses exactly as much \
money as the kernel would. `hold-discipline` above is the narrower, shape-aware reading of the same \
promise over busbar-kernel and busbar-unit-*; this one is the flat symbol scan the honesty table \
names, workspace-wide."""
scan_globs = ["crates/*/src"]
max_sites = 0
# The reviewed sites. An entry is `path::function` (one function), a file path (one file), or a
# path ending in `/` (a directory). Every one of these was read before it was written down.
#
#   busbar-contract ids.rs `Registration::key` is THE reviewed leak-once intern: lane names,
#   op-class names and a loaded plugin's key are leaked once at boot, the allocation is fixed and
#   countable, and interning is idempotent — so "leaked once" is a property of the interner rather
#   than a hope. It is named by function, so the rest of the file is still held to the rule.
#
#   The plane-host, plugin-loader and plugin-sdk boundaries catch a panic crossing the ABI, which is
#   the design: a plugin that panics must not take the node with it, and no hold is in scope on
#   either side of those calls. busbar-core is the crate being emptied; its sites move or go with it.
#
#   The two remaining leaks are boot-time interners of the same shape as ids.rs.
#
#   scope.rs `reclaim_all` is the arena's per-entry reclaim boundary, named by function so the rest
#   of the file is still held to the rule. Reclaiming runs code the arena does not own — a closer
#   that kills a subprocess, a guard's real `Drop` — and the loop is reached from `Drop`, so an
#   unbounded panic there both strands every entry after it (leaking exactly what the arena exists to
#   reclaim) and, unwinding out of a drop already running during an unwind, aborts the node. No hold
#   is in scope on either side of the call: the boundary wraps exactly one entry's reclaim, the entry
#   is already out of the registry and is consumed whichever way it ends, and the registry lock is
#   released before the loop starts.
#
#   handle_engine.rs `sweep` is the plane-callback boundary of the same family as the plane-host
#   ones above, named by function so the rest of the engine is still held to the rule. The retention
#   sweep is AMORTISED over submits, so the plane's `abandon` callback runs inside some OTHER
#   caller's `submit` — one whose row and genesis event are already durable and whose handle is not
#   yet installed. A panic escaping that callback would unwind through that submit and leave a
#   durable row no live handle answers for, which the next boot rehydrates as a handle nobody
#   accepted. No hold is in scope on either side of the call: the boundary wraps exactly the
#   callback invocation, the slot guard is held outside it, and both a `None` verdict and a
#   panicking one mean the same thing — this handle was not abandoned.
known_sites = [
  "crates/busbar-contract/src/ids.rs::key",
  "crates/busbar-core/src/plane_host/",
  "crates/busbar-core/src/plane/registry.rs",
  "crates/busbar-core/src/router.rs",
  "crates/busbar-substrate/src/plane/handle_engine.rs::sweep",
  "crates/busbar-substrate/src/plane_host/mod.rs",
  "crates/busbar-substrate/src/plane_host/scope.rs::reclaim_all",
  "crates/busbar-substrate-values/src/proto.rs",
  "crates/busbar-transport-ws/src/transport.rs",
  "crates/plugin-loader/src/",
  "crates/plugin-sdk/src/boundary.rs",
]

# The escape list, mirroring crates/busbar-caps/fixtures/lint_rules.rs HOLD_ESCAPES. A test in that
# crate asserts this table names every symbol the fixture does, and repeats the fixture's own
# `confined_to` spelling, so the two cannot drift apart.
#
# `confined_to` is that fixture's spelling of the scope, kept verbatim for the join. It is PROSE,
# not a matcher: as a bare substring test it also excuses `crates/other-kernel/src/tellerish.rs`, or
# any path anywhere in the tree that happens to contain those characters, which is the opposite of
# confining anything. `confined_to_paths` is the same scope resolved against this tree —
# crate-relative paths, matched as prefixes, so only the files actually named are excused. An empty
# `confined_to` (and an empty or absent `confined_to_paths`) means banned everywhere.
[rules.hold-escapes.symbols.forget]
symbol = "mem::forget"
confined_to = ""
because = "a forgotten hold is a unit that was admitted and never settled"

[rules.hold-escapes.symbols.manually-drop]
symbol = "ManuallyDrop"
confined_to = ""
because = "the same as forgetting, spelled differently"

[rules.hold-escapes.symbols.box-leak]
symbol = "Box::leak"
confined_to = ""
because = "a leaked hold never reaches the exit path"

[rules.hold-escapes.symbols.process-abort]
symbol = "process::abort"
confined_to = ""
because = "aborting skips every exit path at once; the node drains instead"

[rules.hold-escapes.symbols.assert-unwind-safe]
symbol = "AssertUnwindSafe"
confined_to = "kernel/src/teller"
# The Teller loop's two homes in this tree: the kernel's own teller.rs, and the substrate teller
# module that rules 12 and 13 above already treat as where the loop is entered.
confined_to_paths = ["crates/busbar-kernel/src/teller.rs", "crates/busbar-substrate/src/teller"]
because = "it is what lets a hold cross a catch_unwind; the loop needs it in exactly one place"

[rules.hold-escapes.symbols.join-abort]
symbol = "JoinHandle::abort"
confined_to = ""
because = "an aborted task loses its unit's end; the sweep is the second exit, not abort"

# ── 25. unit-no-wall-clock ───────────────────────────────────────────────────────────────────────
[rules.unit-no-wall-clock]
why = """A unit crate decides from the values it was handed, so replaying the same inputs gives the \
same answer. A unit that reads the wall or monotonic clock itself has an input nobody passed it: \
its decision stops being reproducible, a test of it becomes a race, and the same request replayed \
for an audit no longer yields the same record. Reading a clock is the composition root's job — the \
root reads it ONCE per arrival and hands the reading down, which is also what keeps two steps of \
one unit from landing in different seconds. Production code only: a test may read a clock to \
measure a test."""
# Where a unit crate's production code lives.
scope_globs = ["crates/busbar-unit-*/src/*"]
# The clock reads a unit crate may not perform.
forbidden = ["SystemTime::now", "Instant::now"]
# A helper that exists FOR the root, in a unit crate's directory, that nothing in the crate calls.
# Each entry is a whole file, exempt because it is the root's reading living next to the unit rather
# than a decision inside one. Adding to this list needs the same argument.
exempt_files = ["crates/busbar-unit-breaker/src/clock.rs"]
max_hits = 0

# ── 26. unit-no-finding-ids ──────────────────────────────────────────────────────────────────────
[rules.unit-no-finding-ids]
why = """A comment that cites a finding identifier or a bare document section number tells a reader \
nothing they can act on: the identifier resolves to an audit worksheet that is not in this tree, \
and the section number moves the next time the document is edited. The rule the code follows has to \
be stated in words, in the comment, so the comment survives the worksheet and the renumbering. RFC \
citations are exempt by construction — they are stable, externally resolvable documents — and only \
the identifier shapes below are searched for."""
scope_globs = ["crates/busbar-unit-*/src/*"]
# The shapes searched for, as regular expressions over the raw comment text.
patterns = ["PB-[0-9]", "CG-[0-9]", "ARCHITECTURE\\.md §"]
# The one crate whose occurrence is knowingly left in place, so the rule can hold the line on every
# other unit crate rather than waiting for that one citation to be rewritten. Emptying this list is
# the goal, and nothing may be added to it without the same argument.
exempt_crates = ["busbar-unit-ledger"]
max_hits = 0

# ── 27. seal-sites ───────────────────────────────────────────────────────────────────────────────
[rules.seal-sites]
why = """busbar-caps writes down two lists of rules the compiler cannot carry: the hold escapes, \
scanned above, and the seal sites -- the symbols that decide who may build a capability at all. \
Its honesty table said CI scanned for both. It scanned for one. The three seal-site symbols are \
the seal every token constructor needs, the recovery token that materialises a hold from a journal \
record with no admission behind it, and the take that empties a hold cell; each is a crate boundary \
Rust cannot police, so each is one audited name and this is the scan that audits it. Same shape as \
hold-escapes and the same code path: literal substrings, `confined_to` scoping, one reviewed \
known_sites ratchet, over production sources only."""
scan_globs = ["crates/*/src"]
max_sites = 0
# The reviewed sites, each read before it was written down.
#
#   busbar-caps is the crate that DECLARES these capabilities: its own token, hold and unit-end
#   modules necessarily spell their names, and its module documentation shows a kernel acquiring
#   the seal so a reader can see what the sealed constructors are for. Declaring a capability is
#   not minting one; what the rule is about is who may CALL these outside their one home.
#
#   The composition root (crates/busbar/src/root/) is where the process assembles its one kernel,
#   so it is the second place that legitimately holds a seal: durability, the ledger identity, the
#   migration and the per-dialect unit wirings are all root-side construction, not unit code.
#
#   busbar-llm's unit modules and busbar-unit-breaker's port carry the same seal spelling in
#   fixtures that build a sealed token to show a step's shape.
known_sites = [
  "crates/busbar-caps/src/",
  "crates/busbar/src/root/",
  "crates/busbar-llm/src/unit/",
  "crates/busbar-unit-breaker/src/port.rs",
]

# The seal-site list, mirroring crates/busbar-caps/fixtures/lint_rules.rs SEAL_SITES. A test in that
# crate walks `lint::all()` and asserts this file names every symbol either list carries, with the
# same scope both ways round, so the specification and the scan cannot drift apart.
[rules.seal-sites.symbols.kernel-seal]
symbol = "KernelSeal::acquire_for_kernel"
confined_to = "kernel/src"
# The scope resolved against this tree, matched as path prefixes.
confined_to_paths = ["crates/busbar-kernel/src/"]
because = "the seal is what mints every token; only the kernel may obtain one"

[rules.seal-sites.symbols.recovery-token]
symbol = "RecoveryToken"
confined_to = "recovery"
# The scope resolved against this tree, matched as path prefixes.
confined_to_paths = ["crates/busbar-kernel/src/recovery.rs"]
because = "it materialises a hold from a journal record with no admission behind it"

[rules.seal-sites.symbols.hold-cell-take]
symbol = "take(&ExitToken::mint("
confined_to = "kernel/src"
# The scope resolved against this tree, matched as path prefixes.
confined_to_paths = ["crates/busbar-kernel/src/teller.rs", "crates/busbar-kernel/src/tick.rs"]
because = "there are three take sites -- the exit path, the sweep and the tick -- and no fourth"

# ── 28. plane-no-money ───────────────────────────────────────────────────────────────────────────
[rules.plane-no-money]
why = """A plane says what HAPPENED; the cost unit says what it COST. A plane crate, the pure codec \
half it shed, and a plane's own unit modules deal in usage CLASSES and QUANTITIES -- how many \
tokens, how many frames, how many seconds, which meter class, which lane -- and never in an amount, \
a rate, a fee or a card. Only busbar-unit-cost (the rate card, the per-request fee, the posting) and \
the composition root's meter/admission wiring may name a price. This is not a matter of taste: a \
price named on the plane side is a price the kernel cannot re-derive, cannot seal into a posting and \
cannot audit, and it is named inside a plugin-shaped crate that a third party may one day write. The \
near-miss this rule was born from added a fee method to the plane-host cost seam and priced on the \
plane side, and nothing here stopped it. THE ALLOWED VOCABULARY, deliberately: usage classes and \
quantities of every kind; `fee_count`, which is EVIDENCE that a billable request happened -- a \
kernel-derived count of 1 or 0, never an amount, and only the card turns it into money, so a plane \
may report it without ever knowing what a request costs; the yes/no card predicates \
(`pricing_enabled`, `is_unpriced`, `cost_model_unpriced`, and the `Unpriced` refusal reason), which \
answer "does a card cover this lane at all" and carry no figure back across the seam; and the \
time-sense `_nanos` names (`as_nanos`, `elapsed_nanos`, `monotonic_nanos`, `latency_nanos`), which \
are nanoseconds, not nano-units of money. The seam verb that turns usage INTO an amount \
(`cost_price_usage`) is deliberately not in the symbol list below: it is scanned by one-pricing-site, \
which is the row that can name the home the call belongs in, so one site is never counted twice."""
# Where a plane's own production source lives: the plugin-side plane crates, the pure codec half of
# each plane, and the plane-side unit modules. Only the llm plane has a unit module today; the mcp,
# a2a and voice legs still run their steps from the composition root's wiring (which is the one place
# allowed to price), so their globs match nothing yet and say so in the row rather than failing.
scope_globs = [
  "crates/busbar-plane-*/src/*",
  "crates/busbar-*-codec/src/*",
  "crates/busbar-llm/src/unit/*",
  "crates/busbar-mcp/src/unit/*",
  "crates/busbar-a2a/src/unit/*",
  "crates/busbar-voice/src/unit/*",
]
# Each is matched as a whole word (an entry starting with `_` as a suffix), and judged against the
# WHOLE identifier it lands in, so the vocabulary below can excuse a word rather than a substring.
symbols = ["RateCard", "Pricer", "per_request_fee", "fee_cents", "price_", "priced",
           "CostHandle", "CostModel", "Nanos", "_nanos"]
# The words a plane MAY say, each because it carries no amount. See the `why` for the argument.
allowed_vocabulary = [
  "fee_count", "pricing_enabled", "cost_pricing_enabled", "is_unpriced", "cost_model_unpriced",
  "unpriced_message", "unpriced_classes", "Unpriced", "unpriced",
  "as_nanos", "elapsed_nanos", "monotonic_nanos", "latency_nanos",
]
# The cost crate and the cost host modules, named as module paths rather than as words.
forbidden_module_paths = ["busbar_unit_cost::", "busbar_core::cost::", "busbar_core::plane_host::cost_host"]
# A manifest dependency is the same reach spelled where no source scan would see it.
forbidden_deps = ["busbar-unit-cost", "busbar-unit-ledger"]
max_hits = 0
# Reviewed per-file exceptions: file -> the symbols accepted there, the reason recorded here.
#
#   The llm plane's Verify step holds a `CostHandle` and calls its guard `priced`, and neither
#   learns a price: the handle is opaque and the two questions asked through it
#   (`cost_pricing_enabled`, `cost_model_unpriced`) answer yes or no, so the step can refuse a lane
#   the card does not cover without any figure crossing the seam. Every amount-bearing symbol above
#   is still held against that file.
[rules.plane-no-money.allowlist]
"crates/busbar-llm/src/unit/verify.rs" = ["CostHandle", "priced"]

# ── 29. one-pricing-site ─────────────────────────────────────────────────────────────────────────
[rules.one-pricing-site]
why = """There is ONE place a unit is priced. The cost unit owns the card and the arithmetic; the \
composition root's meter and admission wiring is what calls it, once, with the usage the plane \
reported; the kernel's settle sites consume the amount that came back and mint a posting from it, \
and never derive one. Anywhere else that turns usage into money is a second pricing policy growing \
beside the first -- two answers to "what did this cost", diverging silently, with the ledger unable \
to say which one it recorded. The homes below are enumerated with a reason each rather than left to \
a path pattern, so adding a home is a reviewed edit. The second row is the same promise on the \
input side: a per-request fee read straight off a config or a card, outside the crate that owns the \
card, is a price derived where nobody can see it. busbar-core is on that reader list because it is \
the retiring 1.5.5 engine that still carries the legacy fee path; the list shortens as core empties, \
and never lengthens."""
scope_note = "production code only; a test may price whatever it likes to prove the arithmetic"
# The seam verb that turns reported usage into an amount. Definitions and `use` lines are not calls.
entry_verbs = ["cost_price_usage"]
# The cost unit's own pricing entry points, named as paths.
entry_path_patterns = ['busbar_unit_cost::[A-Za-z0-9_:]*price', 'busbar_unit_cost::apply_tier']
max_extra_sites = 0
# The fee fields, and the two crates that may read them. `per_request_fee` is the card's OWN
# spelling since the cost unit re-labelled `per_request_fee_cents` to it (the fee is carried in the
# currency's minor units, so `_cents` was a lie on any non-USD deployment). Without it on this list
# the rule went blind to exactly the thing it was written for: it would still have counted two
# offenders, but both name `fee_cents`, the config/substrate spelling, and NOT ONE read of the
# card's own fee anywhere in the workspace. The old spelling stays so a re-introduction of it is
# still caught.
fee_fields = ["per_request_fee", "per_request_fee_cents", "fee_cents"]
fee_reader_crates = ["busbar-unit-cost", "busbar-core"]
max_fee_readers = 0

[rules.one-pricing-site.allowed.cost-unit]
path = "crates/busbar-unit-cost/src/"
because = "the cost unit IS the card; its own source names its own entry points"

[rules.one-pricing-site.allowed.root-wiring]
path = "crates/busbar/src/root/"
because = "the composition root's meter and admission wiring: the one place that hands the cost unit a unit's usage and takes an amount back"

[rules.one-pricing-site.allowed.kernel-exit]
path = "crates/busbar-kernel/src/teller.rs"
because = "the exit path settles the hold and mints the posting from an amount it was given; it derives none"

[rules.one-pricing-site.allowed.kernel-sweep]
path = "crates/busbar-kernel/src/tick.rs"
because = "the tick sweep is the second settle site, for a unit whose exit never ran"

[rules.one-pricing-site.allowed.kernel-recovery]
path = "crates/busbar-kernel/src/recovery.rs"
because = "recovery settles a hold a dead incarnation left open, from the journal's own figure"

# ── 30. legacy-reach ─────────────────────────────────────────────────────────────────────────────
[rules.legacy-reach]
why = """The composition root is the last place that still reaches into the retiring crates by name. \
Every distinct symbol it spells there is one more thing the deletion of those crates has to move, \
and the TOTAL over all of them is a ratchet: it may go DOWN and never up. Counted as DISTINCT \
symbols rather than lines, because moving one symbol's five call sites into a unit is real progress \
and merging two imports is not. Grouped `use` braces are expanded, so a reach does not appear to \
shrink when an import is folded. The llm engine's own unit modules are excluded from that plane's \
count: those are the plane step files the rebuild is moving TO, not the engine paths it is moving \
off. The red row lists the symbols it counted, so the work has a worklist and not just a number.

ONE RATCHET, NOT THREE. The count was per crate, and that measured the wrong thing. The cuts this \
rule exists to drive move a symbol off one retiring crate and, for a stretch, onto another: a core \
seam the kernel is taking over is spelled through the substrate on the way, which is one fewer \
`busbar_core::` name and one more `busbar_substrate::` one. Under per-crate ceilings that step is a \
RED row -- the gate calling a real cut a regression -- while the direction that actually matters, \
how much of the retiring surface the root names at all, went unmeasured. The total cannot be gamed \
by moving a name sideways, which is the only property the per-crate figures were ever asked for. \
They are kept as WARN sub-rows: they carry the worklist per crate, and a crate whose figure climbs \
while the total falls is that intermediate step, visible and not fatal."""
scope_globs = ["crates/busbar/src/root/*.rs", "crates/busbar/src/main.rs"]
# THE ONE GATING FIGURE: distinct symbols named through every prefix below, summed. Calibrated to
# the tree it was written against; it may only go down.
ceiling = 91

# Each sub-row below GATES, in both directions. `figure` is the per-crate count PINNED TO TODAY'S
# MEASUREMENT: above it is that row's own FAIL, below it is `ceiling-slack`. It was informational --
# a drift marker nothing could fail on -- and what that bought was `busbar_substrate` sitting
# twenty-one over its figure, passing, for as long as the gating total held. The intermediate step
# the WARN posture existed to permit (a symbol moving off one retiring crate onto another) is now a
# re-pin of two figures in the commit that makes it, which is a diff a reviewer can read.
[rules.legacy-reach.prefixes.busbar_core]
prefix = "busbar_core::"
exclude = []
because = "the 1.5.5 engine being emptied; every symbol here is a piece of it the root still needs"
figure = 25

[rules.legacy-reach.prefixes.busbar_llm]
prefix = "busbar_llm::"
# The plane's own unit modules are where the rebuilt steps live; they are not legacy engine reach.
exclude = ["busbar_llm::unit"]
because = "the llm engine's non-unit paths: arrival parsing, proto codecs, the stream translator"
figure = 17

[rules.legacy-reach.prefixes.busbar_substrate]
prefix = "busbar_substrate::"
exclude = []
because = "the substrate seams the root installs; each moves onto the ABI as the kernel takes them"
# ONE-TIME CALIBRATION, 26 -> 47 (integrator ruling, 2026-09-09). This figure was written when the
# row was INFORMATIONAL -- PASS whatever it measured -- and the root's substrate reach grew to 47
# underneath it while core's fell from 49 to 27, which is the retirement working as designed and is
# exactly the sideways move the WARN posture existed to permit. The commit that makes the row GATE
# cannot also be the commit that declares a twenty-one-symbol regression, because there was no
# regression: nothing ever held this number. So it is calibrated ONCE, to what the tree measures
# today, and it ratchets down from here like every other figure in this file. It may only go down;
# `ceiling-slack` holds it from below and this row holds it from above.
#
# 47 -> 48 (declared in `[gate.ceiling_raises]` above): the protocol boot installer moved out of the
# legacy core into `crates/busbar/src/root/proto_install.rs`, and the one name it brought with it
# that the root had never spelled before is `busbar_substrate::ingress::arrival::install_path_ingress`.
# The move is why the TOTAL fell (91 -> 90) and core's own prefix fell (27 -> 25) in the same commit:
# this is the sideways step the per-crate rows exist to make visible, not a regression.
figure = 49

# ── 31. no-test-doubles-in-production ────────────────────────────────────────────────────────────
[rules.no-test-doubles-in-production]
why = """The composition root is where a node's real parts are chosen, and it is also where a \
stand-in is easiest to leave behind: a flat pricer, an all-pass chain of nothing, a shipper that \
drops what it is handed, a rows table that only remembers, a bindings value with no directory \
under it. Each of those is a legitimate value for SOME node -- a deployment with no `peers:` \
really does ship a null shipper -- and each is also exactly what a fixture reaches for, so the two \
are indistinguishable at the call site. They are not indistinguishable to a reader who went and \
looked, which is what this rule is: every one of these spellings on a production line of \
`crates/busbar/src` is either named here with a one-line reason, or it is a stand-in nobody \
reviewed and the gate says so. The second row is the worklist: of the sites that WERE reviewed, the \
ones the review found to be a test double in the shipped binary rather than the shipped node's own \
value. That count is a ratchet -- it may go down. Scanned over production lines only, because a \
double is what a test is FOR."""
scope_globs = ["crates/busbar/src/*"]
# The spellings. A stand-in is recognised by what it constructs, not by where it sits.
forbidden = [
  "Pricer::flat(",
  "AuthChain::new(Vec::new()",
  "NullShipper",
  "RecordingRows",
  "without_directory(",
]
max_unlisted = 0
max_doubles = 5

# THE REVIEWED SITES. `verdict = "real"` means the review found this to be the shipped node's own
# value at this composition — a null shipper on a node with no `peers:`, a memory-buffered book on a
# node that configured no data directory. `verdict = "double"` means the review found a fixture's
# value in the shipped binary, and those are counted by the second row so the owner sees them.
