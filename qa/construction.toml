#       validation or 404 message — renaming it would desync the message from the key the operator
#       actually wrote in their YAML, which is a worse regression than the word appearing here;
#   (b) a FROZEN wire-format literal (a `config-schema.snapshot.json` key, a `--migrate-config`
#       rewrite table entry, a Cargo feature name) that computes or quotes the literal key it exists
#       to rename or record — the migration's correctness DEPENDS on spelling the old/new key exactly;
#   (c) a JSON/metrics field name mirroring a real struct field or wire response shape, where
#       renaming the label would desync it from the actual API/metrics key it names.
# Two related sites were left RED rather than waived here: `plane_host/mod.rs`'s "no default chat
# protocol is installed" / "the sampling completion's body could not be read" genuinely bridge an
