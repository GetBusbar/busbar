# ── 18. no-default-bodies (BUSBAR-1.6.0.md THE DESIGN, §8) ─────────────────────────────────────────────────────
[rules.no-default-bodies]
why = """A kind trait with a default method body is a place a plugin's behaviour was decided for it \
without the plugin's author ever writing a line — the opposite of "every trait method implemented". \
Every method on every kind trait below must be bodiless (`;`), so implementing the trait is the only \
way to answer it."""
file = "crates/busbar-contract/src/kinds.rs"
plane_file = "crates/busbar-contract/src/plane.rs"
transport_file = "crates/busbar-contract/src/transport/mod.rs"
# ONE auth kind, ONE auth trait (DECISIONS #3, owner 2026-09-22). `EgressAuthScheme` stood here
# until the `Kind::EgressAuth` variant, the `EgressAuthKind` marker and the trait itself were struck
# from busbar-contract: outbound-sign is an OPERATION of the auth kind and direction is a property
# of the leg, so there is no second kind trait for this rule to scan. The rule's own refusal is what
# requires the strike to land in the same commit as the deletion — a trait it cannot find is a trait
# it cannot judge, and a ceiling of 0 met by scanning nothing is the passing answer to every ban.
# `Store` stood here until the `kinds::Store` journal trait was struck from busbar-contract
# (STORE-NOALLOC, ARCHITECT R7 2026-10-01): it had no implementor and no caller; the store kind is
# its v3 table and `abi::sdk::store::StoreSlots`. Struck in the same commit, as above.
traits = [
  "Plane", "SessionPlane", "Transport",
]
max_defaulted = 0

# ── 19. sealed-unit-traits (BUSBAR-1.6.0.md THE DESIGN, §8) ────────────────────────────────────────────────────
[rules.sealed-unit-traits]
why = """The trait a unit implements to be called by the Teller is sealed on a private supertrait, \
so no plugin crate can implement it and stand in for a unit the kernel itself must own. \
busbar-kernel-breaker's `Breaker` trait does this today (`mod sealed { pub trait Sealed {} }`, \
`pub trait Breaker: sealed::Sealed`); this rule requires the same shape of every unit's own \
kernel-facing trait as each is written. NOT every `pub trait` in a busbar-unit-* crate is one of \
these — most are internal ports (a header reader, a journal sink) a unit crate defines to keep its \
own tests fast, never the thing a plugin would implement to BE the unit — so the check is scoped to \
the explicit list below, maintained by the owner as each unit's sealed shape lands."""
# Ratchet: 0. The one unsealed trait, `Admission`, left with busbar-kernel-budget (deleted whole,
# ARCHITECT ruling 2026-09-30): its admission stack had no production caller.
max_unsealed = 0
# crate, trait, file (relative to repo root) — the unit's own kernel-facing trait.
[rules.sealed-unit-traits.traits.breaker]
crate = "busbar-kernel-breaker"
file = "crates/busbar-kernel-breaker/src/lib.rs"
trait = "Breaker"

[rules.sealed-unit-traits.traits.audit]
crate = "busbar-kernel-audit"
file = "crates/busbar-kernel-audit/src/record.rs"
trait = "Audit"

# ── 20. hold-discipline (BUSBAR-1.6.0.md THE DESIGN, §8) ────────────────────────────────────────────────
[rules.hold-discipline]
why = """Every path takes its Hold exactly once and every path that takes one actually settles it. \
Five mechanical proxies for that, each a pattern match over busbar-kernel and busbar-unit-* \
production code, each reported only where its subject exists (a crate that has none of the pattern \
yet is a vacuous PASS, not a lie): no `?` or early `return` between a HoldCell take and its settle; \
no identifier typed `Hold` closed over by a `catch_unwind` closure; no `JoinHandle::abort`; no \
`mem::forget`/`drop(...)` of a value whose name says it is a hold; and a cancellation-token check \
before every `.await` inside the route step, wherever the route step is async."""
# REPOINTED (item 380), the same dead glob as `lean-core`'s: `busbar-unit-*` matches only
# `busbar-unit-transport-key`, which holds no hold, so the money settle site
# (`crates/busbar-kernel-ledger/src/settle.rs`) and the budget crate's hold cell
# (`crates/busbar-kernel-budget/src/lib.rs`) were outside every one of the five proxies. The glob
# now names the eight `busbar-kernel-<name>` crates the units became, and the surviving unit crate
# is kept by name so nothing leaves scope. Measured at e970ed0ae: all four rows that were PASS stay
# PASS over the wider set (no finding added), and a planted `let hold = cell.take(); let x =
# maybe()?; Posted::settle(hold, x)` in `settle.rs` now reds `hold-discipline:no-early-exit`, which
# under the old glob stayed PASS.
# RETIRED BY NAME (fold F14 2/2): the last unit crate is deleted and its code sits in
# `busbar-kernel-identity`, inside `scope_crate_glob` below, so nothing leaves scope.
scope_crates_kernel = ["busbar-kernel"]
scope_crate_glob = "busbar-kernel-*"
take_pattern = '\.take\('
settle_pattern = '::settle\(|\.settle\('
catch_unwind_pattern = 'catch_unwind'
hold_word = "Hold"
abort_pattern = '\.abort\('
forget_or_drop_pattern = '(?:mem::forget|drop)\(\s*&?\s*[A-Za-z_][A-Za-z0-9_]*[Hh]old[A-Za-z0-9_]*'
# (e) `cancellation-before-await`: the kernel route step it once scanned is sync, so the row was
# vacuous there. Its subject is the plugin dispatcher's
# deadline/cancel path: in a function of `cancel_scope_dirs` that names a cancel or a deadline, a
# money hold (`hold_open_pattern`) is released or settled (`hold_close_pattern`) before any `.await`
# or `return` that follows the cancel.
# The dispatcher's cancel paths hold no money hold today; the ONE money `.await` in the tree is the
# teller's `under_hold(...).await` (crates/busbar-kernel/src/teller.rs), so the row scans both: a
# cancel or deadline path growing around it is held to the rule the day it appears.
cancel_scope_dirs = ["crates/plugin-loader/src/dispatch/", "crates/busbar-kernel/src/teller.rs"]
cancel_path_pattern = 'slot::CANCEL|DropClient|drop_client|deadline'
hold_open_pattern = 'Hold::open|HoldCell|\blet\s+(?:mut\s+)?\w*[Hh]old\w*\s*[:=]'
hold_close_pattern = '::settle\(|\.settle\(|::release\(|\.release\('
max_early_exit = 0
max_catch_unwind_capture = 0
max_join_abort = 0
max_forget_or_drop = 0
max_await_with_open_hold = 0

# ── 21. forbid-unsafe (BUSBAR-1.6.0.md THE DESIGN, §2) ─────────────────────────────────────────────────────────
[rules.kernel-seal-impls]
why = """`busbar_contract::plugin::KernelSeal` is what every kernel-built view the contract declares \
takes to be constructed: a verified destination, the unit a plane reads, a one-shot secret, a \
transport key handle. It has to be a public trait, because busbar-contract's caps module implements it on every token \
and sits ABOVE the contract, and Rust cannot say "implementable by exactly one other crate". So the \
type system does not close it and this scan does: outside busbar-contract's caps module, an in-tree crate that \
implements this trait can mint its own kernel evidence, and it does not need a token, a kernel or a \
review to do it. Scanned INCLUDING test code on purpose -- every site this rule found on the day it \
was written was in a test module, so a production-only reading of it would be vacuous by \
construction and would prove nothing. This is the in-tree half only: an out-of-tree plugin can still \
implement the trait, and per the trust policy a loaded plugin is trusted code, so that is not a line \
this rule pretends to draw."""
pattern = 'impl(<[^>]*>)?\s+(busbar_contract::)?(plugin::)?KernelSeal\s+for'
allowed_root = "crates/busbar-contract/src/caps"
max_sites = 0
# Ratchet, NOT a review: each file below forges a seal today with a private type, and each is owned
# by a change that is not this one. A new site anywhere else is held to the rule immediately.
# busbar-plane-admin and busbar-plane-streaming are the awkward ones: a PLANE
# crate may not name busbar-contract's caps module at all (section 1.2, and manifest-allowlist makes
# it an automatic RED), so their test seals cannot move onto a token until the contract offers a seal
# a plane is allowed to name. That is debt this rule now PINS rather than debt it hides.
#
# STRUCK 2026-09-22: `crates/busbar-plane-admin/src/tests/mod.rs`. GONE, NOT MOVED — the file's
# successor LIVES but the debt in it does not, which is the case a path-exists check cannot tell
# from a working row. Followed end to end: `a39ec8633` renamed it to
# `crates/busbar-core-admin/src/tests/mod.rs`, `92e823cd5` renamed that to
# `crates/busbar-core-admin/src/admin_codec/tests/mod.rs` (which EXISTS at HEAD), and `ae4f22210`
# ("kind-isolation: delete the admin plane entry face") deleted the `struct TestSeal; impl
# busbar_contract::plugin::KernelSeal for TestSeal` block outright — `grep -c KernelSeal` on that
# file is now 0, and no file under `crates/busbar-core-admin/` implements the trait. So the entry is
# NOT repointed at the successor: a row pointed at a path with no finding suppresses nothing today
# and would silently excuse the seal if anyone re-forged one there. Striking it puts that path back
# under the rule immediately, which is what the ratchet is for.
#
# STRUCK 2026-10-03: `crates/busbar-kernel-egress/src/tests/harness.rs`. MOVED AND CURED — `4b8891c0a`
# (token-sealed A, ARCHITECT Q-GG3) moved the harness whole to
# `crates/busbar-kernel/src/tests/members/egress/route/harness.rs`, where it lends a real
# kernel-minted Pass (`KernelSeal::acquire_for_kernel()`) instead of the test seal, and egress's
# test-seal dev-dependency went with it. The rule's pattern matches no file under either crate, so
# the entry is not repointed (a row on a path with no finding would only excuse a future forgery);
# it is struck, and both paths are held to the rule. The seal debt that remains is the two below.
known_sites = [
  "crates/busbar-plane-streaming/src/tests/harness.rs",
  "crates/busbar-transport-stdio/src/tests/battery.rs",
]

# ── 22. forbid-unsafe ────────────────────────────────────────────────────────────────────────────
[rules.forbid-unsafe]
why = """Plane, hook, auth and secret crates carry `#![forbid(unsafe_code)]` — a \
lint level nothing inside the crate can locally override, matching that these kinds are structurally \
barred from unsafe by design, not merely asked nicely. Transport, ABI, loader, store and export \
crates carry at least `#![deny(unsafe_code)]` (weaker: a reviewed site may locally `#[allow]` it), \
because these kinds legitimately touch FFI or the wire. This checks the attribute is present at the \
crate root — not that every individual unsafe site is itself reviewed, which is a finer-grained \
check left to `cargo xtask gate blocking-ffi`-style tooling outside this gate."""
# THE FOURTH TABLE THAT NAMED A KIND THAT DOES NOT EXIST. `[gate.plugin_kinds].plane` was missing
# the fifth plane, `[gate.plugin_kinds].export` pointed its family glob at the wrong
# path, `[rules.source-denylist].kinds` named `pure_auth`/`egress_auth` and so scanned
# no auth crate at all — and THIS list carried the same two struck names. LOCKED
# DECISION #3 collapsed them into ONE `auth` kind (inbound-verify and outbound-sign are two
# OPERATIONS of it), `[gate.plugin_kinds]` has no `pure_auth` or `egress_auth` key, so both
# resolved to an EMPTY glob list and the auth kind was never held to this rule.
# MEASURED, NOT INFERRED, 2026-09-22: this gate emitted nine `forbid-unsafe:<crate>` rows — the
# five planes, both hooks, both secret crates — and NONE for `crates/auth-admin-tokens` or
# `crates/auth-static-plugin`, NEITHER OF WHICH CARRIES THE ATTRIBUTE. Both are already named on
# `known_missing_forbid` below, so spelling the kind correctly re-opens the ratchet over them
# rather than reddening the row. That is the point of the correction: a debt that is scanned is a
# debt somebody can close, and a debt filed under a kind nobody scans is a debt nobody can see.
forbid_kinds = ["plane", "hook", "auth", "secret"]
deny_kinds = ["transport", "abi", "loader", "store", "export"]
# Ratchet: crates known to be missing the attribute today, so the gate does not go red the moment
# this rule is born. Each is real debt the owner closes by adding the attribute and deleting the
# name below; a new crate NOT on this list is held to the rule immediately.
known_missing_forbid = [
  "hook-test-plugin", "hooks-ranking",
]
known_missing_deny = [ "plugin-loader",
]

# ── 22. secret-carrier-debug (BUSBAR-1.6.0.md THE DESIGN, §8) ───────────────────────────────────────────────────
[rules.secret-carrier-debug]
why = """A value that carries secret bytes must hand-roll its `Debug` so the bytes cannot be printed \
— never derive one. On the plugin ABI this is not a matter of caller discipline: every auth scheme \
in the tree and out of it is handed a `Credential`, and the code that might format it is code this \
repository cannot read. The carriers below are the named ones; adding a type that holds a resolved \
secret, a client credential or key material means adding it here and writing the impl."""
carriers = ["Credential", "SecretValue", "CredentialSecret", "KeyMaterial", "UpstreamAddress", "SecretOnce", "LaneInput"]
max_derived = 0

# ── 23. no-escaped-newline-doc-comment ──────────────────────────────────────────────────────────────
[rules.no-escaped-newline-doc-comment]
why = """A relocation script that moves a test module into its own file can turn the doc comment's
intended line breaks into the literal two characters backslash-n, which then sits on one physical
line right before the next `//!`/`///` prefix instead of starting a new one. rustdoc renders it as
inert text mid-sentence and no compiler warning catches it, so it survives until someone reads the
generated docs. The ceiling is zero and is never calibrated upward: this is a class of typo, not a
figure the tree is allowed to carry any of."""
max_hits = 0

# ── 24. hold-escapes (BUSBAR-1.6.0.md THE DESIGN, §1) ────────────────────────────────────────────────────────────
[rules.hold-escapes]
why = """Rust has no linear types, so "this value must be consumed by exactly this function" is not \
expressible: `std::mem::forget`, `ManuallyDrop`, `Box::leak` and an `AssertUnwindSafe` wrapper all \
compile, and a hold that goes away through one of them is a unit that was admitted and never \
settled — money that vanishes with no canary arithmetic to catch it, because the canary only ever \
sees the counts a settled unit leaves behind. busbar-contract's caps module writes the escape list down as data in \
its `caps/fixtures/lint_rules.rs` and says in its own honesty table that CI scans for it; this rule is \
that scan. It reads the same symbols with the same scopes, over every crate's production sources \
rather than only the kernel's, because a plugin-side crate that leaks a hold loses exactly as much \
money as the kernel would. `hold-discipline` above is the narrower, shape-aware reading of the same \
promise over busbar-kernel and the unit crates; this one is the flat symbol scan the honesty table \
names, workspace-wide."""
scan_globs = ["crates/*/src"]
max_sites = 0
# The reviewed sites. An entry is `path::function` (one function), a file path (one file), or a
# path ending in `/` (a directory). Every one of these was read before it was written down.
#
#   busbar-contract ids.rs `Registration::key` is THE reviewed leak-once intern: lane names,
#   op-class names and a loaded plugin's key are leaked once at boot, the allocation is fixed and
#   countable, and interning is idempotent — so "leaked once" is a property of the interner rather
#   than a hope. It is named by function, so the rest of the file is still held to the rule.
#
#   The plane-host, plugin-loader and busbar-contract abi::sdk boundaries catch a panic crossing the ABI, which is
#   the design: a plugin that panics must not take the node with it, and no hold is in scope on
#   either side of those calls. busbar-core was the crate being emptied; its sites MOVED, and this
#   list has now followed them. See the repoint note below.
#
#   ── REPOINTED 2026-09-22: SIX ENTRIES NAMED TWO DELETED CRATES ─────────────────────────────────
#
#   Three entries were scoped to `crates/busbar-core/…` and three to `crates/busbar-substrate/…`.
#   NEITHER CRATE IS IN THIS TREE. A `known_sites` entry that matches no path suppresses nothing, so
#   all 65 escapes it had reviewed came back as findings — the row was RED on debt somebody HAD
#   read, under names that had died. Repointing restores the ratchet; it does not raise a ceiling.
#
#   EVERY REPOINT IS A RENAME GIT DETECTED, NOT A JUDGEMENT. `673ecdaaa` (absorb busbar-core) and
#   `5fa320208` (absorb busbar-substrate) carry, at 99–100% similarity:
#     R099 crates/busbar-core/src/router.rs            -> crates/busbar-kernel/src/router.rs
#     R099 crates/busbar-core/src/plane/registry.rs    -> crates/busbar-kernel/src/plane/registry.rs
#     R100 crates/busbar-core/src/plane_host/*.rs      -> crates/busbar-kernel/src/plane_host/*.rs
#     R100 crates/busbar-substrate/src/plane/handle_engine.rs
#                                                      -> crates/busbar-kernel/src/plane/handle_engine.rs
#   and `5fa320208` MERGED substrate's `plane_host/{mod,scope}.rs` INTO the core-descended kernel
#   files of the same name (+1775 and +596 lines).
#
#   THE DIRECTORY ENTRY IS DELIBERATELY NOT REPOINTED AS A DIRECTORY, and this is the whole care of
#   this edit. `crates/busbar-kernel/src/plane_host/` is the union of TWO former directories: core's
#   (which the old entry covered whole) and substrate's (which it never covered — the reviewer took
#   only `mod.rs` and `scope.rs::reclaim_all` from that side, by name, deliberately). Repointing a
#   directory at a directory that has since absorbed SEVEN files it never reviewed
#   (build_input, egress_trust, engine_view, identity, slots_through, spki, trust_anchor) would
#   silently excuse whatever lands in them. Those seven carry ZERO escapes today, so the widening
#   would cost nothing this minute and everything the first time one grew — which is exactly how a
#   ratchet becomes laundering. So the directory is replaced by the TEN core-descended files that
#   actually carry the reviewed escapes. That is strictly NARROWER than what it replaces (creds.rs,
#   govern.rs and the plane_host test files drop out of coverage at 0 escapes each), and a ratchet
#   may always tighten.
#
#   NOTHING NEW IS EXCUSED, AND THAT IS MEASURED, NOT ASSERTED. Escapes per file in
#   `crates/busbar-core/src/plane_host/` at `673ecdaaa^` were 4/3/7/10/2/2/13/3/8/8 = 60 across
#   breaker, cost_host, dispatch, egress, guard, identity_admit, journal, pipe, trust, vtable. The
#   same ten files at HEAD read 4/3/7/10/2/2/13/3/8/8 = 60. FILE FOR FILE IDENTICAL — no escape
#   accrued in the blind spot while the name was dead. The remaining five findings are the other
#   five entries one-for-one: plane_host/mod.rs:2433 (substrate's leak, the +1775 merge),
#   plane_host/scope.rs:355 (inside `reclaim_all`, line 343), plane/registry.rs:489,
#   plane/handle_engine.rs:858 (inside `sweep`, line 820), router.rs:680. 60 + 5 = the 65.
#
#   The two remaining leaks are boot-time interners of the same shape as ids.rs.
#
#   scope.rs `reclaim_all` is the arena's per-entry reclaim boundary, named by function so the rest
#   of the file is still held to the rule. Reclaiming runs code the arena does not own — a closer
#   that kills a subprocess, a guard's real `Drop` — and the loop is reached from `Drop`, so an
#   unbounded panic there both strands every entry after it (leaking exactly what the arena exists to
#   reclaim) and, unwinding out of a drop already running during an unwind, aborts the node. No hold
#   is in scope on either side of the call: the boundary wraps exactly one entry's reclaim, the entry
#   is already out of the registry and is consumed whichever way it ends, and the registry lock is
#   released before the loop starts.
#
#   handle_engine.rs `sweep` is the plane-callback boundary of the same family as the plane-host
#   ones above, named by function so the rest of the engine is still held to the rule. The retention
#   sweep is AMORTISED over submits, so the plane's `abandon` callback runs inside some OTHER
#   caller's `submit` — one whose row and genesis event are already durable and whose handle is not
#   yet installed. A panic escaping that callback would unwind through that submit and leave a
#   durable row no live handle answers for, which the next boot rehydrates as a handle nobody
#   accepted. No hold is in scope on either side of the call: the boundary wraps exactly the
#   callback invocation, the slot guard is held outside it, and both a `None` verdict and a
#   panicking one mean the same thing — this handle was not abandoned.
known_sites = [
  "crates/busbar-contract/src/ids.rs::key",
  # boot/reload-time route-literal interning, deduplicated, never a money hold
  "crates/busbar-contract/src/abi/transport/route.rs::intern",
  # was crates/busbar-core/src/plane_host/ (a whole directory) — the ten files of it that carry a
  # reviewed escape, so the seven substrate-origin files the merge added stay uncovered.
  "crates/busbar-kernel/src/plane_host/breaker.rs",
  "crates/busbar-kernel/src/plane_host/dispatch.rs",
  "crates/busbar-kernel/src/plane_host/egress.rs",
  "crates/busbar-kernel/src/plane_host/guard.rs",
  "crates/busbar-kernel/src/plane_host/identity_admit.rs",
  "crates/busbar-kernel/src/plane_host/journal.rs",
  "crates/busbar-kernel/src/plane_host/pipe.rs",
  "crates/busbar-kernel/src/plane_host/trust.rs",
  "crates/busbar-kernel/src/plane_host/vtable.rs",
  # was crates/busbar-core/src/plane/registry.rs (R099)
  "crates/busbar-kernel/src/plane/registry.rs",
  # was crates/busbar-core/src/router.rs (R099)
  "crates/busbar-kernel/src/router.rs",
  # was crates/busbar-substrate/src/plane/handle_engine.rs::sweep (R100); `sweep` is still the
  # enclosing function — the escape is at :858, the fn opens at :820.
  "crates/busbar-kernel/src/plane/handle_engine.rs::sweep",
  # was crates/busbar-substrate/src/plane_host/mod.rs — MERGED into the core-descended kernel file
  # of the same name by 5fa320208 (+1775 lines). The one escape there (:2433) is substrate's.
  "crates/busbar-kernel/src/plane_host/mod.rs",
  # was crates/busbar-substrate/src/plane_host/scope.rs::reclaim_all — merged the same way (+596).
  # Still named BY FUNCTION, so the rest of the merged file is still held to the rule.
  "crates/busbar-kernel/src/plane_host/scope.rs::reclaim_all",
  # was crates/busbar-substrate-values/src/proto.rs — the protocol registry moved to the kernel
  # verbatim (#83a SD-8).
  "crates/busbar-kernel/src/proto/installed.rs",
  "crates/plugin-loader/src/",
  "crates/busbar-contract/src/abi/sdk/boundary.rs",
  "crates/plane-example/src/",
  # REVIEWED 2026-09-25 (item 141): a first-party plugin's diagnostic written as the host's own
  # line needs a tracing callsite and field names that are 'static by tracing's type; `site` makes
  # ONE per (code, level, field-name list) and interns it, so the allocation is bounded by the
  # catalogue and made once — the leak-once intern shape of ids.rs `key` above.
  "crates/busbar-kernel/src/diagnostics/emit.rs::site",
  # REVIEWED 2026-09-25 (item 141): a first-party plugin's DECLARED diagnostic joins the process
  # catalogue, whose entries are `&'static Diagnostic` with `&'static str` text by the catalogue's
  # type; one allocation per declared code, once, at boot, before the catalogue is first read.
  "crates/busbar/src/root/linked.rs::declared_diagnostics",
  # REVIEWED 2026-10-04 (DECL-FOLD on the llm flip, ARCHITECT RULING Q-DEL-A2A-DECL): a folded door
  # plane's registry row is a `&'static PlaneDecl` by the registry's type (rows live as long as the
  # process, as a linked plane's image does); one allocation per door, once, at boot.
  "crates/busbar-kernel/src/plane/door.rs::fold",
  # REVIEWED 2026-10-04 (DECL-FOLD): the probe dispatcher the door rows bind on before the config
  # prepass, ahead of the process's one dispatcher; one, once, at boot. Neither is a money hold.
  "crates/busbar/src/root/linked.rs::door_rows",
]

# The escape list, mirroring crates/busbar-contract/src/caps/fixtures/lint_rules.rs HOLD_ESCAPES. A test in that
# crate asserts this table names every symbol the fixture does, and repeats the fixture's own
# `confined_to` spelling, so the two cannot drift apart.
#
# `confined_to` is that fixture's spelling of the scope, kept verbatim for the join. It is PROSE,
# not a matcher: as a bare substring test it also excuses `crates/other-kernel/src/tellerish.rs`, or
# any path anywhere in the tree that happens to contain those characters, which is the opposite of
# confining anything. `confined_to_paths` is the same scope resolved against this tree —
# crate-relative paths, matched as prefixes, so only the files actually named are excused. An empty
# `confined_to` (and an empty or absent `confined_to_paths`) means banned everywhere.
# The fixture's rule-spec literals used to self-match this scan, so every symbol below excused
# `crates/busbar-contract/src/caps/fixtures/lint_rules.rs`. STRUCK 2026-10-02 (GATE-GREEN, ARCHITECT
# Q-GG2): the literals moved to `caps/fixtures/lint_rules.txt`, a data file no scan walks, so the
# Rust file holds none and the excuse is gone. Every symbol is again banned everywhere it says.
[rules.hold-escapes.symbols.forget]
symbol = "mem::forget"
confined_to = ""
confined_to_paths = []
because = "a forgotten hold is a unit that was admitted and never settled"

[rules.hold-escapes.symbols.manually-drop]
symbol = "ManuallyDrop"
confined_to = ""
confined_to_paths = []
because = "the same as forgetting, spelled differently"

[rules.hold-escapes.symbols.box-leak]
symbol = "Box::leak"
confined_to = ""
confined_to_paths = []
because = "a leaked hold never reaches the exit path"

[rules.hold-escapes.symbols.process-abort]
symbol = "process::abort"
confined_to = ""
confined_to_paths = []
because = "aborting skips every exit path at once; the node drains instead"

[rules.hold-escapes.symbols.assert-unwind-safe]
symbol = "AssertUnwindSafe"
confined_to = "kernel/src/teller"
# The Teller loop's ONE home in this tree: the kernel's own teller.rs. The second site is
# busbar_kernel::timing's atexit diagnostic dump (the former busbar-timing crate, folded by OWNER
# Q70): a debug-only (`feature = "timing"`) profiling module that holds no unit, so its catch_unwind
# cannot smuggle a hold across — a distinct, provably-safe use.
#
# STRUCK 2026-09-22: `crates/busbar-substrate/src/teller`. GONE, NOT MOVED, and the distinction is
# the whole point — there is no successor to repoint at. The list described "the Teller loop's TWO
# homes"; `f6a869ac0` ("busbar 1.6.0: the second Teller loop deleted onto the kernel's one loop")
# and `05fa6d33d` ("W2.b: re-point llm/a2a/streaming onto the unified kernel loop; delete substrate
# teller") DELETED all six files of it — mod.rs, run.rs, steps.rs, tests.rs, tokens.rs, unit.rs —
# with `--name-status` showing `D` for every one and no `R` anywhere. `crates/busbar-kernel/src/
# teller.rs` is NOT its successor: it was born independently at `ad49838bf` as an `A`, it is the
# loop that SURVIVED, and it is already on this list in its own right. Repointing the struck entry
# at it would be inventing coverage for a scope that no longer exists; the substrate teller's
# AssertUnwindSafe went away with its code. The remaining paths already confine the live loop.
confined_to_paths = ["crates/busbar-kernel/src/teller.rs", "crates/busbar-kernel/src/timing/mod.rs"]
because = "it is what lets a hold cross a catch_unwind; the loop needs it in exactly one place (plus busbar_kernel::timing's holdless atexit dump)"

[rules.hold-escapes.symbols.join-abort]
symbol = "JoinHandle::abort"
confined_to = ""
confined_to_paths = []
because = "an aborted task loses its unit's end; the sweep is the second exit, not abort"

# ── 25. unit-no-wall-clock ───────────────────────────────────────────────────────────────────────
[rules.unit-no-wall-clock]
why = """A unit crate decides from the values it was handed, so replaying the same inputs gives the \
same answer. A unit that reads the wall or monotonic clock itself has an input nobody passed it: \
its decision stops being reproducible, a test of it becomes a race, and the same request replayed \
for an audit no longer yields the same record. Reading a clock is the composition root's job — the \
root reads it ONCE per arrival and hands the reading down, which is also what keeps two steps of \
one unit from landing in different seconds. Production code only: a test may read a clock to \
measure a test."""
# Where a unit crate's production code lives.
scope_globs = ["crates/busbar-kernel-*/src/*"]
# The clock reads a unit crate may not perform.
forbidden = ["SystemTime::now", "Instant::now"]
# No file is exempt: the one helper that was (breaker clock.rs) is deleted.
exempt_files = []
max_hits = 0

# ── 26. unit-no-finding-ids ──────────────────────────────────────────────────────────────────────
[rules.unit-no-finding-ids]
why = """A comment that cites a finding identifier or a bare document section number tells a reader \
nothing they can act on: the identifier resolves to an audit worksheet that is not in this tree, \
and the section number moves the next time the document is edited. The rule the code follows has to \
be stated in words, in the comment, so the comment survives the worksheet and the renumbering. RFC \
citations are exempt by construction — they are stable, externally resolvable documents — and only \
the identifier shapes below are searched for."""
scope_globs = ["crates/busbar-kernel-*/src/*"]
# The shapes searched for, as regular expressions over the raw comment text.
patterns = ["PB-[0-9]", "CG-[0-9]", "ARCHITECTURE\\.md §"]
# The one crate whose occurrence is knowingly left in place, so the rule can hold the line on every
# other unit crate rather than waiting for that one citation to be rewritten. Emptying this list is
# the goal, and nothing may be added to it without the same argument.
exempt_crates = ["busbar-kernel-ledger"]
max_hits = 0

# ── 27. seal-sites ───────────────────────────────────────────────────────────────────────────────
[rules.seal-sites]
why = """busbar-contract's caps module writes down two lists of rules the compiler cannot carry: the hold escapes, \
scanned above, and the seal sites -- the symbols that decide who may build a capability at all. \
Its honesty table said CI scanned for both. It scanned for one. The three seal-site symbols are \
the seal every token constructor needs, the recovery token that materialises a hold from a journal \
record with no admission behind it, and the take that empties a hold cell; each is a crate boundary \
Rust cannot police, so each is one audited name and this is the scan that audits it. Same shape as \
hold-escapes and the same code path: literal substrings, `confined_to` scoping, one reviewed \
known_sites ratchet, over production sources only."""
scan_globs = ["crates/*/src"]
max_sites = 0
# The reviewed sites, each read before it was written down.
#
#   busbar-contract's caps module is what DECLARES these capabilities: its own token, hold and unit-end
#   modules necessarily spell their names, and its module documentation shows a kernel acquiring
#   the seal so a reader can see what the sealed constructors are for. Declaring a capability is
#   not minting one; what the rule is about is who may CALL these outside their one home.
#
#   The composition root (crates/busbar/src/root/) is where the process assembles its one kernel,
#   so it is the second place that legitimately holds a seal: durability, the ledger identity, the
#   migration and the per-dialect unit wirings are all root-side construction, not unit code.
#
#   busbar-llm's unit modules and busbar-kernel-breaker's port carry the same seal spelling in
#   fixtures that build a sealed token to show a step's shape.
known_sites = [
  "crates/busbar-contract/src/caps/",
  "crates/busbar/src/root/",
  "crates/busbar-llm/src/unit/",
  "crates/busbar-kernel-breaker/src/port.rs",
]

# The seal-site list, mirroring crates/busbar-contract/src/caps/fixtures/lint_rules.rs SEAL_SITES. A test in that
# crate walks `lint::all()` and asserts this file names every symbol either list carries, with the
# same scope both ways round, so the specification and the scan cannot drift apart.
[rules.seal-sites.symbols.kernel-seal]
symbol = "KernelSeal::acquire_for_kernel"
confined_to = "kernel/src"
# The scope resolved against this tree, matched as path prefixes.
confined_to_paths = ["crates/busbar-kernel/src/"]
because = "the seal is what mints every token; only the kernel may obtain one"

[rules.seal-sites.symbols.recovery-token]
symbol = "Grant::<Recover>::mint("
confined_to = "recovery"
# The scope resolved against this tree, matched as path prefixes.
confined_to_paths = ["crates/busbar-kernel/src/recovery.rs"]
because = "it materialises a hold from a journal record with no admission behind it"

[rules.seal-sites.symbols.hold-cell-take]
symbol = "take(&Grant::<Exit>::mint("
confined_to = "kernel/src"
# The scope resolved against this tree, matched as path prefixes.
confined_to_paths = ["crates/busbar-kernel/src/teller.rs", "crates/busbar-kernel/src/tick.rs"]
# COUNTED, not only confined (item 130). The three are teller.rs's exit path and a child unit's end,
# and tick.rs's sweep. The sweep used to take through a named grant (`take(&exit)`), which this
# literal cannot see, so confinement guarded two of the three and "no fourth" was guarded by
# nothing: a fourth take written inside teller.rs sat inside the home and the row stayed PASS.
# The sweep now spells the literal, and `sites` holds the home to exactly three.
sites = 3
because = "there are three take sites -- the exit path and a child unit's end in teller.rs, and the sweep in tick.rs -- and no fourth"

# ── 28. plane-no-money ───────────────────────────────────────────────────────────────────────────
[rules.plane-no-money]
why = """A plane says what HAPPENED; the cost unit says what it COST. A plane crate, the pure codec \
half it shed, and a plane's own unit modules deal in usage CLASSES and QUANTITIES -- how many \
tokens, how many frames, how many seconds, which meter class, which lane -- and never in an amount, \
a rate, a fee or a card. Only busbar-kernel-ledger's cost module (the rate card, the per-request fee, the posting) and \
the composition root's meter/admission wiring may name a price. This is not a matter of taste: a \
price named on the plane side is a price the kernel cannot re-derive, cannot seal into a posting and \
cannot audit, and it is named inside a plugin-shaped crate that a third party may one day write. The \
near-miss this rule was born from added a fee method to the plane-host cost seam and priced on the \
plane side, and nothing here stopped it. THE ALLOWED VOCABULARY, deliberately: usage classes and \
quantities of every kind; `fee_count`, which is EVIDENCE that a billable request happened -- a \
kernel-derived count of 1 or 0, never an amount, and only the card turns it into money, so a plane \
may report it without ever knowing what a request costs; the yes/no card predicates \
(`pricing_enabled`, `is_unpriced`, `cost_model_unpriced`, and the `Unpriced` refusal reason), which \
answer "does a card cover this lane at all" and carry no figure back across the seam; and the \
time-sense `_nanos` names (`as_nanos`, `elapsed_nanos`, `monotonic_nanos`, `latency_nanos`), which \
are nanoseconds, not nano-units of money. The seam verb that turns usage INTO an amount \
(`cost_price_usage`) is deliberately not in the symbol list below: it is scanned by one-pricing-site, \
which is the row that can name the home the call belongs in, so one site is never counted twice."""
# Where a plane's own production source lives: the plugin-side plane crates, the pure codec half of
# each plane, the llm plane's unit modules, and the three protocol-plugin crates that carry a
# plane's worth of state behind the same on/off switch as their codec.
#
# ── REPOINTED 2026-09-22. THREE OF THESE FOUR GLOBS MATCHED ZERO FILES AND THE ROW READ THAT
#    PERMANENT ZERO BACK AS A FACT ABOUT THE TREE ────────────────────────────────────────────────
#
# `crates/busbar-{mcp,a2a,voice}/src/unit/*` were written beside the llm glob on the assumption that
# `src/unit/` generalises across the planes. IT DOES NOT, AND THE GLOBS WERE WRONG ON THE DAY THEY
# LANDED. At ae307a648 — the commit that added them — `git ls-tree -d ae307a648 crates/busbar-mcp/src`
# already reported `mcp` and `tests` and no `unit`; `busbar-a2a` reported `a2a`; `busbar-voice`
# reported `bin`, `runtime`, `tests`, `topology`. `git log --all -- crates/busbar-mcp/src/unit`
# returns ZERO commits, and the same for a2a and voice: no such directory has ever existed in this
# repository. This was never a subject that MOVED and never a kind with no crate yet. It is a name
# that resolved to nothing from birth, and the comment it replaces ("their globs match nothing YET")
# is the sentence a scan over zero always invites somebody to write.
#
# WHAT THE ROW WAS ACTUALLY MISSING, AND WHY IT IS THIS WIDTH. `busbar-mcp`'s own crate docs say it
# holds BOTH halves — the codec in `src/codec/` and "the MCP plane ... ~18k lines" in `src/mcp/` —
# and `busbar-a2a` has the same shape in `src/a2a/`, because `busbar-mcp-codec` and
# `busbar-a2a-codec` DISSOLVED INTO THEM; see `[gate.plugin_kinds]`'s own note
# above, which records exactly that. So `crates/busbar-*-codec/src/*` kept matching the two codec
# crates that survive (llm, voice) and never went red when the other two folded into the very crates
# these globs were supposed to reach: the mcp and a2a codec halves have been unscanned since the
# fold. So the MCP and A2A globs now name their crate's whole `src`, which is what this rule's own
# `why` asks for ("a plane crate, the pure codec half it shed") and the same width
# `crates/busbar-plane-*/src/*` already uses for a plane crate. Both isolate to ZERO findings: that
# widening restores coverage the fold silently took away, and costs nothing.
#
# ── VOICE IS NOT MCP OR A2A. ITS GLOB WAS RE-SCOPED AGAIN, 2026-09-22 ───────────────────────────
#
# The same repoint handed `busbar-voice` its whole `src` in the same sentence, and THAT half was
# wrong. Not because the old `crates/busbar-voice/src/unit/*` was any better -- it never resolved
# either, and putting it back would restore the exact green-over-nothing this rule had just stopped
# printing -- but because voice's two in-scope halves ARE ALREADY SCANNED by the two wildcard globs
# above, and the half the widening actually added is not in scope at all:
#
#   * THE PLANE is `busbar-plane-streaming`, NOT `busbar-voice`. #18: the fourth plane is
#     STREAMING and `voice` is one dialect inside it. `qa/kind-isolation.toml` says it outright --
#     "`busbar-voice` is the retiring 1.5.x streams crate and `busbar-plane-streaming` is the plane
#     it [became]" -- `[gate.plugin_kinds].plane` above lists `crates/busbar-plane-streaming` as the
#     plane KIND, and `plane_crates` at the top of this file files `busbar-voice` under "LEGACY
#     ENGINE crates" with its own warning that "a reader must not take either as the plane kind".
#     `crates/busbar-plane-*/src/*` has always reached it.
#   * THE PURE CODEC HALF IT SHED is `busbar-voice-codec`, AND THAT CRATE STILL EXISTS. Unlike
#     `busbar-mcp-codec` and `busbar-a2a-codec` it was never folded back in, so the argument three
#     paragraphs up does not transfer: `crates/busbar-*-codec/src/*` has been matching it the whole
#     time. Its own crate doc states the split in this rule's exact words -- "`busbar-voice` held
#     two things behind one name: these codecs ... and the runtime that carries them over a live
#     socket."
#   * THE PLANE'S OWN UNIT MODULES do not exist here. `crates/busbar-voice/src` has no `unit/`
#     directory and never had one, which is why the original glob could not have matched.
#
# So what `crates/busbar-voice/src/*` added over those two globs was ONLY the ENGINE half -- the
# axum mount, the tokio session pump, the D2 metering lease, the telephony/WebRTC dial, and a
# conformance-harness BINARY. An engine is none of the three things the `why` scopes.
#
# MEASURED WITH ALL 113 COUNTED BY FILE, not sampled off the detail line -- which prints only the
# first 8 IN PATH ORDER, so `busbar-llm` and `src/bin/` are all a sample can ever show and the
# distribution reads as "it is nearly all the test binary". It is not:
#
#      44  crates/busbar-voice/src/runtime/metering.rs                   the D2 reserve/settle lease
#      36  crates/busbar-voice/src/bin/voice-conform.rs                  the conformance harness bin
#      14  crates/busbar-voice/src/runtime/voice_d2_billing_oracle.rs    a pinned billing oracle
#       6  crates/busbar-voice/src/mount.rs                              the axum mount
#       5  crates/busbar-voice/src/runtime/mod.rs
#       4  crates/busbar-voice/src/topology/mod.rs                       telephony / WebRTC
#       3  crates/busbar-voice/src/runtime/session.rs
#       1  crates/busbar-llm/src/unit/meter.rs                           `priced_from_ms` -- REAL
#
# The binary is 36 of 113, not the bulk. 112 of the 113 are the engine half, and the symbols are
# `cap_nanos` / `settled_nanos` / `fee_nanos` / `estimate_nanos` / `reserved_nanos` -- NANODOLLARS,
# as `metering.rs`'s own header says ("a reserve-then-settle lease over ALREADY-PRICED
# nanodollars"), not the time-sense `_nanos` this rule's `allowed_vocabulary` excuses. They are real
# money and real DEBT -- but they are not THIS row's debt. `plane-pricing-blindness`
# (`qa/plane-pricing-blindness.toml`) is the gate built to burn exactly them down, with a per-file
# ledger and a human-supplied reachability claim on every row; its own worked example row is
# `crates/busbar-voice/src/runtime/metering.rs`. Counting them a second time under a `max_hits = 0`
# with no burndown would not fix one of them. It would only bury the one finding this row can still
# see under 112 it cannot act on.
#
# ZERO of the 113 were in `crates/busbar-voice-codec/src` or `crates/busbar-plane-streaming/src`.
# Voice's plane and its codec are clean TODAY, and after this re-scope they are still SCANNED, so
# they cannot stop being clean quietly. PROVEN with a positive control in BOTH directions, each
# plant grepped back before the verdict was read: a `per_request_fee` planted in
# `crates/busbar-voice-codec/src/ir/usage.rs` is CAUGHT (1 -> 2), and the same symbol planted in
# `crates/busbar-voice/src/bin/voice-conform.rs` is NOT (1). Both plants were reverted.
#
# WHAT SURVIVES IS STILL RED, WHICH IS THE POINT. `crates/busbar-llm/src/unit/meter.rs:490`
# `priced_from_ms` is a plane-side unit module naming a price -- the field the parked
# two-money-reads recommendation proposes, landing on the plane side of the #43 line. It is NOT
# allowlisted and this row stays RED at 1.
#
# `busbar-llm` IS DELIBERATELY LEFT AT `src/unit/*`. That glob RESOLVES — it is not a dead name, and
# widening it to `crates/busbar-llm/src/*` would pull `src/engine/` into scope in the same edit that
# fixes a staleness defect. Adding unreviewed debt under cover of a repoint is the move this whole
# exercise exists to refuse; widening llm is a separate edit that owes its own review.
#
# `crates/busbar-*-codec/src/*` IS GONE (owner ruling R7, 2026-09-27, `BUSBAR-1.6.0.md` THE DESIGN, §9/#39: no
# `busbar-*-codec` crate). Unlike MCP/A2A's codec dissolution — which folded into the LEGACY ENGINE
# crate (`busbar-mcp/src`, `busbar-a2a/src`), a root this glob list already names on its own line —
# both remaining codecs (llm, voice) folded into their PLANE crate (`busbar-plane-llm`,
# `busbar-plane-streaming`), which `crates/busbar-plane-*/src/*` already covers whole. So there is no
# coverage gap to widen for: the glob would match zero directories and is struck rather than left to
# read that permanent zero back as a fact about the tree, which is the exact anti-pattern the
# 2026-09-22 repoint above this row already fixed once.
scope_globs = [
  "crates/busbar-plane-*/src/*",
  "crates/busbar-llm/src/unit/*",
  "crates/busbar-mcp/src/*",
  "crates/busbar-a2a/src/*",
]
# Each is matched as a whole word (an entry starting with `_` as a suffix), and judged against the
# WHOLE identifier it lands in, so the vocabulary below can excuse a word rather than a substring.
symbols = ["RateCard", "Pricer", "per_request_fee", "fee_cents", "price_", "priced",
           "CostHandle", "CostModel", "Nanos", "_nanos"]
# The words a plane MAY say, each because it carries no amount. See the `why` for the argument.
allowed_vocabulary = [
  "fee_count", "pricing_enabled", "cost_pricing_enabled", "is_unpriced", "cost_model_unpriced",
  "unpriced_message", "unpriced_classes", "Unpriced", "unpriced",
  "as_nanos", "elapsed_nanos", "monotonic_nanos", "latency_nanos",
]
# The cost crate and the cost host modules, named as module paths rather than as words.
#
# REPOINTED (item 377): two of the three entries were `busbar_core::cost::` and
# `busbar_core::plane_host::cost_host`, spellings of a crate `673ecdaaa` absorbed into busbar-kernel
# — so they matched no line in any crate and the module-path half of this ban was two-thirds dead,
# blind to the exact cost-host seam the `why` names. The rename is git's, not a judgement: that
# commit carries `R100 crates/{busbar-core => busbar-kernel}/src/cost.rs` and
# `R100 crates/{busbar-core => busbar-kernel}/src/plane_host/cost_host.rs`. Repointing adds NO
# finding on today's tree (the only `busbar_kernel::cost::` spellings in scope are in
# `crates/busbar-llm/src/unit/tests/meter.rs`, test code this rule skips); a planted
# `busbar_kernel::cost::CostAmount::of(usage)` in `crates/busbar-plane-llm/src/lib.rs` now counts
# (1 -> 2), where under the dead spelling it did not (1 -> 1).
forbidden_module_paths = ["busbar_kernel_ledger::cost::", "busbar_kernel::cost::", "busbar_kernel::plane_host::cost_host"]
# A manifest dependency is the same reach spelled where no source scan would see it.
forbidden_deps = ["busbar-kernel-ledger"]
max_hits = 0
# Reviewed per-file exceptions: file -> the symbols accepted there, the reason recorded here.
#
#   None stands: the destination guard (and its `priced` question) is the kernel's
#   (busbar-kernel-scope, re-exported by the kernel door).
[rules.plane-no-money.allowlist]

# ── 29. one-pricing-site ─────────────────────────────────────────────────────────────────────────
[rules.one-pricing-site]
why = """There is ONE place a unit is priced. The cost unit owns the card and the arithmetic; the \
composition root's meter and admission wiring is what calls it, once, with the usage the plane \
reported; the kernel's settle sites consume the amount that came back and mint a posting from it, \
and never derive one. Anywhere else that turns usage into money is a second pricing policy growing \
beside the first -- two answers to "what did this cost", diverging silently, with the ledger unable \
to say which one it recorded. The homes below are enumerated with a reason each rather than left to \
a path pattern, so adding a home is a reviewed edit. The second row is the same promise on the \
input side: a per-request fee read straight off a config or a card, outside the crate that owns the \
card, is a price derived where nobody can see it. busbar-core is on that reader list because it is \
the retiring 1.5.5 engine that still carries the legacy fee path; the list shortens as core empties, \
and never lengthens."""
scope_note = "production code only; a test may price whatever it likes to prove the arithmetic"
# The seam verb that turns reported usage into an amount. Definitions and `use` lines are not calls.
entry_verbs = ["cost_price_usage"]
# The cost unit's own pricing entry points, named as paths.
entry_path_patterns = ['busbar_kernel_ledger::cost::[A-Za-z0-9_:]*price', 'busbar_kernel_ledger::cost::apply_tier']
# THE ONE FUNCTION UNDER ANOTHER NAME (ARCHITECT ruling 2026-09-30). The patterns above see a
# NAME, and a one-line wrapper in the cost unit whose name lacks `price` (`fn f(entries: &[LedgerEntry],
# view) { price_in_view(entries, view)?.micros_i64() }`) would let a reader price beside the cost
# unit unseen. So the cost unit `wrapper_home` is read for SHAPE as well: a function
# there whose signature names one of `wrapper_inputs` (the one function's own input, the ledger
# slice) and whose body reaches a pricing entry (a call matching a pattern above, one of
# `wrapper_reaches`, or a wrapper already found) IS a pricing entry, whatever its name, and a call
# to it outside the homes is counted here. What a reader may call is a cost-unit read that takes
# the reader's OWN row and builds the slice itself, because then the projection (lane, fee lane,
# classes) and the price both live in the cost unit.
wrapper_home = "cost-unit"
wrapper_inputs = ["LedgerEntry"]
wrapper_reaches = ['(?<![A-Za-z0-9_])Tally::']
max_extra_sites = 0
# The fee fields, and the two crates that may read them. `per_request_fee` is the card's OWN
# spelling since the cost unit re-labelled `per_request_fee_cents` to it (the fee is carried in the
# currency's minor units, so `_cents` was a lie on any non-USD deployment). Without it on this list
# the rule went blind to exactly the thing it was written for: it would still have counted two
# offenders, but both name `fee_cents`, the config/substrate spelling, and NOT ONE read of the
# card's own fee anywhere in the workspace. The old spelling stays so a re-introduction of it is
# still caught.
fee_fields = ["per_request_fee", "per_request_fee_cents", "fee_cents"]
# busbar-core is DELETED (W4.a, 673ecdaaa) so it matches nothing any more and is dropped, per this
# row's own "the list shortens as core empties, and never lengthens" -- it emptied all the way.
# busbar-kernel and busbar-core-admin are ADDED: W4.a absorbed busbar-core's config/
# appbuild/cost fee-display code into busbar-kernel (crates/busbar-kernel/src/{appbuild.rs,cost.rs,
# config/{mod,migrate,overlay}.rs,config_validate/{mod,secret_refs}.rs,test_support/fixtures.rs} are
# ports of the identically-named busbar-core files -- `git show --stat 673ecdaaa` shows most as
# `{busbar-core => busbar-kernel}/src/….rs | 0`, i.e. pure renames with zero line changes), and
# cb2ba5df3 ("extract busbar-admin API service crate out of busbar-core, byte-identical") did the
# same for the admin handlers (every `per_request_fee` site there existed, same wording, in
# busbar-core's admin/v1/json/handlers.rs one commit earlier). Both are the fee DISPLAY/config path
# following the crate it moved into, same as busbar-core was on this list for.
#
# THE NAME WAS DEAD, AND A DEAD NAME UN-MADE THE ALLOWANCE. 2026-09-22. This key read
# "busbar-admin" until today, but #37 (92e823cd5 "fold the two admin crates into one
# busbar-core-admin", reference updates 93a0d9f3d) renamed the crate and touched NO qa/ config --
# `git show --stat 92e823cd5 -- qa/construction.toml` and the same for 93a0d9f3d are both empty.
# `fee_reader_crates` matches on the crate NAME, so from that commit the entry matched nothing and
# the recorded cb2ba5df3 allowance silently stopped applying: the row went to 9 findings, 5 of them
# the very handlers.rs sites this note argues are allowed. Repointed to `busbar-core-admin` -- and
# every one of those 5 was RE-ADJUDICATED against cb2ba5df3 first rather than restored on this
# note's say-so, because a summary is not the authority. handlers.rs:2604/2632/2633/2683 are
# character-identical to the authority commit except `busbar_core::` -> `busbar_kernel::` (the
# 673ecdaaa config move already blessed above), and :4052 is a byte-identical openapi `summary`
# string. NONE of the 5 computes a price: four are an overlay MERGE of an operator-supplied config
# value (`if per_request_fee.is_some() { base.per_request_fee = per_request_fee; }`) plus an
# exhaustive `per_request_fee: _` destructure, and the fifth is prose. busbar-core-admin has no
# other production reader -- its only other hits are 22 in src/tests/tests.rs, which this rule does
# not count -- so this repoint grants exactly the reviewed sites and nothing else. The general
# lesson, and it is the fifth of this shape found today: a rename that skips the qa/ tables does not
# merely stale a comment, it REVOKES a reviewed allowance in silence, and the gate cannot tell that
# from a genuine regression. (qa/kind-isolation.toml still names `busbar-admin` in 8 rows from the
# same miss -- out of scope for this key, reported separately.)
#
# ADJUDICATED 2026-09-22 AGAINST THE LAWS, AND THE VERDICT REVERSED: `busbar` (the composition
# root)'s crates/busbar/src/root/units_admin/mod.rs:1118,1149,1155,1247 read `per_request_fee`, and
# THE SCOPE OF THIS CHECK WAS THE DEFECT, not those four sites. The reads are granted below, by
# PATH and with a COUNT, and `max_fee_readers` STAYS 0 -- the ceiling did not move.
#
# THE CONFLICT THAT FORCED THE ADJUDICATION. This rule's OWN `why` opens "the composition root's
# meter and admission wiring is what calls it"; `[rules.one-pricing-site.allowed.root-wiring]` below
# grants `crates/busbar/src/root/` in so many words; and the sibling `plane-no-money`'s `why` says
# "Only busbar-kernel-ledger's cost module ... AND THE COMPOSITION ROOT'S METER/ADMISSION WIRING may
# name a price." Three sentences in this file permitted the root; one crate list forbade it. They
# cannot both be right, and the crate list is the one with no argument behind it -- it was never
# written as a ruling about the root, it is simply the only shape a crate list can take, because a
# crate list cannot say "this one reviewed file". The entry-verb half of this same rule had path
# homes from birth; the fee half never did, and that asymmetry -- not a decision -- is what kept the
# root out.
#
# WHAT THE FOUR SITES ARE, each read and judged on its own:
#   :1118  `obj.get("per_request_fee")` -> `Option<i64>`. PARSES the operator's JSON wire field.
#          The spelling is the operator's, fixed by #47 ("1.5.5's flat top-level `rate_card`/
#          `per_request_fee` load as the `pools` (llm) plane's reserved keys, byte-identical"). No
#          arithmetic, no card read, integer -- there is no f64 anywhere on the fee's own path.
#   :1149  `entries.is_empty() && per_request_fee.is_none()` -- a SHAPE REFUSAL. An amendment that
#          moves no figure is refused before anything is appended. Tests PRESENCE, uses no value.
#   :1155  `per_request_fee.unwrap_or(0)` handed as the third argument to
#          `RateCard::from_micro_rates_in`. THE RELAY the card crate itself asks for, in its own
#          words at `crates/busbar-kernel-ledger/src/cost/rate.rs` (`from_config`'s doc): "the two
#          configured figures a card is made of ... are read by their owner and handed straight
#          over; what is DONE with them is this crate's ... and the composition root's binding is a
#          relay with no arithmetic in it." The clamp (`.max(0)`) and the absent/present branch are
#          the card crate's, exactly as that doc requires. `unwrap_or(0)` is a default, not a
#          derivation, and it is the card crate's own convention -- `absent_in`/`from_config` take a
#          bare `i64` with no `Option`, so "no fee named" is 0 everywhere, not just here.
#   :1247  the STRING LITERAL `"per_request_fee"` in `canonical_amend_payload`'s fixed key list.
#          It reads no fee at all: it names the JSON key so the operator's detached ed25519
#          signature COVERS the fee. Deleting it to quiet a grep would take the fee outside the
#          signed payload -- a security regression bought with a green row.
#
# NONE of the four stores a price (#77(3)), writes a price into a durable book, computes money in
# binary floating point (#77(8)/#81), or prices against any card at all -- they never price. What
# they append is a CARD, into the dated history, which is the machinery #79 exists to describe.
#
# THE DECISION THAT DECIDES IT IS #79, AND IT NAMES THIS FILE. "A back-dated correction ... DOES
# reprice exactly the window `[effective_from, effective_until)` -- that is the sanctioned repair
# path ... it is an APPEND and a signed admin act, never an edit. Engine already exists and is
# reachable: `crates/busbar/src/root/kernel.rs:262` (`effective_from`), `:291` (window recompute),
# `root/units_admin/mod.rs:679` (signed back-dated entry)." CHECKED, not paraphrased: #79 was locked
# by 5caf5fea7 on 2026-09-22, FIVE DAYS AFTER D38 landed (54dbbdfcc, 2026-09-17), and
# `git show 5caf5fea7:crates/busbar/src/root/units_admin/mod.rs | sed -n 679p` is the doc line of
# `amend_rate_history_effect` -- the very function these four sites live in. A locked decision
# examined this code, five days after it was written, and named its path as the sanctioned engine.
# Part 2's own preamble: "a decision here is LAW and states the CURRENT truth ... Only Part 1 (the
# Laws) and Part 3 outrank this Part." A gate note does not.
#
# THE OLD NOTE'S ARGUMENT, AND WHY IT DOES NOT REACH. It cited "MONEY -- the enforcement book must
# stop storing a price": one money function `price(ledger_slice, card_history) -> Money`, `f`
# implemented ~20 times across 5 crates. That section is about the READ that turns COUNTS into
# MONEY. `amend_rate_history_effect` is not an implementation of `f` -- it takes no ledger slice,
# returns no `Money`, and performs no multiplication. It AUTHORS `card_history`, which is `f`'s
# second ARGUMENT. Consolidating `f` does not delete the verb that appends to the card history; the
# consolidated `f` cannot be written without one, because the same section requires "each posting
# prices against the card in force at its own `arrived_ms` (#79)". Counting the card's author as one
# of the ~20 pricing sites is a category error, and it is what kept this row red.
#
# AND PART 1, WHICH OUTRANKS EVERYTHING ELSE IN THIS FILE, DECIDES THE REMEDY: "The purity gates ...
# are servants of the vision, not the vision ... A gate that reds on that is SCOPED WRONG, and the
# fix is the gate's scope, not the code." Law 6 puts pricing in core -- "Core captures the
# quantities and prices them against the rate card the user registered" -- and #43 makes the card
# core-owned ("rate_card + fees are CORE-owned; plugins are PRICING-BLIND"). The composition root IS
# core. #42 governs the READ (card presence is the switch) and says nothing against authoring a
# card; #43/#71 make pricing a read-time view, and this file computes no view.
#
# WHY NOT `fee_reader_crates = [..., "busbar"]`. Because the old note is RIGHT about that much: a
# crate grant would launder the whole root -- `main.rs`, every `units_*.rs`, `money_book` -- in one
# unargued stroke, and it would contradict the root's own written discipline at
# `crates/busbar/src/root/kernel.rs` (`card_from_config`): "the flat figure crosses as a NEUTRAL
# minor-unit value; the cost unit's constructor is the one that reads it AS the per-request fee ...
# so no plane and no root file spells a fee -- the read lives where the card lives." That discipline
# is real and it still holds for every root file but this one. THE ONE EXCEPTION IS FORCED BY THE
# WIRE: an admin verb that accepts a correction must spell the operator's own field name to parse
# it and must spell it again to sign it (#47 fixes the spelling; the signature makes it
# load-bearing). So the grant is exactly one file, with the count it was reviewed at, and a fifth
# read in that same file is RED again.
fee_reader_crates = ["busbar-kernel-ledger", "busbar-kernel", "busbar-core-admin"]
max_fee_readers = 0

# The reviewed fee homes: a PATH, the COUNT it was reviewed at, and the reason. The count is half
# the grant -- a read above it is reported exactly like a read with no home at all -- and a home
# that falls to ZERO reads is reported too, because a grant that describes nothing is the dead name
# this file has been bitten by five times already: it stops applying in silence, and the next real
# read at that path inherits a waiver nobody reviewed.
[rules.one-pricing-site.fee_allowed.amend-rate-history]
path = "crates/busbar/src/root/units_admin/mod.rs"
max = 4
because = "#79 names this file as the engine of the signed back-dated correction and was locked five days after the code landed; the verb parses the operator's own `per_request_fee` wire field (#47 fixes that spelling), covers it with the operator's ed25519 signature, and relays it unchanged to `RateCard::from_micro_rates_in` -- it appends a CARD to the dated history and never derives, stores or computes a price"

[rules.one-pricing-site.allowed.cost-unit]
path = "crates/busbar-kernel-ledger/src/cost/"
because = "the cost unit IS the card; its own source names its own entry points"

[rules.one-pricing-site.allowed.root-wiring]
path = "crates/busbar/src/root/"
because = "the composition root's meter and admission wiring: the one place that hands the cost unit a unit's usage and takes an amount back"

[rules.one-pricing-site.allowed.kernel-exit]
path = "crates/busbar-kernel/src/teller.rs"
because = "the exit path settles the hold and mints the posting from an amount it was given; it derives none"

[rules.one-pricing-site.allowed.kernel-sweep]
path = "crates/busbar-kernel/src/tick.rs"
because = "the tick sweep is the second settle site, for a unit whose exit never ran"

[rules.one-pricing-site.allowed.kernel-recovery]
path = "crates/busbar-kernel/src/recovery.rs"
because = "recovery settles a hold a dead incarnation left open, from the journal's own figure"

# ── 30. legacy-reach ─────────────────────────────────────────────────────────────────────────────
[rules.legacy-reach]
why = """The composition root is the last place that still reaches into the retiring crates by name. \
Every distinct symbol it spells there is one more thing the deletion of those crates has to move, \
and the TOTAL over all of them is a ratchet: it may go DOWN and never up. Counted as DISTINCT \
symbols rather than lines, because moving one symbol's five call sites into a unit is real progress \
and merging two imports is not. Grouped `use` braces are expanded, so a reach does not appear to \
shrink when an import is folded. The llm engine's own unit modules are excluded from that plane's \
count: those are the plane step files the rebuild is moving TO, not the engine paths it is moving \
off. The red row lists the symbols it counted, so the work has a worklist and not just a number.

ONE RATCHET, NOT THREE. The count was per crate, and that measured the wrong thing. The cuts this \
rule exists to drive move a symbol off one retiring crate and, for a stretch, onto another: a core \
seam the kernel is taking over is spelled through the substrate on the way, which is one fewer \
`busbar_core::` name and one more `busbar_substrate::` one. Under per-crate ceilings that step is a \
RED row -- the gate calling a real cut a regression -- while the direction that actually matters, \
how much of the retiring surface the root names at all, went unmeasured. The total cannot be gamed \
by moving a name sideways, which is the only property the per-crate figures were ever asked for. \
They are kept as WARN sub-rows: they carry the worklist per crate, and a crate whose figure climbs \
while the total falls is that intermediate step, visible and not fatal."""
scope_globs = ["crates/busbar/src/root/*.rs", "crates/busbar/src/main.rs"]
# THE ONE GATING FIGURE: distinct symbols named through every prefix below, summed. Calibrated to
# the tree it was written against; it may only go down.
# item 381 (Q11/Q32, owner-signed 2026-09-24): the total gains the three live retiring engines the
# root still names by prefix (busbar_mcp 5, busbar_a2a 3, busbar_voice 12 distinct symbols) and
# loses busbar_core/busbar_substrate, both of which measure 0 hits forever (busbar_core is a
# deleted crate; busbar_substrate's root reach was already fully retired). 17 (busbar_llm,
# unchanged) + 5 + 3 + 12 = 37, the same root reach, now counted instead of a false zero. Pinned at
# TODAY's measurement on the committed tree (HEAD b091b4e83). Downward only from here.
# RATCHETED DOWN 15 -> 10, AT THE MEASUREMENT (K2f): eefc65fd7 deleted root/units_voice.rs, the last
# root file naming `busbar_voice::` (5 distinct symbols), so the busbar_voice figure below is 0.
# RATCHETED DOWN 10 -> 0, AT THE MEASUREMENT: the llm unit became the plane's only arrival path (K2h)
# and the root names no `busbar_llm::` engine path any more, so every prefix below measures 0.
ceiling = 0

[rules.legacy-reach.prefixes.busbar_llm]
prefix = "busbar_llm::"
# The plane's own unit modules are where the rebuilt steps live; they are not legacy engine reach.
exclude = ["busbar_llm::unit"]
because = "the llm engine's non-unit paths: arrival parsing, proto codecs, the stream translator"
figure = 0

[rules.legacy-reach.prefixes.busbar_mcp]
prefix = "busbar_mcp::"
exclude = []
because = "item 381 (Q11/Q32): the retiring mcp engine, the root still names by prefix"
figure = 0

[rules.legacy-reach.prefixes.busbar_a2a]
prefix = "busbar_a2a::"
exclude = []
because = "item 381 (Q11/Q32): the retiring a2a engine, the root still names by prefix"
figure = 0

[rules.legacy-reach.prefixes.busbar_voice]
prefix = "busbar_voice::"
exclude = []
because = "item 381 (Q11/Q32): the retiring voice engine, the root still names by prefix"
# RATCHETED DOWN 5 -> 0, AT THE MEASUREMENT (K2f, eefc65fd7: root/units_voice.rs deleted).
figure = 0

# ── 31. no-test-doubles-in-production ────────────────────────────────────────────────────────────
[rules.no-test-doubles-in-production]
why = """The composition root is where a node's real parts are chosen, and it is also where a \
stand-in is easiest to leave behind: a flat pricer, an all-pass chain of nothing, a shipper that \
drops what it is handed, a rows table that only remembers, a bindings value with no directory \
under it. Each of those is a legitimate value for SOME node -- a deployment with no `peers:` \
really does ship a null shipper -- and each is also exactly what a fixture reaches for, so the two \
are indistinguishable at the call site. They are not indistinguishable to a reader who went and \
looked, which is what this rule is: every one of these spellings on a production line of \
`crates/busbar/src` is either named here with a one-line reason, or it is a stand-in nobody \
reviewed and the gate says so. The second row is the worklist: of the sites that WERE reviewed, the \
ones the review found to be a test double in the shipped binary rather than the shipped node's own \
value. That count is a ratchet -- it may go down. Scanned over production lines only, because a \
double is what a test is FOR."""
scope_globs = ["crates/busbar/src/*"]
# The spellings. A stand-in is recognised by what it constructs, not by where it sits.
forbidden = [
  "Pricer::flat(",
  "AuthChain::new(Vec::new()",
  "NullShipper",
  "RecordingRows",
  "without_directory(",
]
max_unlisted = 0
# RATCHETED DOWN 5 -> 3, AT THE MEASUREMENT (K2f): the three main.rs `RecordingRows` sites remain.
max_doubles = 3

# THE REVIEWED SITES. `verdict = "real"` means the review found this to be the shipped node's own
# value at this composition — a null shipper on a node with no `peers:`, a memory-buffered book on a
# node that configured no data directory. `verdict = "double"` means the review found a fixture's
# value in the shipped binary, and those are counted by the second row so the owner sees them.
# K1 (2026-09-25): the five voice-calls-* sites are the same constructions, reviewed with the same
# verdicts, MOVED with `compose_voice_governed_calls` from main.rs into root/units_voice.rs (the root
# unit that composes the node) when the composition root stopped naming plugin crates. A path
# re-point, not a new review: the symbols, verdicts and reasons are unchanged and the doubles count
# is the same seven (the main.rs `RecordingRows` row stays for the two left in `compose_boot_book`).
# K2f: those five sites were deleted with root/units_voice.rs — the voice node they built
# is gone and the plane composes its governed-call table (no pricer, chain, journal or bindings) in
# its own crate — so their five rows are struck; the main.rs row stays.
# The main.rs half of the row above, kept: before K1 one `RecordingRows` row for main.rs covered the
# voice node's rows AND the two in `compose_boot_book`; the node's moved, the boot book's did not.
# BOOT-TAIL (TODO step 11): the boot book moved whole into root/boot.rs as stage 4 Book
# (`root::boot::compose_book`), so the row follows the same two sites there. A path re-point, not a
# new review: symbol, verdict and reason unchanged, and the doubles count is unchanged.
[rules.no-test-doubles-in-production.known_sites.voice-calls-rows-boot-book]
file = "crates/busbar/src/root/boot.rs"
symbol = "RecordingRows"
verdict = "double"
because = "the same node's rows: a recorder nothing reads, beside the node book the process already opened"

[rules.no-test-doubles-in-production.known_sites.bindings-constructor]
file = "crates/busbar/src/root/auth_bindings.rs"
symbol = "without_directory("
verdict = "real"
because = "this is where the unbound posture is declared; declaring it is not composing a node out of it"

[rules.no-test-doubles-in-production.known_sites.node-book-rows]
file = "crates/busbar/src/root/durability/mod.rs"
symbol = "RecordingRows"
verdict = "real"
because = "the one book a process settles onto keeps the previous release's rows, and a view reads that same value"

[rules.no-test-doubles-in-production.known_sites.node-book-shipper]
file = "crates/busbar/src/root/durability/mod.rs"
symbol = "NullShipper"
verdict = "real"
because = "no peer is configured, so shipping nowhere is what this node's journal really does"

[rules.no-test-doubles-in-production.known_sites.assembly-bindings]
file = "crates/busbar/src/root/kernel.rs"
symbol = "without_directory("
verdict = "real"
because = "the posture the assembly starts from; a boot with governance state binds the directory over it"

[rules.no-test-doubles-in-production.known_sites.admin-only-rows]
file = "crates/busbar/src/root/kernel.rs"
symbol = "RecordingRows"
verdict = "real"
because = "an admin-only node's two halves of one rows value, which is what its dual write and its views share"

[rules.no-test-doubles-in-production.known_sites.admin-only-shipper]
file = "crates/busbar/src/root/kernel.rs"
symbol = "NullShipper"
verdict = "real"
because = "an admin-only node ships its journal nowhere, which is the previous release's shape for it"

[rules.no-test-doubles-in-production.known_sites.assembly-chain]
file = "crates/busbar/src/root/kernel.rs"
symbol = "AuthChain::new(Vec::new()"
verdict = "real"
because = "the open door the assembly starts from, which the mount replaces with the deployment's own chain"

[rules.no-test-doubles-in-production.known_sites.legacy-rows-read]
file = "crates/busbar/src/root/units_admin/mod.rs"
symbol = "RecordingRows"
verdict = "real"
because = "the read half's impl on the previous release's rows type; an impl constructs nothing"

[rules.no-test-doubles-in-production.known_sites.harness-rows-alias]
file = "crates/busbar/src/root/harness.rs"
symbol = "RecordingRows"
verdict = "real"
because = "a type alias over the rows the loop posted, and a reader of it; the name is spelled, nothing is constructed"

# ------------------------------------------------------------------------------------------------
# [gate.census] — THE RATCHET ON THE RATCHETS
# ------------------------------------------------------------------------------------------------
#
# Nothing stopped a rule DELETED TOGETHER WITH THE TABLE THAT HOLDS IT, because the construction
# gate's owed-row register is derived from this very file: delete a `[rules.legacy-reach.prefixes.*]`
# table and the check and the obligation to run it vanish in the same edit. Measured, 2026-09-09,
# on the (since deleted) kernel-file LOC tables: the gate went from 112 rows to 111 and said nothing
# at all. `gate.plane_crates` and every `[gate.plugin_kinds]` glob have the same shape.
#
# So the COUNTS are pinned here, and `ceiling-census` is owed UNCONDITIONALLY — it is a literal in
# the gate's id list rather than something derived from this file, which is the property every other
# derived row lacks.
#
# EACH NUMBER IS A FLOOR, NOT AN EQUALITY. Adding a legacy prefix or a plane crate is
# the ordinary direction of this work and needs no ceremony here; REMOVING one is the manoeuvre, and
# `actual < pinned` is RED.
#
# AND THE FLOOR IS ITSELF PINNED AGAINST THE BASE. `ceiling-census` compares every number in this
# table against the base commit's copy, and a floor that WENT DOWN is RED (a key on the gate's named
# RETIRED_PINS list — `loc_ceilings_kernel_files`, deleted 2026-10-02 — is a subject that left the
# code, not a lowered floor). Without
# that half, deleting a rule table and dropping its census number in one edit would be exactly as
# silent as deleting the table alone was.
[gate.census]
legacy_reach_prefixes = 4
plane_crates = 4

# HOW MANY CRATE DIRECTORIES EACH KIND GLOB MATCHES.
#
# The failure this closes: `kind-isolation:truths` checks that a `[gate.plugin_kinds]` KEY exists,
# never that its globs still match the crates that exist. Narrow `crates/busbar-plane-*` to
# `crates/busbar-plane-llm` and the key is still present, still cross-checked in both directions,
# and four crates silently stop being scanned by manifest-allowlist, source-denylist and
# forbid-unsafe.
#
# A COUNT, NOT "AT LEAST ONE". A glob matching no directory today is the intended state for a kind
# with no crate yet, and a blanket "at least one" would red such a documented zero while still
# saying nothing about `plane` going from five crates to one. The count catches the narrowing and
# leaves an intended zero alone; the day a kind's first crate appears, its number is raised with it.
# `export` is the live example: both of its globs match no directory today (every export sink lives
# in its own repo), so the kind counts 0 — its documented zero in this repo, not a miscount.
#
# ── RE-PINNED 2026-09-22, AND EVERY DECREMENT NAMES ITS CAUSE ───────────────────────────────────
#
# This is the ceremony the rule above asks for. ADDING a kind crate needs none; REMOVING one is the
# manoeuvre, `actual < pinned` is RED, and a decrement with NO NAMED CAUSE is exactly what that RED
# exists to catch. Measured on this tree, 2026-09-22, by the globs exactly as they are written
# above — the number each glob ACTUALLY matches, not the number it ought to:
#
#   * `plane` 6 -> 5. TWO removals and one addition, netting one. `busbar-plane-voice` was FOLDED
#     into `busbar-plane-streaming` and its directory DELETED (#18/#83, fbead1a31) — the streaming
#     plane is the one plane. `crates/busbar-plane-admin` IS NOT IN THIS TREE and
#     `crates/busbar-core-admin` is: DECISIONS #3 excludes admin from the plugin kinds outright
#     ("admin & oauth2 are NOT plugins ... There is no `control` plugin kind"), so that list entry
#     had been naming a directory that does not exist, for a kind admin never was.
#     Against those two removals, `busbar-plane-decisions` was ADDED (#48, 2b2de9712): the fifth
#     plane, which had been in no kind list at all and which source-denylist therefore could not
#     see. DECISIONS #39 pins the roster — "planes = exactly 5 crates
#     `busbar-plane-{llm,mcp,a2a,streaming,decision}`" — the explicit list above names exactly
#     those five, and all five directories exist on this tree.
#   * `unit` 14 -> 1. The W2.c unit fold (2c9eddecf, "12 units -> 8 busbar-kernel-<name>"): the
#     glob `crates/busbar-unit-*` now matches exactly one directory,
#     `crates/busbar-unit-transport-key`. THE SAME LANDING IS ALREADY RE-PINNED TWICE IN THIS FILE
#     — `[rules.loc-ceilings].unit_total_ceiling` 14423 -> 268 and
#     `[rules.loc-ceilings].verbs_ceiling` 1431 -> 0, both on this date, both citing this fold —
#     and this row is its third figure, the one nobody re-pinned alongside the other two. The glob
#     is deliberately NOT repointed at `crates/busbar-kernel-*`: those eight are KERNEL crates,
#     held by `[rules.loc-ceilings]`, and moving them under a plugin-kind glob would run the unit
#     kind's rules over the kernel rather than restore a count.
#   * `unit` 1 -> STRUCK (fold F14 2/2). `crates/busbar-unit-transport-key` is DELETED: its
#     provisioning is `busbar-kernel-identity`'s `transport_key` module (#36: the TLS secret->config
#     provisioning is kernel-side machinery; #40: the tls plugin gets an opaque config handle). The
#     spec lists `unit` among the NOT-kinds, so the `[gate.plugin_kinds]` key and this pin go with
#     the kind kind-isolation retired in the same commit. A `busbar-unit-*` crate that comes back
#     is still refused by `[rules.no-unit-crates] unit_crate_glob`, armed at 0.
#   * `pure_auth` = 2 and `egress_auth` = 0 are STRUCK and `auth` = 2 takes their place. This is a
#     RENAME, not a decrement: LOCKED DECISION #3 makes auth ONE kind — inbound-verify and
#     outbound-sign are two OPERATIONS of it, direction is a usage mode — and `[gate.plugin_kinds]`
#     now carries a single `auth` key whose glob `crates/auth-*` matches the same two directories
#     (`crates/auth-admin-tokens`, `crates/auth-static-plugin`) that the split spelling claimed
#     between them. Neither struck key named a glob: both resolved to the empty list, which is how
#     `[rules.source-denylist].kinds` left the whole auth kind unscanned.
#   * `dialect` = 0 and `control` = 0 are STRUCK. Both are kinds DECISIONS #3 cancelled, neither
#     names a key in `[gate.plugin_kinds]`, and `ceiling-census` reds a pin naming no glob in
#     exactly the way a ceiling naming no row is red. NOTHING STOPS BEING COUNTED by striking them:
#     there was no glob under either key for the count to have been reading.
#
# ── RE-PINNED 2026-09-25: `transport` 7 -> 5, `secret` 2 -> 1 ────────────────────────────────────────────────
#
#   * `transport` 7 -> 5. The transport fold: `busbar-transport-grpc` folded into
#     `busbar-transport-http` as its `grpc` module and `busbar-transport-sse` as its `sse` module,
#     and both directories were deleted. `crates/busbar-transport-*`
#     now matches exactly five: http, stdio, tcp, tls and ws.
#
#   * `secret` 2 -> 1. The secret-reference fold: `crates/secret-ref` merged into `busbar-contract`
#     as its `secret_ref` module (the contract has one secret reference type), and its directory was
#     deleted. `crates/secret-*` now matches exactly one: `crates/secret-example-plugin`.
#
# ── RE-PINNED 2026-09-26: `secret` 1 -> 0 ───────────────────────────────────────────────────────────────────
#
#   * `secret` 1 -> 0. The fixture deletion (owner, docs/design/1.6.0-QUESTIONS.md "FIXTURES":
#     "these are trash … real plugins are the examples"): `crates/secret-example-plugin` was
#     deleted, and the secret kind is proven by the real plugin repo GetBusbar/busbar-secret-vault
#     (crates/plugin-loader/src/tests/plugin_proof_tests.rs, the removed ci.yml `plugin-proofs`).
#     `crates/secret-*` now matches no directory: the kind's documented zero in this repo.
#
# ── RE-PINNED 2026-09-26: `auth` 2 -> 1 ─────────────────────────────────────────────────────────────────────
#
#   * `auth` 2 -> 1. The fixture deletion (owner, docs/design/1.6.0-QUESTIONS.md "FIXTURES": "real
#     plugins are the examples"; ARCHITECT R-FIX2): `crates/auth-static-plugin` was deleted. The auth
#     kind's dropped-in proofs load the REAL token-verifying module GetBusbar/busbar-auth-oidc (pinned by
