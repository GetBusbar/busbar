# ── THE TARIFF: the chargeable-local face, and the schedule the kernel applies ────────────────────
#
# A transaction is a completed exchange with a destination OR a declared chargeable local service,
# and until now only the first of those was representable. A plane that answers out of its own state
# had two ways to be paid for it, both dishonest: claim an upstream leg it never dialled, or hand
# its work over for nothing. `CHARGEABLE_LOCAL` is the declaration that makes the second kind of
# transaction a thing a plane can say rather than a thing a leg has to fake — and it is a CONSTANT,
# because whether a plane's local work is a service somebody buys is a property of the kind and not
# of the request.
#
# Beside it, the kernel's `fee_count` becomes `charge`: one function, one site, a visit and a
# transaction counted separately, and the deployment's own schedule read at the only place a fee
# schedule could be read. It is 22 surface lines in teller.rs and none anywhere else in the kernel.

[[gate.ceiling_raises]]
key = "gate.surface_ceilings.contract_caps"
by = 1
because = "the chargeable-local face busbar_contract::plane::PlaneMeta::CHARGEABLE_LOCAL: one const on the plane declaration table, measured by scripts/loc-surface.py at 3510 -> 3511. It names no type — a bool — so the face adds a declaration and nothing a plugin author has to go and read. Without it a transaction can only be an exchange with an upstream, which makes a plane that serves locally either a liar about its destination or unpaid."

[[gate.ceiling_raises]]
key = "rules.loc-ceilings.caps_contract_ceiling"
by = 1
because = "the same face, busbar_contract::plane::PlaneMeta::CHARGEABLE_LOCAL, measured under the loc-ceilings rule's own surface count: one const line in crates/busbar-contract/src/plane.rs, no import added and no other file in the pair touched."

