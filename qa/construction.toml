# The surface ceilings from ARCHITECTURE.md section 1.1: what a PLUGIN AUTHOR has to read. These are
# owner decisions, not ratchets that drift upward with the tree — the gate reads them
# from here (rather than a literal in the rule table) purely so --selftest can also produce
# a green baseline value for a scratch copy; the checked-in numbers below never move except by the
# owner's own hand.
[gate.surface_ceilings]
# ── RE-BASELINED 2026-09-22 against `cargo xtask loc`, at HEAD 13a6c434f, 20:14Z ────────────────
#
# THE COUNTER UNDER BOTH ROWS CHANGED, AND THAT IS WHY THESE NUMBERS MOVED. Until this date the
# figure here was whatever `scripts/loc-surface.py` said, and that script excluded only the
# TOP-LEVEL `src/tests/`. Every `src/<module>/tests/**` tree — which is where this repository
# actually keeps its proofs — was billed as production surface: 192,813 lines of it across the
# workspace, more than the tree's entire real production code, so five crates read 48-77% test and
# NO per-crate ceiling had ever constrained production code. `busbar-contract` alone was counted at
# 8,443 against 6,659 lines of real code, the 1,784-line difference being `src/tests/records_tests.rs`
# and `src/caps/tests/**`. The script is deleted; `cargo xtask loc` is the only counter in the tree
# and `[rules.loc-ceilings]` below reads the same one, so the two rows of the pair can no longer
# disagree about what they measured.
#
# THE PAIR IS ONE NUMBER NOW, BECAUSE IT IS ONE MEASUREMENT. This file's own rule — "the two rows
# are ONE owner decision measured two ways" — was already being broken: the `busbar-grammar` fold
# (#40) raised `[rules.loc-ceilings].caps_contract_ceiling` by 414 and left this row alone, so the
# pair sat at 5,652 and 7,012 and a reader could not say which was the ruling. They were two
# COUNTERS, not two methods, and both counters are gone. `contract_caps` is therefore set to the
# standing owner decision, 5,652 — NOT to today's measurement, which is higher.
#
# ** THIS ROW IS RED, ON PURPOSE. busbar-contract measures 6,659 against 5,652: A 1,007-LINE **
# ** BREACH, REPORTED RATHER THAN RUBBER-STAMPED.** Pinning 6,659 here would ratify a thousand
# lines of #83 in-flight movement as though somebody had decided on it. The attributable pieces:
# `records.rs` (631) arrived in `crates/busbar-contract/src/` via 1059d3c36 when a bare `git add -A`
# swept a staged `git mv`; the rest is other 1.6.0 landings. More is owed to arrive under #83 —
# `api`'s plugin contracts (~727), `substrate-values`' `ir/*` (~508), `secret-ref` (~274),
# `media`/`billing`/`wire`/`lossless` (~198) — so this figure is a MEASUREMENT AT A DATE and not a
# settled state. Re-measure with `cargo xtask loc busbar-contract` before reading it as current.
contract_caps = 5652
# REPOINTED, and the repoint is what makes this row a gate again. It named the CRATE
# `busbar-grammar`, which #40 folded into `busbar-contract` and deleted — so it summed nothing,
# measured nothing and passed, which is this file's own "zero is not clean" failure sitting inside
# the gate's own table. The subject is now the file the crate became,
# `crates/busbar-contract/src/json_grammar.rs` (see the `SURFACE` table in
# `xtask/src/gates/construction.rs`), and the number CONFIRMS the identity: it measures 388, which
# is exactly the figure the crate carried. Unchanged, therefore, and gating for the first time since
# the fold. `grammar.rs` next to it is deliberately NOT the subject — that is the CLAIMS/SELECTOR
# grammar (390 lines), a different closed grammar and ordinary contract surface already spent
# against `contract_caps`. `docs/design/ARCHITECTURE.md` names all three files for this row; that
# list is wrong on `grammar.rs` and is the owner's to amend.
grammar = 388

# ── 1. one-attempt-seam ──────────────────────────────────────────────────────────────────────────
[rules.one-attempt-seam]
why = """Exactly one function in the workspace may send the egress request for a unit. Two twins \
(the pooled hot path and the degraded walk path) mean every fix to the attempt — a timeout arm, a \
breaker recording, a header rule — has to be made twice and is made once. The architecture's loop \
has one ROUTE step and one dispatch; the code should have one too."""
# The egress client's send verb: the call that turns an assembled request into an upstream
# round trip. Every occurrence in non-test code outside `allowed_function` is a finding.
send_verb = '\.client\(\)\.get\(\)\.request\('
# The seam moved from the pooled hot loop to `engine/attempt/mod.rs::attempt` when the degraded
# walk twin was deleted; the hot loop now calls `attempt()` too, so no extra site remains.
allowed_function = "attempt"
max_extra_sites = 0

# ── 2. request-path-fn-size ──────────────────────────────────────────────────────────────────────
[rules.request-path-fn-size]
why = """A function on the request path that runs to four figures of lines cannot be read whole, \
tested at its seams, or diffed with confidence. The loop is eight named steps; a function should \
be one of them, not all of them."""
files = [
  "crates/busbar-llm/src/engine/pipeline.rs",
  "crates/busbar-llm/src/engine/attempt/mod.rs",
  "crates/busbar-llm/src/engine/attempt/assemble.rs",
  "crates/busbar-llm/src/engine/attempt/send.rs",
  "crates/busbar-llm/src/engine/attempt/classify.rs",
  "crates/busbar-llm/src/engine/attempt/respond.rs",
  "crates/busbar-llm/src/engine/attempt/buffered.rs",
  "crates/busbar-llm/src/engine/exhaustion/mod.rs",
  "crates/busbar-llm/src/engine/exhaustion/queue.rs",
  "crates/busbar-llm/src/engine/exhaustion/fallback.rs",
  "crates/busbar-llm/src/engine/exhaustion/least_bad.rs",
  "crates/busbar-llm/src/native_ingress.rs",
  "crates/busbar-llm/src/arrival.rs",
  # busbar-core's ingress/admission moved into busbar-kernel when the crate was absorbed; re-pointed
  # here rather than dropped (see the crate's own `qa/construction.toml` history for the absorption).
  "crates/busbar-kernel/src/ingress/mod.rs",
  "crates/busbar-kernel/src/limits/admission.rs",
]
max_lines = 200
# How many of the worst offenders the report lists.
top = 10

# ── 3. ports-only / ports-only-tests ─────────────────────────────────────────────────────────────
[rules.ports-only]
why = """A plane crate talks to the kernel through the substrate/api ABI only. Every `busbar_core::` \
it names is a hole in that wall: the plane cannot be compiled out, cannot be replaced by a plugin, \
and breaks whenever core moves. This is the production residue, counted per crate."""
needle = "busbar_core::"
[rules.ports-only.max_per_crate]
busbar-llm = 0
busbar-mcp = 0
busbar-a2a = 0
busbar-voice = 0

[rules.ports-only-tests]
why = """The same reach from test code. Tests that name core internals pin the plane to core's \
private shape just as surely as production code does; they are reported separately so both \
counts can trend to zero at their own pace."""
[rules.ports-only-tests.max_per_crate]
busbar-llm = 0
busbar-mcp = 0
busbar-a2a = 0
busbar-voice = 0

# ── 4. no-uninstalled-seam ───────────────────────────────────────────────────────────────────────
[rules.no-uninstalled-seam]
why = """An installable seam (a substrate `install_*` / `set_*_factory` that fills a process-wide \
static) is a promise that boot fills it. A seam only the test kit installs is a seam production \
never fills — the stream-translator factory fault that made real streams pass through \
untranslated while every test was green."""
# BOTH HALVES of the substrate, AS THEY EXIST TODAY. The value families split into
# `busbar-substrate-values` so a plane's closure resolves no hyper/reqwest/tokio edge, and
# `install_protocols`, `install_stream_translator_factory` and `install_diagnostics` all went with
# them — that root is what keeps this rule reading the seams the fault it exists for actually
# lived in.
#
# THE ENGINE HALF IS `crates/busbar-kernel/src`, NOT `crates/busbar-substrate/src`. This row named
# the deleted path and therefore scanned a population of ZERO on that side — a ban over nothing,
# printing PASS. REPOINT, NOT A WIDENING, and the git evidence is rename-detection at 100%
# similarity rather than a judgement call: `5fa320208` ("W4.b P2: absorb busbar-substrate ENGINE
# into busbar-kernel; delete busbar-substrate") carries
# `R100 crates/busbar-substrate/src/rate_apply.rs -> crates/busbar-kernel/src/rate_apply.rs` and
# `R100 crates/busbar-substrate/src/ingress/arrival.rs -> crates/busbar-kernel/src/ingress/arrival.rs`,
# and `673ecdaaa` ("W4.a: absorb busbar-core INTO busbar-kernel") carries
# `R099 crates/busbar-core/src/plane/registry.rs -> crates/busbar-kernel/src/plane/registry.rs`.
# Measured at `5fa320208^`: `crates/busbar-substrate/src` held ELEVEN `pub fn install_*` seams and
# `crates/busbar-core/src` held SIX; all seventeen stand today under `crates/busbar-kernel/src` at
# the same relative path, nine of them at the SAME LINE NUMBER. The subject moved; the name did not.
seam_root = ["crates/busbar-kernel/src", "crates/busbar-substrate-values/src"]
seam_name_pattern = '^(install_[a-z0-9_]+|set_[a-z0-9_]+_factory)$'
# A file whose path contains one of these is NOT production and cannot count as an installer.
non_production_path_fragments = ["testkit", "test_support", "plugin-testkit", "fixtures.rs"]
# A seam DEFINED under the substrate's own test kit is a fixture install hook, never a production
# promise, so it is not counted at all.
exempt_seam_path_fragments = ["/testkit/", "/testkit.rs"]
max_uninstalled = 0

# ── 5. neutral-no-dialect ────────────────────────────────────────────────────────────────────────
[rules.neutral-no-dialect]
why = """The neutral crates (busbar-core, busbar-substrate, busbar-api) must not know a dialect or \
a plane by name. This rule is a thin delegation to `cargo xtask gate plane-purity`, which owns the \
scanner, the noun list and the frozen-wire allow-list; the construction gate only counts its \
DIALECT and KEY rows so there is one policy, not two."""
categories = ["DIALECT", "KEY"]
max_hits = 0

# ── 6. single-terminal ───────────────────────────────────────────────────────────────────────────
[rules.single-terminal]
why = """The request terminal is where a unit's end is sealed and posted once. Every extra caller \
is a second place the money can be counted, or not counted. The named wrappers are the only \
doors; anything else calling the terminal is a finding."""
terminal = "finish_inner"
allowed_callers = ["finish", "finish_admitted", "finish_rejected"]
max_extra_sites = 0

# ── 7. duplicate-dispatch (informational) ────────────────────────────────────────────────────────
[rules.duplicate-dispatch]
why = """How much of the two attempt twins is the same code. Informational (a WARN row, never a \
FAIL) until the twins are merged; then it becomes moot and the rule can be retired."""
informational = true
twins = ["forward_with_pool_parsed_inner", "forward_once"]
# A shared block must span at least this many source lines to be reported.
min_block_lines = 40
# Token-shingle width for the cheap similarity pass.
shingle_tokens = 12
top_pairs = 5
# Ceiling on total duplicated lines. Informational: shown in --summary, never enforced.
max_duplicated_lines = 0

# ── 8. token-sealed ──────────────────────────────────────────────────────────────────────────────
[rules.token-sealed]
why = """The Teller's decision, hold and posting tokens are what make the loop's order a matter of \
types rather than discipline: a step can only be answered with that step's token, a hold can only \
be opened by Admit, a posting can only be minted after Audit. Every one of those constructors takes \
a token, so a unit spelling Decision::proceed or Hold::open with its own token is the design working; \
the forgery surface is MINTING a token. That holds exactly as long as nothing outside the kernel can \
spell a token constructor. Every such spelling elsewhere is a forged token.

The same argument covers the kernel's own VALUE constructors, which are sealed on the same seal and \
were scanned by nothing at all until X-178: the request generation a proof is bound to, a unit's \
origin, its session, its replay-claim key, and the end that closes it. A forged generation makes a \
stray proof match any call; a forged origin is a plane claiming to be a tick and skipping the door. \
"Nobody spells it outside the kernel today" is the reason to write the rule down, not a reason to \
leave it out — a capability confined only by convention is confined until the first author who does \
not know the convention."""
patterns = ["Pass::mint(", "Grant::<WriteMoney>::mint(", "Grant::<Consumption>::mint(", "Grant::<Exit>::mint("]
# ── WIDENED 2026-09-23 (X-177): THIS ROW NAMED FOUR OF TWENTY MARKERS AND CALLED THAT "SEALED" ───
#
# `patterns` above is a list of LITERAL spellings, one per capability somebody happened to write
# down. But `Grant<C>::mint` and `Pass<S>::mint` are ONE GENERIC CONSTRUCTOR EACH (busbar-contract/
# src/caps/token.rs) over a SEALED marker set -- ten capabilities in caps/capability.rs, ten steps
# in caps/step.rs. A per-marker literal list is therefore stale the moment a marker is added, and
# this one was stale on arrival: measured on this tree, the literals reached four markers and left
# SIX CAPABILITIES (Dial, DurableWrite, KeyHandle, Sign, AdminVerb, Recover), the ENTIRE turbofish
# `Pass::<S>::mint(` form the kernel itself writes 31 times, the FULLY-QUALIFIED
# `Grant::<busbar_contract::caps::C>::mint(` form it writes 42 times, and `mint_bound` in a place
# no row of this gate looked at. A forged mint spelled any of those ways sat under a green row.
#
# `pattern_families` are REGEXES (not escaped literals) and they match the constructor FAMILY, so
# an eleventh capability is covered on the day it is declared rather than on the day somebody
# remembers this file. They are scanned with the same `allowed_root`, `exclude_files` and
# max_sites=0 ceiling; nothing here is loosened, and a site a literal and a family both reach is
# counted once.
pattern_families = [
  # The two generic constructors, in every spelling the tree actually uses: bare marker
  # (`Grant::<Dial>`), fully-qualified marker (`Grant::<busbar_contract::caps::Dial>`), and both
  # the unbound `mint(` and the call-bound `mint_bound(` (#74).
  '(?<![A-Za-z0-9_])Pass::<[^<>]*>::mint(_bound)?\(',
  '(?<![A-Za-z0-9_])Grant::<[^<>]*>::mint(_bound)?\(',
  # The inferred-marker spelling of the same two, which `patterns` covers only for `Pass::mint(`.
  '(?<![A-Za-z0-9_])(Pass|Grant)::mint_bound\(',
  '(?<![A-Za-z0-9_])Grant::mint\(',
  # QUALIFIED-PATH SYNTAX (X-178) — the fourth spelling X-177 NAMED as a gap and did not close.
  # `<Grant<Dial>>::mint(` writes the marker inside the type rather than after a turbofish `::`, so
  # it carries no `Grant::<` for the two families above to bite on and no bare `Grant::mint(`
  # either: measured against the pre-X-178 family set, `<Grant<Dial>>::mint(` and
  # `<Pass<Approve>>::mint_bound(` both scored ZERO. It is ordinary Rust and it is the last way left
  # to spell either generic constructor.
  '<(Grant|Pass)<[^<>]*>>::mint(_bound)?\(',
  # THE PRE-#73 TOKEN ZOO'S CONSTRUCTORS. These names are dead (caps/token.rs documents the
  # unification) and `cargo xtask gate seal-witness` bans the identifiers outright -- but this row
  # claims "the Teller's tokens are minted only inside the Teller", and a resurrected zoo
  # constructor called from outside the kernel is exactly that claim being false. Two rows holding
  # one property from two directions is the point; a name that only ONE row can see is not.
  # `AdmitToken::mint(` is deliberately absent: it belongs to the admit-token-mint sub-row below,
  # which is the row whose own claim text names it.
  '(?<![A-Za-z0-9_])(UnitToken|TrustToken|UsageToken|LedgerToken|DurabilityToken|EgressAuthToken|TransportKeyToken|AdminToken|RecoveryToken|ExitToken)::mint(_bound)?\(',
  # ── X-178: THE KERNEL'S OWN VALUE CONSTRUCTORS, WHICH NOTHING AT ALL SCANNED ──────────────────
  #
  # X-177 widened this row across the TOKEN family and left the kernel's other sealed constructors
  # where it found them: unscanned. A grep of qa/ and xtask/src/ returned ZERO for every symbol
  # below. Five of them take `&KernelSeal` exactly as `Grant`/`Pass` do (caps/token.rs:115,
  # caps/unit_end.rs:50/115/135) or the exit token (caps/unit_end.rs:223), so each is the same
  # forgery surface this row exists to close, and each was reachable from any crate in the tree by
  # writing one line. Measured on this tree with all six planted in an orphan module under
  # crates/busbar-llm/src, the pre-X-178 scanners scored ZERO hits and all three token-sealed rows
  # stood PASS.
  #
  # "There is no production site outside the kernel today" is the reason to write these down, not
  # a reason to skip them: a capability confined only by convention is confined until the first
  # agent who does not know the convention. The kernel owns the badge press (spec Part 0, #73 at
  # :413, hardened by #65 at :401) and a mint outside it must be impossible to spell.
  #
  # Each is a FAMILY, not a literal, for the same reason X-177's are: the optional `(?:…::)*` path
  # prefix covers the fully-qualified spelling (`busbar_contract::caps::SecretOnce::mint(` is
  # written today at crates/busbar/src/root/units_admin/tests/units_admin.rs:851), the `>?` covers
  # the qualified-path form `<UnitEnd>::seal(`, and `(_bound)?` covers the #74 call-bound variant
  # the day one of these grows it. A turbofish arm is deliberately absent HERE and only here: all
  # six types are non-generic (they carry a `u64`, a `[u8; 32]`, an `OriginKind`), so `T::<X>::seal(`
  # does not parse for any of them and an arm matching it would be an arm no tree can ever exercise.
  #
  # `SecretOnce::mint(` is deliberately absent from this list: its home is the VERBS unit, not the
  # kernel, so it belongs to the `secret-once-mint` sub-row below, which is the row that can state
  # its actual confinement. Same reason `AdmitToken::mint(` is absent.
  #
  # `CallId::seal(` mints the #74 generation `bound_to` compares, so a forged one makes a stray
  # proof match any call. `Origin::seal(`'s own doc gives the attack: "a plane that could claim to
  # be a tick could skip the door". `IdempotencyKey::mint(` is the replay-claim key and is ON THE
  # MONEY PATH — it has NO production site anywhere in this tree, which is the strongest possible
  # position from which to seal it, because the ceiling can be 0 with nothing to grandfather.
  '(?<![A-Za-z0-9_])(?:[A-Za-z0-9_]+::)*CallId>?::seal(_bound)?\(',
  '(?<![A-Za-z0-9_])(?:[A-Za-z0-9_]+::)*Origin>?::seal(_bound)?\(',
  '(?<![A-Za-z0-9_])(?:[A-Za-z0-9_]+::)*SessionId>?::mint(_bound)?\(',
  '(?<![A-Za-z0-9_])(?:[A-Za-z0-9_]+::)*IdempotencyKey>?::mint(_bound)?\(',
  '(?<![A-Za-z0-9_])(?:[A-Za-z0-9_]+::)*UnitEnd>?::seal(_bound)?\(',
]
allowed_root = "crates/busbar-kernel/src"
max_sites = 0
# ── THE BLANKET EXCLUSION IS STRUCK 2026-09-23. IT DID NOT SURVIVE, AND HERE IS WHY ─────────────
#
# It read `exclude_files = ["crates/busbar-contract/src/caps/fixtures/lint_rules.rs"]` and the
# argument beside it was that the file is "DATA, not surface": its literal token-constructor strings
# self-match this scanner. That argument is true about TWO LINES and the exclusion was written
# file-wide, so it stood over the whole file — and the file is not data on disk, it is
# `crates/busbar-contract/src/**.rs`, compiled into the shipped contract crate. A real forged mint
# written anywhere in it was invisible: the census planted one (`Grant::<Sign>::mint(`, appended)
# and the row stayed PASS.
#
# THE TWO SELF-MATCHES ARE NOW FINDINGS AND ARE REPORTED AS SUCH, zero-touch, with no plant needed:
# `lint_rules.rs:84` (`symbol: "Grant::<Recover>::mint("`) and `:93`
# (`symbol: "take(&Grant::<Exit>::mint("`). Both are exact matches for this rule's pattern set, both
# sit outside `allowed_root`, and the row was green about them.
#
# THEY ARE NOT SILENCED HERE. A per-line pragma would be the narrow shape (`plane-purity`'s
# frozen-wire carve-out is the model) but a pragma is a new permission, and permissions are the
# owner's. PARK, with the recommendation: move the rule-spec literals out of Rust source into a data
# file this gate does not walk, which removes the self-match instead of excusing it — a
# specification that is not compiled cannot be mistaken for a call site by anything.
#
# The key stays, empty, because an absent key and an empty list read the same to `list_of` and only
# one of them is a decision somebody made.
exclude_files = []
# Two more of the same shape, scoped to busbar-kernel (not busbar-substrate/src/teller, which is
# the pre-busbar-kernel path the `patterns` list above still ratchets against): `KernelSeal::
# acquire_for_kernel(` mints the one seal every token constructor needs, and the unit crates'
# OWN test modules call it directly to build sealed tokens for their tests (mirroring
# busbar-contract/src/caps/tests/mod.rs) -- allowed there because production_only test-classification already
# excludes them, never allowed from a unit's production src. `AdmitToken::mint(` is the in-flight
# table's arrival-hold constructor; `Kernel::admit_token()` (busbar-kernel/src/teller.rs) is its one
# named seam, so the mint itself should never be spelled anywhere else -- it is scanned only by the
# admit-token-mint sub-rule below, not by the `patterns` list above, so each seal-site symbol has
# exactly one scanner.
#
# THAT LAST SENTENCE WAS THE BUG (X-177). "Scanned only by the sub-rule, not by the patterns list"
# is a correct description of an intent and was a false description of the code: the sub-rule
# scanned `Grant::<Admittance>::mint\(` and NOTHING scanned the bare-marker variants, the
# fully-qualified variant, `mint_bound`, or the pre-#73 `AdmitToken::mint(` that the sub-row's own
# printed claim named. A symbol assigned to one mechanism and matched by neither is covered by
# neither, and the row said PASS about it. The patterns below are widened to the same family shape
# `pattern_families` above uses; `*_subject` is the text the row PRINTS, read from beside the
# pattern it describes so a claim can no longer name a symbol its scan cannot see.
kernel_seal_pattern = 'KernelSeal::acquire_for_kernel\('
kernel_seal_subject = "`KernelSeal::acquire_for_kernel(`"
admit_token_mint_pattern = '(?<![A-Za-z0-9_])(Grant::<([A-Za-z0-9_]+::)*Admittance>|AdmitToken)::mint(_bound)?\('
admit_token_mint_subject = "the arrival-hold mint (`Grant::<Admittance>::mint[_bound](`, and its pre-#73 name `AdmitToken::mint(`)"
kernel_root = "crates/busbar-kernel/src"
max_kernel_seal_sites = 0
max_admit_token_mint_sites = 0

# ── X-178: THE ONE SEALED CONSTRUCTOR WHOSE HOME IS NOT THE KERNEL ──────────────────────────────
#
# `SecretOnce::mint(` mints the placeholder for a credential a verb creates ONCE, at ONE declared
# location; if the encoded bytes do not carry the nonce exactly once at that location the unit fails
# and the mint is reversed. That is what stops a credential-minting verb leaking its output into a
# log, a fact, or a second copy of the response — so a forged mint is a second copy of a secret with
# nothing to reverse it.
#
# Its confinement is "Verbs unit only" (caps/egress.rs:149), NOT "kernel only", and it is the only
# one of the six that has a live production site: crates/busbar-core-admin/src/verbs.rs:285. That is
# why it gets a sub-row with `secret_once_root` rather than a `pattern_families` entry — the family
# list is judged against `allowed_root` (the kernel), which would stand this row RED on the single
# call the design REQUIRES. Greening that would need a waiver for a correct call, and a waiver for a
# correct call is how a gate learns to lie. The row that can state the real confinement is the row
# that gets to make the claim.
#
# TWO TYPES, ONE SPELLING — SAID OUT LOUD BECAUSE A TEXT SCANNER CANNOT SEE IT. There are two live
# `SecretOnce` types with two different `mint` signatures: `caps::egress::SecretOnce::mint(&Grant
# <AdminVerb>, nonce, unit, target)` (caps/egress.rs:150) and `dest::SecretOnce::mint(&dyn
# KernelSeal, nonce, target)` (dest.rs:379), both re-exported from the contract crate's root. This
# pattern matches BOTH, and that is correct rather than sloppy: both docs say the verbs unit is the
# only minter ("Verbs unit only"; "Verbs-unit-only; the seal is what says so"), so one home holds
# for both. `dest::SecretOnce::mint` has no production caller at all today.
secret_once_mint_pattern = '(?<![A-Za-z0-9_])(?:[A-Za-z0-9_]+::)*SecretOnce>?::mint(_bound)?\('
secret_once_mint_subject = "the one-time secret placeholder mint (`SecretOnce::mint(`, both the capability and the destination type of that name)"
secret_once_root = "crates/busbar-core-admin/src"
max_secret_once_mint_sites = 0

# ── 9. teller-step-order ─────────────────────────────────────────────────────────────────────────
[rules.teller-step-order]
why = """The loop is nine named steps in one fixed order, written once. The loop file is read as \
the loop plus the helpers it calls (the opener is synchronous, the runner is async), and the steps \
must appear once each in the canonical order; the session opener runs exactly the steps up to the \
door. Exactly one loop function may exist."""
# REPOINTED: busbar-substrate (and its teller/run.rs) was deleted in W4.b P2 (5fa320208, "absorb
# busbar-substrate ENGINE into busbar-kernel; delete busbar-substrate"); the Teller loop moved by
# identity to crates/busbar-kernel/src/teller.rs, which is what loc-ceilings:kernel:teller measures.
# Verified same loop: `run_unit`/`open_unit` and the nine-step canonical order
# (arrival/decode/authenticate/verify/approve/admit/route/meter/audit) are unchanged — `open_to_door`
# (the governance-to-door chain both the one-shot loop and the session opener share) still runs
# "arrival→decode→authenticate→verify→approve→admit, in the same order, minting the same tokens" per
# its own doc comment, `under_hold` still runs route then meter, and `terminal` still calls
# `units.audit(...)` last.
file = "crates/busbar-kernel/src/teller.rs"
loop_function = "run_unit"
opener_function = "open_unit"
door_step = "admit"
steps = ["arrival", "decode", "authenticate", "verify", "approve", "admit", "route", "meter", "audit"]
# A step counts only when dispatched off one of these receivers — the door driver's own `units`
# handle, spelled either bare or as the field `Blocking` wraps it in (`self.0`) for the Route leg.
# This is what keeps an unrelated same-named method (`HoldCell::admit`, called as `run.cell.admit(`)
# from textually colliding with the real `Units::admit` step: `cell` is not a step receiver.
step_receivers = ["units", "self.0"]
# Trait-object indirections the walker must follow by METHOD call, not just by bare call:
# `RouteAwait::route_leg` is invoked as `route.route_leg(...)`, and the one local impl of that trait
# (`Blocking`) is where the real `Units::route` step it forwards to (`self.0.route(...)`) lives —
# otherwise invisible to a scanner that only recurses into bare-call sites. `Abandoned::reached` is
# the same shape one step later: `run_unit_async`'s one await hands its outcome to
# `abandoned.reached(outcome)`, which is where the admitted path's `terminal(...)` (and so its
# `audit`) actually lives — the OTHER call to `terminal`, from the cell-rejected short-circuit arm
# next to it, is a bare call the walker already skips (see `preceded_by_fat_arrow` in rules.rs).
dispatch_methods = ["route_leg", "reached"]
# The one step a session opener runs AFTER its door, not just up to it: `open_unit` runs the SAME
# arrival→…→admit chain as the one-shot loop, THEN records the outcome (success or refusal) through
# the real `audit` step and returns — it never reaches `route` or `meter`, which have no Route leg or
# spend to meter in a session that has not opened its own reservation yet. Declaring that here, rather
# than pretending the opener stops dead at the door, is what keeps this rule from misreading the
# opener's own documented closing step as it running a step outside its territory.
opener_closing_step = "audit"
max_findings = 0

# ── WHAT AN ARM MAY LEGITIMATELY NOT RUN ────────────────────────────────────────────────────────
# The rule judges EVERY PATH through the loop on its own: the steps a path calls must appear in the
# canonical order, none twice, and a path may STOP early (that is a refusal) but may not walk PAST a
# step it never ran. These entries are the ONLY thing that excuses walking past one — a branch is
# not, by itself, an excuse. Each names the function whose body holds the branch, a substring of the
# arm's own pattern text, the steps that arm does not run, and WHY. An entry that matches no arm the
# walk reaches is itself a finding, so a refactor cannot leave a licence behind its arm.

[[rules.teller-step-order.arm_may_omit]]
function = "open_to_door"
arm = "Authenticated::Challenge"
steps = ["verify"]
why = """A challenge round has no principal and no destination set, so there is nothing for Verify \
to seal. Verify answers WHERE a unit may go FOR A NAMED PRINCIPAL and seals that answer with the \
trust grant Route and Meter consume; a round that dials nothing has nothing to seal, and recording \
the anonymous identity there would put an identity nobody established onto the unit's own record. \
The sealed set stays EMPTY, which every later seat already accepts. The arm still faces Approve \
(the hook-veto seat, an opinion about the exchange rather than about where it goes) and Admit (the \
door, where a frozen group and a disabled bucket are read), so the two POLICY seats are not \
skipped — only the one step that cannot apply to a round with no principal."""

[[rules.teller-step-order.arm_may_omit]]
function = "run_unit_async"
arm = "Some(outcome)"
steps = ["route", "meter"]
why = """The cell refused a second hold: the unit lost the race at the door and never reached the \
wire, so there is no Route leg to await and no spend to meter. It still ends where every admitted \
unit ends — `terminal`, and so the real `audit` step — which is exactly why this path has to be \
allowed to reach Audit without Route and Meter rather than pretended to stop at the door."""

[[rules.teller-step-order.arm_may_omit]]
function = "under_hold"
arm = "Err(refusal)"
steps = ["meter"]
why = """The Route leg refused, so there is no completed leg to meter. The refusal becomes the \
unit's outcome and the same terminal audit seals it; metering a leg that did not happen would post \
usage against nothing."""

# ── 10. one-teller-loop ──────────────────────────────────────────────────────────────────────────
[rules.one-teller-loop]
why = """Each plane enters the loop from one place, so a unit cannot be run twice or half-run. The \
legacy adapter (`run_gauntlet`) is the coexistence shim the planes migrate off one at a time; its \
call-site count is a ratchet the owner drives to zero and never loosens."""
loop_verb = "run_unit"
# REPOINTED alongside teller-step-order above: busbar-substrate/src/teller was a directory (run.rs
# plus siblings); the loop's file is now crates/busbar-kernel/src/teller.rs, directly under the
# crate's src/ rather than its own subdirectory, so the narrowest existing directory that still
# resolves the rule's own "does this root exist" check is the crate root. No production call site
# inside teller.rs calls `run_unit(` on itself today, so this exclusion is inert either way, and
# nothing outside busbar-kernel is exempted by widening it from the file to the crate: `planes`
# (the only crates this row can flag) never includes busbar-kernel.
loop_root = "crates/busbar-kernel/src"
max_callers_per_plane_crate = 1
legacy_verb = "run_gauntlet"
# Today: the LLM, MCP and A2A planes plus the host-seam adapter body. Down to 0 when the planes move.
max_legacy_sites = 4

# ── 11. no-response-escapes-audit ────────────────────────────────────────────────────────────────
[rules.no-response-escapes-audit]
why = """A plane's step files decide; only its Audit step answers. A function under the plane's \
step directory that returns a `Response` from anywhere but `audit.rs` is a way for a unit to end \
without being posted — the exact hole the loop exists to close."""
root = "crates/busbar-llm/src/unit"
allowed_files = ["audit.rs"]
max_escapes = 0

# ── 12. terminal-doors-in-audit-step ─────────────────────────────────────────────────────────────
[rules.terminal-doors-in-audit-step]
why = """The terminal doors (`finish_admitted` / `finish_rejected`) seal and post a unit. In the \
rebuilt plane they are called from its Audit step and nowhere else, so every unit is posted exactly \
once by the one step whose job that is. Red by design until that step exists: every call from the \
legacy ingress is a site the rebuild must move."""
crate = "busbar-llm"
doors = ["finish_admitted", "finish_rejected"]
allowed_file = "crates/busbar-llm/src/unit/audit.rs"
max_extra_sites = 0

# ── 13. one-pick-site ────────────────────────────────────────────────────────────────────────────
[rules.one-pick-site]
why = """The lane pick has two legitimate callers: the Route loop and the fallback-pool re-entry. \
A third is a second selection policy growing beside the first."""
verb = "pick_among"
max_sites = 2

# ── 14. loc-ceilings (ARCHITECTURE.md section 1.1) ─────────────────────────────────────────────────────────
[rules.loc-ceilings]
why = """The kernel stays small by construction, not by promise. section 1.1 gives one union ceiling, one \
per-crate ceiling for busbar-contract (with the folded caps module), one for the busbar-unit-* union (with a verbs \
sub-ceiling), and a NAMED per-file split of the kernel's own 8k. Counted BY CALL-GRAPH: a \
busbar-unit-* file the Teller loop reaches WITHOUT crossing a sealed unit-trait boundary spends \
kernel budget even though it lives in another crate — a kernel that stayed nominally small by \
pushing its loop body into an unsealed helper file next door would still be measured honestly here. \
The call-graph step is a CONSERVATIVE NAME-MATCH approximation, not a true call graph: it collects \
every identifier called directly from `teller_files` and counts any busbar-unit-* file that defines \
a same-named function, whether or not that call is actually reaching it (a same-named unrelated \
helper is over-counted, never under-counted) and without knowing whether the call crosses a sealed \
trait object (which the real rule says should NOT count). This is stated honestly so the number is \
read as "at most this many files could be in scope", not as a precise call graph. Counts the `code` bucket of \
`cargo xtask loc` and nothing else (owner decision): the five buckets are code/doc/comment/blank/ \
test, every line lands in exactly one, and `test` is a path with a `tests` or `benches` segment AT \
ANY DEPTH, a `tests.rs`/`*_tests.rs`, or the AST span of a `#[cfg(test)]` item. A proof table, \
fixture or data table in a test-classified path is a proof, not surface, and does not spend the \
ceiling -- which is what the rule always said and what the counter under it only started doing on \
2026-09-22, when `src/<module>/tests/**` stopped being billed as production. The `surface-ceiling:contract` row and this rule's own \
`loc-ceilings:caps-contract` row HAVE now converged, which is what the sentence they replace said \
was expected: both read `cargo xtask loc`, the single counter, so they measure the same crate the \
same way and carry the same figure. They stayed two rows on purpose -- one is the owner's ruling on \
what a PLUGIN AUTHOR reads, the other the kernel-budget arithmetic that feeds `union_ceiling` -- but \
they can no longer report two numbers for one crate, which they did for months (7,012 against \
5,652) because they were two COUNTERS wearing the words \"two methods\"."""
kernel_crate = "busbar-kernel"
# ── RE-BASELINED 2026-09-22, `cargo xtask loc`, HEAD 1d3d299fd, 20:58Z: 54623 -> 52950 ──────────
# LOWERED to what the crate measures, per `ceiling-slack`. Two things moved it. The kernel's own
# code shrank as #83 and the plane folds moved bodies out; and the COUNTER changed — this rule used
# to count lines itself, off the construction gate's tree scanner, which entered a test scope only
# for `#[cfg(test)] mod` and therefore spent kernel budget on every `#[cfg(test)] fn` and
# `#[cfg(test)] impl` body in the crate. It now reads `cargo xtask loc`, which takes the item span
# from the parse, and which is also the counter `[gate.surface_ceilings]` reads — one instrument,
# so the two rows of this file's pair cannot disagree about a measurement again.
kernel_ceiling = 52950
# `caps_crate = "busbar-caps"` WAS HERE AND IS STRUCK, 2026-09-22. The crate was folded into
# busbar-contract by 2c9eddecf ("W2.c: fold busbar-caps into busbar-contract"); its types live at
# `crates/busbar-contract/src/caps/`, whose own module header says "Folded from the former
# `busbar-caps` crate (#37/#38)". The row summed `crate_total("busbar-caps") + crate_total(
# "busbar-contract")` and printed `busbar-caps 0 + busbar-contract 6837 = 6837` — a name contributing
# a permanent zero to a sum, which is the shape that reads like a measured half.
#
# IT IS STRUCK RATHER THAN REPOINTED, AND THE ARITHMETIC IS UNCHANGED BY EITHER READING. There is
# nowhere to repoint it TO: the caps lines are already inside `contract_crate`, so naming
# busbar-contract twice would DOUBLE-COUNT the crate and invent 6837 lines of overage that do not
# exist. The measured total (6837), the ceiling (5652) and the row id (`loc-ceilings:caps-contract`,
# which `ceilings.rs` pins to `caps_contract_ceiling`) are all left exactly as they were, so this
# row remains RED by 1185 and nothing is re-baselined. The sibling row `surface-ceiling:contract`
# already words it this way — "the contract crate's plugin-visible surface (caps folded in,
# #37/#38)" — and the two now describe the same crate in the same terms.
contract_crate = "busbar-contract"
# RAISED 3480 -> 3545 for the upstream status table's contract face, pinned at what it MEASURES
# rather than at a round number above it: `ceiling-slack` says a ceiling above its measurement is
# room nobody voted for. What the 65 lines are — the one owner of the upstream status class and its
# disposition, which three crates had each declared — is written in the declared raise above. The
# next face comes with its own declared raise naming its own measured lines, never out of this one.
# RAISED AGAIN 3545 -> 5230: 2c9eddecf (W2.c, fold busbar-caps into busbar-contract) + b65fbfb83
# (DECISIONS #38, fold busbar-contract-transport into busbar-contract) both dissolve into this
# crate's src tree; busbar-caps is now empty (0). Pinned at today's measurement. See the declared
# raise above.
# RAISED AGAIN 5230 -> 5238: busbar-core-connsec (DECISIONS #40; then named busbar-core-transport,
# renamed by OWNER RULING R2 under #37) added the opaque
# `ConnectionSecurity` transport face to busbar-contract's src tree (~8 lines). busbar-caps stays
# empty (0). Pinned at today's measurement. See the declared raise above.
# ── HELD 2026-09-22 at 5652, AND RED: busbar-caps 0 + busbar-contract 6659 = 6659. ─────────────
# NOT raised to the measurement. The full reasoning, the attribution of the 1,007-line overage and
# the #83 moves still owed into this crate are written once, over `[gate.surface_ceilings]
# .contract_caps` above, which is now the SAME number read by the SAME counter — which is what this
# file's own rule ("the two rows are ONE owner decision measured two ways") has always asked for and
# what the `busbar-grammar` fold broke by raising this row 414 and not its pair. The 414 stands and
# is now the PAIR's, not this row's alone.
caps_contract_ceiling = 5652
unit_crate_glob = "busbar-unit-*"
# RE-KEYED on cherry-pick onto 143db6db6: this commit's own delta is -53 (two units stopped
# declaring their own copies), measured against whatever unit_total_ceiling read when the line was
# cut (14606, via the prior commit's context). By the time this pick lands here the running base
# (after the prior commit in this same pick sequence) is 14476, not 14606, because LK-ALL's landed
# commits independently moved it; re-applying the same -53 delta gives 14476 - 53 = 14423.
# ── RE-BASELINED 2026-09-22: 14423 -> 268. ─────────────────────────────────────────────────────
# This is not a tightening anybody has to pay for; it is the ratchet catching up with a landing
# nobody re-pinned. Twelve `busbar-unit-*` crates became eight `busbar-kernel-<name>` crates (W2.c,
# 2c9eddecf), and the glob `busbar-unit-*` now matches exactly ONE crate,
# `busbar-unit-transport-key`, at 268 lines. The ceiling had 14,155 lines of slack — room for the
# whole unit family to come back without a single row going red. Pinned at the measurement.
unit_total_ceiling = 268
# `verbs_crate` / `verbs_ceiling` ARE STRUCK (P1A-con, 1.6.0 Phase 1). They budgeted
# `busbar-unit-verbs` as a sub-ceiling of the unit union. OWNER-LOCKED DECISION #36 moved verb
# execution OUT of the unit set ("EXITS from the unit set: `verbs` -> `busbar-core-admin`"):
# 427cbe399 drained the crate into busbar-admin and 92e823cd5 folded that into busbar-core-admin, a
# cleanliness crate outside the kernel + contract + unit union this rule budgets. There is no
# subject to repoint the row at — core-admin as a whole is not "the verbs" — and a
# `busbar-unit-verbs` that reappeared would match `unit_crate_glob` and spend `unit_total_ceiling`
# (268, today's single unit crate) from its first line, so the ratchet the zero was kept for is
# already held by that row.
# ── RE-BASELINED 2026-09-22: 60545 -> 58870, AND RED, and red for exactly one reason. ──────────
# This row adds no growth of its own; it is the arithmetic of its three members, and it is set to
# the SUM OF THEIR CEILINGS rather than to what the union measures today:
#
#     52950 (kernel_ceiling) + 5652 (caps_contract_ceiling) + 268 (unit_total_ceiling) = 58870
#
# The union MEASURES 59,877 (52,950 + 6,659 + 268), so this row is red by 1,007 — which is the
# caps/contract breach above, and nothing else. That is deliberate. Setting this to 59,895 would
# have made the union green while one of its members was in breach, and the whole reason this row
# exists is that a union can be over while every part of it looks reasonable. A union ceiling moves
# WITH its members, per this file's own rule; it does not absorb their overage.
union_ceiling = 58870
# Files (by basename, wherever they sit under busbar-kernel/src) whose bodies seed the call-graph
# name-match: every identifier called from one of these files, that busbar-kernel does not itself
# define, is looked up by name against every busbar-unit-* file.
teller_files = ["teller.rs"]

[rules.loc-ceilings.kernel_files.teller]
label = "Teller loop"
patterns = ["teller.rs"]
# ── RE-BASELINED 2026-09-22 by `--write`, HEAD 1d3d299fd, 20:58Z: 667 -> 661, the measurement. ──
# READ THE DATE. This file moved under measurement three times in one afternoon on a shared
# checkout — 681, then 661, then 681, then 661 — because a change to the Teller loop is in flight
# while this is being written. 661 is the drained reading and it is what the row is pinned at, which
# means the in-flight growth will red this row when it lands. That is the ratchet working, not a
# mis-pin: a no-headroom ceiling exists precisely so the next line that grows the loop is the line
# that has to justify itself. Re-measure (`cargo xtask loc --per-file busbar-kernel`) before reading
# either number as current, and use `--write` to re-pin rather than editing by hand.
ceiling = 661

[rules.loc-ceilings.kernel_files.pump]
label = "pump/scheduler"
patterns = ["pump.rs"]
ceiling = 453

[rules.loc-ceilings.kernel_files.inflight]
label = "in-flight/sessions"
patterns = ["inflight.rs"]
# RE-BASELINED 2026-09-22: 575 -> 572, the measurement.
ceiling = 572

[rules.loc-ceilings.kernel_files.recovery]
label = "recovery"
patterns = ["recovery.rs"]
ceiling = 177

# `[rules.loc-ceilings.kernel_files.slice]` IS STRUCK (P1A-con, 1.6.0 Phase 1). `slice.rs` left
# the kernel in b544c8bbf ("slice+Millis ABI types -> busbar-contract (#38)", a pure `git mv` to
# `crates/busbar-contract/src/slice.rs`): SliceStore is implemented by the loader and consumed by
# the loop, so it is ABI (DECISIONS #38), and its lines are counted, whole, by
# `loc-ceilings:caps-contract`. A kernel-FILE row can only measure `busbar-kernel/src`; the one that
# stood here measured the empty set against 0 and the scan-set floor scored it RED, correctly. A
# `slice.rs` coming back into the kernel spends `kernel_ceiling` like any other kernel file.
# `[gate.census] loc_ceilings_kernel_files` goes 9 -> 8 in the same commit, and says so there.

[rules.loc-ceilings.kernel_files.registry]
label = "registry + generations"
patterns = ["registry.rs"]
# RE-BASELINED 2026-09-22: 887 -> 724, the measurement. The pattern still matches three files by
# basename — `registry.rs` 314, `plane/registry.rs` 389, `proto/registry.rs` 21 — and all three
# have drained since the ceiling was last pinned.
ceiling = 724

[rules.loc-ceilings.kernel_files.grammars]
label = "grammars incl. JSON span scanner"
patterns = ["grammar.rs"]
ceiling = 61

[rules.loc-ceilings.kernel_files.ticks]
# The file is `tick.rs`, singular, and always was. `ticks.rs`, `drain.rs` and `fleet.rs` matched no
# file in the tree, so this row measured the empty set and reported 0/500 -- a ceiling nothing
# spends is a ceiling that has been abolished rather than met. The drain and the fleet sweep are
# not separate files: they are two of the three jobs inside tick.rs, and the label says so.
#
# The ceiling is today's measurement, not the abolished 500: a ratchet, so the first line that
# grows this file is the line that has to justify itself.
label = "tick: session tick, node tick and the drain sweep"
patterns = ["tick.rs"]
ceiling = 193

# ── REPOINTED 2026-09-22, the same repair `ticks` above already had. ───────────────────────────
# Neither `arena.rs` nor `masking.rs` exists anywhere in the tree, so this row measured the empty
# set and reported 0/178: a named piece of the kernel's 8k budget that had been abolished rather
# than met, which is the failure `[gate.census]` and the `ticks` note were both written about. The
# arena did not go away — it was REPLACED. DECISIONS #41's per-call scratch pad is
# `crates/busbar-kernel/src/scratch.rs`, the one file in the workspace that names `bumpalo` (see
# the `bumpalo` entry in the root `Cargo.toml`, which says so in those words), and it is what an
# "arena" row is a budget for. Repointed there and pinned at its measurement, 109.
# MASKING HAS NO SINGLE FILE to repoint at — it is spread across `auth/`, `admin/` and `api.rs` —
# so the label drops it rather than claiming a subject this row does not measure. If the owner
# wants masking budgeted, it needs its own row and its own subject.
[rules.loc-ceilings.kernel_files.arena]
label = "arena: the per-call bump scratch pad (DECISIONS #41)"
patterns = ["scratch.rs"]
ceiling = 109

# ── 15. manifest-allowlist (ARCHITECTURE.md section 1.2) ────────────────────────────────────────────────────
[rules.manifest-allowlist]
why = """Core → plugin, never plugin → core. A plugin-kind crate (plane, store, auth, hook, export, \
secret) may name `busbar-contract` and the closed grammar it is written on (`busbar-grammar`) freely; \
every other workspace crate it names is either an \
automatic RED (busbar-kernel, a busbar-unit-*, another plane, a transport — the \
coupling the ABI exists to prevent, and no allow-list can excuse it) or must be on the reviewed \
list below, named once with its reason. Parsed out of every SHIPPED dependency table each crate \
declares — `[dependencies]`, `[build-dependencies]` and the per-target forms of both, with \
`package = "…"` and workspace renames resolved — through the one manifest reader (xtask \
`manifest::shipped_dep_names`). It read `[dependencies]` alone until 2026-09-09, on the stated \
ground that the other tables "never ship in the plugin binary": a `[target.'cfg(unix)'.dependencies]` \
entry ships in every Linux artifact this tree builds, and a red-team pass carried a whole plane into \
a transport through that table with every gate green. `[dev-dependencies]` is still out — a test \
edge is not a shipped edge, and it is scored on `kind-isolation:test-deps` instead of here. \
`cargo metadata` is \
consulted when present to widen the same check to transitive path/workspace deps, and skipped \
(noted, not failed) when cargo is unavailable, keeping this gate cargo-optional."""
# Every dependency a plugin-kind crate may name beyond busbar-contract, with the review recorded in
# the commit that added it: busbar-api / busbar-plugin-sdk are the 1.5.5-era loader ABI every
# example plugin still bridges through until it moves onto busbar-contract; busbar-grammar is the
# closed JSON span grammar the contract itself is written on and re-exports as `spans`, so naming it
# directly is naming a piece of the contract rather than reaching past it; the rest are ordinary
# third-party crates.
reviewed_allowlist = ["busbar-api", "busbar-plugin-sdk", "serde", "serde_json", "tracing", "async-trait", "bytes", "sonic-rs", "busbar-llm-codec", "busbar-voice-codec", "busbar-grammar"]
# busbar-llm-codec: the pure codec half of the split llm crate (no I/O in its closure); the plane adapts it.
# Per-crate additions beyond the global list above, each a one-line review.
[rules.manifest-allowlist.reviewed_extra]
# RETIRED 2026-09-08: store-example-plugin named busbar-store-memory, a sibling instance of its own
# kind, which PLUGIN-TREE.md §4 forbids without exception. The waiver is gone because the dependency
# is: the example now carries its own in-process backend (crates/store-example-plugin/src/ram.rs).
# Ratchet, NOT a review: each busbar-plane-* adapter names its own dialect's legacy engine crate
# (busbar-llm/-mcp/-a2a/-voice) for codecs only, read-only, no engine state crossing back — but
# those engine crates are ALSO named in gate.plane_crates, so this is structurally the exact "a
# plane names another plane" coupling section 1.2 forbids. Tracked here, not waved through, until
# docs/design/1.6.0-protocols-as-plugins.md's codec split lands and the dependency disappears.
# STALE — verified 2026-09-07: NONE of the four edges below exists at this commit. Every plane crate
# is exactly `busbar-contract` + its own codec and nothing else; the planes are the cleanest seam in
# the workspace. This ratchet describes a tree that no longer exists and tells a reader the coupling
# is still there. Delete it (PLUGIN-TREE.md section 9) — noted here, not done here, because a rule
# change is not this commit's business.
#
# REVIEWED 2026-09-09, and it is the first dependency this rule could see: the manifest reader read
# `[dependencies]` and nothing else, so a `[target.'cfg(unix)'.dependencies]` entry was invisible to
# it — and `cfg(unix)` is true on every runner and every shipped Linux artifact this tree builds, so
# what the narrowing excluded was a dependency that ships. `libc` here is the advisory whole-file
# `flock` FileStore takes around its read-modify-write (crates/store-example-plugin/src/lib.rs,
# FileLock), unix-only, in the fixture that models a fleet sharing one durable path.
store-example-plugin = ["libc"]
[rules.manifest-allowlist.known_red_deps]
busbar-plane-llm = ["busbar-llm"]
# busbar-plane-a2a HAS NO ROW, for the same reason busbar-plane-mcp lost its one: the codec fold
# left its manifest at `busbar-contract` plus two third-party crates, and it names no engine crate
# in either spelling. The edge that exists now runs the other way.
# busbar-plane-mcp HAS NO ROW: the codec fold left its manifest at `busbar-contract` + `busbar-api`
# + three third-party crates, and it names no engine crate in either spelling. The edge that exists
# now runs the other way — `busbar-mcp` reads the plane's wire dialect — which is the direction a
# plane's definition asks for and not a coupling this rule is about.
busbar-plane-streaming = ["busbar-voice"]

# ── 16. source-denylist (ARCHITECTURE.md section 1.2) ───────────────────────────────────────────────────────
[rules.source-denylist]
why = """The pure kinds (plane, hook, pure auth, egress-auth-scheme) do no I/O by construction: no \
socket, no file, no process, no OS handle, no environment read, no HTTP client. A plugin that opens \
one of these itself is a plugin the deadline/blocking-pool machinery around the I/O kinds was never \
built to bound. The allow-list is empty at hour 0, same as section 1.2 says; every entry added later names \
the exact crate and pattern reviewed."""
patterns = [
  'std::net', 'std::fs', 'std::process', 'std::os', 'std::env',
  'tokio::net', 'tokio::fs', 'tokio::process',
  'async_std', 'libc', 'reqwest', 'hyper',
]
# kinds scanned: plane, hook, auth (gate.plugin_kinds); store/secret/export are I/O kinds and are
# out of scope for this rule by design (section 1.2 exempts them). UNTIL 2026-09-22 THIS LINE READ
# `plane, hook, pure_auth, egress_auth`, in the present tense, and that is the defect below.
# `pure_auth`/`egress_auth` named NO key in [gate.plugin_kinds] -- both resolved to an EMPTY glob
# list, so the whole auth kind went unscanned. Proven, not inferred: `use std::net::TcpStream`
# planted in crates/auth-static-plugin/src/lib.rs scored `PASS denylist:hits`.
# The spelling is stale against LOCKED DECISION #3: auth is ONE kind -- inbound-verify and
# outbound-sign are two OPERATIONS of it, direction is a usage mode, and there is no separate
# egress-auth kind. The config still encoded a split the architecture cancelled.
kinds = ["plane", "hook", "auth"]
# Reviewed exceptions: crate -> list of patterns from above accepted for that crate, with the reason
# living in the commit that added it. Empty at hour 0.
[rules.source-denylist.allowlist]

# EDGE EXEMPTIONS — a ruling about an EDGE, keyed on `(dep, via)`, stated ONCE for the whole tree.
#
# This is NOT the per-crate waiver seam. `qa/denylist-allow.toml` answers "this CRATE may reach this
# offender"; an entry here answers "this EDGE is not what the ban above is about", for every pure
# kind at once, and it is the shape a decision takes when the same reasoning has been rediscovered
# crate by crate. Four `[[allow]]` rows carried one identical paragraph about `cpufeatures` before
# this table existed, two of them already red as stale, and enrolling the auth kind was about to
# mint a fifth and a sixth. A rule restated once per rediscovery is not a rule: it is the tree
# losing the ability to say what its own policy is.
#
# IT EXEMPTS THAT PATH ONLY, and that limit is the whole safety of it. An entry does not waive the
# offender — it waives reaching the offender THROUGH `via`. A crate that reaches the same `dep` by
# any other route is still a hit, computed by the same `find_bypass_path` walk a `via`-narrowed
# `[[allow]]` entry uses, so an exemption can never quietly disarm the ban it narrows.
#
# `symbols` is the EVIDENCE, and it is required: it enumerates every symbol the `via` crate takes
# from `dep`, so the claim "no I/O primitive is reachable through this edge" is a list a reviewer
# can check against the crate's source rather than an assertion. `reason` and `owner` are required
# for the same reason they are in `qa/denylist-allow.toml` — an entry missing any of the three
# refuses the whole run (`xtask/src/denylist.rs::edge_exemptions_of` panics).
#
# AND IT IS CHECKED BOTH WAYS, exactly as the waiver file is: an exemption that suppresses NO hit is
# RED (`denylist:stale-waivers`). An exemption nobody has to defend reads to the next reviewer as a
# live, reviewed fact about the tree, and after the edge is gone it is not a fact at all.
[[rules.source-denylist.edge_exemptions]]
dep = "libc"
via = "cpufeatures"
symbols = ["getauxval", "sysctlbyname"]
reason = "OWNER RULING 2026-09-22, docs/design/BUSBAR-1.6.0.md: cpufeatures -> libc is NOT an I/O reach. NEEDED, and it cannot be switched off: in sha2 0.10.9 cpufeatures is a TARGET-GATED hard dependency for aarch64, x86_64 and x86 -- every platform busbar ships on -- declared behind NO feature, so force-soft forces the software hash path and still leaves the edge resolved. RIGHT CRATE: it is RustCrypto's standard runtime detector for selecting hardware SHA acceleration. ENTIRE libc SURFACE, enumerated from its source and listed in `symbols` above: getauxval and sysctlbyname, plus the c_ulong/c_void type aliases. Two function calls, both CPU-capability queries. This rule's own `why` forbids a socket, a file, a process, an OS handle, an environment read and an HTTP client; a CPU-capability query is none of those six. SCOPE, load-bearing: this exempts THAT PATH ONLY -- a pure crate reaching libc by any OTHER route is still a hit, which is the per-crate waivers' own words (re-review if any other path to libc appears) kept as the rule. getrandom -> libc is explicitly NOT ruled on here: it is a different edge with a different argument (entropy drawn by the codec instead of arriving through Ctx) and it keeps its per-crate waiver in qa/denylist-allow.toml until someone rules on it."
owner = "owner, 2026-09-22"

# ── 17. lean-core (ARCHITECTURE.md section 1.3) ─────────────────────────────────────────────────────────────
[rules.lean-core]
why = """The kernel and the unit crates have no closed enum a plugin could need to extend, and no \
open-vocabulary word of their own: every dialect name and plane key is a runtime registration, never \
a literal a kernel or unit file compares against. This mechanically checks every string literal in \
busbar-kernel and busbar-unit-* against section 1.3's own pinned word list plus the dialect names it names \
by name in section 6 — the exact list the architecture text gives, not a guess at "the union of all \
registered keys" (that union only exists at runtime; approximating it with the pinned list is what \
the design's own doc-scan already does, so this rule reuses it rather than inventing a second one). \
A literal used in an `if kind == …` or `match` arm is still a string literal and is caught the same \
way."""
crates_kernel = ["busbar-kernel"]
crate_glob = "busbar-unit-*"
# section 6's dialect names + the section 1.3 pinned word list, verbatim.
words = [
  "anthropic", "openai", "responses", "gemini", "bedrock", "cohere", "mcp", "a2a", "voice",
  "chat", "completion", "prompt", "assistant", "agent", "realtime", "speech", "transcribe",
  "audio", "image", "embedding", "model", "tool call", "sampling", "mail", "message queue",
  "tunnel",
]
