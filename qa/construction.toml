# qa/construction.toml — thresholds for THE CONSTRUCTION GATE (cargo xtask gate construction).
#
# The shadow oracle proves the tree is user-correct. This file is the owner's dial for how well the
# tree is BUILT, measured against docs/design/ARCHITECTURE.md. Every rule below is a named invariant
# with a plain-language reason, a current-state threshold, and the one knob the owner tightens as the
# construction improves. Tightening is a one-line edit here; the gate script never restates a number.
#
# Every threshold is a ceiling: the rule fails when the measured value is ABOVE it. A rule at 0 is
# fully enforced. A rule sitting at today's count is a ratchet: it stops regression while the debt
# is paid down. Never loosen a value without saying why in the commit.

[gate]
# Where Rust source is scanned. Globs relative to the repo root; the composition-root bin
# (crates/busbar) is included on purpose because production installers live there.
scan_roots = ["crates/*/src"]
# The plane crates (the plugin side): one name per protocol plane, so each carries its own ceiling
# below. This is the ROW KEY list, not the whole source surface — see gate.plane_codec_crates.
#
# NOTE (PLUGIN-TREE.md): "plane" is defined TWICE in this file, disjointly. This list is the four
# LEGACY ENGINE crates; `gate.plugin_kinds.plane` below is the five `busbar-plane-*` crates, and the
# two lists share zero members. manifest-allowlist reads THIS one to decide what "a plane names
# another plane" means. The two collapse into one definition when the legacy engines are deleted;
# until then a reader must not take either as "the plane kind".
plane_crates = ["busbar-llm", "busbar-mcp", "busbar-a2a", "busbar-voice"]
# A file at one of these path fragments is TEST code (same rule the purity lint applies), in
# addition to any `#[cfg(test)] mod … { … }` block inside a production file.
# A bare `tests.rs` (Rust's `#[cfg(test)] mod tests;` file convention) is test code too.
test_path_fragments = ["/tests/", "_tests.rs", "_test.rs", "/tests.rs"]

# Directory globs (relative to the repo root) that name each PLUGIN KIND from ARCHITECTURE.md section 1.4.
# Shared by manifest-allowlist, source-denylist and forbid-unsafe so the kind boundaries are drawn
# once. A glob matching no directory today is fine (the kind has no crate yet) — every rule below
# treats an empty match list as nothing-to-check, not a failure.
#
# OWED, per docs/design/PLUGIN-TREE.md (normative for every kind boundary; owner rulings 2026-09-07,
# ARCHITECTURE.md Appendix A). These are notes for the gate agent, not changes:
#   * `dialect` is a KIND and has no row here. It lands as `crates/busbar-plane-*-*` once the codec
#     crates split; its manifest rule is the tightest in the tree — a `busbar-plane-<p>-<d>` crate's
#     only workspace dependencies are `busbar-contract` and `busbar-plane-<p>`.
#   * `loader` and `abi` are NOT kinds. They are TCB crates and belong in a separate `tcb_crates`
#     list; they are here only so they inherit the forbid-unsafe deny row, and counting them is how
#     this table reaches "10" with a set that is not the owner's ten.
#   * Kind membership is decided here by DIRECTORY GLOB, and `Plugin::kind()` — the declaration that
#     should be authoritative — is read by nothing. That is how `crates/secret-ref` (a SecretRef TYPE
#     crate, no Secret impl) is classified `secret`, and how `crates/hooks-ranking` is classified
#     `hook` by the directory name while implementing a busbar-api trait. Renaming the fifteen crate
#     directories to their existing `package.name` (PLUGIN-TREE.md section 7) makes these globs
#     correct by construction and is the cheap first half of kind-by-declaration.
[gate.plugin_kinds]
plane = ["crates/busbar-plane-*"]
# THE THREE KINDS THIS TABLE DID NOT NAME, added 2026-09-09. ARCHITECTURE.md's kind list is
# normative and names ten kinds plus the `unit` core row; this table named ten KEYS and three of the
# eleven were missing from it -- `dialect`, `unit` and `control`. `cargo xtask gate kind-isolation`
# cross-checked this table in ONE direction (a key here that maps onto no kind in its table was
# refused), so a kind the design states and this file does not mention was invisible to both.
# `kind-isolation:truths` compares the three vocabularies in both directions now.
#
# `dialect` has no crate yet: the pre-split dialects are the `*-codec` crates and the rename that
# splits them into `busbar-plane-<plane>-<dialect>` is what creates the first one. The glob is
# written for the shape it will have, and a kind whose glob matches nothing is a kind with no crate
# rather than a rule switched off -- which is exactly the case `kind-isolation:truths` now watches.
dialect = ["crates/busbar-plane-*-*"]
# `control` is the tenth kind (owner ruling 2026-09-08). Its one member is `busbar-plane-admin`,
# whose NAME says plane and which is not one; the R7 rename makes it `busbar-control-admin`. The
# declaration lives in qa/kind-isolation.toml's [[registered]] row, which is where PLUGIN-TREE.md
# has said it lives since it was written.
control = ["crates/busbar-control-*"]
unit = ["crates/busbar-unit-*"]
hook = ["crates/hook*"]
pure_auth = ["crates/auth-*"]
egress_auth = ["crates/egress-auth-*"]
secret = ["crates/secret-*"]
store = ["crates/store-*"]
export = ["crates/export-*"]
transport = ["crates/busbar-transport-*"]
loader = ["crates/plugin-loader"]
abi = ["crates/busbar-contract"]

# The OTHER half of each plane's sources. Every plane kept its I/O half under its own name and shed
# its pure half — the codecs, the record vocabularies, the duplex IR, the dialect grammars — into a
# `-codec` crate; scripts/plane-keys.sh's `plane_src_roots` names both halves for exactly that
# reason. A gate that scans sources rather than manifests and knows only the first half stops
# watching the bulk of the plane on the day of the split and still prints a green row, so the second
# half is named here and folded into its plane's ports-only rows.
#
# This is deliberately NOT `plane_crates`. That list also decides which dependency is a
# plane-names-another-plane RED in manifest-allowlist, and a plane naming its own pure codec half is
# the intended shape, already on that rule's reviewed list.
#
# OWED (PLUGIN-TREE.md, owner 2026-09-07): these four crates ARE the dialect kind, unnamed. They are
# the only shipping crate group with no `Kind` variant, no section 1.4 row, no stated contract and no
# ceiling. The 2026-09-06 decision to FOLD each codec into its plane is superseded: each codec SPLITS
# into `busbar-plane-<plane>-<dialect>` crates. Sequence, and the order matters — the llm DECLS order
# (anthropic, openai, gemini, bedrock, responses, cohere) is operator-visible and every metric-family
# index is a position in it, so pin it with an oracle boot cell BEFORE the split, then name the
# shared residue's destination, then split.
[gate.plane_codec_crates]
busbar-llm = ["busbar-llm-codec"]
busbar-mcp = ["busbar-mcp-codec"]
busbar-a2a = ["busbar-a2a-codec"]
busbar-voice = ["busbar-voice-codec"]

# ── DECLARED CEILING RAISES ──────────────────────────────────────────────────────────────────────
#
# `ceiling-rose` refuses any integer in this file or in qa/kind-isolation.toml that is higher than
# it is at this branch's base. A ratchet with NO route through it is a ratchet somebody edits the
# rule to get past, and there is one raise that is legitimate and cannot be avoided: the FIRST
# gating figure of a row that was not gating before.
#
# A declaration is not a waiver. It names the exact dotted path and BOTH numbers, so it describes
# one edit rather than a direction; it carries a reason long enough to be one; and it EXPIRES BY
# ITSELF, because the moment its commit lands the base carries the new number, the rise disappears,
# and an entry that describes no rise is refused as stale. It cannot be left behind, and it cannot
# cover the next raise of the same ceiling.

# NO ENTRY STANDS HERE TODAY, and an empty list is this mechanism working rather than resting.
# `rules.legacy-reach.prefixes.busbar_substrate.figure` carried the one-time 26 -> 47 calibration
# while the commit that needed it was in flight. That commit LANDED: the base now carries 47, the
# rise the row was written to excuse no longer exists, and `ceiling-rose` refused the declaration as
# stale -- which is the expiry working exactly as the paragraph above describes it. Striking it
# returns `construction` to its eight standing FAILs, none of which is about a ceiling.

# P1'S THREE ENTRIES HAVE EXPIRED BY THEMSELVES, and that is the paragraph above working rather
# than an omission here. The arena landed in the commits this line is stacked on, so at THIS
# branch's base `kernel_ceiling` already reads 5423, `union_ceiling` reads 23509 and
# `kernel_files.arena.ceiling` reads 222. The rises those three entries were written to excuse no
# longer exist, and `ceiling-rose` matches a declaration on BOTH numbers — so an entry re-stating
# P1's would be refused twice over: as the wrong pair, and as a declaration that describes no rise
# at this base. The arena row is not this landing's to raise, is not raised here, and its entry is
# struck exactly the way the `busbar_substrate` calibration above it was struck.
#
# THE RAISE THIS LANDING NEEDS, and it is one edit in two rows because two ceilings can see the
# same 114 lines. The per-unit record arrives: `busbar-kernel/src/record.rs`, the unit's own
# memory, the contract `Ctx` the loop builds ONCE per unit at its entry over one lease of that
# memory, the kind-neutral views bundle the ROOT fills, and the two facts Verify seals onto the
# unit — the verified set and the generation's key handle.
#
# WHAT IT BUYS, and why it is not a convenience. `Units`' twelve methods used to take six scalars.
# A step that needed anything the loop had already established had no way to reach it, so Route
# and Meter could not see the destinations Verify sealed AT ALL — and `walk()` indexes that set by
# destination id, which makes a re-derivation a different index space and a hop charged against a
# lane it was not sealed for. The set now travels on the unit, written once under the same
# `TrustToken` the step sealed it with, and Approve and Admit stop taking it as a parameter.
#
# WHY THE KERNEL AND NOT THE CONTRACT. The record is the loop's own value. `busbar-caps` +
# `busbar-contract` is measured as what a PLUGIN AUTHOR has to read, and what an author reads here
# is `Ctx`, `ConfigView`, `SessionView`, `TransportView` and `Labels` — every one of which the
# contract already declared and none of which changes. `caps_contract_ceiling` does NOT move, and
# the design's own figure for `busbar-kernel` — 8k — is unchanged and still holds.
#
# WHAT IT COST THE FILE THAT WAS ALREADY PINNED: nothing. `teller.rs` is 606 -> 605, DOWN, and the
# row below is re-pinned to today's measurement rather than left with a line of slack. The six
# scalars' readers MOVED by identity onto the record's accessors, and the principal that was being
# threaded through two closures alongside the destinations stopped being threaded the moment the
# thing beside it lived on the unit.
#
# WHY A NEW PER-FILE ROW RATHER THAN A WIDER TELLER ONE: section 1.1 gives a NAMED per-file split
# of the kernel's 8k, and a file with no row is a file with no pin. The record is named inside the
# Teller loop's own 1.5k in that section -- amended in the same commit -- and pinned here on its
# own row, so the loop and the record can each be read against their own measurement instead of one
# number covering both. It is a first measurement: the key does not exist at the base, so there is
# no rise for it to declare.
#
# THE RAISES THIS LANDING NEEDS. Ten rows, because ten ceilings can see one landing: the routed
# body becomes a HANDLE the kernel holds under the unit's hold, and the Meter step reads what the
# stream carried off it instead of a plane re-deriving a count from a body that is already gone.
# Every one is a DELTA from the tip this line is stacked on, which is what the paragraph above says
# a stacked declaration is: the arena row is P1's and the record's 114 is P2's, both already at the
# base, and neither is re-stated here.
#
# WHAT LANDED.
#
# **The body, named and never carried.** `busbar-caps` gains `BodyLease` — a lease number, the same
# shape and for the same reason as the `TransportKeyHandle` beside it — plus `Completion` and
# `CompletedUnits`, which are what a finished stream carried: frames, bytes, and the tariff's
# `units` noun against each class the plane declared. Quantities against declared keys and NEVER an
# amount, so `plane-no-money` stays green by construction.
#
# **The hold, on the record, released by the exit.** `record.rs` gains the lease slot, the
# completion slot and the released flag, with `hold_body`/`body_finished` sealed by the Route token
# and `release_body` sealed by the exit's. `completion()` answers `None` once the hold is released,
# which is what makes "the meter ran before the exit" a fact the type carries rather than an
# ordering a reader has to check. `teller.rs` pays two lines for the two release sites — the exit
# path and the child's terminal — and that is the WHOLE of the loop's change: the Meter step needed
# no new argument, because the record it was already lent is where the body now is.
#
# **The outcome widened.** `busbar-unit-egress`'s `Delivered` gains `body` and `carried`. The egress
# unit says of itself that it reads no body, and this is the moment that claim could have been
# broken: the obvious way to let a meter read a body is to hand it the body. It is handed a lease
# and a count instead, counted from `FrameMeta::bytes` as the frames go past, so the unit still
# never parses an answer.
#
# **The per-frame re-lease.** `UnitMemory::lease` is once-per-unit BY TYPE — it takes the memory's
# own lifetime parameter — which is right for a one-shot unit and leaves a relay with no call to
# make. `UnitMemory::relay` is the second constructor: the frame owns the frame's span table, the
# unit owns the bytes, and the cursor goes back to zero over the same allocation. Two frames, one
# 4 KiB, and `tests/arena_reuse.rs` measures it.
#
# WHY THE KERNEL AND NOT A PLANE, and why caps and not the contract. Nothing above names a plane, a
# dialect or a protocol: a lease is a number, a completion is a count against a key the PLANE
# declared, and the kernel calls `&dyn Plane`. `BodyHold` as a separate type was drafted into
# `busbar-caps` and taken back out again — the hold is the loop's own value, exactly as the arena is
# the loop's memory, so it is folded onto the record and measured against the kernel's ceiling. What
# stayed in caps is only what BOTH the kernel and the egress unit have to name, which is the lease
# and the completion.
#
# WHAT LEGACY THIS DELETES, AND WHY NOT YET. Zero busbar-llm lines, and the design says so: the tap
# (`engine/response_body.rs` 998, `engine/usage.rs` 209, `unit/meter.rs` 558 — 1,765 lines) exists
# because the figure arrives after the unit ends, and it stops being reachable when the fee and the
# quantity move onto the kernel's reading at P6 and P10, not here. P4 is what those two landings
# need underneath them: until the outcome carries a completion there is nothing for `located: None`
# to become. So this landing is net-POSITIVE on the tree by the figures below, and it is the last
# one in this sequence that is — P5 gates the fee, P6 deletes `unit/meter.rs:371` and the dual
# book's `fee_count`, and P10 takes the engine walk with it. Recorded here rather than claimed as
# net-negative, because a raise that borrows against a deletion in another commit is a raise with
# nothing under it.
#
# THE SURFACE FIGURE MOVES AND section 1.1 IS AMENDED IN THE SAME COMMIT. `busbar-caps` +
# `busbar-contract` measured 3478 of plugin-visible surface against the design's 3.5k; it measures
# 3539 now, which is past that figure, so section 1.1's own number is amended to 3.6k rather than
# left reading a ceiling the tree is over. The Teller loop's 1.5k does not move; its parenthetical
# gains the body, because a row that lists what the loop holds and omits the one thing it now holds
# across a step boundary is a row that has stopped describing the loop.
[gate.ceiling_raises."rules.loc-ceilings.kernel_ceiling"]
from = 5595
to = 5631
because = """CHAIN FORM: 5595 is P3's tip, not this branch's base — a stacked line declares its own delta and the rows beneath it declared theirs. +36, all of it one shape: the kernel's settlement evidence stops carrying ONE quantity against ONE class and carries what a unit spent PER DIMENSION THE PLANE DECLARED. A dimension is not a kernel word — `MeterClassDecl` is plane data and the declarations are not one line each, four on the model plane, seven-plus on the streaming plane, two on the tool plane, one on the agent plane, none on the control plane — so a kernel that settled one number was a kernel deciding what a plane declares, and it is the join that threw three of the model plane's four numbers away before anything could price them. `settle_amount` becomes `settle_lines` and answers with one line per key; the seven rows are neither reordered nor rewritten, and the two that post what a DESTINATION reported now post all of it. +34 in `teller.rs` and +2 in `recovery.rs`, which is the same shape seen twice; `record.rs` does NOT move, because the completion was already on it — P4 put it there and nothing until now could read more than one number of it."""

