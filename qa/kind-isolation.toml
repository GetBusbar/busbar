# ------------------------------------------------------------------------------------------------
# [[face]] — A CRATE THAT IMPLEMENTS ANOTHER KIND'S ENTRY FACE, AT ITS EXACT COUNT
# ------------------------------------------------------------------------------------------------
#
# A crate's KIND is a claim about what it is; a trait implementation is the same claim made to the
# COMPILER. When the two disagree the compiler's is the one that runs — `impl Plane for Wire` inside
# a transport is a plane, registered as a plane, reached as a plane, whatever the manifest says.
# `kind-isolation:shape` counts a crate's implementations of its OWN kind's face, so a red team's
# `impl Plane for Wire` in a transport and `impl Transport for P` in a plane left that row
# byte-identical in both directions: it never asked whether a crate implements SOMEBODY ELSE'S face.
#
# Four crates do today. Each row is the exact number, exact in both directions, with the line that
# deletes it. The SHIP twin owes zero: at the tag there is no such thing as a reviewed one.
#
#   crate — the package that implements it.
#   face  — the entry trait of a kind that is not its own.
#   count — TODAY'S MEASURED NUMBER of implementations in shipped source, exactly.
#   cite  — the clause, or the words that say none does.
#   why   — what the number is made of.
#   drain — the line that deletes it.

