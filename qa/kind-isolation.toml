# qa/kind-isolation.toml — THE TWO TABLES `kind-isolation` READS OFF DISK RATHER THAN OUT OF CODE.
#
# The kind table itself stays in `xtask/src/gates/kind_isolation.rs`, because it is the RULE. What
# lives here is the two things that are TRUE OF THIS WEEK and false of the ship sha: the edges the
# legacy drain is allowed to carry while it drains, and the crates that are landing right now.
# Neither is a rule, both must be re-read by a human, and both must be EMPTY before the tag.
#
# Owner ruling, 2026-09-08: "while busbar-core drains, it MAY depend on unit crates … the row must
# be a NAMED TRANSITIONAL EXEMPTION that is empty on the ship sha."
#
# ------------------------------------------------------------------------------------------------
# [[transitional]] — THE LEGACY DRAIN, EDGE BY EDGE
# ------------------------------------------------------------------------------------------------
#
# A legacy crate (`busbar-core`, `busbar-llm`, `busbar-mcp`, `busbar-a2a`, `busbar-voice`) is
# draining INTO the new plugin kinds. That drain is what makes a `legacy -> unit` or
# `legacy -> plane` edge appear, and for the duration of the drain those edges are expected rather
# than catastrophic. They are NOT, however, unremarkable: an unlisted one is indistinguishable from
# the fusion this gate exists to refuse, so `kind-isolation:deps` accepts a legacy edge into a
# unit/plane/dialect/transport ONLY if a row below names it.
#
#   from    — must be a LEGACY crate. A row naming any other source crate is REFUSED AT LOAD: this
#             table is the drain's exemption and nothing else, and a non-legacy source reaching a
#             unit or a plane through it would be the ruling being edited rather than applied.
#   to      — an exact crate name, or a `prefix*` glob for a family the drain lands one member at a
#             time (`busbar-unit-*`: audit and scope exist on branches, auth and cost are coming).
#   reason  — why the edge is transitional rather than permanent.
#
# EXPIRY. The row's expiry is not "the edge went away" — the drain lands edge by edge, on branch
# after branch, and a row scored dead the week its edge is between branches would teach everyone to
# delete the ratchet. The expiry is the SHIP SHA: `kind-isolation-ship` (the DONE oracle) is RED for
# any row here whose `from` crate STILL EXISTS. A legacy crate that survives to the tag is the
# retirement having failed, and this row is where that is reported, by name.

# `busbar-voice` is the retiring 1.5.x streams crate and `busbar-plane-streaming` is the plane it
# is draining into (`busbar-plane-voice` was deleted into it, #18/#83). The rule is written about
# the drain, not about any one crate, so this edge is named on exactly the same terms — leaving
# it out would have meant a rule that only sees the drain the ruling happened to mention.
[[transitional]]
from = "busbar-voice"
to = "busbar-plane-streaming"
reason = "legacy drain"

# The A2A and MCP planes were folded out of busbar-core the same way (W4.a/W4.b, 1.6.0): each
# retiring plane names the plane-host half it is draining its transport/routing surface into.
# `busbar-plane-a2a-host` is GONE (folded back into `busbar-a2a`, 858c93966). The drain it named
# continued past it: `busbar-a2a-codec` dissolved (#39 — no `busbar-*-codec` crate) and its WIRE
# DIALECT went where definition 16-20 puts a protocol's dialect, into the plane crate. The engine
# reads that dialect rather than restating it, which is this edge. Same retirement, one crate on.
[[transitional]]
from = "busbar-a2a"
to = "busbar-plane-a2a"
reason = "legacy drain: the A2A wire dialect folded into the plane crate and the retiring engine reads it"

# `busbar-plane-mcp-host` is GONE (folded back into `busbar-mcp`, f6561224b). The drain it named
# continued past it: `busbar-mcp-codec` dissolved (#39 — no `busbar-*-codec` crate) and its WIRE
# DIALECT went where definition 16-20 puts a protocol's dialect, into the plane crate. The engine
# reads that dialect rather than restating it, which is this edge. It is the same retirement, one
# crate further along, so the row moves rather than being added beside a dead one.
[[transitional]]
from = "busbar-mcp"
to = "busbar-plane-mcp"
reason = "legacy drain: the MCP wire dialect folded into the plane crate and the retiring engine reads it"

# The admin surface the A2A and MCP engines' tests drive drained out of busbar-core into the
# compiled-in cleanliness tier: first as `busbar-admin`, which then folded into `busbar-core-admin`
# (#37). BUSBAR-1.6.0.md:3780 (R2/#37) seats that crate as a cleanliness crate, and `cleanliness` is
# a kind the drain targets, so each retiring engine's test edge onto it is named here. Both are
# dev-dependencies (the engines' admin-verb tests) and die with the engines.
[[transitional]]
from = "busbar-a2a"
to = "busbar-core-admin"
reason = "legacy drain: the retiring A2A engine's tests drive the admin surface that drained into the cleanliness tier"

[[transitional]]
from = "busbar-mcp"
to = "busbar-core-admin"
reason = "legacy drain: the retiring MCP engine's tests drive the admin surface that drained into the cleanliness tier"

# ------------------------------------------------------------------------------------------------
# [[announced]] — CRATES THAT ARE LANDING
# ------------------------------------------------------------------------------------------------
#
# A crate that appears under `crates/` and resolves to no kind is RED, which is the point of the
# registry row. That rule bites the WRONG WAY on the day a crate lands: the agent adding
# `crates/busbar-<kind>-<name>` would red a gate they never touched, and the fix would be to weaken
# the registry. So the kind is taught FIRST — the kind table already carries the kind — and this
# table is what keeps the teaching from being scored as dead weight in the window before the crates
# exist.
#
# THE TABLE IS EMPTY TODAY, and empty is a legitimate state: the two rows it carried
# (`busbar-core-config`, `busbar-core-hooks`) were struck on 2026-09-22 when DECISIONS #37 KILLED
# both crates — an announcement is a claim that a crate is ARRIVING, and a crate that was deleted
# instead is not arriving. The gate's own selftest no longer borrows a real row for the announcement
# rules; it plants its own (`registry_announcing`), which is the more honest fixture: a case whose
# subject is a live row goes dark the day that row lands or dies.
#
# An announced row says: this crate is being created right now, it is kind `<kind>`, and until it
# lands the kind's row (and any accepted-name entry for it) is not a dead row.
#
#   crate   — the crate name as its `[package] name` will read.
#   kind    — a kind in the gate's own table.
#   reason  — who is landing it and what it is.
#
# EXPIRY. Landing the crate must NOT red the per-push gate — that is the whole purpose. The ratchet
# is the ship twin: `kind-isolation-ship` is RED for an announced row whose crate HAS LANDED, so the
# announcement cannot survive a release. Once it lands, the ordinary dead-kind and dead-waiver
# ratchets watch it like every other crate.

# ------------------------------------------------------------------------------------------------
# [[registered]] — A CRATE WHOSE KIND ITS NAME DOES NOT YET SAY
# ------------------------------------------------------------------------------------------------
#
# Every other crate reaches its kind through its NAME, and that is the design: `busbar-<kind>-<name>`
# means a reader and the gate agree about what a crate is without consulting a list. A registered row
# is the one exception, and it exists for exactly one situation — a kind has been created and the
# crate that is its first member has not been renamed yet.
#
#   crate   — the crate's `[package] name`.
#   kind    — the kind it IS, overriding what its name says.
#   reason  — why the name disagrees, and what pays the debt.
#
# EXPIRY, AND IT IS AUTOMATIC. The moment the crate's name resolves to the kind the row registers,
# the row is REDUNDANT and the gate is RED for it. So the rename lands and the row goes in the same
# commit; there is no window in which the tree carries both.

# ------------------------------------------------------------------------------------------------
# [[edge]] / [[cell]] — THE KIND × CRATE VOCABULARY MATRIX
# ------------------------------------------------------------------------------------------------
#
# > "it's not just planes, it's everything. core is core, plugins are plugins, transport,
# > everything. HAS TO BE PERFECT AND CLEAN." — owner, 2026-09-08
#
# The rows above are about the DEPENDENCY graph and the kind of a crate. These two are about its
# VOCABULARY: `kind-isolation:matrix` measures, for every kind K and every crate C under `crates/`,
# whether C names K's derived vocabulary — K's member package names, their kind-qualified ids, and
# (for the plane and transport families, the two the kind table itself calls instance
# vocabularies) their bare ids. Every `.rs` and `.toml` under the crate, WHOLE TEXT: identifiers,
# string literals, doc comments, ordinary comments, `cfg` attributes, Cargo dependency and feature
# names, and the file's own path. TESTS ARE NOT EXCLUDED, and the COMPOSITION ROOT IS NOT EXEMPT —
# `crates/busbar/src/root/**` hand-wires one file per plane, and a plane-named accept loop was
# landed beside it, all of it green because nothing counted it.
#
#   [[edge]]         from, to, cite, why, drain — one per kind -> kind CLASS. `cite` is the
#                    BUSBAR-1.6.0.md clause that grants the edge, or the words that say none does;
#                    `drain` is the line that deletes it, because an allowance with no route to zero
#                    is an allowance nobody drains. The prose is on the class because that is what a
#                    reader reads.
#   [[cell]]         crate, kind — one per crate × kind EDGE: this crate names this kind's
#                    vocabulary at all. PRESENCE, not size: no count. Size is not a CI check (owner
#                    2026-10-02); the perf-time hash tool reads size, CI reads edges. A `count`
#                    field here is refused at load.
#
# PRESENCE IS HARD. A crate × kind cell above zero with no `[[cell]]` row is a NEW CROSS-KIND EDGE
# and is RED (`unlisted-cell`); a cell whose kind -> kind class has no `[[edge]]` row is RED
# (`unlisted-edge`), whatever BUSBAR-1.6.0.md may or may not grant. A row whose cell measures zero
# is a dead allowance and must be struck. A row this branch MINTED is refused (`minted-row`): that
# is the rule that stops a branch legitimising a new edge by writing its row. More hits inside a
# listed cell change nothing here.
#
# `cargo xtask gate kind-isolation --report` prints the whole matrix with its numbers, these
# classes, and the DRAIN LIST — every hit, file:line — so each file is handed its deleting line
# rather than re-derived.
#
# The SHIP twin owes this row at ZERO everywhere and does not read these tables at all: what is
# written here is what 1.6.0 still has to delete.

[[edge]]
from = "contract"
to = "plane"
cite = "none. BUSBAR-1.6.0.md THE DESIGN, §1 — three blind axes, one small kernel: a crate of kind contract has no clause that lets it name plane vocabulary. Every hit is a coupling to delete."
why = "crates of kind contract naming plane vocabulary: plane package names in any spelling, the kind-qualified id (plane-<id>), and — where plane is a plane or a transport, the two families that HAVE an instance vocabulary — the bare instance id. Matched in identifiers, string literals, comments, doc comments, filenames, Cargo dependency names, feature names and cfg attributes, tests included."
drain = "delete the plane name from the contract crate: a contract reaches plane through the contract face it is written against, never by naming it. Every file:line in the drain list of cargo xtask gate kind-isolation --report is one deletion."

