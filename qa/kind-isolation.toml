#
# C1 says core names no instance, over SEVEN plugin kinds (DECISIONS #3). The matrix above measured
# two: plane and transport. These rows are the other five — store, secret, auth, hooks, export —
# for every Family::Neutral crate: whether the crate writes one of that kind's INSTANCE
# names as a whole string literal (`"otlp"`, `"valkey"`, `"admin-tokens"`, `"file"`). The
# vocabulary is derived by `kind-isolation:matrix` from the census and the tree's own
# `*_MODULE*` constants (see xtask/src/gates/kind_isolation/matrix/instances.rs); nothing here
# lists it.
#
# PRESENCE ONLY, like `[[cell]]` (size is not a CI check, owner 2026-10-02): a row says this neutral
# crate names this axis's instances at all. A cell above zero with no row is RED
# (`unlisted-instance`); a row whose cell measures zero must be struck (`dead-instance`). The ship
# twin owes ZERO in every neutral crate (law0-neutral-instance). The drain is Phase 4's.
#
# [[core-name]] — CORE'S OWN WORDS, which the learned vocabulary must not count (ARCHITECT ruling
# 2026-09-30, KERNEL-AUTH-ZERO Q1: a lower-only MEASUREMENT CORRECTION, the class of INBOUND-LISTEN's
# "Tcp* = OS words"). A module-name constant teaches the axis a word; these three are words the
# spec names as core's own, not a plugin's. The list is EXACTLY these three. No plugin name may ever
# enter it: a word a plugin crate is named for, or one a constant outside the kernel and contract
# spells, stays counted and the row is RED (`core-name-is-plugin`).

