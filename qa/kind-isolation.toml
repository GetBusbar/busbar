# ------------------------------------------------------------------------------------------------
# [[face]] — A CRATE THAT IMPLEMENTS ANOTHER KIND'S ENTRY FACE, AT ITS EXACT COUNT
# ------------------------------------------------------------------------------------------------
#
# A crate's KIND is a claim about what it is; a trait implementation is the same claim made to the
# COMPILER. When the two disagree the compiler's is the one that runs — `impl Plane for Wire` inside
# a transport is a plane, registered as a plane, reached as a plane, whatever the manifest says.
# `kind-isolation:shape` counts a crate's implementations of its OWN kind's face, so a red team's
# `impl Plane for Wire` in a transport and `impl Transport for P` in a plane left that row
# byte-identical in both directions: it never asked whether a crate implements SOMEBODY ELSE'S face.
#
# No crate does today: each STRUCK note below names the line that deleted one. A row is the exact
# number, exact in both directions, with the line that deletes it. The SHIP twin owes zero: at the
# tag there is no such thing as a reviewed one.
#
#   crate — the package that implements it.
#   face  — the entry trait of a kind that is not its own.
#   count — TODAY'S MEASURED NUMBER of implementations in shipped source, exactly.
#   cite  — the clause, or the words that say none does.
#   why   — what the number is made of.
#   drain — the line that deletes it.

# STRUCK (step 36): `busbar` × Transport. The root's one transport face was `doors.rs`'s `RootWire`,
# which presented the connector's `HostWire` at the legacy `busbar_contract::Transport` seam; the
# boot seal now reads every transport row from its door's facts, the trait is deleted from the
# contract, and the root implements no transport face. No FACE_GRANTS entry replaces it.

# STRUCK (row 84, S1): `busbar-plugin-loader` × Transport. The loader's one transport face was
# `transport_adapter.rs`'s `WireTransport`, which presented a HOT-decl transport to the kernel; the
# HOT transport lane is deleted, so the loader implements no transport face.

# STRUCK (row 113, ruling (B)): `busbar` × Store. The root's two implementations — the refusing
# stand-in and the forwarding newtype — are deleted; the root binds the loader's adapter over the
# configured store (`StoreAdapter::verb_store`) and implements no store face.

# ── THE DIALECT COLUMN ───────────────────────────────────────────────────────────────────────────
#
# The `dialect` kind is the one kind whose vocabulary is NOT derived from the census, because the
# census has no dialect crate in it: the kind lands as `busbar-plane-<plane>-<dialect>` when the
# codec split finishes. Until then its vocabulary is the VENDOR NAMES -- the six words the DIALECT
# rule of `plane-purity` bans as whole words -- and they are read from that list rather than written
# out a second time here.
#
# The column exists because a red team put `const VD = "anthropic";` and `fn openai_shim()` into
# `busbar-store-memory` and every gate in the tree stayed green: there was no `dialect` column for
# the hit to land in. The numbers below are TODAY'S MEASUREMENT, pinned exactly. They are large --
# `busbar-plane-llm`, which holds the llm codec since R7 folded it in, is very nearly all vendor
# vocabulary -- and
# large is the point: the ratchet is exact in BOTH directions, so a vendor word ADDED to a crate is
# red and a vendor word DELETED without re-pinning is red too. `cargo xtask gate kind-isolation
# --write` re-pins downward and refuses every rise.
# ------------------------------------------------------------------------------------------------
# CLEANLINESS (admin/oauth2) EDGES — DECISIONS #5. Pre-existing at the merge-base; recorded, not
# introduced. Struck when busbar-core is deleted.
# ------------------------------------------------------------------------------------------------

