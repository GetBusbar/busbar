face = "Transport"
count = "1"
cite = "none. BUSBAR-1.6.0.md THE DESIGN, §1 — a legacy 1.5.x crate is not a transport; the retirement is what ends this."
why = "the retiring a2a engine carries its own transport implementation, from before the plane/transport split existed. One implementation, in shipped source."
drain = "finish the a2a drain and delete busbar-a2a; the row goes with the crate."

