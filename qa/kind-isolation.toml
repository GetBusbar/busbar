# ------------------------------------------------------------------------------------------------
# [[dep]] / [[question]] — THE DEPENDENCY LEDGER, ONE ROW PER EDGE INSTANCE
# ------------------------------------------------------------------------------------------------
#
# `kind-isolation:deps` held the manifests to a table of kind-to-kind CLASSES in Rust source, and a
# class ratchet has unlimited slack INSIDE a class: `transport -> unit` was one measured line, so a
# SECOND transport growing a dependency on a unit was green, and so was a third. An audit of all 220
# workspace-internal edges found 105 the architecture grants, 87 it does not, 15 in the loader/ABI
# trusted base and 13 it never rules on at all — every one held by 38 lines that recorded only which
# pairs of kind WORDS had ever appeared together.
#
# So the row is the INSTANCE, and the ratchet moves one edge at a time, exactly in both directions,
# on the same terms `[[cell]]` above already lives under. A count above its row is the landing that
# grew the coupling. A count BELOW it is stale slack that was not drained on the commit that drained
# the edge. A row whose edge is gone is a dead allowance and must be struck. An edge with NO row is
# refused, whatever the architecture may or may not grant, because an edge nobody wrote down is an
# edge nobody reviewed.
#
#   from    — the crate that declares the dependency.
#   to      — the crate it reaches. The PACKAGE, not the manifest key: a `package = "…"` rename and
#             a `[workspace.dependencies]` rename both resolve here before the row is looked up.
#   half    — `shipped` ([dependencies], [build-dependencies] and their per-target forms) or `test`
#             ([dev-dependencies]). Two halves and not one, because they are two claims: what the
#             artifact links, and what the test binary links.
#   count   — TODAY'S MEASURED NUMBER OF DECLARATIONS, exactly. Not a budget.
#   verdict — allowed | tcb | not-allowed | owner-ruling-pending. `allowed` and `tcb` are READINGS
#             of ARCHITECTURE_ALLOWED / ARCHITECTURE_TCB in
#             xtask/src/gates/kind_isolation.rs, not opinions this file is entitled to hold: a row
#             claiming an edge the architecture withholds is refused as an unsupported verdict.
#   cite    — the clause that grants the edge, or the words that say none does.
#   why     — what the number is made of.
#   drain   — the line that deletes it, or the words that say the architecture asks for it.
#
# `[[question]]` carries the question an `owner-ruling-pending` edge is asking — its own table, on
# exactly the terms `[[disagreement]]` is: every row in this file is a fixed set of required fields,
# and an optional one would be the first thing a reader has to remember. A pending row with no
# question has stopped asking; a question about an edge that is no longer pending is struck.
#
# THE SHIP TWIN (`cargo xtask gate kind-isolation-ship`) does not read these rows. It owes the
# ARCHITECTURE'S OWN GRAPH: only the classes ARCHITECTURE_ALLOWED names, with `tcb`, `not-allowed`
# and `owner-ruling-pending` all refused, because the criterion for a tag is not "no worse than
# yesterday". What is written here is what 1.6.0 still has to delete or get a ruling on.

[[dep]]
from    = "busbar"
to      = "busbar-a2a"
half    = "shipped"
count   = "1"
verdict = "allowed"
cite    = "ARCHITECTURE.md 1.1 / ARCHITECTURE.md 3.1 — the composition root is the one thing that names all three axes."
why     = "busbar names busbar-a2a: declared normal, optional in the shipped graph, 1 declaration(s) at this commit. The count is TODAY'S MEASUREMENT, exact in both directions — above it is the landing that grew the coupling, below it is stale slack that was not drained on the commit that drained the edge."
drain   = "none: ARCHITECTURE.md grants this class. Draining it would be an architecture change and not a landing — what this row holds is the NUMBER, so a second declaration of a granted edge is still a landing that has to say why."

