# ── THE DIALECT COLUMN ───────────────────────────────────────────────────────────────────────────
#
# The `dialect` kind is the one kind whose vocabulary is NOT derived from the census, because the
# census has no dialect crate in it: the kind lands as `busbar-plane-<plane>-<dialect>` when the
# codec split finishes. Until then its vocabulary is the VENDOR NAMES -- the six words the DIALECT
# rule of `plane-purity` bans as whole words -- and they are read from that list rather than written
# out a second time here.
#
# The column exists because a red team put `const VD = "anthropic";` and `fn openai_shim()` into
# `busbar-store-memory` and every gate in the tree stayed green: there was no `dialect` column for
# the hit to land in. The numbers below are TODAY'S MEASUREMENT, pinned exactly. They are large --
# `busbar-llm-codec` is the `llm` plane's other half and is very nearly all vendor vocabulary -- and
# large is the point: the ratchet is exact in BOTH directions, so a vendor word ADDED to a crate is
# red and a vendor word DELETED without re-pinning is red too. `cargo xtask gate kind-isolation
# --write` re-pins downward and refuses every rise.
# ------------------------------------------------------------------------------------------------
