# door-only: DRAIN-ONLY ledger (M0 ABI-SPEC, REPORT-ONLY).
# The binary closure reaches a plugin only through its door, and installs no static
# fn-pointer seam but the two ruled core (oauth_as/seam.rs, admin/seam.rs). Each row
# is one the tree carries today. Strike a row in the commit that drains it; never
# add one. Regenerate with `cargo xtask gate door-only --write`.

[[finding]]
rule = "door-only:static-seam"
file = "crates/busbar-kernel-audit/src/amend.rs"
item = "SINK"
count = 1

[[finding]]
rule = "door-only:static-seam"
file = "crates/busbar-kernel/src/config/plane_sections.rs"
item = "PLANE_SECTIONS"
count = 1

