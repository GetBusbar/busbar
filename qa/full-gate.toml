# THE LOCAL SKIP REGISTER for `cargo xtask full-gate` — the gates CI runs that a laptop CANNOT,
# each with a WRITTEN REASON.
#
# WHY THIS IS DATA AND NOT A RUST TABLE. Two reasons, and the second is the load-bearing one.
#
# 1. A skip is an owner-tightened knob. Removing one — deciding a gate CAN run locally now —
#    should be a reviewable edit to a file whose whole content is that decision, not a diff
#    buried in a runner.
# 2. `cargo xtask gate segregation` forbids `xtask/src` from naming a file under
#    testing/shadow-oracle/ that is not on its data allowlist: a gate runner that reaches into
#    the oracle is a runner whose verdict moves when the oracle does. The register is data; the
#    runner reads it, and putting it in the runner would have meant either weakening that rule or
#    lying to it.
#
# ── SIX ROWS WERE STRUCK HERE, 2026-09-22, AND ALL SIX WERE BORN DEAD ──────────────────────────
#
# This paragraph used to end "Six of the entries below are oracle harness scripts. They belong in
# the register precisely BECAUSE the runner does not run them." FIVE of those six named
# `testing/shadow-oracle/{fetch-golden,fetch-plugin,selftest,record,replay}.sh`, and the sixth named
# `scripts/release-order-lint.py`. NONE OF THE SIX EXISTED ON THE DAY THIS FILE WAS WRITTEN:
# c73ae4f66 ("the oracle tool leaves this tree") DELETED the five on 2026-09-06 — its own message
# says "full-gate discovery ... now names bin/oracle where it named five scripts" — and 378572b3f
# DELETED release-order-lint.py on 2026-09-07, saying in as many words that "full-gate's SKIP_REASON
# loses its entry and the special case that entry needed ... keeping either would leave a waiver
# that excuses nothing". 446d771f3, which created THIS file by lifting the shell runner's
# SKIP_REASON into data, is a descendant of both and carried all six dead rows across with it.
#
# THEY ARE STRUCK, NOT REPOINTED, BECAUSE THERE IS NOTHING TO POINT AT AND NOTHING TO EXCUSE:
#
#   * The oracle harness is now the PINNED EXTERNAL TOOL `bin/oracle` (testing/shadow-oracle/
#     oracle.pin), and `bin/oracle` is invisible to discovery by construction — `discovery::
#     GATE_ROOTS` is {scripts, testing} and `GATE_EXTS` requires an extension, so an extensionless
#     path under `bin/` can never be discovered and therefore can never need a skip. Adding a
#     `bin/oracle` row would be a waiver for something the runner never offers to run.
#   * `scripts/release-order-lint.py`'s work moved INTO `cargo xtask gate release-order`, which CI
#     invokes; its only remaining mention in ci.yml is inside a `#` comment, which `strip_prose`
#     blanks before discovery ever sees it. The `partition()` special case that let it bypass this
#     table went with it.
#
# MEASURED BOTH WAYS: `cargo xtask full-gate --list` reports SKIPPED-WITH-REASON (6), and the six it
# names are run.sh, proof-manifest.py, build-provenance-gate.sh, loom.sh, plugin-registry-check.sh
# and txn-fence.sh — not one of the six struck rows. They were matched by nothing, so nothing that
# CI runs is newly running or newly skipped because they are gone.
#
# A skip with an EMPTY reason is refused by `cargo xtask full-gate --selftest`. A skip without a
# reason becomes permanent.
#
# NOT LISTED, on purpose: every `--selftest` form (a gate self-test is hermetic and always runs,
# whatever its script is classified as), and the four hermetic testing/ harness gates that each
# take seconds.

[[skip]]
script = "scripts/release-check.sh"
reason = "consumer-side verification of a PUBLISHED release: downloads tagged artifacts from GitHub Releases and Docker Hub. There is nothing to verify before a tag exists."

[[skip]]
script = "scripts/verify-artifact.py"
reason = "per-artifact contract against BUILT release binaries. Needs the release matrix's outputs, which only the release workflow produces."

[[skip]]
script = "scripts/qa-gate-run.sh"
reason = "the full qa fleet: ten plugin repos, service containers, a real Postgres/Valkey/MySQL. Runs on promotion, not on a laptop."

[[skip]]
script = "scripts/qa-segments.sh"
reason = "drives the qa fleet segmentation; same fleet dependency as qa-gate-run.sh."

[[skip]]
script = "scripts/plugin-registry-check.sh"
reason = "reads the published plugin registry over the network; a local run measures the network, not the tree."

[[skip]]
script = "scripts/loom.sh"
reason = "exhaustive interleaving model, minutes of CPU per run. Deliberately out of the default loop; run it directly when touching the config swap."

[[skip]]
script = "scripts/txn-fence.sh"
reason = "compiles a module that MUST FAIL to type-check, in its own target dir. Correct, but it inverts the exit code and confuses a batch runner; run it directly."

[[skip]]
script = "scripts/build-provenance-gate.sh"
reason = "asserts the provenance stamp of a BUILT release binary ('… target/release/busbar release false'). Needs the release artifact the release build produces, exactly as verify-artifact.py does; a bare local run has no binary to inspect. The --selftest form runs here — it is the local mirror that proves the stamp discriminates."

[[skip]]
script = "scripts/proof-manifest.py"
reason = "the Build-Proof-Dashboard collator, run ONLY on the dev/qa/main promotion branches (it needs --version/--out and re-emits docs/proof/<branch>.json). By its own contract it CHANGES NO GATE — it re-runs the cheap grep gates and records their verdicts — so there is nothing to prove locally on an integration branch."







[[skip]]
script = "testing/llm-conformance/run.sh"
reason = "replays the candidate recording against the vendor specs pinned in spec-digests.tsv, which are fetched over the network and are not in the repository. Its harness logic is proven here by testing/llm-conformance/selftest.sh, which runs."

# The invocations discovery MUST find, one per shape the pattern has to keep: a plain .sh, two
# .py, a .mjs behind a `node ` prefix (the extension set and the interpreter list, pinned by
# example), and four real testing/ paths — discovery could not see a testing/ root at all until
# the root list grew, so they are pinned here so it cannot shrink back.
[discovery]
must_find = [
  "cargo xtask gate structure-lint",
  "scripts/public-hygiene-lint.py",
  "cargo xtask gate workspace-deps",
  "cargo xtask gate kind-isolation",
  "scripts/check-proof-manifest-public.mjs",
  "testing/llm-conformance/run.sh",
]
