[[allow]]
crate = "busbar-plane-mcp"
dep = "libc"
via = "ahash"
reason = "ONE reviewed, non-I/O edge reaches libc from this plane through its codec's JSON scanner: sonic_rs -> ahash -> getrandom -> libc. sonic-rs requests `ahash` with its default features in every published version and ahash's default `runtime-rng` seeds its hasher through `getrandom`, which uses libc only to issue the getentropy(2)/getrandom(2) syscall — not a socket, file or process primitive. Cargo cannot subtract a feature a dependency requests, so the edge is sonic-rs's to close (a feature to build ahash without runtime-rng) or the closure's to avoid by naming a different scanner. The cpufeatures edge this entry used to name is GONE: busbar-api and busbar-substrate-values no longer depend on sha2 (SHA-256/HMAC-SHA256 are plain Rust in busbar-api as of 1.6.0). Re-review if any other path to libc appears."
owner = "orchestrator, 2026-09-05; narrowed to the ahash edge by the S2 dialect-closure slot, 2026-09-09"

