# qa/denylist-allow.toml — the one waiver seam for `cargo xtask denylist` (ARCHITECTURE.md section
# 1.2's transitive source denylist over the pure plugin kinds: plane, hook, static/pure auth,
# egress-auth-scheme).
#
# EMPTY AT HOUR 0, per section 1.2 ("allow-list empty at hour 0"). It stays empty until a specific,
# reviewed exception is needed — never populated speculatively, never populated to make a red run
# green without a decision behind it.
#
# Every future entry is a `[[allow]]` table naming the crate and either the banned dependency name
# (`dep`) or the banned own-src path (`path`) it waives, with BOTH a `reason` and an `owner`. An
# entry missing either field is a REFUSAL of the entire run (`xtask/src/denylist.rs::load_allowlist`
# panics rather than silently accepting a half-filled waiver), so there is no way for an unreviewed
# exception to read as reviewed.
#
# [[allow]]
# crate = "busbar-plane-example"
# dep = "some-banned-crate"
# reason = "why this specific transitive edge is safe, reviewed"
# owner = "the person who reviewed it"
#
# A `dep` entry may ALSO carry `via = "<crate>"`, narrowing the waiver so it only applies when
# EVERY normal-dependency path from `crate` to `dep` passes through `via` somewhere along it
# (`xtask/src/denylist.rs::find_bypass_path` computes this over the same `cargo metadata` resolve
# graph the closure scan already walks). If any path reaches `dep` without going through `via`,
# the waiver does not apply at all: the hit stays red, and the bypassing path is one of the report's
# own rows, so it names itself. `via` is only meaningful for a `dep` entry naming a plain
# dependency-graph crate name — not a `path` (own-src) waiver, and not a `tokio (feature: ...)`
# offender — and using it on either is a refusal (`load_allowlist` panics), same posture as a
# missing `reason`/`owner`. Without `via`, a `dep` entry waives every path to that dependency
# unconditionally, exactly as before `via` existed.
#
# `via` may name more than one crate, comma-separated (`via = "cpufeatures, getrandom"`), for the
# case where the SAME offender is genuinely reached through more than one reviewed, non-I/O edge:
# a path counts as covered if it passes through ANY of the named crates, and the waiver still fails
# to apply if even one path reaches `dep` through NONE of them.
#
# `cargo metadata`'s resolve graph also lists an edge for an OPTIONAL dependency whose enabling
# feature is off for every consumer in the workspace — `xtask/src/denylist.rs::edge_is_active`
# filters those out before either the closure scan or `via`'s bypass check see them, so a `via`
# waiver only ever has to account for edges the crate actually compiles.
#
# [[allow]]
# crate = "busbar-plane-example"
# dep = "libc"
# via = "cpufeatures"
# reason = "cpufeatures uses libc for CPU feature detection only (getauxval/sysctl); no I/O \
#           primitive is reachable through this edge; re-review if any other path to libc appears"
# owner = "the person who reviewed it"

[[allow]]
crate = "auth-admin-tokens"
dep = "libc"
via = "cpufeatures"
reason = "cpufeatures uses libc for CPU feature detection only (getauxval/sysctl); no I/O primitive is reachable; re-review if any other path to libc appears"
owner = "orchestrator, 2026-09-05"

