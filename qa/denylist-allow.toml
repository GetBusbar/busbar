# qa/denylist-allow.toml — the one waiver seam for `cargo xtask denylist` (ARCHITECTURE.md section
# 1.2's transitive source denylist over the pure plugin kinds: plane, hook, static/pure auth,
# egress-auth-scheme).
#
# IT BEGAN EMPTY, per section 1.2 ("allow-list empty at hour 0"), and it is NOT empty now: the
# `[[allow]]` tables below are specific, reviewed exceptions, each with an owner and a date. Nothing
# is ever added here speculatively, and nothing is added to make a red run green without a decision
# behind it.
#
# THE FILE IS A FLOOR CHECKED BOTH WAYS — the same posture `scripts/no-deferral.waivers` has:
#
#   * a hit no entry covers is RED. The ban holds.
#   * an ENTRY THAT MATCHES NO HIT IS RED. The offender it excused is not in this tree any more, so
#     the exception has outlived the thing it was an exception to: delete it (the ban now holds on
#     its own), or, if it never matched anything, delete it (it was never an exception to anything).
#     `xtask/src/denylist.rs::stale_waivers` computes this against the UNFILTERED hit list, so an
#     entry that is doing its job is exactly one that is not reported here.
#   * an entry missing `reason` or `owner` refuses the entire run.
#
# The middle rule is why an entry cannot quietly become decoration. A waiver nobody has to defend is
# read by the next reviewer as a live, reviewed fact about the tree, and after the offender is gone
# it is not a fact at all.
#
# A `via`-narrowed entry whose bypass check FAILS is not stale: its hits are still in the report and
# still red, and the entry is a live exception that does not currently apply. It is reported by
# those hits, not a second time as a stale waiver.
#
# Every entry is a `[[allow]]` table naming the crate and either the banned dependency name
# (`dep`) or the banned own-src path (`path`) it waives, with BOTH a `reason` and an `owner`. An
# entry missing either field is a REFUSAL of the entire run (`xtask/src/denylist.rs::load_allowlist`
# panics rather than silently accepting a half-filled waiver), so there is no way for an unreviewed
# exception to read as reviewed.
#
# [[allow]]
# crate = "busbar-plane-example"
# dep = "some-banned-crate"
# reason = "why this specific transitive edge is safe, reviewed"
# owner = "the person who reviewed it"
#
# A `dep` entry may ALSO carry `via = "<crate>"`, narrowing the waiver so it only applies when
# EVERY normal-dependency path from `crate` to `dep` passes through `via` somewhere along it
# (`xtask/src/denylist.rs::find_bypass_path` computes this over the same `cargo metadata` resolve
# graph the closure scan already walks). If any path reaches `dep` without going through `via`,
# the waiver does not apply at all: the hit stays red, and the bypassing path is one of the report's
# own rows, so it names itself. `via` is only meaningful for a `dep` entry naming a plain
# dependency-graph crate name — not a `path` (own-src) waiver, and not a `tokio (feature: ...)`
# offender — and using it on either is a refusal (`load_allowlist` panics), same posture as a
# missing `reason`/`owner`. Without `via`, a `dep` entry waives every path to that dependency
# unconditionally, exactly as before `via` existed.
#
# `via` may name more than one crate, comma-separated (`via = "cpufeatures, getrandom"`), for the
# case where the SAME offender is genuinely reached through more than one reviewed, non-I/O edge:
# a path counts as covered if it passes through ANY of the named crates, and the waiver still fails
# to apply if even one path reaches `dep` through NONE of them.
#
# `cargo metadata`'s resolve graph also lists an edge for an OPTIONAL dependency whose enabling
# feature is off for every consumer in the workspace — `xtask/src/denylist.rs::edge_is_active`
# filters those out before either the closure scan or `via`'s bypass check see them, so a `via`
# waiver only ever has to account for edges the crate actually compiles.
#
# [[allow]]
# crate = "busbar-plane-example"
# dep = "libc"
# via = "some-reviewed-intermediate-crate"
# reason = "why THIS CRATE reaching libc through that intermediate is safe, reviewed; re-review \
#           if any other path to libc appears"
# owner = "the person who reviewed it"
#
# ── WHAT DOES *NOT* BELONG HERE: AN EDGE THE WHOLE TREE HAS RULED ON ────────────────────────────
#
# This file answers "this CRATE may reach this offender". It is the wrong shape for a fact about an
# EDGE, and using it for one is how a rule stops being a rule. `(dep = libc, via = cpufeatures)`
# used to live here as SIX near-identical `[[allow]]` rows — busbar-plane-a2a, -llm, -mcp,
# -streaming, hook-test-plugin, hooks-ranking — each restating one paragraph of
# CPU-feature-detection reasoning, and enrolling the auth kind (auth-static-plugin,
# auth-admin-tokens) was about to demand a seventh and an eighth. A decision restated once per
# rediscovery is not a decision the tree can state; it is six copies nobody can reconcile.
#
# TWO OF THOSE SIX WERE ALSO ALREADY RED, AND FOR A DIFFERENT REASON — say it separately, because
# it is a separate finding. `busbar-plane-a2a` and `busbar-plane-mcp` reach `libc` by NO route at
# all any more: the unfiltered scan finds zero hits for either crate, so `denylist:stale-waivers`
# had been reporting both rows for having outlived their offenders since before this collapse.
# They are deleted on THAT ground — the middle rule above, not the edge ruling — and the edge
# ruling would not have covered them, because there is nothing left in either crate to cover. That
# also disposes of the `getrandom` half of the mcp row: the closure it described
# (`sonic_rs -> ahash`) is not in that crate's graph either, so deleting it blesses no live edge.
#
# The other four are gone by COLLAPSE. The ruling now lives ONCE, keyed on the edge and not on any
# crate, as
# `[[rules.source-denylist.edge_exemptions]]` in `qa/construction.toml` (OWNER RULING 2026-09-22,
# docs/design/BUSBAR-1.6.0.md). It carries `reason`, `owner`, and the enumerated `symbols` the
# `via` crate takes from `dep` as its evidence; it is decided by the SAME `find_bypass_path` walk
# `via` uses here, so it exempts that path and no other; and it is held to this file's own
# both-ways floor — an exemption that suppresses no hit is RED in `denylist:stale-waivers`, exactly
# as a waiver that covers no hit is.
#
# So: write an `[[allow]]` row when the answer is about THIS CRATE. Ask for an edge exemption when
# the answer is about the EDGE and would be identical in every pure kind that took it. What you may
# not do is mint the fifth copy.
#
# AN EDGE EXEMPTION DOES NOT SWALLOW THE OTHER EDGES A CRATE TAKES. A crate reaching one offender
# through an exempted edge AND through a second, separately-reviewed one keeps its `[[allow]]` row
# for the second — the exemption is added to that row's `via` list, not substituted for it, so the
# two compose and the second edge still has to be defended here. That is why the llm and streaming
# rows below still exist and now name `getrandom` alone: `getrandom -> libc` is a DIFFERENT edge
# with a different argument, and the ruling above is explicit that it is NOT ruled on.

[[allow]]
crate = "busbar-plane-llm"
dep = "libc"
via = "getrandom"
reason = "THIS ROW NOW COVERS ONE EDGE: getrandom -> libc, which is NOT ruled on. The plane's other route to libc, cpufeatures, is settled tree-wide by the (dep = libc, via = cpufeatures) edge exemption in qa/construction.toml and is no longer argued here; this row's remaining reasoning is preserved verbatim from the reviewed original. Context that still holds: the third, UNREAL route (sonic_rs -> faststr -> rkyv -> uuid_1 -> getrandom -> libc) was closed by the xtask/denylist.rs phantom-optional-dependency fix (edge_is_active) -- faststr's rkyv dependency is optional and its 'rkyv' feature is active nowhere in the workspace, confirmed against the real rustc invocation for busbar-plane-llm, which carries no --cfg feature=\"rkyv\" and no --extern rkyv. getrandom uses libc only to issue the getentropy(2)/getrandom(2) syscall (busbar-llm-codec's own direct `getrandom = { workspace = true }` dependency, drawn by synth_rng.rs's thread-local entropy pool); this is a syscall wrapper, not a socket/file/process primitive. This edge is NOT yet what ARCHITECTURE.md section 1.2 wants of a pure plane (entropy should arrive through Ctx, not be drawn by the codec itself) -- verified that busbar_llm_codec::write_error_envelope, the one codec entry point busbar-plane-llm calls that touches entropy, unconditionally calls the anthropic writer's error_envelope() (which mints via synth_rng::fill_entropy/getrandom) even on the call path where the caller supplies its own entropy and the drawn value is immediately overwritten and discarded. Feature-gating that draw (an `os-entropy` feature, default-on for busbar-llm/the engine, off for the plane) needs a source change in crates/busbar-llm-codec/src/{lib.rs,synth_rng.rs,anthropic/writer.rs} outside this waiver's file scope, AND would not by itself clear this xtask report: `cargo metadata`'s resolve graph unifies features across the WHOLE workspace (confirmed: busbar_llm_codec's single metadata node already shows `test-support` active workspace-wide even though busbar-plane-llm's own [dependencies] line never requests it), so a plane-only feature attenuation cannot be distinguished from the engine's own default-on request in this tool's model. Tracked as follow-up debt, not fixed here; re-review if any OTHER path to libc appears."
owner = "orchestrator, 2026-09-05"

[[allow]]
crate = "busbar-plane-streaming"
dep = "libc"
via = "getrandom"
reason = "THIS ROW NOW COVERS ONE EDGE: getrandom -> libc, which is NOT ruled on. The plane's other route to libc, cpufeatures, is settled tree-wide by the (dep = libc, via = cpufeatures) edge exemption in qa/construction.toml and is no longer argued here; this row's remaining reasoning is preserved verbatim from the reviewed original. getrandom, reached through sonic_rs -> ahash's hasher seeding, uses libc only to issue the getentropy(2)/getrandom(2) syscall. This edge does not expose a socket, file or process primitive. Re-review if any other path to libc appears."
owner = "orchestrator, 2026-09-05"


