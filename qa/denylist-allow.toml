# qa/denylist-allow.toml — the one waiver seam for `cargo xtask denylist` (ARCHITECTURE.md section
# 1.2's transitive source denylist over the pure plugin kinds: plane, hook, static/pure auth,
# egress-auth-scheme).
#
# IT BEGAN EMPTY, per section 1.2 ("allow-list empty at hour 0"), and it is NOT empty now: the
# `[[allow]]` tables below are specific, reviewed exceptions, each with an owner and a date. Nothing
# is ever added here speculatively, and nothing is added to make a red run green without a decision
# behind it.
#
# THE FILE IS A FLOOR CHECKED BOTH WAYS — the same posture `scripts/no-deferral.waivers` has:
#
#   * a hit no entry covers is RED. The ban holds.
#   * an ENTRY THAT MATCHES NO HIT IS RED. The offender it excused is not in this tree any more, so
#     the exception has outlived the thing it was an exception to: delete it (the ban now holds on
#     its own), or, if it never matched anything, delete it (it was never an exception to anything).
#     `xtask/src/denylist.rs::stale_waivers` computes this against the UNFILTERED hit list, so an
#     entry that is doing its job is exactly one that is not reported here.
#   * an entry missing `reason` or `owner` refuses the entire run.
#
# The middle rule is why an entry cannot quietly become decoration. A waiver nobody has to defend is
# read by the next reviewer as a live, reviewed fact about the tree, and after the offender is gone
# it is not a fact at all.
#
# A `via`-narrowed entry whose bypass check FAILS is not stale: its hits are still in the report and
# still red, and the entry is a live exception that does not currently apply. It is reported by
# those hits, not a second time as a stale waiver.
#
# Every entry is a `[[allow]]` table naming the crate and either the banned dependency name
# (`dep`) or the banned own-src path (`path`) it waives, with BOTH a `reason` and an `owner`. An
# entry missing either field is a REFUSAL of the entire run (`xtask/src/denylist.rs::load_allowlist`
# panics rather than silently accepting a half-filled waiver), so there is no way for an unreviewed
# exception to read as reviewed.
#
# [[allow]]
# crate = "busbar-plane-example"
# dep = "some-banned-crate"
# reason = "why this specific transitive edge is safe, reviewed"
# owner = "the person who reviewed it"
#
# A `dep` entry may ALSO carry `via = "<crate>"`, narrowing the waiver so it only applies when
# EVERY normal-dependency path from `crate` to `dep` passes through `via` somewhere along it
# (`xtask/src/denylist.rs::find_bypass_path` computes this over the same `cargo metadata` resolve
# graph the closure scan already walks). If any path reaches `dep` without going through `via`,
# the waiver does not apply at all: the hit stays red, and the bypassing path is one of the report's
# own rows, so it names itself. `via` is only meaningful for a `dep` entry naming a plain
# dependency-graph crate name — not a `path` (own-src) waiver, and not a `tokio (feature: ...)`
# offender — and using it on either is a refusal (`load_allowlist` panics), same posture as a
# missing `reason`/`owner`. Without `via`, a `dep` entry waives every path to that dependency
# unconditionally, exactly as before `via` existed.
#
# `via` may name more than one crate, comma-separated (`via = "cpufeatures, getrandom"`), for the
# case where the SAME offender is genuinely reached through more than one reviewed, non-I/O edge:
# a path counts as covered if it passes through ANY of the named crates, and the waiver still fails
# to apply if even one path reaches `dep` through NONE of them.
#
# `cargo metadata`'s resolve graph also lists an edge for an OPTIONAL dependency whose enabling
# feature is off for every consumer in the workspace — `xtask/src/denylist.rs::edge_is_active`
# filters those out before either the closure scan or `via`'s bypass check see them, so a `via`
# waiver only ever has to account for edges the crate actually compiles.
#
# [[allow]]
# crate = "busbar-plane-example"
# dep = "libc"
# via = "cpufeatures"
# reason = "cpufeatures uses libc for CPU feature detection only (getauxval/sysctl); no I/O \
#           primitive is reachable through this edge; re-review if any other path to libc appears"
# owner = "the person who reviewed it"

[[allow]]
crate = "busbar-plane-llm"
dep = "libc"
via = "ahash"
reason = "ONE reviewed, non-I/O edge reaches libc from this crate, and it is structural to sonic-rs: sonic_rs -> ahash -> getrandom -> libc. sonic-rs (the JSON scanner busbar-plane-llm and busbar-substrate-values name) requests `ahash` with its default features in EVERY published version (0.4.0 through 0.5.8, checked against the crates.io index), and ahash's default `runtime-rng` feature turns on `getrandom` to seed its hasher once per process; Cargo cannot subtract a feature a dependency requests, so no manifest in this workspace can drop the edge. getrandom uses libc only to issue the getentropy(2)/getrandom(2) syscall for that seed — a syscall wrapper, not a socket, file or process primitive — and nothing in this crate's closure reaches getrandom by any other path (`via` is the ahash edge alone: a second path would fail this waiver's bypass check and go red by itself). The two roots this crate's row was red on before 1.6.0 — busbar-llm-codec's own getrandom (the synth_rng pool) and busbar-api's sha2 -> cpufeatures — are FIXED, not waived: entropy is an installed source (synth_rng::install, written by the composition root) and SHA-256/HMAC-SHA256 are plain Rust in busbar-api. Closing this last edge means sonic-rs gaining a feature to build ahash without runtime-rng (an upstream change), or the closure naming a different scanner; re-review if any other path to libc appears."
owner = "S2 dialect-closure slot, 2026-09-09"

