# qa/plane-purity-strict.toml — ceilings for `cargo xtask gate plane-purity-strict`.
#
# WHY. `cargo xtask gate plane-purity` only ever looks at PRODUCTION code in the neutral crates and the plane crates.
# Test code was invisible to it on purpose (a plane's own test fixtures legitimately name its own
# types), but that also means test code can quietly accumulate the very side channels --check bans
# in production — most visibly a plane crate's tests reaching into `busbar_core::` internals, which
# pins the plane to core's private shape just as surely as production code would. the strict gate makes
# that debt visible and ratchets it down, the same ratchet shape as qa/construction.toml.
#
# HOW A CEILING WORKS. Every number below is the count MEASURED ON THE TREE the day this file was
# written (so the strict gate is GREEN today). It is a ceiling, not a target: it fails RED only
# when the measured count goes ABOVE it. Lower a number by hand as the debt is paid down — the gate
# never lowers it for you, and a lowered number that goes stale (measurement now below it) still
# passes, so tightening is always safe to do eagerly.
#
# [categories] — the side-channel classes `cargo xtask gate plane-purity` already enforces
# in PRODUCTION scope
# (PATH-INCLUDE/SYMBOL/TYPE/KEY/DIALECT/BACKWARDS), now counted across PRODUCTION + TEST scope
# combined. Production is already 0 for every one of these (that is what makes --check green), so
# for those six today's ceiling equals the TEST-scope count only. KEY-SEGMENT is the exception and
# says so below: it is the one class whose PRODUCTION count is not yet zero.
[categories]
PATH-INCLUDE = 0
SYMBOL = 61
TYPE = 13
KEY = 377
DIALECT = 456
BACKWARDS = 33

# KEY-SEGMENT — A PLUGIN'S NAME INSIDE THE NEUTRAL CRATES, WHICH `KEY` CANNOT SEE.
#
# `KEY` bans a plane key as a BARE TOKEN and treats `_` as not-a-boundary, so `mcp_slot`,
# `attach_mcp_durable_sinks`, `a2a_card_issuer`, `llm_runtime_key` and `MCP_RUNTIME_SLOT` all read
# as clean to it. That carve-out is where the defect lives: the neutral crates were naming ONE
# PLUGIN in the SPELLING OF A STEP — a seam field and a boot-trait method spelled after one plane —
# and a step spelled after one plane is a step that can serve exactly one plane. The second plane
# needing it has to grow a twin, which is how a kind-neutral seam stops being kind-neutral. The rule
# is the owner's: core knows its plugin KINDS and that is it, so a plugin NAME in the neutral
# crates is a defect to DELETE — a plane supplies the fact through its own DECLARATION (its key, its
# `config_section`, its `audit_kind`) and the step reads the declaration.
#
# WHY IT IS PINNED RATHER THAN ZERO. It is not zero today and pretending otherwise would mean either
# a red tree or giving up `KEY`'s zero by folding the two together, and a ceiling given up is an
# invariant given up. So it is its own class, at its MEASURED count, and it only goes DOWN.
#
# MEASURED: 156 on the base (production 55 — busbar-core 51, busbar-substrate 4), 153 after step 0
# (production 51 — busbar-core 49, busbar-substrate 2) once the two substrate sites and their core
# twin were deleted onto kind-neutral steps, 149 after step 1 (production 49 — busbar-core 47,
# busbar-substrate 0) once step 1 drained the breaker-input conversion's two sites, 134 after step 2
# once the TEST-SUPPORT harness builder was renamed, 119 here once step 3 renamed core's last three
# production spellings. Step 1's production figure fell by two — `BreakerCfg::to_llm` is DELETED
# outright (its one caller-crate, core's `appbuild`/test fixture, gets a `store::breaker_input_of`
# free fn instead — a SECOND home only because it has a SECOND caller-shape, never a synonym for the
# same thing); `BreakerCfg::from_llm` is RENAMED to `from_input` in place, in `busbar-substrate` (its
# one home, reachable by every plane's `build_runtime`) — a pure spelling retarget, net zero lines,
# no new `impl` anywhere. Substrate's own diff for step 1 is a straight deletion (net negative
# lines): the growth an `impl From` pair would have cost stays OUT of the frozen crate by using free
# functions/inherent methods (the same orphan-rule-driven shape `store::breaker_cfg_to_runtime`
# beside it already uses) instead of trait impls, which neither type here is local enough to host
# from any one crate. The combined figure fell by the same two because both were production-scope
# sites, not test-scope ones. Step 2's
# combined figure fell by fifteen — every line that named `mcp_durable_store` or
# `default_mcp_test_runtime` (the field, the method, the local binding, the fn definitions and their
# call sites, across `test_support/mod.rs`, `engine_kit.rs`, `plane/registry.rs` and the two
# `plane/tests/*.rs` fixtures that call the builder) — with no production/test split claimed because
# the harness spans both scopes. Step 3's figure fell by fifteen again — every line that named
# `llm_runtime_key`, `a2a_card_issuer` or `migrate_mcp_verify_ttl` (the field, the accessor, the
# local bindings and their call sites across `state.rs`/`appbuild.rs`/`test_support/mod.rs`; the
# governance method and its two call sites in `boot.rs`/`test_support/mod.rs`; the one migration fn
# and its one call site) — all production-scope, so the whole fifteen is a production drop too.
#
# THE DRAIN SCHEDULE, in the order the sites come apart, each step a deletion and never a rename:
#   1. DONE. busbar-substrate to ZERO: `BreakerCfg::to_llm` is gone (replaced at its one
#      caller-crate by core's `store::breaker_input_of`); `BreakerCfg::from_llm` is renamed in place
#      to `from_input` (still substrate-side — every plane's `build_runtime` reaches it, so it
#      cannot move to core). Nothing else in the substrate names a plugin.
#   2. DONE. busbar-core's TEST-SUPPORT harness: `TestApp::mcp_durable_store` (field + method) is now
#      `TestApp::durable_store` — it gives the built App A durable home, not specifically an MCP one
#      (the ONLY thing it wires, `attach_core_durable_sinks`, is itself plane-neutral: the spent-token
#      ledger and demotion-record sinks). `plane::registry::default_mcp_test_runtime` (+ its
#      `registry_tests` delegate) is now `builtin_plane_test_runtime` — the built-in plane it seeds a
#      runtime for is read off `plane_decl_for_config_section(NAMED_MAP_SECTIONS[2])` already, so the
#      function needed no plane name of its own, only a description of what it does for the one
#      built-in plane core's own `cfg(test)` binary carries.
#   3. DONE. busbar-core's remaining production spellings. `llm_runtime_key` (`state.rs` field +
#      accessor, `appbuild.rs`/`test_support/mod.rs` local bindings) is now `fallback_runtime_key` —
#      it names the ROLE (`plane::fallback_key()`, never a hardcoded `"llm"`) the field always held,
#      not which plane fills it today. `GovState::a2a_card_issuer` is now `GovState::card_issuer` —
#      it already read WHICH plane through `plane_decl_for_config_section("agents")`, so only the
#      name carried the plane word. `migrate_mcp_verify_ttl` is now `migrate_verify_ttl` — it runs on
#      raw pre-registry YAML (no declaration to read at that point), so this one is a straight
#      identifier drop rather than a declaration-read fix; no wire byte moved (`tools`/`servers`/
#      `refresh_ttl`/`verify_ttl` are the config's own vocabulary, not a plane key, and are
#      unchanged).
#   4. WIDEN THE SCAN. `busbar-kernel` and `busbar-unit-*` measure ZERO today but are not in
#      `xtask::planes::neutral_src_roots()`, so nothing is holding that zero. They join the neutral
#      root list once busbar-core's count is low enough that a widened scan cannot hide a rise in it.
KEY-SEGMENT = 119

# [test-reach] — the BACKWARDS class broken out per plane crate (bare plane key, matching
# the plane keys in xtask::planes), test scope only: how many lines under crates/busbar-<key>/src's OWN test
# code (files under /tests/, *_tests.rs, or a #[cfg(test)] mod block) name `busbar_core::`. This is
# the same measurement `cargo xtask gate construction` reports per crate as `ports-only-tests:<crate>`
# (qa/construction.toml carries llm=565, mcp=1, a2a=3, voice=0); this file's llm figure differs by
# one measured method (the xtask line-scan here vs. the python tree-scanner there) — both agree to
# within a single line and neither claims exactness beyond "test code reaching busbar_core:: is
# visible and ratchets down", which is the point of both gates.
[test-reach]
llm = 24
mcp = 1
a2a = 3
voice = 0
