# qa/unconstructed.toml — WHERE "THIS CAPABILITY IS BUILT BUT NEVER CONSTRUCTED" IS WRITTEN DOWN.
#
# Read by `cargo xtask gate unconstructed` (xtask/src/gates/unconstructed.rs).
#
# THE RULE THIS FILE SERVES:
#
#   A CAPABILITY THAT IS NEVER CONSTRUCTED IS A CAPABILITY THAT DOES NOT SHIP.
#   Its tests prove the code works; they prove nothing about whether it runs.
#
# WHY THIS FILE EXISTS. On 2026-09-22 the same defect was proven three times in one tree, and three
# rows that said DONE were wrong in exactly this way:
#
#   1. THE PRODUCTION AUDIT CHAIN IS UNSIGNED. `AuditChain::signing_with` is a complete, green,
#      sixteen-test signing implementation with ZERO non-test callers. The one production
#      construction site — `crates/busbar/src/root/durability.rs` → `record: AuditChain::new()` —
#      passes no signer, and no config supplies a key. Every deployed node seals a chain whose
#      tamper-evidence is unsigned, while the signing sits beside it, green.
#   2. #79's dated-history derivation has no production feed (a DIFFERENT shape — see THE LIMIT).
#   3. Neither auth crate carries `#![forbid(unsafe_code)]`; both sit on a `known_missing_forbid`
#      list. The INVISIBILITY was closed. The debt was not.
#
# In all three the code is correct, the tests are green, and the thing does not run. Nothing in this
# repository measured that. A test suite cannot: it constructs the capability itself, which is the
# one thing production does not do.
#
# WHAT THE GATE DOES WITH THIS FILE.
#
#   * A declared capability WITH a production construction site PASSES, and the row prints the site.
#   * A declared capability WITHOUT one is RED, and the row prints every mention it REJECTED and
#     why — so the reader sees "five mentions, none of them a call", not a bare absence.
#   * A capability declared `unshipped = true` is a TRACKED ROW: it passes, and it prints its
#     reason and its switch on every single run. That is strictly more than a source comment ever
#     did — the three findings above were all known to somebody and written down nowhere a machine
#     reads.
#   * A declaration that OUTLIVES ITS DEBT is RED (`unconstructed:stale-declaration`): an
#     `unshipped` row that has quietly acquired a construction site must be struck in the same
#     commit that wires it, and a row naming a symbol its `built` file no longer defines must be
#     corrected. The ledger cannot outlive the debt it tracked.
#
# THE FILE GOING EMPTY IS NOT THE GOAL STATE HERE — unlike qa/reachability.toml. The `required`
# rows are permanent: they are the capabilities whose construction must never silently regress, and
# they are what makes the gate a ratchet rather than a one-off audit. Only the `unshipped` rows are
# meant to drain.
#
# THE ROW SHAPE:
#
#   [[capability]]
#   id        = "audit-chain-signing"      # unique; the row id is `unconstructed:site:<id>`
#   built     = "crates/.../record.rs"     # the file the capability is IMPLEMENTED in. Must exist.
#   symbol    = "signing_with"             # must be DEFINED in `built`, or the row is stale
#   construct = [".signing_with("]         # the call shape(s). EVERY ONE MUST END IN `(`.
#   scope     = ["crates"]      # where a production construction site must appear
#   why       = "..."                      # >= 40 chars. What is lost when it does not run.
#   unshipped = true                       # optional; the row then PASSES and PRINTS
#   switch    = "..."                      # >= 40 chars, REQUIRED when `unshipped`. What retires it.
#
# WHY `construct` MUST END IN `(`, AND WHY THAT IS CHECKED ON THE DECLARATION RATHER THAN THE HIT.
# A construction site is a CALL. A needle that is not call-shaped would be satisfied by a `use`
# statement, a doc comment or a type alias, and those are exactly the decorations that make an
# unconstructed capability read as a constructed one. Checking it here means a future editor cannot
# quietly weaken one row to `construct = ["signing_with"]` and have it pass on an import line: the
# whole declaration is refused, loudly, before a single file is read.
#
# WRITING A ROW FOR A CAPABILITY REACHED BY FUNCTION POINTER. If the capability is an
# `extern "C"` fn installed into a vtable slot and called across the ABI, its `construct` needle must
# be the INSTALLATION, not the call: `metrics_emit: Some(` rather than `metrics_emit(`. Such a
# function is called by nobody BY NAME, so a call-shaped needle yields a FALSE RED — this exact case
# (`crates/busbar-plugin/src/hot/host.rs:958`) came up in the 2026-09-22 sweep and would have been
# answered by deleting live code. The installation IS the construction decision; scan for that.
#
# THE LIMIT, STATED SO NOBODY READS MORE INTO A GREEN ROW THAN IS THERE. This gate proves a
# production CALL SITE EXISTS. It does not prove that call is reached from `fn main()` — that is
# `cargo xtask gate reachability`, and the honest claim is the two together. And it does not see
# proven-instance 2 at all: `booked_lines()` IS called in production
# (`crates/busbar/src/root/units_admin/mod.rs:1419`); what is missing there is a non-empty FEED, not
# a construction site. That is a NEIGHBOURING shape — "constructed, but with its input hardwired
# empty" — and a construction-site scanner cannot express it. It is recorded as an OPEN row in the
# ledger rather than pretended into this file, because a row here would report it GREEN and be worse
# than no row at all.
#
# ── DECLARATIONS ─────────────────────────────────────────────────────────────────────────────────

# THE RATCHET ROW, AND THE GATE'S OWN POSITIVE CONTROL.
#
# `Ledger::dual_writing` is the stronger of two constructors and the composition root correctly
# chooses it — `durability.rs` even says why in the line above the call: "Not `Ledger::new()`. The
# reconciliation identity and rollback both require the dual write, and both are release
# requirements rather than deployment choices." That sentence is a comment; this row is the
# instrument. If anyone ever swaps it back to `Ledger::new()`, the money path silently loses
# reconciliation and rollback and every test still passes — which is the precise failure mode this
# gate exists for, in the one place it would cost the most.
#
# It is also what stops the gate being vacuous: this row is GREEN on HEAD, measured, so the RED
# rows below are a measurement rather than a gate that is red about everything.
[[capability]]
id        = "ledger-dual-write"
built     = "crates/busbar-kernel-ledger/src/settle.rs"
symbol    = "dual_writing"
construct = ["Ledger::dual_writing("]
scope     = ["crates"]
why       = "The reconciliation identity and rollback both require the dual write and both are release requirements, not deployment choices. Swapping the composition root back to Ledger::new() would keep its own books correctly and lose the legacy mirror, with no test anywhere going red."

# PROVEN INSTANCE 1 — THE PRODUCTION AUDIT CHAIN IS UNSIGNED.
#
# EVIDENCE THAT RE-RUNS:
#   grep -rn "signing_with" --include="*.rs" --exclude-dir=target . | grep -v "/tests/" | grep -v "tests.rs"
#     → 1 hit: crates/busbar-kernel-audit/src/record.rs:356, the DEFINITION itself. Every other hit
#       in the tree is under a tests/ path.
#   grep -rn "AuditChain::new()" --include="*.rs" --exclude-dir=target . | grep -v "/tests/" | grep -v "tests.rs"
#     → 2 hits: record.rs:320 (the `Default` impl, i.e. its own constructor) and
#       crates/busbar/src/root/durability.rs:774 — the ONE production construction site, with no
#       signer attached and no config anywhere supplying a key.
#
# This is NOT a money row and it is not being closed by an agent: it is a security capability that
# is built, tested and switched off. Declared `unshipped` so the gate is honest about HEAD rather
# than permanently red; the row prints on every run and `stale-declaration` reds the moment it is
# wired, so it cannot be forgotten and cannot be silently retired.
[[capability]]
id        = "audit-chain-signing"
built     = "crates/busbar-kernel-audit/src/record.rs"
symbol    = "signing_with"
construct = [".signing_with("]
# THE WHOLE WORKSPACE, deliberately. There are two composition paths — `crates/busbar/src` (the bin
# crate's root) and `crates/busbar-kernel/src/appbuild.rs`, where the tree's OTHER key wiring lives
# (`auth.signing_key` -> resolve_signing_key -> gs.set_signing_key, an UNRELATED token-signing key).
# Scoping to either would leave a reader wondering about the rest. The answer is the same everywhere:
# nothing calls it. One root also means ONE walk shared by every row below.
scope     = ["crates"]
why       = "Every deployed node seals an audit chain whose tamper-evidence is UNSIGNED. A full signing implementation with sixteen green tests sits beside it and has zero non-test callers, so the chain walk proves only that records hash to themselves — not that THIS node produced them."
unshipped = true
switch    = "STRIKE THIS ROW in the same commit that gives the composition root a signing key and calls .signing_with() on the chain it builds in crates/busbar/src/root/durability.rs. That commit must also add the config seam that supplies the key, because a builder with no key source is the same defect one layer down."

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# THE SWEEP OF 2026-09-22 — capabilities found built, tested and never constructed.
#
# Every row below was verified with the SAME absence grep, which anyone can re-run:
#
#   grep -rn --include="*.rs" --exclude-dir=target -E '<construct>' . \
#     | grep -v '/tests/' | grep -v 'tests\.rs' | grep -v '/fuzz/'
#
# and in every case the only surviving hit is the DEFINITION itself. None of these is being CLOSED
# here: this file records that they do not run. The money rows are PARKED-OWNER in the ledger and an
# owner signs them, not an agent.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

# BREAKER — `breaker-request-budget` STRUCK 2026-09-25 (item 142, the breaker fold; K2-0 one-breaker
# ruling Q40/Q47): the kernel's admission path now runs on the one breaker, and `HealthState` declares
# every lane's `max_requests` through `BreakerUnit::set_budget` when it is built (store/in_memory/
# mod.rs). The lane spends, refunds and reads that same counter — the unit's own, shared by handle —
# so the cap is counted once, where it always was, and never beside it.

# BREAKER — `breaker-error-map` STRUCK 2026-09-25 (item 142 residue, #47, Q67 one classifier):
# `BreakerUnit::set_error_map` and `BreakerUnit::classify` are DELETED. They were a second
# classifier nothing read; the operator's `error_map` is read once, by the plane's own classifier,
# and the one breaker takes that classifier's verdict.

# BREAKER — `breaker-with-limits` STRUCK 2026-09-25 (item 142, the breaker fold): `HealthState` builds
# its one breaker with `BreakerUnit::new().with_limits(hard_down_cooldown_secs,
# max_honored_retry_after_secs)` from the two live `limits.*` keys, and every hard-down trip and every
# honoured Retry-After ceiling reads them back from the unit. No second copy of either knob remains.

