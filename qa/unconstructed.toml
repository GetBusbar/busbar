# PLANE PLUGINS — `plane-plugin-open` STRUCK 2026-09-25 (UC-GATE): 45a4bea96 (K4 keystone, item 40)
# wired it. `main.rs` → `register_planes` → `root::linked::dropped_planes_of` →
# `PluginRegistry::open_planes`, which opens every loadable `kind: plane` plugin through `open_plane`
# (`crates/plugin-loader/src/registry.rs`), so a node loads a dropped-in plane at boot.

# MID-LOG CORRUPTION — row `wal-corruption-verdict` STRUCK 2026-09-24 by owner ruling:
# `recover_and_truncate` now branches on the scan's verdict (`.was_torn(`): a torn tail is cut
# silently; a Corrupt one has its damaged remainder copied and synced to
# `<segment>.quarantine-<unix_ms>` BEFORE the cut, and the verdict is returned through
# `Wal::quarantined()` for the root to log, count and journal (`Journal::record_quarantines`).

# THE CRASH-RECOVERY MODULE — row `crash-recovery-open-holds` STRUCK 2026-09-24 (item 127): the
# boot path calls it. `crates/busbar/src/root/durability.rs` → `build_for_node` reads every hold the
# journal holds open (written at unit entry by `Durability::open_hold`) back into a `HoldRecord` and
# hands them to `busbar_kernel::recovery::recover_all`, before anything can settle onto the book.
# Its note is RECONCILED with the struck `wal-corruption-verdict` row: the log's own
# `busbar_kernel_wal::TailVerdict` carries the same three arms (Clean / Torn / Corrupt { at }) and
# the same `truncates()` policy as `busbar_kernel::recovery::TailVerdict` — only a non-Corrupt
# verdict is cut without a copy.

# `breaker-pool-observation` STRUCK 2026-09-25 (item 142 residue): the root's BreakerPolicy is built
# `BreakerPolicy::from_pools` from the configured `pools:` (every pool `.with_pool` under its resolved
# `breaker:` block), and the root's BreakerAdapter is bound `over_kernel` to the kernel lane store's
# own BreakerUnit — one cell set on the node, not a second one beside it.

# THE ABI MINOR WAS BUMPED 19->20 FOR A CAPABILITY WITH NO PRODUCER AND NO CONSUMER.
# `plugin-abi-keyed-units` STRUCK 2026-09-24 by owner ruling: the host decodes keyed units on the
# real metering path (plane_host/govern.rs decode_usage_units), so the capability has a consumer.

# MONEY — `hold-late-accrual-parent-exit` STRUCK 2026-09-26 (UC-HOLD, owner ruling Q71(4)): the
# loop's one terminal (`crates/busbar-kernel/src/teller.rs` → `at_parent_exit`) converts a child's
# accrual to its own hold when the parent's cell is already taken at the child's end — sized by the
# door (`Units::at_parent_exit`; the budget door's `AdmissionUnit::at_parent_exit` draws it against
# the slice and refuses on the budget block where the slice cannot back it) and swapped into the
# child's cell, so the exit settles it against a reservation instead of posting it late against
# nothing. A refused child ends `Failed(Admit, OverBudget)` and its accrual still posts, late.

# MONEY — `rate-card-multi-currency` STRUCK 2026-09-25 (UC-STRIKE, #66 OWNER-LOCKED + spec Q4 "no
# currency"): the mutators `RateCard::set_rate`/`set_fee` had no production caller and are DELETED —
# a card is built whole by its constructors, so no second path can move a price.

