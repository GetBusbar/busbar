id        = "breaker-request-budget"
built     = "crates/busbar-kernel-breaker/src/lib.rs"
symbol    = "set_budget"
construct = [".set_budget("]
scope     = ["crates"]
why       = "BreakerAdapter::admissible() answers from budget_remaining(dest) != Some(0), and no destination ever HAS a budget, so the lifetime request cap config.yaml documents as max_requests can never refuse anything on the root's breaker path."
unshipped = true
