# `Pricer::with_card` had no production caller and is DELETED — it was the pre-item-123 reserved-four
# RateNanos constructor, superseded by `Pricer::from_card` (the ledger's one card). The stub second
# node's `Pricer::flat(0)` stays with item 245; if that door ever needs a card, it is `from_card`.

