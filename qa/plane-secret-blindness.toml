# plane-secret-blindness: DRAIN-ONLY ledger (THE DESIGN §6: a plane never receives secret
# bytes). Each row is a plane site that still resolves a secret reference, OWED to the slot
# that gives it a host-held replacement: a2a/voice provider credentials and the mcp
# token-exchange subject token to the auth styles (step 21); the mcp stdio child's
# environment to the stdio transport (CONNECTOR). Strike a row in the commit that drains
# it; never add one. Regenerate with `cargo xtask gate plane-secret-blindness --write`.

[[finding]]
rule = "plane-secret-blindness:names-a-resolver"
file = "crates/busbar-a2a/src/a2a/creds.rs"
item = "SecretResolve"

[[finding]]
rule = "plane-secret-blindness:names-a-resolver"
file = "crates/busbar-a2a/src/a2a/mod.rs"
item = "secret_resolver"

[[finding]]
rule = "plane-secret-blindness:names-a-resolver"
file = "crates/busbar-a2a/src/a2a/originate.rs"
item = "secret_resolver"

[[finding]]
rule = "plane-secret-blindness:names-a-resolver"
file = "crates/busbar-a2a/src/a2a/receive.rs"
item = "secret_resolver"

[[finding]]
rule = "plane-secret-blindness:names-a-resolver"
file = "crates/busbar-a2a/src/a2a/transport.rs"
item = "SecretResolve"

[[finding]]
rule = "plane-secret-blindness:names-a-resolver"
file = "crates/busbar-mcp/src/mcp/client/stdio.rs"
item = "resolve_linked_string"

[[finding]]
