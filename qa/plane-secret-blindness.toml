# plane-secret-blindness: DRAIN-ONLY ledger (THE DESIGN, the trust boundary: a plane never receives secret
# bytes). Each row is a plane site that still resolves a secret reference or reads a resolved
# secret's bytes, OWED to the slot that gives it a host-held replacement: a2a/voice provider
# credentials to the auth styles (step 21); the legacy engines' expose_secret reads to their
# deletion (row 155). An exposes-secret-bytes row is COUNTED (`count = N`, one per line) and
# only goes down. Strike a row (or lower its count) in the commit that drains it; never add
# one. `cargo xtask gate plane-secret-blindness --write` regenerates the keys; it does not
# write counts, so a regenerated ledger restates each count before it is committed.

[[finding]]
rule = "plane-secret-blindness:exposes-secret-bytes"
file = "crates/busbar-a2a/src/a2a/creds.rs"
item = "expose_secret"
count = 2

