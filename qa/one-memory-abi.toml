# ── Q77-PENDING (a): THE R2 RE-SPELLINGS OF THE COLD LANE'S CALL SHAPES — EXPIRES AT M6-COLD-DELETE ──
# ARCHITECT ruling 2026-10-01 on one-memory-abi:cold-lane (fallback approved as Q77-PENDING class
# (a), a cited spec-forced move): R2 (the loader re-exports no contract type, 9a391817c) deleted
# the loader shims that spelled these references, so the same live cold-lane call shapes
# (EndpointRequest/EndpointResponse, HostResult/HttpRequest/HttpResponse, ColdEntry; spec R2-A:
# linked COLD rows dispatch through the ColdEntry boundary) are now named at abi::cold. The
# vocabulary the memory ABI speaks left abi/cold first (abi::export, abi::mechanism::route), so
# what remains is the cold lane's own plumbing. Each row is COUNTED (lines carrying the item) and
# lower-only: a new reference fails. All of it is deleted at M6-COLD-DELETE (the M6 checklist:
# "delete abi/cold and abi/hot"). Test files are not scanned by this gate (src/** outside /tests/
# only), so the block has no test rows.

[[finding]]
rule = "one-memory-abi:cold-lane"
file = "crates/busbar/src/root/linked.rs"
item = "abi::cold"
count = 16
expires = "M6-COLD-DELETE"

