# qa/segment-debt.toml -- THE DIALECT NAMES NEUTRAL CRATES WRITE AS IDENTIFIER SEGMENTS.
#
# `PROTO_GEMINI`, `gemini_path` and `anthropic_adaptive_thinking` name a dialect, and the scanner's
# whole-word rule (`_` is part of a word) could not see them. `scanner::segment_ci` can (a dialect
# bounded by non-alphanumerics, so `_` is a joint between segments). The hits it found the day it
# landed are DEBT, listed here, row by row, and the list is DRAIN-ONLY:
#
#   * a listed segment-only hit is excluded from the DIALECT counts (plane-purity's rows and strict
#     ceilings, the construction `neutral-no-dialect` hit artefact, kind-isolation's `vendor` axis),
#     so no existing ceiling moves;
#   * an UNLISTED segment-only hit counts as an ordinary DIALECT hit, and `plane-purity:segment-debt`
#     is RED naming its file:line and text (production neutral scope);
#   * a row that matches no live hit is STALE and RED ("strike it"): the debt was paid.
#
# A row lists a hit when FILE and TEXT are equal. `line` is informational (line numbers drift with
# every edit above them); `text` is the trimmed source line exactly as the scanner's `Hit.code`
# holds it (comments stripped, string literals kept). Matching is ROW BY ROW: one row per hit line,
# and each live segment-only hit consumes one unconsumed row of the same file and text, so a new
# identical line has no row left (RED) and a row no hit consumed is stale (RED). The `responses`
# dialect is not matched as a segment (scanner::SEGMENT_COLLISIONS: it is the frozen OpenAPI
# `responses` object key). Rows are never added by hand to make a gate green: pay the debt in the
# neutral crate, then strike the row.
#
# Rows under a plane-purity neutral root are judged by `plane-purity:segment-debt`; rows under
# crates/busbar (the composition root, which plane-purity does not list) by kind-isolation's vendor
# scan. Production and test scope are both listed, because both feed counts that have ceilings.

