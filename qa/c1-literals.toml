# c1-literals: DRAIN-ONLY ledger (M0 ABI-SPEC, REPORT-ONLY).
# THE RULE (ARCHITECT ruling on M0): a plane's dialect or protocol name, a plugin
# instance name, an auth style or a transport scheme (http, https, h2, grpc, sse, ws,
# wss, websocket, tcp, stdio, unix; BUSBAR-1.6.0.md l.98-102) spelled by the kernel or
# the loader IS a C1 leak. The word list is VOCABULARY, and the exact strings read
# past (an identifier URI, a frozen env var, `unix` as time or the OS) are MASKS, in
# xtask/src/gates/c1_literals.rs.
# The kernel and the loader name no plugin, style or protocol: each row is a file and
# the vocabulary word one of its string literals (or a manifest's feature) spells
# today. Strike a row in the commit that drains it; never add one.
# Regenerate with `cargo xtask gate c1-literals --write`.

