# THE SCRIPT ALLOWLIST: every tracked .py, .sh and .bash file in this tree, and why it is still here.
#
# OWNER 2026-10-02: "drop as much python ... as possible to rust", "minimal to no .sh". Product checks
# and gates are `cargo xtask`; release tooling is busbar-release. `cargo xtask gate script-allowlist`
# is RED on a script this file does not list, on an entry whose file is gone, and on an entry with
# no class or a reason too short to be one. A port or a deletion strikes its entry in the same
# commit; a new script needs an entry here and a reviewer who agrees with its reason.
#
# class:  port     becomes Rust (the reason says where); still here until the port proves itself
#         keep     minimal glue or user-facing content where Rust is worse; the bar is high
#         external an upstream suite we run but do not own, fetched pinned at run time
#         retire   dead, held only by the named blocker
#         oracle-driver  an oracle cell driver, rig or conformance runner; held for 1.6.0 (ARCHITECT
#                  2026-10-02): porting it would re-stamp the 1.5.5 golden, which is forbidden

