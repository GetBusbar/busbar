# What predev must pass to move into dev: the `dev` rung (gates, oracle, conformance), the 1.6.0
# done-oracle, and the Q128 architecture audit (`cargo xtask q128 audit`). ModernCI names a branch
# file for the branch being moved, so the move predev -> dev reads this file, and ModernCI alone
# judges it: promote.yml, the busbar-release hop that judged it before, is deleted (OWNER
# 2026-10-12, "ModernCI only"; docs/design/BUSBAR-1.6.0.md Part 6, "BUSBAR-RELEASE RETIRED FROM
# BUSBAR"). Its green landing is DEV-GREEN.
to: dev
on_green: merge
# The owner's approval on the pull request holds the merge too; q128-audit gates the move on the
# audit's record for the commit (no open BLOCK).
approve: true
deadline: 6h
env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
on:
  move: [gates, oracle, conformance, verify-done, q128-audit]
checks:
  gates:
    # The rung inherits predev's boarded gates; here they are re-run on the commit, no worse than
    # dev, as the predev file runs them.
    run: |
      export XTASK_CEILING_BASE="$MODERNCI_TO_SHA" XTASK_SHIP_TARGET="$MODERNCI_TO"
      cargo xtask gate --all --format=tsv
    baseline: target
    rules: ["qa/*.toml"]
    # The ceiling ratchet reads the merge-base (XTASK_CEILING_BASE), as in .ci/default.yaml: only a
    # backend with the repo's history may run this check.
    requires: [git-history]
  oracle:
    # busbar's own check tool, the pinned busbar-oracle (the backend's busbar-oracle tool sets
    # BUSBAR_ORACLE_RUST_BIN): the judge is the one dev's oracle-rust.pin names, run only when its
    # sha256 is that pin's for this host (a candidate never picks its own judge); the 1.5.5 golden is
    # add-only from dev to this commit; then the candidate's release binary is recorded over the
    # corpus and replayed against the committed 1.5.5 golden, strict: green is every cell byte-green
    # or forgiven by an owner-signed accepted difference.
    #
    # THE FIRST MOVE. dev is the v1.5.5 commit until predev first lands on it, and that commit has no
    # testing/shadow-oracle at all, so it names no judge. Then, and only then, the judge is the
    # busbar-oracle ModernCI installed on the backend (queue rule 11: ModernCI runs only the pinned
    # install), and one line says so. The candidate's own pin is never read. A target that has the
    # oracle data but no pin, or a target this checkout does not hold, names no judge: RED.
    # golden-guard already reads a target with no golden as one where every cell is added.
    # `judge_selftest` proves those five arms on throwaway repos before the real target is judged.
    run: |
      set -euo pipefail
      judge() { # judge <repo> <target sha> <installed busbar-oracle>
        local repo=$1 to=$2 bin=$3 want
        local pin=testing/shadow-oracle/oracle-rust.pin
        git -C "$repo" cat-file -e "$to^{commit}" 2>/dev/null \
          || { echo "ORACLE-PIN: the target $to is not in this checkout, so it names no judge"; return 1; }
        if git -C "$repo" cat-file -e "$to:$pin" 2>/dev/null; then
          want=$(git -C "$repo" show "$to:$pin" | sed -n "s/^sha256_linux_$(uname -m)=//p")
          [[ "$want" =~ ^[0-9a-f]{64}$ ]] || { echo "ORACLE-PIN: oracle-rust.pin at $to pins no linux $(uname -m) judge"; return 1; }
          echo "$want  $bin" | sha256sum -c - || return 1
        elif git -C "$repo" cat-file -e "$to:testing/shadow-oracle" 2>/dev/null; then
          echo "ORACLE-PIN: $to holds testing/shadow-oracle but no oracle-rust.pin, so it names no judge"
          return 1
        else
          [ -x "$bin" ] || { echo "ORACLE-PIN: no backend-installed busbar-oracle at '$bin'"; return 1; }
          echo "ORACLE-PIN: the target $to predates oracle-rust.pin (the first move onto it); judging with the backend-installed busbar-oracle $bin, sha256 $(sha256sum "$bin" | cut -d' ' -f1)"
        fi
      }
      judge_selftest() {
        local t r bin good fails=0 pre pinned wrong unpinned
        t=$(mktemp -d); r="$t/r"; bin="$t/busbar-oracle"
        printf 'judge\n' >"$bin"; chmod +x "$bin"; good=$(sha256sum "$bin" | cut -d' ' -f1)
        g() { git -C "$r" -c core.hooksPath=/dev/null -c user.name=selftest -c user.email=selftest@invalid "$@"; }
        git init -q "$r"
        g commit -q --allow-empty -m v1.5.5; pre=$(g rev-parse HEAD)
        mkdir -p "$r/testing/shadow-oracle"
        printf 'sha256_linux_%s=%s\n' "$(uname -m)" "$good" >"$r/testing/shadow-oracle/oracle-rust.pin"
        g add -A; g commit -q -m pinned; pinned=$(g rev-parse HEAD)
        printf 'sha256_linux_%s=%064d\n' "$(uname -m)" 0 >"$r/testing/shadow-oracle/oracle-rust.pin"
        g commit -q -am wrong; wrong=$(g rev-parse HEAD)
        printf '{}\n' >"$r/testing/shadow-oracle/cells.json"; g rm -q testing/shadow-oracle/oracle-rust.pin
        g add -A; g commit -q -m unpinned; unpinned=$(g rev-parse HEAD)
        expect() { # expect <ok|red> <why> <target> [bin] [output substring]
          local out rc=0
          out=$(judge "$r" "$3" "${4:-$bin}" 2>&1) || rc=$?
          if { [ "$1" = ok ] && [ $rc -eq 0 ]; } || { [ "$1" = red ] && [ $rc -ne 0 ]; }; then
            if [ -n "${5:-}" ] && [[ "$out" != *"$5"* ]]; then echo "  MISS: $2 (no '$5' in: $out)"; fails=$((fails+1)); else echo "  ok: $2"; fi
          else echo "  MISS: $2 (rc $rc: $out)"; fails=$((fails+1)); fi
        }
        expect ok "a target whose pin names this judge" "$pinned"
        expect red "a target whose pin names another judge" "$wrong"
        expect red "a target with oracle data and no pin" "$unpinned" "" "no oracle-rust.pin"
        expect red "a target this checkout does not hold" 0000000000000000000000000000000000000000 "" "not in this checkout"
        expect ok "a target that predates the oracle: the installed judge, said in one line" "$pre" "" "predates oracle-rust.pin"
        expect red "a target that predates the oracle and no installed judge" "$pre" "$t/absent"
        rm -rf "$t"
        [ "$fails" -eq 0 ] || { echo "ORACLE-PIN self-test: $fails arm(s) did not hold"; return 1; }
      }
      judge_selftest
      judge . "$MODERNCI_TO_SHA" "$BUSBAR_ORACLE_RUST_BIN"
      "$BUSBAR_ORACLE_RUST_BIN" golden-guard --repo . --base "$MODERNCI_TO_SHA" --head HEAD
      cargo build --locked --release -p busbar --bin busbar
      ./bin/oracle fetch-golden
      rm -rf target/oracle/recordings/candidate target/oracle/reports/dev
      ./bin/oracle record --bin target/release/busbar --plane all --out target/oracle/recordings/candidate
      ./bin/oracle replay --golden testing/shadow-oracle/golden/1.5.5 --candidate target/oracle/recordings/candidate --out target/oracle/reports/dev --strict
    # golden-guard and the judge's target both read history (`git merge-base`, `git show <target>:`).
    requires: [git-history]
    needs: [gates]
  conformance:
    # Every registered suite recorded on this commit (the llm rigs judge the oracle's candidate
    # recording), then every MUST a fresh pass for it. A not-run suite denies.
    # The instruments the rigs call from PATH are provided here, each fetched once per pin (sha256
    # checked) into a cache that outlives the run: Go (h2spec publishes no linux/arm64 binary, so it
    # is built from its tagged source), h2spec v2.6.0, testssl.sh v3.2.0, slsa-verifier v2.7.1. The self-hosted OIDF suite (oidf-oauth2, fapi2) runs in the backend's docker. A suite
    # whose instrument cannot be provided stays not-run and denies; nothing here marks one optional.
    run: |
      set -euo pipefail
      T="${XDG_CACHE_HOME:-$HOME/.cache}/busbar-conformance-tools"
      mkdir -p "$T/bin"
      case "$(uname -m)" in
        aarch64|arm64) GOARCH=arm64; GO_SHA=4a97373d49fcacdcf3694fea368a500b00ee3e963974f3e7514132717632f052; SLSA_SHA=5d3b2349ede7bfec19e7a21569f18b9f7410145ad12e9584b175370669e14061 ;;
        x86_64) GOARCH=amd64; GO_SHA=42d158b4d8f7b61ac0a830567c940a86098fb7aac52e467a5ebec03ef5cc2f8d; SLSA_SHA=946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339 ;;
        *) echo "conformance tools: no pins for $(uname -m)"; exit 1 ;;
      esac
      fetch() { # url sha256 dest
        if [ -f "$3" ] && echo "$2  $3" | sha256sum -c - >/dev/null 2>&1; then return 0; fi
        curl -fsSL --retry 3 -o "$3.part" "$1" && echo "$2  $3.part" | sha256sum -c - >/dev/null && mv "$3.part" "$3"
      }
      if [ ! -x "$T/go/bin/go" ]; then
        fetch "https://go.dev/dl/go1.26.9.linux-$GOARCH.tar.gz" "$GO_SHA" "$T/go.tgz"
        rm -rf "$T/go"; tar -C "$T" -xzf "$T/go.tgz"
      fi
      if [ ! -x "$T/bin/h2spec" ]; then
        rm -rf "$T/h2spec-src"; git clone -q --depth 1 --branch v2.6.0 https://github.com/summerwind/h2spec "$T/h2spec-src"
        [ "$(git -C "$T/h2spec-src" rev-parse HEAD)" = 70ac2294010887f48b18e2d64f5cccd48421fad1 ] || { echo "h2spec v2.6.0 is not the pinned commit"; exit 1; }
        (cd "$T/h2spec-src" && GOPATH="$T/gopath" GOFLAGS=-mod=mod "$T/go/bin/go" build -o "$T/bin/h2spec" ./cmd/h2spec)
      fi
      fetch "https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.1/slsa-verifier-linux-$GOARCH" "$SLSA_SHA" "$T/bin/slsa-verifier"
      chmod +x "$T/bin/slsa-verifier"
      if [ ! -x "$T/bin/testssl.sh" ]; then
        fetch "https://github.com/testssl/testssl.sh/archive/refs/tags/v3.2.0.tar.gz" f3969c152c0fe99a2a90e8c8675ab677d77608ac77c957a95497387c36363c32 "$T/testssl.tgz"
        rm -rf "$T/testssl"; mkdir "$T/testssl"; tar -C "$T/testssl" --strip-components=1 -xzf "$T/testssl.tgz"
        ln -sf "$T/testssl/testssl.sh" "$T/bin/testssl.sh"
      fi
      export PATH="$T/bin:$PATH"
      cargo xtask conformance record --all --recording target/oracle/recordings/candidate
      cargo xtask conformance check --musts --sha "$MODERNCI_COMMIT" --format=tsv
    needs: [oracle]
    # The self-hosted OIDF suite runs in the backend's docker; ModernCI places this check only on a
    # backend probed to have all of these, and says which one is missing otherwise.
    requires: [docker, docker-compose, python3-venv, curl, git]
  verify-done:
    # The done-oracle, full run: exit 0 only (3 is a --fast, provisional answer).
    run: bash scripts/verify-1.6.0-done.sh
    needs: [gates]
  q128-audit:
    # DEV-GREEN item 5 (docs/design/BUSBAR-1.6.0.md l.2910-2912; 1.6.0-QUESTIONS.md Q128, option
    # A): one fresh, independent architecture audit on this commit with no open BLOCK, and a clean
    # audit ledger. The auditor records the audit in qa/q128-audit.json; this judges that record and
    # the ledger on the commit, writes target/q128-audit.json (every finding, severity
    # BLOCK/HIGH/MEDIUM/LOW, scope, evidence) and exits 1 on any open BLOCK. An audit of another
    # tree, or none, is a BLOCK.
    run: cargo xtask q128 audit
    needs: [gates]
