# Repository settings ModernCI reads from the protected config.
#
# merge_drivers: a conflict in a file whose `.gitattributes` names `merge=<driver>` is settled by
# that driver's command, run at the merged checkout's root with git's placeholders (%O base,
# %A ours -- rewritten in place -- and %B theirs). Exit 0 is settled; anything else leaves the
# conflict, with the command's output as the reason.
#
# ledger-count: the count rows of qa/kind-isolation.toml are measurements, so a row both sides
# moved settles at theirs + ours - base (xtask/src/ledger_merge.rs). The gates re-measure every
# merged tree, so a wrong sum is a red, never a hidden one.
merge_drivers:
  ledger-count:
    run: "cargo xtask ledger-merge %O %A %B"
    timeout: 15m

