# What a lane must pass to enter dev, judged by ModernCI on the lane merged onto dev's tip, no
# worse than dev itself. Five checks (OWNER 2026-10-24): fmt, clippy, test, deny (+ vet), oracle.
to: dev
on_green: merge
deadline: 6h
# The oracle's judge and what it judges against: a change that rewrites them would grade itself
# (the #1556 review). Kept when the qa/** and xtask/** guards went with those files (2026-10-24).
guarded:
  - "bin/oracle"
  - "testing/shadow-oracle/oracle-rust.pin"
  - "testing/shadow-oracle/golden/**"
  - "testing/shadow-oracle/accepted-differences.json"
  - "testing/shadow-oracle/owed-baseline.txt"
  - "testing/shadow-oracle/scripts/**"
on:
  # All five on every move (OWNER 2026-10-24: busbar uses the app; no hand-run oracle passes). D-1
  # is re-signed at 510 cells.
  move:
    - fmt
    - clippy
    - test
    - deny
    - oracle
    # The conformance suites (testing/conformance/suites.tsv): every move and every landing, never
    # blocking (owner 2026-10-26: a suite not run or not passed in dev is a gap in our CI).
    - checks: [conformance]
      blocks: false
  landed: [conformance]
  # CodeQL (off GitHub code scanning default setup, 2026-10-26): daily at dev's tip and on request;
  # it reports, never gates.
  schedule:
  - cron: "0 7 * * *"
    checks: [codeql]
  manual: [codeql]
# Step 5: dist/default is its own workspace and embeds core's source, so a change to it or to
# crates/busbar runs every scoped check whole (the dist half carries no -p to narrow by).
affected:
  whole_run_paths:
    - "dist/**"
    - "crates/busbar/**"
env:
  # The oracle's judge, as bin/oracle reads it under ModernCI (only from the config's env, never the
  # candidate's pin): testing/shadow-oracle/oracle-rust.pin on dev; fetched with BUSBAR_RELEASE_TOKEN.
  BUSBAR_ORACLE_RELEASE_REPO: https://github.com/GetBusbar/busbar-release.git
  BUSBAR_ORACLE_RELEASE_REF: cb53de4b25e5d70c37b1de0037ea5150867e6d20
  BUSBAR_ORACLE_SHA256_LINUX_X86_64: 0f6c0433bc2089af5a8958b5e2e237c86c065b15c38e015225fa3faf4ab6f0e8
  BUSBAR_ORACLE_SHA256_LINUX_AARCH64: 2eb4ba75b54f34410a95a3994b41275bbd5b7a06d76571d8628a43b1ef3fb2cf
  BUSBAR_ORACLE_CRATE: busbar-release-oracle
  BUSBAR_ORACLE_BIN: busbar-oracle
  # The 1.5.5 golden the replay judges against: git rev-parse dev:testing/shadow-oracle/golden/1.5.5.
  BUSBAR_GOLDEN_1_5_5_TREE: 5e33e76f77af35b01674da6dedf37e8dd434602c
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  BUSBAR_TOOL_SH: |
    # Sourced by a ModernCI check: `. .ci/tool.sh nextest deny jq`
    # Puts each named tool, at the version pinned below, on PATH. The checks own their toolchain:
    # a tool already on PATH at exactly the pin is used; otherwise the official release asset is
    # fetched with curl, verified against the sha256 pinned here, and cached under
    # ${MODERNCI_CACHE_DIR:-$HOME/.cache}/busbar-ci-tools/<tool>-<version>/.
    # `rust` is the exception: if cargo is already on PATH it is left alone, else rustup-init is
    # fetched, verified and run with RUSTUP_HOME/CARGO_HOME under the same root, and
    # $CARGO_HOME/bin goes on PATH and `rustup toolchain install` installs what rust-toolchain.toml names.
    # Assumes only Linux (or darwin), sh, git, curl, tar and CA certificates.
    # No sudo, no package manager. Unknown tool, unsupported platform or sha mismatch: message, return 1.

    _bbt_nextest_ver=0.9.148
    _bbt_deny_ver=0.20.2
    _bbt_jq_ver=1.7.1
    _bbt_rustup_ver=1.28.2
    _bbt_root=${MODERNCI_CACHE_DIR:-$HOME/.cache}/busbar-ci-tools

    # _bbt_pin <tool> <os-arch>: prints "<asset-url> <sha256> <path of the binary inside the asset>"
    _bbt_pin() {
      case "$1" in
        nextest)
          _u=https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$_bbt_nextest_ver/cargo-nextest-$_bbt_nextest_ver
          case "$2" in
            linux-x86_64)  echo "$_u-x86_64-unknown-linux-gnu.tar.gz 223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc cargo-nextest" ;;
            linux-aarch64) echo "$_u-aarch64-unknown-linux-gnu.tar.gz 81469eb963ef883fd590e60189e77d6aba3d91b418591d3391f50fe3e9480d2b cargo-nextest" ;;
            darwin-arm64)  echo "$_u-universal-apple-darwin.tar.gz 6c23b7fb4ca82c571fc8dfedbab45bfa773d45918f933170c85d21cd7f4b852b cargo-nextest" ;;
            *) return 1 ;;
          esac ;;
        deny)
          _u=https://github.com/EmbarkStudios/cargo-deny/releases/download/$_bbt_deny_ver/cargo-deny-$_bbt_deny_ver
          case "$2" in
            linux-x86_64)  echo "$_u-x86_64-unknown-linux-musl.tar.gz 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f cargo-deny-$_bbt_deny_ver-x86_64-unknown-linux-musl/cargo-deny" ;;
            linux-aarch64) echo "$_u-aarch64-unknown-linux-musl.tar.gz 995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d cargo-deny-$_bbt_deny_ver-aarch64-unknown-linux-musl/cargo-deny" ;;
            darwin-arm64)  echo "$_u-aarch64-apple-darwin.tar.gz fe67d82a10d8597a3549364cb733a3f9cc1bfff9031b7ae46384a9f2a72090c3 cargo-deny-$_bbt_deny_ver-aarch64-apple-darwin/cargo-deny" ;;
            *) return 1 ;;
          esac ;;
        jq)
          _u=https://github.com/jqlang/jq/releases/download/jq-$_bbt_jq_ver
          case "$2" in
            linux-x86_64)  echo "$_u/jq-linux-amd64 5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5 -" ;;
            linux-aarch64) echo "$_u/jq-linux-arm64 4dd2d8a0661df0b22f1bb9a1f9830f06b6f3b8f7d91211a1ef5d7c4f06a8b4a5 -" ;;
            darwin-arm64)  echo "$_u/jq-macos-arm64 0bbe619e663e0de2c550be2fe0d240d076799d6f8a652b70fa04aea8a8362e8a -" ;;
            *) return 1 ;;
          esac ;;
        *) return 1 ;;
      esac
    }

    _bbt_sha256() {
      if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1
      else shasum -a 256 "$1" | cut -d' ' -f1; fi
    }

    # _bbt_rust: cargo on PATH is left alone; else bootstrap rustup (no toolchain; rust-toolchain.toml picks it).
    _bbt_rust() {
      command -v cargo >/dev/null 2>&1 && return 0
      RUSTUP_HOME=$_bbt_root/rustup-$_bbt_rustup_ver/rustup; CARGO_HOME=$_bbt_root/rustup-$_bbt_rustup_ver/cargo
      export RUSTUP_HOME CARGO_HOME
      if [ ! -x "$CARGO_HOME/bin/cargo" ]; then
        _os=$(uname -s | tr '[:upper:]' '[:lower:]'); _arch=$(uname -m)
        case "$_os-$_arch" in
          linux-x86_64)  _t=x86_64-unknown-linux-gnu;  _sha=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c ;;
          linux-aarch64) _t=aarch64-unknown-linux-gnu; _sha=e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c ;;
          darwin-arm64)  _t=aarch64-apple-darwin;      _sha=20ef5516c31b1ac2290084199ba77dbbcaa1406c45c1d978ca68558ef5964ef5 ;;
          *) echo "tool.sh: no pinned rustup $_bbt_rustup_ver for $_os-$_arch (supported: linux-x86_64 linux-aarch64 darwin-arm64)" >&2; return 1 ;;
        esac
        _url=https://static.rust-lang.org/rustup/archive/$_bbt_rustup_ver/$_t/rustup-init
        _tmp=$_bbt_root/rustup-init.tmp.$$
        mkdir -p "$_tmp" || return 1
        echo "tool.sh: fetching rustup-init $_bbt_rustup_ver ($_url)" >&2
        if ! curl -fsSL --retry 3 -o "$_tmp/rustup-init" "$_url"; then
          echo "tool.sh: download of $_url failed" >&2; rm -rf "$_tmp"; return 1
        fi
        _got=$(_bbt_sha256 "$_tmp/rustup-init")
        if [ "$_got" != "$_sha" ]; then
          echo "tool.sh: sha256 mismatch for $_url: expected $_sha, got $_got" >&2; rm -rf "$_tmp"; return 1
        fi
        chmod +x "$_tmp/rustup-init"
        "$_tmp/rustup-init" -y --no-modify-path --default-toolchain none || { rm -rf "$_tmp"; return 1; }
        rm -rf "$_tmp"
      fi
      PATH="$CARGO_HOME/bin:$PATH"; export PATH
      # rustup 1.28.0 dropped the implicit install of the rust-toolchain.toml channel: install what it
      # names (toolchain and components) from the repo root. A no-op once installed.
      _root=$(git rev-parse --show-toplevel 2>/dev/null) || _root=.
      (cd "$_root" && rustup toolchain install) || { echo "tool.sh: rustup toolchain install failed" >&2; return 1; }
    }

    # _bbt_ensure <tool>
    _bbt_ensure() {
      case "$1" in
        rust) _bbt_rust; return $? ;;
        nextest) _bin=cargo-nextest; _ver=$_bbt_nextest_ver; _want="cargo-nextest $_ver"; _vargs="nextest --version" ;;
        deny)    _bin=cargo-deny;    _ver=$_bbt_deny_ver;    _want="cargo-deny $_ver"; _vargs=--version ;;
        jq)      _bin=jq;            _ver=$_bbt_jq_ver;      _want="jq-$_ver"; _vargs=--version ;;
        *) echo "tool.sh: unknown tool '$1' (known: rust nextest deny jq)" >&2; return 1 ;;
      esac
      # Already on PATH at exactly the pinned version.
      if command -v "$_bin" >/dev/null 2>&1; then
        _have=$("$_bin" $_vargs 2>/dev/null | sed -n 1p)
        case "$_have" in
          "$_want" | "$_want "*) return 0 ;;
        esac
      fi
      _dir=$_bbt_root/$1-$_ver
      if [ ! -x "$_dir/$_bin" ]; then
        _os=$(uname -s | tr '[:upper:]' '[:lower:]'); _arch=$(uname -m)
        _pin=$(_bbt_pin "$1" "$_os-$_arch") || {
          echo "tool.sh: no pinned $1 $_ver for $_os-$_arch (supported: linux-x86_64 linux-aarch64 darwin-arm64)" >&2
          return 1
        }
        set -- "$1" $_pin
        _url=$2; _sha=$3; _inner=$4
        mkdir -p "$_dir.tmp.$$" || return 1
        echo "tool.sh: fetching $_bin $_ver ($_url)" >&2
        if ! curl -fsSL --retry 3 -o "$_dir.tmp.$$/asset" "$_url"; then
          echo "tool.sh: download of $_url failed" >&2; rm -rf "$_dir.tmp.$$"; return 1
        fi
        _got=$(_bbt_sha256 "$_dir.tmp.$$/asset")
        if [ "$_got" != "$_sha" ]; then
          echo "tool.sh: sha256 mismatch for $_url: expected $_sha, got $_got" >&2
          rm -rf "$_dir.tmp.$$"; return 1
        fi
        if [ "$_inner" = - ]; then
          mv "$_dir.tmp.$$/asset" "$_dir.tmp.$$/$_bin"
        else
          tar -xzf "$_dir.tmp.$$/asset" -C "$_dir.tmp.$$" "$_inner" || { rm -rf "$_dir.tmp.$$"; return 1; }
          mv "$_dir.tmp.$$/$_inner" "$_dir.tmp.$$/$_bin"
        fi
        chmod +x "$_dir.tmp.$$/$_bin"
        rm -f "$_dir.tmp.$$/asset"
        rm -rf "$_dir"
        mv "$_dir.tmp.$$" "$_dir" || { rm -rf "$_dir.tmp.$$"; [ -x "$_dir/$_bin" ] || return 1; }
      fi
      PATH="$_dir:$PATH"; export PATH
    }

    for _bbt_t in "$@"; do
      _bbt_ensure "$_bbt_t" || return 1
    done
checks:
  fmt:
    requires: [cc]
    run: |
      if [ -f .ci/tool.sh ]; then . .ci/tool.sh rust; else _bbt_run() { eval "$BUSBAR_TOOL_SH"; }; _bbt_run rust; fi || exit 1
      cargo fmt --all -- --check
      cargo metadata --locked --format-version 1 >/dev/null
      # The default distribution (dist/default, its own workspace) from step 5 on.
      if [ -f dist/default/Cargo.toml ]; then cargo fmt --manifest-path dist/default/Cargo.toml --all -- --check; fi
    baseline: target
  clippy:
    requires: [cc]
    run: |
      if [ -f .ci/tool.sh ]; then . .ci/tool.sh rust; else _bbt_run() { eval "$BUSBAR_TOOL_SH"; }; _bbt_run rust; fi || exit 1
      cargo clippy --workspace --all-targets --all-features --locked --keep-going -- -D warnings
      if [ -f dist/default/Cargo.toml ]; then cargo clippy --manifest-path dist/default/Cargo.toml --workspace --all-targets --all-features --locked --keep-going --target-dir target -- -D warnings; fi
      cargo clippy --workspace --all-targets --no-default-features --locked --keep-going -- -D warnings
      cargo clippy -p busbar-kernel --no-default-features --features plane-a2a --locked -- -D warnings
      cargo clippy -p busbar-kernel --no-default-features --features plane-mcp --locked -- -D warnings
      cargo clippy -p busbar-kernel --no-default-features --locked -- -D warnings
    scope: affected
    baseline: target
  test:
    # Every behaviour test: the workspace suites (with the cdylibs and the dropped-in plugins they
    # dlopen built first), the feature-gated suites, the loom models, then the doctests.
    run: |
      if [ -f .ci/tool.sh ]; then . .ci/tool.sh rust nextest jq; else _bbt_run() { eval "$BUSBAR_TOOL_SH"; }; _bbt_run rust nextest jq; fi || exit 1
      if [ -f dist/default/Cargo.toml ]; then
        # STEP 5 LAYOUT. Core (this workspace) links no plugin: its suites, the loader's example
        # cdylibs its tests dlopen, the feature-gated kernel/admin suites, loom and doctests.
        meta=$(cargo metadata --format-version 1 --locked)
        cargo build --locked $(echo "$meta" | jq -r '.workspace_members as $m | .packages[] | select(.id as $i | $m | index($i)) | select(any(.targets[]; .kind | index("cdylib"))) | "-p " + .name')
        cargo build --locked -p busbar-plugin-loader --examples
        # The dropped-in plugins the core and distribution tests dlopen (the pinned http transport
        # the connector's suites drive among them), resolved through the distribution, into target/.
        D=dist/default/Cargo.toml
        dmeta=$(cargo metadata --format-version 1 --locked --manifest-path "$D")
        cargo build --locked --manifest-path "$D" --examples --target-dir target
        plugin() {
          man=$(echo "$dmeta" | jq -r --arg p "$1" 'first(.packages[] | select(.name == $p) | .manifest_path) // empty')
          if [ -z "$man" ]; then [ "$3" = optional ] && return 0; echo "the distribution resolves no $1"; return 1; fi
          ws="$(dirname "$man")/Cargo.toml"
          pkgs=$(cargo metadata --format-version 1 --no-deps --manifest-path "$ws" | jq -r '.packages[].name')
          if ! printf '%s\n' $pkgs | grep -qx "$2"; then [ "$3" = optional ] && return 0; echo "$1 has no $2"; return 1; fi
          if [ "$3" = dropped-in ] && cargo metadata --format-version 1 --no-deps --manifest-path "$ws" | jq -e --arg p "$2" '.packages[] | select(.name == $p) | .features | has("dropped-in")' >/dev/null; then
            cargo build --locked --manifest-path "$ws" -p "$2" --features dropped-in --target-dir "$PWD/target"
          else
            cargo build --locked --manifest-path "$ws" -p "$2" --target-dir "$PWD/target"
          fi
        }
        plugin busbar-transport-tcp-plugin busbar-transport-tcp-plugin dropped-in
        plugin busbar-transport-http busbar-transport-http-plugin dropped-in
        plugin busbar-secret-env busbar-secret-env-plugin optional
        plugin busbar-plane-decisions busbar-plane-decisions-plugin optional
        cargo build --workspace --locked
        cfg=$(mktemp); printf '%s\n' '[profile.default]' 'slow-timeout = { period = "60s", terminate-after = 5 }' > "$cfg"
        # $MODERNCI_ONLY: ModernCI re-runs one suspect test alone (a flake check).
        cargo nextest run --workspace --locked --no-fail-fast --tool-config-file "modernci:$cfg" ${MODERNCI_ONLY:+-E "$MODERNCI_ONLY"}
        cargo nextest run --locked --no-fail-fast -p busbar-kernel -p busbar-core-admin --features busbar-kernel/timing,busbar-kernel/openapi-schema,busbar-core-admin/openapi-schema -E 'binary(timing_smoke) | package(busbar-core-admin) | (package(busbar-kernel) & test(/timing::/))'
        cargo nextest run --locked --no-fail-fast -p busbar-plugin-loader --features pack -E 'binary(/busbar-plugin-pack/)'
        timeout 3000 cargo test --release --locked -p busbar-kernel --features loom-model txn_loom
        cargo test --workspace --doc --locked --no-fail-fast
        # The default distribution (dist/default): core's source with the standard plugins linked,
        # the root's tests, and the dropped-in plugins they load built first. One target dir.
        cargo build --locked --manifest-path "$D" --target-dir target
        cargo nextest run --locked --manifest-path "$D" --target-dir target --workspace --no-fail-fast --tool-config-file "modernci:$cfg" ${MODERNCI_ONLY:+-E "$MODERNCI_ONLY"}
        cargo nextest run --locked --manifest-path "$D" --target-dir target --no-fail-fast --features test-harness,transport-webrtc,openapi-schema -E 'binary(mcp_stdio_serve) | binary(hook_parity_driver) | binary(admin_cross_plane) | (package(busbar-default) & test(/(serve_tests|secret_source|connector|boot)::/))'
      else
        meta=$(cargo metadata --format-version 1 --locked)
        cargo build --locked $(echo "$meta" | jq -r '.workspace_members as $m | .packages[] | select(.id as $i | $m | index($i)) | select(any(.targets[]; .kind | index("cdylib"))) | "-p " + .name')
        # The example cdylibs the tests dlopen, built BY NAME and always: the loader's (the neutral frame
        # door and the other door fixtures, which busbar's and the connector's tests load too) and
        # busbar's test plane. A run scoped to `busbar` alone builds no other package's examples, and a
        # test whose fixture is absent fails rather than skips; no variable tells this step the
        # affected set, so the build does not wait on one.
        cargo build --locked -p busbar-plugin-loader --examples
        cargo build --locked -p busbar --examples
        plugin() {
          man=$(echo "$meta" | jq -r --arg p "$1" 'first(.packages[] | select(.name == $p) | .manifest_path) // empty')
          if [ -z "$man" ]; then [ "$3" = optional ] && return 0; echo "busbar resolves no $1"; return 1; fi
          ws="$(dirname "$man")/Cargo.toml"
          pkgs=$(cargo metadata --format-version 1 --no-deps --manifest-path "$ws" | jq -r '.packages[].name')
          if ! printf '%s\n' $pkgs | grep -qx "$2"; then [ "$3" = optional ] && return 0; echo "$1 has no $2"; return 1; fi
          if [ "$3" = dropped-in ] && cargo metadata --format-version 1 --no-deps --manifest-path "$ws" | jq -e --arg p "$2" '.packages[] | select(.name == $p) | .features | has("dropped-in")' >/dev/null; then
            cargo build --locked --manifest-path "$ws" -p "$2" --features dropped-in --target-dir "$PWD/target"
          else
            cargo build --locked --manifest-path "$ws" -p "$2" --target-dir "$PWD/target"
          fi
        }
        plugin busbar-transport-tcp-plugin busbar-transport-tcp-plugin dropped-in
        plugin busbar-transport-http busbar-transport-http-plugin dropped-in
        plugin busbar-secret-env busbar-secret-env-plugin optional
        plugin busbar-plane-decisions busbar-plane-decisions-plugin optional
        cargo build --workspace --locked
        cfg=$(mktemp); printf '%s\n' '[profile.default]' 'slow-timeout = { period = "60s", terminate-after = 5 }' > "$cfg"
        # $MODERNCI_ONLY: ModernCI re-runs one suspect test alone (a flake check).
        cargo nextest run --workspace --locked --no-fail-fast --tool-config-file "modernci:$cfg" ${MODERNCI_ONLY:+-E "$MODERNCI_ONLY"}
        if [ -z "$MODERNCI_ONLY" ]; then
          cargo nextest run --locked --no-fail-fast -p busbar -p busbar-kernel -p busbar-core-admin --features busbar/test-harness,busbar/transport-webrtc,busbar/openapi-schema,busbar-kernel/timing -E 'binary(mcp_stdio_serve) | binary(hook_parity_driver) | binary(admin_cross_plane) | binary(timing_smoke) | package(busbar-core-admin) | (package(busbar-kernel) & test(/timing::/)) | (package(busbar) & test(/(serve_tests|secret_source|connector|boot)::/))'
          cargo nextest run --locked --no-fail-fast -p busbar-plugin-loader --features pack -E 'binary(/busbar-plugin-pack/)'
          timeout 3000 cargo test --release --locked -p busbar-kernel --features loom-model txn_loom
          cargo test --workspace --doc --locked --no-fail-fast
        fi
      fi
    scope: affected
    baseline: target
    requires: [cc]
    tools: [busbar-oracle-judge]
  deny:
    # Supply chain: cargo deny (advisories, licences, bans, sources) and cargo vet (supply-chain/).
    run: |
      if [ -f .ci/tool.sh ]; then . .ci/tool.sh rust deny; else _bbt_run() { eval "$BUSBAR_TOOL_SH"; }; _bbt_run rust deny; fi || exit 1
      cargo deny check
      # cargo-vet 0.10.3: the release's prebuilt binary where one ships (sha256 pinned here), else a
      # source build into the same cache (linux-aarch64 has no prebuilt), once per backend.
      V=0.10.3; VD="${MODERNCI_CACHE_DIR:-$HOME/.cache}/busbar-ci-tools/cargo-vet-$V"
      if [ ! -x "$VD/bin/cargo-vet" ]; then
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) T=x86_64-unknown-linux-gnu; S=e83878b80913fbe43629c28768e14ab51f4e86a4ba8f9dd08cc25b8dbc503c19 ;;
          Darwin-arm64) T=aarch64-apple-darwin; S=a83f7d6f48a069890743ba61f7637660c8577f263efd64fee47e673632f0e423 ;;
          *) T= ;;
        esac
        if [ -n "$T" ]; then
          mkdir -p "$VD/bin" && A="$VD/vet.tar.xz"
          curl -fsSL --retry 3 -o "$A" "https://github.com/mozilla/cargo-vet/releases/download/v$V/cargo-vet-$T.tar.xz" || exit 1
          if command -v sha256sum >/dev/null; then G=$(sha256sum "$A" | cut -d' ' -f1); else G=$(shasum -a 256 "$A" | cut -d' ' -f1); fi; [ "$G" = "$S" ] || { echo "cargo-vet sha256 mismatch: $G"; exit 1; }
          tar -xJf "$A" -C "$VD" && mv "$VD/cargo-vet-$T/cargo-vet" "$VD/bin/cargo-vet" && rm -rf "$A" "$VD/cargo-vet-$T"
        else
          cargo install --locked --root "$VD" cargo-vet --version "$V"
        fi
      fi
      PATH="$VD/bin:$PATH" cargo vet
      if [ -f dist/default/Cargo.toml ]; then
        cargo deny --manifest-path dist/default/Cargo.toml check
        (cd dist/default && PATH="$VD/bin:$PATH" cargo vet)
      fi
    baseline: target
    requires: [cc]
  oracle:
    # cargo links with the system C linker: only a backend with a C compiler may run this check; the
    # store-persist cells' live backends run in docker.
    requires: [cc, docker, large]
    tools: [busbar-oracle-judge]
    baseline: target
    inputs:
      - crates/**
      - dist/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - bin/oracle
      - testing/shadow-oracle/**
      - qa/method-inventory.json
      - qa/field-inventory.json
      - providers.yaml
      - plugins.yaml
      # What the cells read too (2026-10-28, a missing path is a stale green): the migration corpus
      # (tests/migration-corpus), the shipped docker/config.yaml, the root config.yaml, the plane
      # subject rigs (scripts/*-subject), and, over-included, the rest of bin/, qa/, examples/,
      # assets/ and the Dockerfile.
      - tests/**
      - docker/**
      - Dockerfile
      - scripts/**
      - config.yaml
      - bin/**
      - qa/**
      - examples/**
      - assets/**
    # busbar's own judge, fetched by bin/oracle itself exactly as .ci/dev.yaml does (no backend tool):
    # the judge is the one dev's oracle-rust.pin names, run only when its
    # sha256 is that pin's for this host (a candidate never picks its own judge); the 1.5.5 golden is
    # add-only from dev to this commit; then the candidate's release binary is recorded over the
    # corpus and replayed against the committed 1.5.5 golden, strict: green is every cell byte-green
    # or forgiven by an owner-signed accepted difference.
    run: |
      # PHASE TIMES (2026-10-28, ORACLE-SPEED): each phase prints `[oracle-time] <phase> +<s since start> (<s in phase>)`
      # so a run's log splits the check's minutes exactly. Never changes what is judged.
      T0=$(date +%s); TP=$T0
      ts() { local n; n=$(date +%s); echo "[oracle-time] $1 +$((n - T0))s ($((n - TP))s)"; TP=$n; }
      if [ -f .ci/tool.sh ]; then . .ci/tool.sh rust; else _bbt_run() { eval "$BUSBAR_TOOL_SH"; }; _bbt_run rust; fi || exit 1
      ts tool
      # A tree whose bin/oracle has `ci-run` (busbar #1848) runs the check through it: the same
      # judgement, with one build, thin LTO and phase times; a tree without it runs the body below.
      if grep -qF '= "ci-run" ]; then' bin/oracle; then ./bin/oracle ci-run; exit $?; fi
      # A refusal to judge (no judge configured) is infra, never red or green: exit 97.
      if ! j=$(./bin/oracle tool-dir 2>&1 >/dev/null); then
        printf '%s\n' "$j"
        case "$j" in *"NO JUDGE"*) echo "modernci: infra: the oracle has no judge configured"; exit 97 ;; esac
        exit 1
      fi
      [ -n "$j" ] && printf '%s\n' "$j"
      if git cat-file -e "$MODERNCI_TO_SHA:testing/shadow-oracle/golden/1.5.5" 2>/dev/null; then
        ./bin/oracle golden-guard --repo . --base "$MODERNCI_TO_SHA" --head HEAD
      else
        echo "golden-guard: dev ($MODERNCI_TO_SHA) holds no golden/1.5.5; nothing to hold add-only"
      fi
      ts judge+golden-guard
      # From step 5 the shipped binary is the default distribution (core plus the pinned plugins).
      if [ -f dist/default/Cargo.toml ]; then
        cargo build --locked --release --manifest-path dist/default/Cargo.toml --bin busbar --target-dir target
      else
        cargo build --locked --release -p busbar --bin busbar
      fi
      ts build
      ./bin/oracle fetch-golden
      ts fetch-golden
      # The store-persist cells for postgres, mysql and valkey boot their store against a LIVE
      # backend, gated on BUSBAR_TEST_POSTGRES_URL / BUSBAR_TEST_MYSQL_URL / VALKEY_URL; with none set
      # they record nothing (missing.candidate against the golden's PASS rows). Bring the pinned
      # backends up for this run (testing/shadow-oracle/scripts/oracle-box-store-services.sh), under
      # run-unique names on free ports, export the three URLs, and remove them when the check ends.
      sfx="$(printf '%.12s' "${MODERNCI_COMMIT:-local}")-$$"
      free_port() { local p; while :; do p=$(( 20000 + RANDOM % 20000 )); (exec 3<>"/dev/tcp/127.0.0.1/$p") 2>/dev/null || { echo "$p"; return; }; done; }
      export ORACLE_PG_NAME="oracle-store-postgres-$sfx" ORACLE_MY_NAME="oracle-store-mysql-$sfx" ORACLE_VK_NAME="oracle-store-valkey-$sfx"
      export ORACLE_PG_PORT="$(free_port)"; export ORACLE_MY_PORT="$(free_port)"; export ORACLE_VK_PORT="$(free_port)"
      trap 'bash testing/shadow-oracle/scripts/oracle-box-store-services.sh down' EXIT
      . testing/shadow-oracle/scripts/oracle-box-store-services.sh up
      bash testing/shadow-oracle/scripts/oracle-box-store-services.sh wait || { echo "oracle: the store backends did not come up"; exit 1; }
      ts stores
      rm -rf target/oracle/recordings/candidate target/oracle/reports/dev
      ./bin/oracle record --bin target/release/busbar --plane all --out target/oracle/recordings/candidate
      ts record
      # Inside the record: the run-keyed candidate build ends at its binary's mtime, each recording
      # worker at its log's last write (workers record their cells in parallel).
      for f in target/oracle-candidate/release/busbar target/oracle/recordings/w*/record.log; do
        [ -e "$f" ] && echo "[oracle-time]   $f done +$(( $(stat -c %Y "$f") - T0 ))s ($(grep -c . "$f" 2>/dev/null || true) log lines)"
      done
      rc=0
      ./bin/oracle replay --golden testing/shadow-oracle/golden/1.5.5 --candidate target/oracle/recordings/candidate --out target/oracle/reports/dev --strict || rc=$?
      ts replay
      exit "$rc"
    # The judge's report (diverging.txt and the per-cell diffs), kept with the run green or red and
    # fetched with `modernci call artifact --check oracle`: the full diverging text a FAIL is triaged from.
    outputs: [target/oracle/reports/]
  # CODEQL, migrated off GitHub code scanning "default setup" (owner 2026-10-26: Actions retired).
  # The same engine, version and suite GitHub ran (CodeQL 2.27.3, `default` suite, rust + python,
  # build-mode none: nothing is compiled), headless: the bundles are fetched from
  # github/codeql-action's release, verified against the sha256 pinned here, and cached. It runs
  # daily at dev's tip and on request (`run_event`), never on a move: it reports, it never gates.
  # RATCHET: red when the high/critical findings outnumber CODEQL_MAX_HIGH, the open high/critical
  # alerts GitHub held on 2026-10-26 (28 rust/cleartext-logging, 22 rust/hard-coded-cryptographic-value,
  # 1 py/redos, 1 py/clear-text-storage-sensitive-data = 52). Lower it as they are fixed; never raise it.
  codeql:
    run: |
      set -euo pipefail
      V=2.27.3
      CODEQL_MAX_HIGH=52
      cache="${MODERNCI_CACHE_DIR:-$HOME/.cache}/codeql-$V"
      # One bundle per machine architecture: GitHub ships per-language bundles for linux64 only, and
      # one full bundle for linux-arm64 (ModernCI compute is aarch64).
      case "$(uname -m)" in
        x86_64) bundles="rust:218a19c49a4e44dee236d2cc55e20cda03ac4f37ddc581b1b0e5fff2e7912237:codeql-bundle-rust-linux64 python:ffb149bcbb0818f1017bec9f68d7b84693a7b0ac4a69b7be390a4f2825c3a170:codeql-bundle-python-linux64" ;;
        aarch64|arm64) bundles="rust:82a7828e050573e885ba96620c5b72db985ef4a88118dd2baf14ae7b325064d7:codeql-bundle-linux-arm64 python:82a7828e050573e885ba96620c5b72db985ef4a88118dd2baf14ae7b325064d7:codeql-bundle-linux-arm64" ;;
        *) echo "codeql: no bundle for $(uname -m)"; exit 1 ;;
      esac
      fetch() { # asset sha256 -> $cache/<asset>/codeql/codeql
        d="$cache/$1"
        [ -x "$d/codeql/codeql" ] && return 0
        t=$(mktemp -d); f="$t/b.tar.zst"
        curl -fsSL -o "$f" "https://github.com/github/codeql-action/releases/download/codeql-bundle-v$V/$1.tar.zst"
        echo "$2  $f" | sha256sum -c - >/dev/null || { echo "codeql: bundle $1 sha256 mismatch"; exit 1; }
        rm -rf "$d.tmp"; mkdir -p "$d.tmp" && zstd -dc "$f" | tar -x -C "$d.tmp" && rm -rf "$d" && mv "$d.tmp" "$d"; rm -rf "$t"
      }
      declare -A bin
      for b in $bundles; do
        IFS=: read -r lang sha asset <<< "$b"
        fetch "$asset" "$sha"; bin[$lang]="$cache/$asset/codeql/codeql"
      done
      out=$(mktemp -d); trap 'rm -rf "$out"' EXIT
      for lang in rust python; do
        q="${bin[$lang]}"
        "$q" database create "$out/db-$lang" --language="$lang" --build-mode=none --source-root=. --threads=0 --overwrite >/dev/null
        "$q" database analyze "$out/db-$lang" "codeql/$lang-queries:codeql-suites/$lang-code-scanning.qls" \
          --format=sarif-latest --output="$out/$lang.sarif" --threads=0 --ram=6000 >/dev/null
      done
      # Each result with its rule's security-severity (GitHub's high >= 7.0, critical >= 9.0).
      jq -r '.runs[] | (.tool.driver.rules // []) as $r | ([.tool.extensions[]?.rules[]?] + $r) as $rules
        | .results[] | . as $x | ($rules | map(select(.id == $x.ruleId)) | first // {}) as $rule
        | [(($rule.properties["security-severity"] // "0") | tonumber), $x.ruleId,
           ($x.locations[0].physicalLocation.artifactLocation.uri + ":" + ($x.locations[0].physicalLocation.region.startLine|tostring))] | @tsv' \
        "$out"/*.sarif | sort -rn > "$out/results.tsv"
      echo "== CodeQL $V findings by rule (severity rule count)"
      awk -F'\t' '{k=$1" "$2; c[k]++} END{for(k in c) print k, c[k]}' "$out/results.tsv" | sort -rn
      echo "== high/critical findings"
      awk -F'\t' '$1 >= 7.0' "$out/results.tsv"
      high=$(awk -F'\t' '$1 >= 7.0' "$out/results.tsv" | wc -l | tr -d ' ')
      echo "codeql: $high high/critical findings (ceiling $CODEQL_MAX_HIGH), $(wc -l < "$out/results.tsv" | tr -d ' ') in all"
      [ "$high" -le "$CODEQL_MAX_HIGH" ] || { echo "codeql: high/critical findings rose past $CODEQL_MAX_HIGH"; exit 1; }
    requires: [curl, zstd, jq]
  conformance:
    # busbar's own suites (the OAuth2 AS, TLS, the supply chain) by the fleet's one driver
    # (busbar-release template/conformance): verdicts to target/conformance/verdicts/, brought into
    # conformance/verdicts/ by scripts/conformance/import.sh.
    priority: low
    requires: [cc, git, curl, docker]
    run: |
      if [ ! -f testing/conformance/run.sh ]; then echo "no testing/conformance/run.sh on this head yet"; exit 0; fi
      # Non-blocking by ruling (owner 2026-10-26): a suite that did not pass is reported in its verdict
      # (target/conformance/verdicts/), not as this check's exit. Only a driver failure (exit 2: no
      # busbar, no tools, no verdicts written) fails the check. ModernCI's `blocks: false` on a move
      # entry still dooms the move on a red, so the exit carries the ruling here.
      # WORKAROUND: exit 0 on a suite non-pass is a workaround for ModernCI not honouring
      # blocks:false; restore `exec bash testing/conformance/run.sh` when fixed. It is NOT a pass:
      # the verdict file records the fail/not-run, and the manifest and site show it.
      rc=0; bash testing/conformance/run.sh || rc=$?
      [ "$rc" -le 1 ] || exit "$rc"
    outputs: [target/conformance/]