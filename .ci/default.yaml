# What a lane must pass to enter predev, judged by ModernCI (required check `ci`) on the lane
# merged onto predev's tip, no worse than predev itself. Live: ModernCI decides and lands.
to: predev
on_green: merge
deadline: 6h
# The PR battery, named explicitly so a check declared below but NOT listed here is on-demand only
# (`modernci call measure {repo, from, check}`), never run on every move.
on:
  move: [preflight, gates, clippy, compile, test, doctest, deletion-matrix, deny]
  manual: [oracle]
env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
checks:
  preflight:
    run: |
      cargo fmt --all -- --check
      cargo metadata --locked --format-version 1 >/dev/null
      cargo build -q -p xtask
      cargo xtask gate abi-header --write
      git diff --exit-code -- crates/busbar-contract/include
  gates:
    run: |
      export XTASK_CEILING_BASE="$MODERNCI_TO_SHA" XTASK_SHIP_TARGET=predev
      cargo xtask gate --all --format=tsv
    baseline: target
    # The ledgers and ceilings are rules: a row this move arms is judged on its own.
    rules: ["qa/*.toml"]
    # The ceiling ratchet reads the merge-base (XTASK_CEILING_BASE): a shallow checkout cannot
    # judge it, so only a backend with the repo's history may run this check.
    requires: [git-history]
    needs: [preflight]
  clippy:
    run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    baseline: target
    needs: [gates]
  compile:
    run: |
      cargo check --workspace --all-targets --locked
      cargo check --workspace --exclude xtask --all-targets --no-default-features --locked
      cargo check --release -p busbar --bin busbar --locked
    baseline: target
    needs: [gates]
  test:
    # As the hop's build:dlopen-cdylibs and test:workspace: the workspace's cdylibs and the four
    # dropped-in plugins the tests dlopen, then one build and one nextest run.
    run: |
      meta=$(cargo metadata --format-version 1 --locked)
      cargo build --locked $(echo "$meta" | jq -r '.workspace_members as $m | .packages[] | select(.id as $i | $m | index($i)) | select(any(.targets[]; .kind | index("cdylib"))) | "-p " + .name')
      plugin() {
        man=$(echo "$meta" | jq -r --arg p "$1" 'first(.packages[] | select(.name == $p) | .manifest_path) // empty')
        if [ -z "$man" ]; then [ "$3" = optional ] && return 0; echo "busbar resolves no $1"; return 1; fi
        ws="$(dirname "$man")/Cargo.toml"
        pkgs=$(cargo metadata --format-version 1 --no-deps --manifest-path "$ws" | jq -r '.packages[].name')
        if ! printf '%s\n' $pkgs | grep -qx "$2"; then [ "$3" = optional ] && return 0; echo "$1 has no $2"; return 1; fi
        if [ "$3" = dropped-in ] && cargo metadata --format-version 1 --no-deps --manifest-path "$ws" | jq -e --arg p "$2" '.packages[] | select(.name == $p) | .features | has("dropped-in")' >/dev/null; then
          cargo build --locked --manifest-path "$ws" -p "$2" --features dropped-in --target-dir "$PWD/target"
        else
          cargo build --locked --manifest-path "$ws" -p "$2" --target-dir "$PWD/target"
        fi
      }
      plugin busbar-transport-tcp-plugin busbar-transport-tcp-plugin dropped-in
      plugin busbar-transport-http busbar-transport-http-plugin dropped-in
      plugin busbar-secret-env busbar-secret-env-plugin optional
      plugin busbar-plane-decisions busbar-plane-decisions-plugin optional
      cargo build --workspace --locked
      # The hop's nextest limits (busbar-release build_test.rs NEXTEST_TOOL_CONFIG): the two
      # whole-battery selftests get twelve minutes and start first.
      cfg=$(mktemp); printf '%s\n' '[profile.default]' 'slow-timeout = { period = "60s", terminate-after = 5 }' '' '[[profile.default.overrides]]' 'filter = "test(selftest_runs_every_registered_gates_red_proof) | test(list_and_a_named_gate_run_and_all_reaches_a_verdict_over_the_real_tree)"' 'slow-timeout = { period = "60s", terminate-after = 12 }' 'priority = 100' > "$cfg"
      # $MODERNCI_ONLY: ModernCI re-runs one suspect test alone (a flake check).
      cargo nextest run --workspace --locked --no-fail-fast --tool-config-file "modernci:$cfg" ${MODERNCI_ONLY:+-E "$MODERNCI_ONLY"}
    scope: affected
    baseline: target
    # The selftests run the gates over the real tree, merge-base included.
    requires: [git-history]
    needs: [gates]
  doctest:
    run: cargo test --workspace --doc --locked --no-fail-fast
    scope: affected
    baseline: target
    needs: [test]
  deletion-matrix:
    run: |
      cargo build -p busbar-kernel -p busbar-contract --no-default-features --features plane-a2a --locked
      cargo build -p busbar-kernel -p busbar-contract --no-default-features --features plane-mcp --locked
      cargo build -p busbar-kernel -p busbar-contract --no-default-features --locked
    baseline: target
    needs: [gates]
  deny:
    run: cargo deny check
    baseline: target
    requires: [cargo-deny]
    needs: [preflight]
  # ON-DEMAND ONLY (not in on.move): the predev->dev oracle, measurable on a PR head that changes the
  # served LLM path (e.g. a plane default flip), so claim C3 is proven before landing, not only at the move.
  oracle:
    # busbar's own check tool, the pinned busbar-oracle (the backend's busbar-oracle tool sets
    # BUSBAR_ORACLE_RUST_BIN): the judge is the one dev's oracle-rust.pin names, run only when its
    # sha256 is that pin's for this host (a candidate never picks its own judge); the 1.5.5 golden is
    # add-only from dev to this commit; then the candidate's release binary is recorded over the
    # corpus and replayed against the committed 1.5.5 golden, strict: green is every cell byte-green
    # or forgiven by an owner-signed accepted difference.
    run: |
      pin=$(git show "$MODERNCI_TO_SHA:testing/shadow-oracle/oracle-rust.pin")
      want=$(printf '%s\n' "$pin" | sed -n "s/^sha256_linux_$(uname -m)=//p")
      [[ "$want" =~ ^[0-9a-f]{64}$ ]] || { echo "ORACLE-PIN: oracle-rust.pin at $MODERNCI_TO_SHA pins no linux $(uname -m) judge"; exit 1; }
      echo "$want  $BUSBAR_ORACLE_RUST_BIN" | sha256sum -c -
      "$BUSBAR_ORACLE_RUST_BIN" golden-guard --repo . --base "$MODERNCI_TO_SHA" --head HEAD
      cargo build --locked --release -p busbar --bin busbar
      ./bin/oracle fetch-golden
      rm -rf target/oracle/recordings/candidate target/oracle/reports/dev
      ./bin/oracle record --bin target/release/busbar --plane all --out target/oracle/recordings/candidate
      ./bin/oracle replay --golden testing/shadow-oracle/golden/1.5.5 --candidate target/oracle/recordings/candidate --out target/oracle/reports/dev --strict
    needs: [gates]
