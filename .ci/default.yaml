  # On every move (above): the same judge as the dev -> qa oracle (.ci/dev.yaml), here no worse than
  # dev, so a lane cannot land a customer-visible change the 1.5.5 golden does not forgive.
  oracle:
    # cargo links with the system C linker: only a backend with a C compiler may run this check; the
    # store-persist cells' live backends run in docker.
    requires: [cc, docker]
    baseline: target
    # busbar's own judge, fetched by bin/oracle itself exactly as .ci/dev.yaml does (no backend tool):
    # the judge is the one dev's oracle-rust.pin names, run only when its
    # sha256 is that pin's for this host (a candidate never picks its own judge); the 1.5.5 golden is
    # add-only from dev to this commit; then the candidate's release binary is recorded over the
    # corpus and replayed against the committed 1.5.5 golden, strict: green is every cell byte-green
    # or forgiven by an owner-signed accepted difference.
    run: |
      if [ -f .ci/tool.sh ]; then . .ci/tool.sh rust; else _bbt_run() { eval "$BUSBAR_TOOL_SH"; }; _bbt_run rust; fi || exit 1
      ./bin/oracle tool-dir >/dev/null
      if git cat-file -e "$MODERNCI_TO_SHA:testing/shadow-oracle/golden/1.5.5" 2>/dev/null; then
        ./bin/oracle golden-guard --repo . --base "$MODERNCI_TO_SHA" --head HEAD
      else
        echo "golden-guard: dev ($MODERNCI_TO_SHA) holds no golden/1.5.5; nothing to hold add-only"
      fi
      cargo build --locked --release -p busbar --bin busbar
      ./bin/oracle fetch-golden
      # The store-persist cells for postgres, mysql and valkey boot their store against a LIVE
      # backend, gated on BUSBAR_TEST_POSTGRES_URL / BUSBAR_TEST_MYSQL_URL / VALKEY_URL; with none set
      # they record nothing (missing.candidate against the golden's PASS rows). Bring the pinned
      # backends up for this run (testing/shadow-oracle/scripts/oracle-box-store-services.sh), under
      # run-unique names on free ports, export the three URLs, and remove them when the check ends.
      sfx="$(printf '%.12s' "${MODERNCI_COMMIT:-local}")-$$"
      free_port() { local p; while :; do p=$(( 20000 + RANDOM % 20000 )); (exec 3<>"/dev/tcp/127.0.0.1/$p") 2>/dev/null || { echo "$p"; return; }; done; }
      export ORACLE_PG_NAME="oracle-store-postgres-$sfx" ORACLE_MY_NAME="oracle-store-mysql-$sfx" ORACLE_VK_NAME="oracle-store-valkey-$sfx"
      export ORACLE_PG_PORT="$(free_port)"; export ORACLE_MY_PORT="$(free_port)"; export ORACLE_VK_PORT="$(free_port)"
      trap 'bash testing/shadow-oracle/scripts/oracle-box-store-services.sh down' EXIT
      . testing/shadow-oracle/scripts/oracle-box-store-services.sh up
      bash testing/shadow-oracle/scripts/oracle-box-store-services.sh wait || { echo "oracle: the store backends did not come up"; exit 1; }
      rm -rf target/oracle/recordings/candidate target/oracle/reports/dev
      ./bin/oracle record --bin target/release/busbar --plane all --out target/oracle/recordings/candidate
      ./bin/oracle replay --golden testing/shadow-oracle/golden/1.5.5 --candidate target/oracle/recordings/candidate --out target/oracle/reports/dev --strict
    needs: [gates]
    # The judge's report (diverging.txt and the per-cell diffs), kept with the run green or red and
    # fetched with `modernci call artifact --check oracle`: the full diverging text a FAIL is triaged from.
    outputs: [target/oracle/reports/]
