# What a lane must pass to enter predev: busbar-release's predev `enter_pr` plan
# (crates/busbar-release-cli/ladder.json), judged on the lane merged onto predev's tip, no worse
# than predev itself. Shadow while busbar-release still decides.
to: predev
on_green: merge
deadline: 6h
env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
checks:
  preflight:
    run: |
      cargo fmt --all -- --check
      cargo metadata --locked --format-version 1 >/dev/null
      cargo build -q -p xtask
      cargo xtask gate abi-header --write
      git diff --exit-code -- crates/busbar-contract/include
  gates:
    run: |
      export XTASK_CEILING_BASE="$MODERNCI_TO_SHA" XTASK_SHIP_TARGET=predev
      cargo xtask gate --all --format=tsv
    baseline: target
    needs: [preflight]
  clippy:
    run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    baseline: target
    needs: [gates]
  compile:
    run: |
      cargo check --workspace --all-targets --locked
      cargo check --workspace --exclude xtask --all-targets --no-default-features --locked
      cargo check --release -p busbar --bin busbar --locked
    baseline: target
    needs: [gates]
  test:
    # As the hop's build:dlopen-cdylibs and test:workspace: the workspace's cdylibs and the four
    # dropped-in plugins the tests dlopen, then one build and one nextest run.
    run: |
      meta=$(cargo metadata --format-version 1 --locked)
      cargo build --locked $(echo "$meta" | jq -r '.workspace_members as $m | .packages[] | select(.id as $i | $m | index($i)) | select(any(.targets[]; .kind | index("cdylib"))) | "-p " + .name')
      plugin() {
        man=$(echo "$meta" | jq -r --arg p "$1" 'first(.packages[] | select(.name == $p) | .manifest_path) // empty')
        if [ -z "$man" ]; then [ "$3" = optional ] && return 0; echo "busbar resolves no $1"; return 1; fi
        ws="$(dirname "$man")/Cargo.toml"
        pkgs=$(cargo metadata --format-version 1 --no-deps --manifest-path "$ws" | jq -r '.packages[].name')
        if ! printf '%s\n' $pkgs | grep -qx "$2"; then [ "$3" = optional ] && return 0; echo "$1 has no $2"; return 1; fi
        if [ "$3" = dropped-in ] && cargo metadata --format-version 1 --no-deps --manifest-path "$ws" | jq -e --arg p "$2" '.packages[] | select(.name == $p) | .features | has("dropped-in")' >/dev/null; then
          cargo build --locked --manifest-path "$ws" -p "$2" --features dropped-in --target-dir "$PWD/target"
        else
          cargo build --locked --manifest-path "$ws" -p "$2" --target-dir "$PWD/target"
        fi
      }
      plugin busbar-transport-tcp-plugin busbar-transport-tcp-plugin dropped-in
      plugin busbar-transport-http busbar-transport-http-plugin dropped-in
      plugin busbar-secret-env busbar-secret-env-plugin optional
      plugin busbar-plane-decisions busbar-plane-decisions-plugin optional
      cargo build --workspace --locked
      # The hop's nextest limits (busbar-release build_test.rs NEXTEST_TOOL_CONFIG): the two
      # whole-battery selftests get twelve minutes and start first.
      cfg=$(mktemp); printf '%s\n' '[profile.default]' 'slow-timeout = { period = "60s", terminate-after = 5 }' '' '[[profile.default.overrides]]' 'filter = "test(selftest_runs_every_registered_gates_red_proof) | test(list_and_a_named_gate_run_and_all_reaches_a_verdict_over_the_real_tree)"' 'slow-timeout = { period = "60s", terminate-after = 12 }' 'priority = 100' > "$cfg"
      # $MODERNCI_ONLY: ModernCI re-runs one suspect test alone (a flake check).
      cargo nextest run --workspace --locked --no-fail-fast --tool-config-file "modernci:$cfg" ${MODERNCI_ONLY:+-E "$MODERNCI_ONLY"}
    scope: affected
    baseline: target
    needs: [gates]
  doctest:
    run: cargo test --workspace --doc --locked --no-fail-fast
    scope: affected
    baseline: target
    needs: [test]
  deletion-matrix:
    run: |
      cargo build -p busbar-kernel -p busbar-contract --no-default-features --features plane-a2a --locked
      cargo build -p busbar-kernel -p busbar-contract --no-default-features --features plane-mcp --locked
      cargo build -p busbar-kernel -p busbar-contract --no-default-features --locked
    baseline: target
    needs: [gates]
  deny:
    run: cargo deny check
    baseline: target
    needs: [preflight]
