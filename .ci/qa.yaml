      if [ -f .ci/tool.sh ]; then . .ci/tool.sh rust; else _bbt_run() { eval "$BUSBAR_TOOL_SH"; }; _bbt_run rust; fi || exit 1
      # W17: built INSIDE the pinned glibc 2.28 baseline (release-targets.json linux_build_image), so
      # the binary runs on every glibc distro from RHEL 8 / Debian 10 on; release-build.sh refuses
