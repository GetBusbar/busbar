  gate-selftest:
    # The publish gate proves, offline, that it passes a good release and refuses each broken one by
    # name; the key guard proves both its halves.
    requires: [cc]
    run: |
      if [ -f .ci/tool.sh ]; then . .ci/tool.sh rust; else _bbt_run() { eval "$BUSBAR_TOOL_SH"; }; _bbt_run rust; fi || exit 1
      cargo build --locked -p busbar-plugin-loader --features pack --bin busbar-plugin-pack
      PACK=target/debug/busbar-plugin-pack python3 scripts/release/test_publish_gate.py
      bash scripts/release-key-guard.sh --selftest
  rekor-watch:
    # Every 6 hours: any Rekor entry under a K2 key that release/released.tsv does not list, or any
    # listed release missing from the log, is an alarm (scripts/release/rekor_watch.py). Exit 3
    # (Rekor unreadable) is never a pass.
    run: |
      python3 scripts/release/rekor_watch.py
  tls-assess:
    # The RELEASED image, by digest, on the public lab host (a machine joined with provides:
    # [tls-lab], tls-lab.getbusbar.com, ports 80 and 443 open). The digest is taken from the release's
    # IMAGES file only after its K2 signature verifies against release/allowed_signers. Judged by
    # scripts/release/tls-assert.json's named assertions, never a grade.
    requires: [docker, tls-lab]
    run: |
      set -eu
      T="${XDG_CACHE_HOME:-$HOME/.cache}/busbar-conformance-tools"; mkdir -p "$T"
      if [ ! -x "$T/testssl/testssl.sh" ]; then
        curl -fsSL --retry 3 -o "$T/testssl.tgz" https://github.com/testssl/testssl.sh/archive/refs/tags/v3.2.0.tar.gz
        echo "f3969c152c0fe99a2a90e8c8675ab677d77608ac77c957a95497387c36363c32  $T/testssl.tgz" | sha256sum -c -
        rm -rf "$T/testssl"; mkdir "$T/testssl"; tar -C "$T/testssl" --strip-components=1 -xzf "$T/testssl.tgz"
      fi
      v="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/busbar/Cargo.toml | head -1)"
      base="https://github.com/GetBusbar/busbar/releases/download/v$v"
      curl -fsSL -o IMAGES "$base/IMAGES" && curl -fsSL -o IMAGES.sig "$base/IMAGES.sig"
      ssh-keygen -Y verify -f release/allowed_signers -I busbar-release -n busbar-release -s IMAGES.sig < IMAGES
      d="$(awk '$1 == "busbar" {print $2}' IMAGES)"
      TESTSSL="$T/testssl/testssl.sh" bash scripts/release/tls-lab.sh "$v" "$d"
    outputs: [target/tls-evidence/]
