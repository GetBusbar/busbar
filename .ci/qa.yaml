      scripts/release/in-baseline.sh bash -ec 'C=/cache/cargo-cyclonedx-0.5.7; [ -x "$C/bin/cargo-cyclonedx" ] || cargo install --locked --root "$C" cargo-cyclonedx --version 0.5.7; CYCLONEDX="$C/bin/cargo-cyclonedx" python3 scripts/release/candidate.py core aarch64-unknown-linux-gnu-armv8.0 --out target/candidate/core-aarch64-linux-gnu-armv8'
