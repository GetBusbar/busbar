# Core's CRATE-WIDE clippy rows: they bind every workspace member and target. Source:
# GetBusbar/busbar-release ci/core-crate-wide-clippy-bans.toml (busbar-release 264c1aed31f0a83fc4d810967f2dc5e00dd7624a), byte for byte
# below this header. The root clippy.toml holds the request-path rows, which the workspace lints turn
# off outside the request-path marker; these run as a second clippy pass with this directory as the
# configuration and the disallowed lints raised on the command line (outranking [workspace.lints]):
#   CLIPPY_CONF_DIR=clippy-crate-wide cargo clippy --locked --workspace --all-targets --all-features -- -D clippy::disallowed_macros -D clippy::disallowed_methods -D clippy::disallowed_types

disallowed-types = [
  # Owner 2026-11-14: Zeroizing is replaced everywhere by the busbar_contract::secure types.
  { path = "zeroize::Zeroizing", reason = "wipes the whole capacity on drop and leaves un-wiped copies when it grows; replaced everywhere (owner 2026-11-14): secret bytes live in busbar_contract::secure SecureVec/SecureString/SecureBuf/SecureArray", allow-invalid = true },
]
disallowed-methods = [
  # Ruling 310 + owner 2026-11-14: no unstable sort anywhere; plain sort off the request path only
  # (the request path bans every sort: clippy.toml).
  { path = "slice::sort_unstable", reason = "equal elements come out in an unspecified order (nondeterministic output, ruling 310); off the request path use sort, sort_by or sort_by_key; on it, no sorting at all" },
  { path = "slice::sort_unstable_by", reason = "equal elements come out in an unspecified order (nondeterministic output, ruling 310); off the request path use sort, sort_by or sort_by_key; on it, no sorting at all" },
  { path = "slice::sort_unstable_by_key", reason = "equal elements come out in an unspecified order (nondeterministic output, ruling 310); off the request path use sort, sort_by or sort_by_key; on it, no sorting at all" },
  # R53, TRANSPORT-TLS ring-write-queue (decision 291): core tls/lints-transport 43a35d30ec, clippy.toml.
  { path = "std::collections::VecDeque::as_slices", reason = "a wrapped ring writes twice and drain leaves released bytes unwiped; queue bytes in busbar_core_connector::secure_vec::SecureVec (TRANSPORT-TLS ring-write-queue)" },
]
