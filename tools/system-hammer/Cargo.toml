[package]
name = "busbar-system-hammer"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false
license = "Apache-2.0"
description = "Dev load tool: drives a real busbar binary (real plugins, every plane and kind) against in-process mock upstreams and reports rps, added latency, CPU per request, RSS and drift per scenario. A report, not a gate."

# Its own workspace: a dev tool's dependencies (HDR histograms, a load driver, mock upstreams) stay
# out of the product lock, the supply-chain audit and the architecture checks of the root
# workspace. Run it from this directory: `cargo run -p busbar-system-hammer --release -- ...`.
[workspace]

# The fleet bad-pattern rules (root clippy.toml) are request-path rules: inert unless a module tree
# carries the request-path marker, as the root workspace sets them. This dev tool has no request
# path; it is its own workspace, so it states the same table the root [workspace.lints.clippy] does.
[lints.clippy]
disallowed_macros = "allow"
# clippy's stock too_many_arguments threshold (7) is not a fleet rule; turned off by the owner on 18 Nov 2026.
# No replacement rule: the number of parameters is not what the lints judge.
too_many_arguments = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"

[[bin]]
name = "busbar-system-hammer"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
hdrhistogram = { version = "7", default-features = false }
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.5"
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.22"
crc32fast = "1"
# Safe syscalls: kill the child, the clock tick and the page size (no libc, no unsafe).
rustix = { version = "1", default-features = false, features = ["std", "process", "param"] }
# The mock's TLS listener (MCP cert_spki pins, https JWKS): AWS-LC only, the one provider the product ships (busbar-crypto, 229).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }

[profile.release]
debug = "line-tables-only"

# JSON: the same MattJackson sonic-rs fork at the rev the root workspace pins (root [patch.crates-io]).
# crates.io sonic-rs 0.5.10 recurses in skip and overflows the stack on deep input (#451).
[patch.crates-io]
sonic-rs = { git = "https://github.com/MattJackson/sonic-rs", rev = "1241c129cef83686109f820825206f56ff470f67" }
