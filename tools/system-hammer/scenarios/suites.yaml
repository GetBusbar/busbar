# Named lists of scenarios. `default` is the per-commit suite (<= 10 min on one CI runner with the
# short windows); `full` adds the 72-case dialect matrix, the h2c/open-loop LLM shapes and the
# webhook export. Both include scenarios with `plugins:` (need --plugins-dir tarballs, else SKIPPED)
# and `docker:` (need a docker daemon).
prove: [llm-openai-openai, stub-plugins]
default:
  - stub-plugins
  - llm-openai-openai
  - llm-core
  - llm-bodies
  - llm-tools
  - plane-mcp
  - plane-a2a
  - plane-streams
  - plane-decisions
  - auth
  - hooks
  - hooks-webrequest
  - store-memory
  - store-sqlite
  - store-postgres
  - store-valkey
  - store-mysql
  - export-prometheus
  - export-otlp
  - export-file
  - secrets
  - secrets-vault
  - admin-ops
  - production-mix
full:
  - stub-plugins
  - llm-openai-openai
  - llm-matrix
  - llm-bodies
  - llm-tools
  - llm-h2c
  - plane-mcp
  - plane-a2a
  - plane-streams
  - plane-decisions
  - auth
  - hooks
  - hooks-webrequest
  - store-memory
  - store-sqlite
  - store-postgres
  - store-valkey
  - store-mysql
  - export-prometheus
  - export-otlp
  - export-file
  - export-webhook
  - secrets
  - secrets-vault
  - admin-ops
  - production-mix
stores: [store-memory, store-sqlite, store-postgres, store-valkey, store-mysql]
planes: [plane-mcp, plane-a2a, plane-streams, plane-decisions]
# The release PGO/BOLT training mix (release/pgo-workload.args): boot per scenario, the LLM request
# path (core, bodies, tools, openai passthrough), the MCP / A2A / streams / decisions planes, key auth,
# hooks, the secrets and metrics/file export paths, the admin API and a production-shaped mix. Only
# scenarios that need neither docker nor plugin tarballs, so it runs on any release builder.
pgo:
  - stub-plugins
  - llm-openai-openai
  - llm-core
  - llm-bodies
  - llm-tools
  - plane-mcp
  - plane-a2a
  - plane-streams
  - plane-decisions
  - auth
  - hooks
  - secrets
  - export-prometheus
  - export-file
  - admin-ops
  - production-mix
