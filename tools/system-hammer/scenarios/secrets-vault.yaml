name: secrets-vault
group: secrets
description: Upstream credential from Vault KV v2 (the mock) through the dynamic vault secret plugin.
plugins: [busbar-secret-vault]
env:
  HAMMER_VAULT_TOKEN: hammer-vault-token
config: |
  listen: "{LISTEN}"
  admin_listen: "{ADMIN}"
  public_url: "http://{LISTEN}"
  identity-providers:
    admin-tokens: { module: admin-tokens, token: { env: BUSBAR_ADMIN_TOKEN } }
  auth:
    chain: [keys]
    admin_auth: [admin-tokens]
    signing_key: { file: "{WORK}/signing.key" }
  groups:
    bench:
      limits:
        - { requests: 1000000000, per: minute }
  advanced:
    allow_destinations: ["127.0.0.1"]
  store: { module: memory }
  plugins:
    enabled: true
    dir: "{WORK}/plugins"
    trust: { allow_unsigned: true }
  secrets:
    vault: { module: vault, settings: { addr: "{MOCK}", token: { env: HAMMER_VAULT_TOKEN } } }
  providers:
    p-vault: { api_key: { module: vault, settings: { path: "secret/data/openai#api_key" } } }
  models:
    m-vault: { provider: p-vault }
providers: |
  p-vault: { protocol: openai, base_url: "{MOCK}" }
setup:
  - mint_key: { as: KEY, group: bench }
cases:
  - name: vault secret openai>openai
    shape: { closed: 32 }
    requests:
      - path: /v1/chat/completions
        headers: { authorization: "Bearer {KEY}", content-type: application/json }
        body: '{"model":"m-vault","messages":[{"role":"user","content":"hello"}],"max_tokens":16}'
        contains: hammer-ok
