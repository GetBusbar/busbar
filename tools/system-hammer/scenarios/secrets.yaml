name: secrets
group: secrets
description: Upstream credentials from the env and file secret sources (resolved at boot; the cases show the request path is unchanged).
files:
  upstream.key: "hammer-file-key"
config: |
  listen: "{LISTEN}"
  admin_listen: "{ADMIN}"
  public_url: "http://{LISTEN}"
  identity-providers:
    admin-tokens: { module: admin-tokens, token: { env: BUSBAR_ADMIN_TOKEN } }
  auth:
    chain: [keys]
    admin_auth: [admin-tokens]
    signing_key: { file: "{WORK}/signing.key" }
  groups:
    bench:
      limits:
        - { requests: 1000000000, per: minute }
  advanced:
    allow_destinations: ["127.0.0.1"]
  store: { module: memory }
  providers:
    p-env: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    p-file: { api_key: { file: "{WORK}/upstream.key" } }
  models:
    m-env: { provider: p-env }
    m-file: { provider: p-file }
providers: |
  p-env: { protocol: openai, base_url: "{MOCK}" }
  p-file: { protocol: openai, base_url: "{MOCK}" }
setup:
  - mint_key: { as: KEY, group: bench }
cases:
  - name: env secret openai>openai
    shape: { closed: 32 }
    requests:
      - path: /v1/chat/completions
        headers: { authorization: "Bearer {KEY}", content-type: application/json }
        body: '{"model":"m-env","messages":[{"role":"user","content":"hello"}],"max_tokens":16}'
        contains: hammer-ok
  - name: file secret openai>openai
    shape: { closed: 32 }
    requests:
      - path: /v1/chat/completions
        headers: { authorization: "Bearer {KEY}", content-type: application/json }
        body: '{"model":"m-file","messages":[{"role":"user","content":"hello"}],"max_tokens":16}'
        contains: hammer-ok
