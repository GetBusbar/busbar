name: auth
group: auth
description: "Inbound keys and admin tokens; outbound credential styles: header (api-key), OAuth client credentials and JWT bearer (RS256 service account) minted against the mock IdP."
env:
  HAMMER_OAUTH_CLIENT: "hammer-client:hammer-secret"
  HAMMER_SA: "{SA}"
config: |
  listen: "{LISTEN}"
  admin_listen: "{ADMIN}"
  public_url: "http://{LISTEN}"
  identity-providers:
    admin-tokens: { module: admin-tokens, token: { env: BUSBAR_ADMIN_TOKEN } }
  auth:
    chain: [keys]
    admin_auth: [admin-tokens]
    signing_key: { file: "{WORK}/signing.key" }
  groups:
    bench:
      limits:
        - { requests: 1000000000, per: minute }
  advanced:
    allow_destinations: ["127.0.0.1"]
  store: { module: memory }
  providers:
    openai: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    p-apikey: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    p-oauth: { api_key: { env: HAMMER_OAUTH_CLIENT } }
    p-jwt: { api_key: { env: HAMMER_SA } }
  models:
    m-openai: { provider: openai }
    m-apikey: { provider: p-apikey }
    m-oauth: { provider: p-oauth }
    m-jwt: { provider: p-jwt }
providers: |
  openai: { protocol: openai, base_url: "{MOCK}" }
  p-apikey: { protocol: openai, base_url: "{MOCK}", auth: api-key }
  p-oauth: { protocol: openai, base_url: "{MOCK}", auth: oauth-client-credentials, token_url: "{MOCK}/token", scope: "hammer.default" }
  p-jwt: { protocol: gemini, base_url: "{MOCK}", auth: jwt-bearer }
setup:
  - rsa_service_account: { as: SA, token_uri: "{MOCK}/token" }
  - mint_key: { as: KEY, group: bench }
  - sleep_ms: 500
cases:
  - name: keys (bearer bbk key) openai>openai
    shape: { closed: 32 }
    requests:
      - path: /v1/chat/completions
        headers: { authorization: "Bearer {KEY}", content-type: application/json }
        body: '{"model":"m-openai","messages":[{"role":"user","content":"hello"}],"max_tokens":16}'
        contains: hammer-ok
    direct:
      listener: mock
      path: /v1/chat/completions
      headers: { content-type: application/json }
      body: '{"model":"mock","messages":[{"role":"user","content":"hello"}],"max_tokens":16}'
  - name: header style (api-key) openai>openai
    shape: { closed: 32 }
    requests:
      - path: /v1/chat/completions
        headers: { authorization: "Bearer {KEY}", content-type: application/json }
        body: '{"model":"m-apikey","messages":[{"role":"user","content":"hello"}],"max_tokens":16}'
        contains: hammer-ok
  - name: oauth client credentials openai>openai
    shape: { closed: 32 }
    requests:
      - path: /v1/chat/completions
        headers: { authorization: "Bearer {KEY}", content-type: application/json }
        body: '{"model":"m-oauth","messages":[{"role":"user","content":"hello"}],"max_tokens":16}'
        contains: hammer-ok
  - name: jwt-bearer (RS256 SA) openai>gemini
    shape: { closed: 32 }
    requests:
      - path: /v1/chat/completions
        headers: { authorization: "Bearer {KEY}", content-type: application/json }
        body: '{"model":"m-jwt","messages":[{"role":"user","content":"hello"}],"max_tokens":16}'
        contains: hammer-ok
  - name: admin tokens (GET /api/v1/admin/keys)
    shape: { closed: 8 }
    requests:
      - listener: admin
        method: GET
        path: /api/v1/admin/keys
