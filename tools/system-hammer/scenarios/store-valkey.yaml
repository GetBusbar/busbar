name: store-valkey
group: stores
description: openai>openai with keys auth, the valkey store plugin against valkey in docker.
plugins: [busbar-store-valkey]
docker:
  - { var: VK_PORT, image: "valkey/valkey:8", port: 6379, ready_log: "Ready to accept connections" }
config: |
  listen: "{LISTEN}"
  admin_listen: "{ADMIN}"
  public_url: "http://{LISTEN}"
  identity-providers:
    admin-tokens: { module: admin-tokens, token: { env: BUSBAR_ADMIN_TOKEN } }
  auth:
    chain: [keys]
    admin_auth: [admin-tokens]
    signing_key: { file: "{WORK}/signing.key" }
  groups:
    bench:
      limits:
        - { requests: 1000000000, per: minute }
  advanced:
    allow_destinations: ["127.0.0.1"]
  providers:
    openai: { api_key: { env: HAMMER_UPSTREAM_KEY } }
  models:
    m-openai: { provider: openai }
  plugins:
    enabled: true
    dir: "{WORK}/plugins"
    trust: { allow_unsigned: true }
  store: { module: valkey, settings: { url: "redis://127.0.0.1:{VK_PORT}/0" } }
providers: |
  openai: { protocol: openai, base_url: "{MOCK}" }
setup:
  - mint_key: { as: KEY, group: bench }
llm_matrix:
  - { ingress: [openai], egress: [openai], key: "{KEY}", shape: { closed: 32 } }
