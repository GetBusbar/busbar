name: export-prometheus
group: exports
description: openai>openai with the prometheus recorder on, plus a /metrics scrape case.
config: |
  listen: "{LISTEN}"
  admin_listen: "{ADMIN}"
  public_url: "http://{LISTEN}"
  identity-providers:
    admin-tokens: { module: admin-tokens, token: { env: BUSBAR_ADMIN_TOKEN } }
  auth:
    chain: [keys]
    admin_auth: [admin-tokens]
    signing_key: { file: "{WORK}/signing.key" }
  groups:
    bench:
      limits:
        - { requests: 1000000000, per: minute }
  advanced:
    allow_destinations: ["127.0.0.1"]
  providers:
    openai: { api_key: { env: HAMMER_UPSTREAM_KEY } }
  models:
    m-openai: { provider: openai }
  store: { module: memory }
  export:
    metrics: { module: prometheus, settings: { buffer_seconds: 60 } }
providers: |
  openai: { protocol: openai, base_url: "{MOCK}" }
setup:
  - mint_key: { as: KEY, group: bench }
llm_matrix:
  - { ingress: [openai], egress: [openai], key: "{KEY}", shape: { closed: 32 } }
cases:
  - name: GET /metrics scrape
    shape: { closed: 4 }
    requests:
      - { method: GET, path: /metrics, headers: { authorization: "Bearer {KEY}" } }
