name: admin-ops
group: admin
description: Admin API under load - key listing, key minting and stats beside openai>openai traffic, and alone.
config: |
  listen: "{LISTEN}"
  admin_listen: "{ADMIN}"
  public_url: "http://{LISTEN}"
  identity-providers:
    admin-tokens: { module: admin-tokens, token: { env: BUSBAR_ADMIN_TOKEN } }
  auth:
    chain: [keys]
    admin_auth: [admin-tokens]
    signing_key: { file: "{WORK}/signing.key" }
  groups:
    bench:
      limits:
        - { requests: 1000000000, per: minute }
  advanced:
    allow_destinations: ["127.0.0.1"]
  store: { module: memory }
  providers:
    openai: { api_key: { env: HAMMER_UPSTREAM_KEY } }
  models:
    m-openai: { provider: openai }
config_1_5: |
  listen: "{LISTEN}"
  admin_listen: "{ADMIN}"
  public_url: "http://{LISTEN}"
  identity-providers:
    admin-tokens: { module: admin-tokens, token: { env: BUSBAR_ADMIN_TOKEN } }
  auth:
    chain: [keys]
    admin_auth: [admin-tokens]
    signing_key: { file: "{WORK}/signing.key" }
  groups:
    bench:
      limits:
        - { requests: 1000000000, per: minute }
  providers:
    openai: { api_key: { env: HAMMER_UPSTREAM_KEY } }
  models:
    m-openai: { provider: openai }
providers: |
  openai: { protocol: openai, base_url: "{MOCK}" }
setup:
  - mint_key: { as: KEY, group: bench }
cases:
  - name: admin alone (list/mint mix, 40/s; the admin API rate-limits a closed loop with 429)
    shape: { open: 40, connections: 8 }
    requests:
      - { listener: admin, method: GET, path: /api/v1/admin/keys, weight: 4 }
      - { listener: admin, method: POST, path: /api/v1/admin/keys, expect: 201, headers: { content-type: application/json }, body: '{"name":"hammer-bg","group":"bench"}', weight: 1 }
  - name: openai>openai with admin ops beside it
    shape: { closed: 32 }
    requests:
      - path: /v1/chat/completions
        headers: { authorization: "Bearer {KEY}", content-type: application/json }
        body: '{"model":"m-openai","messages":[{"role":"user","content":"hello"}],"max_tokens":16}'
        contains: hammer-ok
    background:
      shape: { open: 50, connections: 8 }
      requests:
        - { listener: admin, method: GET, path: /api/v1/admin/keys, weight: 4 }
        - { listener: admin, method: POST, path: /api/v1/admin/keys, expect: 201, headers: { content-type: application/json }, body: '{"name":"hammer-bg","group":"bench"}', weight: 1 }
