name: plane-decisions
group: planes
description: Decisions plane, jev (POST /v1/systemone) and nanojev (POST /api/evaluate) relays.
config: |
  listen: "{LISTEN}"
  admin_listen: "{ADMIN}"
  public_url: "http://{LISTEN}"
  identity-providers:
    admin-tokens: { module: admin-tokens, token: { env: BUSBAR_ADMIN_TOKEN } }
  auth:
    chain: [keys]
    admin_auth: [admin-tokens]
    signing_key: { file: "{WORK}/signing.key" }
  groups:
    bench:
      limits:
        - { requests: 1000000000, per: minute }
  advanced:
    allow_destinations: ["127.0.0.1"]
  store: { module: memory }
  providers:
    openai: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    dec-jev: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    dec-nano: { api_key: { env: HAMMER_UPSTREAM_KEY } }
  models:
    m-openai: { provider: openai }
  decisions:
    models:
      d-jev: { provider: dec-jev, upstream_model: systemone, protocol: jev }
      d-nano: { provider: dec-nano, upstream_model: evaluator, protocol: nanojev }
providers: |
  openai: { protocol: openai, base_url: "{MOCK}" }
  dec-jev: { protocol: jev, base_url: "{MOCK}" }
  dec-nano: { protocol: nanojev, base_url: "{MOCK}" }
setup:
  - mint_key: { as: KEY, group: bench }
cases:
  - name: jev
    shape: { closed: 32 }
    requests:
      - path: /v1/systemone
        headers: { authorization: "Bearer {KEY}", content-type: application/json }
        body: '{"model":"d-jev","input":{"amount":10}}'
        contains: allow
    direct:
      listener: mock
      path: /v1/systemone
      body: '{"model":"systemone","input":{"amount":10}}'
  - name: nanojev
    shape: { closed: 32 }
    requests:
      - path: /api/evaluate
        headers: { authorization: "Bearer {KEY}", content-type: application/json }
        body: '{"model":"d-nano","input":{"amount":10}}'
        contains: allow
