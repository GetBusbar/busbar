name: llm-bodies
group: llm
description: Request bodies of 1 KiB, 8 KiB and 100 KiB, openai ingress to openai (passthrough) and to anthropic (translated).
config: |
  listen: "{LISTEN}"
  admin_listen: "{ADMIN}"
  public_url: "http://{LISTEN}"
  identity-providers:
    admin-tokens: { module: admin-tokens, token: { env: BUSBAR_ADMIN_TOKEN } }
  auth:
    chain: [keys]
    admin_auth: [admin-tokens]
    signing_key: { file: "{WORK}/signing.key" }
  groups:
    bench:
      limits:
        - { requests: 1000000000, per: minute }
  providers:
    openai: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    responses: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    anthropic: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    gemini: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    cohere: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    bedrock: { api_key: { env: HAMMER_BEDROCK_KEY } }
  models:
    m-openai: { provider: openai }
    m-responses: { provider: responses }
    m-anthropic: { provider: anthropic }
    m-gemini: { provider: gemini }
    m-cohere: { provider: cohere }
    m-bedrock: { provider: bedrock }
  advanced:
    allow_destinations: ["127.0.0.1"]
  store: { module: memory }
config_1_5: |
  listen: "{LISTEN}"
  admin_listen: "{ADMIN}"
  public_url: "http://{LISTEN}"
  identity-providers:
    admin-tokens: { module: admin-tokens, token: { env: BUSBAR_ADMIN_TOKEN } }
  auth:
    chain: [keys]
    admin_auth: [admin-tokens]
    signing_key: { file: "{WORK}/signing.key" }
  groups:
    bench:
      limits:
        - { requests: 1000000000, per: minute }
  providers:
    openai: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    responses: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    anthropic: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    gemini: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    cohere: { api_key: { env: HAMMER_UPSTREAM_KEY } }
    bedrock: { api_key: { env: HAMMER_BEDROCK_KEY } }
  models:
    m-openai: { provider: openai }
    m-responses: { provider: responses }
    m-anthropic: { provider: anthropic }
    m-gemini: { provider: gemini }
    m-cohere: { provider: cohere }
    m-bedrock: { provider: bedrock }
providers: |
  openai: { protocol: openai, base_url: "{MOCK}" }
  responses: { protocol: responses, base_url: "{MOCK}" }
  anthropic: { protocol: anthropic, base_url: "{MOCK}" }
  gemini: { protocol: gemini, base_url: "{MOCK}" }
  cohere: { protocol: cohere, base_url: "{MOCK}" }
  bedrock: { protocol: bedrock, base_url: "{MOCK}" }
setup:
  - mint_key: { as: KEY, group: bench }
llm_matrix:
  - { ingress: [openai], egress: [openai, anthropic], pad: [1024, 8192, 102400], key: "{KEY}", shape: { closed: 32 } }
