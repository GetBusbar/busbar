name: export-webhook
group: exports
description: "openai>openai with the request-log webhook sink. It only dials https public hosts, so against the loopback mock it boots but delivers nothing (mock webhook hits stay 0): this measures the request-path cost of the sink, not delivery."
config: |
  listen: "{LISTEN}"
  admin_listen: "{ADMIN}"
  public_url: "http://{LISTEN}"
  identity-providers:
    admin-tokens: { module: admin-tokens, token: { env: BUSBAR_ADMIN_TOKEN } }
  auth:
    chain: [keys]
    admin_auth: [admin-tokens]
    signing_key: { file: "{WORK}/signing.key" }
  groups:
    bench:
      limits:
        - { requests: 1000000000, per: minute }
  advanced:
    allow_destinations: ["127.0.0.1"]
  providers:
    openai: { api_key: { env: HAMMER_UPSTREAM_KEY } }
  models:
    m-openai: { provider: openai }
  store: { module: memory }
  export:
    req-hook: { module: request-log-webhook, settings: { url: "{MOCK}/webhook" } }
providers: |
  openai: { protocol: openai, base_url: "{MOCK}" }
setup:
  - mint_key: { as: KEY, group: bench }
llm_matrix:
  - { ingress: [openai], egress: [openai], key: "{KEY}", shape: { closed: 32 } }
