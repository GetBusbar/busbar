[workspace]
resolver = "2"
members = [".", "witnesses"]

[package]
name = "busbar-arch"
version = "0.1.0"
edition = "2021"
publish = false
description = "Architecture policy checks for GetBusbar/busbar and its plugins (port of scripts/architecture/check.py)."
license = "Apache-2.0"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
syn = { version = "2", default-features = false, features = ["parsing", "printing", "proc-macro"] }
glob = "0.3"
toml = { version = "0.9", features = ["preserve_order"] }
