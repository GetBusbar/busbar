[package]
name = "busbar-ci-checks"
version = "1.6.0"
publish = false            # internal workspace tool; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "Core's repository checks, one CI job line each in busbar-release ci/core.yml: no-getrandom, crypto-graph, the MIN-3 fleet manifest, C-TRANSPORT source checks, C-EXPORT-STREAMS, C-NO-LICENCE, the section 15.8 core scan, the LOC report, the per-plugin-repo checks (template-drift, patch-drift, no-host-link, plugin-rules, c-alias), and bin/oracle's logic (oracle)."
license = "Apache-2.0"

[[bin]]
name = "busbar-ci-checks"
path = "src/main.rs"
bench = false

[dependencies]
busbar-contract = { workspace = true }
proc-macro2 = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
object = { version = "0.37", default-features = false, features = ["read", "std"] }
# bin/oracle's filters and corpus patterns (`oracle`): the regex dialect the oracle engine reads them in.
regex = "1.12"

[lints]
workspace = true
