[package]
name = "busbar-ci-checks"
version = "1.6.0"
publish = false            # internal workspace tool; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "Core's repository checks, one CI job line each in busbar-release ci/core.yml: no-getrandom, crypto-graph, the MIN-3 fleet manifest, C-TRANSPORT source checks, C-EXPORT-STREAMS, C-NO-LICENCE, the section 15.8 core scan, the LOC report, and the per-plugin-repo checks (template-drift, patch-drift, no-host-link, plugin-rules, c-alias)."
license = "Apache-2.0"

[[bin]]
name = "busbar-ci-checks"
path = "src/main.rs"
bench = false

[dependencies]
proc-macro2 = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
serde_json = { workspace = true }
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "macho", "pe", "std"] }

[lints]
workspace = true
