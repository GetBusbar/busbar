# Core copy of the fleet bad-pattern rule block (request-path rows, marker-gated). The source is
# GetBusbar/busbar-release ci/core-clippy-bans.toml (busbar-release 264c1aed31f0a83fc4d810967f2dc5e00dd7624a); this block is a
# byte-identical copy of it below its header. Crate-wide rows are in clippy-crate-wide/clippy.toml.

# --- Fleet bad-pattern rules. One list: GetBusbar/busbar-release LINT-RULES.md (every row, its reason
# and its scope); this block and core's root clippy.toml carry its clippy rows, and busbar-release's
# crates/busbar-release-plugin/tests/lint_rules.rs fails when either drifts from it or a row has no
# red-proof fixture that clippy flags. A known-bad pattern must not pass CI.
# Inert unless a module tree carries the request-path marker: [workspace.lints.clippy] sets the three
# disallowed_* lints to "allow" and the marker raises them to deny:
#   #[cfg_attr(not(test), deny(clippy::disallowed_macros, clippy::disallowed_methods, clippy::disallowed_types, clippy::redundant_clone, clippy::format_push_string, clippy::needless_collect, clippy::or_fun_call, clippy::needless_pass_by_value, clippy::allow_attributes, clippy::allow_attributes_without_reason))]
#   mod door;
#   mod cold;
# Scope is module-level. Cold code the request path needs (refusal text, rare off-path sweeps of
# state) lives in the ONE sanctioned cold module, `cold`, a sibling of the marked module and outside
# the marker; the request path calls into it. Every fn in `cold` is #[cold] or #[inline(never)], and
# it holds no while/loop and no loop or iterator sweep over request data (busbar-bad-patterns BP17).
# Escapes are forbidden (coordinator ruling 308): no #[allow], #[expect] or cfg_attr(.., allow/expect)
# of these lints anywhere, reasoned or not. Fix the site; a ban that is wrong for a case is narrowed
# here and in LINT-RULES.md together, with a written justification. busbar-bad-patterns
# (busbar-release tools/bad-patterns, run by CI beside clippy) refuses every escape (BP06) and checks
# what this list cannot express (allocating clone/From/Into by any spelling, fresh per-call buffers,
# scans over state, repeated clock reads, also through same-crate helpers). LR-180 (partition) and
# LR-181 (Vec::split_off) wait on two busbar-contract SDK design questions (publish retire,
# completion_retirement acknowledge); see GetBusbar/busbar-release LINT-RULES.md.
disallowed-macros = [
  { path = "serde_json::json", reason = "builds a Value tree per call; serialize a borrowed #[derive(Serialize)] struct into the op's reused buffer", allow-invalid = true },
  { path = "anyhow::anyhow", reason = "formats and boxes an error per call; return a typed error or a &'static str refusal", allow-invalid = true },
  { path = "anyhow::bail", reason = "formats and boxes an error per call; return a typed error or a &'static str refusal", allow-invalid = true },
  { path = "anyhow::format_err", reason = "formats and boxes an error per call; return a typed error or a &'static str refusal", allow-invalid = true },
  { path = "anyhow::ensure", reason = "formats and boxes an error per call; return a typed error or a &'static str refusal", allow-invalid = true },
  { path = "alloc::format", reason = "format! allocates a String per call; write! into the op's reused buffer, or use a &'static str" },
]
disallowed-methods = [
  { path = "alloc::fmt::format", reason = "fmt::format allocates a String per call; write! into the op's reused buffer, or use a &'static str" },
  { path = "alloc::string::ToString::to_string", reason = "allocates a String per call; borrow the &str, use a &'static str, or write! into the op's reused buffer" },
  { path = "alloc::borrow::ToOwned::to_owned", reason = "allocates an owned copy per call; borrow it (&str, &[u8], Cow::Borrowed)" },
  { path = "slice::to_vec", reason = "allocates a Vec copy per call; borrow the slice, or extend the op's reused buffer" },
  { path = "str::to_lowercase", reason = "allocates a String per call; compare with eq_ignore_ascii_case, or lower into the op's reused buffer" },
  { path = "str::to_uppercase", reason = "allocates a String per call; compare with eq_ignore_ascii_case, or write into the op's reused buffer" },
  { path = "str::to_ascii_lowercase", reason = "allocates a String per call; compare with eq_ignore_ascii_case, or make_ascii_lowercase in the op's reused buffer" },
  { path = "str::to_ascii_uppercase", reason = "allocates a String per call; compare with eq_ignore_ascii_case, or make_ascii_uppercase in the op's reused buffer" },
  { path = "slice::to_ascii_lowercase", reason = "allocates a Vec per call; eq_ignore_ascii_case, or make_ascii_lowercase in the op's reused buffer" },
  { path = "slice::to_ascii_uppercase", reason = "allocates a Vec per call; eq_ignore_ascii_case, or make_ascii_uppercase in the op's reused buffer" },
  { path = "str::repeat", reason = "allocates a String per call; write into the op's reused buffer" },
  { path = "slice::repeat", reason = "allocates a Vec per call; extend the op's reused buffer" },
  { path = "str::replace", reason = "allocates a String per call; write the pieces into the op's reused buffer" },
  { path = "str::replacen", reason = "allocates a String per call; write the pieces into the op's reused buffer" },
  { path = "slice::concat", reason = "allocates per call; extend the op's reused buffer piece by piece" },
  { path = "slice::join", reason = "allocates per call; write the pieces and separators into the op's reused buffer" },
  { path = "alloc::string::String::into_boxed_str", reason = "shrinks with a realloc per call; keep the String, or use a &'static str" },
  { path = "alloc::vec::Vec::into_boxed_slice", reason = "shrinks with a realloc per call; keep the Vec, or borrow the slice" },
  { path = "alloc::borrow::Cow::into_owned", reason = "allocates when borrowed; keep the Cow borrowed" },
  { path = "alloc::borrow::Cow::to_mut", reason = "allocates when borrowed; write into the op's reused buffer" },
  { path = "core::iter::Iterator::collect", reason = "allocates a collection per call; iterate lazily, or extend the op's reused buffer (clear + extend)" },
  { path = "core::iter::FromIterator::from_iter", reason = "allocates a collection per call; iterate lazily, or extend the op's reused buffer" },
  { path = "core::iter::Iterator::unzip", reason = "allocates two collections per call (collect by another spelling); iterate lazily, or extend the op's reused buffers" },
  { path = "alloc::string::String::split_off", reason = "allocates a new String for the tail per call; borrow the slice, or write into the op's reused buffer" },
  { path = "std::path::Path::to_path_buf", reason = "allocates a PathBuf per call (to_owned by another name); borrow the &Path" },
  { path = "std::ffi::OsStr::to_os_string", reason = "allocates an OsString per call (to_owned by another name); borrow the &OsStr" },
  { path = "anyhow::Error::msg", reason = "boxes an error per call; return a typed error or a &'static str refusal", allow-invalid = true },
  { path = "serde_json::to_value", reason = "builds a Value tree per call; serialize the borrowed struct directly", allow-invalid = true },
  { path = "serde_json::from_value", reason = "walks a Value tree; deserialize the bytes straight into the target type", allow-invalid = true },
  { path = "serde_json::to_vec", reason = "allocates a fresh Vec per call; serde_json::to_writer into the op's reused buffer", allow-invalid = true },
  { path = "serde_json::to_string", reason = "allocates a fresh String per call; serde_json::to_writer into the op's reused buffer", allow-invalid = true },
  { path = "serde_json::to_vec_pretty", reason = "allocates a fresh Vec per call; to_writer into the op's reused buffer", allow-invalid = true },
  { path = "serde_json::to_string_pretty", reason = "allocates a fresh String per call; to_writer into the op's reused buffer", allow-invalid = true },
  { path = "slice::sort", reason = "no sorting on the request path (a sort per call; stable: also a scratch buffer): data arrives ordered, or lives in an ordered container chosen for a real reason; plain sort only off the request path" },
  { path = "slice::sort_by", reason = "no sorting on the request path (a sort per call; stable: also a scratch buffer): data arrives ordered, or lives in an ordered container chosen for a real reason; plain sort only off the request path" },
  { path = "slice::sort_by_key", reason = "no sorting on the request path (a sort per call; stable: also a scratch buffer): data arrives ordered, or lives in an ordered container chosen for a real reason; plain sort only off the request path" },
  { path = "slice::sort_by_cached_key", reason = "no sorting on the request path (a sort plus a key buffer per call): data arrives ordered, or lives in an ordered container chosen for a real reason; plain sort only off the request path" },
  { path = "alloc::vec::Vec::retain", reason = "O(n) sweep in a request-path op; index by key, or expire in the tick" },
  { path = "alloc::vec::Vec::retain_mut", reason = "O(n) sweep in a request-path op; index by key, or expire in the tick" },
  { path = "alloc::vec::Vec::remove", reason = "O(n) shift per call; swap_remove, VecDeque::pop_front, or a map keyed by id" },
  { path = "alloc::collections::VecDeque::retain", reason = "O(n) sweep in a request-path op; index by key, or expire in the tick" },
  { path = "alloc::collections::VecDeque::retain_mut", reason = "O(n) sweep in a request-path op; index by key, or expire in the tick" },
  { path = "alloc::collections::VecDeque::remove", reason = "O(n) shift per call; pop_front/pop_back, or a map keyed by id" },
  { path = "std::collections::HashMap::retain", reason = "O(n) sweep in a request-path op; remove by key, or expire in the tick" },
  { path = "std::collections::HashSet::retain", reason = "O(n) sweep in a request-path op; remove by key, or expire in the tick" },
  { path = "alloc::collections::BTreeMap::retain", reason = "O(n) sweep in a request-path op; remove by key or range, or expire in the tick" },
  { path = "alloc::collections::BTreeSet::retain", reason = "O(n) sweep in a request-path op; remove by key or range, or expire in the tick" },
  { path = "alloc::vec::Vec::extract_if", reason = "O(n) sweep in a request-path op; index by key, or expire in the tick" },
  { path = "alloc::collections::LinkedList::extract_if", reason = "O(n) sweep in a request-path op; index by key, or expire in the tick" },
  { path = "std::collections::HashMap::extract_if", reason = "O(n) sweep in a request-path op; remove by key, or expire in the tick" },
  { path = "std::collections::HashSet::extract_if", reason = "O(n) sweep in a request-path op; remove by key, or expire in the tick" },
  { path = "alloc::collections::BTreeMap::extract_if", reason = "O(n) sweep in a request-path op; remove by key or range, or expire in the tick" },
  { path = "alloc::collections::BTreeSet::extract_if", reason = "O(n) sweep in a request-path op; remove by key or range, or expire in the tick" },
  { path = "std::time::Instant::now", reason = "OS clock read on the request path; take the op's one shared-clock reading passed down" },
  { path = "std::time::Instant::elapsed", reason = "reads the OS clock; subtract from the op's one shared-clock reading" },
  { path = "std::time::SystemTime::now", reason = "OS clock read on the request path; take the op's one shared-clock reading passed down" },
  { path = "std::time::SystemTime::elapsed", reason = "reads the OS clock; subtract from the op's one shared-clock reading" },
  { path = "tokio::time::Instant::now", reason = "OS clock read on the request path; take the op's one shared-clock reading", allow-invalid = true },
  { path = "tokio::time::Instant::elapsed", reason = "reads the OS clock; subtract from the op's one shared-clock reading", allow-invalid = true },
  { path = "chrono::Utc::now", reason = "OS clock read on the request path; take the op's one shared-clock reading", allow-invalid = true },
  { path = "chrono::Local::now", reason = "OS clock read and a time-zone lookup per call; take the op's one shared-clock reading", allow-invalid = true },
  { path = "time::OffsetDateTime::now_utc", reason = "OS clock read on the request path; take the op's one shared-clock reading", allow-invalid = true },
  { path = "getrandom::fill", reason = "a getrandom syscall per call; draw from a per-thread userspace CSPRNG seeded once", allow-invalid = true },
  { path = "getrandom::getrandom", reason = "a getrandom syscall per call; draw from a per-thread userspace CSPRNG seeded once", allow-invalid = true },
  { path = "getrandom::u32", reason = "a getrandom syscall per call; draw from a per-thread userspace CSPRNG seeded once", allow-invalid = true },
  { path = "getrandom::u64", reason = "a getrandom syscall per call; draw from a per-thread userspace CSPRNG seeded once", allow-invalid = true },
  { path = "zeroize::Zeroize::zeroize", reason = "wipes the whole capacity byte by byte per call; use busbar_contract::secure (wipe, wipe_string, Secure* types)", allow-invalid = true },
  { path = "digest::Digest::digest", reason = "software SHA-256 on the request path; go through busbar_contract::crypto (crypto::sha256 / crypto::Sha256)", allow-invalid = true },
  # core only (LINT-RULES.md scope `core`), from core commit ecf6147283 (lint/bad-patterns-config), moved
  # there from fix/upg-a26c. busbar-plane-llm owns both items; allow-invalid, so no fixture here can
  # resolve them (lint_rules.rs leaves them out of the fixture run, named).
  { path = "busbar_plane_llm::codec::anthropic::ids::synth_request_id", allow-invalid = true, reason = "UPG-A26c: a stream's error frame names the request id its head stated; mint only through AnthropicWriter::carried_request_id or a stream-less envelope (anthropic/auth.rs)" },
  { path = "busbar_plane_llm::codec::openai_responses::synthesize_response_id", allow-invalid = true, reason = "UPG-A26c: a stream's terminal frame continues the response id it opened with; mint only at MessageStart, in carried_or_mint_response_id, or in the whole-body writer" },
  # core only, UPG-A27c (core fix/upg-a27c-admin-usage-lags-seconds-behind-ser, root clippy.toml): live
  # (request-path) code proves the journal head with RuntimeJournal; boot recovery and tests may replay.
  # busbar-kernel owns both items (pub(crate)); allow-invalid, no fixture here can resolve them.
  { path = "busbar_kernel::persistence::journal::StoreJournal::historical_replay", allow-invalid = true, reason = "O(journal); live paths use RuntimeJournal::live_proof / locate" },
  { path = "busbar_kernel::persistence::journal::StoreJournal::read_verified_record", allow-invalid = true, reason = "O(journal); live paths use RuntimeJournal::live_proof / locate" },
  # core only, FIRST-START-TAKEOVER §9a (was crates/busbar/clippy.toml, which shadowed this file for
  # the busbar crate): every exit goes through `root::exit::exit`, which hands an unpublished first
  # start over before the process ends; every exec will go through `root::exit::exec`.
  { path = "std::process::exit", reason = "exit through root::exit::exit so an unpublished first start is handed over (FIRST-START-TAKEOVER §2.7)" },
  { path = "std::os::unix::process::CommandExt::exec", reason = "exec through root::exit::exec (FIRST-START-TAKEOVER §2.9 (d))", allow-invalid = true },
  # R24 no-sign-on-request-path (SEALING-FIX r20 §5.3 layer 2; LINT-RULES R24): the audit signing
  # capabilities and the root submit path. Called only from the unmarked root/durability/signer.rs,
  # keyset.rs and boot.rs, so these rows have zero hits in the marked request-path trees.
  { path = "busbar_kernel_audit::Notary::sign_stamp", reason = "R24: audit pages are signed on the notary signer thread, never on the request path" },
  { path = "busbar_kernel_audit::BootstrapSigner::sign_restart_page", reason = "R24: restart pages are signed on the Bootstrap signer thread, never on the request path" },
  { path = "busbar_kernel_audit::BootstrapSigner::sign_break", reason = "R24: break notices are signed on the Bootstrap signer thread, never on the request path" },
  { path = "busbar_kernel_audit::BootstrapSigner::sign_notary_cert", allow-invalid = true, reason = "R24: the notary key certificate is signed on the Bootstrap signer thread, never on the request path" },
  { path = "busbar_kernel_audit::BootstrapSigner::sign_checkpoint", reason = "R24: checkpoint bodies are signed on the Bootstrap signer thread, never on the request path" },
  { path = "busbar_kernel_audit::AuditSigningKey::into_grants", reason = "R24: the deployment key is split into its grants once, at boot (keyset::bind_split)" },
  { path = "busbar::root::durability::signer::SignerHandle::submit", allow-invalid = true, reason = "R24: no request submits or awaits an audit signature" },
  { path = "busbar::root::durability::signer::SignerHandle::submit_restart", allow-invalid = true, reason = "R24: no request submits or awaits an audit signature" },
  { path = "busbar::root::durability::signer::SignerHandle::submit_break", allow-invalid = true, reason = "R24: no request submits or awaits an audit signature" },
  { path = "busbar::root::durability::signer::SignerHandle::sign_checkpoints", allow-invalid = true, reason = "R24: no request submits or awaits an audit signature" },
  { path = "busbar::root::durability::signer::spawn", allow-invalid = true, reason = "R24: the signer threads start once, at boot" },
]
