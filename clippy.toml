# Rules the existing clippy step (`cargo clippy ... -- -D warnings`, the core-clippy job) enforces on
# every workspace member and target. Each known-bad pattern becomes a rule here (LINT-RULES §2.1).
# The one exception is a single-line `#[expect(clippy::..., reason = "...")]` at a cold site.
disallowed-methods = [
    # UPG-A27c: a journal proof taken by replaying the whole journal is O(journal) and, when it is
    # used to select under the publication driver, races concurrent appends. Live paths prove the
    # head with `RuntimeJournal::live_proof` and find records with `RuntimeJournal::locate`.
    { path = "busbar_kernel::persistence::journal::StoreJournal::historical_replay", reason = "O(journal); live paths use RuntimeJournal::live_proof / locate" },
    { path = "busbar_kernel::persistence::journal::StoreJournal::read_verified_record", reason = "O(journal); live paths use RuntimeJournal::live_proof / locate" },
    # UPG-A26c: a stream-terminal frame must not mint an identity the stream already stated. The paths
    # resolve only inside busbar-plane-llm (allow-invalid: inert here and in every other plugin).
    { path = "busbar_plane_llm::codec::anthropic::ids::synth_request_id", allow-invalid = true, reason = "UPG-A26c: a stream's error frame names the request id its head stated; mint only through AnthropicWriter::carried_request_id or a stream-less envelope (anthropic/auth.rs)" },
    { path = "busbar_plane_llm::codec::openai_responses::synthesize_response_id", allow-invalid = true, reason = "UPG-A26c: a stream's terminal frame continues the response id it opened with; mint only at MessageStart, in carried_or_mint_response_id, or in the whole-body writer" },
]
