# Core clippy configuration. Clippy finds this file by walking up from each crate's manifest
# directory, so it applies to the root workspace and to the dist/default workspace
# (dist/default/Cargo.toml compiles crates/busbar's sources and finds this file two levels up).
# Do not add a clippy.toml under dist/ or a crate: it would shadow this one.

disallowed-methods = [
  # --- R23 `derive-once` (SINGLE-PATH.md §2.10, decision 124). Each function derives one
  # per-request fact from raw request input. Its production call sites are exactly one owner,
  # marked #[expect(clippy::disallowed_methods, reason = "R23: owner of <fact>")], plus the named
  # kept sites whose input differs, marked #[expect(clippy::disallowed_methods,
  # reason = "R23: <input> differs: <why>")]. A new call site fails clippy; read the owner's
  # carried fact instead. `allow-invalid`: these items are private to busbar-kernel, so crates
  # that cannot name them must not warn about the path.
  { path = "busbar_kernel::inbound::header_map", reason = "R23: derived once; read Derived::headers", allow-invalid = true },
  { path = "busbar_kernel::inbound::Listener::admission", reason = "R23: derived once; read Derived::admission", allow-invalid = true },
  { path = "busbar_kernel::inbound::Listener::admission_on", reason = "R23: derived once; only the non-peer continuation call resolves its own head", allow-invalid = true },
  { path = "busbar_kernel::inbound::Head::stripped", reason = "R23: derived once; handin_state_matches owns the stripped original", allow-invalid = true },
  { path = "busbar_kernel::auth::AuthMiddleware::extract_client_token", reason = "R23: derived once; read Derived::client_token", allow-invalid = true },
  { path = "busbar_kernel::auth::caller_credential::CallerCredential::verified", reason = "R23: derived once; verified_caller_credential owns the credential buffer", allow-invalid = true },
]
