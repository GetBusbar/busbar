# Coverage-guided fuzz harnesses for busbar's untrusted parse surface.
#
# This is a SELF-CONTAINED workspace (note the empty `[workspace]` table below): it is NOT a
# member of the root workspace, so it never affects a normal `cargo build`/`cargo test` and adds
# zero cost to the per-push CI. It builds where the `fuzz-smoke` check in `qa/pipeline-checks.json`
# declares it (the `dev` -> `qa` and `qa` -> `main` moves, every `[[bin]]` below for 60 s), or under
# `cargo fuzz` by hand. The harnesses depend on the target crates
# by path with their sanctioned `test-support` feature and DO NOT modify any crate source.
[package]
name = "busbar-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# The LLM plane's folded-in `codec` module (no `busbar-*-codec` crate, `BUSBAR-1.6.0.md` THE DESIGN, §9/#39) exposes
# the concrete per-dialect readers. `embeddings_read_request` dispatches straight into the
# production `read_embeddings_request` reader for each dialect — so fuzzing this entry point fuzzes
# the real JSON/wire decode of an untrusted request body. The plane lives in its own repo (rows
# 106/107): this is the rev the root `Cargo.toml` pins, and the contract it names is this tree's.
busbar-plane-llm = { git = "https://github.com/GetBusbar/busbar-plane-llm", rev = "0d27f7d51c401781bee77a94f7cd353470516ad1", features = ["test-support"] }

# Fuzz harnesses are not doctested/benchmarked and must not be picked up as workspace tests.
[[bin]]
name = "codec_embeddings_read_request"
path = "fuzz_targets/codec_embeddings_read_request.rs"
test = false
doc = false
bench = false

# Make this its own workspace so the root workspace does not try to build the fuzz crate (and its
# sanitizer flags) during ordinary builds.
[workspace]

# The pinned plane names busbar-contract at its own busbar pin; the harness builds it against this
# tree's contract, as the root workspace does.
[patch.'https://github.com/GetBusbar/busbar']
busbar-contract = { path = "../crates/busbar-contract" }
