# The busbar release ed25519 PUBLIC key is a build input (the repository variable
# BUSBAR_RELEASE_PUBKEY in CI; not a secret): plugin-loader embeds it at build time so a binary
# trusts first-party plugins with zero configuration. A keyless build refuses every published
# first-party plugin, which the shadow oracle judges as a failed candidate at setup; the oracle sets
# the variable to its own run key at its candidate build.
#
# The retired 1.5 key (b18395a3…), whose seed lived in a GitHub org secret, is NOT committed here,
# and plugin-loader refuses what it signed even in a build that embeds it (RETIRED_RELEASE_KEYS).
# No key is committed until the 1.6.0 key ceremony (#1713) names the new roots.

# W17, THE LINKING DESIGN: every shipped binary and every plugin cdylib needs nothing at run time
# beyond the OS's own C runtime. On Windows that means the MSVC CRT is linked STATICALLY, so neither
# busbar.exe nor a plugin DLL needs the Visual C++ Redistributable. One CRT per module is safe here
# because the plugin memory ABI never frees across the boundary: each side frees only what it
# allocated (busbar-contract abi/host/hook.rs HostBuf, abi/host/service.rs caller-sized buffers).
# A build that sets RUSTFLAGS itself bypasses this table (cargo's precedence), so the release
# scripts carry the same flag (scripts/release-build.sh, scripts/pgo-build.sh: CRT_FLAG), and the
# `runtime_deps` row of .github/artifact-contract.json asserts it on the shipped bytes.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Qualified first-party builds use the official aws-lc-sys vendored, static AWS-LC.
# Target-suffixed inputs take precedence upstream, so force both forms for each release target.
# An explicit AWS_LC_SYS_SYSTEM_DIR remains a contradictory input and is refused upstream.
# Cargo discovers this file from its invocation directory; dependency checkouts do not impose it
# on consumer roots. Plugin and generated-workspace build roots must carry these [env] settings.
[env]
AWS_LC_SYS_USE_SYSTEM = { value = "0", force = true }
AWS_LC_SYS_STATIC = { value = "1", force = true }
AWS_LC_SYS_USE_SYSTEM_x86_64_unknown_linux_gnu = { value = "0", force = true }
AWS_LC_SYS_STATIC_x86_64_unknown_linux_gnu = { value = "1", force = true }
AWS_LC_SYS_USE_SYSTEM_aarch64_unknown_linux_gnu = { value = "0", force = true }
AWS_LC_SYS_STATIC_aarch64_unknown_linux_gnu = { value = "1", force = true }
AWS_LC_SYS_USE_SYSTEM_x86_64_apple_darwin = { value = "0", force = true }
AWS_LC_SYS_STATIC_x86_64_apple_darwin = { value = "1", force = true }
AWS_LC_SYS_USE_SYSTEM_aarch64_apple_darwin = { value = "0", force = true }
AWS_LC_SYS_STATIC_aarch64_apple_darwin = { value = "1", force = true }
AWS_LC_SYS_USE_SYSTEM_x86_64_pc_windows_msvc = { value = "0", force = true }
AWS_LC_SYS_STATIC_x86_64_pc_windows_msvc = { value = "1", force = true }
