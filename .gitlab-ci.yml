# The project CI configuration must select the owner-approved immutable revision of
# ci/architecture-pipeline.yml in GetBusbar/busbar. This file cannot grant admission.
# Unregistered scaffolds fail closed until the canonical policy classifies their
# repository, kind, package paths and open-source/enterprise distribution.
workflow:
  rules:
    - when: always

admission-not-configured:
  script:
    - echo 'Configure the owner-approved immutable CI revision and protected GitLab admission.'
    - exit 1
