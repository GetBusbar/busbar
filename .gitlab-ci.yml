# This repository does not carry its CI pipeline. The project's CI configuration is set by the
# owner outside this tree; this file cannot grant admission and fails closed when it is run as is.
workflow:
  rules:
    - when: always

admission-not-configured:
  script:
    - echo "This project's CI configuration is set by the owner; this repository's .gitlab-ci.yml runs nothing."
    - exit 1
