# THE CONFORMANCE SUITE REGISTRY — the ONE hand-authored input, and it holds NO status.
#
# This file lists WHICH suites exist and their claim TYPE (`tier`) — the ceiling a suite may ever
# claim. It does NOT record whether a suite ran or passed, and a field outside the registry's own
# (`id`, `standard`, `plan`, `tier`, `label`, `verdict`, `public`, `plane`) is refused. Status is
# DERIVED, never typed: `cargo xtask conformance record` writes one verdict per suite it judged
# (conformance/verdicts/<id>.json, stamped with the checkout's HEAD), and
# `cargo xtask gate conformance-sync --write` reconciles the registry and those verdicts into
# conformance/manifest.json. A registered suite with no verdict is not-run and renders nothing.
#
# `tier` is a registry constant and is the CEILING (the owner's conformance-matrix ruling):
#   certified        a third-party body ISSUED a cert (requires cert fields in the verdict)
#   conformant       passes an official/authoritative suite
#   spec-conformant  validated against a published spec; no vendor cert program exists
#   capable          implements the mechanism; not externally validated
#   evidence-only    busbar supplies audit EVIDENCE; never busbar's own cert
#
# Two floors hold this file from below, and the gate refuses the registry when either breaks:
#   * `plane` names the shipped plane a suite judges (`crates/busbar-plane-<key>` in
#     qa/construction.toml `[gate.plugin_kinds].plane`). Every shipped plane owes at least one suite
#     here, and no suite may name a plane the build does not ship. A suite that judges no plane (a
#     transport, the auth server, the supply chain) carries no `plane`.
#   * the registered ids are exactly the armed set, `SUITE_FLOOR` in
#     xtask/src/gates/conformance_sync/render.rs (Law 9: a floor only rises). Deleting any suite's
#     block is refused, so no suite leaves the MUST set; a new suite is armed there in the commit
#     that adds its block here.
#
# A green suite may render only AT OR BELOW its ceiling. Adding a suite is one block here plus its
# armed id; nothing on the README is hand-edited: it is rendered from the manifest.

[[suite]]
id = "a2a"
standard = "Agent2Agent (A2A) Protocol"
plan = "official a2aproject/a2a-tck + a2a-harness + a2a-go reference peer"
tier = "conformant"
label = "A2A"
verdict = "conformance-verdict-a2a"
plane = "a2a"
public = "true"

