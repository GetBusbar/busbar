[suite.oidf-oauth2]
standard = "OpenID Foundation OAuth 2.0 conformance suite (self-hosted, no logo)"
plan     = "gitlab.com/openid/conformance-suite self-hosted run vs busbar-oauth2 (oauth-as 0.10.0 FAPI2 harness)"
tier     = "conformant"
cost     = "free"
verdict  = "conformance-verdict-oidf-oauth2"
public   = true
# $0, self-hosted, no logo (owner ruling 2026-09-19). Turnstile CommandCheck
# id: conformance:oidf-oauth2.

[suite.fapi2]
standard = "FAPI 2.0 Security Profile (OpenID Foundation OP certification)"
plan     = "OIDF FAPI2 conformance suite self-hosted to green (PAR + DPoP + client-assertion wired)"
tier     = "conformant"
cost     = "paid"
verdict  = "conformance-verdict-fapi2"
public   = true
# Suite-green is buildable now and is self-hosted/free; the PUBLIC OIDF
# listing + logo is a paid, owner-owned step ($5k non-member / ~$2k as new
# member — CONFORMANCE-MATRIX-RULING.md "OWNER (2026-09-19): FAPI2 paid
# listing is owner-owned"). tier stays "conformant" ("passes the FAPI2
# suite") until the owner completes the paid listing; bumping to
# tier="certified" requires the issued cert_id/issuer/expires in the verdict
# (CONFORMANCE-SYNC-DESIGN.md §4) — the generator refuses otherwise. This is
# the manifest-side half of the never-overclaim guard; the turnstile-side
# half is `busbar-release` `auto_apply::PAID_SUITES`.

[suite.jev]
standard = "jev decision plane (client.models.list() dialect probes)"
plan     = "2 typesafe SDKs exercising /v1/systemone + /v1/models"
tier     = "conformant"
cost     = "free"
verdict  = "conformance-verdict-jev"
public   = true
# Build item in the jev wiring stage (CONFORMANCE-MATRIX-RULING.md line
# 10-11); registers here ahead of the wiring landing so `conformance:coverage`
# (CONFORMANCE-SYNC-DESIGN.md §5) starts owing it now rather than being
# retrofitted later.
