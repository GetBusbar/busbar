# THE CONFORMANCE SUITE REGISTRY — the ONE hand-authored input, and it holds NO status.
#
# DERIVED-never-typed (scripts/release-gate/expected-ids.sh:11-14): this file lists WHICH suites
# exist and their claim TYPE (`tier`) — the ceiling a suite may ever claim. It does NOT record
# whether a suite passed; that is read from the per-suite verdict artifacts (conformance/verdicts/)
# and reconciled into conformance/manifest.json by `cargo xtask gate conformance-sync --write`.
#
# `tier` is a registry constant and is the CEILING (CONFORMANCE-MATRIX-RULING.md):
#   certified        a third-party body ISSUED a cert (requires cert fields in the verdict)
#   conformant       passes an official/authoritative suite
#   spec-conformant  validated against a published spec; no vendor cert program exists
#   capable          implements the mechanism; not externally validated
#   evidence-only    busbar supplies audit EVIDENCE; never busbar's own cert
#
# `plane` names the shipped plane a suite judges (`crates/busbar-plane-<key>` in qa/construction.toml
# `[gate.plugin_kinds].plane`). Every shipped plane owes at least one suite here, and no suite may
# name a plane the build does not ship: the gate refuses the registry otherwise, so removing a
# plane's suite cannot shrink the MUST set. A suite that judges no plane (a transport, the auth
# server, the supply chain) carries no `plane`.
#
# A green suite may render only AT OR BELOW its ceiling. Adding a suite is one block here plus the
# suite's own verdict artifact — nothing on the README is hand-edited; it is rendered from this
# registry and those artifacts.

