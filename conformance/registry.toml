# Conformance suite registry — the ONE hand-authored input to the conformance
# manifest generator (`cargo xtask conformance-manifest --write`, not yet
# built — see `conformance/README.md`). Holds no status; status comes only
# from real verdict artifacts at manifest-generation time.
#
# Design: CONFORMANCE-SYNC-DESIGN.md §3.3 (schema), §4 (honesty tiering — the
# `tier` here is a CEILING the rendered claim can never exceed).
# Ruling:  CONFORMANCE-MATRIX-RULING.md (owner-agreed 2026-09-19) — the MUST
#          set and the free-vs-paid classification of each suite.
# Turnstile-side consumer: `busbar-release` `crates/busbar-release-turnstile/
#          src/conformance.rs` (DEFAULT_MUST_SUITES) and `auto_apply.rs`
#          (FREE_SUITES / PAID_SUITES) — the `cost` field below is this
#          registry's copy of that same classification, kept in the repo whose
#          workflows actually produce the verdicts.
#
# Adding a suite: add one [suite.<id>] block here (CONFORMANCE-SYNC-DESIGN.md
# §7 "onboarding a brand-new suite") — nothing else changes on either
# human-visible surface. Do NOT set tier="certified" without a real, issued
# cert_id/issuer/expires in the suite's verdict; the generator refuses it.

[suite.mcp]
standard = "Model Context Protocol"
plan     = "official modelcontextprotocol/typescript-sdk TCK + in-house battery"
tier     = "conformant"
cost     = "free"
verdict  = "conformance-verdict-mcp"
public   = true
# Already wired: mcp-conformance.yml -> "MCP conformance verdict" (required
# GitHub check today). Turnstile CommandCheck id: conformance:mcp.

[suite.a2a]
standard = "Agent2Agent (A2A) protocol"
plan     = "official a2aproject/a2a-tck + in-house battery + a2a-go reference peer"
tier     = "conformant"
cost     = "free"
verdict  = "conformance-verdict-a2a"
public   = true
# Already wired: a2a-conformance.yml -> "A2A conformance verdict" (required
# GitHub check today). Turnstile CommandCheck id: conformance:a2a.

