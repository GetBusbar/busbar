# THE CONFORMANCE SUITE REGISTRY: the one hand-authored input, and it holds NO status.
#
# This file lists WHICH suites exist and their claim TYPE (`tier`), the ceiling a suite may ever
# claim. Fields: `id`, `standard`, `plan`, `tier`, `label`, `verdict`, `public`, `plane`. It does NOT
# record whether a suite ran or passed. Status is DERIVED: each repo's ModernCI `conformance` check
# (testing/conformance/run.sh, from the busbar-release template) writes one verdict per suite it
# judged, stamped with its repo, commit and core pin; `scripts/conformance/import.sh` brings them into
# conformance/verdicts/<id>.json, and `python3 scripts/conformance/sync.py --write` renders
# conformance/manifest.json from this file and those verdicts. A registered suite with no verdict is
# not-run and renders nothing.
#
# `tier` is the CEILING (the owner's conformance-matrix ruling):
#   certified        a third-party body ISSUED a cert (requires cert fields in the verdict)
#   conformant       passes an official/authoritative suite
#   spec-conformant  validated against a published spec; no vendor cert program exists
#   capable          implements the mechanism; not externally validated
#   evidence-only    busbar supplies audit EVIDENCE; never busbar's own cert
#
# `plane` names the shipped plane a suite judges; a suite that judges no plane (a transport, the auth
# server, the supply chain) carries none. A green suite renders only AT OR BELOW its ceiling.

[[suite]]
id = "a2a"
standard = "Agent2Agent (A2A) Protocol"
plan = "official a2aproject/a2a-tck + a2a-harness + a2a-go reference peer"
tier = "conformant"
label = "A2A"
verdict = "conformance-verdict-a2a"
plane = "a2a"
public = "true"

