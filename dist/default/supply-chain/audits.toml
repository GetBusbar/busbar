
# cargo-vet audits file

[[audits.aws-lc-rs]]
criteria = "safe-to-deploy"
version = "1.19.0"
notes = "Agent full source review of the published crate (owner decisions 284/297), not human owner approval or executed tests. Archive SHA256 048006790404103c488e6c5616b3e7e702a71292aadda08e8f7698a9e0d2eb53 matches the crates.io index checksum and the Cargo.lock pin (=1.19.0, default-features off, feature aws-lc-sys). No imported chain anchors this crate: SpiderOak/Aranya has only the delta 1.13.0 -> 1.16.2 with no full base audit, and no other import audits aws-lc-rs, so all 112 package files were covered here. All 32947 src lines (97 files) were read in seven slices of about 5k lines each by independent opus reviewers, line by line, and the notes written from their reports; test-only modules were skimmed. build.rs (126 lines) was read in full: it asserts fips/non-fips exclusivity, reads only AWS_LC_RS_* test toggles, CARGO_CFG_* and the DEP_AWS_LC_* metadata of the selected sys crate and re-exports it as cargo metadata; no filesystem, network or process use. The crate ships no bindgen output (bindings live in aws-lc-sys) and no prebuilt objects; scripts/, util/ and the Makefile are maintainer CI helpers that cargo never runs. About 383 unsafe occurrences, all FFI into aws-lc-sys or Send/Sync impls: pointer/length pairs always come from the same Rust slice, output buffers are size-checked before C writes (AEAD, streaming cipher update/final, CMAC, HMAC, key wrap, RSA/OAEP), every C return code is checked before outputs are used, MaybeUninit out-params are assume_init only after success, C objects are owned by null-checked LcPtr wrappers that free exactly once and detach only after a successful ownership transfer, and Send/Sync impls match AWS-LC's thread-safety contract (mutable contexts are reachable only through &mut). MAC/tag checks use CRYPTO_memcmp; secrets are zeroized on drop; randomness comes only from RAND_bytes with errors propagated; DER parsing goes through bounds-checked untrusted::Reader. No ambient fs/net/process/env capability, no asm, no obfuscated code. Minor, non-serious findings: some stack key copies/key schedules are not zeroized; PKCS7 unpad check is not constant-time (unauthenticated CBC); PKCS#1 v1.5 decrypt reports padding errors (inherent to the scheme); RSA from_der accepts trailing bytes; test::rand fixed-output RNGs are public but doc-hidden (inherited from ring); a few caller-misuse panics on wrong buffer sizes. The vendored C library is NOT part of this crate: it comes from aws-lc-sys, which is audited separately (see that record). FIPS: Busbar builds aws-lc-rs without the fips feature, so aws-lc-fips-sys is not in the graph and no NIST CMVP FIPS 140-3 validation applies to this build; the validated AWS-LC modules are AWS-LC FIPS 1.0.2/1.1.0 (cert #4631), FIPS 2.0.0 (#4816 static, #5429 dynamic, replacing historical #4759), FIPS 1.29.1 (#5146 dynamic) and FIPS 3.1.0 (#5298 dynamic, #5314 static), each only in its approved mode and tested environments."
