[package]
# THE DEFAULT DISTRIBUTION: core (the `busbar` composition root in crates/busbar, compiled from its
# own source) plus the standard plugins compiled in. The only manifest that names a plugin; core's
# own manifest names none, and core alone loads whatever is dropped into `plugins/`.
name = "busbar-default"
version = "1.6.0"
publish = false
build = "../../crates/busbar/build.rs"
edition = "2021"
# `rust-version` rationale: see busbar-kernel/Cargo.toml — one pinned number, set to what CI verifies.
rust-version = "1.97"
description = "Native-protocol LLM gateway: lossless cross-protocol translation, weighted pools, per-(pool,lane) circuit breaking, and governance — in one self-contained Rust binary."
license = "Apache-2.0"

# THE THIN BINARY. Step 3.7 of 1.6.0: everything an operator's request touches lives in
# `busbar-core`; this package is argument parsing, config LOCATION, process lifecycle (bind /
# serve / shutdown / the jemalloc purge fallback), and — from step 4 — protocol registration.
# The composition root is allowed to know the protocol set; nothing else is.
[[bin]]
name = "busbar"
path = "../../crates/busbar/src/main.rs"

[dependencies]
# The engine (busbar-core absorbed INTO busbar-kernel, W4.a #19/#37) is the merged `busbar-kernel`
# dep declared below with the loop crate; `default-features = false` there so the binary's OWN
# feature list stays the single decision point (each busbar feature forwards to the kernel feature
# of the same name below).
# THE OAUTH 2.1 AUTHORIZATION-SERVER PLANE (`oauth_as:`), a NORMAL (non-optional) dependency — it
# carries no feature flag, unlike the protocol crates below, because `oauth-as` (the underlying
# crate) was always a normal dependency of the engine and 1.6.0's extraction did not change that:
# the plane costs nothing until `oauth_as:` is configured. The composition root (`main`) calls
# `busbar_core_oauth2::install()` once, registering this crate's seam implementation into
# `busbar_core::oauth_as::seam` — core cannot name this crate directly (one-way dependency; core
# depends on nothing here), so the registration is the one place the binary's own manifest and
# `main.rs` have to know this plane exists.
busbar-core-oauth2 = { path = "../../crates/busbar-core-oauth2" }
# The admin API service (`/api/v1/admin/*`), a MANDATORY sibling crate (not a plugin). Always linked;
# `main` registers its mount seam unconditionally. Feature-neutral defaults off — the binary's own
# feature forwards below turn on `busbar-admin`'s features in lock-step with busbar-core's.
busbar-core-admin = { path = "../../crates/busbar-core-admin", default-features = false }
# The core-side connection-security seam (DECISIONS #40): builds the opaque `ConnectionSecurity`
# wrap (identity for a plaintext binding, TLS for a TLS one) the composition root hands
# to `busbar::root::listener`. A mandatory sibling, like `busbar-admin`/`busbar-core-oauth2` above —
# never a plugin, always linked.
busbar-core-connector = { path = "../../crates/busbar-core-connector" }
# `amend_rate_history` decodes the correction body and digests the operator's free-text reason
# into the fixed-width `reason_hash` the dated rate-card history seals (the same SHA-256 the substrate
# signs with). These are the composition root's, used only by the admin verb's effect half.
serde_json = { workspace = true }
hex = { workspace = true }
# The canary harness (`tests/canary/`) dlopens a dropped-in plugin's cdylib itself to wrap its door
# in the recording shim; already the loader's dependency.
libloading = { workspace = true }
# The deployment keyset (spec #82(a); BUSBAR-1.6.0.md THE DESIGN, §2, PB-13): `root::keyset` mints the one
# ed25519 seed that signs the audit chain and the ledger's checkpoints from the OS CSPRNG.
getrandom = { workspace = true }
# THE LLM PLANE, through its memory-ABI door: the edge `plane-llm` carries through its door row
# (`plane-llm-door`, see that feature). Every llm arrival is served through the plane driver.
busbar-plane-llm = { workspace = true, optional = true }
# THE MCP PLANE, through its memory-ABI door: the edge `plane-mcp` carries through its door row
# (`plane-mcp-door`, see that feature).
busbar-plane-mcp = { workspace = true, optional = true }
# THE A2A PLANE, through its memory-ABI door: the edge `plane-a2a` carries through its door row
# (`plane-a2a-door`, see that feature).
busbar-plane-a2a = { workspace = true, optional = true }
# Boot-time plugin listing (`--plugins`) reads the registry the loader builds.
busbar-plugin-loader = { path = "../../crates/plugin-loader" }

# ── THE COMPOSITION ROOT'S OWN EDGES (src/root/) ────────────────────────────────────────────────
# The binary is the one place entitled to name the kernel, the units, the planes and the transports
# together: that is what a composition root IS. Everything below is reached only from `src/root/`,
# and nothing below reaches back — the three axes stay blind to each other and only this crate
# composes them. These edges exist so `ProductionUnits` (the one implementor of the kernel's `Units`
# trait), the registry seal, the vocabulary interner, the durability branch and the listener
# provisioning have somewhere to live that is not a unit and not a plane.
busbar-kernel = { path = "../../crates/busbar-kernel", default-features = false }
busbar-contract = { path = "../../crates/busbar-contract" }
# The seven kernel workflow crates (#36).
busbar-kernel-identity = { path = "../../crates/busbar-kernel-identity" }
busbar-kernel-ledger = { path = "../../crates/busbar-kernel-ledger" }
busbar-kernel-egress = { path = "../../crates/busbar-kernel-egress" }
busbar-kernel-breaker = { path = "../../crates/busbar-kernel-breaker" }
busbar-kernel-wal = { path = "../../crates/busbar-kernel-wal" }
busbar-kernel-audit = { path = "../../crates/busbar-kernel-audit" }
# The pure planes reach the boot seal through their host's linked entry (`PLANE` + `CLAIMS` on the
# `claims` axis), so the root names none of them. The streaming plane's edge is the crate the
# `plane-streaming` switch's `plane-door` row names: its memory-ABI door, served through the loader's
# one load like every dropped-in plane door (FLIP-STREAMING).
busbar-plane-streaming = { workspace = true, optional = true }
# THE DECISIONS PLANE (jev), #48's fifth: the edge the `plane-decisions` switch's `plane-door` row
# names. The plane is served through its memory-ABI door (`busbar_plane_decisions::plane_door::door`),
# loaded through the loader's one load like every dropped-in plane door (FLIP-DECISIONS), so its
# registry row is the door's own Statement folded by the kernel and the composition root writes no
# declaration of its own. Optional, so `--no-default-features` installs no plane at all, which is the
# property the strong-form deletion test is written about.
busbar-plane-decisions = { workspace = true, optional = true }
# THE DEFAULT STORE (`governance.store: memory`), linked in every build through the `stores` axis —
# the same row a dropped-in store takes, opened in process. The kernel names no store.
busbar-store-memory = { workspace = true }
# THE SECRET SOURCES (`{ env: VAR }`, `{ file: PATH }`), linked in every build through the
# `secret-doors` axis (THE DESIGN, "Plugins": env and file secrets are ordinary plugins, linked in
# the default build; ARCHITECT 2026-10-02 WIRE-SECRET) and loaded through the one loader only when a
# reference names one.
# They live in their own repos (GetBusbar/busbar-secret-env, GetBusbar/busbar-secret-file) and are
# pulled at a PINNED rev; the workspace `[patch]` points the busbar crate they name at this tree.
# The kernel names neither.
busbar-secret-env = { workspace = true }
busbar-secret-file = { workspace = true }
# THE RANKING HOOKS (`cheapest`/`fastest`/`least_busy`/`usage`), linked through the `hooks` axis
# under `hooks-ranking` — one row, the strategy spellings its aliases. The kernel names no hook.
busbar-hook-ranking = { workspace = true, optional = true }
# THE OPERATOR CREDENTIAL (`auth.admin_auth: [admin-tokens]`, the single operator admin token), a
# first-party AUTH plugin linked through the `auths` axis under `auth-admin-tokens` — the same row a
# signed tarball of it registers when dropped in (DECISIONS #2 rule (1); ARCHITECT 2026-09-27
# AUTH-ROW). It lives in its own repo (GetBusbar/busbar-auth-admin-tokens) and is pulled at a PINNED rev; the
# workspace `[patch]` points the busbar crates it names at this tree. The kernel names no auth module.
busbar-auth-admin-tokens-plugin = { workspace = true, optional = true }
# THE OUTBOUND HEADER STYLES (bearer, api-key, x-goog-api-key): the auth plugin a plane's outbound need
# is bound under when its member's style is one of them (THE DESIGN §6 step 3: the auth plugin that
# serves the style opens the binding), linked through the `auths` axis under `auth-header`
# (ARCHITECT Q-L1-AUTH (A), 2026-10-03). It lives in its own repo (GetBusbar/busbar-auth-header), pulled
# at a pinned rev; its only busbar edge is `busbar-contract`.
busbar-auth-header = { workspace = true, optional = true }
# THE SIGV4 STYLE (outbound signing, inbound verify of busbar's own SigV4 keys) and THE OAUTH MINTING
# STYLES (jwt-bearer, oauth-client-credentials): the auth plugins a provider's credential is bound
# under when its style is one of theirs, linked through the `auths` axis (P2 D1, the auth split: the
# kernel holds no auth style). Each lives in its own repo, pulled at a pinned rev.
busbar-auth-sigv4 = { workspace = true, optional = true }
busbar-auth-oauth = { workspace = true, optional = true }
# THE WEBHOOK-SIGNATURE STYLE: the inbound auth plugin that verifies a webhook sender's HMAC (Twilio,
# Standard Webhooks), linked through the `auths` axis under its own feature (default-on).
busbar-auth-webhook-signature = { workspace = true, optional = true }
# THE REQUEST-LOG FILE SINK (`module: request-log-file`), a first-party EXPORT plugin linked through
# the `exports` axis (K9b) — the same row a signed tarball of it registers when dropped in. It lives
# in its own repo (GetBusbar/busbar-export-file) and is pulled at a PINNED rev; the workspace `[patch]`
# points the busbar crates it names back at this tree.
busbar-export-file = { workspace = true, optional = true }
# THE REQUEST-LOG WEBHOOK SINK (`module: request-log-webhook`), a first-party EXPORT plugin linked
# through the `exports` axis (K9c) — the same row a signed tarball of it registers when dropped in. It
# lives in its own repo (GetBusbar/busbar-export-webhook) and is pulled at a PINNED rev; the workspace
# `[patch]` points the busbar crates it names back at this tree.
busbar-export-webhook = { workspace = true, optional = true }
# THE PROMETHEUS EXPORT SINK (`module: prometheus`), a first-party EXPORT plugin linked through the
# `exports` axis (K9d) — the same row a signed tarball of it registers when dropped in. The host
# keeps the recorder and serves `/metrics`; this sink renders the recorder's snapshot. It lives in its
# own repo (GetBusbar/busbar-export-prometheus) and is pulled at a PINNED rev; the workspace `[patch]` points
# the busbar crates it names back at this tree.
busbar-export-prometheus = { workspace = true, optional = true }
# THE OTLP TRACE SINK (`module: otlp`), a first-party EXPORT plugin linked through the `export-doors` axis
# (K9e-2; owner answer Q75: OTLP export never delivered in 1.5.5, and 1.6.0 fixes it) — the same row a
# signed tarball of it registers when dropped in. It encodes each `traces` record as an OTLP/HTTP
# protobuf request the host posts under the collector egress policy it declares. It lives in its own
# repo (GetBusbar/busbar-export-otlp) and is pulled at a PINNED rev; the workspace `[patch]` points the busbar
# crate it names back at this tree.
busbar-export-otlp = { workspace = true, optional = true }
# The transports. Composition is an edge that does not exist as a Cargo dependency — a transport may
# not name the layer beneath it — so the root hands each wire's build the layer it built below it.
# Which wires a build links is the `transport` rows of the linked table below; the source names none.
busbar-transport-tcp = { workspace = true }
busbar-transport-http = { workspace = true }
# gRPC: its own framer door over the carrier (OWNER 2026-09-29, "1 new transport"), linked on the
# transport-door axis. Its row reads its crate root's `door` and everything else off its Statement.
busbar-transport-grpc = { workspace = true }
# WebSocket, and the ONE transport that is optional: it is the voice plane's edge and nothing else
# reaches it, so a build without voice must not carry it. Non-optional, `--no-default-features` still
# pulled `tokio-tungstenite` through this line and voice stopped being strong-form deletable — the
# exact leak `cargo xtask gate duplex-ws-default-edge` exists to catch. `plane-streaming` carries the edge.
busbar-transport-ws = { workspace = true, optional = true }
busbar-transport-stdio = { workspace = true }
# WebRTC: the datagram framer door (ICE, SRTP, SCTP) over the connector's datagram port and secure
# layer. Optional and off by default: its linked row is the wire's one registration, and a build
# that does not turn `transport-webrtc` on carries neither the crate nor its media stack.
busbar-transport-webrtc = { workspace = true, optional = true }
# The root's card is SWAPPED by a live config apply and PINNED by every unit that prices against it,
# which is one atomic store against many lock-free readers — the same shape, and the same crate, the
# engine already swaps its config snapshot with.
arc-swap = { workspace = true }
# Behind `root-admin` only. The root-driven admin surface wraps the router the operations are already
# mounted on and calls it as the tower service it is, so the inner surface answers exactly as it did
# and no status, header or byte is re-derived on the way out.
tower = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { workspace = true }
# The body trait itself, named because the composition root implements it: the llm plane's answer goes
# out wrapped so the spend its body reports on the way past has somewhere to land. A passthrough, and
# the same version axum is built on — this is the trait axum's own `Body` implements, not a second one.
http-body = { workspace = true }
# The inbound listener's serve loop (`root::listener`, moved out of the kernel): the connector
# accepts and hands each stream up, and the root serves it over hyper-util's auto builder, its body
# bounds reading frames through `bytes::Buf`, and the futures-io/tokio-io compat seam the
# `ConnectionSecurity::wrap` result crosses (DECISIONS #40).
hyper = { workspace = true }
hyper-util = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
# Selects `idna`'s unicode-rs backend for every `url` in the binary (see the workspace row).
idna_adapter = { workspace = true }
metrics = { workspace = true }
serde_yaml = { workspace = true }
# THE THREAD-PER-CORE BOOT SEAM — the one unix data-plane topology (non-unix keeps the classic
# runtime as a compile-time platform shape; no knob selects either). Binary-only deps — nothing on
# the request path names them. `core_affinity` advisorily pins the per-worker threads, `socket2`
# sets SO_REUSEPORT on each per-worker listener so the kernel fans connections across them. See
# main.rs `serve_thread_per_core`.
core_affinity = { workspace = true }
socket2 = { workspace = true }

# Global allocator: jemalloc on EVERY target EXCEPT windows-msvc — a property of the BINARY (only
# one crate in a link may declare a global allocator), which is why these stay here when everything
# else moved to busbar-core. Full rationale in main.rs at the `#[global_allocator]` site.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }

[target.'cfg(target_env = "musl")'.dependencies]
tikv-jemallocator = { workspace = true, features = ["disable_initial_exec_tls"] }

[features]
# Pure forwards: every `#[cfg(feature = ...)]` site lives in busbar-core, so the binary's features
# are one-line re-exports of the core feature with the same name. Every protocol entry below is the
# SAME default set the monolithic crate had; `root-admin` is the addition, and it is a path rather
# than a surface — the operations, their bytes and their features are unchanged.
default = ["auth-admin-tokens", "auth-header", "auth-sigv4", "auth-oauth", "hooks-ranking", "plane-llm", "plane-mcp", "plane-a2a", "plane-streaming", "plane-decisions", "export-file", "export-webhook", "export-prometheus", "export-otlp", "root-admin", "transport-tcp", "auth-webhook-signature"]
# THE LLM PLANE, ONE switch (spec #17: one feature per plane). Default-on: the shipped binary speaks
# LLM. Dropping the feature is the deletion test's level-1 build. There is no per-DIALECT feature and
# there must not be one — "LLM coverage or not" is the choice this seam offers, and a `proto-gemini`
# knob would be a second, finer answer to a question the owner ruling already settled. The plane is
# served through its memory-ABI door (`plane-llm-door`): the door's claims are mounted as the data
# routes, so every llm arrival is served through the plane driver (BUSBAR-1.6.0.md Part 3 section 12;
# the fold's development-only switch is deleted, status row 155). The legacy engine crate is
# deleted (status row 83): the plane registers through its door alone. The sigv4 and oauth rows
# sign the plane's members.
plane-llm = ["plane-llm-door", "auth-sigv4", "auth-oauth"]
# THE MCP PLANE, ONE switch (spec #17: one feature per plane). Default-on: the shipped binary speaks
# MCP. The plane is served through its memory-ABI door alone (`plane-mcp-door`): every word the root
# reads about it is the door's own (its Statement, its tail's `cli_help`, its `declares.json`).
plane-mcp = ["plane-mcp-door", "busbar-kernel/plane-mcp"]
# THE A2A PLANE, ONE switch (spec #17: one feature per plane). Default-on: the shipped binary speaks
# A2A. The plane is served through its memory-ABI door alone (`plane-a2a-door`): every word the root
# reads about it is the door's own (its Statement, its `declares.json`). `--no-default-features`
# compiles it out while core still routes the other planes (the plane-split deletion test).
plane-a2a = ["plane-a2a-door", "busbar-kernel/plane-a2a"]
# THE STREAMING PLANE, through its memory-ABI door (FLIP-STREAMING; BUSBAR-1.6.0.md Part 3 section 12,
# "The switch": the fold's development-only switch is deleted when the fold completes, and the
# plane's one switch carries its door). IN `default`; `--no-default-features` compiles it out. On, the
# plane's door (`busbar_plane_streaming::door::door`) is a `plane-door` row: the root hands it to the
# loader beside every dropped-in plane door and binds it through the one load on the one dispatcher,
# so the compiled-in plane is called through the same table as its dropped-in cdylib (#2, #30; THE
# DESIGN section 11.4), and the serve row hands it its arrivals. It carries the ws wire its live
# sessions arrive over and leave on.
plane-streaming = ["dep:busbar-plane-streaming", "transport-ws", "busbar-kernel/duplex-ws"]
# THE WS WIRE, the one optional transport: the streaming plane's edge and nothing else's, so `plane-streaming`
# carries it and `--no-default-features` drops the crate edge and its linked row together.
transport-ws = ["dep:busbar-transport-ws"]
# THE WEBRTC WIRE, optional and never in `default`: on, the crate edge and its linked row together.
transport-webrtc = ["dep:busbar-transport-webrtc"]
# THE TCP WIRE'S LINKED ROW, DEFAULT ON (#3: a transport is swappable, compiled in OR dropped in). Off,
# the build links no `tcp` row and the wire is served only when its tarball is dropped into
# `plugins/`: the boot seal folds it in the same pass as the linked rows, and the data door accepts
# through it (`root::registry::BootRegistry::dropped_door`). The crate edge stays — the row is what
# the switch gates, as `export-file`'s is.
transport-tcp = []
# THE DECISIONS PLANE, through its memory-ABI door (FLIP-DECISIONS; BUSBAR-1.6.0.md Part 3 section 12,
# "The switch": the fold's development-only switch is deleted when the fold completes, and the plane's
# one switch carries its door; #17: one feature per plane). IN `default`; `--no-default-features`
# compiles it out. On, the plane's door (`busbar_plane_decisions::plane_door::door`) is a `plane-door`
# row: the root hands it to the loader beside every dropped-in plane door and binds it through the one
# load on the one dispatcher, so the compiled-in plane is called through the same table as its
# dropped-in cdylib (`busbar-plane-decisions-plugin`; #2, #30; THE DESIGN section 11.4), its Statement folds into the
# plane's registry row (the `decisions:` section judged by the door's own `validate`), and the serve
# path hands it its arrivals through the plane driver.
plane-decisions = ["dep:busbar-plane-decisions"]
# THE LLM PLANE'S DOOR ROW, carried by `plane-llm` and never set on its own. The plane's memory-ABI
# door (`busbar_plane_llm::plane_door::door`) is a `plane-door` row, bound through the loader's one
# load beside every dropped-in plane door, the same table as its dropped-in cdylib (#2, #30; THE
# DESIGN section 11.4).
plane-llm-door = ["dep:busbar-plane-llm"]
# THE MCP PLANE'S DOOR ROW, carried by `plane-mcp` and never set on its own (the mcp fold's switch
# is gone: the plane is flipped onto the driver, BUSBAR-1.6.0.md Part 3 section 12). The plane's
# memory-ABI door (`busbar_plane_mcp::plane_door::door`) is a `plane-door` row, bound through the
# loader's one load beside every dropped-in plane door, the same table as its dropped-in cdylib
# (`busbar-plane-mcp-plugin`; #2, #30; THE DESIGN section 11.4). It is complete on its own: no linked row of the
# plane's key stands beside it.
plane-mcp-door = ["dep:busbar-plane-mcp"]
# THE A2A PLANE'S DOOR ROW, carried by `plane-a2a` and never set on its own (the a2a fold's switch
# is gone: the plane is flipped onto the driver, BUSBAR-1.6.0.md Part 3 section 12). The plane's
# memory-ABI door (`busbar_plane_a2a::agent_door::door`) is a `plane-door` row, bound through the
# loader's one load beside every dropped-in plane door, the same table as its dropped-in cdylib
# (`busbar-plane-a2a-plugin`; #2, #30; THE DESIGN section 11.4). It is complete on its own: no linked row of the
# plane's key stands beside it.
plane-a2a-door = ["dep:busbar-plane-a2a"]
# THE REQUEST-LOG FILE SINK, DEFAULT ON: the `busbar-export-file` crate on the export axis. Off, the
# module resolves only when a signed tarball of the sink is dropped into `plugins/`.
export-file = ["dep:busbar-export-file"]
# THE REQUEST-LOG WEBHOOK SINK, DEFAULT ON: the `busbar-export-webhook` crate on the export axis.
# Off, the module resolves only when a signed tarball of the sink is dropped into `plugins/`.
export-webhook = ["dep:busbar-export-webhook"]
# THE PROMETHEUS EXPORT SINK, DEFAULT ON: the `busbar-export-prometheus` crate on the export axis —
# the exposition 1.5.5 shipped built in. Off, the module resolves only when a signed tarball of the
# sink is dropped into `plugins/`.
export-prometheus = ["dep:busbar-export-prometheus"]
# THE OTLP TRACE SINK, DEFAULT ON (K9e-2; the `module: otlp` 1.5.5 shipped): the `busbar-export-otlp`
# crate on the export axis. Off, the module resolves only when a signed tarball of the sink is dropped
# into `plugins/`.
export-otlp = ["dep:busbar-export-otlp"]
# THE ROOT-DRIVEN ADMIN SURFACE (composition-root step C1 / switch-over S1). DEFAULT ON. The switch is
# what makes an admin request travel through the kernel's loop instead of reaching its handler
# directly. The byte-neutrality this default was turned on for is NOT established: the 2x2 over
# `root-admin` x `root-llm` found it moves the two `ledger|amend` cells 404 -> 403 (TODO l.2147-2163,
# item 155), and nothing repeats the comparison: a comment here that claims otherwise names the
# registered gate that reproduces it (TODO l.2165). The leg stays switchable — turning it off drops
# one unbuilt module and nothing else, because `main.rs` names the mount inside a `cfg` and the
# router it wraps is untouched.
#
# `tower` is the feature's own edge: wrapping a mounted router means calling it as the service it
# already is, which is the one thing that guarantees the inner surface answers exactly as it did.
root-admin = ["dep:tower"]
# THE INTEGRATION-TEST HARNESS SEAM (`src/root/harness.rs`), off by default and never in `default`.
# An integration test under `tests/` links the library as an ordinary DEPENDENCY, where `cfg(test)`
# is false — so the legs' own `#[cfg(test)] mod tests` fixtures do not exist in the artifact it
# links, and no visibility change can reach them. This feature is how a cross-leg test gets an
# in-crate module compiled INTO that artifact instead. It adds no code to the shipped binary: the
# module is `#[cfg(any(test, feature = "test-harness"))]` and this feature is never enabled by a
# release build, which is why the surface ceilings do not count it.
test-harness = []
# THE OPERATOR CREDENTIAL'S LINKED ROW, DEFAULT ON: the auth plugin on the `auths` axis. Off, the
# operator credential resolves only when a signed tarball of the module is dropped into `plugins/`,
# and a configured admin token with no row answering it is a boot refusal naming this feature.
auth-admin-tokens = ["dep:busbar-auth-admin-tokens-plugin"]
# THE OUTBOUND HEADER STYLES' LINKED ROW, DEFAULT ON (ARCHITECT Q-L1-AUTH (A), 2026-10-03): the auth
# plugin serving a plane need's header style, on the `auths` axis. Off, a member whose style it serves
# binds only when a signed tarball of the module is dropped into `plugins/`.
auth-header = ["dep:busbar-auth-header"]
# THE SIGV4 AND OAUTH STYLES' LINKED ROWS, DEFAULT ON (P2 D1): off, a provider whose style one of them
# serves binds only when a signed tarball of the module is dropped into `plugins/`.
auth-sigv4 = ["dep:busbar-auth-sigv4"]
auth-oauth = ["dep:busbar-auth-oauth"]
# THE WEBHOOK-SIGNATURE ROW, default-on (ARCHITECT 2026-10-14): Twilio Media Streams, Standard Webhooks
# and the OpenAI Responses webhook are verified by it (BUSBAR-1.6.0.md l.847-852, l.4835). It declares an
# inbound capability, so `GET /api/v1/admin/info` `build.auth_modules` lists it after 1.5.5's
# `["keys","admin-tokens"]` (accepted difference `#64-class build.auth_modules lists the webhook-signature module`).
auth-webhook-signature = ["dep:busbar-auth-webhook-signature"]
hooks-ranking = ["dep:busbar-hook-ranking"]
openapi-schema = ["busbar-kernel/openapi-schema", "busbar-core-admin/openapi-schema"]
loom-model = ["busbar-kernel/loom-model"]

# Core's source, which this distribution compiles: build.rs, src/main.rs and the root modules.
[package.metadata.busbar.core]
dir = "../../crates/busbar"

# ── THE LINKED PLUGINS (K1, #2 rule (1)) ─────────────────────────────────────────────────────────────
# The composition root's source names no plugin: WHICH plugins a build links is this data. build.rs
# (src/linked_gen.rs) reads the three tables below and writes `$OUT_DIR/linked.rs`, which main.rs
# includes: `extern crate <crate> as _;` for every row whose cargo feature is ENABLED, `LINKED` — one
# table per registration axis over each linked crate's `linked` entry module (the contract
# PLANE_DECLARATION joined kernel-side to its kernel-typed PLANE_HOOKS, protocol declarations,
# arrivals, diagnostics, installers …) — a `linked_*` cfg per root-bound seam an enabled entry drives,
# and the `ROOT_UNITS` table of each enabled root module's `ROOT_UNIT`. `src/root/linked.rs` folds
# them into the kernel's registration seams, axis by axis, in table order — the same path an entry
# adapted from a plugin dropped into `plugins/` feeds.
#
# THE ORDER IS THE REGISTRATION ORDER on every axis (protocols, planes, diagnostics, WS arrivals, the
# root-bound seams): appending a row keeps every existing protocol's index; inserting one renumbers
# them. `crates/busbar/tests/composition_root_names_no_linked_plugin.rs` refuses a `main.rs` that
# names any crate or root module listed here.
[package.metadata.busbar.linked]
export-file = "busbar-export-file"
export-webhook = "busbar-export-webhook"
export-prometheus = "busbar-export-prometheus"
export-otlp = "busbar-export-otlp"
# THE AUTH AXIS: the operator credential's module, under its packaging feature.
auth-admin-tokens = "busbar-auth-admin-tokens-plugin"
auth-header = "busbar-auth-header"
auth-sigv4 = "busbar-auth-sigv4"
auth-oauth = "busbar-auth-oauth"
auth-webhook-signature = "busbar-auth-webhook-signature"
# THE COLD-KIND AXIS's in-process rows: the default store (a required dependency: every build links
# it) and the ranking hooks (under their feature).
store-memory = "busbar-store-memory"
hooks-ranking = "busbar-hook-ranking"
# THE SECRET AXIS: the env and file sources, required dependencies (every build links them; the key
# names the row). Each is loaded only when a reference names it.
secret-env = "busbar-secret-env"
secret-file = "busbar-secret-file"
# THE TRANSPORT AXIS (#3, #30): the wires this build links, one row each, folded bottom-up by the boot
# seal. A row whose crate is a required dependency is linked in every build (its key names the row);
# `ws` rides its optional edge. ONE ENTRY PER PLUGIN: a row is one crate's one entry, and the seal
# registers every scheme its door's Statement claims (`sse` is the http entry's).
transport-tcp = "busbar-transport-tcp"
transport-http = "busbar-transport-http"
transport-ws = "busbar-transport-ws"
transport-grpc = "busbar-transport-grpc"
transport-stdio = "busbar-transport-stdio"
transport-webrtc = "busbar-transport-webrtc"
# THE PLANE DOOR AXIS (#2, THE DESIGN section 11.4): a plane's memory-ABI `door`, bound through the
# loader's one load beside the dropped-in plane doors.
plane-decisions = "busbar-plane-decisions"
plane-llm-door = "busbar-plane-llm"
plane-mcp-door = "busbar-plane-mcp"
plane-streaming = "busbar-plane-streaming"
plane-a2a-door = "busbar-plane-a2a"

# What each linked feature's crate registers (keyed by the feature, as the linked row is), axis by axis: `plane` (PLANE_DECLARATION + PLANE_HOOKS, joined
# kernel-side), `protocols`, `body-ingress`, `protocol-seams`, `diagnostics`,
# `on-host`, `compose`, `exports` — each an item of the crate's entry
# module — and the root-bound seam it drives: `egress`.
# `claims`: the pure plane the boot seal registers (`PLANE`) and the claims it declares (`CLAIMS`).
# `node`: the entry's `install_node`, handed the node a root unit drives the entry's units through.
# `transport`: a wire's memory-ABI `door`, and nothing else: its key (its own claim, which is its
# Statement's name), the layers it composes over and whether it carries a session are read off the
# door's Statement (`root::linked::linked_transport!`; BUSBAR-1.6.0.md l.3560-3561).
# `stores` / `hooks`: an in-process store's `STORE` and a ranking row's `HOOK` (`root::linked`).
# `auths`: a `kind: auth` plugin's memory-ABI door (`<entry>::door::door`, the one its dropped-in
# build exports), under its `linked-name` key.
# `plane-door`: a plane's memory-ABI `door`, bound through the loader's one load (`root::linked`).
# `secret-doors`: a `kind: secret` plugin's memory-ABI `door`.
# `export-doors`: a memory-ABI `kind: export` sink's `NAME`, `ALIAS`, `DECLARES` and `door`.
[package.metadata.busbar.linked-axes]
export-file = "export-doors"
export-webhook = "export-doors"
export-prometheus = "export-doors"
export-otlp = "export-doors"
auth-admin-tokens = "auths"
auth-header = "auths"
auth-sigv4 = "auths"
auth-oauth = "auths"
auth-webhook-signature = "auths"
store-memory = "stores"
hooks-ranking = "hooks"
secret-env = "secret-doors"
secret-file = "secret-doors"
transport-tcp = "transport transport-door"
# `connector-door`: the framer's door is opened on the root's one Connector, so an outbound need on
# its schemes is served compiled-in (the streaming door's ws needs bind on the ws row). Every
# transport row is a door row (`transport-door`): the seal folds it from its door's Statement, and no
# transport names another (the carrier is the connector's choice from the target's scheme).
transport-http = "transport transport-door connector-door"
transport-ws = "transport transport-door connector-door"
transport-grpc = "transport transport-door"
transport-stdio = "transport transport-door"
transport-webrtc = "transport transport-door"
plane-decisions = "plane-door"
# The fallback plane's door row also fills the protocol axis with the plane's own dialect
# declarations (its entry's `PROTOCOLS`, contract data; ARCHITECT 2026-10-16 ruling 3): the
# kernel's registry is seeded from the plane, and names none.
plane-llm-door = "plane-door protocols"
plane-mcp-door = "plane-door"
plane-streaming = "plane-door"
plane-a2a-door = "plane-door"

# A linked crate whose entry module is not `<crate>::linked`.
[package.metadata.busbar.linked-entry]
# A secret plugin's door is its `door` module's.
busbar-secret-env = "busbar_secret_env::door"
busbar-secret-file = "busbar_secret_file::door"
# An auth plugin's entry is its crate root; its memory-ABI door is `<entry>::door::door`.
busbar-auth-admin-tokens-plugin = "busbar_auth_admin_tokens_plugin"
busbar-auth-header = "busbar_auth_header::compiled_in"
busbar-auth-sigv4 = "busbar_auth_sigv4::compiled_in"
busbar-auth-oauth = "busbar_auth_oauth::compiled_in"
busbar-auth-webhook-signature = "busbar_auth_webhook_signature::compiled_in"
# A plane door row's entry is the module that exports its `door`.
plane-decisions = "busbar_plane_decisions::plane_door"
plane-llm-door = "busbar_plane_llm::plane_door"
plane-mcp-door = "busbar_plane_mcp::plane_door"
plane-a2a-door = "busbar_plane_a2a::agent_door"
# A memory-ABI export sink's door is its logic crate's `door` module's (`plugin_door!`).
busbar-export-prometheus = "busbar_export_prometheus::door"
busbar-export-otlp = "busbar_export_otlp::door"
# The file and webhook sinks' doors are at their logic crates' roots (`pub use table::door`).
busbar-export-file = "busbar_export_file"
busbar-export-webhook = "busbar_export_webhook"
# A transport whose door is its crate root's one public item: the row reads `door` and everything
# else off its Statement (`linked_transport!`).
busbar-transport-grpc = "busbar_transport_grpc"
plane-streaming = "busbar_plane_streaming::door"

# Each linked plane door's declared metadata (its manifest `declares` section, as JSON): the item that
# holds it. A door row with no row here declares nothing.
[package.metadata.busbar.linked-declares]
plane-llm-door = "busbar_plane_llm::DECLARES"
plane-mcp-door = "busbar_plane_mcp::DECLARES"
plane-a2a-door = "busbar_plane_a2a::DECLARES"
# The file source reads the disk (`"disk": true`): the host resolves it only at config time, on its
# disk lane, never from a request path (BUSBAR-1.6.0.md l.1464-1469, R4).
secret-file = "busbar_secret_file::DECLARES"

# Each linked plane door's DECLARING section (the one its Statement flags `SECTION_DECLARING`): the
# build sets `linked_section_<section>` when the row's feature is on, so a test that needs "the plane
# that declares this section is linked" gates on the section rather than on a feature that spells one
# plugin. Held to each door's own Statement by `root::linked`'s tests.
[package.metadata.busbar.linked-section]
plane-llm-door = "pools"
plane-mcp-door = "tools"
plane-a2a-door = "agents"
plane-decisions = "decisions"
plane-streaming = "streams"

# The key an `auths` row answers on the auth axis — the name its signed tarball's manifest states.
# A `hooks` row's is the name the admin surface prints for it (`build.hook_plugins`, the hooks
# catalogue): plugins.yaml's alias, the name 1.5.5 printed. The admin crate names no hook.
[package.metadata.busbar.linked-name]
auth-admin-tokens = "admin-tokens"
auth-header = "busbar-auth-header"
auth-sigv4 = "busbar-auth-sigv4"
auth-oauth = "busbar-auth-oauth"
hooks-ranking = "ranking"
auth-webhook-signature = "busbar-auth-webhook-signature"

# The CANONICAL name of an `auths` row whose key is not its manifest name: the name its signed
# tarball's manifest states (plugins.yaml `manifest_name`, the repo). Config may name the row by
# either; the key stays what every surface prints (ARCHITECT C').
[package.metadata.busbar.linked-canonical]
auth-admin-tokens = "busbar-auth-admin-tokens"

# THE OPERATOR CREDENTIAL'S ROW: the `auths` row whose registry key (its `linked-name`) is the
# operator credential's provider word — the `auth.admin_auth:` default, the one `module:` whose
# definition may carry `token:`, a reserved hook name, and the word in 1.5.5's refusals when the row
# is not linked. Frozen 1.5.5 configuration text, stated here in packaging so the root's source names
# no auth module (`root::auth_bindings::operator_words`; BUSBAR-1.6.0.md l.108-113).
[package.metadata.busbar.operator-auth]
row = "auth-admin-tokens"

# The root's own unit modules (the kernel-loop halves of planes that still live in the root), each
# compiled when its row's cargo feature is on (the node, keyed `node`, in every build) and exporting
# a `ROOT_UNIT` (`root::linked::RootUnit`). Order is
# the order their boot steps run in: seals, then the configuration step, then the book step.

# THE DOOR PLANES' OWN ROOT CELLS (ARCHITECT ruling on #464, applied to every door plane's root leg):
# every linked plane door's crate holds, at its `tests/root/mod.rs`, the cases that drive its door
# through this composition's door path, written in the plane's own words, and states that path under
# its `links` name `busbar-door-cells-<crate>` (its `build.rs` prints `cargo::metadata=cells=<path>`).
# Test builds only: `build.rs` reads `DEP_BUSBAR_DOOR_CELLS_<CRATE>_CELLS` for every enabled
# plane-door row and emits `$OUT_DIR/door_cells.rs` (one `#[path]` module per door, which
# `root/serve.rs` includes), so the composition root's sources name no plane and the list is the
# linked table's; a door whose crate states none fails the root's tests, naming it.

# THE DRIVER PROOFS of a plane served through its door (BUSBAR-1.6.0.md Part 3 section 12, the hook
# gate on the driver): cargo feature -> the plane crate whose `tests/on_driver/` holds the
# plane-origin hook cases (`mod.rs`) and the words the root's door cells read as data (`words.txt`).
# Test builds only: `build.rs` emits `$OUT_DIR/driver_proofs.rs` (the `#[path]` that
# `tests/hook_parity_driver` compiles beside its rig) and `$OUT_DIR/driver_words.rs`
# (`DRIVER_WORDS`), so the composition root's sources name neither the plane nor its dialects: the
# cases are written in the plane's own words and live in the plane's crate (ARCHITECT ruling, #464).
[package.metadata.busbar.driver-proofs]
plane-llm-door = "busbar-plane-llm"

[package.metadata.busbar.root-units]
# The node's own row, keyed to the node (not a feature): it compiles in every build, so its card
# repricer and book binding run in every build (ARCHITECT Q1).
node = "plane_node"

# THE TEST-LINKED PLANES of this crate's cross-plane integration tests (`tests/linked/mod.rs`). Those
# tests prove the kernel's behaviour against the planes a build links, so they live where a plane may
# be linked: here, in the composition root, never in the kernel or a cleanliness crate (core names
# zero plane types, its tests included). Which planes is DATA: `build.rs` turns this list into
# `$OUT_DIR/test_linked.rs` (a `testkit::TEST_SEAM` entry per crate; a `door:` row is a plane served
# through its memory-ABI door only, its registry row folded from its Statement as the root folds it),
# so the tests' sources name no plane. The list is the install order (the planes' layering order).
[package.metadata.busbar.test-linked]
planes = ["door:busbar-plane-llm", "door:busbar-plane-mcp", "door:busbar-plane-a2a"]
# The operator credential's auth plugin the admin tests (`tests/admin_cross_plane/`) authenticate
# through: the one the root links for it (`auth-admin-tokens`), so that test requires the feature.
operator-auth = ["busbar-auth-admin-tokens-plugin"]

[dev-dependencies]
# The tests' own ed25519 keys (credential and keyset cells). No production path verifies an
# operator signature (#77(9)), so it is a test dependency only.
ed25519-dalek = { workspace = true }
# Independent RustCrypto witness: the tests check ring-computed digests against it byte for byte.
sha2 = { workspace = true }
# `tests/plane_integration.rs` reads a plane's admission audience as a URL.
url = { workspace = true }
# The admin tests' OpenAPI drift guard writes the committed document's deterministic gz twin.
flate2 = { workspace = true }
# root_listeners_are_the_connectors.rs: the TLS data door's certificate, generated per run.
rcgen = { workspace = true, features = ["pem"] }
# root/tests/connector_h2.rs: the TLS far end the connector dials with the http door's protocol
# offer (it reads the offer off the ClientHello). Already in the lock through the connector.
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true }
# root/tests/listener_h2_tests.rs drives the TLS listener as an HTTP/2 client (OWNER RULING Q137).
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
# The hook-seat tests (`root/tests/serve_hook_seats.rs`) implement the kernel's `#[async_trait]`
# hook policy trait, so their test impls need the macro.
async-trait = { workspace = true }
# The llm plane's door, a `door:` row of `test-linked` above: linked in every build's tests,
# whatever plane features the build enables.
busbar-plane-llm = { workspace = true }
# The served planes' test kits: `testkit::SERVED` (their served-leg witnesses) is `test-support` only.
# The MCP and A2A planes' doors, `door:` rows of `test-linked` above: linked in every build's tests,
# whatever plane features the build enables (a single-plane build's tests still install the whole
# roster).
busbar-plane-mcp = { workspace = true }
busbar-plane-a2a = { workspace = true }
# `root::door_steps` tests: a member bound under an OAuth grant, its credential minted by the real
# token-style auth plugin through its own need (TODO row 22). The same pin the `auth-oauth` row links.
busbar-auth-oauth = { workspace = true }
# The bin's own unit tests (src/tests/tests.rs, the ~14 boot/CLI helpers) build App fixtures
# through the kernel's test_support, exposed to dependents only behind this feature.
busbar-kernel = { path = "../../crates/busbar-kernel", features = ["test-support"] }
# The amendment-chain verify test edits a node's held journal in memory (`tamper_for_test`), which
# the audit crate exposes to a dependent's tests only behind this feature.
busbar-kernel-audit = { path = "../../crates/busbar-kernel-audit", features = ["test-support"] }
# THE STORE ADAPTER'S MINTED-TOKEN SEAMS (`tests/store_adapter_verb_seam.rs`, ARCHITECT C4B-1): the
# loader's fake-call store harness and oracle-cache locator are `test-support` only.
busbar-plugin-loader = { path = "../../crates/plugin-loader", features = ["test-support"] }
# The local token issuer and the framed connection table the auth chain tests serve its JWKS on.
busbar-test-kit = { path = "../../crates/busbar-test-kit" }
# THE EQUIVALENCE PROOF CALLS THE ADMIN READ RATHER THAN REPRODUCING IT.
# `tests/money_one_function_equivalence.rs` runs every implementation of `money = f(ledger, card)`
# side by side, and `GET /api/v1/admin/usage` is one of them. Its three derivations are crate-private
# to busbar-core-admin, so the proof used to carry COPIES — and the copies drifted (the dated one
# grew `resolve_model_alias`; the copy did not, and nothing reddened). The admin crate's existing
# `test-support` feature exposes them through `v1::service::read_path_money`, so the proof now calls
# the shipped arithmetic. `default-features = false` mirrors the normal edge above exactly, so this
# dev edge turns on the one feature and nothing else.
busbar-core-admin = { path = "../../crates/busbar-core-admin", default-features = false, features = ["test-support"] }
# The integration suite under tests/ (black-box: boots the binary / reads generated inventories).
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true, features = ["json"] }
axum = { workspace = true, features = ["http1"] }
http-body-util = { workspace = true }
futures = { workspace = true }
# tests/mcp_stdio_serve.rs encodes the MRTR requestState fixtures it drives over the process's
# own stdin/stdout the same way the engine does; the binary crate no longer pulls base64 as a
# runtime dep after the core split, so the integration test needs its own copy.
base64 = { workspace = true }
bytes = { workspace = true }
# `src/root/tests/admin_plugin_admission.rs` types the admin contract's request and view bodies it
# drives (derive only; no wire shape is spelled as a string).
serde = { workspace = true }
serde_json = { workspace = true }
# The dropped-in export plugin's end-to-end proof (`tests/export_plugin_dropped_in_serves.rs`): the
# FILE sink's repo's cdylib crate at the SAME pinned rev as the linked `busbar-export-file` edge
# above, dropped into `plugins/` as the library a tarball of the sink carries. The sink's own
# both-doors conformance lives in its repo (GetBusbar/busbar-export-file, `tests/conformance.rs`).
# Built with its `dropped-in` feature: only then does the cdylib export `busbar_plugin_door`.
busbar-export-file-plugin = { workspace = true, features = ["dropped-in"] }
# The dropped-in transport proofs (`tests/transport_dropped_in_serves.rs`, the tcp-less boot in
# `tests/linked_export_sinks_boot_as_their_own_kind.rs`): the tcp transport repo's cdylib crate at the
# SAME pinned rev as the linked `busbar-transport-tcp` edge above, found in this target dir under
# `deps/` (hashed) by the door it loads as. The wire's own both-doors conformance lives in its repo.
busbar-transport-tcp-plugin = { workspace = true }
# The scrape role's first-party proof (`tests/export_scrape_is_first_party.rs`): the scrape sink's
# repo's cdylib crate at the SAME pinned rev as the linked `busbar-export-prometheus` edge above —
# the library a tarball of the sink carries, found in this target dir by what it loads as. The
# sink's own both-doors conformance lives in its repo (GetBusbar/busbar-export-prometheus).
busbar-export-prometheus-plugin = { workspace = true }
# The REAL token-verifying auth module the dropped-in auth proofs load (R-FIX2; the owner's FIXTURES
# ruling: real plugins are the proofs): GetBusbar/busbar-auth-oidc's cdylib crate at a pinned rev. Nothing
# links it; the dev edge is what makes this crate's test build carry its cdylib (under `deps/`,
# hashed), which the child-process session battery signs into a temp `plugins/` directory and drives
# with JWTs a local issuer signs. Its busbar-contract resolves to this tree through the `[patch]`
# table in the workspace manifest.
busbar-auth-oidc-plugin = { workspace = true }
# Its LOGIC crate at the SAME rev, for the name its door's Statement states. The local issuer those
# proofs verify against is the loader's `test_issuer` (`test-support`: an ES256 key, its JWKS served
# over a certificate-verified loopback endpoint the module trusts through `ca_cert_pem`, genuinely
# signed tokens); the composition root's connector fetches it for the module.
busbar-auth-oidc = { workspace = true }
# That proof calls the router it built as the tower service it is (`ServiceExt::oneshot`). The
# normal-edge `tower` above is `root-admin`'s own and optional, so a build without `root-admin` (every
# single-plane build) would not compile the test; the test's edge is its own, unconditional here.
tower = { workspace = true, features = ["util"] }
# The `traces` stream's both-doors proof (`tests/traces_stream_both_doors.rs`, K9a S7 + K9e-2): the
# OTLP sink's repo's cdylib crate at the SAME pinned rev as the linked `busbar-export-otlp` edge above
# — the shipped binary links the sink's door and has its dropped-in library in `plugins/`, both
# posting to a local collector. `tests/boot_lines_neutrality.rs` reads the boot's lines through the
# subscriber.
busbar-export-otlp-plugin = { workspace = true }
tracing-subscriber = { workspace = true }
# What that test and `tests/export_otlp_delivers_spans.rs` (the shipped binary posting to a local
# collector) receive is decoded with the OpenTelemetry project's own generated types, and re-encoded
# to the same bytes: the proto's publisher, not the sink's encoder, says it is an OTLP request.
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
# tests/cli_validate.rs builds signed plugin tarball fixtures.
hex = { workspace = true }
# The contract's `test-seal` (`busbar_contract::plugin::TestKernelSeal`, the one blessed fixture
# implementor of the SEALED `KernelSeal` trait, #65) for the root's tests — dev-only and
# feature-gated, so it is absent from every release build. Its user was tests/ws_composed_battery.rs,
# the `ws` wire composed over `http`; composition left with ARCHITECT ruling Q128 U7 (no transport
# names another), and the upgrade's cells return with the http detach -> ws adopt battery
